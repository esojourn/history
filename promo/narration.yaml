# 功能介绍短视频：分镜旁白。每个镜头一段旁白，lines 是屏幕上分行显示的字幕（合起来就是 text）。
# 镜头时长 = 这段旁白的实际时长 + pad 秒（留给画面喘口气）。改了文字要重新跑 tts.py。
# 史实只取站内已有内容，不另加说法（见 docs/content-guide.md）。
shots:
  - id: s1-hook
    pad: 0.6
    lines:
      - 读历史最头疼什么？
      - 朝代记不住，中外对不上。
  - id: s2-zoom
    pad: 0.5
    lines:
      - 每个文明一条泳道，横着就是时间。
      - 滚轮一推——
      - 从六千年，直接放大到一个人的一生！
  - id: s3-person
    pad: 0.6
    lines:
      - 点一下刘秀，生平马上弹出来；
      - 他的哥哥、儿子、部将、死对头，
      - 全都连成了线。
  - id: s4-parallel
    pad: 0.7
    lines:
      - 再往后看：唐太宗开创贞观之治的那几年，
      - 穆罕默德正带领伊斯兰教统一阿拉伯半岛——
      - 原来是同一代人！
  - id: s5-event
    pad: 0.5
    lines:
      - 每件大事有来龙去脉，比如安史之乱；
      - 每个人有年表、足迹，
      - 还能看到同时代世界各地都有谁。
  - id: s6-search
    pad: 0.5
    lines:
      - 想找谁，一搜就到。
      - 每条内容都写明出处，
      - 查没查证，照实告诉你。
  - id: s7-end
    pad: 2.0
    lines:
      - 历史长河，电脑手机都能逛。
      - 扫码就来看看！
