# 手机版改进演示：每段一句旁白。lines 是屏幕上的字幕（第一行大字、第二行小字），合起来就是念的内容；
# say 写了就念 say（字幕里有不该念的符号时用）。改了文字要重新配音：
#   python promo/tts.py --engine volc --yaml mobile-narration.yaml --out out/mdemo/voice
# 段落时长 = 动作和旁白取较长的一个，再加 pad 秒。
shots:
  - id: m1-whole
    pad: 0.3
    lines: [手机版改了十几个版本, 操作顺手多了]
    say: 手机版前后改了十几个版本，操作顺手多了。
  - id: m2-cross
    pad: 0.3
    lines: [各国并排，左右一划, 同一年代，跨国家对照着看]
    say: 各国并排成一条条长河，左右一划，同一年代的各国就能对照着看。
  - id: m3-focus
    pad: 0.5
    lines: [点一个人，相关人物聚到同一屏, 忽必烈：蒙古的父兄、欧洲的马可·波罗、日本的北条时宗]
    say: 点一个人，比如忽必烈，和他有关的十六个人马上聚到同一屏：蒙古的父亲和兄弟，欧洲来的马可·波罗，日本的北条时宗。
  - id: m4-glide
    pad: 0.3
    lines: [拖动、甩一下，顺滑地滑过去, 连着划也不卡]
  - id: m5-cluster
    pad: 0.2
    lines: [大事挤在一起时, 合成带数字的圆点]
  - id: m6-list
    pad: 0.3
    lines: [点开是清单, 点进一件，“返回”又回到清单]
    say: 点开是清单。点进一件，返回，又回到清单。
  - id: m7-band
    pad: 0.3
    lines: [点“全貌”飞回全图, 点朝代色块，直接放大到那一段]
    say: 点全貌，飞回全图；点朝代色块，直接放大到那一段。
  # 结尾这段整屏是结尾卡（二维码、网址），不压字幕；念的话和卡上的字对得上
  - id: m8-end
    pad: 1.8
    lines: [历史长河, 电脑手机都能看，扫码就来看看！]
    say: 历史长河，电脑手机都能看，扫码就来看看！
