# 《峡谷之外》兰陵王第二篇（《兰陵王：历史中的阳光大男孩》）的旁白。say 与 scripts.md 第四篇“旁白”一栏逐字一致
# （定稿，不要在这里改字；lanling2.mjs 开头会对照 scripts.md 检查，对不上就不录）。一行一段，没有拆。
# 第一屏标题、结尾小字“只显示，不念”，不在这里。
# 字幕由 lanling2.mjs 按标点自动断行。pad 是这一段念完后多停的秒数。改了要重新配音：
#   python promo/tts.py --engine volc --speed 1.25 --yaml heroes/lanling2.yaml --out out/heroes/004-lanling2/voice
shots:
  - id: n01
    pad: 0.25
    say: 峡谷里，玩家管兰陵王叫“阳光大男孩”。这是反话：他躲在暗处，专挑脆皮下手。
  - id: n02
    pad: 0.3
    say: 史书里的高长恭，不全是阳光，也不全是阴暗。
  - id: n03
    pad: 0.25
    say: 先说好的一面。他带兵时事事亲自过问。得了好吃的，哪怕一个瓜、几个果子，也要分给将士一起吃。
  - id: n04
    pad: 0.35
    say: 有一次入朝，随从全跑光了，只剩一个人跟着。他回来以后，一个也没责罚。
  - id: n05
    pad: 0.25
    say: 再说不好的一面。史书说他“颇受财货”，收了不少钱财。部下尉相愿当面质问他：“何得如此贪残？”怎么能这样贪婪凶狠？
  - id: n06
    pad: 0.25
    say: 他在瀛州时，部下阳士深上书揭发他贪赃，他因此丢了官。
  - id: n07
    pad: 0.25
    say: 后来他出兵攻打定阳，阳士深正好在他军中，怕他报复。
  - id: n08
    pad: 0.25
    say: 他说：“吾本无此意。”我本来就没这个意思。随后他找了阳士深一个小过错，打了二十杖。
  - id: n09
    pad: 0.25
    say: 史书说，这么做是为了“安之”，让阳士深安心。
  - id: n10
    pad: 0.35
    say: 后人的理解是：一点不罚，阳士深会一直提心吊胆，不知道哪天报复会来。现在为一件小事挨过罚，这件事就算了结了，他也就不用再怕了。
  - id: n11
    pad: 0.3
    say: 这一仗主帅段韶病倒，是他接过了全军。
  - id: n12
    pad: 1.4
    say: 这些贪财的记载，都在他邙山立下大功之后。部下问他：是不是怕威名太大招来猜忌，才故意弄脏自己的名声？他答：“然。”是的。
  - id: n13
    pad: 2.6
    say: 游戏里，“阳光大男孩”是句反话。史书里的他，有宽厚的一面，也有贪财的名声。历史长河，扫码来看。
