# 《峡谷之外》韩信“多多益善”一篇（《多多益善：兵越多，越难带》）的旁白。say 与 scripts.md 第七篇“旁白”一栏逐字一致
# （定稿，不要在这里改字；hanxin-duoduo.mjs 开头会对照 scripts.md 检查，对不上就不录）。一行一段，没有拆。
# 第一屏标题、结尾小字“只显示，不念”，不在这里。
# 字幕由 hanxin-duoduo.mjs 按标点自动断行。pad 是这一段念完后多停的秒数。改了要重新配音：
#   python promo/tts.py --engine volc --speed 1.25 --yaml heroes/hanxin-duoduo.yaml --out out/heroes/007-hanxin-duoduo/voice

# 读音提示：只改送给配音工具的字，不改旁白和字幕（tts.py 念之前替换）。
# “能将十万”的“将”是统率的意思，读 jiàng；配音工具多半会读成 jiāng，所以换成同音的“匠”送过去。
# （“将三十万”只在原文卡上，旁白念的是“他带三十万人”，不用提示。）
pron:
  能将十万: 能匠十万

shots:
  - id: n01
    pad: 0.25
    say: 峡谷里的韩信是刺客，一杆枪，独来独往。历史上，他留下的成语却是“多多益善”。
  - id: n02
    pad: 0.35
    say: 刘邦问他：我能带多少兵？韩信说：“陛下不过能将十万。”那你呢？“臣多多而益善耳。”我呀，越多越好。
  - id: n03
    pad: 0.3
    say: 兵越多越好，真有这么容易？当年明月在《明朝那些事儿》里专门讲过这件事。
  - id: n04
    pad: 0.3
    say: 他说，两个人打架，输赢全凭自己的本事。带兵就不一样了。
  - id: n05
    pad: 0.35
    say: 十万人，就有十万个脑子：命令要传得到、听得懂；每天要吃饭、要宿营；还要算路程、天气、地形，提防士气低落、有人哗变。
  - id: n06
    pad: 0.35
    say: 他说，人数多十倍，麻烦可能多一百倍。韩信之后一千多年，真能做到多多益善的，“不会超过十五个人”。
  - id: n07
    pad: 0.4
    say: 按他的说法，多多益善比的不是力气，是统筹：把几十万人，指挥得像一个人。
  - id: n08
    pad: 0.3
    say: 韩信做到过。垓下决战，《史记》记载，他带三十万人，正面迎战项羽。
  - id: n09
    pad: 0.35
    say: 连刘邦都承认：“连百万之军，战必胜，攻必取，吾不如韩信。”统率百万大军、战无不胜，我比不上韩信。
  - id: n10
    pad: 1.2
    say: 真实历史里的韩信，不是独来独往的刺客，是统率千军万马的大将。
  - id: n11
    pad: 2.6
    say: 他和刘邦、项羽是怎么连在一起的？历史长河，扫码来看。
