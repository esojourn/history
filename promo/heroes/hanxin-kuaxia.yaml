# 《峡谷之外》韩信“胯下之辱”一篇（《韩信：忍过胯下之辱的将军》）的旁白。say 与 scripts.md 第六篇“旁白”一栏逐字一致
# （定稿，不要在这里改字；hanxin-kuaxia.mjs 开头会对照 scripts.md 检查，对不上就不录）。一行一段，没有拆。
# 第一屏标题、结尾小字“只显示，不念”，不在这里。
# 字幕由 hanxin-kuaxia.mjs 按标点自动断行。pad 是这一段念完后多停的秒数。改了要重新配音：
#   python promo/tts.py --engine volc --speed 1.25 --yaml heroes/hanxin-kuaxia.yaml --out out/heroes/006-hanxin-kuaxia/voice

# 读音提示：只改送给配音工具的字，不改旁白和字幕（tts.py 念之前替换）。
# “龙且”是人名，读 lóng jū；配音工具不认识这个读法，多半会读成 qiě，所以换成同音的“居”送过去。
pron:
  龙且: 龙居

shots:
  - id: n01
    pad: 0.25
    say: 峡谷里的韩信，玩家都说他最会“偷家”。历史上，他年轻时却当着满街的人，从别人胯下爬了过去。
  - id: n02
    pad: 0.3
    say: 那时他是淮阴的穷小子，常到别人家蹭饭，很多人都嫌他。
  - id: n03
    pad: 0.3
    say: 在一个亭长家蹭了几个月，亭长的妻子一大早就把饭做好吃完；等他来了，什么也不给。
  - id: n04
    pad: 0.35
    say: 一位在水边漂洗丝絮的大娘见他饿，给他饭吃，一连几十天。他说将来一定重重报答。大娘却生气了：我是可怜你，哪是图你报答！
  - id: n05
    pad: 0.3
    say: 淮阴一个年轻屠户当众羞辱他：你不怕死，就拿刀刺我；怕死，就从我裤裆底下钻过去。
  - id: n06
    pad: 0.4
    say: 韩信盯着他看了好一会儿，俯下身，从他胯下爬了过去。满街的人都笑他胆小。
  - id: n07
    pad: 0.3
    say: 几年后，他成了刘邦的大将。《汉书》记载，楚将龙且说：韩信钻过别人胯下，没什么胆量，好对付。
  - id: n08
    pad: 0.35
    say: 两军隔着潍水，韩信假装败退。龙且大喜：“固知信怯也。”我就知道他胆小！追过河去。韩信扒开上游堵水的沙袋，大水冲下，龙且兵败被杀。
  - id: n09
    pad: 0.3
    say: 后来韩信当了楚王。给他饭吃的大娘，赏千金；亭长，只给一百钱，说他做好事做不到底。
  - id: n10
    pad: 0.3
    say: 那个让他钻胯下的年轻人，他让人家做了楚国的中尉。
  - id: n11
    pad: 1.2
    say: 他说：这是条好汉。他羞辱我的时候，我难道杀不了他？“杀之无名，故忍而就于此。”杀他没有正当的理由，所以我忍了，才有今天。
  - id: n12
    pad: 2.6
    say: 满街的人笑他胆小，龙且也信了。我忍了，才有今天。历史长河，扫码来看。
