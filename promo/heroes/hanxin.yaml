# 《峡谷之外》韩信一集（《悲情韩信：追他回来的人，送他去死》）的旁白。say 与 scripts.md 第一篇“旁白”一栏逐字一致
# （定稿，不要在这里改字；hanxin.mjs 开头会对照 scripts.md 检查，对不上就不录）。
# 第 5 行（配地图的那一行）在句号处拆成两段配音，只是为了画面好对时间，字没有动。
# 字幕由 hanxin.mjs 按标点自动断行。pad 是这一段念完后多停的秒数。改了要重新配音：
#   python promo/tts.py --engine volc --speed 1.25 --yaml heroes/hanxin.yaml --out out/heroes/001-hanxin/voice
shots:
  - id: n01
    pad: 0.25
    say: 王者峡谷里，韩信的大招叫“国士无双”。这四个字，是两千多年前一位丞相说的。
  - id: n02
    pad: 0.25
    say: 历史上的韩信不是刺客，是统帅，汉朝开国的大将军。
  - id: n03
    pad: 0.25
    say: 他起初在项羽手下，献计不被采用；转投刘邦，还是没人看重，他干脆跑了。
  - id: n04
    pad: 0.25
    say: 丞相萧何来不及禀报，亲自去追。追回来对刘邦说：这个人，“国士无双”，全国找不出第二个。刘邦这才拜他为大将。
  - id: n05a
    pad: 0.25
    say: 按他的计策，汉军杀回关中。
  - id: n05b
    pad: 0.25
    say: 他又领兵俘虏魏王，背水列阵大破赵军，袭取齐国，最后会兵垓下，项羽败亡。
  - id: n06
    pad: 0.25
    say: 可仗一打完，刘邦就夺了他的兵权，把他从齐王改封楚王。第二年，有人告他谋反，他被抓起来，赦免后降为淮阴侯。
  - id: n07
    pad: 0.25
    say: 公元前 196 年春，刘邦带兵在外平叛。有人向吕后告发：韩信要在京城起兵，接应叛军。
  - id: n08
    pad: 0.25
    say: 吕后想召他进宫，又怕他不来，就和萧何商量。他们派人假装从前线回来，说叛军首领已死，群臣都要进宫道贺。
  - id: n09
    pad: 0.25
    say: 韩信一直称病在家。萧何骗他说：“虽疾，强入贺。”你虽然病着，也勉强去道个贺吧。
  - id: n10
    pad: 0.25
    say: 韩信一进宫，吕后就叫武士把他绑了，在长乐宫挂钟的屋子里斩首，又灭了他三族。
  - id: n11
    pad: 0.25
    say: 刘邦平叛回来，听说韩信死了。《史记》只写了五个字：且喜且怜之。又高兴，又可怜他。
  - id: n12
    pad: 1.6
    say: 说他“国士无双”的是萧何，骗他进宫的，也是萧何。南宋洪迈的笔记里，记着一句俗话：成也萧何，败也萧何。
  - id: n13
    pad: 2.6
    say: 韩信、刘邦、吕后、萧何是怎么连在一起的？历史长河，扫码来看。
