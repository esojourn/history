# 《峡谷之外》番外篇（《番外 · 兰陵王入阵曲：一首军歌的千年漂流》）的旁白。say 与 scripts.md 第五篇“旁白”一栏逐字一致
# （定稿，不要在这里改字；lanling-song.mjs 开头会对照 scripts.md 检查，对不上就不录）。一行一段，没有拆。
# 第一屏标题、“（乐曲）”那一行、结尾小字“只显示，不念”，不在这里。
# n10 后面的 pad 留给约 10 秒的《陵王》乐曲（乐曲放在 n10 念完之后，长度由 lanling-song.mjs 里的 RYOO_LEN 定）。
# 字幕由 lanling-song.mjs 按标点自动断行。pad 是这一段念完后多停的秒数。改了要重新配音：
#   python promo/tts.py --engine volc --speed 1.25 --yaml heroes/lanling-song.yaml --out out/heroes/005-lanling-song/voice
shots:
  - id: n01
    pad: 0.25
    say: 峡谷里的兰陵王戴着面具。历史上，为他唱的一首歌，走得比面具还远。
  - id: n02
    pad: 0.3
    say: 564 年冬邙山之战，他带五百骑兵杀到金墉城下。将士们为他作歌，就是《兰陵王入阵曲》。
  - id: n03
    pad: 0.3
    say: 到了唐代，它成了戴面具演的歌舞戏《大面》，学他指挥、刺杀的样子。
  - id: n04
    pad: 0.3
    say: 唐代的碑文记着：武则天设宴，她五岁的孙子上场，演的就是《兰陵王》。
  - id: n05
    pad: 0.3
    say: 《旧唐书》记载，唐玄宗认为这类戏“非正声”，就在宫里设了教坊来安置它们。
  - id: n06
    pad: 0.35
    say: 为什么？按旧规矩，雅乐、俗乐都归太常寺管。太常寺是掌管朝廷礼乐的衙门，玄宗精通音律，认为它不该管歌舞杂戏，就另设教坊，专教俗乐。
  - id: n07
    pad: 0.4
    say: 它后来怎么在中国失传，史书没有记载。
  - id: n08
    pad: 0.3
    say: 可它在日本留了下来，叫《陵王》。一说公元 736 年随渡海的僧人传去，一说是后来日本乐人从唐朝学回去的。
  - id: n09
    pad: 0.3
    say: 舞者戴金色龙头面具，下巴会晃，眼珠会动。日本的神社至今还在跳。
  - id: n10
    pad: 11.6
    say: 听一段日本流传下来的《陵王》。北齐当年是不是这个调子，已经无从查考。
  - id: n11
    pad: 0.35
    say: 日本 1233 年的乐书《教训抄》还记了一个传说：一位王子在父王陵前哀叹战事不利，落下的太阳竟又升起，于是大胜。
  - id: n12
    pad: 0.3
    say: 据中文网络资料，1992 年，奈良的雅乐团“南都乐所”来到河北磁县，在兰陵王墓前演了这支舞。
  - id: n13
    pad: 0.6
    say: 一千四百多年后，这首歌回到了它主人的身边。
  - id: n14
    pad: 2.6
    say: 他和这首歌的故事，历史长河，扫码来看。
