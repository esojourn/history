# 《峡谷之外》兰陵王一集的旁白。say 与 scripts.md 第二篇“旁白”一栏逐字一致（定稿，不要在这里改字；
# lanling.mjs 开头会对照 scripts.md 检查，对不上就不录）。第 4 行拆成两段，是为了知道地图该放多久。
# 字幕由 lanling.mjs 按标点自动断行。pad 是这一段念完后多停的秒数。改了要重新配音：
#   python promo/tts.py --engine volc --speed 1.25 --yaml heroes/lanling.yaml --out out/heroes/lanling/voice
shots:
  - id: n01
    pad: 0.25
    say: 峡谷里的兰陵王，戴着面具，隐身潜行。
  - id: n02
    pad: 0.25
    say: 历史上他叫高长恭，北齐的宗室。面具这件事，还真有来历。
  - id: n03
    pad: 0.25
    say: 史书说他“貌柔心壮”。唐代的《教坊记》说，他嫌自己的相貌镇不住敌人，就刻了木头面具，上阵时戴上。
  - id: n04a
    pad: 0.25
    say: 公元 564 年冬，北周大军围困洛阳。
  - id: n04b
    pad: 0.25
    say: 他带五百骑兵杀进敌阵，一路冲到金墉城下。
  - id: n05
    pad: 0.25
    say: 城上守军认不出他。他摘下头盔，露出脸，城上才派弩手下来接应。齐军大胜。
  - id: n06
    pad: 0.25
    say: 将士们为他作歌，就是《兰陵王入阵曲》。
  - id: n07
    pad: 0.25
    say: 后来的皇帝，也就是他的堂弟，对他说：冲得太深，万一失利，后悔都来不及。
  - id: n08
    pad: 0.25
    say: 他答：“家事亲切，不觉遂然。”自家的事，上了心，不知不觉就冲进去了。
  - id: n09
    pad: 0.25
    say: 皇帝听了，却起了疑。史书只记了一句：“帝嫌其称家事，遂忌之。”
  - id: n10
    pad: 0.25
    say: 后人的理解是：国家是皇帝的。一个手握兵权、刚立了大功的堂兄，把国事说成“自家的事”，听起来就像这江山也有他一份。
  - id: n11
    pad: 0.25
    say: 他察觉到皇帝在防他，怕的是自己威名太盛。于是故意收受财物，把名声弄脏：名声坏了，威望低了，皇帝也许就放心了。
  - id: n12
    pad: 0.25
    say: 部下点破他：朝廷真要猜忌你，这反倒成了治罪的把柄。劝他称病回家。他想退，却没能退成。
  - id: n13
    pad: 0.25
    say: 573 年，皇帝派人送来毒药。他喝了。临死那天，把别人欠他的债券全部烧掉。
  - id: n14
    pad: 2.4
    say: 四年后，北齐亡国。
  - id: n15
    pad: 2.6
    say: 他和后主高纬、斛律光、宇文护是怎么连在一起的？历史长河，扫码来看。
