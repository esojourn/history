name: 圣经与教会历史
periods:
  primeval:
    name: 太初
    note: 创世、洪水、巴别（只排先后，不标年份）
  patriarchs:
    name: 族长时期
  egypt-sojourn:
    name: 寄居埃及
  exodus-judges:
    name: 出埃及与士师
  united-monarchy:
    name: 联合王国
  divided-monarchy:
    name: 南北分国
  exile:
    name: 被掳
  second-temple:
    name: 第二圣殿时期
  new-testament:
    name: 新约时代
  early-church:
    name: 早期教会
    note: 逼迫中的教会（至 313 年米兰诏谕）
  council-era:
    name: 大公会议时期
  missions-era:
    name: 蛮族归信
  papal-alliance:
    name: 教皇与帝国
    note: 丕平献土至东西教会分裂（754—1054 年）
  papal-zenith:
    name: 教皇权势鼎盛
    note: 授职权之争、十字军、英诺森三世（1054—1294 年）
  pre-reformation:
    name: 改教前夜
    note: 阿维农、大分裂、威克里夫与胡斯（1294—1517 年）
  reformation:
    name: 宗教改革
    note: 路德、慈运理、加尔文与各国改教（1517—1555 年）
  confessional-wars:
    name: 再次归正
    note: 特兰托会议、宗教战争，至威斯特伐利亚和约（1555—1648 年）
  dissenters:
    name: 清教徒与不同意者
    note: 英国共和、王政复辟、废除南特诏谕，至光荣革命与信仰容忍法案（1648—1689 年）
  pietism-revival:
    name: 敬虔与复兴
    note: 敬虔主义、莫拉维弟兄会、卫斯理与循道派（1689—1791 年）
  modern-church:
    name: 近代教会
    note: 差传运动、牛津运动、各国改革宗的分合，至凯波尔（1791—1920 年）
  ecumenical-age:
    name: 合一与持守
    note: 基要派与现代派之争、各宗派联合、普世基督教协会，至第五次大会（1920—1975 年）
