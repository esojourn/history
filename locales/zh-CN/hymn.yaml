# 正文里提到的诗歌，凡在“敬拜赞美”诗歌站（https://dingxuan.info/hymn）找得到的，登记在这里。
# 网站会把正文里出现的《诗歌名》自动变成链接，在新窗口打开诗歌站上的那一首。
#
# 写法：  正文书名号里的写法: 诗歌站编号（诗歌站上的歌名，只作备注）
#   - 左边要和正文里《》中的文字一字不差，标点也要一样；
#   - 编号见诗歌站网址里 n= 后面的部分，如 index.php?n=01-200 → 01-200；
#   - 登记前要打开那一页，核对歌词确实是同一首（中文译名常常不同）。
#
# 正文里提到、诗歌站暂时没有的（2026-11 核对）：
#   《天使歌唱在高天》（Hark! The Herald Angels Sing，诗歌站 05-073“圣诞佳音歌”是另一首）
#   《耶稣，我心爱的良人》（Jesus, Lover of My Soul）
#   《至圣之首今受创伤》（O Sacred Head, Now Wounded）

"哦，愿我有千万舌": "01-200"   # 愿我前来赞美救主（O for a Thousand Tongues to Sing）
"奇妙十架": "01-122"           # 每逢思念奇妙十架（When I Survey the Wondrous Cross）
"普天同庆": "05-075"           # 普世欢腾歌（Joy to the World）
