name: 后突厥复国
summary: 682 年东突厥贵族骨咄禄起兵脱离唐朝，重建突厥汗国，史称后突厥。
body: |-
  贞观四年（公元 630 年）东突厥灭亡后，唐朝把大批突厥部众安置在北方边境，设立都督府，以突厥贵族为都督，归单于都护府管辖。五十年后，突厥部众对唐朝的征调日益不满，调露元年（679 年）起，突厥贵族阿史德温傅、阿史那伏念等先后起兵，都被唐将裴行俭平定。

  永淳元年（682 年），东突厥王族的后裔阿史那骨咄禄聚集部众，据黑沙城起兵，重建突厥汗国，自称颉跌利施可汗，以阿史德氏的暾欲谷为谋主，不断侵扰唐朝的北方边境。据后来在蒙古高原发现的突厥文碑铭，突厥人自述曾臣属唐朝五十年，复国是要重振祖先的事业。

  骨咄禄死后，他的弟弟默啜可汗继位，在武则天时势力达到极盛，多次大规模侵掠河北（另见“默啜可汗”条）。默啜死后，骨咄禄的儿子毗伽可汗与唐朝和好互市。毗伽可汗死后汗国内乱，天宝三载（744 年）前后，回纥联合拔悉密、葛逻禄攻灭后突厥，取代它成为漠北的霸主。
sources: []
recalled:
  - 《旧唐书·突厥传》
  - 《新唐书·突厥传》
  - 暾欲谷碑
