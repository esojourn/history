name: 驱逐塔克文与共和国建立
summary: 传统上定在公元前 509 年：罗马人驱逐国王塔克文，改由两名执政官治国。
body: |-
  传统上定在公元前 509 年。据李维，国王“高傲者”塔克文靠武力夺位，统治专横。这一年他率军围攻阿尔代亚，儿子塞克斯图斯强暴了贵族科拉提努斯的妻子卢克蕾提亚，她向父亲和丈夫说明经过后自尽。国王的外甥卢基乌斯·尤尼乌斯·布鲁图当众起誓驱逐国王一家，在广场上向人民陈说，人民决议废黜国王并将其全家放逐。塔克文赶回罗马，城门已对他关闭，军队也倒向起事者。

  此后不再设国王，改由百人队大会每年选出两名权力相等的长官，后来称为执政官，首任是布鲁图和科拉提努斯。一人的决定可以被另一人否决，任期只有一年；国王的宗教职能交给一名没有政治权力的“祭祀王”。据李维，人民起誓永不容许任何人在罗马称王，“王”这个词从此在罗马政治中成为罪名。遇到紧急情况，可以任命一名独裁官，任期不超过六个月。

  塔克文几次图谋复位。先是城中一批贵族青年密谋迎他回来，布鲁图的两个儿子参与其中，被父亲判处死刑。接着他借维爱和塔尔奎尼的兵力来攻，布鲁图阵亡。然后克鲁西乌姆国王波尔塞纳围攻罗马。最后拉丁各城支持他，在雷吉鲁斯湖被罗马击败。塔克文死于库迈。

  这些记载成书于几百年后，细节不可尽信。波利比乌斯说他见过罗马与迦太基在共和国第一年订立的条约；执政官名录也从这一年开始，最初几十年的名单是否可靠有争议。有学者认为，王政的结束与波尔塞纳占领罗马有关，而不是一次内部起事；也有人认为两名执政官的制度到前 4 世纪才定型。无论如何，前 6 世纪末伊特鲁里亚人在拉丁姆的势力衰退，罗马由贵族掌权，开始了近五百年的共和时期。
sources: []
