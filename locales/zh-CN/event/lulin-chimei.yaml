name: 绿林赤眉起义
summary: 王莽末年荆州的绿林军和青徐的赤眉军相继起事，绿林军灭新朝，赤眉军又灭更始政权。
body: |-
  王莽在位的后期，法令繁苛，赋役沉重，又连年发生水旱蝗灾。始建国三年（公元 11 年）黄河在魏郡决口，泛滥数郡，朝廷没有堵塞。

  据《后汉书·刘玄刘盆子列传》，天凤四年（17 年）荆州一带饥荒，饥民到野泽中挖荸荠充饥，为此争斗。新市人王匡、王凤出面调解，被推为首领，聚集了几百人，后来藏入绿林山中，几个月间发展到七八千人，称为“绿林军”。地皇二年（21 年）他们击败了前来镇压的荆州官军。次年山中发生瘟疫，死者近半，各部分散出山，一支向南称“下江兵”，一支向北称“新市兵”，后来平林人陈牧等起兵响应，称“平林兵”。南阳的汉朝宗室刘縯、刘秀兄弟也在这时起兵，与他们联合。地皇四年（23 年）二月，各部首领拥立宗室刘玄为帝，年号更始。六月，刘秀等在昆阳击溃王莽的主力。同年绿林军攻入长安，王莽被杀。

  东方的起事几乎同时发生。天凤四年，琅邪海曲的吕母为替被县官处死的儿子报仇，散尽家财聚众攻杀县宰。次年琅邪人樊崇在莒起兵，转战泰山一带，部众很快达到数万。地皇三年（22 年）他们在成昌大败王莽的十余万大军。为了在交战时与官军区别，他们把眉毛染成红色，从此称“赤眉”。

  更始帝入主长安后，政事混乱，将领各自为政。赤眉的首领曾到洛阳归附，没有得到安置，又返回军中。更始二年（24 年）冬，赤眉军数十万人分两路西进；次年六月，他们立十五岁的宗室少年刘盆子为帝，九月攻入长安，更始帝投降后被杀。

  赤眉军在长安没有建立起有效的统治。关中饥荒，他们四出抢掠，发掘西汉的皇陵，与当地豪强和刘秀派来的邓禹军反复交战，人数大减，最后在建武二年（26 年）底向东撤退。此时刘秀已在河北称帝并定都洛阳，他预先派大军在宜阳一带堵截。建武三年（27 年）正月，疲惫饥饿的赤眉军十余万人全部投降，刘盆子交出了得自更始帝的传国玺。
sources: []
recalled:
  - 《后汉书·刘玄刘盆子列传》
  - 《后汉书·光武帝纪上》
  - 《汉书·王莽传下》
  - 《资治通鉴》卷三十八至四十一
