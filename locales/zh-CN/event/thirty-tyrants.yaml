name: 三十僭主与民主的恢复
summary: 公元前 404 年至前 403 年三十人寡头统治雅典八个月，被流亡者推翻。
body: |-
  公元前 404 年夏，在吕山德到场施压之下，雅典公民大会通过决议，选出三十人“编订祖传的法律”，在新法制定以前由他们掌权。三十人指派了五百人议事会和各级官员，在比雷埃夫斯另设十人管理。他们先处死了一批以诬告为业的人，多数人并不反对。随后他们请吕山德派来七百名斯巴达驻军，驻在卫城上，由雅典人供养，接着便开始捕杀政敌和有钱人，包括侨居的外邦富商，没收其财产。演说家吕西阿斯一家是叙拉古移民的后代，他的兄弟被处死，他本人逃脱，后来在一篇演说里详述了经过。据《雅典政制》，被杀的不少于一千五百人。“三十僭主”是后人给他们的称呼。

  三十人中的塞拉门尼斯反对滥杀，主张让更多的人参政。克里提亚斯等人于是列出一份三千人的名单，只有名单上的人才有权受审，其余的人被解除武装，可以由三十人直接处死。塞拉门尼斯继续反对，被克里提亚斯当场除名，处以饮毒芹汁。苏格拉底和另外四人曾被命令去逮捕萨拉米斯人勒翁，那四人去了，苏格拉底回了家；据柏拉图《申辩篇》，他说若不是这个政权很快垮台，他也许已为此送命。

  大批雅典人逃到底比斯、麦加拉等地，这些城邦不顾斯巴达的禁令收留了他们。前 404 年冬，色拉西布洛斯带七十人从底比斯出发，占据阿提卡边境山上的菲莱。三十人两次进攻都失败了。前 403 年春，色拉西布洛斯带一千来人进入比雷埃夫斯，在穆尼基亚山的坡道上击败三十人的军队，克里提亚斯战死。城里的三千人废黜三十人，另选十人执政，三十人退到厄琉息斯，此前他们已把那里的居民杀光以备退路。

  吕山德筹款募兵来援，要封锁比雷埃夫斯。但斯巴达国王保萨尼阿斯取得多数监察官的支持，亲自率军前来，在一次小规模交战后促成双方谈判。前 403 年秋达成和解：除三十人及其少数同僚外，对过去的事一律不得追究；不愿留在雅典的人可以迁居厄琉息斯。流亡者列队登上卫城向雅典娜献祭，民主政治恢复。两年后雅典人又收回了厄琉息斯。《雅典政制》称赞雅典人对待过去灾难的方式在公私两方面都最为高尚，并举例说，有人回城后开始追究旧怨，被议事会不经审判处死，此后再没有人违反誓言。
sources: []
