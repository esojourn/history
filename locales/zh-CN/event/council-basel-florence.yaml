name: 巴塞尔会议与佛罗伦萨会议
aliases:
  - 巴塞尔—费拉拉—佛罗伦萨会议
summary: 与胡斯派达成协议的大公会议；教皇另在佛罗伦萨与希腊教会签订合一文件。
body: |-
  按康斯坦茨会议定期开会的规定，新的大公会议 1431 年在巴塞尔开幕。这一年讨伐胡斯派的十字军又一次溃败。《历史的轨迹》第二十章说，巴塞尔会议的目的之一是恢复波希米亚教会的合一，因为用恐怖杀戮仍然无法平息胡斯派运动。会议请胡斯派的代表到巴塞尔公开辩论，1436 年达成协议：波希米亚的信徒领圣餐时可以饼杯同领，并得到某些讲道的自由。该书说，这是会议以平等的地位与被定为异端的人交涉。

  教皇尤金四世一开始就想解散会议，会议援引康斯坦茨的教令拒不服从，教皇只得让步。会议接着通过了一批限制教廷收费的改革条款。1437 年双方为在哪里与希腊教会会谈而决裂：教皇把会议迁到意大利的费拉拉，少数人跟他走了；留在巴塞尔的多数人在 1439 年宣布废黜教皇，另选了一位，但各国多不承认，1449 年自行解散。

  东罗马皇帝和君士坦丁堡的主教长带着七百来人，1438 年到了费拉拉，次年会议迁往佛罗伦萨。双方就圣灵“和子”而出、炼狱、无酵饼和教皇的首席地位争论了一年多。1439 年 7 月 6 日签署合一文件，希腊代表中只有以弗所主教马可等少数人拒绝签字。

  《历史的轨迹》把这件事记在巴塞尔会议名下，说会议与东方教会的代表签订了同意书，东方教会接受西方的教义，以换取西方援助他们抵挡土耳其人；消息传回东方，引起强烈反对，代表们被骂为异端。签字的地点是佛罗伦萨，主持的是教皇一方。该书又说“十年之后”土耳其人攻取君士坦丁堡；从 1439 年到 1453 年是十四年。西方的援军 1444 年在瓦尔纳战败。

  这一轮较量的结果是教皇胜过了会议，“大公会议高于教皇”的主张从此衰落，教廷的改革也搁置下来。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 1436 年《伊赫拉瓦协定》（《巴塞尔协定》）
  - 1439 年 7 月 6 日佛罗伦萨会议合一教令《诸天欢乐》
  - 西罗普洛斯《回忆录》
  - 塞哥维亚的约翰《巴塞尔会议史》
