name: 《唐律疏议》颁行
summary: 653 年颁行长孙无忌等撰写的律疏，与律文合称《唐律疏议》。
body: |-
  唐朝建立后多次修订法律：武德七年（公元 624 年）颁布《武德律》，基本沿用隋朝的《开皇律》；贞观十一年（637 年）房玄龄、长孙无忌等修成《贞观律》，减少了死刑和流刑的条目；永徽二年（651 年）高宗又颁布《永徽律》。

  为了统一对律文的理解，便于科举明法科考试和官员审案，高宗命长孙无忌、李勣、于志宁等人逐条为律文撰写“疏”，即官方的解释，于永徽四年（653 年）颁行，与律文具有同等的法律效力。律文和疏合在一起，原名《律疏》，后世称为《唐律疏议》。

  《唐律疏议》共三十卷、十二篇、五百零二条，依次为名例、卫禁、职制、户婚、厩库、擅兴、贼盗、斗讼、诈伪、杂律、捕亡、断狱。名例篇规定了刑罚和适用原则：刑罚分为笞、杖、徒、流、死五等；谋反、谋大逆、谋叛、恶逆、不道、大不敬、不孝、不睦、不义、内乱十种重罪称为“十恶”，不在赦免之列；皇亲、功臣、高官等八类人犯罪可以经议请减免，称为“八议”。它把儒家的礼制和伦理融入法律，例如亲属之间可以相互隐匿犯罪，子孙告发祖父母、父母要治罪。

  这部法典是中国现存最早、最完整的成文法典。宋朝的《宋刑统》基本照搬了它的内容，明清的法律也以它为基础。它对东亚影响也很深，日本的《大宝律令》《养老律令》、朝鲜半岛高丽王朝和越南的法律都参照了唐律。
sources: []
recalled:
  - 《唐律疏议》
  - 《旧唐书·刑法志》
  - 《新唐书·刑法志》
