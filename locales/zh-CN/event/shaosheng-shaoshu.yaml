name: 绍圣绍述
summary: 宋哲宗亲政后改元绍圣，任用章惇恢复新法，大批贬逐元祐大臣。
body: |-
  元祐八年（公元 1093 年）高太后去世，宋哲宗亲政。他对太后听政期间大臣们轻视自己早有不满，次年四月改元绍圣，意思是继承神宗的事业，称为“绍述”。他任命章惇为宰相，曾布、蔡卞等新党人物也相继回朝，免役法、保甲法、青苗法等新法陆续恢复。

  新党执政后对旧党大加报复：已经去世的司马光、吕公著被追夺赠官和谥号，章惇甚至主张掘墓劈棺，被哲宗阻止；在世的元祐大臣大批被贬到岭南，苏轼先贬惠州，后贬到海南岛的儋州，苏辙贬雷州，刘挚、范祖禹、秦观、黄庭坚等人也被远贬。哲宗还废掉了高太后为他选立的孟皇后。在西北，宋军步步修筑城寨，元符元年（1098 年）在平夏城大败西夏军，西夏被迫求和。元符三年（1100 年）哲宗去世，宋徽宗即位后一度调和新旧两党，不久又转向推崇新法（另见“元祐党籍碑”条）。
sources: []
recalled:
  - 《宋史·哲宗本纪》
  - 《宋史·奸臣传·章惇》
