name: 大洪水
summary: 神因世人的罪恶降洪水毁灭地上的活物，挪亚一家靠方舟存活。
body: |-
  据《创世记》第 6 章，人在地上多起来以后，耶和华见人在地上罪恶很大，终日所思想的尽都是恶，地上满了强暴，就后悔造人在地上，要把人和走兽、昆虫、飞鸟都从地上除灭；惟有挪亚在耶和华眼前蒙恩（6:5–13）。神吩咐挪亚用歌斐木造一只方舟，长三百肘，宽五十肘，高三十肘，里外抹上松香；又叫他带全家进去，各样活物每样两个，一公一母，洁净的畜类则每样带七公七母（6:14–21、7:2–3）。

  据《创世记》7:11，挪亚六百岁那一年的二月十七日，大渊的泉源都裂开了，天上的窗户也敞开了，四十昼夜降大雨在地上。水势浩大，天下的高山都被淹没，水比山高过十五肘；凡在旱地上有气息的生灵都死了，只留下挪亚和同在方舟里的（7:17–23）。水势浩大在地上共一百五十天（7:24）。

  此后水渐渐消退。七月十七日，方舟停在亚拉腊山上；十月初一日，山顶都现出来了（8:4–5）。挪亚先放出一只乌鸦，又三次放出鸽子：第二次鸽子衔回一片新拧下来的橄榄叶，第三次就不再回来（8:6–12）。到挪亚六百零一岁那年的正月初一日，地上的水都干了；二月二十七日，地就都干了，神吩咐挪亚全家和一切活物出方舟（8:13–19）。照经文所记的日期，他们在方舟里前后一年有余。

  挪亚出来后筑坛献祭。耶和华说，不再因人的缘故咒诅地，地还存留的时候，稼穑、寒暑、冬夏、昼夜就永不停息（8:20–22）。神与挪亚和他的后裔并一切活物立约，不再有洪水毁坏全地，以云中的虹为记号（9:8–17）。

  两河流域的古代文献里也有洪水故事，如《吉尔伽美什史诗》第十一块泥板和《阿特拉哈西斯史诗》，其中造船、带活物上船、放鸟探水等情节与《创世记》相似；二者之间是什么关系，学者看法不一。主流地质学不认为有过一次淹没全球的洪水；在承认圣经记载的人当中，也有全球性洪水和区域性洪水两种理解。
sources: []
recalled:
  - 《创世记》第 6—9 章
  - 《吉尔伽美什史诗》第十一块泥板
  - 《阿特拉哈西斯史诗》
