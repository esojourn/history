name: 营建大兴城
summary: 隋文帝在汉长安城东南营建新都大兴城，分区规划整齐，即唐朝的长安城。
body: |-
  汉代以来的长安城经过数百年战乱，城内狭小破败，宫室残旧，地下水又咸苦。开皇二年（公元 582 年）六月，隋文帝下诏在旧城东南的龙首原南麓营建新都，高颎总领其事，具体规划由宇文恺主持。次年三月，文帝迁入新都。因为杨坚在北周时封大兴郡公，新都被命名为大兴城，宫城称大兴宫。

  新城的规划整齐划一：北部正中是宫城，宫城以南是皇城，皇城内集中设置中央官署，不许百姓居住。据宋敏求《长安志》，汉代以后历朝的都城中，官署和民居混杂在宫阙之间，隋文帝认为不便，才把官署和民居分开。皇城以外的外郭城由纵横的大街分割成许多方形的坊和东、西两市，坊有坊墙和坊门，按时启闭。据考古实测，外郭城东西约九点七公里，南北约八点六公里，是当时世界上规模最大的城市之一。

  唐朝建立后，把大兴城改称长安城，沿用作都城，宫城改称太极宫，又在城东北修建了大明宫，在东部修建了兴庆宫。唐长安城的格局对后来东亚的都城有很大影响，日本的平城京、平安京都仿照它的布局营建。唐末天祐元年（904 年）朱全忠逼唐昭宗迁都洛阳，拆毁长安的宫室，此后长安再没有成为全国的都城。
sources: []
recalled:
  - 《隋书·高祖纪》
  - 《隋书·宇文恺传》
  - 宋敏求《长安志》
  - 徐松《唐两京城坊考》
