name: 阿育王遣使传法
summary: 阿育王诏令称正法已传到安条克等五位希腊君主的国土和南方诸国。
body: |-
  阿育王在第 13 号摩崖诏令中说，“正法的胜利”已在六百由旬之外取得：那里有名叫安提约迦的希腊王，更远处还有图罗摩耶、安提基尼、摩迦、阿利迦苏达罗四位国王；南方则达到朱罗、潘地亚，直至铜掌（锡兰）。诏令还说，即使在天爱的使者没有到过的地方，人们也听闻并遵行正法。第 2 号摩崖诏令另记他在安提约迦及其邻国为人和牲畜设置医疗。

  学者把这五位国王比定为塞琉古的安条克二世、埃及的托勒密二世、马其顿的安提柯二世、昔兰尼的马伽斯，以及一位亚历山大（伊庇鲁斯的亚历山大二世，一说科林斯的亚历山大）。五人同时在位的年代，是推定诏令刻于约前 256 年前后的主要依据，本条年份即取此约数。希腊、罗马方面的文献没有留下这些使者到来的记载，他们在当地做了什么也无从查考。

  锡兰的《岛史》《大史》所记是另一套传统：第三次结集之后，长老目犍连子帝须向迦湿弥罗与犍陀罗、臾那世界、金地等九个地区派出僧人，其中阿育王之子摩哂陀到锡兰，使国王天爱帝须皈依。这一传统所记的是僧团派遣传教僧，与诏令所说的国王使者并不是一回事。
sources:
