name: "奥格斯堡和约"
summary: "1555 年帝国议会承认路德派的合法地位，各邦信仰由诸侯决定，即“教随国定”。"
body: |-
  1530 年以后，信路德宗的诸侯和城市结成施马尔卡尔登同盟，皇帝查理五世忙于对法国和土耳其的战争，一再同他们休战。《历史的轨迹》第三十章说，1546 年路德死后，查理把攻击对准新教徒；那时改教运动已发展了二十五年，树苗长成了大树。皇帝起初连连得胜，1547 年在米尔贝格俘虏了萨克森选侯，占领维滕贝格，随后颁布一个偏向旧教的临时办法，强令各邦遵行。

  1552 年帮过他的萨克森公爵莫里茨倒戈，联合法国突袭，皇帝仓皇逃过阿尔卑斯山。他的弟弟斐迪南在帕绍与诸侯订约停战。查理不愿亲手承认教会分裂，把事情交给斐迪南，自己准备退位。

  1555 年 2 月帝国议会在奥格斯堡开会，9 月 25 日公布决议。主要内容是：信奉《奥格斯堡信条》的各邦与天主教各邦同享和平，互不以信仰为由动武；帝国的每个诸侯有权在两种信仰中选定一种，后人把这条原则概括为“教随国定”；不愿随从的臣民可以变卖产业迁往别处；帝国自由城市里两教并存的照旧；1552 年以前已被新教邦没收的教会产业不再追还。另有一条“教产保留”：主教、修道院长若改信路德宗，必须放弃职位和领地，新教一方没有同意，只是载入了决议。

  该书说，按这项和约，每个王侯有权选择自己的宗教，他领地内的人民则全体接受王侯所选的宗教。和约只包括路德派，改革宗、重洗派都不在内；该书指出，法国和荷兰的加尔文派因此得不到保护。个人并没有选择信仰的自由，有的只是迁走的权利。

  和约使德意志维持了六十多年的大体和平。“教产保留”的争执和加尔文派诸侯的地位都悬而未决，是 1618 年战争再起的原因。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
