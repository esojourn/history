name: "第一次大觉醒"
summary: "十八世纪三四十年代席卷北美殖民地的复兴运动，中心人物是爱德华兹和怀特菲尔德。"
body: |-
  《历史的轨迹》第四十二章说，十八世纪吹向英国、扼杀宗教生活的自然神论和理性主义，也使美洲教会进入沉睡；开拓新英格兰的是灵性坚定的清教徒，到孙辈时几乎失去了全部热诚。就在这时，殖民地的属灵情况急剧改变，各处展开一连串奋兴聚会，这就是“大觉醒”。书中说，它与英国的循道运动同时发生，都受德国敬虔主义和莫拉维弟兄会的影响，而且都集中在怀特菲尔德一人身上。

  书中说，复兴先在新泽西拉里坦河谷弗瑞林海森的荷兰改革宗教会兴起，又借吉尔伯特·滕能特和木屋学院的毕业生在长老会中从长岛烧到弗吉尼亚。1734 年 12 月爱德华兹在北安普敦讲因信称义，全城改变；到 1740 年复兴遍及新英格兰，书中说三十万人口中有二万五千到五万人新加入教会，道德标准也随之提高。复兴伴随强烈的感情和身体表现，1741 年爱德华兹在恩菲尔德讲道时全场痛哭。怀特菲尔德 1738 到 1770 年间七次到美洲巡回，从新英格兰到佐治亚，听众有时达两万。

  书中说，一段时期后兴奋渐退，复兴之火熄灭，并带来意见不合：新英格兰公理派牧师之间、纽约改革宗牧师之间都分了派，长老会也一度分裂。复兴又带动了新英格兰神学的发展，大大削弱了传统加尔文主义在公理派、改革宗和长老派中的地位；自由神学渐渐高涨，特别是在波士顿一带，后来在十九世纪初形成神体一位会。第四十三章说，大觉醒使殖民者第一次有了全民共同的宗教经验，在华盛顿和富兰克林成为全民的政治象征之前，怀特菲尔德、爱德华兹、滕能特的名字已为所有殖民者关注，这成了殖民地联合起来的宗教因素之一。

  据一般记载，“第一次大觉醒”是后人的称呼；长老会 1741 年分裂为支持复兴的“新派”和反对的“旧派”，1758 年复合；复兴中还创办了新泽西学院（今普林斯顿大学）等学校。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十二章“教会经历大觉醒” https://wellsofgrace.com/books/spiritual/2000years/html/chapter47.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十三章“新兴国家的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter48.html"
