name: 1059 年教皇选举法
aliases:
  - 拉特兰会议（1059 年）
  - 《以主之名》教令
summary: 1059 年罗马会议规定教皇由枢机选举，排除贵族和皇帝的干预。
body: |-
  1056 年皇帝亨利三世去世，继位的亨利四世还是孩子。《历史的轨迹》第十四章说，改革者认为这是教皇制摆脱皇室控制的最好时机。1057 年他们不经宫廷同意就选出了教皇司提反九世（该书按另一种算法称“十世”）。次年司提反去世，罗马贵族抢先立了自己的人。逃出罗马的枢机们在希尔得布兰的筹划下，得到托斯卡纳公爵的兵力和太后的认可，另选佛罗伦萨主教为教皇，即尼古拉二世，把他送进罗马。

  1059 年 4 月尼古拉二世在罗马的拉特兰宫召开会议。第十五章称，这次会议最重大的事是定下选举教皇的新办法：教皇去世后，先由枢机主教们商定人选，再由其余的枢机附议，然后征得罗马教士和民众的同意。教令里只含糊地提到对年轻的国王亨利应有的尊敬，没有说皇帝在选举中有什么权利。教令又规定，人选不限于罗马教会，必要时可以在罗马以外选举，当选的人即刻拥有教皇的全部权力。

  同一次会议还规定教士不得从平信徒手里领受教堂，该书说尼古拉二世由此正式废止了“平信徒授衣礼”；这条规定当时并没有认真执行，十六年后贵格利七世重申时才引发大争执。为了有一支不受皇帝支配的兵力，教廷在同年 8 月与意大利南部的诺曼人订约，承认他们占有的土地，诺曼首领向教皇宣誓效忠。

  德意志宫廷和伦巴第的主教们不承认这个办法。1061 年尼古拉去世，枢机们选出亚历山大二世，宫廷另立了一位，对峙了几年才平息。该书说，这个选举办法除了一些修正之外沿用至今。1179 年又补充规定，当选须得枢机三分之二的票数。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十四章“教会为自由奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter16.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十五章“教会继续为自由奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter17.html"
