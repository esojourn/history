name: "圣诞大会"
summary: "1784 年在巴尔的摩召开的循道派大会，成立美国循道会，选科克、亚斯理为监督。"
body: |-
  《历史的轨迹》第四十三章说，独立以后，循道派仍隶属英国国教，除了正式按立的人，没有人可以讲道和主持圣礼。卫斯理以教会长老的身份认为自己也有权按立，便在两位牧师协助下按立了科克，使他成为美国循道派教会的监督。1784 年的一次大会上，科克和亚斯理都被选为监督，会中又按立了几个人，并通过统一的信条和礼拜仪式，信条是亚米念派的，主要由卫斯理拟定。书中还说，独立战争中卫斯理站在英国一边，美国的爱国者因此怀疑循道派信徒，但循道派从 1775 到 1780 年仍由四千人增长到一万三千人。

  据一般记载，这次大会 1784 年 12 月 24 日在巴尔的摩的洛夫利巷礼拜堂开幕，因此称为“圣诞大会”，到会的传道人约六十位，会上成立了“美国监理循道会”。卫斯理寄来的是他删节的英国国教三十九条（成为二十五条）和简化的公祷书。他原定亚斯理与科克同任“总监督”，亚斯理坚持须经与会传道人选举才肯就任，会上二人当选；后来美国人改称“监督”，卫斯理对此表示不满。这次大会是美国第一个全国性宗派组织的建立。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十三章“新兴国家的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter48.html"
