name: 后蜀建立
summary: 后唐的西川节度使孟知祥割据两川，934 年在成都称帝，史称后蜀。
body: |-
  同光三年（公元 925 年）后唐灭前蜀以后，派孟知祥任西川节度使，董璋任东川节度使。后唐明宗时，枢密使安重诲对两川很不放心，在两川派驻亲信、分割辖地，孟知祥与董璋于是在长兴元年（930 年）联合起兵反抗。后唐派兵讨伐，因山路险远、粮运困难而无功而返，明宗只好杀了安重诲，派人安抚两川。

  长兴三年（932 年），孟知祥与董璋发生冲突，孟知祥击败董璋，董璋被部下所杀，孟知祥兼并了东川，据有两川全境。次年后唐封他为蜀王。应顺元年（934 年）正月，孟知祥在成都称帝，国号蜀，史称后蜀。同年七月孟知祥去世，儿子孟昶继位。

  后蜀据有今四川、重庆大部和陕西南部、甘肃东南部，在孟昶统治下维持了三十年的安定，成都一带经济文化繁荣，《花间集》就是在这一时期编成的（另见“《花间集》编成”条）。乾德三年（965 年），北宋军攻入蜀地，孟昶投降，后蜀灭亡。
sources: []
recalled:
  - 《新五代史·后蜀世家》
  - 《资治通鉴》卷二百七十七至二百七十九
