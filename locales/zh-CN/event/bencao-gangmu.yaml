name: 《本草纲目》编成
summary: 李时珍用近三十年编成药物学巨著《本草纲目》，1596 年刊行。
body: |-
  中国古代把记载药物的书称为“本草”。宋代以后，本草书籍越来越多，内容也越来越庞杂，有不少错误和重复。湖广蕲州的医生李时珍在行医过程中发现了这些问题，从嘉靖三十一年（1552 年）开始重新编修本草书。

  李时珍参考了八百多种前人的书籍，又亲自到各地采集标本，向药农、樵夫、猎人等请教，经过三次大的修改，于万历六年（1578 年）完成了《本草纲目》。全书五十二卷，收录药物一千八百九十二种，其中新增的有三百多种，附有药方一万一千多个、插图一千一百多幅。他以“纲”统“目”，把药物分为水、火、土、金石、草、谷、菜、果、木、服器、虫、鳞、介、禽、兽、人十六部，纠正了前人书中的许多错误。

  书稿完成后，李时珍到南京寻找出版者，请当时的文坛领袖王世贞作了序。万历二十一年（1593 年）李时珍去世，万历二十四年（1596 年）书在南京由胡承龙刊刻出版，后世称为“金陵本”。此后这部书多次翻刻，十七世纪初传到日本，后来又有部分内容被译成拉丁文、法文、德文、英文等文字。
sources: []
recalled:
  - 李时珍《本草纲目·凡例》
  - 王世贞《本草纲目序》
  - 《明史·方伎传》
