name: 蒙古第一次西征
summary: 1219 年成吉思汗西征花剌子模，攻破中亚诸城，前锋远至高加索和罗斯南部。
body: |-
  十三世纪初，花剌子模是中亚最强大的国家，统治着阿姆河、锡尔河流域和伊朗的大部分地区。1218 年，成吉思汗派出一支由穆斯林商人组成的大商队前往花剌子模，在边城讹答剌被当地长官以间谍的罪名全部杀害，财物被没收；成吉思汗派使者交涉，使者也被杀。

  1219 年，成吉思汗亲率大军西征，派一部分军队围攻讹答剌，自己率主力直取布哈拉，次年又攻下花剌子模的新都撒马尔罕。花剌子模国王摩诃末一路西逃，成吉思汗派哲别、速不台率军追击，摩诃末最后逃到里海中的一个小岛上，不久死去。他的儿子札兰丁继续抵抗，1221 年在印度河畔被成吉思汗击败，跃马渡河逃走。拖雷率军攻掠呼罗珊，攻破马鲁、你沙不儿等城；术赤、察合台、窝阔台攻下花剌子模旧都玉龙杰赤。据波斯史家记载，蒙古军在许多城市进行了大规模屠杀，中亚的城市和灌溉系统遭到严重破坏。

  哲别、速不台在追击摩诃末之后继续西进，越过高加索山，击败阿兰人和钦察人，1223 年在迦勒迦河畔大败罗斯诸公和钦察的联军，然后绕过里海北面东返。这是蒙古军第一次进入东欧。

  1225 年成吉思汗回到蒙古。随军的耶律楚材写了《西游录》；应邀西行的全真道士丘处机于 1222 年在兴都库什山一带的行营见到成吉思汗，他的弟子李志常写成《长春真人西游记》。这次西征使蒙古的势力扩展到中亚，为此后的长子西征和旭烈兀西征打下了基础。
sources: []
recalled:
