name: 赫连勃勃建夏
summary: 匈奴铁弗部的赫连勃勃叛后秦自立，建夏国，筑统万城，后来夺取关中。
body: |-
  匈奴铁弗部是南匈奴与鲜卑混血的后裔，长期活动在黄河河套以南。登国六年（公元 391 年）这个部落被北魏击灭，首领的幼子勃勃逃到后秦，受到姚兴的重用。后秦与北魏通好，他以此为怨，弘始九年（407 年）袭杀岳父，夺得数万部众，自称大夏天王。

  他没有先建都城，部下劝他据守险要，他说自己刚刚起事，兵力不多，如果固守一城，后秦必定全力来攻；不如以骑兵出没无常，使对方疲于奔命，不出十年，岭北、河东就都归自己了。此语见《晋书·载记》。此后几年，后秦的北部各郡果然被他逐一蚕食。

  凤翔元年（413 年），他命叱干阿利在朔方水北、黑水之南筑城，取“统一天下，君临万邦”之意，名为统万。城墙用蒸过的土夯筑，极其坚固，遗址在今陕西靖边县北，城垣至今尚存，当地人称白城子。同年他改姓赫连。

  东晋义熙十三年（417 年）刘裕灭后秦，他对部下说，刘裕不能久留，留下的子弟和将领不难对付。次年晋军内讧，他派儿子南下，占领长安，自己在灞上称帝。夏国最盛时据有今陕西大部和甘肃东部、内蒙古南部。他死后六年，夏被北魏和吐谷浑所灭。
sources: []
recalled:
  - 《晋书·赫连勃勃载记》
  - 《魏书·铁弗刘虎传》
  - 《资治通鉴》卷一百一十四至一百一十八
