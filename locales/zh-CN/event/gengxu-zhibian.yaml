name: 庚戌之变
summary: 1550 年蒙古俺答汗率军攻破古北口，兵临北京城下，在京郊大肆劫掠八天后退去。
body: |-
  嘉靖年间，蒙古土默特部首领俺答汗多次派人请求与明朝通贡互市，都被明朝拒绝，有时使者还被杀害。俺答汗于是年年率军南下劫掠。

  嘉靖二十九年（1550 年，干支为庚戌）六月，俺答汗率军进攻大同，大同总兵仇鸾用重金贿赂俺答汗，请他转攻别处。八月俺答汗率军东进，攻破古北口，长驱直入，到达北京城下，在城外通州、密云、顺义等地烧杀抢掠。各地的勤王军队赶来，但都不敢出战。据《明史》记载，兵部尚书丁汝夔向首辅严嵩请示，严嵩说塞上打了败仗还可以掩饰，京郊失败皇上会知道，蒙古兵抢够了自然会走，于是诸将坚壁不战。蒙古军劫掠了八天，满载而归。

  事后嘉靖帝追究责任，丁汝夔被处死，仇鸾却被任命为平虏大将军。次年明朝一度在大同、宣府开设马市，但不久又关闭。庚戌之变暴露了明朝北方边防的虚弱，此后明朝在北京外城加筑城墙，嘉靖三十二年（1553 年）建成北京外城。
sources: []
recalled:
  - 《明史·鞑靼传》
  - 《明史·严嵩传》
  - 《明史·丁汝夔传》
