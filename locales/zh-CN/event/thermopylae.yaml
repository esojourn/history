name: 温泉关战役
summary: 公元前 480 年列奥尼达率希腊守军阻击波斯大军三日，全部战死。
body: |-
  公元前 480 年薛西斯的军队从陆路南下，希腊联军最初想在色萨利北面的滕佩谷地设防，发现可以被绕过而放弃，改在温泉关布防。这里在山崖与海湾之间，最窄处据希罗多德只容一辆车通过。舰队同时驻在东面优卑亚岛北端的阿提密西安，防止波斯海军从水路绕到背后。陆上的守军由斯巴达王列奥尼达统率，有三百名斯巴达人和各邦部队共约六七千，被当作主力到来之前的前锋。

  薛西斯等了四天，第五天开始进攻。米底人、奇西亚人和称为“不死军”的波斯精锐轮番冲击，两天里都被击退；狭窄的地形使人数发挥不了作用，希腊人的长矛和大盾又占上风。同时在海上，双方在阿提密西安交战三天，互有损失，波斯舰队此前还在风暴中损失了许多船。

  第二天傍晚，当地的马利斯人厄菲阿尔特向薛西斯告知一条翻山绕到关后的小路。不死军连夜出发，天亮时逼退了守在山路上的一千名福基斯人。列奥尼达得讯后让多数盟军撤走，自己和三百斯巴达人、七百塞斯皮亚人以及四百底比斯人留下。希罗多德认为是他主动遣走盟军，因为斯巴达人不可离开阵地，又有神谕说须有一位国王战死；后来的学者也有认为他是留下来掩护撤退的。第三天上午守军走出窄道迎战，列奥尼达阵亡，余下的人退到一个小丘上，在两面夹击中全部战死。底比斯人最后投降。

  温泉关失守的消息传来，希腊舰队当即从阿提密西安南撤。波斯军进入中希腊，彼奥提亚归顺，雅典撤空。这一仗在军事上是希腊人的失败，但斯巴达人明知必死而不退，在当时就被视为典范；战场上后来为阵亡者立了碑，为列奥尼达立了一尊石狮。
sources: []
recalled:
  - 希罗多德《历史》卷七第 175—238 章；卷八第 1—23 章
  - 狄奥多罗斯《历史丛书》卷十一第 4—11 章
