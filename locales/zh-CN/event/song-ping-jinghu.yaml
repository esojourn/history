name: 宋平荆南、湖南
summary: 963 年宋军借道荆南讨伐湖南叛将，顺势收取荆南与湖南，是宋统一南方的第一步。
body: |-
  宋朝建立后，赵匡胤与赵普商定先南后北的统一方略。建隆三年（公元 962 年）割据湖南的武平节度使周行逢去世，年幼的儿子周保权继位，衡州刺史张文表起兵作乱，周保权向宋朝求援。

  乾德元年（963 年）正月，赵匡胤派慕容延钊、李处耘率军南下，向荆南借道。荆南节度使高继冲无力拒绝，宋军到达江陵时，李处耘率轻骑突入城中，高继冲被迫献出所辖三州之地，荆南灭亡。宋军随即进入湖南，这时张文表已被湖南军队杀死，周保权拒绝宋军入境，宋军击败湖南军队，三月攻下朗州，俘获周保权，湖南也归于宋朝。这次出兵一举取得了长江中游，切断了后蜀与南唐之间的联系，为此后攻灭后蜀和南唐打下了基础。
sources: []
recalled:
  - 《宋史·太祖本纪》
  - 《宋史·世家·荆南高氏》
  - 《续资治通鉴长编》卷四
