name: 绍兴和议
summary: 1141 年宋金议和，宋向金称臣，以淮河、大散关为界，每年纳银绢各二十五万。
body: |-
  宋金之间早在绍兴八年（公元 1138 年）就订过一次和约，金朝同意把河南、陕西之地归还宋朝，宋向金称臣，但这一和约两年后就被金朝撕毁。绍兴十年（1140 年）宋军在顺昌、郾城等地连续获胜，宋高宗和秦桧却下令各路班师，再次寻求议和；金朝方面，完颜宗弼也认识到难以消灭南宋，同意重开和谈。

  绍兴十一年（1141 年）四月，朝廷以论功行赏为名，把岳飞、韩世忠、张俊召到临安，任命为枢密使、副使，收回了他们的兵权，各大将的军队改由朝廷直接指挥。同年十一月宋金订立和约，主要内容是：宋向金称臣，金册封宋帝；两国东以淮河中流、西以大散关为界，宋割让唐州、邓州和商州、秦州的大半；宋每年向金纳银二十五万两、绢二十五万匹（据《宋史》《金史》所载）。和约订立前后，岳飞被诬下狱，同年十二月被害（另见“岳飞之死”条）。

  绍兴十二年（1142 年）金朝派使者册封赵构为皇帝，并送回宋徽宗的灵柩和高宗的生母韦太后。宋钦宗没有被放回，后来死在金朝。

  绍兴和议确立了此后宋金南北对峙的格局，宋金之间维持了约二十年的和平，南宋得以休养生息，经济有所恢复。但这一和约以称臣纳贡、牺牲抗金将领为代价，历来受到批评，主持和议的秦桧也因此成为后世唾骂的对象。绍兴三十一年（1161 年）金海陵王南侵，和约被打破。
sources: []
recalled:
  - 《宋史·高宗本纪》
  - 《金史·宗弼传》
  - 《建炎以来系年要录》
