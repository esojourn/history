name: 夹寨之战
summary: 908 年李存勖继位后突袭围困潞州的梁军营垒，解潞州之围，晋军转危为安。
body: |-
  天祐四年（公元 907 年），后梁军包围了晋军据守的潞州，在城外修筑了一道环形的营垒，内防城中突围，外拒晋军救援，称为“夹寨”。晋将周德威领兵在外，久攻不下，潞州被围近一年，城中困苦。

  天祐五年（908 年）正月，晋王李克用去世，李存勖继位。梁军以为晋军新丧，必不能来救，防备松懈。李存勖亲自率军南下，五月趁清晨大雾，分兵突袭夹寨，梁军猝不及防，大败而逃，潞州之围遂解。据《资治通鉴》，朱温听说后叹息说，生子当如李亚子，李克用可以说是后继有人了。

  这一战稳定了李存勖初立时的局面，使晋国转守为攻，为此后的柏乡之战和争夺河北打下了基础。
sources: []
recalled:
  - 《旧五代史·唐书·庄宗纪》
  - 《资治通鉴》卷二百六十六
