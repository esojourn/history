name: 高洋代东魏建北齐
summary: 高欢次子高洋逼东魏孝静帝禅位，550 年建立北齐，都邺城。
body: |-
  东魏的实权一直掌握在高欢手中。武定五年（公元 547 年）高欢去世，长子高澄继承权位，平定了侯景的叛乱，收复了河南之地，又乘梁朝内乱夺取了淮南。高澄准备篡位称帝，武定七年（549 年）八月，他在邺城与亲信密谋时，被厨奴兰京刺杀。

  高澄的弟弟高洋当时在邺城，迅速率兵捕杀凶手，稳定了局面，随后回到晋阳，接管了高欢父子的霸府和军队。武定八年（550 年）五月，他逼东魏孝静帝禅位，即位为帝，国号齐，史称北齐，年号天保，仍以邺为都城，以晋阳为别都。孝静帝被废为中山王，次年被毒死。

  北齐占有河北、河南、山东和山西，是当时三国中人口最多、经济最富庶的。高洋在位前期整顿吏治，北征柔然、突厥、契丹，国力强盛，但后期嗜酒暴虐。他死后，北齐宫廷屡生变乱：太子高殷被叔父高演废黜，高演在位一年即死，弟弟高湛即位，后传位给儿子高纬。北齐统治集团中鲜卑勋贵与汉族士人的冲突一直很激烈，宰相杨愔等汉族大臣在 560 年被杀。

  北齐编订的《北齐律》在河清三年（564 年）完成，列出“重罪十条”，后来演变为隋唐律中的“十恶”，对后世法律影响很大。北齐共历六帝二十八年，577 年被北周所灭。
sources: []
