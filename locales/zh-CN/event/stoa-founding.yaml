name: 斯多亚学派创立
summary: 约公元前 300 年芝诺在雅典的彩绘柱廊讲学，斯多亚学派由此得名。
body: |-
  基提翁的芝诺到雅典后，先后跟犬儒派的克拉特斯、麦加拉派的斯提尔波和柏拉图学园的波勒蒙等人学习了约二十年。约公元前 300 年，他开始在雅典市场北侧的“彩绘柱廊”里来回踱步讲学。这座柱廊建于前 5 世纪，壁上有波吕格诺托斯等人画的马拉松之战等图画，是公共场所，谁都可以进去。他的追随者起初叫“芝诺派”，后来按希腊语“柱廊”一词被称为“斯多亚派”。创始的年份只是大致推定。芝诺不是雅典公民，没有像柏拉图、伊壁鸠鲁那样置下产业，这个学派始终没有固定的校舍。

  斯多亚派把哲学分为逻辑、自然、伦理三部分，常用的比喻是果园：逻辑是围墙，自然学说是树，伦理是果实。它认为宇宙是一个有生命的整体，由神圣的理性按必然的秩序安排，周期性地在大火中毁灭又重生；人的灵魂分有这种理性。所以人应当“依照自然生活”，这也就是依照理性和德行生活。德行是唯一的善，自身就足以使人幸福；财富、健康、名誉乃至生死都与幸福无关，只是其中有些“可取”、有些“不可取”。有智慧的人不为恐惧、欲望、悲伤所动，同时并不离群：既然人人分有同一理性，所有的人就同属一个大的共同体，各人应当尽自己身份上的职责。

  芝诺约在前 262 年去世，克里安提斯继任。第三任掌门克律西波斯著述极多，把学说、尤其是命题逻辑和认识论组织成严密的体系，古人说“没有克律西波斯就没有斯多亚”。前 2 世纪的帕奈提奥斯和波西多尼乌斯把它带进罗马上层，学说也变得温和、切近实际。罗马帝国时期的塞涅卡、当过奴隶的爱比克泰德和皇帝马可·奥勒留留下了今天最常被阅读的斯多亚著作，早期各家的书反而全部失传，只存摘引。

  它的若干观念，如自然法、人类一体、良心与职责，经西塞罗等人进入罗马法学，也为早期基督教作家所熟悉。《使徒行传》第 17 章记保罗在雅典与斯多亚派哲学家辩论，他在亚略巴古的讲话引用了带有斯多亚色彩的诗句。
sources: []
