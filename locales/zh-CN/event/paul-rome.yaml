name: 保罗被解往罗马
summary: 保罗在该撒利亚上告于该撒，被押解渡海，途中船毁，到罗马后软禁两年。
body: |-
  保罗第三次出行后回到耶路撒冷，在圣殿里被从亚西亚来的犹太人拿住，全城震动，罗马的千夫长带兵把他从人群中带走（《使徒行传》21:27–36）。因为有四十多个人起誓要杀保罗，千夫长革老丢·吕西亚派兵连夜把他送到该撒利亚（凯撒利亚），交给巡抚腓力斯（23:12–33）。腓力斯把他留在监里，过了两年，波求·非斯都接任（24:27）。非斯都问他是否愿意上耶路撒冷受审，保罗就上告于该撒（25:9–12）。亚基帕王和百尼基来到该撒利亚，听了保罗的申诉；亚基帕对非斯都说，这人若没有上告于该撒，就可以释放了（26:32）。

  保罗和别的囚犯被交给御营的一个百夫长，名叫犹流。这一段叙述用“我们”，同行的还有帖撒罗尼迦人亚里达古（27:1–2）。他们在每拉换乘一只往意大利去的亚历山大的船，到了革哩底的佳澳，已经过了禁食的节期，保罗劝众人不要再走，百夫长没有听从。开船不久遇上狂风，船在海上飘了十四天，最后在一个海岛旁搁浅，船尾被浪打坏；据 27:37，船上共有二百七十六人，全都上了岸。那岛名叫米利大。

  他们在岛上过了三个月，再乘船经叙拉古、利基翁到部丢利上岸，走陆路往罗马；罗马的弟兄到亚比乌市和三馆迎接（28:11–15）。到了罗马，保罗获准和一个看守他的兵另住在一处。他请当地犹太人的首领来，向他们讲论；此后在自己所租的房子里住了足足两年，凡来见他的人他都接待（28:16–31）。《使徒行传》到这里结束，没有记审讯的结果。

  传统上认为《腓立比书》《歌罗西书》《腓利门书》《以弗所书》写于这次被囚期间。各家推算的年份略有出入，主要取决于非斯都接任的年份，本条取公元 60 至 62 年的约数。
sources: []
recalled:
  - 《使徒行传》21:27—28:31
  - 《腓立比书》1:12–14
