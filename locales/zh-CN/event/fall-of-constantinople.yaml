name: 君士坦丁堡陷落
aliases:
  - 东罗马帝国灭亡
summary: 1453 年奥斯曼苏丹穆罕默德二世攻陷君士坦丁堡，东罗马帝国灭亡。
body: |-
  十五世纪中叶，东罗马帝国只剩下君士坦丁堡城和希腊南部的一小块地方，四面都是奥斯曼土耳其人的领土。1439 年皇帝在佛罗伦萨同意教会合一，为的是换取西方的援兵；援军 1444 年在瓦尔纳战败，合一在城里又遭到多数教士和民众反对。

  1451 年不满二十岁的穆罕默德二世即位，次年在博斯普鲁斯海峡最窄处筑堡，截断了从黑海来的补给。1453 年 4 月初他率大军围城。守军连同热那亚、威尼斯来的援兵不到一万人，人数远少于对方。奥斯曼人用新铸的巨炮轰击陆墙；城北金角湾的入口有铁链拦住，他们就把一批战船从陆地上拖过山坡，放进湾里。

  5 月 29 日拂晓前总攻开始，陆墙被突破。末代皇帝君士坦丁十一世战死，遗体没有找到。按当时的惯例，军队在城中抢掠了三天。苏丹当天进入圣索菲亚教堂，下令把它改成清真寺。

  《历史的轨迹》第二十章说，土耳其人攻取君士坦丁堡，结束了所有使东西教会再度合一的努力；伟大的圣索菲亚教堂变成回教寺，顶上的十字架被新月取代，希腊东方的正教落在伊斯兰的统治之下。苏丹随后立了一位反对合一的修士为主教长，让他管理帝国内的东正教徒。北方的俄罗斯教会此前已自行选立都主教，后来以正教的保护者自居。

  该书把 476 年到 1453 年这一千年看作中世纪，说古希腊罗马的学问在这期间保存在东方。城破前后，有希腊学者带着抄本到意大利，助长了那里研读希腊文的风气；这种迁移从十四世纪末就开始了，并非始于 1453 年。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
