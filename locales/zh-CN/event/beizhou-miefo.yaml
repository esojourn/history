name: 北周武帝灭佛
summary: 北周武帝下诏同时禁断佛、道二教，令僧道还俗、寺观财产入官，灭齐后推及齐地。
body: |-
  北朝后期，佛教寺院占有大量土地和人口，许多人为了逃避赋役出家为僧。北周天和二年（公元 567 年），还俗僧人卫元嵩上书，请求减省寺院和僧尼；道士张宾也极力攻击佛教。周武帝从天和年间起多次召集百官、僧人和道士，辩论儒、佛、道三教的先后，建德二年（573 年）定下儒教为先、道教次之、佛教为后的次序。

  建德三年（574 年）五月，武帝下诏同时禁断佛、道二教，毁坏经书和佛像，令僧尼、道士一律还俗，寺院、道观的财产没收入官，同时禁止各种不合礼制的祭祀。一个月后，他设立通道观，选佛、道两教的名人一百二十人，在其中研究三教的义理。

  建德六年（577 年）北周灭齐后，武帝在邺城召集原北齐的僧人，宣布在齐地也推行禁佛。据道宣的《续高僧传》，僧人慧远当面抗辩，说陛下凭借帝王的权力破灭三宝，将来要堕入阿鼻地狱；武帝回答说，只要百姓能得到安乐，我也不怕受地狱之苦。据佛教史料《历代三宝纪》等书的说法，北齐境内的寺院有四万所被赐给王公作宅第，还俗的僧尼近三百万人，这些数字可能有所夸大。

  禁佛使北周国家控制的户口和兵源大为增加，财政收入也随之增长，有利于灭齐。宣政元年（578 年）武帝去世，宣帝即位后逐渐放宽禁令，大象二年（580 年）杨坚辅政，佛道二教全面恢复。这次禁佛是佛教史上所说的“三武一宗”法难中的第二次。
sources: []
recalled:
  - 《周书·武帝纪》
  - 道宣《续高僧传·慧远传》
  - 道宣《广弘明集》
  - 费长房《历代三宝纪》
