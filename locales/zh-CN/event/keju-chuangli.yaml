name: 科举创立
summary: 隋朝废除九品中正制，改由朝廷分科考试选拔官员，具体始于哪一年，史家看法不一。
body: |-
  魏晋南北朝时，朝廷选官主要依据九品中正制，由各州郡的中正官评定士人的品第，结果多被世家大族把持，形成“上品无寒门，下品无势族”的局面。隋朝建立后，废除了九品中正制，逐步改为由朝廷分科考试选拔人才，这就是科举制度的开端。

  关于科举究竟始于哪一年，史料记载零散，学界有多种说法。一说开皇七年（公元 587 年），文帝下诏各州每年向朝廷贡举三人，被看作分科取士的开始；开皇十八年（598 年）文帝又下诏，令京官五品以上和地方总管、刺史以“志行修谨”“清平干济”两科举人。另一说以进士科的设立为标志，唐代以来的不少记载说进士科始于隋炀帝时，具体年份有大业元年（605 年）、二年、三年等说法，但《隋书》没有明确记载。据《旧唐书》本传，房玄龄十八岁时被本州举为进士，这是隋朝已有进士科的旁证。还有学者认为，隋朝的考试还很不成熟，真正意义上的科举到唐朝才形成。

  唐朝继承并发展了这一制度。武德年间开始定期举行科考，常设的科目有明经、进士等，其中进士科以诗赋、策论取士，最受重视，被录取者称为“登科”。武则天时曾亲自在殿上策问贡士，又设立了武举。科举使出身寒微的读书人也有了做官的途径，逐渐削弱了门阀士族对官职的垄断，但在唐代，门第和推荐仍然对能否考中有很大影响。

  这一制度此后沿用了一千三百年，直到清朝光绪三十一年（1905 年）才被废除，对朝鲜半岛、越南等地的选官制度也有影响。
sources: []
recalled:
  - 《隋书·高祖纪》
  - 《隋书·炀帝纪》
  - 杜佑《通典·选举》
  - 王定保《唐摭言》
