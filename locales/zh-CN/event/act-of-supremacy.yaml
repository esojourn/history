name: "至尊法案"
summary: "1534 年英格兰议会立法宣布国王为英格兰教会唯一的最高元首，与罗马决裂。"
body: |-
  亨利八世请求教皇宣布他与阿拉贡的凯瑟琳的婚姻无效，拖了六年没有结果。《历史的轨迹》第二十八章说，英格兰那时民族意识已很强，人民不满教皇管辖英格兰教会，更不愿把大笔款项送往罗马；若不是国王要离婚，教会也许仍不会有大的改变。

  1529 年起召开的议会一步步切断与罗马的联系。1532 年教士会议承认此后不经国王同意不制定教规；1533 年《禁止上诉法》宣布英格兰是一个“帝国”，教会案件在国内终审，克兰麦据此判决国王的婚姻无效。1534 年议会停止向罗马缴纳各种款项，规定主教由国王提名，并要臣民宣誓承认安妮·博林所生子女的继承权。同年 11 月通过《至尊法案》，宣布国王是“英格兰教会在地上唯一的最高元首”，有权巡视教会、纠正谬误和异端。

  随后的《叛逆法》规定，用言语或文字否认国王的这一称号就是叛国。该书称之为“叛国与异端法案”。伦敦加尔都西会的几位院长首先因此被处死，1535 年夏天罗切斯特主教费舍尔和前任大法官托马斯·莫尔被斩首。其余的主教和绝大多数教士都宣了誓。

  该书强调，这项法案改变的不是教义和礼拜，而是教会的管理，只是国王取代了教皇，还不能算改教；天主教徒认为自己照旧是天主教徒，倾向路德的人则把它看作迈向改教的第一步。此后几年，大臣克伦威尔以国王代理人的身份巡查并解散了全国八百多所修道院，土地归王室，大部分转卖出去，买了地的乡绅从此不愿再回到罗马。圣徒的遗物和朝圣地也被清除。

  玛丽一世在位时这些法律一度废止。1559 年伊丽莎白一世的议会重新通过《至尊法案》，称号改为“最高管理者”。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十八章“英国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter31.html"
