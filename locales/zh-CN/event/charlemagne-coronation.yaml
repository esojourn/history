name: 查理曼加冕
aliases:
  - 800 年圣诞节加冕
  - 西方帝国的恢复
summary: 800 年圣诞节教皇利奥三世在罗马为查理加冕，西方重新有了皇帝。
body: |-
  476 年以后西方不再有皇帝，名义上唯一的皇帝在君士坦丁堡。到八世纪末，法兰克王查理已经统治了从埃布罗河到易北河、从北海到意大利中部的地方，又是教皇的保护者。君士坦丁堡这时由女皇伊琳娜独自在位，西方有人认为帝位等于空缺。

  799 年 4 月教皇利奥三世在罗马遇袭，逃到查理那里，由法兰克人护送回城。800 年 11 月查理来到罗马，主持会议审理对教皇的指控。12 月 23 日利奥当众起誓自辩。

  两天后的圣诞节，查理在圣彼得教堂望弥撒。《历史的轨迹》第九章说，他正跪着的时候，教皇突然把一顶皇冠加在他头上。据法兰克一方的年代记，在场的罗马人随即三次欢呼他为皇帝，教皇又按对待古代皇帝的礼节向他致敬。为查理作传的艾因哈德说，查理事后表示，如果预先知道教皇的打算，那天虽是大节也不会进教堂。这句话怎样理解，史家意见不一：这样的仪式不大可能毫无预备，他不满的也许是由教皇来加冕这种做法。813 年他立儿子路易为共治皇帝时，是在亚琛自己把皇冠给他戴上的，没有请教皇。

  《历史的轨迹》说查理被立为“神圣罗马帝国皇帝”，并说他具备旧日罗马帝国的三样特色，即法律、文化和基督教。“神圣罗马帝国”的名称要到十二、十三世纪才出现。君士坦丁堡起初视之为僭越，812 年才承认查理的皇帝称号。

  该书认为，教皇借着这次加冕恢复了西方的帝国，也开始了以后教皇与皇帝之间的摩擦：帝位是教皇给的，还是直接从神来的，此后几百年双方各执一词。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第九章“教会组成联盟” https://wellsofgrace.com/books/spiritual/2000years/html/chapter11.html"
recalled:
  - 《法兰克王国年代记》799—801 年
  - 《教皇列传》利奥三世传
  - 艾因哈德《查理大帝传》第 28 章
  - 塞奥法尼斯《编年史》
