name: 阿吉纽西海战与审判将军
summary: 公元前 406 年雅典海军获胜，得胜的将军却因未救起落水者被处死。
body: |-
  公元前 406 年，斯巴达新任海军统帅卡利克拉提达斯把科农率领的雅典舰队封锁在莱斯博斯岛的米提利尼港内。雅典倾其所有，三十天里凑出一百一十艘战船，凡到服役年龄的人不分自由人和奴隶都上了船，据说事后参战的奴隶获得了自由。加上盟邦的船只共一百五十多艘，开往莱斯博斯与小亚细亚大陆之间的阿吉纽西群岛。

  卡利克拉提达斯留下五十艘船继续封锁，带一百二十艘迎战。这是战争中希腊人之间规模最大的一次海战。雅典人排成前后两列，防止对方穿插。卡利克拉提达斯在冲撞敌船时落水失踪，斯巴达一方损失约七十艘战船，雅典人损失二十五艘。

  战后，八位在场的将军决定率主力去解米提利尼之围，留下战船长塞拉门尼斯和色拉西布洛斯带四十七艘船去救起漂在残骸上的人。一场风暴使两件事都没有做成，落水者死了很多。消息传到雅典，将军们被免职召回，回来的有六人。在议事会和公民大会上，塞拉门尼斯指责将军们没有救人，将军们则说是风暴所致。几天后适逢家族团聚的节日，死者的亲属穿着丧服来到会场。卡利克塞诺斯提议，不再分别审理，由公民大会对八名将军一并投票，有罪即处死。

  有人指出这违反了每个被告应单独受审的成法，要控告提案人违法，会场上的人群喊道，不让人民做他们想做的事才是岂有此理。轮值的议事会主席团在威吓下同意付诸表决，据色诺芬，只有苏格拉底一人拒绝，说他不会做任何不合法的事。大会最终判八人有罪，在雅典的六人被处死，其中有伯里克利与阿斯帕西娅的儿子小伯里克利。色诺芬说，不久之后雅典人就后悔了，决定追究那些欺骗了人民的人。

  据《雅典政制》，战后斯巴达提出以现状议和，雅典人在克勒奥丰的鼓动下拒绝了。雅典同时失去了最有经验的一批海军将领，次年在羊河一败涂地。
sources: []
