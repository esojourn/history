name: 巫蛊之祸
summary: 汉武帝晚年追查巫蛊，江充借机陷害太子，太子起兵失败自杀，皇后与数万人死于此事。
body: |-
  “巫蛊”是把木偶人埋在地下、请巫者诅咒仇人的巫术，汉代法律视为大罪。武帝晚年多病，疑心有人诅咒自己。据《汉书·武五子传》和《公孙刘田王杨蔡陈郑传》，征和元年（公元前 92 年）冬，他下令在长安大举搜捕。次年正月，丞相公孙贺父子被人告发用巫蛊诅咒皇帝，死在狱中；诸邑公主、阳石公主和卫青的儿子卫伉也受牵连被杀。

  负责查办此类案件的是直指绣衣使者江充。他曾因处罚太子的家臣而与太子刘据结怨，担心武帝死后被太子报复。征和二年夏，武帝到甘泉宫养病，江充上奏说宫中有蛊气，得到允许后从后宫一直挖到皇后和太子的住处，宣称在太子宫中掘出的木偶最多。太子无法到甘泉宫当面辩白，在少傅石德的劝说下，于七月派人假称奉诏逮捕江充，亲自监斩，然后打开武库，调发卫士自卫。

  逃出的人报告武帝说太子造反。武帝回到长安城西的建章宫，命丞相刘屈氂调兵平乱。太子发动长安市民和囚徒抵抗，双方在城中混战五天，《汉书》说死者数万人。太子兵败，从城南的覆盎门逃出；武帝派人收缴皇后的玺绶，卫皇后自杀。八月，藏在湖县的太子被地方官吏发现，自缢而死，他的两个儿子同时遇害。太子的家属几乎全部被杀，只有一个出生才几个月的孙子被关进监狱，后来成为汉宣帝。

  事后，壶关的三老上书说太子是受奸臣逼迫，起兵只为自救；看守高帝陵庙的田千秋也上书鸣冤。武帝渐渐明白太子并无反意，把江充灭族，处死了当初追逼太子的人，在湖县修建思子宫和归来望思之台，并越级提拔田千秋为丞相。但储位从此空缺，受牵连的大臣很多，次年丞相刘屈氂和贰师将军李广利又因谋立昌邑王而一死一降。《汉书》说前后因巫蛊被处死的人有数万。武帝临终才立幼子刘弗陵，托付给霍光等人。
sources: []
recalled:
  - 《汉书·武五子传》
  - 《汉书·公孙刘田王杨蔡陈郑传》
  - 《汉书·蒯伍江息夫传》
  - 《资治通鉴》卷二十二
