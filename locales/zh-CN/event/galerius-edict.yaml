name: 伽列里乌斯宽容敕令
aliases:
  - 加利流宽容诏谕
  - 塞尔迪卡敕令
  - 塞尔迪卡诏谕
summary: 公元 311 年伽列里乌斯临终前下诏，准许基督徒恢复聚会，大逼迫在法律上结束。
body: |-
  公元 311 年 4 月 30 日，一道以伽列里乌斯、君士坦丁、李锡尼等几位皇帝名义发布的诏令在尼科米底亚公布，一般认为是伽列里乌斯在塞尔迪卡病中所发。原文保存在拉克坦提乌斯的《论迫害者之死》第 34 章，优西比乌的《教会史》里有希腊文译本。

  诏令先解释从前为什么逼迫：皇帝们本想让离弃祖先规矩的基督徒回心转意。接着承认此举没有成功，许多人既不敬拜诸神，也无法敬拜自己的神。因此皇帝“本着一贯的宽仁”，准许他们重新作基督徒，重建聚会的地方，只要不做违背秩序的事；又说基督徒应当为皇帝、为国家和他们自己的平安向他们的神祈求。

  几天以后伽列里乌斯去世。《历史的轨迹》第二章说，这道诏谕只给了基督徒一部分容忍，算不上基督教的完全得胜。它没有提归还被没收的产业，这要等到两年后的米兰敕令。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四章“教会全面得胜” https://wellsofgrace.com/books/spiritual/2000years/html/chapter05.html"
recalled:
  - 拉克坦提乌斯《论迫害者之死》第 33—35 章
  - 优西比乌《教会史》卷 8 第 17 章
