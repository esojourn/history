name: 水运仪象台建成
summary: 苏颂主持制造的天文仪器水运仪象台，约 1092 年建成。
body: |-
  元祐元年（公元 1086 年），宋哲宗命苏颂检验太史局的浑仪。苏颂推荐吏部令史韩公廉等人，设计制造一座新的天文仪器。他们先做成木制模型，经过检验，再用铜铸造，约在元祐七年（1092 年）建成，称为“水运仪象台”。

  据苏颂所著《新仪象法要》，这座仪器是一座高三丈多的木构建筑，分为三层：上层是观测天体的浑仪，上面有可以拆卸的屋顶；中层是演示星辰运行的浑象；下层设有报时装置，木人按时击鼓、摇铃、敲钟，并出示时辰牌。整座仪器用水力推动一个大型枢轮，由一套叫作“天衡”的机构控制枢轮按一定的节奏转动，从而带动浑仪、浑象和报时装置同步运转。英国学者李约瑟认为，这套控制机构与后来机械钟表中的擒纵器原理相近。靖康之变时，水运仪象台被金人拆运北去，后来损坏失传。现代根据《新仪象法要》的图样和说明，制作了多座复原模型。
sources: []
recalled:
  - 苏颂《新仪象法要》
  - 《宋史·天文志》
  - 李约瑟《中国科学技术史》天文卷
