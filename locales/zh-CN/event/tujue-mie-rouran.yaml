name: 突厥灭柔然
summary: 原本为柔然锻铁的突厥兴起，552 年大破柔然，柔然可汗阿那瓌自杀，突厥称霸草原。
body: |-
  柔然在四世纪末兴起于漠北，北魏称之为“蠕蠕”。五世纪初，柔然首领社仑自称丘豆伐可汗，统一了漠北各部，此后一百多年里是北魏北边的主要威胁。北魏末年，柔然可汗阿那瓌一度流亡北魏，后来回到漠北重振柔然，东西魏争相与他和亲。

  突厥是阿史那氏统领的部落，据《周书·突厥传》，他们居住在金山（今阿尔泰山）南麓，臣属于柔然，为柔然锻铁。西魏大统十二年（公元 546 年），突厥首领土门截击了准备进攻柔然的铁勒部，收降五万余落，实力大增。此前一年，宇文泰已派人出使突厥。土门向阿那瓌求婚，阿那瓌大怒，派人骂他说，你是我的锻铁奴隶，怎么敢说这样的话。土门于是转而与西魏通好，大统十七年（551 年）娶了西魏的长乐公主。

  西魏废帝元年（552 年）正月，土门发兵进攻柔然，在怀荒镇以北大败柔然军，阿那瓌自杀。土门自称伊利可汗，建立突厥汗国。柔然的残部一部分投奔北齐，一部分在邓叔子带领下投奔西魏。土门不久去世，他的儿子木杆可汗继续追击柔然残部。恭帝二年（555 年），木杆可汗派使者要求西魏交出投奔的柔然人，宇文泰把邓叔子以下三千余人交给突厥使者，在长安青门外被全部杀死，柔然从此灭亡。也有学者认为，西迁的一部分柔然人就是后来进入欧洲的阿瓦尔人，此说有争议。

  突厥迅速成为草原上的霸主，疆域东至辽海，西至西海。北齐、北周都争相结好突厥，每年送去大量丝绸。据《周书·突厥传》，突厥的佗钵可汗曾说，只要南边的两个儿子孝顺，何愁没有财物。
sources: []
recalled:
  - 《周书·突厥传》
  - 《北史·蠕蠕传》
  - 《资治通鉴》卷一百六十四至一百六十六
