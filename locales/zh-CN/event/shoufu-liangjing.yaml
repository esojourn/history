name: 收复两京
summary: 757 年唐军与回纥援兵在香积寺大败叛军，收复长安，随后又收复洛阳。
body: |-
  唐肃宗在灵武即位后，以郭子仪、李光弼统领朔方、河东等军，又征调安西、北庭的兵马，并向回纥借兵。至德二载（公元 757 年）二月他进驻凤翔。同年正月安禄山被儿子安庆绪杀死，叛军内部开始分裂（另见“安庆绪”条）。李泌建议先派兵北取范阳，断叛军的根本，再收复两京，肃宗急于收复长安，没有采纳。

  同年九月，广平王李俶任天下兵马元帅，郭子仪为副元帅，率朔方、安西、回纥等军队，据《资治通鉴》共十五万人，号称二十万，从凤翔出发进攻长安。回纥的葛勒可汗派太子叶护率四千余骑兵助战。据《资治通鉴》，肃宗事先与回纥约定，收复京城之日，土地和士民归唐朝，金帛和子女归回纥。两军在长安城南的香积寺以北展开决战，唐将李嗣业率步兵奋力冲杀，回纥骑兵从背后夹击，叛军大败，唐军随即收复长安。叶护要按约定抢掠，李俶在叶护马前下拜，请求等收复洛阳后再说，长安百姓因此免于劫掠。

  十月，唐军和回纥兵在陕州的新店再次大败叛军，安庆绪放弃洛阳，逃往河北邺城。回纥兵进入洛阳后大肆抢掠，据史书，洛阳的父老献上一万匹罗锦，抢掠才停止。同月唐肃宗回到长安，十二月太上皇唐玄宗也从成都回到长安。

  收复两京是安史之乱的转折点，但叛军的主力退回河北，史思明据守范阳，战争又持续了五年多。回纥因此功劳，此后每年从唐朝得到大量绢帛，并以马匹与唐朝交换绢帛，对唐朝的影响日益加深。
sources: []
recalled:
  - 《旧唐书·肃宗纪》
  - 《旧唐书·回纥传》
  - 《资治通鉴》卷二百一十九至二百二十
