name: 《永乐大典》编成
summary: 永乐年间编成的大型类书，二万二千多卷，后来大部分散失。
body: |-
  永乐元年（1403 年）永乐帝命翰林学士解缙主持编纂一部大书，要求把古今典籍中有关的内容按韵分类汇编在一起。次年解缙等人编成《文献大成》，永乐帝认为太过简略，又命太子少师姚广孝、解缙和礼部尚书郑赐等人重修，召集了两千多名文人参加，在南京文渊阁工作，永乐五年（1407 年）完成，次年抄写完毕，赐名《永乐大典》。

  据记载，《永乐大典》正文二万二千八百七十七卷，凡例和目录六十卷，装成一万一千零九十五册，约三亿七千万字，收录了先秦到明初的书籍七八千种，内容涉及经史子集、天文地理、医卜、技艺、戏曲、小说等。它按《洪武正韵》的韵目排列，把原书的整篇、整段甚至整部抄入，因此保存了许多后来失传的古籍。

  《永乐大典》只抄写了一部，迁都后存放在北京文楼。嘉靖四十一年（1562 年）嘉靖帝担心火灾，命人照原样抄写了一部副本，隆庆初年完成。永乐年间的正本此后下落不明，有人推测它随嘉靖帝葬入了永陵，没有证据。副本在清代存放于翰林院，乾隆年间编纂《四库全书》时，从中辑出了五百多种佚书。此后副本不断散失，1860 年英法联军和 1900 年八国联军进入北京时又遭劫掠焚毁，现存的只有四百多册，分散在世界各地。
sources: []
recalled:
  - 《明太宗实录》
  - 孙承泽《春明梦余录》
  - 《四库全书总目》
