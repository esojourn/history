name: "光荣革命"
summary: "1688 年荷兰执政威廉应邀渡海，赶走詹姆士二世，与玛丽共登英国王位。"
body: |-
  《历史的轨迹》第三十一章说，查理二世临终接受天主教，弟弟詹姆士二世继位，他是热诚的天主教徒，一心要在英国恢复天主教，与废除南特诏谕的路易十四合谋，宗教和政治的自由都面临危机。据一般记载，他任用天主教徒做军官，颁布宽容令，审判拒绝宣读宽容令的七位主教；1688 年 6 月他得了儿子，天主教王朝眼看要延续下去，七位英国贵族于是写信邀请威廉。

  该书说，英国人民在极度困境中向荷兰的威廉求救，威廉的妻子玛丽是詹姆士的女儿。1688 年 11 月威廉率军在托贝登陆，詹姆士众叛亲离，逃往法国；次年威廉与玛丽加冕为英国的国王和王后。这次政变几乎没有流血，史称光荣革命。

  第三十二章说，公理派、长老派、浸礼派和贵格派这些不同意者联合起来推翻了詹姆士二世，把威廉和玛丽送上王座，并借 1689 年的信仰容忍法案得到相当多的宗教自由。第三十一章说，有四百位英国教会教牧人员（包括七位主教）拒绝宣誓效忠新政权，被剥夺教职。1689 年的《权利法案》又限制王权，规定天主教徒不得继承王位。苏格兰随后也废除主教制，长老会成为苏格兰的国家教会（第三十九章）。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
