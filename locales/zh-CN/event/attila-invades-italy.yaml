name: 阿提拉入侵意大利
summary: 公元 452 年阿提拉攻入意大利北部，毁阿奎莱亚，会见教皇利奥一世后撤兵。
body: |-
  在高卢受挫的第二年，阿提拉翻过阿尔卑斯山东端进入意大利。埃提乌斯没有在山口设防，手里也没有足以迎战的兵力。匈人围攻阿奎莱亚三个月，城破后把它夷为平地；约达尼斯说，一百年后那里几乎看不出城的痕迹。随后帕多瓦、维罗纳、米兰、帕维亚等城相继陷落或开城。后世相传，逃到潟湖小岛上的难民建起了威尼斯，这是很晚才有的说法。

  皇帝瓦伦提尼安三世在罗马。朝廷派出使团，成员是两位做过高官的元老和罗马主教利奥一世，在明乔河边见到阿提拉。同时代的普洛斯佩尔只说，阿提拉对这位主教的到来十分高兴，下令停战，答应讲和，退回多瑙河对岸。彼得、保罗持剑在空中显现的故事是几百年后才出现的。

  撤兵另有实际的原因：许达提乌斯说，匈人军中遭了饥荒和疫病，东部皇帝马尔西安又派兵渡过多瑙河袭击匈人的本土。阿提拉临走仍扬言，不把霍诺里娅和她的嫁妆送来，明年还要再来。453 年他暴死，匈人的势力随之瓦解。
sources: []
recalled:
  - 约达尼斯《哥特史》第 42 章
  - 阿奎丹的普洛斯佩尔《编年史》452 年条
  - 许达提乌斯《编年史》452—453 年条
  - 普里斯库斯《历史》残篇
