name: 丕平献土
aliases:
  - 教皇国的建立
  - 法兰克人与教皇结盟
summary: 丕平两次击败伦巴第人，把拉文纳一带献给教皇，教皇国由此开始。
body: |-
  伦巴第人在 568 年进入意大利，占了北部和中部的大片地方。《历史的轨迹》第九章说，他们成为教皇随时的威胁；君士坦丁堡的皇帝离得太远，自己又要应付阿拉伯人，与教皇之间还有摩擦，无力保护罗马，“伦巴人把教皇推进了法兰克人保护的双臂中”。

  751 年伦巴第王艾斯图尔夫攻占拉文纳，东罗马在意大利北部的统治结束。同一年丕平在教皇撒迦利亚的赞同下取代墨洛温王朝称王。753 年底新教皇司提反二世越过阿尔卑斯山，次年 1 月见到丕平。据《教皇列传》，丕平在 754 年春的一次集会上答应为教皇夺回伦巴第人侵占的地方；7 月教皇在圣但尼膏立丕平父子。

  丕平第一次出兵把艾斯图尔夫围在帕维亚，对方答应交地，法兰克人一走就反悔，756 年初反而围攻罗马。丕平再次南下取胜。东罗马的使者赶来要求把拉文纳交还皇帝，据《教皇列传》，丕平回答说，他打仗是为了圣彼得，不是为了别人。圣但尼修道院院长逐城接收了拉文纳、里米尼等二十多座城的钥匙，连同一份赠予的文书放在罗马圣彼得的墓上。这份文书没有流传下来。

  《历史的轨迹》说，从此开始了所谓“教会领土”，教皇不但管理教会的事务，也成为属世的统治者，这种情况一直维持到 1870 年意大利统一。该书把向丕平求援的教皇记作撒迦利亚，实为司提反二世。差不多在这个时期，出现了一份托名君士坦丁皇帝的伪造文书，说他早已把罗马和西部各省赠给教皇，见“伪伊西多尔教令集”条。

  这次结盟的后果很深远：教皇从此依靠法兰克人而不是东罗马的皇帝，四十多年后丕平的儿子查理在罗马由教皇加冕。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第九章“教会组成联盟” https://wellsofgrace.com/books/spiritual/2000years/html/chapter11.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十章“教皇权势的发展” https://wellsofgrace.com/books/spiritual/2000years/html/chapter12.html"
