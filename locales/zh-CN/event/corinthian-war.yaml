name: 科林斯战争
summary: 底比斯、雅典、科林斯、阿尔戈斯在波斯资助下联合对抗斯巴达，以“大王和约”告终。
body: |-
  伯罗奔尼撒战争后，斯巴达独霸希腊，在各地派驻军长官，昔日的盟友底比斯和科林斯没有分到好处，日渐不满。公元前 396 年斯巴达国王阿格西劳斯二世出兵小亚细亚攻打波斯。据《奥克西林库斯希腊史》等记载，波斯派罗得岛人提摩克拉特斯带着金钱到希腊，联络各邦反对斯巴达的人。前 395 年，底比斯借福基斯与洛克里斯之间的边界冲突挑起战事。斯巴达两路出兵，吕山德不等另一路会合就进抵彼奥提亚的哈利阿图斯，在城下战死。雅典、科林斯、阿尔戈斯随即与底比斯结盟，同盟会议设在科林斯。

  前 394 年斯巴达在陆上两次取胜：先在科林斯附近的涅美亚河边击败联军，又由奉召从亚洲赶回的阿格西劳斯在科罗尼亚再胜。但同年 8 月，雅典人科农和波斯总督法那巴佐斯统领的波斯舰队在克尼多斯歼灭了斯巴达海军，斯巴达在爱琴海的统治瓦解。次年科农带着波斯的钱回雅典，重建了长墙。

  此后的战事集中在科林斯地峡一带，双方互筑工事相持，战争因此得名。科林斯在此期间与阿尔戈斯合并。前 390 年雅典将军伊菲克拉特斯用轻盾兵在莱凯翁附近歼灭一队斯巴达重装步兵。雅典还派色拉西布洛斯率舰队出海，重新联络爱琴海和海峡沿岸的城邦，他在前 388 年被杀。

  雅典的复兴使波斯感到不安。斯巴达人安塔尔基达斯前 392 年第一次赴萨迪斯议和未成，前 387 年他取得国王的支持，封锁了赫勒斯滂海峡。各邦被迫接受国王的敕令：小亚细亚的希腊城邦归波斯，其余各邦一律自治。科林斯与阿尔戈斯的合并和底比斯的彼奥提亚同盟都被拆散。斯巴达放弃了亚洲的希腊人，换来在希腊本土继续称霸十几年。
sources: []
recalled:
  - 色诺芬《希腊史》卷三第 5 章至卷五第 1 章
  - 狄奥多罗斯《历史丛书》卷十四第 81—110 章
  - 《奥克西林库斯希腊史》残篇
