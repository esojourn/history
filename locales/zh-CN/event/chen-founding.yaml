name: 陈霸先建陈
summary: 陈霸先袭杀王僧辩、击退北齐南侵后，557 年代梁建立陈朝。
body: |-
  江陵陷落、梁元帝被杀后，镇守建康的王僧辩和镇守京口的陈霸先拥立元帝之子萧方智为梁王。北齐也想控制江南，派兵护送当年在寒山被俘的梁宗室萧渊明南归称帝。王僧辩起初拒绝，战败后接受了北齐的条件，承圣四年（公元 555 年）迎萧渊明入建康即位。

  陈霸先反对此事。同年九月，他从京口出兵，突袭建康的石头城，杀死王僧辩，废黜萧渊明，改立萧方智为帝，即梁敬帝。王僧辩的部将和亲族引北齐军渡江，北齐两次出兵南下，太平元年（556 年）六月一度兵临建康城下。当时城中缺粮，据《资治通鉴》，陈蒨从外地运来三千石米和一千只鸭，陈霸先命人煮米烹鸭，士卒每人用荷叶包饭，夹着鸭肉吃饱后出战，在钟山一带大败齐军，俘杀北齐将领多人。江南的局势从此稳定下来。

  太平二年（557 年）十月，梁敬帝禅位，陈霸先即位，因先前受封为陈王，国号为陈，年号永定。次年，梁敬帝被杀。与此同时，梁将王琳在长江中游拥立梁宗室萧庄，与陈朝对抗，直到陈文帝时才被平定。

  陈朝建立时，长江以北已归北齐，巴蜀和江陵一带归西魏，疆域在南朝四朝中最小，人口也大为减少。陈朝共历五帝三十三年，589 年被隋所灭。
sources: []
recalled:
  - 《陈书·高祖纪》
  - 《资治通鉴》卷一百六十六至一百六十七
