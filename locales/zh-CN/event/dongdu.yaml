name: 营建东都
summary: 隋炀帝在汉魏洛阳故城以西营建东都，迁入富户，修建大型粮仓。
body: |-
  隋朝建都关中，但关中物产不足以供应京城，而控制关东和江南需要一个更居中的据点。隋炀帝即位后，于大业元年（公元 605 年）三月下诏营建东都，由杨素、宇文恺等人主持，城址选在汉魏洛阳故城以西，北依邙山，南对伊阙，洛水从城中穿过。

  据《资治通鉴》，营建东都每月役使丁夫二百万人，为修宫殿从江南、岭南采运大木奇石，役夫死者很多。东都在次年（606 年）正月建成，宫城、皇城位于城西北，外郭城的里坊布局与大兴城相近。炀帝下令把洛州城内的居民和各地的富商大贾数万户迁入东都，又在城中和附近修建了含嘉仓、回洛仓、兴洛仓等大型粮仓。同时他在城西修建西苑，据《资治通鉴》，苑周围二百里，苑内凿海，海中堆筑方丈、蓬莱、瀛洲诸山，宫观林立，炀帝常在月夜带领宫女骑马游园。东都同时又是新开的大运河的枢纽。

  此后炀帝大部分时间住在东都或巡游各地，很少回大兴城。隋末李密的瓦岗军夺取兴洛仓后，围攻东都，王世充在这里据守，后来又以此为都建立郑国。唐朝以长安为京城，以洛阳为东都，高宗、武则天时常居洛阳，武则天称帝后改称神都，城市格局基本沿用隋朝东都的规划。
sources: []
recalled:
  - 《隋书·炀帝纪》
  - 《资治通鉴》卷一百八十
