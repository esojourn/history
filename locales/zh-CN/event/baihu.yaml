name: 白虎观会议
summary: 公元 79 年，汉章帝召集诸儒在白虎观讨论五经异同，结果编为《白虎通义》。
body: |-
  汉代经学分为今文、古文两大派，每一经又有若干家，各有师承，对经文的解释多有出入。西汉宣帝曾在石渠阁召集儒生讨论五经异同。据《后汉书·章帝纪》，建初四年（公元 79 年）十一月，章帝采纳校书郎杨终的建议，仿照石渠阁的先例，下诏让将、大夫、博士、议郎、郎官及诸生、诸儒在北宫白虎观集会，“讲议五经同异”。

  据《后汉书·儒林列传》，讨论“连月乃罢”。由五官中郎将魏应秉承皇帝的旨意发问，侍中淳于恭把诸儒的意见上奏，章帝亲自裁决。参加者有丁鸿、贾逵、李育、班固等人。会后班固奉命把讨论的结论撰集成书，称《白虎通义》，也叫《白虎通》。

  今本《白虎通义》分为爵、号、谥、五祀、社稷、礼乐、封公侯、三纲六纪等数十个专题，逐一解释名物制度的含义，大量引用谶纬之说。书中对“三纲”作了系统表述，即君为臣纲、父为子纲、夫为妻纲。这部书代表了东汉官方认可的经学见解，对后世的礼制和伦理观念有长期影响。
sources: []
recalled:
  - 《后汉书·肃宗孝章帝纪》
  - 《后汉书·儒林列传》
  - 班固《白虎通义》
