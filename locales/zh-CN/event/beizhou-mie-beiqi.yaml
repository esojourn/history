name: 北周灭北齐
summary: 周武帝两度伐齐，576 年攻克平阳、晋阳，次年攻入邺城，北齐灭亡。
body: |-
  北齐后主在位时朝政腐败，先后杀害斛律光、兰陵王高长恭等名将。北周武帝亲政后整顿军队，禁断佛道以增加兵源和财力，又与陈朝通好，准备伐齐。

  建德四年（公元 575 年）七月，武帝第一次伐齐，从河南方向进攻洛阳一带，因病撤军。次年十月，他改从汾水河谷进攻，攻克北齐的晋州平阳。北齐后主率大军前来争夺，围攻平阳。十二月，武帝率军回救，在平阳城下与齐军决战，齐军大败，后主逃回晋阳，又逃往邺城。

  周军随即进攻晋阳。北齐安德王高延宗在晋阳称帝抵抗，与周军展开激烈的巷战，武帝一度身陷险境，最终攻克晋阳，俘获高延宗。建德六年（577 年）正月，后主把皇位传给八岁的太子高恒，周军随即包围邺城，城破后后主向东逃往青州，想投奔陈朝，途中被周军俘获。在信都抵抗的任城王高湝等人也很快失败，北齐灭亡。

  据《周书·武帝纪》，北周此役得到州五十、郡一百六十二、县三百八十，户三百余万。自 534 年北魏分裂以来四十多年的东西对峙结束，北方重新统一。武帝随后计划南伐陈朝、北击突厥，但次年就去世了。四年之后，杨坚代周建隋，在此基础上完成了全国的统一。
sources: []
