name: 柏拉图创办学园
summary: 柏拉图在雅典城外的阿卡德摩斯园林设立学园，欧洲“学院”一词由此而来。
body: |-
  约公元前 387 年，柏拉图从意大利和西西里游历归来，在雅典西北城墙外约一公里半的地方开始聚徒讲学。那里是一片祭祀英雄阿卡德摩斯的园林，有体育场，他在近旁置有一处小园和房舍。学园的名称“阿卡德米亚”就来自这个地名，后来成为欧洲各种语言里“学院”“学术”一词的来源。创办的年份没有直接记载，是由他四十岁左右回到雅典推算的。

  学园在法律上大概是一个祭祀缪斯女神的团体，不收学费，成员共同讨论、共同进餐。讲授和研究的内容除哲学外，以数学为重，柏拉图在《理想国》里把算术、几何、天文、和声学列为学习辩证法之前的准备。所谓门口写着“不懂几何者不得入内”的说法，出自近千年后的作者，不能当作事实。数学家泰阿泰德、欧多克索斯都与学园有来往；亚里士多德十七岁入学，在这里约二十年。学园还为一些城邦提供过立法方面的人才。

  约前 347 年柏拉图去世，外甥斯彪西波继任主持人，其后是色诺克拉底、波勒蒙。前 3 世纪中叶阿尔克西拉乌斯主持时，学园转向怀疑论，主张对一切判断存疑，与斯多亚派长期论战，史称“中期学园”；前 2 世纪的卡尔涅阿德斯是这一路的代表。前 86 年罗马将军苏拉围攻雅典时，学园所在的树林被砍去造攻城器械，作为一个连续机构的学园大约在这前后终止。

  公元 5 世纪雅典另有一所新柏拉图派的学校，自认为是柏拉图的继承者。529 年东罗马皇帝查士丁尼禁止异教徒讲学，这所学校随之关闭。后人常把这一年说成柏拉图学园延续九百年后的终点，其实前后两者并不是同一个机构。
