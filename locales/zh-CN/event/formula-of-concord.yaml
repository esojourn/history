name: "协同信条"
summary: "路德派为平息墨兰顿身后的教义争论而订的信条，1577 年拟成。"
body: |-
  《历史的轨迹》第三十八章说，墨兰顿一开始就是路德的密友与助手，后来结识慈运理，又与加尔文建立友谊，渐渐在某些教义上不能赞同路德。路德在世时他没有说出来，路德死后才让人知道，于是成为路德派中第一个明显的争论。据一般记载，争论涉及圣餐、善行在得救中的地位、人在归信中是否与神合作、对天主教礼仪可否让步等，坚持路德原意的一方被称为“真路德派”，墨兰顿一方被称为“腓力派”。

  该书说，墨兰顿去世多年后，1577 年订立了《协同信条》，这是对路德派主要教义表示一致的声明。据一般记载，它由安德烈埃、开姆尼茨等人在托尔高起草，在马格德堡附近的贝尔格修院定稿，1580 年与三大信经、《奥格斯堡信条》等合编为《协同书》，成为多数路德派邦国的信仰标准。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十八章“德国与英国的宗教生活” https://wellsofgrace.com/books/spiritual/2000years/html/chapter42.html"
recalled:
  - "《协同信条》（1577 年）"
  - "《协同书》（1580 年）"
