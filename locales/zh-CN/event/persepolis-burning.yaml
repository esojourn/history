name: 波斯波利斯王宫被焚
summary: 公元前 330 年亚历山大占领波斯波利斯数月后，王宫被大火焚毁，起因有两种说法。
body: |-
  高加米拉之战后，亚历山大取巴比伦和苏萨，公元前 331 年冬强行突破扎格罗斯山中的“波斯门”隘口，前 330 年 1 月前后进入波斯波利斯。这里是阿契美尼德王朝在波斯本土的礼仪都城，大流士一世和薛西斯一世的宫殿所在。据狄奥多罗斯和库尔提乌斯，亚历山大把城市（王宫除外）交给士兵劫掠，男子多被杀；金库里的金银，他们说有十二万塔兰特，他征调大批骡子和骆驼把它运走。

  军队在这里停留了约四个月。临走之前，王宫起火焚毁。起因有两种说法。狄奥多罗斯、库尔提乌斯和普鲁塔克的说法出自同一来源：在一次酒宴上，雅典名妓泰伊丝提议烧掉薛西斯的宫殿，为当年被他烧毁的雅典报仇，亚历山大带头举着火把，一群醉酒的人唱着歌把火点了起来；普鲁塔克补充说，亚历山大很快后悔并下令救火。泰伊丝后来是托勒密的伴侣。阿里安没有提酒宴，只说亚历山大是为报复波斯人入侵希腊、焚毁雅典神庙而有意烧宫，帕曼纽劝他不要毁掉已经属于自己的东西，他不听；阿里安自己也说这样做并不明智。

  现代学者中，有的认为这是经过考虑的举动，向希腊人表明复仇战争已经完成，向波斯人表明阿契美尼德的统治已经结束；有的认为酒后失控之说更近情理，因为此后他正要以大流士继承者的身份争取波斯贵族。考古发掘表明，过火最重的是薛西斯所建的几座殿堂，百柱殿和宝库的地面留有厚厚的灰烬，这与有意针对薛西斯的说法相合，但不足以定论。

  大火使宫中的泥板文书受到烘烤而保存下来，二十世纪发掘出的波斯波利斯城防泥板和宝库泥板成了研究波斯帝国行政的第一手材料。几个月后大流士三世在逃亡中被杀，亚历山大把他的遗体送回这里安葬。波斯波利斯此后只是一座省城，不远处的伊斯塔赫尔渐渐取代了它。
