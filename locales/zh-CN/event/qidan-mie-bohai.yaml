name: 契丹灭渤海
summary: 926 年耶律阿保机东征，攻破渤海都城忽汗城，改渤海为东丹国，同年阿保机病死。
body: |-
  渤海国是七世纪末由粟末靺鞨人大祚荣建立的政权，据有今中国东北东部、朝鲜半岛北部和俄罗斯远东的一部分，长期接受唐朝的册封，文化发达，被称为“海东盛国”。

  天赞四年（公元 925 年）十二月，耶律阿保机亲率大军东征渤海，皇后述律平、皇太子耶律倍、次子耶律德光都随军出征。契丹军先攻下渤海的军事重镇扶余府，随后进围渤海的都城忽汗城。天显元年（926 年）正月，渤海末代国王大諲譔出城投降，渤海国灭亡。

  阿保机把渤海改名为东丹国，意为“东契丹”，改忽汗城为天福城，封皇太子耶律倍为人皇王，统治东丹国，沿用渤海旧有的官制。同年七月，阿保机在回师途中病死于扶余府。此后东丹国的地位逐渐下降，耶律德光即位后，把东丹的都城和许多渤海人迁到辽东。

  契丹吞并渤海后，东北的大片土地和人口归其所有，国力大增，此后得以全力南下，干预中原的政局。渤海的遗民有一部分逃到朝鲜半岛，投奔了高丽。
sources: []
recalled:
