name: 桓玄篡位与刘裕起兵
summary: 桓玄攻入建康后废晋安帝，自立为楚帝，不到三个月被刘裕等北府将领起兵推翻。
body: |-
  晋安帝即位后，朝政由司马道子、司马元显父子把持，镇守京口和荆州的方镇两次起兵反对。桓温的儿子桓玄在混战中吞并了荆州、江州等地，占有东晋三分之二的疆土。朝廷能够直接控制的只剩三吴，那里又因孙恩起事而残破。

  元兴元年（公元 402 年）正月，司马元显下诏讨伐桓玄，以北府将领刘牢之为前锋。桓玄抢先东下，刘牢之对司马元显不满，不战而降。三月桓玄进入建康，杀司马元显，流放司马道子，自己总揽朝政。他随即调刘牢之离开北府，刘牢之想再次起兵而部下离散，自缢而死，北府的旧将多被杀害。

  桓玄出镇姑孰遥控朝廷，元兴二年（403 年）十二月逼安帝写下禅位诏书，即皇帝位，国号楚，把安帝迁到寻阳。次年二月，在北府军中任中级将领的刘裕与刘毅、何无忌等人密谋，同一天在京口、广陵等地起事，杀了桓玄派在那里的将领。据《宋书·武帝纪》，刘裕在京口聚众一千七百人，向建康进军，接连击败桓玄派来的军队。三月初，桓玄弃城西逃，带着安帝回到江陵。

  五月，刘毅等率军西上，在峥嵘洲再败桓玄，桓玄在逃往蜀地的途中被杀。桓氏的余部在荆州又抵抗了近一年。义熙元年（405 年）安帝回到建康，朝政从此由刘裕掌握，东晋高门大族执政的局面到此结束。
sources: []
recalled:
  - 《晋书·桓玄传》
  - 《宋书·武帝纪上》
  - 《资治通鉴》卷一百一十二、一百一十三
