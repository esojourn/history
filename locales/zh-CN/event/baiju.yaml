name: 柏举之战
summary: 前 506 年吴王阖闾联合唐、蔡伐楚，在柏举大败楚军，五战五胜，攻入楚都郢。
body: |-
  吴王阖闾任用伍子胥、孙武、伯嚭，经过多年整顿，又不断派兵骚扰楚国边境，使楚军疲于奔命。公元前 506 年，楚国围攻蔡国，蔡、唐两国因受楚国欺凌而向吴国求援。阖闾亲率大军，与唐、蔡联合伐楚。

  据《左传》定公四年，吴军乘船沿淮河西进，然后舍舟登陆，穿过大隧、直辕、冥阨等关隘，直抵汉水。楚令尹囊瓦（子常）率军隔汉水对阵，起初与左司马沈尹戌商定前后夹击，但子常贪功，抢先渡过汉水进攻，三战不利。十一月，两军在柏举决战，阖闾之弟夫概率部先攻子常的部队，楚军溃败，子常逃往郑国。吴军乘胜追击，在清发、雍澨等地连胜，五战五捷，攻入郢都，楚昭王出逃。

  据《史记·伍子胥列传》，伍子胥掘开楚平王的坟墓，鞭尸三百。楚大夫申包胥到秦国求救，在秦廷哭了七天七夜，秦哀公终于出兵救楚。这时吴国后方的越国也乘虚进攻，夫概又回国自立为王，阖闾只得撤兵。柏举之战是春秋后期规模最大的战役之一，吴国由此威震中原。孙武是否参加此战，《左传》没有记载，仅见于《史记》。

  申包胥“哭秦庭”的故事流传极广，《左传》说他“立依于庭墙而哭，日夜不绝声，勺饮不入口七日”，秦哀公终于出兵。
sources: []
recalled:
  - 《左传》定公四年至五年
  - 《史记·伍子胥列传》
  - 《史记·吴太伯世家》
