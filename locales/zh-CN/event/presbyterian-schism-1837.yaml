name: "长老会新旧两派分裂"
summary: "1837 年美国长老会传统派与自由派决裂，分裂持续三十二年。"
body: |-
  《历史的轨迹》第四十五章说，在 1801 年“联合计划”下成立的许多教会，由新英格兰公理派和苏格兰裔爱尔兰长老派组成；多数长老派信徒接受加尔文主义，公理派信徒则受新英格兰自由神学影响，越来越远离传统的加尔文信仰。1837 年长老会的传统派与自由派发生强烈冲突，造成分裂，这次分裂持续了三十二年。分裂前一年，自由派已在纽约设立协和神学院，书中说它今天仍是美国自由神学的发源地。

  据一般记载，这次分裂中传统的一方称“旧派”，另一方称“新派”；1837 年在费城召开的总会上，占多数的旧派废止了联合计划，并把依此计划成立的四个议会开除出去，新派随即另组总会。除了神学和行政上的分歧，对奴隶制的态度也是背景之一。内战期间南北又各自分裂，北方的新旧两派 1869 年重新合一，正合书中所说的三十二年。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
