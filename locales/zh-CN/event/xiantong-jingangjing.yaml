name: 咸通本《金刚经》
summary: 868 年刊印的《金刚经》，出自敦煌藏经洞，是现存最早有明确纪年的印本书籍之一。
body: |-
  这是一卷用雕版印刷的佛经《金刚般若波罗蜜经》，由七张纸粘接而成，全长五米多（据现代测量）。卷首是一幅释迦牟尼说法的版画，卷末刻有一行题记，写明是咸通九年四月十五日（公元 868 年）王玠为父母祈福而敬造、普施于人的。

  这卷佛经原本保存在敦煌莫高窟的藏经洞中。1900 年藏经洞被道士王圆箓发现，1907 年英国探险家斯坦因从王圆箓手中购得大批写本和印本，其中就有这卷《金刚经》，现藏英国国家图书馆（原属大英博物馆）。

  这卷经文的刻工精细，图文清晰，说明雕版印刷在九世纪中叶已经相当成熟。它常被称为世界上现存最早的有明确纪年的印刷书籍；更早的印刷品如韩国发现的《无垢净光大陀罗尼经》没有刊印纪年，年代存在争议。据史料记载，唐代后期在成都、长安、扬州等地已经有人刻印历书、字书和佛经出售。
sources: []
recalled:
  - 敦煌藏经洞出土咸通九年《金刚般若波罗蜜经》题记
  - 斯坦因《西域考古图记》
