name: "爱丁堡世界宣教大会"
summary: "1910 年在爱丁堡召开的国际宣教会议，被看作二十世纪普世合一运动的起点。"
body: |-
  《历史的轨迹》第四十九章说，普世基督教协会的成立要追溯到 1910 年在爱丁堡举行的国际宣教会议；那虽然只是一次宣教会议，不是教会协会，但许多教会在会上看到了彼此合作的可能。书中说，这次会议的冲击带出了三个重要运动：几年后成立的国际宣教协会，继续讨论宣教问题，为各宣教机构提供意见；1925 年在斯德哥尔摩、1937 年在牛津举行的“生活与工作”世界会议，讨论教会对社会的关怀和行动；1927 年在洛桑、1937 年在爱丁堡举行的“信仰与教制”世界会议，讨论各宗派教义和教会行政的差异。

  据一般记载，大会 1910 年 6 月召开，有一千二百多位代表，绝大多数来自英美和欧洲的复原教差会，来自亚洲、非洲教会的代表只有十几位；主席是穆德，口号承接他的“在这一代把福音传遍世界”。会议有意不讨论教义分歧，以便各宗派都能参加。国际宣教协会 1921 年成立，1961 年并入普世教会协会。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十九章“教会联盟与联合” https://wellsofgrace.com/books/spiritual/2000years/html/chapter54.html"
