name: 前燕建立与入主中原
summary: 鲜卑慕容部在辽西称燕王，后赵崩溃后南下占领河北，慕容儁称帝，与东晋、前秦鼎立。
body: |-
  鲜卑慕容部在西晋时定居辽西，首领慕容廆接受晋朝的封号，仿照中原设官立学，收容了大批从河北、山东逃来的士人和流民，为他们按原籍设立侨郡。咸康三年（公元 337 年），他的儿子慕容皝自称燕王，史称前燕。此后十余年，前燕顶住了后赵石虎的进攻，东破高句丽，北灭宇文部，并把都城迁到龙城，成为辽河流域的强国，名义上仍奉东晋正朔。

  永和五年（349 年）石虎死后后赵大乱，继位的慕容儁听从弟弟慕容恪、慕容垂的建议出兵南下，次年攻取蓟城并迁都于此。永和八年（352 年）慕容恪在廉台擒获冉闵，燕军随后攻下邺城。同年十一月慕容儁称皇帝，对东晋的使者说，你回去告诉你们的天子，我已被中原人推为皇帝了。此语见《晋书·载记》。

  前燕后来迁都邺城，占有今河北、山东、山西和河南大部，与关中的前秦、江南的东晋并立近二十年，太和五年（370 年）为前秦所灭。
sources: []
