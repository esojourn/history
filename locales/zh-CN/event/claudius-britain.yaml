name: 克劳狄征服不列颠
summary: 公元 43 年罗马四个军团渡海，占领不列颠东南部，设立行省。
body: |-
  恺撒在公元前 55 年和前 54 年两次渡海到不列颠，都没有留驻。此后近百年，不列颠南部的王与罗马互通使节。卡图维劳尼人的王库诺贝林死后，两个儿子向外扩张，被逐的阿特雷巴特人首领逃到罗马求助。新即位的克劳狄没有军功，正需要一场胜利。

  公元 43 年夏，普劳提乌斯率四个军团和辅助部队渡海，总数一般估计在四万人上下；登陆地点多认为在肯特的里奇伯勒，也有人主张在南岸。士兵起初不肯上船去“世界之外”的地方，据卡西乌斯·狄奥，是皇帝的获释奴隶那喀索斯出面讲话，才把他们激上了船。罗马军在梅德韦河边打了两天，再渡泰晤士河，然后停下来等候皇帝。克劳狄带着增援和几头大象赶到，亲自指挥攻下对方的都城卡穆洛杜努姆，接受十一位王的归降，在岛上只住了十六天。元老院授给他和他的儿子“不列塔尼库斯”的称号。

  后来做了皇帝的韦斯巴芗当时率第二军团向西南进军，苏维托尼乌斯说他打了三十仗，攻下二十多座山寨和怀特岛。到 47 年，罗马控制了从亨伯河口到塞文河口一线以南的地方。卡穆洛杜努姆安置了退伍老兵，建起奉祀克劳狄的神庙。抵抗的首领卡拉塔库斯退到威尔士山区，51 年被俘押到罗马，塔西佗记下了他在克劳狄面前的陈词，克劳狄赦免了他。

  罗马人在不列颠的统治延续到五世纪初。征服并不彻底：60 年前后有布狄卡起事，北部要到阿古利可拉任总督时才打下，苏格兰高地始终在行省之外。
sources: []
recalled:
