  - 苏维托尼乌斯《罗马十二帝王传·克劳狄传》第 17 章、《韦斯巴芗传》第 4 章
  - 塔西佗《编年史》卷 12 第 31—40 章
  - 塔西佗《阿古利可拉传》第 13—14 章
