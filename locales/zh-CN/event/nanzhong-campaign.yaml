name: 诸葛亮南征
summary: 公元 225 年，诸葛亮率军平定南中各郡的反叛，稳定了蜀汉的后方。
body: |-
  南中指蜀汉南部的益州、永昌、牂柯、越嶲等郡，在今云南、贵州和四川西南部，居民以当地各族为主，由汉人大姓和部族首领共同控制。章武三年（公元 223 年）刘备去世前后，益州郡的大姓雍闿杀死太守，又把继任的太守捆送吴国，接受孙权的官号；牂柯太守朱褒、越嶲的部族首领高定也相继起兵。诸葛亮因国家新遭大丧，没有立即用兵，先派使者与吴国修好。

  据《三国志·蜀书·诸葛亮传》等，建兴三年（225 年）春，诸葛亮率军南征。蜀军分为三路：诸葛亮本人由越嶲进兵，马忠攻牂柯，李恢从平夷南下益州郡。这时雍闿已在内部冲突中被杀，孟获接替他统率部众。五月诸葛亮渡过泸水，到秋天，各郡全部平定。

  裴松之注引《汉晋春秋》记载，诸葛亮听说孟获为当地汉人和各族所信服，下令务必生擒；捉到后让他观看蜀军的营阵，然后放回再战，前后七擒七纵，孟获终于心服，说“南人不复反矣”。又引《襄阳记》说，出兵前马谡向诸葛亮建议“攻心为上，攻城为下”。这两则故事都不见于陈寿的正文。

  战后诸葛亮把南中的郡重新划分，增设了几个郡，仍任用当地的首领和大姓管理，不留驻大军；同时征调当地的金、银、丹砂、漆、耕牛、战马以供军国之用，并把一部分青壮编入军队。此后南中虽然仍有零星的反抗，大体保持安定，诸葛亮得以集中力量北伐。
sources: []
recalled:
  - 《三国志·蜀书·诸葛亮传》及裴松之注引《汉晋春秋》《襄阳记》
  - 《三国志·蜀书·黄李吕马王张传》
  - 常璩《华阳国志·南中志》
