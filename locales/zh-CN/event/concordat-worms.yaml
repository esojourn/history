name: 沃尔姆斯协定
aliases:
  - 沃木斯协约
  - 授职权之争的结束
summary: 1122 年教皇与皇帝亨利五世订约，结束主教授职权之争。
body: |-
  《历史的轨迹》第十六章说明了授职权为什么成了生死攸关的事：只要世俗君主有权指派主教并授给职位，主教就替君主出力而不替教会出力，教皇得不到这个权柄就不能改革教会；而主教和修道院院长在德意志同时是握有大片土地的封臣，皇帝若管不住他们，就压不住贵族，有失去帝位的危险。

  贵格利七世 1085 年死后，争斗在继任的教皇与亨利四世、亨利五世之间继续。《历史的轨迹》说又继续了三十五年；从 1085 年到 1122 年是三十七年。其间出现过几种解决的思路：1107 年英格兰国王放弃用戒指和权杖授职，主教为所领的土地向国王效忠；1111 年教皇帕斯加二世提出让主教交还全部封地以换取选举自由，遭到主教和诸侯一致反对，亨利五世扣押教皇，逼他让步，事后教皇又收回。法国的教会法学者则把主教的职分与他所领的产业分开来看。

  1122 年 9 月 23 日，教皇加里斯都二世的使节与亨利五世在沃尔姆斯城外交换文书。皇帝放弃用戒指和牧杖授职，保证教会自由选举和祝圣。教皇同意：德意志境内的主教和修道院院长在皇帝或其代表面前选举，不得行贿或用强；选举有争执时，皇帝听取本省大主教和主教的意见后裁决；当选的人在祝圣之前由皇帝以权杖一触授予封地，并为此尽封臣的义务。在勃艮第和意大利，则是祝圣之后六个月内授予封地。该书的概括是：教皇授予属灵职位的象征，即戒指与杖；皇帝以“权杖之触”授予封地。

  次年教皇在罗马召开第一次拉特兰会议，确认了协定。该书把这一章题为“教会被迫妥协”：贵格利七世要的是政府服在教会之下，最后得到的是两方各让一步。在德意志，皇帝对主教人选仍有很大的影响；在意大利，他的影响大为减弱。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十六章“教会被迫妥协” https://wellsofgrace.com/books/spiritual/2000years/html/chapter18.html"
recalled:
  - 1122 年 9 月 23 日《沃尔姆斯协定》的皇帝文书与教皇文书
  - 奥拉的埃克哈德《编年史》
  - 1123 年第一次拉特兰会议教规
