name: 克里特诸宫殿被毁
summary: 约公元前 1450 年克里特岛各处宫殿被毁，此后克诺索斯改用希腊语记账。
body: |-
  克里特岛上的青铜时代文明，现代人按传说中的国王米诺斯称为“米诺斯文明”。约公元前 1900 年起，岛上的克诺索斯、法伊斯托斯、马利亚等地出现了围绕中央庭院修建的大型建筑群，通称宫殿，里面有仓库、作坊、档案和壁画。岛上的人使用一种今天称为“线形文字 A”的文字，至今没有读通，他们说的是什么语言也不清楚。1900 年起英国人伊文思发掘克诺索斯，这一文明才重新为人所知。

  约前 1450 年，克里特各地的宫殿和庄园大多毁于火，只有克诺索斯继续使用。此后克诺索斯出土的泥板改用“线形文字 B”书写。1952 年英国人文特里斯读通了这种文字，证明它记录的是希腊语，可见这时掌管克诺索斯的是说希腊语的人，一般认为来自希腊本土的迈锡尼世界。各地宫殿是毁于本土人的征服、岛内的战乱还是地震，没有定论。克诺索斯的宫殿后来也毁于大火，年代有前 14 世纪和前 13 世纪等不同看法。

  爱琴海上的锡拉岛（今圣托里尼）在青铜时代有过一次猛烈的火山喷发，掩埋了岛上的阿克罗蒂里。过去有人认为是这次喷发毁灭了克里特文明，但它比宫殿被毁要早几十年以至一百多年；喷发的年代，考古学的推定与碳十四等科学测年之间相差约一个世纪，至今还在争论。

  这一条所说的年代都是考古学上的推定，没有文字记载可据。希腊人后来关于米诺斯王、迷宫和牛头怪的传说，被认为保留了对这个时代的模糊记忆。
sources: []
recalled:
  - 伊文思《克诺索斯的米诺斯宫殿》（1921—1935）
  - 文特里斯、查德威克《迈锡尼希腊语文献》（1956）
