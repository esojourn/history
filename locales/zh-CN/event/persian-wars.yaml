name: 希波战争
summary: 公元前 499 年至前 449 年希腊诸邦与波斯帝国之间的一系列战争。
body: |-
  公元前 6 世纪中叶，居鲁士灭吕底亚，小亚细亚沿岸的希腊城邦落入波斯治下。前 499 年这些城邦在米利都带领下起义，雅典和厄瑞特里亚派船相助，起义在前 493 年被平定。大流士随后把矛头指向希腊本土：前 492 年马铎尼斯的远征因舰队遇风暴而中止；前 490 年另一支军队渡海而来，在马拉松被雅典人击败。

  前 480 年薛西斯亲率陆海大军入侵。希腊有三十来个城邦结成同盟，推斯巴达为首；更多的城邦保持中立或归顺了波斯。联军先在温泉关和阿提密西安阻击，失守后退到科林斯地峡和萨拉米斯。波斯军占领雅典，随即在萨拉米斯海战中失利，薛西斯回国。前 479 年留下的波斯陆军在普拉提亚被歼，舰队在小亚细亚的米卡勒被毁。

  此后战争转到爱琴海和小亚细亚沿岸，由雅典领导的提洛同盟进行。约前 466 年客蒙在欧律墨冬河口大胜。前 460 年代末雅典派大舰队支援埃及的反波斯起义，几年后全军覆没。前 450 年客蒙死于塞浦路斯远征。

  战争怎样结束，是一桩公案。公元前 4 世纪的演说家和后来的狄奥多罗斯说，约前 449 年雅典人卡利阿斯出使苏萨，与波斯订立和约，波斯承诺军队不靠近爱琴海沿岸，战船不驶入爱琴海。但修昔底德没有提到这份和约，前 4 世纪的史家忒奥庞波斯已指为伪造。可以确定的是，前 449 年以后双方不再交战。

  这场战争的主要史料是希罗多德的《历史》，以及亲历者埃斯库罗斯的悲剧《波斯人》，都出自希腊一方；波斯方面没有留下叙事性的记载。希腊人把这次胜利看作自由的城邦战胜专制的帝国，这种看法影响了后世欧洲对“东方”与“西方”的想象。
sources: []
recalled:
  - 希罗多德《历史》卷五至卷九
  - 修昔底德《伯罗奔尼撒战争史》卷一第 89—117 章
  - 狄奥多罗斯《历史丛书》卷十一；卷十二第 4 章
