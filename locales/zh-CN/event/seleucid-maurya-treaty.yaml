name: 塞琉古与旃陀罗笈多订约
summary: 约公元前 303 年塞琉古一世让出印度河以西若干地区，换得五百头战象。
body: |-
  亚历山大离开印度后，他在印度河流域设置的总督和驻军没有维持多久。旃陀罗笈多在前 320 年前后建立孔雀王朝，据尤斯丁，他赶走了马其顿人留下的长官，把印度西北并入版图。塞琉古一世在公元前 312 年重回巴比伦后，用几年时间收取伊朗高原和巴克特里亚各省，约前 305 年越过印度河，与旃陀罗笈多相遇。

  两人是否打过仗、胜负如何，现存史料都没有说。阿庇安只说塞琉古“渡过印度河与印度人的国王作战，直到彼此结好并联姻”；尤斯丁说他“与旃陀罗笈多订约，安顿了东方事务”之后回去对付安提柯。订约的时间约在前 303 年，地点没有记载。

  和约的内容主要见于斯特拉波：塞琉古把原属波斯、位于印度河沿岸及其以西的若干地区让给旃陀罗笈多，双方缔结了婚姻方面的约定，塞琉古得到五百头战象。让出的地区，斯特拉波的文字不很明确，结合老普林尼的记载，一般认为包括兴都库什山以南的帕罗帕米萨代、阿拉霍西亚（今坎大哈一带）和格德罗西亚的一部分；有的学者认为还包括阿里亚（今赫拉特一带），这一点有争议。所谓婚姻约定，可能是两个王室通婚，也可能是承认两国人民之间的通婚，史料没有交代谁娶了谁。五百这个数字有人怀疑偏大，但塞琉古两年后带到伊普苏斯的战象确有四百头以上。

  从结果看，塞琉古放弃了难以防守的东南边地，换来东方的安定和一支决定性的象军。前 301 年他在伊普苏斯靠战象挡住德米特里的骑兵，击败安提柯。两国此后保持来往：塞琉古派麦加斯梯尼出使华氏城，后者写了《印度志》；下一代的安条克一世派过使节戴马科斯，旃陀罗笈多之子宾头娑罗曾向安条克求购无花果干、葡萄酒和一位哲学家。1958 年在坎大哈发现的阿育王希腊文、阿拉米文双语诏敕，证明这一带在前 3 世纪中叶确属孔雀王朝，当地仍有希腊居民。
