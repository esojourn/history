name: "特兰托公会议"
summary: "1545—1563 年罗马教会的公会议，针对新教申明教义，整顿教士与教区。"
body: |-
  路德从 1518 年起就要求召开自由的公会议，皇帝查理五世也一再催促，教皇们怕会议压过教皇，法国又不愿皇帝借此统一德意志，一拖二十多年。《历史的轨迹》第二十九章说，最后教皇保罗三世在意大利北部山区的小城特兰托召集了会议，从 1545 年到 1563 年间断地举行，其中有两次长达数年的休会。特兰托在帝国境内而靠近意大利，是双方都能接受的地点。

  第一期 1545 年 12 月开幕，到会的主教起初只有三十来位，多数是意大利人。会议议定：圣经与使徒传下来的传统同受尊敬；拉丁文武加大译本是公用的标准本，旧约包括新教不收的几卷；人的称义不单凭信，也要人与恩典合作，称义后所行的善工有功劳。1547 年因瘟疫和教皇与皇帝失和，会议迁往博洛尼亚而中断。第二期 1551 至 1552 年，重申化质说、告解和终傅，有几位德意志新教的代表到了会，没有谈成；萨克森的莫里茨起兵，会议散去。

  隔了十年，教皇庇护四世重开第三期，1562 至 1563 年，法国和西班牙的主教来了不少。这一期确认弥撒是献祭，平信徒只领饼已经足够，保留炼狱、圣徒敬礼和赎罪券而禁止借此敛财；规定主教必须住在自己的教区、定期巡视，不得兼领几个教区，每个教区要设修院培养司铎，结婚须在司铎和证人面前举行。主教的权柄是直接来自神还是经由教皇，争得最久，没有作出裁定。

  1564 年教皇批准全部教令，随后颁布信经、教理问答、禁书目录以及修订的日课经和弥撒经书。该书说，会议纠正了许多弊端，为教士预备了更好的教育，更坚定地肯定了教皇的最高权柄；教会的本质没有改变，为对抗新教反而更高举原有的体系。新教徒从此面对的是一个经过整顿的罗马教会，双方的界线也划定了。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十九章“罗马教会从事改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter32.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
