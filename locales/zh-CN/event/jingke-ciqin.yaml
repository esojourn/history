name: 荆轲刺秦王
summary: 前 227 年燕太子丹派荆轲献图入秦，在咸阳宫图穷匕见，刺杀秦王未成，荆轲被杀。
body: |-
  公元前 228 年秦国攻破赵都邯郸，秦军进驻燕国南境，燕国危在旦夕。燕太子丹早年在秦国做人质时受秦王冷遇，逃回后一心报复，经田光推荐结识了卫人荆轲，请他入秦劫持或刺杀秦王。据《史记·刺客列传》，太子丹的设想是：能劫持秦王，逼他归还侵占诸侯的土地最好；不成，就刺杀他，使秦国大将在外、国内生乱，诸侯再趁机合纵破秦。

  为了取得秦王的信任，荆轲带上逃将樊於期的首级和燕国督亢一带的地图，地图中卷着淬过毒的匕首，以秦舞阳为副手。出发时太子丹和宾客穿着白衣在易水边送别，高渐离击筑，荆轲唱“风萧萧兮易水寒，壮士一去兮不复还”。

  秦王在咸阳宫隆重接见燕国使者。荆轲献上地图，图卷打开到最后露出匕首，这就是成语“图穷匕见”的出处。荆轲抓住秦王的衣袖行刺，没有刺中，秦王挣断衣袖，绕柱奔逃。殿上群臣按秦法不得持兵器，殿下卫士没有命令不得上殿，场面一片混乱。侍医夏无且用药囊投击荆轲，秦王在左右提醒下把剑推到背后拔出，砍断荆轲的左腿。荆轲掷出匕首，击中铜柱，最后被杀。

  刺杀失败后，秦王加派军队，命王翦攻燕，公元前 226 年攻破燕都蓟，燕王喜逃往辽东，后来斩太子丹的首级献秦求和。公元前 222 年燕国被秦所灭。这次刺杀没有改变秦统一的进程，但荆轲的故事流传极广，《战国策·燕策三》与《史记》的记载基本相同，学者认为二者有共同的来源。
sources: []
recalled:
