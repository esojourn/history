name: 高卢人洗劫罗马
summary: 高卢塞农人在阿利亚河击溃罗马军队，占领并洗劫罗马城，收取赎金后撤走。
body: |-
  传统上定在公元前 390 年，按波利比乌斯的希腊纪年推算则是前 387 年或前 386 年，后一个年份更可靠。此前一二百年间，高卢人陆续翻过阿尔卑斯山，占据了波河流域。塞农人在首领布伦努斯率领下南下，围攻伊特鲁里亚城市克鲁西乌姆。据李维，前去调解的罗马使节参加了战斗，高卢人索要凶手不成，转攻罗马。

  两军在罗马以北约十八公里、阿利亚河汇入台伯河的地方相遇。罗马军队被高卢人的冲锋击溃，大部分人逃进了维爱，少数逃回罗马。这一天是 7 月 18 日，后来在罗马历书上成为不宜办事的“阿利亚日”。高卢人在几天后进城。壮丁退守卡皮托利山，维斯塔贞女带着圣物逃到凯雷；城市遭焚掠。传说高卢人夜间攀上卡皮托利山，守卫和狗都没有察觉，朱诺的圣鹅叫了起来，前执政官曼利乌斯把爬上来的人推下山崖。

  围困持续了七个月，双方都受饥饿和疫病之苦。最后议定罗马人付一千磅黄金，高卢人撤走。称量时布伦努斯把剑扔上天平，说“战败者活该倒霉”，这是李维的记载。李维接着说，流亡的卡米卢斯已被任命为独裁官，恰在此时赶到，宣布协议无效，全歼高卢人。波利比乌斯的说法是高卢人因家乡遭维内蒂人入侵，拿了赎金撤走。现代学者一般认为罗马确实付了赎金。

  考古上没有发现全城被毁的灰烬层，破坏可能没有传说的那么重。但影响是长远的：罗马人说早期的记录都毁于这场火；此后几十年里罗马修筑了约十一公里长的石头城墙，即所谓“塞尔维乌斯城墙”。拉丁盟友一度离心。高卢人成了罗马人最惧怕的敌人，直到恺撒征服高卢。
sources: []
recalled:
