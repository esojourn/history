name: 王敦之乱
summary: 大将军王敦以清君侧为名从武昌攻入建康，控制朝政；两年后再度起兵，病死军中。
body: |-
  东晋建立之初，王导在朝主政，他的堂兄王敦以大将军、江州牧坐镇武昌，统辖长江中上游的军队。晋元帝不愿长久受制于王氏，即位后重用刘隗、刁协。这两人主张以法度约束权贵，得罪了许多大族。大兴四年（公元 321 年），元帝征发扬州各郡大族家中的僮客充兵，以北伐为名，派戴渊镇合肥、刘隗镇淮阴，实际上是防备王敦。大族的利益受损，对朝廷多有怨言。

  永昌元年（322 年）正月，王敦在武昌起兵，上表列举刘隗的罪状，说只要刘隗的头早晨悬出，他晚上就退兵。元帝召戴渊、刘隗回师保卫建康，并下诏亲征。王导每天带着族中子弟到宫门外请罪，元帝仍让他任前锋大都督。三月，王敦的军队到达石头城，守将周札开门投降，朝廷各军反攻失利。刁协出逃时被杀，刘隗投奔后赵。

  王敦入城后拥兵不朝，放任士兵抢掠。元帝派人对他说，如果还没有忘记朝廷，就此息兵，天下还可以相安；不然的话，我回琅邪去，给贤者让路。此语见《晋书·元帝纪》。王敦杀了素有声望的周顗和戴渊，自任丞相，然后回到武昌，把自己的亲信安插到各州。同年闰十一月，元帝忧愤而死，明帝即位。

  第二年王敦移镇姑孰，自领扬州牧，逼近建康。太宁二年（324 年）他病重，亲信钱凤等劝他趁活着起事。明帝得到温峤的报告，抢先下诏讨伐，任王导为大都督，并调驻在江北的流民帅苏峻、刘遐等带兵入援。王导在建康率族人为王敦发丧，众人以为王敦已死，士气大振。王敦已不能起床，派兄长王含和钱凤率五万人进攻建康。七月，叛军在秦淮河南岸被朝廷军队夜袭击败，王敦得到败报后不久病死。苏峻等率精兵赶到，叛军溃散，王含、钱凤、沈充先后被杀。

  事后朝廷掘出王敦的尸体斩首，对王导等王氏族人不加追究。这场变乱显示出东晋的皇帝无力压倒大族，一家大族也无法独占天下。为平叛而调来的苏峻等流民帅由此得势，几年后又酿成一场更大的破坏。
sources: []
