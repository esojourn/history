name: 宋灭后蜀
summary: 964 年底宋军两路伐蜀，次年正月孟昶投降，后蜀灭亡。
body: |-
  后蜀据有四川，国主孟昶在位已经三十年。宋平荆南、湖南以后，孟昶感到威胁，派人带着蜡丸书信去联络北汉，约定共同夹击宋朝，信使却把书信交给了宋朝。赵匡胤以此为理由出兵。

  乾德二年（公元 964 年）十一月，宋军分两路伐蜀：北路由王全斌率领，从凤州南下，沿嘉陵江而进；东路由刘光义（后改名刘廷让）率领，从归州溯长江而上，曹彬任东路都监。北路军连破兴州、利州、剑门，东路军攻破夔州的江防，两路向成都进逼。蜀军接连溃败，乾德三年（965 年）正月孟昶出城投降，后蜀灭亡。孟昶被送到开封，封为秦国公，不久去世（另见“孟昶”条）。

  灭蜀以后，王全斌等将领纵容部下抢掠，又克扣投降蜀军的钱粮，引发了蜀军的叛乱，叛军推举全师雄为首领，四川各地纷纷响应，宋军用了两年左右才平定。据《宋史·曹彬传》，诸将中只有曹彬约束部下，不取财物，赵匡胤因此处分了王全斌等人，更加器重曹彬。后蜀宫中的财物和府库积蓄被大批运往开封，增强了宋朝的财力。四川此后成为宋朝重要的财赋来源，宋朝对这一地区长期防范较严，这与后来王小波、李顺起义的发生也有关系（另见该条）。孟昶的妃子花蕊夫人随之入宋，她的身世和传为她所作的诗，后世有不同的说法。
sources: []
recalled:
