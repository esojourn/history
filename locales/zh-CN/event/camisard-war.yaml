name: "卡米撒起义"
summary: "南特诏谕废除后，塞文山区的胡格诺派农民揭竿而起，与王军打了多年游击战。"
body: |-
  1685 年南特诏谕废除后，法国南部塞文山区的胡格诺派农民在“旷野”中秘密聚会，屡遭镇压，其中出现了一些自称受圣灵感动说预言的人。《历史的轨迹》第三十九章说，这次残忍的逼迫把胡格诺派逼到不顾一切、盲目狂热的地步，1702 年到 1710 年间，他们与逼迫者展开恐怖的游击战，造成巨大的损失。

  据一般记载，1702 年 7 月一批农民杀了负责镇压的神父沙伊拉，起义由此开始。起义者因穿白衬衫夜袭，被称为“卡米撒”。他们的首领卡瓦利耶、罗兰都是青年农民，熟悉山地，屡败王军。路易十四派维拉尔元帅前去，一面招抚，一面焚村，1704 年卡瓦利耶受抚，罗兰战死，此后零星抵抗延续到 1710 年前后。作者对起义的狂热持保留态度；后来库尔重建“旷野教会”时，也力图约束这种“先知”的风气。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
recalled:
  - "库尔《塞文战争史》"
