name: 白起拔郢
summary: 前 278 年白起攻破楚都郢，楚国被迫东迁于陈。
body: |-
  渑池之会稳住赵国以后，秦国集中兵力攻楚。公元前 279 年，白起率军沿汉水南下，进攻楚国的别都鄢。据《水经注》等书，白起筑堤壅水，引西山长谷之水灌入鄢城，城中军民淹死数十万（《水经注》说法，数字难以确证），鄢城陷落。

  公元前 278 年，白起继续进攻，攻破楚国都城郢，烧毁楚先王陵墓所在的夷陵，又向东进兵到竟陵，向南进兵到洞庭湖一带。楚顷襄王率百官逃到陈（今河南淮阳），以陈为新都。秦国在郢设立南郡，白起因功被封为武安君。据《史记·白起王翦列传》，楚国此后“不敢复战”。

  郢都的陷落是楚国由盛转衰的转折点。屈原写下《哀郢》哀叹国都沦亡，传统说法认为他就在此后不久自沉汨罗江。

  郢都陷落后，楚国以陈为都三十多年，后来又迁到钜阳、寿春。秦国在江汉平原设立南郡。1975 年湖北云梦睡虎地出土的秦简，墓主就是南郡的一名小吏，其中的《语书》是南郡守腾颁发的文告，反映了秦国在这里推行秦法的情况。

  据《战国策·中山策》所记白起本人的话，他孤军深入楚地，“发梁焚舟以专民心，掠于郊野以足军食”，而楚人在本土作战，各顾其家，没有斗志，所以秦军能以少胜多。
sources: []
recalled:
  - 《史记·白起王翦列传》
  - 《史记·楚世家》
  - 《水经注·沔水》
