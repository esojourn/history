name: 《狄奥多西法典》颁行
summary: 公元 438 年东罗马颁布汇集君士坦丁以来皇帝法令的《狄奥多西法典》。
body: |-
  罗马皇帝的敕令历年积累，散在各处，彼此重复甚至矛盾，法官和律师难以查考。戴克里先时有两位法学家私人编过汇集。公元 429 年，东部皇帝狄奥多西二世任命一个九人委员会，要把君士坦丁以来各位皇帝发布的普遍适用的法令汇编成书。进展不顺，435 年他另组十六人的委员会，并准许对原文加以删节。

  438 年 2 月 15 日，法典在君士坦丁堡颁布。这时西部皇帝瓦伦提尼安三世刚到东部成婚，他带回一部抄本。同年 12 月，罗马的元老院开会接受法典，会议记录附在法典前面流传下来，连元老们齐声高呼的每一句口号各喊了多少遍都记着。法典自 439 年 1 月 1 日起在东西两部同时生效。

  全书十六卷，按题目分章，每章内的法令依年代排列，共收二千五百多条，起自 312 年。最后一卷专讲宗教，包括教士的特权和针对异端、异教徒、犹太人的各项限制。在西部，506 年西哥特王为治下罗马居民编的法典就以它为底本；六世纪查士丁尼编新法典时也大量取材于它。前五卷今天只有残本。
sources: []
recalled:
  - 《狄奥多西法典》卷 1 第 1 章第 5—6 条
  - 《罗马元老院接受狄奥多西法典纪要》
  - 狄奥多西二世《新律》第 1 条
