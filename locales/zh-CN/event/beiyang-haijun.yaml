name: 北洋海军成军
summary: 1888 年清朝颁布《北洋海军章程》，北洋海军正式成军，以丁汝昌为提督。
body: |-
  同治十三年（1874 年）日本出兵台湾，清朝朝野震动，开始筹划建设新式海军。光绪元年（1875 年）清朝命李鸿章督办北洋海防，沈葆桢督办南洋海防。此后北洋陆续从英国、德国购买军舰，其中光绪十一年（1885 年）从德国购买的铁甲舰“定远”“镇远”是当时亚洲最强大的军舰之一。中法战争后，清朝在光绪十一年设立海军衙门，由醇亲王奕譞总理。

  光绪十四年（1888 年）清朝颁布《北洋海军章程》，北洋海军正式成军，丁汝昌任提督，林泰曾、刘步蟾任左右翼总兵，拥有大小军舰二十多艘，以威海卫的刘公岛和旅顺为基地。据当时的统计，北洋海军的规模在亚洲居于前列。

  但北洋海军成军以后，几乎再没有添置新的军舰。光绪十七年（1891 年）户部奏请停购外洋船炮两年，同一时期朝廷正在修建颐和园，挪用海军经费修园的说法流传很广，具体挪用的数目和影响，学者看法不一。此后日本海军迅速扩充，新造的军舰在航速和速射炮方面超过了北洋舰队。光绪二十一年（1895 年）北洋海军在甲午战争中全军覆没（另见“甲午战争”条）。
sources: []
recalled:
  - 《北洋海军章程》
  - 《洋务运动》资料丛刊
  - 姜鸣《龙旗飘扬的舰队》
