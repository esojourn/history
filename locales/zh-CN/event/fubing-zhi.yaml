name: 府兵制建立
summary: 宇文泰在西魏建立府兵制，设八柱国、十二大将军，为北周、隋、唐沿用。
body: |-
  西魏立国之初，兵力远远少于东魏。大统九年（公元 543 年）邙山之战大败后，据《周书》，宇文泰广泛招募关陇地区的豪强及其部众，充实军队。在此前后，他逐步建立起一套新的军事制度，后世称为府兵制。府兵制正式成形的确切年份史书没有明确记载，一般认为在大统八年（542 年）至大统十六年（550 年）之间。

  府兵的最高统帅是八柱国：宇文泰总领全军，西魏宗室元欣只是挂名，实际统兵的是李虎、李弼、独孤信、赵贵、于谨、侯莫陈崇六人。每个柱国统领两个大将军，共十二大将军；每个大将军统领两个开府，共二十四开府，即二十四军。府兵另立军籍，不属州县管辖，本人免除租调徭役，平时训练，战时出征。府兵初期是否已经兵农合一，学者看法不一。宇文泰还让汉族将领改用鲜卑姓氏，部下士兵也随将领的姓。

  府兵制把鲜卑六镇军人和关陇的汉族豪强结合在一起，形成了一个以宇文泰为核心的统治集团，史家称为“关陇集团”。八柱国、十二大将军的家族在此后一百多年里地位显赫：李虎是唐高祖李渊的祖父；独孤信的三个女儿分别成为北周明帝、隋文帝和唐高祖之父李昞的妻子；隋文帝的父亲杨忠是十二大将军之一。

  北周武帝扩大府兵，招募汉族农民当兵。隋文帝开皇十年（590 年）下令军人户籍归入州县，府兵与农民合一。唐朝沿用府兵制，到唐玄宗时才逐渐废止。
sources: []
recalled:
