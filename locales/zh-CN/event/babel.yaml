name: 巴别塔与列国分散
summary: 人在示拿地造城造塔，神变乱他们的言语，使他们分散在全地。
body: |-
  据《创世记》11:1–9，洪水以后，天下人的口音、言语都是一样的。他们往东边迁移的时候，在示拿地遇见一片平原，就住在那里。他们彼此商量烧砖，拿砖当石头，又拿石漆当灰泥，说要建造一座城和一座塔，塔顶通天，为要传扬自己的名，免得分散在全地上。

  耶和华降临，要看世人所建造的城和塔。耶和华说，他们成为一样的人民，都是一样的言语，如今既做起这事来，以后所要做的事就没有不成就的了；于是在那里变乱他们的口音，使他们的言语彼此不通，又使他们从那里分散在全地上，他们就停工不造那城了。经文解释说，那城所以名叫巴别，是因为耶和华在那里变乱了天下人的言语。

  紧挨在这段记载之前的《创世记》第 10 章通称“列国表”，按挪亚三个儿子雅弗、含、闪的支派，列出洪水以后各族各邦的名字，并三次说明他们是各随各的方言、宗族立国的（10:5、10:20、10:31）。表中还提到宁录，说他国的起头是巴别、以力、亚甲等城，都在示拿地（10:10）；又说希伯的一个儿子名叫法勒，因为那时人就分地居住（10:25）。圣经里没有记下建塔者的名字，宁录主持建塔是后来的传统说法，见于约瑟夫斯《犹太古史》卷 1。

  “巴别”就是希伯来文里巴比伦的名字。巴比伦人自己把这个城名解作“神的门”；《创世记》则取希伯来文“变乱”一词的谐音来解释它。示拿地即两河流域南部的平原，当地古代城市多建有分层的砖砌高台式神庙（塔庙），不少学者认为巴别塔的记载以这类建筑为背景，也有人把它同巴比伦城内的大塔庙相联系；这些说法都没有定论。新约《使徒行传》第 2 章记五旬节时门徒说起别国的话，教会传统常把它同巴别变乱言语的事对照来讲。
sources: []
recalled:
  - 《创世记》第 10—11 章
  - 约瑟夫斯《犹太古史》卷 1
  - 《使徒行传》第 2 章
