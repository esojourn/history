name: 三征高句丽
summary: 隋炀帝三次发大军征讨高句丽，第一次在萨水大败，连年用兵耗尽了国力。
body: |-
  高句丽在隋时据有辽东和朝鲜半岛北部。开皇十八年（公元 598 年）高句丽侵扰辽西，隋文帝派兵讨伐，因疾疫和风浪无功而还。隋炀帝时，高句丽王高元不肯入朝，炀帝决定以武力征服。

  大业八年（612 年），炀帝在涿郡集结大军，据《隋书·炀帝纪》，总兵力一百一十三万余人，号称二百万，运送粮饷的人数加倍。隋军渡过辽水，围攻辽东城，久攻不下。宇文述、于仲文率领的九军渡过鸭绿江直趋平壤，被高句丽大臣乙支文德诱敌深入，粮尽撤退时在萨水被截击，大败而归。据《隋书》，九军渡辽时三十万五千人，回到辽东城时只剩二千七百人。

  大业九年（613 年）炀帝再次亲征，正在攻城时，负责督运粮草的礼部尚书杨玄感在黎阳起兵反隋，进逼东都，炀帝急忙撤军回救。杨玄感不久兵败被杀，但这次起兵表明隋朝的统治集团内部已经开始分裂。

  大业十年（614 年）炀帝第三次出兵，这时各地民变已经蜂起，征调的士兵多有逃亡。高句丽也疲于连年战争，遣使请降，送还了逃到高句丽的隋将斛斯政，炀帝才下令收兵。此后他命高元入朝，高元始终没有来。

  三次东征征发了大量士兵和民夫，许多人死于战场和途中，山东、河北的农民为逃避兵役纷纷起事，隋朝的统治从此迅速瓦解（另见“隋末民变”条）。唐太宗、唐高宗时又多次征讨高句丽，直到总章元年（668 年）才将其灭亡。
sources: []
