name: 亚历山大去世与巴比伦分封
summary: 公元前 323 年 6 月亚历山大病逝于巴比伦，部将议定两王并立，分领各省。
body: |-
  公元前 323 年春，亚历山大回到巴比伦，筹备由海路远征阿拉伯。5 月底，他在一次通宵宴饮后发烧。阿里安和普鲁塔克都引用了据称是宫廷逐日记录的《王家日志》：他起初照常献祭、向将领布置出征事宜，后来高烧不退，说不出话。士兵们要求见他，排成长队从床前走过，他只能抬头用眼神示意。6 月 10 日傍晚（巴比伦的天文日志记在次日），他去世了，不满三十三岁。死因古代有安提帕特一家下毒之说，阿里安和普鲁塔克都不相信；现代学者提出过疟疾、伤寒等多种推测，没有定论。

  他没有留下可以继位的子嗣，妻子罗克珊娜怀孕已数月。据狄奥多罗斯等人，有人问他把王国留给谁，他回答“给最强的人”，并把印戒交给了佩尔狄卡斯；阿里安只把这当作传闻。将领们在王宫集会。以佩尔狄卡斯为首的骑兵一方主张等待罗克珊娜分娩，生男则立为王；步兵在墨勒阿革洛斯带领下，拥立亚历山大的异母兄阿里达乌斯，此人心智不健全。双方一度兵戎相见，骑兵退出城外断绝粮道。经欧迈尼斯等人调停达成妥协：阿里达乌斯即位，称腓力三世；罗克珊娜若生男孩则并立为王，几个月后她生下亚历山大四世。佩尔狄卡斯在随后的阅兵式上处死了步兵方面为首的人，不久又杀了墨勒阿革洛斯。

  权力的安排是：佩尔狄卡斯以“千夫长”的身份总揽王国和军队；安提帕特仍管马其顿和希腊；深得军心的克拉特鲁斯得到“王室监护人”的名义，当时人还在奇里乞亚。各省总督重新分配，重要的有：托勒密得埃及，利西马科斯得色雷斯，欧迈尼斯得尚未征服的卡帕多西亚，列昂纳托斯得赫勒斯滂沿岸的弗里吉亚，安提柯保有大弗里吉亚，培松得米底；东方各省大多仍由原任者管辖。塞琉古这时没有领地，接任伙伴骑兵的统领。

  佩尔狄卡斯还向军队宣读了亚历山大遗留的计划，包括造一千艘战舰西征迦太基、为父亲修一座大如金字塔的陵墓等，军队表决不予执行。遗体经埃及工匠处理后停放了近两年，灵车在运往马其顿的途中被托勒密截往埃及。

  这次安排只维持了两年。两位国王一个不能理事，一个是婴儿，谁掌握他们谁就握有名分，诸将之间的战争随即开始。
sources: []
