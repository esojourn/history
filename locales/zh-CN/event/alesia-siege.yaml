name: 阿莱西亚之围
summary: 恺撒筑内外两道工事围困阿莱西亚，击退高卢援军，维钦托利投降。
body: |-
  公元前 52 年，恺撒在高卢中部曼杜比人的山城阿莱西亚围困并迫降维钦托利，高卢大起义由此失败。经过主要见于《高卢战记》卷七。

  这一年维钦托利统领的高卢联军一直避免会战。夏天他派骑兵袭击行军中的恺撒，被恺撒雇来的日耳曼骑兵击败，于是退入阿莱西亚。城在一块孤立的台地上，两面有河。据恺撒，城里有八万步兵；恺撒有十个军团左右。

  恺撒决定围困而不强攻。他环绕台地修了一道围墙，设二十三座堡垒；墙前挖了壕沟，再往前布设暗桩和陷坑。工事未合拢时，维钦托利趁夜放出全部骑兵，让他们回各部落求援。恺撒得知后，又在外侧朝向外面筑了一道更长的同样工事，军队夹在两道墙之间，备足三十天的粮草。按《高卢战记》的数字，内圈约合十六公里，外圈约合二十一公里。

  城中粮尽。据恺撒记载，守军把曼杜比人的老弱妇孺赶出城去，这些人走到罗马工事前哀求收留，恺撒不许放入。高卢各部集结的援军，恺撒说有步兵二十五万、骑兵八千，现代学者认为远没有这么多。

  援军到达后三次进攻。最后一次，援军的精兵绕到北面一处因山势无法圈入工事的营地，从高处压下，城内同时全线出击。恺撒先派拉比埃努斯增援，后来亲自带预备队赶去，让骑兵从外侧绕到敌后。高卢人溃退，援军当夜散去。

  次日维钦托利把自己交给部众处置，随后出城投降。据恺撒，除两个部落的人留作日后争取之用外，俘虏按每名士兵一人分作战利品。阿莱西亚的位置长期有争议，十九世纪六十年代拿破仑三世在科多尔省的阿利斯-圣兰主持发掘，找到了壕沟和武器，二十世纪末的重新发掘证实了这一地点。
sources: []
recalled:
  - 恺撒《高卢战记》卷七第 63—90 章
  - 普鲁塔克《恺撒传》第 27 章
