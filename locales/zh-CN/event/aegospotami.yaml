name: 羊河海战
summary: 公元前 405 年吕山德在赫勒斯滂海峡突袭，雅典舰队几乎全部被俘。
body: |-
  雅典的粮食大半靠从黑海经赫勒斯滂海峡运来。公元前 405 年夏末，吕山德率斯巴达舰队进入海峡，攻下亚洲一岸的兰普萨库斯。雅典舰队一百八十艘战船追来，停在对岸一处名叫“羊河”的开阔海滩，两地相距约三公里。这里没有港口，也没有城镇，船员要走到十几公里外的塞斯托斯去买粮食。

  一连四天，雅典舰队每天清晨划过海峡，在兰普萨库斯港外列阵挑战。吕山德让船员上船待命，但不出港；等雅典人返航，他派快船尾随，看清他们上岸散开之后才让自己的人下船。住在附近堡垒里的亚西比德来到雅典人的营地，劝将军们移到塞斯托斯去，那里有港口和城市；将军们叫他走开，说现在统兵的是他们。

  第五天，雅典人照例回到岸上，四散去找吃的。吕山德的快船在海峡中央举起一面盾牌为号，全军立刻渡海。雅典将军科农发现后下令登船，但船员已经走散，有的船只凑够两排桨手，有的只有一排，有的全空。只有科农自己的八艘船和城邦的快船“帕拉洛斯”号满员逃出。吕山德在岸边俘获了其余全部战船，在陆上抓住了大部分船员。狄奥多罗斯记下了另一种说法，说战斗起于一位雅典将军带三十艘船先行出动。

  被俘的雅典人，色诺芬没有给出总数，普鲁塔克说是三千。伯罗奔尼撒同盟开会历数雅典人的暴行，包括不久前表决要砍掉俘虏的右手，于是把被俘的雅典人全部处死，只放过一位曾在大会上反对那项决议的将军。科农不敢回国，带八艘船去了塞浦路斯。“帕拉洛斯”号夜里驶入比雷埃夫斯，色诺芬写道，哭声从港口沿着长墙一直传到城里，那一夜没有人睡觉，人们不只是为死者哀哭，更想到自己将要遭受他们曾经加给米洛斯等地的那种命运。

  吕山德随后控制了海峡，把各地的雅典驻军和移民一律遣回雅典，然后率舰队封锁比雷埃夫斯；两位斯巴达国王的陆军在城外会合。
sources: []
recalled:
  - 色诺芬《希腊史》卷二第 1 章；第 2 章第 3 节
  - 狄奥多罗斯《历史丛书》卷十三第 105—106 章
  - 普鲁塔克《吕山德传》第 9—13 章
