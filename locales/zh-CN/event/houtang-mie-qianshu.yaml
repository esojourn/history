name: 后唐灭前蜀
summary: 925 年后唐派李继岌、郭崇韬伐蜀，前蜀后主王衍投降，前蜀灭亡。
body: |-
  后唐灭梁以后，庄宗李存勖打算进一步统一天下。当时前蜀后主王衍沉溺于游乐，朝政腐败，后唐派去的使者回报说蜀中可以攻取。同光三年（公元 925 年）九月，庄宗任命长子魏王李继岌为都统、枢密使郭崇韬为招讨使，率兵六万（据《资治通鉴》）伐蜀。

  后唐军从凤翔出发，进入大散关，前蜀守军望风而降，凤州、兴州、利州、剑州等要地相继落入后唐手中。王衍本来在利州一带巡游，听说后唐军到来，仓皇逃回成都。十一月，后唐军逼近成都，王衍出城投降，前蜀灭亡。据《资治通鉴》，从出兵到王衍投降，前后只用了七十天。

  灭蜀之后，后唐朝中的宦官向庄宗进谗，说郭崇韬想在蜀地自立。同光四年（926 年）正月，郭崇韬在成都被杀，由此引起后唐朝廷人心动荡。王衍和他的宗族在被押往洛阳的途中被杀。不久，后唐派孟知祥镇守西川，孟知祥后来割据两川，建立了后蜀（另见“后蜀建立”条）。
sources: []
recalled:
  - 《旧五代史·唐书·郭崇韬传》
  - 《新五代史·前蜀世家》
  - 《资治通鉴》卷二百七十三至二百七十四
