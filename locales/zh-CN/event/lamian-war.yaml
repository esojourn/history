name: 拉米亚战争
summary: 亚历山大死后雅典联合各邦反抗马其顿，在克兰农战败，雅典的民主政体被取消。
body: |-
  公元前 324 年，亚历山大在奥林匹亚竞技会上宣布敕令，要各邦接回被放逐的人。雅典将因此失去安置了本邦移民的萨摩斯岛，埃托利亚人也要交还所占的城市，两邦都极为不满。同时，大批被遣散的雇佣兵聚集在伯罗奔尼撒南端的泰纳隆，雅典人列奥斯特涅斯与他们早有联络；亚历山大的司库哈帕洛斯带到雅典的钱，有一部分留在了城中。前 323 年夏亚历山大的死讯传来，雅典公民大会不顾福基翁的反对决定开战，号召希腊人争取自由，许佩里德斯是主要的推动者。当时人把这场战争称作“希腊战争”。

  列奥斯特涅斯率雇佣军和雅典公民兵北上，与埃托利亚人会合，占据温泉关。镇守马其顿的安提帕特手头兵力不足，色萨利骑兵又在阵前倒戈，他战败后退入色萨利南部的拉米亚城，被围了一冬，战争因此得名。围城期间列奥斯特涅斯被投石击中而死，联军失去了最好的统帅。许佩里德斯为他和阵亡者所作的悼词，有很长的片段保存在纸草上。

  前 322 年春，赫勒斯滂弗里吉亚总督列昂纳托斯率军来援。联军撤围迎战，在骑兵战中杀死了列昂纳托斯，但安提帕特趁机脱身，与援军会合北撤。海上的胜负更为要紧：马其顿舰队由克莱图斯统领，先在赫勒斯滂附近、后在阿莫尔戈斯岛外海击败雅典舰队，雅典自萨拉米斯海战以来的海上力量至此终结，亚洲的援军可以自由渡海。

  夏天克拉特鲁斯带着一万多名老兵从奇里乞亚赶到。8 月，安提帕特和克拉特鲁斯在色萨利的克兰农与联军交战。联军的骑兵占了上风，步兵却被马其顿方阵压退到高地上，损失并不大，但各邦的部队已陆续回家，无力再战。安提帕特拒绝与联军整体议和，逐一迫降各城，同盟瓦解。

  雅典派福基翁和德马德斯去求和。条件是：交出德摩斯梯尼、许佩里德斯等人，在比雷埃夫斯的穆尼基亚驻扎马其顿军，赔偿战费，公民权限于财产满二千德拉克马的人。据普鲁塔克，一万二千余人因此失去公民权。许佩里德斯被捕处死，德摩斯梯尼在卡劳里亚服毒。萨摩斯岛还给了萨摩斯人。埃托利亚人退入山中，因马其顿人转去对付佩尔狄卡斯而得以保全。
sources: []
recalled:
  - 狄奥多罗斯《历史丛书》卷十八第 8—18 章
  - 普鲁塔克《福基翁传》第 23—29 章；《德摩斯梯尼传》第 27—30 章
