name: 凡尔登条约
aliases:
  - 查理曼帝国三分
summary: 843 年查理曼的三个孙子把帝国分成东、西、中三部分。
body: |-
  查理曼死后，帝国由儿子路易继承。路易在世时几个儿子就为分家争斗不止，840 年他去世后打成内战。841 年两个弟弟在丰特努瓦打败了承袭帝号的长兄洛泰尔，次年在斯特拉斯堡结盟立誓，誓词分别用了两国士兵听得懂的罗曼语和日耳曼语。

  843 年 8 月三人在凡尔登议定分割。《历史的轨迹》第十一章说：一位得到莱茵河以东，称东法兰克王国，是后来德国的起始；一位得到默兹河、罗讷河以西，即西法兰克王国；第三位得到两国中间的一条狭长地带，包括意大利，称中间王国。得中间一份的是洛泰尔，他保留帝号，亚琛和罗马都在他境内。该书说西法兰克包括今天的法国、比利时和荷兰；按通行的说法，今荷兰和比利时的大部分当时划在中间王国。

  中间王国不久再分，北段成为东西两国长期争夺的地方。该书说，查理曼的继承人抵挡不住从北面乘船来的斯堪的纳维亚人和从东面来的匈牙利人，欧洲再度陷入混乱，封建制度就在这种局面中兴起。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十一章“教会被政府控制” https://wellsofgrace.com/books/spiritual/2000years/html/chapter13.html"
recalled:
  - 《圣贝尔坦年代记》843 年条
  - 尼特哈德《历史》
