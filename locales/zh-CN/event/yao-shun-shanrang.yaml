name: 尧舜禅让
summary: 相传尧不传位于子，而由四岳推举舜，历试后让位于舜，后世称为“禅让”。
body: |-
  据《尚书·尧典》和《史记·五帝本纪》，尧在位七十年时访求可以继位的人。四岳推举了一位出身微贱、以孝闻名的人，就是舜。尧把两个女儿嫁给舜，观察他如何治家；又让他总领百官、接待宾客，历试三年，然后命他摄行天子之政。

  《史记》说，尧知道儿子丹朱不肖，“授舜则天下得其利而丹朱病，授丹朱则天下病而丹朱得其利”，最终把天下授给舜。尧死后，舜一度让位给丹朱，避居南河之南，但诸侯、诉讼者和讴歌的人都归向舜，舜才即天子位。舜后来以同样的方式把天子之位传给了禹。

  禅让是否真实，古代就有争论。《竹书纪年》佚文说“舜囚尧于平阳”，又说舜使丹朱不得与父相见；《韩非子·说疑》说“舜逼尧，禹逼舜”。儒家则把禅让奉为“天下为公”的理想，墨家也主张“尚贤”。战国时燕王哙仿效禅让，把王位让给相国子之，引发燕国大乱。

  《礼记·礼运》以“大道之行也，天下为公，选贤与能”描述尧舜时代的“大同”，与禹以后的“天下为家”相对。1993 年湖北荆门郭店楚墓出土的竹简《唐虞之道》专门颂扬尧舜禅让，上海博物馆所藏战国楚竹书中的《容成氏》《子羔》也讲到禅让，说明战国时期这一学说曾广泛流传。
sources: []
recalled:
  - 《尚书·尧典》
  - 《史记·五帝本纪》
  - 《孟子·万章上》
  - 《竹书纪年》（佚文）
