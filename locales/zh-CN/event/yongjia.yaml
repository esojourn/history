name: 永嘉之乱
summary: 匈奴汉国的军队歼灭晋军主力，攻陷洛阳，俘虏晋怀帝，西晋朝廷实际覆亡。
body: |-
  晋怀帝永嘉年间，刘渊的汉国占据并州，石勒、王弥等部在黄河南北往来攻掠，洛阳与各地的联系时常中断。永嘉三年（公元 309 年）汉军两次打到洛阳城下，都被击退。这几年北方又连遭旱灾、蝗灾和瘟疫，《晋书·食货志》说当时人口流散，饥民相食。执政的东海王越与怀帝不和，各地方镇观望自保，朝廷号令难行。

  永嘉四年（310 年）冬，东海王越以讨伐石勒为名，带着四万甲士和大批朝官离开洛阳，屯驻项县。次年三月他病死军中，太尉王衍等决定秘不发丧，护送灵柩回东海国。四月，石勒的轻骑在苦县宁平城追上这支队伍，用骑兵围住放箭，据《晋书·东海王越传》，将士、王公和随行的百姓十余万人互相践踏，无一幸免，王衍等大臣被俘后被杀。西晋最后一支能战的军队就此消失。

  洛阳城内这时粮食断绝，盗贼公行。怀帝想迁往别处，因没有车辆和护卫而未能成行。五月，汉主刘聪派呼延晏率兵南下，刘曜、王弥、石勒各率所部会合。六月，汉军攻破洛阳的城门，纵兵抢掠宫中的财物和宫人。怀帝从后园出逃，打算奔往长安，途中被追兵俘获。据《晋书·怀帝纪》，百官士庶被杀的有三万余人；汉军还挖掘了晋朝诸帝的陵墓，焚烧宫殿、宗庙和官署。怀帝和传国的玺印被送到平阳，两年后怀帝遇害。

  这次事变因发生在永嘉年间而得名，也称“永嘉之祸”。洛阳是东汉、曹魏、西晋三朝的都城，经此一劫成为废墟。晋室的宗王和大臣此后在长安拥立愍帝，又支撑了五年，但已无力恢复。中原的士族和百姓大批南迁，司马睿在建康的幕府成为新的中心，中国的政治重心第一次转移到长江以南。
sources: []
