name: 弭兵之会
summary: 前 546 年晋、楚等国在宋都会盟弭兵，此后四十多年晋楚无大战。
body: |-
  春秋中期，晋、楚两国长期争霸，夹在中间的郑、宋、陈、蔡等小国饱受兵祸。公元前 579 年宋国大夫华元曾促成晋楚第一次弭兵之盟，但不久就被破坏。公元前 546 年，宋国执政向戌再次奔走于晋、楚、齐、秦等国之间，倡议停战。各国都有厌战情绪，纷纷同意。

  据《左传》襄公二十七年，这年夏天，晋、楚、齐、秦、鲁、卫、陈、蔡、郑、许、曹、宋等十四国的代表在宋都会盟。约定除齐、秦两个大国外，晋、楚两国的属国要同时朝见晋、楚，即“晋楚之从交相见”。会盟时楚人在衣服里穿着铠甲，晋楚又为谁先歃血争执不下，最后晋人让楚人先歃。

  弭兵之会后，晋楚之间四十多年没有发生大规模战争，中原相对安定，但小国要向两个霸主同时纳贡，负担更重。此后诸侯的争斗逐渐转向各国内部的卿大夫之间，同时东南的吴、越开始崛起。

  这次会盟没有能根本消除战争。此后晋楚之间基本保持和平，但它们对其他小国的征伐并未停止，吴楚之间的战争反而日益激烈。弭兵之会也标志着晋楚两国平分霸权，春秋争霸由两强对峙转向“晋楚共霸”。

  据《左传》襄公二十七年，向戌事后向宋平公请赏，执政子罕认为兵不可去，批评他以欺骗诸侯邀功，把赏赐的简册削掉扔了。
sources: []
recalled:
  - 《左传》襄公二十七年
  - 《史记·宋微子世家》
