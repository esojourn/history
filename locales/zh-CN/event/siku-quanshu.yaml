name: 《四库全书》编成
summary: 乾隆年间编成中国古代最大的丛书，同时大规模禁毁“违碍”书籍。
body: |-
  乾隆三十七年（1772 年）乾隆帝下令在全国搜集图书，次年安徽学政朱筠建议从《永乐大典》中辑录佚书，乾隆帝采纳，并决定把搜集到的书籍编成一部大丛书。乾隆三十八年（1773 年）设立四库全书馆，以皇子、大学士为总裁，纪昀、陆锡熊为总纂官，戴震、邵晋涵、周永年等著名学者参与编校，前后参与工作的有三百多人，抄写人员数千人。

  《四库全书》按经、史、子、集四部分类，所以称为“四库”。经过近十年的工作，乾隆四十六年（1781 年）第一部抄成，次年完成。据统计，全书收录书籍三千四百多种、七万九千多卷，装成三万六千多册，约八亿字；另有六千多种书只存目录、不收原书。纪昀主持撰写的《四库全书总目》为每部书写了提要。全书共抄写了七部，分藏于北京紫禁城文渊阁、圆明园文源阁、热河避暑山庄文津阁、盛京文溯阁（合称“北四阁”），以及扬州文汇阁、镇江文宗阁、杭州文澜阁（“南三阁”），后来有几部毁于战火。

  在编书的同时，乾隆帝下令查缴“违碍”书籍，凡是有反清、诋毁满洲内容或被认为“悖逆”的书，或全部销毁，或抽毁部分，或删改字句。据学者统计，这一时期被禁毁的书有三千种左右，具体数字说法不一。因此后世对《四库全书》的评价有很大分歧：它保存和整理了大量古籍，但也使许多书籍失传或被篡改，鲁迅等人对此有尖锐的批评。
sources: []
recalled:
  - 《四库全书总目》
  - 《纂修四库全书档案》
  - 郭伯恭《四库全书纂修考》
