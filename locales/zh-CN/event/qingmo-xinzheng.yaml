name: 清末新政
summary: 1901 年起清廷推行练新军、兴学堂、废科举、预备立宪等改革，直到清朝灭亡。
body: |-
  八国联军之役后，清廷的统治陷入危机。光绪二十七年（1901 年）初，慈禧太后还在西安时，就以光绪帝的名义发布变法上谕，要求大臣们就改革提出意见。两江总督刘坤一和湖广总督张之洞联名上了“江楚会奏变法三折”，成为新政的蓝本。此后十年间清廷推行的一系列改革，史称“清末新政”。

  新政的内容很广泛：在军事上，裁汰旧军，在各省编练新军，计划编成三十六镇，袁世凯在直隶编练的北洋六镇最为精锐；在教育上，颁布新的学制，在各地兴办新式学堂，派遣大批学生出国留学，尤其是到日本；光绪三十一年（1905 年）袁世凯、张之洞等人联名奏请，清廷下诏自次年起停止科举考试，延续了一千三百年的科举制度被废除；在经济上，设立商部，颁布商律和公司律，奖励实业；在官制上，改革中央机构，设立外务部、学部、巡警部、法部等。

  光绪三十一年（1905 年）清廷派五大臣出洋考察宪政，次年宣布“预备仿行宪政”。光绪三十四年（1908 年）颁布《钦定宪法大纲》，规定预备立宪的期限为九年，大纲中规定“大清皇帝统治大清帝国，万世一系”，皇帝的权力仍然很大。宣统元年（1909 年）各省成立咨议局，次年在北京成立资政院。立宪派要求速开国会，发动了几次请愿运动，清廷只答应把预备期缩短到五年。

  宣统三年（1911 年）清廷成立“责任内阁”，十三名国务大臣中皇族占七人，被称为“皇族内阁”，立宪派大为失望。新政虽然在许多方面推动了中国的近代化，但改革中加征的捐税加重了民众的负担，新军和留学生中许多人转向革命，皇族集权又使立宪派离心。同年武昌起义爆发，清朝很快覆亡（另见“辛亥革命”条）。
sources: []
