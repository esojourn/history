name: 图拉真征服达契亚
summary: 公元 101 至 106 年图拉真两次出兵多瑙河以北，灭达契亚王国，设为行省。
body: |-
  达契亚人住在喀尔巴阡山环抱的高地上，都城萨尔米泽格图萨有石砌的城防和神庙，境内产金、银。图密善在位时与达契亚王德凯巴鲁斯打过几年仗，89 年议和，罗马每年付钱，还派去工匠。图拉真认为这是屈辱，对方又日益强大。

  公元 101 年春，他率军从上默西亚用舟桥渡过多瑙河，在塔佩与达契亚人打了一场伤亡很重的仗。这年冬天德凯巴鲁斯联合萨尔马提亚骑兵渡河反攻默西亚，被击退。102 年罗马军分路逼近王都，德凯巴鲁斯求和：交出武器、工匠和逃兵，拆毁堡垒，让出一部分土地，接受罗马驻军。

  此后几年，大马士革的阿波罗多洛斯在多瑙河上架起一座石墩木梁的大桥，长一千一百多米。德凯巴鲁斯重整军备，又扣留了一名罗马将领。105 年图拉真再度出征，106 年夏围攻王都，城破后德凯巴鲁斯出逃，被骑兵追上，自刎而死。有人供出了他改河道埋在河床下的财宝。六世纪的作家吕都斯转引图拉真御医的说法，战利品有黄金五百万磅、白银一千万磅，现代学者认为这个数字至少夸大了十倍。据卡西乌斯·狄奥，图拉真回罗马后举办了一百二十三天的庆典。

  达契亚成为行省，是罗马在多瑙河以北唯一的一块。欧特罗庇乌斯说，那里人口因战争大减，图拉真从罗马世界各地迁去大批移民；今天的罗马尼亚语属于拉丁语系，通常追溯到这次殖民。金矿的收入支撑了图拉真在罗马的大工程，广场上那根三十米高的纪功柱 113 年落成，螺旋上升的浮雕刻了一百五十多个场面，从渡河、筑营一直到德凯巴鲁斯之死。270 年代奥勒良把驻军和居民撤回多瑙河以南，罗马统治这里前后约一百七十年。
