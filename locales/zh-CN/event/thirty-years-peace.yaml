name: 三十年和约
summary: 公元前 446 年至前 445 年雅典与斯巴达订约，结束十五年的断续交战。
body: |-
  公元前 461 年雅典与斯巴达断交后，麦加拉脱离伯罗奔尼撒同盟投向雅典，雅典与科林斯、埃吉那以至斯巴达先后开战，现代学者称为“第一次伯罗奔尼撒战争”。雅典修筑了连接城区与比雷埃夫斯港的长墙。前 457 年雅典人在塔那格拉败于斯巴达军，两个月后在奥诺斐塔获胜，控制了彼奥提亚；埃吉那也被迫加入提洛同盟。这是雅典在陆上势力最盛的时候。同一时期它派往埃及支援反波斯起义的大舰队在前 454 年覆没。前 451 年双方订立五年休战。

  前 447 年雅典人在科罗尼亚战败，失去彼奥提亚。前 446 年优卑亚岛反叛，伯里克利刚渡海前去，麦加拉又倒戈并杀死了雅典驻军，斯巴达国王普雷斯托阿那克斯率伯罗奔尼撒联军侵入阿提卡。联军前进到厄琉息斯附近就撤了回去。斯巴达人认定国王和他的顾问受了贿，国王被迫流亡；普鲁塔克说，伯里克利那一年的账目里有十塔兰特写着“用于必要的开支”。伯里克利随即回师平定了优卑亚。

  那年冬天双方订立为期三十年的和约。修昔底德没有抄录全文，从他各处的叙述可知：雅典交出在伯罗奔尼撒和麦加拉境内占据的尼塞亚、佩盖、特洛曾和阿凯亚；双方各自保有现有的盟邦，不得接纳对方的盟邦；未列入任何一方的城邦可以自行选择加入哪一边；发生争端应交付仲裁。和约等于斯巴达承认了雅典在海上的帝国，雅典则放弃了在陆上的扩张。

  和约维持了十四年。前 433 年雅典与克基拉结盟、围攻波提代亚，并禁止麦加拉人使用帝国境内的港口，科林斯等邦指控雅典违约。前 432 年斯巴达公民大会表决认定和约已被破坏，雅典提出按约仲裁，斯巴达没有接受。
