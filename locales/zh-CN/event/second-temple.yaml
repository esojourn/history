name: 重建圣殿
summary: 归回的犹太人在耶路撒冷重建圣殿，大流士第六年完工。
body: |-
  首批归回的人到耶路撒冷的第二年二月，立了殿的根基（《以斯拉记》3:8–13）。那地的居民自称是亚述王以撒哈顿迁来的，要求一同建造；被拒之后便扰乱他们，贿买谋士，使工程停顿，直到波斯王大流士第二年（4:1–5、4:24）。

  大流士第二年（公元前 520 年）六月，先知哈该责备百姓只顾自己的房屋；同年八月撒迦利亚也开始传讲。省长所罗巴伯和大祭司约书亚带领百姓在六月二十四日复工（《哈该书》1:14–15）。河西总督达乃和示他波斯乃来查问是谁降旨让他们建造，没有叫他们停工，而是上奏请王查档（拉 5:3–17）。大流士在玛代省亚马他城的宫内找到居鲁士的诏令，就降旨不许拦阻，并从河西的贡赋中拨给经费和献祭所需（6:1–12）。

  《以斯拉记》6:15 记，大流士王第六年亚达月初三日，这殿修成了。亚达月是一年的最后一个月，换算过来在公元前 515 年初春；由于换算方法不同，完工之年常被记作前 516 年或前 515 年。百姓行奉献之礼，6:17 记献公牛一百只、公绵羊二百只、绵羊羔四百只，又献公山羊十二只为以色列众人作赎罪祭；次月守逾越节。

  这座殿后世称为第二圣殿。《哈该书》2:3 表明，在见过旧殿的人眼中它远不如所罗门的殿。它在公元前二世纪被安条克四世亵渎，后经马加比洁净；前一世纪末由希律大规模重修；公元 70 年毁于罗马军队。
sources: []
recalled:
  - 《以斯拉记》第 3—6 章
  - 《哈该书》第 1—2 章
  - 《撒迦利亚书》第 1—8 章
