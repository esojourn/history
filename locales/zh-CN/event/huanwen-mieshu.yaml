name: 桓温灭成汉
summary: 荆州刺史桓温率军溯江入蜀，攻克成都，成汉灭亡，益州归入东晋。
body: |-
  成汉自李雄死后内乱不断，到李势在位时，国内又有僚人大量迁入平地，政令不出成都周围。永和二年（公元 346 年）十一月，刚到任一年多的荆州刺史桓温决定西征。他上表之后不等朝廷答复就出发，留下的僚属多认为蜀道险远、兵力又少，难以成功。朝中的刘惔却说，桓温善于赌博，没有把握的事不会做，只怕他成功以后朝廷难以制约。此语见《晋书·刘惔传》。

  桓温采纳部将袁乔的建议，把辎重留在彭模，只带三天的口粮，全军直扑成都。永和三年（347 年）三月，晋军在成都城外的笮桥与成汉军决战。据《晋书·桓温传》，前锋一度失利，箭射到桓温的马前，众人想退，击鼓的军吏却误敲了进军的鼓，袁乔拔剑督战，晋军于是大胜，乘势烧了城门。李势连夜出逃，随后投降，被送到建康。

  成汉从李特起兵算起历四十余年而亡。桓温在成都停留了三十天，举用当地的贤才，然后回到江陵。他由此声望大增，朝廷开始起用殷浩来牵制他。
sources: []
recalled:
  - 《晋书·桓温传》
  - 《晋书·李势载记》
  - 《资治通鉴》卷九十七
