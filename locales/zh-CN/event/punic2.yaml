name: 第二次布匿战争
summary: 汉尼拔在意大利转战十余年，罗马最终反攻非洲取胜。
body: |-
  第一次布匿战争后，迦太基在西班牙重新积蓄力量。公元前 219 年汉尼拔围攻与罗马有约的萨贡托，八个月后破城；前 218 年罗马向迦太基宣战。汉尼拔抢先翻越阿尔卑斯山进入意大利，当年在提基努斯河和特雷比亚河获胜，前 217 年在特拉西梅诺湖伏击歼灭一支执政官军队，前 216 年又在坎尼大胜。卡普阿和意大利南部不少城市倒向他，叙拉古和马其顿的腓力五世也与迦太基结盟。

  罗马没有求和，改用费边的办法，在意大利避免决战，同时在别处开辟战场。马塞卢斯约于前 212 年攻下叙拉古，卡普阿在前 211 年被收复。前 207 年，汉尼拔的弟弟哈斯德鲁巴率援军进入意大利，在梅陶鲁斯河兵败身死。在西班牙，西庇阿于前 209 年夺取新迦太基，到前 206 年把迦太基人逐出半岛。

  前 204 年西庇阿在非洲登陆，次年迦太基召回汉尼拔。前 202 年两军在扎马决战，汉尼拔战败。据波利比乌斯所记的和约，迦太基保有非洲的本土，但交出战象，战舰只许留十艘，五十年内赔款一万塔兰特，未经罗马许可不得对外作战。
sources:
  - 波利比乌斯《历史》卷三；卷七至十一；卷十四；卷十五（和约见第 18 章） https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/15*.html
  - 英文维基百科“Second Punic War”（核对年份） https://en.wikipedia.org/wiki/Second_Punic_War
recalled:
  - 李维《罗马史》卷二十一至三十（和约见卷三十第 37 章）
