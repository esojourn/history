name: 光武中兴
summary: 公元 25 年刘秀在鄗称帝，定都雒阳，重建汉朝，36 年统一全国。
body: |-
  王莽败亡后，更始帝刘玄入都长安，但控制不了各地的武装。刘秀受命安抚河北，在那里击灭称帝于邯郸的王郎，收编铜马等部数十万人，部下屡次劝他称帝。据《后汉书·光武帝纪》，建武元年（公元 25 年）六月，他在鄗县南郊设坛即皇帝位，国号仍称汉，年号建武。因为都城在雒阳，位于西汉都城长安以东，后世称这个朝代为东汉或后汉。

  同年九月，赤眉军攻入长安，更始帝投降后被杀。十月，刘秀进入雒阳，定为都城。此时全国仍然四分五裂：赤眉在关中，刘永在睢阳，张步在齐地，隗嚣在陇右，公孙述在蜀地称帝，窦融据守河西。刘秀派邓禹、冯异经营关中，建武三年（27 年）在宜阳迫使粮尽东归的赤眉军十余万人投降；此后数年逐一平定关东各部。河西的窦融主动归附。建武八年他亲征陇右，两年后隗氏势力覆灭。建武十二年（36 年）十一月，大司马吴汉攻破成都，公孙述战死，全国重新统一。

  长期战乱使人口锐减。光武帝在位期间多次下诏释放奴婢，禁止残害奴婢，把田租恢复为三十税一，裁并四百多个县，减省官吏；对匈奴和西域采取收缩政策，没有接受西域诸国重设都护的请求。他优待功臣而不让他们掌握实权，把决策集中到尚书台。后世史家把这一段称为“光武中兴”。东汉自此延续到公元 220 年，前后近二百年。
sources: []
recalled:
  - 《后汉书·光武帝纪》
  - 《后汉书·隗嚣公孙述列传》
  - 《资治通鉴》卷四十至四十三
