name: 废王立武
summary: 655 年唐高宗不顾长孙无忌、褚遂良反对，废王皇后，立武昭仪为皇后。
body: |-
  唐高宗的王皇后出身太原王氏，没有生育儿子，高宗宠爱萧淑妃。据《资治通鉴》，王皇后为了分夺萧淑妃的宠爱，劝高宗把在感业寺为尼的太宗才人武氏接回宫中。武氏入宫后被封为昭仪，很快得到高宗的专宠，王皇后和萧淑妃反而联合起来对付她。

  永徽五年（公元 654 年）武昭仪生下的女儿夭折。据《资治通鉴》和《新唐书》，是武昭仪亲手扼杀女儿，嫁祸于刚来看望过婴儿的王皇后；但《旧唐书》没有这一记载，有学者对此表示怀疑。高宗由此想废后。他和武昭仪亲自到长孙无忌家中，赏赐金宝，封长孙无忌宠姬所生的儿子为官，暗示希望他支持，长孙无忌不予回应。

  永徽六年（655 年），高宗召长孙无忌、李勣、于志宁、褚遂良商议，李勣称病不来。褚遂良坚决反对，说皇后出身名门，又是先帝所选，不可轻易废黜；武氏曾经侍奉先帝，天下人都知道。他把笏板放在殿阶上，叩头流血，武昭仪在帘后大声说要打死这个家伙。后来高宗私下询问李勣，据《资治通鉴》，李勣回答说这是陛下的家事，何必问外人。许敬宗也在朝中宣扬，说农夫多收了十斛麦子还想换个妻子，何况天子。

  这年十月，高宗下诏废王皇后和萧淑妃为庶人，十一月立武昭仪为皇后。王氏和萧氏不久被杀，据《资治通鉴》死状极惨。褚遂良被贬到潭州，后来又一再远贬，死于爱州；长孙无忌在显庆四年（659 年）被逼自尽。从此关陇老臣的势力大为削弱，武后开始逐步参与朝政。
sources: []
recalled:
  - 《资治通鉴》卷一百九十九至二百
  - 《旧唐书·后妃传》
  - 《新唐书·后妃传》
  - 《旧唐书·褚遂良传》
