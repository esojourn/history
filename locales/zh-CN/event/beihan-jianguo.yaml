name: 北汉建立
summary: 951 年刘崇在太原称帝，仍用汉的国号，史称北汉，依附契丹。
body: |-
  乾祐三年（公元 950 年）底郭威起兵，后汉隐帝刘承祐被杀。郭威起初宣布迎立刘崇的儿子刘赟为帝，不久却在部下拥立下自己称帝，建立后周，刘赟也被杀害。

  广顺元年（951 年）正月，镇守太原的河东节度使刘崇在太原称帝，沿用后汉的乾祐年号和汉的国号，表示自己是后汉的延续，史称北汉，也称东汉。北汉只有太原周围的十余州，土地贫瘠，兵力有限，为了对抗后周，刘崇向契丹称“侄皇帝”，接受契丹的册封，每年向契丹进贡。

  北汉多次联合契丹进攻后周，显德元年（954 年）的高平之战中大败（另见“高平之战”条），此后再也无力南下。北宋建立后，宋太祖曾几次进攻太原，都因契丹援军而没有成功。太平兴国四年（979 年），宋太宗亲征，攻破太原，北汉末主刘继元投降，北汉灭亡。至此，五代十国分裂的局面结束。
sources: []
recalled:
  - 《新五代史·东汉世家》
  - 《资治通鉴》卷二百九十
