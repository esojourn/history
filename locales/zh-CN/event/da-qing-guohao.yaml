name: 皇太极改国号大清
summary: 1636 年皇太极在盛京称帝，改国号为“大清”，年号崇德。
body: |-
  皇太极即位以后，后金的统治范围不断扩大，统治下除了女真人，还有大量汉人和蒙古人。天聪九年（1635 年）后金军击败蒙古察哈尔部，林丹汗的儿子额哲投降，据说献上了元朝的传国玉玺，后金方面认为这是天命所归。同年十月，皇太极下令把族名“诸申”（女真）改为“满洲”，禁止再称诸申。

  天聪十年（1636 年）四月，皇太极在盛京（今沈阳）接受满、蒙、汉各族臣僚的拥戴，即皇帝位，改国号为“大清”，改元崇德。改国号的原因，一般认为与“金”字容易让汉人联想到宋金之间的仇恨有关，也有人从五行等方面加以解释，史料中没有明确的说明。

  称帝以后，皇太极进一步完善国家机构，设立都察院、理藩院，扩充汉军和蒙古八旗。同年冬天他以朝鲜不肯称臣为由，亲率大军进攻朝鲜，次年正月朝鲜国王仁祖在南汉山城出降，断绝与明朝的宗藩关系，改奉清朝为宗主，史称“丙子之役”。

  皇太极称帝后，清朝与明朝的对峙由地方政权与中央王朝的战争，变为两个皇帝之间的争夺天下。此后清军多次入关劫掠，崇德年间的几次远征深入到山东。崇德八年（1643 年）皇太极去世，次年清军入关，定都北京，“大清”的国号一直沿用到 1912 年清帝退位。
sources: []
recalled:
  - 《清太宗实录》
  - 《清史稿·太宗本纪》
