name: 尊儒术与兴太学
summary: 汉武帝设五经博士、为博士置弟子，以儒家经学取士，儒学由此成为官方学说。
body: |-
  汉初的统治思想以黄老之学为主，主张清静无为；朝廷的博士则诸子百家并立。武帝即位的建元元年（公元前 140 年），丞相卫绾上奏说，各地举荐的贤良中有研习申不害、商鞅、韩非和苏秦、张仪学说的，扰乱国政，请一律罢免，武帝批准。当时得到任用的儒者赵绾、王臧想建立明堂、改革礼制，触怒了信奉黄老的窦太后，两人下狱自杀。

  建元五年（前 136 年），朝廷设置五经博士，即《诗》《书》《礼》《易》《春秋》各立专门的学官。次年窦太后去世，儒者重新受到任用。董仲舒在回答武帝的策问时建议，凡不在六艺和孔子学说之内的，都不要让它们与儒学并进，这样法度才能统一；他还建议兴办太学，由郡国按时举荐人才。这次对策的年份有前 140 年与前 134 年两说。元光元年（前 134 年），武帝命各郡国每年举荐孝、廉各一人，后来成为汉代选官的主要途径。

  元朔五年（前 124 年），丞相公孙弘奏请为博士设置弟子五十人，免除他们的徭役，每年考试，通一经以上的可以补为官吏。这被看作太学的开始。据《汉书·儒林传》，博士弟子的名额后来不断增加，昭帝时为一百人，宣帝时二百人，成帝末年一度达到三千人。

  “罢黜百家，独尊儒术”是后人对这些措施的概括，《汉书·武帝纪》的赞语原作“罢黜百家，表章六经”。当时并没有禁止其他学说流传；武帝本人重用的张汤、桑弘羊等大臣也不是儒者，宣帝后来说汉家制度是“霸王道杂之”。但通经可以做官，使读经成为士人的主要出路，儒家经学此后两千年间一直是官方的学问。
sources: []
