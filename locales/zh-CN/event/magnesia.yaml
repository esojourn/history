name: 马格尼西亚战役
summary: 公元前 190 年冬罗马与帕加马联军击败安条克三世，塞琉古势力退出小亚细亚。
body: |-
  安条克三世在公元前 192 年进入希腊，次年在温泉关败于罗马，退回小亚细亚。前 190 年罗马执政官卢基乌斯·科尔内利乌斯·西庇阿率军渡过赫勒斯滂海峡，其兄“阿非利加征服者”西庇阿以副将身份随行；塞琉古舰队此前已在海上接连失利。议和不成，两军在吕底亚的马格尼西亚（西皮洛斯山下）附近对阵。战役发生在前 190 年 12 月或前 189 年 1 月。

  据李维，罗马及其盟军约三万人，安条克三世有步兵六万、骑兵一万二千余，另有战象和卷镰战车。李维和阿庇安说，大西庇阿当时因病留在埃莱亚，没有参战。开战后，帕加马国王欧迈尼斯二世用轻装部队射乱塞琉古左翼的卷镰战车，随即以骑兵冲击，左翼溃散。安条克三世亲率右翼骑兵击退当面的罗马军，一直追到敌营；这时塞琉古中央的方阵已被合围，阵中的战象受惊冲乱队列，全军崩溃。李维称塞琉古一方阵亡步兵约五万、骑兵三千，罗马一方阵亡三百余人；今人认为这些数字夸大了双方的差距。

  安条克三世退往萨第斯，随后求和。前 188 年在阿帕米亚订约：塞琉古王国放弃托罗斯山以西的土地，交出战象，舰队只许保留十艘战舰，并交纳人质。据波利比乌斯，赔款连同停战时已付的部分共一万五千塔兰特，其中一万二千塔兰特分十二年付清。让出的土地大部分分给了帕加马和罗得岛。
sources:
  - 阿庇安《叙利亚战争》第 30—39 章 https://www.livius.org/sources/content/appian/appian-the-syrian-wars/
  - 波利比乌斯《历史》第 21 卷第 16—17、42—43 章（议和条件与阿帕米亚和约） https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/21*.html
