name: 改土归流
summary: 雍正年间在云南、贵州、广西、湖广等地大规模废除世袭土司，改由朝廷委派的流官治理。
body: |-
  元、明以来，朝廷在西南少数民族地区设置土司，由当地首领世袭担任宣慰使、土知府、土知州等职，管理本地事务，向朝廷纳贡。土司在辖区内有很大的权力，有的互相仇杀，有的对朝廷时叛时服。明代已在播州等地改设流官，但规模有限。

  雍正四年（1726 年），云贵总督鄂尔泰上疏建议大规模推行改土归流，得到雍正帝的支持。此后数年，鄂尔泰在云南、贵州、广西三省用兵和招抚并用，革除了一大批土司，设立府、厅、州、县，由朝廷委派流官治理，清查户口，丈量土地，征收赋税。湖广、四川等地也推行了改土归流。贵州东南部的苗疆在这一时期被纳入直接统治，设立了“新疆六厅”。

  改土归流加强了中央对西南地区的统治，促进了这些地区与内地的经济文化交流。但推行过程中也伴随着大规模的武力征服和屠杀，改流后一些流官和兵丁的压榨也激起了反抗。雍正十三年（1735 年）贵州苗疆爆发大规模起义，到乾隆元年（1736 年）才被镇压下去。
sources: []
recalled:
  - 《清世宗实录》
  - 《清史稿·土司传》
  - 魏源《圣武记·雍正西南夷改流记》
