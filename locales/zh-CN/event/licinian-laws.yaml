name: 李锡尼—塞克斯提乌斯法
summary: 传统上定在公元前 367 年：平民获得出任执政官的资格，并限制占有公有地。
body: |-
  传统上定在公元前 367 年通过。高卢人洗劫罗马之后，许多平民负债重建家园；同时一批富有的平民不满于被排除在最高官职之外。从前 444 年起，罗马多数年份不选执政官，改选数名“握有执政官权力的军事保民官”，平民名义上可以当选，实际上极少。

  据李维，前 376 年保民官李锡尼·斯托洛和塞克斯提乌斯·拉特拉努斯提出三项法案：其一，欠债已付的利息从本金里扣除，余额分三年偿还；其二，任何人占有公有地不得超过五百尤格拉（约一百二十五公顷）；其三，不再选举军事保民官，恢复执政官，其中一人必须是平民。贵族争取到其他保民官行使否决权，李锡尼和塞克斯提乌斯则连选连任，并反过来阻止一切高级长官的选举。李维说罗马因此有五年没有长官，狄奥多罗斯只说一年，学者认为五年之数是为了凑合年表。

  前 367 年高卢人再度逼近，年迈的卡米卢斯出任独裁官。击退高卢人之后，法案终于通过；据李维，贵族作为交换得到一个新设的官职大法官，负责审判，只由贵族担任。前 366 年塞克斯提乌斯成为第一位平民执政官。

  此后的发展说明这次让步的分量：前 356 年有了第一位平民独裁官，前 351 年有了平民监察官，前 337 年平民当上大法官，前 300 年的奥古尔尼乌斯法向平民开放了大祭司团和占卜官团。富有的平民家族与旧贵族逐渐合成新的“显贵”阶层。至于五百尤格拉的占地限额，有学者认为是把前 2 世纪的规定上推到了这里；格拉古提出土地法时，正是援引这条旧限。
sources: []
recalled:
