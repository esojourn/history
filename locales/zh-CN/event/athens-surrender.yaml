name: 雅典投降
summary: 公元前 404 年春雅典在围困中投降，拆毁长墙，交出舰队。
body: |-
  羊河之败后，雅典没有了舰队，粮道断绝。公元前 405 年秋，斯巴达国王阿基斯和保萨尼阿斯的陆军在城外扎营，吕山德的一百五十艘战船封锁了比雷埃夫斯。雅典人恢复了被剥夺权利者的公民身份，决心固守。他们最初提出的条件是保留长墙和比雷埃夫斯、与斯巴达结盟，被监察官拒绝；斯巴达要求把长墙各拆去十个跑道的长度，雅典公民大会通过决议，禁止任何人提议接受。

  城中开始有人饿死。塞拉门尼斯自请出使，在吕山德那里停留了三个多月，据色诺芬，他是在等雅典人饿到什么条件都肯接受的时候。回来后他又被派往斯巴达，全权议和。在伯罗奔尼撒同盟的会议上，科林斯、底比斯等邦主张把雅典夷为平地，把居民卖为奴隶。斯巴达人拒绝了，说不能奴役一个在希腊遭遇最大危难时立过大功的城邦。现代学者认为，斯巴达也不愿看到雅典消失后底比斯坐大。

  和约的条件是：拆毁长墙和比雷埃夫斯的城防；除十二艘外交出全部战船；放弃所有海外领地；召回流亡者；与斯巴达同敌共友，无论陆上海上都随斯巴达出征。塞拉门尼斯带回这些条件时，人群围住他，生怕谈判落空。次日公民大会表决接受，少数人反对。时在前 404 年春，围城持续了半年左右。

  吕山德驶入比雷埃夫斯，流亡者回国。色诺芬写道，人们在吹笛女的乐声中兴高采烈地拆毁城墙，以为这一天是希腊自由的开始。延续二十七年的伯罗奔尼撒战争到此结束，提洛同盟解散，雅典失去了帝国。几个月后，在吕山德的压力下，公民大会选出三十人起草新的法律，即后来所称的“三十僭主”。

  雅典没有就此一蹶不振。前 403 年民主政治恢复，十年后科农用波斯的钱重建了长墙，前 378 年雅典又组织起第二个海上同盟，但再没有达到前 5 世纪的力量。
sources: []
