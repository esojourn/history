name: 甲午战争
summary: 1894 年日本为争夺朝鲜挑起战争，清朝陆海两军接连战败，北洋海军全军覆没。
body: |-
  明治维新后，日本迅速走上对外扩张的道路，把朝鲜作为首要目标。朝鲜是清朝的藩属国，光绪十年（1884 年）甲申政变后，中日签订《天津会议专条》，约定朝鲜如有事变，两国出兵要互相通知。光绪二十年（1894 年，干支为甲午）春，朝鲜爆发东学党起义，朝鲜政府请清朝出兵，日本也借机大举出兵朝鲜，控制了汉城。起义平息后，日本拒绝撤兵。

  七月二十五日，日本海军在朝鲜牙山湾外的丰岛海面突袭清朝的运兵船队，击沉了英国籍的运兵船“高升号”，清军一千多人遇难。八月一日中日双方正式宣战。九月中旬，日军进攻平壤，清军将领左宝贵战死，统帅叶志超弃城逃跑，清军退回国内。九月十七日，北洋舰队在鸭绿江口大东沟附近的黄海海面与日本联合舰队激战近五个小时，北洋舰队损失“致远”“经远”等五艘军舰，邓世昌等人殉国，日本舰队也有多艘受伤，但没有沉没。此后北洋舰队退守威海卫，不再出海。

  十月下旬，日军分两路进攻中国本土，一路渡过鸭绿江攻入辽东，一路在辽东半岛花园口登陆，十一月攻陷旅顺，在旅顺城中进行了屠杀。光绪二十一年（1895 年）一月，日军在山东荣成登陆，从陆路攻占威海卫的南北岸炮台，海陆夹击停泊在刘公岛的北洋舰队。二月，提督丁汝昌拒降自尽，北洋舰队向日军投降，北洋海军全军覆没。三月日军又攻占了辽河下游的营口等地。

  清朝被迫求和，派李鸿章到日本马关谈判，四月签订了《马关条约》（另见该条）。甲午战争的失败对中国震动极大，宣告了洋务运动的失败，此后列强在中国掀起了强占租借地、划分势力范围的狂潮，维新变法的思潮也由此兴起。
sources: []
recalled:
  - 《中日战争》资料丛刊
  - 姚锡光《东方兵事纪略》
  - 戚其章《甲午战争史》
