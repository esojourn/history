name: 克吕尼修道院创立
aliases:
  - 克吕尼革新运动
summary: 910 年阿基坦公爵威廉创立克吕尼修道院，由此兴起教会的革新运动。
body: |-
  《历史的轨迹》第十三章说，九世纪时许多修道院的修士已不再过禁欲的生活，修道院受当时风气的影响，成了罪恶滋生的地方；但每个时代都有真基督徒，最黑暗的十世纪也不例外。

  910 年（一说 909 年）9 月，阿基坦公爵、人称“敬虔者”的威廉，把自己在勃艮第的一处庄园克吕尼捐出来建修道院，请邻近一所修道院的院长贝尔诺主持。创立的文书规定：修士遵守本笃会规；贝尔诺死后，修士自己选举院长，不受任何人干预；公爵本人、他的亲属、国王、主教都不得侵占这所修道院的产业，它直接归使徒彼得和保罗保护，也就是归罗马教皇，每五年向罗马纳一小笔贡金。这样它既不属当地的领主，也不归教区的主教管辖。

  克吕尼接连有几位在任很久的院长。他们严格执行会规，把大部分时间用在隆重的礼拜和代祷上，同时受托去整顿别处的修道院。被整顿和新建的修道院不另立院长，都作为分院隶属克吕尼，这是西欧第一个统一管理的修道团体。《历史的轨迹》说，它在最兴盛的时期统管两千多所修道院，其后两百年间，克吕尼的革新成为改善教会属灵光景的强大力量。

  该书把十一世纪从修道院扩展到整个教会的改革都称为“克吕尼运动”：反对买卖圣职，反对教士娶妻，要求教会职务由教会自己选立。又说这个运动塑造了希尔得布兰，即后来的贵格利七世。希尔得布兰是否在克吕尼作过修士，学者多表怀疑；克吕尼的院长们也并不主张与君王对抗。该书同时指出，修道主义把灵性分成高低两等、以为人可以靠避世成圣，这个出发点是错的，但克吕尼的动机真诚，确实唤起了那个时代属灵的觉醒。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十三章“修道主义与克吕尼革新运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter15.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十四章“教会为自由奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter16.html"
