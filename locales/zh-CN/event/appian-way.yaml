name: 修筑阿庇亚大道与阿庇亚水渠
summary: 监察官阿庇乌斯·克劳狄乌斯主持修建罗马第一条长途大道和第一条引水渠。
body: |-
  公元前 312 年，监察官阿庇乌斯·克劳狄乌斯·凯库斯主持修建了罗马第一条引水渠和第一条长途大道，两者都以他的名字命名。

  阿庇亚水渠从城东的泉眼取水，全长约十六公里，据弗朗提努斯记载，除了靠近城门的一小段架在墙和拱上，其余都是地下暗渠。当时罗马人口增长，河水、井水和泉水已不够用。据弗朗提努斯，这条水渠是与另一位监察官普劳提乌斯合办的，普劳提乌斯找到了水源，却按规定在十八个月后卸任，阿庇乌斯留任把工程做完，名字也归了他。

  阿庇亚大道从罗马的卡佩纳门出发，向东南经阿尔班山脚，笔直穿过蓬蒂内沼泽，到塔拉奇纳沿海而行，再折向内陆抵达卡普亚，全长约二百一十公里。那时第二次萨莫奈战争正在进行，罗马三年前刚在劳图莱战败，通往坎帕尼亚的内陆旧路易受威胁；新路让军队和给养可以较快到达卡普亚。最初的路面大概是碎石，后来分段铺上石板。

  大道后来不断延长：前 3 世纪经贝内文图姆延伸到塔兰托，再到亚得里亚海边的港口布伦迪西乌姆，全长约五百六十公里，成为罗马通往希腊和东方的干道。诗人斯塔提乌斯称它为“道路的女王”。道路两旁排列着坟墓；前 71 年克拉苏把六千名斯巴达克斯起义的俘虏钉死在这条路上。

  据狄奥多罗斯，阿庇乌斯未经元老院批准就花掉了国库的大量收入。这两项工程开了先例：此后几个世纪，罗马建成了十一条水渠和遍布意大利的道路网。阿庇亚大道城郊的一段至今保存。
