name: 梅陶罗河战役
summary: 罗马两名执政官合兵，在梅陶罗河歼灭前来与汉尼拔会师的哈斯德鲁巴援军。
body: |-
  公元前 207 年，第二次布匿战争中罗马军队在意大利东北部的梅陶罗河边歼灭汉尼拔之弟哈斯德鲁巴率领的援军。

  汉尼拔在意大利作战已十一年，兵力渐少，被压缩在南部。哈斯德鲁巴这年春天翻过阿尔卑斯山进入波河流域，沿途招募高卢人；阿庇安说他有步兵四万八千、骑兵八千和十五头战象，现代学者估计实际约三万人。执政官李维乌斯·萨利那托尔在北面迎击哈斯德鲁巴，另一名执政官克劳狄乌斯·尼禄在南面盯住汉尼拔。

  哈斯德鲁巴派骑手给哥哥送信，约在翁布里亚会师。信使穿过了几乎整个意大利，在塔兰托附近被俘。尼禄读了信，决定违反执政官不得擅离辖区的规矩：他留下主力在营中照常活动，自己挑选步兵六千、骑兵一千连夜北上，沿途居民把食物送到路边。据李维，他夜里悄悄进入李维乌斯的营地，士兵与原有的人合住，营盘没有扩大。

  哈斯德鲁巴列阵时注意到对面有些盾牌陈旧、马匹消瘦，又听说营中吹了两遍号，断定两名执政官都在，当夜撤向梅陶罗河。向导逃走，军队找不到渡口，天明被追上。他依托起伏的地形列阵，西班牙老兵在右，高卢人在左，战象在前。尼禄因面前地形崎岖无法接敌，抽出几个步兵队从全军背后绕到最左端，攻击西班牙人的侧背，迦太基阵线瓦解。哈斯德鲁巴冲入敌阵战死。

  波利比乌斯说迦太基一方连同高卢人死了一万，罗马死两千；李维说敌军死五万六千，显然夸大。尼禄当夜南返，把哈斯德鲁巴的头扔到汉尼拔的哨所前。据李维，汉尼拔说他看到了迦太基的命运。此后他退守布鲁提乌姆一隅，四年后被召回非洲。
sources: []
recalled:
  - 波利比乌斯《历史》卷十一第 1—3 章
  - 李维《建城以来史》卷二十七第 39—51 章
  - 阿庇安《汉尼拔战争》第 52—53 章
