name: 大禹治水
summary: 相传禹继父亲鲧治理洪水，以疏导为主，历时十三年平定水患。
body: |-
  大禹治水是中国最著名的上古传说之一。据《尚书·尧典》和《史记·夏本纪》，尧的时候洪水滔天，鲧治水九年无功，被殛于羽山；舜摄政后举用鲧的儿子禹继续治水，以伯益、后稷为辅佐。

  据《史记》，禹“劳身焦思，居外十三年，过家门不敢入”，开九州之道，陂九泽，度九山，疏导河、济、江、淮等大川入海，又令后稷教民种植；水患平息后，各地依照土地物产定下贡赋。《尚书·禹贡》即以九州为纲记述这一过程。《孟子·滕文公上》说禹“八年于外，三过其门而不入”，年数与《史记》不同。

  古人把治水看作禹取得天下的根本，舜因此向上天推荐禹为继承人。治水的规模和细节显然经过后世的扩大，《禹贡》也多被认为是战国时的作品。二十世纪以来，有学者把这一传说与约四千年前黄河流域的气候和洪水联系起来讨论，目前没有定论。

  2002 年入藏北京保利艺术博物馆的西周中期青铜器遂公盨（又称豳公盨），铭文开头说“天命禹敷土，随山浚川”，是目前所知关于大禹治水最早的文字记载，说明至迟在西周中期这一传说已经流行。

  后世各地留下许多与大禹有关的地名和遗迹，如禹门口、禹王台等，浙江绍兴会稽山下有大禹陵。
sources: []
recalled:
  - 《尚书·尧典》
  - 《尚书·禹贡》
  - 《史记·夏本纪》
  - 《孟子·滕文公上》
