name: 庞勋起义
summary: 868 年戍守桂州的徐州兵超期不得轮换，拥庞勋北归攻占徐州，次年被镇压。
body: |-
  九世纪中叶南诏多次进攻安南，唐朝从各地调兵防守。据《资治通鉴》，徐泗观察使从本地征募的士兵中分出八百人戍守桂州，约定三年一换。到咸通九年（公元 868 年），这批士兵已经戍守了六年，观察使崔彦曾又以军费不足为由，要他们再留一年。同年七月，戍卒们杀死都将王仲甫，推举粮料判官庞勋为首领，擅自北归。

  他们沿湘江、长江东下，经过浙西、淮南，一路上不少逃亡的士兵和贫苦百姓加入。十月他们攻占宿州，接着攻下徐州，杀死崔彦曾，队伍迅速扩大，占领了徐州周围的许多州县，切断了从江淮通往长安的漕运。庞勋请求朝廷任命他为节度使，遭到拒绝。

  唐懿宗任命康承训为行营都招讨使，调集各地兵马，又征调了沙陀首领朱邪赤心率领的骑兵。咸通十年（869 年）九月，庞勋在蕲县被唐军击败，战死，这次起事被镇压下去。朱邪赤心因功被赐姓名李国昌。这次事件暴露了唐朝兵力和财政的困窘，沙陀也从此登上中原的政治舞台。《新唐书·南蛮传》的赞语说“唐亡于黄巢，而祸基于桂林”，把它看作唐末大乱的开端。
sources: []
recalled:
  - 《旧唐书·懿宗纪》
  - 《新唐书·康承训传》
  - 《资治通鉴》卷二百五十一
