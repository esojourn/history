name: 安西四镇
summary: 唐朝在西域设龟兹、于阗、疏勒、碎叶四镇，与吐蕃反复争夺。
body: |-
  贞观十四年（公元 640 年）唐朝攻灭高昌，在其地设置西州，并在交河城设立安西都护府。贞观二十二年（648 年）唐将阿史那社尔攻破龟兹，此后唐朝把安西都护府迁到龟兹，并在龟兹、于阗、疏勒、碎叶设立军镇，合称“安西四镇”。四镇的组成前后有变化，有时以焉耆代替碎叶。

  唐高宗时吐蕃兴起，与唐朝争夺西域。咸亨元年（670 年），吐蕃攻陷龟兹拨换城等地，唐朝罢弃四镇，此后四镇在唐蕃之间几经得失。长寿元年（692 年），武则天命王孝杰率军击败吐蕃，收复四镇，重新设置安西都护府于龟兹。据《旧唐书·吐蕃传》，这次武则天派兵三万驻守四镇，朝中曾有人主张放弃，武则天没有采纳。此后唐朝在西域的控制稳定了下来。

  四镇控制着丝绸之路的要道，保证了东西交通的畅通。安史之乱后，唐朝把西域的精兵调回内地平叛，吐蕃趁机占领河西、陇右，安西、北庭与中原的联系被切断，守军孤军坚守数十年，到八世纪末九世纪初才相继失陷。
sources: []
recalled:
  - 《旧唐书·地理志》
  - 《旧唐书·吐蕃传》
  - 《资治通鉴》卷一百九十九至二百五
