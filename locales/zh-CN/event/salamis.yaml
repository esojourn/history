name: 萨拉米斯海战
summary: 公元前 480 年希腊联合舰队在萨拉米斯海峡击败波斯海军，扭转战局。
body: |-
  温泉关失守后，雅典人把妇孺送到特洛曾、埃吉那和萨拉米斯岛，能作战的男子都上了船。波斯军进入雅典，攻下由少数人据守的卫城，放火烧了神庙。希腊联军的舰队集中在萨拉米斯岛与阿提卡之间的海峡里。据希罗多德，共有三列桨战船三百七十八艘，其中雅典占近一半；亲历此战的埃斯库罗斯在《波斯人》里说是三百一十艘。波斯舰队的规模，埃斯库罗斯和希罗多德都说出征时有一千二百零七艘，经过风暴和阿提密西安的战斗后还剩多少，没有可靠的数字，现代的估计多在五百至八百艘之间。

  联军统帅是斯巴达人欧里比亚德斯。伯罗奔尼撒各邦的将领主张退到科林斯地峡，靠近陆军作战；雅典的地米斯托克利坚持在海峡里打，理由是狭窄的水面对船少而重的一方有利，他还表示如果舰队撤走，雅典人就举家迁往意大利。据希罗多德，眼看主张撤退的一方要占上风，他暗中派人告诉薛西斯希腊人将连夜逃走。波斯舰队当夜出动，封住海峡的出口，一支部队登上海峡中的普叙塔勒亚小岛。从埃吉那赶来的阿里斯提德带来了被包围的消息。

  天亮后波斯战船驶入海峡。按埃斯库罗斯和希罗多德的描写，希腊人先是向后划，然后转身冲撞。波斯的船挤在一起，前面的后退不得，后面的还在向前涌，互相碰撞，桨被折断。薛西斯在对岸的山脚下设座观战，身边有书记记下立功者的名字。哈利卡纳苏斯的女王阿尔特米西娅为了脱身撞沉了一艘己方的船，薛西斯以为她击沉的是敌船。到傍晚，波斯舰队退回法勒隆。狄奥多罗斯说希腊人损失四十艘，波斯人损失两百多艘。阿里斯提德率步兵登上普叙塔勒亚，歼灭了岛上的波斯人。

  薛西斯的舰队已不足以保障大军的补给，季节也已入秋。他率一部分军队经陆路退回小亚细亚，留马铎尼斯率精兵在色萨利过冬。次年的普拉提亚之战最后结束了这次入侵。
sources: []
recalled:
  - 希罗多德《历史》卷八第 40—125 章
  - 埃斯库罗斯《波斯人》第 337—471 行
  - 狄奥多罗斯《历史丛书》卷十一第 15—19 章
  - 普鲁塔克《地米斯托克利传》第 10—16 章
