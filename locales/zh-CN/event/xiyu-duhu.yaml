name: 设西域都护
summary: 匈奴日逐王降汉后，汉宣帝任命郑吉为西域都护，驻乌垒城，西域各国从此归汉朝统辖。
body: |-
  张骞通西域和李广利伐大宛以后，汉朝在轮台、渠犁驻兵屯田，设使者校尉管理，为往来的使者供应粮食。但匈奴在西域仍有很大的势力：统领匈奴西部的日逐王设有“僮仆都尉”，常驻在焉耆一带，向各国征收赋税。位于天山东段的车师靠近匈奴，控制着北道的入口，汉与匈奴为它反复争夺了数十年。

  据《汉书·西域传》和《郑吉传》，宣帝时侍郎郑吉在渠犁屯田，地节二年（公元前 68 年）率屯田士卒和西域各国的军队攻破车师，此后受命保护鄯善以西的南道各国。这时匈奴发生内乱。神爵二年（前 60 年），日逐王先贤掸因为与新立的单于有旧怨，率部众投奔郑吉。郑吉调集渠犁、龟兹等国的五万人把他迎到汉地，宣帝封他为归德侯。僮仆都尉随之撤销，匈奴的势力退出西域。

  宣帝命郑吉在南道之外兼护车师以西的北道，因为统管南北两道而称“都护”。西域都护的府治设在乌垒城。《西域传》说这里距阳关二千七百余里，靠近渠犁的屯田区，土地肥沃，位于西域的中央。都护的职责是督察乌孙、康居等国的动静，有变故就上报，能安抚的加以安抚，需要讨伐的发兵讨伐。各国的国王和主要官员由汉朝颁给印绶。元帝初元元年（前 48 年），又在车师设戊己校尉，专管屯田。

  当时西域号称三十六国，后来分为五十余国，南到昆仑山，西到葱岭。《西域传》说，汉朝的号令通行于西域，是从张骞开始而到郑吉完成的。从郑吉到王莽时，先后担任都护的有十八人。王莽末年西域各国背叛，最后一任都护死在那里，西域与中原的联系中断，到东汉班超时才重新恢复。
sources: []
recalled:
  - 《汉书·西域传》
  - 《汉书·傅常郑甘陈段传》
  - 《汉书·百官公卿表》
