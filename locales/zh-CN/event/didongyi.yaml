name: 张衡造候风地动仪
summary: 公元 132 年，太史令张衡造成候风地动仪，是史书记载最早的验震仪器。
body: |-
  据《后汉书·张衡传》，顺帝阳嘉元年（公元 132 年），太史令张衡“复造候风地动仪”。本传用一百多字描述了这件仪器：用精铜铸成，直径八尺，形状像酒樽，顶盖隆起；内部正中有一根“都柱”，旁边通出八条轨道，装有机关；外面有八条龙，头朝八个方向，口中各衔一枚铜丸，下面各有一只蟾蜍张口承接。某处发生地震，仪器内的机关被触动，朝着那个方向的龙就吐出铜丸，落入蟾蜍口中，发出响声，看守的人由此知道哪个方向发生了地震。

  本传还记载了一次验证：有一天一条龙吐了丸，雒阳却没有人感到地动，京师的学者都怪它不灵；过了几天驿使赶到，报告陇西发生了地震，众人这才信服。此后朝廷让史官记录地震发生的方位。

  东汉中期地震频繁，仅张衡任职期间，史书记载的较大地震就有多次，这是他制作这件仪器的背景。地动仪的实物没有保存下来，传文对内部结构的描述又很简略。十九世纪以来，中外学者依据这段文字提出过多种复原方案，对“都柱”是直立的柱还是悬挂的摆有不同理解。今天常见的地动仪形象都是现代人的复原模型，并非原物。
sources: []
recalled:
  - 《后汉书·张衡列传》
