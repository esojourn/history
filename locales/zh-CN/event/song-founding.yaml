name: 刘裕代晋
summary: 晋恭帝禅位于宋王刘裕，东晋灭亡，宋朝建立，中国历史进入南北朝时期。
body: |-
  义熙十三年（公元 417 年）刘裕灭后秦东归后，代晋的步骤加快。次年六月他接受相国、宋公的封号和九锡；年底派人缢杀不能理事的晋安帝，立安帝的弟弟司马德文为帝，即晋恭帝。元熙元年（419 年）他进爵为宋王，把治所移到寿阳。

  据《宋书·武帝纪》和《资治通鉴》，刘裕想受禅而难以开口，在一次宴会上对群臣说，自己当年首倡大义、兴复晋室，如今功成名就，打算奉还爵位，回京养老。在座的人只是称颂功德，只有中书令傅亮领会了他的意思，当夜请求回建康办理此事。元熙二年（420 年）四月朝廷征刘裕入辅，六月他到达建康。傅亮把拟好的禅位诏书草稿呈给恭帝，请他照抄。恭帝欣然提笔，对左右说：桓玄篡位的时候，晋朝已经失去天下，靠刘公才又延续了将近二十年，今天的事，我本来就心甘情愿。

  六月，刘裕在建康南郊设坛即皇帝位，国号宋，改元永初。史家为了与后来赵匡胤建立的宋朝相区别，称之为刘宋。恭帝被降封为零陵王，迁居秣陵，由军队看守。他害怕被毒害，饮食都由王妃在床前亲手烧煮。永初二年（421 年）九月，刘裕派去的士兵翻墙进屋，用被子把他闷死。前朝退位的皇帝被新君杀害，在这以前没有先例，此后南朝各代的末帝大多不得善终。

  东晋自大兴元年（318 年）元帝称帝，至此历十一帝、一百零三年；如果从西晋泰始元年算起，两晋合计一百五十五年。刘裕出身低微，靠军功起家。他建立的朝廷里，王、谢等高门子弟仍然占据清贵的官位，实权则逐渐转到皇帝信任的寒门出身的官员和武将手中，这与东晋“王与马，共天下”的局面已大不相同。

  一般把这一年作为南朝的开始。在北方，北魏正在逐一消灭十六国中余下的几个政权，太延五年（439 年）统一了黄河流域。南方的宋、齐、梁、陈与北方的北魏及其后继者长期对峙，合称南北朝，直到开皇九年（589 年）隋灭陈才重新统一。
sources: []
recalled:
  - 《宋书·武帝纪》
  - 《晋书·恭帝纪》
