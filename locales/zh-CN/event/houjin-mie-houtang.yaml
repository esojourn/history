name: 后晋灭后唐
summary: 936 年石敬瑭引契丹兵击败后唐军，受契丹册立为帝，次年初李从珂自焚。
body: |-
  后唐末帝李从珂与河东节度使石敬瑭互相猜忌。清泰三年（公元 936 年）五月，李从珂下令调石敬瑭离开太原，改任天平军节度使。石敬瑭拒不奉命，上表指责李从珂是明宗的养子，不应继承帝位。李从珂派大将张敬达率军包围太原。

  石敬瑭兵力不足，采纳桑维翰的建议，派人向契丹皇帝耶律德光求援，表示愿意称臣，以父礼事契丹，并许诺割让卢龙一道及雁门关以北诸州。刘知远认为称臣即可，不必许以割地和父子之礼，石敬瑭没有采纳。九月，耶律德光亲率骑兵从雁门南下，在太原城下大败张敬达，后唐军退守晋安寨，被契丹和晋军包围。

  十一月，耶律德光在太原册立石敬瑭为大晋皇帝，石敬瑭随即与契丹签订割地之约。后唐的卢龙节度使赵德钧也派人与契丹交涉，企图取而代之，经桑维翰力争，耶律德光才没有改变主意。被围困在晋安寨的后唐军粮尽援绝，副将杨光远杀了张敬达，率军投降。

  石敬瑭与契丹军随即南下，后唐军队纷纷溃散或投降。闰十一月（已是公历 937 年初），李从珂登上洛阳的玄武楼自焚，后唐灭亡，石敬瑭进入洛阳。李从珂自焚前，派人杀了投奔后唐的契丹东丹王耶律倍。后唐自 923 年建立，共十四年。
sources: []
recalled:
