name: 冒顿自立
summary: 冒顿以鸣镝训练部下，射杀父亲头曼，自立为匈奴单于。
body: |-
  事情起于继承之争。据《史记·匈奴列传》，匈奴单于头曼原以冒顿为太子，后来宠爱的阏氏生了少子，头曼想改立少子，便把冒顿送到月氏作人质，随后又急攻月氏。月氏要杀冒顿，冒顿盗得良马逃回。头曼认为他勇壮，让他统领万骑。

  冒顿制作了鸣镝（响箭），下令“鸣镝所射而不悉射者，斩之”。他先后用鸣镝射自己的良马、爱妻，不敢跟着射的部下都被处死；后来射单于的良马，左右全都跟着放箭，冒顿知道部下已经可用。此后他随头曼出猎，以鸣镝射头曼，部下随之射杀头曼。冒顿接着诛杀后母、弟弟和不听从的大臣，自立为单于。

  《史记》没有写明年份，《史记集解》引徐广说在秦二世元年，即公元前 209 年，后世多从此说；事发地点史书未载。冒顿即位后陆续击破东胡、月氏。《史记》说，匈奴的世系和官号到他这一代才“可得而记”。
sources:
  - 《史记·匈奴列传》 https://zh.wikisource.org/wiki/史記/卷110
  - 《史记集解》引徐广说 https://zh.wikisource.org/wiki/史記三家註/卷110
