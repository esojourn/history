name: 葵丘之会
summary: 前 651 年齐桓公在葵丘大会诸侯，周襄王派使者赐胙，齐桓公的霸业达到顶点。
body: |-
  齐桓公任用管仲后，以“尊王攘夷”为号召，北伐山戎，存邢救卫，南下伐楚订立召陵之盟，屡次会合诸侯，成为霸主。公元前 651 年夏，桓公与鲁、宋、卫、郑、许、曹等国君在葵丘会盟，周襄王派宰孔前来，赐给桓公祭祀文王、武王的胙肉，并特许他不必下拜。桓公听从管仲的意见，仍然下堂拜受。

  同年秋天诸侯在葵丘订立盟约。据《孟子·告子下》，盟约的内容包括：诛杀不孝的人，不得改换太子，不得以妾为妻；尊重贤人、培育人才；敬老慈幼，不怠慢宾客旅人；士不世袭官职，不得擅杀大夫；不得筑堤阻水、遏止粮食流通，不得封赏而不告知盟主等。盟辞最后说：“凡我同盟之人，既盟之后，言归于好。”《左传》僖公九年所记与此略有不同。

  葵丘之会被看作齐桓公霸业的顶峰。此后不久，管仲、桓公先后去世，齐国陷入内乱，霸主地位旁落。

  据《左传》僖公九年，周王的使者宰孔提前离开，路上遇到正赶去赴会的晋献公，劝他不必去，说齐侯“不务德而勤远略”，可见齐国的霸权这时已开始引起各国的不满。孔子则称桓公“正而不谲”（《论语·宪问》）。

  葵丘的地望有今河南民权、兰考等不同说法。
sources: []
recalled:
  - 《左传》僖公九年
  - 《孟子·告子下》
  - 《史记·齐太公世家》
