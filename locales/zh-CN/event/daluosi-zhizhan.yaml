name: 怛罗斯之战
summary: 751 年高仙芝率唐军在中亚怛罗斯与阿拔斯王朝的军队交战，因葛逻禄倒戈而大败。
body: |-
  唐朝灭西突厥后，势力深入中亚，阿拉伯帝国也在七世纪向东扩张，到八世纪初占领了中亚的河中地区，双方在这一带的利益逐渐发生冲突。天宝九载（公元 750 年），安西节度使高仙芝以石国（今塔什干一带）无礼为由出兵，先与石国约和，又乘其不备袭击，俘获石国国王押送长安处死。石国王子逃到中亚诸国控诉，诸国联合当时刚刚建立的阿拔斯王朝（唐人称为黑衣大食），准备进攻安西四镇。

  天宝十载（751 年），高仙芝决定先发制人，据《资治通鉴》，他率领蕃、汉兵三万人，深入七百余里，到达怛罗斯城（今哈萨克斯坦塔拉兹一带），与大食军相遇。双方相持五天，唐军中的葛逻禄部临阵倒戈，与大食军夹击唐军，唐军大败，据同书，士卒死亡殆尽，剩下的只有几千人。高仙芝在部将李嗣业的保护下撤回安西。

  这次战役在阿拉伯史书中也有记载。唐军中有不少人被俘，其中的杜环在西亚等地生活了十余年后回国，写成《经行记》，记述了大食等地的见闻，提到在大食见到来自中国的织工和画匠，原书已佚，部分内容保存在他的族叔杜佑的《通典》中。阿拉伯文献中有中国俘虏把造纸术传到撒马尔罕的说法，但这一说法出自后来的记载，学界看法不一。

  怛罗斯之战后，唐朝在西域的地位并没有立即动摇，高仙芝的继任者封常清不久还攻破了大勃律。真正使唐朝退出中亚的，是四年后爆发的安史之乱。
sources: []
recalled:
  - 《资治通鉴》卷二百一十六
  - 《旧唐书·高仙芝传》
  - 杜佑《通典·边防》引杜环《经行记》
