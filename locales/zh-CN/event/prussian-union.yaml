name: "普鲁士教会合并"
summary: "1817 年普鲁士国王下令合并路德宗与改革宗，成立“普鲁士联合教会”。"
body: |-
  普鲁士的霍亨索伦王室自 1613 年起信奉改革宗，臣民则大多属路德宗。《历史的轨迹》第三十九章说，1648 年威斯特伐利亚和约使德国改革宗与路德宗享有同等权利；改革宗信徒大部分在莱茵河一带和勃兰登堡；1685 年南特诏谕废除时，成千上万的胡格诺信徒逃到勃兰登堡避难。

  该书说，1817 年普鲁士国王下令强迫路德宗与改革宗联合，当时软弱的改革宗教会只能提出微弱的抗辩；联合之后，除了靠近荷兰边界的两个小地区外，改革宗教会在德国几乎完全消灭。据一般记载，国王腓特烈·威廉三世借宗教改革三百周年之机宣布合并，并颁行统一的礼仪；坚持旧路德宗信仰的人反对最力，有一部分在 1830 年代移居美国和澳大利亚。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
