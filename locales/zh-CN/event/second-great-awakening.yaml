name: "第二次大觉醒"
summary: "十八、十九世纪之交在美国东部大学和西部拓荒区先后兴起的复兴，带出露天聚会和差会。"
body: |-
  《历史的轨迹》第四十四章说，紧接大觉醒之后，灵性急速下降，部分原因是英国自然神论和法国怀疑主义的影响；十八世纪末到十九世纪初是美国基督教史上教会最软弱的时期，西部拓荒者中争吵、打架、酗酒、渎神都是常事。

  书中说，这时东部默默出现复兴：循道派的传道方式传到新英格兰，1789 年亚斯理派出第一个联区骑马讲员到这里，不久联区网布满各州；1795 年起爱德华兹的外孙德怀特任耶鲁校长，指出自然神论的危险，1802 年起耶鲁三分之一学生归向基督，达特茅斯、阿默斯特、威廉斯和新泽西学院也经历复兴。东部这次复兴没有布道家，也没有感情冲动。

  西部则完全不同。书中说，1796 年麦格雷迪在肯塔基洛根县牧会，借他的讲道开始了西部大复兴，1800 年在红河边的聚会达到高潮，从此开始了露天聚会：人们带着几天的生活用品聚到空地上，一次聚会可延续四天四夜，夜里营火、帐篷、灯笼、讲员的劝勉和数千人的歌声交织，人们见到自己的罪，有的哭，有的喊。复兴主要由长老会引起，长老会分裂后，浸礼派和循道派投入，信徒大增。据一般记载，规模最大的是 1801 年 8 月肯塔基的甘蔗岭聚会，人数据称上万至两万。

  书中说，这次复兴为教会带来许多信徒，也促成了分裂的趋势：从长老会分出坎伯兰长老会、基督徒教会和门徒教会，循道派中也分出几派；同时又带出许多超宗派和宗派的差会、宣教刊物、主日学、神学院和基督教大学，1808 到 1840 年间东部至少成立了二十五间神学院。据一般记载，“第二次大觉醒”后期的代表人物是芬尼，书中第四十五章称他为当时伟大的奋兴家。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十四章“十九世纪初期的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter49.html"
