name: 均田令与租庸调
summary: 624 年唐朝颁布律令，重定均田制，按丁授田，并规定每丁缴纳租、调、服庸的数额。
body: |-
  北魏孝文帝时开始推行均田制，北齐、北周和隋朝相继沿用。唐朝建立后，武德七年（公元 624 年）颁布新的律令，重新规定了均田制和与之配套的赋役制度。

  据《旧唐书·食货志》，按照武德七年的规定，男子年满十八岁的丁男、中男授田一顷，其中八十亩为口分田，死后要还给官府，二十亩为永业田，可以传给子孙；年老、残疾的授田四十亩，寡妻妾三十亩。贵族和官员按品级另授永业田。土地狭小的“狭乡”授田减半。

  赋役方面实行租庸调法：每丁每年向国家交纳粟二石，称为“租”；交纳绢二丈、绵三两，不产丝绢的地方交布和麻，称为“调”；每年为国家服役二十天，不服役的可以按每天三尺绢的标准交纳代役的绢布，称为“庸”。遇到水旱灾害，按受灾程度减免。

  这套制度以国家掌握户籍和土地为前提，在唐前期大体得到执行，为国家提供了稳定的财政收入，也是府兵制的经济基础。但均田制实际执行时，授田常常达不到规定的数额，到唐玄宗时，土地兼并加剧，大量农民逃亡，户籍失实，均田制和租庸调法逐渐难以为继。安史之乱后户籍更加混乱，建中元年（780 年）唐德宗采纳杨炎的建议，改行按资产和田亩征税的两税法，租庸调法从此废止。
sources: []
recalled:
  - 《旧唐书·食货志》
  - 《新唐书·食货志》
  - 《唐六典·户部》
