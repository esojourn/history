name: 萨珊波斯取代帕提亚
summary: 公元 224 年阿尔达希尔一世击杀帕提亚王，建立萨珊王朝。
body: |-
  帕提亚王国到三世纪初已十分虚弱。王权本来就受几家大贵族牵制，王室内部又常年争位；罗马皇帝图拉真、马可·奥勒留的部将和塞普提米乌斯·塞维鲁三次攻下都城泰西封。217 年帕提亚王阿尔达班四世在尼西比斯挡住了罗马人，得到一大笔赔款，但他同时还在与自己的兄弟争夺王位。

  波西斯是古代波斯帝国的故地，由几个半独立的小王统治。出自萨珊家族的阿尔达希尔在三世纪初成为其中之一，随后吞并四邻，向东西两面扩张，又擅自筑城。阿尔达班命附近的总督讨伐，没有成功，于是亲自出兵。公元 224 年 4 月 28 日，两军在霍尔木兹甘平原交战，阿尔达班阵亡。这个日期是根据后来的波斯、阿拉伯文献推算的，战场的位置不能确指。此后两三年里阿尔达希尔进占泰西封，称“众王之王”。帕提亚王室的一支在亚美尼亚继续为王，长期与新王朝为敌。

  萨珊王朝自认继承了古代波斯的荣耀。它的国王在波西斯的崖壁上、紧挨着大流士等人的陵墓刻下自己受命于神的浮雕；罗马一方的史家说，阿尔达希尔要求收回波斯人祖先拥有的直到爱琴海的土地。新王朝对地方的控制比帕提亚严密，琐罗亚斯德教的祭司与王权结合，逐渐形成有等级的教会组织，基督教、摩尼教等在境内时而受容许，时而遭逼迫。

  对罗马来说，东方从此有了一个强硬得多的对手。230 年阿尔达希尔就攻入美索不达米亚；他的儿子沙普尔一世三次大败罗马军，260 年生俘皇帝瓦勒良。罗马被迫把大量兵力和财力常年放在幼发拉底河一线，这是三世纪危机的原因之一。两国此后相持四百年，直到七世纪双双被阿拉伯人击败，萨珊王朝在 651 年灭亡。中国史书称它为“波斯”，北魏以后屡有使节往来。
sources: []
