name: 开封保卫战
summary: 1126 年正月金军首次围攻开封，李纲主持守城，宋朝答应割地赔款后金军撤走。
body: |-
  宣和七年（公元 1125 年）十月，金朝分两路伐宋。东路军由完颜宗望率领，从平州南下，燕京的宋将郭药师投降，金军长驱直入；西路军由完颜宗翰率领，进围太原。宋徽宗惊慌失措，十二月传位给太子赵桓，即宋钦宗，自己随即南逃。

  靖康元年（1126 年）正月，宗望的东路军渡过黄河，直逼开封。钦宗也想出逃，太常少卿李纲力劝他留下坚守，被任命为亲征行营使，主持城防。金军到达城下后，攻打宣泽门、酸枣门等处，李纲率领军民奋力抵抗，打退了金军的多次进攻。

  与此同时，宰相李邦彦等人主张议和。金朝提出的条件十分苛刻，据《三朝北盟会编》，要求宋朝交纳黄金五百万两、白银五千万两，以及大量的牛马和绢帛，割让太原、中山、河间三镇，并以亲王、宰相为人质。钦宗一概答应，派康王赵构和少宰张邦昌到金营为质，在城中大肆搜刮金银。不久种师道等各路援军陆续到达开封，兵力超过金军。二月初，宋将姚平仲夜袭金营失败，主和派借机罢免李纲。太学生陈东率领数万军民到宫门前上书，要求恢复李纲的职务，钦宗只好重新起用李纲。

  金军见攻城不下，宋朝援军越来越多，又已得到割地的诏书，于二月撤兵北返。种师道建议趁金军渡河时追击，没有被采纳。金军撤走后，宋朝君臣以为危险已过，又拒绝交割三镇，李纲被调离京城，各路援军也被遣散。这年秋天，金军以宋朝背约为理由再次南下（另见“靖康之变”条）。
sources: []
recalled:
  - 李纲《靖康传信录》
  - 《宋史·钦宗本纪》《李纲传》
  - 《三朝北盟会编》卷二十四至四十
  - 《靖康要录》
