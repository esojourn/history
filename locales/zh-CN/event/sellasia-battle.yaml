name: 塞拉西亚战役
summary: 公元前 222 年马其顿与亚该亚联军击败克列奥美涅斯三世，占领斯巴达。
body: |-
  斯巴达国王克列奥美涅斯三世在公元前 227 年废除监察官、重分土地之后，连败亚该亚同盟，伯罗奔尼撒许多城市倒向他。亚该亚同盟的领袖阿拉托斯宁可把科林斯卫城交还马其顿，也不愿让克列奥美涅斯做同盟的统帅，于是请来马其顿国王安提柯三世。前 224 年安提柯南下，次年组成“希腊同盟”，逐一收回阿尔戈斯等城。克列奥美涅斯靠埃及托勒密三世的津贴维持雇佣军；据波利比乌斯，会战前十天他得到消息，托勒密已停止资助并劝他议和，所以只能速战。

  前 222 年夏（一说前 223 年），克列奥美涅斯在斯巴达以北约十二公里的塞拉西亚设防。通往斯巴达的大路在这里沿奥伊努斯河谷穿过两座山之间：他让兄弟欧克莱达斯率边民和盟军守左边的欧阿斯山，自己率斯巴达人和雇佣军守右边的奥林波斯山，两处都筑了壕沟和栅栏，骑兵放在中间的河谷。据波利比乌斯，他共有约二万人；安提柯有步兵二万八千、骑兵一千二百，其中马其顿方阵一万人，其余是亚该亚、彼奥提亚、伊利里亚等盟军和雇佣兵。

  安提柯观察了几天，然后分别进攻。对欧阿斯山，他用伊利里亚人和马其顿的“铜盾兵”交错排列，夜间预先埋伏在山脚。进攻开始后，克列奥美涅斯放在中央的轻装雇佣兵从侧后袭击上山的队伍。这时亚该亚骑兵中的年轻军官菲洛皮门不待命令，带本城的骑兵冲击对面的敌骑，把那些轻装兵引了回去。欧克莱达斯没有趁敌人爬坡时下山冲击，而是在山顶等候，结果被推下另一面的陡坡，全军覆没。

  奥林波斯山这边，克列奥美涅斯看到兄弟失利，拆除栅栏，全军出击。斯巴达方阵起初把马其顿人推得后退，安提柯命方阵收紧队列、长矛齐下，以双倍的纵深反推回去。斯巴达人溃散。据普鲁塔克，六千名斯巴达人只有二百人生还。

  克列奥美涅斯逃回城中，随即乘船去了埃及。安提柯进入斯巴达，没有破坏，废除了克列奥美涅斯的改革，恢复监察官，几天后因伊利里亚人入侵马其顿而北返，不久病逝。斯巴达从此不再是伯罗奔尼撒的强国；马其顿通过希腊同盟重新成为希腊本土的主宰，直到罗马人到来。
sources: []
recalled:
  - 波利比乌斯《历史》卷二第 65—70 章
  - 普鲁塔克《克列奥美涅斯传》第 27—30 章；《菲洛皮门传》第 6 章
