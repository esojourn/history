name: 兴教门之变
summary: 926 年魏州兵变，李嗣源被乱军拥立；洛阳禁军随即作乱，庄宗李存勖中箭而死。
body: |-
  后唐庄宗李存勖灭梁之后，宠信伶人和宦官，刘皇后聚敛钱财，而军士的粮饷常常不足，同光三年（公元 925 年）又遇上大水灾，百姓流离。同光四年（926 年）正月郭崇韬在成都被杀，朝中大将人人自危，各地谣言四起。

  同年二月，戍守贝州的魏博军士兵作乱，推皇甫晖等人为首，占据了邺都（魏州）。庄宗派大将李嗣源前去讨伐，李嗣源到达邺都城下的当晚，部下发生哗变，与城中乱军联合，拥李嗣源为主。李嗣源起初表示要回朝自辩，但他的奏章被阻拦，庄宗又不信任他，他于是在女婿石敬瑭等人的劝说下率军南下，占据了汴州。

  庄宗亲自率军东出，到荥阳一带时听说李嗣源已入汴州，军心离散，只好返回洛阳。四月初一，禁军将领郭从谦（他原是伶人，因军功做了禁军将领）率部作乱，进攻洛阳宫城的兴教门。庄宗率领身边的卫士抵抗，被流箭射中，不久死去。据《新五代史》，伶人收集乐器堆在他的尸体上焚化。

  几天后，李嗣源进入洛阳，先称监国，不久即皇帝位，就是后唐明宗。欧阳修在《新五代史·伶官传序》中以庄宗为例，说明“忧劳可以兴国，逸豫可以亡身”，并说祸患常常积于细微之处。
sources: []
recalled:
  - 《旧五代史·唐书·庄宗纪》
  - 《新五代史·伶官传》
  - 《资治通鉴》卷二百七十四至二百七十五
