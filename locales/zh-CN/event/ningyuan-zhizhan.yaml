name: 宁远之战
summary: 1626 年袁崇焕坚守宁远，用西洋大炮击退努尔哈赤。
body: |-
  天启二年（1622 年）广宁失守后，明朝退守山海关。大学士孙承宗督师辽东，采纳袁崇焕的建议修筑宁远城，又收复了锦州等地，形成了关外的防线。天启五年（1625 年）孙承宗被魏忠贤排挤去职，新任经略高第认为关外不可守，下令撤回锦州、宁远等地的军民。袁崇焕当时任宁前道，坚决拒绝撤退，表示要与宁远共存亡。

  天启六年（1626 年）正月，努尔哈赤率领大军渡过辽河，进攻宁远。袁崇焕与总兵满桂等人坚壁清野，把城外的居民和物资撤入城中，刺血为书，激励将士，又把从澳门葡萄牙人那里购得的西洋大炮（时称“红夷大炮”）安放在城上。后金军连续两天猛攻城墙，在炮火下伤亡很大，努尔哈赤被迫撤退，转而攻打觉华岛，焚烧了明军囤积的粮草。

  宁远之战是努尔哈赤起兵以来遭受的第一次重大挫败，明朝称为“宁远大捷”，袁崇焕因此升任辽东巡抚。同年八月努尔哈赤去世，关于他是否在宁远之战中受了炮伤，明朝和朝鲜的一些记载有这样的说法，清朝的记载则说他死于疾病。次年皇太极进攻宁远和锦州，又被袁崇焕等人击退，明朝称为“宁锦大捷”。

  宁远之战也显示了西洋火炮在明清战争中的作用。此后明朝继续通过澳门购买和仿制西洋大炮，后金在得到投降的明朝工匠之后也开始自己铸造，称为“红衣大炮”，到松锦之战时，清军的火炮已经占有优势。
sources: []
recalled:
  - 《明史·袁崇焕传》
  - 《明熹宗实录》
