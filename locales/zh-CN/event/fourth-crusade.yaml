name: 第四次十字军
aliases:
  - 1204 年君士坦丁堡陷落
  - 拉丁帝国的建立
summary: 第四次十字军没有去圣地，1204 年攻占并洗劫君士坦丁堡，在那里建立拉丁帝国。
body: |-
  1198 年英诺森三世一即位就号召新的十字军，目标是埃及。带头的是法国北部的一批贵族，他们与威尼斯订约，由威尼斯造船运送。1202 年到威尼斯集合的人数远少于预计，付不出约定的船费。威尼斯总督提出，十字军先帮威尼斯夺回亚得里亚海对岸的扎拉城，欠款可以缓付。扎拉是基督徒的城，属匈牙利国王，教皇事先明令禁止，十字军仍在 1202 年 11 月攻下了它，一度全体受到绝罚。

  这时东罗马一位被废皇帝的儿子来到军中，许诺只要帮他父亲复位，就付给巨款、出兵助战，并使希腊教会服从罗马。1203 年 7 月十字军兵临君士坦丁堡，扶他父子重登帝位。许诺的钱付不出来，城里人又恨这对父子引来外兵，1204 年初发生政变，两人被杀。十字军决定自己夺城，4 月 12 日攻破城墙，接连抢掠了三天，教堂和修道院也不能幸免，大批圣物和珍宝被运往西欧。

  他们推举佛兰德伯爵为皇帝，另立了拉丁礼的主教长，威尼斯分得最有利的港口和岛屿。希腊人在尼西亚等地另立政权，1261 年收复了君士坦丁堡。

  《历史的轨迹》第十八章说，这次十字军偏离了目标，在途中不去耶路撒冷而攻打君士坦丁堡，在那里设立“拉丁王国”，其统治者承认自己臣属于教皇，所以有一段时期连罗马帝国也成了罗马教会的领土，这是英诺森三世权势达到顶峰的一个标记。英诺森本人起初以为东西教会由此合一而感到欣慰，得知劫掠的详情后，写信严厉责备了十字军的首领。对东方教会来说，1204 年留下的仇恨比 1054 年的互相处分深得多，此后的合一努力都没有成功。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
