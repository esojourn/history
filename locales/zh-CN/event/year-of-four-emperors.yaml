name: 四帝之年
summary: 尼禄死后一年半内，加尔巴、奥托、维特利乌斯、韦斯巴芗相继称帝，内战遍及意大利。
body: |-
  公元 68 年春，高卢总督文德克斯起兵反对尼禄，推西班牙的老总督加尔巴出面。文德克斯很快败死，但禁卫军也抛弃了尼禄。6 月 9 日尼禄自杀，奥古斯都开创的尤利乌斯—克劳狄王朝断绝，由谁来做皇帝第一次没有了成规。

  加尔巴进了罗马，为人严苛又吝啬，不肯兑付别人以他名义许给士兵的赏金。69 年 1 月 1 日，莱茵河的军团拒绝向他宣誓，随后拥立下日耳曼统帅维特利乌斯。加尔巴选了一个年轻贵族做继承人，落空的奥托买通禁卫军，1 月 15 日在罗马广场杀死加尔巴，自立为帝。

  维特利乌斯的军队分两路越过阿尔卑斯山。4 月 14 日两军在克雷莫纳附近的贝德里亚库姆交战，奥托兵败，两天后自杀。维特利乌斯夏天进入罗马。这时东方的军团已另有打算：7 月 1 日埃及总督率部在亚历山大城向正在平定犹太的韦斯巴芗宣誓，叙利亚和多瑙河的军团相继响应。多瑙河的军团由安东尼乌斯·普里穆斯率领抢先攻入意大利，10 月下旬在贝德里亚库姆再战获胜，随后把克雷莫纳洗劫了四天。12 月战火烧进罗马城，卡皮托山上的朱庇特神庙被焚，韦斯巴芗的哥哥被杀；20 日前后维特利乌斯被拖到街上处死。元老院承认了韦斯巴芗。

  同一时期，莱茵河口的巴达维人在基维利斯带领下起事，一度与高卢的部族合流，到 70 年才平定；犹太的战事也拖到这一年耶路撒冷陷落。

  塔西佗的《历史》现存部分写的就是这一年多的事。他在开头说，这时泄露了一个帝国的秘密：皇帝可以不在罗马产生。此后军队拥立成了皇位更替的常事。韦斯巴芗出身意大利小城的骑士之家，他建立的弗拉维王朝延续了二十七年。
sources: []
