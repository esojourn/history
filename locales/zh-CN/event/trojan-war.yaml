name: 特洛伊战争
summary: 相传希腊联军围攻特洛伊十年；是否确有其事、发生在何时，没有定论。
body: |-
  按希腊人的传说，特洛伊王子帕里斯拐走了斯巴达王墨涅拉奥斯的妻子海伦，墨涅拉奥斯的兄长、迈锡尼王阿伽门农率希腊各地的首领渡海围攻特洛伊，十年后用木马计破城。荷马的《伊利亚特》只写了第十年里的几十天，《奥德赛》里提到木马；战争的起因和结局见于已失传的其他史诗和后来的悲剧。

  古希腊人把这场战争当作真实的往事，但给出的年代相差很大。希罗多德认为它在自己的时代以前约八百年，合公元前 13 世纪中叶；公元前 3 世纪的埃拉托色尼推算特洛伊在前 1184 年或前 1183 年陷落，这个年代后来最为通行，这里的年份即取此说，只是传统的推算。修昔底德相信确有其事，同时指出诗人会夸大，并用他那个时代的常识推测远征军的规模其实不大。

  1870 年代起，施里曼在小亚细亚西北角的希沙利克发掘，找到了层层叠压的古城，一般认为这里就是特洛伊。其中第六层的晚期和第七层的早期（约前 1300 年至前 1180 年）城墙高大，分别有毁于地震和战火的迹象，哪一层对应传说中的城，学者意见不一。赫梯的文书里提到小亚细亚西部有一个叫“维鲁萨”的地方，以及一个叫“阿希亚瓦”的海外强国，不少学者认为分别对应希腊语里特洛伊的别名“伊利昂”和荷马对希腊人的称呼“阿开亚人”。

  今天多数学者认为，史诗里可能保留了青铜时代晚期希腊人在小亚细亚沿海作战的记忆，但经过几百年的口头流传，人物和情节已不能当作史实；也有人认为整个故事纯属虚构。
sources: []
recalled:
  - 希罗多德《历史》卷二第 145 章
  - 修昔底德《伯罗奔尼撒战争史》卷一第 9—11 章
  - 施里曼《伊利昂》（1880）
