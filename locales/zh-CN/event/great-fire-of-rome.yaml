name: 罗马大火
summary: 公元 64 年 7 月罗马城连烧九天，十四个区只有四个完好。
body: |-
  公元 64 年 7 月 18 日夜里，大竞技场靠近帕拉丁山和凯利乌斯山一端的店铺起火。那一带堆着易燃的货物，又刮着风，火顺着竞技场烧开，窜进狭窄弯曲的街巷。塔西佗《编年史》卷 15 说，大火烧了六天，在埃斯奎利诺山脚下被拆出的空地挡住，随后又在别处复燃，再烧三天。全城十四个区，三个夷为平地，七个只剩残垣，完好的只有四个；许多古老的神庙和历代积存的战利品、希腊艺术品都毁了。死了多少人没有记载。

  起火时尼禄在安提乌姆。他赶回罗马，开放战神原野、公共建筑和自己的花园安置灾民，从奥斯蒂亚等地运来粮食，把粮价压到很低。可是城里传言，说他在火起时登台吟唱特洛伊的陷落。塔西佗只把这当作传言记下，苏维托尼乌斯和卡西乌斯·狄奥则直说火是他叫人放的；塔西佗自己说，是意外还是皇帝的诡计，各家说法不一。现代学者大多认为是失火。

  塔西佗接着写道，为了平息传言，尼禄把罪名加给“民众称为基督徒的那些人”，用残酷的办法处死了他们。这件事本站另有“尼禄迫害基督徒”一条。

  灾后重建有了规矩：街道要宽、要直，楼房限高，底层必须用石料，各户之间不得共用墙壁，临街修柱廊以便救火。尼禄自己在烧空的市中心圈出大片土地，修建有人工湖和园林的“金宫”，民怨更重。重建的开销摊到意大利和各行省头上，银币的成色也在这一年降低。第二年就发生了皮索密谋行刺的事件。
sources: []
