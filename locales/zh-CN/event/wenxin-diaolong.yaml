name: 《文心雕龙》成书
summary: 刘勰在齐末写成《文心雕龙》五十篇，是中国古代体系最完整的文学理论著作。
body: |-
  刘勰早年依附高僧僧祐，住在建康定林寺十余年。《文心雕龙》的成书时间，一般根据书中《时序》篇把齐朝称为“皇齐”，推定在齐末，约齐和帝中兴年间（公元 501—502 年）。书成之后不为时人所重，据《梁书》本传，刘勰背着书守在沈约车前，沈约读后大为称赏，常放在案头。

  全书五十篇，用骈文写成。前五篇《原道》《征圣》《宗经》《正纬》《辨骚》是“文之枢纽”，认为文章本于自然之道，应当以圣人的经典为准则，同时肯定《楚辞》的成就。其后二十篇分论各种文体，从《明诗》《乐府》《诠赋》到《书记》，按有韵的“文”和无韵的“笔”分别论述，每种文体都追溯源流、解释名称、评论代表作品、归纳写作要领。

  再后二十四篇论述创作和批评：《神思》讲构思和想象，《体性》讲作品风格与作者个性的关系，《风骨》讲文章的气势与骨力，《通变》讲继承与革新，《情采》讲内容与文采，《时序》讲文学随时代变迁，《知音》讲如何评论作品。最后一篇《序志》是全书的自序，说明写作的缘由和体例。

  刘勰不满当时追求辞藻、内容空洞的文风，提出应当“为情而造文”，而不是“为文而造情”。这部书在唐宋时影响有限，明清以后受到越来越多的重视，近代以来成为中国古代文论研究的中心，研究它的学问被称为“龙学”。
sources: []
recalled:
  - 刘勰《文心雕龙》
  - 《梁书·文学传·刘勰》
