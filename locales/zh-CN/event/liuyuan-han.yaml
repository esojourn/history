name: 刘渊建汉
summary: 匈奴贵族刘渊在并州左国城自称汉王，后称帝，是内迁各族在中原建立政权的开始。
body: |-
  东汉以来，南匈奴陆续迁入塞内，到西晋时聚居在并州中部的汾水流域。曹操把他们分为五部，由匈奴贵族任部帅，另派汉人官员监督。入晋以后，匈奴部民要向官府纳税服役，不少人沦为汉人地主的佃客和奴婢，单于的称号也已废除。八王之乱中朝廷失去控制，五部的贵族看到了恢复旧业的机会。

  据《晋书·载记》，永兴元年（公元 304 年），匈奴贵族刘宣等人秘密商议，说从前匈奴与汉约为兄弟，如今单于徒有虚名，没有尺土，现在司马氏骨肉相残，正是复兴之时，于是共推在邺城任职的左部帅之子刘渊为大单于。刘渊向成都王颖请求回并州，征发匈奴兵来对付王浚、司马腾引来的鲜卑人，得到同意。他一到左国城就即大单于位，很快聚集起数万人。

  部下劝他恢复呼韩邪单于的事业，他认为要取天下就不能只做匈奴的首领。同年十月，他在左国城南郊筑坛，自称汉王，改元元熙，说汉朝恩德长久，自己是汉室的外甥，兄亡弟绍，理所应当。他追尊蜀汉后主刘禅为孝怀皇帝，立汉高祖以下三祖五宗的神主来祭祀，并设置百官。

  并州刺史司马腾几次派兵来讨都被击败，后来带着并州的百姓东下冀州就食，并州大部落入汉国之手。上党的羯人石勒、东莱的王弥等各路武装也来归附，替他攻掠冀州、青州、兖州。永嘉二年（308 年）刘渊称皇帝，次年迁都平阳，开始派兵进攻洛阳。

  刘渊的汉国和同年李雄在成都建立的政权，标志着西晋统一局面的解体。此后一百三十多年间，匈奴、羯、鲜卑、氐、羌等族和汉人先后在北方和蜀地建立了二十来个政权，北魏崔鸿为其中的十六个各写了一部史书，合称《十六国春秋》，“十六国”的名称由此而来。
sources: []
recalled:
  - 《晋书·刘元海载记》
  - 《资治通鉴》卷八十五、八十六
