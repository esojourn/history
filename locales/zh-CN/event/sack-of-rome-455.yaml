name: 汪达尔人洗劫罗马
summary: 公元 455 年盖萨里克率汪达尔舰队攻入罗马，搜刮十四天，掳走皇后母女。
body: |-
  公元 442 年西罗马与汪达尔人订约时，盖萨里克的儿子胡内里克与皇帝瓦伦提尼安三世的长女订了婚。455 年 3 月 16 日瓦伦提尼安遇刺，主使的元老佩特罗尼乌斯·马克西穆斯第二天即位，强娶了皇后欧多克西娅，又把那位公主许给自己的儿子。在盖萨里克看来，婚约和和约都作废了。六世纪的史书说是欧多克西娅暗中写信请他来的，这个说法同时代的记载里没有，真假难辨。

  5 月底，汪达尔舰队出现在台伯河口。罗马城里没有可用的军队，人们纷纷出逃。5 月 31 日，马克西穆斯骑马想逃出城，被人群用石头砸死，肢体被扔进台伯河，在位七十多天。三天后盖萨里克进城。罗马主教利奥一世带着教士在城门外迎见他。据普洛斯佩尔，利奥说动了他不放火、不杀人、不施酷刑，只取财物。

  汪达尔人在城里有条不紊地搜刮了十四天，比 410 年哥特人的三天彻底得多。皇宫里的金银器物和雕像被搬空；普罗科匹厄斯说，卡皮托山朱庇特神庙的镀金铜瓦被揭走一半，提图斯当年从耶路撒冷圣殿取来的器物也在其中，还说有一条满载雕像的船在回程中沉没。各教堂的圣器同样被拿走，利奥许诺过的三座大教堂是否得以保全，记载不一。成千的居民被带到迦太基为奴，其中有许多工匠。维塔的维克多记，迦太基主教德奥格拉提亚斯变卖教堂的金银器皿，赎出被拆散的家庭，把两座教堂腾出来安置病人。欧多克西娅和两个女儿也被带走，长女嫁给了胡内里克，母亲和幼女七年后才被送到君士坦丁堡。

  罗马城没有被焚毁，但从此一蹶不振。此后二十年，西部的皇帝由握有兵权的蛮族统帅废立，几次征讨汪达尔人都告失败。十八世纪末法国有人用“汪达尔主义”一词指肆意毁坏文物的行为，就是从这件事来的，虽然古代的记载说的是掠夺而不是破坏。圣殿的器物后来在 534 年被东罗马的军队从迦太基夺走。
sources: []
