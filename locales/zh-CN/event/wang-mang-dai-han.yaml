name: 王莽代汉
summary: 王莽以外戚身份辅政，先称“摄皇帝”，三年后借符命即位，改国号为新，西汉灭亡。
body: |-
  西汉后期，皇帝多年幼或早逝，朝政长期由太后的亲属掌握。元帝的皇后王政君历成帝、哀帝、平帝三朝为太后、太皇太后，她的兄弟和侄子先后有五人担任大司马。成帝、哀帝、平帝都没有儿子，帝位三次由旁支入继。当时社会上流行汉朝气数已尽、应当让位给贤人的说法。王莽以谦恭俭朴和礼贤下士闻名，在儒生和官吏中声望很高。

  元寿二年（公元前 1 年）哀帝去世，王政君召王莽回朝任大司马，立九岁的平帝。据《汉书·王莽传》，此后几年里王莽受封“安汉公”，又加“宰衡”的称号，女儿被立为皇后。他扩建太学，征召各地学者到长安，自己多次推辞封赏。本传说，元始五年（公元 5 年）官民上书请求给他加赏的有四十八万七千余人，朝廷于是赐他“九锡”。

  同年十二月平帝去世。王莽从宗室中选了年仅两岁的刘婴为继承人，称“孺子”。这时有人报告在井中得到一块白石，上有“告安汉公莽为皇帝”的红字。王政君起初斥为欺人之谈，后来被迫同意让王莽仿照周公辅佐成王的先例代行天子之事，称“摄皇帝”，改年号为“居摄”。居摄二年（公元 7 年），东郡太守翟义起兵讨伐王莽，拥立宗室刘信为帝，几个月后被镇压下去。

  此后各地争相进献符命。居摄三年（公元 8 年）冬，梓潼人哀章制作了一只铜匮，里面的文书说汉高祖把帝位传给王莽，黄昏时送到高帝庙。王莽随即到高庙拜受，戴上皇冠去见太皇太后，然后坐上未央宫前殿，宣布即真天子位，定国号为“新”，改正朔，以十二月初一为始建国元年正月初一，这一天已进入公元 9 年。孺子婴被封为定安公。

  西汉自高祖称帝起历时二百一十年，至此终结。王莽没有经过战争就取得了帝位。班固认为他是靠伪装和欺诈窃取天下；也有学者指出，他的上台得到了当时相当多官吏和儒生的真心拥护，是西汉后期的社会危机和“改制”“禅让”思潮共同造成的结果。
