name: 德拉古立法
summary: 约公元前 621 年，雅典有了第一部成文法。
body: |-
  公元前 7 世纪的雅典由贵族出身的执政官和战神山议事会治理，法律是口耳相传的习惯。约前 632 年，贵族库隆企图占据卫城自立为僭主，失败后他的同党在祭坛边被杀，由此引起的家族仇杀和渎神的争执延续多年。古代年代学家把德拉古的立法定在前 621 年或前 620 年，一般认为与这种局面有关。

  德拉古把法律写成条文公布，判案从此有了公开的依据。他的法律以刑罚严厉著称，据普鲁塔克，偷窃这样的轻罪也处死。约三十年后梭伦废除了其中除杀人法以外的全部条文。杀人法规定，非故意杀人者应当流亡，由死者的亲属决定是否宽恕；杀人案由城邦的审判官裁断，而不是任凭两个家族私下了结。前 409 年至前 408 年雅典人把这部分法律重刻于石碑，残石今存。

  “德拉古式的”一词后来在欧洲语言里成为“严酷”的同义语。
sources: []
recalled:
  - 《雅典政制》第 4、7 章
  - 普鲁塔克《梭伦传》第 17 章
  - 重刻德拉古杀人法的铭文（IG I³ 104）
