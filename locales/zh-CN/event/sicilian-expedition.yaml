name: 西西里远征
summary: 公元前 415 年至前 413 年雅典倾力远征叙拉古，全军覆没。
body: |-
  公元前 416 年，西西里岛西部的塞杰斯塔与邻邦交战，向雅典求援，并许诺负担军费。雅典使者去查看，被带着在各家宴饮，看到的其实是同一批借来传用的金银器皿。前 415 年公民大会决定出兵，以尼西阿斯、亚西比德和拉马科斯为统帅，名义上是援助盟邦，实际的目标是征服叙拉古以至全岛。修昔底德说，多数雅典人并不清楚西西里有多大、有多少居民。尼西阿斯反对出兵，亚西比德力主。第一批舰队有三列桨战船一百三十四艘、重装步兵五千一百人，修昔底德说这是到那时为止一个城邦派出的最昂贵、最壮观的远征军。

  出发前夕发生了赫耳墨斯石像被毁的事件。舰队到达西西里后，亚西比德被召回受审，中途逃往斯巴达。尼西阿斯在前 415 年秋打了一次胜仗就退回过冬。前 414 年春雅典人登上叙拉古城外的厄庇波莱高地，开始修筑围城的墙；拉马科斯在一次战斗中阵亡。就在围墙即将合拢时，斯巴达人吉利普斯带着援兵进城，筑起横墙截断了围墙。尼西阿斯抱病，写信回国求援。

  前 413 年，斯巴达人在阿提卡的狄凯利亚筑垒，雅典仍然派出第二支大军，由德摩斯梯尼和欧律墨冬率领，有战船七十三艘、重装步兵五千人。德摩斯梯尼夜袭厄庇波莱失败，主张立刻撤军。尼西阿斯先是不肯，后来又因 8 月 27 日的月食而坚持等待二十七天。叙拉古人在大港里连胜两场海战，用船只和铁链封住港口。9 月雅典舰队全力突围失败，士兵拒绝再登船。

  约四万人丢下伤病者，从陆路撤退。他们缺粮缺水，沿途不断遭到骑兵和轻装兵袭击。第六天德摩斯梯尼的后队被围投降；两天后尼西阿斯的一部在阿西纳洛斯河边，士兵争着下河喝水时遭到屠杀，尼西阿斯投降。两位将军被处死。据修昔底德，至少七千名俘虏被关在叙拉古的采石场里，白天曝晒，夜里受冻，每人每天只得半品脱水和一品脱粮食，七十天后，除雅典人和西西里、意大利的希腊人外都被卖为奴隶。修昔底德说，这是这场战争中、在他看来也是希腊历史上最大的一次行动，对胜利者最光荣，对失败者最悲惨，去的人很多，回来的很少。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷六、卷七
  - 普鲁塔克《尼西阿斯传》第 12—30 章
  - 狄奥多罗斯《历史丛书》卷十二第 82—84 章；卷十三第 1—33 章
