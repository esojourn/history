name: 卡拉卡拉敕令
summary: 公元 212 年卡拉卡拉把罗马公民权授给帝国境内几乎全部自由民。
body: |-
  罗马公民权原本只属于罗马城和意大利的人。几百年里，它靠个别授予、在辅助部队服满役、担任本城官职等途径逐步扩散到各行省，到二世纪末，行省的上层人物大多已是公民，但帝国居民的大多数仍然不是。公民与非公民适用的法律不同：婚姻、继承、契约的形式，受审时的待遇，纳哪几种税，都有差别。

  公元 212 年，杀了弟弟盖塔、独掌大权不久的卡拉卡拉颁布敕令，把公民权授给帝国境内的全体自由居民。这道敕令因他的正式名字安东尼努斯而称为“安东尼努斯敕令”。同时代的记载只有寥寥几句。法学家乌尔比安在著作里说：“在罗马世界里的人，都依安东尼努斯皇帝的敕令成了罗马公民。”卡西乌斯·狄奥说，皇帝名义上是给大家荣誉，实际是为了多收税，因为遗产税和释奴税只有公民才交，他刚把税率从二十分之一提到十分之一。

  二十世纪初入藏德国吉森大学的一张纸草保存着敕令希腊文本的残片。从残文看，皇帝自称要为脱险而感谢诸神，使更多的人一同敬拜；其中有一句把某类人排除在外，因纸草残缺，究竟指谁，学者争论了一百多年，多数认为是战败投降而没有本邦身份的人。

  敕令颁布时似乎没有引起多大震动。新公民照例用皇帝的族名，“奥勒留”从此成了帝国东部最常见的名字。各地的地方法并没有立刻消失，但罗马私法在原则上成了全帝国通用的法律，三世纪的法学著作和后来查士丁尼的法典都以此为前提。公民权不再是特权之后，法律上的区别转到了“上等人”和“下等人”之间，后者可以被拷问、鞭打和处以酷刑。把帝国全体居民看作同一个国家的成员，这个观念也由此确立。
sources: []
