name: 萨尔浒之战
summary: 1619 年明朝四路大军进攻后金，被努尔哈赤各个击破，三路覆没。
body: |-
  万历四十六年（1618 年）努尔哈赤起兵攻陷抚顺，又攻破清河堡，明朝朝野震动。朝廷任命杨镐为辽东经略，从全国各地调集军队，加上朝鲜和叶赫部的援兵，号称四十七万，实际约十万人（各书估计不一），准备一举消灭后金。

  万历四十七年（1619 年）二月，杨镐坐镇沈阳，兵分四路进攻后金都城赫图阿拉：西路由山海关总兵杜松率领，从抚顺出发，是主力；北路由开原总兵马林率领，会合叶赫兵；南路由辽东总兵李如柏率领，从清河出发；东路由辽阳总兵刘綎率领，会合朝鲜军，从宽甸出发。由于大雪和部署失误，四路军没有能够同时到达。

  努尔哈赤采取“凭尔几路来，我只一路去”的方针，集中八旗主力迎击。三月初一，杜松急于立功，抢先渡过浑河，分兵进攻吉林崖，留在萨尔浒的大营被后金军攻破，杜松率领的部队在吉林崖下全军覆没，杜松战死。次日，努尔哈赤在尚间崖击败马林的北路军。随后他回师南下，在阿布达里岗设伏，击败刘綎的东路军，刘綎战死，朝鲜军投降。杨镐急令李如柏撤退，南路军才得以保全。前后五天，明军三路覆没，文武官员战死三百多人，士兵阵亡约四万五千多人（据《明史》等记载）。

  萨尔浒之战是明清战争中的关键一战。此后后金转入进攻，攻陷开原、铁岭，灭叶赫部，天启元年（1621 年）攻占沈阳、辽阳，明朝在辽东完全处于守势。杨镐后来被逮捕下狱，崇祯年间被处死。
sources: []
recalled:
  - 《明史·杨镐传》
  - 《清太祖武皇帝实录》
