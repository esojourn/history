name: 里昂殉道事件
aliases:
  - 里昂和维也纳的逼迫
summary: 公元 177 年高卢里昂和维也纳两地教会遭逼迫，数十人殉道。
body: |-
  公元 177 年，高卢的里昂和附近的维也纳两处教会遭到逼迫。经过记在两地教会写给亚西亚和弗吕家众教会的一封信里，优西比乌把它大段收进了《教会史》卷 5，《历史的轨迹》第二章据此叙述。

  事情从民众的敌意开始：基督徒先是被禁止进入浴场和市场，继而被殴打、抓捕。信徒家里不信的奴隶在刑讯下供称基督徒吃人肉、乱伦，群情更加激愤。年过九十的主教波提努受审后死在狱中。总督就如何处置有罗马公民身份的人请示皇帝，答复是坚持的处死、否认的释放。于是公民被斩首，其余的人在节期的集会上被投给野兽，女奴白兰地娜是最后受死的人之一。殉道者的尸体示众六天后焚烧，骨灰撒进罗讷河。

  当时在里昂作长老的爱任纽受托带信去罗马，不在城中，后来接任主教。后世的殉道者名录记下四十八个名字。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
recalled:
  - 里昂和维也纳教会的信，见优西比乌《教会史》卷 5 第 1—4 章
