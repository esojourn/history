name: 钱镠修捍海塘
summary: 910 年吴越王钱镠征发民工，用竹笼装石修筑钱塘江海塘，保护杭州城免受潮水侵袭。
body: |-
  钱塘江口的潮水汹涌，杭州城东南一带屡受侵蚀，原有的土堤常被冲毁。开平四年（公元 910 年）八月，吴越王钱镠征发民工修筑捍海塘。据宋人记载，当时潮水太猛，版筑的土堤难以成功，于是改用竹子编成长笼，里面装满石块，层层垒放，再在外面打下大木桩加固，堤坝才得以筑成。

  宋人笔记中还流传着“钱王射潮”的传说：说钱镠命数百名弓弩手对着潮头放箭，潮水因而退去，海塘才能修成。这是后人附会的故事，不可当作史实。

  捍海塘修成后，杭州城外的土地得到保护，城市得以向外扩展。此后历代都在钱塘江北岸修筑海塘，五代的竹笼石塘是其中较早有明确记载的一次。1980 年代，杭州江城路一带曾发掘出五代捍海塘的遗迹，证实了文献中竹笼填石、木桩加固的做法。
sources: []
recalled:
  - 《吴越备史》
  - 《新五代史·吴越世家》
  - 沈括《梦溪笔谈》卷十一
