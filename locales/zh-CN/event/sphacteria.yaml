name: 皮洛斯与斯法克特里亚之战
summary: 公元前 425 年雅典人在皮洛斯围困并俘获近三百名斯巴达重装步兵。
body: |-
  公元前 425 年春，一支开往西西里的雅典舰队被风暴逼进伯罗奔尼撒西南岸的皮洛斯。随船的德摩斯梯尼主张在这里筑垒，此处有天然的港湾，周围是麦西尼亚人的故土，可以策动希洛人。士兵们闲着无事，用六天垒起了工事，舰队留下五艘船和他一起防守，继续前行。

  斯巴达人闻讯从阿提卡撤军，调集陆海军来攻，并派四百二十名重装步兵和随行的希洛人登上横在港湾外面的斯法克特里亚岛，以防雅典人利用。德摩斯梯尼在滩头挡住了从海上的强攻，伯拉西达在这次登陆中负伤。雅典舰队折回后冲入港湾，击败斯巴达舰队，岛上的人被切断了退路。

  斯巴达公民人数本来就少，岛上有不少出自显贵之家。斯巴达立即在当地订立休战，把全部战船交雅典人暂管，派使者到雅典求和，提议结盟。在克里昂的主张下，雅典要求对方先交出人和尼塞亚等地，谈判破裂，雅典人以对方违约为由扣下了战船。围困拖了两个多月，岛上的人靠希洛人泅水、驾小船偷运粮食支撑，雅典一方反而缺水缺粮，眼看冬季将至。克里昂在公民大会上夸口说换了他去二十天就能解决，被尼西阿斯顺势让出了指挥权。

  克里昂带着轻盾兵和弓箭手到达。此前岛上的树林被一场意外的火烧掉，守军的人数和位置暴露出来。德摩斯梯尼让八百名重装步兵黎明登岛，随后放上数千轻装兵，分成小队从四面用箭、标枪和石块袭击，不与对方接战。斯巴达人退到岛北端的旧工事里，一支轻装兵从背后的悬崖攀上去，他们陷于两面受敌。雅典人停手劝降。守军请示了对岸的本国人，得到的答复是“自行决定，但不可做可耻的事”，于是放下了武器。四百二十人中活着的有二百九十二人，其中约一百二十人是斯巴达公民。

  修昔底德说，这是整场战争中最出乎希腊人意料的事，因为人们一向以为斯巴达人无论饥饿还是别的困境都不会缴械。雅典声明，如果斯巴达再入侵阿提卡就处死这些俘虏；斯巴达此后一再求和，直到前 421 年才把人换回。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷四第 2—41 章
