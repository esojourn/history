name: "博因河之战"
summary: "1690 年威廉三世在爱尔兰博因河击败詹姆士二世，詹姆士逃回法国。"
body: |-
  《历史的轨迹》第三十一章说，1689 年被逐的詹姆士二世想夺回王位，在法军援助下登陆爱尔兰。南爱尔兰人是天主教徒，站在詹姆士一边；北爱尔兰人是复原教徒，站在威廉一边，称“奥兰治党”。1690 年两军在博因河决战（7 月 1 日，按后来的历法为 7 月 12 日）。

  该书说，詹姆士在远处观战，一见自己的军队失败，立刻逃往法国；威廉虽然负伤，仍身先士卒，表现出极大的勇气与领袖气质。作者认为威廉因此为复原教主义保全了荷兰、英国与美洲，此后再没有因复原教与天主教的分歧而引起的战争。据一般记载，爱尔兰的战事延续到 1691 年的利默里克条约才结束；北爱尔兰的奥兰治会至今每年 7 月 12 日游行纪念这场战役，它在当地仍是敏感的话题。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
