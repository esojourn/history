name: "联合计划"
summary: "长老会与公理会约定在西部合作建堂，按会众多数决定行政制度，结果多数成了长老会。"
body: |-
  《历史的轨迹》第四十四章说，长老会和公理会都接受加尔文派信条，只是行政组织不同。西部人口膨胀时，两派都发现在新地区面对的使命极重，于是采用 1801 年通过的“联合计划”，同意合作在西部建立新教会：新教会可以从两个宗派中自由聘请牧师；多数信徒是长老派的，即使牧师是公理派，也按长老会条例治理，反之亦然。书中说，这个计划实际上有利于长老会，因为长老派信徒较多，宗派意识也较强；据估计，纽约、俄亥俄、伊利诺伊和密歇根约有二千间本来是公理派的教会变成了长老会，这些教会也在西部普遍设立中学和大学。

  第四十五章说，联合计划下在纽约州中部、俄亥俄、密歇根、印第安纳、伊利诺伊、威斯康星成立的许多教会，由新英格兰公理派和苏格兰裔爱尔兰长老派这两种完全不同的信徒组成，公理派受新英格兰自由神学影响，越来越远离传统加尔文主义，这成了 1837 年长老会分裂的背景。据一般记载，联合计划由长老会总会与康涅狄格公理会总会议定，1837 年被长老会旧派废止。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十四章“十九世纪初期的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter49.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
