name: 毕昇发明活字印刷
summary: 宋仁宗庆历年间平民毕昇发明胶泥活字印刷，事见沈括《梦溪笔谈》。
body: |-
  雕版印刷在唐代已经出现，五代时冯道主持用雕版印行儒家经典，到宋代雕版印书已经相当普遍。但雕版印刷每印一部书都要刻一整套书版，费工费时，书版也要占很大的地方保存。

  据沈括《梦溪笔谈》卷十八记载，宋仁宗庆历年间（1041—1048 年），有一位平民毕昇发明了活版印刷。他用胶泥刻成单字，用火烧硬，排版时在铁板上铺一层松脂、蜡和纸灰的混合物，按文章把字印排进铁框，加热使混合物熔化，用平板压平字面，冷却后就可以印刷。他准备两块铁板交替使用，一块印刷，一块排字，印刷完毕再加热，字印就可以拆下来重复使用。常用字准备二十多个印，冷僻字临时刻制。沈括说，如果只印两三本，这种方法未必简便，如果印几十、几百、上千本，就非常快速。

  这是世界上关于活字印刷最早的记载，比欧洲古登堡的金属活字印刷早约四百年。沈括说毕昇死后，他的字印被沈括的子侄辈收藏。泥活字后来在宋元时期继续有人使用，南宋周必大曾用胶泥铜版印书；元代王祯改用木活字，并发明了转轮排字架，记载在他的《农书》中。不过在中国古代，由于汉字字数繁多，雕版印刷始终是印书的主要方法。活字印刷后来传到朝鲜半岛等地，朝鲜半岛在十三世纪前后发展出了金属活字。
sources: []
recalled:
  - 沈括《梦溪笔谈》卷十八《技艺》
  - 王祯《农书》附《造活字印书法》
  - 周必大《与程元成给事札子》
