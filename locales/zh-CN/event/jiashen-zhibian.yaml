name: 甲申之变
summary: 1644 年三月李自成的大顺军攻破北京，崇祯帝在煤山自缢，明朝在北方的统治结束。
body: |-
  崇祯十七年（1644 年，干支为甲申）正月，李自成在西安建立大顺政权，随即率军东征，渡过黄河，经山西攻向北京。沿途明朝的宁武关守将周遇吉力战而死，大同、宣府的守将相继投降。崇祯帝曾想南迁，又顾虑大臣的议论而犹豫不决；他下诏让吴三桂放弃宁远入关勤王，吴三桂行动迟缓，没有赶到。

  三月十七日大顺军包围北京，城中守军缺饷，士气低落。十八日，太监曹化淳等人打开彰义门（一说为广宁门）迎降，外城失陷。当夜崇祯帝命皇后自尽，又亲手砍伤长平公主，砍死几位妃嫔和公主。十九日凌晨，他在煤山（今景山）的一棵树上自缢身亡，身边只有太监王承恩一人相随。当天李自成从德胜门进入北京。

  大顺军进城后，起初秩序尚可，随后对明朝的勋戚、官员实行“追赃助饷”，用刑拷打，强迫他们交出钱财，一些将领也纵兵掠夺，人心逐渐背离。李自成派人招降驻守山海关的吴三桂，吴三桂起初准备归降，后来据说因为父亲吴襄被拷打、爱妾陈圆圆被夺等原因改变了主意，转而与清军联合（关于陈圆圆一事，吴伟业《圆圆曲》有“冲冠一怒为红颜”之句，史家对它的作用看法不一）。四月李自成亲征山海关，被吴三桂和清军击败（另见“清军入关”条）。

  甲申之变标志着明朝在北方统治的结束，史家通常以这一年作为明朝灭亡之年。此后明朝的宗室在南方先后建立弘光、隆武、永历等政权，史称“南明”（另见“南明”条）。明末遗民和清初的学者对明朝灭亡的原因有许多反思，郭沫若在 1944 年写了《甲申三百年祭》。
