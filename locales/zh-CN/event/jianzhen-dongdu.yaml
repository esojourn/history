name: 鉴真东渡
summary: 扬州高僧鉴真应日本僧人之请，第六次东渡才成功，754 年到达平城京。
body: |-
  八世纪前期，佛教在日本已经广泛传播，但还没有按照戒律为出家人正式授戒的制度。天平五年（公元 733 年），日本僧人荣睿、普照随遣唐使来到唐朝，寻访能够到日本传戒的高僧。天宝元年（742 年），他们来到扬州，在大明寺拜见鉴真。据《唐大和上东征传》，鉴真问弟子们谁愿意应日本之请，众人沉默不语，他说这是为了佛法，何惜身命，你们不去，我就去。

  此后几年间，鉴真五次东渡都没有成功：第一次因弟子之间的纠纷被人诬告与海盗勾结，被官府阻止；第二次船只出海后遇风触礁；第三、四次分别被官府和弟子劝阻；天宝七载（748 年）第五次东渡，在海上漂流十四天，到达海南岛南端的振州。在辗转返回扬州的途中，荣睿病死，鉴真也因为暑热和劳累双目失明。

  天宝十二载（753 年），日本遣唐大使藤原清河等人回国，邀请鉴真同行。由于唐朝官府不许他出境，他秘密搭乘副使大伴古麻吕的船只，十月从扬州附近出发，十二月在日本九州的萨摩登陆。与他同行的大使藤原清河和阿倍仲麻吕所乘的船则被风吹到安南。次年二月，鉴真到达平城京，受到朝廷的隆重欢迎。四月，他在东大寺卢舍那大佛殿前设立戒坛，为圣武太上皇等人授戒。

  鉴真在日本住了十年，建立了唐招提寺，传授律学，被尊为日本律宗之祖。随他东渡的弟子和工匠还带去了佛经、佛像、书法真迹和医药知识，对日本的佛教、建筑、雕塑、书法和医药都有影响。
sources: []
recalled:
  - 淡海三船《唐大和上东征传》
  - 日本《续日本纪》
