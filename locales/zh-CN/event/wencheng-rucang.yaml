name: 文成公主入藏
summary: 641 年唐太宗把宗室女文成公主嫁给吐蕃赞普松赞干布，开启了唐蕃之间的和亲往来。
body: |-
  七世纪初，松赞干布统一了青藏高原的大部分地区，建立吐蕃王朝。贞观八年（公元 634 年）吐蕃首次遣使到唐朝，随后请求通婚，没有得到允许。据《旧唐书·吐蕃传》，使者回去后说是吐谷浑从中离间，松赞干布便出兵攻打吐谷浑，贞观十二年（638 年）又进攻唐朝的松州，被唐军夜袭击败，随即退兵谢罪，再次请婚。

  贞观十四年（640 年），吐蕃大相禄东赞带着黄金五千两和大批珍宝到长安下聘，太宗答应以宗室女文成公主相嫁。传世的《步辇图》描绘的就是太宗接见禄东赞的场面。贞观十五年（641 年）正月，太宗命江夏王李道宗持节护送公主入蕃。松赞干布率兵到柏海迎接，向李道宗行子婿之礼。据同传，他回国后对亲近的人说，祖辈没有与上国通婚的，自己能娶到大唐公主，感到十分荣幸，于是为公主修筑了一座城。

  此后吐蕃派贵族子弟到长安国子监学习诗书，又请求唐朝派人掌管文书，传入了蚕种和酿酒、造纸、制墨的工匠。藏文史籍和民间传说中关于文成公主的故事很多，如带去佛像、修建寺庙、传授农艺等，多为后世所述，细节难以确考。

  文成公主入藏后，唐蕃之间保持了约二十年的和平。松赞干布死后，吐蕃与唐朝争夺吐谷浑故地和西域，双方长期交战。中宗景龙四年（710 年），唐朝又把金城公主嫁给吐蕃赞普。后来唐蕃会盟的盟文中常以“甥舅”相称，即源于这两次和亲。
sources: []
recalled:
  - 《旧唐书·吐蕃传》
  - 《新唐书·吐蕃传》
  - 《资治通鉴》卷一百九十五至一百九十六
