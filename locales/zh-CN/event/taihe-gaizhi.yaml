name: 太和改制
summary: 冯太后执政时推行俸禄制、均田制和三长制，均田制一直沿用到唐代中期。
body: |-
  北魏前期，官吏没有固定的俸禄，靠战争掠夺、朝廷赏赐和向百姓索取为生，贪污成风。长期战乱之后，北方许多土地荒芜，流民很多；地方上的豪强称为“宗主”，包庇了大量依附人口，这些人不向国家纳税服役，朝廷能控制的户口很少。冯太后临朝期间，与孝文帝一起推行了一系列改革，史称“太和改制”。

  太和八年（公元 484 年），北魏开始给官吏发放俸禄，为此每户增收一定数量的帛和粮食；同时规定，发放俸禄之后，官吏贪赃满一匹绢的就处死。

  太和九年（485 年），朝廷采纳李安世的建议，颁布均田令。据《魏书·食货志》，男子十五岁以上授给露田四十亩，妇人二十亩，因为要轮流休耕，实际加倍授给；露田不准买卖，年老或死后归还国家。男子另授桑田二十亩，作为世业，不必归还。奴婢和耕牛也可以按规定受田，地主因而仍能保有较多的土地。

  太和十年（486 年），朝廷采纳李冲的建议，废除宗主督护，设立三长：五家为一邻，五邻为一里，五里为一党，各设一长，负责检查户口、催征赋税、征发徭役。与此相配合，规定一夫一妇每年交帛一匹、粟二石的新租调。这样一来，原来依附豪强的人口大量登记为国家的编户，国家的赋税收入大为增加。

  均田制此后被东魏、北齐、北周、隋、唐沿用，直到唐代中期推行两税法后才废止，前后约三百年。至于当时的土地究竟在多大程度上按规定实际授受，学者之间有不同看法。
sources: []
recalled:
  - 《魏书·食货志》
  - 《魏书·李冲传》
  - 《魏书·李安世传》
