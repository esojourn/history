name: 腓立比战役
summary: 安东尼和屋大维在马其顿的腓立比两次会战，击败布鲁图和卡西乌斯，二人先后自尽。
body: |-
  公元前 42 年 10 月，后三头的安东尼和屋大维在马其顿东部的腓立比城外两次会战，击败刺杀恺撒的布鲁图和卡西乌斯。

  布鲁图和卡西乌斯在前 43 年控制了从马其顿到叙利亚的东方行省，向各城和附庸国王征集钱粮，舰队掌握着制海权。前 42 年夏他们在萨迪斯会师，渡过赫勒斯滂西进。安东尼和屋大维把大部分军团运过亚得里亚海，沿埃格纳提亚大道东进。据阿庇安，双方各有十九个军团在场。

  腓立比城西有一片平原，南面是延伸到海边的沼泽，北面是山。共和派先到，两座营垒跨在大道两侧的高地上，背后有港口补给；他们打算固守，等对方粮尽。三头一方的补给线要经过被敌方舰队封锁的海面，利在速战。屋大维在渡海后病倒，是坐着担架到的战场。

  10 月初的第一战，安东尼先在沼泽里修堤道，想切断对方通海的道路，随后转而强攻，冲破卡西乌斯的防线并夺了他的营垒。与此同时，布鲁图的士兵击溃屋大维的军团，攻入其营地；屋大维本人不在营中，他后来在回忆录里说是因为友人的梦兆而离开的。两边各胜一翼，尘土使谁也看不清全局。卡西乌斯以为布鲁图也已战败，让被释奴隶杀死了自己。同一天，三头一方运送援兵的船队在亚得里亚海被共和派舰队歼灭。

  布鲁图把卡西乌斯的部队并过来，继续坚守。但他约束不住急于求战的军官和士兵，又担心有人倒戈。约三周后他出营列阵。这一战两军短兵相接，布鲁图的战线被逐渐向后推，最后溃散。布鲁图带残部退到山上，次日将士不肯再战，他让友人帮他自尽。

  阵亡和战后被处死的人中有小加图的儿子、卢库卢斯的儿子和霍滕西乌斯的儿子。诗人贺拉斯当时在布鲁图军中任军事保民官，后来在诗里说自己丢下了盾牌。战后安东尼威望最高，得到东方；屋大维回意大利去办安置老兵这件招怨的事。共和派作为一支有军队的力量，到此结束。
sources: []
recalled:
  - 阿庇安《内战史》卷四第 86—138 章
  - 普鲁塔克《布鲁图传》第 38—53 章
  - 卡西乌斯·狄奥《罗马史》卷四十七第 35—49 章
  - 贺拉斯《颂诗集》卷二第 7 首
