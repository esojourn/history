name: 苏拉独裁与公敌宣告
summary: 苏拉内战获胜后任不设期限的独裁官，以公敌名单清洗政敌，立法恢复元老院的主导。
body: |-
  公元前 82 年至前 79 年，苏拉在内战获胜后出任独裁官，清洗政敌并改订国家制度。

  前 83 年春苏拉率军从希腊回到布伦迪西乌姆。秦纳已死，执政一方由卡尔波和马略之子小马略领导，兵多而不齐心。梅特卢斯·庇乌斯、克拉苏和自募三个军团的庞培投到苏拉一边。前 82 年小马略被困在普雷奈斯特。11 月 1 日，一支萨莫奈人的军队直扑罗马，在科林门外与苏拉激战到深夜，苏拉获胜；据普鲁塔克，他把数千名投降者集中在战神广场附近杀死，惨叫声传到他正在讲话的元老院。

  随后是“公敌宣告”。苏拉公布名单，名列其上的人任何人可以杀死，杀人者领赏，死者财产充公拍卖，子孙不得任官。据阿庇安，头一批是四十名元老和约一千六百名骑士；瓦勒里乌斯·马克西穆斯给的总数是四千七百人。许多人是因为有钱或有仇家而上了名单。伊特鲁里亚和萨莫奈的一些城市被没收土地，用来安置他的老兵，阿庇安说有十二万人。年轻的恺撒因是秦纳的女婿，一度有性命之忧。

  前 82 年底，人民大会任命他为“制定法律和整顿国家的独裁官”，不设期限。独裁官一职已有一百二十年没有人担任过。他的立法意在恢复元老院的主导：元老增补到约六百人，由每年二十名财务官卸任后自动补入；陪审团全由元老组成；保民官不得再竞选其他官职，否决权和立法权都受限制；严格规定任职的最低年龄和先后次序；大法官增至八人，设常设法庭；总督不得擅自带兵出省或开战；取消粮食配给。

  他辞去独裁官的确切时间有争议；前 80 年他任了一年执政官，然后退隐，前 78 年病逝。同年执政官雷必达就起兵要推翻他的安排。前 70 年庞培和克拉苏任执政官时恢复了保民官的全部权力。他的法庭和行政规章大多沿用下去，而他本人留下的先例——带兵进罗马、以名单杀人——比他的法律影响更久。
