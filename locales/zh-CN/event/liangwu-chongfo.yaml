name: 梁武帝崇佛
summary: 梁武帝笃信佛教，断酒肉，亲自讲经，四次舍身同泰寺，江南佛教盛极一时。
body: |-
  梁武帝萧衍早年兼通儒、道，即位后转而笃信佛教。据唐代道宣编的《广弘明集》，天监三年（公元 504 年）他发愿舍道事佛，这篇文字的真伪学者有不同看法。

  他持戒严格，每天只吃一顿饭，不吃肉、不饮酒，据《梁书》，他五十岁以后断绝房事。他写了《断酒肉文》，召集僧尼宣讲，要求僧人不得饮酒食肉，此后汉地僧人吃素成为定制。他亲自讲解《涅槃经》《般若经》，撰写经疏，又受菩萨戒，被称为“皇帝菩萨”。

  大通元年（527 年），他在台城北面建成同泰寺，此后在大通元年、中大通元年（529 年）、中大同元年（546 年）、太清元年（547 年）四次到同泰寺“舍身”，脱下帝服穿上法衣，为寺院执役讲经，由群臣出钱把他赎回，据《资治通鉴》，有几次赎金多达一亿万钱。

  在他的提倡下，江南佛寺林立。据《南史·郭祖深传》，郭祖深上书说，建康有佛寺五百余所，极其壮丽，僧尼十余万人，资产丰厚；地方上的寺院更不可胜数，许多人为了逃避赋役而出家，长此以往，天下户口将要减少一半。唐代杜牧“南朝四百八十寺，多少楼台烟雨中”的诗句，写的就是这一景象。

  后世不少人认为，梁武帝崇佛耗费了大量财力，又因信佛而宽纵刑法，是梁朝后来衰败的原因之一。禅宗传说中达摩与梁武帝的问答，也发生在这一背景下，但早期史料中没有记载。
sources: []
recalled:
  - 《梁书·武帝纪》
  - 《南史·郭祖深传》
