name: 沙丘之变
summary: 始皇死于沙丘，赵高、李斯伪造诏书立少子胡亥，赐死扶苏、蒙恬。
body: |-
  始皇三十七年（公元前 210 年）十月，秦始皇第五次出巡，左丞相李斯、中车府令赵高和少子胡亥随行。据《史记·秦始皇本纪》，他在平原津得病，病重时写下玺书给在上郡监军的长子扶苏，命他“与丧会咸阳而葬”。书已封好，存在兼管符玺的赵高处，还没有交给使者，七月丙寅始皇就死于沙丘平台。

  李斯担心诸公子和天下有变，秘不发丧，棺木载在辒凉车中，百官奏事、进食如常，知情的只有胡亥、赵高和五六个宦者。据《李斯列传》，赵高扣下玺书，先说动胡亥，再以扶苏即位后必用蒙恬为相来劝李斯，李斯最终同意。三人谎称受始皇遗诏，立胡亥为太子，另造诏书指责扶苏、蒙恬，赐二人死。扶苏在上郡自杀；蒙恬不肯就死，被囚于阳周，后来被逼服毒。

  车队从井陉、九原绕道，经直道回咸阳。时值暑天，尸体发臭，就在车上装载鲍鱼来掩盖气味。回到咸阳后发丧，胡亥即位为二世皇帝，九月葬始皇于郦山。
sources:
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
  - 《史记·李斯列传》 https://zh.wikisource.org/wiki/史記/卷087
  - 《史记·蒙恬列传》 https://zh.wikisource.org/wiki/史記/卷088
