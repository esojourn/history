name: "信仰容忍法案"
summary: "1689 年英国国会通过的法案，准许复原派不同意者在一定条件下公开聚会崇拜。"
body: |-
  《历史的轨迹》第三十一章说，威廉和玛丽即位后，宗教信仰自由终于给了复原派的不同意者。根据 1689 年的信仰容忍法案，凡愿意做到以下各点的都可以自由崇拜：宣誓效忠威廉与玛丽；拒绝教皇权柄、化质说、弥撒、向马利亚和圣徒祷告；接受三十九信条。据一般记载，不从国教的牧师须签署三十九信条中除论教会治理和婴儿洗礼等几条以外的条文，聚会所须登记，门不得上锁。

  该书说，这样一来，复原派不同意者的各宗派可以在英国自由公开地存在，包括长老派、公理派、浸礼派和贵格派，人数加起来约占当时英国人口的十分之一。但法案不适用于罗马天主教徒和不信三位一体的人。不同意者仍不能担任公职、进大学。

  第三十二章说，此后英国的公理派、长老派、浸礼派和贵格派继续并肩争取完全的宗教自由与平等；1828 年英国取消了针对不同意者的特别法令，准许他们在大学、政府和军中任职。第三十五章说，1779 年国会修改容忍法案，以接受圣经代替接受三十九信条，后来又取消了对否认三位一体者的刑罚。第三十一章研讨问题中问：为什么在所有国家中，英国第一个给予人民大量的信仰自由？
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十五章“苏西尼主义，神体一位论，现代主义” https://wellsofgrace.com/books/spiritual/2000years/html/chapter39.html"
