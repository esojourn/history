name: 泓水之战
summary: 前 638 年宋襄公坚持“不鼓不成列”，在泓水被楚军打败，负伤。
body: |-
  齐桓公死后，宋襄公想继承霸业，但实力不足。公元前 639 年他在盂地会合诸侯，被楚成王当场扣押，后来才被放回。公元前 638 年，宋襄公出兵攻打依附楚国的郑国，楚国出兵救郑，宋军回师，两军在泓水相遇。

  据《左传》僖公二十二年，宋军已经列好阵势，楚军还在渡河。司马子鱼说，敌众我寡，趁他们没有全部渡河，请出击。襄公不许。楚军渡完河还没有列成阵，子鱼又请求出击，襄公仍不许。等楚军列好阵才交战，宋军大败，襄公大腿受伤，侍卫也全部战死。国人都埋怨襄公，襄公说：“君子不重伤，不禽二毛。古之为军也，不以阻隘也。寡人虽亡国之余，不鼓不成列。”子鱼反驳说，他根本不懂作战。

  泓水之战后，宋襄公的争霸之梦破灭，次年因伤去世，楚国的势力进一步深入中原。后世对宋襄公的评价两极：一种看法讥笑他“蠢猪式的仁义”，另一种看法（如《公羊传》）赞扬他坚守古礼。

  泓水之战常被看作战争观念转变的标志：讲究礼仪、结阵而战的贵族战争逐渐让位于讲求诡诈和实效的新式战争，后来孙武所说的“兵者，诡道也”，正代表了新的战争观念。

  泓水在今河南柘城县北，宋襄公次年因伤去世。
sources: []
recalled:
  - 《左传》僖公二十二年
  - 《公羊传》僖公二十二年
  - 《史记·宋微子世家》
