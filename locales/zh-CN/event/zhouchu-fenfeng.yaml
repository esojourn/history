name: 周初分封
summary: 武王、周公、成王相继分封宗室和功臣为诸侯，建立以宗法为纽带的封建制度。
body: |-
  周灭商后，疆域广大，周人以“封建亲戚，以蕃屏周”的办法统治天下，即把土地和人民分封给宗室子弟和功臣，让他们建立诸侯国，拱卫周王室。分封从武王开始，在周公东征平定三监之乱以后大规模展开，一直延续到成王、康王时期。

  据《史记》各世家和《左传》的记载，重要的封国有：周公之子伯禽封于鲁，太公吕尚封于齐，召公奭封于燕，武王之弟康叔封于卫，成王之弟唐叔虞封于唐（后来的晋），商的后裔微子启封于宋，此外还有蔡、曹、郑（较晚）等国。《左传》僖公二十四年列举了文王、武王、周公的子孙所封的二十六国，《荀子·儒效》说周初“立七十一国，姬姓独居五十三人”，这些数字只能作为参考。

  分封与宗法制度相结合：周王是天下的大宗，诸侯对周王是小宗，在自己的国内又是大宗。诸侯要定期朝觐、纳贡、出兵助王征伐。这一制度维持了西周两百多年的统治，但随着诸侯坐大、血缘关系疏远，到春秋时期王室已无力控制诸侯。考古发现的北京琉璃河燕国遗址、山西曲沃晋侯墓地、山东曲阜鲁国故城等，都与周初分封有关。

  后世所说的“封建”，原义就是这种“封土建国”。

  周初分封的诸侯国中，鲁、齐、晋、燕、卫等国一直延续到春秋战国。
sources: []
recalled:
  - 《史记·周本纪》
  - 《左传》僖公二十四年
  - 《左传》定公四年
  - 《荀子·儒效》
