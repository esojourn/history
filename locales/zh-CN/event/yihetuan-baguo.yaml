name: 义和团运动与八国联军
summary: 1900 年义和团兴起，清廷向列强宣战，八国联军攻入北京。
body: |-
  十九世纪末，外国传教士在中国各地传教，教会与当地民众的冲突不断发生，称为“教案”。甲午战争后，列强加紧对中国的瓜分，民众的反洋教情绪更加强烈。山东、直隶一带的民间秘密结社义和拳（后称义和团）以练拳习武、“降神附体”相号召，提出“扶清灭洋”的口号，焚烧教堂，杀害传教士和中国教民，拆毁铁路和电线。山东巡抚袁世凯对义和团严厉镇压，义和团转入直隶，迅速发展，光绪二十六年（1900 年）夏进入北京和天津。

  清廷内部对义和团的态度不一，端郡王载漪等人主张利用义和团对抗列强。六月，英、美、法、德、俄、日、意、奥八国以保护使馆为名，组成联军从天津向北京进发，在廊坊一带被义和团和清军阻击，退回天津。联军攻占大沽炮台后，慈禧太后于六月二十一日以光绪帝的名义向各国宣战。此前德国公使克林德在北京街头被清军击毙。义和团和清军围攻北京的东交民巷使馆区和西什库教堂，两个月没有攻下。

  东南各省的督抚李鸿章、刘坤一、张之洞和山东巡抚袁世凯拒绝执行宣战的命令，与各国领事议定“东南互保”，保持东南地区的稳定。七月联军攻陷天津，八月十四日攻入北京，慈禧太后带着光绪帝仓皇出逃，经山西到达西安。联军在北京烧杀抢掠，北京城遭到严重破坏。此后清廷下令剿灭义和团，联军也到直隶各地镇压。俄国则趁机出兵占领了东北。

  义和团运动和八国联军之役以清朝签订《辛丑条约》告终（另见“《辛丑条约》”条）。在这一事件中，大批传教士和中国教民被杀，义和团民众和无辜百姓也遭到联军和清军的大规模屠杀，具体人数难以确定。后世对义和团的评价一直存在分歧：有人强调其反抗侵略的一面，也有人批评其盲目排外和滥杀。
sources: []
