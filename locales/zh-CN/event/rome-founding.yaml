name: 罗马建城
summary: 传说罗慕路斯在帕拉蒂尼山建城，后世通行的年份是瓦罗推算的公元前 753 年。
body: |-
  按照罗马人自己的传说，罗马城由罗慕路斯建立。建城的年份古代有多种推算：最早的罗马史家费边·皮克托定在公元前 748 年前后，希腊史家蒂迈欧把它与迦太基建城并列在前 814 年，波利比乌斯取前 751 年前后；共和国末年的学者瓦罗推算为前 753 年，这个年份后来成为通行的说法，罗马人以 4 月 21 日的帕里利亚节为建城纪念日。

  传说的梗概见于李维和普鲁塔克：特洛伊陷落后埃涅阿斯辗转来到拉丁姆，他的儿子建立阿尔巴隆加，传了十几代国王；末代的努米托尔被弟弟夺位，外孙罗慕路斯和雷穆斯被弃于台伯河边，由母狼哺乳、牧人养大，后来帮外祖父复位，再到当年获救的地方建城。兄弟相争，雷穆斯被杀。埃涅阿斯与罗慕路斯原是两个各自独立的起源传说，中间那串阿尔巴国王是后人为填补特洛伊战争与建城之间四百多年的空档而编排的。

  考古所见与传说有同有异。帕拉蒂尼山上发现了前 8 世纪的茅屋柱洞，20 世纪 80 年代又在山的北坡发掘出一段前 8 世纪的墙基，有学者认为它印证了传说的年代。但这一带早在前 10 世纪甚至更早就有人居住，几座山丘上的村落是逐渐合并的；广场一带的低地在前 7 世纪后期才垫高铺砌，成为公共场所，许多学者把这看作城市真正形成的标志。

  罗马位于台伯河下游便于过河的地方，有河中小岛可资利用，又在从海边盐场通往内陆的道路上，南北两面分别是拉丁人和伊特鲁里亚人。后来的罗马人以“建城以来”纪年，史家李维的书就以此为名。
sources: []
recalled:
  - 李维《建城以来史》卷一
  - 普鲁塔克《罗慕路斯传》
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷一第 74 章
  - 瓦罗的建城纪年（见肯索里努斯《论生日》第 21 章）
