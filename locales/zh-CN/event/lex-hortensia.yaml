name: 霍滕西乌斯法
summary: 平民最后一次撤离后通过的法律，规定平民会议的决议对全体罗马人有约束力。
body: |-
  公元前 287 年通过的一项法律，规定平民会议的决议对全体罗马人民有约束力，不必再经元老院认可。通常把它看作平民与贵族两个等级之间长达两百年的斗争的终点。

  这件事的经过记载很少，李维的这一卷已经失传，只有摘要。萨莫奈战争结束后，许多服役多年的农民负债累累。据李维的摘要和后来的作家，因债务引起长期而严重的骚乱，平民最后撤离到台伯河对岸的雅尼库鲁姆山，这是传说中的最后一次撤离。为了平息事态，平民出身的昆图斯·霍滕西乌斯被任命为独裁官，他提出了这项法律；他在任内去世，债务如何处理没有留下记载。

  内容相似的法律此前据说已有两次：前 449 年的瓦勒里乌斯—荷拉提乌斯法和前 339 年的普布利利乌斯法。它们之间是什么关系，学者看法不一，有人认为前两次是后人的虚构或只是有条件的承认，到霍滕西乌斯法才成为无条件的规则。

  此后绝大部分法律以“平民决议”的形式通过，由保民官召集平民会议表决。从法律上说，平民作为一个等级不再受限制，仅存的差别是少数祭司职位仍归贵族，而保民官只能由平民担任。

  但这并没有使罗马成为雅典那样的民主政体。此时富有的平民家族早已与旧贵族合流为“显贵”，占据高级官职；保民官多出自这些家族，通常与元老院合作。大会只能对长官提出的议案表决，不能讨论和修改。直到格拉古兄弟以保民官身份越过元老院直接立法，霍滕西乌斯法的潜在力量才显露出来。
sources: []
recalled:
  - 李维《建城以来史》卷十一摘要
  - 老普林尼《自然史》卷十六第 37 节
  - 格利乌斯《阿提卡之夜》卷十五第 27 章
  - 盖尤斯《法学阶梯》卷一第 3 节
