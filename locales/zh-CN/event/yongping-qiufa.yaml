name: 永平求法
summary: 相传汉明帝夜梦金人，遣使西行求佛法，是关于佛教传入中国流传最广的说法。
body: |-
  佛教传入中国的确切时间已无法考定。流传最广的说法是“永平求法”：汉明帝夜里梦见一位金色的神人，头顶有光，在殿前飞行；次日询问群臣，有人回答说西方有神名叫佛，于是明帝派使者前往西域访求佛法。《后汉书·西域传》在“天竺”条下记载了这个传说，并说此后中国才开始图画佛像。

  这个故事在后来的佛教文献里越来越详细。《四十二章经》的序、《牟子理惑论》和南朝梁代慧皎的《高僧传》等书说，使者是蔡愔、秦景等人；他们在永平十年（公元 67 年）与两位僧人迦叶摩腾、竺法兰一同回到雒阳，用白马驮来经书和佛像，明帝为此在雒阳城西建寺，即白马寺，二僧在寺中译出《四十二章经》。这些细节出现较晚，各书所记的人名、年份也不一致，近代学者对其可信程度看法不一。

  另有两条较早的记载表明，佛教在此之前已经传入。裴松之注《三国志》所引的《魏略·西戎传》说，西汉哀帝元寿元年（公元前 2 年），博士弟子景卢曾听大月氏使者伊存口授《浮屠经》。《后汉书》又载，明帝的异母弟楚王刘英“学为浮屠斋戒祭祀”，永平八年（65 年）明帝的诏书中提到他“尚浮屠之仁祠”。可见在明帝时，佛教已经在皇族中有人信奉。一般认为，佛教是在两汉之际经由西域的商路逐渐传入内地的。
sources: []
recalled:
  - 《后汉书·西域传》
  - 《后汉书·光武十王列传》（楚王英）
  - 《三国志·魏书·乌丸鲜卑东夷传》裴松之注引《魏略·西戎传》
  - 慧皎《高僧传》卷一
