name: 金宣宗南迁
summary: 1214 年金宣宗迫于蒙古的压力把都城从中都迁往汴京，次年中都被蒙古军攻陷。
body: |-
  野狐岭之战后，蒙古军不断深入金朝腹地。1213 年金朝将领胡沙虎（纥石烈执中）发动政变，杀死卫绍王，拥立完颜珣即位，是为金宣宗。这一年蒙古军分三路攻掠河北、山东、山西，次年包围中都。金宣宗被迫求和，献上卫绍王的女儿岐国公主和大量金帛，蒙古军才撤围北返。

  1214 年五月，金宣宗不顾一些大臣的反对，决定迁都南京开封府（汴京），只留下太子和丞相完颜承晖等人守卫中都。成吉思汗认为金朝议和后又迁都，是心怀疑虑、背弃和约，于是再次出兵包围中都。1215 年五月中都城破，完颜承晖服毒自尽，蒙古军入城后大肆焚掠，耶律楚材当时就在城中。

  南迁以后，金朝失去了黄河以北的大部分地区，只能依靠河南一隅支撑。金宣宗又出兵进攻南宋，想以此弥补损失，结果陷入南北两面作战的困境。金宣宗本站没有单列人物。
sources: []
recalled:
  - 《金史·宣宗本纪》
  - 《元史·太祖本纪》
