name: 刘劭弑父
summary: 宋太子刘劭因巫蛊事发，率兵入宫杀死宋文帝，随即被武陵王刘骏讨平。
body: |-
  宋文帝的太子刘劭和次子始兴王刘濬，与女巫严道育来往，用巫蛊诅咒文帝，把刻成文帝模样的玉像埋在宫中。元嘉二十九年（公元 452 年）事情败露，文帝大怒，但没有立即处置。次年，文帝得知严道育仍藏在东宫，决定废掉太子，与大臣王僧绰、江湛、徐湛之等商议，犹豫未决。

  元嘉三十年（453 年）二月，刘劭得知消息，率东宫卫兵假称奉诏讨贼，闯入宫中，部将张超之在合殿杀死了文帝。刘劭随即即位，杀了江湛、徐湛之等人。

  当时，文帝的第三子武陵王刘骏任江州刺史，正在讨伐西阳蛮，他在寻阳起兵讨伐刘劭，沈庆之、柳元景等率军东下，各地纷纷响应。五月，讨伐军攻入建康，刘劭、刘濬被杀，刘骏即位，即孝武帝。

  这是南朝第一次太子弑父的事件。此后刘宋宗室之间互相猜忌、残杀不断，孝武帝、前废帝、明帝都大杀宗室，国力日衰，二十多年后被萧道成取代。
sources: []
recalled:
  - 《宋书·二凶传》
  - 《资治通鉴》卷一百二十六至一百二十七
