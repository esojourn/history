name: 平定准噶尔
summary: 乾隆年间清军消灭准噶尔汗国，又平定大小和卓之乱，统一天山南北。
body: |-
  噶尔丹死后，准噶尔在策妄阿拉布坦和他的儿子噶尔丹策零统治下仍然强大，与清朝在西藏、青海、喀尔喀一带多次交战，雍正九年（1731 年）清军在和通泊被准噶尔击败。乾隆十年（1745 年）噶尔丹策零去世，准噶尔内部为了争夺汗位陷入混乱，一些贵族率部投奔清朝，其中包括辉特部的阿睦尔撒纳。

  乾隆帝认为这是解决准噶尔问题的时机，不顾许多大臣的反对，决定出兵。乾隆二十年（1755 年）清军分两路进军，阿睦尔撒纳为前导，很快攻入伊犁，准噶尔首领达瓦齐逃到天山南路后被俘。同年阿睦尔撒纳因为想当准噶尔的大汗未能如愿，起兵反清，伊犁的清军将领战死。乾隆二十二年（1757 年）清军再次进军，阿睦尔撒纳逃到俄国，不久病死。在这次战争和随后的天花流行中，准噶尔部的人口大量死亡和逃散，这场战争的残酷性在今天的学术研究中也受到关注。

  平定准噶尔后，原被准噶尔控制的天山南路的白山派和卓波罗尼都、霍集占兄弟（大小和卓）起兵反清。乾隆二十三年（1758 年）清军进攻天山南路，将领兆惠一度在叶尔羌附近被围困在“黑水营”，次年援军到达，攻下喀什噶尔、叶尔羌，大小和卓逃到巴达克山后被杀。

  清朝由此统一了天山南北，乾隆帝把这一地区称为“新疆”，意为“故土新归”。乾隆二十七年（1762 年）设立伊犁将军，统辖天山南北的军政事务。清朝的疆域至此达到最大。
