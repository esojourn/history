name: 睢阳之战
summary: 757 年张巡、许远率数千人坚守睢阳十个月，阻挡叛军南下江淮，城破后殉难。
body: |-
  睢阳在汴河岸边，是从河南进入江淮的门户。安史之乱中，唐朝的财赋主要依靠江淮供给，睢阳一旦失守，叛军就可以沿汴河南下。至德二载（公元 757 年）正月，安庆绪派部将尹子奇率军进攻睢阳，据《资治通鉴》，叛军有十余万人。睢阳太守许远向在宁陵的张巡求援，张巡率三千人入城，与许远合兵，共约六千八百人。

  许远认为自己的军事才能不如张巡，把指挥权交给张巡，自己负责调集粮草和修缮器械。张巡带领守军日夜作战，据史书，他曾经用草人引诱叛军放箭，又多次夜袭敌营，还用箭射伤了尹子奇的眼睛。叛军多次攻城都被击退，于是长期围困。到夏秋之际，城中粮食吃尽，守军先吃茶纸、树皮，再捕捉雀鼠，据《新唐书》，后来又把城中的妇女和老弱当作军粮。张巡派部将南霁云突围到临淮向河南节度使贺兰进明求救，据韩愈《张中丞传后叙》，贺兰进明忌妒张巡的声望，拥兵不救，南霁云咬断自己的一根手指表示决心后离去。

  同年十月，睢阳城破，城中守军只剩数百人。张巡、许远被俘，张巡与南霁云、雷万春等人不肯投降，被杀；许远被押往洛阳，途中遇害。城破后不久，唐军就收复了洛阳，河南节度使张镐派来的援兵也只晚到了几天。

  战后朝中对张巡死守以至于食人一事有过争论，有人认为他不如弃城保全百姓。李翰写了《张巡传》为他辩护，认为睢阳拖住了叛军的主力，使江淮得以保全，唐朝才有财力平叛。此后张巡、许远一直被当作忠义的典范受到祭祀，韩愈的《张中丞传后叙》记述了这段历史。
sources: []
