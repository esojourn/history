name: 平凉劫盟
summary: 787 年唐蕃在平凉会盟，吐蕃伏兵劫盟，唐朝会盟使浑瑊只身逃回，副使等人被俘。
body: |-
  清水会盟后，唐蕃之间因为安西、北庭的归属问题再次交恶，吐蕃连年进攻唐朝的西北边境。吐蕃大相尚结赞忌惮唐朝的名将李晟、马燧、浑瑊，据《资治通鉴》，他一面用反间计，使唐德宗解除了李晟的兵权，一面向唐朝卑辞请和。宰相张延赏与李晟不和，力主议和，德宗也想与吐蕃讲和。

  贞元三年（公元 787 年）闰五月，唐朝以浑瑊为会盟使，与尚结赞在平凉川会盟。会盟时吐蕃事先埋伏的骑兵突然冲出，浑瑊夺得一匹马逃回，唐朝的副使崔汉衡等官员和大批随从将士被俘或被杀。据《资治通鉴》，尚结赞原本打算一并劫持浑瑊、马燧、李晟三人，然后长驱直入长安。

  平凉劫盟使唐德宗看清了吐蕃的意图。此后他采纳宰相李泌的建议，与回纥和亲，与南诏和好，并联络大食、天竺共同牵制吐蕃（另见“南诏归唐”条）。
sources: []
recalled:
  - 《旧唐书·吐蕃传》
  - 《旧唐书·浑瑊传》
  - 《资治通鉴》卷二百三十二
