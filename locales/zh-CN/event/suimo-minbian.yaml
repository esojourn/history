name: 隋末民变
summary: 隋炀帝役使民力过度，611 年起各地民众纷纷起事，隋朝统治迅速瓦解。
body: |-
  隋炀帝在位期间营建东都、开凿运河、修筑长城、频繁巡游，又三次征讨高句丽，征发的兵役和徭役远远超出百姓的承受能力，加上大业七年（公元 611 年）山东、河南发生大水，民众无以为生。

  这一年，邹平人王薄在长白山（今山东邹平、章丘一带）聚众起事，作《无向辽东浪死歌》，号召百姓不要到辽东去白白送死，山东、河北的贫苦农民纷纷响应，窦建德等人也在这一时期加入起事的队伍。大业九年（613 年）贵族杨玄感在黎阳起兵，虽然很快失败，但此后起事的规模越来越大。

  到大业十二、十三年（616—617 年），起事队伍逐渐汇合成几支大的力量：河南的瓦岗军由翟让创建，李密加入后夺取兴洛仓，开仓济民，号称有众数十万，围攻东都；河北的窦建德自称长乐王，后来建立夏政权；江淮的杜伏威、辅公祏占据了江淮之间。与此同时，许多隋朝的官员和地方豪强也拥兵割据，如太原的李渊、陇西的薛举、马邑的刘武周、朔方的梁师都、江陵的萧铣，东都的王世充则在隋朝的名义下扩张势力。

  大业十三年（617 年）李渊起兵占领长安，次年三月炀帝在江都被杀（另见“江都之变”条），隋朝实际上已经灭亡。此后各方势力继续混战，唐朝经过七八年的战争，先后消灭了各地的割据势力，到武德七年（624 年）基本完成统一。
sources: []
recalled:
  - 《隋书·炀帝纪》
  - 《旧唐书·李密传》
