name: 王小波、李顺起义
summary: 993 年四川青城人王小波起事，李顺继之攻占成都，称大蜀王，次年被宋军镇压。
body: |-
  宋灭后蜀以后，把蜀地的财物大批运往开封，又在四川设立博买务，垄断布帛、茶叶等物的买卖，加上当地豪强兼并土地，许多农民失去生计。淳化四年（公元 993 年）二月，青城县的茶贩王小波聚众起事。据宋人记载，他对众人说：“吾疾贫富不均，今为汝均之。”贫苦的百姓纷纷响应。

  同年年底，王小波在攻打江原县时中箭，不久去世，部众推举他的妻弟李顺为首领。淳化五年（994 年）正月，李顺攻下成都，自称大蜀王，建年号应运，势力扩展到四川大部分地区。宋太宗派宦官王继恩率军入蜀，五月收复成都。关于李顺的下落，官方说他被俘处死，也有宋人笔记说他逃脱了，多年后才被抓获，说法不一。余部继续抵抗，到至道元年（995 年）才大体平定。这次起义以后，宋朝调整了在四川的一些政策。
sources: []
recalled:
  - 《宋史·太宗本纪》
  - 《宋史·宦者传·王继恩》
  - 沈括《梦溪笔谈》卷二十五
  - 《续资治通鉴长编》卷三十四至三十七
