name: 以斯拉回耶路撒冷
summary: 亚达薛西第七年，文士以斯拉奉王谕旨率众从巴比伦回耶路撒冷。
body: |-
  圣殿落成后，《以斯拉记》的叙述从第 6 章直接转到第 7 章的亚达薛西年间，中间相隔数十年，只在 4:6–23 提到亚哈随鲁和亚达薛西在位时有人控告犹大和耶路撒冷的居民。这时耶路撒冷已有圣殿，城墙仍未修复，巴比伦一带还住着许多犹太人。

  亚达薛西王第七年，祭司兼文士以斯拉得到王的谕旨（7:12–26，原文为亚兰文）。谕旨准许国中愿意上耶路撒冷的以色列人、祭司、利未人与他同去；让他带去王和七个谋士献的金银，以及在巴比伦全省所得的捐献，用来买祭物；命河西的库官供给他所需，各有限额；在圣殿供职的人免纳赋税；并授权他按神的律法设立士师和审判官。

  以斯拉在亚哈瓦河边招聚同行的人，住了三日。第 8 章列出各族的首领和男丁数目，相加约一千五百人。他见其中没有利未人，派人到迦西斐雅去请，得了一批利未人和尼提宁。他宣告禁食，求神使他们一路平安，又把金银和器皿称给十二位祭司长带着。众人正月十二日从亚哈瓦河启程（8:31），五月初一日到耶路撒冷（7:9），路上约四个月。到后第四日，在殿里把金银器皿过了秤，并献上燔祭。

  抵达之后，以斯拉着手处理百姓与外族通婚的事（第 9—10 章）。按亚达薛西一世计算，这次归回在公元前 458 年，比尼希米早十三年；也有学者认为这里的王是亚达薛西二世，那么以斯拉是在公元前 398 年、尼希米之后才到的，这个问题没有定论。
sources: []
recalled:
  - 《以斯拉记》第 7—10 章
