name: 神龙政变
summary: 705 年张柬之等率羽林军诛杀张易之兄弟，逼武则天传位于中宗。
body: |-
  武则天晚年宠信张易之、张昌宗兄弟，二人恃宠干政，与太子李显、相王李旦和朝臣的矛盾很深。长安四年（公元 704 年）冬武则天病重，只让张氏兄弟侍候左右，宰相们都无法见到她，朝中担心张氏兄弟作乱。

  宰相张柬之与崔玄暐、敬晖、桓彦范、袁恕己等人谋划，先争取了统领羽林军的将军李多祚，又把亲信安排进羽林军任职。神龙元年（705 年）正月二十二日，张柬之等人率羽林兵五百余人到玄武门，派人迎接太子李显。太子犹豫不肯出来，经众人劝说才随行。他们斩关入宫，在武则天所住的迎仙宫廊下杀死了张易之、张昌宗，随后进入武则天的寝殿，请她传位给太子。相王李旦和袁恕己统领南衙兵马，控制了宫外局势；太平公主也参与了这次政变。

  次日武则天下制让太子监国，再过一天传位给太子，中宗复位。二月，朝廷恢复唐的国号，武则天迁居上阳宫，被尊为则天大圣皇帝。同年十一月她去世。

  张柬之等五人因功封王，号称“五王”。但中宗信任武三思和韦后，五王不久就被夺去实权，相继贬到岭南，有的被害，有的在贬所死去。中宗朝的政局由韦后、安乐公主和武三思等人把持，又为五年后的唐隆政变埋下了伏笔。
sources: []
recalled:
  - 《旧唐书·张柬之传》
  - 《资治通鉴》卷二百七至二百八
