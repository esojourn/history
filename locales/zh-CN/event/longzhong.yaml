name: 三顾茅庐与隆中对
summary: 公元 207 年刘备三顾茅庐，诸葛亮提出据荆益、联孙权以抗曹的方略。
body: |-
  建安六年（公元 201 年）起，刘备依附荆州牧刘表，驻在新野。他起兵二十多年，屡经挫败，一直没有立足之地。据《三国志·蜀书·诸葛亮传》，他的谋士徐庶向他推荐隐居在襄阳一带的诸葛亮，称之为“卧龙”，并说此人只能登门拜访，不能召来相见。刘备于是亲自前往，“凡三往，乃见”。诸葛亮后来在《出师表》里也说，先帝“三顾臣于草庐之中”。这一年是建安十二年，诸葛亮二十七岁，刘备四十七岁。裴松之注所引的《魏略》《九州春秋》另有诸葛亮主动去见刘备的说法，裴松之认为不可信。

  本传记录了两人的谈话。诸葛亮说：曹操已有百万之众，挟天子以令诸侯，不可与他正面争锋；孙权据有江东已历三代，地势险要、民众归附，可以结为外援而不可图谋。荆州是四通八达的用武之地，益州险塞富饶，而两地的主人刘表、刘璋都守不住。他建议刘备夺取荆、益二州，对内修明政治，对西、南各族加以安抚，对外与孙权结盟；等天下形势有变，派一员上将率荆州军北向宛、洛，刘备亲率益州军出秦川，“则霸业可成，汉室可兴矣”。

  这段话后世称为“隆中对”。此后十多年，刘备集团大体按这个方略行事：次年联合孙权在赤壁击败曹操，随后取得荆州大部和益州、汉中。但建安二十四年荆州被孙权夺去，两路北伐的设想从此落空。诸葛亮躬耕的地点，有今湖北襄阳隆中和今河南南阳卧龙岗两种说法。
sources: []
recalled:
  - 《三国志·蜀书·诸葛亮传》及裴松之注
  - 诸葛亮《出师表》
