name: "第二次梵蒂冈会议"
summary: "1962—1965 年天主教的大公会议，推动礼仪改革，开启与其他教会的对话。"
body: |-
  《历史的轨迹》第四十九章说，罗马天主教一向对复原教不予理会，但近年对与复原教交往越来越有兴趣；1962 至 1965 年举行的第二次梵蒂冈会议，邀请了复原教观察员列席。第三十七章说，教皇约翰二十三世注意拉拢天主教与复原教、东正教的关系，他的合一努力遭到教廷枢机的反对，却得到美国枢机的大力支持；他在 1962 年召开了 1870 年以来的第一次大公会议，可惜在会议决定生效之前便去世了。

  据一般记载，会议由约翰二十三世 1959 年宣布召开，1962 年 10 月在罗马圣伯多禄大殿开幕；他次年去世后，由保罗六世继续主持，到 1965 年 12 月闭幕，共分四期，出席的主教二千多人。会议通过十六份文件，其中《礼仪宪章》准许以各地语言举行弥撒，改变了此前通行拉丁文的做法；《教会宪章》讲教会的本质和主教团的地位；《大公主义法令》称其他基督徒为“分离的弟兄”，开启了与东正教和复原教的对话；《信仰自由宣言》承认宗教自由的权利；《教会与非基督宗教关系宣言》否定了把耶稣之死归罪于全体犹太人的说法。

  1965 年会议结束前，保罗六世与君士坦丁堡普世牧首阿特那哥拉一世同时撤销了 1054 年东西教会互相施加的绝罚。会后天主教在礼仪、教会治理、与其他宗教的关系上都有很大变化；保守派认为改革走得太远，一部分人拒绝接受，例如法国的勒菲弗尔总主教后来另立修会。对复原教来说，会议并没有改变天主教关于教皇首席地位和教皇无误的教义，书中对此没有评论。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十七章“东方教会与罗马教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter41.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十九章“教会联盟与联合” https://wellsofgrace.com/books/spiritual/2000years/html/chapter54.html"
