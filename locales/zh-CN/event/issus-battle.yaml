name: 伊苏斯战役
summary: 公元前 333 年亚历山大在伊苏斯的海岸隘地击败亲征的大流士三世，俘获其家眷。
body: |-
  公元前 333 年，大流士三世亲率大军从巴比伦西进，到叙利亚北部的开阔平原上等候亚历山大。亚历山大因在奇里乞亚生病等缘故耽搁了多时，秋天才沿海岸南下，越过通往叙利亚的山口。大流士不耐久等，据阿里安，他不听马其顿流亡者阿明塔斯的劝告，离开平原，率军从北面的另一处山口翻过阿马努斯山，出现在亚历山大的背后，占领了伊苏斯，杀害了留在那里的马其顿伤病员。两军于是掉过头来相对：波斯人在北，马其顿人在南。

  战场是山与海之间的一条狭长地带，中间横着皮纳鲁斯河，宽度只有两三公里，波斯军人数上的优势无从施展。古代作家说大流士有几十万人，这类数字不可信。波斯人在河北岸列阵，中央是希腊雇佣兵，大流士乘战车居中，靠海的右翼集中了骑兵。亚历山大让帕曼纽率左翼靠住海岸，自己在右翼。

  11 月的一天，亚历山大率右翼的伙伴骑兵和步兵抢先渡河，冲垮了对面的波斯步兵，随即转向中央，直取大流士。与此同时，马其顿方阵在渡河爬岸时出现缺口，被希腊雇佣兵突入，死了一百二十名有名望的马其顿人；左翼的帕曼纽也被波斯骑兵压得很紧。大流士见左翼崩溃、敌人逼近，调转战车逃走，后来丢下战车、盾牌和王袍，换马夜奔。波斯全军随之溃退，在狭窄的山路上自相践踏。

  大流士的营帐里留有他的母亲西绪甘比斯、妻子斯塔泰拉、两个女儿和一个幼子。亚历山大让她们保有原来的仪仗和称号，史书都称道他的礼遇。帕曼纽随后赶到大马士革，取得波斯人存放在那里的大批钱财和随军贵族的家眷。大流士几次致书求和，被拒绝。

  亚历山大没有向东追击，而是沿腓尼基海岸南下，夺取波斯舰队所依赖的各个港口。庞贝古城“农牧神之家”出土的一幅镶嵌画表现亚历山大冲向战车上的大流士，一般认为摹自希腊化初期的一幅名画，画的是这一战还是高加米拉，有不同看法。
sources: []
