name: "马尔堡会谈"
summary: "1529 年路德与慈运理在马尔堡会谈，十五条中唯圣餐一条未能谈拢。"
body: |-
  路德与慈运理为圣餐争论了几年。路德按字面理解“这是我的身体”，认为基督的身体真实地与饼酒同在；慈运理认为基督的身体已升到天上，这句话的意思是“这代表我的身体”，圣餐是纪念和信徒的表白。两人各写了几本书驳斥对方。

  1529 年春，施派尔帝国议会决定停止容忍新教，信新教的诸侯和城市提出抗议，“抗议宗”的名称由此而来。黑森伯爵腓力想把德意志和瑞士的新教各邦结成同盟，这先要神学家们讲和，他便邀两派到自己的马尔堡城堡会谈。路德本不愿来，梅兰希顿也怕同瑞士人结盟会断了与皇帝和解的路。

  《历史的轨迹》第二十四章只记了一句：1529 年 10 月两人在马尔堡会谈，终究没有得到一样的看法。会谈从 10 月 1 日开到 4 日，路德和梅兰希顿一方，慈运理和巴塞尔的厄科兰帕迪乌斯一方，斯特拉斯堡的布塞居间。据在场者的笔记，路德用粉笔在桌上写了“这是我的身体”，盖上桌布，辩到紧要处就掀开来指着它。慈运理引约翰福音第六章“肉体是无益的”，路德说那不是讲圣餐。

  最后伯爵请路德起草共同的条文。十五条里，三位一体、基督、因信称义、洗礼等十四条双方一致；第十五条也都同意圣餐应兼领饼酒，是领受基督真身体和血的圣礼，只是基督的身体是否实在地在饼酒之中，“此时未能一致”，彼此当以基督徒的爱心相待。相传慈运理含泪伸手，路德不肯以弟兄相称，说：你们的灵与我们不同。

  政治同盟因此没有结成。两年后慈运理战死。路德派与改革宗在圣餐上的分歧一直延续下来，该书把新教内部的分裂列为改教运动停顿的原因之一。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十四章“瑞士的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter27.html"
