name: 亚克兴海战
summary: 屋大维的舰队由阿格里帕指挥，在希腊西海岸击败安东尼和克娄巴特拉，内战就此结束。
body: |-
  公元前 31 年 9 月 2 日，屋大维的舰队在希腊西海岸安布拉基亚湾口的亚克兴海角外击败安东尼和克娄巴特拉，是罗马内战的最后一场决战。

  前 36 年以后，罗马世界分属两人：屋大维在西，安东尼在东。安东尼与克娄巴特拉同居并生有子女，前 34 年在亚历山大城把东方的土地分封给她和孩子们，并宣布恺撒里昂是恺撒的亲子，这直接触犯恺撒养子屋大维的地位。前 32 年两名执政官和许多元老离开罗马投奔安东尼；屋大维取出并宣读了安东尼存在维斯塔贞女处的遗嘱；意大利和西部各省向屋大维宣誓效忠。罗马向克娄巴特拉而不是向安东尼宣战。

  安东尼把军队和舰队部署在希腊西海岸过冬，主力在亚克兴。普鲁塔克说他有五百艘战船、十万步兵和一万二千骑兵；屋大维有二百五十艘战船、八万步兵和一万二千骑兵。前 31 年春，阿格里帕率舰队先发制人，攻下伯罗奔尼撒西南的墨托涅，切断了从埃及来的粮道。安东尼的营地在低地，夏天疫病流行，桨手大批死亡和逃亡；属国国王和罗马将领相继倒向对方。

  军事会议上，将领卡尼狄乌斯主张放弃舰队，退入内陆决战；克娄巴特拉主张从海上突围，安东尼采纳了后者。他因桨手不足烧掉了一部分船，船上装了帆，并把财宝搬上克娄巴特拉的船，这说明他的目的是冲出去而不是决胜。

  9 月 2 日安东尼的舰队驶出海湾列阵，对峙到中午起风后才接战。两翼向外拉开时，中央出现缺口，克娄巴特拉的六十艘船升帆从缺口穿过，向南驶去；安东尼换乘一艘快船追上了她。古代作家把这写成女王临阵脱逃、安东尼弃军相随，现代学者多认为是按计划突围，只是大部分船没能跟出来。留下的舰队战斗到傍晚，一部分被烧毁，其余投降。据普鲁塔克，岸上的十九个军团等了七天，在主将出走后归降屋大维。

  次年夏他进军埃及，安东尼和克娄巴特拉先后自杀。从此地中海世界只有一个主人。
sources: []
recalled:
  - 普鲁塔克《安东尼传》第 56—68 章
  - 卡西乌斯·狄奥《罗马史》卷五十
  - 维莱伊乌斯·帕特尔库鲁斯《罗马史》卷二第 84—85 章
