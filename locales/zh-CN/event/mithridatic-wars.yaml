name: 米特里达梯战争
summary: 罗马与本都王米特里达梯六世的三次战争，历时二十余年，战后庞培重新安排东方。
body: |-
  公元前 89 年至前 63 年罗马与本都国王米特里达梯六世之间的三次战争。

  本都在黑海南岸。米特里达梯即位后把黑海北岸和东岸并入版图，又与比提尼亚争夺卡帕多基亚等地，罗马屡次干预。前 89 年罗马使节阿奎利乌斯唆使比提尼亚国王入侵本都。米特里达梯反击，连败比提尼亚和罗马的军队，占领亚细亚行省。罗马在这个行省实行包税制多年，积怨很深，许多城市开门迎接他。前 88 年他下令各城在同一天杀死境内所有罗马人和意大利人，古代作家所记的死者从八万到十五万不等。他的将领阿基劳斯进军希腊，雅典等城倒向本都。

  第一次战争（前 89—前 85 年）由苏拉指挥。他在罗马被宣布为公敌的情况下，围攻雅典和比雷埃夫斯港，前 86 年破城，随后在喀罗尼亚和奥尔科墨诺斯击溃人数占优的本都军队。前 85 年双方在达尔达诺斯议和，米特里达梯退出所占土地，交出战船和两千塔兰特；亚细亚各城则被苏拉罚款两万塔兰特。第二次战争（前 83—前 81 年）是苏拉留下的将领穆雷纳擅自进攻本都，被击退。

  第三次战争（约前 73—前 63 年）起于比提尼亚国王把王国遗赠给罗马。卢库卢斯在基齐库斯拖垮本都大军，占领本都全境；米特里达梯逃到女婿、亚美尼亚国王提格兰二世处。前 69 年卢库卢斯攻入亚美尼亚，攻克提格兰诺塞塔，后因士兵哗变而前功尽弃。前 66 年马尼利乌斯法把指挥权交给刚刚肃清海盗的庞培。庞培击溃米特里达梯，接受提格兰投降。米特里达梯退到克里米亚，前 63 年因儿子反叛而自杀。

  庞培随后重新安排了东方：比提尼亚与本都西部合为一个行省，叙利亚成为行省，塞琉古王朝告终，犹太、亚美尼亚、卡帕多基亚等成为附庸。这几场战争还造就了手握重兵的统帅：苏拉和庞培都是从东方带着军队和财富回到意大利的。
