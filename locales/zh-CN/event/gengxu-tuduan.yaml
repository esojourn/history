name: 庚戌土断
summary: 桓温主持清查户口，把北来侨民的户籍编入所居郡县，使其同样负担赋役。
body: |-
  东晋初年，朝廷为南渡的北方人另设侨州郡县，侨民的户籍写在白纸上，称为白籍，不向所住地方的官府纳税服役；本地居民的户籍则称黄籍。时间一长，侨人已在南方置地安家，侨郡县又没有实际的辖境，同一块地方往往有几套官府，不少本地人也冒称侨人或投靠大族以逃避赋役，朝廷能够征发的人口越来越少。

  解决的办法叫做“土断”，就是不问原籍，一律按现在居住的地方编定户籍，同时裁并侨置的郡县。晋成帝咸和、咸康年间已经做过，效果有限。兴宁二年（公元 364 年）三月初一，在大司马桓温主持下，朝廷再次下令大规模清查户口，严禁隐匿，因这一天的干支是庚戌，史称“庚戌土断”或“庚戌制”。据《晋书》，宗室彭城王司马玄因为藏匿五户人家，被交给廷尉治罪，可见执行之严。

  五十年后刘裕请求再次土断时，在奏表里说庚戌土断以后“财阜国丰”，把它当作成功的先例，见《宋书·武帝纪》。东晋和南朝后来又多次土断，侨人与本地人在户籍和赋役上的区别逐渐消失。
sources: []
recalled:
  - 《晋书·哀帝纪》
  - 《宋书·武帝纪中》
  - 《资治通鉴》卷一百零一
