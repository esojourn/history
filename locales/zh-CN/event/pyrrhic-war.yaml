name: 皮洛士战争
summary: 伊庇鲁斯国王皮洛士渡海与罗马作战，两胜之后无功而返。
body: |-
  公元前 3 世纪初，罗马已制服萨莫奈人，势力伸到意大利南部，与当地最强的希腊城市塔兰托发生冲突。罗马与塔兰托订有旧约，罗马战舰不得驶过拉基尼翁海角。前 282 年一支罗马小舰队出现在塔兰托港外，被塔兰托人击沉数艘；随后罗马使节到塔兰托交涉，据说在剧场里受到嘲弄和侮辱。罗马宣战。塔兰托人照以往的做法，向海对面的希腊君主求援，这一次请的是伊庇鲁斯国王皮洛士。

  前 280 年春皮洛士渡海，据普鲁塔克，带了步兵二万、骑兵三千、弓手二千、投石手五百和二十头战象，途中遇风暴受了损失。夏天，他在赫拉克利亚附近的西里斯河边与执政官莱维努斯交战。罗马军团第一次面对马其顿式的方阵，相持不下；最后是罗马人没有见过的战象冲乱了骑兵，军团溃退。皮洛士一度进军到离罗马不远的地方，没有城市向他倒戈，又退回南方。他派谋士基涅阿斯到罗马提议和谈，元老院有所动摇，据普鲁塔克，年老失明的前监察官阿庇乌斯·克劳狄乌斯力主拒绝：只要皮洛士还在意大利，就不谈和。前 279 年在阿普利亚的阿斯库伦，两军打了两天，皮洛士再次占了上风，自己也负了伤。据普鲁塔克引希罗尼穆斯，罗马人阵亡六千，皮洛士一方依他自己的回忆录是三千五百零五人，损失的多是从伊庇鲁斯带来的精锐。“再这样胜一次，我们就完了”这句话就出在这时，后世称代价过高的胜利为“皮洛士式的胜利”。

  这时迦太基派舰队到罗马外港，与罗马订约共同对付皮洛士。皮洛士却在前 278 年应叙拉古等城之请去了西西里，三年里把迦太基人逼到西端的利吕拜翁一隅，终究攻不下来，又因强征人力财物同希腊城邦闹翻。前 276 年他返回意大利，渡海时被迦太基舰队袭击。前 275 年他在萨莫奈境内的马尔文图姆与执政官库里乌斯·登塔图斯交战，夜间行军迷路，天亮后进攻失利，战象受惊反冲己阵。罗马人后来把这个地方改名“贝内文图姆”，意思从“恶风”变为“好风”。

  皮洛士留下一支驻军守塔兰托，自己带八千步兵和五百骑兵回了伊庇鲁斯。前 272 年他死在阿尔戈斯，同年塔兰托向罗马投降，南意大利的希腊城市都成了罗马的盟邦。希腊化世界的一位名将败在罗马手下，东方各国开始注意这个新的强国；前 273 年埃及的托勒密二世与罗马互派了使节。西西里则如皮洛士所料，十年后成为罗马与迦太基的战场。
sources: []
