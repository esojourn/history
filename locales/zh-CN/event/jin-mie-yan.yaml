name: 晋灭燕
summary: 911 年刘守光在幽州称帝，晋王李存勖派周德威讨伐，913 年攻破幽州。
body: |-
  唐末幽州的卢龙节度使刘仁恭被儿子刘守光囚禁，刘守光自任节度使。乾化元年（公元 911 年）八月，刘守光在幽州称帝，国号大燕，史称桀燕。他为人骄横残暴，又企图吞并邻近的易州、定州，与晋国结怨。

  同年冬，晋王李存勖派大将周德威率军进攻幽州。晋军先后攻下幽州周围的涿州、瀛州等地，刘守光向后梁和契丹求救，都没有得到实际的援助。晋军围困幽州一年多，乾化三年（913 年）十一月攻破幽州，刘守光出逃，不久被擒获。

  次年正月，李存勖把刘仁恭、刘守光父子押回晋阳，在太庙献俘，随后处死了刘守光，又把刘仁恭押到雁门李克用的墓前处死。晋国从此据有幽州，直接与契丹接壤。周德威留任卢龙节度使，此后多年防御契丹。
sources: []
recalled:
  - 《旧五代史·僭伪列传·刘守光》
  - 《资治通鉴》卷二百六十八至二百六十九
