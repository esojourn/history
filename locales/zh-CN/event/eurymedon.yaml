name: 欧律墨冬河战役
summary: 约公元前 466 年客蒙在小亚细亚南岸一日之内海陆两胜波斯军。
body: |-
  提洛同盟成立后的十来年里，客蒙率同盟舰队逐一清除波斯人在爱琴海沿岸的据点。波斯在小亚细亚南岸潘菲利亚的欧律墨冬河口集结了一支舰队和陆军，据普鲁塔克，还在等候从塞浦路斯来的八十艘腓尼基战船。

  客蒙率两百艘战船从克尼多斯出发，沿途迫使法塞利斯加入同盟，然后驶向河口。波斯舰队不愿在增援到达前交战，退入河内，被追上后弃船上岸。据修昔底德，被俘获和击毁的腓尼基三列桨战船共两百艘。当天客蒙让重装步兵登陆，又击溃了岸上的波斯陆军，夺取营地。普鲁塔克说他随后出海，截击并消灭了赶来的那八十艘战船。

  修昔底德对这一仗只写了一句话，没有给出年份，现代学者的推算从公元前 469 年到前 466 年不等，这里取前 466 年。此战之后，波斯舰队多年不再进入爱琴海，小亚细亚南岸的一批城邦加入了同盟。雅典用战利品加固了卫城的南墙。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷一第 100 章
  - 普鲁塔克《客蒙传》第 12—13 章
  - 狄奥多罗斯《历史丛书》卷十一第 60—62 章
