name: 城濮之战
summary: 前 632 年晋文公在城濮大败楚军，随即会盟践土，晋国开始称霸。
body: |-
  齐桓公死后，楚国北进，宋、郑、陈、蔡、鲁、卫等国多依附楚国。晋文公即位后，宋国转而亲晋，楚成王于是派令尹子玉率军围宋，宋向晋求救。公元前 632 年，晋文公采用先轸的计策，先攻打楚的盟国曹、卫，迫使楚军北上；又让宋国贿赂齐、秦，请齐、秦出面调停，再扣押曹、卫之地分给宋国，激怒楚国，把齐、秦拉到晋国一边。

  楚成王本想撤兵，子玉坚持求战。据《左传》僖公二十八年，晋文公为了实践流亡时在楚国许下的诺言，下令晋军“退避三舍”（一舍三十里），一直退到城濮。四月己巳日两军交战，晋军先击溃楚军右翼的陈、蔡军队，又佯装撤退诱楚军左翼追击，再夹击取胜。子玉收拾中军残部退走，在归途中被迫自杀。

  战后，晋文公在践土修建王宫，周襄王亲自前来，策命晋文公为“侯伯”，赐给他车马、弓矢、秬鬯和虎贲三百人。晋文公随即与齐、鲁、宋、蔡、郑、卫、莒等国在践土会盟。城濮之战遏制了楚国的北进，奠定了晋国此后百余年的霸业。

  城濮之战是春秋时期规模最大的战役之一，《左传》对它的记述极为详细，是研究春秋车战的重要材料。

  城濮在今山东鄄城县西南一带，一说在今河南范县。
sources: []
recalled:
  - 《左传》僖公二十七年至二十八年
  - 《史记·晋世家》
  - 《国语·晋语四》
