name: 尤利安远征波斯
summary: 公元 363 年尤利安攻到泰西封城下，退兵途中阵亡，继任者割地求和。
body: |-
  波斯王沙普尔二世与罗马断断续续打了二十多年，359 年攻下阿米达。361 年尤利安成为唯一的皇帝，拒绝了波斯的议和，决心一举解决东方的问题。他在安条克准备了大半年，363 年 3 月 5 日出发。军官阿米阿努斯随军，他的《历史》卷 23 至 25 是这次远征的主要记录。

  据佐西莫斯，全军六万五千人。尤利安分出一支偏师，命其北上会合亚美尼亚王，再沿底格里斯河南下与主力合围；这支部队始终没有赶到。主力沿幼发拉底河而下，一千多条船载着粮食、器械随行。沿途攻下两座坚城，掘开旧运河把船队引入底格里斯河，5 月底在泰西封城外击败波斯守军。

  城防坚固，沙普尔的主力又尚未出现，尤利安决定不围城。他下令烧掉船队，只留下十几条船，理由是逆水拖船要占用两万人手；阿米阿努斯说火起之后他就后悔了。军队转向北方，沿底格里斯河东岸回师。波斯人烧光沿途的庄稼，骑兵不断袭扰。6 月 26 日，后卫遇袭，尤利安来不及披甲就冲上去，被一支骑枪刺中肋部，当夜死在营帐里，时年三十二岁。是谁下的手，当时就不清楚：阿米阿努斯只说来路不明，他的朋友利巴尼乌斯后来暗示是军中的基督徒，波斯方面没有人出来领赏。“加利利人，你胜了”那句临终的话，最早见于八十年后的教会史家狄奥多勒。

  第二天军官们推举卫队长官约维安为皇帝。军队缺粮，被困在河东。沙普尔提出和议，约维安一口答应：三十年休战，罗马割让底格里斯河以东的五个地区，交出尼西比斯、辛加拉等要塞，不再支持亚美尼亚。尼西比斯三次挡住过波斯人的围攻，居民被限期迁出，叙利亚语诗人以法莲就在其中。阿米阿努斯称这是可耻的和约。

  尤利安复兴异教的举措随着他的死全部中止，此后的皇帝都是基督徒。这条边界大体维持到六世纪初。
sources: []
