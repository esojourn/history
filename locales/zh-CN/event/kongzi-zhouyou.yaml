name: 孔子周游列国
summary: 前 497 年孔子离鲁，带弟子游历列国十四年，前 484 年返鲁。
body: |-
  孔子在鲁定公时官至大司寇，主张削弱把持国政的三桓，推行“堕三都”，没有成功。据《史记·孔子世家》，齐国送给鲁国一批女乐，执政的季桓子接受后三日不听政，郊祭后又没有按礼把祭肉分给大夫，孔子于是在公元前 497 年离开鲁国，开始了长达十四年的周游。

  孔子带着子路、颜回、子贡等弟子，先到卫国，在卫国住得最久；此后又到过曹、宋、郑、陈、蔡、叶等地。途中多次遇险：在匡地被误认为阳虎而遭围困；在宋国，司马桓魋想杀他，拔掉了他在树下讲习礼仪的大树；在陈、蔡之间断粮七日，随行的弟子病倒，孔子仍讲诵弦歌不衰。各国国君对孔子礼遇，但都没有真正任用他。孔子自叹“如有用我者，期月而已可也，三年有成”。

  公元前 484 年，孔子的弟子冉有为季氏率军打败齐军，季康子派人以币礼迎孔子回国，孔子这年六十八岁。回到鲁国后，孔子不再求仕，专心教学和整理文献。周游列国期间与各国君臣、隐士的问答，构成了《论语》的重要内容。

  据《史记·孔子世家》，孔子在郑国与弟子走散，郑人形容他“累累若丧家之狗”，子贡如实转告，孔子笑着说：“然哉！然哉！”

  此后孔子在鲁国又生活了五年。
sources: []
recalled:
  - 《史记·孔子世家》
  - 《论语·卫灵公》
  - 《论语·子罕》
