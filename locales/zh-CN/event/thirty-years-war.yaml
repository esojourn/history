name: "三十年战争"
summary: "1618—1648 年以德意志为战场的战争，起于波希米亚，各国相继卷入。"
body: |-
  《奥格斯堡和约》没有承认加尔文派，也没有解决 1552 年以后新教诸侯占有的主教区该不该归还。十七世纪初，新教各邦和天主教各邦分别结成同盟。《历史的轨迹》第三十章说，德意志在和约之后享受了相当长的太平，到 1618 年和约被毁。那年 5 月 23 日，波希米亚的新教贵族因皇帝的官员拆毁新教教堂，冲进布拉格的城堡，把两名大臣从窗口扔了出去。他们废黜哈布斯堡家的斐迪南，另选信加尔文宗的普法尔茨选侯为王。

  1620 年皇帝斐迪南二世和天主教同盟的军队在布拉格城外的白山打败波希米亚人。波希米亚被强迫改回天主教，贵族的土地大批没收，十几万新教徒流亡。此后丹麦国王出兵干预，被皇帝的将领蒂利和华伦斯坦打败。1629 年皇帝颁布《归还教产敕令》，新教一方到了最低点。

  该书说，在这危急关头，瑞典国王古斯塔夫·阿道夫起来为拯救新教而战。他 1630 年登陆，1631 年在布赖滕费尔德大胜，次年在吕岑阵亡。同年稍早，皇帝的军队攻破马格德堡，城中两万多人死于屠杀和大火。1634 年瑞典军在讷德林根战败，次年多数德意志诸侯与皇帝讲和。

  战争却没有结束。信天主教的法国在首相黎塞留主持下公开参战，同瑞典联手对付哈布斯堡家的皇帝和西班牙。最后十三年，军队靠就地征发为生，在德意志各地来回拉锯。

  该书说，这是一场毁灭性的战争，单德意志的人口就由一千五百万减到五百万。如今学者的估计是帝国人口损失了两到四成，由一千六七百万降到一千一二百万上下，各地相差悬殊，死于饥荒和瘟疫的远多于死于刀兵的。该书的研讨题也问到这场战争是否纯粹是宗教战争：后半段法国与瑞典结盟，可见争的已是哈布斯堡家在欧洲的地位。1648 年各方签订《威斯特伐利亚和约》。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
