name: 靖康之变
summary: 1126 年金军再次南下，次年初攻破开封，掳走徽钦二帝及宗室数千人，北宋灭亡。
body: |-
  靖康元年（公元 1126 年）二月金军第一次围攻开封后撤走，宋朝君臣随即反悔，拒绝交割太原、中山、河间三镇，又试图策反金朝的降将，主战的李纲被排挤出京，各地援军也被遣散。这年八月，金太宗以宋朝背约为理由，再次派兵南下：完颜宗翰率西路军，九月攻破坚守了八个多月的太原；完颜宗望率东路军，十一月渡过黄河。闰十一月，两路金军在开封城下会师。

  开封城中兵力不足，钦宗听信了一个名叫郭京的人自称能施法术、用“六甲神兵”破敌的说法。闰十一月二十五日，郭京打开宣化门出战，一触即溃，金军乘机登城，开封外城失守，这时已是公历 1127 年初。钦宗亲自到金营求和，答应交纳巨额金银，回城后在城中大肆搜刮。靖康二年（1127 年）正月，钦宗再次到金营，被金人扣留。

  二月，金朝下诏废黜徽宗、钦宗，把二帝和后妃、宗室陆续押到金营；三月立宋朝的太宰张邦昌为皇帝，国号大楚。四月，金军撤离开封，押着徽宗、钦宗以及后妃、皇子、公主、宗室、贵戚、大臣等北去，据宋人记载人数在三千以上，同时运走了宫中的礼器、法物、图书、天文仪器和府库中的财物。北宋从赵匡胤建国（960 年）到这时，前后一百六十七年。

  金军北撤以后，张邦昌退位。五月，宋徽宗的第九子康王赵构在南京应天府（今河南商丘）即位，改元建炎，即宋高宗，宋朝在南方延续下来，史称南宋。徽宗、钦宗后来被关押在五国城，最终都死在金国（另见“宋徽宗”“宋钦宗”条）。

  靖康之变是宋朝历史上的奇耻大辱，“靖康耻”成为南宋人恢复中原的口号，传为岳飞所作的《满江红》中就有“靖康耻，犹未雪”的句子，这首词的作者是否为岳飞，学界有争论。北宋的灭亡使中原大批人口南迁，中国的经济文化重心进一步南移。
