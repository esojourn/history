name: 崖山海战
summary: 1279 年元军在崖山大败南宋最后的军队，陆秀夫背负赵昺投海，南宋灭亡。
body: |-
  临安投降后，陆秀夫、张世杰等人在福州拥立赵昰为帝，在元军追击下转战于福建、广东沿海。景炎三年（公元 1278 年）赵昰病死，群臣又立赵昺为帝，改元祥兴，把行朝迁到新会的崖山。崖山在海边，与西面的汤瓶山对峙，形如门户，宋军在这里修建行宫和军营，准备长期坚守。同年元朝任命张弘范为蒙古汉军都元帅，与李恒分别率水陆军南下追击。这年年底，文天祥在海丰五坡岭被俘。

  祥兴二年（1279 年）正月，元军到达崖山。张世杰没有据守海口，而是把战船用绳索连在一起，结成一字形的水寨，四周筑起楼棚，护卫赵昺的座船。张弘范先用小船载着茅草、油脂火攻，宋船涂了湿泥，又用长木抵御，火攻未能奏效。元军于是占据海口，断绝宋军的柴薪和淡水，宋军只能饮用海水，很多人呕吐、病倒。张弘范让文天祥写信招降张世杰，文天祥写了《过零丁洋》。

  二月初六，元军利用早晚潮水的涨落，从南北两面发动总攻，宋军阵脚大乱，战船被逐一攻破。陆秀夫见无法突围，背着八岁的赵昺投海而死，许多宋朝的官员和士兵、宫人也跟着投海。据《宋史》，七天以后海上浮出的尸体有十多万具。张世杰率少数船只突围，不久在海上遇飓风溺死；杨太后得知赵昺已死，也投海自尽。

  崖山海战标志着南宋的最终灭亡，元朝完成了对全国的统一。文天祥在元军船上目睹了这场海战，被押往大都后坚贞不屈，1283 年就义。崖山之战在后世被看作宋朝亡国的象征，今天崖山一带建有纪念祠庙。
sources: []
recalled:
  - 《宋史·瀛国公本纪》附二王纪
  - 《宋史·陆秀夫传》
  - 《元史·张弘范传》
