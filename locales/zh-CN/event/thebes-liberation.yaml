name: 底比斯光复
summary: 公元前 379 年冬，流亡者潜回底比斯刺杀亲斯巴达的执政，赶走斯巴达驻军。
body: |-
  公元前 382 年，一支开往北方的斯巴达军队路过底比斯，将领腓比达斯受城内亲斯巴达一派的列昂提亚德斯引导，趁妇女过节、卫城无人防备，占据了卡德米亚。这违反了“大王和约”的自治条款。斯巴达罚了腓比达斯的款，却不撤出驻军。反对派首领伊斯墨尼亚斯被处死，约三百人逃到雅典。

  前 379 年冬，佩洛皮达斯、墨隆等少数流亡者扮成猎人，分散混进城去，藏在同党卡戎家里。担任军事长官书记的菲利达斯事先安排了一场酒宴。夜里，几个人扮成妇女进入宴席，杀死了喝醉的军事长官阿基亚斯等人；另一组人闯进列昂提亚德斯家中将他杀死。色诺芬和普鲁塔克所记的细节略有不同。他们打开监狱，号召市民拿起武器；伊巴密浓达等留在城里的人这时带人出来响应。

  天亮后，其余的流亡者和驻在边境的一支雅典军队赶到。卡德米亚的斯巴达守军有一千五百人左右，见援兵不至，几天后在保证安全的条件下撤走。斯巴达处死了其中两名指挥官。

  斯巴达国王克列翁布洛托斯随即出兵彼奥提亚，没有战果。雅典起初害怕，惩办了擅自带兵相助的两位将军；但前 378 年春，斯巴达将领斯福德里亚斯夜间偷袭比雷埃夫斯未遂，在阿格西劳斯的袒护下又被判无罪，雅典于是与底比斯结盟，并着手组建第二次海上同盟。底比斯在此后几年重建了彼奥提亚同盟。
sources: []
recalled:
  - 色诺芬《希腊史》卷五第 2 章、第 4 章
  - 普鲁塔克《佩洛皮达斯传》第 5—13 章；《论苏格拉底的守护神》
