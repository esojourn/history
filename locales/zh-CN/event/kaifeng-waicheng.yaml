name: 开封扩建外城
summary: 955 年周世宗下诏扩建开封，修筑外城，拓宽街道，奠定了北宋东京城的格局。
body: |-
  开封自后梁起成为都城，此后后晋、后汉、后周都定都于此。由于人口日增，城内房屋拥挤，街道狭窄，容易失火，城外也聚集了大量居民。显德二年（公元 955 年）四月，周世宗下诏扩建开封，在原有城墙之外再筑一道外城。

  诏书规定，先由官府在外城范围内立好标记，等到冬季农闲时再征发民工修筑，以免妨碍农业生产；外城以内的土地，先由官府规划好街道、军营、仓库和官署，其余的地方再任由百姓建房。同时规定，坟墓、窑灶和草料场等都要迁到城外一定距离以外。显德三年（956 年）正月，外城开始修筑。周世宗又下令拓宽城内的街道，允许百姓在街道两旁种树、挖井、搭凉棚。王朴参与了外城和街道的规划。

  扩建后的开封分为宫城、里城和外城三重，规模大为扩展。北宋建立后定都开封，称东京，城市的基本格局就是在后周扩建的基础上形成的。
sources: []
recalled:
  - 《五代会要》卷二十六
  - 《旧五代史·周书·世宗纪》
