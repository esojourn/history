name: 迁都北京
summary: 1421 年永乐帝正式以北京为京师，此后北京成为明清两代的都城。
body: |-
  北京是永乐帝作燕王时的封地，也是防御北方蒙古的前线。永乐元年（1403 年）他把北平改名为北京，称为“行在”，设立北京留守行后军都督府和北京行部等机构，迁移富户和流民到北京附近，充实人口。

  永乐四年（1406 年）朝廷下诏营建北京宫殿，派官员到四川、湖广、江西、浙江、山西等地采伐木材，到苏州等地烧造砖瓦。为了解决漕粮的运输，永乐九年（1411 年）工部尚书宋礼疏浚山东境内的会通河，恢复了大运河的贯通，此后南方的粮食可以经运河直接运到北京，海运逐渐停止。永乐十五年（1417 年）宫殿的建造全面展开，永乐十八年（1420 年）基本完工。北京的宫城、皇城规模宏大，今天的故宫、天坛、太庙等都是在这次营建中奠定的。北京城在元大都的基础上建成，北城墙向南收缩，南城墙向南拓展。

  永乐十九年（1421 年）正月初一，永乐帝在北京新宫的奉天殿接受朝贺，正式以北京为京师，南京改为留都，仍保留六部等一套机构。同年四月奉天、华盖、谨身三大殿遭雷火焚毁，有官员借机批评迁都，永乐帝没有改变主意。洪熙帝即位后曾打算还都南京，下令北京各衙门重新加上“行在”二字，但他不久就去世了，此后历朝都定都北京，直到正统六年（1441 年）才去掉“行在”的名称，北京正式成为京师。
sources: []
recalled:
  - 《明史·成祖本纪》
  - 《明太宗实录》
  - 《明史·地理志》
