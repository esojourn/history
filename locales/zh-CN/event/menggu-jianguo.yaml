name: 大蒙古国建立
summary: 1206 年蒙古各部首领在斡难河源推举铁木真为成吉思汗，建立大蒙古国。
body: |-
  十二世纪的蒙古高原上分布着许多部落，较大的有蒙古、塔塔儿、克烈、乃蛮、蔑儿乞、汪古等，彼此攻战不休，金朝则利用各部之间的矛盾加以控制。铁木真从蒙古乞颜部的一个没落贵族起家，经过二十多年的战争，先后消灭了塔塔儿、克烈、乃蛮、蔑儿乞等部，到 1204 年前后基本统一了蒙古高原。

  1206 年春，各部的首领在斡难河源召开大会（忽里勒台），竖起九斿白纛，推举铁木真为全蒙古的大汗，上尊号“成吉思汗”，国号“也客·蒙古·兀鲁思”，即大蒙古国。“成吉思”的含义有“强大”“海洋”等不同解释。

  成吉思汗在建国时进行了一系列制度建设。他把全体牧民编为千户、百户、十户，各级首领由他任命的功臣和亲族担任，平时放牧，战时出征，据《元朝秘史》，当时共封了九十五个千户；他扩建由贵族子弟组成的怯薛（护卫军），既是禁卫，也是培养官员的地方；他任命失吉忽秃忽为大断事官，掌管刑狱和民户分配，并把判决写成文书，称为“青册”；他颁布札撒（法令），规范社会秩序。此前他还命俘获的乃蛮掌印官塔塔统阿用畏兀儿字母拼写蒙古语，形成了蒙古文字。

  大蒙古国的建立结束了蒙古高原长期分裂的局面，“蒙古”从一个部落的名称变成了高原上各部共同的称号，蒙古民族由此形成。此后成吉思汗及其继承者向四方扩张，先后攻灭西夏、金、西辽、花剌子模、南宋等国，建立起横跨亚欧的大帝国。本站北方草原泳道上的“蒙古帝国”一段就从这一年开始。
sources: []
recalled:
  - 《元朝秘史》
  - 《元史·太祖本纪》
  - 拉施特《史集》
