name: 清军入关
summary: 1644 年吴三桂与清军在山海关击败李自成，清军随即进入北京，同年清朝迁都北京。
body: |-
  崇祯十七年（1644 年）三月，李自成攻破北京，崇祯帝自缢。镇守山海关的明朝总兵吴三桂手握数万精兵，处在大顺军与清军之间。李自成派人招降，吴三桂起初准备归顺，后来改变了主意，杀掉大顺的使者，据守山海关。四月，李自成亲率大军东征吴三桂。

  此时清朝的摄政王多尔衮正率领大军南下，准备进入长城。吴三桂派人向多尔衮求援，多尔衮率军急行，到达山海关外。四月二十二日，大顺军与吴三桂的部队在山海关外的一片石（石河一带）激战，双方相持之际，清军从侧翼突然杀出，大顺军猝不及防，大败而退。吴三桂随即剃发降清，被封为平西王。

  李自成退回北京，四月二十九日在武英殿匆忙称帝，次日放火焚烧宫殿，撤出北京，向西退走。五月初二，多尔衮率清军进入北京，以为崇祯帝发丧为名笼络明朝的官员和百姓，宣布“免除三饷”。九月顺治帝从盛京到达北京，十月初一在北京再次举行即位典礼，宣告定鼎北京，清朝从此开始了对全国的统治。

  清军入关是明清之际最关键的转折。此后清军分两路追击大顺军，次年攻灭南明弘光政权，在此后近二十年里逐步消灭了各地的抗清力量（另见“南明”条）。吴三桂“冲冠一怒为红颜”的说法出自吴伟业的《圆圆曲》，陈圆圆在其中起了多大作用，历来有不同看法。
sources: []
recalled:
  - 《清世祖实录》
  - 《明史·李自成传》
  - 彭孙贻《平寇志》
  - 吴伟业《圆圆曲》
