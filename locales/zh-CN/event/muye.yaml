name: 牧野之战
summary: 周武王联合诸侯在牧野打败商纣王的军队，商朝灭亡；断代工程定在前 1046 年。
body: |-
  商朝末年，周在西方崛起。周文王时期周已经征服了周边许多方国，武王继位后，继续积蓄力量。据《史记·周本纪》，武王曾在孟津检阅军队，八百诸侯不期而会，但他认为时机未到而退兵。两年后，纣王杀比干、囚箕子，太师、少师抱着乐器投奔周，武王于是出兵伐纣。

  据《史记》，武王率戎车三百乘、虎贲三千人、甲士四万五千人东进，会合庸、蜀、羌、髳、微、卢、彭、濮等方国的军队。甲子日清晨，大军抵达商都朝歌郊外的牧野，武王誓师，誓辞即《尚书·牧誓》。《史记》说纣王发兵七十万迎战，这个数字显然夸大。商军阵前倒戈，周军攻入朝歌，纣王登上鹿台自焚而死。1976 年陕西临潼出土的利簋，铭文说“武王征商，唯甲子朝”，证实了甲子日克商的说法。

  牧野之战后，商朝灭亡，周朝建立。武王封纣的儿子武庚继续统治商的遗民，派管叔、蔡叔监视，又分封功臣和宗室。关于克商的年份，学界有四十多种推算，夏商周断代工程根据天文推算和碳十四测年，定在公元前 1046 年，但这一结论也有不同意见。

  《尚书·牧誓》中武王历数纣王的罪状，其中说纣“惟妇言是用”，并引古人之言“牝鸡无晨，牝鸡之晨，惟家之索”。
sources: []
recalled:
  - 《史记·周本纪》
  - 《尚书·牧誓》
  - 利簋铭文
  - 《夏商周断代工程 1996—2000 年阶段成果报告》
