name: 灵武即位
summary: 756 年马嵬之变后太子李亨北上，在灵武即皇帝位，尊唐玄宗为太上皇，主持平叛。
body: |-
  天宝十五载（公元 756 年）六月马嵬之变后，唐玄宗准备继续西行入蜀。据《资治通鉴》，当地父老拦住道路，请求留下太子带领大家收复长安；宦官李辅国和太子的儿子建宁王李倓、广平王李俶也劝太子留下。玄宗于是分出一部分后军和随从给太子，自己继续南下成都。

  太子李亨带着不多的人马北上，经过平凉，朔方留后杜鸿渐等人迎他到灵武。七月十二日，他在灵武城南楼即皇帝位，改元至德，遥尊玄宗为太上皇，这就是唐肃宗。当时灵武的文武官员不满三十人，朝廷草创，礼仪简陋。八月玄宗在蜀中得知消息，承认了既成事实，派宰相韦见素、房琯带着传国玉玺和册书前往灵武。

  灵武即位使平叛有了一个统一号令的中心。郭子仪、李光弼带领朔方军赶到灵武，各地的军队和物资逐渐向这里集中，肃宗又召来李泌参谋军事，派人向回纥借兵，为第二年收复两京打下了基础（另见“收复两京”条）。

  这次即位事先没有得到玄宗的同意。在此之前，玄宗已经下诏任命太子为天下兵马元帅，分封诸王统领各地，其中永王李璘在江南扩充军队，后来与肃宗发生冲突，被肃宗派兵消灭，诗人李白就因为加入永王的幕府而获罪流放。后世史家对灵武即位的评价不一，有人认为它挽救了危局，也有人认为这是太子乘乱夺位，为肃宗朝父子之间的隔阂埋下了伏笔。
sources: []
recalled:
  - 《旧唐书·肃宗纪》
  - 《新唐书·肃宗纪》
  - 《资治通鉴》卷二百一十八
