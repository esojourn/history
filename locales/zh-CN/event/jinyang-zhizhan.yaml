name: 晋阳之战
summary: 前 453 年赵与韩、魏联手，在晋阳反败为胜，灭掉智氏。
body: |-
  春秋末年，晋国国君大权旁落，政权掌握在智、韩、赵、魏四家卿族手中，其中智伯瑶势力最大。智伯先后向韩、魏索取土地，两家怕他，都给了；他又向赵襄子索要蔺、皋狼之地，赵襄子拒绝。公元前 455 年，智伯率智、韩、魏三家的军队攻打赵氏。

  赵襄子退守晋阳。据《战国策·赵策一》和《史记·赵世家》，晋阳城池坚固、粮食充足，三家围攻两年多不下，智伯便引晋水灌城，城墙只剩三版没有被淹，城中“悬釜而炊，易子而食”，但百姓没有背叛之心。智伯巡视水势时得意地说，我今天才知道水可以灭亡一个国家，韩康子、魏桓子听了暗自心惊，因为汾水、绛水也可以灌他们的都城。

  赵襄子派家臣张孟谈夜里出城，游说韩、魏两家说“唇亡则齿寒”。公元前 453 年，赵、韩、魏三家联合，掘开堤坝反灌智伯军营，然后夹击，智伯兵败被杀，智氏灭族，三家瓜分了智氏的土地。此后晋国实际上被韩、赵、魏三家分割，五十年后周王室正式承认三家为诸侯。司马光《资治通鉴》即从三家分晋写起，开篇就详述了这场战争。

  司马光在《资治通鉴》中评论说，智伯之亡是“才胜德”的结果，并由此展开了一段关于才与德的著名议论。
sources: []
recalled:
  - 《战国策·赵策一》
  - 《史记·赵世家》
  - 《资治通鉴》卷一
