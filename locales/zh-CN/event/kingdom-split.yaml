name: 王国分裂
summary: 所罗门死后，北方十个支派在示剑离弃罗波安，另立耶罗波安为王。
body: |-
  据《列王纪上》第 11 章，所罗门年老的时候，他的妃嫔诱惑他的心去随从别神，耶和华对他说，必将他的国夺回，赐给他的臣子，只是因大卫的缘故不在他活着的日子行这事，并且还留一个支派给他的儿子（11:9–13）。示罗人先知亚希雅在路上遇见所罗门的臣仆耶罗波安，把新衣撕成十二片，叫他拿十片，预言十个支派要归他（11:29–39）。所罗门要杀耶罗波安，耶罗波安逃到埃及。另一方面，所罗门在位时大兴工程，百姓负担的劳役很重，这也是后来众人向罗波安提出的要求。

  所罗门死后（约公元前 930 年），他的儿子罗波安到示剑去，以色列人要在那里立他作王。耶罗波安从埃及回来，同以色列会众对罗波安说，他父亲使他们负重轭、做苦工，求他减轻些，他们就事奉他。罗波安请他们三日后再来。老年人劝他用好话回答，少年人劝他加重百姓的轭，他采纳了少年人的主意（12:1–15）。以色列众民见王不依从他们，就说他们与大卫无分，各回各家去了。罗波安派掌管服苦之人的亚多兰去，被众人用石头打死，他自己急忙上车逃回耶路撒冷（12:16–19）。

  以色列人立耶罗波安作王，跟从大卫家的只有犹大支派，便雅悯支派也在罗波安一边（12:20–21）。罗波安召集十八万人要夺回国权，神人示玛雅传话说这事出于耶和华，不可与弟兄争战，众人就回去了（12:21–24）。耶罗波安为了不让百姓上耶路撒冷献祭，在伯特利和但各设一个金牛犊（12:26–30）。

  从此国分南北。北国称以色列，先后以示剑、得撒、撒玛利亚为都，历十九个王，几度改换王朝，约公元前 722 年亡于亚述。南国称犹大，都耶路撒冷，除亚他利雅掌权的六年外，一直由大卫的后裔作王，到公元前 586 年耶路撒冷被巴比伦攻陷为止。

  《列王纪》《历代志》用南北两国君王的在位年数互相纪年，这些年数彼此推算时有出入。本站各王的年份取学界常用的蒂勒年表的约数；按其他学者的推算，分裂之年可以相差数年到十年左右。
sources: []
recalled:
  - 《列王纪上》第 11—12 章
  - 《历代志下》第 10—11 章
  - Edwin R. Thiele, The Mysterious Numbers of the Hebrew Kings
