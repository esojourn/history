name: 郑和下西洋
summary: 1405—1433 年郑和七次率船队远航，最远到达阿拉伯半岛和东非。
body: |-
  明初所说的“西洋”，大致指今天南海以西、印度洋沿岸的地区。永乐帝即位后，为了宣扬国威、招徕各国朝贡，可能也有寻找建文帝下落的用意（《明史》有此说法），命宦官郑和率领船队出使西洋。

  永乐三年（1405 年）郑和第一次出使，船队从苏州刘家港出发，在福建长乐太平港候风，然后驶往占城、爪哇、苏门答剌、锡兰，到达印度西南海岸的古里。据《明史》，这次随行的官兵二万七千八百余人，大船六十二艘。此后到永乐二十一年（1423 年），郑和又五次出使，宣德五年（1430 年）第七次出使，宣德八年（1433 年）船队返回。七次航行到达了东南亚、南亚、西亚和东非的三十多个国家和地区，其中第四次以后船队越过古里，到达波斯湾口的忽鲁谟斯，又分船前往阿拉伯半岛和东非沿岸的木骨都束、卜剌哇、麻林等地。

  船队以朝贡贸易为主，带去丝绸、瓷器、铜钱等物，换回香料、珠宝和珍禽异兽，永乐十二年（1414 年）榜葛剌进贡的长颈鹿被当作“麒麟”，引起朝野轰动。各国使节随船队来到中国，满剌加、渤泥、苏禄等国的国王还亲自来朝。船队也有过军事行动：在旧港擒获海盗陈祖义，在锡兰俘虏了国王亚烈苦奈儿，在苏门答剌平定了苏干剌的叛乱。

  郑和下西洋耗费巨大，永乐帝死后，洪熙帝曾下令停止下西洋，宣德帝又派出了第七次，此后再没有大规模的远航。据说成化年间有人想查找郑和出使的档案，被兵部官员刘大夏藏匿或销毁，这一说法出自明代后期的笔记，真假难考。郑和的船队比哥伦布等欧洲航海家的远航早半个多世纪，船只的规模也大得多，但这些远航没有带来持续的海外贸易和扩张。郑和船队的宝船尺寸，《明史》说长四十四丈、宽十八丈，许多学者认为这样大的木船难以航行，至今仍有争论。
sources: []
