name: 朱温篡唐
summary: 907 年朱温受唐哀帝禅位，建立后梁，唐朝灭亡，五代十国开始。
body: |-
  黄巢起义失败后，朱温以汴州为根据地，先后吞并了周围的藩镇，成为黄河以南最强大的势力。天复三年（公元 903 年），他从凤翔李茂贞手中夺回唐昭宗，回到长安后把宫中的宦官几百人全部杀死，朝廷从此完全落入他的控制。天祐元年（904 年）正月，他逼昭宗迁都洛阳，拆毁长安的宫室、官署和民宅，长安从此残破。同年八月，他派人在洛阳杀害昭宗，立年仅十三岁的辉王李柷为帝，即唐哀帝（另见“唐昭宗”“唐哀帝”条）。

  天祐二年（905 年），他先杀了昭宗的九个儿子，又在白马驿杀害裴枢等朝官三十余人（另见“白马驿之祸”条）。同年年底，他怀疑枢密使蒋玄晖、宰相柳璨在为他筹备禅让时有意拖延，把他们处死，又逼死了昭宗的皇后何氏。

  天祐四年（907 年）四月，唐哀帝派宰相张文蔚、杨涉等人带着传国玉玺和禅位册书到汴州，朱温在金祥殿即皇帝位，改名晃，国号梁，改元开平，史称后梁。他把汴州升为东都开封府，以洛阳为西都。唐哀帝被降封为济阴王，迁往曹州，次年被毒死。从唐高祖李渊 618 年建国算起，唐朝共存在了二百八十九年。

  朱温篡唐后，河东的李克用、凤翔的李茂贞、淮南的杨渥等人都不承认后梁，继续使用唐朝的天祐年号；西川的王建在同年九月称帝，建立前蜀。北方先后经历后梁、后唐、后晋、后汉、后周五个朝代，南方和河东则先后出现十个割据政权，史称“五代十国”，直到北宋统一。
sources: []
