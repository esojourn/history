name: 孙恩卢循起事
summary: 五斗米道首领孙恩、卢循先后在三吴和岭南聚众反晋，历时十二年，重创东晋的统治。
body: |-
  会稽、吴郡、吴兴等三吴各郡是东晋赋税和兵役的主要来源，南渡的高门在这里广占山泽田园，役使大量佃客和奴婢。淝水战后朝政败坏，赋役加重。五斗米道在这一带流传很广，上自王、谢等大族，下至农民和渔民，信徒众多。琅邪人孙泰世代传习此道，因图谋起事被杀，侄子孙恩逃到海岛。

  隆安三年（公元 399 年），执掌朝政的司马元显为了扩充自己的军队，下令把三吴各郡已由奴隶放免为佃客的人征调到建康当兵，称为“乐属”。这既夺走了大族的劳动力，也使被征发的人不愿离乡，各郡怨声四起。十月，孙恩率百余人从海上登陆，攻克上虞和会稽郡城。会稽内史王凝之信奉五斗米道，据《晋书》，他不肯设防，只在静室里祷告，说已请来鬼兵把守要道，结果城破被杀。几天之内，三吴八郡同时响应，各地的官员或死或逃，孙恩的部众增至数十万。

  朝廷派谢琰和北府将领刘牢之渡江镇压。孙恩裹挟二十余万人退入海岛。此后三年他三次登陆：隆安四年在山阴击杀谢琰；隆安五年沿海北上，从丹徒登岸，直逼建康，被刘牢之的部将刘裕以少数兵力阻击而败；元兴元年（402 年）再攻临海，兵败投海。

  余部推孙恩的妹夫卢循为主。卢循在浙东屡被刘裕击败，元兴三年（404 年）渡海南下占领广州。这时刘裕刚把桓玄赶出建康，便以朝廷名义任他为广州刺史。义熙六年（410 年）刘裕北伐南燕，卢循和姐夫徐道覆分两路北上，沿湘水、赣水进入长江，击杀江州刺史何无忌，又大败刘毅，战船千余艘开到建康附近。刘裕急速回师，沿江设防。卢循屡攻不下，粮尽西撤，年底在大雷和左里被刘裕追上击溃。义熙七年（411 年）他逃到交州，战败投水而死。

  这场持续十二年的变乱动摇了东晋赖以立国的三吴，王、谢等高门的子弟和产业损失惨重。镇压它的北府将领刘裕则由此崛起，最终取代了晋朝。
sources: []
