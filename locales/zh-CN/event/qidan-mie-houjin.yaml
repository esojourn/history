name: 契丹灭后晋
summary: 后晋出帝拒不称臣，契丹连年南侵，947 年初攻入开封，后晋亡。
body: |-
  天福七年（公元 942 年）石敬瑭死后，后晋出帝石重贵即位，听从景延广的主张，对契丹只称孙、不称臣，两国关系破裂。开运元年（944 年）正月，契丹皇帝耶律德光大举南侵，后晋军队奋力抵抗，在澶州一带击退了契丹军。开运二年（945 年）契丹再次南下，晋军在阳城（白团卫村）乘大风反击，契丹军大败，耶律德光乘骆驼才得以逃脱。

  此后石重贵骄傲自满，朝政腐败，赋税繁重，百姓困苦。开运三年（946 年），他任命杜重威为统帅北伐契丹，后晋的精锐几乎全部交给了他。杜重威率军到达滹沱河边的中渡桥，被契丹军截断了退路和粮道。杜重威早有异心，十二月率全军投降契丹。契丹随即以降将张彦泽为先锋，长驱直入开封，石重贵出降，后晋灭亡。此时已是公历 947 年初。

  会同十年（947 年）正月，耶律德光进入开封，二月在开封以中原皇帝的礼仪接受百官朝贺，改国号为大辽。但契丹军不发军饷，派骑兵四出抢掠，称为“打草谷”，又向城中百姓搜刮钱财，激起了各地的普遍反抗，河北、河南等地纷纷起兵杀死契丹派驻的官员。刘知远也在太原称帝（另见“后汉建立”条）。

  耶律德光感到难以在中原立足，三月率军北返，留下部将守开封。四月他在途中病死于栾城的杀胡林。据《资治通鉴》，他在路上曾对左右说此行有三个失误：纵兵抢掠、搜刮民财、没有及早让各地节度使回到本镇。契丹军撤走后，中原落入刘知远之手，石重贵和后晋的宗室则被押往契丹，再也没有回来。
sources: []
