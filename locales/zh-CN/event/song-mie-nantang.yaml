name: 宋灭南唐
summary: 974 年宋军在采石架设浮桥渡江，次年攻破金陵，李煜出降，南唐灭亡。
body: |-
  后周世宗时南唐已经割让江北之地，向中原称臣。宋朝建立后，南唐后主李煜继续奉宋朝为正朔，岁岁进贡，并自行降低礼制，称“江南国主”。赵匡胤多次召李煜入朝，李煜称病不去。

  开宝七年（公元 974 年）九月，赵匡胤任命曹彬为主帅、潘美为副帅，率军出兵南唐（据《续资治通鉴长编》）。此前南唐落第士人樊若水投奔宋朝，献上在长江上架设浮桥的计策。宋军先在荆湖造好船只，十一月在采石矶一带用船连成浮桥，大军由此渡过长江。宋军随后包围金陵。

  围城期间，李煜两次派大臣徐铉到开封求和，请求宋军缓攻。据宋人记载，赵匡胤最后对徐铉说，江南有什么罪，只是天下一家，卧榻之侧，岂容他人鼾睡。开宝八年（975 年）十一月，宋军攻破金陵，李煜率群臣出降（另见“李煜”条）。据《宋史·曹彬传》，曹彬在破城之前让诸将发誓不妄杀一人，城破以后秩序比较安定。

  李煜被押到开封，封为违命侯，太平兴国三年（978 年）去世。南唐灭亡后，十国中只剩下吴越、北汉两个政权，以及割据漳州、泉州的陈洪进。江南的大批图书、文物和人才也随之进入宋朝，南唐旧臣徐铉、张洎等人后来都在宋朝任职，徐铉还参与了《太平广记》等书的编纂。
sources: []
recalled:
  - 《宋史·太祖本纪》
  - 《宋史·曹彬传》
  - 《宋史·世家·南唐李氏》
