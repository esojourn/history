name: 伪齐的建立与废黜
summary: 1130 年金朝立宋朝降臣刘豫为“大齐”皇帝，统治河南、陕西，1137 年被废。
body: |-
  金朝灭北宋后，一时难以直接统治黄河以南的广大地区，想仿照扶立张邦昌的办法，另立一个傀儡政权作为与南宋之间的缓冲。完颜宗翰等人推荐了降金的原北宋济南知府刘豫。建炎四年（公元 1130 年）九月，金太宗下诏册立刘豫为皇帝，国号大齐，以大名府为都城，史称“伪齐”。绍兴二年（1132 年）伪齐迁都汴京。

  伪齐统治河南、山东和陕西的部分地区，征发繁重，又屡次配合金军南侵。绍兴四年（1134 年）岳飞从伪齐手中收复襄阳等六郡；同年伪齐与金军联合进攻两淮，被韩世忠等击退。绍兴六年（1136 年）伪齐单独出兵南侵，在藕塘等地被宋军击败。金朝认为刘豫无能，又有人主张与宋议和，绍兴七年（1137 年）十一月金熙宗下诏废黜刘豫，伪齐存在了八年。次年金朝一度同意把原伪齐统治的河南、陕西之地归还宋朝。
sources: []
