name: 后三头同盟与公敌宣告
summary: 安东尼、雷必达、屋大维依法组成三人团，瓜分行省，以公敌名单杀人敛财，西塞罗遇害。
body: |-
  公元前 43 年 11 月安东尼、雷必达和屋大维三人结成的同盟。与前三头的私下约定不同，它有法律依据：人民大会于 11 月 27 日通过提提乌斯法，设立“整顿国家的三人团”，为期五年，三人有权立法、任命长官和处决公民。

  恺撒死后一年多，局面几经变化。安东尼想取得山南高卢，把恺撒的旧部将德基姆斯·布鲁图围困在穆提纳。西塞罗在元老院领头反对他，并拉拢自募军队的屋大维。前 43 年 4 月，两名执政官和屋大维在穆提纳击败安东尼，两名执政官都阵亡。元老院把指挥权交给德基姆斯，冷落屋大维，并承认布鲁图和卡西乌斯在东方的地位。屋大维拒绝追击安东尼。他的百夫长到元老院为他索要执政官一职，被拒后他带兵进入罗马，8 月当选执政官，不到二十岁；随即立法宣布刺杀恺撒者有罪。

  安东尼退到高卢，与雷必达等人合兵。布鲁图和卡西乌斯在东方也聚起了大军。恺撒一派的三个首领于是讲和。10 月底，三人在博诺尼亚（今博洛尼亚）附近一条河中的小岛上会谈，军队隔河列阵。议定：西部各行省三人分掌；安东尼和屋大维去打布鲁图和卡西乌斯，雷必达留守意大利；意大利十八座富庶的城市将被没收土地分给老兵。

  三人需要钱发军饷，也要消灭政敌，于是恢复了苏拉的办法。据阿庇安，他们公布的公敌名单上有三百名元老和约二千名骑士（李维的摘要说元老一百三十人）；杀人者凭头颅领赏。三人各自交出了亲友：雷必达的兄弟、安东尼的舅父都在名单上，后来这两人得以逃脱。安东尼坚持要杀西塞罗，据普鲁塔克，屋大维争了两天后让步。12 月 7 日西塞罗被杀。名单上的许多人逃到塞克斯图斯·庞培或布鲁图那里。

  前 42 年初恺撒被正式尊为神，屋大维从此是“神之子”。同年两人在腓立比取胜。同盟在前 37 年续期；前 36 年雷必达被排除；余下两人的对立以前 31 年亚克兴之战告终。
sources: []
