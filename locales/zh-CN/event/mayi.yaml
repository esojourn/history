name: 马邑之谋
summary: 汉武帝在马邑设伏诱击匈奴单于，计划泄露未成，汉匈之间的和亲从此破裂。
body: |-
  汉初以来，朝廷对匈奴一直采取和亲政策，把宗室女子嫁给单于，每年赠送财物，但匈奴仍不时入塞抢掠。武帝即位后，朝中就是否继续和亲发生争论，大行王恢主张用兵，御史大夫韩安国主张维持和亲。

  据《史记·匈奴列传》和《韩长孺列传》，元光二年（公元前 133 年），雁门郡马邑的富人聂壹通过王恢献计：由他假装出卖马邑城，引诱单于深入，汉军在附近设伏。武帝采纳，派韩安国、李广、王恢等率三十余万人埋伏在马邑周围的山谷中。军臣单于信以为真，率十万骑入塞。走到离马邑还有一百多里的地方，他看见牲畜遍布原野却无人放牧，起了疑心，攻下一座边防亭障，俘获一名汉朝的小吏，问出了伏兵的实情，立即撤军出塞。汉军追赶不及，无功而返。

  王恢因为没有出击而被下狱，自杀。此后匈奴断绝和亲，频繁进攻边郡，但仍然乐于在边境的关市与汉人交易。四年以后，武帝派卫青等四路出塞，开始了持续数十年的战争。
sources: []
recalled:
  - 《史记·匈奴列传》
  - 《史记·韩长孺列传》
