name: 新莽覆灭
summary: 昆阳之战后各地纷纷起兵，汉军攻入长安，王莽在渐台被杀，立国十五年的新朝灭亡。
body: |-
  地皇四年（公元 23 年）六月，王莽派去镇压绿林军的大军在昆阳溃败，新朝的主力丧失殆尽。消息传开，各地的豪强和官吏纷纷杀死王莽任命的长官，自称将军，改用更始帝的年号，等待诏命。据《汉书·王莽传》，不过一个月，这样的举动就遍及全国。

  长安城内也发生了变故。国师刘歆、卫将军王涉和大司马董忠密谋劫持王莽、投降汉军，因同谋者告发而失败，董忠被杀，刘歆和王涉自杀。本传说，王莽因为这几人都是自己的至亲旧臣，内部已经溃败，从此忧愁得吃不下饭，只是饮酒、吃鲍鱼，读兵书读倦了就靠着几案打盹。他还听从别人的建议，率群臣到南郊向天号哭，希望以此消除灾祸。

  更始帝派出两路军队，一路北攻洛阳，一路西攻武关。武关附近的邓晔、于匡起兵响应，攻下武关，迎汉军入关。关中各县的豪强也纷纷起兵，自称汉将，会集到长安城下。王莽赦免城中的囚徒，发给兵器，让他们出城作战，这些人过了渭桥就一哄而散。

  按《汉书·王莽传》所记的日期，十月初一，城外的军队从宣平门攻入长安（《后汉书》把长安陷落记在九月）。次日，城中的年轻人朱弟、张鱼等也起来响应，放火烧毁宫门，冲进宫中，火一直烧到后宫。初三清晨，王莽被群臣扶着逃到未央宫沧池中的渐台，身边还有公卿和随从一千余人。军队把渐台围了几重，台上的人用弓弩抵抗，箭射尽后短兵相接。傍晚渐台被攻破，商人杜吴杀死了王莽，校尉公宾就认出他的身份，砍下首级。本传说，军士们争着分割他的尸体。他的头被送到更始帝所在的宛城，悬挂在市上示众。

  新朝自始建国元年起共十五年。汉军同时攻下洛阳，更始帝随后迁都洛阳，次年迁到长安。但更始政权只维持了两年，全国的重新统一要到刘秀称帝十余年之后才完成。
sources: []
recalled:
  - 《汉书·王莽传下》
  - 《后汉书·刘玄刘盆子列传》
  - 《资治通鉴》卷三十九
