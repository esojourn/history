name: 漠北之战
summary: 卫青、霍去病各率五万骑兵越过大漠，分别击败匈奴单于和左贤王，匈奴王庭从此远徙。
body: |-
  河西之战以后，伊稚斜单于听从降将赵信的建议，把王庭和主力迁到大漠以北，认为汉军无法越过沙漠久留。元狩四年（公元前 119 年）春，武帝决定主动越漠寻找匈奴主力决战。据《史记·卫将军骠骑列传》，他命大将军卫青、骠骑将军霍去病各率五万骑兵，另有数十万步兵和运送辎重的人随后；最精锐的士卒都拨给了霍去病。

  卫青从定襄出塞，行军一千余里，与严阵以待的单于本部相遇。他下令用武刚车围成营垒，先派五千骑兵冲击，匈奴也出动约一万骑应战。傍晚刮起大风，飞沙扑面，两军互相看不见，卫青趁机派出左右两翼包抄。单于见汉军人多马壮，带着数百名精骑向西北突围而去。汉军连夜追了二百余里，没有追上，一直前进到寘颜山下的赵信城，取用了匈奴囤积的粮食，停留一天，烧掉余粮后返回。这一路斩获一万九千人。前将军李广和右将军赵食其奉命从东路包抄，因迷路没有赶上会战，李广在战后自杀。

  霍去病从代郡出塞，行军两千余里，遇上匈奴的左贤王部。他俘获了三名匈奴小王和将军、相国、都尉等八十余人，《史记》记这一路斩获共七万余人。他在狼居胥山筑坛祭天，在姑衍山祭地，登高望见翰海，然后回师。后世用“封狼居胥”指代将领的最高战功，即出于此。

  《史记·匈奴列传》说，这一战之后匈奴远遁，大漠以南不再有单于的王庭。汉朝的边界从朔方向西延伸到令居，沿线开渠屯田，驻扎了五六万吏卒。汉军的损失也很大：《史记》说两军出塞时共有战马十四万匹，回来的不满三万匹。由于缺马和财政困难，汉朝此后多年没有再大规模出击，卫青、霍去病也不再出征。
sources: []
