name: 图拉真东征帕提亚
summary: 公元 114 至 117 年图拉真攻入两河流域，占领泰西封，罗马疆域达到极盛。
body: |-
  亚美尼亚的王位按尼禄时的约定，由帕提亚王室的人出任、罗马皇帝加冕。帕提亚王奥斯罗埃斯自行废立，给了图拉真出兵的理由；卡西乌斯·狄奥则说，他真正的动机是求取功名。113 年秋他离开罗马。

  114 年他进入亚美尼亚。新立的亚美尼亚王帕塔马西里斯来到军营，把王冠放在他脚下，指望照例由他重新戴上；图拉真却宣布亚美尼亚此后是罗马的行省，那位王在离开途中被杀。115 年罗马军南下，占了尼西比斯等城和美索不达米亚北部。这年冬天他在安条克过冬，遇上大地震，狄奥说他从窗口爬出才得脱身。116 年他沿底格里斯河和幼发拉底河而下，攻下帕提亚的都城泰西封，缴获了国王的黄金宝座，随后乘船到了波斯湾口。狄奥记，他望着开往印度的船说，要是还年轻，也要像亚历山大那样到那里去。元老院授给他“帕提亚征服者”的称号，罗马的疆域在这时最大。

  他还没有回到泰西封，后方已处处反叛。尼西比斯、埃德萨、塞琉西亚相继起事，一支罗马军连同主将被歼。部将卢西乌斯·奎埃图斯夺回北部各城，塞琉西亚被焚。图拉真无力直接统治，便在泰西封给一位帕提亚王子加冕，立为附庸。沙漠里的哈特拉久攻不下，他自己也病了。同一时期，昔兰尼、埃及、塞浦路斯的犹太人大规模起事，蔓延到美索不达米亚，各地死人很多。

  117 年 8 月图拉真在归途中去世。继位的哈德良放弃了幼发拉底河以东的新占地，亚美尼亚恢复为附庸国。本站把事件按发生地归泳道，这场战争的战场在两河流域，所以放在“两河与波斯”泳道。此后罗马又几次攻入泰西封，都没有能长久占据两河下游。
