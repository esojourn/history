name: 澶渊之盟
summary: 1004 年辽军南下至澶州，宋真宗亲征后议和，宋每年给辽绢银，此后百余年无大战。
body: |-
  雍熙北伐失败以后，宋辽在河北边境长期处于对峙状态。景德元年（公元 1004 年）闰九月，辽圣宗和承天太后萧绰率大军南下，绕过宋军坚守的城池，长驱直入，十一月到达黄河北岸的澶州城下，开封受到威胁。

  宋朝朝廷大为震动。参知政事王钦若主张迁都金陵，签书枢密院事陈尧叟主张迁往成都。宰相寇准坚决反对，力主宋真宗亲征。真宗勉强北上，到达澶州南城后不敢再走，寇准和殿前都指挥使高琼一再催促，真宗才渡过黄河，登上北城城楼。据《续资治通鉴长编》，城下将士望见御盖，欢呼声传到几十里外。此前辽军的统军萧挞览在澶州城下察看地形时，被宋军的床子弩射中而死，辽军士气受挫。辽军深入宋境，后路有被切断的危险，萧太后于是派人议和。

  宋朝派曹利用往来谈判。这年十二月（已是公历 1005 年初）双方订立盟约，主要内容是：宋每年给辽绢二十万匹、银十万两，称为“岁币”；两国皇帝以兄弟相称，宋真宗为兄，辽圣宗为弟，真宗称萧太后为叔母；双方维持现有边界，各自不得收纳对方的逃亡者，不得新筑城堡、开挖河道（据《续资治通鉴长编》所载誓书）。澶州又名澶渊，所以称“澶渊之盟”。

  澶渊之盟以后，宋辽之间一百多年没有大的战争，双方在边境设立榷场开展贸易，使者往来不绝。宋朝每年给辽的岁币，与战争的军费相比数额不大，而且通过贸易又收回不少。但宋朝内部也有人把它视为城下之盟、国家的耻辱，王钦若就借此打击寇准，并引出了真宗晚年的天书封禅（另见该条）。庆历二年（1042 年）辽朝又乘宋夏交战之机索地，宋朝以增加岁币了结此事。
