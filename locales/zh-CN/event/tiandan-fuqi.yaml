name: 田单复齐
summary: 前 279 年田单用反间计使燕国撤换乐毅，再以火牛阵大破燕军，收复齐国七十余城。
body: |-
  乐毅破齐后，齐国只剩莒和即墨两城。即墨的军民推举田单为将，坚守了数年。公元前 279 年燕昭王去世，燕惠王即位。据《史记·田单列传》，田单派人到燕国散布流言，说乐毅与新王有矛盾，故意不攻下即墨，想在齐地称王，齐人只怕燕国换别的将领来。燕惠王于是派骑劫代替乐毅，乐毅出奔赵国，燕军将士愤愤不平。

  田单又散布说齐人最怕燕军割掉俘虏的鼻子、挖掘城外的祖坟，燕军信以为真，照着做了，即墨军民看到后痛哭流涕，个个要求出战。田单让精壮甲士藏起来，派老弱妇女登城守卫，又让城中富户送金给燕将，假意约定投降，燕军更加松懈。

  田单在城中收集了一千多头牛，给牛披上画着五彩龙纹的红绸，牛角上绑着锋利的兵刃，牛尾上绑着浸了油脂的芦苇，夜间在城墙上凿开几十个洞，点燃牛尾放出火牛，五千壮士跟在后面冲杀，城中百姓击打铜器呐喊助威。燕军大败，骑劫被杀。齐军乘胜追击，各地纷纷响应，收复了七十余城，从莒迎回齐襄王。田单因功被封为安平君。

  田单复齐后，齐国虽然恢复了国家，但已元气大伤，此后在秦国东进时长期采取守势，最后在公元前 221 年不战而降。
sources: []
recalled:
  - 《史记·田单列传》
  - 《战国策·齐策六》
