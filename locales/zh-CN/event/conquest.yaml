name: 进入迦南
summary: 约书亚率以色列人过约旦河，攻取迦南诸城，为各支派分地。
body: |-
  摩西在摩押地去世以后，约书亚接续他带领以色列人。据《约书亚记》第 2—4 章，他先派两个探子到耶利哥，探子得到妓女喇合的掩护；随后祭司抬着约柜走在前面，约旦河的水在上游停住，百姓从干地上过去，于正月初十日在耶利哥东边的吉甲安营（4:19），并从河中取了十二块石头立在那里。百姓在吉甲受了割礼，守了逾越节，吗哪从此止住（第 5 章）。

  头一座被攻取的城是耶利哥：以色列人一连六日每日绕城一次，第七日绕城七次，祭司吹角，百姓呼喊，城墙就塌陷了（第 6 章）。接着攻艾城，因亚干私取当灭之物而先遭败绩，处置亚干以后才取了那城（第 7—8 章）。基遍人假装从远方来，与以色列人立了约（第 9 章）。耶路撒冷王亚多尼洗德联合亚摩利人的五个王攻打基遍，约书亚从吉甲连夜上去，击败了他们，随后攻取南方诸城（第 10 章）。夏琐王耶宾又联合北方诸王，在米伦水边安营；约书亚击败他们，焚烧了夏琐（第 11 章）。第 12 章列出约旦河西被击败的王，共三十一个。

  战事之后是分地。河东的地摩西生前已分给流便、迦得两个支派和玛拿西半个支派；河西的地由约书亚和祭司以利亚撒在吉甲和示罗拈阄分给其余各支派，会幕也立在示罗（18:1）。又设立了六座逃城，拨给利未人四十八座城（第 20—21 章）。迦勒在求取希伯仑时说，从加低斯窥探之时到那时已经四十五年（14:10）；减去旷野的年数，主要战事约历时六七年，本条的起止年即据此而定。

  《约书亚记》自己也说还有许多未得之地（13:1–6），《士师记》第 1 章列举了各支派没有赶出的居民。考古方面，耶利哥、艾城、夏琐等遗址被毁的年代和原因，学者的判断并不一致；关于以色列人如何在迦南立足，学界除军事征服之外还有逐渐迁入、由当地居民演变而来等几种解释。
sources: []
recalled:
  - 《约书亚记》第 1—21 章
  - 《士师记》第 1 章
