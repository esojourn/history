name: 马戛尔尼使团
summary: 1793 年英国马戛尔尼使团觐见乾隆帝，扩大通商的要求全被拒绝。
body: |-
  十八世纪，英国东印度公司对华贸易迅速增长，从中国大量购买茶叶，但清朝只允许西方商人在广州一口通商，由十三行行商垄断，各种限制和陋规使英国商人十分不满。1792 年英国政府派马戛尔尼为正使、斯当东为副使，以给乾隆帝祝寿为名出使中国，希望改善通商条件，在北京派驻使节。

  使团乘坐“狮子号”等船只，于 1793 年夏天到达天津外海，带来了天文仪器、地球仪、钟表、枪炮、船只模型等礼物。清朝把使团当作“贡使”接待，船上插着“英吉利贡使”的旗帜。九月十四日（乾隆五十八年八月初十），乾隆帝在热河避暑山庄万树园接见了马戛尔尼。觐见前双方在礼节问题上争执很久，清朝要求行三跪九叩礼，马戛尔尼坚持只行英国觐见君主的单膝下跪礼；英方的记载说最终行的是单膝礼，清朝方面的记载则含糊其词。

  马戛尔尼通过和珅等人提出了几项要求：允许英国商人到宁波、舟山、天津贸易；在北京设立商馆；在舟山附近给一个小岛、在广州附近给一块地方供英国商人居住；减免广州到澳门之间的转运税等。乾隆帝在给英王乔治三世的两道敕谕中一一拒绝，称“天朝物产丰盈，无所不有，原不藉外夷货物以通有无”。十月使团离开北京，沿运河南下，经杭州到广州，次年回国。

  马戛尔尼使团是中英两国第一次正式的官方接触。使团成员对沿途的观察和记录，使欧洲人对清朝的认识发生了变化。后世常把这次出使看作中国错失了解世界的机会，也有学者认为不应以后来的历史简单评判当时的决定。1816 年英国又派阿美士德使团来华，也没有成功。
