name: 龙门石窟开凿
summary: 北魏迁都洛阳前后，开始在城南伊阙两岸开凿龙门石窟，此后历代续凿四百余年。
body: |-
  龙门在洛阳城南，伊水从香山和龙门山之间穿过，两山对峙如门阙，古称伊阙。北魏迁都洛阳前后，这里开始开凿石窟。现存年代最早的古阳洞，一般认为开凿于太和十七年（公元 493 年）前后，洞中有大量北魏王公贵族和僧人的造像题记。后人从龙门的北魏造像题记中选出二十种，称为“龙门二十品”，其中大多在古阳洞，是北魏书法“魏碑”的代表，如《始平公造像记》。

  据《魏书·释老志》，宣武帝景明初年，下令仿照平城的灵岩寺石窟（即云冈），在伊阙为孝文帝和文昭皇太后各开凿一座石窟，后来宦官刘腾又为宣武帝开凿了一座。这就是宾阳三洞，从景明元年（500 年）到正光四年（523 年），共用工八十万二千三百六十六个。到北魏末年只完成了宾阳中洞，南洞和北洞到唐代才完成。

  北魏后期的龙门造像，人物面容清瘦，身穿宽袍大带，被称为“秀骨清像”“褒衣博带”，与云冈早期的风格明显不同，反映了孝文帝汉化改革后的审美。

  此后东魏、北齐、隋、唐、北宋各代都在这里继续开凿，以唐代最盛，唐高宗时奉先寺的卢舍那大佛是龙门最大的造像。今天龙门石窟现存窟龛两千三百多个，造像十万余尊，2000 年被列入世界文化遗产名录。
sources: []
recalled:
  - 《魏书·释老志》
