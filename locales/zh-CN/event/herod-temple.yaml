name: 希律重修圣殿
summary: 希律王大规模扩建耶路撒冷的第二圣殿，工程前后延续数十年。
body: |-
  所罗巴伯时代建成的第二圣殿到希律作王时已有近五百年。据约瑟夫斯《犹太古史》卷 15 第 11 章，希律在位第十八年（约公元前 20—前 19 年）向民众宣布要重建圣殿；《犹太战记》卷 1 则说是第十五年，两处不一致。约瑟夫斯记希律在演说中说，现有的殿比所罗门的殿低矮，他要借这项工程表示对神的敬虔。

  民众担心他拆了旧殿却无力建成。约瑟夫斯说，希律于是先把材料全部备齐，预备了一千辆车运石头，雇用一万名熟练工匠，又让一千名祭司学习石工和木工，因为殿的内部只有祭司才能进入。殿宇本身一年半建成，周围的廊子和外院用了八年。

  工程把圣殿山的平台大幅扩展，四周筑起高大的护墙，今天耶路撒冷的西墙（哭墙）就是当时护墙的一段。平台南端建有王廊，东边的廊子称为所罗门的廊（《约翰福音》10:23）。外院外邦人可以进入，再往里设有栏杆和告示，禁止外邦人越过，违者处死；刻有这种希腊文告示的石头近代已经发现。希律还在殿门上安了一只金鹰，他临终前有人把它砍下，为首的人被处死。

  主体完工后，各样修建一直在继续。《约翰福音》2:20 记犹太人对耶稣说，这殿是四十六年才造成的；约瑟夫斯说全部工程到总督阿尔比努在任时（公元 62—64 年）才结束。福音书和《使徒行传》里耶稣和使徒出入的就是这座殿；《马可福音》13:1–2 记门徒称赞殿的石头和殿宇，耶稣说将来没有一块石头留在石头上。公元 70 年，罗马将领提图斯攻破耶路撒冷，圣殿被焚毁。
sources: []
recalled:
