name: 北魏建立
summary: 拓跋珪在塞北重建代国，改国号为魏，击败后燕夺取河北，迁都平城称帝。
body: |-
  鲜卑拓跋部原居大兴安岭北段，东汉以后逐步南迁到阴山以南的盛乐一带。西晋末年，首领拓跋猗卢出兵帮助并州刺史刘琨，被晋朝封为代公、代王。建国三十九年（公元 376 年）代国被前秦所灭，部众由匈奴独孤部和铁弗部的首领分别统辖。

  前秦瓦解后，流落在贺兰部的拓跋珪于登国元年（386 年）正月在牛川召集部落大会，即代王位，时年十六。四月他改称魏王。新政权周围强敌环伺，内部也有叔父窟咄与他争位。他向后燕求援，在慕容垂派来的军队帮助下站稳脚跟，随后几年里接连击破独孤部、贺兰部、高车各部和柔然，登国六年（391 年）渡过黄河消灭了铁弗部。据《魏书》，这一战缴获马三十余万匹、牛羊四百余万头，国用由此富足。

  魏与后燕的关系随着魏的强大而破裂。登国十年（395 年），魏军在参合陂歼灭了后燕太子慕容宝率领的主力。次年慕容垂去世，拓跋珪率四十余万人大举南下，秋天攻取晋阳，随后分兵东出太行，进围后燕的都城中山以及邺城、信都。战事持续了一年多，其间魏军因后方发生叛乱和疾疫一度想要撤退。皇始二年（397 年）十月中山陷落，次年初邺城也被攻下，后燕的残余势力分别退往辽西的龙城和黄河以南的滑台。

  得到河北以后，拓跋珪着手建立中原式的朝廷。天兴元年（398 年）六月，他让群臣议定国号。有人主张沿用“代”，汉族大臣崔宏建议称“魏”，理由是魏为中原的大国之名，他采纳了后者。七月他把都城从盛乐迁到平城，修建宫殿，立宗庙社稷；十二月即皇帝位。他把河北的官吏、百姓和工匠数十万人迁到平城一带，分给耕牛和土地，又把一批归附的部落解散，让部民定居下来，成为国家的编户。

  北魏是拓跋鲜卑建立的王朝。太延五年（439 年）它灭北凉，结束了十六国的分裂，此后与南方的宋、齐、梁对峙，历史上称为北朝，从登国元年算起共存在了一百四十多年。
