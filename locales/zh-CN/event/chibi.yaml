name: 赤壁之战
summary: 公元 208 年，孙权、刘备联军在赤壁用火攻击败南下的曹操，奠定三分天下的格局。
body: |-
  建安十三年（公元 208 年）七月，已经统一北方的曹操率军南征荆州。八月荆州牧刘表病死，九月继位的刘琮不战而降。驻在樊城的刘备率部众南撤，在当阳长坂被曹军的骑兵追上击溃，退到夏口。曹操进占江陵，取得荆州的水军和大批军资，随后顺江东下。

  孙权此时驻在柴桑。他先已派鲁肃到荆州察看形势，鲁肃在长坂见到刘备，劝他与孙权联合；刘备派诸葛亮随鲁肃去见孙权。据《三国志·吴书》各传，曹操写信给孙权，自称统率水军八十万，孙权的部下多主张迎降。鲁肃、周瑜力主抵抗。周瑜估计曹操从北方带来的不过十五六万人，新得的荆州兵七八万人，而且北兵不习水战，又已出现疫病。孙权决意迎战，派周瑜、程普率三万人溯江西上，与刘备会合。

  两军在赤壁相遇。曹军中疫病流行，初战不利，退到长江北岸。曹军把战船首尾相连，周瑜的部将黄盖建议用火攻。他先写信向曹操诈降，然后带数十艘装满干草枯柴、浇上油脂的战船驶向北岸，接近时同时点火。当时东南风很急，火船冲入曹军船阵，战船尽被烧毁，火势延及岸上的营寨，人马烧死、溺死的很多。周瑜、刘备率军水陆并进，曹操带残部从华容道步行撤退，路上泥泞难行，又有不少人死于饥病。

  曹操留曹仁守江陵，自己退回北方。周瑜围攻江陵一年多，曹仁撤走；刘备则乘机占领长江以南的四个郡。此后曹操无力再大举南下，孙权稳固了江东，刘备有了立足之地，三方分立的局面由此形成。赤壁的确切位置历来有多种说法，今多取湖北省赤壁市西北一说。后世小说里“借东风”“草船借箭”等情节，不见于《三国志》的记载。
