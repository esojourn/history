name: 邯郸之战与窃符救赵
summary: 秦军围攻邯郸，信陵君窃符救赵，前 257 年秦军大败而退。
body: |-
  长平之战后，赵国与秦讲和，答应割让六城，但随后反悔，联络各国共同抗秦。公元前 259 年，秦国再次出兵攻赵，次年包围了赵都邯郸。白起认为赵国经过一年多的休整已有准备，时机已失，称病不肯为将；秦先后以王陵、王龁为将，久攻不下。

  邯郸城内军民拼死坚守，“炊骨易子而食”。平原君带着门客毛遂等人到楚国求救，毛遂按剑逼迫楚考烈王订盟，楚国派春申君率军救赵。魏国派晋鄙率十万大军救赵，但魏安釐王在秦国的威胁下，让大军驻扎在邺观望不前。魏公子信陵君用侯嬴之计，请如姬从魏王卧室中盗出兵符，带着力士朱亥赶到邺，朱亥用铁椎击杀了晋鄙，信陵君挑选八万精兵进击秦军。平原君又散尽家财，组织三千敢死之士出击。

  公元前 257 年，魏、楚援军与邯郸守军内外夹击，秦军大败，郑安平率领的两万秦军投降赵国，秦军解围而去。同年白起被秦昭王赐死于杜邮。邯郸之战是战国后期东方诸国联合抗秦取得的最大胜利，暂时延缓了秦国统一的步伐。

  成语“毛遂自荐”“脱颖而出”“窃符救赵”都出自这次战争。邯郸被围时，齐人鲁仲连力斥尊秦为帝之议，事见《战国策·赵策三》，也是这一时期的著名故事。
sources: []
