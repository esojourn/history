name: 班超经营西域
summary: 公元 73 年起，班超以少量人马在西域活动三十一年，使西域五十余国重新归附汉朝。
body: |-
  西汉在西域设都护，统领天山南北的绿洲各国。王莽时西域与中原断绝，各国转而受北匈奴控制。东汉初年，西域诸国曾遣使请求重设都护，光武帝以国内初定为由没有答应。此后北匈奴屡次胁迫西域各国侵扰河西，《后汉书》说边郡的城门白天也要关闭。

  永平十六年（公元 73 年），明帝派窦固等四路出击北匈奴，窦固一路进至天山，占领伊吾。假司马班超随即奉命出使西域。据《后汉书·班超传》，他带着三十六名随从到达鄯善，乘夜袭杀前来的匈奴使团，鄯善归汉；接着到于阗，迫使于阗王杀掉匈奴派来监国的使者；次年到疏勒，废掉龟兹所立的国王，另立疏勒旧王的后人。同年朝廷重设西域都护和戊己校尉。

  永平十八年明帝去世，焉耆、龟兹乘机攻杀都护陈睦，匈奴围困戊己校尉。章帝决定放弃西域，召班超回朝。班超行至于阗，被当地王侯挽留，于是返回疏勒，上书请求留下。此后十多年，朝廷只先后派给他一千多名援兵，他主要依靠疏勒、于阗等国的军队，陆续平定莎车等国，并击退大月氏的一次进攻。

  永元三年（91 年），北匈奴被窦宪击败西迁，龟兹等国投降，朝廷任班超为西域都护，驻在龟兹。永元六年他征调各国兵力攻破焉耆，本传说至此“西域五十余国悉皆纳质内属”。永元九年他派甘英出使大秦。永元十四年（102 年）班超回到雒阳后去世。继任的都护处置失当，几年后西域再度反叛；后来他的儿子班勇又一次重建了汉朝在西域的统治。
sources: []
recalled:
  - 《后汉书·班梁列传》
  - 《后汉书·西域传》
