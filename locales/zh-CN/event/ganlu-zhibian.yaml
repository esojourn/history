name: 甘露之变
summary: 835 年唐文宗与李训以观甘露为名谋诛宦官，事败，宦官率神策军屠杀朝官。
body: |-
  唐文宗由宦官拥立，但不甘心受制于宦官。他先后起用李训、郑注，利用宦官之间的矛盾，毒死了拥立他的宦官王守澄，又贬杀了几个宦官首领，然后计划一举除掉以仇士良为首的宦官集团。原定的计划是由出任凤翔节度使的郑注带兵入京，在为王守澄送葬时诛杀宦官，但李训想独占功劳，决定提前动手。

  大和九年（公元 835 年）十一月二十一日，文宗在大明宫紫宸殿上朝，左金吾大将军韩约奏报说，左金吾仗院的石榴树上夜降甘露，这在当时被看作祥瑞。文宗先派李训去察看，李训回来说不像是真甘露，文宗又派仇士良、鱼志弘带领宦官们去看。韩约事先在仗院里埋伏了士兵，但他神色慌张，满头大汗，恰好一阵风吹起帐幕，仇士良看见了埋伏的士兵，宦官们急忙逃回含元殿，抬起文宗的乘舆退入内宫，关闭宫门。

  仇士良随即派神策军出宫，见人就杀，据《资治通鉴》，在中书、门下两省和金吾仗院中被杀的官吏、士卒有六七百人，随后又在城中搜捕，死者又有一千多人。宰相王涯、贾餗、舒元舆以及李训等人都被抓获，王涯在严刑下被迫承认谋反，几家被灭族；郑注也在凤翔被监军宦官杀死。这一事件史称“甘露之变”。

  此后朝政完全被宦官把持，据《资治通鉴》，天下大事都由北司（宦官）决定，宰相只是奉行文书而已。仇士良对文宗也毫不客气，文宗郁郁寡欢，五年后去世。
sources: []
recalled:
  - 《旧唐书·李训传》
  - 《旧唐书·文宗纪》
  - 《资治通鉴》卷二百四十五
