name: 田氏代齐
summary: 齐国田氏逐步夺取姜齐政权，前 386 年田和被周王列为诸侯。
body: |-
  田氏的祖先是陈国公子完，春秋时为避祸逃到齐国，改姓田，世代在齐国为大夫。据《史记·田敬仲完世家》，田氏用大斗借出粮食、小斗收回，收买人心，齐国百姓纷纷归附。晏婴曾预言齐国的政权终将归于田氏。

  公元前 481 年，田常（田成子）杀了齐简公，立简公之弟为平公，自任相国，又扩大自己的封地，从此齐国的政权落入田氏手中。到他的曾孙田和时，于公元前 391 年把齐康公迁到海滨，只给他一座城作为食邑。公元前 386 年，周安王正式册立田和为齐侯。公元前 379 年齐康公死，姜姓齐国的祭祀断绝。

  史家把这一过程称为“田氏代齐”，与三家分晋同为春秋向战国过渡的标志，此后的齐国称为“田齐”，以区别于此前的“姜齐”。田氏的齐国在威王、宣王时期达到鼎盛。

  据《史记》，田常“以大斗出贷，以小斗收”，齐人作歌称颂他。孔子听说陈恒（即田常）弑君，斋戒三日，请求鲁哀公出兵讨伐，哀公让他去告诉三桓，三桓不肯，事见《论语·宪问》和《左传》哀公十四年。

  据《史记》，田齐的国君此后依次为太公田和、桓公田午、威王、宣王、湣王、襄王和王建，王建时齐国被秦所灭。
sources: []
recalled:
  - 《史记·田敬仲完世家》
  - 《史记·齐太公世家》
  - 《左传》哀公十四年
