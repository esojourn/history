name: 庇西特拉图家族的僭政
summary: 公元前 546 年至前 510 年，庇西特拉图父子统治雅典。
body: |-
  庇西特拉图在公元前 561 年前后两度夺取雅典政权又两度被逐，约前 546 年第三次回国，在帕勒涅击败对手，从此牢固地掌握雅典直到前 527 年去世。希腊语里的“僭主”指不依成法、靠武力或民众支持取得个人统治的人，在当时还不一定是贬义。

  他保留了执政官、议事会等原有的官制，只是安排亲信任职。他扶助小农，开辟财源，兴修神庙和供水设施，扩大泛雅典娜节，在酒神节上设立悲剧比赛；传统上说悲剧诗人忒斯庇斯在前 534 年前后第一次获奖。雅典的彩陶在这一时期取代科林斯陶器，行销各地。《雅典政制》说，后人常把他的统治称为“克罗诺斯的时代”，即黄金时代。

  他死后长子希庇亚斯继位。前 514 年泛雅典娜节上，哈摩狄奥斯和阿里斯托革顿刺杀了希庇亚斯的弟弟希帕科斯。修昔底德特别指出，这起刺杀出于私人恩怨，被杀的也不是当政的僭主，雅典人后来把两人当作“解放者”来歌颂是弄错了。此后希庇亚斯变得多疑而严酷，处死了许多人。

  流亡在外的阿尔克迈翁家族出资重建德尔斐的神庙，据希罗多德，他们买通女祭司，使神谕一再要求斯巴达人解放雅典。前 510 年斯巴达王克里昂米尼率军进入阿提卡，把希庇亚斯围在卫城上；希庇亚斯的孩子在偷运出境时被俘，他只得交出卫城，带家人离开，后来投奔波斯。二十年后他随波斯军队在马拉松登陆。
sources: []
recalled:
