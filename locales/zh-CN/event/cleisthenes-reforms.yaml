name: 克里斯提尼改革
summary: 公元前 508 年至前 507 年，雅典改设十个地域部落和五百人议事会。
body: |-
  公元前 510 年僭主希庇亚斯被逐后，雅典的贵族重新争权。前 508 年伊萨哥拉斯当选执政官，他的对手克里斯提尼转而寻求平民的支持。伊萨哥拉斯请斯巴达王克里昂米尼出面，以阿尔克迈翁家族祖上犯有渎神之罪为由，驱逐克里斯提尼和七百户雅典人。克里昂米尼带少数兵力来到雅典，又要解散议事会，把政权交给伊萨哥拉斯一派的三百人。议事会拒不服从，民众群起把他们围在卫城上，第三天斯巴达人获准撤离。克里斯提尼等人被召回。这是雅典民众第一次自己起来决定政局。

  克里斯提尼随后提出的方案改变了公民的编组方式。阿提卡的一百多个村社成为基层单位，各有自己的名册、大会和村长，公民以“某某村社的某人”为正式称呼。全境分为城区、沿海、内陆三类地区，各分十个“三分区”；从三类地区各取一个三分区合成一个部落，共十个部落，用十位英雄的名字命名。原来按血缘划分的四个部落失去了政治作用。每个部落每年抽选五十人，按村社大小分配名额，组成五百人议事会。军队按十个部落编成十个团，前 501 年起每个部落选一名将军。

  这样，每个部落里都混合了来自不同地区的人，旧贵族靠本地的门客和宗族左右选举的基础被打散了。《雅典政制》还把陶片放逐法归于这次改革：公民大会每年表决是否举行一次放逐，如果举行，得票最多的人须离开雅典十年，财产和公民身份不受影响。第一次使用是在前 487 年。

  希罗多德记下改革后雅典接连击败彼奥提亚人和卡尔基斯人，并评论说，雅典人在僭主统治下打仗并不比邻人强，一旦摆脱了僭主就远远超过了他们，可见“平等的发言权”是一件好事。
sources: []
recalled:
  - 希罗多德《历史》卷五第 66—78 章
  - 《雅典政制》第 20—22 章
