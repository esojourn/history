name: 孝文帝汉化改革
summary: 孝文帝迁都后禁胡服、断北语、改汉姓、定姓族、鼓励通婚，全面推行汉化。
body: |-
  迁都洛阳之后，魏孝文帝推行了一系列改革，使鲜卑统治集团从生活方式到政治制度全面汉化。

  太和十八年（公元 494 年）十二月，他下诏禁止士民穿鲜卑服装，改穿汉服。次年六月，又下诏禁止在朝廷上说鲜卑语，据《魏书》，三十岁以上的人可以慢慢改，三十岁以下在朝做官的人必须立即改说汉语，违者降职免官。同年规定，迁到洛阳的鲜卑人一律以河南洛阳为籍贯，死后葬在河南，不得归葬北方。他还按照汉代的标准改定了度量衡。

  太和二十年（496 年）正月，他下诏把皇族的姓氏拓跋改为元，其他鲜卑贵族的复姓也都改为汉姓，如丘穆陵氏改为穆氏，步六孤氏改为陆氏，独孤氏改为刘氏。他又仿照汉族的门阀制度排定姓族，规定鲜卑的穆、陆、贺、刘、楼、于、嵇、尉八姓与汉族的崔、卢、郑、王等高门地位相当，做官依门第高下而定。他本人纳汉族高门的女儿为妃嫔，又为几个弟弟聘娶汉族高门之女，鼓励鲜卑与汉族通婚。

  此外，他采纳王肃等人的意见，参照南朝的制度改定官制和朝仪，制定新的律令，重修礼乐和祭祀。

  改革遭到一部分鲜卑贵族的抵制。太子元恂不愿留在洛阳，企图逃回平城，被废黜后赐死；镇守北方的穆泰、陆叡等人在平城密谋反叛，也被平定。孝文帝的改革促进了民族融合，对隋唐的制度和文化影响深远。但改革也使洛阳的鲜卑贵族迅速门阀化、腐化，与留守北边的鲜卑将士之间的隔阂越来越深，为北魏后期的动乱埋下了隐患。
