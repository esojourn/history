name: 萧道成代宋建齐
summary: 刘宋末年宗室残杀，将领萧道成掌握朝政，479 年受禅建立南齐。
body: |-
  宋孝武帝去世后，刘宋宗室的内斗愈演愈烈。前废帝刘子业暴虐，在位一年多就被杀。宋明帝刘彧即位后，各地拥护晋安王刘子勋的军队起兵，泰始二年（公元 466 年）刘子勋在寻阳称帝，四方响应，明帝虽然平定了这次叛乱，但淮北的徐州守将薛安都等人投降北魏，淮北四州和淮西之地从此归魏。明帝为了保住儿子的帝位，几乎杀尽了孝武帝的儿子和自己的弟弟。

  泰豫元年（472 年）明帝去世，十岁的后废帝刘昱即位。元徽二年（474 年）桂阳王刘休范起兵进攻建康，将领萧道成守新亭，平定了这次叛乱，从此进入权力中心。刘昱性情凶暴，常带着侍从在街上随意杀人，元徽五年（477 年）被左右杨玉夫等人杀死，萧道成迎立刘准为帝，即宋顺帝，自己掌握大权。

  荆州刺史沈攸之起兵反对萧道成，朝中的袁粲、刘秉也谋划在石头城举兵，都被萧道成先后平定。昇明三年（479 年）四月，宋顺帝禅位，萧道成即位，建立齐朝，史称南齐，年号建元。据《南史》，顺帝被迫出宫时哭着说，愿来生世世不再生在帝王家。不久，顺帝和刘氏宗室多人被杀。刘宋共历八帝六十年。

  南齐是南朝最短的一朝，共七帝二十三年，到 502 年被萧衍建立的梁朝取代。南齐同样不断发生宗室屠杀，齐明帝萧鸾几乎杀尽了高帝、武帝的子孙。
