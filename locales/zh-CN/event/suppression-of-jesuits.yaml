name: "耶稣会被解散"
summary: "1773 年教皇克莱门特十四世下令解散耶稣会，1814 年庇护七世予以恢复。"
body: |-
  耶稣会自 1540 年成立后，在教育、宣教和宫廷中势力极大，也树敌很多。据一般记载，十八世纪中叶，葡萄牙（1759 年）、法国（1764 年）、西班牙（1767 年）等天主教国家先后驱逐耶稣会士，各国朝廷联合向教皇施压，要求取缔该会。

  《历史的轨迹》第三十七章说，1773 年教皇克莱门特十四世废止了耶稣会，1814 年在教皇庇护七世手下又恢复了；从此以后，耶稣会一直是教皇宝座背后强大的势力。该书又说，十七世纪耶稣会曾反对詹森派，促使路易十四迫害他们；1870 年梵蒂冈会议宣布教皇无误，也是在耶稣会的影响下。

  解散期间，普鲁士的腓特烈二世和俄国的叶卡捷琳娜二世不肯在本国公布教皇的命令，耶稣会士因此在这两国保存了下来，恢复时便以此为根基。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十七章“东方教会与罗马教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter41.html"
recalled:
  - "克莱门特十四世通谕《我们的救主和赎主》（1773 年）"
  - "庇护七世通谕《全体教会的关怀》（1814 年）"
