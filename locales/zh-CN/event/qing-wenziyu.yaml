name: 清代文字狱
summary: 康雍乾三朝因文字获罪的案件，以乾隆朝最多。
body: |-
  “文字狱”是指因为文字言论而获罪的案件。清朝以少数民族入主中原，对汉族士人中流露的反清、怀念明朝的言论十分敏感，康熙、雍正、乾隆三朝发生了大量文字狱。

  康熙年间影响最大的是《南山集》案。翰林院编修戴名世的《南山集》中采用了南明的年号，康熙五十年（1711 年）被人告发，戴名世被处死，为书作序、刻书的人和他的同族多人受到牵连。雍正年间，湖南人曾静受明末清初学者吕留良著作中“华夷之辨”思想的影响，派学生张熙投书川陕总督岳钟琪，劝他反清，岳钟琪告发了此事。雍正帝亲自审问曾静，把审讯记录和自己的谕旨编成《大义觉迷录》颁行全国，为清朝统治的合法性辩护，赦免了曾静；已经去世的吕留良则被开棺戮尸，子孙和门人被处死或流放。乾隆帝即位后，又把曾静处死，收回了《大义觉迷录》。

  乾隆年间的文字狱数量最多，据学者统计有一百多起。乾隆中期以后，借编修《四库全书》之机，朝廷在全国搜查“违碍”书籍，许多案件是因为诗文中的个别字句被人告发或被官员深文周纳而起，例如胡中藻《坚磨生诗钞》案、徐述夔《一柱楼诗》案、王锡侯《字贯》案等。乾隆后期文字狱才逐渐减少。

  文字狱造成了士人的普遍恐惧，许多学者回避现实问题，转向考据之学，龚自珍有“避席畏闻文字狱，著书都为稻粱谋”的诗句。
sources: []
