name: 《辛丑条约》
summary: 1901 年清朝与十一国签订条约，赔款四亿五千万两。
body: |-
  八国联军攻占北京后，慈禧太后任命李鸿章和庆亲王奕劻为全权大臣，与列强议和。光绪二十六年（1900 年）底列强提出议和大纲十二条，慈禧太后见条款中没有追究她的责任，立即表示接受。光绪二十七年（1901 年，干支为辛丑）九月七日，奕劻、李鸿章与英、美、法、德、俄、日、意、奥、西班牙、荷兰、比利时十一国的代表签订了《辛丑条约》。

  条约的主要内容有：清朝向各国赔款白银四亿五千万两，分三十九年还清，本息合计九亿八千多万两，以海关税、常关税和盐税作担保，史称“庚子赔款”；在北京东交民巷划定使馆界，界内由各国驻兵管理，中国人不准居住；拆毁大沽炮台及从北京到海边的炮台，允许各国在北京到山海关的铁路沿线十二个地方驻兵；清朝永远禁止中国人成立或加入“与诸国仇敌”的组织，地方官对辖境内发生的“伤害诸国人民之事”负责；惩办支持义和团的官员；派亲王、大臣到德国、日本道歉；改总理衙门为外务部，位列六部之首。

  《辛丑条约》使清朝的财政陷入更大的困难，北京城内有了外国驻军，清朝的主权受到进一步的损害。条约签订两个月后，李鸿章在北京病逝。后来美国等国把部分庚子赔款退还给中国，用于兴办教育和派遣留学生，清华学校就是用美国退还的赔款建立的。
sources: []
recalled:
