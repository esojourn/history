name: 大索貌阅与输籍法
summary: 隋朝清查户口的两项措施，查出大批隐漏人口，使他们成为向国家纳税服役的编户。
body: |-
  南北朝以来，大批农民为逃避赋役，或依附豪强成为私属，或虚报年龄。隋朝建立后，为了增加国家掌握的人口，采取了两项措施。

  一是“大索貌阅”。据《隋书·食货志》，开皇年间文帝命令各州县大规模清查户口，按户籍上登记的年龄核对每个人的相貌，查出虚报年老、年幼以逃避赋役的人；户口不实的，乡里的正长要被流放远方。又规定堂兄弟以下要分家另立户籍，防止大户隐匿人口。据同书，这次清查共增加了四十四万三千丁，新附户籍的人口一百六十四万一千五百。

  二是高颎提出的“输籍法”。由朝廷制定统一的标准，每年正月五日县令出巡，按标准评定每户的等级和应纳的赋税，写成定簿。依附豪强的人户发现向国家纳税反而比交给豪强的少，便纷纷脱离豪强，登记为国家编户。

  这两项措施使国家掌握的户口大为增加，是隋朝财政充裕的重要原因。
sources: []
recalled:
  - 《隋书·食货志》
  - 《资治通鉴》卷一百七十六
