name: 蒙古灭西夏
summary: 蒙古从 1205 年起多次进攻西夏，1227 年西夏末帝投降被杀，西夏灭亡。
body: |-
  西夏在宁夏、河西一带立国，北面与蒙古高原接壤。1205 年铁木真第一次出兵攻掠西夏边境，1207 年再次进攻。1209 年成吉思汗亲率大军进攻，包围西夏都城中兴府（即兴庆府），引黄河水灌城，后来堤坝决口，蒙古军营也被淹，西夏襄宗只得献女求和，答应臣服、出兵助战。此后西夏一度依附蒙古，与金朝交战，两国之间长期的和好关系破裂。

  1219 年成吉思汗西征花剌子模，要西夏出兵从征，据《元朝秘史》，西夏大臣阿沙敢不出言讥讽，说力量不够就不必做大汗，拒绝出兵。成吉思汗西征回来以后，以此为由，1226 年亲率大军再次进攻西夏，先后攻下黑水城、甘州、肃州、西凉府，在灵州击败西夏援军，然后包围中兴府。

  1227 年西夏末帝李睍被困日久，请求投降。这时成吉思汗已经去世，据记载他临终前嘱咐秘不发丧，待西夏投降后将其君臣全部杀死。李睍出城投降后被杀，西夏灭亡。西夏从 1038 年李元昊称帝算起，立国约一百九十年。蒙古军在西夏各地进行了严重的屠杀和破坏，西夏的文献和历史记载大量散失，元朝修史时只修了宋、辽、金三史，没有为西夏单独修史。二十世纪以来黑水城等地出土了大量西夏文献，使西夏历史的研究有了新的进展。
sources: []
recalled:
  - 《元朝秘史》
  - 《元史·太祖本纪》
  - 《宋史·夏国传》
