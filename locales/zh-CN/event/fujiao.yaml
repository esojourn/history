name: 夫椒之战
summary: 前 494 年夫差在夫椒大败越军，勾践退守会稽求和，夫差许之。
body: |-
  公元前 496 年吴王阖闾在檇李败于越军，伤重而死，儿子夫差立志复仇，日夜练兵。公元前 494 年，越王勾践听说吴国在练兵，想先发制人，范蠡劝阻无效。越军进攻吴国，夫差率精兵迎战，在夫椒大败越军。

  勾践带着五千残兵退守会稽山，被吴军包围。据《左传》哀公元年和《国语·越语》，勾践派大夫文种去求和，文种先用美女和宝物贿赂吴国太宰伯嚭，再由伯嚭说服夫差。伍子胥坚决反对，他引用夏代少康中兴的故事，说越国君臣能吃苦，若不趁此灭掉，日后必成大患，并预言“越十年生聚，而十年教训，二十年之外，吴其为沼乎”。夫差不听，与越讲和。

  越国从此成为吴国的属国，勾践卧薪尝胆，任用文种、范蠡发展生产、训练军队，等待复仇的时机；夫差则转而北上争霸。二十年后，越国果然灭了吴国。

  关于勾践求和后的经历，《国语·越语上》说越国“宦士三百人于吴，其身亲为夫差前马”；后来的《吴越春秋》又演绎出勾践为夫差养马、尝粪问疾等情节，多出自后世的渲染。

  据《国语·越语下》，会稽之围以后，勾践让文种留守国内主持国政，自己与范蠡到吴国为臣，二人分工合作，为日后灭吴奠定了基础。夫椒的地望，一说在今江苏太湖中，一说在今浙江绍兴北。
sources: []
recalled:
  - 《左传》哀公元年
  - 《国语·越语上》
  - 《史记·越王勾践世家》
