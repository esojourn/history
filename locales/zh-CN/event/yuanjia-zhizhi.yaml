name: 元嘉之治
summary: 宋文帝在位的三十年间，江南政局安定、户口增殖、文化兴盛，史称“元嘉之治”。
body: |-
  刘宋开国皇帝刘裕在位只有两年。他死后，少帝刘义符被辅政大臣废杀，景平二年（公元 424 年）宋文帝刘义隆即位，次年改元元嘉。他在位三十年，是南朝政局较为安定的一段时期。

  文帝即位后，先诛除了专权的徐羡之、傅亮、谢晦，把权力收归自己手中。他留意吏治，地方官的任期较长，便于施政；屡次下诏劝课农桑，减免百姓拖欠的租调。据《宋书·良吏传》序，元嘉年间百姓繁衍，除了每年的租税没有额外的征发，百户之乡、有集市的城邑，到处都有人歌舞，这是刘宋最兴盛的时候。

  这一时期文化学术很兴盛。元嘉十五年（438 年），文帝请雷次宗在建康鸡笼山开馆讲授儒学，次年又设立玄学、史学、文学三馆，分别由何尚之、何承天、谢元主持，合称四馆。何承天制定了新的历法《元嘉历》。裴松之为《三国志》作注，范晔写成《后汉书》，刘义庆主持编撰《世说新语》；诗坛上有谢灵运、颜延之、鲍照，后世称为“元嘉三大家”。

  元嘉之治并不是没有隐患。文帝晚年与弟弟刘义康争权，杀了名将檀道济；他两次北伐北魏都告失败，元嘉二十七年（450 年）魏太武帝反攻到长江北岸，江淮之间一片残破。据《资治通鉴》，此后“邑里萧条，元嘉之政衰矣”。元嘉三十年（453 年），文帝被太子刘劭所杀，此后刘宋宗室互相残杀，国势日衰。
sources: []
recalled:
  - 《宋书·文帝纪》
  - 《宋书·良吏传》
  - 《资治通鉴》卷一百二十至一百二十七
