name: 蒙古灭大理
summary: 1253 年忽必烈远征大理，攻下大理城，云南从此归入蒙古统治，以后设立云南行省。
body: |-
  蒙哥即大汗位后，计划从四川正面进攻南宋，同时派兵绕到南宋的西南侧后，形成包围之势。1253 年他命弟弟忽必烈率军远征大理。大理国是段氏在云南建立的政权，与宋朝长期保持往来。

  这年秋天，忽必烈从临洮出发，经过吐蕃东部的高山峡谷南下，据《元史》，蒙古军用皮囊和木筏渡过金沙江。十二月蒙古军攻下大理城，忽必烈听从姚枢等人的劝谏，下令禁止杀掠。大理国王段兴智逃走，次年被俘。忽必烈随后率军北返，留下大将兀良合台继续平定云南各部，兀良合台后来又进攻安南，并从云南北上攻宋。

  蒙古保留了段氏的地位，让段兴智世袭大理总管，管理当地事务。忽必烈即位后，至元十一年（1274 年）派赛典赤·赡思丁到云南设立行省，此后云南一直是中国的一个省级行政区。
sources: []
recalled:
  - 《元史·世祖本纪》
  - 《元史·兀良合台传》
