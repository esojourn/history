name: 苏拉进军罗马
summary: 执政官苏拉因指挥权被转授马略，率军团攻入罗马，罗马军队首次以武力占领本城。
body: |-
  公元前 88 年，执政官苏拉率军进入罗马，这是罗马军队第一次用武力攻占本城。

  这一年同盟者战争接近尾声，本都王米特里达梯六世占领了亚细亚行省。对本都作战的指挥权归了执政官苏拉，他的军队正在坎帕尼亚围攻诺拉。保民官苏尔皮基乌斯·鲁弗斯提出把新得公民权的意大利人平均编入三十五个部落，遭两名执政官阻挠。苏尔皮基乌斯的人在广场上动武，另一名执政官的儿子被杀，据普鲁塔克，苏拉躲进马略家中才脱身。苏尔皮基乌斯随即通过他的法案，并附带一项：把对米特里达梯的指挥权转授给年近七十、没有任何官职的马略。

  苏拉赶回诺拉城外的军营，向士兵陈说自己所受的侮辱；据阿庇安，士兵担心马略会另募军队去东方，主动要求进军罗马。前来接管军队的军官被士兵用石头砸死。苏拉的军官们除一名财务官外全都离开了他。他带六个军团北上，元老院几次派使者拦阻，他一面答应一面前进。军队进城时，居民从屋顶投掷瓦片，他下令放火箭烧房。马略和苏尔皮基乌斯抵抗失败，各自逃走。

  次日苏拉让元老院宣布马略、苏尔皮基乌斯等十二人为公敌。苏尔皮基乌斯被奴隶出卖遇害，马略逃到阿非利加。苏拉废除苏尔皮基乌斯的法律，规定议案须先经元老院同意，然后主持了下一年的选举，当选的秦纳并不是他的人。前 87 年初他率军东去。

  他离开后几个月，秦纳就重提苏尔皮基乌斯的法案，被逐后与马略合兵围攻罗马，屠杀政敌。五年后苏拉回师，又是一场内战。阿庇安说，从此以后，羞耻、法律、制度和祖国都不再能约束暴力。
sources: []
recalled:
  - 阿庇安《内战史》卷一第 55—63 章
  - 普鲁塔克《苏拉传》第 7—10 章、《马略传》第 34—40 章
  - 李维《建城以来史》卷七十七摘要
