name: 云冈石窟开凿
summary: 北魏在平城西郊的武州山开凿石窟，昙曜主持开凿的五座大窟是最早的一批。
body: |-
  太武帝灭佛之后，文成帝于正平二年（公元 452 年）即位，下诏恢复佛教。和平初年（460 年前后），沙门统昙曜奏请在平城西面的武州塞开凿石窟五所，每窟雕刻一尊大佛。据《魏书·释老志》，最高的七十尺，其次六十尺，雕饰奇伟，冠于一世。这就是今天云冈石窟的第十六至二十窟，后世称为“昙曜五窟”。

  北魏有“皇帝即当今如来”的观念，《释老志》记载，北魏初年的沙门统法果说，能弘扬佛道的是君主，我礼拜天子就是礼佛。一般认为昙曜五窟的五尊主佛象征北魏道武、明元、太武、景穆、文成五位皇帝，这一说法是学者根据记载推测的。早期造像受到来自西域和凉州的影响，佛像面相丰满，高鼻深目，衣纹紧贴身体。

  孝文帝在位时，云冈开凿进入盛期，出现了许多成对开凿的双窟，佛像开始穿上汉式的宽袍大带，反映了北魏的汉化。太和十八年（494 年）迁都洛阳以后，皇室的开凿重心转到龙门，云冈仍有中小型的洞窟陆续开凿，一直延续到北魏后期的正光年间（520—525 年）前后。

  今天云冈石窟东西绵延约一公里，现存主要洞窟四十五个，大小造像五万余尊，2001 年被列入世界文化遗产名录。它与龙门石窟、敦煌莫高窟常被并称为中国三大石窟。
sources: []
recalled:
  - 《魏书·释老志》
  - 郦道元《水经注·漯水》
