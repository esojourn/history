name: 阿维农教廷
aliases:
  - 教皇的巴比伦之囚
  - 亚威农被掳
summary: 1309—1377 年教廷设在阿维农，七位教皇都是法国人。
body: |-
  1305 年波尔多大主教当选教皇，称克莱门特五世。他在里昂加冕，因意大利战乱和法王的牵制一直没有去罗马，1309 年住进罗讷河东岸的阿维农。这座城当时属于那不勒斯国王，紧邻教皇自己的一小块领地，对岸就是法国。1348 年教皇把它买了下来。此后直到 1377 年，接连七位教皇都是法国人，都住在这里。

  《历史的轨迹》第十九章说，这段时期称为教皇的“巴比伦被掳”：“被掳”是因为教皇都在法王控制之下，“巴比伦”是因为前后约七十年，正如以色列人被掳到巴比伦。这个说法出自当时住在阿维农的意大利诗人彼特拉克。该书说阿维农的教皇完全听命于法国国王；他们受法国的影响很大，枢机也多半是法国人，但并非事事听命，这是其他国家的人对他们的看法。

  教廷离开了意大利的领地，收入减少，于是发展出一套严密的征收办法：新任圣职者第一年的收入归教廷，各地的圣职由教皇预先指定人选并收取费用。该书说，这些教皇大都过着奢靡的生活，用卑鄙的手段出卖主教职位和赎罪券，抽取重税，以致当时许多人称教皇为“敌基督”。七位教皇并不都如此，其中也有生活俭朴、有心整顿的人。

  各国的反应是限制教皇的权力。该书举了两个例子：德意志有选举权的诸侯宣称国王的权柄来自上帝而不是教皇，1356 年的《金玺诏书》规定选举皇帝的办法时没有给教皇留下位置；1366 年英格兰议会宣布不再缴纳约翰王许给英诺森三世的贡金。这一时期还出现了主张教会应服从世俗政府、教会的最高权力属于全体信徒的著作。

  罗马因教皇不在而衰败，意大利人一再呼吁教皇回去。1367 年一位教皇回过罗马，三年后又离开。贵格利十一世在 1376 年 9 月离开阿维农，次年 1 月进入罗马。《历史的轨迹》把结束的年份记作 1376 年，指的是动身那一年。1378 年他去世，随即发生了大分裂。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十九章“教会权势衰微” https://wellsofgrace.com/books/spiritual/2000years/html/chapter21.html"
recalled:
  - 彼特拉克《无题书信集》
  - 帕多瓦的马西利乌斯《和平的保卫者》
