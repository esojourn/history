name: 中华民国成立
summary: 1912 年 1 月 1 日孙中山在南京就任临时大总统，中华民国成立。
body: |-
  武昌起义后，独立各省派代表商议组建中央政府。宣统三年（1911 年）十二月，孙中山从海外回到上海，十二月二十九日，十七省代表在南京投票选举孙中山为临时大总统。1912 年 1 月 1 日晚，孙中山在南京原两江总督署宣誓就职，宣告中华民国成立，定都南京，改用公历，以 1912 年为民国元年。

  南京临时政府由黄兴任陆军总长兼参谋总长，各部总长中既有同盟会会员，也有立宪派和旧官僚。随后黎元洪被选为副总统。临时政府颁布了一系列除旧布新的法令，如禁止缠足、劝令剪辫、禁止刑讯、禁止贩卖人口、禁烟、改革教育等。3 月 11 日，临时参议院通过、孙中山公布了《中华民国临时约法》，规定“中华民国之主权属于国民全体”，实行责任内阁制，宋教仁参与了起草。

  南京临时政府的财政十分困难，北方仍在袁世凯的控制之下。孙中山就职时已表示，如果袁世凯能促成清帝退位、赞成共和，就把大总统让给他。2 月 12 日清帝退位，次日孙中山向临时参议院辞职，推荐袁世凯继任。3 月 10 日袁世凯在北京就任临时大总统，4 月临时政府迁往北京，南京临时政府结束。本站中国泳道的“中华民国”一段从 1912 年开始。
sources: []
recalled:
  - 《孙中山全集》
  - 《中华民国临时约法》
  - 《辛亥革命》资料丛刊
