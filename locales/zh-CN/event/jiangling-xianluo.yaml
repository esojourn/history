name: 江陵陷落
summary: 西魏攻陷梁元帝的都城江陵，元帝焚书后出降被杀，江陵官民被掳往关中。
body: |-
  侯景之乱平定后，梁元帝萧绎没有迁回建康，仍以江陵为都城。这时西魏已经占领了巴蜀，北齐占领了淮南，江陵直接暴露在西魏的兵锋之下。元帝的侄子岳阳王萧詧占据襄阳，早已投靠西魏。据《资治通鉴》，元帝与西魏交往时，要求按照旧日的疆界划分地界，言辞颇为傲慢，宇文泰决意出兵。

  承圣三年（公元 554 年）九月，宇文泰派柱国于谨、中山公宇文护、大将军杨忠等率兵南下，萧詧也率军会合。据《资治通鉴》，元帝当时正在龙光殿讲《老子》，听到警报后停讲，不久又继续讲论，百官都穿着军装听讲。十一月，魏军围城，王僧辩等人的援军没有赶到，城中有人开门迎敌，江陵陷落。

  城破之前，元帝下令焚烧宫中所藏的古今图书，据《资治通鉴》有十四万卷，他说“读书万卷，犹有今日，故焚之”。随后他出城投降，十二月被萧詧派人杀死。西魏把江陵城中的官员百姓数万人掳往关中，分赏给将士为奴婢，体弱的大多被杀；当时在江陵任职的颜之推、在长安出使的庾信，从此都留在了北方。

  西魏立萧詧为梁主，让他据守江陵附近的一小块土地，作为西魏和北周的附属，史称后梁，到隋开皇七年（587 年）被废。南朝从此失去了长江中游的荆襄地区，国力更加衰弱。隋代的牛弘论历代图书的“五厄”，把江陵焚书列为其中之一。
sources: []
