name: 白马驿之祸
summary: 905 年朱温在滑州白马驿杀害裴枢等朝官三十余人，尸体投入黄河。
body: |-
  天祐元年（公元 904 年）朱温杀害唐昭宗、拥立年幼的唐哀帝后，开始为篡夺帝位扫除障碍。次年二月，他派人在洛阳的九曲池宴请昭宗的九个儿子，把他们全部勒死，投尸池中。

  朝中还有一批出身名门、以清流自居的官员。朱温的亲信李振早年屡次考进士不中，对这些人怀恨在心；宰相柳璨也想排挤异己，借朱温之手除掉与自己不和的同僚。天祐二年（905 年），朝廷先后把宰相裴枢、独孤损、崔远以及其他朝官贬往边远地区。同年六月，这些被贬的官员三十多人被集中到滑州的白马驿，一夜之间全部被杀。据《资治通鉴》，李振对朱温说，这些人常自称清流，应当把他们投进黄河，让他们变成浊流，朱温笑着答应了，尸体都被投入黄河。

  这次屠杀以后，唐朝的朝廷上已经没有敢于反对朱温的人。同年年底，柳璨也因朱温怀疑他拖延禅让而被杀。两年后朱温篡唐（另见“朱温篡唐”条）。
sources: []
recalled:
  - 《旧唐书·哀帝纪》
  - 《旧五代史·李振传》
  - 《资治通鉴》卷二百六十五
