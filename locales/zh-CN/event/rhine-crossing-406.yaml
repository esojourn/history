name: 汪达尔人、阿兰人、苏维汇人越过莱茵河
summary: 公元 406 年最后一天，汪达尔人、阿兰人、苏维汇人越过莱茵河进入高卢。
body: |-
  五世纪初，莱茵河的防务已经空虚。401 至 402 年阿拉里克侵入意大利，斯提利科把莱茵河和不列颠的驻军调回去保卫意大利，边境交给与罗马有约的法兰克人看守。405 至 406 年又有拉达盖苏斯率大批部族南下意大利，被斯提利科歼灭。这些接连的移动，一般认为与匈人在多瑙河中游站稳脚跟有关。

  阿奎丹的普洛斯佩尔在《编年史》里记，汪达尔人和阿兰人在 406 年 12 月 31 日越过莱茵河进入高卢；同行的还有苏维汇人。有学者主张应提前一年，没有成为定论。渡河的地点，史料没有明说，哲罗姆列举被毁的城市时把美因茨放在第一个，后人因此多认为是在美因茨附近。河面结冰、蛮族踏冰而过的说法出自十八世纪的吉本，古代记载里没有。

  图尔的格列高利引用一部已失传的史书说，过河之前，汪达尔人先与守边的法兰克人打了一仗，国王戈迪吉塞尔和两万人战死，全靠阿兰人的一位王带兵来救才转败为胜。戈迪吉塞尔的儿子里有后来的盖萨里克，这时还是少年。

  此后近三年，这几支部族在高卢各地流动抢掠。哲罗姆在伯利恒写信说，美因茨被攻破，教堂里杀了几千人，沃尔姆斯、兰斯、亚眠、阿拉斯、斯特拉斯堡相继遭难；高卢的一位主教写道，整个高卢像一个火葬堆在冒烟。不列颠的驻军见朝廷无力救援，接连拥立自己的皇帝，407 年其中的君士坦丁三世带兵渡海到高卢，不列颠从此实际上脱离了帝国。

  409 年秋，汪达尔人、阿兰人和苏维汇人翻过比利牛斯山进入西班牙，两年后抽签瓜分了那里的行省。苏维汇人在西北角建立的王国存续到六世纪；汪达尔人的一支和阿兰人后来被西哥特人替罗马打垮，余部并入盖萨里克一支，429 年渡海去了北非。莱茵河防线没有再恢复，勃艮第人、阿勒曼尼人和法兰克人陆续在河西住了下来。
sources: []
