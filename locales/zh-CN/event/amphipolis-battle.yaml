name: 安菲波利斯战役
summary: 公元前 422 年伯拉西达在安菲波利斯城下击败雅典军，他与克里昂双双阵亡。
body: |-
  安菲波利斯在色雷斯沿海的斯特鲁蒙河畔，是雅典人公元前 437 年建立的殖民城邦，控制着河上的桥、内地的金银矿和造船的木材。前 424 年冬它被伯拉西达夺去，雅典将军修昔底德因救援不及而被放逐。前 423 年双方订立一年休战，期满后克里昂说服雅典人出兵，率重装步兵一千二百、骑兵三百和盟邦的部队，前 422 年夏先攻下托罗涅，再进驻河口的埃翁，等候马其顿和色雷斯的援军。

  据修昔底德，雅典士兵对干等不耐烦，议论他们的统帅无能，克里昂只得带兵到安菲波利斯城外的高地上察看地形。伯拉西达兵力的素质不如对方，决定趁其不备。他挑出一百五十名重装步兵由自己率领，其余交给副将。克里昂得报看见城门后人马的脚，知道对方要出击，下令撤回埃翁，队伍转身时把没有盾牌遮护的右侧暴露给了城墙。伯拉西达从一座城门冲出直插雅典队列的中段，副将率主力从另一门出击。雅典人的左翼逃走，右翼在高地上抵抗了一阵后被包围击溃。克里昂逃跑时被一名轻盾兵杀死。雅典人阵亡约六百，对方只损失七人，但伯拉西达在冲锋中受了重伤，被抬进城，听到获胜的消息后死去。

  修昔底德对克里昂的叙述带有明显的敌意，现代学者提醒读者留意这一点。两个最反对议和的人同时去世，尼西阿斯和斯巴达国王普雷斯托阿那克斯主持谈判，次年订立和约。和约规定安菲波利斯归还雅典，但城中居民不肯，斯巴达也没有强制执行，雅典始终没有收回这座城。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷四第 102—108 章；卷五第 1—11 章
