name: 苏武牧羊
summary: 汉使苏武被匈奴扣留十九年，流放北海牧羊，始终不降，汉昭帝时才得以归汉。
body: |-
  汉武帝后期，汉与匈奴多年交战，双方的使者常被对方扣留。天汉元年（公元前 100 年），新即位的且鞮侯单于为缓和关系，送还了历年扣留的汉使。武帝派中郎将苏武持节护送留在汉朝的匈奴使者回去，并带去礼物。使团共一百余人，副使是张胜，属吏有常惠等。

  据《汉书·李广苏建传》，使团到达后，匈奴的缑王和早先随军投降的汉人虞常等密谋劫持单于的母亲逃回汉朝。虞常与张胜是旧识，把计划告诉了他，张胜私下资助了他们。一个月后事情败露，单于派降将卫律审理。苏武得知后认为必定牵连到自己，受审是对国家的侮辱，拔刀自刺，卫律急忙召医抢救才活过来。单于敬重他的气节，想让他投降。卫律当着他的面杀了虞常，逼张胜投降，又举剑威胁苏武，苏武不为所动；卫律再用自己投降后得到的富贵劝诱，被苏武痛骂。

  单于把苏武关进大窖，不给饮食，他靠吃雪和毡毛活了下来；又把他送到北海边无人的地方放牧公羊，其余属吏分别关押在别处。他在北海边掘野鼠储藏的草籽为食，拄着汉节牧羊。单于的弟弟曾来打猎，送给他衣食和牲畜；此人死后，牲畜又被偷走。李陵投降匈奴后受命来劝，对他说汉朝法令无常，亲人多已不在，人生如朝露，何必自苦。苏武回答说自己父子的功名都出于皇帝，情愿为此而死。李陵叹息流泪而去，后来又来告诉他武帝去世的消息，苏武面向南方痛哭。

  昭帝即位几年后，汉与匈奴恢复和亲。汉使索要苏武，匈奴谎称已死；常惠教使者假称天子射雁得到了苏武的帛书，单于才承认他还活着。始元六年（前 81 年）春，苏武与常惠等九人回到长安。他出使时持的节杖一直带在身边。昭帝命他以太牢祭告武帝的陵庙，任为典属国。后世以“苏武牧羊”作为坚守节操的典故。
sources: []
recalled:
  - 《汉书·李广苏建传》
  - 《汉书·匈奴传上》
