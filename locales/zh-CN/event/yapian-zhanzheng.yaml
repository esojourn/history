name: 鸦片战争
summary: 1840 年英国以禁烟为借口发动战争，清朝战败，1842 年签订《南京条约》。
body: |-
  虎门销烟后，英国国内的鸦片商人和工商界要求政府出兵。1840 年英国议会经过激烈辩论，以微弱多数通过了对华战争的军费。同年六月，懿律、义律率领英国舰队到达广东海面，宣布封锁珠江口。英军发现广东防备严密，于是北上，攻陷浙江定海，随后到达天津大沽口外，向清朝递交照会。

  道光帝惊慌失措，把战事的责任归咎于林则徐，将他革职，派直隶总督琦善到广东与英国人谈判。道光二十一年（1841 年）初，琦善在英军的压力下私下与义律议定《穿鼻草约》，答应割让香港，英军随即占领香港岛。道光帝得知后大怒，将琦善革职锁拿，转而对英宣战。英军进攻虎门，关天培战死，随后英军进逼广州，奕山战败求和，签订《广州和约》。广州城北三元里的民众自发组织起来，与英军发生了冲突。

  英国政府对义律的谈判结果不满，改派璞鼎查为全权代表，扩大战争。道光二十一年（1841 年）秋，英军再次北上，攻陷厦门、定海、镇海、宁波，葛云飞、王锡朋、郑国鸿三位总兵在定海战死。次年英军攻陷乍浦、吴淞、上海，进入长江，攻占镇江，在镇江遭到驻防八旗的顽强抵抗，随后兵临南京城下。

  道光二十二年（1842 年）八月，清朝代表耆英、伊里布与璞鼎查在南京江面的英国军舰“皋华丽号”上签订《南京条约》，规定：割让香港岛给英国；开放广州、福州、厦门、宁波、上海五处为通商口岸；赔款二千一百万银元；废除公行制度；英商应纳的进出口税由双方议定。次年又签订了《五口通商章程》和《虎门条约》，英国取得了领事裁判权、片面最惠国待遇等特权。此后美国、法国也与清朝签订了类似的条约。

  鸦片战争是中国近代史的开端。中国开始被迫向西方开放，主权受到损害，传统的朝贡体制开始瓦解。战后林则徐、魏源等人开始关注世界，但清朝整体上没有作出多少改变。
sources: []
recalled:
  - 《筹办夷务始末·道光朝》
  - 魏源《道光洋艘征抚记》
  - 茅海建《天朝的崩溃》
