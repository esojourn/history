name: 刘向父子校书
summary: 刘向、刘歆奉命整理宫廷藏书，逐书校定并撰写提要，编成最早的图书分类目录《七略》。
body: |-
  秦朝焚书和秦末的战乱使先秦典籍大量散失。汉初废除了禁止私人藏书的法令，武帝时又设立抄书的官署，广泛征集图书，宫中和各官署的藏书日渐增多。但这些书抄写在竹简和丝帛上，同一部书往往有来源不同的多种本子，篇章重复或残缺，文字互有出入，简册散乱。

  据《汉书·艺文志》的序，河平三年（公元前 26 年），成帝派谒者陈农到各地搜求遗书，同时命光禄大夫刘向主持校订宫中的藏书。刘向本人负责经传、诸子和诗赋，步兵校尉任宏校兵书，太史令尹咸校数术，侍医李柱国校方技。他们的做法是：把宫中、官署和私人收藏的各种本子汇集起来，除去重复的篇章，补足缺失的，校正文字，确定篇目的次序，然后誊写成定本。每校完一部，刘向就写一篇“叙录”，列出篇目，介绍作者的生平和书的大意，说明校订的经过，随书上奏。这些叙录后来汇集成《别录》。

  这项工作进行了近二十年，刘向去世时还没有完成。哀帝命他的儿子刘歆继续。刘歆在父亲工作的基础上，把全部图书分为六艺、诸子、诗赋、兵书、术数、方技六大类，每类之下再分小类，各写一段说明学术源流的文字，加上总论性质的“辑略”，编成《七略》。据《艺文志》的统计，著录的书共五百九十六家、一万三千二百六十九卷。

  《别录》和《七略》在唐代以后亡佚，但班固编《汉书·艺文志》时以《七略》为底本删取其要，使它的分类和大部分书目保存下来。今天能读到的先秦和西汉古书，如《战国策》《荀子》《管子》《晏子春秋》《列子》等，书名、篇数和编次大多是在这次整理中确定的；其中几部书前面还保留着刘向所写的叙录。
sources: []
recalled:
  - 《汉书·艺文志》
  - 《汉书·楚元王传》
  - 刘向《战国策书录》等现存叙录
