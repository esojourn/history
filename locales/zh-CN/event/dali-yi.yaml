name: 大礼议
summary: 嘉靖帝与大臣争论如何尊称自己的生父，持续三年多，以皇帝获胜告终。
body: |-
  正德十六年（1521 年）正德帝去世，没有儿子，内阁首辅杨廷和依据“兄终弟及”的祖训，迎立正德帝的堂弟、兴献王之子朱厚熜为帝，即嘉靖帝。嘉靖帝即位后，命大臣讨论如何尊崇他的生父兴献王。

  杨廷和与礼部尚书毛澄等人援引汉代定陶王、宋代濮王的先例，认为嘉靖帝应当过继给伯父弘治帝，称弘治帝为“皇考”，称生父兴献王为“皇叔考”。嘉靖帝坚决不同意。新科进士张璁上疏，提出嘉靖帝是继承皇统而不是过继为子，应当尊生父为“皇考”，在京师立庙祭祀。嘉靖帝看了很高兴，说“此论出，吾父子获全矣”。此后双方反复争论，杨廷和多次封还诏书，嘉靖帝则逐步提高生父的尊号。

  嘉靖三年（1524 年）杨廷和被迫辞官，张璁、桂萼等人被召到北京。同年七月，嘉靖帝决定去掉生父尊号中的“本生”二字，两百多名官员在左顺门外跪伏哭谏，嘉靖帝大怒，下令逮捕为首的官员，对一百八十多人施以廷杖，十多人被打死，杨廷和的儿子杨慎被流放云南。九月，嘉靖帝定称弘治帝为“皇伯考”，生父为“皇考恭穆献皇帝”。

  此后嘉靖帝继续提高生父的地位，嘉靖十七年（1538 年）给生父上庙号睿宗，送入太庙，同时把永乐帝的庙号由太宗改为成祖。嘉靖七年（1528 年）他命人编成《明伦大典》，定杨廷和等人的罪。大礼议使嘉靖帝牢牢掌握了朝政，支持他的张璁等人先后入阁，朝中的派系斗争也由此加剧。
sources: []
recalled:
