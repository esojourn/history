name: 太平天国
summary: 1851 年洪秀全金田起事，建立太平天国，定都天京，1864 年失败。
body: |-
  鸦片战争后，广东、广西一带社会动荡，赋税加重，失业的人和流民增多，各种秘密会社十分活跃。洪秀全、冯云山在广西桂平紫荆山区传播拜上帝会，吸收了大批贫苦农民和烧炭工。咸丰元年（1851 年）一月，拜上帝会在桂平金田起事，建号“太平天国”，同年九月攻占永安州，在那里分封诸王，建立制度。

  咸丰二年（1852 年）太平军突围北上，进入湖南，围攻长沙不克，随后攻下岳州、汉阳、汉口和武昌，顺长江东下，咸丰三年（1853 年）三月攻占南京，改名天京，定为都城。此后太平天国颁布了《天朝田亩制度》，提出“有田同耕，有饭同食”的理想，但实际上难以实行。同年太平军派兵北伐和西征，北伐军一度打到天津附近，最后全军覆没；西征军在两湖、江西与湘军反复争夺。咸丰六年（1856 年）太平军攻破清军的江北大营和江南大营，军事上达到鼎盛。

  同年发生“天京事变”，东王杨秀清、北王韦昌辉相继被杀，翼王石达开出走，太平天国元气大伤（另见“天京事变”条）。此后陈玉成、李秀成成为主要将领，洪仁玕到天京总理朝政，提出了《资政新篇》。咸丰十年（1860 年）李秀成攻破江南大营，东取苏州、常州，建立苏福省。

  清朝方面，曾国藩的湘军和后来李鸿章的淮军成为镇压太平天国的主力，英、法等国在第二次鸦片战争结束后也转而支持清朝，在上海组织“常胜军”协助作战。咸丰十一年（1861 年）湘军攻克安庆，次年陈玉成被俘遇害；左宗棠进军浙江，李鸿章进军苏南。同治三年（1864 年）六月洪秀全病死，七月湘军攻破天京，在城中大肆烧杀，太平天国失败。此后太平军余部在各地继续作战了几年。

  太平天国起义历时十四年，波及十八个省，是中国历史上规模最大的农民战争之一，造成的人口损失极为惨重。这场战争也使清朝的权力格局发生变化，以曾国藩、李鸿章为代表的汉族地方督抚掌握了兵权和财权。
sources: []
recalled:
  - 罗尔纲《太平天国史》
  - 《李秀成自述》
  - 张德坚《贼情汇纂》
  - 王庆成《太平天国的历史和思想》
