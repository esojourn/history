name: 大卫定都耶路撒冷
summary: 大卫受膏作全以色列的王，攻取耶布斯人的锡安保障，定都耶路撒冷。
body: |-
  扫罗死后，大卫在希伯仑作犹大家的王，扫罗的儿子伊施波设在玛哈念作以色列其余各支派的王。据《撒母耳记下》第 3—4 章，扫罗家的元帅押尼珥和伊施波设先后被杀。以色列众支派的长老就到希伯仑来见大卫，大卫在耶和华面前与他们立约，他们膏大卫作以色列的王（5:1–3）。5:5 说，他在希伯仑作犹大王七年零六个月。

  耶路撒冷当时住着耶布斯人；《约书亚记》15:63 和《士师记》1:21 都提到以色列人没有能把他们赶出去。《撒母耳记下》5:6–9 记载，大卫和跟随他的人来到耶路撒冷，耶布斯人说，就是瞎子、瘸子也能把他挡在外面。大卫攻取了锡安的保障。5:8 提到攻城与“水沟”有关，这个词的确切含义没有定论。《历代志上》11:6 补充说，大卫曾宣布谁先攻打耶布斯人谁就作首领元帅，洗鲁雅的儿子约押先上去，就作了元帅。

  大卫住在保障里，给它起名叫大卫城，又从米罗以里周围筑墙；据《历代志上》11:8，城的其余部分由约押修理。推罗王希兰送来香柏木，并派木匠、石匠为大卫建造宫殿（撒下 5:11）。非利士人听说大卫受膏作以色列王，两次上来布散在利乏音谷，都被大卫击败（5:17–25）。

  《撒母耳记下》第 6 章记载，大卫随后把约柜运往耶路撒冷，中途因乌撒的死在俄别以东家里停放了三个月，然后迎入大卫城，安放在预备好的帐幕里。耶路撒冷从此成为王国的都城，也成为敬拜的中心；大卫在这里作王三十三年。论者常指出，这座城位于犹大与便雅悯的交界，此前不属于任何一个支派。本条的年份由大卫约公元前 1010 年登基、在希伯仑七年半推算而来，是约数。
sources: []
recalled:
