name: 临安投降
summary: 1276 年元军兵临临安，南宋谢太后和宋恭帝奉表投降，南宋朝廷灭亡。
body: |-
  至元十一年（公元 1274 年）元军在伯颜的统率下从襄阳东下，宋度宗在这一年去世，四岁的宋恭帝即位，太皇太后谢氏临朝。德祐元年（1275 年）二月，贾似道被迫亲自督师，在丁家洲（今安徽铜陵一带）与元军交战，宋军大败，主力尽失，贾似道被罢免，后在贬所途中被杀。元军随即攻下建康等地，同年冬天攻破坚守不降的常州，进行了屠城。

  德祐二年（1276 年）正月，元军进抵临安城北的皋亭山。南宋朝廷先派使者求和，元军不许。文天祥以右丞相的身份前往元营谈判，因言辞激烈被伯颜扣留。陆秀夫、张世杰等人护送益王赵昰、广王赵昺出城南逃。不久，谢太后派人奉传国玺和降表到元营，正式投降。二月元军入城，伯颜封存府库，收取南宋的图书、礼器和档案。三月，宋恭帝和他的母亲全太后等人被押往北方，谢太后因病稍后也被送到大都。宋恭帝到上都见了忽必烈，被封为瀛国公。

  临安投降标志着南宋朝廷的灭亡。此后张世杰、陆秀夫、文天祥等人在福建、广东一带拥立赵昰、赵昺，继续抵抗了三年，直到崖山海战失败（另见“崖山海战”条）。南宋从 1127 年宋高宗即位算起，到崖山海战为止，前后一百五十多年；临安投降后，南宋朝廷在名义上已经不复存在，各地仍有军民坚持抵抗。
sources: []
recalled:
  - 《宋史·瀛国公本纪》
  - 《元史·伯颜传》
  - 文天祥《指南录》
