name: 杯酒释兵权
summary: 961 年宋太祖在宴会上劝石守信等禁军大将交出兵权，是宋初收兵权的标志性事件。
body: |-
  赵匡胤本人是靠禁军将领的拥戴，通过陈桥兵变当上皇帝的。宋朝建立之初，禁军仍掌握在石守信、王审琦等与他一同起事的旧日同僚手中。据宋人记载，宰相赵普多次劝他早日解除这些人的兵权，说他们并非有异心，但如果部下贪图富贵，把黄袍加在他们身上，到那时就身不由己了。

  建隆二年（公元 961 年）七月，赵匡胤在宫中设宴招待石守信等人。据司马光《涑水记闻》等书，酒酣时他屏退左右，说自己做了皇帝，反而终夜不能安枕；众将惶恐，问他该怎么办，他劝大家多积金钱、多置田宅，为子孙留下产业，饮酒作乐以终天年，君臣之间就可以两无猜疑。次日，石守信等人都称病请求解除兵权，赵匡胤一一同意，让他们出任地方节度使，并与他们结为儿女亲家。

  这个故事最早见于北宋中期的丁谓《谈录》、王曾《王文正公笔录》等笔记，越往后记载越详细；李焘编《续资治通鉴长编》时采录了它，但在注中指出各书说法不一。现代有学者怀疑宴会情节是后人渲染的，不过宋初几年间禁军高级将领被陆续调离、殿前都点检等职位不再授人，则是确实的。开宝二年（969 年）赵匡胤又以类似的方式解除了王彦超等几位老节度使的兵权。

  此后宋朝把禁军的统领权分给殿前司、侍卫马军司、侍卫步军司（合称“三衙”），调兵之权归枢密院，二者互相制约；又陆续收回地方的财权和精兵，派文官担任知州。唐末五代武将跋扈、频繁篡位的局面由此结束，但也有人认为，宋代军队战斗力不强、对外屡屡失利，与这种重文抑武的制度有关。
sources: []
recalled:
  - 司马光《涑水记闻》卷一
  - 王曾《王文正公笔录》
  - 《续资治通鉴长编》卷二及李焘注
  - 《宋史·石守信传》
