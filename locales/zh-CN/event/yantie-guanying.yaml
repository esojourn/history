name: 盐铁官营与均输平准
summary: 汉武帝为筹措军费，把盐铁收归官营，统一铸钱，推行均输平准，并向商人征收财产税。
body: |-
  汉初允许民间煮盐、冶铁和铸钱，一些大商人和诸侯王因此积累了巨额财富。武帝连年对匈奴作战，又要安置降人、赈济灾民、迁民实边，文景两朝的积蓄很快用尽。《史记·平准书》说，当时大商人囤积居奇，却不肯出钱帮助国家应急。

  元狩四年（公元前 119 年）前后，朝廷采纳大农令属下的东郭咸阳、孔仅的方案，把煮盐和冶铁收归官营：盐由官府提供器具，募民煮制，官府收购专卖；铁器由官府设铁官铸造销售，私自铸铁煮盐的人处以重刑。各产地的盐铁官多由原来经营盐铁的富商担任。同时，朝廷向商人、手工业者和放贷者征收称为“算缗”的财产税，隐瞒不报的没收财产并罚戍边一年；后来又鼓励告发，告发者可得被没收财产的一半，称为“告缗”。《平准书》说，中等以上的商人大多因此破产，朝廷得到的财物以亿计。

  币制也在这时统一。元狩五年开始铸造五铢钱，元鼎四年（前 113 年）禁止各郡国铸钱，专由设在上林苑的三个官署铸造，旧钱一律销毁。五铢钱轻重适中，此后沿用了七百多年。

  元鼎二年（前 115 年）起，桑弘羊试行均输；元封元年（前 110 年）他主管大农后全面推行。均输是在各郡国设官，把当地应上缴的贡物按市价折成土产，运到缺少这些物产的地方出售；平准是在京师设官掌握各地运来的物资，贵时卖出、贱时买入，使商人无法牟取暴利。天汉三年（前 98 年）又实行酒类专卖。

  这些政策使朝廷有财力支撑战争，但官营的盐铁质量差而价格高，告缗使民间不敢积蓄。武帝死后，这些政策在盐铁会议上受到激烈批评，盐铁官营则一直延续到西汉末年，只在元帝时短暂废止。
sources: []
recalled:
  - 《史记·平准书》
  - 《汉书·食货志下》
