name: 桓温北伐
summary: 桓温十五年间三次北伐，先后进至长安城外、收复洛阳，最后在枋头败于前燕。
body: |-
  后赵崩溃时，东晋朝廷把北伐的任务交给殷浩，用意在于不让桓温立功。殷浩几年间屡战屡败，永和十年（公元 354 年）被桓温上表弹劾，废为庶人。同年二月，桓温亲率步骑四万从江陵出发，经襄阳北上，由武关进入关中，这是他的第一次北伐，对手是立国才三年的前秦。

  晋军在蓝田击败前秦太子苻苌等人率领的军队，推进到长安东面的灞上。前秦君主苻健带着老弱固守长安小城。据《晋书·桓温传》，关中百姓带着酒肉在路旁迎接，老人流着泪说没想到今天又见到官军。桓温没有立即攻城，本想靠关中的麦子补充军粮，前秦却抢先把麦子割光。晋军缺粮，又在白鹿原吃了败仗，六月撤退，途中受到追击，损失不小。隐居在华阴的王猛就是在这时到军营见桓温的。

  永和十二年（356 年）第二次北伐，目标是占据洛阳一带的羌人首领姚襄。桓温从江陵北上，在伊水北岸亲自披甲督战，大败姚襄，进入洛阳。他拜谒了西晋诸帝的陵墓，派人修复，留兵戍守后南归。他上表请求把都城迁回洛阳，并把永嘉以来南渡的人全部迁回北方，朝中大臣大多反对，事情没有实行。洛阳此后由晋军守了九年，兴宁三年（365 年）被前燕攻占。

  太和四年（369 年）第三次北伐，对手是前燕。桓温率步骑五万从姑孰出发，因天旱水道不通，开凿了三百里运河引汶水入清水，船队由此进入黄河。晋军进到枋头，前燕起用慕容垂迎战，又向前秦求救。桓温原指望打通睢水上的石门来运粮，负责此事的袁真没能办到。九月，晋军粮尽，烧掉船只和辎重从陆路撤退，慕容垂以八千骑兵尾随，在襄邑设伏夹击，据本传，晋军战死三万人。

  三次北伐都没有保住所得的土地。当时和后世的评论多认为，桓温北伐的用意一半在于借军功抬高自己的地位，所以临到决战往往持重不进；朝廷对他的猜忌和掣肘，也使他难以久驻北方。枋头战败两年后，他废立皇帝以重振威权。
sources: []
