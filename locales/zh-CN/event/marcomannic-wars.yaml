name: 马科曼尼战争
summary: 公元 166 至 180 年马可·奥勒留在多瑙河中游与马科曼尼人等部族连年作战。
body: |-
  二世纪中叶，北方更远处的部族向南移动，挤压着多瑙河对岸的各族。公元 166 年前后，伦巴第人等几千人渡河进入潘诺尼亚，被击退。此后马科曼尼人、夸迪人和平原上的萨尔马提亚人相继越界。罗马这时刚打完帕提亚战争，军中又有瘟疫。

  170 年前后，马科曼尼人和夸迪人击溃一支罗马军，翻过阿尔卑斯山东端，围攻阿奎莱亚，毁掉了附近的一座城。这是近三百年来第一次有外敌打进意大利。同时另一支部族一路南下，抢到雅典附近。马可·奥勒留新编了两个军团，在阿尔卑斯山口设防区。他从 171 年起常驻多瑙河前线，先逐出侵入的各部，再渡河进攻：172 年对马科曼尼人，173 至 174 年对夸迪人，175 年对萨尔马提亚人。

  对夸迪人作战时，一支被围在烈日下断了水的罗马军队遇上一场暴雨得救，雷电又击中敌军。罗马城里马可·奥勒留纪功柱的浮雕把这场雨刻成一位披着雨帘的神。卡西乌斯·狄奥把功劳归于随军的一位埃及术士；基督教作家德尔图良等人则说，是军中的基督徒士兵祷告求来的。

  175 年叙利亚总督卡西乌斯称帝，马可匆匆与萨尔马提亚人议和，赶往东方，叛乱几个月内自行瓦解。177 年战事再起，次年他带着儿子康茂德回到前线。179 年罗马军在今斯洛伐克境内过冬，那里的岩壁上留有驻军刻的铭文。《罗马帝王纪》说他打算在多瑙河以北设两个新行省。180 年 3 月 17 日他在军中去世，地点有文多博纳和西尔米乌姆两说。康茂德随即议和：各部族交还俘虏、提供兵员，在河岸让出一条空地，罗马军撤回南岸。

  他的《沉思录》有两卷的末尾注明写于“夸迪人中间”和“卡农图姆”。战争期间和战后，他把成批归降的蛮族安置在帝国境内的荒地上，这个做法为后来的皇帝所沿用。
