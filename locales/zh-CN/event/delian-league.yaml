name: 提洛同盟成立
summary: 公元前 478 年爱琴海各邦以雅典为首结盟抗击波斯，后来演变为雅典的帝国。
body: |-
  普拉提亚和米卡勒之后，希腊联军的舰队继续在爱琴海上作战。公元前 478 年统帅保萨尼阿斯在拜占庭举止专横，爱奥尼亚和各岛的城邦请雅典人出面领导。斯巴达另派的统帅不被接受，此后斯巴达不再派人，退出了海上的战事。

  前 478 年至前 477 年冬，各邦代表在爱琴海中央的提洛岛集会，那里是爱奥尼亚人共同祭祀阿波罗的圣地。据《雅典政制》和普鲁塔克，阿里斯提德代表雅典与各邦互相立誓，把铁块沉入海中，表示盟约在铁块浮起之前永远有效。修昔底德说同盟的公开目的是劫掠波斯国王的土地，以报复所受的损害。各邦或出战船，或缴纳钱款，数额由阿里斯提德核定，第一年共四百六十塔兰特；金库设在提洛岛，由雅典人担任的司库管理，同盟的会议也在岛上举行。

  同盟在客蒙统率下把波斯人逐出色雷斯沿海和小亚细亚南岸。越来越多的城邦宁愿交钱而不愿自己出船出人，雅典用这些钱扩充自己的舰队。约前 470 年纳克索斯岛想退出，被围攻迫降，修昔底德说这是第一个违反盟约而被奴役的盟邦；前 465 年塔索斯岛的遭遇相同。前 454 年金库迁到雅典，此后每年贡金的六十分之一献给雅典娜，记录这一份额的石碑有许多残片留存，是研究同盟的主要材料。

  到前 5 世纪中叶，仍然自己出船的只剩莱斯博斯、希俄斯和萨摩斯。雅典向一些盟邦派驻官员和驻军，把重大案件移到雅典审理，在没收的土地上安置雅典公民，并要求各邦使用雅典的度量衡和钱币。修昔底德笔下的雅典人自己也把这种统治称为“帝国”。前 404 年雅典战败，同盟解散。
