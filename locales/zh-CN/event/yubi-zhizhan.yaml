name: 玉壁之战
summary: 高欢率东魏大军围攻西魏玉壁城五十余天，被守将韦孝宽击退，撤军后不久病死。
body: |-
  玉壁城在汾水南岸，是西魏防御东魏的要塞，大统八年（公元 542 年）由王思政修筑，高欢当年就曾围攻未克。后来王思政调任，推荐韦孝宽接替镇守。

  大统十二年（546 年）九月，高欢倾东魏之力，亲率大军围攻玉壁。据《周书·韦孝宽传》，东魏军先截断城中取水的汾水通道，韦孝宽就在城内挖井；东魏军在城南堆筑土山，想居高攻城，韦孝宽在城楼上绑木加高，始终高过土山；东魏军挖掘地道，韦孝宽沿城挖长沟，发现地道就投进柴火、用皮排鼓风焚烧；东魏军用攻车撞城，韦孝宽用布缝成帐幔张开缓冲；东魏军用绑着松枝麻草的长竿放火，韦孝宽用装着利刃的长钩把竿头割断。东魏军又在城下挖了许多地道，用木柱支撑后放火焚烧，城墙崩塌，韦孝宽立起木栅堵住缺口。高欢派人劝降，韦孝宽回答说，我是关西男儿，决不做投降的将军。

  东魏军围攻五十多天，据《北齐书》，战死、病死的士卒有七万人，只得撤军。撤军途中，军中传言高欢中了弩箭，高欢勉强起身宴请诸将，命斛律金唱《敕勒歌》，自己相和，感伤流泪。次年正月，高欢在晋阳病死。
sources: []
recalled:
  - 《周书·韦孝宽传》
  - 《北齐书·神武帝纪》
  - 《资治通鉴》卷一百五十九
