name: 条顿堡森林战役
summary: 公元 9 年阿米尼乌斯在日耳曼尼亚设伏，歼灭瓦卢斯率领的三个罗马军团。
body: |-
  奥古斯都在位的中期，罗马军队越过莱茵河，一直推进到易北河，打算把两河之间的日耳曼尼亚变成行省。公元 7 年前后，瓦卢斯出任当地统帅，开始按行省的办法征税、审案。切鲁西人的贵族阿米尼乌斯在罗马军中服过役，深得瓦卢斯信任，暗中联络了各部族。

  公元 9 年秋，瓦卢斯带第十七、十八、十九三个军团和辅助部队从夏营返回莱茵河。阿米尼乌斯报告说远处有部族叛乱，诱他离开大路。据卡西乌斯·狄奥，队伍拖着辎重和家属走进林地和沼泽，又遇上暴雨，日耳曼人从四面袭击，一连打了三四天。瓦卢斯和高级军官见突围无望，先后自杀，全军覆没，三面鹰旗被夺走。阵亡的人数没有可靠的记载，现代学者估计在一万五千到两万之间。

  消息传到罗马，奥古斯都担心日耳曼人会乘势进攻高卢，在城里加派岗哨，苏维托尼乌斯说他几个月不剃须发。提比略赶到莱茵河稳住了防线。六年后日耳曼尼库斯重到战场，掩埋了遍地的白骨，塔西佗《编年史》卷 1 有一段描写。日耳曼尼库斯几次渡河报复，夺回两面鹰旗，但提比略在 16 年把他召回，罗马从此以莱茵河为界，不再图谋占领河东之地。

  战场的位置几百年里争论不休。1987 年，一名驻德英国军官用金属探测器在奥斯纳布吕克以北的卡尔克里泽发现大批罗马钱币，此后考古学家在那里发掘出兵器、甲胄残件和一段土垒，钱币的年代没有晚于公元 9 年的，多数学者认为这里是战斗的一处现场。莱茵河以东没有罗马化，后来的拉丁语系和日耳曼语系大体以此为界，这次战役常被看作其中一个原因。
sources: []
