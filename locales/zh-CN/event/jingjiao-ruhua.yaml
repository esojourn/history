name: 景教入华
summary: 635 年东方教会传教士阿罗本到达长安，基督教传入中国，唐人称为景教。
body: |-
  据唐德宗建中二年（公元 781 年）所立的《大秦景教流行中国碑》，贞观九年（635 年），大秦国的阿罗本带着经书和圣像来到长安，太宗派宰相房玄龄率仪仗到西郊迎接，请他在宫中翻译经书。贞观十二年（638 年）太宗下诏准许传教，在长安义宁坊建寺，度僧二十一人。这是基督教传入中国最早的可靠记载。

  唐人所说的景教，属于东方教会，它的神学与以弗所公会议（431 年）后被罗马、君士坦丁堡等地教会定为异端的聂斯脱利一派有渊源，主要在波斯一带传播，所以唐朝起初把它的寺院称为“波斯寺”，天宝四载（745 年）改称“大秦寺”。据碑文，高宗时景教在各州设寺，后来经历了起伏。

  会昌五年（845 年）唐武宗灭佛，景教和祆教、摩尼教一同遭到禁止，此后在中原基本消失，只在西北边地的一些民族中继续流传。这块石碑在明朝天启年间于西安一带出土，碑上刻有汉文和叙利亚文，引起了在华耶稣会士的重视，现藏于西安碑林博物馆。
sources: []
recalled:
  - 景净《大秦景教流行中国碑》
  - 《唐会要》卷四十九
  - 《新唐书·武宗纪》
