name: 泾原兵变
summary: 783 年泾原兵在长安哗变，唐德宗出逃奉天，朱泚称帝，次年李晟收复长安。
body: |-
  建中二年（公元 781 年）唐德宗拒绝成德节度使之子李惟岳承袭父职，河北、山东的藩镇联合抗命，次年朱滔、田悦、王武俊、李纳同时称王，淮西的李希烈也自称天下都元帅（另见“河朔三镇”条）。朝廷调集各地兵马讨伐，军费浩大，在长安向商人借钱，又加征房屋税和交易税，民怨沸腾。

  建中四年（783 年）十月，李希烈围攻襄城，德宗调泾原节度使姚令言率兵五千（据《资治通鉴》）东援。泾原兵路过长安时正值寒冬冒雨，京兆尹王翃只拿出粗饭菜犒军，士兵们大怒，冲进长安城，抢掠皇家的琼林、大盈两库。德宗召集禁军抵御，据《资治通鉴》，神策军的名册上多是挂名领饷的商贩子弟，竟无一人到来。德宗仓皇逃往奉天。乱兵拥立闲居长安的原幽州节度使朱泚为首领，朱泚随即称帝，国号大秦，并亲自率军围攻奉天，浑瑊等人坚守一个多月，朔方节度使李怀光带兵来援，奉天才得以解围。

  兴元元年（784 年）正月，德宗采纳陆贽的建议，下诏罪己，改元兴元，宣布赦免除朱泚以外的叛乱藩镇，王武俊、田悦、李纳等人随即取消王号，上表谢罪。二月李怀光又与朱泚勾结反叛，德宗再逃到梁州。五月神策军将领李晟攻入长安，朱泚西逃途中被部下所杀，七月德宗回到长安。贞元元年（785 年）李怀光兵败自杀，次年李希烈被部将毒死，这场持续数年的变乱才告平息。

  这次变乱后，德宗不再信任武将，把神策军交给宦官统领（另见“宦官掌神策军”条），对藩镇也转为姑息，唐朝中央与藩镇之间维持了一种互相妥协的局面。
sources: []
recalled:
  - 《旧唐书·德宗纪》
  - 陆贽《奉天改元大赦制》
  - 《资治通鉴》卷二百二十八至二百三十一
