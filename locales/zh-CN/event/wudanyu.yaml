name: 五单于争立
summary: 匈奴贵族争位，五位单于同时并立，混战之后分裂为呼韩邪、郅支两部。
body: |-
  汉武帝以后，匈奴连年受汉朝和乌孙的打击，又屡遭风雪灾害，属下的丁令、乌桓等部族相继反叛，国力大衰。据《汉书·匈奴传》，公元前 60 年虚闾权渠单于去世，掌权的阏氏与贵族没有立他的儿子，而立了握衍朐鞮单于。新单于上台后杀戮前任的亲信，各部离心，统领西域的日逐王就在这时投降了汉朝。

  前 58 年，东部的贵族拥立虚闾权渠的儿子稽侯狦为呼韩邪单于，握衍朐鞮兵败自杀。但握衍朐鞮一方的贵族另立了屠耆单于，把呼韩邪赶出王庭。次年，西部和北部的三位贵族也各自称单于，于是出现了呼韩邪、屠耆、呼揭、车犁、乌藉五位单于并立的局面。《匈奴传》说，各方互相攻杀，死者数以万计，牲畜损失十之八九，百姓饥饿。

  经过一年多的混战，屠耆单于兵败自杀，其余几位或取消称号，或归附呼韩邪。就在呼韩邪回到王庭的时候，他的哥哥呼屠吾斯在东部自立为郅支单于，并于前 54 年把他击败。呼韩邪转而南下向汉朝称臣，郅支后来西迁，匈奴分裂为两部。
sources: []
recalled:
  - 《汉书·匈奴传上》
  - 《汉书·匈奴传下》
