name: 阪泉之战
summary: 传说中黄帝与炎帝在阪泉之野的战争，三战之后黄帝获胜。
body: |-
  阪泉之战是传说时代的事，只见于后世古书。据《史记·五帝本纪》，轩辕的时候神农氏衰微，诸侯相互侵伐，炎帝又想侵陵诸侯，诸侯都归附轩辕。轩辕于是修德整兵，“治五气，艺五种”，训练熊、罴、貔、貅、䝙、虎（一般理解为以这些动物为名号的部族或军队），与炎帝战于阪泉之野，“三战，然后得其志”。

  《大戴礼记·五帝德》等书也提到这次战争，细节不尽相同。阪泉的地望有今河北涿鹿、山西运城、北京延庆等不同说法。

  后人一般把阪泉之战理解为黄帝部族与炎帝部族的融合，此后又有涿鹿之战。这些都是战国秦汉人整理的传说，不能当作信史。
sources: []
recalled:
  - 《史记·五帝本纪》
  - 《大戴礼记·五帝德》
