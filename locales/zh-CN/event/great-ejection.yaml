name: "1662 年统一法与大逐出"
summary: "复辟后国会立统一法，约二千名不肯遵用公祷书的牧师被逐出英国教会。"
body: |-
  《历史的轨迹》第三十一章说，1660 年王政复辟，1662 年 5 月已是安立甘派占绝对优势的国会通过新的统一法，把公祷书修改了六百处之多，目的在于摆脱清教徒主义，并宣告除修订本外不许用任何崇拜仪式；约二千名长老派教牧人员因拒绝接受被免职，过着穷苦的生活。书中把这本书写成“崇拜指南（或称公祷书）”，实际修订的是公祷书；被逐出的人也不全是长老派，也有公理派和其他人。法令以 1662 年 8 月 24 日圣巴多罗买日为限，人称“黑色巴多罗买日”。

  该书说，逼迫的结果使清教徒不得不脱离英国教会：他们原想留在教会中从内部改革，现在被迫站到分离派的立场，也成了“不同意者”。据一般记载，此后几年国会又通过一系列法令，限制不从国教者聚会、禁止被逐牧师住在城镇五英里以内。本仁约翰就是在这期间坐了十二年牢。苏格兰的立约派同样受到追捕。直到 1689 年信仰容忍法案，这些人才可以公开聚会。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
