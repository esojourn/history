name: 尼西亚会议
aliases:
  - 第一次尼西亚公会议
  - 第一次大公会议
summary: 公元 325 年君士坦丁召集的第一次大公会议，定亚流为异端，宣告圣子与圣父同质。
body: |-
  亚历山大的长老亚流主张圣子是受造的，约从公元 318 年起与本城主教亚历山大争执，各地主教分成两派。324 年君士坦丁成为全帝国的皇帝，先派西班牙科尔多瓦的主教何西乌去调解，没有成功，于是召集各地主教开会，路费由国家负担。

  会议于公元 325 年初夏在小亚细亚的尼西亚开幕，会场设在皇帝的行宫。到会主教的人数，在场的优西比乌说有二百五十多位，后来通行的说法是三百一十八位，《历史的轨迹》第五章作三百多位。绝大多数来自东方，罗马主教年老未到，派了两位长老作代表。不少人身上带着大逼迫时受刑留下的伤残。皇帝亲临开幕并致辞。亚他那修当时是执事，随亚历山大出席。

  会议否定了亚流的主张，采用了一篇信经，其中说圣子“从父的本质所生，从神出来的神，从光出来的光，从真神出来的真神，是生的，不是造的，与父同质”，末尾咒诅“曾有一个时候还没有他”等说法。“同质”一词不见于圣经，据优西比乌说是皇帝提议加进去的。只有两位利比亚主教拒绝签字，与亚流一同被流放。

  会议还定了全教会在同一个星期日守复活节，并通过二十条教规，其中第 6 条承认亚历山大、安提阿和罗马的主教各自对周围省份有传统的管辖权。

  《历史的轨迹》说，尼西亚信经是第一个写成文字、作为全体教会信仰根据的信经，教会又经过六七十年的挣扎才完全接纳这次会议的决定。会后不久亚流派重新得势，亚他那修屡遭放逐。今天礼拜中所用的“尼西亚信经”是 381 年君士坦丁堡会议扩充的文本。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
recalled:
  - 优西比乌《君士坦丁传》卷 3 第 6—14 章
  - 亚他那修《论尼西亚会议的决议》
  - 苏格拉底《教会史》卷 1 第 8—9 章
  - 尼西亚会议教规第 6 条
