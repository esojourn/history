name: 罗马宣教团到英格兰
aliases:
  - 贵格利宣教团
summary: 公元 597 年教皇大贵格利差派的修士抵达肯特，罗马教会在英格兰的传道由此开始。
body: |-
  罗马统治时期的不列颠已有基督徒。五世纪盎格鲁人、撒克逊人渡海而来，占了岛的东部和南部，他们信奉自己的诸神，原有的不列颠基督徒退到西部山地。《历史的轨迹》第七章说，这些征服者除灭了岛上基督教的痕迹；实际上西部的教会一直存在，北方又有从爱尔兰来的修士，只是他们没有向入侵者传道。

  公元 596 年，教皇大贵格利从自己在罗马创办的圣安德烈修道院选了约四十名修士，由院长率领前往英格兰。比德在《英吉利教会史》里记了一个流传的故事，说贵格利早年在罗马市场上见过盎格鲁少年奴隶，从此有心向这个民族传道。修士们走到高卢南部就想打退堂鼓，贵格利写信叫他们继续走，又写信请沿途的法兰克主教和君主照应。

  公元 597 年春，他们在肯特的萨尼特岛登陆。肯特王艾塞尔伯特是当时英格兰南部最有势力的王，王后伯莎是法兰克公主、基督徒，身边带着一位主教。比德说，国王怕中了法术，特意在露天接见修士；听完之后说，这些话很好，但他不能立刻丢下祖传的信仰，不过允许他们在都城坎特伯雷居住、传道。修士们用城外一座罗马时代留下的教堂聚会。国王不久受洗；贵格利 598 年的一封信里说，前一年圣诞节有一万多英格兰人受洗。

  公元 601 年贵格利派来第二批人，带来书籍、圣器和给大主教的披肩，并定下在伦敦和约克各设大主教、下辖十二位主教的计划；实际上南方的大主教座一直留在坎特伯雷。他还指示，不要拆毁异教的庙宇，除去偶像、洒上圣水后改作教堂，旧有的节庆可以换成纪念殉道者的筵席。

  这次传道在肯特以外进展很慢，几位国王死后还出现过反复。英格兰北部主要是由爱奥那来的爱尔兰修士带领归信的；两个传统在 664 年的惠特比会议上并到罗马的做法之下。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 比德《英吉利教会史》卷 1 第 23—33 章、卷 2 第 1 章
  - 大贵格利《书信集》卷 6 第 51—59 封、卷 8 第 30 封、卷 11 第 56 封
