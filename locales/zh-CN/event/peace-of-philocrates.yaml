name: 菲洛克拉底和约
summary: 公元前 346 年雅典与马其顿的腓力二世议和结盟，和约随即成为雅典政争的焦点。
body: |-
  雅典与腓力二世自公元前 357 年他夺取安菲波利斯起就处于交战状态。十年间雅典丢掉了北方沿海的据点，前 348 年又没能救下奥林托斯，城中还有不少雅典人被俘。腓力多次表示愿意讲和。前 346 年初，公民大会依菲洛克拉底的提议派出十名使节前往佩拉，其中有菲洛克拉底、埃斯基涅斯和德摩斯梯尼。

  使团带回了腓力的条件，马其顿的使者安提帕特和帕曼纽随后来到雅典。公民大会讨论两天后接受：双方各保有现有的土地，这意味着雅典放弃安菲波利斯；雅典及其同盟与腓力及其盟友之间既讲和又结盟。雅典的盟友福基斯人没有被列入。和约以提议人的名字相称。

  同一批使节第二次北上，去接受腓力的宣誓。腓力当时在色雷斯用兵，使团在佩拉等了很久，他趁这段时间又占了色雷斯沿海的几处地方。宣誓之后，他立即率军通过温泉关，福基斯投降，延续十年的神圣战争结束。雅典人原以为腓力会善待福基斯、压制底比斯，结果正相反。

  雅典人对和约大为失望。德摩斯梯尼转而指责同僚受了腓力的贿赂，埃斯基涅斯则为和约辩护。前 343 年许佩里德斯控告菲洛克拉底，后者不等审判就逃亡，被缺席判处死刑；同年德摩斯梯尼控告埃斯基涅斯出使渎职，后者勉强获判无罪。两人为这次出使各写的演说都保存了下来，说法处处相反，是了解此事的主要材料，也都不能照单全收。腓力曾提议修改和约，没有谈成。前 340 年他围攻拜占庭并扣押雅典的运粮船，雅典人推倒了刻有和约的石碑。
