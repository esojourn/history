name: 阿德里安堡战役
aliases:
  - 亚得里亚堡之役
  - 哈德良堡战役
summary: 公元 378 年哥特人在阿德里安堡大败罗马军，皇帝阵亡。
body: |-
  公元 376 年，西哥特人被西进的匈人逼到多瑙河北岸，请求渡河到帝国境内安身。东部皇帝瓦伦斯同意了，指望他们为帝国当兵、种地。《历史的轨迹》第七章把这次渡河作为蛮族进入罗马帝国的开端。负责安置的罗马官员克扣粮食，阿米阿努斯说，饥饿的哥特人不得不拿儿女去换狗肉。第二年他们在首领弗里蒂格恩率领下起事，一部分东哥特人和别的部族也过了河，色雷斯全境遭到劫掠。

  公元 378 年，瓦伦斯从东方前线调回主力，西部皇帝格拉提安也带兵东来会合。瓦伦斯听信了哥特人只有一万人的情报，又不愿与侄子分享战功，没有等援军到达。8 月 9 日，他率军从阿德里安堡出发，在烈日下行军半日，到哥特人的车阵前仓促开战。外出搜粮的哥特骑兵恰好赶回，从侧面冲垮了罗马军的左翼，步兵被挤成一团，无法施展。

  阿米阿努斯说，罗马军损失了约三分之二，瓦伦斯本人战死，尸体没有找到；一种说法是他中箭后被抬进一间农舍，被哥特人连屋烧死。阿米阿努斯把这场败仗与坎尼之败相比。

  第二年狄奥多西被立为东部皇帝，花了几年收拾局面，382 年与哥特人订约，让他们保留自己的首领，整体在帝国境内定居。此后帝国境内第一次有了一个不受罗马官员管辖的武装民族。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 阿米阿努斯《历史》卷 31 第 4—13 章
  - 奥罗修《反异教史》卷 7 第 33 章
