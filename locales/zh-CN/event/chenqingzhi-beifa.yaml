name: 陈庆之入洛
summary: 梁将陈庆之率数千白袍军护送元颢北上，连战连胜攻入洛阳，两个月后兵败而回。
body: |-
  河阴之变后，北魏的北海王元颢投奔梁朝。大通二年（公元 528 年）十月，梁武帝立元颢为魏王，派陈庆之率兵护送他北归，据《梁书·陈庆之传》，兵力只有七千人。

  次年四月，梁军攻克铚城，进至睢阳，元颢在睢阳称帝。五月，梁军进攻荥阳，北魏守将杨昱坚守，上党王元天穆又率大军来援，形势危急。陈庆之激励士卒，一鼓攻克荥阳，又出城击败元天穆的援军，随后攻下虎牢。北魏孝庄帝渡过黄河北逃，元颢进入洛阳。据《梁书》，梁军自铚县出发到洛阳，用了一百四十天，攻下三十二城，打了四十七仗，全都获胜，梁军都穿白袍，洛阳流传童谣“名师大将莫自牢，千兵万马避白袍”。这些数字出自梁朝一方的记载，有学者认为有所夸大。

  元颢进入洛阳后骄纵自大，与陈庆之互相猜忌，不让梁朝增派援兵。闰六月，尔朱荣奉孝庄帝南下反攻，乘夜渡过黄河，元颢兵败出逃，被杀。陈庆之率部撤退，途中遇到山洪，军队溃散，他剃去头发扮成僧人，才逃回梁朝。这次北伐虽然最终失败，陈庆之的白袍军却从此名声大振。
sources: []
recalled:
  - 《梁书·陈庆之传》
  - 《魏书·元颢传》
  - 《资治通鉴》卷一百五十三
