name: 曼提尼亚战役
summary: 公元前 362 年底比斯军在曼提尼亚击败斯巴达等邦联军，伊巴密浓达阵亡。
body: |-
  伊巴密浓达扶植起来的阿卡迪亚同盟在几年后分裂。以曼提尼亚为首的一派不愿受底比斯支配，转而与昔日的敌人斯巴达以及埃利斯、亚该亚、雅典结盟；以泰耶阿和麦加洛波利斯为首的一派仍靠底比斯。公元前 362 年，伊巴密浓达第四次率军进入伯罗奔尼撒，同行的有优卑亚人、色萨利人等，在泰耶阿与阿尔戈斯、美塞尼和阿卡迪亚的盟军会合。

  他得知斯巴达军已由阿格西劳斯二世率领北上，便夜间急行军直扑空虚的斯巴达城。一名克里特人跑去报信，阿格西劳斯赶回，在街巷里把他挡住。他又派骑兵去袭击正在城外收割的曼提尼亚人，恰好遇上刚到的雅典骑兵，也被击退。出征的期限将满，他决定会战。

  战场在曼提尼亚以南的平原。他先摆出要扎营的样子，使对方松懈下来，然后突然进攻。战法与留克特拉相同：左翼是加厚的彼奥提亚步兵纵队，前面配置同样排成楔形的骑兵和夹在骑兵中间的轻装兵，其余部队后撤。这一翼冲垮了对面的曼提尼亚人和斯巴达人。伊巴密浓达在追击时胸部被长矛刺中，矛杆折断，矛头留在体内。他被抬到高处，得知己方获胜、自己的盾牌尚在之后，让人拔出矛头而死。相传他临终劝底比斯人议和。刺中他的人是谁，斯巴达人、雅典人和曼提尼亚人各有说法；雅典人说是色诺芬之子格吕洛斯，他本人也在这一战中阵亡。

  统帅一倒，底比斯军没有继续追击，两军各自在战场的一边立了胜利纪念柱，又都请求对方停战收尸。色诺芬以此结束他的《希腊史》，说人人都以为这一战之后胜者将统治希腊，结果是双方都说自己赢了，谁也没有多得一寸土地，希腊比战前更加混乱。

  战后各邦订立共同和约，只有斯巴达因不承认美塞尼而拒绝参加。底比斯两年前已失去佩洛皮达斯，此后再没有出色的统帅。三年后腓力二世在马其顿即位。
sources: []
recalled:
