name: 普珥节的由来
summary: 波斯的犹太人免于哈曼所谋的灭绝，定每年亚达月守普珥节。
body: |-
  《以斯帖记》记，亚哈随鲁王第十二年正月，大臣亚甲族人哈曼因末底改不向他跪拜，要灭绝国中所有的犹太人。人在他面前掣签，就是掣“普珥”，择定了十二月即亚达月；他求得王旨，定在亚达月十三日动手（3:7–13）。

  王后以斯帖冒险进见，在筵席上揭出哈曼的图谋，哈曼被挂在木架上。先前的谕旨不能收回，末底改奉王命另发谕旨，准许犹太人在那一天聚集保命（第 8 章）。到了亚达月十三日，犹太人击杀仇敌；据 9:16，各省共杀七万五千人，却没有下手夺取财物。书珊城的犹太人十四日又争战一天。

  末底改和以斯帖写信给各省的犹太人，嘱咐每年守亚达月十四、十五两日为设筵欢乐的日子，彼此馈送礼物，周济穷人，并因“普珥”这个词称这两日为普珥节（9:20–32）。犹太人至今守这节，并在节期诵读《以斯帖记》。书中的亚哈随鲁一般认为是薛西斯一世，其第十二年约当公元前 474—前 473 年；圣经以外的史料中没有与此相应的记载，这卷书的历史性学界有不同看法。
sources: []
recalled:
  - 《以斯帖记》第 3—9 章
