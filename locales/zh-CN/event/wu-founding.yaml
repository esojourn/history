name: 孙权称帝
summary: 公元 229 年孙权在武昌称帝，国号吴，同年迁都建业。
body: |-
  曹丕、刘备相继称帝时，孙权的名号还是魏所封的吴王。公元 222 年夷陵之战后，他不肯按曹丕的要求送儿子去做人质，双方破裂，于是自立年号为黄武，但仍未称帝。此后他与蜀汉恢复同盟，并几次击退魏军的进攻。

  据《三国志·吴书·吴主传》，黄武八年（229 年）春，各地报告有黄龙、凤凰出现，公卿百官劝孙权即帝位。四月，他在武昌南郊即皇帝位，改年号为黄龙，追尊父亲孙坚为武烈皇帝，兄长孙策为长沙桓王，立儿子孙登为皇太子。国号为吴，后世为与其他以吴为名的政权区别，称之为孙吴或东吴。

  消息传到蜀汉，不少大臣认为孙权称帝是僭越，应当断绝往来。诸葛亮认为眼下需要吴国牵制魏国，不宜因名分而失去盟友，派陈震前往祝贺。两国订立盟约，约定灭魏之后平分其地。

  同年九月，孙权把都城从武昌迁回建业，留太子孙登和上大将军陆逊镇守武昌。建业就是今天的南京，这是它第一次成为一个王朝的都城，此后东晋和南朝的宋、齐、梁、陈都在此建都。吴国自孙权称帝起共传四帝，公元 280 年为晋所灭。
sources: []
recalled:
  - 《三国志·吴书·吴主传》
  - 《三国志·蜀书·诸葛亮传》裴松之注引《汉晋春秋》
