name: 晋阳起兵与唐朝建立
summary: 617 年李渊在晋阳起兵，入关攻占长安，次年隋炀帝被杀后受禅称帝，建立唐朝。
body: |-
  隋末民变四起，各地官员纷纷拥兵自立。大业十三年（公元 617 年），太原留守李渊在晋阳起兵。据唐初官修的史书，起兵是次子李世民与晋阳令刘文静、晋阳宫监裴寂等人谋划，再劝说李渊同意的；而温大雅所写的《大唐创业起居注》则显示李渊本人早有准备。近代学者多认为唐初史书夸大了李世民的作用。

  五月，李渊以谋反为名杀死炀帝派来监视他的副留守王威、高君雅，正式起兵。为了避免后方受到东突厥的威胁，他派刘文静向始毕可汗称臣，借得少量突厥骑兵和马匹。他以长子李建成、次子李世民分统左右军，留第四子李元吉镇守太原，七月率军南下。当时连续下雨，粮草不继，军中有人主张退回太原，后来天晴，八月在霍邑击斩隋将宋老生，随后渡过黄河进入关中。

  关中各地的豪强和起事队伍纷纷归附，李渊的女儿平阳公主也在关中聚众响应，所部号称“娘子军”。十一月唐军攻克长安，李渊与百姓约法十二条，拥立炀帝的孙子代王杨侑为帝，即隋恭帝，遥尊炀帝为太上皇，自己任大丞相，进封唐王。

  大业十四年（618 年）三月炀帝在江都被杀，五月李渊接受杨侑禅位，即皇帝位，国号唐，定都长安，年号武德，立李建成为太子，李世民为秦王，李元吉为齐王。此后唐朝用了七八年时间平定各地割据势力，统一全国。唐朝前后共二百八十九年，至天祐四年（907 年）被朱全忠所灭。
sources: []
recalled:
  - 温大雅《大唐创业起居注》
  - 《旧唐书·高祖纪》
  - 《新唐书·高祖纪》
  - 《资治通鉴》卷一百八十三至一百八十五
