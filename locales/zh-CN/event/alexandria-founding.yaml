name: 亚历山大城的建立
summary: 公元前 331 年亚历山大在尼罗河三角洲西端建城，后为托勒密王朝都城。
body: |-
  公元前 332 年冬，亚历山大攻下迦萨后进入埃及。波斯总督没有兵力，献出了孟菲斯。埃及人在十年前才被波斯重新征服，对新来者并无敌意；亚历山大在孟菲斯向埃及的神献祭，被当作法老接纳。

  他从孟菲斯顺尼罗河西面的支流而下，到了马瑞奥提斯湖与地中海之间的一条狭长陆地，海上有法罗斯岛作屏障，岛后可以停泊船只。这里原有一个叫拉科提斯的埃及村落。据阿里安，他认为此地最宜建城，并亲自划定市场、神庙和城墙的位置。普鲁塔克讲了一个故事：他梦见一位老人吟诵荷马诗中关于法罗斯岛的句子，因此选了这里；又说划线时没有白垩，用大麦粉代替，成群的鸟飞来把麦粉吃光，他很不安，占卜者说这预示此城将养活各方的人。负责规划的是罗得岛的建筑师狄诺克拉特斯，街道取方格布局。建城的日子，后世的亚历山大城人定在埃及历的图比月二十五日，相当于前 331 年 4 月 7 日；现代学者认为大约在这一年的年初。

  他还由此西行，沿海岸走到帕莱托尼翁，再向南穿过沙漠到锡瓦绿洲，求问那里的阿蒙神谕。据阿里安，他听到了“合他心意”的回答，内容没有公开；卡利斯提尼等人说祭司称他为宙斯之子。去锡瓦是在建城之前还是之后，阿里安和别的作家说法相反。春天他离开埃及，再没有回来，把建城和财政交给瑙克拉提斯人克列奥美涅斯。

  亚历山大死后，托勒密得到埃及，把他的遗体迎来安葬，并把都城从孟菲斯迁到这里。此后的托勒密诸王修建了王宫、博学园和图书馆，法罗斯岛上的大灯塔约在前 280 年建成，被列为古代世界的奇观之一。城中居民分为希腊人、埃及人和为数很多的犹太人，希伯来圣经的希腊文译本即产生于此。到公元前后，它是地中海世界仅次于罗马的大城，也是后来早期基督教的中心之一。亚历山大的陵墓古代有许多人瞻仰过，位置今已不明。
