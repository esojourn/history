name: 南越立国
summary: 秦亡之际赵佗据南海郡，攻并桂林、象郡，自立为南越武王。
body: |-
  秦在岭南设南海、桂林、象三郡。据《史记·南越列传》，秦二世时南海尉任嚣病重，听说陈胜等起兵，认为南海僻远，番禺背山面海，“东西数千里”，可以立国，便召来龙川令赵佗，让他代行南海尉事。

  任嚣死后，赵佗向横浦、阳山、湟谿三关传檄，声称盗兵将至，命令断绝通道、聚兵自守，又借法令逐步诛除秦朝所置的官吏，以自己的党羽代理。秦灭亡后，赵佗出兵攻并桂林、象郡，自立为南越武王，以番禺（今广州）为中心。

  立国的年份《史记》《汉书》都没有明写。《史记》说南越“五世九十三岁而国亡”，从元鼎六年（公元前 111 年）上推，今人多定在前 204 年或前 203 年；越南《大越史记全书》系于前 207 年。汉高祖平定天下后没有出兵征讨，前 196 年遣陆贾立赵佗为南越王。
sources:
  - 《史记·南越列传》 https://zh.wikisource.org/wiki/史記/卷113
  - 《汉书·西南夷两粤朝鲜传》 https://zh.wikisource.org/wiki/漢書/卷095
  - 《大越史记全书·外纪》卷二《赵氏纪》 https://zh.wikisource.org/wiki/大越史記全書/外紀卷之二
  - 维基百科“赵佗”“南越国”条（立国年份诸说） https://zh.wikipedia.org/wiki/南越国
