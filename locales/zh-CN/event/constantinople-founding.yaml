name: 君士坦丁堡建都
summary: 公元 330 年君士坦丁把扩建后的拜占庭定为新都，命名君士坦丁堡。
body: |-
  拜占庭是公元前七世纪希腊人在博斯普鲁斯海峡欧洲一侧建的殖民城，三面环水，扼守黑海与地中海之间的水道，也在多瑙河防线与东方前线之间的陆路上。324 年 9 月，君士坦丁在海峡对岸的克里索波利斯击败李锡尼，成为帝国唯一的皇帝。当年 11 月他就在拜占庭划定了新城的范围。后来的作家说，他曾考虑过特洛伊旧址、塞尔迪卡等地方。

  工程进行了五年多。新的陆上城墙比旧城向西推出约三公里，城区扩大了几倍。城中修了皇宫、元老院和以他的名字命名的圆形广场，广场中央的斑岩石柱顶上立着他的雕像；原有的赛车场加以扩建，与皇宫相通。为了装点新都，各地的雕像被大批搬来，德尔斐为纪念普拉提亚之战所立的青铜蛇柱至今还在赛车场的旧址上。哲罗姆在《编年史》里写道，君士坦丁堡落成，别的城市几乎都被剥光了。他也建了教堂，其中使徒教堂是他给自己预备的墓地；城里原有的神庙没有拆。

  330 年 5 月 11 日举行落成典礼，此后每年这一天都在赛车场庆祝。城的正式名称是“君士坦丁堡”，也称“新罗马”。他用免税、赠地和发放口粮吸引人迁居：从 332 年起，埃及的粮船改道驶向这里，每天按八万份发放面包。新设的元老院起初品级低于罗马的元老院，到他儿子手里才提到同等。

  这座城的位置易守难攻。五世纪初狄奥多西二世时又在更西处修了三重城墙，此后一千年里它只在 1204 年被十字军攻破过一次。城内人口到五世纪已有几十万。395 年帝国东西分治后，它是东部的都城；西部灭亡以后，以它为中心的国家又延续了近千年，后世称为拜占庭帝国，直到 1453 年为奥斯曼人所灭。帝国的重心移到讲希腊语的东方，罗马城里的主教则在没有皇帝的环境里逐渐成为西方的权威，这些都与建都有关。
