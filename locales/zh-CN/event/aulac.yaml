name: 南越兼并瓯雒
summary: 南越王赵佗使西瓯、骆归附，相传攻灭安阳王；年代有两说。
body: |-
  《史记·南越列传》的记载很简略：吕后死后（公元前 180 年）汉军罢兵，赵佗“以兵威边，财物赂遗闽越、西瓯、骆，役属焉”，没有提到安阳王。今人多据此把南越取得瓯雒之地定在前 179 年前后。

  细节见于较晚的记载。《水经注》引《交州外域记》说，南越王尉佗攻安阳王，起初被神弩所阻，后来派太子始前去称臣，始与安阳王之女媚珠相通，锯断神弩，南越再进兵，安阳王战败入海；其后南越派两名使者管理交趾、九真二郡。越南《大越史记全书》情节相近，但把安阳王败亡系于前 208 年。神弩之说属于传说，两种年代孰是，史料不足以断定。
sources:
  - 《史记·南越列传》 https://zh.wikisource.org/wiki/史記/卷113
  - 《水经注》卷三十七引《交州外域记》 https://zh.wikisource.org/wiki/水經注/37
  - 《大越史记全书·外纪》卷一《蜀纪》 https://zh.wikisource.org/wiki/大越史記全書/外紀卷之一
