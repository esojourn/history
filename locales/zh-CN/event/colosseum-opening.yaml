name: 斗兽场落成
summary: 公元 80 年提图斯为弗拉维圆形剧场举行落成典礼，连续表演一百天。
body: |-
  尼禄在大火之后把罗马市中心的大片土地圈进自己的“金宫”，中间挖了一个人工湖。韦斯巴芗即位后把这片地方还给公众，约在公元 70 至 72 年间排干湖水，在原址动工修建一座石砌的圆形剧场。此前罗马城里的角斗表演多在临时搭建的木场或广场上举行。根据场内一块石头上残留的钉孔，学者复原出一行原先的铜字铭文，说这座新剧场是皇帝用战利品修建的，一般认为指的是耶路撒冷之役所得。

  韦斯巴芗在世时修到第三层。公元 80 年，他的儿子提图斯举行落成典礼，表演持续一百天。卡西乌斯·狄奥说其间杀死各种动物九千头，还说场内灌水演了海战；诗人马提亚尔为这次盛会写了一卷短诗。图密善在位时又加修了最上面一层和场地下面的通道、兽笼与升降设施。当时它的名字是“弗拉维圆形剧场”；“斗兽场”所本的那个名称要到中世纪才出现，一般认为得自旁边那尊原属尼禄的巨像。

  建筑平面为椭圆形，长轴约一百八十八米，短轴约一百五十六米，外墙高约四十八米，下面三层各有八十个拱门，自下而上依次用多立克式、爱奥尼亚式、科林斯式半柱装饰。主体用石灰华、凝灰岩、砖和混凝土砌成。观众按身份分区就座，元老在最下层，妇女和贫民在最高处，凭编号的入口进出，全场可容五万人上下。顶上可以张开帆布遮阳，由舰队的水兵操作。

  场内的节目有猎兽、处决犯人和角斗士对战，费用出自皇帝或官员。角斗表演在五世纪前期停止，猎兽一直延续到 523 年前后。中世纪这里做过堡垒和采石场，现存的外墙只剩北面一半。
sources: []
recalled:
  - 卡西乌斯·狄奥《罗马史》卷 66 第 25 章
  - 苏维托尼乌斯《罗马十二帝王传·韦斯巴芗传》第 9 章、《提图斯传》第 7 章
  - 马提亚尔《观演集》
  - 斗兽场出土铭文（《拉丁铭文集成》卷 6 第 40454a 号）
