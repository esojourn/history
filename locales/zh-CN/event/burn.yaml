name: 焚书坑儒
summary: 秦始皇下令焚烧民间所藏《诗》《书》、百家语，次年在咸阳坑杀诸生。
body: |-
  据《史记·秦始皇本纪》，始皇三十四年（公元前 213 年）在咸阳宫置酒，博士淳于越进言，认为不封子弟功臣、事不师古难以长久。丞相李斯反驳，说诸生“不师今而学古”，以私学非议朝政，建议：史官所藏非秦国的史记都烧掉；除博士官所掌之外，民间所藏《诗》《书》、百家语一律交郡守、郡尉烧毁；敢聚谈《诗》《书》的处死，以古非今的灭族；医药、卜筮、种树之书不在此列；想学法令的以吏为师。始皇批准施行。

  次年（前 212 年），为始皇求仙药的方士侯生、卢生私下议论始皇后逃走。始皇大怒，命御史审问在咸阳的诸生，诸生互相告发，认定犯禁者四百六十余人，全部在咸阳坑杀。长子扶苏劝谏，被派往上郡监蒙恬军。

  被坑者的身份历来有不同说法：《本纪》称“诸生”，扶苏谏语说他们“皆诵法孔子”，而事情起于方士，后人或认为所坑多为术士。“坑儒”的提法出自汉代以后。
sources:
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
  - 《史记·李斯列传》 https://zh.wikisource.org/wiki/史記/卷087
  - 《史记·儒林列传》（“焚诗书，坑术士”） https://zh.wikisource.org/wiki/史記/卷121
