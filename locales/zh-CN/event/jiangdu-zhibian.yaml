name: 江都之变
summary: 618 年三月，随隋炀帝留在江都的骁果军发动兵变，推宇文化及为首，缢杀隋炀帝。
body: |-
  大业十二年（公元 616 年）隋炀帝第三次南下江都，此后中原和关中局势急剧恶化，李密围攻东都，李渊攻占长安，炀帝不敢北返，据《资治通鉴》，他还打算迁都丹阳，留在江南。随驾的禁卫军“骁果”大多是关中人，久居江都，思念家乡，逃亡的人越来越多。

  大业十四年（618 年）三月，虎贲郎将司马德戡、直阁裴虔通等人谋划率骁果西归，后来改为发动兵变，推宇文述的儿子宇文化及为首领。兵变的士兵冲入宫中，据《隋书》，炀帝说天子死自有天子的死法，怎么能用刀刃，要求饮毒酒，叛军不许，用他自己的练巾把他缢死，时年五十。萧皇后和宫人拆下床板做成小棺，把他草草埋葬。炀帝的儿子赵王杨杲以及在江都的宗室、外戚和大臣虞世基、裴蕴等人也多被杀害。

  宇文化及立炀帝的侄子秦王杨浩为帝，率十余万人北归，途中被李密击败，后来在聊城被窦建德擒杀（另见“宇文化及”条）。炀帝的死讯传开后，在长安的李渊于五月接受隋恭帝杨侑禅位，建立唐朝；在洛阳的王世充等人则拥立越王杨侗为帝。隋朝至此名存实亡。唐朝平定江南后，把炀帝改葬在扬州雷塘。2013 年，考古学者在扬州发现了隋炀帝和萧后的墓。
sources: []
recalled:
  - 《隋书·炀帝纪》
  - 《隋书·宇文化及传》
