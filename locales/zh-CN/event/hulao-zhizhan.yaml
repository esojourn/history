name: 虎牢之战
summary: 621 年李世民在虎牢击败并擒获援救洛阳的窦建德，王世充随即投降。
body: |-
  武德三年（公元 620 年）七月，秦王李世民率唐军东征，进攻据守洛阳的郑国皇帝王世充，逐步扫清洛阳外围的州县，把洛阳团团包围。王世充向河北的夏王窦建德求救。窦建德认为如果唐朝灭了郑国，夏国也难以独存，于是在武德四年（621 年）春亲率大军西进，进抵虎牢以东。

  唐军内部有人主张暂时退兵避其锋芒，李世民认为王世充已经穷困，窦建德远道而来，只要扼守虎牢，就能把两支军队各个击破。他留齐王李元吉等人继续围困洛阳，据《资治通鉴》，自己率骁勇三千五百人东进占据虎牢。窦建德的军队被阻在虎牢以东，相持一个多月不能前进，粮道又屡次被唐军截断。

  五月，窦建德倾全军在汜水以东列阵挑战。李世民按兵不动，等到中午夏军士卒又饥又累，纷纷坐下或争着喝水，才下令出击，亲率轻骑突入敌阵，唐军大破夏军。窦建德受伤后在牛口渚被俘。李世民把窦建德押到洛阳城下，王世充见援军已经覆灭，开城投降。

  这一战唐军一举消灭了中原和河北两大割据势力，奠定了统一的基础。七月李世民凯旋长安，同年十月高祖为他特设“天策上将”之位，位在王公之上。窦建德被押到长安处死，王世充在流放前被仇人杀死。窦建德的旧部不久拥立刘黑闼再次起兵，河北又经过两年战争才最终平定。
sources: []
recalled:
  - 《旧唐书·太宗纪》
  - 《旧唐书·窦建德传》
  - 《资治通鉴》卷一百八十八至一百八十九
