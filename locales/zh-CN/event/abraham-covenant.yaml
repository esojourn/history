name: 立约与割礼
summary: 耶和华与亚伯拉罕立约，以割礼为记号，应许撒拉生子。
body: |-
  此前，《创世记》第 15 章已记耶和华与亚伯兰立约：亚伯兰说自己没有儿子，耶和华领他到外边看天上的星，说他的后裔将要如此；创 15:6 记亚伯兰信耶和华，耶和华就以此为他的义。日落以后，有冒烟的炉和烧着的火把从他摆列的肉块中间经过；耶和华预告他的后裔要寄居别人的地，被苦待四百年，并应许把从埃及河直到伯拉大河之地赐给他的后裔。这一章没有记年份。

  据创 17:1，亚伯兰九十九岁时，耶和华向他显现，要与他立约，使他的后裔极其繁多。神给他改名亚伯拉罕，说要立他作多国的父，并把迦南全地赐给他和他的后裔永远为业（17:4—8）。立约的记号是割礼：所有男子都要受割礼，生下来第八日施行，家里生的和用银子买的都在内；不受割礼的要从民中剪除（17:9—14）。

  神又给撒莱改名撒拉，应许她要生一个儿子。亚伯拉罕俯伏在地喜笑，心里说一百岁的人还能得孩子吗，撒拉已经九十岁了还能生养吗；他求神让以实玛利活在神面前。神回答说，撒拉要生的儿子要起名叫以撒，约要与以撒坚定；至于以实玛利，也要赐福给他，使他生十二个族长，成为大国（17:15—22）。

  当天，亚伯拉罕就给以实玛利和家里的一切男子行了割礼；那时他自己九十九岁，以实玛利十三岁（17:23—27）。第二年以撒出生，第八日受了割礼（21:1—5）。割礼从此成为亚伯拉罕后裔的记号，后来写入律法（《利未记》12:3）。《罗马书》第 4 章、《加拉太书》第 3 章都回顾了这两章的记载。本条年份按亚伯拉罕九十九岁推算，是约数；第 17 章本身没有说明地点，这里按创 13:18、18:1 他当时住在希伯仑幔利标注。
sources: []
recalled:
  - 《创世记》第 15 章、第 17 章、21:1—5
  - 《利未记》12:3
  - 《罗马书》第 4 章
  - 《加拉太书》第 3 章
