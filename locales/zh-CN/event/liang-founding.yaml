name: 萧衍代齐建梁
summary: 雍州刺史萧衍在襄阳起兵，攻入建康推翻东昏侯，502 年受禅建立梁朝。
body: |-
  齐明帝萧鸾篡位后，大杀高帝、武帝的子孙。永泰元年（公元 498 年）明帝去世，太子萧宝卷即位，后世称为东昏侯。他喜好游乐，常在夜间出宫游猎，驱赶沿途百姓；又大造宫殿，据《南史》，他让人把金子凿成莲花贴在地上，让宠妃潘氏在上面行走，称为“步步生莲花”。他接连诛杀辅政大臣，将军陈显达、崔慧景先后起兵，都被平定。平定崔慧景的萧懿，事后也被他赐死。

  萧懿的弟弟萧衍当时任雍州刺史，镇守襄阳。永元二年（500 年）十一月，他在襄阳起兵，与据守荆州的萧颖胄联合，次年三月拥立南康王萧宝融在江陵即位，即齐和帝。萧衍率军顺江东下，围攻郢城数月，攻克后直逼建康。中兴元年（501 年）十二月，东昏侯在宫中被部下王珍国等人杀死，萧衍进入建康。

  次年四月，齐和帝禅位，萧衍即位，建立梁朝，年号天监，不久和帝被杀。南齐共历七帝二十三年而亡。萧衍即梁武帝，在位长达四十八年。

    宋、齐两朝都亡于宗室之间的互相残杀，梁武帝即位后有意反其道而行，对兄弟子侄十分宽容，即使犯了重罪也往往不加追究。梁朝前期江南安定，文化学术兴盛，但这种宽纵也使宗室诸王骄横跋扈，到侯景之乱时，诸王拥兵观望、互相攻伐，梁朝由此崩溃。
sources: []
recalled:
  - 《梁书·武帝纪》
  - 《南齐书·东昏侯纪》
  - 《资治通鉴》卷一百四十二至一百四十五
