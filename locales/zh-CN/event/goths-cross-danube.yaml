name: 哥特人渡过多瑙河
summary: 公元 376 年哥特人为避匈人，经瓦伦斯准许渡过多瑙河进入帝国，次年反叛。
body: |-
  公元四世纪七十年代，匈人从东方的草原出现在黑海以北。阿米阿努斯说，他们先击破顿河一带的阿兰人，再攻哥特人东边的一支格鲁通吉人，其王自杀；西边的特尔温吉人在德涅斯特河设防，也被击溃。阿米阿努斯对匈人的描写是罗马人最早的记述，把他们说得近乎野兽，其中有多少是亲见，有多少是传闻，并不清楚。

  376 年，特尔温吉人的大部分由阿拉维乌斯和弗里蒂格恩带领来到多瑙河下游北岸，派人向皇帝瓦伦斯请求渡河，许诺安分守己并提供兵员。瓦伦斯正在安条克准备对波斯作战，身边的人说，这是白得一大批新兵，行省交的征兵代金还可以留在国库。他同意了。哥特人日夜不停地用船、木筏和挖空的树干渡河，地点在杜罗斯托鲁姆一带。负责清点的官员数不过来，只得作罢，究竟有多少人没有可靠的数字。

  按规定，渡河的人要交出武器，实际并没有执行。粮食供应不上。阿米阿努斯点名指责色雷斯的两个罗马长官：他们扣住粮食，拿狗去换哥特人的孩子做奴隶，一条狗换一个人。趁罗马军队被调去押送，另一支未获准许的格鲁通吉人也渡了河。这年冬末，罗马长官在马尔西亚诺波利斯设宴招待哥特首领，同时在城外与饥民冲突，又在席间杀了首领们的卫兵。弗里蒂格恩脱身而出，哥特人随即反叛，击溃了当地的罗马军。

  此后两年，哥特人在色雷斯四处抢掠，矿工、逃奴和早先安置的蛮族纷纷加入。378 年 8 月 9 日，赶回来的瓦伦斯在阿德里安堡兵败身死。382 年狄奥多西一世与哥特人订约，让他们住在多瑙河与巴尔干山之间，由自己的首领统率，为罗马出兵。

  在此之前，罗马安置过不少战败或归附的部族，都是打散了分到各地。这一次是一整个民族带着武器和首领进入帝国并留了下来。后世讲“民族大迁徙”，通常从这一年讲起；阿拉里克和攻陷罗马的那些哥特人就是他们的下一代。
