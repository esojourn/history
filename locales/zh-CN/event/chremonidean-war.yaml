name: 克瑞摩尼德斯战争
summary: 雅典与斯巴达在埃及托勒密二世支持下反抗马其顿，以雅典投降告终。
body: |-
  安提柯二世在公元前 270 年代坐稳马其顿王位后，靠驻军和扶植亲信控制希腊：比雷埃夫斯、卡尔基斯、科林斯等地都有马其顿驻军。埃及的托勒密二世拥有爱琴海上最强的舰队，不愿见马其顿在海上复兴，便资助希腊各邦反抗。

  雅典出土的一块石碑保存了由克瑞摩尼德斯提议的法令，战争因此得名。法令说，雅典人、拉栖代梦人及各自的盟友从前曾并肩抵抗企图奴役各城的人，如今同样的时刻又已来临；托勒密王遵循先人和姐姐的方针，显然关心希腊人共同的自由；因此雅典与斯巴达及其盟邦（埃利斯、亚该亚、泰耶阿、曼提尼亚等）结盟。法令的年份有前 268 年至前 264 年间的几种推定，学者意见不一。

  战事的经过只有保萨尼亚斯和尤斯丁等人的零星记载。安提柯围困雅典，蹂躏阿提卡。托勒密的海军统帅帕特洛克洛斯率舰队来到阿提卡外海，在沿岸设了几处据点，考古上已有发现，但他没有足以登陆决战的陆军。斯巴达国王阿瑞乌斯几次北上，都被马其顿在科林斯地峡的防线挡住，约前 265 年他在科林斯附近战死。雅典孤立无援，约在前 262 年或前 261 年因断粮投降。

  安提柯在雅典城内的缪斯山等处驻军，一度由他指派官员。前 255 年前后他撤走了城内的驻军，比雷埃夫斯的驻军则留到前 229 年。雅典的防御工事和钱币铸造都受到限制。克瑞摩尼德斯和他的兄弟逃到埃及，后来在托勒密的舰队里任将领。

  这是雅典最后一次作为主角发动战争。此后它在政治上无足轻重，只以学校和古迹闻名；希腊本土的主动权转到亚该亚和埃托利亚两个同盟手里。
sources: []
