name: "苏格兰宗教改革"
summary: "1560 年苏格兰议会废除教皇权柄和弥撒，采纳诺克斯等人所写的加尔文派信条。"
body: |-
  《历史的轨迹》第二十七章说，苏格兰当时是个穷国，国王软弱，贵族相争，教士也许比哪一国都更腐化。路德的著作和丁道尔的英文圣经从东岸的港口传进来。1528 年留学回来的汉密尔顿在圣安德鲁斯被烧死，1546 年布道家威沙特又被烧死，诺克斯是威沙特的门徒。国王詹姆斯五世死后，女王玛丽年幼，被送往法国，母亲吉斯的玛丽摄政，倚重法国驻军。

  1557 年 12 月几位新教贵族立约，该书称为“苏格兰第一信约”，誓言尽全力维护神的道和他的会众。1559 年 5 月摄政传召新教的传道人受审，诺克斯恰在这时从日内瓦回国，在珀斯讲道，会后民众捣毁了城里的修道院。贵族们起兵，一度占了爱丁堡，又被法军逼退。

  英格兰的伊丽莎白不愿法国控制苏格兰，1560 年初派舰队和陆军援助。6 月摄政太后病死，7 月英法订立《爱丁堡条约》，两国军队都撤出苏格兰。

  8 月苏格兰议会开会。该书说，议会宣布改变宗教，采纳大部分由诺克斯所写的加尔文派信条，取消教皇的权柄，禁止举行弥撒。《苏格兰信条》是诺克斯等六位名叫约翰的牧师在四天里写成的。做弥撒初犯没收财产，三犯处死。这些法案没有得到远在法国的女王批准。

  12 月第一次全国大会在爱丁堡举行，只有四十来人。会议提出的《教会管理法规第一集》照日内瓦的办法，设想由会众选牧师，堂区设长老议事会，往上有地区和全国的会议，每个堂区办学校，用旧教会的收入供养牧师、学校和穷人。贵族已经占了不少教产，不肯交出，法规没有成为法律。该书说，在诺克斯的设计里属灵的事教会高于政府，原先受压的新教徒如今反过来压制天主教徒。

  1561 年女王回国，仍信天主教。1567 年她被迫退位后，议会才重新确认 1560 年的各项法案。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十七章“苏格兰教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter30.html"
