name: 杨坚代周建隋
summary: 外戚杨坚辅政，平定尉迟迥等三方起兵，581 年受禅建立隋朝。
body: |-
  北周武帝灭齐后不久去世，太子宇文赟即位，即周宣帝。他荒淫暴虐，大象元年（公元 579 年）把皇位传给七岁的儿子宇文阐，自称天元皇帝，次年五月去世。宣帝的近臣刘昉、郑译假传遗诏，以皇后的父亲、隋国公杨坚总领朝政。

  杨坚掌权后，把在外地的北周宗室五王召回长安加以控制。同年六月起，相州总管尉迟迥在邺城起兵，河北、山东多地响应；郧州总管司马消难起兵后投降陈朝；益州总管王谦也在蜀地起兵。杨坚派老将韦孝宽讨伐尉迟迥，以高颎为监军，八月攻破邺城，尉迟迥自杀；梁睿平定了王谦，司马消难逃往陈朝。杨坚又以谋反等罪名先后杀死了北周宗室诸王。

  大定元年（581 年）二月，周静帝禅位，杨坚即位，国号隋，年号开皇。静帝被废为介国公，同年被杀，年仅九岁，北周宇文氏的宗室几乎被杀尽。国号原应作“随”，杨坚改写为“隋”，后世有人说是嫌“随”字带走之旁不吉，这种说法出现较晚，未必可靠。

  隋朝继承了北周统一北方后的全部疆域，又经过几年整顿内政、打击突厥，开皇八年（588 年）发兵伐陈，次年统一全国。从杨坚辅政到登上帝位，前后不到一年。他出身于宇文泰建立的关陇军事集团，这个集团此后又产生了唐朝的皇室。
sources: []
