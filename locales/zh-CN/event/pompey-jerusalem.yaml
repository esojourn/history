name: 庞培攻取耶路撒冷
summary: 罗马统帅庞培介入哈斯蒙尼兄弟之争，攻下圣殿山，犹太从此受罗马支配。
body: |-
  公元前 67 年撒罗米·亚历山德拉去世，长子许尔堪二世继位，不久被弟弟阿里斯托布鲁斯二世打败让位。以土买人安提帕特怂恿许尔堪投奔拿巴提王亚哩达，借兵把阿里斯托布鲁斯围在耶路撒冷圣殿。这时庞培正在东方用兵，他的部将司考茹斯到了叙利亚，兄弟二人都向他许以重金；司考茹斯令亚哩达撤围。

  前 63 年，庞培在大马士革听取各方申诉。据约瑟夫斯《犹太古史》卷 14，除兄弟二人外，还有一批犹太人的代表请求废除王制，恢复由祭司治理的旧例。庞培暂不裁决，阿里斯托布鲁斯却擅自离去，庞培于是进军犹太。阿里斯托布鲁斯先退守亚历山大堡，后来出城投降并答应献出耶路撒冷，他的部下却拒不开门。

  城内许尔堪一派打开城门，罗马军进入城区；阿里斯托布鲁斯的支持者退守圣殿山，拆断通往城区的桥。庞培从北面填沟筑垒。约瑟夫斯说，犹太人在安息日只在受到攻击时自卫，不出来阻止敌人施工，罗马人就专在这一天推进土垒。围攻到第三个月，城墙被攻破；约瑟夫斯记犹太人死者一万二千，并说祭司在屠杀中仍照常献祭，死在祭坛旁。

  庞培和随从进了圣殿，包括只有大祭司才可以进入的至圣所。约瑟夫斯和西塞罗都说他没有取走殿里的财物；次日他吩咐洁净圣殿，照例献祭。他恢复许尔堪二世的大祭司职位，但不给王号；把沿海和约旦河东的希腊化城邑从犹太划出，归叙利亚行省管辖；犹太须向罗马纳贡。阿里斯托布鲁斯和子女被带往罗马，出现在庞培的凯旋式上。

  自西门以来约八十年的独立至此结束。此后哈斯蒙尼家仍有人起兵，但犹太的事务已由罗马决定；安提帕特一家借罗马之力上升，前 37 年他的儿子希律取代哈斯蒙尼王朝作王。不在圣经正典之内的《所罗门诗篇》中有几首，一般认为是在影射庞培攻城。
sources: []
recalled:
  - 约瑟夫斯《犹太古史》卷 14 第 1—4 章
  - 约瑟夫斯《犹太战记》卷 1 第 6—7 章
  - 西塞罗《为弗拉库斯辩护》
  - 《所罗门诗篇》第 2、8、17 篇
