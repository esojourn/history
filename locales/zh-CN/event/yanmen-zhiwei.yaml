name: 雁门之围
summary: 615 年隋炀帝北巡，被东突厥始毕可汗围困在雁门一个多月。
body: |-
  启民可汗死后，他的儿子始毕可汗势力强大，与隋朝的关系逐渐恶化。大业十一年（公元 615 年）八月，隋炀帝北巡塞外，嫁到突厥的义成公主派人密报始毕可汗要率兵袭击，炀帝急忙进入雁门城。据《资治通鉴》，始毕可汗率骑兵数十万包围雁门，雁门郡的四十一座城被攻下三十九座，箭矢落到炀帝面前，炀帝抱着幼子赵王杨杲哭泣，眼睛都哭肿了。

  炀帝采纳苏威、樊子盖等人的建议，宣布停止征讨高句丽，许诺重赏守城将士，又派人向义成公主求救，各地也派兵勤王。据《旧唐书·太宗纪》，当时十六岁的李世民应募从军，隶属屯卫将军云定兴，他建议多张旗鼓、虚张声势，使突厥以为援军大至。义成公主又派人告诉始毕可汗北方有警，九月突厥解围而去。

  解围后，炀帝没有兑现对将士的赏赐，又议论再征高句丽，人心更加离散。次年他南下江都，再也没有回到北方。
sources: []
recalled:
  - 《隋书·炀帝纪》
  - 《旧唐书·太宗纪》
  - 《资治通鉴》卷一百八十二
