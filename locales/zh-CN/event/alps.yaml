name: 翻越阿尔卑斯山
summary: 汉尼拔率军连同战象从西班牙出发，翻山进入意大利。
body: |-
  公元前 218 年春，汉尼拔从西班牙的新迦太基出发，打算从陆路进攻意大利。他渡过埃布罗河，越过比利牛斯山，沿途留下部分兵力。据波利比乌斯，到罗讷河时他有步兵三万八千、骑兵八千；战象是用筏子运过河的，共三十七头。罗马执政官老西庇阿赶到河口时，他已经离开三天。

  随后他溯河而上进入阿尔卑斯山。上山途中军队在隘路上遭山地部族袭击，损失了不少人和驮畜；山口已有积雪，下山的路有一段塌毁，要重新开凿才能让马匹和战象通过。李维记有用火烧热岩石再浇醋使其碎裂的做法，波利比乌斯没有提到。

  据波利比乌斯，翻山用了十五天，从新迦太基算起全程五个月；进入波河平原时还剩步兵两万、骑兵不到六千。他说这些数字出自汉尼拔本人留在意大利拉基尼乌姆的铭文。汉尼拔究竟走的哪个山口，古代作家已有不同说法，李维就列举过几种，至今没有定论。
sources:
  - 波利比乌斯《历史》卷三第 33—56、60 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/3*.html
  - 英文维基百科“Hannibal's crossing of the Alps” https://en.wikipedia.org/wiki/Hannibal%27s_crossing_of_the_Alps
recalled:
  - 李维《罗马史》卷二十一第 23—38 章
