name: 明末农民起义
summary: 崇祯年间席卷北方和西南的农民起义，1644 年李自成攻入北京。
body: |-
  明朝后期，土地兼并严重，赋役沉重，朝廷为辽东战事加派“辽饷”。天启末年、崇祯初年，陕西连年大旱，饥民遍野，朝廷裁撤驿站，大批驿卒失业，边兵又常常欠饷，许多人走投无路。天启七年（1627 年）陕西澄城县的农民王二聚众杀死知县，揭开了明末农民起义的序幕，此后王嘉胤、高迎祥、张献忠、李自成等人纷纷起兵。

  起义军起初在陕西、山西一带活动，被称为“流寇”，后来进入河南、湖广、四川、安徽等地，各部时分时合，有“十三家七十二营”之说。崇祯八年（1635 年）起义军攻破凤阳，焚烧了明朝的皇陵。明朝先后派洪承畴、卢象升、孙传庭、杨嗣昌等人镇压，起义军多次陷入困境。崇祯九年（1636 年）闯王高迎祥被俘牺牲，李自成继称闯王；崇祯十一年（1638 年）张献忠在谷城接受招安，李自成在潼关南原大败，只剩下十几个人隐入商洛山中。

  这时清军不断入关劫掠，明朝把镇压起义的军队调去防御清军，起义军得以恢复。崇祯十二年（1639 年）张献忠再次起兵，次年李自成进入河南，正值河南大旱，饥民纷纷投奔，部众扩大到数十万。他提出“均田免赋”的口号，攻破洛阳，三次围攻开封，又在郏县、汝州等地击败孙传庭等率领的明军主力。崇祯十六年（1643 年）李自成占据襄阳，随后攻入陕西，占领西安；张献忠攻占武昌，随后入川。

  崇祯十七年（1644 年）李自成在西安建立大顺政权，随即东征，三月攻破北京，崇祯帝自缢，明朝灭亡（另见“甲申之变”条）。同年张献忠在成都建立大西政权。但大顺军很快在山海关被吴三桂和清军击败，此后起义军余部转而与南明联合抗清。明末农民起义是明朝灭亡的直接原因。
