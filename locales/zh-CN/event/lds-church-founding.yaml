name: "摩门教成立"
summary: "约瑟·斯密出版《摩门经》，1830 年 4 月与追随者成立教会。"
body: |-
  《历史的轨迹》第四十五章说，时代的动荡使移民从欧洲涌向美国，也使拓荒者向西迁移，带来了复兴运动和露天聚会，也成了不合圣经的教派和异端滋生的温床。奇怪的是，纽约州中西部同时是米勒派、属灵运动和摩门教的发源地。

  书中说，约瑟·斯密宣称天使摩罗乃向他显现，1827 年 9 月 22 日在附近山中挖出一本金页书，用三年译出，1830 年出版《摩门经》；跟随“先知约瑟”的人于 1830 年 4 月成立了一间教会。此后总部从俄亥俄柯特兰迁到密苏里，再迁到伊利诺伊纳府；斯密创立一夫多妻制后被暴民杀死，两年后信徒在杨百翰带领下迁往大盐湖。书中说，他们把《摩门经》看作与圣经同等、支持而不取代圣经的书，对圣经只接受“正确翻译”的部分，斯密的另外两本书在基本教导上也极重要；特别的教义有“为死人施洗”和“属天婚姻”。

  据一般记载，教会是 1830 年 4 月 6 日在纽约州费耶特的惠特默家中成立的，起初只有六名正式成员，名为“基督的教会”，1838 年定名为“耶稣基督后期圣徒教会”。斯密死后信徒分裂，跟随杨百翰的是最大的一支。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
