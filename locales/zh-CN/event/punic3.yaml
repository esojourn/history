name: 迦太基被毁
summary: 第三次布匿战争。迦太基城被攻陷后夷为平地。
body: |-
  第二次布匿战争的和约规定，迦太基未经罗马许可不得作战。邻国努米底亚的国王马西尼萨不断蚕食它的土地，公元前 151 年前后迦太基出兵抵抗，战败。罗马以违约为由，于前 149 年宣战；在此之前，老加图已多次在元老院主张毁掉迦太基。

  据阿庇安，迦太基人先按要求交出三百名人质，又交出全部武器，这时罗马执政官才宣布最后的条件：居民必须迁出，在离海八十斯塔迪昂以外另建居所，原城要拆毁。迦太基人拒绝，关闭城门，赶造武器，据城坚守。罗马军队围攻两年没有进展。

  前 147 年小西庇阿当选执政官前来接替指挥，他截断了地峡，又筑堤封住港口。前 146 年春罗马军队攻入城内，据阿庇安，巷战持续了六天六夜才逼近卫城比尔萨，五万人出降，被卖为奴。城市被焚毁拆平，迦太基的领地成为罗马的阿非利加行省。同一年，罗马还毁掉了希腊的科林斯。
sources:
  - 波利比乌斯《历史》卷三十六第 1—9 章；卷三十八第 19—22 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/38*.html
  - 普鲁塔克《老加图传》第 26—27 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Cato_Major*.html
  - 英文维基百科“Third Punic War”（核对年份） https://en.wikipedia.org/wiki/Third_Punic_War
