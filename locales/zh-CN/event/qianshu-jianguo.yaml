name: 前蜀建立
summary: 907 年朱温篡唐后，西川的王建在成都称帝，国号蜀，史称前蜀。
body: |-
  唐末王建据有西川、东川和山南西道，天复三年（公元 903 年）被唐朝封为蜀王。天祐四年（907 年）四月朱温篡唐建立后梁，王建拒不承认，传檄各地，号召共同讨伐朱温，但响应者寥寥。同年九月，他在成都即皇帝位，国号大蜀，史称前蜀。

  前蜀大体沿用唐朝的制度，中原战乱，许多唐朝旧臣和士人入蜀避难，王建任用了其中不少人，唐末诗人韦庄就是前蜀开国的宰相，前蜀的典章制度多由他制定。蜀地远离中原战场，经济文化得以保存和发展，成都成为当时最繁华的城市之一。

  前蜀传两代，共十九年。同光三年（925 年），后唐出兵伐蜀，王建的儿子王衍投降，前蜀灭亡（另见“后唐灭前蜀”条）。
sources: []
recalled:
  - 《新五代史·前蜀世家》
  - 《资治通鉴》卷二百六十六
