name: 所罗门建殿
summary: 所罗门在耶路撒冷为耶和华建造圣殿，第四年动工，第十一年完工。
body: |-
  据《撒母耳记下》第 7 章，大卫曾有意为耶和华建殿，先知拿单传话说，建殿的将是他的后裔。《历代志上》22:8 和 28:3 记大卫自述，因他流了多人的血，所以不可由他建造。大卫为建殿预备了材料。《历代志下》3:1 说，殿建在耶路撒冷的摩利亚山上，就是大卫向耶布斯人阿珥楠（《撒母耳记下》作亚劳拿）买下的禾场。

  《列王纪上》第 5 章记载，所罗门即位以后与推罗王希兰立约：希兰的仆人在黎巴嫩砍伐香柏木和松木，扎成筏子从海路运来；所罗门每年给希兰麦子二万歌珥、清油二十歌珥。所罗门又从以色列人中挑取服苦的人三万，轮流上黎巴嫩，另有扛抬的七万、在山上凿石头的八万（5:13–15）。

  6:1 说，以色列人出埃及地后四百八十年，所罗门作王第四年西弗月，就是二月，开工建造。殿长六十肘，宽二十肘，高三十肘；石头是在山中凿成的，建殿的时候听不见锤子、斧子的响声（6:2、6:7）。殿里面用香柏木板贴墙，内殿就是至圣所，长宽高各二十肘，贴上精金，其中安放两个橄榄木作的基路伯，各高十肘。推罗的铜匠户兰铸造了两根铜柱，起名叫雅斤和波阿斯，又造了铜海、盆座和各样器皿（7:13–47）。殿在所罗门十一年布勒月，就是八月，全部完工，共用七年（6:38）。

  第 8 章记载，以他念月，就是七月，所罗门招聚以色列的长老，祭司把约柜抬进至圣所，放在基路伯的翅膀底下，有云充满了耶和华的殿。所罗门在坛前举手祷告，随后献平安祭，据 8:63 用牛二万二千、羊十二万。

  这座殿此后是耶路撒冷敬拜的中心，后世称为第一圣殿或所罗门圣殿。它在公元前 586 年前后被巴比伦王尼布甲尼撒的军队焚毁（《列王纪下》第 25 章）。本条的起止年份按所罗门约前 970 年即位推算，是约数。王上 6:1 的“四百八十年”常被用来推算出埃及的年代，对这个数字应当怎样理解，学者看法不一。
sources: []
recalled:
