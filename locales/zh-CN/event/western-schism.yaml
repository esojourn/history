name: 西方教会大分裂
aliases:
  - 教皇大分裂
  - 大分裂时期
summary: 1378—1417 年罗马与阿维农各有教皇，后增为三位，西欧分属不同阵营。
body: |-
  1377 年教皇从阿维农回到罗马，次年去世。1378 年 4 月枢机们在罗马选举，城里的民众聚在会场外，要求选一个罗马人至少是意大利人。枢机们选了意大利南部的巴里大主教，即乌尔班六世。新教皇待枢机们十分粗暴，占多数的法国籍枢机几个月后离开罗马，声明 4 月的选举是在暴力威胁下进行的，因而无效，9 月另选了一位教皇，即克莱门特七世，他后来回到阿维农。

  《历史的轨迹》第十九章说，意大利人对教廷迁往阿维农非常不满，要使罗马再度成为教皇所在地，结果 1378 年意大利与法国公开决裂，各选出一位教皇，一位在罗马，一位在阿维农，两位教皇彼此咒诅、互相革除教籍，教皇制的尊严受到重大打击，从此再没有完全恢复。

  西欧各国按政治上的亲疏分成两边：法国、苏格兰、西班牙各国和那不勒斯承认阿维农，英格兰、德意志大部、匈牙利、波兰和意大利多数地方承认罗马。两边各自有继任者，双方都有后来被尊为圣徒的人，普通信徒无从判断谁是真教皇。巴黎大学的学者提出几种办法：两人同时退位，或交付仲裁，或召开大公会议。两位教皇都答应过退位，都没有做。

  1409 年两边的枢机联合在比萨开会。该书说，会议决定废除双方教皇，另选亚历山大五世，但没有一位肯让位，结果成了三位教皇并立。亚历山大五世次年去世，由约翰二十三世继任。

  1414 年皇帝西吉斯蒙德促成康斯坦茨会议。比萨一系的约翰二十三世在 1415 年被废黜，罗马一系的贵格利十二世同年自己辞职，阿维农一系的本笃十三世在 1417 年被废黜。1417 年 11 月会议选出马丁五世，分裂结束。该书说三位教皇一致支持马丁五世；本笃十三世其实至死不肯承认。该书认为，教皇制因“巴比伦被掳”和大分裂所受的创伤，此后延续了很长时间。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十九章“教会权势衰微” https://wellsofgrace.com/books/spiritual/2000years/html/chapter21.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
