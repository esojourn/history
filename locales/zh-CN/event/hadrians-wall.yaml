name: 修筑哈德良长城
summary: 公元 122 年哈德良巡视不列颠，下令修筑一道横贯全岛的边墙。
body: |-
  哈德良即位后不再扩张，转而把边界固定下来。公元 122 年他从日耳曼到不列颠巡视。《罗马帝王纪》只用一句话记这件事：他在那里做了许多整顿，并且第一个修了一道八十罗马里长的墙，把罗马人和蛮族隔开。在此之前，罗马人已经从苏格兰撤回，沿泰恩河到索尔韦湾之间的大路设了一线堡垒。

  长城由新任总督普拉托里乌斯·涅波斯主持，驻不列颠的三个军团分段施工，各段留下了刻有部队番号的石头。全线从泰恩河口的沃尔森德到索尔韦湾边的鲍内斯，长约一百一十七公里。东段一开始就用石料，西段起初用草皮垒成，后来改为石砌；墙宽两三米，原来的高度估计有四五米。每隔一罗马里有一座带门的小堡，两座小堡之间有两座瞭望塔。墙北挖了一道壕沟。施工中途改了设计，把十几座大堡垒直接建在墙上，墙南又挖了一条两侧带土堤的宽沟。主体工程用了六年左右。

  驻守的是辅助部队，总数估计近万人。墙上的门很多，它的用处主要是管住南北往来、征收关税和预警，而不是挡住大军。城墙以南的文德兰达堡垒出土过大量写在薄木片上的书信和账目，年代略早于长城，其中有军官夫人的生日邀请和士兵讨要袜子的家信。

  142 年前后，安东尼·庇护把防线向北推到福斯湾与克莱德湾之间，另筑一道土墙，哈德良长城一度闲置；二十来年后驻军又撤了回来。此后它一直是行省的北界，三四世纪几经修缮，直到五世纪初罗马的统治在不列颠结束。石料后来被附近居民大量取用，中段保存得最好。1987 年它被列入世界遗产。
sources: []
