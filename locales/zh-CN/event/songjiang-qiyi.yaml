name: 宋江起义
summary: 北宋末年宋江等在京东、淮南起事，1121 年被张叔夜招降。
body: |-
  关于宋江，史书的记载很少。据《宋史·徽宗本纪》，宣和三年（公元 1121 年）二月，“淮南盗宋江”等人侵犯淮阳军，朝廷派兵讨捕，宋江等又转到京东、江北，进入楚州、海州境内，朝廷命海州知州张叔夜招降他们。《宋史·张叔夜传》说，宋江起于河朔，转战十郡，官军不敢抵挡，张叔夜在海州设下伏兵，烧了他们的船只，宋江于是投降。《宋史·侯蒙传》又说，宋江以三十六人横行齐、魏之间，侯蒙建议招降他们去讨伐方腊。

  宋江投降以后是否参加了镇压方腊的战争，史料说法不一。二十世纪发现的宋人《折可存墓志》记载，折可存在讨平方腊回师途中奉命捕捉宋江，不到一个月就将他擒获，这与招降之说互相矛盾，学者至今仍有争论。南宋以后，宋江等三十六人的故事在民间流传，经过《大宋宣和遗事》等书和元代杂剧的演绎，到元末明初发展成长篇小说《水浒传》，小说中的人物和情节大多是虚构的。
sources: []
recalled:
  - 《宋史·徽宗本纪》
  - 《宋史·张叔夜传》《侯蒙传》
  - 范圭《折可存墓志铭》
  - 龚开《宋江三十六人赞》
