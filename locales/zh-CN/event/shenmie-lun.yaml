name: 《神灭论》之争
summary: 范缜作《神灭论》反对佛教的神不灭说，先后与竟陵王萧子良和梁武帝君臣辩论。
body: |-
  南朝佛教盛行，佛教讲因果报应、轮回转生，以灵魂不灭为前提。齐竟陵王萧子良笃信佛教，范缜却不信。据《梁书·范缜传》，萧子良问他不信因果，为何世间有富贵贫贱，范缜以同一树上的花随风飘落、有的落在坐垫上、有的落在粪坑边作比，说贵贱只是偶然，与因果无关。

  此后范缜写成《神灭论》，用问答的形式阐述自己的看法，主张“形者神之质，神者形之用”，形体与精神是一回事，不能分离；又以刀刃与锋利作比：没有刀刃就无所谓锋利，形体死亡，精神也就随之消灭。萧子良召集僧人与他辩论，没能使他屈服。《神灭论》的写作时间有齐永明年间和梁天监初年两种说法。

  梁天监六年（公元 507 年）前后，梁武帝亲自写了《敕答臣下神灭论》，命大僧正法云把敕书出示给王公朝贵，数十位王公大臣写文章响应，批驳神灭之说；东宫舍人曹思文写了《难神灭论》，范缜又一一作答。这次辩论中，范缜没有受到处罚。双方的文章大多收录在僧祐编的《弘明集》里。《神灭论》被看作中国古代无神论的代表作品。
sources: []
recalled:
  - 《梁书·儒林传·范缜》
  - 僧祐《弘明集》卷九、卷十
