name: 剃发令
summary: 1645 年清廷下令汉族男子一律按满洲习俗剃发留辫，引发江南等地的激烈反抗。
body: |-
  满洲男子的发式是把头顶周围的头发剃去，只留后脑的头发编成辫子。清军入关之初，曾下令投降的汉人剃发，因遭到反对，不久暂停。顺治二年（1645 年）六月，清军攻下南京后，多尔衮下令全国的汉族男子在十日之内一律剃发，“遵依者为我国之民，迟疑者同逆命之寇”，民间流传为“留头不留发，留发不留头”。与此同时还要求改穿满洲服饰。

  对于许多汉人来说，“身体发肤，受之父母”，剃发易服意味着屈服于异族，剃发令因此激起了强烈的反抗。原本已经投降的江南城镇纷纷起兵。江阴的典史阎应元、陈明遇率领军民守城八十一天，城破后清军屠城；嘉定的士绅侯峒曾、黄淳耀等人起兵，清军三次屠杀嘉定，史称“嘉定三屠”。昆山、松江、苏州、绍兴等地也都发生了抗清斗争，顾炎武、黄宗羲等人都参与其中。

  剃发令是清初最具争议的政策之一。一方面，它被清朝统治者视为臣服的标志，严厉执行；另一方面，它使原本已趋平静的江南重新陷入战火，客观上推动了南明抗清运动的高涨。此后剃发留辫成为清代男子的统一发式，直到辛亥革命以后才废除。

  与剃发相配合的还有“易服”，即改穿满洲式样的服装。民间有“男从女不从，生从死不从”等“十从十不从”的说法，表示妇女、死者的装束可以保留明朝旧制，但这一说法是否真有明文规定，学者看法不一。
sources: []
recalled:
  - 《清世祖实录》
  - 韩菼《江阴城守纪》
  - 朱子素《嘉定屠城纪略》
