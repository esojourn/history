name: 罗塞塔石碑刻成
summary: 公元前 196 年埃及祭司在孟菲斯为托勒密五世颁布诏令，用三种文字刻石。
body: |-
  托勒密五世幼年即位，其时上埃及和三角洲都有叛乱，南叙利亚又被安条克三世夺走。公元前 196 年他在孟菲斯加冕。碑文所记日期合公元前 196 年 3 月 27 日，这一天聚集在孟菲斯的各地祭司通过一道诏令，列举国王减免神庙赋税、赦免囚犯、攻克叛军据守的吕科波利斯等事，决定在各神庙为他立像、设祭，并规定诏令要用圣书体、本地通行的文字和希腊文三种文字刻在硬石碑上，立于各神庙。

  罗塞塔石碑是这道诏令的刻本之一，花岗闪长岩质，上段为圣书体，中段为世俗体，下段为希腊文，三段都有残缺，现存部分高约 112 厘米。它原先立在何处没有记载，学者推测是三角洲的某座神庙，可能在赛斯。同一诏令的其他残本后来也有发现。

  1799 年 7 月，拿破仑远征军的军官布沙尔在尼罗河口拉希德（罗塞塔）修筑工事时发现此碑。1801 年法军投降后石碑归英国，1802 年起藏于大英博物馆。因为三段文字内容大体相同，托马斯·杨和商博良等人借助希腊文部分研究另外两种文字，1822 年商博良公布了他对圣书体的释读。
sources:
  - 罗塞塔石碑铭文（孟菲斯诏令）及大英博物馆藏品说明 https://www.britishmuseum.org/collection/object/Y_EA24
  - 英文维基百科“Rosetta Stone”条 https://en.wikipedia.org/wiki/Rosetta_Stone
recalled:
  - 波利比乌斯《历史》第 18 卷第 55 章（托勒密五世成年礼）
