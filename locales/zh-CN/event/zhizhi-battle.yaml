name: 陈汤斩郅支
summary: 西域副校尉陈汤与都护甘延寿假托诏令发兵四万，远征康居，攻杀匈奴郅支单于。
body: |-
  呼韩邪单于归附汉朝以后，他的哥哥郅支单于率部西迁。郅支怨恨汉朝扶助呼韩邪，杀死了护送他儿子回去的汉使谷吉，随后应康居王之邀迁到康居东部，在都赖水边筑城，借康居的兵力攻掠乌孙，并向大宛等国索取贡物。汉朝三次派使者到康居索要谷吉等人的遗骸，郅支不肯给，还羞辱使者。

  据《汉书·陈汤传》，建昭三年（公元前 36 年），陈汤以西域副校尉的身份随都护甘延寿到任。他对甘延寿说，郅支如果再吞并乌孙、大宛，几年之内西域各国都会受到威胁；郅支所在虽然遥远，但没有坚固的城池和强弩，调发屯田的吏士和乌孙的兵直抵城下，可以一举成功。甘延寿赞成，但想先上奏朝廷。陈汤认为朝中公卿必定不会同意。正好甘延寿久病，陈汤便独自假托诏令，征发西域各国的兵和车师的屯田吏士。甘延寿得知后想要阻止，陈汤按剑喝止，甘延寿只得听从。两人上疏自劾假托诏令之罪，同时出发。

  全军四万余人，分为六校，三校走南道越过葱岭、经大宛，三校由都护亲率走北道、经乌孙进入康居。沿途他们击退了康居的一支袭扰部队，并争取到一些怨恨郅支的康居贵人做向导。到达郅支城下后，汉军四面围城。《陈汤传》说城有内外两重，外面是木城，里面是土城。汉军夜间纵火烧毁木城，击退前来救援的一万多名康居骑兵，天亮时攻入土城。郅支单于受伤而死，汉军斩下他的首级，共斩杀阏氏、太子、名王以下一千五百余人，俘虏和投降的有一千多人，并找到了谷吉等人带去的汉节和帛书。

  两人的奏疏说，应当把郅支的首级悬挂在长安蛮夷邸所在的街上，“以示万里，明犯强汉者，虽远必诛”。朝中对如何处置争论很久：中书令石显和丞相匡衡认为擅自兴兵不可鼓励；刘向上书说，他们立下的功劳远大于过失。元帝最后赦免了两人假托诏令的罪过，封甘延寿为义成侯，陈汤为关内侯。呼韩邪单于得知郅支已死，又喜又惧，三年后再次入朝。
sources: []
recalled:
  - 《汉书·傅常郑甘陈段传》
  - 《汉书·匈奴传下》
  - 《汉书·元帝纪》
