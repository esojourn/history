name: 该隐杀亚伯
summary: 亚当的长子该隐因供物不蒙悦纳，在田间杀了弟弟亚伯。
body: |-
  据《创世记》第 4 章，亚当和夏娃被逐出伊甸园以后生了两个儿子：该隐种地，亚伯牧羊。有一日，该隐拿地里的出产为供物献给耶和华，亚伯献上羊群中头生的和羊的脂油。耶和华看中了亚伯和他的供物，没有看中该隐和他的供物。该隐大大发怒，变了脸色。耶和华对他说，他若行得好，岂不蒙悦纳；若行得不好，罪就伏在门前，要恋慕他，他却要制伏它（4:1–7）。

  后来兄弟二人在田间，该隐起来打亚伯，把他杀了。耶和华问该隐亚伯在哪里，他说不知道。耶和华说，亚伯的血有声音从地里哀告，地开了口从该隐手里接受他兄弟的血，他必从这地受咒诅：种地，地不再给他效力，他必流离飘荡在地上。该隐怕遇见他的人杀他，耶和华就给他立了一个记号，并说凡杀该隐的必遭报七倍（4:8–15）。该隐于是离开耶和华的面，去住在伊甸东边的挪得之地（4:16）。事情发生在哪一处田间，经文没有说。

  这是圣经所记的第一桩杀人的事。此后亚当和夏娃又生了塞特，代替亚伯（4:25）。新约多次提到这件事：《希伯来书》11:4 说亚伯因着信献祭比该隐所献的更美，《约翰一书》3:12 说该隐杀兄弟是因为自己的行为是恶的、兄弟的行为是善的。
sources: []
recalled:
  - 《创世记》第 4 章
  - 《希伯来书》11:4
  - 《约翰一书》3:12
