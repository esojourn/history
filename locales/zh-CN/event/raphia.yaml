name: 拉菲亚战役
summary: 公元前 217 年托勒密四世在拉菲亚击败安条克三世，保住了南叙利亚。
body: |-
  南叙利亚（柯里叙利亚）自公元前 301 年起由托勒密王朝占据，塞琉古王国一直不予承认。前 219 年安条克三世发动第四次叙利亚战争，先夺回安条克的外港塞琉西亚·皮埃里亚，又接受埃及守将提奥多图斯的投诚，占领推罗、托勒密城等地。埃及一面拖延谈判，一面由索西比乌斯等人整编军队，并征召两万埃及本地人编成方阵。

  前 217 年 6 月，两军在加沙西南的拉菲亚对阵。据波利比乌斯，托勒密四世有步兵七万、骑兵五千、非洲象七十三头，安条克三世有步兵六万二千、骑兵六千、印度象一百零二头。开战后埃及左翼的战象不敌印度象而溃退，安条克三世亲率右翼骑兵追击过远；托勒密四世转入中军方阵督战，埃及方阵击溃了对面的塞琉古方阵。波利比乌斯记塞琉古一方阵亡步兵近万、骑兵三百余，被俘四千余；埃及一方阵亡步兵约一千五百、骑兵约七百。

  战后安条克三世退回安条克并求和，南叙利亚仍归埃及。波利比乌斯说，埃及人因这次胜利而自负，不愿再听命，不久即起而叛乱。前 200 年前后安条克三世在帕尼翁获胜，南叙利亚最终转归塞琉古王国。
sources:
  - 波利比乌斯《历史》第 5 卷第 58—71、79—87、107 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/5*.html
  - 英文维基百科“Battle of Raphia”条（日期） https://en.wikipedia.org/wiki/Battle_of_Raphia
recalled:
  - 拉菲亚诏令（前 217 年孟菲斯祭司会议诏令）
