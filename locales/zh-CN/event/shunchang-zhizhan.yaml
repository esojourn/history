name: 顺昌之战
summary: 1140 年刘锜据守顺昌，以少胜多，击败完颜宗弼亲率的金军。
body: |-
  绍兴九年（公元 1139 年）宋金第一次议和，金朝把河南、陕西归还宋朝。次年金朝主战的完颜宗弼掌权，撕毁和约，分兵南下，很快夺回河南、陕西。这时刘锜奉命率领以河北义军“八字军”为骨干的部队去东京任副留守，行至顺昌府（今安徽阜阳），听说金军已经攻占东京，正向顺昌开来。

  刘锜与顺昌知府陈规商议，决定据城坚守。据《宋史·刘锜传》，他下令把运兵的船只全部凿沉，表示没有退路，又把家属安置在寺中，堆积柴薪于门外，说如果城破就放火烧死家人，不让他们落入敌手，将士因此人人奋勇。他抢修城防，在城外设伏，多次趁夜出城袭击金营。

  金军先头部队受挫后，宗弼亲率大军从开封赶来。当时正值盛夏，刘锜派人在颍水上游和草中投毒，又让士兵轮流休息、饮食，等到中午金军人马饥渴疲乏时，才开城出击。据《宋史》，宗弼身穿白袍，亲率身披重铠的“铁浮图”督战，宋军以长枪大斧冲入阵中，奋力苦战，金军大败，宗弼退回开封。

  顺昌之战是南宋以少胜多的著名战例，打击了金军的锐气，为随后岳飞在郾城、颍昌的胜利创造了条件（另见“郾城之战”条）。但宋高宗和秦桧随即命令刘锜撤军，顺昌之战的战果没有得到扩大。
sources: []
recalled:
  - 《宋史·刘锜传》
  - 杨汝翼《顺昌战胜破贼录》
  - 《建炎以来系年要录》
