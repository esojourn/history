name: "赫恩胡特复兴"
summary: "1727 年夏，赫恩胡特的弟兄会在圣餐聚会中经历复兴，莫拉维教会由此重组。"
body: |-
  《历史的轨迹》第三十四章说，1722 年起克里斯蒂安·大卫带着波希米亚、摩拉维亚弟兄会的余民，到亲岑多夫在贝特尔斯多夫的地产上避难，建起赫恩胡特；到 1727 年已有几百人。据一般记载，各地来的人信仰背景不同，起初争执很多。亲岑多夫辞去官职住到这里，利用当时准许新村镇自治的法律，与居民订立了规约（1727 年 5 月的《兄弟协约》），按施本尔的原则在教会中成立小组。

  该书说，1727 年 8 月 12 日，在赫恩胡特的一次圣餐聚会中，全体都感到圣灵强烈的工作，于是把这一天定为弟兄会再生之日，正式成立了莫拉维教会。一般记载这次圣餐聚会是在贝特尔斯多夫教堂举行的，日期为 8 月 13 日，与书中差一天。

  据一般记载，同月起他们开始了昼夜轮流不断的祷告，持续了一百年。1732 年第一批宣教士前往西印度群岛，次年到格陵兰。该书说，莫拉维弟兄会是复原教中最先认真遵行“大使命”的教会，在非洲、亚洲、格陵兰、拉布拉多和美洲印第安人中工作。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十四章“敬虔主义 莫拉维弟兄会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter38.html"
recalled:
  - "赫恩胡特 1727 年的《兄弟协约》"
