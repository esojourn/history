name: 红巾军起义
summary: 1351 年韩山童、刘福通在颍州起义，各地纷纷响应，元朝统治由此瓦解。
body: |-
  元朝后期政治腐败，皇位更替频繁，权臣专政，赋役繁重，又滥发纸钞，物价飞涨，民族之间的不平等也加深了社会矛盾。至正四年（公元 1344 年）黄河在白茅堤决口，河南、山东大片地区受灾，流民遍地。至正十一年（1351 年）丞相脱脱采纳贾鲁的方案，征发大批民夫和军士治理黄河，使黄河回归故道，同时变更钞法。

  在这之前，韩山童、刘福通等人以白莲教聚众，宣扬“弥勒下生”“明王出世”。据记载，他们暗中在黄陵冈的河道里埋下一个只有一只眼的石人，又散布“石人一只眼，挑动黄河天下反”的歌谣。民夫挖出石人后，人心浮动。这年五月，韩山童、刘福通在颍州聚众起事，事前消息泄露，韩山童被捕杀，刘福通率众攻占颍州。起义军头裹红巾，所以称为“红巾军”，又因烧香礼佛被称为“香军”。

  此后各地纷纷起兵响应。在北方，刘福通的部队攻占了河南、安徽的许多州县，芝麻李占据徐州；在南方，徐寿辉、彭莹玉在蕲州、黄州一带起义，建立天完政权；郭子兴等人在濠州起兵。另有张士诚、方国珍等人不属于红巾军，也各据一方。至正十五年（1355 年）刘福通拥立韩山童之子韩林儿为“小明王”，国号宋；至正十七年（1357 年）分兵三路北伐，一度攻破上都，进入辽东和高丽。

  红巾军起义持续了十几年，北方红巾军的主力最终被察罕帖木儿等元军将领和地方武装镇压，但元朝的统治已经瓦解。参加郭子兴部的朱元璋在江南逐渐壮大，先后消灭陈友谅、张士诚，1368 年建立明朝（另见“明朝建立”条）。
sources: []
