name: 圣殿遭亵渎
summary: 安条克四世禁止犹太人守律法，在圣殿祭坛上设异教祭坛。
body: |-
  据《马加比一书》1:20–24，塞琉古纪元 143 年（公元前 169 年）安条克四世从埃及回师，进入耶路撒冷圣殿，取走金祭坛、灯台等器物。两年后他派来的官员洗劫全城，拆毁城墙，并在大卫城筑起卫城驻军（1:29–36）。

  随后国王颁令，禁止在圣殿献燔祭，禁止守安息日和节期，禁止行割礼，命各城修筑异教祭坛、献猪和不洁的牲畜，违者处死（1:41–50）。塞琉古纪元 145 年基斯流月十五日（公元前 167 年冬），“那行毁坏可憎的”被立在燔祭坛上，同月二十五日有人在其上献祭（1:54、1:59）。《马加比二书》6:2 说圣殿被改称奥林匹亚宙斯的神庙。约瑟夫斯《犹太古史》另记国王在祭坛上献猪。

  《但以理书》11:31 所说“亵渎圣地、除掉常献的燔祭、设立那行毁坏可憎的”，一般认为指的就是这件事。律法书被搜出焚毁，给孩子行割礼的妇女被处死（《马加比一书》1:56–61）。这场禁令直接引发了马加比起义，圣殿在三年后的同一日得到洁净。
sources:
  - 《马加比一书》1:20–64
  - 《马加比二书》5:11–6:11
  - 《但以理书》11:31
  - 约瑟夫斯《犹太古史》卷 12 第 5 章第 4 节 https://penelope.uchicago.edu/josephus/ant-12.html
