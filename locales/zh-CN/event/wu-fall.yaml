name: 晋灭吴
summary: 公元 279 至 280 年，晋军分六路南下灭吴，孙皓投降，三国分立的局面结束。
body: |-
  晋朝建立后，镇守襄阳的羊祜长期筹划灭吴。他在边境屯田积粮，对吴国军民施以恩信，并上疏请求出兵，朝中贾充等大臣反对，没有实行。咸宁四年（公元 278 年）羊祜病重，举荐杜预接替自己。在长江上游，益州刺史王濬奉命建造大型战船，训练水军。吴国方面，孙皓为政暴虐，名将陆抗已在 274 年去世。

  据《晋书·武帝纪》和有关各传，咸宁五年（279 年）十一月，晋武帝在杜预、王濬、张华等人的推动下下令伐吴，出动二十多万人，分六路进攻：东面司马伷、王浑两路指向建业对岸；中路王戎、胡奋进攻武昌、夏口；杜预从襄阳南下江陵；王濬、唐彬率水军从蜀地顺长江东下。

  太康元年（280 年）正月起各路同时推进。吴军在长江西陵峡一带用铁链横截江面，并在水下暗置铁锥以阻挡战船。王濬事先得知，用大木筏开路带走铁锥，用火炬烧熔铁链，于二月攻克西陵，一路东下。杜预攻占江陵后，有人提议等到冬天再进兵，杜预说现在军威已振，“譬如破竹，数节之后，皆迎刃而解”，成语“势如破竹”出于此。长江中游的城镇相继投降。在东线，吴国丞相张悌率三万人渡江迎战王浑，兵败战死。

  三月，王濬的船队到达建业。《晋书》说他有士卒八万，战船前后相接百里。吴军望风而散，孙皓反绑双手、带着棺木到王濬军前投降。《三国志》裴松之注引《晋阳秋》记载，晋朝接收吴国的户籍，有户五十二万三千，男女二百三十万口，兵二十三万。

  从东汉末年群雄割据算起，分裂持续了约九十年，至此全国重新统一于晋。但统一只维持了三十多年：晋武帝死后宗室诸王相攻，北方各族起兵，公元 316 年西晋灭亡，中国进入更长时期的南北分立。
sources: []
recalled:
  - 《晋书·武帝纪》
  - 《晋书·羊祜杜预传》《王濬传》
  - 《三国志·吴书·三嗣主传》及裴松之注
