name: 钟相、杨幺起义
summary: 1130 年钟相在洞庭湖一带起义，号召“等贵贱，均贫富”，后被岳飞镇压。
body: |-
  钟相是鼎州武陵（今湖南常德）人，长期以宗教结社聚众，据记载他宣称“法分贵贱贫富，非善法也，我行法，当等贵贱，均贫富”。建炎四年（公元 1130 年）二月，金军南侵、溃兵和盗贼横行，钟相趁机起兵，自称楚王，杀官吏、焚官府，鼎州、澧州、潭州等地很多人响应。不久他被降宋的游寇孔彦舟袭杀。

  钟相死后，杨幺（本名杨太，因年少被称为“幺”）等人继续在洞庭湖区坚持，他们依托湖港修筑水寨，农时耕种，闲时作战，使用以人力踏动轮桨的车船，多次击败前来镇压的官军，一度与伪齐联络。绍兴五年（1135 年）宋廷派岳飞率军镇压。岳飞先招降了义军中的黄佐、杨钦等人，又利用湖水退落的时机，在湖中投放草木阻塞车船的轮桨，攻破水寨，杨幺被杀。岳飞收编了义军的大批部众，实力因此大增。钟相、杨幺本站没有单列人物。
sources: []
recalled:
  - 《宋史·岳飞传》
  - 鼎澧逸民《杨幺事迹》
  - 《建炎以来系年要录》
