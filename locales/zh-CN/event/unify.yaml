name: 秦灭六国
summary: 公元前 230 年至前 221 年，秦先后灭韩、赵、魏、楚、燕、齐，统一天下。
body: |-
  战国后期秦国已是七国中最强的一国。秦王政亲政后，用李斯、尉缭等人之策，一面以财物离间各国君臣，一面派兵逐一攻取。

  据《史记·秦始皇本纪》，秦王政十七年（公元前 230 年）内史腾攻韩，俘韩王安，以其地为颍川郡。十九年（前 228 年）王翦等攻取赵地，俘赵王迁，赵公子嘉逃到代地自立为代王。二十年燕太子丹派荆轲刺秦王未成，秦发兵攻燕，次年取蓟城，燕王退保辽东。二十二年（前 225 年）王贲引河水灌大梁，魏王请降。伐楚之役，《白起王翦列传》记李信先率二十万人失利，王翦改率六十万人出征；二十四年（前 223 年）楚亡（《本纪》与《楚世家》《六国年表》所记俘楚王负刍和项燕之死的先后略有出入）。二十五年王贲攻辽东，俘燕王喜，回师俘代王嘉。二十六年（前 221 年）王贲自燕地南下攻齐，俘齐王建。

  六国既灭，秦王改称“皇帝”，自号始皇帝；不行分封，分天下为三十六郡，郡置守、尉、监；收缴民间兵器，统一法度、度量衡和文字。
sources:
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
  - 《史记·白起王翦列传》 https://zh.wikisource.org/wiki/史記/卷073
  - 《史记·六国年表》 https://zh.wikisource.org/wiki/史記/卷015
