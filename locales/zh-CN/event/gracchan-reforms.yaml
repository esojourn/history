name: 格拉古改革
summary: 格拉古兄弟先后以保民官身份推行分地、供粮等改革，都以流血告终。
body: |-
  公元前 133 年至前 121 年，保民官提比略·格拉古和盖乌斯·格拉古兄弟先后推行的改革，以及由此引发的两次流血冲突。

  罗马在征服意大利时没收的土地成为公有地，名义上任何公民可以占用并缴租，实际上大片落入富人手中，用战争带来的奴隶耕种放牧。服役的小农常年在海外作战，许多人失去土地，而当时只有有产者才能应征入伍。阿庇安和普鲁塔克都把这说成改革的起因；小农究竟衰落到什么程度，现代学者有争论。

  前 133 年提比略任保民官，提出土地法：个人占有公有地以五百尤格拉为限，每个儿子另加二百五十，超出的收回，分给无地公民，不得转卖。同僚屋大维乌斯否决，提比略让大会罢免了他；法案通过后设三人委员会执行。他又提议动用帕加马国王的遗产资助分地，并竞选连任。选举日元老西庇阿·纳西卡带人冲进会场，提比略和三百多名支持者被打死。委员会仍继续工作。分地触及意大利同盟者占用的土地，前 129 年小西庇阿出面为他们说话，委员会的裁断权被拿走，不久小西庇阿在家中猝死。

  前 123 年至前 122 年盖乌斯连任保民官，改革的范围大得多：低价供应粮食，建立殖民地，修路，改由骑士担任勒索案法庭的陪审员，并提议给拉丁人公民权、给同盟者拉丁权。元老院支持另一名保民官以更优厚的许诺拆台。前 121 年围绕迦太基殖民地发生冲突，元老院第一次通过“最终决议”，执政官奥皮米乌斯攻下阿文提诺山，盖乌斯自尽，据普鲁塔克，三千人被处死。

  土地法在此后十年间被逐步抽空，前 111 年的法律把已占的公有地变成私产；粮食供应、骑士陪审和殖民保留了下来。更深远的是先例：保民官可以绕开元老院直接立法，元老院可以用武力对付公民。后来的罗马作家把这看作共和国走向内战的起点。
sources: []
recalled:
  - 普鲁塔克《提比略·格拉古传》《盖乌斯·格拉古传》
  - 阿庇安《内战史》卷一第 7—27 章
  - 李维《建城以来史》卷五十八至卷六十一摘要
  - 前 111 年土地法铭文
