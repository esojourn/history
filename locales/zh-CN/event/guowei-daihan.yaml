name: 郭威代汉
summary: 950 年汉隐帝屠郭威全家，郭威起兵入开封，次年称帝建立后周。
body: |-
  后汉隐帝刘承祐即位后，朝政掌握在杨邠、史弘肇、王章等大臣手中，枢密使郭威出镇邺都，统率河北诸军防御契丹。刘承祐年岁渐长，不满大臣专权，身边的亲信也不断挑拨。

  乾祐三年（公元 950 年）十一月，刘承祐在宫中埋伏甲士，杀死了杨邠、史弘肇、王章，并诛灭他们的家族；又派使者去邺都密令诛杀郭威，同时把郭威留在开封的家属全部杀死。郭威得知消息后，在部下的拥戴下以“清君侧”为名起兵南下。刘承祐亲自出城迎战，在开封城北的刘子陂兵败，部众溃散，他在逃跑中被身边的人杀死。此时已是公历 951 年初。郭威率军进入开封，军士在城中大肆抢掠，次日才被制止。

  郭威进城后，起初以太后的名义宣布迎立刘知远的侄子、刘崇的儿子刘赟为帝。不久北方传来契丹入侵的消息，郭威率军北上，走到澶州时，据《资治通鉴》，将士们撕裂黄旗披在他身上，高呼万岁，拥他为天子。郭威于是回师开封。

  广顺元年（951 年）正月，郭威在开封即皇帝位，国号周，史称后周。刘赟在途中被废，不久被杀。刘崇则在太原称帝，与后周对抗（另见“北汉建立”条）。九年之后，后周的禁军统帅赵匡胤以几乎相同的方式在陈桥驿被部下拥立为帝（另见“陈桥兵变”条）。
sources: []
recalled:
  - 《旧五代史·周书·太祖纪》
  - 《新五代史·周本纪·太祖》
  - 《资治通鉴》卷二百八十九至二百九十
