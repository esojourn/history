name: 开禧北伐
summary: 1206 年韩侂胄发动北伐，宋军失利，次年韩侂胄被杀，宋金订立嘉定和议。
body: |-
  宋宁宗时，韩侂胄专权，想以恢复中原建立威望。当时金朝北方受到蒙古各部的压力，内部也有灾荒和动乱，南宋有人认为是北伐的良机。韩侂胄为北伐作舆论准备，嘉泰四年（公元 1204 年）追封岳飞为鄂王，开禧二年（1206 年）追夺秦桧的王爵，改谥“缪丑”，又起用了辛弃疾等主战人士。

  开禧二年五月，宁宗下诏北伐。宋军初期有些战果，毕再遇攻下泗州，但主力很快在宿州、唐州、寿州等地相继失利。金军随即分路反攻，攻入淮南，包围襄阳、德安等地。这年年底，驻守四川的宋将吴曦暗中投降金朝，次年受金朝册封为蜀王，四川一度危急；不久吴曦被部下安丙、杨巨源等人杀死，四川才得以保全。

  北伐失败后，宋廷向金求和，金朝提出要宋交出主谋者的首级。开禧三年（1207 年）十一月，礼部侍郎史弥远与杨皇后等人密谋，在韩侂胄上朝途中将他杀死。嘉定元年（1208 年）宋金订立和约，史称“嘉定和议”：两国皇帝改为伯侄关系，宋每年给金的岁币增加为银、绢各三十万，另付犒军银三百万两（据载）；宋朝把韩侂胄和另一主战大臣苏师旦的首级用匣子送往金朝。据宋人记载，金朝后来安葬了韩侂胄的首级，给他加上“忠缪侯”的谥号，意思是忠于谋国而拙于谋身。

  开禧北伐准备不足、用人不当，失败后南宋更加衰弱。当时已经八十多岁的陆游曾作诗支持北伐，辛弃疾则对仓促用兵表示忧虑。此后史弥远专权，宋金之间的关系又因蒙古的兴起而发生变化。
sources: []
recalled:
  - 《宋史·韩侂胄传》
  - 《金史·章宗本纪》
  - 叶绍翁《四朝闻见录》
