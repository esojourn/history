name: 太建北伐
summary: 陈宣帝派吴明彻北伐，收复淮南；后进攻彭城，在吕梁被北周全歼，淮南复失。
body: |-
  北齐后主在位时朝政腐败，陈宣帝想乘机收复侯景之乱后丢失的淮南之地。太建五年（公元 573 年），他以吴明彻为都督，率军北伐。陈军渡江后攻克秦郡、历阳，进围寿阳，吴明彻筑堰拦截肥水灌城，十月攻克寿阳，擒杀北齐守将王琳。此后两年间，陈朝收复了淮南的大部分地区。

  太建九年（577 年），北周灭北齐，陈宣帝想乘北周立足未稳，夺取淮北的徐、兖等地，命吴明彻进攻彭城。吴明彻筑堰截断泗水灌城。北周派王轨率军赶到，在清水入淮的河口用铁锁连接车轮，沉入水中，截断陈军的退路。太建十年（578 年）二月，吴明彻决堰撤退，船队行至清口受阻，全军溃败，吴明彻和三万多将士被俘。

  次年，北周又派韦孝宽等人南攻，到年底，长江以北的淮南之地全部被北周夺去，陈朝只能退守长江。这次失败使陈朝丧失了精兵和大将，为后来隋朝灭陈创造了条件。
sources: []
recalled:
  - 《陈书·吴明彻传》
  - 《资治通鉴》卷一百七十一至一百七十三
