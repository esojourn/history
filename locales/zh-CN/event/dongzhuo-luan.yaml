name: 董卓之乱
summary: 公元 189 年董卓入雒阳废立皇帝，次年焚城西迁长安，天下由此大乱。
body: |-
  中平六年（公元 189 年）四月灵帝去世，皇子刘辩即位，何太后临朝，其兄大将军何进辅政。何进与袁绍谋划诛除宦官，太后不同意，袁绍便建议召各地将领带兵进京施加压力。八月，宦官先发制人，把何进骗入宫中杀死。袁绍等人率兵攻入宫中，见到宦官就杀，《后汉书》说死者二千余人。少帝和弟弟陈留王刘协被宦官挟持出城，流落到黄河边。

  应召而来的并州牧董卓此时赶到，把少帝迎回宫中。他带来的兵力不多，但很快吞并了何进兄弟和执金吾丁原的部队，控制了京城。九月，他废少帝，立九岁的陈留王为帝，即汉献帝，自任相国；不久何太后和废帝先后被害。袁绍、袁术、曹操等人逃出雒阳。

  初平元年（190 年）正月，关东各州郡的长官起兵讨伐董卓，推袁绍为盟主。董卓决定迁都长安。二月，他强迫雒阳及周围的居民随朝廷西迁，随后放火焚烧宫殿、官府和民居，《后汉书》说雒阳二百里内不再有人烟。关东联军各怀打算，大多按兵不动，只有曹操、孙坚等人主动进击。次年孙坚击败董卓的部将，进入已成废墟的雒阳。联军不久解散，各州郡的长官开始互相攻伐。

  初平三年（192 年）四月，司徒王允与吕布在长安合谋杀死董卓。王允拒绝赦免董卓的旧部，李傕、郭汜等人于是聚兵反攻，六月攻破长安，杀王允，吕布出逃。此后数年献帝落在李傕等人手中，朝廷不再有号令天下的能力。
sources: []
