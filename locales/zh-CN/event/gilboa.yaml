name: 基利波山之战
summary: 以色列人在基利波山败于非利士人，扫罗和约拿单等三子阵亡。
body: |-
  据《撒母耳记上》第 28—29 章，非利士人聚集军旅要与以色列人打仗，来到书念安营，扫罗聚集以色列众人在基利波安营。那时撒母耳已经去世。扫罗看见非利士的军旅就惧怕，求问耶和华，却得不到回答，于是改换衣服，夜里到隐多珥去找一个交鬼的妇人。大卫当时正寄居在迦特王亚吉那里，随亚吉出征；非利士人的首领不放心，亚吉就打发他回洗革拉去，所以他没有参加这一战。

  第 31 章记载，非利士人与以色列人争战，以色列人在基利波山被杀仆倒，其余的逃跑。非利士人紧追扫罗和他的儿子，杀了约拿单、亚比拿达、麦基舒亚三人。扫罗被弓箭手射伤，叫拿兵器的人拔刀把他刺死，免得落在未受割礼的人手里；那人不敢，扫罗就自己伏在刀上死了，拿兵器的人也伏刀而死。《撒母耳记下》第 1 章另记，一个亚玛力少年人到洗革拉向大卫报信，自称是他应扫罗的要求杀了扫罗，这与第 31 章的记述不同；大卫下令把这人杀了。

  住在平原那边和约旦河东的以色列人见军兵逃跑、扫罗父子已死，就弃城逃走，非利士人便来住在其中。次日非利士人剥那被杀之人的衣服，割下扫罗的首级，把他的军装放在亚斯他录庙里，尸身钉在伯珊的城墙上。基列雅比的勇士走了一夜，把扫罗和他儿子的尸身取回，在雅比用火烧了，将骸骨葬在垂丝柳树下，禁食七日。《历代志上》第 10 章也记有这场战事，并说扫罗的死是因为他干犯耶和华、又求问交鬼的妇人。

  大卫听到消息，为扫罗和约拿单作哀歌（撒下 1:17–27）。随后他上希伯仑，犹大人膏他作犹大家的王；扫罗的元帅押尼珥则在玛哈念立扫罗的儿子伊施波设作王，两家之间的争战持续了多年（撒下第 2—4 章）。这场战事的年份按通行的约数定在约公元前 1010 年。
sources: []
recalled:
  - 《撒母耳记上》第 28—31 章
  - 《撒母耳记下》第 1—2 章
  - 《历代志上》第 10 章
