name: 渡过卢比孔河与恺撒内战
summary: 恺撒带兵越过卢比孔河，与庞培和元老院一方交战四年，成为罗马唯一的主宰。
body: |-
  公元前 49 年至前 45 年恺撒与庞培及元老院一方之间的内战。

  起因是恺撒卸任的方式。他在高卢的任期将满，如果以私人身份回罗马，政敌已扬言要起诉他；他要求保留行省和军队，缺席竞选下一任执政官。小加图等人坚持他先交出兵权。前 50 年 12 月保民官库里奥提议恺撒与庞培同时解除兵权，据阿庇安，元老院以三百七十票对二十二票通过，被执政官搁置。前 49 年 1 月 7 日元老院通过最终决议，为恺撒说话的保民官安东尼等人逃出罗马。

  1 月 10 日前后，恺撒带一个军团渡过山南高卢与意大利之间的界河卢比孔河。据苏维托尼乌斯，他说“骰子已经掷出”。带兵越界就是叛乱。他行动极快，沿途城镇开门，在科尔菲尼乌姆俘获并释放了一批贵族，这种“宽仁”的做法是有意同苏拉区别开来。庞培的军团大多在西班牙，他放弃罗马，3 月从布伦迪西乌姆渡海去了希腊。恺撒进罗马取走国库，夏天在西班牙迫降庞培的五个军团。

  前 48 年 1 月他冒着冬季风浪渡过亚得里亚海，在迪拉基乌姆围困庞培失利，转入色萨利，8 月在法萨卢斯决战获胜。庞培逃到埃及，被托勒密十三世的廷臣杀死。恺撒追到亚历山大城，因介入王位之争被围困了一个冬天，扶立克娄巴特拉七世。前 47 年他在小亚细亚的泽拉击败本都王法尔纳凯斯，年底渡海去阿非利加。前 46 年 4 月在塔普苏斯击败梅特卢斯·西庇阿和努米底亚王尤巴，小加图在乌提卡自尽。前 45 年 3 月在西班牙的蒙达击败庞培的两个儿子，小儿子塞克斯图斯逃脱。

  战后没有公敌名单，许多对手得到赦免并出任官职。但共和国的机构已无法照旧运转：一个人掌握全部军队，连任独裁官，最后是终身。前 44 年 3 月他被刺，内战在他的继承人之间又继续了十三年。
