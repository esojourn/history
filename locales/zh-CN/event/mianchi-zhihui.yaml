name: 渑池之会
summary: 前 279 年秦赵渑池之会，蔺相如针锋相对，秦王未能占到上风。
body: |-
  公元前 279 年，秦国准备集中兵力攻楚，为稳住赵国，秦昭王约赵惠文王在渑池会面。据《史记·廉颇蔺相如列传》，赵王害怕不想去，廉颇、蔺相如认为不去会显得赵国软弱胆怯。赵王于是带着蔺相如前往，廉颇送到边境，与赵王约定，如果三十天还不回来，就请立太子为王，以断绝秦国要挟的念头。

  宴会上，秦王喝到兴头，请赵王弹瑟，赵王弹了，秦国的史官上前记下“某年月日，秦王与赵王会饮，令赵王鼓瑟”。蔺相如上前请秦王击缻，秦王不肯，蔺相如说“五步之内，相如请得以颈血溅大王矣”，秦王的侍从想杀蔺相如，蔺相如瞪眼呵斥，侍从都退了下去。秦王不得已敲了一下缻，蔺相如回头叫赵国的史官写下“某年月日，秦王为赵王击缻”。秦国群臣要赵国献十五城为秦王祝寿，蔺相如回敬请秦国献咸阳为赵王祝寿。直到宴会结束，秦国始终没能占到上风；赵国也在边境布置了重兵，秦国不敢轻举妄动。

  回国后，蔺相如被拜为上卿，位在廉颇之上，引起廉颇不满。蔺相如以国事为重，处处退让，廉颇得知后负荆请罪，二人结为刎颈之交，这就是“将相和”的故事。

  渑池在今河南渑池县西。

  此后几年秦赵之间没有发生大战。
sources: []
recalled:
  - 《史记·廉颇蔺相如列传》
