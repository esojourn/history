name: 高加米拉战役
summary: 公元前 331 年亚历山大在高加米拉决定性地击败大流士三世。
body: |-
  伊苏斯战败后，大流士三世用近两年时间从帝国东部调集军队，其中有巴克特里亚、索格底亚那和斯基泰的骑兵。公元前 331 年夏，亚历山大从埃及回师，在塔普萨库斯渡过幼发拉底河，没有顺河直下巴比伦，而是折向北面，9 月渡过底格里斯河。大流士选定底格里斯河以东的高加米拉平原等候，命人把地面铲平，以便骑兵和卷镰战车驰骋。古人也用附近的城市阿尔贝拉来称呼这一战，其实两地相距约一百公里。

  会战的日期可以确定：普鲁塔克说战前十一天发生了月食，巴比伦的天文日志也记了这次月食和随后国王军队的溃败，推算为前 331 年 10 月 1 日。兵力则难以确定。阿里安说亚历山大有步兵约四万、骑兵七千；波斯一方，阿里安所记的步兵一百万、骑兵四万显然不可信，现代的估计多在数万到十余万之间，但骑兵远多于对方是没有疑问的。大流士另有卷镰战车二百辆和十五头战象。

  据阿里安，帕曼纽建议夜袭，亚历山大说他不偷取胜利。波斯军怕遭夜袭，全副武装站了一夜。次日亚历山大为防被包抄，在方阵后面布置了第二线，两翼向后斜折，全军向右前方斜进。波斯左翼的骑兵随之向左延伸，与马其顿右翼的骑兵展开混战；卷镰战车冲来时，轻装兵用标枪射杀驭手和马匹，步兵让开通道，战车大多失去作用。波斯阵线在向左移动中出现了缺口，亚历山大率伙伴骑兵和一部分方阵排成楔形冲入，直指大流士所在的中央。大流士再次调头逃走。

  马其顿的左翼这时十分危急。帕曼纽被马扎乌斯统领的波斯右翼骑兵包抄，阵线中央被印度和波斯骑兵穿透，一直冲到后方的营地。帕曼纽派人求援，亚历山大只得放弃追击回头相救，途中与撤退的波斯骑兵遭遇，打了全天最激烈的一仗。帕曼纽那一边靠色萨利骑兵稳住了局面。

  大流士逃往米底的埃克巴坦那。马扎乌斯退入巴比伦，随后开城迎降，被亚历山大留任为巴比伦总督，这是他第一次任用波斯人治理行省。苏萨和波斯波利斯相继打开，波斯王室二百年的积蓄易手。亚历山大此后以“亚洲之王”自称。
sources: []
