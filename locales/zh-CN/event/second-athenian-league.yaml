name: 第二次雅典海上同盟
summary: 雅典联合爱琴海各邦结成新的同盟以对抗斯巴达，并承诺不再重蹈提洛同盟的覆辙。
body: |-
  公元前 378 年，斯巴达将领斯福德里亚斯偷袭比雷埃夫斯未遂而被判无罪，雅典与斯巴达决裂。雅典已同希俄斯、拜占庭、罗得岛、米提利尼等邦订有盟约，这时把这些双边盟约扩大为一个同盟，底比斯也加入进来。

  前 377 年初，公民大会通过由阿里斯托特勒斯提议的法令，邀请各邦入盟，刻有这道法令的石碑在雅典出土，是了解这个同盟的主要依据。法令宣布同盟的目的是让斯巴达人听任希腊人自由自治，并遵守“大王和约”，所以不触动属于波斯国王的亚洲城邦。针对前一个世纪提洛同盟变成“雅典帝国”的教训，法令保证：盟邦保有自己选择的政体，不接受驻军和雅典派去的长官，不缴纳贡金；雅典人不论公家私人，都不得在盟邦境内占有土地房屋。同盟事务由两个机构共同决定，一个是设在雅典的盟邦代表会议，每邦一票，雅典不在其中，另一个是雅典的公民大会。碑上陆续刻入的成员有五十多个，狄奥多罗斯说最多时达七十个。

  前 376 年卡布里亚斯在纳克索斯外海击败斯巴达舰队，前 375 年提摩透斯又在西面取胜，雅典重新成为海上的头号强国。但同盟的经费始终不足，“贡金”改了个名字叫“摊派”照样征收。留克特拉之战后斯巴达不再是威胁，底比斯反成了对手并退出同盟；雅典则在萨摩斯等地重新安置移民，引起盟邦疑惧。

  前 357 年，希俄斯、罗得岛、科斯和拜占庭在卡里亚总督摩索拉斯的支持下脱离同盟，史称“同盟战争”。雅典在恩巴塔海战失利，波斯又以参战相威胁，前 355 年只得承认这些城邦独立。同盟名存实亡，前 338 年喀罗尼亚之战后由腓力二世解散。
sources: []
