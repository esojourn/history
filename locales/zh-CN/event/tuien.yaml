name: 推恩令
summary: 汉武帝采纳主父偃的建议，准许诸侯王把封地分给所有子弟，王国因此越分越小。
body: |-
  汉初分封的诸侯王国地域广大，自设官吏，是朝廷的隐患。文帝时贾谊提出多立诸侯以分散其力量，景帝时晁错主张直接削减封地，引发了吴楚七国之乱。叛乱平定后，王国的行政权收归朝廷任命的官员，但一些大国仍然连城数十。

  据《史记·平津侯主父列传》，主父偃向武帝指出：强行削地容易激起反抗；诸侯王的子弟多则十几人，却只有嫡长子能继承王位，其余的人没有尺寸之地。如果让诸侯王把恩泽推及所有子弟，分地给他们为侯，人人都会高兴，而王国实际上被分割，不必削夺就自然衰弱。元朔二年（公元前 127 年）正月，武帝下诏：诸侯王愿意把封邑分给子弟的，可以逐条上报，由朝廷确定封号。

  新分出的侯国不再属于原来的王国，而归所在的郡管辖。《汉书·王子侯表》所列武帝一朝受封的王子侯有一百多人。大的王国由此分成许多小侯国，朝廷直辖的郡则相应扩大。

  此后朝廷又用其他办法削弱诸侯。淮南王、衡山王谋反案后，朝廷颁布了限制士人到王国任职和与诸侯交结的法令。元鼎五年（前 112 年），武帝以列侯进献助祭的黄金分量不足或成色不好为由，一次夺去一百零六人的爵位。到西汉后期，诸侯王只能收取封地的租税，不能过问政事，汉初以来王国威胁朝廷的局面不再出现。
