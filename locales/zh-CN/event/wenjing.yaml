name: 文景之治
summary: 汉文帝、景帝两朝约四十年间减轻租税和刑罚，社会经济得以恢复。
body: |-
  指汉文帝（公元前 180—前 157 年在位）、景帝（前 157—前 141 年在位）两朝。秦末战乱之后，汉初经济凋敝，据《汉书·食货志》，高祖时已“轻田租，什五而税一”。文帝、景帝延续与民休息的做法。《汉书·景帝纪》的赞语说“周云成康，汉言文景”，“文景”并称由此而来。

  田租方面，据《汉书·文帝纪》，文帝二年、十二年两次只收当年田租的一半，十三年下诏免除田租；《食货志》说十三年之后的景帝二年“令民半出田租，三十而税一”，《景帝纪》则把“令田半租”记在景帝元年。文帝还采纳晁错的建议，让百姓向边塞输送粮食以换取爵位。刑罚方面，文帝废除连坐收孥的律令和诽谤、妖言之罪，十三年废除肉刑；景帝又下诏减轻笞刑。

  关于其结果，《史记·平准书》说，到武帝即位数年、汉兴七十余年时，如果不遇水旱，百姓家给人足，城乡仓库都是满的；“京师之钱累巨万，贯朽而不可校；太仓之粟陈陈相因，充溢露积于外，至腐败不可食”。同篇也指出，当时法网宽疏而民间富足，出现了豪强兼并、在乡里横行的现象。这一时期并非没有动荡：匈奴多次入边，景帝三年还发生了七国之乱。
sources:
  - 《史记·平准书》 https://ctext.org/shiji/ping-zhun-shu/zhs
  - 《汉书·食货志》 https://ctext.org/han-shu/shi-huo-zhi/zhs
  - 《汉书·文帝纪》 https://ctext.org/han-shu/wen-di-ji/zhs
