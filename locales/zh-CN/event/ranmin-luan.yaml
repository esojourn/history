name: 后赵灭亡与冉魏兴亡
summary: 石虎死后诸子争位，冉闵夺权并屠杀胡羯，建立冉魏，北方混战，前燕、前秦乘势而起。
body: |-
  太宁元年（公元 349 年）四月石虎去世，他的几个儿子在一年之内相继被立又相继被杀。养孙石闵手握兵权，先后废立了石遵、石鉴。邺城中的羯人和其他胡人屡次图谋除掉他，他下令鼓励赵人捕杀胡人，据《晋书·载记》，死者二十余万。永和六年（350 年）他称帝，国号魏，恢复本姓冉。

  石虎的儿子石祗在襄国称帝，与冉闵对抗，原属后赵的各支力量纷纷自立：氐人首领苻洪、苻健父子率部西归，苻健于永和七年在长安建立前秦；羌人姚弋仲父子南下归附东晋；辽西的前燕挥师南进。冉闵与石祗连年交战，载记说从河北到中原的道路上盗贼横行，饥荒严重，当年被后赵强迁到河北的各州百姓和各族部落数百万人争相返回故乡，路上互相杀掠，能够到达的只有十分之二三。

  永和七年冉闵攻灭石祗，后赵亡。次年他与南下的前燕军决战，被慕容恪击败擒杀，邺城陷落，冉魏立国不足三年。东晋曾想乘乱北进，殷浩的北伐没有成果。此后北方形成前燕据关东、前秦据关中的局面。
sources: []
recalled:
  - 《晋书·石季龙载记》
  - 《晋书·慕容儁载记》
  - 《资治通鉴》卷九十八、九十九
