name: 雕版印刷九经
summary: 932 年冯道等奏请国子监校刻九经，历经四朝至 953 年完成。
body: |-
  唐代后期，民间已经用雕版印刷历书、字书和佛经，但儒家经典仍然靠手抄或刻在石碑上流传。据《五代会要》等记载，后唐长兴三年（公元 932 年），宰相冯道、李愚奏请由国子监以唐代的开成石经为底本，校定《九经》的文字，雕版印刷，颁行天下，后唐明宗批准了这一请求。

  这项工程规模很大，需要逐字校勘经文和注释，再请工匠书写、雕刻。其间经历了后唐、后晋、后汉三个朝代的更替，主持者也几经变换，一直到后周广顺三年（953 年）才全部完成，由国子监祭酒田敏进呈，共刻成《九经》以及《五经文字》《九经字样》等，一百三十册（据《五代会要》）。这批刻本后世称为“五代监本”，原本已经失传。

  与此同时，后蜀的宰相毋昭裔也出资刻印了《文选》《初学记》等书，又主持刊刻了儒家经典的石经，世称“蜀石经”。据宋人记载，毋昭裔年轻时贫穷，向人借书遭到拒绝，因此发愿日后显达要刻书供学者使用。

  五代监本是中国第一次由官方组织大规模雕印儒家经典。此后书籍的刊印逐渐普及，北宋的国子监继续刻印经史，使书籍的价格降低，读书人更容易得到书本，对宋代文化教育的繁荣有重要影响。
sources: []
recalled:
  - 《五代会要》卷八
  - 《旧五代史·唐书·明宗纪》
  - 王明清《挥麈录》
