name: 松锦之战
summary: 1640—1642 年清军围攻锦州，击溃明朝援军，洪承畴被俘投降。
body: |-
  崇祯十三年（1640 年）皇太极派兵在锦州附近的义州屯田，逐步对锦州实行包围，锦州守将祖大寿向朝廷求援。崇祯帝命蓟辽总督洪承畴率领八位总兵、十几万人马（据《明史》为十三万）出关救援。

  崇祯十四年（1641 年）七月，洪承畴进驻锦州以南的松山。他原本主张稳扎稳打，但兵部尚书陈新甲和崇祯帝催促他速战。八月，皇太极从盛京亲率大军赶到，在松山与杏山之间挖掘长壕，截断明军的粮道。明军军心动摇，诸将商议突围，大同总兵王朴等人当夜先行逃跑，各部随即溃散，被清军沿路截杀，损失惨重。洪承畴率领残部退入松山城中坚守。

  崇祯十五年（1642 年）二月，松山城中副将夏承德献城投降，洪承畴被俘，后来投降清朝。三月，被围一年多、城中粮尽的锦州守将祖大寿出城投降，随后塔山、杏山也被清军攻占。

  松锦之战后，明朝在关外只剩下宁远等少数城池，由吴三桂驻守，精锐部队损失殆尽，山海关以外的防线基本瓦解。崇祯帝起初以为洪承畴已经殉国，还为他设坛祭奠，后来得知他投降，十分愤怒。

  松锦之战还反映出明朝朝廷在战略上的反复。洪承畴本想步步为营、以守为战，朝廷却因财政困难，急于求胜，催促他进兵，这被许多史家认为是失败的重要原因。
sources: []
recalled:
  - 《明史·洪承畴传》
  - 《清太宗实录》
  - 《明史·庄烈帝本纪》
