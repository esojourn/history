name: 第一次布匿战争
summary: 罗马与迦太基争夺西西里。罗马获胜，从此成为海上强国。
body: |-
  公元前 264 年，占据西西里岛墨西拿的一支雇佣兵“马麦尔提尼人”受叙拉古围攻，先后向迦太基和罗马求援，罗马出兵渡海，两国由此开战。次年叙拉古王希耶隆二世转而与罗马结盟，前 262 年罗马攻下迦太基在岛上的据点阿格里真托。

  迦太基掌握着制海权。据波利比乌斯，罗马人以一艘搁浅的迦太基战舰为样本造出一百艘五列桨舰，又在船头加装称为“乌鸦”的接舷吊桥，前 260 年在米莱海战中取胜。前 256 年罗马远征非洲，次年执政官雷古卢斯兵败被俘。此后罗马舰队几次毁于风暴，前 249 年又在德雷帕纳战败，战事在西西里西部僵持，哈米尔卡自前 247 年起在那里统兵。

  前 241 年罗马的新舰队在埃加特斯群岛截击迦太基的运输船队获胜，迦太基求和。和约规定迦太基撤出西西里，十年内赔款三千二百塔兰特。波利比乌斯说这场战争前后二十四年，是他所知持续最久的一场。西西里除叙拉古的领地外归罗马管辖，后来成为罗马的第一个海外行省。
sources:
  - 波利比乌斯《历史》卷一第 7—64 章（造舰与“乌鸦”见第 20—23 章，和约见第 62—63 章） https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/1*.html
  - 英文维基百科“First Punic War”（核对年份） https://en.wikipedia.org/wiki/First_Punic_War
