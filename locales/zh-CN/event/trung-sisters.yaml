name: 二征起事与马援南征
summary: 公元 40 年交趾的征侧、征贰姐妹起兵，占据岭南六十余城，三年后被马援平定。
body: |-
  交趾郡在今越南北部，自汉武帝灭南越后归汉朝管辖。据《后汉书·南蛮西南夷列传》，征侧是交趾麊泠县一位雒将的女儿，嫁给朱鸢县人诗索，为人雄勇。交趾太守苏定用法令约束她，征侧愤而反抗。建武十六年（公元 40 年）二月，她与妹妹征贰起兵，九真、日南、合浦各郡的居民纷纷响应，攻占六十五座城，征侧自立为王。交趾刺史和各郡太守只能勉强自守。

  光武帝下令长沙、合浦、交趾等郡准备车船、修路架桥、储备粮食。建武十八年（42 年），他任马援为伏波将军，以刘隆为副，率军一万余人南下。汉军沿海岸行进，遇山开路一千多里，在浪泊击败对方，一路追击。建武十九年（43 年），马援擒斩征侧、征贰，把首级送往雒阳；随后继续进兵九真，肃清余部。越南后世的史书另有二征兵败后投水自尽的说法。

  据《后汉书·马援传》，马援在所过之处修治城郭，开渠灌溉，并上奏说当地旧有的法令与汉律不同的有十多处，于是与当地人申明旧制加以约束。此后交趾仍归汉朝郡县管辖。在越南，征氏姐妹被尊为“征女王”（二征夫人），历代立祠祭祀，视为抗击外来统治的象征。
sources: []
recalled:
  - 《后汉书·南蛮西南夷列传》
  - 《后汉书·马援列传》
