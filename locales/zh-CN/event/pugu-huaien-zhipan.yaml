name: 仆固怀恩之叛
summary: 功臣仆固怀恩受猜疑而反叛，引回纥、吐蕃入侵，郭子仪说服回纥化解危机。
body: |-
  仆固怀恩在平定安史之乱中立有大功，家族中多人战死。广德元年（公元 763 年）他护送回纥可汗回国，路过太原，河东节度使辛云京怀疑他与回纥勾结，闭城不出，也不犒劳军队。监军宦官骆奉仙随后向朝廷告他谋反。他上书自辩，列举自己的功劳，请求诛杀辛云京、骆奉仙，朝廷两边调和，召他入朝，他担心被害，拒不入朝。

  广德二年（764 年）正月，他派儿子仆固玚进攻太原，没有攻下，仆固玚在军中被部下所杀。唐代宗任命郭子仪为朔方节度大使，郭子仪到达汾州后，仆固怀恩的部下大多归附郭子仪，他只带了少数人逃往灵州。同年秋天他引回纥、吐蕃军队入侵，进逼奉天，被郭子仪劝退。

  永泰元年（765 年）九月，他再次引回纥、吐蕃、吐谷浑、党项等军队，据《资治通鉴》，号称数十万，分路进攻关中，长安震动。不久他在进军途中病死于鸣沙。回纥和吐蕃失去统帅，互相争夺领导权。郭子仪当时在泾阳，据《资治通鉴》，他只带了几十名骑兵到回纥营中，回纥首领药葛罗见到他后下马拜见，双方重新结盟。随后唐军和回纥兵在灵台西原大破吐蕃军，危机得以化解。
sources: []
recalled:
  - 《旧唐书·仆固怀恩传》
  - 《旧唐书·郭子仪传》
  - 《资治通鉴》卷二百二十二至二百二十三
