name: 盘庚迁殷
summary: 商王盘庚把都城迁到殷，此后两百多年不再迁都；断代工程定在约前 1300 年。
body: |-
  商朝前期屡次迁都。据《史记·殷本纪》，自中丁以后王位继承混乱，“比九世乱”，商朝衰落，都城也几经迁徙。盘庚即位后决定再次迁都，贵族和民众多不愿意，《尚书·盘庚》三篇就是他在迁都前后劝告、训诫臣民的言辞。

  迁到哪里，古书说法不同。《竹书纪年》佚文说盘庚“自奄迁于北蒙，曰殷”，并说从盘庚迁殷到纣灭亡，二百七十三年不再迁都。《史记》则说盘庚渡河南下，回到成汤的故居。今天多数学者采用《竹书纪年》的说法，认为殷就在今河南安阳；商朝因此也被称为“殷”或“殷商”。

  安阳殷墟自 1928 年开始科学发掘，发现了宫殿宗庙区、王陵区和大量甲骨卜辞、青铜器，证实了商代晚期的都城就在这里。不过，殷墟甲骨最早属于武丁时期，盘庚所迁的都城是否就是小屯一带，还是稍早的洹北商城，学界仍有讨论。夏商周断代工程把盘庚迁殷定在约公元前 1300 年。

  殷墟遗址面积约三十多平方公里，分布着宫殿宗庙基址、王陵大墓、手工业作坊和居民区，2006 年被列入世界文化遗产。

  殷墟出土的后母戊鼎（旧称司母戊鼎）重八百多公斤，是迄今出土最重的商代青铜器，反映了当时青铜铸造的高超水平。
sources: []
recalled:
  - 《史记·殷本纪》
  - 《尚书·盘庚》
  - 《竹书纪年》（佚文）
