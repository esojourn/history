name: 川楚白莲教起义
summary: 1796 年起湖北、四川、陕西等地的白莲教起义，持续九年才被平定。
body: |-
  乾隆后期，人口迅速增长，大批流民涌入湖北、四川、陕西交界的南山老林地区开荒谋生，生活困苦，官府的盘剥又十分严重。白莲教在这一地区秘密传播，宣扬“弥勒转世”，吸引了大量信徒。乾隆末年清朝大规模搜捕白莲教徒，地方官借机勒索，民怨沸腾。

  嘉庆元年（1796 年）正月，湖北枝江、宜都一带的白莲教徒首先起事，随后襄阳的王聪儿（齐林的妻子）、姚之富等人起兵，四川达州的徐天德、东乡的王三槐等人也相继响应，起义迅速蔓延到湖北、四川、陕西、河南、甘肃五省。起义军分成许多支，没有统一的指挥，采取流动作战的方式，在山区与清军周旋。嘉庆三年（1798 年）王聪儿在湖北郧西被清军围困，跳崖而死。

  清军的八旗、绿营军纪败坏，将领虚报战功、冒领军饷，和珅从中谋利，战事久拖不决。嘉庆四年（1799 年）嘉庆帝亲政，诛杀和珅，整顿军务，任用勒保、额勒登保、德楞泰等人，推行“坚壁清野”，修筑寨堡，把百姓集中到寨堡中，切断起义军的人员和粮食来源，同时大量招募乡勇作战。到嘉庆九年（1804 年），起义被镇压下去。

  这次起义历时九年，波及五省，据记载清朝耗费军费二亿两白银，相当于当时数年的财政收入。战争中暴露了八旗、绿营的腐朽，乡勇和团练的作用开始凸显。川楚白莲教起义被看作清朝由盛转衰的标志之一。
sources: []
recalled:
  - 《清仁宗实录》
  - 魏源《圣武记·嘉庆川湖陕靖寇记》
  - 《剿平三省邪匪方略》
