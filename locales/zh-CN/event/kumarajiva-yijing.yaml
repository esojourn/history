name: 鸠摩罗什长安译经
summary: 鸠摩罗什在后秦姚兴支持下主持长安译场十余年，系统译出大乘经论，影响深远。
body: |-
  从东汉末年起，来到中原的西域僧人陆续把佛经译成汉文。早期的翻译多由外来僧人口诵、汉人笔录，译者往往只通一种语言，又常借用老庄的词语来比附佛教的概念，译文或晦涩难懂，或与原意出入很大。道安晚年在长安主持译事，已深感旧译不足，听说龟兹的鸠摩罗什精通大乘，力劝苻坚迎请。苻坚的军队攻下龟兹时，前秦已经崩溃，罗什被吕光带到凉州，一住十六七年。

  后秦弘始三年（公元 401 年）十二月，姚兴把罗什迎到长安。姚兴本人信佛，为他在城北的逍遥园设立译场，后来又在长安大寺译经，并命僧人数百人随他受学，协助翻译。四方的僧人闻风而来，据《高僧传》，聚集在长安的有三千人。这是中国第一个由国家出资、有明确分工的大型译场。

  翻译时，罗什手持梵文或西域文的原本，先口头译成汉语，并讲解其中的意思；在场的僧人提出疑问，反复讨论，再由弟子写定，同时对照旧译，改正讹误。罗什主张译文应当传达原文的意旨和语气，不必逐字对应，对冗长重复的地方有所删节，所以他的译本文辞流畅，便于诵读。

  十余年间译出的经典大致有几类：般若类的《大品般若经》《小品般若经》《金刚般若经》；《妙法莲华经》《维摩诘所说经》《阿弥陀经》等流传最广的大乘经；龙树、提婆一系的《中论》《百论》《十二门论》和《大智度论》；以及《成实论》《十诵律》和禅法方面的著作。龙树的中观学说由此第一次完整地传入中国。

  他门下人才很多，僧肇、僧叡、道生、道融被称为“四圣”。僧肇写的《物不迁论》《不真空论》等，用汉语阐发中观思想，后来合编为《肇论》。庐山的慧远多次致书请教，两人的问答也保存了下来。

  罗什去世后，长安因后秦灭亡和战乱而衰落，他的弟子散往各地，把所学带到江南和北方。后来的三论宗、成实学派、天台宗、净土信仰所依据的主要经典，多是他的译本。
sources: []
