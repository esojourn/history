name: 蒙古第二次西征
summary: 1235 年起拔都率各支宗室长子西征，征服钦察和罗斯，攻入波兰、匈牙利。
body: |-
  1235 年窝阔台在哈拉和林召开大会，决定同时进攻南宋和西方的钦察、罗斯等地。西征军以术赤的儿子拔都为统帅，名将速不台辅佐，成吉思汗各支后裔都派长子参加，如窝阔台的长子贵由、拖雷的长子蒙哥等，所以又称“长子西征”。

  1236 年蒙古军攻灭伏尔加河中游的保加尔，随后击败钦察诸部。1237 年冬起，蒙古军利用冬季河流封冻的时机进攻罗斯，攻破梁赞、弗拉基米尔等城，1238 年在锡季河畔击败弗拉基米尔大公的军队。1239 年至 1240 年蒙古军转向南罗斯，1240 年十二月攻陷基辅，城市遭到严重破坏。

  1241 年蒙古军分兵进入波兰和匈牙利。一路在西里西亚的莱格尼察击败波兰、日耳曼等地骑士的联军，西里西亚公亨利二世战死；主力在匈牙利的赛约河畔大败匈牙利国王贝拉四世的军队，随后攻下佩斯，前锋追击贝拉四世一直到达亚得里亚海沿岸。欧洲各国大为震动。

  这时窝阔台去世的消息传来，拔都于 1242 年下令撤军东返。他没有回蒙古，而是留在伏尔加河下游建立萨莱城，统治钦察草原和罗斯诸公国，史称钦察汗国或金帐汗国，罗斯各公国此后向金帐汗国称臣纳贡两百多年。1245 年罗马教宗派方济各会士柏朗嘉宾出使蒙古，这是欧洲与蒙古直接交往的开端。
sources: []
recalled:
