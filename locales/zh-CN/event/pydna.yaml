name: 彼得那战役
summary: 马其顿战败亡国。千名希腊人被送往罗马作人质，波利比乌斯在内。
body: |-
  第三次马其顿战争打到第四年，公元前 168 年罗马执政官埃米利乌斯·保卢斯接掌指挥，迫使国王珀尔修斯退到马其顿南部海岸的彼得那附近。据李维和普鲁塔克，交战前一夜发生了月食；现代学者据此把战役定在这一年的 6 月 22 日。

  战斗在午后由一场小冲突引起，普鲁塔克记了两种说法：一说罗马人追赶一匹放出去的无缰之马而与敌军相撞，一说色雷斯人袭击了罗马运草料的牲口。马其顿方阵在平地上推进，罗马前列抵挡不住；埃米利乌斯·保卢斯后来说，他从没见过比这更可怕的景象。方阵追到起伏不平的地面，队列出现缺口，他下令各中队分头楔入，短剑近战之下方阵瓦解。普鲁塔克说胜负在一小时之内就决定了。马其顿的损失，李维说两万人战死、约一万一千人被俘，普鲁塔克说战死超过两万五千人；两人都说罗马阵亡不过百人上下。

  珀尔修斯逃到萨莫色雷斯岛后投降。前 167 年罗马废除马其顿王权，把它分成四个互不相属的共和国；约一千名亚该亚人被押往意大利，波利比乌斯在其中。二十年后马其顿成为罗马行省。
sources:
  - 普鲁塔克《埃米利乌斯传》第 16—29 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Aemilius*.html
