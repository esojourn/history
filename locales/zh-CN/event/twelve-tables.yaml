name: 十二表法
summary: 罗马最早的成文法，相传由十人委员会在公元前 451—前 450 年编成。
body: |-
  罗马最早的成文法，传统上定在公元前 451 年至前 450 年编成。此前法律和诉讼的程式由贵族祭司掌握，平民无从知道。据李维，保民官从前 462 年起提议编订成文法，争执了十年；传说罗马还派使团去雅典抄录梭伦的法律，这一点学者多有怀疑，法律中的希腊影响更可能来自意大利南部的希腊城市。

  前 451 年，执政官和保民官都停选，由十名贵族组成委员会全权执政并立法，阿庇乌斯·克劳狄乌斯为首。他们拟出十表法律，经百人队大会通过。次年第二届委员会补了两表。据传说，这届委员会任满不肯交权，阿庇乌斯又因霸占少女维吉尼娅激起公愤，平民再次撤离，委员会垮台。前 449 年新任执政官把十二表法刻在铜板（一说木板）上，立在广场。

  法律原文没有完整流传，现在所知的一百多条残文出自西塞罗、格利乌斯、盖尤斯等人的引述，编排次序是近代学者推定的。内容大多是民事规则：传唤被告和审判的程序；债务人逾期不还，债主可以拘禁他，最后可以卖到台伯河以外或处死；父亲对子女有生杀之权，三次出卖儿子则儿子脱离父权；继承、地界和邻里关系；伤人肢体而不和解的，同态报复；夜间行窃者可当场杀死；禁止在城内埋葬和火化；死刑案件须由百人队大会审理。后补的两表里有禁止贵族与平民通婚的条款，前 445 年被卡努勒乌斯法废除。

  十二表法并没有给平民多少新的权利，重要的是规则从此公开，长官不能任意解释。西塞罗说他小时候学童还要背诵它；李维称它为一切公法和私法的源头。此后一千年罗马法的发展，名义上都以它为起点。
sources: []
recalled:
  - 李维《建城以来史》卷三第 31—57 章
  - 西塞罗《论法律》卷二、《论共和国》卷二
  - 格利乌斯《阿提卡之夜》卷二十第 1 章
  - 盖尤斯《法学阶梯》所引十二表法条文
