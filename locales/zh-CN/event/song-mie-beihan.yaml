name: 宋灭北汉
summary: 979 年宋太宗亲征太原，北汉刘继元投降，五代十国以来的分裂局面结束。
body: |-
  北汉据有河东，都城在太原，是后汉高祖刘知远之弟刘崇在后周建立时所建，长期依靠辽朝的支持与中原王朝对抗，向辽称侄、称儿（另见“北汉建国”条）。北汉地狭民贫，却控制着太行山以西的要地，对开封构成威胁。后周世宗、宋太祖都曾攻打太原，开宝二年（969 年）赵匡胤亲征，引汾水灌城，仍因城池坚固、辽朝援兵到来和军中疾疫而没有成功。

  太平兴国四年（公元 979 年）正月，宋太宗决定亲征北汉，命潘美为北路都招讨，率诸将围攻太原，又派郭进在石岭关一带阻击辽朝援军。三月，郭进在白马岭击败南下救援的辽军。四月，太宗亲自到达太原城下督战，宋军四面围攻，城中粮尽援绝。五月，北汉末主刘继元出城投降，北汉灭亡。北汉的大将杨业（当时名刘继业）仍在城中坚持抵抗，刘继元派人劝谕，他才投降，太宗任用了他（另见“杨业”条）。

  太宗认为太原是历代割据者凭借的地方，下令毁掉晋阳城，把城中居民迁往别处，后来在唐明镇另筑新城作为并州的治所，即后来的太原城。北汉灭亡后，自唐末以来七十多年的分裂局面结束，五代十国至此终结。但燕云十六州仍在辽朝手中，太宗随即率军北上进攻辽朝的南京（另见“高梁河之战”条）。
