name: 甘英出使大秦
summary: 公元 97 年，西域都护班超派甘英出使大秦，甘英抵达条支海边后折回。
body: |-
  大秦是汉代对罗马帝国（主要指其东部地区）的称呼。汉朝的丝绸经安息（帕提亚）转运到罗马，两国之间却没有直接往来。据《后汉书·西域传》，和帝永元九年（公元 97 年），西域都护班超派属下甘英出使大秦。

  甘英一路西行，经过安息，到达条支，面临大海。他正要渡海，安息西部边界的船夫对他说：这片海十分广阔，往来的人遇到顺风要三个月才能渡过，遇到逆风也有走两年的，所以出海的人都带上三年的粮食；在海上容易使人思念故土，常有人因此死去。甘英听了便没有再往前走。

  条支和这片“大海”究竟在哪里，学者有不同看法，多数认为是波斯湾头，也有人认为是地中海东岸或黑海。《后汉书》在另一处说，大秦王一直想与汉朝通使，而安息想独占汉朝丝绸的转手贸易，所以从中阻隔。后人据此推测，船夫的话是有意夸大。

  甘英虽然没有到达大秦，却是史书所载汉朝使者西行最远的一次。《西域传》说他所到之处“皆前世所不至”，他带回的见闻使汉朝对安息以西的地理、物产有了更多了解。
sources: []
recalled:
  - 《后汉书·西域传》
