name: 胡服骑射
summary: 前 307 年赵武灵王推行胡服骑射，组建骑兵，赵国军力大增。
body: |-
  赵国北面与林胡、楼烦等游牧部落为邻，东面有中山国，西面受秦国威胁。中原各国的军队以车兵和步兵为主，穿着宽袍大袖，不便于骑马作战，在与来去如风的游牧骑兵交战时往往处于劣势。

  公元前 307 年，赵武灵王与大臣肥义商议，决定改穿胡人的短衣窄袖和长裤，学习骑马射箭。据《史记·赵世家》和《战国策·赵策二》，以叔父公子成为首的宗室大臣强烈反对，认为中国是“聪明睿知之所居”“诗书礼乐之所用”，改穿胡服是“变古之教，易古之道”。武灵王亲自登门劝说公子成，说“法度制令各顺其宜，衣服器械各便其用”，“故礼世不必一道，而便国不必法古”。公子成被说服，次日穿胡服上朝，武灵王随即正式下令推行。

  胡服骑射之后，赵国组建了强大的骑兵，向北打败林胡、楼烦，开辟了云中、雁门、代等郡，修筑长城；公元前 296 年最终攻灭了中山国。赵国由此成为战国后期唯一能在军事上与秦国抗衡的国家。胡服骑射也被看作中原国家主动向游牧民族学习的著名事例。

  胡服骑射在赵国并非一帆风顺，除公子成外，赵文、赵造、周袑等大臣也提出反对，《战国策·赵策二》详细记录了这些辩论。
sources: []
recalled:
  - 《史记·赵世家》
  - 《战国策·赵策二》
