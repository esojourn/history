name: 《资治通鉴》成书
summary: 司马光主持编写的编年体通史《资治通鉴》，1084 年完成进呈。
body: |-
  司马光早年就有意编写一部简明的编年通史，曾把战国至秦的部分编成《通志》八卷进呈。治平三年（公元 1066 年）宋英宗命他在崇文院设立书局，继续编修历代君臣事迹，允许他自选助手，借阅宫中藏书。他请来刘攽、刘恕、范祖禹三人协助，大致的分工是：刘攽负责两汉，刘恕负责魏晋南北朝，范祖禹负责唐代，五代部分也有刘恕参与。宋神宗即位后，认为此书“鉴于往事，有资于治道”，赐名《资治通鉴》，并亲自写了序。

  编写的方法是：先由助手把各种史料按年月排列，编成“丛目”；再把同一事件的不同记载加以比较取舍，写成“长编”；最后由司马光删削定稿。熙宁四年（1071 年）司马光因反对新法退居洛阳，书局也随之迁到洛阳，此后十五年他专心编书。

  元丰七年（1084 年）十一月，全书完成进呈。据司马光的《进书表》，全书正文二百九十四卷，另有《目录》三十卷、《考异》三十卷，记事上起周威烈王二十三年（前 403 年）三家分晋，下至后周世宗显德六年（959 年），共一千三百六十二年。《考异》说明了对各种史料的取舍理由，开创了史书附考证的体例。《进书表》中说，自己的精力都用在这部书上了。

  《资治通鉴》以政治、军事为主，取材广泛，除正史以外还采用了大量的杂史、笔记、文集，叙事详明，文字简洁，是中国最重要的编年体通史。此后续作、改编之书很多，如南宋李焘的《续资治通鉴长编》、袁枢的《通鉴纪事本末》、朱熹的《资治通鉴纲目》；元代胡三省为它作的注释也很有名。
sources: []
recalled:
  - 司马光《进资治通鉴表》
  - 宋神宗《资治通鉴序》
  - 《宋史·司马光传》
  - 刘恕《通鉴外纪》序
