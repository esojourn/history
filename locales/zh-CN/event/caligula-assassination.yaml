name: 卡利古拉遇刺，禁卫军拥立克劳狄
summary: 公元 41 年卡利古拉被禁卫军军官刺杀，禁卫军不顾元老院，拥立克劳狄。
body: |-
  公元 41 年 1 月 24 日，卡利古拉在帕拉丁山看完戏，从一条通道回宫，被禁卫军军官卡西乌斯·凯瑞亚等人围住刺死。约瑟夫斯和苏维托尼乌斯说，凯瑞亚一再受皇帝当众羞辱，怀恨已久；参与密谋的还有元老和宫里的人。皇后和年幼的女儿也在同一天被杀。

  执政官召集元老院，把国库搬上卡皮托山，元老们谈论恢复共和，也有人想自己当皇帝。这时禁卫军士兵在宫里搜出了躲在帘子后面的克劳狄，把他带回军营。犹太王希律·亚基帕在两边传话。第二天元老院手里的城防部队也倒向军营，只得承认克劳狄。

  克劳狄许给每个禁卫军士兵一大笔钱，又处死了凯瑞亚。这是禁卫军第一次自己立了皇帝，元老院只能追认；用赏金酬谢拥立的军队，以后也成了惯例。
sources: []
recalled:
