name: 设立军机处
summary: 雍正年间设立军机处，成为皇帝直接掌握的中枢机构，延续到清末。
body: |-
  清初的中枢机构有议政王大臣会议和内阁。议政王大臣会议由满洲王公组成，权力很大；内阁沿袭明制，负责处理一般的题本。康熙年间设立南书房，皇帝挑选亲近的文臣在其中起草谕旨，削弱了议政王大臣的权力。

  雍正七年（1729 年）前后，雍正帝决定对准噶尔用兵，为了快速、机密地处理军务，在隆宗门内设立“军需房”，后来改称“军机房”“办理军机处”，简称军机处。最初的军机大臣是怡亲王允祥、张廷玉、蒋廷锡等人。军机处设立的确切年份，史料记载不一，有雍正七年、八年等说法。

  军机处的成员都是皇帝从大学士、尚书、侍郎中挑选的亲信，称为军机大臣，下设军机章京。军机处没有正式的衙署，只有几间值房，军机大臣每天被皇帝召见，承旨后起草谕旨，以“廷寄”的方式直接寄给地方官员，不经过内阁。这种方式既快速又保密，皇帝的命令可以直达地方。

  军机处设立后，逐渐由处理军务扩大到处理全国的重要政务，成为清朝实际上的最高决策机构，内阁和议政王大臣会议的地位下降，议政王大臣会议在乾隆年间被撤销。军机处一切听命于皇帝，标志着君主专制在清代达到了顶峰。宣统三年（1911 年）清朝成立“责任内阁”，军机处被撤销。
sources: []
recalled:
