name: 王安石变法
summary: 1069 年起宋神宗任用王安石推行青苗、免役、保甲等新法，引起长期的新旧党争。
body: |-
  宋仁宗、英宗以来，宋朝官员、军队人数不断增加，财政连年亏空，对辽、西夏屡处被动，土地兼并严重。宋神宗即位后决心改革，熙宁二年（公元 1069 年）任命王安石为参知政事，设立制置三司条例司作为筹划新法的机构，由吕惠卿等人参与，次年王安石拜相。

  新法陆续推出。理财方面有：均输法，由发运司就近采购京城所需的物资；青苗法，在青黄不接时由官府向农民贷钱贷粮，收获后连本带息归还；免役法（又称募役法），把百姓轮流到官府服差役改为按户等出钱，由官府雇人充役；市易法，在京城设市易务，平抑物价，向商人贷款；农田水利法，奖励兴修水利、开垦荒地；方田均税法，丈量土地，按土质好坏分等纳税。强兵方面有：保甲法，把乡村百姓按户编组，农闲时训练；将兵法，在各地设将，专门训练军队，此外还有保马法等。科举方面，罢诗赋、考经义，在太学推行三舍法，颁行王安石主持编写的《三经新义》。

  新法从一开始就遭到强烈反对。韩琦上书指出青苗法名义上是救济，实际上是放贷取息；富弼、司马光、苏轼、文彦博等人也纷纷反对，认为新法变乱祖宗之法、与民争利，用人多是急功近利之辈。新法在推行中也确实出现了强行摊派青苗钱、免役钱负担不均等弊病。熙宁七年（1074 年）发生大旱，郑侠献上《流民图》，加上两宫太后的反对，王安石第一次罢相；次年复相，熙宁九年（1076 年）再次罢相，此后神宗亲自主持，继续推行新法，并在元丰年间改革官制（另见“宋神宗”条）。

  元丰八年（1085 年）神宗去世，高太后听政，起用司马光，新法几乎全部被废除（另见“元祐更化”条）；绍圣以后又被恢复。新旧两党此后轮流执政，互相报复，一直延续到北宋末年。对王安石变法的评价，自宋代起就分歧很大：南宋以后的史家多把北宋的灭亡归咎于变法；近代梁启超等人则高度评价王安石，至今学界仍有不同看法。
sources: []
