name: 宇文觉代西魏建北周
summary: 宇文泰死后，侄子宇文护逼西魏恭帝禅位给宇文觉，557 年建立北周。
body: |-
  西魏的实权一直掌握在宇文泰手中。恭帝三年（公元 556 年）正月，宇文泰按照《周礼》改定官制，设立天官、地官、春官、夏官、秋官、冬官六官，自任太师、大冢宰。同年十月，他在北巡途中去世，临终把后事托付给侄子宇文护。

  宇文泰的嫡子宇文觉当时只有十五岁。宇文护担心局面不稳，加紧筹划。同年十二月，西魏恭帝禅位给宇文觉，次年正月宇文觉即位，依照《周礼》不称皇帝而称“天王”，国号周，史称北周，仍都长安。恭帝被封为宋公，不久被杀。

  北周建立后，实权掌握在宇文护手中。宇文觉不满宇文护专权，与亲信谋划除掉他，事情泄露，同年九月被废，随后被杀。宇文护改立宇文泰的长子宇文毓，即明帝，明帝在位时才改称皇帝；武成二年（560 年），宇文护又毒死明帝，改立宇文邕，即周武帝。直到天和七年（572 年）武帝诛杀宇文护，皇权才收归皇帝手中。宇文护专权十五年间，先后废杀了两位皇帝。

  北周继承了西魏的府兵制和关陇集团，周武帝亲政后整顿内政、禁断佛道，国力大增，577 年灭北齐，统一了北方。北周共历五帝二十五年，581 年被外戚杨坚建立的隋朝取代。
sources: []
recalled:
  - 《周书·孝闵帝纪》
  - 《周书·晋荡公护传》
