name: 唐隆政变
summary: 710 年临淄王李隆基与太平公主起兵诛杀韦后、安乐公主，拥立睿宗复位。
body: |-
  景龙四年（公元 710 年）六月，唐中宗在长安突然去世。韦后秘不发丧，调集各府兵马五万人屯驻长安，以韦氏子弟统领禁军。她与太平公主、上官婉儿起草遗诏，立中宗的幼子温王李重茂为帝，自己以皇太后的身份临朝摄政，原定由相王李旦参与辅政的条文也被删去。据《资治通鉴》，宗楚客等人还劝韦后效法武则天，并谋划除掉相王。

  相王的第三子临淄王李隆基与太平公主及其子薛崇简，联络苑总监钟绍京、万骑营的果毅葛福顺、陈玄礼等人，决定先发制人。有人建议先禀告相王，据《资治通鉴》，李隆基说事成了福归相王，不成就由自己一死承担，不连累相王，因此没有事先告诉父亲。六月二十日夜，葛福顺率万骑攻入羽林营，杀死统领羽林军的韦璿、韦播、高嵩，羽林将士纷纷响应。李隆基率兵进入禁苑，与各路人马会合，攻入宫中。韦后逃入飞骑营，被士兵斩首；安乐公主和韦氏党羽被杀，上官婉儿出迎时也被斩于旗下。

  事后相王入宫辅政，少帝李重茂让位，六月二十四日睿宗复位，李隆基因功被立为太子。这次政变因发生在李重茂的唐隆年号下而得名。此后太平公主与太子李隆基之间又展开了新的权力争夺（另见“先天政变”条）。
sources: []
recalled:
  - 《旧唐书·睿宗纪》
  - 《旧唐书·玄宗纪》
  - 《资治通鉴》卷二百九
