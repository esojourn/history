name: 蔡伦改进造纸术
summary: 公元 105 年蔡伦奏上用树皮、麻头、破布、渔网造纸之法，纸从此推广。
body: |-
  在纸普及之前，中国的书写材料主要是竹木简牍和丝织的缣帛。《后汉书·蔡伦传》说“缣贵而简重，并不便于人”：帛价格昂贵，简牍又很笨重。

  据同一篇传记，时任尚方令的宦官蔡伦“造意用树肤、麻头及敝布、鱼网以为纸”，元兴元年（公元 105 年）奏报和帝，和帝称赞他的才能，“自是莫不从用焉，故天下咸称蔡侯纸”。这是史书中关于造纸方法最早的明确记载，后世长期把蔡伦视为纸的发明者。

  二十世纪以来的考古发现改变了这一看法。在陕西西安灞桥、甘肃天水放马滩、敦煌悬泉置等西汉遗址和墓葬中，先后出土过植物纤维制成的纸或类似纸的残片，有的上面还有字迹或线条，年代比蔡伦早一二百年。其中个别标本是否算作真正的纸，学者之间有争论；但西汉已有麻纸，现在已为多数人接受。因此一般认为，蔡伦是在已有技术的基础上加以改进：他扩大了原料的范围，特别是开始使用树皮，并改善了工艺，使纸的质量和产量足以用于日常书写。

  此后二三百年间，纸逐渐取代简牍和缣帛，到东晋时已成为通行的书写材料。书籍的抄写和流传由此变得容易。造纸术后来向东传到朝鲜半岛和日本，向西经中亚传入阿拉伯地区，再传到欧洲。
sources: []
recalled:
  - 《后汉书·宦者列传》（蔡伦）
