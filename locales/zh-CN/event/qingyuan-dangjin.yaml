name: 庆元党禁
summary: 宋宁宗时韩侂胄把理学斥为“伪学”，开列“伪学逆党籍”，禁锢赵汝愚、朱熹等人。
body: |-
  绍熙五年（公元 1194 年）赵汝愚与韩侂胄合作促成宋宁宗即位（绍熙内禅），事后赵汝愚任右丞相，引荐朱熹等道学人士入朝，朱熹任侍讲。韩侂胄自以为有定策之功，却没有得到重用，对赵汝愚心怀不满。朱熹上书提醒宁宗防止左右窃权，矛头指向韩侂胄，结果在朝仅四十多天就被罢免。

  庆元元年（1195 年）韩侂胄指使言官弹劾赵汝愚以宗室身份任相，图谋不轨，赵汝愚被罢，次年在贬往永州的途中死于衡州。为赵汝愚、朱熹申辩的官员和太学生纷纷被贬斥。韩侂胄一派把道学称为“伪学”，宣布禁止，科举考试中凡引用程颐、朱熹言论的一律不取。庆元三年（1197 年）朝廷开列“伪学逆党籍”，赵汝愚、留正、周必大、朱熹、彭龟年、蔡元定等人都名列其中（据《庆元党禁》所列为五十九人），名列党籍者不得担任官职。朱熹的弟子蔡元定被编管道州，死在那里；朱熹本人被削去官职，门人有的改换门庭。

  庆元六年（1200 年）朱熹去世，朝廷仍下令约束前往送葬的门人。此后韩侂胄准备北伐，需要缓和朝野的对立，嘉泰二年（1202 年）党禁逐渐解除，被列入党籍的人陆续恢复官职。韩侂胄死后，朱熹被追谥为“文”，理学的地位迅速上升，宋理宗时成为官方正统（另见“朱熹”条）。
sources: []
recalled:
