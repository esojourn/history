name: 修建都江堰
summary: 蜀郡守李冰修建都江堰，使成都平原成为“天府之国”，沿用至今。
body: |-
  岷江出山后进入成都平原，水流湍急，夏秋常常泛滥，冬春又可能干旱。秦国灭蜀后，大约在秦昭襄王末年（公元前 256 年前后，确切年份不详），蜀郡守李冰主持修建了都江堰水利工程。

  《史记·河渠书》说李冰“凿离碓，辟沫水之害，穿二江成都之中”。据东晋常璩《华阳国志·蜀志》，李冰在岷江中筑起分水的堤堰，把江水分为内江和外江，内江引水灌溉成都平原，外江排泄洪水；又设立三个石人作为水位标尺，约定“水竭不至足，盛不没肩”。此后成都平原“水旱从人，不知饥馑”，被称为“天府”。今天都江堰的鱼嘴（分水）、飞沙堰（溢洪排沙）、宝瓶口（引水）三大主体工程，是在历代不断整修中形成的。

  都江堰是世界上现存最古老、至今仍在使用的无坝引水工程之一，2000 年被列入世界文化遗产。它使巴蜀成为秦国的粮仓，为秦国统一六国提供了重要的物资保障。

  都江堰的成功在于因势利导：鱼嘴把岷江分为内外两江，飞沙堰在洪水时把多余的水和泥沙排入外江，宝瓶口控制进入内江的水量。两千多年来灌溉面积不断扩大，如今已达一千万亩以上。

  都江堰附近还有纪念李冰父子的二王庙。
sources: []
recalled:
  - 《史记·河渠书》
  - 《华阳国志·蜀志》
