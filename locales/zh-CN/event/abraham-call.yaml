name: 亚伯拉罕蒙召往迦南
summary: 亚伯兰七十五岁离开哈兰，带家人进入迦南。
body: |-
  据《创世记》11:27—32，他拉带着儿子亚伯兰、儿妇撒莱和孙子罗得离开迦勒底的吾珥，要往迦南地去，走到哈兰就住在那里，他拉后来死在哈兰。创 12:1—3 记耶和华对亚伯兰说，要他离开本地、本族、父家，往所要指示他的地去；应许使他成为大国，赐福给他，地上的万族都要因他得福。

  亚伯兰照着吩咐去了。据创 12:4，他出哈兰的时候七十五岁，带着撒莱、罗得，连同在哈兰积蓄的财物和所得的人口。他们进入迦南，到了示剑地方摩利橡树那里；耶和华向他显现，说要把这地赐给他的后裔，他就在那里筑了一座坛。随后他迁到伯特利东边的山，支搭帐棚，又筑一座坛，求告耶和华的名，后来渐渐迁往南地（12:5—9）。

  不久那地遭遇饥荒，亚伯兰下埃及暂居，后来带着许多牲畜、金银回到伯特利一带（12:10—13:4）。罗得与他分开之后，耶和华再次应许把他举目所见的地都赐给他和他的后裔，他便搬到希伯仑幔利的橡树那里居住（13:14—18）。

  《使徒行传》7:2—4 记司提反说，亚伯拉罕还在米所波大米、没有住哈兰的时候，神已经向他显现；这与创 12 章所记怎样衔接，历来有不同的解释。《希伯来书》11:8 说他出去的时候还不知道往哪里去。后来的圣经书卷多次回顾这次蒙召，如《约书亚记》24:2—3、《尼希米记》9:7—8。本条的年份按亚伯拉罕蒙召时七十五岁推算，是约数。
sources: []
recalled:
  - 《创世记》11:27—13:18
  - 《使徒行传》7:2—4
  - 《希伯来书》11:8
  - 《约书亚记》24:2—3
  - 《尼希米记》9:7—8
