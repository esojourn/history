name: 营建成周
summary: 周公、召公主持在洛邑营建东都成周，作为周人统治东方的中心。
body: |-
  武王克商后，就曾考察洛邑一带，打算在天下之中建立都邑。周公东征平定三监之乱以后，为了控制东方和安置商的遗民，决定在洛水边营建新都。据《尚书》的《召诰》《洛诰》，召公先到洛邑勘察选址、占卜，周公随后到达，主持营建，并迁来一部分商的遗民。新都称为“成周”，与西方的宗周镐京相对。

  1963 年在陕西宝鸡出土的青铜器何尊，铭文记载成王“初迁宅于成周”，并引用武王的话说“余其宅兹中国，自之乂民”，意思是要居于天下的中心来治理百姓。这是“中国”一词迄今所知最早的出处。铭文记年为成王五年，按断代工程的年表约在公元前 1038 年，传统说法则把营洛放在周公摄政的第五至七年，两者大体相合。

  成周建成后，周王室在这里驻扎军队（“成周八师”），会见东方诸侯。西周灭亡后，周平王东迁，以洛邑为都，东周由此开始。

  考古工作者在洛阳瀍河两岸发现了西周时期的大型铸铜作坊遗址和贵族墓地，一般认为与成周有关，但成周城址的确切位置至今仍有争论。《尚书·多士》是周公向迁到洛邑的商朝遗民发布的诰辞，说明成周也是安置殷遗民的地方。

  成周与宗周镐京并为西周的两个政治中心。
sources: []
recalled:
  - 《尚书·召诰》
  - 《尚书·洛诰》
  - 何尊铭文
  - 《史记·周本纪》
