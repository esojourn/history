name: 吐蕃攻入长安
summary: 763 年吐蕃攻入长安，唐代宗出逃陕州，吐蕃占据十五天后在郭子仪的疑兵下撤走。
body: |-
  安史之乱爆发后，唐朝把河西、陇右的精兵大批调往内地，西部边防空虚。吐蕃赞普赤松德赞乘机进攻，逐年蚕食唐朝在陇右的州县。广德元年（公元 763 年）秋，吐蕃联合吐谷浑、党项等部，据《资治通鉴》共二十余万人，攻入大震关，一路东进。当时宦官程元振专权，边将的告急文书被他压下不报，直到吐蕃军逼近长安附近的奉天、武功，唐代宗才得知消息。

  代宗紧急起用闲居的郭子仪为关内副元帅，但他手下兵力极少。十月吐蕃军渡过渭水，代宗仓皇逃往陕州，官员和禁军四散。吐蕃军进入长安，立已故邠王李守礼之子、广武王李承宏为皇帝，改元设官，抢掠府库和市场，焚烧房屋，长安城中一片萧条。

  郭子仪南下商州，收集溃散的唐军，据《资治通鉴》，得四千人。他派部将在长安附近白天擂鼓、夜晚举火，虚张声势，又派人潜入长安城中，联合城中少年夜里击鼓呐喊，让吐蕃人以为唐朝大军将到。吐蕃军占据长安十五天后撤走，李承宏被废。十二月代宗回到长安，郭子仪被称为再造唐室的功臣，程元振被削职流放。

  这次事件暴露了唐朝西部边防的空虚。此后吐蕃几乎年年在秋季入侵关中，唐朝每年都要调各地兵马到京西北一带“防秋”，河西、陇右的州县也在此后二十多年间相继落入吐蕃之手（另见“吐蕃攻占河西陇右”条）。
sources: []
