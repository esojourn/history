name: 《三都赋》与洛阳纸贵
summary: 左思以十年之功写成《三都赋》，经皇甫谧作序后被争相传抄，洛阳的纸为之涨价。
body: |-
  左思出身寒微，随入宫的妹妹迁居洛阳后，立志写一篇铺叙魏、蜀、吴三国都城的大赋。据《晋书·文苑传》，他为此构思了十年，家里到处放着纸笔，又自觉见闻不够，请求担任秘书郎以便查阅图籍。他在序里说，赋中写到的山川城邑要依据地图，鸟兽草木要查考方志，不能像前人的大赋那样凭空夸饰。

  本传说赋成之后起初无人称道，他便去请教以学问和品行著称的皇甫谧。皇甫谧为之作序，张载、刘逵分别为各篇作注，司空张华读后赞叹，认为可与班固、张衡的名作并列。于是豪贵之家竞相传写，洛阳的纸因此涨价。陆机初到洛阳时也想写这个题目，听说左思在写，曾在给弟弟的信里加以讥笑，等到读了成稿，叹服而搁笔。

  这篇赋完成的年份没有确切记载。皇甫谧卒于太康三年（公元 282 年），如果序确实出自他手，成赋当在此前不久；也有学者怀疑这篇序是否为皇甫谧所作，并把成赋的时间定得更晚，陆机入洛就在太康末年。这里姑且系于太康初年。
sources: []
recalled:
  - 《晋书·文苑传·左思》
  - 《文选》卷四至卷六
  - 《世说新语·文学》
