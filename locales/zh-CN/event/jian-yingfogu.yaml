name: 韩愈谏迎佛骨
summary: 819 年唐宪宗迎法门寺佛骨入宫，韩愈上《论佛骨表》谏阻，被贬为潮州刺史。
body: |-
  凤翔法门寺的塔下供奉着一节相传是释迦牟尼的指骨舍利，据说每三十年开塔一次，开则岁丰人安。元和十四年（公元 819 年）正月，唐宪宗派宦官把佛骨迎入长安，在宫中供奉三天，然后送到各寺院供人瞻礼。据《旧唐书》，王公士民争相奔走施舍，有人倾家荡产，甚至有人烧灼头顶和手臂来供养。

  刑部侍郎韩愈上了一道《论佛骨表》，说佛教本是外国的宗教，上古的帝王没有佛教也都长寿，而南朝梁武帝三次舍身佛寺，最后却饿死在台城；他请求把佛骨交给有关部门投入水火，永绝根本。宪宗看后大怒，要处死韩愈，经宰相裴度、崔群等人说情，才把他贬为潮州刺史。韩愈在赴任途中写下了“一封朝奏九重天，夕贬潮州路八千”的诗句。

  唐代皇帝迎奉法门寺佛骨有好几次，最后一次是咸通十四年（873 年）唐懿宗时。1987 年法门寺塔下的地宫被发现，出土了佛指舍利和大批唐代宫廷供奉的金银器、琉璃器和秘色瓷，这些器物是那次迎奉后封存的。
sources: []
recalled:
  - 韩愈《论佛骨表》
  - 《旧唐书·韩愈传》
  - 《资治通鉴》卷二百四十
