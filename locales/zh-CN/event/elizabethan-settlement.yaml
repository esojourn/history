name: "伊丽莎白宗教决议"
summary: "伊丽莎白一世以法案、公祷书和三十九信条确定英格兰国教会的体制。"
body: |-
  1558 年 11 月玛丽一世去世，伊丽莎白即位。国内有守旧的主教和上院贵族，有流亡归来、想照日内瓦或苏黎世样式改革的新教徒，国外有与她争位的苏格兰女王玛丽和正在议和的法国、西班牙。《历史的轨迹》第二十八章说，玛丽的逼迫本想消灭新教，结果使全国反罗马的情绪比任何时候都高。

  1559 年议会开会，政府的法案在上院受阻，主教们全体反对。复活节期间政府安排了一场两派的辩论，借故关押了两位主教，法案才得通过。该书说 4 月 29 日议会在强烈反对下再度通过《至尊法案》，最后一次废除教皇在英格兰的一切权柄。女王的称号由“最高元首”改成“最高管理者”，官员和教士都要宣誓。同时通过的《信仰划一法》规定全国使用《公祷书》，星期日不到教堂的罚款十二便士。

  《公祷书》以 1552 年的本子为底，作了几处改动。该书举出：删去求神拯救脱离罗马主教暴政的祷文；关于基督的身体是否临在饼酒中暂不深究；原先说明跪领圣餐并非敬拜饼酒的一段也删去了，为的是安抚天主教徒。施饼酒时的话把 1549 年和 1552 年的两种说法连在一起，各人可以照自己的理解领受。教士的祭服照爱德华六世初年的样子保留。

  玛丽时代的主教除一人外都拒绝宣誓，被免职；下层教士绝大多数留任。新任的主教多是流亡回来的人。1563 年教士会议把克兰麦的《四十二信条》改定为《三十九信条》，该书说这是英格兰教会至今公认的信条；它的定本到 1571 年才由议会批准。

  该书把这些安排称为“伊丽莎白决议”，说这些妥协在当时看来相当明智，却成了后来许多不满与冲突的根源，天主教徒从此在英格兰成了少数。要求进一步清除旧礼仪的人后来被称为清教徒。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十八章“英国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter31.html"
recalled:
  - "1559 年《至尊法案》《信仰划一法》"
  - "1559 年《公祷书》"
  - "《三十九信条》（1563 年拉丁文本，1571 年定本）"
  - "朱厄尔《英格兰教会辩护书》（1562 年）"
