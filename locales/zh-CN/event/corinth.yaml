name: 科林斯被毁
summary: 罗马镇压亚该亚同盟，希腊从此归罗马管辖。
body: |-
  彼得那战役之后，亚该亚同盟与罗马的关系日趋紧张。起因是同盟与其成员斯巴达的纠纷。据保萨尼阿斯，公元前 147 年罗马使节在科林斯宣布，斯巴达、科林斯、阿尔戈斯等城应脱离同盟，引起骚动，使节受到围攻。同盟将军克里托劳斯随后鼓动开战。

  前 146 年，驻马其顿的罗马将领梅特卢斯南下，在斯卡尔菲亚击败克里托劳斯。继任的将军狄埃乌斯释放奴隶充军，退守科林斯。执政官穆米乌斯到任后，在科林斯地峡击溃同盟军队。据保萨尼阿斯，他在战后第三天进城，城中男子多被杀死，妇女儿童被卖为奴，城市被焚毁。

  科林斯的雕像、绘画被运往罗马。斯特拉波转引波利比乌斯的话说，他亲眼看见士兵把名画扔在地上，在上面掷骰子。各城的同盟被解散，希腊交由驻马其顿的罗马总督监管；直到一百多年后的奥古斯都时期，才正式设立亚该亚行省。这一年迦太基也被罗马毁灭。
sources:
  - 波利比乌斯《历史》卷三十八第 9—18 章；卷三十九第 2—6 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/38*.html
  - 英文维基百科“Battle of Corinth (146 BC)”（核对年份） https://en.wikipedia.org/wiki/Battle_of_Corinth_(146_BC)
recalled:
  - 保萨尼阿斯《希腊志》卷七第 14—16 章
  - 斯特拉波《地理学》卷八第 6 章第 23 节
