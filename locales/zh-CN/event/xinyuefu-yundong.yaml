name: 新乐府运动
summary: 白居易、元稹等人用自创的新题写诗反映时事和民间疾苦，后人称为“新乐府运动”。
body: |-
  乐府原是汉代采集民歌的机构，后来泛指可以配乐的诗歌。南北朝以后文人常用乐府旧题写诗。杜甫写《兵车行》《丽人行》以及“三吏”“三别”等，不用旧题，而根据所写的事情自拟题目，开了新题乐府的先河。

  唐宪宗元和初年，李绅写了《新题乐府》二十首（已失传），元稹和作了十二首，白居易又在元和四年（公元 809 年）前后写成《新乐府》五十首，此外还有《秦中吟》十首。这些诗都以时事为题材，如《卖炭翁》写宦官借宫市强取民物，《新丰折臂翁》写天宝年间征南诏给百姓带来的苦难，《上阳白发人》写宫女的悲惨遭遇。白居易在序中说，这些诗要让读者容易懂，叙事要真实，目的是“为君、为臣、为民、为物、为事而作，不为文而作”。张籍、王建等人的乐府诗也有相似的风格。

  元和十年（815 年）白居易在江州写的《与元九书》中，进一步提出“文章合为时而著，歌诗合为事而作”，系统阐述了诗歌应当反映现实、补察时政的主张。后人把这一时期的创作倾向称为“新乐府运动”，不过这个名称是现代学者提出的，当时并没有一个有组织的“运动”。
sources: []
recalled:
  - 白居易《新乐府序》
  - 白居易《与元九书》
  - 元稹《和李校书新题乐府十二首序》
