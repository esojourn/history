name: 礼仪之争
summary: 天主教内部关于中国信徒能否祭祖祭孔的争论，导致清廷禁教。
body: |-
  明末利玛窦在中国传教时，允许中国信徒按照传统祭祀祖先、尊崇孔子，认为这些是社会礼节，而不是宗教崇拜；他还用儒家经典中的“天”“上帝”来称呼天主。利玛窦去世后，耶稣会内部就对这些做法有过争论；后来到中国的多明我会、方济各会传教士更强烈反对，认为祭祖、祭孔是偶像崇拜，向罗马教廷申诉。

  1704 年教皇克雷芒十一世颁布禁令，禁止中国信徒祭祖、祭孔，禁止用“天”“上帝”称呼天主，只能用“天主”。次年教廷派特使多罗来华，康熙帝在北京接见了他，双方意见无法调和。康熙帝下令，在华的传教士必须领取朝廷的“印票”，承诺遵守利玛窦的规矩，才能留在中国，不领票的驱逐出境。多罗在南京宣布教皇的禁令，被康熙帝下令押送澳门，后来死在那里。

  1715 年教皇再次颁布通谕，重申禁令。1720 年教廷又派嘉乐来华，康熙帝看到禁令的译文后批示：“览此告示，只可说得西洋人等小人，如何言得中国之大理……以后不必西洋人在中国行教，禁止可也，免得多事。”雍正元年（1723 年）雍正帝正式下令禁止天主教在各地传教，各省的传教士被送到澳门，只有在钦天监等处供职的传教士可以留在北京，郎世宁等人就是以技艺在宫廷中服务的。1742 年教皇本笃十四世再次颁布通谕，禁止讨论这一问题。

  礼仪之争使天主教在中国的传教活动受到很大限制，此后一百多年，传教士只能秘密活动。直到 1939 年，教廷才宣布允许中国信徒参加祭孔、祭祖的仪式。
sources: []
