name: 沙丘宫变
summary: 前 295 年赵国公子章作乱被杀，主父赵武灵王被围困在沙丘宫三个多月，饿死宫中。
body: |-
  赵武灵王晚年宠爱吴娃，废掉长子章的太子之位，改立吴娃所生的少子何为太子。公元前 299 年，他把王位传给何，就是赵惠文王，自号“主父”，以肥义为相国辅佐惠文王。后来他又怜惜长子章，封章于代，号安阳君，还想把代地分出来让章也称王，犹豫未决。

  据《史记·赵世家》，公元前 295 年，主父与惠文王游览沙丘，分居两宫。公子章与田不礼趁机作乱，假传主父之命召惠文王，肥义先去，被杀。公子成和李兑率兵赶到，击败了公子章。公子章逃入主父的宫中，主父开门收留了他。公子成、李兑包围主父宫，杀死了公子章，又担心解围后被主父诛杀，于是继续包围，下令宫中的人“后出者夷”，宫中的人都逃了出来。主父想出宫出不去，又没有食物，只能掏鸟窝里的雏鸟吃，三个多月后饿死在沙丘宫。

  一代雄主就这样死于宫变。此后赵国由公子成、李兑执政。七十多年后，秦始皇也死在沙丘。

  沙丘在今河北广宗县一带，《史记·殷本纪》说纣王曾在这里“益广沙丘苑台”。秦始皇死于沙丘后，赵高、李斯也是在这里密谋矫诏，立胡亥为帝。

  武灵王死后，惠文王在位三十多年，赵国仍是东方的强国。
sources: []
recalled:
  - 《史记·赵世家》
