name: 宋灭南汉
summary: 970 年宋军以潘美为帅进攻南汉，次年攻下广州，南汉后主刘鋹投降。
body: |-
  南汉据有岭南，都城在广州（兴王府）。后主刘鋹在位时，政事多委托宦官，宫中宦官人数很多，国势衰弱。开宝三年（公元 970 年）九月，赵匡胤任命潘美为主帅，率军从湖南南下，先攻下贺州，又连破昭州、桂州、连州、韶州等地。据《宋史》，南汉军曾用训练过的大象列阵迎战，被宋军用弓弩射退。

  开宝四年（971 年）二月，宋军进逼广州，刘鋹准备乘船逃往海上，船只却被宦官和卫兵抢先劫走，只得出城投降，南汉灭亡。刘鋹被送到开封，封为恩赦侯，后来又改封彭城郡公，太平兴国五年（980 年）去世。宋灭南汉以后，岭南的财富和对外贸易都归于宋朝，宋朝随即在广州设立市舶司，管理海外贸易。
sources: []
recalled:
  - 《宋史·太祖本纪》
  - 《宋史·潘美传》
  - 《宋史·世家·南汉刘氏》
  - 《续资治通鉴长编》卷十一、十二
