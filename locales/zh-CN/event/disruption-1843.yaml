name: "苏格兰教会大分裂"
summary: "1843 年四百多位牧师在查默斯带领下退出苏格兰国家教会，组成苏格兰自由教会。"
body: |-
  《历史的轨迹》第三十九章说，安妮女王时国会恢复了“平信徒委派权”，由庇护人指定牧师，所派的往往是会众不喜欢的人。十八世纪已因此有过几次分裂；留下的国家教会灵性低落，加上自由主义渗透，兴起了“温和派”，庇护人多派温和派或自由派做牧师，而信徒期望的是忠于传统信仰的牧师。

  据一般记载，福音派在 1834 年取得总会多数，通过“否决法”，让会众可以拒绝所派的牧师，但民事法院和国会都判定总会无权如此。1843 年 5 月 18 日总会在爱丁堡开会，福音派宣读抗议书后集体退场，列队走到坦菲尔德大厅另开会议。

  该书说，这一年四百七十四位牧师在查默斯领导下退出国家教会，组成苏格兰自由教会；到这时差不多三分之一的信徒离开了国家教会。退出的牧师放弃了教堂、住宅和薪俸，自由教会几年内在全国建起数百间教堂。该书说国家教会并未从此一蹶不振，1874 年平信徒委派权终于废除；1900 年自由教会与联合长老会合并为联合自由教会（1929 年它又与国家教会重新合一，书中没有说）。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
