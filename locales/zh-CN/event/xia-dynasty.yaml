name: 夏朝建立
summary: 古书所记第一个世袭王朝，断代工程定其开始约在前 2070 年。
body: |-
  据《史记·夏本纪》，禹受舜禅让即天子位，国号夏后。禹死后，天下先授给伯益，三年丧毕，诸侯都去朝见禹的儿子启，启遂即位。从此天子之位由父传子，古书把这看作“家天下”的开始。夏朝自禹至桀共十四世、十七王。

  夏朝没有发现同时代的文字，它的存在主要依据《尚书》《左传》《竹书纪年》《史记》等后世文献。二十世纪以来，考古学者在河南西部、山西南部寻找夏文化。河南偃师二里头遗址的年代与古书中的夏代晚期相当，许多学者认为它是夏的都邑，但由于没有文字证据，这一看法仍有争议，部分国外学者不承认夏是已被证实的王朝。

  关于夏朝的年代，《竹书纪年》说夏“有王与无王，用岁四百七十一年”。2000 年公布的夏商周断代工程把夏的开始定在约公元前 2070 年，结束约在公元前 1600 年，时间长河上夏的色带即按这一年表画出。这份年表在学界有不同意见，只能当作参考。

  夏的都城，古书有阳城、阳翟、斟鄩、安邑等不同记载，可能先后迁徙过多次。断代工程推定夏代年代的依据，主要是古书中关于夏代积年的记载，以及河南登封王城岗、新密新砦、偃师二里头等遗址的碳十四测年。
sources: []
recalled:
  - 《史记·夏本纪》
  - 《竹书纪年》（佚文）
  - 《夏商周断代工程 1996—2000 年阶段成果报告》
