name: 海上之盟
summary: 宋金使者渡海往来，1120 年约定夹攻辽朝，灭辽后燕京归宋。
body: |-
  政和年间，辽朝人马植投奔宋朝，向宋徽宗献策，说女真兴起，辽朝必亡，宋朝可以联合女真收复燕云，徽宗赐他姓名赵良嗣。宦官童贯和宰相蔡京等人也支持这一计划。因为陆路被辽朝隔断，宋朝的使者只能从登州渡海到辽东与金朝联络，所以称为“海上之盟”。

  重和元年（公元 1118 年）宋朝派马政等人从登州渡海出使金朝。宣和二年（1120 年）赵良嗣到金朝见完颜阿骨打，双方约定：金军攻取辽朝的中京，宋军攻取燕京；灭辽以后，燕云之地归宋，宋朝把原来每年给辽朝的岁币转给金朝。朝中也有人反对，认为宋辽和好已有一百多年，背盟攻辽不义，而且女真比契丹更难对付，没有被采纳。

  宣和四年（1122 年）宋军两次进攻燕京都被辽军击败，最后燕京由金军攻下（另见“宋赎燕京”条）。金朝认为宋朝没有履行约定，只答应交还燕京和附近的六州，不包括平、营、滦三州和西京一带。据《三朝北盟会编》，宋朝除了原定的岁币以外，每年还要另付一百万贯“代税钱”。宣和五年（1123 年）四月，金军把燕京城中的人口、财物掳掠一空后，交给宋朝一座空城。

  海上之盟使宋朝暴露了军事上的虚弱。此后宋朝又收容辽朝降将张觉，触怒金朝。宣和七年（1125 年）金朝灭辽以后，随即以宋朝背约为理由南下攻宋，两年后北宋灭亡（另见“靖康之变”条）。后世史家多认为联金灭辽是北宋灭亡的重要原因之一。
sources: []
recalled:
