name: 拉丁战争
summary: 罗马击败拉丁同盟并将其解散，对各城分别处置，确立了统合意大利的办法。
body: |-
  公元前 340 年至前 338 年罗马与拉丁同盟之间的战争。共和国初年罗马与拉丁各城订立《卡西乌斯条约》，约定互相援助、平分战利品。前 4 世纪中叶续约时罗马已明显居于主导。第一次萨莫奈战争中罗马把势力伸进坎帕尼亚，随后却与萨莫奈人议和结盟，丢下了坎帕尼亚人。

  据李维，拉丁人派使者到罗马，要求两国合为一体，执政官和元老各出一半，被元老院拒绝。于是拉丁人与坎帕尼亚人、沃尔斯基人联合，罗马则有萨莫奈人相助。

  前 340 年两名执政官绕道进入坎帕尼亚，在维苏威山附近击败联军。李维在这里记了两个著名的故事：执政官曼利乌斯·托夸图斯因儿子违令出阵与敌人单挑，虽然获胜，仍把他处死；另一名执政官德基乌斯·穆斯按照古老的仪式把自己和敌军一起“献给”地下诸神，然后冲入敌阵战死。这些故事的真实性难以判断，德基乌斯家三代人都有同样的传说。此后两年罗马逐城平定拉丁姆，前 338 年攻下安提乌姆。安提乌姆战船的撞角被运到罗马广场，装在讲坛上，讲坛从此叫“船首台”。

  战后罗马解散了拉丁同盟，对各城分别处置，不许它们彼此结盟、通婚和通商，只许各自同罗马往来。近处的城并入罗马，居民成为完全的公民；较远的拉丁城保留自治，其居民享有后来所称的“拉丁权”；坎帕尼亚的卡普亚、库迈等城得到“无投票权的公民权”，要服兵役而不能在罗马投票。这套分等级、可升迁的办法，成为罗马此后统合意大利的基本手段。
sources: []
recalled:
  - 李维《建城以来史》卷八第 1—14 章
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷六第 95 章（卡西乌斯条约）
