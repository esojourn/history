name: "无敌舰队之败"
summary: "1588 年西班牙舰队进攻英格兰，在海峡受挫，归途遭风暴，损失惨重。"
body: |-
  英格兰与西班牙交恶多年：伊丽莎白一世纵容德雷克等人劫掠西班牙在美洲的船只和港口，1585 年又派兵到尼德兰援助起义的各省。1587 年她处死了信天主教的苏格兰女王玛丽。腓力二世决定入侵英格兰。《历史的轨迹》第三十章说，他建立一支号称“无敌舰队”的庞大舰队，打算先征服英格兰，然后就能轻易平定荷兰的叛乱。按计划，舰队要驶进英吉利海峡，掩护帕尔马公爵在尼德兰的陆军渡海登陆。“无敌”是后人加的称呼，当时的名字是“大而最幸运的舰队”。

  1588 年 5 月底舰队从里斯本出发，约一百三十艘船，载着八千水手和近两万士兵，统帅是没有海战经验的梅迪纳·西多尼亚公爵。7 月底舰队进入海峡，排成新月阵向东行驶。英格兰舰队由霍华德勋爵和德雷克指挥，船只灵便，炮的射程远，在后面追击了一个星期，没能打散它。

  8 月 6 日西班牙舰队在加来外海下锚，等帕尔马的军队。帕尔马的驳船被荷兰人的小船封在港里，出不来。7 日夜里英格兰人放了八条火船顺风冲过去，西班牙船只砍断锚索四散。次日在格拉沃利讷外海，英格兰舰队逼近炮击了一整天，西班牙有几艘船沉没或搁浅。风向转为西南，把舰队吹向北海。该书说英格兰是在荷兰的帮助下击败无敌舰队的，指的就是荷兰人封锁了帕尔马的出口。

  公爵决定绕过苏格兰和爱尔兰回国。那年秋天风暴特别多，船只缺水少粮，几十艘在苏格兰、爱尔兰西岸触礁，上岸的人大多被杀。回到西班牙的船约有三分之二，人只剩一半左右。该书说只有一小部分回到西班牙，损失说得重了些。

  西班牙后来又造了舰队，战争打到 1604 年。但入侵英格兰、从海上扑灭尼德兰起义的计划落了空。英格兰铸的纪念章上写着：神吹了一口气，他们就四散了。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
recalled:
  - "梅迪纳·西多尼亚公爵的航行日志与致腓力二世的报告"
  - "霍华德勋爵《西班牙舰队事略》"
  - "卡姆登《伊丽莎白女王朝编年史》"
