name: 普拉提亚战役
summary: 公元前 479 年希腊联军在彼奥提亚击溃波斯陆军，同时在米卡勒摧毁其舰队。
body: |-
  萨拉米斯海战后，马铎尼斯率留下的波斯军队在色萨利过冬。公元前 479 年春，他派马其顿王亚历山大一世去劝雅典单独讲和，许以自治和重建神庙；雅典人拒绝了，并催促斯巴达出兵。马铎尼斯再度占领雅典，雅典人又一次撤到萨拉米斯。斯巴达迟疑了一阵，终于派出五千名斯巴达公民，由摄政保萨尼阿斯统率。马铎尼斯焚毁雅典后退到彼奥提亚，在阿索波斯河北岸扎营，那里的平原便于骑兵，又靠近归顺波斯的底比斯。

  希腊联军在基泰隆山北麓、普拉提亚城附近列阵。据希罗多德，联军有重装步兵三万八千七百人，连轻装兵共约十一万，来自二十多个城邦；他说波斯一方有三十万，另有约五万希腊盟军，现代学者认为远没有这么多。两军隔河对峙了十多天，双方的占卜都说先渡河进攻者不利。波斯骑兵不断袭扰，截断了联军的粮道，又填塞了水泉。

  保萨尼阿斯决定夜间后撤到靠近水源的地方。撤退中各部脱节：中央的各邦部队退到了普拉提亚城下，一名斯巴达队长拒绝后退耽搁了时间，天亮时斯巴达人、泰格亚人与雅典人相隔很远。马铎尼斯以为希腊人在逃跑，下令全线追击。斯巴达人和泰格亚人在箭雨下等到献祭得出吉兆才发起冲锋，在近战中压倒了波斯步兵。马铎尼斯骑白马战死，波斯军溃退回营地的木栅，被攻破后遭到屠杀。雅典人则击败了为波斯作战的底比斯人。波斯将领阿尔塔巴佐斯事先带着一支部队撤走，经色雷斯回到亚洲。

  据希罗多德，就在同一天，由斯巴达王列奥提基达斯和雅典人克桑提波斯率领的希腊舰队在小亚细亚的米卡勒登陆，攻破了把战船拖上岸、筑垒自守的波斯军，烧毁了船只。爱奥尼亚各城再次脱离波斯。

  联军用战利品的十分之一在德尔斐献了一只金鼎，支在三条青铜蛇缠成的柱子上，柱身刻着三十一个参战城邦的名字。这根蛇柱后来被君士坦丁移到君士坦丁堡的赛车场，今天仍立在伊斯坦布尔。
sources: []
recalled:
  - 希罗多德《历史》卷九第 1—107 章
  - 修昔底德《伯罗奔尼撒战争史》卷一第 132 章
  - 普鲁塔克《阿里斯提德传》第 10—21 章
