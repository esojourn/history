name: 昭君出塞
summary: 竟宁元年呼韩邪单于入朝求亲，汉元帝把宫女王昭君嫁给他，此后汉匈数十年和平相处。
body: |-
  汉初的和亲是在匈奴强盛时不得已而为之，由宗室女子顶着公主的名义出嫁，并每年赠送财物。武帝以后和亲断绝。昭君出塞的情形与此不同：这时匈奴已经分裂，呼韩邪单于向汉称臣近二十年，是主动来求亲的。

  公元前 36 年郅支单于在康居被汉军攻杀后，呼韩邪上书请求入朝。据《汉书·匈奴传》，竟宁元年（前 33 年）正月他第三次到长安，汉朝的礼遇和赏赐与以前相同，衣服丝帛比上一次加倍。他提出愿意做汉家的女婿，以此亲近汉朝。元帝把后宫的宫女王嫱赐给了他。王嫱字昭君，当时是尚未见过皇帝的“待诏”。《汉书·元帝纪》所载的诏书说，呼韩邪单于不忘恩德，仰慕礼义，愿永保边塞安宁，使边境长无兵革之事，因此改年号为“竟宁”。昭君到匈奴后号称“宁胡阏氏”。

  呼韩邪十分高兴，上书表示愿意为汉朝守卫从上谷到敦煌的边塞，请汉朝撤回守边的吏卒，让天子和百姓得到休息。元帝交给大臣讨论，多数人认为可行，熟悉边事的郎中侯应提出十条理由反对：边塞不仅用来防备匈奴，也防止境内的属国降人、逃亡的奴婢和罪犯越境，而且匈奴强弱无常，要塞一旦废弃就难以恢复。元帝于是派人婉言谢绝，说边塞是为了约束汉人自己，不让他们出去侵扰匈奴。

  当年五月元帝去世。两年后呼韩邪去世，昭君依匈奴的习俗改嫁继位的单于。她在匈奴所生的子女和女婿后来多主张与汉朝和好。从呼韩邪朝汉到王莽初年，北方边境几十年没有战事，《汉书·匈奴传》形容当时边城到傍晚才关门，牛马遍野，几代人没有听到过报警的犬吠。王莽即位后更换单于的印玺、降低其封号，边境才重新开战。

  正史对昭君本人的记载很简略；她自请出塞、临行时元帝惊艳而后悔的说法出自《后汉书》，画工毛延寿的故事出自《西京杂记》。后世的诗文戏曲多写她的哀怨，近代以来则更多强调她对民族和好的贡献。
