name: "普罗维登斯的建立"
summary: "被逐出马萨诸塞的威廉斯建立普罗维登斯，罗得岛以政教分开、信仰自由立制。"
body: |-
  《历史的轨迹》第四十一章说，罗杰·威廉斯因主张政教分开，1635 年被马萨诸塞的法院判令离境；他在严冬逃进荒野，流落十四个星期，被相识的印第安人收留。第二年夏天，他向印第安人买下一块地，跟从他的人陆续从马萨诸塞来到，合力建起普罗维登斯镇，这就是罗得岛的开始。1647 年照威廉斯的原则成立了罗得岛政府，这些原则是政教分开、不强迫信徒投票和宗教自由，书中说它们后来也成了美国政府的基本原则。

  该书说，美洲第一间浸礼派教会就是威廉斯在普罗维登斯成立的。第四十三章又说，罗得岛、新泽西、特拉华和宾夕法尼亚之所以没有官方教会，是因为这几处浸礼派和贵格派信徒占多数，而这两派都主张政教分开。据一般记载，威廉斯给新居地取名“普罗维登斯”，意思是“神的眷顾”；罗得岛 1644 年得到英国国会的特许状，1663 年又得到查理二世的王家特许状，其中明文保障信仰自由，此后罗得岛一直是在别处受逼迫的浸礼派、贵格派以及犹太人的避难之地。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十一章“教会进入新大陆” https://wellsofgrace.com/books/spiritual/2000years/html/chapter46.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十三章“新兴国家的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter48.html"
