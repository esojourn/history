name: 郑成功收复台湾
summary: 1661 年郑成功进军台湾，次年荷兰台湾长官揆一投降。
body: |-
  1624 年荷兰东印度公司占据台湾南部，修筑了热兰遮城和赤嵌楼（普罗民遮城），以台湾作为对中国、日本贸易的据点，向当地居民征税。1642 年荷兰人又赶走了占据台湾北部的西班牙人。

  顺治十六年（1659 年）郑成功北伐南京失败后，退回厦门，清朝实行迁界禁海，郑成功的处境日益困难。曾在荷兰人手下担任通事的何斌来到厦门，向郑成功献上台湾地图，建议他攻取台湾作为根据地。顺治十八年（1661 年）三月，郑成功不顾部分将领的反对，率领两万多名官兵（各书说法不一）、数百艘船从金门出发，经澎湖到达台湾。

  四月初一，郑军乘涨潮通过鹿耳门水道，在禾寮港登陆，很快攻下了赤嵌楼，然后包围了荷兰人据守的热兰遮城。荷兰人从巴达维亚派来援军，在海上被郑军击败。经过九个月的围困，城中缺粮、疾病流行，康熙元年（1662 年）初，荷兰台湾长官揆一签约投降，率领残余人员撤离台湾，结束了荷兰在台湾三十八年的统治。

  郑成功随后在台湾设立承天府和天兴、万年二县，推行屯田，招徕大陆移民。同年五月郑成功病逝，他的儿子郑经继续经营台湾。揆一回国后被荷兰东印度公司追究责任，后来出版了《被忽视的福摩萨》一书，为自己辩护，也记述了这场战争的经过。
sources: []
recalled:
  - 杨英《先王实录》
  - 揆一《被忽视的福摩萨》
  - 江日昇《台湾外记》
  - 《热兰遮城日志》
