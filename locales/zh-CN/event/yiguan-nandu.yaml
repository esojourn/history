name: 衣冠南渡
summary: 西晋末年中原大乱，北方士族和百姓大批迁往长江流域，是中国第一次大规模人口南迁。
body: |-
  永嘉元年（公元 307 年），琅邪王司马睿与王导渡江镇守建邺，已有一批北方士人相随。永嘉五年洛阳陷落前后，逃难的规模急剧扩大。《晋书·王导传》说，洛阳倾覆以后，中原的士人和妇女到江东避乱的有十分之六七。所谓“衣冠”，指的是士大夫；与他们同行或先后南下的，还有数量大得多的普通百姓、宗族、部曲和佃客。

  南迁大致分东、中、西几路：今山东、河北和河南东部的人渡过淮河，停留在淮南、广陵一带，或继续渡江到京口、建康和太湖周围；洛阳一带和关中的人南下襄阳、江陵，进入汉水和长江中游；陇右和关中另有一部分人翻越秦岭进入蜀地。迁徙多是一个大姓带着乡里宗亲结队而行，推举有威望的人做首领，祖逖、苏峻、郗鉴等都是这样的流民帅。此后北方每有大的战乱，就有新的一批人南来，一直延续到南朝。

  东晋朝廷没有把这些人编入当地的户籍，而是按他们原来的州郡名称，在南方借地设立“侨州”“侨郡”“侨县”，例如在京口一带设南徐州，在江北设南兖州。侨人另立户籍，在相当长的时间里不负担租税和徭役。南渡的高门，如琅邪王氏、陈郡谢氏、颍川庾氏、谯国桓氏，把持了东晋的朝政；他们避开吴姓大族聚居的太湖平原，多到会稽等地占山开田，建立庄园。江东本地的大族虽然被拉进政权，地位在侨姓之下。

  关于南迁的人数，史书没有总的统计。现代学者谭其骧根据侨州郡县的户口估算，到刘宋时北来的侨民及其后裔约有九十万人，占当时南方编户的六分之一左右；没有著籍的人不在其内。这次迁徙把中原的农耕技术、典籍和礼乐制度带到南方，长江下游和浙东由此加速开发，南方在全国经济、文化中的比重从此不断上升。北方士族的语言和风俗也在南方留下了长久的影响。
sources: []
recalled:
  - 《晋书·王导传》
  - 《晋书·地理志》
  - 《宋书·州郡志》
  - 谭其骧《晋永嘉丧乱后之民族迁徙》
