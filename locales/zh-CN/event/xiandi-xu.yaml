name: 曹操迎献帝都许
summary: 公元 196 年，曹操把从长安东归的汉献帝迎到许县，从此以朝廷的名义号令各方。
body: |-
  董卓死后，汉献帝在长安受李傕、郭汜等凉州将领控制。兴平二年（公元 195 年）李、郭二人反目，献帝乘机东归，途中屡遭追击，随行的官员、士兵死伤很多。建安元年（196 年）七月，他在杨奉、董承、韩暹等几支军队的护送下回到雒阳。雒阳六年前已被董卓焚毁，《后汉书·献帝纪》说百官只能在残垣断壁之间栖身，尚书郎以下的官员要自己出去采野菜，有人饿死。

  这时曹操已占据兖州，又新得豫州的颍川、汝南。据《三国志·魏书·荀彧传》，对于要不要迎接皇帝，部下意见不一；荀彧举晋文公迎周襄王、汉高祖为义帝发丧的先例，认为奉迎天子可以得人心、服豪杰，曹操于是决定前往。袁绍的谋士沮授此前也曾提出同样的建议，袁绍没有采纳。

  八月曹操到达雒阳，献帝任他为司隶校尉、录尚书事。议郎董昭建议以雒阳残破无粮为由，把皇帝迁到离曹操根据地较近的许县。九月献帝到许，以此为都，曹操任司空，行车骑将军事，把大将军的名号让给袁绍。同年，曹操采纳枣祗、韩浩的建议，在许县周围招募流民屯田，《三国志》注引《魏书》说当年收获谷物一百万斛。

  从此曹操发布命令都用朝廷的名义，对手称之为“挟天子以令诸侯”。许县作为汉朝的都城，一直到公元 220 年献帝让位。
sources: []
recalled:
  - 《三国志·魏书·武帝纪》及裴松之注
  - 《三国志·魏书·荀彧传》《董昭传》
  - 《后汉书·孝献帝纪》
