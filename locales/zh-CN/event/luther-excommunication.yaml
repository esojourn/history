name: "路德被开除教籍"
summary: "1520 年教皇限路德六十天内认错，路德焚烧诏书，次年被开除教籍。"
body: |-
  莱比锡辩论之后，艾克到罗马，与迦耶坦等人起草了谴责路德的诏书。1520 年 6 月 15 日教皇利奥十世签署，诏书以“主啊，求你起来”开头，说有野猪闯进了主的葡萄园。《历史的轨迹》第二十二章说，诏书列举路德的四十一条论点，斥为异端、谬误、冒犯敬虔的耳朵，命令焚毁他的著作，限他和跟从者六十天内公开认错，否则以异端论处，并要各地官府捉拿他们。

  诏书交给艾克和亚良德到德意志公布。该书说，艾克发现写诏书比颁布诏书容易，肯让他张贴的地方很少，爱尔福特的学生把印本扔进了河里。亚良德在鲁汶、科隆等地焚烧了路德的书。

  这半年里路德接连写了三篇文章，该书称为三份伟大的改教论著。8 月的《致德意志基督徒贵族书》用德文写，说教皇一派筑了三道墙保护自己，其实受洗的人都是祭司，君主贵族有权召开公会议革除弊端。10 月的《教会被掳于巴比伦》用拉丁文写给神学家，说七件圣礼里只有洗礼、圣餐等是基督设立的，不给平信徒领杯、化质说和弥撒献祭是对圣餐的三重捆绑。11 月的《基督徒的自由》说，基督徒凭信心是自由的主人，不受任何人管辖；凭爱心是众人的仆人，受一切人管辖。

  诏书 10 月送到维滕贝格，六十天的期限从那时算起。12 月 10 日期满，教授和学生聚在城的东门外。该书说，一位教授点着柴堆，路德把几册教会法令集放上去，再把教皇的诏书投进火里，学生们留在那里唱歌，闹到很晚。

  1521 年 1 月 3 日教皇颁布诏书《罗马教皇理当》，正式把路德开除教籍。按当时的法律，接下来应由世俗政权执行，教皇于是向新当选的皇帝查理五世要求处置路德。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十二章“教会大大骚动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter25.html"
recalled:
  - "利奥十世诏书《主啊，求你起来》（1520 年 6 月 15 日）、《罗马教皇理当》（1521 年 1 月 3 日）"
