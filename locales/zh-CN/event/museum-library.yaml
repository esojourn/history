name: 亚历山大博学园与图书馆的创立
summary: 托勒密王室在亚历山大城设立供养学者的博学园和规模空前的图书馆。
body: |-
  博学园（希腊语“缪塞昂”，意为缪斯女神的圣所，西文“博物馆”一词由此而来）和图书馆设在亚历山大城的王宫区。它们创办于哪一年没有记载。较早的传统把它归于托勒密一世，并说出主意的是公元前 297 年以后流亡到埃及的漫步派学者法勒隆的德米特里，因此通常把创始定在前 290 年代到前 280 年代；也有古人把功劳归于托勒密二世。大概是一世时开其端，二世时具规模。

  据斯特拉波在公元前 1 世纪末所见，博学园是王宫的一部分，有散步的廊道、设座位的敞厅和一间大房子，里面是学者们共用的餐厅；学者们财产共有，由国王任命一位祭司主持。他们领取薪俸，免除赋税，不必授徒，专事研究。这种由君主出钱长期供养一批学者的做法，在希腊世界是第一次。图书馆与博学园相连，没有独立的建筑见于记载；后来在城西南的塞拉皮斯神庙另有一处“子馆”。

  托勒密诸王搜集图书不遗余力。盖伦记载，凡进港的船只所带的书都要交出抄录，原本留馆，抄本还给主人；托勒密三世向雅典借来三大悲剧诗人的官方定本，宁肯不要押金也不归还。藏书的数量，古代作家说有四十万卷、七十万卷不等，都无从核实。诗人卡利马科斯编了一部一百二十卷的分类书目。历任馆长见于记载的有以弗所的泽诺多托斯、罗得岛的阿波罗尼奥斯、埃拉托色尼、拜占庭的阿里斯托芬、萨摩色雷斯的阿里斯塔科斯等。他们校勘荷马史诗和其他古籍，创立了标点、重音符号和校勘记号，今天的古典文本大多经过他们的手。欧几里得、测算地球周长的埃拉托色尼、解剖学家赫罗菲洛斯等也在亚历山大城工作。据《阿里斯提亚书信》，希伯来律法书的希腊文翻译也是在托勒密二世的图书馆名下进行的，这封书信的细节多属传说。

  图书馆的结局没有一场确定的大火。公元前 48 年恺撒在亚历山大城作战时纵火烧船，火势蔓延，古代作家有的说烧掉了几万卷书，有的说烧的是码头边的书库；此后图书馆仍然存在。公元 272 年前后罗马皇帝奥勒良平叛，王宫区被毁；391 年塞拉皮斯神庙被拆。所谓 642 年阿拉伯人奉哈里发之命焚书的故事，最早见于五百多年以后，现代学者一般认为不可信。
sources: []
recalled:
  - 斯特拉波《地理志》卷十七第 1 章第 8 节
  - 《阿里斯提亚书信》第 9—11 节
  - 盖伦《希波克拉底〈流行病〉第三卷注》
  - 普鲁塔克《恺撒传》第 49 章
  - 阿米阿努斯《历史》卷二十二第 16 章
