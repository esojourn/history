name: 伊壁鸠鲁创立“花园”
summary: 公元前 306 年伊壁鸠鲁在雅典购置园子，与弟子共同生活讲学。
body: |-
  公元前 307 年围城者德米特里赶走卡山德的驻军，雅典恢复了民主政体。一度通过的限制哲学学校的法律在次年被废止。前 306 年，三十五岁的伊壁鸠鲁带着在米提利尼和兰普萨库斯结识的弟子迁回雅典，在城内的梅利特区买了一所房子，又据第欧根尼·拉尔修引阿波罗多罗斯的话，用八十明那在城墙外通往柏拉图学园的路旁买下一座园子。学派因此被称为“花园”。

  “花园”与其说是学校，不如说是一个朋友的团体。成员在这里同住同食，各人保有自己的财产，伊壁鸠鲁不赞成像毕达哥拉斯派那样财物公有，认为那意味着彼此不信任。团体里有妇女，如墨特罗多罗斯的伴侣列昂提翁，还有奴隶，如伊壁鸠鲁的仆人米斯，他们也参与学习，这在当时的学校里是没有的。成员每月二十日聚餐，纪念创立者，这个习惯在他死后延续了几百年。伊壁鸠鲁与外地的同道频繁通信，把学说的要点写成便于记诵的书信和格言。

  学派的宗旨是求得心灵的安宁。它教人不必怕神、不必怕死，欲望分为自然而必要的、自然而不必要的和既不自然也不必要的，只需满足第一种；友谊是幸福最可靠的保障；公共事务则应远离。因为讲快乐、收女弟子、不问政事，它从一开始就受到其他学派和世人的非议。

  伊壁鸠鲁在遗嘱里把园子留给继任者赫尔马科斯和以后的掌门人，这份遗嘱保存在第欧根尼·拉尔修的书里。学派传承不断，学说也少有改动。前 1 世纪它在罗马很有影响，卢克莱修的长诗和赫库兰尼姆出土的菲洛德穆斯著作是这一时期的见证；公元 2 世纪小亚细亚的奥伊诺安达有人把学说刻满了一面石墙。
sources: []
recalled:
