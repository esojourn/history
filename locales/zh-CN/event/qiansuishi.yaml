name: 遣隋使
summary: 倭国多次遣使到隋朝，607 年国书自称“日出处天子”，隋炀帝看后不悦。
body: |-
  据《隋书·倭国传》，开皇二十年（公元 600 年），倭王“阿每多利思比孤”派使者到隋朝，这是倭国在南朝之后首次与中原王朝通使；这次遣使不见于日本的《日本书纪》。当时倭国由推古天皇在位，圣德太子摄政，正在推行冠位十二阶等改革。

  大业三年（607 年），倭国再次遣使，《日本书纪》记载这次的使者是小野妹子。据《隋书·倭国传》，使者带来的国书写道“日出处天子致书日没处天子无恙”，隋炀帝看了很不高兴，对鸿胪卿说，蛮夷的书信有无礼的，以后不要再呈上来。尽管如此，次年隋朝仍派文林郎裴世清随小野妹子出使倭国，倭王派人隆重迎接。同年小野妹子再次随裴世清来隋，随行的有高向玄理、僧旻、南渊请安等留学生和学问僧。

  此后倭国在大业十年（614 年）还派过一次使者。这些留学生和学问僧在中国生活了十几年到三十多年，经历了隋唐易代，回国后参与了 645 年开始的大化改新，把隋唐的制度带回日本。遣隋使之后，倭国又多次派出遣唐使（另见“遣唐使”条）。
sources: []
recalled:
  - 《隋书·东夷传·倭国》
  - 《日本书纪》卷二十二
