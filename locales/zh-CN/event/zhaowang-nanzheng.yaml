name: 昭王南征不复
summary: 周昭王南征楚地，死于汉水，西周王室的扩张遭到挫折；断代工程定在约前 977 年。
body: |-
  周昭王是康王之子，在位期间多次向南用兵。据《史记·周本纪》，“昭王之时，王道微缺。昭王南巡狩不返，卒于江上。其卒不赴告，讳之也”。《竹书纪年》佚文说昭王十六年伐楚，渡汉水时遇到大兕；十九年“丧六师于汉”。《左传》僖公四年记齐桓公伐楚时，管仲质问楚国“昭王南征而不复”，楚使回答说“君其问诸水滨”。

  后世还有一种说法：汉水边的人用胶粘的船载昭王渡河，船到中流解体，昭王溺死。这一说法见于汉代以后的注释，未必可信。青铜器铭文中有不少关于昭王南征的记载，如过伯簋、𤞷驭簋等，说明南征确有其事，并且俘获了不少铜料。

  昭王死后，穆王继位。这次失败使周王室在南方的扩张受挫。夏商周断代工程把昭王之死定在约公元前 977 年。
sources: []
recalled:
  - 《史记·周本纪》
  - 《竹书纪年》（佚文）
  - 《左传》僖公四年
