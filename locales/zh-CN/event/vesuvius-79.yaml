name: 维苏威火山爆发，庞贝被埋
summary: 公元 79 年维苏威火山爆发，庞贝、赫库兰尼姆等城被火山灰和碎屑流掩埋。
body: |-
  那不勒斯湾边的维苏威山在罗马人眼里只是一座长满葡萄的山，没有人知道它是火山。公元 62 年或 63 年，这一带发生过一次强烈地震，庞贝许多房屋到十几年后还在修缮。

  公元 79 年的爆发，有小普林尼写给塔西佗的两封信作目击记录。他当时十七岁，住在海湾西北角的米塞努姆。据信中所述，那天午后山上升起一朵形状像松树的云，树干极高，顶上分出枝杈。他的舅舅老普林尼是驻米塞努姆的舰队司令，带船前往救人，第二天清晨死在斯塔比亚的海滩上。信的各种抄本所记的日期多作 8 月 24 日；2018 年庞贝一面墙上发现一行炭笔字，日期相当于 10 月 17 日，加上遗址里出土的秋季果实和取暖的火盆，现在不少学者认为爆发是在 10 月下旬。

  火山学家根据地层复原了经过：喷发柱高达三十公里上下，浮石和火山灰被风吹向东南，在庞贝落了十几个小时，压塌屋顶；次日凌晨起喷发柱几次崩塌，炽热的碎屑流顺山坡冲下，先吞没山脚西侧的赫库兰尼姆，再扫过庞贝，留在城里的人顷刻毙命。庞贝被埋在四到六米的浮石和火山灰下，赫库兰尼姆上面的堆积厚达二十米左右。死亡人数无从确知；庞贝已发掘的约三分之二城区里找到一千一百多具遗体，赫库兰尼姆的海边船库里 1980 年代以来发现了三百多具。

  皇帝提图斯即位才几个月，他派人主持善后，把无人继承的遇难者遗产拨给灾民，并亲自到坎帕尼亚察看。被埋的城没有重建，渐渐被人遗忘。1738 年和 1748 年，那不勒斯国王的工程人员先后挖到赫库兰尼姆和庞贝。1863 年起，考古学家菲奥雷利向火山灰里遗体腐烂后留下的空腔灌注石膏，取得遇难者临终的形状。两座城连同街道、店铺、壁画、涂写和碳化的面包、书卷一起保存下来，是了解罗马人日常生活最直接的材料。
