name: "圣巴多罗买大屠杀"
summary: "1572 年 8 月 24 日起巴黎及外省屠杀胡格诺派，科利尼等数千人遇害。"
body: |-
  1570 年的和约之后，胡格诺派的首领科利尼回到宫廷，劝国王查理九世出兵尼德兰打西班牙。太后凯瑟琳为巩固和平，把女儿玛格丽特许配给胡格诺派的纳瓦拉国王亨利。《历史的轨迹》第三十章说，所有胡格诺派的领导人物都被邀到巴黎参加婚礼。婚礼 1572 年 8 月 18 日举行；巴黎是天主教情绪最强烈的城市，市民对这门婚事十分愤恨。

  8 月 22 日科利尼在街上遭枪击受伤，凶手是从一所与吉斯家有关系的房子里开的枪。胡格诺贵族要求查办。该书说，天主教极端派警告太后胡格诺派阴谋夺位，太后便说服国王策动一场预谋的屠杀。按多数史家的看法，决定是 23 日夜里在卢浮宫的会议上仓促作出的，原意是杀掉几十名首领；事前是否早有计划，一直有争论。

  24 日是圣巴多罗买节。凌晨，王宫对面教堂的钟声响起，吉斯公爵带人杀了科利尼，住在卢浮宫里的胡格诺贵族被赶到院中刺死。纳瓦拉的亨利和孔代亲王因是王族被留下，被迫改宗。城门关闭，民兵和市民挨户搜杀，不分男女老幼，尸体抛进塞纳河，国王下令停止也无人理会。该书说屠杀持续了三天三夜。

  消息传到外省，里昂、奥尔良、鲁昂、波尔多、图卢兹等十几个城市在此后几个星期里也杀了起来。该书说单巴黎就有两千多新教徒被杀，全法国超过一万。死亡人数没有可靠的统计，巴黎一般估计为两三千，全国的估计从五千到三万不等。

  教皇格列高利十三世在罗马举行感恩礼并铸了纪念章，西班牙国王腓力二世表示满意；英格兰和德意志的新教各邦震惊。许多胡格诺派改宗或逃往日内瓦、英格兰。该书说，这件事没有结束内战，反而给内战添了新的冲力。幸存者不再相信国王，贝扎等人著书主张人民可以抵抗暴君。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
