name: 同盟者战争
summary: 意大利同盟者为争取罗马公民权起兵，罗马以让步平息战事，意大利人成为公民。
body: |-
  公元前 91 年至前 88 年罗马与意大利同盟者之间的战争。“同盟者”指与罗马订有盟约的意大利各族，他们为罗马军队提供一半以上的兵员，却不是罗马公民：不能投票，不受申诉权保护，战利品和土地分得少。格拉古的土地法又触及他们占用的公有地。前 125 年和前 122 年两次有人提议给他们公民权，都未成功；前 95 年的一项法律把冒充公民的同盟者清出罗马，积怨更深。

  前 91 年保民官李维乌斯·德鲁苏斯再次提出公民权法案，秋天他遇刺身亡。年底，一名罗马大法官在皮凯努姆的阿斯库卢姆威吓当地人，被杀，城中的罗马人也都被杀。中部的马尔西人、佩利格尼人，南部的萨莫奈人、卢卡尼亚人等相继起事；伊特鲁里亚、翁布里亚和大多数拉丁殖民地没有参加。起事各族以科尔菲尼乌姆为都，改名意大利卡，设元老院和两名执政官，马尔西人波派迪乌斯·西洛和萨莫奈人帕皮乌斯·穆提鲁斯分领两路。他们的目标是取得公民权还是脱离罗马独立，学者看法不一，各族也未必相同。

  前 90 年罗马两线都吃了败仗，一名执政官阵亡。同盟者的士兵多年与罗马人并肩作战，装备战法完全相同。这年年底，执政官卢基乌斯·尤利乌斯·恺撒提出法律，把公民权给予没有起事的同盟者；前 89 年的普劳提乌斯—帕皮里乌斯法又给予在限期内登记的人。让步瓦解了对方的阵营。军事上，庞培·斯特拉波攻下阿斯库卢姆，苏拉在坎帕尼亚和萨莫奈连胜，前 88 年西洛战死，只有萨莫奈人和卢卡尼亚人的一部分坚持到后来的内战。

  据维莱伊乌斯，双方死了三十万人，这个数字无从核实。战后波河以南的自由民都成了罗马公民，罗马从一个城邦变成覆盖半岛的国家。新公民起初只被编入少数几个部落，投票权有名无实；如何分配他们，成为前 88 年保民官苏尔皮基乌斯与苏拉冲突的导火线之一。
