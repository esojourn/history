name: 约西亚改革
summary: 犹大王约西亚在圣殿得律法书，随即清除偶像，重守逾越节。
body: |-
  约西亚八岁登基，在耶路撒冷作王三十一年（《列王纪下》22:1）。他的祖父玛拿西、父亲亚们在位时，犹大国中重新建筑邱坛，为巴力筑坛，圣殿里也立了亚舍拉像（21:1–7、21:19–22）。据《历代志下》34:3，约西亚在位第八年开始寻求他祖大卫的神，第十二年开始洁净犹大和耶路撒冷；《列王纪》则把改革都记在第十八年得书之后，两书的次序不同。

  约西亚十八年（约公元前 622 年），王差书记沙番上圣殿去，吩咐大祭司希勒家把奉到殿里的银子交给修殿的工匠。希勒家对沙番说，他在耶和华殿里得了律法书。沙番把书念给王听，王听见书上的话便撕裂衣服，差希勒家等人去求问耶和华。他们去见女先知户勒大，户勒大说耶和华必照书上的话降祸与这地，但因约西亚自卑，这祸不在他的日子临到（22:3–20）。

  王召聚犹大的长老和众民上到圣殿，把约书念给他们听，并在耶和华面前立约，众民都服从这约（23:1–3）。随后他把为巴力、亚舍拉和天上万象所造的器皿搬出圣殿烧掉，废去拜偶像的祭司，污秽从迦巴直到别是巴的邱坛和欣嫩子谷的陀斐特，又污秽所罗门为亚斯他录、基抹、米勒公所筑的邱坛。他还到伯特利，拆毁尼八的儿子耶罗波安所筑的坛，在坛上烧人的骸骨，并废去撒玛利亚各城的邱殿（23:4–20）。事后王吩咐众民照约书上所写的守逾越节；23:22 说，自从士师治理以色列以来，没有守过这样的逾越节。

  约西亚所得的是哪一卷书，圣经没有说明。学界多认为是《申命记》或它的核心部分，因为改革的做法（只在一处敬拜、废除各地邱坛）与《申命记》的要求最为接近。先知耶利米在约西亚十三年蒙召（《耶利米书》1:2），比得书早五年；《耶利米书》没有直接记述这次改革，11:1–8 提到宣告这约的话，有人认为与此有关。

  约西亚后来在米吉多迎战北上的埃及法老尼哥，阵亡（《列王纪下》23:29–30）。接续他的约哈斯、约雅敬，《列王纪》都说他们行耶和华眼中看为恶的事（23:32、23:37）。
sources: []
recalled:
  - 《列王纪下》第 21 章、第 22—23 章
  - 《历代志下》第 34—35 章
  - 《耶利米书》1:2、11:1–8
  - 《申命记》第 12 章
