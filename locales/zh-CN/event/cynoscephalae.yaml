name: 库诺斯克法莱战役
summary: 罗马军团击败马其顿方阵，腓力五世退出希腊。
body: |-
  第二次马其顿战争的决战，公元前 197 年发生在色萨利一片名为“狗头”的丘陵上。罗马统帅是弗拉米尼努斯，对手是马其顿国王腓力五世。据波利比乌斯，那天清晨有浓雾，双方的前哨在山脊上遭遇，各自不断增兵，演变成全军交战。

  腓力率先到达山顶的右翼方阵居高临下冲击，把罗马左翼逼退；他的左翼还在行军途中，没来得及列阵，就被罗马右翼连同战象击溃。这时一名罗马军团长官带着二十个中队，从背后攻击正在取胜的马其顿右翼，方阵无法转身，随即崩溃。据波利比乌斯，罗马方面阵亡约七百人，马其顿方面约八千人战死，被俘不少于五千人。他在叙述之后专门比较了方阵与军团的长短。次年腓力接受和约，撤出希腊。
sources:
  - 波利比乌斯《历史》卷十八第 18—32 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/18*.html
  - 英文维基百科“Battle of Cynoscephalae”（核对年份） https://en.wikipedia.org/wiki/Battle_of_Cynoscephalae
recalled:
  - 李维《罗马史》卷三十三第 6—10 章
