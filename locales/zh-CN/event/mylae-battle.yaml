name: 米莱海战
summary: 第一次布匿战争中，罗马新建的舰队用“乌鸦”吊桥击败迦太基，首次赢得海战。
body: |-
  公元前 260 年，第一次布匿战争中罗马海军的第一次胜利，发生在西西里岛东北角的米莱附近海面。

  战争头几年在西西里陆上进行，罗马人攻下了阿克拉伽斯，但沿海城市仍可由迦太基舰队接济，意大利海岸也屡遭袭扰。据波利比乌斯，罗马人决定造舰：以一艘早先搁浅俘获的迦太基五列桨战船为样本，造了一百艘五列桨船和二十艘三列桨船，船还在造，桨手就坐在岸上的长凳上练习划桨。波利比乌斯把这说成罗马人第一次下海，有些夸张，罗马此前有过小规模的舰队，也可以依靠意大利南部希腊盟邦的造船经验。

  舰队下水后，执政官格奈乌斯·科尔内利乌斯·西庇阿带十七艘船去利帕里岛，被迦太基人堵在港内俘获。另一名执政官盖乌斯·杜伊利乌斯接掌舰队。罗马人自知船笨人生，有人想出在船头竖一根桅杆，上面挂一块可以转动的跳板，板头底下有一根铁钉；放下时铁钉扎进敌船甲板，两船便连在一起，士兵冲过去厮杀。士兵管它叫“乌鸦”。

  迦太基统帅汉尼拔（与后来那位名将不是一人）率一百三十艘船前来，据波利比乌斯，他们看不起对手，连阵形也不排就冲上来。前锋三十艘船被“乌鸦”钩住，包括汉尼拔乘坐的旗舰，他乘小艇逃脱。其余的船想绕到侧后用撞角，仍被转动的跳板钩住。迦太基人一共损失了五十艘船。

  杜伊利乌斯举行了罗马第一次海战凯旋式，广场上立起饰有敌船撞角的纪功柱。此后“乌鸦”又在前 256 年的埃克诺穆斯海战中发挥作用；这种装置使船头过重，有学者认为是罗马舰队几次在风暴中损失惨重的原因之一，战争后期不再见于记载。
sources: []
recalled:
  - 波利比乌斯《历史》卷一第 20—24 章
  - 杜伊利乌斯纪功柱铭文
  - 李维《建城以来史》卷十七摘要
