name: 宁王之乱
summary: 1519 年宁王朱宸濠在南昌起兵叛乱，王守仁调集兵力，三十多天就将其平定。
body: |-
  宁王朱宸濠是朱元璋第十七子朱权的后代，封地在南昌。正德年间，他见正德帝荒于游乐、没有儿子，暗中图谋帝位，贿赂朝中官员和宦官，扩充护卫军队，招揽亡命之徒。正德十四年（1519 年）六月，朝廷准备追究他的不法行为，朱宸濠在南昌起兵，杀死江西巡抚孙燧，号称十万大军，顺长江东下进攻安庆，打算攻取南京。

  当时王守仁以南赣巡抚的身份正在去福建的路上，听到消息后立即回到吉安，调集各府县的兵力，又散布假消息，使朱宸濠迟疑了十多天才出兵。等朱宸濠率主力围攻安庆时，王守仁率军直取南昌，一举攻克。朱宸濠只好回救南昌，两军在鄱阳湖一带交战，王守仁用火攻击败宁王军，俘虏了朱宸濠。从起兵到被俘，前后只有三十多天。

  正德帝得知宁王叛乱后，仍以亲征为名南下，到达时叛乱早已平定。他身边的宠臣江彬、张忠等人嫉妒王守仁的功劳，诬陷他与宁王勾结，甚至有人提议把朱宸濠放回鄱阳湖，让正德帝亲自再擒一次。王守仁把俘虏交给了宦官张永，才得以脱身。正德十五年（1520 年）朱宸濠被押到通州处死。
sources: []
recalled:
  - 《明史·王守仁传》
  - 《明史纪事本末·宸濠之叛》
