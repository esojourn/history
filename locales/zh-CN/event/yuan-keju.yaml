name: 元朝恢复科举
summary: 1313 年元仁宗下诏恢复科举，以朱熹的《四书》注释为准，1315 年首次开考。
body: |-
  蒙古统治中原以后，长期没有举行科举考试。窝阔台时耶律楚材曾在 1238 年主持考选儒士，但只举行了一次。忽必烈在位期间，许衡等儒臣多次建议恢复科举，都因朝中意见分歧而没有实行。元朝的官员主要通过怯薛出身、恩荫和由吏员升迁等途径产生，汉族读书人的出路很窄。

  元仁宗即位后，有意推行儒治。皇庆二年（公元 1313 年）十一月，他下诏恢复科举，规定三年举行一次，分乡试、会试、殿试三级。考试分为左右两榜：蒙古人、色目人为一榜，汉人、南人为另一榜，考试的内容和难度不同，录取的名额也按四等人分配，据《元史·选举志》，每次会试录取一百人，四等人各占一定的名额。考试内容以经学为主，规定《四书》的解释以朱熹的《四书章句集注》为准，经义也采用程朱学派的注释。延祐二年（1315 年）元朝举行了第一次会试和殿试。

  元朝的科举录取人数很少，对官员选拔的作用有限，元顺帝初年还一度被权臣伯颜废止，后来又恢复。但这次恢复科举有深远的影响：程朱理学从此成为国家考试的标准，明清两代的科举都沿用以《四书章句集注》为准的规定，直到清末废除科举为止，前后约六百年。
sources: []
recalled:
  - 《元史·选举志》
  - 《元史·仁宗本纪》
