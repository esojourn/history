name: 端平入洛
summary: 1234 年宋军北上收复汴京、洛阳，因粮草不继被蒙古军击退，宋蒙战争由此开始。
body: |-
  端平元年（公元 1234 年）正月金朝灭亡，蒙古军主力北撤，河南一带兵力空虚。南宋的赵范、赵葵兄弟和全子才等人主张趁机收复北宋的三京（东京开封、西京洛阳、南京应天），宋理宗和宰相郑清之支持这一主张，不少大臣认为准备不足、会招致蒙古报复，表示反对。

  六月，全子才率军进入汴京，当时城中已十分残破，守将崔立已被部下杀死。赵葵随后率主力赶到，派徐敏子等率军西进，七月进入洛阳。但宋军的粮草转运不继，部队缺粮。蒙古军回师反击，据记载还在汴京附近掘开黄河堤岸，宋军在洛阳附近被击败，被迫全线撤退，收复的地方随即全部丧失。

  端平入洛失败后，蒙古以南宋背盟为由，从 1235 年起分路进攻四川、京湖、两淮，宋蒙战争正式爆发。这场战争断断续续进行了四十多年，直到 1279 年南宋灭亡。
sources: []
recalled:
  - 《宋史·理宗本纪》
  - 《宋史·赵葵传》
  - 《元史·太宗本纪》
