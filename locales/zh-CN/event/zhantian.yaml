name: 太康占田制
summary: 晋灭吴后颁行占田、课田和户调的制度，并裁撤州郡兵，史称“太康之治”的开端。
body: |-
  太康元年（公元 280 年）晋灭吴，结束了汉末以来近百年的分裂。晋武帝随即颁布一套有关土地和赋税的制度。据《晋书·食货志》，男子一人可以占田七十亩，女子三十亩；其中丁男按五十亩、丁女按二十亩缴纳田租。每户每年另交绢三匹、绵三斤，称为户调。官员按品级占田，一品五十顷，以下每品递减五顷，至九品十顷，并可以荫庇一定数量的亲属和佃客免除赋役。

  同时，武帝下诏裁撤各州郡的军队，大郡只留武吏一百人，小郡五十人，地方的兵权集中到出镇各地的宗室诸王手中。《食货志》说太康年间天下无事，赋税平均，百姓安居乐业。据《晋书·地理志》，这一年全国有户二百四十五万余，口一千六百一十六万余。

  占田的亩数是限额还是实际授给的数量，这套制度究竟推行到什么程度，后世学者看法不一。州郡无兵和诸王掌兵的安排，在十年后的八王之乱中显出了后果。
sources: []
recalled:
  - 《晋书·食货志》
  - 《晋书·地理志》
  - 《晋书·武帝纪》
