name: 唐太宗亲征高句丽
summary: 645 年唐太宗亲征高句丽，攻下辽东城等十城，但在安市城下久攻不克。
body: |-
  贞观十六年（公元 642 年）高句丽权臣渊盖苏文杀死国王，独揽大权，又联合百济进攻新罗。太宗派使者要求停战，渊盖苏文不听。太宗以讨伐弑君之罪为名，决定亲征。

  贞观十九年（645 年）四月，李勣率军渡过辽水，攻克盖牟城；五月太宗亲临辽东城下，唐军借南风纵火，攻克辽东城，随后又攻下白岩城。六月，唐军进围安市城，高句丽派大将高延寿、高惠真率领据《资治通鉴》号称十五万的援军来救，太宗在城外设伏，大败援军，二人率部投降。

  安市城守军顽强抵抗，唐军围攻两个多月，筑起土山逼近城墙，土山崩塌后反被守军夺占。九月辽东天气转冷，草枯水冻，粮食也快耗尽，太宗只好下令撤军。据《资治通鉴》，这次出征共攻下玄菟、辽东、盖牟、白岩等十城，迁徙辽州、盖州、岩州的户口七万人入中原，唐军战死近二千人，战马死去十之七八。撤军途中经过辽泽，泥泞难行，士卒又多冻死。据记载，太宗事后感叹，如果魏征还在，一定不会让他有这次出征。此后唐朝改用小股部队轮番袭扰的方法，直到高宗时才最终灭亡高句丽。
sources: []
recalled:
  - 《旧唐书·太宗纪》
  - 《旧唐书·高丽传》
  - 《资治通鉴》卷一百九十七至一百九十八
