name: 襄阳之战
summary: 元军围攻襄阳、樊城近六年，1273 年樊城被攻破，吕文焕献襄阳投降。
body: |-
  襄阳和樊城隔汉水相望，是南宋京湖防线的核心，控制着从中原进入长江中游的通道。中统二年（公元 1261 年）南宋泸州守将刘整投降蒙古，他向忽必烈建议，攻宋应先攻襄阳，并且要建立一支强大的水军，忽必烈采纳了这个意见。

  从至元四年（1267 年）末起（一说从次年起算），元将阿术、刘整率军包围襄阳、樊城。元军在襄樊周围的鹿门山、白河口等地修筑城堡，又在汉水中设置木栅，切断襄阳与外界的水陆交通，同时大造战船，训练水军。南宋守将吕文焕率军民坚守，南宋朝廷几次派范文虎等人率军救援，都被元军击败。主政的贾似道对朝廷隐瞒军情，没有全力救援。咸淳八年（1272 年）民兵首领张顺、张贵率领一支船队冲破封锁进入襄阳，送去了急需的物资，张顺在途中战死，张贵后来出城求援时也战死。

  至元十年（1273 年）正月，元军用西域工匠亦思马因等人制造的回回炮攻城，先攻破樊城，守将范天顺自缢，牛富巷战而死。随后元军把回回炮对准襄阳，炮石击中城楼，声如雷霆，城中人心惶惶。二月，孤立无援的吕文焕献出襄阳投降。

  襄阳失守后，南宋在长江中游的防线崩溃。次年忽必烈以伯颜为统帅，元军从襄阳顺汉水入长江，沿江东下，吕文焕为元军前导，长江沿线的宋将纷纷投降，两年后南宋朝廷在临安投降（另见“临安投降”条）。
sources: []
recalled:
  - 《元史·阿术传》
  - 《元史·刘整传》
  - 《宋史·度宗本纪》
