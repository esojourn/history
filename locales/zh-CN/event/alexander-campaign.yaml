name: 亚历山大东征
summary: 亚历山大率马其顿与希腊联军渡海东进，十一年间灭波斯帝国，远至中亚和印度河流域。
body: |-
  向波斯开战是腓力二世定下的，名义是报复薛西斯当年入侵希腊、焚毁神庙，并解放小亚细亚的希腊城邦。公元前 334 年春，亚历山大留安提帕特镇守马其顿，自己率军渡过赫勒斯滂海峡。兵力各书所记不一，大致是步兵三万余、骑兵五千左右，其中马其顿人约占一半，其余是希腊盟军、雇佣军和巴尔干各族的部队。军中带有工程师、测量人员和史官。

  头两年打的是地中海东岸。前 334 年他在格拉尼库斯河击败小亚细亚的波斯总督们，南下攻取沿海城市，随后解散了自己的舰队，改用占领港口的办法对付占优势的波斯海军。前 333 年 11 月他在伊苏斯击败大流士三世，接着用七个月攻下岛城推罗，再取迦萨，进入埃及，在那里建亚历山大城。前 331 年他回师东进，10 月 1 日在高加米拉第二次击败大流士，巴比伦、苏萨不战而降，前 330 年初进入波斯波利斯。波斯各都城的金库落入他手中，据狄奥多罗斯等人，总数在十八万塔兰特上下。

  前 330 年夏大流士被部下杀害。亚历山大在埃克巴坦那遣散了希腊盟军，表示为希腊复仇的战争到此为止；此后他以大流士的继承人自居，追讨弑君的贝苏斯，进入帝国东部。前 329 年至前 327 年在巴克特里亚和索格底亚那的战事最为艰苦，对手不再是可以一战而定的大军，而是各地首领的反复起事。他在锡尔河边建了“最远的亚历山大城”，娶当地贵族之女罗克珊娜，并开始编练三万名伊朗青年。

  前 327 年他南越兴都库什山，前 326 年渡印度河，在希达斯皮斯河击败波罗斯。军队到希发西斯河后拒绝再向东走。他折回，造船顺流而下到印度洋，前 325 年分三路西返：克拉特鲁斯走内陆，尼阿库斯率舰队沿海航行，他自己带一部穿越格德罗西亚沙漠，途中死人很多。前 324 年回到苏萨，前 323 年 6 月病逝于巴比伦。

  远征沿途新建或改建了许多以他命名的城市，古人说有七十座，可考的要少得多。希腊人和马其顿人由此迁居到埃及、叙利亚、两河流域直至中亚，希腊语成为这一大片地区的通用语，波斯王室积存的贵金属铸成钱币流通开来。帝国本身没有维持下去，他死后即为部将瓜分。
sources: []
