name: 官交子发行
summary: 1023 年宋朝在益州设立交子务，次年发行官交子，这是由政府发行的早期纸币。
body: |-
  四川地区通行铁钱，铁钱价值低而分量重，买卖稍多就要用车载运，很不方便。宋真宗时，成都一带的商人开始发行一种可以兑换现钱的票据，称为“交子”。据宋人记载，后来由十几户富商联合主持发行，按一定格式印制，持有人可以随时兑换铁钱，兑换时收取一定的费用。后来有的富商经营不善，无法兑现，引起了不少诉讼。

  天圣元年（公元 1023 年），刘太后听政、宋仁宗年幼时，朝廷采纳地方官的建议，在益州设立交子务，由官府接管交子的发行，次年发行第一界官交子。官交子以三年为一界，到期以旧换新，每界规定发行的限额，并准备一定数量的铁钱作为兑换的保证。官交子一般被看作世界上最早由政府正式发行的纸币之一。宋徽宗时交子改称“钱引”，此后由于发行过多，币值大幅贬落。
sources: []
recalled:
  - 《宋史·食货志下三·会子》
  - 李攸《宋朝事实》卷十五
  - 《续资治通鉴长编》卷一百一
