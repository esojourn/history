name: 黄巾起义
summary: 公元 184 年张角率太平道信徒数十万起事，当年被镇压，东汉由此瓦解。
body: |-
  东汉后期，外戚、宦官轮流专权，灵帝公开卖官，地方官吏搜刮无度，加上连年的水旱和疫病，大批农民破产流亡。巨鹿人张角以符水治病、传布太平道，十余年间信徒达数十万，遍及东部和中部八个州。

  据《后汉书·皇甫嵩传》，张角把信徒编为三十六“方”，传布“苍天已死，黄天当立，岁在甲子，天下大吉”的口号，并在京城和各州郡官府的大门上用白土写“甲子”二字，约定甲子年三月五日同时起事。中平元年（公元 184 年）初，弟子唐周上书告密，负责在雒阳联络的马元义被捕处死，受牵连被杀的有一千多人。张角于是传令各方提前在二月起事，徒众都头戴黄巾。本传说他们焚烧官府、攻掠城邑，州郡长官大多弃城而逃，“旬日之间，天下响应，京师震动”。

  灵帝任命外戚何进为大将军守卫京师，宣布赦免党人，派卢植进攻河北的张角，皇甫嵩、朱儁进攻颍川的黄巾军。皇甫嵩在长社用火攻获胜后，与朱儁平定颍川、汝南等郡。河北方面，张角于当年秋天病死；十月皇甫嵩在广宗击破张梁，十一月在下曲阳击杀张宝。南阳的黄巾军占据宛城，坚持到年底也被朱儁攻破。曹操、孙坚、刘备等人都在镇压黄巾的战事中开始露面。

  黄巾的主力不到一年即告失败，但各地以黄巾为名的武装此起彼伏，延续了二十多年。为应付局面，朝廷在中平五年改刺史为州牧，让他们掌握一州的军政大权，各地豪强也纷纷组织私人武装。这些州牧和豪强后来成为割据一方的势力，东汉朝廷名存实亡。
sources: []
recalled:
  - 《后汉书·皇甫嵩朱儁列传》
  - 《后汉书·孝灵帝纪》
  - 《资治通鉴》卷五十八
