name: 丹阳、蓝田之战
summary: 楚怀王受张仪欺骗后发兵攻秦，前 312 年在丹阳、蓝田两战大败，丧失汉中郡。
body: |-
  公元前 313 年，秦国想攻打齐国，但齐、楚结有盟约。秦相张仪到楚国，许诺若楚与齐绝交，秦国愿献出商於之地六百里。楚怀王相信了，派人到齐国辱骂齐王，与齐国断交，再派人到秦国接受土地，张仪却说他答应的是六里。

  据《史记·楚世家》和《张仪列传》，怀王大怒，不听陈轸的劝告，于公元前 312 年发兵攻秦。秦与齐联合反击，楚军在丹阳大败，被斩首八万（《史记》数字），大将屈匄及裨将七十余人被俘，秦军乘势攻取了楚国的汉中郡。怀王又调集全国军队深入秦地，在蓝田再次大败。韩、魏两国乘机南下袭楚，楚军只得撤回。

  丹阳、蓝田之战使楚国元气大伤，此后楚国在秦、齐之间摇摆不定，国势日衰。屈原主张联齐抗秦，这一时期他被怀王疏远。

  丹阳的位置有不同说法，一般认为在丹水之北，今河南西南部至陕西东南部一带。战后秦国设立汉中郡，把关中与巴蜀连成一片，楚国西北的屏障从此丧失。北宋时出土的秦国《诅楚文》石刻，内容是秦王祈求神灵降祸于楚王熊相，学者多认为与这一时期的秦楚战争有关。

  蓝田在今陕西蓝田县一带，楚军已深入到距咸阳不远的地方，可见这次进攻规模之大。
sources: []
recalled:
  - 《史记·楚世家》
  - 《史记·张仪列传》
  - 《史记·屈原贾生列传》
  - 《战国策·楚策》
