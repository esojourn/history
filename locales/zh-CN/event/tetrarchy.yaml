name: 戴克里先建立四帝共治
summary: 公元 293 年戴克里先设两位“奥古斯都”、两位“恺撒”，分守帝国四方。
body: |-
  戴克里先在公元 284 年被军队拥立。他看到一个皇帝无法同时应付莱茵河、多瑙河、幼发拉底河几条战线，将领一旦领兵远征又容易自立。286 年他把同袍马克西米安升为与自己并列的“奥古斯都”，分管西部。293 年 3 月 1 日，两人各收一名副手，称“恺撒”：戴克里先的是伽列里乌斯，马克西米安的是君士坦提乌斯。两位恺撒分别娶了上司的女儿或继女，日后依次递补。近代学者把这套办法叫作“四帝共治”。

  帝国在法律上没有分割，法令以四人共同的名义发布，但各人有自己常驻的城市和负责的地段：戴克里先在尼科米底亚，伽列里乌斯在多瑙河一线，马克西米安在米兰，君士坦提乌斯在特里尔。罗马城不再是皇帝的驻地。几年之内，君士坦提乌斯收复了自立十年的不列颠，戴克里先平定埃及，伽列里乌斯在 298 年大败波斯王纳尔塞，订约把边界推到底格里斯河以东。

  他同时改组了整个国家。行省拆小，数目增加到一百个上下，再合成十二个大区；文官不再领兵，军队扩充，边防部队与机动部队分开。赋税改为按人头和土地单位核定，定期重新清查。他发行新的金币、银币，301 年又颁布限价令，给一千多种货物和工钱规定最高价格，违者处死；拉克坦提乌斯说，结果是货物从市场上消失，流了不少血之后法令只好作罢。宫廷里采用了东方式的礼仪，臣下觐见要行跪拜礼。303 年开始的大逼迫也出自这个朝廷。

  305 年 5 月 1 日，戴克里先和马克西米安同日退位，两位恺撒升为奥古斯都，另立两位新恺撒。罗马皇帝自愿交出权力，这是第一次。新人选撇开了马克西米安和君士坦提乌斯的儿子，第二年君士坦提乌斯去世，军队拥立他的儿子君士坦丁，马克森提乌斯也在罗马自立，这套制度随即瓦解。但行省、军队和税制的新安排保留了下来，成为此后帝国的骨架。
