name: "基督徒改革宗教会成立"
summary: "1857 年密歇根部分荷兰移民教会脱离美国改革宗，另组基督徒改革宗教会。"
body: |-
  《历史的轨迹》第四十五章说，在密歇根定居的荷兰改革宗信徒中，有一批人不满太快加入美国改革宗教会，从 1850 到 1857 年不满日增：批评用东部的诗歌，质疑“临时会员制”和“公开圣餐”，抱怨信仰问答、慕道班和探访的疏忽，最后又批评范拉尔特介绍的巴克斯特《呼吁未信者》带有亚米念主义。1857 年 4 月 8 日在区会聚会中有四份脱离的公文提出，同年 10 月 7 日五间教会在博世牧师领导下组成基督徒改革宗教会。起初成长很慢，1880 到 1890 年间的移民潮带来不少信徒；1881—1882 年又有八间教会和许多人因共济会问题脱离美国改革宗，他们和荷兰真改革宗教会都在 1890 年加入。

  第四十八章说，这个宗派采用比利时信条、海德堡要理问答和多特信条，行长老制，要求传道人受高深教育，主日讲道每两次要有一次讲海德堡要理问答，家庭每年有牧师长老探访，严格执行惩戒；领袖们与荷兰的凯波尔、巴文克等人的神学保持密切联系。1943 年有三百零六间教会、十二万六千信徒，1981 年有六百二十六间教会、二十一万多信徒。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十八章“教会努力保守信仰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter53.html"
