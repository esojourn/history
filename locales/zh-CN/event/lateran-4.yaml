name: 第四次拉特兰会议
aliases:
  - 拉特兰第四届大公会议
summary: 1215 年英诺森三世在罗马召开的大公会议，是中世纪教皇权势的顶点。
body: |-
  1213 年 4 月英诺森三世发出召集令，给各地两年半的时间准备。《历史的轨迹》第十八章引他的话：“有两件事一直是我心中的负担：圣地的再度征服，及全球教会的革新。”

  会议于 1215 年 11 月在罗马的拉特兰教堂举行。该书记载：到会的有四百多位主教，八百多位修道院院长和副院长；首席主教和大主教共七十一位，包括君士坦丁堡和耶路撒冷的主教长；皇帝腓特烈二世、法国、英格兰、阿拉贡、匈牙利、耶路撒冷、塞浦路斯各王和意大利各城都派了代表，“好像全世界都到齐了”。那两位主教长是十字军在东方所立的拉丁礼主教长，希腊教会没有参加。

  会议通过的七十条教规由教皇预先拟好。第一条是信仰宣言，针对迦他利派的二元论，申明独一的神创造了有形无形的万物，并第一次在大公会议的文件里用了“化质”一词来说明圣餐中的饼和酒。第三条规定世俗君主有责任把教会定为异端的人逐出领地，否则臣民可以解除对他的效忠。第二十一条要求每个成年信徒每年至少向本堂司铎办一次告解，在复活节领圣餐。该书列举的决定还有：谴责瓦勒度派和亚尔比根派，限制赎罪券的颁发，命主教选派能干的人讲道，每个主教座堂设教师免费教授文法和神学，犹太人和穆斯林须穿与基督徒不同的服装，犹太人不得担任管辖基督徒的公职。

  会议定于 1217 年出发新的十字军。该书说这次十字军将由教皇亲自带领；英诺森次年 7 月就去世了。会上还处理了几件政治上的事：确认腓特烈二世为德意志国王，把图卢兹伯爵的大部分领地判给讨伐亚尔比根派的首领。

  该书说道明会和方济会都是在这次会议上得到英诺森三世认可的；按两个修会早期的记载，方济各在 1209 或 1210 年已得到口头批准，道明的修会在会后一年才由下一任教皇正式批准。该书认为，这次会议是英诺森三世超越其他教皇、拥有最高权势的标记。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
