name: 桂陵之战
summary: 前 354 年魏围邯郸，齐军用孙膑“围魏救赵”之计，在桂陵大败魏军。
body: |-
  战国前期魏国最强。公元前 354 年，魏惠王派庞涓率军包围赵都邯郸，赵国向齐国求救。据《史记·孙子吴起列传》，齐威王想以孙膑为将，孙膑以自己是受过刑的人辞谢，于是以田忌为将、孙膑为军师。

  田忌想率军直奔邯郸，孙膑说，解开乱成一团的丝线不能用拳头去捶，劝架的人不能卷入搏斗，应当“批亢捣虚”。现在魏国的精兵都在赵国，国内只剩老弱，不如率军直趋魏都大梁，占据交通要道，攻其空虚之处，魏军必然放弃赵国回救。这样一举既解了赵国之围，又能使魏军疲于奔命。田忌依计而行。

  魏军攻下邯郸后，回师救大梁，在桂陵被以逸待劳的齐军打败。这就是兵法上著名的“围魏救赵”。《史记》把桂陵之战系于魏惠王十八年，即公元前 353 年；银雀山汉简《孙膑兵法·擒庞涓》记载此战擒获了庞涓，与《史记》所说庞涓死于马陵不同。桂陵之战后魏国实力仍在，几年后与赵国讲和，归还了邯郸。

  桂陵之战的年代，通行的说法作公元前 354 年，这里从之。“围魏救赵”后来被列为“三十六计”之一，成为避实击虚、攻敌必救的代名词。

  桂陵的地望有今河南长垣、山东菏泽等说法。

  这次战役是孙膑成名之战。
sources: []
recalled:
  - 《史记·孙子吴起列传》
  - 《史记·魏世家》
  - 银雀山汉墓竹简《孙膑兵法》
