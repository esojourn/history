name: 庐山结社念佛
summary: 慧远与僧俗一百二十三人在庐山东林寺佛像前立誓共期往生西方，后世视为净土宗开端。
body: |-
  慧远在庐山东林寺住了二十年后，身边聚集了一批僧人和隐居不仕的士人。东晋元兴元年（公元 402 年）七月，他率众在寺中般若台的阿弥陀佛像前设斋立誓，约定同修念佛三昧，互相勉励，共同期望死后往生西方净土。据《高僧传》，参加的共一百二十三人，誓文由居士刘遗民执笔，其中有名的还有雷次宗、周续之、宗炳、张野等人。

  他们依据的主要是《般舟三昧经》，所行的是静坐观想佛的形相，与后世专以口念佛号为主的方法不尽相同。慧远为这次结集的诗写了序，自己也有阐述念佛三昧的文字。

  唐代以后，净土信仰盛行，这次立誓被追认为净土宗的起点，慧远被尊为初祖。“白莲社”或“莲社”的名称，以及“十八高贤”的名单、陶渊明受邀而不入社、谢灵运求入社被拒等故事，都出自中唐以后的传说，不见于早期的记载。
sources: []
recalled:
  - 《高僧传·释慧远传》
  - 《出三藏记集》卷十五
  - 《广弘明集》卷三十
