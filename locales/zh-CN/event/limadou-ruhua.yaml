name: 利玛窦入华
summary: 利玛窦 1583 年进入广东，1601 年获准居留北京，以“合儒”策略传教。
body: |-
  十六世纪，耶稣会的传教士随着葡萄牙人来到东方。方济各·沙勿略在日本传教后，想进入中国，1552 年死在广东台山外海的上川岛。此后耶稣会士在澳门停留了三十年，一直未能进入中国内地。

  1583 年意大利耶稣会士罗明坚、利玛窦获得两广总督的允许，到肇庆居住，建立了中国内地的第一座天主教教堂。利玛窦在肇庆展出他绘制的世界地图，引起中国士人的兴趣。此后他移居韶州、南昌、南京，起初穿僧服，后来改穿儒服，结交士大夫，在南京结识了徐光启等人。

  1601 年利玛窦到北京向万历帝进献自鸣钟、世界地图、西洋琴等物，获准在北京居住。此后他在北京结交士大夫，徐光启、李之藻、杨廷筠先后入教，被后世称为明末天主教的“三大柱石”。利玛窦与徐光启合译了《几何原本》前六卷，与李之藻合作编译了《同文算指》，他绘制的《坤舆万国全图》多次刊印。

  利玛窦采取适应中国文化的传教策略，被称为“利玛窦规矩”：他用儒家经典中的“天”“上帝”来解释天主，允许中国信徒祭祖、祭孔。他去世后，天主教内部对这些做法发生了激烈争论，后来演变成清代的“礼仪之争”（另见“礼仪之争”条）。利玛窦等传教士带来的天文、历法、数学、地理知识，对明末清初的中国学术产生了一定影响。1610 年利玛窦在北京去世，万历帝特许把他安葬在北京城外。
