name: 第一次十字军
aliases:
  - 第一次十字军东征
summary: 教皇乌尔班二世号召出兵东方，十字军 1099 年攻下耶路撒冷。
body: |-
  《历史的轨迹》第十七章说，阿拉伯人治下的圣地并不为难朝圣的基督徒，塞尔柱突厥人夺去巴勒斯坦以后情形变了，朝圣者带回受虐待的消息，在西欧激起怒火。该书把突厥人取得巴勒斯坦和叙利亚记在 1070 年；突厥人 1071 年在曼齐刻尔特大败东罗马军，随后占了小亚细亚大部，耶路撒冷是在 1073 年前后落入他们手中的。东罗马皇帝先后向贵格利七世和乌尔班二世求援。

  1095 年 11 月乌尔班二世在法国克莱蒙讲道，号召西欧人去东方援救基督徒、夺回耶路撒冷，许诺以此抵作补赎。最先出发的是隐士彼得等人带领的平民队伍，1096 年沿途在莱茵河各城杀害了许多犹太人，渡海到小亚细亚后被突厥人歼灭。

  诸侯的军队由图卢兹伯爵雷蒙、下洛林公爵戈弗雷、意大利南部的诺曼人博希蒙德等分路带领，1096 年秋冬陆续到达君士坦丁堡，1097 年 6 月攻下尼西亚，交还东罗马。围攻安提阿七个多月，1098 年 6 月破城。1099 年 6 月到达耶路撒冷城下时，剩下的人已经不多。7 月 15 日城破，十字军屠杀了城中的穆斯林和犹太居民。戈弗雷被推为统治者，他死后弟弟鲍德温在 1100 年称王。十字军在东方共建了埃德萨、安提阿、的黎波里和耶路撒冷四个国家。

  《历史的轨迹》说这个王国维持了八十年之久，直到 1187 年。从 1099 年到耶路撒冷被萨拉丁夺回是八十八年；此后王国退守沿海，都城在阿卡，到 1291 年才最后灭亡。该书概述其后的历次东征：1147 年的第二次是为援助这个王国，1189 年的第三次是为夺回耶路撒冷，都没有达到目的；通常说十字军共有八次，前后延续约二百年。

  该书的评价是：十字军表达了教皇和百姓的宗教热诚，但把圣地、圣徒遗物当作崇拜的对象是错误的信仰，热诚之外还需要正确的认识。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十七章“教会发起十字军运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter19.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
