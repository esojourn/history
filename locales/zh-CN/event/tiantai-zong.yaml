name: 智顗入天台山
summary: 智顗入天台山修禅说法十年，形成以《法华经》为宗的天台宗。
body: |-
  陈太建七年（公元 575 年），在建康瓦官寺讲经八年、声名远播的智顗，辞别朝廷，带领弟子进入浙东的天台山。据灌顶的《隋天台智者大师别传》，陈宣帝下诏把始丰县的租调拨给他的寺院作为供养。他在山中修行讲学，先后建立了修禅寺等道场，前后十年。

  这一时期，他的学说逐渐成熟。他以《法华经》为根本经典，把佛陀一生的说法分为“五时”，把教法分为“八教”，以此安排各种佛经的地位；在修行上主张止（禅定）与观（智慧）并重，提出“一心三观”“一念三千”等学说。他晚年讲述的《法华玄义》《法华文句》《摩诃止观》，由弟子灌顶记录整理，被称为“天台三大部”。

  这一宗派因智顗长住天台山而得名天台宗，通常被看作中国佛教最早形成的宗派之一。智顗去世后，晋王杨广按照他的遗愿在天台山建寺，后来赐名国清寺。唐代湛然中兴天台宗；唐德宗贞元二十年（804 年），日本僧人最澄到天台山求法，回国后创立了日本的天台宗。
sources: []
recalled:
  - 灌顶《隋天台智者大师别传》
  - 道宣《续高僧传·智顗传》
