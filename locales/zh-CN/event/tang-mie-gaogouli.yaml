name: 唐灭百济与高句丽
summary: 唐朝联合新罗，660 年攻灭百济，668 年攻克平壤、灭亡高句丽，设安东都护府。
body: |-
  七世纪中期，朝鲜半岛上高句丽、百济、新罗三国并立，高句丽和百济联合进攻新罗，新罗多次向唐朝求救。唐太宗亲征高句丽未能成功，此后唐朝改与新罗联合，先打击较弱的百济。

  显庆五年（公元 660 年），唐高宗以苏定方为神丘道行军大总管，率水陆大军从山东渡海，在熊津江口登陆，新罗太宗武烈王金春秋派大将金庾信率军配合。唐军攻克百济都城，百济义慈王投降，百济灭亡，唐朝在其故地设熊津等五个都督府。次年苏定方转攻高句丽，围攻平壤数月不下而撤回。

  百济灭亡后，百济的遗臣鬼室福信等人迎回在倭国做人质的王子扶余丰，起兵复国，倭国派兵相助。龙朔三年（663 年）唐将刘仁轨等人在白江口大败倭国水军，百济复国运动随之失败（另见“白江口之战”条）。

  乾封元年（666 年）前后，高句丽权臣渊盖苏文去世，长子渊男生与弟弟渊男建、渊男产争权，渊男生逃到国内城，向唐朝投降。唐高宗乘机以年过七十的李勣为辽东道行军大总管，大举进攻。总章元年（668 年）九月，唐军和新罗军围攻平壤一个多月，城中有人打开城门，唐军入城，俘获宝藏王和渊男建，高句丽灭亡。唐朝在平壤设安东都护府，以薛仁贵为都护，统辖高句丽故地。

  此后新罗与唐朝争夺百济和高句丽的故地，双方交战多年，唐朝于上元三年（676 年）把安东都护府迁到辽东，新罗据有大同江以南的地区。高句丽的一部分遗民被迁入唐朝内地，一部分后来参加了渤海国的建立。
