name: 陈桥兵变
summary: 960 年正月，后周殿前都点检赵匡胤在陈桥驿被部下拥立为帝，回师开封，建立北宋。
body: |-
  显德六年（公元 959 年）六月周世宗去世，七岁的柴宗训继位，就是周恭帝，由宰相范质等人辅政。禁军统帅、殿前都点检赵匡胤和他的结义兄弟石守信等人掌握着禁军的主要兵力。

  显德七年（960 年）正月初一，朝廷接到镇州、定州的报告，说北汉与契丹联合入侵。宰相范质等人没有核实，便派赵匡胤率领禁军北上抵御。初三，大军出开封城，当晚驻扎在开封东北的陈桥驿。据宋代史书，当夜军中将士议论说，主上年幼，我们拼死作战，又有谁知道，不如先立点检为天子，然后再北征。赵匡胤的弟弟赵匡义和掌书记赵普在军中联络将士。初四清晨，将士们手持兵器来到赵匡胤的住处，把一件黄袍披在他身上，拜倒高呼万岁，即后世所说的“黄袍加身”。

  据宋代史书，赵匡胤随即与将士约定：回到京城后，不得惊犯太后和幼主，不得欺凌朝中大臣，不得抢掠官府和百姓。大军回到开封，守城的禁军将领开门迎接，只有副都指挥使韩通想组织抵抗，被禁军将领王彦升杀死。宰相范质等人被带到赵匡胤面前，只好下拜。当天周恭帝禅位，赵匡胤即皇帝位，因为他曾任归德军节度使，治所在宋州，所以定国号为宋，史称北宋。

  陈桥兵变几乎没有流血，开封城内秩序井然。但后人对这次兵变有不少怀疑：北汉与契丹入侵的消息事后没有下文；黄袍是事先准备好的，禅位的诏书据宋人笔记也是早就写好的。因此许多人认为这是一次精心策划的政变。北宋建立后，用了约二十年时间先后平定南方各国和北汉，结束了唐末以来的分裂局面。
sources: []
recalled:
