name: 钓鱼城之战
summary: 1259 年蒙哥亲征四川，围攻合州钓鱼城不下，死于城下，蒙古的攻宋计划因此中止。
body: |-
  宋蒙战争爆发后，四川首当其冲，成都等地屡遭蒙古军攻掠。淳祐三年（公元 1243 年）余玠出任四川安抚制置使，采纳冉琎、冉璞兄弟的建议，在嘉陵江、渠江、涪江交汇处的钓鱼山上修筑城池，把合州的治所迁到这里，又在各地依山筑城，形成以山城为据点的防御体系。

  1258 年蒙哥决定大举攻宋，他亲率主力进攻四川，命忽必烈率东路军进攻鄂州，命兀良合台从云南北上。蒙哥一路攻下剑门苦竹隘、阆州等地，四川多数山城相继失守或投降。1259 年二月，蒙古军包围钓鱼城。知合州王坚与副将张珏率领军民坚守，蒙哥派去招降的使者被王坚杀死。蒙古军从各个方向轮番进攻，五个月没有攻下，夏季酷热，军中疫病流行。

  这年七月，蒙哥死于钓鱼城下。关于他的死因，《元史》说他是染病而死，也有一些宋人和后世的记载说他是在城下被炮石击伤后死去，说法不一。蒙哥死后，蒙古军撤离四川；正在围攻鄂州的忽必烈接受贾似道的求和，北返争夺汗位；远在西亚的旭烈兀听到消息后也率主力东返。后人因此把钓鱼城称为“上帝折鞭处”。

  此后钓鱼城在张珏等人的主持下又坚守了二十年，直到 1279 年南宋灭亡前后，守将王立在得到不杀城中军民的承诺后才开城投降。钓鱼城遗址今在重庆合川区，城墙、城门等遗迹保存至今。
sources: []
recalled:
  - 《元史·宪宗本纪》
  - 《宋史·理宗本纪》
  - 《宋史·余玠传》
