name: "凡尔赛容忍诏谕"
summary: "1787 年路易十六颁布的诏谕，给法国新教徒合法的身份，结束近百年的禁教。"
body: |-
  《历史的轨迹》第三十九章说，哲学家和法国领袖开始推动一种容忍的精神；当时有名的思想家杜尔哥说服了 1774 年即位的年轻国王路易十六，决定停止对复原教徒的逼迫，胡格诺派在整整九十年的逼迫之后总算得到政府的认可。该书又说，拉法耶特将军在美国帮助独立战争后，带着宗教与政治自由的精神回到法国，借着他的影响力废除了一切反复原教的法律，订立了 1787 年的容忍诏谕。

  据一般记载，这道 1787 年 11 月在凡尔赛签署的诏谕，准许非天主教徒在法国居住、经商，由地方官登记他们的出生、婚姻和死亡，使他们的婚姻和子女有合法地位；但还不准他们公开举行崇拜或担任公职。拉博·圣艾蒂安（保罗·拉博之子）曾为此奔走。两年后大革命爆发，1789 年《人权宣言》才宣布宗教意见的自由。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
