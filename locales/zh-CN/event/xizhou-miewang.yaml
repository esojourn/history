name: 西周灭亡
summary: 前 771 年申侯联合缯国和犬戎攻破镐京，杀周幽王于骊山下，西周灭亡。
body: |-
  周幽王宠爱褒姒，废黜申后和太子宜臼，改立褒姒之子伯服为太子。宜臼逃到外祖父申侯那里。据《史记·周本纪》，申侯大怒，联合缯国和西方的犬戎进攻幽王。幽王点燃烽火征兵，诸侯不来救援，公元前 771 年，幽王被杀于骊山之下，褒姒被掳，周的财宝被抢掠一空。

  《史记》把诸侯不救归因于“烽火戏诸侯”，但这一故事不见于更早的文献。清华简《系年》的记述是：幽王与伯服先出兵围攻申国，申人不肯交出平王，缯人于是联合西戎攻打幽王，幽王和伯服都被杀死。今天的研究者多认为，西周灭亡与王室继承之争、申国等诸侯的离心、戎狄势力的强大以及天灾等都有关系。

  幽王死后，申侯等拥立宜臼为王，就是周平王；虢公翰另立王子余臣为王，称为携王，出现二王并立的局面。镐京一带残破，又受戎人威胁，平王随后东迁洛邑。

  关于犬戎，古书说法不一，一般认为是活动在西周西北方的戎人部族。西周灭亡后，周人在关中的故地大部分落入戎人之手，后来由秦国逐步收复。陕西扶风、岐山一带的周原遗址发现了许多西周贵族匆忙埋藏的青铜器窖藏，学者多认为与这一时期的动乱有关。

  从武王克商到此，西周约二百七十多年。
sources: []
recalled:
  - 《史记·周本纪》
  - 《国语·郑语》
  - 清华简《系年》
