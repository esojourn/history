name: 马加比起义
summary: 玛他提亚父子起兵，反抗塞琉古王朝禁绝犹太律法。
body: |-
  公元前 167 年前后，安条克四世下令禁止犹太人献燔祭、守安息日和行割礼，并在耶路撒冷圣殿的祭坛上设立异教祭坛（《马加比一书》1:41–59）。王的官员到莫顶强令献祭时，祭司玛他提亚杀死献祭者和监督的官员，带着五个儿子逃入山中，起义由此开始（2:15–28）。

  玛他提亚约在前 166 年去世，第三子犹大接任统帅。据《马加比一书》第 3—4 章，犹大接连击败阿波罗尼、塞龙、戈尔吉亚和吕西亚所率的军队，于前 164 年冬收复圣殿，重新献祭。此后战事仍在继续：起义军在伯撒迦利亚失利，在阿达萨击杀尼迦挪，约前 160 年犹大在以拉撒战死（9:1–22）。

  本条的起止年取自莫顶起事到犹大战死。犹大死后，兄弟约拿单、西门相继为首领，前 142 年西门使犹太免于向塞琉古纳贡。这段历史主要见于《马加比一书》《马加比二书》和约瑟夫斯《犹太古史》；两部《马加比书》在若干事件的先后上互有出入，书中的塞琉古纪年换算成公元纪年也常有一年的差别。
sources:
  - 《马加比一书》第 1—9 章
  - 《马加比二书》第 5—15 章
  - 约瑟夫斯《犹太古史》卷 12 第 6—11 章 https://penelope.uchicago.edu/josephus/ant-12.html
  - Wikipedia, "Maccabean Revolt" https://en.wikipedia.org/wiki/Maccabean_Revolt
