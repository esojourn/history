name: 土木之变
summary: 1449 年明英宗在宦官王振的怂恿下亲征瓦剌，在土木堡全军覆没，英宗被俘。
body: |-
  明朝正统年间，蒙古瓦剌部在也先的统率下逐渐强大，控制了蒙古大部分地区。瓦剌每年派使团到北京朝贡，以此获得明朝的赏赐，使团的人数越来越多，有时虚报人数。正统十四年（1449 年）掌权的宦官王振按实际人数给予赏赐，又压低马价，也先以此为借口，兵分四路进攻明朝，亲自率领主力进攻大同。

  明英宗在王振的怂恿下决定亲征，兵部尚书邝埜、侍郎于谦等人劝阻无效。七月，英宗率领号称五十万的大军仓促出发，命弟弟郕王朱祁钰留守北京。大军到达大同时，前方各路明军已经接连失利，加上连日风雨，军心浮动，王振决定撤兵。回师途中，据说王振起初想让大军经过他的家乡蔚州，后来又怕踩坏他家乡的庄稼，命大军改道，耽误了时间。

  八月十三日，瓦剌军追上明军后卫，成国公朱勇等人率领的骑兵全军覆没。次日明军退到土木堡，这里离怀来城只有二十里，王振因为辎重没有跟上，下令就地扎营。土木堡地势较高，没有水源，瓦剌军又占据了附近的河流，明军人马饥渴。十五日，也先假装议和，趁明军移营时发动猛攻，明军溃散，死伤数十万（据《明史》），英国公张辅、兵部尚书邝埜、户部尚书王佐等五十多位大臣战死，王振被乱军所杀，明英宗被俘。

  土木之变是明朝由盛转衰的一个标志。消息传到北京，朝野震动，于谦等人拥立郕王朱祁钰为帝，组织了北京保卫战（另见“北京保卫战”条）。此后明朝对蒙古的态度由主动出击转向被动防御，北方边防逐渐依靠修筑长城来维持。
sources: []
