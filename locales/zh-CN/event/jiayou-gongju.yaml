name: 嘉祐二年贡举
summary: 1057 年欧阳修主持科举，力排险怪文风，苏轼、曾巩、程颢、张载等同榜。
body: |-
  北宋中期，太学里流行一种追求奇险艰涩的文风，称为“太学体”。嘉祐二年（公元 1057 年），翰林学士欧阳修主持礼部考试，梅尧臣等人参与阅卷。欧阳修决心扭转文风，凡是写“太学体”的试卷一律黜落，取那些平易畅达的文章。据宋人记载，放榜以后，落第的举子聚集起来，在街上拦住欧阳修的马辱骂他，但此后文风果然为之一变。

  这一榜录取的人才非常多，后人称为“千年科举第一榜”或“龙虎榜”。其中有文学家苏轼、苏辙、曾巩，理学家程颢、张载，后来推行新法的吕惠卿、曾布，以及王韶等人。据宋人记载，梅尧臣读到苏轼的《刑赏忠厚之至论》，推荐给欧阳修，欧阳修怀疑是自己的学生曾巩所作，为了避嫌把它列为第二。苏轼在文中用了一个尧与皋陶的典故，考官们都不知道出处，后来问他，据说苏轼回答是想当然耳。这一年参加考试的进士后来在政治、文学、学术上影响深远。
sources: []
recalled:
  - 《宋史·欧阳修传》
  - 《宋史·苏轼传》
