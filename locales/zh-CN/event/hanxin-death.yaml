name: 韩信被杀
summary: 公元前 196 年，吕后与萧何设计，将淮阴侯韩信骗入长乐宫处死。
body: |-
  韩信在楚汉战争后被封为楚王。汉六年有人上书告他谋反，高祖用陈平之计，假称出游云梦，在陈地将他擒获，带回后降为淮阴侯。据《史记·淮阴侯列传》，他从此常称病不朝，心怀怨望，羞与周勃、灌婴等人同列。

  《淮阴侯列传》记载，陈豨出任巨鹿守前向韩信辞行，二人曾密谈，韩信答应在京中作内应。汉十年陈豨果然反叛，高祖亲自领兵出征，韩信称病不从，暗中派人与陈豨联络，谋划夜里假传诏令，赦免各官府的囚徒奴隶，袭击吕后和太子。他的一名舍人因得罪他被囚，舍人的弟弟向吕后告发了这一图谋。

  吕后想召韩信，又怕他不肯来，便与相国萧何商议，谎称高祖那里有使者来，说陈豨已死，列侯群臣都要入宫祝贺。萧何亲自劝韩信：“虽疾，强入贺。”韩信一入宫，吕后命武士把他绑起，在长乐宫钟室斩杀，并灭其三族。《高祖本纪》把此事记在高祖十一年春。高祖平叛回来，听说韩信已死，“且喜且怜之”。据同传，韩信临刑时说后悔没有采用蒯通的计策。
sources:
  - 《史记·淮阴侯列传》 https://ctext.org/shiji/huai-yin-hou-lie-zhuan/zhs
  - 《史记·高祖本纪》 https://ctext.org/shiji/gao-zu-ben-ji/zhs
  - 《史记·陈丞相世家》 https://ctext.org/shiji/chen-cheng-xiang-shi-jia/zhs
