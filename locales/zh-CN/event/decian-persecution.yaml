name: 德修逼迫
aliases:
  - 德西乌斯逼迫
summary: 公元 250 年德修皇帝下令全国人献祭，是第一次遍及全帝国的逼迫。
body: |-
  公元 249 年底或 250 年初，德修皇帝下令，帝国所有居民都要向诸神献祭、奠酒、尝祭肉，并在各地专设的委员面前办理，领取证明。诏令的原文没有传下来。埃及出土了四十多份这样的证明书，日期都在 250 年 6、7 月间。一般认为，皇帝的用意是在帝国危难之时求得诸神的护佑，诏令并没有点基督徒的名；但基督徒不能献祭，逼迫就落到了他们头上。《历史的轨迹》第二章称德修是第一位有计划地要毁灭教会的皇帝。

  250 年 1 月，罗马主教法比安被处死，此后一年多罗马教会选不出继任者。安提阿主教巴比拉和耶路撒冷主教亚历山大死在狱中，俄利根在该撒利亚受了酷刑。迦太基主教居普良、亚历山大主教狄奥尼修都离城躲避。

  教会已经过了几十年的太平日子，许多信徒没有准备。居普良在《论背道者》里说，迦太基有人不等传唤就自己跑去献祭。另有不少人托人或花钱弄来一张证明，并没有真的献祭。坚持不从的人被监禁、拷打，有的被处死，活下来的被尊为“认信者”。

  251 年春天逼迫已经松弛，这年夏天德修战死。随后的难题是如何对待想回教会的背道者。在迦太基，有人拿着认信者写的推荐信要求立刻恢复相交；在罗马，长老诺瓦天主张永不接纳，并自立为主教，造成延续几个世纪的分裂。居普良和罗马主教哥尼流主持的会议定了一条中间的路：经过悔改，可以重新接纳。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
recalled:
  - 居普良《论背道者》《书信》第 55 篇
  - 优西比乌《教会史》卷 6 第 39—46 章
  - 埃及出土的献祭证明书（纸草）
