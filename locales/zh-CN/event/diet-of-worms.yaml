name: "沃尔姆斯帝国议会"
summary: "1521 年路德在帝国议会上当着皇帝拒绝收回著作，被宣布不受法律保护。"
body: |-
  1521 年初，新当选的皇帝查理五世在沃尔姆斯召开他的第一次帝国议会。教皇的使节亚良德要求皇帝直接下令处置已被开除教籍的路德。《历史的轨迹》第二十二章说，教皇一方日夜奔走，就是要阻止路德得到听审的机会。萨克森选侯和许多诸侯坚持德意志人不经审问不得定罪，皇帝在当选时也答应过这一条，于是发出安全通行证，传路德到场。

  路德 4 月 2 日从维滕贝格动身，该书说一路上群众夹道，像凯旋的游行。4 月 17 日下午他第一次出席，桌上堆着他的书，官员问：这些是不是你写的，你是否收回？他承认是自己写的，对第二问请求给他时间考虑。议会准他延到次日。该书认为这一步在政治上要紧：议会既然听他陈述，就不是照教皇的判决办事了。

  18 日傍晚，大厅里点着火把，挤满了人。路德先用德语、再用拉丁语作答；该书说的次序相反。他把自己的书分为三类，说都不能笼统收回。官员要他给一个干脆的回答。他说：除非用圣经的明证或清楚的理由说服我，我不能也不愿收回什么，因为违背良心行事既不稳妥，也不正当；愿神帮助我，阿们。该书引的“我站在此，我别无选择”一句，不在当场的记录里，见于稍后维滕贝格的印本。

  次日皇帝向诸侯宣读亲笔声明，说自己的祖先都是教会忠实的儿子，一个修士不可能对而一千年的基督教世界都错，他决意以国土和生命为注对付这个异端。几天的私下劝说没有结果，路德 4 月 26 日离开沃尔姆斯。5 月 4 日他在图林根的森林里被萨克森选侯安排的骑士“劫”走，藏进瓦特堡。外间以为他遇害，该书引画家丢勒日记里的哀叹：神啊，路德若死了，谁来向我们讲解福音？

  5 月下旬，多数诸侯已经离开，皇帝签署了亚良德起草的《沃尔姆斯敕令》，宣布路德不受法律保护，禁止任何人收留他、印行或阅读他的书。这道敕令在许多邦里没有执行。
