name: 吴起变法
summary: 楚悼王任用吴起变法，削减贵族特权；悼王死后吴起被杀，变法中止。
body: |-
  吴起在魏国受到排挤后，投奔楚国。楚悼王素闻其名，任他为令尹，主持变法，时间大约在公元前 385 年前后至前 381 年，具体起始年份不详。

  据《史记·孙子吴起列传》和《战国策》，吴起的改革包括：“明法审令”，整顿法令；“捐不急之官”，裁减冗员；“废公族疏远者”，对封君的子孙传到第三代就收回爵禄；把贵族迁往地广人稀的边地垦荒；用节省下来的钱财“抚养战斗之士”；禁止私人请托，统一楚国的风俗。楚国由此强盛，南平百越，北并陈、蔡，击退三晋，西伐秦国。

  改革触动了楚国旧贵族的利益。公元前 381 年楚悼王去世，宗室大臣起兵攻杀吴起，吴起伏在悼王尸体上，被乱箭射死，箭也射中了悼王的尸体。楚肃王即位后，按照“丽兵于王尸者，尽加重罪，逮三族”的法令，诛灭了七十多家贵族。吴起的改革随之中止，楚国旧贵族势力依然强大，这被认为是楚国后来不敌秦国的原因之一。

  韩非后来把吴起与商鞅相提并论，说楚国不用吴起之法而削弱混乱，秦国推行商鞅之法而富强，二人的主张都是对的，却一个被肢解、一个被车裂（《韩非子·和氏》）。

  吴起变法的具体内容，史书记载较少，主要散见于《史记》《战国策》《韩非子》等书。
sources: []
recalled:
  - 《史记·孙子吴起列传》
  - 《战国策·秦策三》
  - 《韩非子·和氏》
