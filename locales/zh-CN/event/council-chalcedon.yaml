name: 迦克墩会议
aliases:
  - 卡尔西顿公会议
  - 第四次大公会议
summary: 公元 451 年的大公会议，宣告基督是一个位格、兼具完全的神性与完全的人性。
body: |-
  以弗所会议以后，关于基督的争论转到另一头。君士坦丁堡的修道院长优提克斯主张，道成肉身以后基督只有一个本性，人性仿佛融进了神性。公元 448 年他被本城主教弗拉维安定罪。罗马主教利奥一世写了一封长信支持弗拉维安，即《大卷》。449 年皇帝在以弗所召开会议，主持人亚历山大主教狄奥斯科鲁不让宣读这封信，为优提克斯平反，罢免了弗拉维安，弗拉维安不久死去。利奥称这次会议是“强盗会议”。

  公元 450 年皇帝狄奥多西二世坠马而死，新皇帝马尔西安和皇后普尔喀丽娅改变了政策，在 451 年 10 月召集会议，地点在君士坦丁堡对岸的迦克墩。到会的主教有五百多位，《历史的轨迹》第五章说约六百位，是古代规模最大的一次；除了罗马的几位代表和两位非洲主教，都来自东方。

  会议罢免了狄奥斯科鲁，宣读并接受了利奥的《大卷》，然后在皇帝代表的坚持下拟定了一份信仰定义。定义说，主耶稣基督是同一位，神性完全，人性也完全，是真神又是真人；按神性说与父同质，按人性说与我们同质；在两性之中，“不相混乱，不相改变，不能分开，不能离散”，两性各自的特性在联合中都得保存，同归于一个位格。《历史的轨迹》说，这篇定义与尼西亚信经同样重要，后来的改教运动也没有拒绝或修改它。

  会议的第 28 条教规重申君士坦丁堡主教享有与罗马同等的特权，位居第二，并管辖本都、亚西亚和色雷斯。罗马的代表当场抗议，利奥事后也拒绝承认这一条。

  埃及和叙利亚的许多信徒认为这篇定义背离了区利罗的教导，不肯接受。科普特、叙利亚、亚美尼亚、埃塞俄比亚等教会由此逐渐与君士坦丁堡和罗马分开，延续至今。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
recalled:
  - 迦克墩会议记录及信仰定义
  - 利奥一世《书信》第 28 封（《大卷》）、第 104 封
  - 埃瓦格里乌《教会史》卷 2 第 2—4 章
