name: 长庆会盟
summary: 821—822 年唐蕃先后在长安、逻些会盟，823 年立唐蕃会盟碑，碑今尚存。
body: |-
  九世纪初，唐朝与吐蕃都因长期战争而疲惫，吐蕃赞普赤祖德赞（汉文史书称可黎可足）多次派使者请求和好。长庆元年（公元 821 年）九月，吐蕃使者到长安请盟，十月唐朝的宰相崔植等人与吐蕃使者在长安城西郊会盟。次年唐朝派大理卿刘元鼎为会盟使前往吐蕃，五月在逻些东郊与吐蕃的大臣会盟。刘元鼎沿途的见闻后来被记入《新唐书·吐蕃传》。

  长庆三年（823 年），吐蕃在逻些大昭寺门前立了会盟碑，碑文用汉文和藏文两种文字刻写，追述了唐蕃自文成公主、金城公主以来的舅甥关系，申明双方各守现有的边界，互不侵犯，使者往来、互市贸易照旧。这块唐蕃会盟碑至今仍立在拉萨大昭寺前，是研究唐蕃关系和古藏文的重要实物。

  此后唐蕃之间大体没有再发生大规模战争。二十年后吐蕃王朝陷入内乱和分裂（另见“吐蕃王朝崩溃”条）。
sources: []
recalled:
