name: "加拿大联合教会成立"
summary: "1925 年加拿大循道会、公理会和约三分之二的长老会合并为加拿大联合教会。"
body: |-
  《历史的轨迹》第四十七章说，加拿大的长老会信徒来自不同地方，十九世纪中叶出现合一的趋势，1875 年所有长老会联合成加拿大长老会。循道会也照同样方式发展，1883 年五个主要循道会团体合一。书中说，1925 年是加拿大教会的关键年：差不多三分之二的长老会与公理会、循道会组成“加拿大联合教会”，它现在是加拿大最大的复原教团体，其次是圣公会；其余三分之一的长老会在司各特牧师领导下组成“加拿大长老会”，到 1980 年已发展为加拿大第七大宗派。

  第四十九章把它列为美国以外教会联合运动的例子，与 1947 年成立的南印度教会并提，书中说加拿大是教会合一运动的先锋，但也提醒说，“联合”必须建立在“合一”的基础上，教义、崇拜和行政的问题须先解决。据一般记载，加拿大联合教会 1925 年 6 月 10 日在多伦多成立；循道会的大合并一般作 1884 年，与书中的 1883 年略有不同。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十七章“加拿大教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter52.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十九章“教会联盟与联合” https://wellsofgrace.com/books/spiritual/2000years/html/chapter54.html"
