name: 元昊称帝建夏
summary: 1038 年党项首领李元昊在兴庆府称帝，国号大夏，史称西夏。
body: |-
  党项是羌人的一支，唐代内迁到今陕北、宁夏一带。党项拓跋部的首领拓跋思恭在唐末参与镇压黄巢，被赐姓李，任定难军节度使，此后世代据有夏、银、绥、宥等州。宋初李继捧献地入朝，族弟李继迁起兵反宋，依附辽朝，攻占灵州（另见“李继迁”条）；他的儿子李德明在位时对宋、辽两面称臣，同时向西攻取了河西走廊的甘州、凉州。

  明道元年（公元 1032 年）李德明去世，儿子李元昊继位。他着手建立独立的国家制度：废除唐、宋所赐的李、赵姓氏，改姓嵬名；颁布秃发令，规定党项人的发式；创制西夏文字；设立文武官制和十二监军司；把兴州升为兴庆府作为都城。宋宝元元年（1038 年）十月，他正式称帝，国号大夏，因为在宋朝的西北，宋人称之为西夏。

  次年元昊派使者到宋朝上表，要求宋朝承认他的帝号。宋朝拒绝，下诏削去他的官爵和赐姓，停止边境贸易，并悬赏捉拿他。元昊则在给宋朝的表文中强调自己的祖先曾建立北魏，党项本有立国的根据。双方随即爆发战争（另见“宋夏战争”条）。此后西夏与宋、辽（后来是金）鼎立，存在了约一百九十年，直到 1227 年被蒙古灭亡。西夏文字的文献在二十世纪大量出土，成为研究西夏历史的重要资料。
sources: []
recalled:
  - 《宋史·夏国传上》
  - 《辽史·西夏外纪》
  - 《续资治通鉴长编》卷一百二十二、一百二十三
