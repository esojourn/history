name: 窦宪破北匈奴
summary: 公元 89 至 91 年窦宪两度大破北匈奴，登燕然山刻石，北匈奴西迁。
body: |-
  东汉初年匈奴分裂为南北两部。南匈奴归附汉朝，被安置在边塞以内；北匈奴仍在漠北，时常侵扰。章帝末年，北匈奴内部纷争，又遭饥荒和鲜卑等部的攻击，南单于上书请求汉朝出兵，合力将其消灭。

  据《后汉书·窦宪传》，永元元年（公元 89 年），车骑将军窦宪与耿秉率汉军及南匈奴、羌胡的骑兵分三路出塞，在稽落山会师，大破北匈奴，北单于逃走。本传说这一战斩杀一万三千余人，俘获牲畜百余万头，前后来降的有八十一部、二十余万人。窦宪、耿秉出塞三千余里，登上燕然山，命随军的班固撰写铭文，刻在山石上记述汉朝的威德。后世“燕然勒石”成为建立边功的代称。

  永元三年（91 年），窦宪又派耿夔等出居延塞，在金微山包围北单于，北单于再度逃走，本传说“不知所在”。北匈奴的余部此后向西迁徙，漠北的故地逐渐被鲜卑占据。西迁的北匈奴与四世纪出现在欧洲的匈人是否有关，学界有长期的争论，没有定论。

  《封燕然山铭》的文字保存在《后汉书》中。2017 年，中国和蒙古国的学者在蒙古国中戈壁省的一处摩崖上辨识出这篇铭文的刻石。
