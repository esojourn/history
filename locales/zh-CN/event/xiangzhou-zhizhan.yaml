name: 相州之战
summary: 758—759 年唐军九节度使围攻邺城的安庆绪，不设元帅，被史思明援军击溃。
body: |-
  两京收复后，安庆绪退守邺城（相州），改称安成府。乾元元年（公元 758 年）九月，唐肃宗命郭子仪、李光弼、王思礼等九个节度使率军讨伐安庆绪。因为郭子仪、李光弼都是元勋，难以互相统属，肃宗不设元帅，而派宦官鱼朝恩任观军容宣慰处置使，监督各军。唐军包围邺城，筑起土垒，引漳河水灌城，城中粮食吃尽，据《资治通鉴》，一只老鼠能卖到四千钱，安庆绪随时可能投降。

  安庆绪向范阳的史思明求救。史思明率兵南下，先在城外驻扎观望，不断袭扰唐军的粮道。乾元二年（759 年）三月，史思明率精兵五万（据《资治通鉴》）与唐军在安阳河北岸决战，正在交战时突然狂风大作，飞沙走石，天昏地暗，两军都惊慌后撤，唐军各部因为没有统一指挥，各自溃退回本镇，战马和兵器丢弃无数。郭子仪率朔方军退守河阳，拆断河阳桥，保住了洛阳。

  战后鱼朝恩把败因归咎于郭子仪，郭子仪被召回长安，李光弼接替他的职务。史思明随即进入邺城，杀死安庆绪，回到范阳称帝，同年秋天再次攻占洛阳，安史之乱又延续了四年。
sources: []
recalled:
  - 《旧唐书·肃宗纪》
  - 《资治通鉴》卷二百二十至二百二十一
