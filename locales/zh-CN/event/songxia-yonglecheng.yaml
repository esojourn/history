name: 宋伐西夏与永乐城之战
summary: 1081 年宋神宗五路伐夏败于灵州，次年新筑的永乐城又被西夏攻陷。
body: |-
  元丰四年（公元 1081 年），西夏梁太后囚禁了亲宋的夏惠宗李秉常，宋神宗认为这是平定西夏的时机，下令五路出兵：李宪出熙河，种谔出鄜延，高遵裕出环庆，刘昌祚出泾原，王中正出河东，约定会攻西夏的灵州和兴庆府。西夏采取坚壁清野的策略，诱宋军深入。刘昌祚率泾原军先到灵州城下，高遵裕因嫉妒他的功劳，阻止他攻城。宋军围攻灵州，久攻不下，西夏人掘开黄河灌淹宋营，又截断粮道，宋军大批冻饿而死，各路溃退。

  元丰五年（1082 年），神宗采纳给事中徐禧的建议，在横山一带修筑永乐城，作为进逼西夏的据点，鄜延路经略使沈括奉命配合。永乐城建成后不久，西夏大军前来围攻，城中缺水，九月城破，徐禧等人战死，将士死伤很多。据《宋史》，神宗听到消息，临朝痛哭，此后身体日渐衰弱。沈括因救援不力被贬。这两次失败使宋朝灭亡西夏的计划落空。不过此后几年间宋朝仍逐步在西北修筑城寨，到哲宗时又取得了平夏城之战等胜利。
sources: []
recalled:
  - 《宋史·神宗本纪》
  - 《宋史·徐禧传》《沈括传》
  - 《宋史·夏国传下》
  - 《续资治通鉴长编》卷三百十三至三百三十
