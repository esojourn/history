name: 契丹建国
summary: 916 年耶律阿保机仿照中原制度称帝，建年号神册，国号契丹，947 年改称辽。
body: |-
  契丹是生活在潢水（今西拉木伦河）和土河（今老哈河）流域的游牧民族，唐代分为八部，由遥辇氏的可汗统领。唐末，迭剌部的耶律阿保机势力日盛，天祐四年（公元 907 年）取代遥辇氏成为可汗。他此后拒绝按旧俗三年一选、交出汗位，平定了诸弟的三次叛乱。

  神册元年（916 年），阿保机仿照中原王朝称帝，建年号神册，立长子耶律倍为皇太子，国号契丹。神册三年（918 年）他在潢水之北兴建皇都，后来称为上京临潢府。他重用韩延徽等汉人，在汉人聚居之地修筑城郭、设置州县，以中原的方式治理，对契丹各部仍按旧俗管理。据《辽史》，耶律倍建议首先尊奉孔子，阿保机于是在皇都修建孔子庙，同时也修建佛寺和道观。神册五年（920 年），他又命人创制了契丹文字（另见“契丹文字创制”条）。

  契丹的国号此后几经变化。会同十年（947 年）耶律德光灭后晋后，在开封改国号为大辽；此后又曾改回契丹，后来再称辽。学界一般把契丹建立的这个王朝统称为辽，从 916 年算起，到 1125 年被金所灭，共二百一十年。辽朝在中国北方与五代、北宋长期并立，对东亚的政治格局影响很大。
sources: []
