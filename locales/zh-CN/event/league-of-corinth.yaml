name: 科林斯同盟
summary: 腓力二世召集希腊各邦在科林斯结成同盟，自任统帅，并决定向波斯开战。
body: |-
  喀罗尼亚之战后，腓力二世分别与各邦订约，并进入伯罗奔尼撒，把斯巴达周边的土地划给它的邻邦。公元前 338 年至前 337 年冬，他请各邦派代表到科林斯开会。除斯巴达外，希腊本土各邦和许多岛屿都参加了。近代学者把这个组织称为“科林斯同盟”，当时的正式名称只是“希腊人”。

  同盟的基础是一个共同和约。雅典出土的石碑残片保存了各邦誓词的一部分：宣誓者保证遵守和平，不以武力侵犯守约的任何一方，不推翻腓力及其后裔的王权，也不推翻各邦宣誓时现行的政体；如有人破坏和约，将依同盟会议的决定和统帅的号召出兵讨伐。据托名德摩斯梯尼的一篇演说，条约还禁止在各邦非法处死或放逐公民、没收财产、重分土地、取消债务，以及为了变乱而解放奴隶。各邦按兵力大小向同盟会议派出人数不等的代表，会议的决定对成员有约束力；统帅负责执行，这一职位属于腓力。

  各邦名义上自由自治，不纳贡，不受驻军；实际上马其顿在科林斯卫城、底比斯卫城、卡尔基斯等地留了驻军。前 337 年的第二次会议依腓力的提议，决定向波斯开战，名义是报复薛西斯当年焚毁希腊神庙，各邦按定额出兵出船。腓力被推为这场战争的全权统帅。

  前 336 年腓力遇刺，亚历山大赶到科林斯，同盟重新推他为统帅。前 335 年底比斯起事被毁，名义上就是由同盟会议裁决的；东征军里的希腊步兵、骑兵和舰船也是依盟约派出的。亚历山大死后同盟在拉米亚战争中瓦解。前 302 年安提柯一世父子仿照它重建过一个希腊同盟，前 224 年安提柯三世又建过一个。
