name: 古文运动
summary: 韩愈、柳宗元倡导写作先秦两汉式的散文，反对讲究对偶辞藻的骈文，影响直到宋代以后。
body: |-
  魏晋南北朝以来，骈文盛行，文章讲究四六对偶、声律和辞藻，到唐初仍是官方文书和应酬文字的主流。早在北周，苏绰就曾仿照《尚书》的文体起草诏令；初唐的陈子昂、盛唐至大历年间的萧颖士、李华、元结、独孤及、梁肃等人，也先后提倡恢复先秦两汉文章的质朴传统，但影响有限。

  唐德宗贞元年间到唐宪宗元和年间，韩愈和柳宗元大力提倡写作“古文”，即先秦两汉那种句式自由、不拘对偶的散文。韩愈认为文章应当阐明儒家的“道”，内容与形式要统一，作文要“惟陈言之务去”，不能照搬前人的陈词滥调；柳宗元也说文章是用来“明道”的。他们不仅提出主张，还写出了大量优秀的作品：韩愈的《师说》《原道》《进学解》《祭十二郎文》，柳宗元的“永州八记”、《捕蛇者说》、寓言《黔之驴》等，都成为后世传诵的名篇。

  韩愈还广收弟子，奖掖后进，李翱、皇甫湜、张籍、李汉等人都在他的影响下写作古文，形成了一时的风气，后人称为“古文运动”。不过韩、柳去世以后，晚唐的骈文又重新兴盛，李商隐等人就以骈文著称。

  到了宋代，欧阳修、苏轼等人继承韩愈、柳宗元的主张，掀起了新的古文运动，古文从此取代骈文成为文章的主流。明代茅坤编选《唐宋八大家文钞》，把韩愈、柳宗元与宋代的欧阳修、苏洵、苏轼、苏辙、王安石、曾巩并列，“唐宋八大家”的称呼由此流行。
sources: []
recalled:
  - 韩愈《答李翊书》
  - 柳宗元《答韦中立论师道书》
  - 《新唐书·韩愈传》
  - 茅坤《唐宋八大家文钞》
