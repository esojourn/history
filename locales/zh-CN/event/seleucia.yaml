name: 安息占领两河
summary: 公元前 141 年米特里达梯一世攻取底格里斯河畔的塞琉西亚，巴比伦尼亚转归安息。
body: |-
  底格里斯河畔的塞琉西亚由塞琉古一世建于公元前 4 世纪末，是塞琉古王国在两河流域的首要城市。前 2 世纪中叶，塞琉古王国因王位之争而内乱，德米特里二世与拥立幼主的将领特里丰相持于叙利亚。安息的米特里达梯一世在前 148 年下半年或前 147 年取得米底之后，继续西进。

  前 141 年米特里达梯一世进入巴比伦尼亚，占领塞琉西亚，并在那里加冕。据《伊朗百科全书》引楔形文字文书，到这一年 10 月 12 日，南方的乌鲁克已承认他的统治。不久他东返抵御游牧部落的入侵。德米特里二世起兵反攻，查士丁说他得到当地希腊人和一些东方民族的响应，屡次获胜，最后在前 138 年中计被俘，被送往希尔卡尼亚。

  前 130 年前后，安条克七世又一度收复两河流域和米底，次年战死，塞琉古王国此后退守叙利亚，两河流域长期归于安息。塞琉西亚仍是希腊式的大城，安息人后来在河对岸经营泰西封作为都城。
sources:
  - 伊朗百科全书“Arsacids ii. The Arsacid Dynasty”条（前 141 年 10 月乌鲁克文书） https://www.iranicaonline.org/articles/arsacids-ii/
  - 英文维基百科“Seleucia”条 https://en.wikipedia.org/wiki/Seleucia
recalled:
  - 查士丁《腓力史摘要》第 36 卷第 1 章、第 38 卷第 9—10 章、第 41 卷第 6 章
  - 《马加比一书》第 14 章第 1—3 节
