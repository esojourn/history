name: 耶路撒冷陷落、第二圣殿被毁
summary: 公元 70 年提图斯率罗马军团攻陷耶路撒冷，第二圣殿被焚毁。
body: |-
  这件事发生在新约各书所记的事之后，主要依据是亲历者约瑟夫斯的《犹太战记》。公元 66 年，犹太人在罗马巡抚弗洛鲁斯任内起事。叙利亚总督凯斯提乌·加卢斯率军进到耶路撒冷城下，随后撤退，在伯和仑一带遭到重创。尼禄派韦斯巴芗领兵平定，67 年罗马军攻取加利利，守约他帕他的约瑟夫斯投降。68 年尼禄死，69 年韦斯巴芗被拥立为皇帝，把战事交给儿子提图斯。这期间耶路撒冷城内几派相互攻杀，为首的有吉斯卡拉的约翰和西门·巴·吉奥拉。

  70 年春逾越节前后，提图斯率四个军团围城。据《犹太战记》卷 5—6，罗马军先后攻破北面的两道城墙，又绕城筑起围墙断绝粮食，城里发生严重饥荒。夏天，罗马军攻下圣殿北侧的安东尼亚营楼，圣殿里每日的献祭停止；不久圣殿起火焚毁。约瑟夫斯说，提图斯本想保全圣殿，火是士兵擅自投掷火把引起的；另有后世的记载说焚殿出于提图斯的决定，两说并存。犹太传统在埃波月初九纪念两座圣殿被毁。此后约一个月，上城也被攻下，全城陷落。

  据约瑟夫斯，围城期间死亡一百一十万人，被俘九万七千人；现代学者一般认为这些数字过大。提图斯下令拆毁城和圣殿，只留下几座塔楼和西面的一段城墙。71 年，韦斯巴芗和提图斯在罗马举行凯旋式，后来建成的提图斯凯旋门上刻有圣殿的金灯台。死海边的马萨达要塞到公元 73 年前后才被攻下。

  圣殿被毁以后，以圣殿为中心的献祭和祭司制度终止。福音书记耶稣曾说圣殿将来没有一块石头留在石头上（《马可福音》13:2；《路加福音》21:6）。相传拉比约哈难·本·撒该在雅麦尼亚重聚学者，此后犹太教以会堂和律法研习为中心延续下来。
sources: []
recalled:
  - 约瑟夫斯《犹太战记》卷 2—7（围城见卷 5—6）
  - 塔西佗《历史》卷 5
  - 《马可福音》13:1–2；《路加福音》19:41–44，21:5–6
