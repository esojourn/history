name: 鄱阳湖之战
summary: 1363 年朱元璋与陈友谅在鄱阳湖决战，以火攻大败汉军，陈友谅中箭身死。
body: |-
  元末群雄中，朱元璋据有应天（今南京），西面是占据江西、湖广的陈友谅，东面是占据江浙的张士诚。陈友谅兵力最强，至正二十年（公元 1360 年）曾率舟师进攻应天，在龙湾被朱元璋击败。至正二十三年（1363 年）春，朱元璋出兵救援被张士诚围攻的安丰，陈友谅趁机率领大批巨舰顺江东下，围攻朱元璋控制的洪都（今江西南昌）。守将朱文正坚守了八十多天（据《明史》），为朱元璋回师赢得了时间。

  七月，朱元璋亲率舟师从应天出发，经长江进入鄱阳湖。陈友谅撤除对洪都的包围，在湖中迎战。陈友谅的战船高大，连在一起，进退不便；朱元璋的船小而灵活。两军在康郎山一带激战，朱元璋命人用小船装载火药和芦苇，趁着顺风冲向汉军的船队，焚毁了大批巨舰，汉军死伤惨重。此后双方又在湖中多次交战，朱元璋派兵封锁了鄱阳湖通往长江的湖口。

  两军相持一个多月后，陈友谅的军中粮食将尽，他冒险率军突围，想从湖口冲入长江，在泾江口一带被流矢射中头部而死，汉军大部投降。次年陈友谅的儿子陈理在武昌出降，汉政权灭亡。

  鄱阳湖之战是元末群雄之间规模最大的一次水战，也是朱元璋统一江南的决定性一战。战后朱元璋自称吴王，随即转而进攻张士诚，三年后消灭了张士诚，统一了长江中下游，为建立明朝打下了基础（另见“明朝建立”条）。
sources: []
recalled:
  - 《明史·太祖本纪》
  - 《明史·陈友谅传》
