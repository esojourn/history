name: 腓力二世遇刺
summary: 公元前 336 年腓力二世在女儿的婚礼上被侍卫刺死，二十岁的亚历山大继位。
body: |-
  公元前 336 年，腓力二世已派帕曼纽和阿塔罗斯率一万人左右的先头部队渡海进入小亚细亚，自己准备随后出发。动身之前，他在旧都埃盖为女儿克列奥帕特拉与伊庇鲁斯国王亚历山大举行婚礼。这位新郎是王后奥林匹亚斯的弟弟。腓力一年前另娶了贵族阿塔罗斯的侄女，奥林匹亚斯因此回了娘家，这桩婚事是为了稳住伊庇鲁斯。希腊各邦都派了使节带着金冠前来祝贺。

  婚宴次日清晨，剧场里要举行竞技。据狄奥多罗斯，游行队伍抬着十二位奥林波斯神的雕像入场，后面跟着第十三尊，是腓力自己的像。腓力身穿白袍，让卫兵退到远处，独自走进剧场入口。这时七名近身护卫官之一、奥雷斯提斯人保萨尼亚斯冲上前，用一把凯尔特短剑刺入他的肋部，他当场死去。保萨尼亚斯奔向城门外备好的马匹，被葡萄藤绊倒，追上来的佩尔狄卡斯等几名护卫用长矛将他刺死。

  凶手的动机，亚里士多德在《政治学》里只说是因为腓力听任他受阿塔罗斯一伙的侮辱。狄奥多罗斯讲得较详：保萨尼亚斯曾是腓力的宠侍，因与另一名宠侍争风而遭阿塔罗斯设宴灌醉、交给马夫凌辱；他向腓力申诉，腓力因阿塔罗斯是新后的叔父、又正要派去统兵，没有惩办，只给了他一些赏赐和提拔。这件事发生在几年以前，学者对其年代和情节有疑问。

  古代就有人怀疑幕后另有主使。普鲁塔克说，舆论多归咎于奥林匹亚斯，说她怂恿了这个年轻人，亚历山大也受到议论；尤斯丁说得更加肯定。亚历山大自己后来在给大流士的信里说是波斯人收买的。这些说法都没有证据。事实是亚历山大得益最大：安提帕特当即把他带到军队面前拥立为王。此后几个月里，他的堂兄阿明塔斯、林刻斯提斯王族的两兄弟、远在亚洲的阿塔罗斯相继被处死，奥林匹亚斯杀了腓力的新妻和她的婴儿。

  1977 年在韦尔吉纳（即古埃盖）发现的王室墓葬中，有一座的墓主被发掘者认定是腓力二世，剧场遗址就在附近的王宫之下。
sources: []
recalled:
  - 狄奥多罗斯《历史丛书》卷十六第 91—95 章
  - 亚里士多德《政治学》卷五第 10 章 1311b
  - 普鲁塔克《亚历山大传》第 9—10 章
  - 尤斯丁《腓力史纲要》卷九第 6—7 章
