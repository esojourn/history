name: 襄樊之战与吕蒙袭荆州
summary: 公元 219 年关羽北攻樊城，吕蒙乘虚袭取荆州，关羽兵败被杀。
body: |-
  赤壁之战后，荆州分属三方：曹操据有北部的襄阳、樊城，孙权和刘备分占南部。建安二十年（公元 215 年）孙刘两家以湘水为界重新划分，关羽镇守江陵，控制西部的南郡、零陵、武陵。

  建安二十四年（219 年）七月，刘备在汉中称王，关羽率主力北上，围攻曹仁据守的樊城。曹操派于禁、庞德带七支部队增援。八月连降大雨，汉水泛滥，于禁各军的营地被淹，关羽乘大船进攻，于禁率数万人投降，庞德被俘后不屈而死。樊城城墙多处崩塌，曹仁苦守。《三国志·蜀书·关羽传》说，许都以南有人起兵遥相呼应，关羽“威震华夏”。曹操一度打算把献帝迁离许都，司马懿、蒋济劝阻，认为孙权不愿看到关羽得势，可以约他袭击关羽的后方。

  孙权早有夺取荆州的打算。驻在陆口的吕蒙称病回建业，由陆逊接替；陆逊写信恭维关羽，关羽于是把留守的兵力陆续调往樊城。孙权一面写信给曹操表示愿意效力，一面派吕蒙出兵。吕蒙把士兵藏在船舱里，让摇橹的人扮成商人，溯江而上，沿途的哨所都被悄悄拿下。留守公安的士仁和留守江陵的糜芳平日受关羽轻视，这次又因军资供应不及而害怕被治罪，先后投降。

  此时曹操派出的徐晃也在樊城外击破关羽的围营。关羽撤围南返，得知江陵已失，将士们的家属都在城中并受到吕蒙的优待，军心瓦解，士卒纷纷离去。他退到麦城，再向西突围，建安二十四年十二月在临沮被孙权的部将截获，与儿子关平一同被杀，这时按公历已是 220 年初。

  这一战使刘备失去荆州，诸葛亮“隆中对”设想的两路北伐不再可能；孙刘联盟破裂，两年后刘备东征，又有夷陵之战。
sources: []
recalled:
  - 《三国志·蜀书·关张马黄赵传》
  - 《三国志·吴书·周瑜鲁肃吕蒙传》《陆逊传》《吴主传》
