name: 行省制度
summary: 元朝在中央设中书省，在各地设行中书省，奠定了此后以“省”为地方最高行政区的格局。
body: |-
  行省的全称是“行中书省”，意思是中书省在地方的派出机构。金朝末年和蒙古前期，朝廷遇到军事行动或重大事务时，常派大臣以“行尚书省”“行中书省”的名义到地方处理，事毕撤销。忽必烈即位后设立中书省作为最高行政机关，此后在征服和治理各地的过程中陆续设置行中书省，最初也多带有临时的性质，到元世祖后期逐渐固定下来，成为常设的地方最高行政机构。

  元朝中期的行政区划是：今河北、山东、山西和内蒙古的一部分称为“腹里”，由中书省直辖；吐蕃地区由宣政院管辖；其余地方分设岭北、辽阳、河南江北、陕西、四川、甘肃、云南、江浙、江西、湖广等行省，此外还有设在高丽的征东行省。行省设丞相、平章政事等官，掌管本省的钱粮、兵甲、屯种、漕运等军政事务，权力很大。行省之下设路、府、州、县，各级机构多设蒙古人担任的达鲁花赤，掌握最终的决定权。

  元朝的行省辖区很大，划界时常常有意让各省跨越山川形势，互相牵制，如以秦岭以南的汉中划归陕西，以淮河以南的部分地区划归河南江北行省。行省制度是中国地方行政制度的一大变化，明朝改行省为承宣布政使司，但习惯上仍称为“省”，清朝和以后一直沿用，今天中国的省级行政区就是从这里演变而来的。
sources: []
recalled:
  - 《元史·百官志》
  - 《元史·地理志》
