name: 受难与复活
summary: 耶稣在耶路撒冷受审，被钉死在各各他；福音书记他第三日复活。
body: |-
  逾越节前，耶稣骑着驴驹进入耶路撒冷。祭司长和长老商议怎样拿住他，十二使徒中的加略人犹大去见祭司长，约定把他交出来。耶稣和门徒吃了最后的晚餐，拿起饼和杯来分给他们（太 26:26–29；林前 11:23–26）。饭后他到橄榄山下的客西马尼祷告，犹大领着人来把他拿住，门徒都逃走了。

  耶稣当夜被带到大祭司那里，《约翰福音》记先到亚那那里，再到该亚法那里。公会定他说了僭妄的话，是该死的；彼得在院子里三次不认他。清早，众人把他解交罗马总督彼拉多。《路加福音》23:6–12 独记彼拉多把他送到希律·安提帕那里，希律又送了回来。彼拉多说查不出他的罪，想要释放他，众人却要求释放巴拉巴。彼拉多把耶稣鞭打了，交给兵丁；兵丁给他戴上荆棘编的冠冕，带到各各他，把他钉在十字架上，当天他就断了气。《约翰福音》19:25–27 记他的母亲和抹大拉的马利亚站在十字架旁边，他把母亲托付给所爱的那门徒。傍晚，亚利马太人约瑟向彼拉多求了他的身体，安放在磐石里凿出来的新坟墓里。

  四卷福音书都记载，七日的第一日清早，抹大拉的马利亚等妇女来到坟墓，见石头已经挪开，坟墓空了，有天使告诉她们耶稣已经复活。其后的显现各书所记不一：《约翰福音》记他先向抹大拉的马利亚显现，当晚向门徒显现，八日后多马在场时再次显现；《路加福音》记他在往以马忤斯的路上向两个门徒显现，所记的显现都在耶路撒冷一带；《马太福音》记十一个门徒在加利利的山上见到他。《路加福音》24:50–51 和《使徒行传》1:3–12 记他复活后四十天，在橄榄山被接升天。

  受难的日期，各书都说是安息日的前一天。符类福音把最后的晚餐记作逾越节的筵席；《约翰福音》18:28 和 19:14 则说受审时逾越节的筵席还没有吃，那天是预备逾越节的日子。受难之年有公元 30 年和 33 年两说，都在彼拉多的任期（约公元 26—36 年）之内，本条取 30 年。
sources: []
recalled:
  - 《马太福音》第 26—28 章
  - 《马可福音》第 14—16 章
  - 《路加福音》第 22—24 章
  - 《约翰福音》第 18—21 章
  - 《使徒行传》1:1–12
  - 《哥林多前书》11:23–26
