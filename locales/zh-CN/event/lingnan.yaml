name: 秦征岭南
summary: 秦军南下攻取岭南越地，于前 214 年设桂林、象郡、南海三郡。
body: |-
  秦统一六国后向岭南用兵。《史记·秦始皇本纪》记载简略：始皇三十三年（公元前 214 年），征发曾经逃亡的人、赘婿和商人，“略取陆梁地”，设桂林、象郡、南海三郡，并迁徙罪人戍守。

  战事的过程主要见于《淮南子·人间训》：秦派尉屠睢率兵五十万，分为五军，三年不解甲；又派监禄开凿水渠运粮，杀西呕君译吁宋。越人退入丛林，推举首领夜袭秦军，杀屠睢，秦军损失惨重，于是征发谪戍防备。《史记·平津侯主父列传》所录严安的上书说法相近。五十万、“伏尸流血数十万”等数字出自汉初人的追述，未必准确；起兵之年史无明文，今人有前 219 年、前 218 年等推测。

  赵佗参与了这次战事，严安上书称秦“使尉佗将卒以戍越”，《史记·南越列传》说他在秦时任南海郡龙川令。置郡之后，秦迁谪徙之民与越人杂居，《南越列传》说前后十三年。秦末赵佗据三郡自立，建立南越国。
