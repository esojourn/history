name: 万历三大征
summary: 万历年间明朝平定宁夏之乱、援朝抗日、平定播州之乱的三次大战。
body: |-
  “万历三大征”指万历二十年（1592 年）到二十八年（1600 年）间明朝进行的三次大规模军事行动。

  宁夏之役：万历二十年（1592 年）二月，宁夏副总兵、蒙古族降将哱拜与儿子哱承恩发动兵变，占据宁夏镇城，勾结河套蒙古。明朝派李成梁的儿子李如松等人率军平叛，围城数月后决水灌城，九月攻破城池，哱拜自杀。

  朝鲜之役：万历二十年（1592 年）四月，日本丰臣秀吉派大军入侵朝鲜（朝鲜称“壬辰倭乱”），日军迅速攻占汉城、平壤，朝鲜国王宣祖逃到鸭绿江边的义州，向明朝求援。明朝先派小股部队入朝失利，同年冬派李如松率军入朝，次年正月收复平壤，此后在碧蹄馆受挫，日军退守朝鲜南部沿海，双方开始议和。朝鲜水军将领李舜臣在海上屡败日军。万历二十四年（1596 年）明朝使者到日本册封丰臣秀吉为日本国王，和议破裂，次年日军再次入侵（朝鲜称“丁酉再乱”），明朝再次出兵，与朝鲜军一起与日军在朝鲜南部相持。万历二十六年（1598 年）丰臣秀吉死去，日军撤退，中朝水军在露梁海域截击日军，李舜臣和明将邓子龙战死。这场战争持续七年，明朝前后出兵十余万，耗银据说达七百多万两。

  播州之役：播州（今贵州遵义）的杨氏土司世袭统治当地七百多年，土司杨应龙在万历年间屡次叛乱。万历二十七年（1599 年）明朝以李化龙总督川、湖、贵三省军务，次年调集各路大军二十余万（据《明史》）分八路进攻，攻破杨应龙据守的海龙囤，杨应龙自杀。明朝随后在播州改设遵义、平越二府，由朝廷派官治理。

  三大征都取得了胜利，但耗费了大量钱财，加重了明朝的财政困难。万历帝为了弥补亏空，派宦官到各地开矿收税，引起很多民怨。
sources: []
recalled:
  - 《明史·神宗本纪》
  - 茅瑞征《万历三大征考》
  - 柳成龙《惩毖录》
