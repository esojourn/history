name: 叙拉古陷落
summary: 罗马围城两年后破城，阿基米德遇害。
body: |-
  叙拉古王希耶隆二世与罗马结盟近五十年。公元前 215 年他去世，继位的孙子希耶罗尼穆斯转而与迦太基接洽，不久被刺；城中几经变乱，亲迦太基的希波克拉底和厄庇居德斯兄弟掌了权。罗马派马塞卢斯前来，约在前 213 年从陆上和海上同时攻城。

  据波利比乌斯，守城的器械出自阿基米德之手：远近不同射程的投石机，从城墙上伸出、把重物砸向船只的吊臂，还有用铁爪抓住船头吊起再摔下的装置。罗马人架在船上的攻城梯无法靠近城墙，马塞卢斯只得放弃强攻，改为长期围困。后世流传的用镜子聚光烧船之说，波利比乌斯、李维和普鲁塔克都没有记载。

  据李维和普鲁塔克，罗马人后来趁城中庆祝阿尔忒弥斯节，夜间翻越一段较矮的城墙，占领了高处的厄庇波莱。前来解围的迦太基军队驻在城外，因瘟疫大量死亡。约前 212 年，一名伊比利亚雇佣兵首领献出城门，全城陷落，遭到洗劫，阿基米德在乱中被杀。城中的雕像、绘画被运往罗马。破城的年份，也有学者定在前 211 年。
sources:
  - 波利比乌斯《历史》卷七第 2—8 章；卷八第 3—7、37 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/8*.html
  - 普鲁塔克《马塞卢斯传》第 13—21 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Marcellus*.html
  - 英文维基百科“Siege of Syracuse (213–212 BC)”（核对年份） https://en.wikipedia.org/wiki/Siege_of_Syracuse_(213%E2%80%93212_BC)
