name: "正统长老会成立"
summary: "梅钦等人因反对现代主义被北方长老会审处，1936 年另组教会，后称正统长老会。"
body: |-
  《历史的轨迹》第四十八章说，现代主义侵入普林斯顿神学院，再进入北方长老会；1929 年梅钦在费城成立威斯敏斯特神学院与之对抗。书中说，经过激烈奋斗，加尔文派在 1935 年的大会中被现代派击败，原因是多数长老会信徒把“和平”放在“真理”之上；一批忠于先人信仰的人于是在 1934 年组成正统长老会，这个小而勇的教会至今仍与现代主义争战。书中还说，北方长老会虽然仍以《威斯敏斯特信条》为正式信条，但意义已经改变，因为现代派可以轻易把自由神学读进信条里。

  书中所说的年份前后倒置。据一般记载，梅钦 1933 年另立独立的长老会海外宣教部，北方长老会总会 1934 年下令参与者退出，梅钦拒绝，1935 年被区会定罪停职，1936 年 5 月总会维持原判；同年 6 月 11 日梅钦与支持者在费城成立新教会，起初名为“美国长老会”，因北方长老会控告名称侵权，1939 年改称“正统长老会”。成立不久，教会内部又因千禧年观点和饮酒问题分出圣经长老会。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十八章“教会努力保守信仰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter53.html"
