name: "尼德兰起义"
summary: "1568 年起尼德兰反抗西班牙统治，北方七省结盟独立，1609 年与西班牙休战。"
body: |-
  尼德兰十七省是查理五世从祖上继承的领地。他在位时多次颁令惩治异端，重洗派和路德派有上千人被处死。1555 年他把尼德兰交给儿子腓力二世。《历史的轨迹》第二十六章说，荷兰到 1550 年以后才感受到加尔文的影响，改革宗很快盖过了路德派和重洗派；1561 年德布利写成《比利时信条》。该章又说荷兰国王查理五世一直逼迫新教徒，以致信徒 1571 年要到边界外的埃姆登开会；查理 1558 年已去世，那时当政的是腓力二世和他派来的阿尔瓦公爵。

  腓力二世住在西班牙，增设主教区、加税、驻军，又不肯放宽对异端的法令，贵族和城市都不满。1566 年几百名贵族联名请愿，被朝臣讥为“乞丐”；同年夏天各地发生捣毁圣像的风潮。次年阿尔瓦公爵带一万兵来，设“除暴委员会”审判，处死了埃格蒙特伯爵等一千多人，被缺席判罪的近万人。该书第三十章说，在查理五世和腓力二世治下，荷兰有一万八千多信徒死于西班牙的宗教裁判所；一万八千是阿尔瓦离任时自己说的处决人数，学者认为夸大，尼德兰设的也不是西班牙那一套宗教裁判所。

  1568 年奥兰治亲王威廉从德意志起兵，失败。1572 年 4 月流亡海上的“海上乞丐”夺取布里勒港，荷兰、泽兰两省的城市相继起事，推威廉为首。哈勒姆被围七个月陷落，莱顿在 1574 年靠掘堤放水解了围。1576 年欠饷的西班牙兵洗劫安特卫普，各省订立《根特协定》一致对外。1579 年南方信天主教的几省与西班牙和解，北方七省结成乌得勒支同盟，1581 年宣布废黜腓力二世。

  1584 年威廉遇刺，次年安特卫普陷落，南方重归西班牙，成千上万的新教徒北迁。英格兰的伊丽莎白这才公开出兵援助。1588 年无敌舰队失败后，威廉的儿子莫里茨和政治家奥尔登巴内费尔特收复了东部和北部的城镇。

  该书说，1609 年西班牙终于承认荷兰北部独立。那一年订的是十二年休战协定，西班牙把联省共和国当作独立国家来谈判；正式承认要到 1648 年的《明斯特和约》。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十六章“西欧的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter29.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
