name: 张骞通西域
summary: 张骞两次奉汉武帝之命出使，到达大宛、大月氏和乌孙，汉朝与西域各国从此正式往来。
body: |-
  汉初，玉门关以西的绿洲各国和游牧部族大多受匈奴控制，汉朝对那里所知甚少。武帝即位后，从匈奴降人口中听说，原居河西的月氏被匈奴击败后西迁，一直想要报仇，便招募使者去联络月氏，共同夹击匈奴。郎官张骞应募。他出发的年份，史书没有明确记载，一般认为在建元二年或三年（公元前 139 年或前 138 年）。

  据《史记·大宛列传》，张骞一行百余人出陇西后就被匈奴捉住，军臣单于把他扣留了十余年。他后来逃脱，西行数十日到达大宛，大宛王派向导把他经康居送到大月氏。这时大月氏已定居在妫水以北，土地肥沃，又臣服了南面的大夏，无意再与匈奴为敌。张骞住了一年多，没有达成使命，归途中再次被匈奴扣留，直到元朔三年（前 126 年）才乘匈奴内乱回到长安。他把亲身到过的大宛、大月氏、大夏、康居和听说的乌孙、安息、条支、身毒等国的情况报告给武帝，这是中原第一次得到关于中亚的确切知识。

  霍去病夺取河西以后，通往西域的道路打通。元狩四年（前 119 年）前后，张骞建议用厚礼招引乌孙东迁到河西故地，与汉结为兄弟，以切断匈奴的右臂。武帝派他率三百人，带着上万头牛羊和大量金帛出使乌孙。乌孙王年老，国内分裂，又惧怕匈奴，没有答应东迁，但派了数十名使者带着马匹随张骞回访。张骞还分派副使前往大宛、康居、大月氏、大夏、安息等国。元鼎二年（前 115 年）他回到长安，一年多后去世；他派出的副使后来也陆续带着各国的使者回来。

  此后汉朝每年派往西域的使团多则十余批，少则五六批，西域的葡萄、苜蓿等物产传入中原，汉朝的丝织品也经由这些道路西运。司马迁把张骞的出使称为“凿空”，意思是开通了前所未有的道路。后来乌孙与汉和亲，汉朝在西域设立都护，都是由此发展而来。
sources: []
recalled:
  - 《史记·大宛列传》
  - 《汉书·张骞李广利传》
  - 《汉书·西域传》
