name: 始祖犯罪，被逐出伊甸
summary: 亚当和夏娃受蛇引诱吃了禁果，受神审判，被赶出伊甸园。
body: |-
  据《创世记》第 2 章，神把亚当安置在伊甸园里，吩咐他园中各样树上的果子都可以随意吃，只是分别善恶树上的果子不可吃，因为吃的日子必定死（2:16–17）。那时亚当和他的妻子赤身露体，并不羞耻（2:25）。

  第 3 章记载，蛇比田野一切的活物更狡猾。它问女人，神是否真说过不许吃园中的果子，又说吃了不一定死，反而眼睛明亮，能像神一样知道善恶。女人见那树的果子好作食物，悦人的眼目，且能使人有智慧，就摘下来吃了，又给她丈夫，她丈夫也吃了。二人的眼睛就明亮了，才知道自己赤身露体，便拿无花果树的叶子编作裙子。天起了凉风，他们听见神在园中行走的声音，就藏在树木中（3:1–8）。

  神呼唤亚当，逐一追问。亚当说果子是女人给他的，女人说是蛇引诱了她。神于是宣告：蛇必用肚子行走，终身吃土，蛇的后裔与女人的后裔要彼此为仇，女人的后裔要伤蛇的头，蛇要伤他的脚跟；女人怀胎生产要多受苦楚；地要因亚当的缘故受咒诅，长出荆棘和蒺藜，他必汗流满面才得糊口，直到归于尘土（3:9–19）。亚当给妻子起名叫夏娃。神用皮子做衣服给他们穿，又恐怕人伸手摘生命树的果子吃，就把他们赶出伊甸园去耕种土地，并在园子东边安设基路伯和四面转动发火焰的剑，把守生命树的道路（3:20–24）。

  这件事在后来的经文里多次被提起。保罗在《罗马书》5:12 说，罪是从一人入了世界，死又是从罪来的；《启示录》12:9 把那古蛇称为魔鬼。基督教神学里“原罪”的教义就建立在这一章之上，其中以奥古斯丁的阐述影响最大；《创世记》3:15 关于女人后裔的话，据教会传统被看作指向基督的最早应许。犹太教对这一章的解释与此不同，一般不讲原罪。
sources: []
recalled:
  - 《创世记》第 2—3 章
  - 《罗马书》第 5 章
  - 《启示录》12:9
