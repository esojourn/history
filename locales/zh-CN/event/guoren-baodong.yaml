name: 国人暴动与共和行政
summary: 前 841 年国人驱逐周厉王，此后十四年称“共和”，中国从此有确切纪年。
body: |-
  周厉王好利，把山林川泽的出产收归王室专有，又派卫巫监视议论朝政的人，有告发就杀，国人“道路以目”。召公劝谏说“防民之口，甚于防川”，厉王不听。据《国语·周语上》，三年之后，即公元前 841 年，国人起来反抗，袭击厉王，厉王出奔到彘。国人又包围召公家要杀太子静，召公以自己的儿子代替太子，太子才得以保全。

  厉王出奔后由谁执政，古书有两种说法。《史记·周本纪》说“召公、周公二相行政，号曰共和”；《竹书纪年》佚文、《庄子·让王》以及清华简《系年》则说是诸侯共伯和代行王政。两说至今各有支持者。共和十四年（公元前 828 年），厉王死于彘，太子静即位，就是周宣王。

  共和元年在中国历史上有特殊意义。司马迁作《史记·十二诸侯年表》即从共和元年开始，此后历代都有连续的确切纪年；此前的年代，只能依靠古书的世系和天文、考古推算，说法各不相同。时间长河从这一年开始不再标“传统说法”。

  “国人”指居住在国都及近郊的人，包括平民和下层贵族，有一定的政治地位，也承担兵役。这次暴动是中国历史上有记载的较早的一次民众驱逐君主的事件。

  共和行政到公元前 828 年结束。
sources: []
recalled:
  - 《国语·周语上》
  - 《史记·周本纪》
  - 《史记·十二诸侯年表》
  - 《竹书纪年》（佚文）
  - 清华简《系年》
