name: 恺撒改订历法（儒略历）
summary: 恺撒废除靠祭司置闰的旧历，改行每年 365 天、四年一闰的太阳历。
body: |-
  公元前 46 年恺撒下令改订罗马历法，新历从前 45 年 1 月 1 日起实行，后世称“儒略历”（“儒略”即“尤利乌斯”的旧译）。

  旧的罗马历法一年十二个月共三百五十五天，比太阳年短十天多，办法是由大祭司团隔年在二月之后插入一个闰月。置闰与否由祭司决定，常被用来延长或缩短某位长官的任期，战乱时又往往漏置。到前 46 年，历书上的日期已比季节超前了约三个月。

  恺撒自前 63 年起就是大祭司长。据老普林尼，为他设计新历的是亚历山大城的天文学家索西琴尼。办法分两步：先在前 46 年补足差额，这一年除了照例的闰月，又额外加了两个月，据肯索里努斯，全年长达四百四十五天；从次年起，平年三百六十五天，多出的十天分配到各个月份里，每四年在二月里加一天。

  恺撒死后，祭司们误解了“每四年”的算法，按罗马人把首尾都计入的习惯每三年置一闰。奥古斯都发现后，停闰若干年加以纠正。前 44 年，恺撒出生的昆提利斯月（原意“第五月”）改名为“尤利乌斯月”，即今天西方语言里七月的名称；后来塞克斯提利斯月又改称“奥古斯都月”，即八月。

  儒略历一年平均三百六十五天又四分之一，比回归年长约十一分钟，每一百二十八年左右多出一天。它随罗马帝国和基督教会通行于欧洲。到十六世纪，春分已比尼西亚公会议时提前了十天，影响复活节的推算；1582 年教皇格里高利十三世颁布改历，删去十天，并规定整百的年份须能被四百整除才置闰，这就是现行的公历。新教和东正教国家后来才陆续采用，英国在 1752 年，俄国在 1918 年；一些东正教会至今仍用儒略历计算节期。
