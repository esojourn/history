name: 犹太独立
summary: 塞琉古免除犹太的贡赋，西门成为领袖兼大祭司，哈斯蒙尼王朝开始。
body: |-
  约公元前 143 年，约拿单被塞琉古将军特黎丰诱捕杀害，其兄西门继为首领。当时特黎丰与德米特里二世争夺王位，西门派人向德米特里求免贡赋。德米特里回信称西门为“大祭司、王的朋友”，承认犹太人修筑的堡垒归其所有，免去欠缴的王冠税和在耶路撒冷征收的其他税项（《马加比一书》13:34–40）。

  《马加比一书》13:41–42 记道：塞琉古纪元 170 年，即公元前 142 年，“外邦人的轭从以色列除去”，百姓开始在文书契约上写“大祭司、统帅、犹太人的领袖西门元年”。次年西门迫使耶路撒冷卫城里的塞琉古守军投降（13:49–52）。塞琉古纪元 172 年，民众大会议定由西门担任领袖和大祭司，“直到有可靠的先知兴起”，并把决议刻在铜版上，立于锡安山（14:27–49）。

  西门一家出自玛他提亚，约瑟夫斯称这一家族为哈斯蒙尼，他们此后统治犹太一百余年。西门本人未称王；据约瑟夫斯《犹太古史》卷 13 第 11 章，最先称王的是他的孙子阿里斯托布鲁斯一世。
sources:
  - 《马加比一书》13:1–53、14:25–49
  - 约瑟夫斯《犹太古史》卷 13 第 6 章第 7 节、第 11 章第 1 节 https://penelope.uchicago.edu/josephus/ant-13.html
  - Wikipedia, "Hasmonean dynasty" https://en.wikipedia.org/wiki/Hasmonean_dynasty
