name: 涿鹿之战
summary: 传说中黄帝与蚩尤在涿鹿之野的战争，黄帝擒杀蚩尤，诸侯尊他为天子。
body: |-
  涿鹿之战是传说时代的事。据《史记·五帝本纪》，蚩尤作乱，不听黄帝之命，黄帝征调诸侯的军队，与蚩尤战于涿鹿之野，“遂禽杀蚩尤”。此后诸侯尊轩辕为天子，代神农氏，号为黄帝。

  《山海经·大荒北经》的记载充满神话色彩：蚩尤作兵伐黄帝，黄帝命应龙在冀州之野迎战，应龙蓄水，蚩尤请风伯、雨师纵大风雨；黄帝降下天女魃，雨才停止，遂杀蚩尤。后世又有黄帝造指南车辨别方向等说法，出现得更晚。

  这次战争在古书里是黄帝取得天下的标志。涿鹿一般认为在今河北涿鹿一带。它同阪泉之战一样属于传说，不能当作信史。
sources: []
recalled:
  - 《史记·五帝本纪》
  - 《山海经·大荒北经》
