name: 遣唐使
summary: 日本从 630 年起多次派使团到唐朝，带回律令、典籍、佛教和城市规划，影响深远。
body: |-
  舒明天皇二年（公元 630 年），日本派犬上御田锹为使者到唐朝，这是第一次遣唐使。此后二百多年间，日本前后任命过近二十次遣唐使，实际到达唐朝的有十几次，最后一次实际成行是在 838 年。894 年，被任命为遣唐大使的菅原道真以唐朝衰乱为由建议停派，遣唐使从此终止。

  遣唐使团由大使、副使、判官、录事等官员率领，随行的有留学生、学问僧以及医师、阴阳师、画师、乐师和各种工匠，后期一般分乘四艘船，每次多达数百人，所以被称为“四船”。他们从九州出发，早期多沿朝鲜半岛西岸北上，后来常直接横渡东海，在扬州、明州一带登陆，再前往长安。海上风浪很大，船只遇难的情况屡见不鲜。

  遣唐使带回了大量典籍、佛经、器物和知识。日本仿照唐朝制定了《大宝律令》等律令，仿照长安城营建了平城京和平安京，在服饰、礼仪、音乐、书法、建筑等方面广泛吸收唐朝文化。不少留学生和学问僧长期在唐学习，如吉备真备、玄昉、阿倍仲麻吕，以及后来的空海、最澄、圆仁等人；唐朝的高僧鉴真也是随遣唐使的船只东渡日本的。

  遣唐使停派后，日本逐渐发展出以假名文字、和歌、大和绘为代表的“国风文化”，但与中国的民间商船往来并没有中断。
