name: 南汉建立
summary: 917 年刘䶮在番禺（广州）称帝，国号大越，次年改称汉，史称南汉。
body: |-
  唐末刘隐据有岭南的广州一带，任清海军节度使，后梁封他为南海王。乾化元年（公元 911 年）刘隐去世，弟弟刘䶮继承了他的地位，此后逐步扩大地盘，据有岭南大部分地区。

  贞明三年（917 年），刘䶮因为后梁不肯封他为南越王，在番禺称帝，国号大越，以番禺为兴王府。次年他改国号为汉，史称南汉。南汉据有今广东、广西的大部分地区，凭借广州的港口发展海外贸易，经济比较富庶。

  南汉君主多以严刑峻法统治，后期的君主刘鋹尤其荒淫，任用宦官，据史书，南汉宦官人数极多。开宝四年（971 年），北宋大将潘美攻入广州，刘鋹投降，南汉灭亡，共历四主五十五年。
sources: []
recalled:
  - 《新五代史·南汉世家》
  - 《资治通鉴》卷二百六十九至二百七十
