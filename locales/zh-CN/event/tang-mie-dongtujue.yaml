name: 唐灭东突厥
summary: 629—630 年李靖、李勣等出击东突厥，夜袭定襄、突袭阴山，擒获颉利可汗。
body: |-
  隋末唐初，东突厥是北方最强大的势力，中原各路割据者多向它称臣，唐高祖起兵时也曾向始毕可汗称臣。唐朝建立后，颉利可汗几乎年年南侵。武德九年（公元 626 年）八月，唐太宗刚即位，颉利率大军直抵长安附近的渭水便桥，太宗亲临渭水与他对话，双方结盟，突厥退兵。

  此后东突厥接连遭受大雪、饥荒，颉利对部众横征暴敛，又重用胡人，薛延陀、回纥等铁勒诸部纷纷背叛，颉利的侄子突利可汗也与他不和。贞观三年（629 年）十一月，唐太宗以李靖为定襄道行军总管，与李勣等人分六路出击，据《资治通鉴》，合兵十余万。

  贞观四年（630 年）正月，李靖率三千骑兵从马邑出发，夜袭定襄，颉利惊恐，退到铁山。颉利派使者请降，太宗派唐俭前去安抚。二月，李靖认为突厥见唐使到来必定松懈，与李勣商定率一万精骑突袭，苏定方率二百骑为前锋，在大雾中逼近颉利的牙帐，突厥大溃。据《资治通鉴》，唐军斩首一万余级，俘获男女十余万。颉利向西北逃跑，三月被唐将张宝相擒获，送到长安，东突厥灭亡（另见“颉利可汗”条）。

  这年四月，西北各族的君长请太宗称“天可汗”。对于十余万降众如何安置，朝中争论很久，太宗采纳温彦博的建议，在幽州至灵州之间设置都督府安置突厥部众，任用突厥贵族为都督，又有上万家迁入长安。半个世纪后，东突厥的后裔骨咄禄重新建立汗国，史称后突厥（另见“后突厥复国”条）。
sources: []
recalled:
  - 《旧唐书·突厥传》
  - 《旧唐书·李靖传》
  - 《资治通鉴》卷一百九十三
