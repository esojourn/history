name: 喀罗尼亚战役
summary: 公元前 338 年腓力二世击败雅典与底比斯联军，希腊城邦从此受制于马其顿。
body: |-
  公元前 339 年，德尔斐的近邻同盟会议因安菲萨人耕种圣地而发动又一次“神圣战争”，请马其顿国王腓力二世领兵。腓力率军南下，没有去安菲萨，而是突然占据了福基斯的埃拉提亚，从这里到彼奥提亚和阿提卡只有几天路程。消息在傍晚传到雅典。德摩斯梯尼后来在《金冠辞》里描述，第二天清晨公民大会上传令官一再问谁愿发言，无人起身，最后是他站出来，提议与多年的对头底比斯结盟。他亲自出使底比斯，许以由底比斯统领陆军、雅典承担三分之二的费用，底比斯人接受了。

  联军在冬春之间守住了进入彼奥提亚的几处山口。腓力用计夺取安菲萨，迫使联军后撤到刻菲索斯河谷的喀罗尼亚。前 338 年 8 月初，两军在这里决战。据狄奥多罗斯，腓力有步兵三万余、骑兵二千，联军人数相近。联军方面，雅典人在左翼，底比斯人和他们的“圣队”在右翼，其他盟军居中。腓力自己在右翼对着雅典人，把左翼的骑兵交给十八岁的亚历山大。

  关于战斗经过的记载很简略。后世的波利艾努斯说，腓力先让右翼有意后退，引得雅典人追击而阵线拉开，然后反击；这一说法是否可靠，学者意见不一。可以确定的是亚历山大在左翼首先突破，底比斯的圣队没有后退，几乎全部战死。据狄奥多罗斯，雅典人阵亡一千余人，被俘约二千人。德摩斯梯尼作为重装步兵在阵中，随败军退走。战场上至今立着一座石狮，一般认为是底比斯人为圣队所立；十九世纪在它下面发掘出二百五十四具遗骨。

  腓力对两邦的处置不同。底比斯要赎回俘虏和阵亡者的遗体，卫城驻进马其顿军，彼奥提亚同盟被削弱。对雅典，他不要赎金就放回俘虏，派亚历山大和安提帕特护送阵亡者的骨灰到雅典；雅典保有阿提卡和几座岛屿，但要解散海上同盟，与他结盟。次年他在科林斯召集各邦，组成由他统帅的同盟。希腊各城邦此后名义上仍然自治，对外的和战却不再由自己决定。
sources: []
recalled:
