name: 侬智高之乱
summary: 1052 年广源州首领侬智高起兵，攻陷邕州，围攻广州，次年被狄青夜袭昆仑关击败。
body: |-
  侬智高是广源州（今越南高平一带）的壮族首领。广源州处在宋朝与交趾之间，他的家族长期受交趾的压迫。他几次请求归附宋朝，都没有得到允许。皇祐四年（公元 1052 年）四月，侬智高起兵攻陷邕州，自称仁惠皇帝，国号大南，随后沿郁江东下，接连攻破横州、贵州、藤州、梧州、封州、康州、端州等地，包围广州。广州城坚守不下，他又回师邕州。宋朝派去的几路军队都被击败。

  这年九月，枢密副使狄青主动请命南征，仁宗任命他为宣徽南院使、宣抚荆湖南北路，统一指挥岭南军事。皇祐五年（1053 年）正月，狄青到达宾州，为了麻痹敌军，在上元节大张灯火，宴请将佐，却在当夜冒着风雨率军越过险要的昆仑关，在归仁铺与侬智高决战，大败侬军，收复邕州。侬智高逃往大理，此后下落不明。这次战事之后，宋朝加强了对广西边地的控制。
sources: []
recalled:
  - 《宋史·狄青传》
  - 《宋史·蛮夷传·广源州》
  - 《续资治通鉴长编》卷一百七十二至一百七十四
