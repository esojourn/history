name: 野狐岭之战
summary: 1211 年成吉思汗攻金，在野狐岭大败金军主力，从此金朝在战略上转入被动。
body: |-
  金朝长期在蒙古高原上采取分化压制的政策，铁木真的先人俺巴孩汗就曾被塔塔儿人捉送金朝处死。成吉思汗统一蒙古、建立大蒙古国以后，停止向金朝纳贡。1208 年金章宗去世，卫绍王完颜永济即位，成吉思汗认为他庸懦无能，不肯拜受金朝的诏书。

  1211 年，成吉思汗在先迫使西夏屈服之后，亲率大军南下攻金。金朝派平章政事完颜承裕（胡沙）、参知政事独吉思忠率大军扼守野狐岭一带的险要（今河北张家口万全区一带），同时修筑乌沙堡等城防。蒙古军先攻下乌沙堡，随后在野狐岭与金军主力决战。据《元史·石抹明安传》，金军派契丹人石抹明安到蒙古军前探问虚实，他趁机投降，向成吉思汗报告了金军的部署。据《元史》，木华黎率敢死之士冲锋陷阵，成吉思汗率大军跟进，金军大败，在会河堡一带被追歼，死伤极多。

  野狐岭之战是蒙古与金朝之间的第一场大决战。金军精锐在此战中损失殆尽，此后蒙古军攻破居庸关，进逼金中都，并四出掠夺河北、山东、山西各地，金朝在战略上从此转入被动，金朝多年在北边修筑的界壕防线也随之失去作用。1214 年金宣宗被迫迁都汴京（另见“金宣宗南迁”条）。
sources: []
recalled:
  - 《元史·太祖本纪》
  - 《元史·木华黎传》
