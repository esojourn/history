name: 保罗归信
summary: 扫罗往大马色捉拿门徒，路上遇见复活的耶稣，从迫害者变为传道者。
body: |-
  司提反死后，扫罗继续迫害教会。据《使徒行传》9:1–2，他去见大祭司，求文书给大马色（大马士革）的各会堂，若找着信奉这道的人，无论男女，都准他捆绑带到耶路撒冷。

  将到大马色的时候，忽然从天上发光，四面照着他，他仆倒在地，听见有声音问他为什么逼迫我；他问主是谁，回答说是他所逼迫的耶稣，并叫他进城去（9:3–6）。扫罗起来，睁开眼睛却不能看见，同行的人拉他的手领他进城，他三日不能看见，也不吃不喝。大马色的门徒亚拿尼亚在异象中受差遣去见他，按手在他身上，他就能看见，起来受了洗（9:10–18）。这件事在《使徒行传》里记了三次，另两次是保罗自己的陈述（22:6–16、26:12–18），细节略有不同：9:7 说同行的人听见声音却看不见人，22:9 说他们看见了光，却没有听明白说话的声音。

  扫罗随即在各会堂宣讲耶稣是神的儿子。后来犹太人商议要杀他，门徒在夜间用筐子把他从城墙上缒下去（9:23–25）；保罗在《哥林多后书》11:32–33 也提到这件事，说是亚哩达王手下的提督把守城门要捉拿他。《加拉太书》1:17–18 说他归信后先往亚拉伯去，又回到大马色，过了三年才上耶路撒冷。到了那里，门徒都怕他，不信他是门徒，巴拿巴接待他，领他去见使徒；后来弟兄们把他送到该撒利亚，打发他往大数去（徒 9:26–30）。

  圣经没有给出这件事的年份。学界一般依《加拉太书》第 1—2 章所说的“三年”“十四年”，从耶路撒冷会议往前推，定在公元 33 至 36 年之间，本条取约数公元 34 年。
sources: []
recalled:
  - 《使徒行传》9:1–30，22:3–21，26:9–20
  - 《加拉太书》1:11–24
  - 《哥林多后书》11:32–33
