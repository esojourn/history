name: 六镇之乱
summary: 北魏北边六镇的军民起事，动乱蔓延河北、关陇，北魏由此走向崩溃。
body: |-
  北魏前期为了防御柔然，在平城以北设立了沃野、怀朔、武川、抚冥、柔玄、怀荒等军镇，统称六镇。镇将多由鲜卑贵族担任，镇兵多是鲜卑和其他各族的良家子弟，当时地位很高。孝文帝迁都洛阳后，政治中心南移，洛阳的鲜卑贵族迅速汉化和门阀化，而留在北边的镇民却被视为低人一等，仕途受阻；镇将贪暴，又有不少罪犯被发配到镇上戍守，镇民的处境越来越差。

  正光四年（公元 523 年），柔然可汗阿那瓌趁饥荒入塞抢掠，怀荒镇民请求发粮遭拒，杀死了镇将。沃野镇的破六韩拔陵随即起兵，杀死镇将，各镇纷纷响应（起兵的年份有 523 年、524 年两说）。北魏派兵讨伐屡次失败，孝昌元年（525 年）借助柔然阿那瓌的兵力，才击败了破六韩拔陵。投降的镇民二十余万人被安置到河北的冀、定、瀛三州就食，正赶上当地饥荒，次年鲜于修礼在定州再次起事，后来由葛荣统领，史称众至数十万，一度围攻邺城；杜洛周也在上谷起兵。与此同时，关陇地区的莫折念生、万俟丑奴等人也起兵反魏。

  北魏朝廷由胡太后执政，政治腐败，中央军屡战屡败，只得依靠地方豪强的力量。秀容的契胡酋长尔朱荣乘机收容六镇流民，迅速壮大，武泰元年（528 年）发动河阴之变，同年在滏口击败葛荣；永安三年（530 年），尔朱天光、贺拔岳、宇文泰等平定了关陇的万俟丑奴。

  六镇之乱使北魏的统治走向崩溃。此后半个多世纪北方的政局，主要由出身六镇的将领主导：高欢、侯景出自怀朔镇，宇文泰、贺拔岳、独孤信、杨忠、李虎等出自武川镇，他们分别建立或奠定了东魏北齐、西魏北周以至隋唐的政权。不少学者把这场动乱看作北魏汉化改革之后，洛阳统治集团与北边鲜卑军人之间矛盾的总爆发。
