name: 收复新疆
summary: 左宗棠击败阿古柏政权，收复伊犁以外的新疆，1884 年新疆建省。
body: |-
  同治三年（1864 年）新疆各地发生动乱，中亚浩罕汗国的军官阿古柏乘机率军进入南疆，次年在喀什噶尔建立政权，后来又占领了北疆的乌鲁木齐等地，得到英国和俄国的承认和支持。同治十年（1871 年）俄国以“代为收复”为名占领了伊犁。

  光绪元年（1875 年）前后，日本出兵台湾，东南海防告急，清朝内部发生了“海防”与“塞防”之争。李鸿章主张暂时放弃新疆，把经费集中用于海防；陕甘总督左宗棠主张海防、塞防并重，认为新疆是保卫蒙古、进而保卫京师的屏障，不能放弃。朝廷最终采纳了左宗棠的意见，任命他为钦差大臣，督办新疆军务。

  左宗棠在兰州、肃州筹措粮饷，制定了“先北后南、缓进速战”的方针。光绪二年（1876 年）刘锦棠率湘军攻克乌鲁木齐，收复了北疆的大部分地区。次年清军越过天山，攻破达坂城、吐鲁番，阿古柏在库尔勒一带死去（死因有暴病、服毒、被杀等不同说法）。到光绪四年（1878 年）初，清军收复了除伊犁以外的新疆全部领土。

  此后清朝派崇厚到俄国谈判收回伊犁，崇厚擅自签订了丧失大量权益的《里瓦几亚条约》，朝廷拒绝批准，改派曾纪泽再赴彼得堡谈判。左宗棠进驻哈密，作出与俄国一战的姿态。光绪七年（1881 年）中俄签订《伊犁条约》，清朝收回了伊犁，但仍割让了伊犁以西的部分领土，赔款九百万卢布。光绪十年（1884 年）清朝在新疆设立行省，刘锦棠任第一任巡抚。
sources: []
