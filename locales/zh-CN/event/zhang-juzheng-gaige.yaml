name: 张居正改革
summary: 万历初年张居正推行考成法、清丈田亩和一条鞭法，国力一度回升。
body: |-
  嘉靖、隆庆年间，明朝财政困难，土地兼并严重，许多豪强隐瞒田产、逃避赋税，北方边防和东南倭患也耗费巨大。隆庆六年（1572 年）万历帝即位，首辅张居正在李太后和宦官冯保的支持下主持朝政，开始推行改革。

  万历元年（1573 年）张居正推行“考成法”：各部门把应办的事务登记在册，规定完成期限，由六科稽查六部，由内阁稽查六科，按期考核，完不成的要受处分。这样内阁就能有效地督促各级官员，朝廷的政令得以贯彻，拖欠的赋税也被大量追缴。他还裁减冗官冗费，减少宫廷开支，严禁官员滥用驿站。

  为了解决田赋不均的问题，万历六年（1578 年）起张居正下令在全国清丈土地，到万历九年（1581 年）基本完成，查出了大量隐瞒的田亩。在此基础上，他把在一些地区试行过的“一条鞭法”推广到全国：把原来按户、丁分派的徭役和各种杂税合并起来，一部分摊入田亩，与田赋一起按亩征收白银，由官府雇人服役。一条鞭法简化了赋役征收，减轻了一部分农民的负担，也适应了当时白银流通日益广泛的情况。

  在边防上，张居正任用戚继光镇守蓟州、李成梁镇守辽东，维持与俺答汗的和议，北方边境比较安定；又任用潘季驯治理黄河、淮河。据记载，改革以后太仓储存的粮食可以支用十年，国库存银也有了较大增加。

  万历十年（1582 年）张居正去世，随即遭到清算，考成法等措施被废除，但一条鞭法在各地延续下来，对清代的“摊丁入亩”也有影响。
sources: []
