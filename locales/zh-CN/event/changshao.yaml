name: 长勺之战
summary: 前 684 年鲁军在曹刿谋划下于长勺击败齐军，“一鼓作气”出于此战。
body: |-
  齐桓公即位后，因鲁国曾支持公子纠与他争位，于公元前 684 年派兵攻鲁。据《左传》庄公十年，鲁人曹刿求见鲁庄公，同乡劝他说这是“肉食者”的事，他回答“肉食者鄙，未能远谋”。曹刿问庄公凭什么作战，庄公先后说到分赏衣食、祭祀诚信，曹刿都认为不足以取胜；庄公说大小诉讼虽不能一一明察，但必按实情处理，曹刿说“忠之属也，可以一战”。

  两军在长勺对阵。齐军擂鼓进攻，庄公要击鼓迎战，曹刿说还不可以；齐军三次击鼓后，曹刿才说可以了，鲁军一举击败齐军。庄公要追击，曹刿下车察看齐军的车辙，又登上车前横木远望，然后才说可以追。战后曹刿解释说：“夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。”又说大国难测，怕有埋伏，看到齐军车辙混乱、旗帜倒下，才知道是真的溃逃。

  长勺之战是以弱胜强的著名战例，《曹刿论战》被选入后世的许多文选。曹刿与《史记·刺客列传》中劫持齐桓公的曹沫是否同一人，学界有不同看法。

  同年夏天，齐、宋联军又进攻鲁国，鲁军在乘丘先击败宋军，齐军也随之撤退。

  《左传》的这段记述后来以《曹刿论战》为题收入《古文观止》，广为传诵。
sources: []
recalled:
  - 《左传》庄公十年
  - 《史记·齐太公世家》
