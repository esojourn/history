name: 冷河战役
summary: 公元 394 年狄奥多西一世在阿尔卑斯山东麓击败西部的僭主欧根尼乌斯。
body: |-
  公元 392 年 5 月，西部的年轻皇帝瓦伦提尼安二世被发现吊死在高卢的宫里。掌握西部兵权的法兰克人将领阿尔博加斯特说是自杀，许多人怀疑是他下的手。阿尔博加斯特出身蛮族，自己不能称帝，三个月后立了一位修辞学教师出身的文官欧根尼乌斯。欧根尼乌斯是基督徒，但为了争取罗马的元老，他准许把胜利女神祭坛放回元老院，听任显贵们出资恢复旧日的祭祀。狄奥多西不承认他，把自己的次子霍诺里乌斯立为皇帝，准备出兵。

  394 年夏，狄奥多西从君士坦丁堡西进，军中有斯提利科等将领，还有两万名依约出兵的哥特人，年轻的阿拉里克是他们的首领之一。西军没有扼守山口，而是在阿尔卑斯山东端通往意大利的河谷里列阵，那条河叫弗里吉都斯，意思是“冷河”，在今斯洛文尼亚境内。

  9 月 5 日，狄奥多西命哥特人打头阵仰攻，死伤惨重。奥罗修说死了一万，还说失去这些人本身就是一种得益。当夜，西军派去截断退路的一支部队倒戈。第二天再战。同时代的基督教作家鲁菲努斯、奥罗修、奥古斯丁和诗人克劳狄安都说，一阵狂风从东军背后刮起，把西军的箭和标枪吹了回去，尘土扑面，盾牌也拿不住。那一带确有一种从山上冲下来的强烈东北风。西军溃败，欧根尼乌斯被擒斩首，阿尔博加斯特在山里游荡两天后自杀。

  基督教作家把这一仗写成上帝对异教的裁决，说对方在山头立了朱庇特像，军旗上画着赫拉克勒斯。现代学者中有人认为这种宗教对决的色彩是事后添上去的，欧根尼乌斯一方并没有举起异教的旗帜。

  帝国最后一次统一在一个皇帝手里，只有四个多月：395 年 1 月狄奥多西死在米兰。西部的野战军在这一仗里损失很大；哥特人觉得自己被拿去送死而酬劳太少，狄奥多西一死，阿拉里克就带着他们反了。
