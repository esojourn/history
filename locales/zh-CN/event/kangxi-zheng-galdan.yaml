name: 康熙亲征噶尔丹
summary: 噶尔丹东攻喀尔喀、进逼清朝，康熙帝三次亲征将其击败。
body: |-
  十七世纪后期，卫拉特蒙古的准噶尔部在噶尔丹的统治下迅速强大，统一了卫拉特各部，控制了天山南路。漠北的喀尔喀蒙古分为土谢图汗、车臣汗、扎萨克图汗三部，内部纷争不断。康熙二十七年（1688 年）噶尔丹率军越过杭爱山攻打喀尔喀，土谢图汗战败，喀尔喀数十万人南逃，请求清朝保护。

  康熙二十九年（1690 年）噶尔丹以追击喀尔喀为名，进入漠南，到达距北京只有七百里的乌兰布通。康熙帝命裕亲王福全率军迎战，双方在乌兰布通激战，噶尔丹以骆驼卧地组成“驼城”抵抗，被清军用火炮击破，噶尔丹趁夜撤退。次年康熙帝在多伦诺尔与喀尔喀各部会盟，把喀尔喀编为旗，喀尔喀从此正式归附清朝。

  康熙三十五年（1696 年）康熙帝分东、中、西三路亲征漠北，他自己率领中路。噶尔丹得知康熙帝亲至，向西撤退，在昭莫多遭到费扬古率领的西路军截击，噶尔丹大败，他的妻子阿奴战死，部众大部溃散。这时噶尔丹的侄子策妄阿拉布坦已在伊犁另立门户，噶尔丹无处可归。康熙三十六年（1697 年）康熙帝第三次出征，到达宁夏，同年噶尔丹去世，清朝的记载说他服毒自杀，也有记载说他病死。

  噶尔丹死后，漠北蒙古完全归入清朝的统治，但准噶尔在策妄阿拉布坦和噶尔丹策零的统治下仍然强大，此后与清朝在西藏、青海、新疆一带争战了半个多世纪，直到乾隆年间才被平定（另见“平定准噶尔”条）。
