name: 西拿基立进攻犹大
summary: 亚述王西拿基立攻取犹大诸城，兵临耶路撒冷而没有破城。
body: |-
  亚述王萨尔贡二世于公元前 705 年去世后，帝国西部的属国相继停止纳贡。《列王纪下》18:7 说犹大王希西家背叛亚述王，不肯事奉他。据《历代志下》第 32 章，希西家修筑城墙、制造军器，并塞住城外的泉源；《列王纪下》20:20 记他挖池、挖沟，引水入城。《以赛亚书》第 30—31 章责备犹大人下埃及求帮助。

  《列王纪下》18:13 说，希西家十四年，西拿基立上来攻取犹大的一切坚固城。希西家差人到拉吉见亚述王认罪，亚述王罚他银子三百他连得、金子三十他连得；希西家把圣殿和王宫府库里所有的银子都给了他，又把殿门上和柱上的金子刮下来（18:14–16）。此后亚述王从拉吉差他珥探、拉伯撒利、拉伯沙基率大军到耶路撒冷，拉伯沙基在城下用犹大言语喊话劝降。希西家撕裂衣服，进了耶和华的殿，又差人去见先知以赛亚；以赛亚回话说亚述王必听见风声，回本地去。亚述王听说古实王特哈加出兵，再次致书威吓。希西家把书信在耶和华面前展开祷告，以赛亚传话说亚述王必不得来到这城，也不在这里射箭。当夜耶和华的使者出去，在亚述营中杀了十八万五千人，西拿基立就拔营回去，住在尼尼微（19:35–36）。《以赛亚书》第 36—37 章、《历代志下》第 32 章有平行的记载。

  亚述一方的记载见于西拿基立的棱柱铭文（泰勒棱柱等）。铭文说他攻取犹大四十六座坚固城和周围无数小村，掳走二十万零一百五十人，把希西家像笼中之鸟一样困在耶路撒冷，割取他的城邑分给亚实突、以革伦、迦萨的王；希西家随后把金三十他连得、银八百他连得和其他贡物送到尼尼微。尼尼微王宫的浮雕刻画了攻取拉吉的情形，拉吉遗址也发掘出亚述军的攻城坡道。

  两边相合的地方是：亚述攻取了犹大诸城，拉吉是其中的要地；希西家纳贡，金子都是三十他连得；耶路撒冷没有被攻破，希西家仍然在位。不同的地方是：银子一作三百他连得、一作八百他连得；圣经把纳贡记在前、兵临城下记在后，铭文把贡物放在叙述的末尾；圣经所记亚述军一夜之间的损失，铭文没有提及，铭文也没有说明为何不取耶路撒冷。希罗多德《历史》卷二另记有埃及人的一个说法：西拿基立的军队在埃及边境因田鼠咬坏箭袋、弓和盾牌的把手而溃退。

  年代上，按亚述的纪年这次西征在前 701 年。《列王纪下》18:13 把它系于希西家十四年，而 18:9–10 把撒玛利亚陷落系于希西家四年到六年，两处难以同时成立，学界有不同的解释。另有学者主张西拿基立曾两次西征，这不是多数意见。
