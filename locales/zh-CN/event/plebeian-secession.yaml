name: 平民第一次撤离与保民官的设立
summary: 传统上定在公元前 494 年：负债的平民集体离开罗马，迫使贵族同意设立保民官。
body: |-
  传统上定在公元前 494 年。共和国初年，官职和祭司职位由贵族垄断，法律不成文，由贵族解释。平民中的小农要自备武装从军，田地荒废就只能借债；按照当时的规矩，还不起债的人要给债主做工抵债，甚至被拘禁。

  据李维，这一年罗马正与沃尔斯基人、萨宾人和埃奎人作战。执政官曾许诺打完仗减免债务，战后元老院不肯兑现。军队中的平民于是拒绝听令，整队离开罗马，到阿涅内河对岸的圣山扎营（另一说是到阿文提诺山）。城中恐慌，元老院派梅涅尼乌斯·阿格里帕前去劝说。李维记他讲了一个寓言：身体各部分不满肚子只吃不做，一齐罢工，结果全身都虚弱了。

  双方达成的协议是，平民可以有自己的长官，称为保民官，人身不可侵犯，有权救助受长官欺压的平民；贵族不得担任此职。最初的保民官是两人还是五人，古人说法不同，后来增加到十人。平民对着神发誓，谁伤害保民官，谁就被献给神，人人可杀。保民官的否决权后来扩大到可以阻止长官的行动和元老院的决议。同时设立了平民营造官，平民有了自己的大会。

  传说中这样的撤离共有五次，从前 494 年到前 287 年。现代学者认为早期的几次经过后人加工，细节多按格拉古时代的冲突来想象；但平民以集体罢战为手段争取权利，由此形成自成一体的平民组织，是可信的。
sources: []
recalled:
  - 李维《建城以来史》卷二第 23—33 章
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷六
  - 西塞罗《论共和国》卷二第 57—59 节
