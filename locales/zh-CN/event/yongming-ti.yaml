name: 竟陵八友与永明体
summary: 南齐永明年间，沈约、谢朓等人在竟陵王西邸讲求四声，形成讲究声律的“永明体”。
body: |-
  齐武帝永明五年（公元 487 年），竟陵王萧子良移居建康鸡笼山的西邸，招集文学之士，其中萧衍、沈约、谢朓、王融、萧琛、范云、任昉、陆倕八人最有名，号称“竟陵八友”。

  当时周颙著《四声切韵》，沈约著《四声谱》，把汉字的读音分为平、上、去、入四声。沈约、谢朓、王融等人把四声运用到诗歌写作中，要求一句之内、两句之间的声调高低相间、互相配合，并归纳出作诗应当避免的声律毛病，后人概括为平头、上尾、蜂腰、鹤膝、大韵、小韵、旁纽、正纽“八病”。沈约在《宋书·谢灵运传论》中说，要使“宫羽相变，低昂互节，若前有浮声，则后须切响”。这种讲究声律、对偶，篇幅较短的新体诗，因产生于永明年间而被称为“永明体”。

  这种做法当时也有人不以为然。据《梁书·沈约传》，梁武帝问周捨什么是四声，周捨回答“天子圣哲”，四字正好是平上去入，但武帝始终不太采用。钟嵘在《诗品》中批评过分拘泥声律有损诗歌的真美。

  永明体是古体诗向近体诗过渡的重要一步，经过梁、陈、隋几代人的发展，到唐代形成了格律严整的律诗和绝句。
sources: []
recalled:
  - 《南齐书·陆厥传》
  - 《梁书·沈约传》
  - 沈约《宋书·谢灵运传论》
