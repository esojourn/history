name: 帕特农神庙兴建
summary: 公元前 447 年至前 432 年雅典在卫城上建成供奉雅典娜的大理石神庙。
body: |-
  公元前 480 年波斯人焚毁了雅典卫城上的神庙，其中有一座刚开工不久的雅典娜神庙。此后三十年废墟没有重建。前 5 世纪中叶，在伯里克利的推动下，公民大会决定重修卫城。帕特农神庙于前 447 年动工，前 438 年主体完成，菲迪亚斯所作的黄金象牙雅典娜像在那一年落成；山墙上的雕像继续做到前 432 年。刻在石碑上的历年工程账目有残片留存，这些年份由此而知。

  据普鲁塔克，建筑师是伊克提诺斯和卡利克拉特斯，菲迪亚斯总管全部工程。神庙用雅典东北彭特利孔山的大理石建成，采用多利亚式，正面八根柱，侧面十七根，比通常的神庙更宽。台基和柱列都有细微的弯曲和倾斜：台基中间略微隆起，柱身中部稍粗，角柱略向内倾。内殿上方的墙上有一圈长约一百六十米的浮雕饰带，一般认为表现的是泛雅典娜节的游行队伍；外侧的九十二块排档间饰刻着神与巨人、希腊人与阿马宗人、拉庇泰人与半人马的战斗；东山墙是雅典娜的诞生，西山墙是雅典娜与波塞冬争夺阿提卡。

  工程的经费有相当一部分来自提洛同盟的金库。普鲁塔克记载了当时的争论：反对者说，希腊人为战争缴纳的钱，被用来把雅典打扮得像个戴满珠宝的虚荣女人；伯里克利回答，只要雅典履行了保卫盟邦的义务，就不必向他们交代钱怎么花，而工程使各行各业的人都有了生计。山门、厄瑞克忒翁神庙和胜利女神庙在此后三十年里相继建成。

  神庙后来先后被改作基督教堂和清真寺，建筑大体保持完整。1687 年威尼斯军队围攻卫城，一发炮弹击中奥斯曼人存放在神庙里的火药，中段被炸毁。1801 年起，英国驻奥斯曼大使额尔金伯爵把大部分残存的雕刻拆运到伦敦，今藏大英博物馆；希腊多年来要求归还，两国之间至今仍有争议。
