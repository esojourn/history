name: 高梁河之战
summary: 979 年宋太宗灭北汉后乘胜攻辽，在幽州城外的高梁河被辽军击败。
body: |-
  太平兴国四年（公元 979 年）五月宋灭北汉，宋太宗不顾将士疲惫、赏赐未发，决定乘胜北伐，收复燕云。六月宋军越过太行山东进，辽朝的易州、涿州守将相继投降，宋军进抵幽州（辽称南京，今北京），把城池团团围住。辽朝南京留守韩德让等人据城坚守，宋军四面攻城十多天，没能攻下，将士久战之后已很疲惫，又因灭北汉的赏赐迟迟没有发放而心怀不满。

  七月，辽朝援军到达。辽将耶律沙在高梁河与宋军交战，渐渐不支，这时耶律休哥、耶律斜轸率领的援军赶到，分左右两翼夹击，城中的辽军也出城接应，宋军大败。据《辽史》，宋太宗仅以身免，到涿州后乘驴车逃走。宋人记载中也提到太宗在这次战役中受了箭伤，有的笔记说他后来箭伤每年复发，最终因此去世，这一说法难以证实。

  高梁河之战是宋辽之间第一次大规模的交战。战后辽军几次南下报复，宋朝开始在河北沿边修筑防御工事、开挖塘泊，阻挡辽朝骑兵。宋太宗没有放弃收复燕云的打算，七年后又发动了雍熙北伐（另见该条）。宋人笔记还记载，战乱中军中一度找不到太宗，有人谋立赵匡胤之子赵德昭，太宗回来后很不高兴，这与赵德昭不久自杀有关。
sources: []
recalled:
  - 《辽史·耶律休哥传》《耶律斜轸传》
  - 《辽史·景宗本纪》
