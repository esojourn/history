name: 库鲁佩狄翁战役
summary: 公元前 281 年塞琉古一世击杀利西马科斯，继业者之间的最后一战。
body: |-
  伊普苏斯之战后，利西马科斯据有色雷斯和小亚细亚大部，公元前 285 年前后又独占马其顿，是当时版图最大的国王。他晚年娶了托勒密一世之女阿尔西诺伊。约前 283 年，他把前妻所生的长子、多年替他守卫亚洲领土的阿伽托克勒斯处死，罪名是谋反；古代作家多说这是阿尔西诺伊为自己的儿子铺路。阿伽托克勒斯的遗孀吕珊德拉带着孩子，和她的兄弟、托勒密一世的长子托勒密·克劳诺斯一起逃到塞琉古那里，请他出兵。小亚细亚的城市和驻军将领纷纷倒戈，看守帕加马金库的菲勒泰罗斯也在这时改投塞琉古。

  前 282 年冬塞琉古越过托罗斯山进入小亚细亚，萨迪斯的守将献出城池和金库。前 281 年年初，两军在萨迪斯以西的库鲁佩狄翁（意为“居鲁士平原”）交战。关于这一战，现存记载只有寥寥数语，兵力和经过都不清楚。尤斯丁说，这是亚历山大的战友之间的最后一战：利西马科斯七十四岁，塞琉古七十七岁，两人都还有年轻人的心气。利西马科斯阵亡，据说是被一个赫拉克利亚人用标枪投中的。据阿庇安和普鲁塔克，他的狗守着遗体不肯离开，尸体多日后才被找到，由其子带回利西马基亚安葬。

  塞琉古接收了小亚细亚。阿尔西诺伊乔装逃出以弗所，去了马其顿。这时除埃及外，亚历山大的帝国几乎都在塞琉古一人手里。他把亚洲交给儿子安条克，自己在这一年夏末渡过赫勒斯滂海峡，要去做故乡马其顿的国王。在利西马基亚附近，随行的托勒密·克劳诺斯将他刺死，然后驰入利西马基亚，被军队拥立为王。

  两位老王死于同一年，他们的遗产却没有人能全部接住。安条克一世忙于平定叙利亚等地的变乱，无力西顾，小亚细亚北部的比提尼亚、本都和帕加马趁机自立。托勒密·克劳诺斯在马其顿只坐了一年多王位，前 279 年被入侵的高卢人击杀。利西马科斯的王国就此消失，色雷斯和马其顿在几年里无人能守。
sources: []
recalled:
  - 尤斯丁《腓力史纲要》卷十七第 1—2 章
  - 阿庇安《叙利亚战争》第 62—64 章
  - 保萨尼亚斯《希腊志》卷一第 10 章
  - 门农《赫拉克利亚史》残篇
