name: 鸿门宴
summary: 项羽入关后，刘邦到鸿门军中谢罪，席间范增欲杀之而未成。
body: |-
  汉元年十月刘邦先入关中，接受秦王子婴投降，派兵把守函谷关。据《史记·项羽本纪》，项羽率诸侯军随后到达，见关门有兵把守，又听说刘邦已破咸阳，大怒，攻破函谷关，进至戏西。刘邦的左司马曹无伤派人告诉项羽，说刘邦想在关中称王。《本纪》记当时项羽兵四十万，驻新丰鸿门，刘邦兵十万，驻霸上；范增劝项羽立即进攻。

  项羽的叔父项伯与张良有旧，连夜到汉营报信，劝张良离开。张良把他引见给刘邦，刘邦与项伯约为婚姻，请他代为解释。次日刘邦带百余骑到鸿门谢罪，项羽留他饮酒。席上范增几次举玉玦示意，项羽不应；范增又叫项庄入席舞剑，想借机刺杀刘邦，项伯也起身拔剑对舞，用身体遮护。张良出帐召来樊哙，樊哙带剑持盾闯入，当面责备项羽。不久刘邦借口如厕离席，留下张良辞谢，自己带樊哙等四人从小路回到霸上，回营后立即杀了曹无伤。“项庄舞剑，意在沛公”一语即出于此事。

  《高祖本纪》把项羽至戏系于十二月中，一般换算为公元前 206 年初。数日后项羽引兵进入咸阳，杀子婴，烧秦宫室，随后分封诸侯，封刘邦为汉王。
sources:
  - 《史记·项羽本纪》 https://zh.wikisource.org/wiki/史記/卷007
  - 《史记·高祖本纪》 https://zh.wikisource.org/wiki/史記/卷008
  - 《史记·留侯世家》 https://zh.wikisource.org/wiki/史記/卷055
