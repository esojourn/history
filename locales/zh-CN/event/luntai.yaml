name: 轮台诏
summary: 汉武帝晚年下诏否决在西域轮台扩大屯田的建议，自陈以往用兵之失，转而注重农业生产。
body: |-
  武帝在位的后二十年，对匈奴的战事屡遭挫折，征和三年（公元前 90 年）李广利率领的七万大军覆没。国内因长期征发，户口减少，各地多有流民和盗贼；巫蛊之祸又使太子和大批朝臣死于非命。

  据《汉书·西域传》，征和四年（前 89 年），搜粟都尉桑弘羊与丞相、御史大夫联名上奏，建议在西域的轮台以东增派屯田的士卒，设校尉统领，修筑亭障，逐步向西延伸，以威慑西域各国、支援乌孙。武帝没有批准，为此下了一道长诏。诏书回顾了李广利最后一次出征的经过，承认当初的决策有误；又说先前有关部门奏请每人增加三十钱的赋税来补助边防，这会加重老弱孤独者的困苦，如今又请求派人到遥远的轮台屯田，是扰劳天下，不是优待百姓的办法，自己不忍心听。诏书最后说，当前要做的是禁止苛刻暴虐，停止擅自加赋，致力农业，恢复养马免役的法令，使武备不致缺乏而已。《西域传》说这道诏书“深陈既往之悔”，后人称之为“轮台诏”或“轮台罪己诏”。

  此后武帝不再出兵。他封丞相田千秋为“富民侯”，表示要让百姓休养生息；又任命赵过为搜粟都尉，推广在同一块田里轮换垄沟位置耕种的“代田法”和新式农具。两年后武帝去世。

  《资治通鉴》记这一年武帝在泰山对群臣说，自己即位以来所为狂悖，使天下愁苦，今后凡是伤害百姓、耗费天下的事一律停止。这段话不见于《汉书》。传统看法认为轮台诏标志着武帝晚年政策的根本转变，昭帝、宣帝时的休养生息由此开始；近年也有学者认为《通鉴》的叙述有所夸大，诏书针对的只是轮台屯田一事。
sources: []
recalled:
  - 《汉书·西域传下》
  - 《汉书·食货志上》
  - 《资治通鉴》卷二十二
