name: 万人远征
summary: 一万多名希腊雇佣兵随小居鲁士攻入波斯腹地，主帅战死后自行杀出一条路，退到黑海。
body: |-
  公元前 401 年，波斯王子小居鲁士起兵与兄长阿尔塔薛西斯二世争位。伯罗奔尼撒战争结束后希腊有大批无事可做的士兵，他通过斯巴达流亡者克列阿科斯等人招募了一支雇佣军。据参加者色诺芬在《长征记》里的记载，途中点验时有重装步兵约一万零四百人、轻盾兵约二千五百人，后世称之为“万人军”。

  军队春天从萨迪斯出发，起初只说是去讨伐山民。走到幼发拉底河边，小居鲁士才公开目标，并提高饷额。秋天，两军在巴比伦以北的库纳克萨交战。希腊人在右翼击溃了当面的敌人，小居鲁士却在冲击国王时阵亡，他的亚洲部队随即溃散。希腊人拒绝缴械，在波斯总督提萨斐尼斯的“护送”下沿底格里斯河北行。途中提萨斐尼斯邀克列阿科斯等五位将军赴会，把他们拘捕，后来处死，同去的队长们当场被杀。

  军中连夜推举新的将领，雅典人色诺芬是其中之一，斯巴达人刻里索福斯领前队。他们烧掉帐篷和车辆，一路抵挡波斯骑兵的袭扰，进入卡杜齐亚人的山地，再穿过冬天的亚美尼亚高原，沿途受冻、挨饿，与各部族作战。前 400 年初，前队登上一座山顶，望见了黑海，士兵们高喊“海！海！”。几天后他们抵达希腊人的城市特拉佩祖斯。据色诺芬，后来在黑海沿岸点验时还有八千六百人。

  此后他们沿黑海南岸西行，一路与沿岸城市摩擦不断，一度受雇于色雷斯的塞乌提斯，前 399 年被正在小亚细亚与波斯开战的斯巴达人收编。

  这支军队深入帝国腹地又全身而退，使希腊人相信波斯外强中干。伊索克拉底在《泛希腊集会辞》里就以此为据，主张希腊人联合东征；据阿里安，亚历山大在伊苏斯战前鼓舞士兵时也提到了它。
sources: []
recalled:
  - 色诺芬《长征记》
  - 狄奥多罗斯《历史丛书》卷十四第 19—31 章
  - 伊索克拉底《泛希腊集会辞》145—149
