name: 大王和约
summary: 波斯国王以敕令规定希腊各邦的和平条件，小亚细亚的希腊城邦归波斯，其余各邦自治。
body: |-
  又称“安塔尔基达斯和约”，订于公元前 387 年至前 386 年间，结束了科林斯战争。它是希腊人所说的第一个“共同和约”，即不限于交战双方、对所有城邦都有效的和约。

  斯巴达在克尼多斯海战后失去制海权，雅典则靠波斯的钱重建城墙和舰队，并重新向海外伸展，还支持反叛波斯的塞浦路斯国王欧阿戈拉斯。这使波斯转而愿意与斯巴达讲和。前 388 年斯巴达海军统帅安塔尔基达斯随总督提里巴佐斯到苏萨，取得阿尔塔薛西斯二世的支持，回来后集中斯巴达、波斯和叙拉古的八十多艘战舰封锁赫勒斯滂，切断雅典的粮道。

  提里巴佐斯在萨迪斯召集各邦使节，出示盖有国王印玺的文书并当众宣读。据色诺芬所录，文书说：阿尔塔薛西斯王认为，亚洲的城邦以及克拉佐美奈和塞浦路斯两岛应归他所有；其余的希腊城邦，不论大小，一律自治，只有利姆诺斯、因布罗斯、斯基罗斯照旧属于雅典；哪一方不接受这个和平，他将与愿意接受的各方一道，从陆上和海上、用舰船和金钱向它开战。

  各邦回去商议后在斯巴达宣誓。底比斯想代表全彼奥提亚宣誓，阿格西劳斯以开战相逼，底比斯只得让彼奥提亚各城各自宣誓；科林斯被迫赶走阿尔戈斯的驻军，两邦的合并作废。

  希腊人在一个世纪前的希波战争中为小亚细亚同胞的自由而战，这时由斯巴达出面把他们交还波斯。伊索克拉底等人把这看作耻辱。“自治”条款此后成为斯巴达拆散各地同盟的依据：前 385 年它拆毁曼提尼亚，前 382 年攻打奥林托斯，途中又占了底比斯的卫城。此后几十年希腊人多次重订共同和约，大多以这次的条款为底本。
sources: []
