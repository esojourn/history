name: 采石之战
summary: 1161 年海陵王南侵，虞允文在采石组织宋军击退金军渡江，海陵王随后被杀。
body: |-
  金海陵王完颜亮一心要灭宋。正隆六年（公元 1161 年）他迁都汴京，征发各族军队，分四路南侵：西路攻川陕，中路攻荆襄，海路从山东沿海进攻临安，他自己率主力从寿春渡淮，直指长江。九月金军出发，宋军淮西主将王权一路溃退，刘锜也因病退守长江，两淮大部失陷。

  十一月，金军主力到达和州，准备从对岸的采石渡江。这时王权已被撤职，接任的李显忠还没有到达，江边的宋军群龙无首。奉命到前线犒军的中书舍人虞允文到达采石，召集诸将，以忠义激励他们，部署迎战。金军乘船渡江，宋军以车船、海鳅船冲击，金军船小，许多被撞沉，登岸的金军也被击退。次日宋军又主动出击，在杨林渡口焚毁了金军的船只。

  海陵王只得转往扬州，想从瓜洲渡江。这时东京留守完颜雍已在十月被拥立为帝（金世宗），金军将士厌战，据《金史》，海陵王却严令限期渡江，违者处死。十一月二十七日，完颜元宜等人在瓜洲军营中把海陵王杀死，随后金军北撤。与此同时，宋军在海上击败了金朝的水师，西线也收复了一些州县。

  采石之战粉碎了金朝灭宋的企图，使南宋转危为安。一个文官临危主持战事并获得胜利，当时朝野都很震动，虞允文因此受到重用。次年宋高宗禅位给宋孝宗，孝宗随即着手准备北伐（另见“隆兴北伐”条）。
sources: []
recalled:
  - 《宋史·虞允文传》
  - 《金史·海陵本纪》
  - 杨万里《海鳅赋》
