name: 中国同盟会成立
summary: 1905 年孙中山在东京联合各革命团体，成立中国同盟会。
body: |-
  二十世纪初，在日本的中国留学生越来越多，革命思想在留学生中迅速传播，各地先后出现了许多革命团体：孙中山在 1894 年创立的兴中会，黄兴、宋教仁在 1904 年创立的华兴会，蔡元培、章炳麟、陶成章等人在 1904 年创立的光复会等。邹容的《革命军》、陈天华的《猛回头》《警世钟》等宣传品在国内外广为流传。

  光绪三十一年（1905 年）夏，孙中山从欧洲来到日本，与黄兴等人商议联合各革命团体。八月二十日，中国同盟会在东京赤坂区召开成立大会，推举孙中山为总理，黄兴任执行部庶务。同盟会以“驱除鞑虏，恢复中华，创立民国，平均地权”为纲领，同年十一月创办机关报《民报》，孙中山在发刊词中第一次提出民族、民权、民生三大主义，后来称为“三民主义”。

  同盟会成立后，在国内各省和海外设立分会，会员迅速增加，秋瑾等人都在这一时期加入。《民报》与梁启超主编的《新民丛报》就革命与改良、共和与立宪等问题展开了激烈的论战。同盟会在华南等地组织和支持了多次武装起义，如萍浏醴起义、钦州起义、镇南关起义、河口起义、广州新军起义和黄花岗起义等，虽然都失败了，但扩大了革命的影响。同盟会内部也有矛盾，光复会的一部分人后来另立门户。
