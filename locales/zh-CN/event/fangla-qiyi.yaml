name: 方腊起义
summary: 1120 年睦州青溪人方腊因花石纲之害起兵，攻占杭州等地，次年被童贯率军镇压。
body: |-
  宋徽宗大兴土木，在开封修建宫苑艮岳，派朱勔等人在苏州设立应奉局，搜罗东南的奇花异石，用船队运往京城，称为“花石纲”。据《宋史·朱勔传》，凡是百姓家中有一石一木稍可赏玩的，就派人用黄纸封上，指为御前之物，运走时甚至拆屋破墙，许多人家因此破产。两浙地区还要负担繁重的赋税和采办任务。

  宣和二年（公元 1120 年）十月，睦州青溪人方腊聚众起事，自称“圣公”，建年号永乐。据宋人记载，他的部众中有许多人信奉摩尼教（明教）。起义军先后攻下青溪、睦州、歙州，十二月攻下杭州，处死了一批官吏，各地百姓纷纷响应，据《宋史》，共攻陷六州五十二县。

  这时宋朝正准备联金攻辽，徽宗急忙派童贯率领原定北上的西北精兵南下，同时下令撤销应奉局，罢除花石纲，以安抚民心。宣和三年（1121 年）正月以后，宋军陆续收复杭州、歙州、睦州等地，四月在青溪的帮源洞俘获方腊，八月方腊在开封被处死。余部又坚持了一段时间才被平定。这次起义使宋朝耗费了大量兵力和财力，也推迟了宋军北伐辽朝的时间。起义平定后，青溪县改名淳安，睦州改名严州，朝廷不久又恢复了应奉局。
sources: []
recalled:
  - 《宋史·徽宗本纪》
  - 《宋史·宦者传·童贯》《佞幸传·朱勔》
  - 方勺《青溪寇轨》
  - 《三朝北盟会编》
