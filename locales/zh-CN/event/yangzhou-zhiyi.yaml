name: 扬州之役
summary: 1645 年清军围攻扬州，督师史可法坚守七日后城破殉难，清军在扬州屠城十日。
body: |-
  顺治二年（1645 年）初，清军在陕西击败李自成后，多尔衮命他的弟弟豫亲王多铎率军南下，进攻南明弘光政权。当时弘光朝廷中，马士英、阮大铖专权，驻守武昌的左良玉以“清君侧”为名起兵东下，弘光朝廷把江北的兵力调去防御左良玉，江北防线更加空虚。

  四月，清军进抵扬州。督师大学士史可法据城坚守，向各地求援，江北诸将有的观望，有的已经投降清军。多铎多次派人招降，史可法拒绝。四月二十五日，清军用红衣大炮轰塌城墙，攻入扬州，史可法被俘后不屈而死。

  清军入城后大肆屠杀，持续十天，史称“扬州十日”。幸存者王秀楚写下了《扬州十日记》，记述了屠城的惨状，书中说事后焚化的尸体有八十余万具，这一数字被许多学者认为有夸大，但屠杀的惨烈是可以肯定的。此后清军渡过长江，五月攻占南京，弘光帝出逃后被俘，弘光政权覆亡。

  扬州之役与此后的嘉定屠城等事件，在清代长期被禁止提起。《扬州十日记》在清末被革命党人翻印，成为宣传反清的材料。

  史可法死后，民间长期流传他没有死的说法，一些抗清义军也假托他的名义起兵。扬州的史可法墓祠和梅花岭，后来成为人们凭吊的地方。
sources: []
recalled:
  - 王秀楚《扬州十日记》
  - 《明史·史可法传》
  - 《清世祖实录》
