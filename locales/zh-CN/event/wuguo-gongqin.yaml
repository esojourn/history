name: 五国合纵攻秦
summary: 前 318 年五国合纵攻秦，以楚怀王为纵约长，在函谷关败退。
body: |-
  战国中期，随着秦国日益强大，东方各国之间出现了联合抗秦的“合纵”与秦国拉拢各国、分化合纵的“连横”两种外交路线，游说之士奔走其间，史称“合纵连横”。主张合纵的代表是魏人公孙衍（犀首），主张连横的代表是秦相张仪；《史记》把苏秦写成与张仪同时的合纵领袖，出土帛书显示苏秦的活动年代其实较晚。

  公元前 318 年，在公孙衍等人的推动下，楚、赵、魏、韩、燕五国联合攻秦，推楚怀王为纵约长，联军进抵函谷关。据《史记》，五国各怀心思，相互观望，秦军出关迎击，联军败退。次年秦军又在修鱼大败韩、赵、魏三国军队，斩首八万多人（《史记》数字）。

  这次合纵的失败，暴露了东方各国难以真正团结的弱点。此后秦国利用连横之术，各个击破，先后削弱了魏、楚、韩、赵，合纵虽然屡次组织，但都没有能够阻止秦国东进。

  合纵连横期间，公孙衍还曾发起魏、韩、赵、燕、中山“五国相王”（前 323 年），互相承认为王。孟子的弟子景春称公孙衍、张仪“一怒而诸侯惧，安居而天下熄”，孟子则认为他们行的是“妾妇之道”，算不上大丈夫（《孟子·滕文公下》）。

  函谷关是秦国东方的门户。
sources: []
recalled:
  - 《史记·秦本纪》
  - 《史记·楚世家》
  - 《史记·张仪列传》
  - 《战国策·秦策一》
