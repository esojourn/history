name: 汉中之战
summary: 公元 217 至 219 年，刘备与曹操争夺汉中，刘备获胜后自称汉中王。
body: |-
  汉中夹在秦岭与巴山之间，是关中与益州之间的通道。建安二十年（公元 215 年）曹操亲征，占据汉中三十年的张鲁投降。曹操没有乘势进攻益州，留夏侯渊、张郃等驻守，自己返回北方。

  据《三国志·蜀书·先主传》和《法正传》，建安二十二年，法正向刘备建议夺取汉中，认为这样进可以图谋关中，退可以固守益州。刘备于是率军北上，另派张飞、马超等进攻武都以为牵制。次年双方在阳平关一带相持，曹操也到长安坐镇。

  建安二十四年（219 年）正月，刘备从阳平关南渡沔水，沿山前进，在定军山扎营。夏侯渊率军来争，被刘备的部将黄忠居高临下击败，夏侯渊阵亡。三月，曹操亲率大军从长安经斜谷进入汉中。刘备据险坚守，不与决战，曹军粮运困难，逃亡的士兵日渐增多。五月曹操撤军，退回长安，并迁走了一部分汉中居民。裴松之注引《九州春秋》说，曹操当时用“鸡肋”作口令，杨修由此猜出他要撤兵，成语“食之无味，弃之可惜”出于这个故事。

  刘备占领汉中后，又派兵向东取得上庸等地。同年七月，部下一百二十人联名上表，推他为汉中王，他在沔阳设坛即位，以魏延镇守汉中，自己返回成都。这是刘备势力最盛的时候；同年冬天，关羽在荆州兵败被杀。
sources: []
recalled:
  - 《三国志·蜀书·先主传》
  - 《三国志·蜀书·庞统法正传》《关张马黄赵传》
  - 《三国志·魏书·武帝纪》及裴松之注
