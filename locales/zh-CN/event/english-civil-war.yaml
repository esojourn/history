name: "英国内战"
summary: "查理一世与国会之间的内战，国会军获胜，国王被处死，英国一度成为共和国。"
body: |-
  《历史的轨迹》第三十一章说，伊丽莎白死后四十年间清教徒一直受压；1640 年长期国会召开，长老派清教徒占了多数，处死了最反对清教徒的斯特拉福伯爵和大主教劳德（实际上分别在 1641 年和 1645 年）。国王查理要以叛国罪逮捕下议院五位反对派领袖，下议院拒不交人，国王便离开伦敦，到诺丁汉发动战争。1642 年 8 月他在诺丁汉竖起王旗，内战开始。

  该书说，王党一方是贵族与士绅，称骑士党；国会一方是店员、农夫和少数上层人士，留短发，被讥为圆颅党。战争初期王军占优。克伦威尔组织了全由信徒组成的骑兵，国会照此编成一支二万一千人的军队（新模范军），1645 年在内斯比大败王军，国王被迫投降。据一般记载，1643 年国会与苏格兰订立《神圣盟约》，苏格兰出兵相助，国会则承诺按长老制改革英国教会，威斯敏斯特会议就在这时召开。

  1646 年查理投奔苏格兰军，次年被交给英格兰国会。国会、军队、苏格兰人之间又生分歧，1648 年再起战事，王党失败。该书说国王被判为暴君、卖国贼、谋杀者和公敌，1649 年 1 月 30 日在伦敦被斩首。此后克伦威尔平定爱尔兰和苏格兰，1651 年在伍斯特击败查理二世，战事结束。该书在研讨问题中请读者注意这场战争里宗教和政治因素如何掺杂在一起。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
recalled:
  - "克拉伦登《英国叛乱与内战史》"
