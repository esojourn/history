name: "第一次梵蒂冈会议"
summary: "1869—1870 年的天主教大公会议，宣布教皇正式训导信仰与道德时无误。"
body: |-
  据一般记载，这次会议由教皇庇护九世召集，1869 年 12 月在梵蒂冈圣彼得大殿开幕。当时意大利统一运动正在进行，教皇国的领土已大半失去，教会面对自由主义与理性主义的挑战。会议先通过了论信仰与理性的宪章。

  《历史的轨迹》第三十七章说，在耶稣会的影响下，1870 年的梵蒂冈会议宣布教皇无误，即教皇所说关于教会的话和决定绝无错误；十五世纪以来大公会议高于教皇的主张，至此永被否决。按会议宪章的原文，无误限于教皇以全教会牧者身份正式宣告关于信仰和道德的教义之时，比书中的概括要窄。会议中有一部分主教反对，表决前离开了罗马。

  该书说，这项特权很少被教皇使用，但在 1950 年 11 月帮助教皇庇护十二世宣告马利亚升天为天主教教义。宪章通过的第二天普法战争爆发，法军撤出罗马，9 月意大利军队进城，会议无限期休会。德国等地有一批反对教皇无误的人另组“老天主教会”，与乌得勒支的詹森派教会联合。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十七章“东方教会与罗马教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter41.html"
recalled:
  - "第一次梵蒂冈会议宪章《永恒的牧人》（1870 年）"
