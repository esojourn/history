name: 元嘉北伐
summary: 宋文帝两次出兵想收复河南，都被北魏击败，第二次魏军反攻直抵长江北岸。
body: |-
  刘裕北伐时，晋军收复了黄河以南的大片土地。永初三年（公元 422 年）刘裕去世，北魏乘机南下，夺取了洛阳、虎牢、滑台等地。宋文帝即位后，一直想收复河南。

  元嘉七年（430 年），文帝派到彦之率军北伐。北魏主动撤出黄河以南的洛阳、虎牢、滑台、碻磝四镇，宋军沿黄河南岸布防两千里。到了冬天，河水结冰，魏军渡河反攻，宋军诸镇相继失守。次年檀道济率军救援滑台，与魏军交战三十余次，终因粮尽，滑台失守，檀道济“唱筹量沙”，全军退回。

  元嘉二十七年（450 年），文帝不顾一些大臣的反对，再次大举北伐。宁朔将军王玄谟围攻滑台几个月不能攻克，魏太武帝亲率大军渡河来援，王玄谟大败而逃。魏军分几路南下，太武帝在年底到达长江北岸的瓜步，伐木造筏，扬言要渡江，宋朝都城建康戒严，文帝登上石头城远望，面有忧色。

  次年正月，魏军北撤。途中太武帝围攻盱眙，宋将臧质坚守了一个月，魏军伤亡惨重，只得退去。魏军所过之处烧杀抢掠，据《资治通鉴》，南兖、徐、兖、豫、青、冀六州被杀伤的人不可胜计，村落里春燕回来都只能在林木上筑巢；魏军自己的人马也死伤过半。

  这次战争使刘宋元气大伤，元嘉年间的繁荣从此结束。南宋辛弃疾在《永遇乐·京口北固亭怀古》中写道“元嘉草草，封狼居胥，赢得仓皇北顾”，说的就是这次北伐；词中的“佛狸祠”，是魏太武帝（小字佛狸）在瓜步山上建的行宫，后来成了祠庙。
sources: []
recalled:
  - 《宋书·索虏传》
  - 《魏书·世祖纪》
