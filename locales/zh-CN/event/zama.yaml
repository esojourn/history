name: 扎马会战
summary: 西庇阿在北非击败汉尼拔，战争结束。与垓下之战同年。
body: |-
  公元前 204 年西庇阿在非洲登陆，次年迦太基把汉尼拔从意大利召回。前 202 年，汉尼拔从哈德鲁梅图姆出发，据波利比乌斯，在迦太基以西五日路程的扎马附近扎营；西庇阿的营地在另一处，地名在波利比乌斯的抄本和李维书中写法不同。战场的确切位置至今不能确定，“扎马会战”是沿用下来的名称。据波利比乌斯和李维，两位统帅在战前见过一面，没有谈成。

  汉尼拔把八十多头战象排在阵前，步兵分三线，从意大利带回的老兵放在最后。西庇阿没有按惯例让各中队交错排列，而是前后对齐，留出纵向的通道。战象冲来时，一部分被号角声惊得折回，冲乱了本方骑兵，其余沿通道穿阵而过。努米底亚王马西尼萨和罗马将领莱利乌斯率骑兵击溃对方两翼，追击后折回，从背后攻击汉尼拔的步兵。

  据波利比乌斯，罗马方面阵亡一千五百多人，迦太基方面两万人战死，被俘的人数相近。汉尼拔逃回哈德鲁梅图姆，随后劝迦太基接受和约，第二次布匿战争于次年结束。
sources:
  - 波利比乌斯《历史》卷十五第 5—19 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/15*.html
  - 英文维基百科“Battle of Zama”（核对年份） https://en.wikipedia.org/wiki/Battle_of_Zama
recalled:
  - 李维《罗马史》卷三十第 29—37 章
