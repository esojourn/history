name: 宦官掌神策军
summary: 神策军自 763 年起成为禁军，796 年起由宦官任护军中尉统领，成为定制。
body: |-
  神策军原是哥舒翰在临洮西边设置的边防军。安史之乱中，一部分神策军东调，驻扎在陕州，由宦官鱼朝恩监领。广德元年（公元 763 年）吐蕃攻入长安，唐代宗逃到陕州，鱼朝恩率神策军护驾回京，神策军从此成为驻守京城的禁军（另见“吐蕃攻入长安”条）。大历五年（770 年）鱼朝恩被杀后，神策军一度改由武将统领。

  建中四年（783 年）泾原兵变时，神策军名册上大多是挂名领饷的人，竟无人出来护驾。唐德宗回京后不再信任武将，让随驾的宦官窦文场、霍仙鸣分别统领神策军左右厢，贞元十二年（796 年）正式设左右神策军护军中尉，由二人担任，宦官统领禁军从此成为定制。神策军待遇优厚，据《新唐书·兵志》，人数扩充到十五万，许多边镇的军队也挂名神策军。

  宦官掌握了禁军，权势大增。此后唐朝的皇帝多由宦官拥立，唐宪宗、唐敬宗被宦官杀害，唐文宗谋诛宦官失败（另见“甘露之变”条），朝官称为“南衙”，宦官称为“北司”，南衙常常受制于北司。直到天复三年（903 年）朱温尽杀宦官，宦官专权才告结束。
sources: []
recalled:
  - 《新唐书·兵志》
  - 《旧唐书·宦官传》
  - 《资治通鉴》卷二百三十五
