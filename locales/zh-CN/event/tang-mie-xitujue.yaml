name: 唐灭西突厥
summary: 657 年苏定方击败西突厥的阿史那贺鲁，西突厥灭亡，唐朝设都护府管辖其故地。
body: |-
  隋文帝时突厥分裂为东西两部，西突厥控制了天山以北和今中亚的大片地区，统叶护可汗时最为强盛，玄奘西行时曾得到他的护送。此后西突厥内乱不断，分裂为两派相互攻战。

  阿史那贺鲁原本是西突厥的贵族，贞观二十二年（公元 648 年）率部归附唐朝，被安置在庭州一带。太宗去世后，他在永徽二年（651 年）起兵叛唐，自称沙钵罗可汗，统一了西突厥十姓部落，屡次进犯唐朝的庭州等地。唐朝几次出兵讨伐都没有成功。

  显庆二年（657 年），高宗以苏定方为伊丽道行军大总管，率军讨伐阿史那贺鲁，同时派归附唐朝的西突厥贵族阿史那弥射、阿史那步真从南路招抚旧部。据《资治通鉴》，苏定方率唐兵和回纥兵一万余人，在曳咥河以西遇到阿史那贺鲁的十万大军，苏定方让步兵在原上布阵，长矛向外，亲率骑兵在北原列阵，突厥骑兵三次冲击步兵阵都没有冲动，苏定方乘势反击，大破敌军。随后唐军冒着大雪追击，阿史那贺鲁逃到石国（今塔什干一带），被石国人擒送唐军，次年押到长安。

  唐朝随即在西突厥故地设立昆陵、濛池两个都护府，分别以阿史那弥射、阿史那步真为都护，统辖十姓部落，又把安西都护府迁到龟兹，管辖天山南北，唐朝在西域的势力达到顶点。此后西突厥的余部和吐蕃不断争夺这一地区，唐朝的控制时强时弱。
sources: []
recalled:
  - 《旧唐书·突厥传》
  - 《旧唐书·苏定方传》
  - 《资治通鉴》卷二百至二百一
