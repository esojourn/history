name: 南唐建立
summary: 937 年徐知诰受吴禅让，在金陵称帝；939 年复姓李，改国号唐，史称南唐。
body: |-
  吴国是杨行密奠定的政权，据有江淮之间和今江西一带。杨行密死后，大权落入权臣徐温手中，徐温死后又由他的养子徐知诰掌握。徐知诰长期执政，宽仁节俭，减轻赋税，得到江南士民的拥护。他仿照徐温的做法出镇金陵，以金陵为根据地，逐步做好了取代吴国的准备。

  天福二年（公元 937 年）十月，吴帝杨溥把帝位禅让给徐知诰，徐知诰在金陵即皇帝位，国号齐。天福四年（939 年），他恢复本姓李，改名李昪，改国号为唐，史称南唐，自称是唐朝皇室的后代。杨溥被迁往润州居住，次年去世。

  南唐据有今江苏、安徽的淮河以南部分以及江西全境和湖北东部，人口众多，物产丰富。李昪在位期间注重保境安民，兴修水利，鼓励农桑，招纳北方南下的士人，南唐的经济和文化在十国中最为发达。中主李璟时，南唐先后出兵灭了闽国和楚国，疆域一度扩大，但所得不多，消耗却很大（另见“南唐灭闽楚”条）。

  显德五年（958 年），南唐在后周的进攻下失去长江以北的全部土地，国势大衰（另见“周世宗征淮南”条）。后主李煜时，南唐向北宋称臣。开宝八年（975 年）宋军攻破金陵，李煜投降，南唐灭亡，共三主三十九年。南唐在文学艺术上成就很高，李璟、李煜、冯延巳的词，董源、巨然、徐熙的画，澄心堂纸、李廷珪墨等都很有名，对宋代文化影响深远。
sources: []
