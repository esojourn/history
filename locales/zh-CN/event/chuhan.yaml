name: 楚汉相争
summary: 汉王刘邦与西楚霸王项羽争夺天下，历时四年有余，以项羽败亡告终。
body: |-
  秦亡后，项羽分封诸侯，自立为西楚霸王，都彭城，把先入关中的刘邦封到巴、蜀、汉中，又立秦的三名降将为王，分据关中以阻挡他。汉元年（公元前 206 年）四月诸侯各自就国；同年田荣在齐地起兵反楚，项羽北上攻齐。八月，刘邦用韩信之计从故道出陈仓，还定三秦。

  汉二年春，刘邦率诸侯军东进，《史记·项羽本纪》称有五十六万人，攻入彭城。项羽以精兵三万回击，汉军大败，被挤入睢水而死的就有十余万人。刘邦退守荥阳、成皋，靠萧何从关中输送兵员粮食，与楚军在这一线相持两年多，其间荥阳、成皋一度失守，他本人数次只身逃脱。另一面，韩信领兵北上，接连攻取魏、代、赵，迫降燕，汉四年平定齐地；彭越在梁地往来袭扰，断绝楚军粮道；刘邦又用陈平之计离间项羽与范增。楚军兵疲粮少，两面受敌。

  汉四年（前 203 年），双方约定中分天下，以鸿沟为界，西属汉，东属楚。项羽引兵东归，刘邦听从张良、陈平的意见随即追击，在固陵一度失利，于是许给韩信、彭越封地，两人率军来会。汉五年十二月（前 202 年初）汉军围项羽于垓下，项羽突围至乌江自刎。同年二月刘邦即皇帝位。
