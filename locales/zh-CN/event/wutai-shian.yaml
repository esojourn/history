name: 乌台诗案
summary: 1079 年御史弹劾苏轼诗文讥讽新法，将他逮捕入御史台狱，最后贬为黄州团练副使。
body: |-
  元丰二年（公元 1079 年）苏轼由徐州调任湖州知州，按惯例写了《湖州谢上表》，其中有“知其生不逢时，难以追陪新进；察其老不生事，或能牧养小民”等句子。御史何正臣、舒亶和御史中丞李定等人抓住这些话，又从苏轼刊行的诗集中摘出一些诗句，指控他讥讽朝政、诽谤新法，对皇帝不敬。

  这年七月，朝廷派人到湖州逮捕苏轼，押到开封，关进御史台的监狱。御史台中种有柏树，常有乌鸦栖息，因此又称“乌台”，这一案件也就被称为“乌台诗案”。审讯持续了四个多月，苏轼被迫承认许多诗句有讽刺之意。他一度以为自己必死，在狱中写诗给弟弟苏辙诀别。

  苏辙上书请求以自己的官职为兄赎罪；据宋人记载，神宗的祖母曹太皇太后病中也为苏轼说情，已经退居江宁的王安石也说过“安有圣世而杀才士乎”之类的话。这年十二月案件了结，苏轼被贬为黄州团练副使，本州安置，不得签书公事。苏辙被贬为监筠州盐酒税，与苏轼有诗文往来的司马光、王诜、黄庭坚等二十多人也受到罚铜、贬官等处分。

  乌台诗案是宋代因诗文获罪的著名案件。苏轼在黄州的几年间生活清苦，思想和创作却进入了新的境界，写下了前、后《赤壁赋》等名作（另见“苏轼”条）。南宋人朋九万辑录了这一案件的供词和相关文书，编成《东坡乌台诗案》。
sources: []
recalled:
  - 朋九万《东坡乌台诗案》
  - 《宋史·苏轼传》
