name: "日内瓦改教"
summary: "1536 年日内瓦表决改教，加尔文一度被逐，1541 年回城订立教会宪章。"
body: |-
  日内瓦原由主教和萨伏依公爵管辖。十六世纪二十年代市民与伯尔尼结盟，赶走了公爵的势力，主教也在 1533 年离城不归。伯尔尼已经改教，支持法雷尔来讲道。《历史的轨迹》第二十四章说，经过法雷尔几个月激烈的讲道，城里的风向转了：1535 年夏他占用了抹大拉教堂和圣彼得座堂，图像被捣毁，弥撒停止，修士修女被逐；1536 年 5 月 21 日全体公民表决，改教的信仰成为日内瓦的信仰。

  同年夏天加尔文路过，被法雷尔留下。两人向市议会提出三项建议：每月举行圣餐，行为不检的人要受管教，严重的不准领餐；采用加尔文写的教理问答；每个市民都要宣誓接受一份信仰告白。该书说，第一项是要使教会在管教信徒的事上不受官府支配。反对的人在选举中得势，决定改用伯尔尼的礼仪。两人不反对那些礼仪本身，只是不肯由官府不经教会同意就下令，复活节拒绝主持圣餐，1538 年 4 月 23 日被限三天离境。

  此后三年日内瓦陷于纷争。枢机萨多雷托写信劝日内瓦人回归罗马教会，城里无人能答，在斯特拉斯堡的加尔文写了《答萨多雷托书》。该书说，驱逐他的一派 1539 年与伯尔尼订约，损害了日内瓦的自主，次年被推翻，新政府请加尔文回来。

  1541 年 9 月 13 日加尔文回到日内瓦，两个月后议会通过他起草的《教会宪章》：教会设牧师、教师、长老、执事四职，牧师每周聚会查经，长老十二人由议会从议员中选出，与牧师组成教会法庭，每周开会处理信徒的信仰和品行。开除教籍的权柄归教会法庭还是归议会，条文含糊，争了十四年；1555 年加尔文的反对派失败出逃，这项权柄才确定归教会。

  该书说，日内瓦的教会成了法国胡格诺教会、荷兰改革宗教会和苏格兰长老教会的榜样。1559 年日内瓦学院开办，各国来求学的人把这套办法带回本国。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十四章“瑞士的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter27.html"
