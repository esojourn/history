name: 马其顿战争
summary: 罗马与马其顿的四次战争，结果是安提柯王朝覆灭，马其顿成为行省。
body: |-
  第一次（公元前 214 年至前 205 年）。坎尼会战后，马其顿国王腓力五世以为罗马将亡，前 215 年与汉尼拔订立盟约，想夺取罗马在亚得里亚海东岸伊利里亚的据点。罗马正全力对付迦太基，只派少量兵力渡海，前 211 年与腓力的宿敌埃托利亚同盟结盟，帕加马的阿塔罗斯一世也加入，由希腊人去牵制他。战事没有大的会战。埃托利亚人先单独讲和，前 205 年罗马与腓力在腓尼刻议和，各守现状。

  第二次（前 200 年至前 197 年）。腓力转向爱琴海扩张，与罗得岛和帕加马交战，两国向罗马求援。罗马刚打完汉尼拔，元老院仍促成了宣战。头两年罗马军从西面进不去马其顿。前 198 年执政官弗拉米尼努斯接任，把亚该亚同盟等拉到罗马一方，前 197 年在色萨利的库诺斯克法莱击败腓力：马其顿方阵在起伏的山地上队形不整，被罗马军团从侧后攻破。腓力退出希腊，赔款，交出舰队。前 196 年弗拉米尼努斯在科林斯地峡宣布希腊人自由。

  第三次（前 171 年至前 168 年）。腓力之子珀尔修斯继位后整顿国力，交好希腊各邦，引起罗马疑忌，帕加马国王欧迈尼斯二世到元老院控告他。战争头三年罗马将领无所作为。前 168 年执政官埃米利乌斯·保卢斯在彼得那一战击溃马其顿军，一小时左右就分出胜负，珀尔修斯后来被俘，死在意大利。罗马废除马其顿王国，把它分成四个互不往来的共和国。清算随之而来：伊庇鲁斯有七十座城镇遭洗劫，据波利比乌斯，十五万人被卖为奴；亚该亚同盟的一千名显要被押往意大利作人质，其中有后来的史家波利比乌斯。

  第四次（前 150 年至前 148 年）。一个名叫安德里斯库斯的人自称珀尔修斯之子，在马其顿被拥立为王，击败了一支罗马军队。前 148 年他被梅特卢斯击败俘获。罗马此后在马其顿设立行省，派总督常驻。两年后亚该亚同盟与罗马开战，科林斯被毁。

  这几次战争中，马其顿方阵对罗马军团的得失，波利比乌斯作过一段有名的比较：方阵在平地正面无可抵挡，却离不开合适的地形和完整的队形，军团则能分能合、随处可战。
sources: []
