name: 宋四大书编纂
summary: 宋太宗、真宗时官修《太平御览》《太平广记》《文苑英华》《册府元龟》四部大书。
body: |-
  宋太宗即位后不久，就命翰林学士李昉等人编纂大型类书。太平兴国二年（公元 977 年）开始编修的《太平御览》，分五十五部，引用古书一千多种，太平兴国八年（983 年）编成，共一千卷，据说太宗每天读三卷，一年读完，因此得名“御览”。同时编成的《太平广记》五百卷，专门收录汉代至宋初的小说、笔记和野史，许多已经失传的古小说靠它才得以保存。太平兴国七年（982 年）起编修的《文苑英华》一千卷，收录南朝梁末至唐五代的诗文，用来接续《昭明文选》。

  宋真宗景德二年（1005 年），又命王钦若、杨亿等人编纂《册府元龟》，大中祥符六年（1013 年）编成，共一千卷，按人事分门，汇集历代君臣事迹，史料多采自正史和实录。这四部书后人合称“宋四大书”，卷数都以各书的通行本为据。编书一方面是为了整理五代战乱后散乱的典籍，另一方面也有人认为，是为了安置南唐、吴越等国归降的文人。
sources: []
recalled:
  - 《宋史·艺文志》
  - 《玉海》卷五十四
  - 《续资治通鉴长编》卷十八、八十一
