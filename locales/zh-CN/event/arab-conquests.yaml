name: 阿拉伯人的征服
aliases:
  - 伊斯兰的扩张
  - 回教徒的征伐
summary: 穆罕默德死后一百年间，阿拉伯人夺取叙利亚、埃及、北非和西班牙。
body: |-
  公元 632 年穆罕默德去世时，阿拉伯半岛已大体归于伊斯兰。此前东罗马帝国与波斯打了二十多年的仗，皇帝赫拉克留虽在 627 年取胜，两国都已精疲力竭。《历史的轨迹》第八章说，太平的日子十分短暂，灾祸又临到东罗马。

  头几任哈里发在位时，阿拉伯军队同时向北、向东进攻。636 年他们在雅穆克河击溃东罗马军，叙利亚易手；638 年耶路撒冷主教长开城投降；639 至 642 年埃及被占，亚历山大陷落。波斯的萨珊王朝在 651 年灭亡。此后他们沿北非西进，698 年攻下迦太基，711 年渡过直布罗陀海峡，几年内占领西班牙大部，又越过比利牛斯山进入高卢，732 年在图尔与普瓦捷之间被法兰克人击退。在东面他们到达印度河流域。君士坦丁堡在 674 至 678 年、717 至 718 年两次被围，都守住了。《历史的轨迹》说他们“贯穿印度，弭平罗马帝国的小亚细亚省”；阿拉伯人当时只到了印度的西北边缘，对小亚细亚年年侵扰，却没有占住。

  被征服地方的基督徒和犹太人可以保留信仰和教堂，但要另缴人头税，不得向穆斯林传教，地位低于穆斯林。此后几百年间，改信伊斯兰教的人越来越多。《历史的轨迹》历数教会失去的地方：耶路撒冷，安提阿，亚历山大，迦太基和希坡，都是早期教会的中心。北非的教会后来完全消失；叙利亚和埃及的教会留存至今，人数成了少数。

  该书分析失败的原因：帝国的基督徒安于文明生活，许多人进了修道院；东方教会大部分已流于形式，又因教义的争论彼此为敌，一些受帝国逼迫的基督徒团体反而因阿拉伯人到来而松了一口气。第十章指出另一个后果：安提阿、耶路撒冷、亚历山大和迦太基沦陷之后，罗马主教在教会里少了几个可以相比的对手。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第八章“教会丧失领域” https://wellsofgrace.com/books/spiritual/2000years/html/chapter10.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十章“教皇权势的发展” https://wellsofgrace.com/books/spiritual/2000years/html/chapter12.html"
