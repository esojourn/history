name: 第一届奥林匹亚竞技会
summary: 传统上定在公元前 776 年，后来希腊人以四年一届的竞技会纪年。
body: |-
  奥林匹亚在伯罗奔尼撒半岛西部的厄利斯境内，是宙斯的圣地。每四年在这里举行一次祭祀宙斯的竞技会。公元前 400 年前后，厄利斯人希庇亚斯编出了历届优胜者的名录，把第一届定在相当于前 776 年的那一年，优胜者是厄利斯人科罗伊波斯，据说是个厨子，赢的是唯一的项目：一个跑道长度（约一百九十二米）的短跑。这份名录的早期部分是否可靠，古代的普鲁塔克就表示过怀疑。圣地里的祭祀活动可以上溯到更早，而从出土的器物看，有各地的人大量前来参赛可能要晚到前 700 年前后。

  据传统的说法，此后逐渐增设了往返跑、长跑、五项全能、摔跤、拳击、四马赛车、赛马和搏击等项目。参赛的只限自由身份的希腊男子，运动员裸体比赛。优胜者的奖品只是一顶野橄榄枝编的冠，但回到本城会得到重赏和终身的荣誉。竞技会期间，各邦要保证前往奥林匹亚的人安全通行，称为“神圣休战”；这并不意味着各地的战争都要停止。

  从公元前 3 世纪起，史家提迈奥斯和埃拉托色尼用“第几届奥林匹亚竞技会的第几年”来统一各邦互不相同的纪年，这成为希腊人通用的纪年方法。竞技会一直举行到罗马帝国晚期，一般认为是在公元 4 世纪末皇帝狄奥多西禁止异教祭祀之后停办的。1896 年第一届现代奥林匹克运动会在雅典举行。
sources: []
recalled:
  - 保萨尼阿斯《希腊志》卷五第 7—9 章
  - 普鲁塔克《努马传》第 1 章
  - 优西比乌《编年史》所录优胜者名表
