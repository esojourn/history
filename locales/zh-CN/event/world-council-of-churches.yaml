name: "普世基督教协会成立"
summary: "1948 年在阿姆斯特丹成立的复原教与东正教教会联合组织，是普世合一运动的中心。"
body: |-
  《历史的轨迹》第四十九章说，复原教在合一上最大的工作就是普世基督教协会的成立。它源于 1910 年爱丁堡的国际宣教会议，以及会后的“生活与工作”和“信仰与教制”两个运动；1937 年两个运动分别开会时，提出为合一成立新组织，结果是 1948 年成立的普世基督教协会，宗旨是把两个会议所决定的事付诸实行，并在全世界的事工上促进教会合一。

  书中说，第一次大会 1948 年在阿姆斯特丹举行，有来自四十四个国家、一百四十七个教会的三百五十一位代表；第二次 1954 年在伊利诺伊的埃文斯顿，第三次 1961 年在新德里，第四次 1968 年在瑞典乌普萨拉，第五次 1975 年在内罗毕。该书认为它的确为普世教会合一而努力，但也有不少教会退出；一些正统派教会担心它越来越趋向自由派，或变成不强调圣经真理的超教会组织，所以不申请加入。

  据一般记载，东正教各教会多在 1961 年新德里大会前后加入普世教协，罗马天主教不是会员，但派观察员与之合作。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十九章“教会联盟与联合” https://wellsofgrace.com/books/spiritual/2000years/html/chapter54.html"
