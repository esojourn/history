name: 后汉建立
summary: 947 年刘知远在太原称帝，随后南下开封，改国号汉，史称后汉。
body: |-
  开运三年（公元 946 年）底契丹攻入开封，后晋灭亡。当时镇守太原的河东节度使刘知远兵力完整，他一面派人向契丹皇帝耶律德光奉表称贺，一面加强戒备，观察局势。契丹在中原的抢掠激起了各地的反抗，刘知远的部下纷纷劝他称帝。

  天福十二年（947 年）二月，刘知远在太原即皇帝位。他没有另建年号，而是继续使用后晋高祖的天福年号，以表示自己是后晋的继承者，同时宣布免除契丹强征的钱帛，号召各地反抗契丹。各地的节度使和起兵反抗契丹的人纷纷响应。

  同年四月耶律德光北撤途中病死，契丹留守开封的将领扶立后唐明宗的儿子李从益主持政务，随后也撤走了。刘知远以史弘肇为先锋率军南下，五月进入洛阳，六月进入开封，改国号为汉，史称后汉。

  后汉建立后，刘知远任用杨邠、郭威、史弘肇、王章、苏逢吉等人。乾祐元年（948 年）正月刘知远去世，儿子刘承祐继位，大臣之间矛盾日深。乾祐三年（950 年）底，刘承祐诛杀大臣，郭威起兵，刘承祐被杀，后汉灭亡（另见“郭威代汉”条）。后汉前后只有四年，是五代中最短的朝代；刘知远的弟弟刘崇此后在太原建立的北汉，则又延续了近三十年（另见“北汉建立”条）。
sources: []
recalled:
  - 《旧五代史·汉书·高祖纪》
  - 《新五代史·汉本纪·高祖》
