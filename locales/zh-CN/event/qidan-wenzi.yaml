name: 契丹文字创制
summary: 920 年契丹参照汉字创制契丹大字，此后又创制了拼音性质的契丹小字。
body: |-
  契丹原来没有文字。据《辽史》，神册五年（公元 920 年），耶律阿保机命耶律突吕不、耶律鲁不古等人参照汉字创制契丹文字，同年颁行，后人称为“契丹大字”。契丹大字是一种表意文字，字形与汉字相近，有的直接借用汉字，有的增减笔画而成。

  此后，阿保机的弟弟耶律迭剌受回鹘文字的启发，又创制了一种拼音性质的文字，用较少的字符拼写契丹语，后人称为“契丹小字”。契丹小字创制的确切年代史书没有记载，一般认为在 920 年代。

  契丹文字在辽朝通行了两百多年，用于官方文书、碑刻和墓志，金朝前期仍在使用，到金章宗时才被废止。由于传世的契丹文资料很少，长期以来没有人能读懂。二十世纪以来，随着辽代帝后哀册等石刻陆续出土，学者们逐步释读出部分契丹小字，契丹大字的释读进展较慢，至今仍有大量文字未能解读。
sources: []
recalled:
  - 《辽史·太祖本纪》
  - 《辽史·皇子表》
