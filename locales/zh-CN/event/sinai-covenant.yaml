name: 西奈立约
summary: 以色列人在西奈山下与神立约，领受十诫和律法，建造会幕。
body: |-
  据《出埃及记》19:1，以色列人出埃及后第三个月到了西奈的旷野，在山下安营。神从山上呼唤摩西，叫他告诉百姓：他们若听从神的话，遵守神的约，就要在万民中作属神的子民，归神作祭司的国度，为圣洁的国民（19:3–6）。百姓都答应遵行。到第三天早晨，山上有雷轰、闪电和密云，角声甚大，全山冒烟，百姓都在营中发颤（19:16–18）。

  神在山上颁布了十诫（20:1–17；《申命记》第 5 章重述），接着是一组关于祭坛、奴仆、赔偿、节期等事的律例，通称“约书”（20:22–23:33）。摩西把这些话写下来，在山下筑坛，念给百姓听，百姓说凡耶和华所吩咐的都必遵行；摩西把祭牲的血洒在百姓身上，称为立约的血（24:3–8）。随后摩西上山四十昼夜（24:18），领受建造会幕、设立祭司的各样指示，以及神用指头写的两块石版（第 25—31 章）。

  摩西迟迟不下山，百姓要亚伦造神像，亚伦铸了一只金牛犊。摩西下山看见，把两块法版摔碎在山下，把牛犊焚烧磨碎；利未的子孙奉命在营中杀戮，据 32:28，那一天百姓中被杀的约有三千人。摩西为百姓代求，又凿出两块石版上山，再得诫命，约得以重立（第 32—34 章）。

  此后百姓照所指示的样式造了会幕和约柜。据 40:17，会幕在第二年正月初一日立起来。《利未记》所载的献祭和洁净的条例，按书中所说也是在西奈颁布的；《民数记》第 1 章记在这里数点了各支派的人数。第二年二月二十日，云彩从会幕上收上去，以色列人起行离开西奈（《民数记》10:11–12），前后在山下住了将近一年。

  西奈所立的约和律法此后成为以色列信仰与生活的根基，先知书常以它责备百姓背约。犹太传统以七七节（五旬节）记念颁布律法。西奈山的位置圣经没有给出可以确定的说明，传统认为是西奈半岛南部的穆萨山，另有多种说法。
sources: []
