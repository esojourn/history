name: 米兰诏谕
aliases:
  - 米兰敕令
summary: 公元 313 年君士坦丁与李锡尼约定给基督徒和所有人信仰自由，归还教会产业。
body: |-
  公元 313 年 2 月，西部的皇帝君士坦丁与东部的皇帝李锡尼在米兰会面，李锡尼在这里娶了君士坦丁的妹妹。两人商定了对待基督徒的办法。会后李锡尼回东方击败了仍在逼迫教会的马克西米努，6 月 13 日在尼哥米底亚张贴了一封给行省长官的通令，原文保存在拉克坦提乌斯的书里，优西比乌的《教会史》里有希腊文译本。后世所说的“米兰诏谕”就是这份文件；在米兰当地是否发布过一道正式的诏令，没有记载。

  通令说，皇帝决定“给基督徒和所有的人自由，各人随自己的意愿信奉宗教”，好让天上的神明对皇帝和臣民都施恩。此前针对基督徒的种种限制一概取消。基督徒从前聚会的地方，无论已被国库没收还是转卖给私人，都要立即无偿归还，买主的损失由国库补偿；教会团体名下的其他产业也照此办理。

  《历史的轨迹》第四章指出，这道诏谕并没有把基督教定为国教，也没有禁止异教，但它远远超过 311 年加利流的宽容：逼迫停止了，基督徒在法律面前与其他宗教的信徒地位平等。把基督教定为国教是六十多年后狄奥多西皇帝的事。

  《历史的轨迹》把公元 313 年看作教会历史的一个转折点，并从两面来评价。一面，教会在三百年的逼迫之后得了自由，书中称教会的得胜是一个奇迹。另一面，作基督徒从此有利可图，成千上万的人涌进教会，许多只是挂名的信徒；皇帝给教会好处，也要过问教会的事，政教关系的种种纠葛由此开始。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四章“教会全面得胜” https://wellsofgrace.com/books/spiritual/2000years/html/chapter05.html"
recalled:
  - 拉克坦提乌斯《论迫害者之死》第 48 章
  - 优西比乌《教会史》卷 10 第 5 章
