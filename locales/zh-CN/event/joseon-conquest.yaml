name: 汉灭卫氏朝鲜
summary: 汉武帝派水陆两军进攻卫氏朝鲜，围王险城近一年，朝鲜大臣杀王投降，汉在其地设四郡。
body: |-
  卫氏朝鲜由燕人卫满在汉初建立，都王险城。卫满曾与汉朝的辽东太守约定做汉的外臣，约束塞外各部族，不阻拦他们与汉往来。据《史记·朝鲜列传》，传到他的孙子右渠时，朝鲜招引的汉地逃亡者越来越多，右渠从不入朝，邻近的小国想上书朝见汉天子，也被他阻隔。

  元封二年（公元前 109 年），武帝派涉何前去责备右渠，右渠不肯奉诏。涉何返回到边界时，让人刺死了护送他的朝鲜裨王，然后渡河回报说杀了朝鲜的将领。武帝任命他为辽东东部都尉；朝鲜怨恨他，发兵袭击，把他杀死。武帝于是招募罪人组成军队，当年秋天派楼船将军杨仆从齐地渡渤海，左将军荀彘从辽东陆路进攻。

  战事并不顺利。杨仆的先头部队先到王险城下，因人少被击溃；荀彘在浿水一带也受阻。武帝派使者招降，右渠一度同意，后因双方互相猜疑而破裂。两军合围王险城后数月不能攻下：荀彘急于强攻，杨仆则想约降，两位将军互不配合。武帝派济南太守公孙遂前去处置，公孙遂听信荀彘的话，逮捕杨仆，把两军合并。

  元封三年（前 108 年）夏，朝鲜的几位大臣先后出降，其中一人派人杀死右渠；城中仍有大臣据守，最后由右渠的儿子和降臣劝谕民众，杀死守将，王险城才陷落。汉朝在朝鲜故地设乐浪、临屯、玄菟、真番四郡。战后公孙遂被处死，荀彘因争功和违背计划被处死，杨仆被贬为平民。四郡中真番、临屯两郡在昭帝时撤并，乐浪郡则延续了四百多年。
sources: []
recalled:
  - 《史记·朝鲜列传》
  - 《汉书·西南夷两粤朝鲜传》
