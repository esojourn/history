name: 和珅之死
summary: 1799 年乾隆帝去世后，嘉庆帝随即逮捕和珅，赐其自尽。
body: |-
  和珅在乾隆后期权势极盛，嘉庆帝即位后，乾隆帝以太上皇的身份继续掌权，和珅仍然把持朝政，嘉庆帝对他隐忍不发，据说表面上还对他十分客气。

  嘉庆四年（1799 年）正月初三，八十九岁的乾隆帝去世。嘉庆帝当天就命和珅与福长安在殡殿值班守灵，不许出入。初八，嘉庆帝根据王念孙等人的弹劾，下令革去和珅的职务，交刑部审讯。正月十一日，嘉庆帝宣布和珅二十条大罪，包括在册立太子前泄露机密、骑马直入圆明园、私盖楠木房屋、仿照宁寿宫的式样修建府邸、隐匿军报等。正月十八日，嘉庆帝念他曾任首辅大臣，免于公开处决，赐他在狱中自尽。

  和珅的家产被查抄，宅第后来赐给了庆郡王永璘，即今天北京的恭王府一带。关于和珅家产的数额，流传有“八亿两”等说法，多出于野史，档案中的抄家清单只记录了一部分财产，具体数目难以确定。嘉庆帝对和珅的党羽没有大规模追究，以免牵连太广。民间流传“和珅跌倒，嘉庆吃饱”的说法。和珅之死标志着嘉庆帝真正掌握了政权，但清朝吏治腐败的积弊并没有因此改变。
sources: []
recalled:
  - 《清仁宗实录》
  - 《清史稿·和珅传》
  - 薛福成《庸庵笔记》
