name: 天书封禅
summary: 1008 年宋真宗宣称天降“天书”，改元大中祥符，随后东封泰山。
body: |-
  澶渊之盟以后，王钦若对宋真宗说，这是城下之盟，只有封禅泰山，才能“镇服四海，夸示外国”，而封禅需要有天降祥瑞，祥瑞可以人为制造。大中祥符元年（公元 1008 年）正月，真宗对大臣说，自己梦见神人告知将降下天书，随后左承天门上发现了一条黄帛，被称为“天书”，朝廷于是改元大中祥符。四月泰山又报告降下天书。同年十月，真宗率百官到泰山举行封禅大典。

  此后真宗又在大中祥符四年（1011 年）到汾阴祭祀后土，大建玉清昭应宫等宫观，各地争相进献芝草、嘉禾等祥瑞，王钦若、丁谓等人因此受到重用。这些活动耗费了大量钱财，宋仁宗时玉清昭应宫毁于大火，没有重建；天书在真宗去世后随葬永定陵。后世史家对天书封禅大多持批评态度，认为是自欺欺人。
sources: []
recalled:
  - 《宋史·真宗本纪》
  - 《宋史·王钦若传》
  - 《续资治通鉴长编》卷六十七至七十
