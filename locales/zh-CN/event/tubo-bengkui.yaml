name: 吐蕃王朝崩溃
summary: 842 年前后赞普朗达玛被杀，王室分裂，各地混战，统一的吐蕃王朝瓦解。
body: |-
  赤祖德赞在位时大力扶持佛教，大约在 838 年被大臣杀害，他的哥哥朗达玛（汉文史书称达磨）继位。据后世的藏文史籍，朗达玛下令禁止佛教，封闭寺院，强迫僧人还俗。大约在 842 年，朗达玛被一位名叫拉隆·贝吉多吉的僧人射杀；汉文史料和藏文史料关于他在位的年代和被杀的经过记载不尽相同。

  朗达玛死后，他的两个妃子各自拥立一个儿子，分别称为云丹和欧松，双方各有大臣支持，互相攻战，王室从此分裂。在吐蕃东部边境，大将论恐热与尚婢婢长期混战，河西、陇右的吐蕃统治也随之瓦解。大中三年（849 年）唐朝收复了秦、原、安乐三州和七关；大中二年（848 年）沙州的张议潮起事，逐步收复了河西各州（另见“张议潮与归义军”条）。九世纪后期，吐蕃本土又发生了平民和奴隶的大规模起事。

  此后青藏高原进入长期分裂的时期，各地由王室后裔和地方贵族分别统治，佛教在十世纪后期以后才重新兴盛，后世称为“后弘期”。
sources: []
recalled:
  - 《新唐书·吐蕃传》
  - 《资治通鉴》卷二百四十六至二百四十九
  - 《贤者喜宴》
