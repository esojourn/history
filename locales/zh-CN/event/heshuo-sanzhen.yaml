name: 河朔三镇
summary: 安史降将分领魏博、成德、幽州三镇，此后长期割据，直到唐亡。
body: |-
  宝应元年（公元 762 年）冬唐军收复洛阳后，史朝义向北逃窜，他的部将纷纷投降。为了尽快结束战争，主持河北战事的仆固怀恩奏请让这些降将继续统领原来的地盘，朝廷同意了。广德元年（763 年）史朝义自缢，安史之乱结束，田承嗣被任命为魏博节度使，李怀仙为幽州（卢龙）节度使，李宝臣（原名张忠志）为成德节度使，合称“河朔三镇”。

  三镇名义上服从朝廷，实际上各自为政：节度使自行任命辖区内的官吏，赋税不上交朝廷，户口不报户部；节度使死后，由儿子或部将接任，朝廷只能事后追认。田承嗣在魏博把强壮男子都编入军队，又挑选精锐作为亲兵，称为牙兵，以后历任节度使都依靠牙兵，牙兵也常常驱逐甚至杀死不合心意的节度使。三镇之间又互相联姻、互相援助，共同对抗朝廷。

  建中二年（781 年）唐德宗拒绝让成德的李惟岳承袭父职，引发三镇和淄青、淮西等藩镇的联合叛乱，次年幽州的朱滔、魏博的田悦、成德的王武俊、淄青的李纳同时称王，朝廷被迫妥协（另见“泾原兵变”条）。唐宪宗时三镇一度归顺朝廷（另见“元和中兴”条），但长庆元年（821 年）幽州、成德相继兵变，河朔又恢复割据，一直延续到唐朝灭亡。

  除河朔三镇外，淄青、淮西、泽潞等地的藩镇也时常对抗朝廷，后世把这一局面称为“藩镇割据”，认为它是唐朝后期衰弱的主要原因之一；但也有学者指出，大多数藩镇，特别是江淮和关中的藩镇，仍然服从朝廷，向朝廷输送赋税。
sources: []
recalled:
  - 《新唐书·藩镇传》
  - 《旧唐书·田承嗣传》
  - 《资治通鉴》卷二百二十二至二百四十二
