name: 奥勒良重新统一帝国
summary: 公元 272 至 274 年奥勒良先后收复帕尔米拉控制的东方和自立的高卢。
body: |-
  公元 270 年奥勒良即位时，罗马帝国分成三块已有十年：西边的高卢、不列颠另有一位皇帝，东边从小亚细亚到埃及都在帕尔米拉女王泽诺比娅手里。他先用一年多击退侵入意大利的部族，稳住多瑙河，然后腾出手来。

  272 年他率军东进。小亚细亚各城大多不战而降。《罗马帝王纪》记，他在提亚纳城外发怒说破城后连一条狗也不留，进城后却不许士兵抢掠，只叫人把狗杀光。在安条克以东的伊梅，他命轻骑兵佯败，引帕尔米拉的铁甲骑兵在烈日下追到人困马乏再回头攻击；在埃梅萨城外，他再次击败帕尔米拉军。他带兵穿过沙漠围攻帕尔米拉。泽诺比娅出城向波斯求援，在幼发拉底河边被擒，城随即投降。奥勒良把她和她的儿子带走，处死了她的几位谋臣。

  他回师走到多瑙河边，得到消息，帕尔米拉人杀了留守的六百名弓箭手，另立君主。273 年他折回去，这一次纵兵洗劫，拆毁城墙，这座靠商队贸易兴起的沙漠城市从此衰落。接着他又到埃及平定了一起响应的叛乱。

  274 年他转向西方。高卢的皇帝泰特里库斯是被军队硬推上去的文官，处境艰难。两军在马恩河畔的沙隆相遇，泰特里库斯阵前投降，他的军队仍然苦战一场，死伤很重。古代史书说他事先写信给奥勒良，引维吉尔的诗句请求把他从苦境中解救出来。

  这年奥勒良在罗马举行凯旋式，据《罗马帝王纪》，泽诺比娅和泰特里库斯都走在车前。他没有杀这两个人，泰特里库斯后来还做了意大利南部的地方长官。钱币和铭文称他为“世界的恢复者”。帝国重归一统，但放弃了的达契亚和莱茵河、多瑙河上游之间的那块地方没有再收回。第二年他在出征波斯的路上被部下杀害。
