name: 隋灭陈
summary: 隋文帝分兵八路伐陈，589 年正月隋军攻入建康，俘陈后主，南北重归统一。
body: |-
  隋朝建立后，隋文帝一面整顿内政、击败突厥，一面为伐陈做准备。据《隋书·高颎传》，高颎献策说，江南气候比北方暖，收获较早，可在江南收割时扬言出兵，使陈朝聚兵防守、误了农时；江南的粮仓多是竹木茅草所建，可派人纵火焚烧。这样连续几年，陈朝的财力渐渐困乏。长江下游的隋将贺若弼经常调换防兵，每次都大张旗鼓，陈朝起初紧张戒备，后来习以为常。上游的杨素则在永安大造战船。

  开皇八年（公元 588 年）三月，隋文帝下诏列举陈后主的二十条罪状，抄写三十万份在江南散发。十月，以晋王杨广为统帅，秦王杨俊、清河公杨素为行军元帅，高颎为元帅长史，分兵八路伐陈，据《隋书》，总兵力五十一万八千人，东起大海，西至巴蜀。

  陈后主自恃长江天险，据《南史》，他说建康有王气，北齐来过三次、北周来过两次都失败了，隋军又能怎样，仍旧饮酒作乐。开皇九年（589 年）正月初一，贺若弼从广陵渡江攻占京口，韩擒虎乘夜从横江渡江攻占采石，两路夹击建康。正月二十日，贺若弼在钟山与陈军决战获胜，韩擒虎率五百精骑先从朱雀门进入建康，在景阳殿的井中俘获了陈后主。随后杨广进入建康，处死了后主宠信的施文庆等人和张贵妃。

  此后陈朝各地守将相继投降，岭南的冼夫人也率众归附。据《隋书》，隋朝共得州三十、郡一百、县四百。从西晋末年的永嘉之乱算起，南北分裂了将近三百年，至此重新统一。陈后主被押往长安，十五年后死于洛阳。
sources: []
recalled:
