name: 兰亭集会
summary: 王羲之与谢安、孙绰等四十余人在会稽山阴的兰亭修禊赋诗，王羲之写下《兰亭集序》。
body: |-
  古人有在三月上旬到水边洗濯、祓除不祥的风俗，叫做修禊，魏晋以后固定在三月初三，逐渐变成春天出游宴饮的日子。永和九年（公元 353 年）三月初三，会稽内史王羲之邀集亲友，到郡城山阴西南的兰亭聚会。会稽山水秀丽，当时住着许多南渡的名士。与会的有谢安、谢万兄弟，以文才知名的孙绰，王羲之的儿子王凝之、王徽之、王献之等人。人数有四十一人和四十二人两种记载。

  众人列坐在弯曲的溪水两旁，把盛了酒的杯子放在上游，让它顺水漂下，停在谁的面前，谁就取来饮酒并赋诗，称为“曲水流觞”。据后人的记录，当天有二十六人作出了诗，共三十七首；其余十几人没有作成，各罚酒三斗。这些诗多是玄言诗，借山水谈论老庄的道理，汇成一集，由王羲之作序，孙绰另写了一篇后序。

  王羲之的序就是《兰亭集序》。文章先记叙聚会的时间、地点和当日“天朗气清，惠风和畅”的景色，接着由聚会之乐想到人生短暂，感叹把生与死看成一回事的说法是虚妄的，最后说后人读到这些诗，也会像今人读古人的文字一样有所感慨。

  这篇序的书法比文章更有名。相传王羲之当时乘着酒兴用鼠须笔在蚕茧纸上写成，日后重写多遍都不如原稿。据唐人何延之《兰亭记》，真迹在王家传了七代，到僧人智永手中，再传弟子辩才，唐太宗派御史萧翼设计骗到手，命宫中的拓书人摹写多本分赐近臣，死后以真迹随葬昭陵。这个故事的细节未必可靠，但唐代宫廷确曾大量摹拓。今天能见到的是唐代的摹本和后来的刻本，其中传为冯承素所摹的一卷藏在北京故宫博物院。后世把《兰亭集序》称为“天下第一行书”。

  传世《兰亭集序》的文字比《世说新语》注所引的《临河序》多出一大段，书体也与出土的东晋墓志不同，清代以来就有人怀疑它不是王羲之的原作。1965 年郭沫若撰文重提此说，引发了一场“兰亭论辨”，赞成和反对的学者各有论据，至今没有定论。
sources: []
recalled:
  - 《晋书·王羲之传》
  - 《世说新语·企羡》及刘孝标注
  - 何延之《兰亭记》（《法书要录》卷三）
