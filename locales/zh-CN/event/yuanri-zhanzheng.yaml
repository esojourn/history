name: 元军征日本
summary: 元朝在 1274、1281 年两次渡海进攻日本，都在博多湾受阻，又遭风暴而失败。
body: |-
  忽必烈即位后，经由已经臣服的高丽多次派遣使者前往日本，要求日本通好，国书中带有以武力相威胁的意思。镰仓幕府的执权北条时宗决定不予回复，使者无功而返。

  至元十一年（公元 1274 年）十月，元朝与高丽的联军从高丽的合浦出发，渡海进攻日本，攻下对马、壹岐，在九州的博多湾登陆。元军使用集团战术和火器，日本武士习惯于一骑对一骑的作战，伤亡很重，退守内陆。但元军也损失不小，统帅之间意见不一，当晚撤回船上，不久全军撤退，途中遭遇风浪，损失很多船只。日本称这次战事为“文永之役”。关于这次撤退是否主要因为风暴，史家有不同看法。

  此后元朝两次派使者到日本，都被北条时宗下令处斩。幕府命令九州的武士在博多湾沿岸修筑石墙（石筑地），加强防备。至元十八年（1281 年）南宋已经灭亡，元朝派出东路军（蒙古、高丽和北方汉军，从合浦出发）和江南军（主要是南宋的降军，由范文虎率领，从庆元出发）两路大军进攻日本，规模比第一次大得多。东路军先到，被石墙挡住，无法登陆，在志贺岛等地与日军反复交战；江南军迟到，两军会合后移驻鹰岛一带。闰七月初，一场台风袭来，元军的船只大批沉没，范文虎等将领乘坚固的船只逃回，留在岛上的大批士兵被日军杀死或俘虏。日本称为“弘安之役”，把这两次帮助他们击退元军的风暴称为“神风”。

  此后忽必烈曾计划第三次东征，因为国内财力紧张和征安南等战事而作罢。元军两次东征失败，使日本免于被征服；镰仓幕府却因无力奖赏参战的武士而日益衰落。
sources: []
recalled:
  - 《元史·日本传》
  - 《高丽史》
