name: 祖逖北伐
summary: 祖逖率部曲渡江北上，联合各地坞堡，数年间收复黄河以南，因朝廷牵制和病逝而中止。
body: |-
  洛阳陷落后，黄河以南、淮河以北的广大地区没有统一的官府，各地豪强聚集乡里宗族，筑起坞堡自守，他们有的奉晋朝的名义，有的依附石勒，彼此之间也常常攻杀。在江东的司马睿正忙于稳定内部，无意北进。南下避乱的祖逖住在京口，手下聚集了一批勇士，他上书说，中原百姓遭受残害，人人思奋，只要派出军队，各地的豪杰必定望风响应。

  建兴元年（公元 313 年），司马睿任命他为豫州刺史，给了一千人的粮食和三千匹布，兵员、铠甲和兵器都要他自己筹办。他带着原有的部曲一百多家从京口渡江，在船到江心时击楫立誓，随后在淮阴停下来冶铸兵器，招募到二千多人才继续前进。

  他先向谯城一带用兵。那里的坞主张平、樊雅各有部众数千，他用了一年多才击败张平、招降樊雅，进驻谯城。接着他进攻依附石勒的陈川，石勒派侄子石虎率五万人来救，把陈川的部众迁走，留下将领桃豹与晋军相持。据《晋书》本传，两军在蓬陂的同一座城里分据东西相守四十天，他让人用布袋装土冒充军粮运上城，又故意让几个挑着真米的人被敌军夺去，桃豹的士兵挨饿已久，以为晋军粮足，士气大沮，不久退走。

  对黄河沿岸那些有子弟在后赵做人质的坞主，他允许他们表面上仍然依附石勒，还不时派兵佯攻以掩人耳目，坞主们感激他，后赵一有动静就暗中报告。大兴三年（320 年）他进驻雍丘，黄河以南大部分地方重新归晋，石勒不再敢渡河用兵，主动请求通使互市。他没有答复来信，但听任边境贸易，从中收税以充军用。

  他正在积储粮食、准备渡河北进时，建康的朝廷派戴渊出任征西将军，都督北方六州军事，位在他之上。这一任命本是晋元帝为防备王敦而作的布置。大兴四年（321 年）九月，他在忧愤中病逝于雍丘。第二年王敦起兵，东晋陷入内乱，后赵乘机南进，他的弟弟祖约抵挡不住，退守寿春，收复的土地全部丢失。
sources: []
recalled:
  - 《晋书·祖逖传》
  - 《资治通鉴》卷八十八至九十一
