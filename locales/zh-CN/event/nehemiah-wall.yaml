name: 尼希米重修城墙
summary: 亚达薛西第二十年，尼希米奉准回耶路撒冷，五十二天修完城墙。
body: |-
  耶路撒冷的城墙在公元前 586 年被巴比伦军队拆毁。圣殿重建之后城墙仍未修复；《以斯拉记》4:7–23 记亚达薛西年间曾有人动工修城，被撒玛利亚的官员上奏控告，王下令停工。亚达薛西第二十年基斯流月，在书珊宫中作酒政的尼希米从兄弟哈拿尼口中得知城墙拆毁、城门被焚（《尼希米记》1:1–3）。

  到尼散月，尼希米向王请求回去修造列祖坟墓所在的那城，王准了，给他诏书（2:1–9）。按亚达薛西一世计算，这是公元前 445 年。他到耶路撒冷后夜间察看城墙，然后对祭司、贵胄和官长说明来意，众人同意起来建造（2:11–18）。

  第 3 章从羊门起，按顺序逐段记录各段工程由谁修造：有大祭司以利亚实和众祭司，有各城的居民、银匠、商人，也有管理耶路撒冷一半的官长带着女儿们修造。参巴拉、多比雅、基善等人先是讥诮，后来同谋要来攻击。尼希米派人按宗族拿刀、枪、弓守在城墙后面的低洼处；此后修造的人一手作工，一手拿兵器，吹角的人在尼希米旁边（第 4 章）。对方又约他到阿挪平原相见，并雇人假托预言吓他躲进殿里，都没有得逞（第 6 章）。

  6:15 记，以禄月二十五日城墙修完，共修了五十二天。城门安好后，尼希米派兄弟哈拿尼和营楼的宰官哈拿尼雅管理耶路撒冷（7:1–2）。七月，以斯拉在水门前宣读律法（第 8 章）。因城中居民稀少，百姓拈阄使十分之一的人迁入居住（11:1–2）。行城墙告成之礼时，两大队称谢的人分头在城墙上行走，在圣殿会合（12:27–43）。次经《便西拉智训》第 49 章也提到尼希米重修城墙。
sources: []
recalled:
  - 《尼希米记》第 1—8 章、第 11—12 章
  - 《以斯拉记》4:7–23
  - 《便西拉智训》第 49 章
