name: 垓下之战
summary: 汉五年十二月，汉军与诸侯兵围项羽于垓下，项羽突围至乌江自刎。
body: |-
  鸿沟之约后项羽东归，刘邦毁约追击，在固陵被楚军击败。他采纳张良的建议，许诺把陈以东至海之地给韩信、睢阳以北至谷城之地给彭越，两人于是领兵前来，楚大司马周殷也叛楚，各路军队会于垓下。此战在汉五年十二月，相当于公元前 202 年初。

  据《史记·高祖本纪》，韩信率三十万人居中，孔将军、费将军分列左右，刘邦在后；项羽之卒约十万。韩信先交战不利后退，两翼出击，韩信再乘势反攻，大败楚军。《项羽本纪》记项羽在垓下筑垒固守，兵少粮尽，被重重包围，夜里听到汉军四面都唱楚歌，大惊，以为汉已尽得楚地，“四面楚歌”即出于此。他在帐中饮酒，对着美人虞和骏马骓作歌，随后带八百余骑趁夜向南突围。

  天明后汉军发觉，派灌婴率五千骑追赶。项羽渡淮后只剩百余骑，在阴陵迷路，被一个农夫骗入大泽；到东城时只有二十八骑，他对部下说“此天之亡我，非战之罪也”，仍率众冲杀数阵。到乌江边，乌江亭长备船请他东渡，他说无颜见江东父兄，把马送给亭长，下马步战，最后自刎。《高祖本纪》称此役斩首八万。楚地随后平定，刘邦以鲁公之礼葬项羽于谷城。
sources:
  - 《史记·项羽本纪》 https://zh.wikisource.org/wiki/史記/卷007
  - 《史记·高祖本纪》 https://zh.wikisource.org/wiki/史記/卷008
  - 《汉书·高帝纪》 https://zh.wikisource.org/wiki/漢書/卷001
