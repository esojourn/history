name: 出埃及
summary: 摩西带领在埃及为奴的以色列人离开埃及，过红海，进入旷野。
body: |-
  据《出埃及记》第 1 章，雅各的子孙在埃及生养众多。后来有不认识约瑟的新王兴起，怕以色列人比埃及人强盛，就派督工的辖制他们，叫他们为法老建造积货城比东和兰塞，又下令把他们所生的男孩丢在河里。以色列人因作苦工叹息哀求，神就在何烈山呼召摩西，差他和哥哥亚伦去见法老，要求容百姓离开（第 3—5 章）。

  法老不肯，埃及先后遭了十样灾：水变血、蛙灾、虱灾、蝇灾、畜疫、疮灾、雹灾、蝗灾、黑暗之灾，最后是一切头生的被击杀（第 7—12 章）。末一灾临到之前，以色列人按吩咐在正月十四日宰杀羊羔，把血涂在门框和门楣上，这就是逾越节的由来（第 12 章）。当夜法老催他们离开。据 12:37，从兰塞起行往疏割去的，除了妇人孩子，步行的男人约有六十万；又据 12:40–41，以色列人住在埃及共四百三十年。

  耶和华日间在云柱中、夜间在火柱中领他们的路（13:21–22）。法老后悔，带着六百辆特选的车和埃及所有的车追到海边（14:6–9）。摩西向海伸杖，耶和华用大东风使海水一夜退去，以色列人下海中走干地；埃及的军兵追进去，水回流，都被淹没（14:21–28）。摩西和以色列人向耶和华唱歌，米利暗领着妇女击鼓跳舞（第 15 章）。此后百姓在旷野得了吗哪为食，在利非订击败亚玛力人，于出埃及后第三个月到了西奈的旷野（19:1）。

  本条的年份是按经文的数字推出的约数：《列王纪上》6:1 说，所罗门在以色列人出埃及后四百八十年开工建殿，建殿约在公元前 966 年，上推即约公元前 1446 年。不少学者另主张出埃及在公元前 13 世纪，主要理由是兰塞这个城名和迦南地的考古材料。埃及文献里至今没有发现直接提到这件事的记载；经外最早提到“以色列”这个名字的，是约公元前 1208 年的麦伦普塔石碑。“红海”在希伯来文里字面意思是“芦苇海”，确切地点也有不同说法。
sources: []
recalled:
  - 《出埃及记》第 1—19 章
  - 《列王纪上》6:1
  - 麦伦普塔石碑（约公元前 1208 年）
