name: 东晋建立
summary: 西晋灭亡后，琅邪王司马睿在建康称晋王，次年即皇帝位，晋朝在江南延续，史称东晋。
body: |-
  司马睿在永嘉元年（公元 307 年）渡江时只是一位名位不高的宗王，靠王导等人的筹划，才逐渐得到江东大族和南来北方士族的共同拥戴。洛阳陷落后，他被推为盟主，承制任免官吏，先后消灭了不肯听命的江州刺史华轶，平定了杜弢在湘州的起事，控制了长江中下游。晋愍帝在长安即位，任命他为丞相，他没有出兵北上。

  建兴四年（316 年）十一月长安陷落。次年三月，司马睿在建康即晋王位，改元建武，设置百官，建立宗庙社稷，但没有称帝。各地仍然奉晋朝名义的官员纷纷上表劝进，其中有在并州、幽州一带坚持的刘琨和鲜卑首领段匹磾，他们派温峤带着联名的表章南下；辽东的慕容廆也遣使渡海而来。大兴元年（318 年）三月，愍帝在平阳遇害的消息传到建康，司马睿即皇帝位，改元大兴，就是晋元帝。

  因为都城建康在西晋旧都洛阳之东，后人把这个朝廷称为东晋。建康原名建业，西晋时改写作建邺，愍帝即位后为避他的名讳改称建康。东晋的疆域大体是淮河、汉水以南，西至荆州，后来又得到益州。

  新朝廷的格局从一开始就与西晋不同。司马睿没有自己的军队和根基，登基那天要王导同坐御床接受百官朝贺，王导坚辞才作罢；王导在内主政，王敦在外掌兵，当时的谚语说“王与马，共天下”。皇帝与几家南渡的高门共同执政，各家大族轮流居于主导，这种局面一直维持到东晋末年。朝廷内部侨姓与吴姓之间、中央与上游方镇之间的矛盾，也贯穿了此后的一百年。

  东晋共历十一帝、一百零三年，元熙二年（420 年）为刘裕的宋朝所代。它保存了汉魏以来的典章文物，使南方免于北方那样的长期战乱。后来的宋、齐、梁、陈都以建康为都，与东吴、东晋合称“六朝”。
