name: 王仙芝黄巢起义
summary: 王仙芝、黄巢 874 年起兵，转战南北，880 年攻入长安，884 年失败。
body: |-
  唐懿宗、僖宗时，朝廷和藩镇加紧聚敛，关东地区又连年遭受水旱灾害。据《资治通鉴》，乾符元年（公元 874 年）翰林学士卢携上奏说，关东去年大旱，百姓靠蓬草和槐叶充饥，州县仍然催逼赋税。乾符元年末到次年初，濮州的私盐贩子王仙芝在长垣起兵，曹州冤句的盐商黄巢随即响应，两支队伍会合，在河南、山东一带转战，参加的饥民越来越多（另见“王仙芝”“黄巢”条）。

  乾符三年（876 年）王仙芝打算接受朝廷招安，与黄巢发生冲突，两人分兵作战。乾符五年（878 年）王仙芝在黄梅战死，余部归附黄巢，黄巢自称冲天大将军。他避开中原唐军的重兵，率部渡过长江，转战江西、浙东，开山路进入福建，乾符六年（879 年）攻克广州。因为岭南疫病流行，他又挥师北上，经湖南、江西进入江淮。淮南节度使高骈拥兵不战，起义军顺利渡过淮河。

  广明元年（880 年）十一月，起义军攻克洛阳，十二月攻破潼关，进入长安，唐僖宗逃往成都。黄巢在长安称帝，国号大齐（另见“黄巢入长安”条）。此后唐朝各路兵马和藩镇逐渐包围长安，起义军困守孤城，粮食断绝，中和二年（882 年）大将朱温投降唐朝。中和三年（883 年），李克用率沙陀兵打败起义军，黄巢撤出长安东走，围攻陈州将近一年未能攻下。中和四年（884 年）五月，他在王满渡被李克用击败，六月死在泰山狼虎谷。他的部下秦宗权在蔡州继续割据，直到 889 年才被朱温消灭。

  这次起义前后历时十年，波及今天的山东、河南、湖北、江西、浙江、福建、广东、广西、湖南、安徽、陕西等地，沉重打击了唐朝的统治。唐朝虽然镇压了起义，但各地的军阀借机壮大，朱温、李克用等人成为新的割据势力，朝廷名存实亡，二十多年后唐朝灭亡。
sources: []
