name: "法国宗教战争"
summary: "1562—1598 年法国天主教徒与胡格诺派之间断续进行的八次内战。"
body: |-
  《历史的轨迹》第二十六章说，1559 年法国各地已有无数改革宗教会，那年 5 月他们在巴黎秘密召开第一次全国会议，采纳《高卢信条》，按加尔文的办法组织起来，此后被称为胡格诺派；又说据可靠统计当时将近六分之一的法国人是新教徒，如今学者的估计是一成上下。贵族里信的人很多，波旁家的孔代亲王和海军上将科利尼是他们的首领，对面是洛林的吉斯家。

  1559 年国王亨利二世意外身亡，继位的儿子们年幼，太后凯瑟琳摄政。她 1562 年 1 月准许胡格诺派在城外礼拜。3 月 1 日吉斯公爵路过瓦西，部下袭击了在谷仓里做礼拜的人，死了几十个。孔代举兵，战争开始。该书第三十章说，1562 年两个宗教团体爆发内战，胡格诺派勇敢抵御，获得不少胜利。

  前三次战争各以一纸和约结束，条件时宽时严。1570 年的《圣日耳曼敕令》给了胡格诺派拉罗谢尔等四座设防城市。1572 年 8 月圣巴多罗买大屠杀杀了他们大部分首领，幸存的人据守拉罗谢尔和南方各城，在那里自设议会、征税、养兵，形同国中之国。温和的天主教徒主张国家的安宁比信仰的统一要紧，被称为“政治派”。

  1576 年国王亨利三世对胡格诺派让步，激进的天主教徒组成天主教同盟，由吉斯公爵亨利领导，后来得到西班牙的津贴。1584 年王位继承权落到胡格诺派的纳瓦拉国王亨利身上，同盟起兵。该书称之为三个亨利的三角冲突。1588 年巴黎市民筑起街垒把国王赶出首都，年底国王派人刺杀了吉斯公爵，次年自己被一个修士刺死。

  纳瓦拉的亨利即位为亨利四世，又打了几年，1593 年改信天主教，次年进入巴黎，1598 年降服最后一批同盟贵族，与西班牙议和，并颁布《南特敕令》。三十多年的战争，死于兵灾、饥荒和瘟疫的人通常估计在二百万以上。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十六章“西欧的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter29.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
