name: 三监之乱与周公东征
summary: 武王死后，管叔、蔡叔联合商纣之子武庚叛乱，周公东征三年平定，周的统治由此稳固。
body: |-
  武王克商后，封纣的儿子武庚继续统治商的遗民，又派弟弟管叔、蔡叔（一说还有霍叔）在旁监视，称为“三监”。武王死后，成王年幼，周公摄政。管叔、蔡叔散布流言，说周公将不利于成王，又与武庚联合叛乱，东方的奄、薄姑、徐、淮夷等也起兵响应。

  据《尚书·大诰》和《史记》的《周本纪》《鲁周公世家》，周公向召公、太公说明自己的心迹，取得他们的支持，然后奉成王之命东征。经过三年战争，周公平定叛乱，诛杀武庚和管叔，流放蔡叔，又东进灭了奄等国。《诗经·豳风·东山》写的就是东征士兵归来的情景。

  叛乱平定后，周公把商的旧地一分为二：封纣的庶兄微子启于宋，继续商的祭祀；封武王的弟弟康叔于卫，统治殷的故地，《尚书·康诰》《酒诰》就是对康叔的告诫。一部分商的遗民被迁到洛邑一带。周公东征使周的统治深入东方，此后周王室又进一步分封诸侯，营建成周。

  这场战争在青铜器铭文中也有反映，传世的禽簋、刚劫尊等铜器都记载了周王（一般认为是成王）征伐奄国的事。周公东征以后，周人在东方的统治才真正稳固下来。

  《尚书·大诰》生动地反映了东征前的情形，周公以占卜所得的吉兆说服诸侯和臣下出兵。
sources: []
recalled:
  - 《尚书·大诰》
  - 《史记·周本纪》
  - 《史记·鲁周公世家》
  - 《诗经·豳风·东山》
