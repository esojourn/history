name: 伊阙之战
summary: 前 293 年白起在伊阙大败韩魏联军，据《史记》斩首二十四万。
body: |-
  秦昭襄王即位后，秦国继续东进，韩、魏首当其冲。公元前 293 年，韩、魏两国联合（一说还有东周）出兵，在伊阙（今河南洛阳南的龙门一带）抵御秦军。秦国起用当时还只是左更的白起为将。

  据《史记·白起王翦列传》，白起在伊阙大败韩、魏联军，斩首二十四万，俘虏魏将公孙喜，攻下五座城池，白起因功升为国尉。后人分析，韩、魏两军互相推诿，都想让对方先战，白起以少量兵力牵制韩军，集中主力击溃魏军，再回师击败韩军。

  伊阙之战大大削弱了韩、魏的力量，为秦国此后蚕食两国土地打开了通道，也使白起成为秦国最重要的将领。“斩首二十四万”是《史记》的说法，战国时期的斩首数字常被认为有夸大的成分。

  伊阙是伊水流经两山之间形成的天然门阙，即今洛阳龙门一带，北魏以后两岸山崖上开凿了著名的龙门石窟。据《史记·秦本纪》，此后几年秦国连续攻取韩、魏的城邑，魏国被迫献出河东之地四百里，韩国献出武遂之地二百里。白起由此成为秦国战功最高的将领。

  这一战后，韩、魏两国再也无力单独对抗秦国，只能依附于齐、赵，或者割地求和，秦国向东发展的道路由此打开。

  伊阙之战也是白起成名之战。
sources: []
recalled:
  - 《史记·白起王翦列传》
  - 《史记·秦本纪》
  - 《战国策·中山策》
