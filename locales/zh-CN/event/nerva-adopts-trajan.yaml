name: 涅尔瓦收养图拉真
summary: 公元 97 年无子的涅尔瓦收养图拉真为继承人，开此后几代皇帝传位养子的先例。
body: |-
  公元 96 年 9 月图密善遇刺，元老院推举年老无子的涅尔瓦为皇帝。军队并不服他。97 年，禁卫军在长官卡斯佩里乌斯带领下把他围在宫里，逼他交出刺杀图密善的人，涅尔瓦只得照办，还被迫当众向士兵道谢。

  这年 10 月，潘诺尼亚传来捷报。涅尔瓦登上卡皮托山，在朱庇特神庙前宣布收养上日耳曼总督图拉真，授给他“恺撒”称号和保民官权力。图拉真与他没有亲属关系，手里握着莱茵河的军团，在军中素有威望。据卡西乌斯·狄奥，涅尔瓦送去一枚戒指，附了一句荷马的诗，意思是要他替自己雪耻。98 年 1 月涅尔瓦去世，图拉真顺利继位，随后把哗变的禁卫军长官召去处置了。

  此后哈德良、安东尼·庇护、马可·奥勒留都是以养子的身份继位，这几位皇帝恰好都没有亲生儿子可传。小普林尼在《图拉真颂》里把收养说成是从全体公民中择贤而立。到马可·奥勒留把皇位传给亲生的康茂德，这个做法就中断了。
sources: []
recalled:
  - 卡西乌斯·狄奥《罗马史》卷 68 第 3—5 章
  - 小普林尼《图拉真颂》第 5—10 章
  - 奥勒留·维克多《诸恺撒传》节略本第 12—13 章
