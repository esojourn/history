name: 石敬瑭割燕云十六州
summary: 石敬瑭为换取契丹援助，把燕云十六州割给契丹，中原从此失去长城一线的屏障。
body: |-
  清泰三年（公元 936 年），石敬瑭在太原起兵反抗后唐，向契丹求援，许诺事成之后割让土地。同年十一月，契丹皇帝耶律德光册立石敬瑭为大晋皇帝，石敬瑭随即答应把卢龙一道和雁门关以北的十六个州割给契丹，并且每年向契丹输送帛三十万匹（据《资治通鉴》）。天福三年（938 年），后晋正式向契丹献上这些州的地图和户籍，割让手续至此完成。

  这十六个州是：幽、蓟、瀛、莫、涿、檀、顺、新、妫、儒、武、云、应、寰、朔、蔚，大致包括今北京、天津北部和河北北部、山西北部一带，后人习惯称为“燕云十六州”，也称“幽云十六州”。其中以幽州（今北京）和云州（今大同）最为重要。

  燕云十六州的割让对此后的历史影响很大。这一地区有燕山、太行山和长城作为屏障，失去之后，中原北面的华北平原无险可守，契丹的骑兵可以长驱南下。契丹得到这片农业发达、人口众多的地区，把幽州升为南京，以汉人的制度治理汉人，国力大增。后周世宗于 959 年收复了瀛、莫二州（另见“周世宗北伐”条），北宋曾几次出兵试图收回其余各州，都没有成功，直到明朝初年这一地区才重新归中原王朝统治。

  后世对石敬瑭的评价因此极低，称他为“儿皇帝”。
sources: []
recalled:
  - 《旧五代史·晋书·高祖纪》
  - 《辽史·太宗本纪》
  - 《资治通鉴》卷二百八十至二百八十一
