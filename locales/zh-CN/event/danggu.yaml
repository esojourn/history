name: 党锢之祸
summary: 东汉桓、灵二帝时，宦官两次把反对者指为“党人”，处死或终身禁锢。
body: |-
  东汉中期以后皇帝多幼年即位，外戚与宦官交替掌权。延熹二年（公元 159 年）桓帝依靠宦官诛灭外戚梁冀，此后宦官得势，其亲属党羽遍布州郡。一批官员不避权势加以惩治，雒阳的三万多名太学生也议论朝政、品评人物，推崇李膺、陈蕃、王畅等人。

  据《后汉书·党锢列传》，延熹九年（166 年），司隶校尉李膺处死了一个与宦官交好、教唆儿子杀人的术士。术士的弟子上书，告李膺等人“养太学游士，交结诸郡生徒，更相驱驰，共为部党，诽讪朝廷”。桓帝大怒，下令各郡国逮捕“党人”，李膺等二百多人下狱。次年经外戚窦武等人劝说，党人被赦免回乡，但名字记录在案，终身不得做官。这是第一次党锢。

  灵帝即位后，窦武与太傅陈蕃辅政，起用李膺等人，并谋划诛除宦官，建宁元年（168 年）九月事泄被杀。次年，宦官侯览指使人告发名士张俭结党谋反，朝廷随即大举搜捕，李膺、杜密、范滂等一百多人死在狱中。《后汉书》说各地借机牵连，被处死、流放、罢官、禁锢的有六七百人。熹平五年（176 年）有官员上书为党人鸣冤，被拷打致死，朝廷又下诏把禁锢的范围扩大到党人的门生、故吏和五服以内的亲属。这是第二次党锢。

  中平元年（184 年）黄巾起义爆发，朝廷担心党人与黄巾联合，才宣布大赦党人。前后十八年间，一大批有声望的官员和士人被排除在朝廷之外。
sources: []
recalled:
  - 《后汉书·党锢列传》
  - 《后汉书·陈王列传》（陈蕃）
  - 《资治通鉴》卷五十五至五十八
