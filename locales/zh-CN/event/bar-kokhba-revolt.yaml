name: 巴尔·科赫巴起义
summary: 公元 132 至 135 年犹太人在巴尔·科赫巴领导下起义反抗罗马，终告失败。
body: |-
  公元 70 年圣殿被毁以后，耶路撒冷只是罗马第十军团的营地。关于起义的原因，卡西乌斯·狄奥说，哈德良要在耶路撒冷的废墟上建一座罗马殖民地“埃利亚·卡皮托利纳”，在圣殿原址修朱庇特神庙；《罗马帝王纪》则说是因为禁止行割礼。两说孰是，或者两者都有，学者至今没有定论。

  起义在 132 年爆发。领袖名叫西门·巴尔·科西巴，犹太教的传统说拉比阿基巴称他为“巴尔·科赫巴”，意思是“星之子”，取自《民数记》24:17，把他看作弥赛亚。1950 至 1960 年代，死海西岸的山洞里发现了他写给部下的十几封信和一批契约，信里他自称“以色列的王子”，催要粮草，口气严厉。起义者铸了自己的钱币，上面写着“以色列得赎第一年”“为了耶路撒冷的自由”。他们是否占领过耶路撒冷，证据不足。

  据狄奥，犹太人不同罗马人正面交战，而是凭事先挖好的地道和据点四处出击。哈德良从不列颠调来名将尤利乌斯·塞维鲁，各省抽调的部队陆续到达。塞维鲁把对方分割包围，断其粮食，一处处清剿。罗马军的损失也很重，狄奥说哈德良给元老院写信时，省去了惯用的“我和军队都安好”一句。135 年最后的据点贝塔尔陷落，巴尔·科赫巴战死。

  狄奥给出的数字是：五十处要塞、九百八十五个村庄被毁，五十八万人死于战斗，饿死病死的不计其数。犹太腹地几乎成了空地。哈德良把行省改名为“叙利亚-巴勒斯坦”，耶路撒冷照原计划建为罗马城市，犹太人不得入内。犹太人生活的重心从此移到加利利，约在公元 200 年，《密什拿》在那里编成。

  殉道者游斯丁在这次起义之后不久写道，巴尔·科赫巴曾下令惩罚不肯否认耶稣的基督徒。据优西比乌，耶路撒冷的教会此前的主教都是犹太人，此后改由外邦人担任。
