name: 耶路撒冷会议
summary: 使徒和长老在耶路撒冷商定，外邦信徒不必受割礼、守摩西律法。
body: |-
  保罗和巴拿巴第一次出行回到安提阿以后，有几个人从犹太下来，教训弟兄们说，若不按摩西的规条受割礼，就不能得救。保罗、巴拿巴与他们大大地争辩，众人就定规叫保罗、巴拿巴和本会中几个人为这事上耶路撒冷去见使徒和长老（《使徒行传》15:1–2）。

  到了耶路撒冷，有几个信徒是法利赛教门的人，起来说必须给外邦人行割礼，吩咐他们遵守摩西的律法。使徒和长老聚会商议。辩论多了以后，彼得起来，提到神早已拣选他叫外邦人听见福音，神也赐圣灵给他们，不应把祖宗和自己都不能负的轭放在门徒的颈项上（15:7–11）。巴拿巴和保罗述说神借他们在外邦人中所行的神迹奇事。最后雅各发言，引先知书的话，主张不可难为那归服神的外邦人，只要写信吩咐他们禁戒偶像的污秽和奸淫，并勒死的牲畜和血（15:13–21）。

  使徒、长老和全教会照此定议，拣选称呼巴撒巴的犹大和西拉，同保罗、巴拿巴带着书信往安提阿去，信是写给安提阿、叙利亚、基利家的外邦弟兄的；安提阿的众人念了，因信上安慰的话就欢喜了（15:22–31）。

  保罗在《加拉太书》2:1–10 记他过了十四年同巴拿巴再上耶路撒冷，带着希腊人提多同去，提多没有被勉强受割礼；雅各、矶法、约翰向他和巴拿巴用右手行相交之礼，叫他们往外邦人那里去。多数学者认为这和《使徒行传》第 15 章是同一次会面，也有人认为它对应的是徒 11:30 送捐项的那一次。《加拉太书》2:11–14 还记后来矶法到安提阿，因从雅各那里来的人到了，就退去不再与外邦人一同吃饭，保罗当面责备了他。会议的年份圣经没有记载，通行的约数是公元 49 年前后。
sources: []
recalled:
