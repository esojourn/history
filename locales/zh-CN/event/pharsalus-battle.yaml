name: 法萨卢斯战役
summary: 恺撒在希腊色萨利以少胜多击败庞培，内战大局已定；庞培逃往埃及被杀。
body: |-
  公元前 48 年 8 月 9 日（按当时未经改革的罗马历），恺撒在希腊色萨利的法萨卢斯附近击败庞培，是内战的决定性一战。

  这年年初恺撒渡海到伊庇鲁斯，后续部队由安东尼在春天送到。他在迪拉基乌姆城外筑起长墙围困庞培，庞培靠海路补给，恺撒的士兵反而缺粮。7 月庞培集中兵力突破围墙，恺撒受挫；据普鲁塔克，他说如果对方有一位懂得取胜的统帅，战争这一天就结束了。他撤围东去色萨利。庞培尾随而来，本想继续拖延，用饥饿拖垮对手；营中的元老们急于回罗马，讥讽他贪恋指挥权。他被迫出战。

  战场在埃尼佩乌斯河边的平原，具体位置有争议。据恺撒《内战记》，庞培有步兵四万七千人、骑兵七千；恺撒有步兵二万二千人、骑兵一千。庞培右翼靠河，把几乎全部骑兵和弓手、投石手集中在左翼，由恺撒的旧部将拉比埃努斯指挥，打算击溃对方的骑兵后包抄其背后；步兵则奉命原地不动。恺撒看出这个意图，从第三线抽出若干步兵队，斜置在右翼后方作为第四线，告诉他们胜负全在他们身上。

  庞培的骑兵击退恺撒的骑兵，正要展开，第四线突然迎上来，用标枪当长矛刺向骑手；骑兵溃逃，弓手和投石手被歼。第四线接着绕到庞培左翼背后，恺撒同时投入一直未动的第三线，庞培的战线崩溃。庞培回到营帐，营垒被攻时换下统帅的装束，骑马逃走。

  恺撒说自己只损失二百人和三十名百夫长，对方死一万五千，二万四千人投降；参加过此战的波利奥说庞培一方死六千，现代学者多取后者。恺撒下令宽待罗马公民。据苏维托尼乌斯转引波利奥，他看着战场上的尸体说：“这是他们自找的；我盖乌斯·恺撒立了这样大的功，要是不向军队求助，也会被定罪。”庞培渡海到埃及，9 月 28 日在佩卢西翁上岸时被杀。
sources: []
recalled:
  - 恺撒《内战记》卷三第 41—99 章
  - 普鲁塔克《庞培传》第 65—80 章、《恺撒传》第 39—46 章
  - 阿庇安《内战史》卷二第 60—86 章
  - 苏维托尼乌斯《神圣的尤利乌斯传》第 30 章
