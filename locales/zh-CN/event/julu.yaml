name: 巨鹿之战
summary: 项羽率楚军渡河救赵，在巨鹿城下大破秦军，俘王离。
body: |-
  秦将章邯在定陶击杀项梁后，北渡黄河攻赵。赵王歇与张耳退入巨鹿城，秦将王离、涉间围城，章邯驻军城南，修筑甬道为围城部队运粮。据《史记·项羽本纪》，楚怀王以宋义为上将军、项羽为次将、范增为末将，领兵救赵。宋义行至安阳，停留四十六日不进，打算等秦赵两败俱伤。项羽在帐中斩杀宋义，诸将拥他为假上将军，怀王随后正式任命。

  项羽先派英布（当阳君）、蒲将军率二万人渡河，战事稍有进展；接着亲率全军渡河，“皆沉船，破釜甑，烧庐舍，持三日粮，以示士卒必死”，成语“破釜沉舟”即出于此。楚军包围王离，与秦军九次交战，截断甬道，大破秦军，杀苏角，俘王离，涉间自焚而死。当时前来救赵的诸侯军有十余座营垒，都不敢出战，诸将只在壁垒上观望。战后项羽召见诸侯将领，众人入辕门“无不膝行而前”，项羽从此成为诸侯上将军。

  此战依秦历在秦二世三年，一般换算为公元前 207 年。此后章邯与项羽相持数月，屡战不利，又受赵高猜忌，同年七月在洹水南殷墟率部投降，秦在关东的主力至此瓦解。
sources:
  - 《史记·项羽本纪》 https://zh.wikisource.org/wiki/史記/卷007
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
  - 《史记·张耳陈余列传》 https://zh.wikisource.org/wiki/史記/卷089
