name: 太初改历
summary: 汉武帝颁行《太初历》，改以正月为一年之首，这是现存最早的有完整记载的历法。
body: |-
  汉初沿用秦朝的《颛顼历》，以十月为一年的开始。这部历法用了一百多年，误差越积越大，《汉书·律历志》说当时出现了月初见到满月、月末月初反而见到月亮的情形。儒生们还认为，汉朝取代秦朝，应当更改历法和服色，表示受命于天。

  据《律历志》，元封七年（公元前 104 年），公孙卿、壶遂和太史令司马迁上言历法已经败坏，应当改正。武帝命他们议造新历，随后又从官府和民间选拔了二十多位通晓历算的人，其中有邓平、方士唐都和巴郡的落下闳。各家提出的方案有十几种，经过实测比较，邓平、落下闳一派的算法被认为最接近天象而获采用。这一年因此改元“太初”，新历称为《太初历》。

  新历把一年的开始由十月改到正月；一个朔望月的长度定为二十九日又八十一分之四十三日，所以又称“八十一分律历”。一般认为，它第一次把二十四节气编入历法，并规定以没有中气的月份作为闰月，使月份与季节的对应更加固定。由于岁首从十月移到正月，太初元年这一年实际上有十五个月。与改历同时，朝廷宣布汉为土德，服色尚黄，并更改了一批官名。

  《太初历》的原文没有流传下来。西汉末年刘歆以它为基础增补，编成《三统历》，收在《汉书·律历志》中，后人借此得知它的内容。这部历法一直用到东汉章帝元和二年（公元 85 年）才被《四分历》取代。以正月为岁首的做法，除了王莽和武则天等时期的短暂更改，沿用到了近代。
