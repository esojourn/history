name: "荷兰分离运动"
summary: "1834 年荷兰一批信徒脱离国家教会，组成基督徒改革宗教会，后来部分移居美国。"
body: |-
  《历史的轨迹》第三十九章说，十九世纪初荷兰改革宗教会陷于极度低潮，改革宗教义被讥为过时。后来出现了新的生机：瑞士的马兰、维内等人的影响传到荷兰，引起上层社会的复兴；数千中下层热心信徒在几位牧师领导下，要使国家教会重新按信经和教会法规复兴，却遭到政府和教会当局的反对。

  该书说，1834 年由此发生一次大分裂，许多信徒不顾当局和暴民的逼迫，脱离国家教会，成立基督徒改革宗教会，1854 年在坎彭设立神学院。据一般记载，带头的是格罗宁根省于尔吕姆的牧师德科克，他被停职后与会众在 1834 年 10 月宣布分离。该书说，最有名的两位领袖舒尔特和范拉尔特在 1847 至 1848 年间带领会众前往美国爱荷华州和密歇根州，使这次分裂的影响带到了美国。1892 年这一支与凯波尔带出来的团体合并为荷兰改革宗教会。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
