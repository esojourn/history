name: 创世
summary: 《创世记》开篇所记：神在六日之内创造天地万物和人，第七日安息。
body: |-
  《创世记》以“起初，神创造天地”开篇。第 1 章到第 2 章第 3 节按日子记述创造的经过：第一日有光，分出昼夜；第二日造出空气，把水分为上下；第三日水聚在一处，旱地露出来，地上长出菜蔬和树木；第四日造日、月、星辰，用来分昼夜、作记号、定节令和日子年岁；第五日造水中的鱼和空中的鸟；第六日造地上的牲畜、昆虫、野兽，又照着神自己的形像造人，造男造女，叫他们生养众多、治理这地。

  到第七日，神造物的工已经完毕，就歇了一切的工，赐福给第七日，定为圣日（2:1–3）。后来十诫中守安息日的诫命就以此为根据（《出埃及记》20:8–11）。

  第 2 章第 4 节以下换了一个角度，专讲人的受造：耶和华神用地上的尘土造人，在东方的伊甸立了一个园子，把人安置在里面。园中有生命树和分别善恶的树；有河从伊甸流出来滋润园子，分为四道，名叫比逊、基训、希底结和伯拉河。神又用那人的一条肋骨造了一个女人，作他的配偶（2:7–25）。

  创世发生在什么时候，圣经没有给出年份。历代有人把《创世记》第 5 章和第 11 章家谱里各人生子时的岁数逐代相加，再接上后面的年数来推算：17 世纪爱尔兰大主教乌雪据希伯来文本算出创世在公元前 4004 年；希腊文七十士译本家谱里的数字较大，据此推算约在公元前 5500 年；犹太历则从公元前 3761 年起算。这些都是后人的推算。William Henry Green 在 1890 年发表的文章《太初年代》（Primeval Chronology）里提出，圣经的家谱常有省略世代的情形（例如《马太福音》第 1 章），本来不是为推算年代而写的。本站不以这些推算为据，创世到巴别这一段只排先后，不标年份。

  还需说明的是，这里是按圣经的记载来陈述的；现代自然科学对宇宙和地球年龄的测定用的是另一套方法和口径，结论与上述各种推算都不相同，本站不把两者排在同一把尺上。
sources: []
recalled:
  - 《创世记》第 1—2 章
  - 《出埃及记》20:8–11
  - 乌雪《旧约与新约编年史》（1650 年）
  - William Henry Green, "Primeval Chronology", Bibliotheca Sacra, 1890
