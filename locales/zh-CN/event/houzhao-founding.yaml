name: 后赵建立与灭前赵
summary: 石勒在襄国自称赵王，十年后在洛阳擒刘曜，灭前赵，占有北方大部。
body: |-
  石勒原是匈奴汉国的将领，自永嘉六年（公元 312 年）据有襄国以后，逐步吞并河北、幽州和并州，名义上仍受汉国的官爵。麟嘉三年（318 年）汉主刘聪死后平阳发生内乱，刘曜在长安称帝并改国号为赵。石勒派去祝贺的使者被刘曜所杀，双方决裂。大兴二年（319 年）十一月，他在襄国自称大单于、赵王，以河北二十四郡为赵国。为了区别，史家称刘曜的政权为前赵，石勒的为后赵。

  此后几年，两赵各自扩张：前赵经营关陇，后赵向南夺取了祖逖收复的河南之地，向东取得青州。咸和三年（328 年）两国在洛阳一带决战。刘曜先在高候大败石虎，随后围攻金墉城。石勒不顾部下劝阻，亲率大军渡河来救，十二月在洛阳城西生擒刘曜。次年后赵军西进，前赵的太子弃长安退守上邽，九月被石虎攻灭。

  至此，除辽东的慕容部、凉州的张氏和塞北的拓跋部以外，淮河以北都归后赵所有。咸和五年（330 年）石勒称帝。后赵是十六国前期疆域最大的政权，石勒死后由石虎继续统治了十五年。
sources: []
recalled:
  - 《晋书·石勒载记》
  - 《晋书·刘曜载记》
