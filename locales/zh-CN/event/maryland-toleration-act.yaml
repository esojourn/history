name: "马里兰信仰容忍法"
summary: "马里兰议会应巴尔的摩勋爵要求通过的法令，保障信三位一体的各派基督徒信仰自由。"
body: |-
  《历史的轨迹》第四十一章说，马里兰是天主教徒巴尔的摩勋爵的领地，他是第一个把宗教自由写进法律的人。但他和威廉斯不同：为了殖民地兴旺，他必须把土地卖给移民，而当时来美洲的大多是复原教徒，很少天主教徒，为保障领地上少数的天主教徒，只得宣布宗教自由，所以这是一种“政策”而不是一项“原则”。不信三位一体的人不在容忍之列，可处死刑并没收财产。

  书中说，1649 年在巴尔的摩勋爵的要求下，马里兰议会通过了《信仰容忍法》，虽然目的也是出于政策，仍是美洲宗教自由史上的一个里程碑。1692 年巴尔的摩家族失去了在美洲的产业，马里兰成为王室殖民地，英国国教在那里设立起来。据一般记载，这项法令通过时，英国内战中清教徒一方已经得势，马里兰的复原教徒移民日多，法令也有保护天主教徒不受多数压迫的用意；1654 年清教徒一度控制马里兰，就废止了这项法令，后来又恢复。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十一章“教会进入新大陆” https://wellsofgrace.com/books/spiritual/2000years/html/chapter46.html"
