name: 明朝建立
summary: 1368 年正月朱元璋在应天称帝，国号大明；八月徐达攻入大都，元朝统治中原结束。
body: |-
  至正二十七年（公元 1367 年）九月，朱元璋攻下平江，消灭了张士诚，随后浙东的方国珍投降，长江中下游已全部在他的控制之下。十月，他以徐达为征虏大将军、常遇春为副将军，率军北伐。北伐前朱元璋发布檄文，由宋濂起草，提出“驱逐胡虏，恢复中华，立纲陈纪，救济斯民”，号召北方的士民响应。他定下的战略是先取山东，再下河南，然后控制潼关，最后进取大都。

  至正二十八年（1368 年）正月初四，朱元璋在应天即皇帝位，国号大明，建元洪武，是为明太祖，应天成为明朝的都城。与此同时，北伐军按计划攻下山东、河南，占据潼关。闰七月，明军攻下通州，元顺帝带着后妃、太子连夜从大都的健德门出城，北走上都。八月初二，徐达率军进入大都，元朝在中原的统治宣告结束，大都随后被改名为北平。

  元顺帝北走以后，元朝的残余势力在漠北继续存在，史称北元，扩廓帖木儿等人仍与明朝对抗，明朝前期多次出兵北伐。中国泳道上“元”一段到 1368 年为止；北方草原泳道上的“蒙古帝国”一段也到这一年为止，此后是“蒙古诸部”。

  明朝建立结束了元朝九十多年的统治（从 1279 年统一全国算起），朱元璋此后在位三十年，废除丞相，加强君主集权，明朝延续了二百七十多年，直到 1644 年。
sources: []
recalled:
  - 《明史·太祖本纪》
  - 《明太祖实录》
  - 宋濂《谕中原檄》
