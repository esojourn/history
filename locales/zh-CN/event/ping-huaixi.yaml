name: 平淮西
summary: 815—817 年唐朝讨伐割据淮西的吴元济，李愬雪夜奇袭蔡州将其擒获，淮西平定。
body: |-
  淮西节度使辖申、光、蔡三州，治所在蔡州，地处中原腹地，靠近东都洛阳和江淮漕运要道。自李希烈以来，淮西长期不服从朝廷，节度使在将领之间传袭。元和九年（公元 814 年）节度使吴少阳死，他的儿子吴元济隐瞒死讯，自领军务，四出劫掠。

  元和十年（815 年）正月，唐宪宗下令讨伐，调集周围十几个藩镇的兵马。淮西兵力不多，但地形复杂，士兵骁勇，唐军各部互相观望，又有宦官监军牵制，战事拖延不决。成德的王承宗、淄青的李师道暗中支持淮西，同年六月，主战的宰相武元衡在上朝途中被刺杀，御史中丞裴度也被刺伤。朝中不少人主张罢兵，宪宗没有动摇，任命裴度为宰相。

  元和十二年（817 年）七月，裴度请求亲赴前线，以彰义军节度使、淮西宣慰处置使的身份到郾城督战，奏请撤回各军的宦官监军，让将领自行指挥，军心为之一振。唐、随、邓节度使李愬善待降将，从他们那里摸清了淮西的虚实。十月，趁淮西的精兵被牵制在洄曲前线，李愬率九千人（据《资治通鉴》）在风雪之夜从文城栅出发，夜半到达蔡州城下，爬上城墙，打开城门，次日擒获吴元济。淮西各地随即投降，吴元济被押到长安斩首。

  淮西平定对其他藩镇震动很大，成德、淄青、幽州等镇随后相继归顺（另见“元和中兴”条）。韩愈随裴度出征，战后奉命写了《平淮西碑》，碑文以裴度为首功，李愬的妻子是唐安公主的女儿，入宫诉说碑文不公，宪宗下令磨去韩愈的碑文，改由段文昌重写。李商隐后来作《韩碑》一诗，为韩愈鸣不平。
sources: []
recalled:
