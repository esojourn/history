name: 卡诺莎悔罪
aliases:
  - 卡诺莎之行
  - 卡诺撒事件
summary: 1077 年 1 月亨利四世到卡诺莎城堡外悔罪三天，得到教皇赦免。
body: |-
  1075 年教皇贵格利七世重申禁止俗人授职，亨利四世照旧任命主教。1076 年 1 月亨利在沃尔姆斯召集主教，宣布不再承认贵格利；2 月教皇在罗马的会议上革除他的教籍，禁止任何人尊他为王。《历史的轨迹》第十六章说，亨利要罗马人赶走教皇，没有人理会；教皇的宣告却在德意志掀起热烈的反应，诸侯正好有了不再效忠的理由。10 月诸侯开会决定：次年 2 月在奥格斯堡由教皇主持会议审理；一年之内亨利若得不到赦免，就失去王位。

  亨利决定抢在会议之前见到教皇。他带着王后、幼子和少数随从，在严冬翻越阿尔卑斯山。教皇正在北上的路上，听说亨利带兵前来，退入托斯卡纳女伯爵玛蒂尔达的卡诺莎城堡。

  《历史的轨迹》记述：1077 年 1 月 25 日亨利来到城堡，穿着悔罪者的粗毛长袍，光头赤足，在内门外的雪地上禁食站立；一连三天门都没有开，到 1 月 27 日黄昏才让他进去。他流泪俯伏，亲吻教皇的脚，教皇宣告赦罪。教皇事后写给德意志诸侯的信里也说，国王在门外赤足站了三天，在场的人都为他流泪求情。替他求情的有玛蒂尔达和亨利的教父、克吕尼院长于格。亨利起誓接受教皇对他与诸侯之争的裁断。通常把赦免的日子记作 1 月 28 日。

  该书认为，一般人把这一幕看作皇帝最深的屈辱，是误解了。亨利若等到奥格斯堡开会时还背着绝罚，王位必失；他以悔罪者的样子出现，教皇作为司铎就不能拒绝赦免。教皇让他等了三天，是因为自己在政治的顾虑和教会的责任之间犹豫了三天，“卡诺撒真正的戏剧，不是上演在庭院中，乃是上演在教皇心灵内”。亨利事实上逼出了赦令，保住了王位。

  诸侯仍在当年 3 月另立国王，内战和教皇与皇帝之争又延续了几十年。但这一幕留在后人的记忆里，后来的教皇常想起它；“去卡诺莎”成了屈服的代称。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十六章“教会被迫妥协” https://wellsofgrace.com/books/spiritual/2000years/html/chapter18.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
