name: 梭伦改革
summary: 公元前 594 年梭伦任执政官，取消债务，按财产划分公民等级。
body: |-
  公元前 6 世纪初，雅典的贫富冲突到了濒于内战的地步。据《雅典政制》，许多农民成了“六一汉”，要把收成的六分之一交给富人，交不出的连同妻儿可以被抓去做奴隶；借债都以人身作抵押。前 594 年（一说前 593 年），双方同意推举梭伦为执政官和调停人，授权他修改法律。

  他首先宣布“解负令”：取消现有的债务，禁止今后以人身抵押借债，把因债被卖到外邦的雅典人赎回。他在诗里说，他拔掉了田地里到处插着的界碑，使从前受奴役的黑色大地得到自由。据说他还改动了度量衡和币制，禁止除橄榄油以外的农产品出口，鼓励手工业，并规定父亲没有让儿子学会一门手艺的，儿子可以不赡养他。

  在政制方面，他按一年的收成把公民分成四等：五百斗级、骑士级、双牛级、雇工级。高级官职由前两等或前三等担任，最低一等不能任官，但可以出席公民大会，并在审理上诉的民众法庭里当陪审员。据《雅典政制》和普鲁塔克，他另设了一个四百人议事会，每个部落出一百人；这个机构是否真的存在，学者有怀疑。他又规定任何人都可以替受害者提出控告。亚里士多德认为，取消人身抵押、许人代为控告、许人向法庭上诉，是他的措施里最有利于平民的三项。

  改革没有满足任何一方：贫民指望重分土地，贵族指望恢复原状。梭伦在诗里说，自己像一头被群犬围住的狼，又说他举着坚固的盾站在双方之间，不让任何一方不义地取胜。他离开雅典后，各派重新相争，约三十年后庇西特拉图建立了僭主统治，但梭伦的法律大体上保留了下来。后世的雅典人把他看作民主政治的奠基人。
sources: []
recalled:
  - 《雅典政制》第 2、5—13 章
  - 普鲁塔克《梭伦传》第 13—25 章
  - 梭伦诗残篇（韦斯特编号第 5、36、37 首）
