name: 辛布里战争
summary: 北方迁来的辛布里人、条顿人屡败罗马军队，最后被连任执政官的马略歼灭。
body: |-
  公元前 113 年至前 101 年罗马与北方迁来的辛布里人、条顿人等部族的战争。辛布里人和条顿人据说来自日德兰半岛一带，带着家眷和车辆南下寻找土地。他们是日耳曼人还是凯尔特人，古代作家说法不一。

  前 113 年他们出现在东阿尔卑斯山，执政官卡尔波设伏偷袭，反在诺雷亚被击败。部族没有进入意大利，转向西面的高卢，此后几年又连败几支罗马军队。前 105 年 10 月，执政官马利乌斯·马克西穆斯和前执政官凯皮奥各率一军在罗讷河边的阿劳西奥，凯皮奥出身贵族，不肯听命于“新人”出身的上司，两军分营而战，先后被歼。李维的摘要引史家瓦勒里乌斯·安提亚斯说，死了八万士兵和四万随营人员，这是坎尼之后罗马最惨重的失败。

  意大利门户洞开。刚刚结束朱古达战争的马略被缺席选为前 104 年的执政官，此后连年连任。辛布里人却转去了西班牙，条顿人在高卢游荡，给了他三年时间。他照旧招募无产者，严加训练，让士兵自带行装和工具。

  前 102 年部族分两路进攻意大利。马略在罗讷河下游坚守营垒，放条顿人和安布罗内人从营前走过，据普鲁塔克，队伍走了六天；然后尾随到阿奎埃·塞克斯提埃，以伏兵夹击，全歼条顿人。辛布里人从东面翻过阿尔卑斯山，同僚执政官卡图卢斯退到波河以南。前 101 年夏，马略与卡图卢斯合兵在韦尔切莱附近的平原迎战，辛布里人在暑热和尘土中溃败。普鲁塔克说被杀的有十二万，被俘六万，妇女杀死孩子后自尽；这些数字不可尽信。

  战后马略被称为罗马的第三位建城者。连任执政官的先例、由无产者组成并依附统帅的军队，都由这场战争而来。
sources: []
recalled:
  - 普鲁塔克《马略传》第 11—27 章
  - 李维《建城以来史》卷六十三至卷六十八摘要
  - 斯特拉波《地理学》卷七第 2 章
  - 弗洛鲁斯《罗马史纲要》卷一第 38 章
