name: 秦灭西周
summary: 前 256 年秦灭西周，周赧王去世，延续约八百年的周朝终结。
body: |-
  战国后期，周王室早已名存实亡，直接控制的土地只有洛阳周围，而且分裂为西周和东周两个小国，周赧王寄居在西周。公元前 256 年，秦国攻取韩国的阳城、负黍，西周君害怕，背弃秦国，与各国合纵，率领各国的精兵出伊阙攻秦，想切断秦国通往阳城的道路。

  据《史记·周本纪》和《秦本纪》，秦昭襄王大怒，派将军摎进攻西周。西周君逃到秦国，向秦王叩头请罪，献出全部三十六座城邑和三万人口。秦王接受了，放西周君回国。这一年周赧王去世，周的百姓纷纷东逃。秦国取走了周的九鼎宝器（后世有九鼎沉没于泗水的传说），迁西周公于𢝔狐。

  七年后，即公元前 249 年，秦庄襄王又灭了东周。从周武王克商算起，周朝延续了约八百年，是中国历史上历时最长的朝代。

  按断代工程的年表，西周约二百七十多年，东周五百一十多年，合计约八百年。东周灭亡后，秦国不到三十年就先后灭了六国，于公元前 221 年统一中国。周人建立的礼乐制度和宗法观念却深刻影响了后世，孔子说“周监于二代，郁郁乎文哉！吾从周”，表达的就是对周代文化的推崇。

  周朝的灭亡没有引起各国的强烈反应，说明周天子“天下共主”的地位早已名存实亡。
sources: []
recalled:
  - 《史记·周本纪》
  - 《史记·秦本纪》
