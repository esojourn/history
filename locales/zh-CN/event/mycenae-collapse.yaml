name: 迈锡尼诸宫殿毁灭
summary: 约公元前 1200 年希腊本土的迈锡尼宫殿相继被毁，文字失传。
body: |-
  公元前 16 世纪起，希腊本土出现了一批以设防的宫殿为中心的小王国，重要的有阿尔戈斯平原上的迈锡尼和梯林斯、西南部的皮洛斯、中部的底比斯等，现代人以其中最著名的遗址统称为“迈锡尼文明”。1876 年德国人施里曼在迈锡尼发掘出随葬大量金器的竖穴墓。各地宫殿出土的线形文字 B 泥板是用希腊语写的账目，记录土地、牲畜、织物、青铜和人员，显示出由宫殿集中掌管的经济；泥板上已有宙斯、赫拉、波塞冬等后来希腊诸神的名字。

  约前 1200 年前后的几十年里，这些宫殿相继毁于大火。皮洛斯的泥板正是因为被这场火烧硬才保存下来，其中有派人看守海岸的记录。宫殿没有重建，线形文字 B 随之失传，石砌的大建筑和精细的工艺也中断了。此后三四百年希腊人口减少，聚落变小，没有留下文字，旧称“黑暗时代”；铁器在这一时期逐渐取代青铜。

  毁灭的原因没有定论。同一时期地中海东部普遍动荡：小亚细亚的赫梯帝国瓦解，叙利亚沿海的乌加里特被毁，埃及的铭文记载了与来自海上的各族作战。学者提出过外敌入侵、内部叛乱、地震、连年干旱、贸易网络断裂等解释，多数人认为是几种因素叠加。希腊人自己的传说把这一变动说成“赫拉克勒斯子孙的回归”，即多利亚人南下占领伯罗奔尼撒；考古上找不到一次大规模入侵的明确痕迹。

  这一条的年代出自考古学的推定。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷一第 12 章
  - 文特里斯、查德威克《迈锡尼希腊语文献》（1956）
