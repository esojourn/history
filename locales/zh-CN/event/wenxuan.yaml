name: 《文选》编成
summary: 昭明太子萧统主持编成《文选》三十卷，是现存最早的诗文总集，唐宋时为士人必读。
body: |-
  梁武帝的太子萧统爱好文学，东宫藏书近三万卷，身边聚集了刘孝绰等许多文士。在他的主持下，东宫文士编成了一部诗文总集，共三十卷，后世称为《昭明文选》。成书时间一般推定在普通七年（公元 526 年）至中大通三年（531 年）萧统去世之间。

  《文选》收录先秦至梁代一百三十位左右作家的作品七百余篇，分为赋、诗、骚、七、诏、册、令、教、表、书、檄、序、颂、赞、论、铭、诔、碑文、祭文等三十多类，赋和诗又按题材细分。和《诗品》一样，它不收在世作家的作品。萧统在《文选序》中说明了选文的标准：经书、诸子和史书原则上不收，只选史书中的赞、论、序、述，因为这些“事出于沉思，义归乎翰藻”，即内容经过深思、表达富有文采。

  《文选》问世后影响极大。隋唐以诗赋取士，《文选》成为读书人学习写作的范本。唐高宗时李善为之作注，引书一千多种；唐玄宗时又有吕延济等五人的“五臣注”。据南宋陆游《老学庵笔记》，宋初有“文选烂，秀才半”的谚语，意思是把《文选》读熟了，就有一半把握考中。研究《文选》的学问被称为“选学”。

  许多先秦两汉魏晋的名篇，如宋玉的赋、《古诗十九首》、曹丕的《典论·论文》、李密的《陈情表》等，都靠《文选》得以完整流传。
sources: []
recalled:
  - 萧统《文选序》
  - 《梁书·昭明太子传》
  - 陆游《老学庵笔记》
