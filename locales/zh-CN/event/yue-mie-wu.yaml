name: 越灭吴
summary: 越军围吴三年，前 473 年城破，夫差自杀，吴国灭亡。
body: |-
  黄池之会后吴国元气大伤，越国则经过多年的“生聚”“教训”，国力日强。公元前 478 年，越军在笠泽大败吴军。公元前 475 年，越军包围吴都，前后围困三年。

  公元前 473 年，吴都被攻破，夫差退守姑苏山，派人向勾践求和，请求像当年越国一样成为属国。勾践想答应，范蠡认为当年上天把越国赐给吴国而吴国不取，现在不能违背天意，坚决反对。勾践提出把夫差安置在甬东，给他百户人家，夫差推辞说自己老了，不能再事奉君王，于是自杀。据《史记·吴太伯世家》，他死前蒙住自己的脸，说：“吾无面以见子胥也。”

  灭吴后，勾践率军渡过淮河，与齐、晋等诸侯在徐州会盟，向周王室进贡。周元王派人赐给勾践祭肉，任命他为“伯”。越国一度称霸江淮之间。范蠡随后离开越国，文种被勾践赐死。

  从夫椒之战后越国休养生息算起，越灭吴前后约二十年，应了伍子胥“二十年之外，吴其为沼乎”的预言。越国此后一度北上争雄，据说曾迁都琅邪，但到战国中期国势衰落，后来被楚国打败。

  吴国自称周太伯之后，在寿梦时开始称王、与中原交往，到夫差时灭亡。吴地此后归越，战国后期又归于楚。
sources: []
recalled:
  - 《史记·越王勾践世家》
  - 《史记·吴太伯世家》
  - 《国语·越语下》
  - 《左传》哀公二十二年
