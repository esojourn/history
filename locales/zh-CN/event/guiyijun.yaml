name: 张议潮与归义军
summary: 848 年张议潮驱逐吐蕃守将，收复河西，851 年唐朝设归义军，以他为节度使。
body: |-
  八世纪后期，河西走廊各州相继被吐蕃占领，沙州（敦煌）在吐蕃统治下度过了六十年左右。九世纪四十年代吐蕃王朝陷入内乱，河西的吐蕃守军势力衰弱（另见“吐蕃王朝崩溃”条）。

  大中二年（公元 848 年），沙州的豪族张议潮联合当地汉人和各族民众起事，赶走了吐蕃的守将，占领沙州，随后又收复了瓜州。由于河西与长安之间的道路仍被吐蕃和其他部族阻隔，他派出几批使者分别取道东西各方前往长安报捷，其中一批经过天德军辗转到达。大中五年（851 年），他派兄长张议潭带着沙、瓜、伊、西、甘、肃、兰、鄯、河、岷、廓十一州的地图和户籍入朝，唐宣宗非常高兴，在沙州设立归义军，任命张议潮为节度使，管辖河西诸州。咸通二年（861 年）张议潮又收复凉州。

  归义军名义上隶属唐朝，实际上由张氏家族世代统治，在东西两面都有回鹘等势力的包围下艰难维持。张议潮在咸通八年（867 年）入朝留居长安，由侄子张淮深主持；十世纪初张氏衰落，曹议金接掌归义军，曹氏又统治了一百多年，直到十一世纪前期。

  敦煌藏经洞中保存的大量文书，有许多是归义军时期写成的，记录了这一时期河西的政治、经济和宗教生活。莫高窟第 156 窟的壁画《张议潮统军出行图》和《宋国夫人出行图》，描绘了张议潮夫妇出行的盛大场面。
sources: []
