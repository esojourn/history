name: 元朝建立
summary: 1271 年忽必烈取“大哉乾元”之意，定国号为“大元”，次年以新建的大都为都城。
body: |-
  忽必烈在 1260 年即大汗位后，就开始采用中原王朝的制度，建立年号“中统”，设立中书省等机构。至元元年（公元 1264 年）他改燕京为中都，至元四年（1267 年）起在金中都旧城的东北另建新城，由刘秉忠主持规划，郭守敬负责水利工程。

  至元八年（1271 年）十一月，忽必烈采纳刘秉忠等人的建议，颁布《建国号诏》，取《易经》“大哉乾元”的意思，定国号为“大元”。诏书说，以往的王朝多以初兴之地或所封的爵邑为国号，而元朝取的是“乾元”的大义。这是中国历史上第一个不以地名或封号命名的王朝国号。次年，新城被正式命名为大都，成为元朝的都城；开平改称上都，皇帝每年夏季到上都避暑处理政务，形成两都巡幸的制度。

  关于元朝从哪一年算起，有 1260 年（忽必烈即位、建元中统）、1271 年（定国号）、1279 年（灭南宋、统一全国）等不同的算法。本站中国泳道上“元”一段从 1279 年开始，此前的 1271 至 1279 年仍在“南宋与金”一段中。元朝统一全国后，疆域北到西伯利亚，南到南海，西南包括吐蕃，东北到鄂霍次克海，是中国历史上疆域最大的王朝之一。
sources: []
recalled:
  - 《元史·世祖本纪》
  - 《元史·刘秉忠传》
  - 《元典章》所收《建国号诏》
