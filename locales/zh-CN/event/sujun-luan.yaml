name: 苏峻之乱
summary: 流民帅苏峻拒绝被征入朝而起兵，攻陷并洗劫建康，一年多后被陶侃、温峤等联军平定。
body: |-
  晋明帝去世后，庾亮以皇帝舅父的身份执政。驻在历阳的苏峻因平定王敦有功，手握精兵，逐渐不听约束；镇守寿春的豫州刺史祖约则因没有列名顾命、请求多不获准而心怀怨恨。咸和二年（公元 327 年），庾亮不听王导、卞壸等人的劝阻，下诏召苏峻入朝任大司农。苏峻认定这是要加害于他，便与祖约联合，以诛庾亮为名起兵。

  咸和三年（328 年）二月，苏峻率军渡江，在建康城外击败朝廷的军队，尚书令卞壸父子战死，庾亮逃往寻阳。苏峻的士兵进城后大肆抢掠，据《晋书·苏峻传》，官府库藏的布帛金银被搬取一空，官员和士女被剥去衣服。王导等大臣守在八岁的成帝身边，苏峻没有加害。五月，苏峻把成帝迁到石头城。

  江州刺史温峤与庾亮在寻阳共推荆州刺史陶侃为盟主，三人合兵东下，会稽等地的官员也起兵响应。联军水军占优，陆战屡次失利，双方在石头城下相持了几个月。九月，苏峻在阵前坠马被杀，其弟苏逸继续据守。次年二月，联军攻下石头城，叛乱结束，逃到后赵的祖约后来被石勒所杀。

  建康的宫殿在战火中焚毁，有人提议迁都豫章或会稽，王导坚持不迁，朝廷在废墟上重建。庾亮引咎出镇，陶侃、温峤回到上游，朝政仍由王导主持。
sources: []
recalled:
  - 《晋书·苏峻传》
  - 《晋书·庾亮传》
  - 《晋书·陶侃传》
  - 《资治通鉴》卷九十三、九十四
