name: 国史之狱
summary: 崔浩主持修撰的北魏国史刻石立于路旁，因直书拓跋先世事迹被告发，崔浩及其姻族被诛。
body: |-
  魏太武帝命崔浩主持修撰北魏的国史，要求据实而写。国史修成后，著作令史闵湛、郄标建议把它刻在石碑上，以显示崔浩的直笔，崔浩采纳了，太子拓跋晃也表示赞同。据《魏书·崔浩传》，石碑立在平城西郊天坛以东三里，方圆百步，耗费的人工达三百万。

  书中如实记载了拓跋氏先世的事迹，往来行人看了议论纷纷。鲜卑贵族大为愤怒，向太武帝告发崔浩“暴扬国恶”。太平真君十一年（公元 450 年）六月，崔浩被处死，清河崔氏同族不论远近，以及与崔浩有姻亲关系的范阳卢氏、太原郭氏、河东柳氏，都被灭族，参与修史的官吏也多被处死。参与修史的高允因在太武帝面前直言而得到赦免。

  崔浩被杀的原因，史书说得并不十分清楚。除了国史一事，后世学者还提出了多种看法：如崔浩想按照汉族门第排定北方士族的高下，引起鲜卑贵族的怨恨；他权势过大，招致太武帝的猜忌等。此后北魏的修史工作中断了很长时间。
sources: []
recalled:
  - 《魏书·崔浩传》
  - 《魏书·高允传》
  - 《资治通鉴》卷一百二十五
