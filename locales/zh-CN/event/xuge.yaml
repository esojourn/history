name: 繻葛之战
summary: 前 707 年郑庄公在繻葛击败周桓王率领的诸侯联军，桓王中箭。
body: |-
  郑庄公兼任周王室的卿士，与周王室的矛盾由来已久。周桓王即位后，先分走庄公的权力，后来干脆夺去他的卿士之职，庄公于是不再朝见。公元前 707 年秋，桓王亲自率领周军和陈、蔡、卫三国的军队讨伐郑国。

  据《左传》桓公五年，郑国大夫子元分析说，陈国正有内乱，士兵无心作战，可以先攻陈军所在的左翼，蔡、卫两军必然随之溃逃，再集中兵力攻击王卒。郑军布下“鱼丽之阵”，先以战车冲击，步卒补其空隙。交战后陈、蔡、卫三军先溃，周军阵脚大乱，郑将祝聃射中了桓王的肩膀。祝聃请求追击，庄公说“君子不欲多上人，况敢陵天子乎”，下令停止追击。当晚，庄公派大夫祭足去慰问桓王和他的左右。

  繻葛之战是诸侯第一次公开与周天子兵戎相见并且获胜，周王“共主”的权威从此大为削弱，诸侯相互兼并、争霸的局面随之展开。

  郑军所布的“鱼丽之阵”（“先偏后伍，伍承弥缝”）是先秦战车与步兵协同作战的一种阵法，常被军事史家引用。郑庄公战后派人慰问桓王，表明他虽然胜了，仍不愿公然背负犯上的名义。此后诸侯不再把朝觐周王当作必须履行的义务。

  这一战标志着“礼乐征伐自天子出”的时代已经过去。
sources: []
recalled:
  - 《左传》桓公五年
  - 《史记·郑世家》
