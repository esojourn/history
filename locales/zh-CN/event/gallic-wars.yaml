name: 高卢战争
summary: 恺撒用八年征服高卢全境，两渡莱茵河、两征不列颠，并得到一支只忠于他的军队。
body: |-
  公元前 58 年至前 50 年恺撒征服高卢的战争。在此之前，罗马只据有地中海沿岸的山北高卢行省；行省以北的高卢分属数十个部落，没有统一的政权。主要史料是恺撒自己写的《高卢战记》，这是胜利者为罗马读者写的报告，数字和动机都须谨慎对待。

  前 58 年，住在今瑞士的赫尔维提人举族西迁，恺撒说有三十六万八千人。他以保护行省和盟友为由击败他们，迫使幸存者返回故地。同年他又击败渡过莱茵河的日耳曼首领阿里奥维斯图斯。军团没有撤回行省，留在高卢过冬。前 57 年他北上征服比利时人各部。前 56 年他的舰队在大西洋岸击败善于航海的维内蒂人。

  前 55 年两支日耳曼部落渡过莱茵河，恺撒在谈判期间扣押其首领后突袭，自称对方有四十三万人；据普鲁塔克，小加图在元老院提议把他交给日耳曼人抵罪。他随后在莱茵河上十天架起一座木桥，过河示威后拆桥而回。这年和次年他两次渡海到不列颠，第二次渡过泰晤士河，接受当地首领名义上的归顺。

  前 54 年冬，埃布隆人首领安比奥里克斯诱歼了一个半军团，这是恺撒在高卢最大的损失。前 52 年阿维尔尼人维钦托利联合高卢中部各部起事，采取坚壁清野的办法，恺撒在格尔戈维亚受挫，随后在阿莱西亚围城并击退援军，维钦托利投降。前 51 年他攻下乌克塞洛杜努姆，下令砍掉守军的手。

  普鲁塔克说，恺撒在高卢攻取八百座城，与三百万人交战，杀一百万，俘一百万。这些数字无从核实，但人口损失和被卖为奴者的数目无疑极大。高卢成为罗马行省，莱茵河成为边界，此后几百年间当地改用拉丁语，是法语的由来。恺撒得到了一支久经战阵、只忠于他个人的军队和大量财富；他的任期将满时如何交卸兵权，成了内战的直接原因。
sources: []
recalled:
  - 恺撒《高卢战记》
  - 普鲁塔克《恺撒传》第 15—27 章
  - 卡西乌斯·狄奥《罗马史》卷三十八至卷四十
  - 苏维托尼乌斯《神圣的尤利乌斯传》第 25 章
