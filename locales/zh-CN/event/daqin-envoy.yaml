name: 大秦王安敦遣使
summary: 公元 166 年，自称大秦王安敦所遣的使者经日南到达汉朝。
body: |-
  《后汉书·西域传》“大秦”条记载：“至桓帝延熹九年，大秦王安敦遣使自日南徼外献象牙、犀角、瑇瑁，始乃一通焉。”延熹九年即公元 166 年。日南是汉朝最南的郡，在今越南中部，使者显然是从海路而来。《后汉书·桓帝纪》在这一年也记有“大秦国王遣使奉献”。

  “安敦”一般认为是罗马皇帝安东尼的音译。公元 166 年在位的是马可·奥勒留·安东尼；他的前任安东尼·庇护死于 161 年，考虑到路途遥远，也有学者认为使者出发时的皇帝是后者。

  《西域传》紧接着写道：“其所表贡，并无珍异，疑传者过焉。”象牙、犀角、玳瑁都是南海和印度洋沿岸的物产，并非罗马特有。因此许多学者推测，这些人可能是从事东方贸易的罗马商人，假托皇帝的名义以求通商，而不是正式的使节。罗马方面的史料中没有派遣这次使团的记载。

  无论来者的身份如何，这是中国史书中罗马人到达中国的第一条有明确年份的记录。此前永元九年（97 年）班超派甘英出使大秦，中途在条支折回。考古工作者在越南南部的沃澳遗址发现过二世纪的罗马金质徽章，可以印证当时地中海世界与南海之间存在海上贸易。
sources: []
recalled:
  - 《后汉书·西域传》
  - 《后汉书·孝桓帝纪》
