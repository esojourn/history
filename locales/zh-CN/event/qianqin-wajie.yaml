name: 前秦瓦解
summary: 淝水战后，鲜卑、羌等各族首领纷纷自立，后燕、后秦、北魏等国建立，前秦十年后灭亡。
body: |-
  淝水之战后，苻坚回到长安，他一手建立的统一局面在一年内土崩瓦解。太元九年（公元 384 年）正月，慕容垂在河北称燕王，围攻邺城，是为后燕。三月，被迁到关中的鲜卑人拥立慕容泓，后来由慕容冲统领，进攻长安，史称西燕。四月，羌人将领姚苌在渭北自称秦王，是为后秦。

  长安被慕容冲围困了一年，城中粮尽。太元十年（385 年）五月苻坚出奔，八月在新平被姚苌缢杀。西燕的鲜卑人攻入长安后大肆抢掠，随后东归故土，中途在并州南部停下建国。姚苌进入长安称帝。同一年，鲜卑人乞伏国仁在陇西自立，是为西秦；奉苻坚之命远征西域的吕光回师占据凉州，后来建立后凉。太元十一年（386 年）正月，拓跋珪在塞北重建代国，随即改称魏。东晋也乘机北进，一度推进到黄河沿岸。

  前秦的宗室和旧将仍在关中、陇右坚持。苻坚的族孙苻登与姚苌相持多年，太元十九年（394 年）被姚兴击败杀死，前秦灭亡。同年后燕灭西燕。此后关东属后燕，关中属后秦，塞北的北魏正在兴起。
sources: []
