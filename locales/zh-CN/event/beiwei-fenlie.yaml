name: 北魏分裂
summary: 孝武帝西奔关中投宇文泰，高欢另立孝静帝迁都邺城，北魏分裂为东魏、西魏。
body: |-
  永安三年（公元 530 年）孝庄帝刺杀尔朱荣，尔朱兆随即攻入洛阳杀死孝庄帝，尔朱氏先后拥立了两位傀儡皇帝。普泰元年（531 年），原属尔朱荣部下、统领六镇降户的高欢在信都起兵讨伐尔朱氏，次年在韩陵大败尔朱兆等人的联军，进入洛阳，拥立平阳王元修为帝，即孝武帝。高欢本人坐镇晋阳，遥控朝政。

  孝武帝不甘受制，暗中联络据守关中的贺拔岳。永熙三年（534 年），贺拔岳被高欢唆使的侯莫陈悦杀害，部下推举宇文泰统领其众。同年，孝武帝调集河南诸州的兵马，名义上讨伐梁朝，实际上是防备高欢；高欢也率军南下。七月，孝武帝带着少数随从西奔长安，投靠宇文泰。

  高欢进入洛阳，十月另立十一岁的元善见为帝，即孝静帝，并以洛阳靠近西魏和梁朝为由，把都城迁到邺。据《魏书》，诏令下达三天就启程，洛阳四十万户百姓仓促上路。这一政权史称东魏。年底，孝武帝被宇文泰毒死，次年正月，宇文泰另立元宝炬为帝，即西魏文帝，定都长安。

  东魏占有河北、河南、山东和山西，人口众多，物产丰富；西魏只有关中和陇右，实力远逊。此后双方以黄河和汾水一带为战场，在沙苑、河桥、邙山、玉壁等地反复交战。550 年高洋代东魏建立北齐，557 年宇文觉代西魏建立北周，东西对峙的局面一直持续到 577 年北周灭齐。
sources: []
recalled:
