name: 居鲁士下诏与首批归回
summary: 波斯王居鲁士准许被掳的犹太人回耶路撒冷重建圣殿，首批人归回。
body: |-
  公元前 539 年，波斯王居鲁士（和合本作“古列”）攻取巴比伦。此时距尼布甲尼撒攻破耶路撒冷、焚毁圣殿已近五十年，被掳的犹大人住在巴比伦各处。《耶利米书》25:11–12、29:10 曾说为巴比伦所定的七十年满了以后，百姓要归回；《以斯拉记》1:1 说居鲁士下诏，是为要应验耶和华借耶利米的口所说的话。

  据《以斯拉记》1:1–4 和《历代志下》36:22–23，古列元年，王通告全国：耶和华天上的神嘱咐他在犹大的耶路撒冷建造殿宇，凡属他子民的可以上耶路撒冷去，留下的人要用金银、财物、牲畜帮助他们。这里的元年指他统治巴比伦的第一年，即公元前 538 年。《以斯拉记》6:3–5 另录有一份亚兰文的记录，写明殿的尺寸，经费由王库支出。王又把尼布甲尼撒掠来的圣殿器皿点交给犹大的首领设巴萨，1:11 记金银器皿共五千四百件。

  《以斯拉记》第 2 章列出归回者的名单，为首的是所罗巴伯和耶书亚；2:64–65 记会众共四万二千三百六十名，另有仆婢七千三百三十七名。《尼希米记》第 7 章有一份大致相同的名单。他们各归本城，到七月聚集在耶路撒冷，筑坛献祭（第 3 章）。首批人抵达的确切年份圣经没有写明，本条取下诏之年。

  圣经以外，居鲁士圆柱的铭文记载他把若干地方的神像送回原处、让居民返回故地，但没有提到犹太人；学者一般认为，圣经所记的诏令与这种做法相合。并非所有被掳的人都回去了，此后巴比伦一带一直有犹太人居住。
sources: []
recalled:
  - 《以斯拉记》第 1—3 章、6:3–5
  - 《历代志下》36:22–23
  - 《耶利米书》25:11–12、29:10
  - 《尼希米记》第 7 章
  - 居鲁士圆柱铭文
