name: 鹅湖之会
summary: 1175 年朱熹与陆氏兄弟在鹅湖寺辩论为学之方，是理学与心学分野的标志。
body: |-
  淳熙二年（公元 1175 年）春，浙东学者吕祖谦到福建拜访朱熹，两人合编了《近思录》。吕祖谦知道朱熹与江西的陆九龄、陆九渊兄弟在学术见解上有分歧，想调和双方，于是约他们在信州铅山的鹅湖寺相会。这年六月，朱熹、吕祖谦与陆氏兄弟以及双方的一些门人在鹅湖寺聚会，讨论了几天。

  双方争论的焦点是“为学之方”。朱熹主张“道问学”，认为应当先广泛读书、格物穷理，然后归于简约；陆氏兄弟主张“尊德性”，认为应当先发明人的本心，然后再博览。据记载，陆九龄在会上先诵读了一首诗，陆九渊随即和诗，有“易简工夫终久大，支离事业竟浮沉”之句，讥讽朱熹的方法支离烦琐，朱熹听了很不高兴。陆九渊还想质问朱熹，尧舜之前有什么书可读，被陆九龄劝止。双方没有达成一致，不欢而散。

  鹅湖之会是理学内部“程朱理学”与“陆王心学”分野的标志性事件。会后双方仍保持往来，三年后朱熹在和陆九龄的诗中写道“旧学商量加邃密，新知培养转深沉”。淳熙八年（1181 年）陆九渊到南康拜访朱熹，在白鹿洞书院讲学。后人在鹅湖寺旁建了鹅湖书院，以纪念这次论学。淳熙十五年（1188 年）陈亮到铅山拜访辛弃疾，两人相聚十天，原本约朱熹前来，朱熹没有赴约，后人也把这次聚会称为“第二次鹅湖之会”。
sources: []
recalled:
  - 《象山先生全集·年谱》
  - 《宋元学案·象山学案》
  - 朱熹《鹅湖寺和陆子寿》
