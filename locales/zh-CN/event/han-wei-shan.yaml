name: 曹丕代汉
summary: 公元 220 年十月，汉献帝让位于魏王曹丕，汉朝终结，魏朝建立。
body: |-
  建安二十五年（公元 220 年）正月，魏王曹操在雒阳去世，太子曹丕继任丞相、魏王。自建安元年献帝迁到许都以来，朝廷大权一直在曹操手中，汉朝的皇帝只保有名号。曹操生前有人劝他称帝，他没有接受。

  曹丕继位后，各地接连报告出现黄龙、凤凰、麒麟等祥瑞。据《三国志·魏书·文帝纪》及裴松之注所引的《献帝传》，这年十月，献帝派兼御史大夫张音持节，捧着皇帝的玺绶和册书，把帝位让给魏王。曹丕按惯例多次上书推辞，群臣则一再上表劝进。来回往复多日之后，他在许都以南的繁阳筑起高坛，登坛接受帝位，祭告天地，改年号为黄初，国号魏。

  即位后，他追尊父亲曹操为武皇帝，封献帝为山阳公，食邑一万户，准许他在封国内使用汉朝的历法，以天子的礼仪祭祀祖先，上书不必称臣。同年十二月，魏定都雒阳。

  汉朝自公元前 202 年刘邦称帝起，中间除去王莽的十几年，前后延续四百余年，至此结束。消息传到成都，有传言说献帝已被害，刘备为他发丧，次年以继承汉统的名义称帝；孙权则先向魏称臣，受封吴王，几年后也自立年号。记述这次禅让的两块石碑“受禅表”和“公卿将军上尊号奏”，至今保存在河南省临颍县的受禅台遗址附近。
sources: []
recalled:
  - 《三国志·魏书·文帝纪》及裴松之注引《献帝传》
  - 《后汉书·孝献帝纪》
