name: 高平陵之变
summary: 公元 249 年司马懿趁曹爽随皇帝出城谒陵发动政变，夺取曹魏大权。
body: |-
  景初三年（公元 239 年）魏明帝去世，八岁的曹芳即位，大将军曹爽与太尉司马懿同受遗诏辅政。曹爽是宗室曹真之子，他任用何晏、邓飏、丁谧等人，把司马懿升为没有实权的太傅，又让弟弟们掌握禁军。正始五年（244 年）他率军伐蜀，无功而返。正始八年起司马懿称病不再上朝。据《晋书·宣帝纪》，曹爽的亲信李胜将赴外任，前去辞行并探看虚实，司马懿装出病重昏聩的样子，李胜回报说他已不足为虑。

  嘉平元年（249 年）正月，曹芳出城去高平陵祭扫明帝的陵墓，曹爽兄弟全都随行。司马懿随即以皇太后的名义下令关闭雒阳各城门，占据武库，派人接管曹爽兄弟的军营，自己率兵出城，驻在洛水浮桥，上奏列举曹爽的罪状，请求罢免他们。长子司马师事先暗中蓄养的三千人这时也集合起来，把守宫门。

  曹爽扣下奏章，不知所措。大司农桓范逃出城来，劝他护送皇帝到许昌，以天子的名义调集各地军队讨伐司马懿。司马懿则派人传话，并指着洛水发誓，说只是免去他们的官职。据《三国志·魏书·曹爽传》及裴松之注，曹爽犹豫了一夜，最后说自己不失为一个富家翁，交出兵权回到雒阳。

  几天之后，有人告发曹爽等人图谋篡位。曹爽兄弟和何晏、邓飏、丁谧、桓范等都被处死并诛灭三族。此后司马懿父子相继掌握朝政：两年后司马懿平定了王凌在淮南的反抗；司马师在公元 254 年废掉曹芳；司马昭执政时皇帝曹髦被杀。高平陵之变十六年后，司马炎代魏称帝。
sources: []
recalled:
  - 《三国志·魏书·诸夏侯曹传》（曹爽）及裴松之注
  - 《晋书·宣帝纪》
  - 《资治通鉴》卷七十五
