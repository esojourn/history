name: 安东尼瘟疫
summary: 公元 165 年起一场瘟疫由东征的军队带回，在罗马帝国各地流行十余年。
body: |-
  公元 162 至 166 年，罗马与帕提亚交战，由马可·奥勒留的共治皇帝卢基乌斯·维鲁斯名义上统率。165 年罗马军攻下并洗劫了底格里斯河畔的塞琉西亚。《罗马帝王纪》和阿米阿努斯都说，瘟疫就是从那里起的：士兵在阿波罗神庙里撬开一只柜子，放出了瘴气。这是当时人的解释。军队回师，把病带到小亚细亚、希腊和意大利，166 年传到罗马城。

  医生盖伦这年正好离开罗马。168 至 169 年冬，两位皇帝在阿奎莱亚集结军队准备北征，营中疫病大作，盖伦被召到那里。他在几部著作里零散地记下了病人的症状：发热，口渴，呕吐腹泻，咽喉发炎，第九天前后全身出黑色的疹子，有的化脓结痂，结痂脱落的人多能活下来。后世学者据此推测，多数认为是天花，也有人主张是麻疹，无法确证。169 年初维鲁斯在回罗马途中去世，当时的说法是中风。

  疫情时起时伏，延续到 180 年前后。卡西乌斯·狄奥说，189 年又有一次大流行，罗马城里有时一天死两千人。全国死了多少人没有统计，现代学者的估计相差很大，从总人口的百分之一二到四分之一都有人主张；埃及的纳税名册显示，三角洲有些村庄的人口在这些年里大幅减少，军队退伍名单和各地建筑铭文的数量也明显下降。

  瘟疫正赶上多瑙河边境的战事。《罗马帝王纪》说，军中减员严重，马可·奥勒留把奴隶、角斗士和山民都招来当兵，又拍卖宫中的器物筹措军费。中国史书记东汉桓帝、灵帝年间也连年大疫，有学者猜测两者是同一场疫病沿商路传播，这没有证据。
sources: []
recalled:
  - 盖伦《治疗方法》卷 5 第 12 章
  - 《罗马帝王纪·卢基乌斯·维鲁斯传》第 8 章、《马可·奥勒留传》第 13、17、21 章
  - 阿米阿努斯·马尔凯利努斯《历史》卷 23 第 6 章
  - 卡西乌斯·狄奥《罗马史》卷 72 第 14 章
