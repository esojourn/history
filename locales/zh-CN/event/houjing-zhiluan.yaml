name: 侯景之乱
summary: 东魏降将侯景起兵叛梁，攻陷建康，梁武帝饿死，江南遭到空前破坏。
body: |-
  太清元年（公元 547 年），东魏大将侯景在高欢死后叛变，以河南之地降梁。梁武帝接纳了他，并派侄子萧渊明率军北上接应，结果萧渊明在寒山大败被俘，侯景也被东魏击败，只带着八百余人逃到梁朝的寿阳。此后梁朝与东魏议和，据《资治通鉴》，侯景伪造了一封东魏的书信，提出用萧渊明交换侯景，梁武帝回信说“贞阳旦至，侯景夕返”，侯景于是决心起兵。

  太清二年（548 年）八月，侯景在寿阳起兵，暗中勾结梁武帝的侄子临贺王萧正德作内应。十月，他从采石渡江，萧正德打开城门迎他进入建康，侯景随即围攻宫城台城。台城被围了一百三十多天，各地赶来的援军号称数十万，屯驻在城外却互相观望，不肯力战。城中疾疫流行，粮食吃尽，死者相枕。太清三年（549 年）三月，台城陷落，梁武帝被软禁，五月饿病而死。

  侯景立萧纲为帝，自称“宇宙大将军”，纵兵在三吴一带烧杀抢掠。据《南史·侯景传》，江南千里之内断绝炊烟，人迹罕见，白骨堆积如同山丘。梁朝的宗室诸王各怀私心，湘东王萧绎坐镇江陵，先攻打自己的侄子，诸王互相攻伐，西魏和北齐乘机夺取了梁朝的大片土地。

  大宝二年（551 年），侯景西攻巴陵，被王僧辩挡住，兵败退回建康，废杀简文帝后自立为汉帝。承圣元年（552 年），王僧辩与陈霸先合兵攻克建康，侯景出逃，被部下杀死。

  侯景之乱前后四年，使江南的经济遭到毁灭性的打击，建康一带长期残破。东晋以来的高门士族在战乱中大量死亡或流散，从此一蹶不振。梁朝失去了淮南和巴蜀，三年后江陵又被西魏攻陷，南朝从此再也无力与北朝抗衡。
sources: []
