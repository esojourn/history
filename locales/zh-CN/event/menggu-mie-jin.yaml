name: 蒙古灭金
summary: 1232 年蒙古在三峰山歼灭金军主力，1234 年蒙宋联军攻破蔡州，金朝灭亡。
body: |-
  金宣宗南迁后，金朝依靠黄河和潼关天险，在河南坚持了将近二十年。1229 年窝阔台即大汗位，决定集中力量灭金。1231 年蒙古军兵分三路：窝阔台率中路从山西南下，斡陈那颜率左路从山东进攻，拖雷率右路从陕西南下，借道南宋的汉中，沿汉水东进，绕到金军背后，形成合围之势。

  天兴元年（公元 1232 年）正月，金军主力在钧州三峰山（今河南禹州西南）遭到拖雷军和窝阔台援军的夹击，时值大雪，金军饥寒交迫，几乎全军覆没，名将完颜合达、完颜陈和尚等战死。随后速不台率军围攻汴京，城中又发生瘟疫，死者极多。这年年底金哀宗出城东逃，次年辗转到达蔡州，汴京守将崔立献城投降。据《元史·耶律楚材传》，速不台曾要求攻下汴京后屠城，被耶律楚材劝阻。

  1233 年蒙古派使者到南宋，约定联合灭金，许诺灭金后把河南之地归还宋朝。南宋派孟珙率军北上，与蒙古将领塔察儿合围蔡州。1234 年正月城破，金哀宗传位给宗室完颜承麟后自缢，完颜承麟随即死于乱军之中，金朝灭亡。孟珙带着金哀宗的部分遗骸回到临安，宋理宗告祭太庙。

  金朝从 1115 年完颜阿骨打称帝算起，立国一百二十年。金亡后，元好问等金朝遗民致力于保存金代的史料和文献。宋蒙之间关于河南归属的约定并不明确，同年南宋出兵收复汴京、洛阳，导致宋蒙战争爆发（另见“端平入洛”条）。
sources: []
recalled:
  - 《金史·哀宗本纪》
  - 《元史·太宗本纪》
  - 《宋史·孟珙传》
