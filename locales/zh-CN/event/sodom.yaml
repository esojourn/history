name: 所多玛与蛾摩拉被毁
summary: 耶和华降硫磺与火毁灭所多玛、蛾摩拉，罗得被救出。
body: |-
  所多玛、蛾摩拉是约旦河平原的城，罗得与亚伯兰分开后住在所多玛。《创世记》13:13 说所多玛人在耶和华面前罪大恶极。据第 18 章，三位客人在幔利受亚伯拉罕接待之后往所多玛去，耶和华告诉亚伯拉罕，所多玛和蛾摩拉的罪恶甚重。亚伯拉罕为那城求情，从城里若有五十个义人问起，一直问到十个；耶和华答应，若有十个义人也不毁灭那城。

  第 19 章记两位天使晚上到了所多玛，罗得请他们到家里住。城里各处的人连老带少围住房子，要罗得把客人交出来；天使使门外的人眼都昏迷。天使叫罗得带一切属他的人离开，他的女婿们以为是戏言。天明时天使拉着罗得、他妻子和两个女儿出城，嘱咐他们不可回头看。罗得求准逃往小城琐珥。

  罗得到琐珥时日头已经出来，耶和华将硫磺与火从天上降与所多玛和蛾摩拉，把那些城和全平原，连城里的居民和地上生长的都毁灭了。罗得的妻子在后边回头一看，变成了一根盐柱。亚伯拉罕清早起来，向所多玛、蛾摩拉和平原观看，见那地方烟气上腾，如同烧窑一般（19:23—28）。

  圣经后来多次以这件事为鉴戒，如《申命记》29:23、《以赛亚书》1:9、《路加福音》17:28—32、《彼得后书》2:6；《申命记》29:23 同时提到押玛、洗扁两城也被倾覆。这些城的确切位置至今没有定论，一般认为在死海一带，考古上还没有公认与之对应的遗址。本条年份按这件事紧接在创 17 章亚伯拉罕九十九岁之后（18:10、18:14）推算，是约数。
sources: []
