name: 希达斯皮斯河战役
summary: 公元前 326 年亚历山大在旁遮普渡河击败波罗斯王的象军，这是他最后一场大会战。
body: |-
  公元前 326 年春，亚历山大经赫费斯提翁和佩尔狄卡斯预先架好的浮桥渡过印度河，进入呾叉始罗。当地国王归附了他，并请他对付东面的邻国。那位邻国的国王波罗斯拒绝臣服，率军守在希达斯皮斯河（今杰赫勒姆河）东岸。时值初夏，喜马拉雅山的融雪和将临的雨季使河水既宽且急。

  两军隔河对峙多日。据阿里安，亚历山大一面大张声势地囤粮，表示要等到冬天水退；一面每夜派骑兵在岸边来回呼喊，佯作渡河，时间一长，波罗斯不再理会。他在上游约二十七公里处找到一个有树木遮蔽的河湾和江中小岛，留克拉特鲁斯率一部守在原营地，约定只有在象群离开河岸后才渡河，自己带着精选的骑兵和步兵趁一个雷雨之夜乘船和皮筏渡过。上岸的兵力，阿里安说是骑兵五千、步兵约六千。

  波罗斯先派儿子带战车和骑兵来截击，战车陷在雨后的泥地里，被击溃，其子战死。波罗斯留少量兵力监视克拉特鲁斯，亲率主力迎战。据阿里安，他有骑兵四千、战车三百、战象二百、步兵三万；别的作家所记的战象要少些。他把战象排在步兵阵线前面，相互间隔一段距离，两翼是骑兵和战车。

  亚历山大的马匹怕象，他便避开正面，集中骑兵攻击印度军的左翼，并派科伊努斯绕到敌后。印度骑兵被赶回象群之间。马其顿方阵随后上前，用长矛和标枪攻击战象和象夫。战象受伤后不分敌我地踩踏，印度军被挤作一团。克拉特鲁斯这时渡河加入追击。阿里安说印度一方阵亡步兵近二万、骑兵三千，马其顿人阵亡不到三百人，后一个数字多半偏低。

  波罗斯身负创伤，战到最后。亚历山大让他保有王国，还把以后征服的东面土地交给他。他在战场附近和渡河处各建一城，一座名尼凯亚（“胜利”），一座名布克法拉，纪念在这一带死去的战马布克法罗斯。大军继续东进，夏末到达希发西斯河，士兵不肯再往前走，远征到此折回。此战中马其顿人见识了象军，后来的继业者都争相搜求战象。
sources: []
recalled:
  - 阿里安《亚历山大远征记》卷五第 8—19 章
  - 狄奥多罗斯《历史丛书》卷十七第 87—89 章
  - 库尔提乌斯《亚历山大史》卷八第 13—14 章
  - 普鲁塔克《亚历山大传》第 60—62 章
