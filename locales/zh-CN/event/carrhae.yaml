name: 卡莱战役
summary: 克拉苏远征帕提亚，在卡莱附近的平原上被苏雷纳的骑射手击溃，本人被杀。
body: |-
  公元前 53 年，罗马统帅克拉苏的军队在美索不达米亚北部的卡莱（即哈兰）附近被帕提亚将领苏雷纳击溃，是罗马在东方最惨重的失败之一。

  克拉苏在前 55 年得到叙利亚行省。帕提亚并没有挑衅，它正陷于王位之争。克拉苏的战争没有经过元老院和人民宣战，据普鲁塔克，保民官阿泰乌斯在他出城时举行仪式加以诅咒。他年过六十，想要取得与庞培、恺撒相当的军功。

  前 54 年他渡过幼发拉底河占领了几座城镇，留下驻军，回叙利亚过冬。前 53 年春他带七个军团和数千骑兵、轻装兵再次渡河；骑兵中有他的儿子普布利乌斯从恺撒那里带来的一千名高卢骑兵。亚美尼亚国王劝他取道山地，可以避开帕提亚骑兵；财务官卡西乌斯主张沿河行军。他都没有听，跟着一个阿拉伯首领进入了开阔的平原。

  帕提亚国王奥罗德二世亲自去对付亚美尼亚，把骑兵交给苏雷纳。据普鲁塔克，苏雷纳有一千名人马俱披铠甲的重骑兵和约一万名骑射手，一千头骆驼驮着备用的箭。克拉苏把步兵排成方阵。帕提亚骑射手围着方阵放箭；罗马人原以为箭总会射完，后来才看见骆驼队在补给。克拉苏命儿子带骑兵和部分步兵出击。帕提亚人佯退，把他们引离大队后围歼，普布利乌斯让随从把自己刺死，他的头被挑在矛尖上拿到罗马阵前。

  天黑后帕提亚人退去。罗马人丢下伤员撤进卡莱城，次夜再向北面的山地突围。苏雷纳提出议和；士兵怕再战，逼克拉苏前往，他在拉扯中被杀，谁动的手说法不一。据普鲁塔克，二万人战死，一万人被俘。卡西乌斯带着少数骑兵逃回叙利亚。

  军团的鹰旗被帕提亚人夺去，三十多年后才由奥古斯都通过交涉索回。在罗马，三头同盟少了一人，庞培与恺撒直接对立。
sources: []
recalled:
  - 普鲁塔克《克拉苏传》第 16—33 章
  - 卡西乌斯·狄奥《罗马史》卷四十第 12—27 章
