name: 第三次神圣战争
summary: 福基斯人占据德尔斐并动用神庙财宝，腓力二世借此战进入希腊中部。
body: |-
  管理德尔斐神庙的近邻同盟会议当时受底比斯影响。会议以耕种圣地为由判福基斯人巨额罚款，逾期不缴就把他们的土地献给神。公元前 356 年，福基斯人在菲洛墨洛斯带领下占据了德尔斐，声称这里自古归他们管理。次年近邻同盟宣布发动“神圣战争”，底比斯、洛克里斯、色萨利等站在一边，雅典和斯巴达因与底比斯为敌而支持福基斯，但出力不多。

  菲洛墨洛斯起初只说借用神庙的钱。他战死后，继任的奥诺马科斯和法伊洛斯把神庙历代所藏的金银祭品熔铸成钱币，用高饷招来希腊最大的一支雇佣军。据狄奥多罗斯，前后用去的财宝超过一万塔兰特。

  色萨利各城与斐赖的僭主们相争，一方请来马其顿的腓力二世，另一方请来福基斯人，战争由此扩大。前 353 年奥诺马科斯两次击败腓力。前 352 年腓力卷土重来，在色萨利海边的番红花原野大胜，奥诺马科斯战死。据狄奥多罗斯，腓力让士兵头戴阿波罗的月桂冠出战，战后把三千名俘虏当作亵渎神庙的人投入海中。腓力就此控制色萨利，随后南下，雅典派兵守住温泉关，他没有硬闯。

  此后战事拖延，神庙的钱渐渐用尽，底比斯也筋疲力尽，向腓力求助。前 346 年腓力与雅典订立《菲洛克拉底和约》后立即通过温泉关，福基斯人的统帅法莱科斯带着雇佣军有条件地撤走，福基斯各城投降。近邻同盟会议判决：福基斯的城镇一律拆散为村落，每年偿还神庙六十塔兰特；福基斯在会议中的两票转给腓力。腓力主持了当年的皮提亚竞技会。马其顿国王从此是希腊中部事务中名正言顺的一员。
sources: []
recalled:
