name: 元祐更化
summary: 宋哲宗初年高太后听政，起用司马光等人，废除王安石新法，史称“元祐更化”。
body: |-
  元丰八年（公元 1085 年）三月宋神宗去世，九岁的宋哲宗即位，神宗的母亲高太后以太皇太后身份垂帘听政。她一向反对新法，随即召回退居洛阳的司马光，任命为门下侍郎，次年又以吕公著为相。司马光认为新法害民，主张尽快废除，说这是“以母改子”，不是儿子改变父亲的做法。

  元丰八年至元祐元年（1086 年）间，保甲法、方田均税法、市易法、保马法、青苗法等相继被废除。司马光下令在五天之内把免役法改回差役法，苏轼、范纯仁等人认为免役法有可取之处，主张逐步调整，没有被采纳。在对外关系上，朝廷把神宗时从西夏夺取的米脂等几处寨堡归还西夏，以求边境安宁。推行新法的蔡确、章惇、吕惠卿等人被贬出朝廷，元祐四年（1089 年）蔡确因“车盖亭诗”被指讥讽太后，被贬到新州，死在那里。

  司马光在元祐元年九月去世，此后旧党内部又出现分歧，以程颐为首的“洛党”、以苏轼为首的“蜀党”和以刘挚等人为首的“朔党”互相攻击。元祐八年（1093 年）高太后去世，哲宗亲政，次年改元绍圣，恢复新法，贬逐元祐大臣（另见“绍圣绍述”条）。

  后世对元祐更化评价不一。旧党和南宋以后的史家多称赞元祐年间政治清明，高太后被称为“女中尧舜”；也有人批评司马光不分好坏地全盘废除新法，加剧了党争，使新旧两党此后轮番报复，政局动荡不已。
sources: []
recalled:
  - 《宋史·哲宗本纪》
  - 《宋史·司马光传》
  - 《续资治通鉴长编》卷三百五十三至四百八十四
