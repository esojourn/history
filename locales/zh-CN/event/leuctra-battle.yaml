name: 留克特拉战役
summary: 公元前 371 年伊巴密浓达率底比斯军击败斯巴达，终结其陆上霸权。
body: |-
  公元前 371 年夏，希腊各邦在斯巴达开会重订共同和约。底比斯代表伊巴密浓达坚持以底比斯之名代表全彼奥提亚宣誓，斯巴达国王阿格西劳斯二世把底比斯从和约中除名。另一位国王克列翁布洛托斯当时正率军驻在福基斯，奉命立即进入彼奥提亚。他绕开底比斯人把守的隘口，从南面进抵塞斯皮埃境内的留克特拉平原。此时距和会不过二十天左右。

  斯巴达及其盟军约一万人，彼奥提亚军人数较少，古代作家所记的数字不一，大约六七千人。彼奥提亚的几位长官对是否出战意见不一，最后以多数决定应战。

  希腊重装步兵作战，通常把最强的部队放在右翼，纵深八到十二列，两军的右翼各自压倒对方的左翼。伊巴密浓达反其道而行：把底比斯人集中在自己的左翼，据色诺芬纵深至少五十列，正对着斯巴达国王和斯巴达公民所在的右翼；中央和右翼的盟军则斜向后撤，不与敌人接触。战斗由骑兵开始，斯巴达骑兵被击退，退入自己的步兵阵中造成混乱。底比斯的密集纵队随即压上，佩洛皮达斯率“圣队”三百人跑步抢先冲击。克列翁布洛托斯负了致命伤，他周围的将领相继战死，斯巴达的右翼被推垮，其余部队退回营地。

  据色诺芬，斯巴达一方阵亡近千人，在场的七百名斯巴达全权公民死了约四百人。斯巴达人请求停战收尸，等于承认战败。色萨利的伊阿宋赶到后居间调停，斯巴达残军撤走。色诺芬说，消息传到斯巴达时正值节日，监察官下令照常进行，阵亡者的亲属第二天面带喜色出门，生还者的亲属反而不好意思露面。

  斯巴达的全权公民这时本来只有一千多人，经不起这样的损失。伯罗奔尼撒各邦纷纷脱离它，次年冬天伊巴密浓达攻入拉科尼亚并解放美塞尼亚。加厚一翼、斜线接敌的战法，后来为腓力二世和亚历山大所用。
sources: []
recalled:
  - 色诺芬《希腊史》卷六第 4 章
  - 普鲁塔克《佩洛皮达斯传》第 20—23 章
  - 狄奥多罗斯《历史丛书》卷十五第 51—56 章
