name: 陆贾出使南越
summary: 前 196 年陆贾奉汉高祖之命出使南越，立赵佗为南越王。
body: |-
  赵佗在秦亡后据岭南自立。汉高祖平定天下，因中原久经战乱，没有出兵，于高祖十一年（公元前 196 年）派陆贾带印去立赵佗为南越王。据《史记·郦生陆贾列传》，赵佗起初椎髻箕踞接见，陆贾陈说汉朝的强盛和抗拒的后果，赵佗起身谢罪，留他饮宴数月，临别赠以价值千金的行装。

  赵佗接受了南越王的封号，称臣奉汉约，双方剖符通使。陆贾回报后被任命为太中大夫。吕后时双方交恶，赵佗称帝；文帝元年（前 179 年）陆贾再度出使，赵佗去帝号，重新称臣。
sources:
  - 《史记·郦生陆贾列传》 https://zh.wikisource.org/wiki/史記/卷097
  - 《史记·南越列传》 https://zh.wikisource.org/wiki/史記/卷113
