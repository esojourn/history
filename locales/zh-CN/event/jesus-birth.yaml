name: 耶稣降生
summary: 大希律在位末年，马利亚在犹太的伯利恒生下耶稣。
body: |-
  四卷福音书里，只有《马太福音》和《路加福音》记载耶稣降生的经过，《马可福音》和《约翰福音》没有这一段。据《路加福音》1:26–38，天使加百列奉差遣到加利利的拿撒勒，向已经许配给约瑟的童女马利亚报信，说她要从圣灵怀孕生子。据《马太福音》1:18–25，约瑟得知马利亚怀孕，想要暗暗地把她休了，主的使者在梦中向他显现，他就把妻子娶了过来。

  路加记该撒亚古士督降旨，叫天下人民都报名上册。约瑟是大卫一族的人，就带着马利亚从拿撒勒上犹太的伯利恒去。马利亚在那里生了头胎的儿子，用布包起来放在马槽里，因为客店里没有地方。当夜天使向野地里看守羊群的牧羊人报信，他们就进城去看那婴孩。满了八天，孩子受割礼，起名叫耶稣；满了洁净的日子，父母带他上耶路撒冷的圣殿，然后回拿撒勒去（路 2:1–39）。

  马太记希律作王的时候，有几个博士从东方来到耶路撒冷，说看见了犹太人之王的星，特来拜他。希律召了祭司长和文士来问，他们引先知的话回答说基督当生在伯利恒。博士找到那孩子，献上黄金、乳香、没药。约瑟在梦中得了指示，带着孩子和母亲逃往埃及。希律差人把伯利恒城里和四境所有两岁以内的男孩都杀了，这件事不见于圣经以外的记载。希律死后，约瑟一家回来，住在加利利的拿撒勒（太 2 章）。

  两卷书各记各的经过，相同的是：母亲是童女马利亚，她的丈夫约瑟是大卫的后裔，孩子生在伯利恒，在拿撒勒长大。两书所载的家谱不同（太 1:1–17；路 3:23–38），路加的叙述里也没有提到往埃及去。两书都说耶稣生在希律王的时候，而大希律死于公元前 4 年，所以降生之年通常推定为约公元前 6—前 4 年，本条取其下限。《路加福音》2:2 说报名上册是居里扭作叙利亚巡抚时的事，约瑟夫斯所记居里扭的户口清查却在公元 6 年，两者怎样对应，学界有多种解释，没有定论。
sources: []
recalled:
  - 《马太福音》第 1—2 章
  - 《路加福音》第 1—2 章、3:23–38
  - 《弥迦书》5:2
  - 约瑟夫斯《犹太古史》卷 17（大希律之死）、卷 18（居里扭的户口清查）
