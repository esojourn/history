name: 马陵之战
summary: 前 342 年孙膑以“减灶”之计诱敌，在马陵大败魏军，庞涓自杀。
body: |-
  公元前 342 年，魏国攻打韩国，韩国向齐国求救。齐国再次以田忌为将、孙膑为军师，率军直趋大梁。魏将庞涓得知后放弃攻韩，回师追击齐军。

  据《史记·孙子吴起列传》，孙膑对田忌说，三晋的军队向来勇猛而轻视齐军，认为齐人怯懦，善于用兵的人要因势利导。于是令齐军进入魏境后，第一天造十万人的灶，第二天减为五万，第三天减为三万。庞涓追了三天，大喜说，我本来就知道齐军怯懦，进入我国境内三天，士卒逃亡已超过一半了。于是丢下步兵，只带轻装精锐日夜兼程追赶。

  孙膑估计魏军傍晚会赶到马陵。马陵道路狭窄，两旁多险阻，可以埋伏，他让人把一棵大树的树皮刮去，写上“庞涓死于此树之下”，命齐军万名弓弩手埋伏在道路两旁，约定天黑后看见火光就一齐放箭。庞涓夜里赶到，看见树上有字，点火照看，还没读完，齐军万弩齐发，魏军大乱溃散。庞涓自知智穷兵败，拔剑自杀，死前说：“遂成竖子之名！”齐军乘胜大破魏军，俘虏了魏太子申。

  马陵之战后，魏国元气大伤，西面又被秦国乘机夺去大片土地，从此失去了战国初期的霸主地位，齐、秦两国成为东西两强。此战的年份，《史记》作魏惠王三十年（公元前 341 年），今人据《竹书纪年》订正，多作公元前 342 年；马陵的地望也有多种说法。
sources: []
recalled:
  - 《史记·孙子吴起列传》
  - 《史记·魏世家》
  - 《战国策·魏策二》
