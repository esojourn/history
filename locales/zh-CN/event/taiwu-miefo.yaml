name: 太武帝灭佛
summary: 魏太武帝在崔浩鼓动下下诏毁佛，焚经像、坑沙门，是中国历史上第一次大规模灭佛。
body: |-
  魏太武帝在崔浩的引荐下信奉寇谦之的天师道，对佛教逐渐疏远。据《魏书·释老志》，太延四年（公元 438 年），他下令五十岁以下的僧人还俗，以充兵役；太平真君五年（444 年）又下诏，禁止王公以下私自供养沙门。

  太平真君六年（445 年），卢水胡人盖吴在关中杏城起兵，响应者很多。次年太武帝亲到长安镇压，随从官员在一座佛寺里发现了兵器，又搜出酿酒的器具、州郡富人寄存的大量财物，以及藏匿妇女的密室。太武帝大怒，认为僧人与盖吴勾结。崔浩乘机劝他尽诛沙门。太平真君七年（446 年）三月，他下诏诛杀长安的僧人，焚毁佛像，并命留守平城的太子拓跋晃通令全国照此办理：佛塔、佛像和佛经全部击毁焚烧，僧人不论老少一律坑杀。

  据《释老志》，太子拓跋晃一向信佛，屡次劝谏不成，便有意拖延诏书的颁布，使各地僧人大多得以逃匿，佛经佛像也有不少被秘密收藏起来，但北魏境内的寺院佛塔几乎被毁尽。寇谦之也曾与崔浩争辩，劝他不要这样做。

  这是中国历史上第一次由朝廷下令的大规模灭佛，与后来北周武帝、唐武宗、后周世宗的禁佛，被佛教徒合称为“三武一宗”法难。正平二年（452 年）文成帝即位后，下诏恢复佛教。不久，昙曜奏请开凿云冈石窟，北魏佛教又兴盛起来。
sources: []
recalled:
  - 《魏书·释老志》
  - 《魏书·世祖纪》
  - 《资治通鉴》卷一百二十四
