name: "多特会议"
summary: "荷兰改革宗召集各国代表的会议，定亚米念派的罪，订立《多特信经》。"
body: |-
  亚米念 1609 年去世后，他的学生和支持者在 1610 年向荷兰议会递交《抗辩书》，提出有条件的拣选、基督为众人死、恩典可以抗拒等五点，称为“抗辩派”。《历史的轨迹》第三十三章说，他训练出来的年轻传道人把他的教导带进教会，全国引起神学争论。这场争论又与荷兰的政争纠缠在一起：支持抗辩派的大议长奥尔登巴内费尔特与执政莫里斯对立，1618 年莫里斯得势。

  该书说，为解决争论，在多特召开会议，会期从 1618 年 11 月 13 日到 1619 年 5 月 9 日。这是改革宗教会有史以来最大的会议，代表不仅来自荷兰，也来自英国、德国、瑞士各地的改革宗教会。书中说法国和德国偏远地区的教会虽被邀请，因路远不克出席；一般记载法国改革宗的代表是被国王路易十三禁止出境的。

  该书说，会议一致拒绝并定罪亚米念的教导，又在《多特信经》中阐明改革宗的真正教义，这是改革宗信条制订的最高水准。后人把信经的五项要点归纳为全然败坏、无条件拣选、限定的救赎、不可抗拒的恩典、圣徒蒙保守到底，取英文首字母称“TULIP”，该书研讨问题中也提到这一说法。会后约二百位抗辩派牧师被免职，奥尔登巴内费尔特被处死。

  第三十三、三十九章说，《比利时信条》《海德堡要理问答》和《多特信经》至今是荷兰和美国改革宗教会的信仰准则；但多特会议并未能把亚米念主义从荷兰完全铲除。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十三章“亚米纽斯主义 贵格派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter37.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
recalled:
  - "《多特信经》（1619 年）"
  - "抗辩派《抗辩书》（1610 年）"
