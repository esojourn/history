name: 李广利伐大宛
summary: 汉武帝为求大宛良马，两次派李广利远征，历时四年迫使大宛献马，声威远及葱岭以西。
body: |-
  大宛在葱岭以西的费尔干纳盆地，距长安一万多里，出产良马。据《史记·大宛列传》，出使西域的人向武帝报告，大宛的贰师城有好马，藏着不肯给汉使。武帝派人带着千金和一匹金马去换。大宛的贵人认为汉朝遥远，中间隔着盐泽和缺少水草的荒漠，大军无法到达，于是拒绝，还在汉使回程时截杀使者、夺取财物。

  太初元年（公元前 104 年），武帝任命宠姬李夫人的哥哥李广利为贰师将军，率属国骑兵六千和各郡国的不良少年数万人西征。沿途小国各自坚守城池，不肯供给粮食，汉军攻得下的才有饭吃。到大宛东境的郁成时只剩几千人，又饿又乏，被郁成的守军击败。李广利退回敦煌，往返两年，士卒只剩下十分之一二。他上书请求罢兵，武帝大怒，派使者守在玉门关，宣布敢入关者斩。

  武帝认为，连大宛都不能征服，西域各国都会轻视汉朝。他赦免囚徒，增调恶少年和边境骑兵，一年多后让六万人从敦煌再次出发，带着十万头牛、三万匹马和大量驴、骆驼运粮，又增派十八万戍卒到酒泉、张掖以北作后援。这次沿途小国都开城供应。汉军到达大宛都城时有三万人，先断绝城外的水源，围攻四十余日，攻破外城。大宛的贵人们商议后杀死国王毋寡，提着他的头来求和，表示愿意任汉军挑选马匹，否则就杀尽良马死守，等待康居的援军。李广利同意，选了几十匹上等马和三千多匹中等以下的马，立亲汉的贵人昧蔡为王，撤军东归。

  太初四年（前 101 年）汉军回到玉门关，入关的只有一万余人。列传说这次出征并不缺粮，战死的也不算多，是将吏贪暴、不爱惜士卒才损失如此之大。此后西域各国多派子弟到汉朝进贡，汉朝从敦煌向西直到盐泽沿途设亭障，并在轮台、渠犁驻兵屯田，设使者管理，这是后来西域都护的前身。
sources: []
recalled:
  - 《史记·大宛列传》
  - 《汉书·张骞李广利传》
  - 《汉书·西域传上》
