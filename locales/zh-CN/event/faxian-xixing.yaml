name: 法显西行求法
summary: 僧人法显从长安出发，陆路去、海路回，历时十余年到印度和斯里兰卡求取佛教戒律。
body: |-
  佛教传入中国三百多年，到东晋时经论已译出不少，规范僧人行为的戒律却始终不全，各地寺院的做法不一。在法显之前，已有朱士行等人西行求经，但都只到达西域。后秦弘始元年（公元 399 年），法显与慧景、道整、慧应、慧嵬四人相约，从长安出发，要到佛教的发源地天竺去寻求完整的律本。

  一行人经西秦、南凉到张掖，与另一批西行的僧人会合，出敦煌后在沙漠中走了十七天到鄯善，再经焉耆穿过塔克拉玛干沙漠到达于阗，在那里观看了盛大的行像仪式。随后他们翻越葱岭，法显在书中说山上冬夏积雪，有恶龙吐毒风、雨雪飞沙。过岭后沿印度河上游的峡谷前行，要攀着悬崖上凿出的石阶和绳索渡河。一路上同伴或折回或病故，慧景在翻越小雪山时冻死。

  法显在北天竺、中天竺巡礼了佛陀降生、成道、说法和涅槃的各处圣地。那里的戒律多靠师徒口传，没有写本，他一直走到恒河中游的巴连弗邑，才在一座大乘寺院里得到《摩诃僧祇律》，于是住了三年，学习梵语，抄写律本和经论。此后道整决定留在天竺，他独自东行到恒河入海处，住了两年，再乘商船到师子国，又住两年，得到汉地所没有的几种经律。

  他搭乘一艘载有二百多人的商船回国，途中遇到大风，船漏水，在海上漂流九十天左右到达耶婆提，一般认为在今印度尼西亚的爪哇或苏门答腊。停留五个月后，他换乘另一艘商船驶向广州，又遇暴风，漂流七十多天，粮水将尽，最后在青州长广郡的牢山南岸登陆，时为东晋义熙八年（412 年）。他出发时的同伴没有一人与他同归。

  法显带回的律本和经论后来在建康陆续译出，其中《摩诃僧祇律》成为汉地流行的几部大律之一。他写的《佛国记》按行程记述了三十来个国家的见闻，书中关于笈多王朝时期印度社会的记载，是今天研究那一段历史的重要材料。他之后，西行求法的僧人络绎不绝，唐代的玄奘、义净都把他当作先行者。
sources: []
recalled:
  - 法显《佛国记》
  - 《高僧传·释法显传》
  - 《出三藏记集》卷十五
