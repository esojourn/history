name: 摊丁入亩
summary: 康熙帝定丁银永不加赋，雍正年间把丁银摊入田赋，废除人头税。
body: |-
  中国历代王朝都向成年男子（丁）征收人头税或摊派徭役，明代称为丁银。一条鞭法虽然把部分徭役摊入田亩，但丁银仍然存在。清初人口增长，各地的丁额常常是虚报的，许多农民为了逃避丁银而隐瞒户口或逃亡，无地少地的贫民负担尤其沉重。

  康熙五十一年（1712 年）康熙帝下诏，以康熙五十年（1711 年）全国的人丁数作为征收丁银的固定数额，此后新增的人口称为“盛世滋生人丁”，永远不再加征丁银。这样，全国的丁银总数固定了下来。

  在此基础上，康熙末年广东、四川等地开始试行把丁银摊入田赋一并征收。雍正元年（1723 年）直隶总督李维钧奏请在直隶实行，雍正帝批准，此后各省陆续推行，到雍正七年（1729 年）前后大部分省份都已实行，只有少数地方晚至乾隆年间。具体做法是把各地的丁银总额按田亩分摊，与田赋合并为“地丁银”征收，称为“摊丁入亩”或“地丁合一”。

  摊丁入亩以后，没有土地的人不再负担丁银，赋税主要由占有土地的人承担，中国历史上延续了两千多年的人头税基本被废除。官府对人口的控制也有所放松，人们可以比较自由地迁徙。一般认为，这一改革和其他因素一起，促成了清代中期人口的快速增长，乾隆末年全国人口已达三亿左右。
