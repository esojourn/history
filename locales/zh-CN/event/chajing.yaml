name: 《茶经》成书
summary: 陆羽在湖州写成《茶经》三卷，是世界上第一部系统论述茶的专著。
body: |-
  陆羽隐居湖州苕溪一带时，到各地考察茶的产地和制法，写成《茶经》，成书大约在唐德宗建中元年（公元 780 年）前后，具体年份有不同说法。全书三卷，分为十篇：一之源、二之具、三之造、四之器、五之煮、六之饮、七之事、八之出、九之略、十之图，分别论述茶树的起源和特性、采茶制茶的工具、制茶的方法、煮茶饮茶的器具、煮茶的水和火候、饮茶的风俗、历代有关茶的记载、各地茶叶的产地和品质等。

  唐代饮茶的风气在开元以后普及到北方。据封演的《封氏闻见记》，泰山灵岩寺的禅僧坐禅时不吃晚饭，靠饮茶提神，人们争相仿效，于是饮茶在北方流行开来。《茶经》问世后，饮茶更加讲究。据《新唐书·陆羽传》，此后天下崇尚饮茶成为风气，回纥人入朝时也开始赶着马来交换茶叶。贞元九年（793 年），唐朝开始征收茶税。

  《茶经》是世界上现存最早的茶学专著，后世奉陆羽为“茶圣”。
sources: []
recalled:
  - 陆羽《茶经》
  - 《新唐书·隐逸传·陆羽》
  - 封演《封氏闻见记》卷六
