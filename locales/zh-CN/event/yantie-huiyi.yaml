name: 盐铁会议
summary: 汉昭帝时贤良、文学与桑弘羊等就盐铁官营等政策展开辩论，会后废除酒类专卖。
body: |-
  武帝时为筹措军费而实行的盐铁官营、酒类专卖和均输平准，到昭帝初年仍在施行。辅政的霍光有意调整武帝时期的政策，而这些办法的主持者、御史大夫桑弘羊坚持不变，两人在朝中已有嫌隙。

  据《汉书·昭帝纪》和《食货志》，始元六年（公元前 81 年）二月，朝廷下诏，让丞相田千秋、御史大夫桑弘羊与各郡国举荐来的贤良、文学当面讨论民间的疾苦。到会的贤良、文学有六十余人，多是来自各地的儒生。他们一致要求废除盐铁官营、酒类专卖和均输，认为官府不应与百姓争利，这些政策使人们舍弃农业去追逐商利，官造的铁器质量低劣、价格昂贵，农民甚至只能用木器耕田、用手除草。

  桑弘羊逐条反驳。他说匈奴屡次侵扰边境，修筑要塞、屯驻军队的费用全靠这些收入；盐铁官营还可以防止豪强独占山海之利、聚众作乱；均输平准使物资流通、物价平稳。辩论从具体的财政政策扩展到对匈奴应当和亲还是用兵、治国应当靠礼义教化还是靠法令刑罚等问题，双方言辞都很激烈。

  当年七月，朝廷采纳了部分意见，废除酒类专卖，撤销关内的铁官，盐铁官营和均输则继续实行。次年桑弘羊卷入上官桀、燕王刘旦谋废霍光一案被杀。宣帝时，汝南人桓宽根据这次会议留下的记录加以整理、铺陈，写成《盐铁论》六十篇，这场辩论的内容因此保存至今。
sources: []
recalled:
  - 《汉书·昭帝纪》
  - 《汉书·食货志下》
  - 桓宽《盐铁论》
  - 《汉书·公孙刘田王杨蔡陈郑传》赞
