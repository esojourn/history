name: 辛亥革命
summary: 1911 年武昌起义爆发，各省相继独立，次年中华民国成立，清帝退位。
body: |-
  宣统三年（1911 年，干支为辛亥）五月，清朝宣布“铁路国有”，把原来由各省绅商集资修建的川汉、粤汉铁路收归国有，再以路权作抵押向英、法、德、美四国银行团借款。湖南、湖北、广东、四川等地掀起了保路运动，四川最为激烈。九月四川总督赵尔丰在成都逮捕保路同志会的领导人，向请愿的民众开枪，造成“成都血案”，各地的保路同志军随即起事。清朝从湖北调新军入川镇压，湖北的防务因而空虚。

  湖北的革命团体文学社和共进会在新军中发展了大批成员，原定在十月发动起义。十月九日，共进会的孙武在汉口俄租界制造炸弹时发生爆炸，起义计划暴露，湖广总督瑞澂下令搜捕。十月十日晚，武昌城内的新军工程第八营首先起义，各营响应，攻占了总督署，瑞澂逃走。次日起义者推举新军协统黎元洪为湖北军政府都督，宣布改国号为“中华民国”，此后汉阳、汉口也被起义军占领。

  清廷急忙派陆军大臣荫昌率北洋军南下，又被迫起用袁世凯为湖广总督，后来任命他为内阁总理大臣。北洋军攻下汉口、汉阳，黄兴率领的革命军坚守了一个月。在此期间，湖南、陕西、江西、山西、云南、上海、江苏、浙江、广东、四川等地相继宣布独立，到十一月底，全国二十多个省中已有十几个省脱离了清朝。十二月，独立各省的代表在南京开会，推举孙中山为临时大总统。

  1912 年 1 月 1 日孙中山在南京就职，中华民国成立（另见“中华民国成立”条）。袁世凯一面以武力威胁南方，一面与南方议和，同时逼迫清廷退位。2 月 12 日清帝溥仪退位，清朝结束（另见“清帝退位”条）。辛亥革命推翻了统治中国二百六十多年的清朝，结束了两千多年的帝制，但革命的成果很快落入袁世凯手中。
