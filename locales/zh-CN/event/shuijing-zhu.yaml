name: 《水经注》成书
summary: 郦道元为《水经》作注，记载一千多条河流及沿途地理、历史和风俗，是古代地理名著。
body: |-
  《水经》是一部记述河流水道的书，旧题汉代桑钦或晋代郭璞所作，一般认为是三国时人的作品。原书只记一百多条河流，文字简略。郦道元在《水经注》的序中说，他少年时就喜欢游览，觉得以前的地理书都过于简略，于是以《水经》为纲，为之作注。成书的确切年代不详，一般认为在北魏宣武帝、孝明帝年间，即他晚年任官时期。

  据唐代《唐六典》的说法，《水经注》记载的大小河流有一千二百五十二条，注文约三十万字，是原书的二十多倍。他依水道的走向，逐一记述源头、流经的地方和汇入之处，同时记载沿途郡县的建置沿革、城邑、关隘、山陵、物产、风俗、古迹、碑刻和历史故事。他引用的书籍多达数百种，其中许多已经失传；北方的许多河流他亲自做过考察，纠正了前人的错误。南方的河流他没有到过，只能依据文献，因此有一些错误。

  《水经注》的文字也很优美，常被当作文学作品来读。书中写长江三峡的一段，“自三峡七百里中，两岸连山，略无阙处”，后来被选入课本；这段文字多取自南朝刘宋盛弘之的《荆州记》。

  原书四十卷，到北宋时已散佚五卷，后人重新析分，仍为四十卷。明清时传本中经文和注文混杂，清代学者全祖望、赵一清、戴震等人做了大量整理工作。研究《水经注》的学问被称为“郦学”。
sources: []
recalled:
  - 郦道元《水经注·序》
  - 《魏书·酷吏传·郦道元》
  - 《唐六典》
