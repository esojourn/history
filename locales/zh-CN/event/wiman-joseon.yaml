name: 卫满朝鲜建立
summary: 汉初燕人满东渡浿水，取代朝鲜王准自立，定都王险。
body: |-
  据《史记·朝鲜列传》，燕国全盛时曾经略真番、朝鲜，设吏筑塞；秦灭燕后，其地属辽东外徼；汉兴，因遥远难守，重修辽东旧塞，以浿水为界。公元前 195 年燕王卢绾反汉，逃入匈奴，燕人满随之流亡，聚众千余人，东出塞，渡过浿水。

  《三国志》裴松之注所引《魏略》记其经过：满投奔朝鲜王准，请求居于西界，为朝鲜作藩屏；准拜他为博士，封地百里。满招纳流亡者，势力渐大，便诈称汉兵十道来攻，请求入卫，回师攻准，准不敌，渡海南走韩地。《史记》的记述较简略，只说满役属真番、朝鲜蛮夷及燕、齐亡命者而称王，都王险。夺位的年份两书都没有写，通行的前 194 年出于后人推定。

  惠帝、吕后时，辽东太守约满为汉朝外臣。满借此取得兵威财物，真番、临屯相继服属。王位传到其孙右渠时与汉朝冲突，元封二年（前 109 年）武帝发兵，次年夏右渠被杀，汉在其地设四郡。王险城一般认为在今平壤一带，也有不同意见。
sources:
  - 《史记·朝鲜列传》 https://zh.wikisource.org/wiki/史記/卷115
  - 《三国志·魏书·东夷传》及裴松之注引《魏略》 https://zh.wikisource.org/wiki/三國志/卷30
  - 《汉书·西南夷两粤朝鲜传》 https://zh.wikisource.org/wiki/漢書/卷095
  - 维基百科“卫满朝鲜”“王险城”条（建国年份与王险城地望诸说） https://zh.wikipedia.org/wiki/卫满朝鲜
