name: 康熙历狱
summary: 杨光先攻击西洋历法与天主教，汤若望等下狱；康熙帝亲政后平反。
body: |-
  清初朝廷采用汤若望根据西法修订的《时宪历》，汤若望任钦天监监正，顺治帝对他十分礼遇。一些坚持传统历法和反对天主教的人对此不满，其中以杨光先最为激烈，他写了《辟邪论》《不得已》等文章攻击天主教，说“宁可使中夏无好历法，不可使中夏有西洋人”。

  顺治帝去世后，四大臣辅政，对西洋人的态度转为冷淡。康熙三年（1664 年）杨光先上书礼部，控告汤若望历法错误、为顺治帝早夭的皇子荣亲王选择葬期时用了不吉的时辰，又说天主教在各地传教，图谋不轨。辅政大臣受理此案，把汤若望、南怀仁等传教士逮捕下狱，次年汤若望被判凌迟处死，钦天监中信教的李祖白等五名中国官员被处死，各地传教士被押送广州拘禁。正在此时北京发生地震，加上孝庄太皇太后的干预，汤若望得以免死，不久病逝。杨光先被任命为钦天监监正，恢复使用旧法。

  杨光先的历法知识有限，推算屡次出错。康熙七年（1668 年）康熙帝亲政后，命南怀仁与杨光先等人当众测验日影，南怀仁的预测都与实测相符。康熙八年（1669 年）康熙帝罢免杨光先，任命南怀仁主持钦天监，恢复西法，并为汤若望平反。据说康熙帝后来回忆，正因为这场争论，他下决心学习天文和数学。
sources: []
recalled:
  - 杨光先《不得已》
  - 黄伯禄《正教奉褒》
  - 《清圣祖实录》
