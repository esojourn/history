name: 邙山之战
summary: 北周联合突厥进攻洛阳，北齐兰陵王、斛律光等在邙山大破周军，留下《兰陵王入阵曲》。
body: |-
  北周保定四年（公元 564 年），掌权的宇文护在北齐送还他母亲之后，仍按照与突厥的约定出兵伐齐。北周派尉迟迥率大军包围洛阳，另有几路兵马进攻北齐的其他地方。周军在洛阳城下筑土山、挖地道，围攻了三十天。

  北齐武成帝派兰陵王高长恭、斛律光等率军救援，名将段韶随后赶到统一指挥。十二月，齐军在洛阳北面的邙山与周军决战。兰陵王率五百骑兵冲入周军阵中，一直杀到被围的金墉城下，城上守军认不出他，他摘下头盔露出面容，守军才放下弓弩，出城接应。周军大溃，据《资治通鉴》，从邙山到谷水三十里之间，丢弃的军资器械遍布山野。宇文护只得撤军。

  齐军将士为兰陵王作歌颂扬，称为《兰陵王入阵曲》，后来流传到唐代宫廷，又传到日本，至今仍在日本的雅乐中演奏。北周这次伐齐失败后，周武帝后来改从晋州方向进攻，终于在 577 年灭齐。在此之前，东魏与西魏也曾于 543 年在邙山大战，那一次是高欢战胜了宇文泰。
sources: []
recalled:
  - 《北齐书·兰陵武王长恭传》
  - 《北齐书·段韶传》
  - 《资治通鉴》卷一百六十九
