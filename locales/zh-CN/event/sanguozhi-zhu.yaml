name: 裴松之注《三国志》
summary: 裴松之奉宋文帝之命为《三国志》作注，补充史事、收录异说，保存了大量佚书。
body: |-
  西晋陈寿的《三国志》叙事简洁，取材谨慎，但记载过于简略，许多重要的人物和事件只有寥寥数语。宋文帝认为它太简略，命中书侍郎裴松之搜集材料为之作注。元嘉六年（公元 429 年），裴松之完成上奏，文帝称赞这是不朽之作。

  与以往主要解释字词的注释不同，裴注以补充史事为主。裴松之在上表中说明了四种做法：陈寿没有记载的补上，同一件事说法不同的都收录进来，明显错误的加以纠正，对史事和陈寿的看法有所评论。注中引用的魏晋时期的史书、家传、文集、地理书等多达一二百种（各家统计不一），注文的篇幅与正文大致相当。许多后来脍炙人口的三国故事，正文里没有，而见于裴注所引的书中。

  裴注所引的书后来大多亡佚，靠他的引用才留下片段，因此裴注本身成了研究三国史最重要的史料之一。唐代刘知幾批评它繁杂，后世学者则多肯定它的价值。它与刘孝标的《世说新语》注、郦道元的《水经注》、李善的《文选》注一起，常被称为古籍的“四大名注”。
sources: []
recalled:
