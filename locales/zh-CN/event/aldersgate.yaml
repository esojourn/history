name: "卫斯理兄弟归正"
summary: "1738 年 5 月查理与约翰·卫斯理先后归正，约翰自述“心中异常温暖”。"
body: |-
  约翰·卫斯理从佐治亚回国时，自认十年来努力守律法，仍不能从罪中得释放，也没有圣灵的印证。《历史的轨迹》第三十六章说，他回到英国后第一个礼拜就认识了莫拉维弟兄会的贝勒尔，贝勒尔正等候前往佐治亚，传讲完全顺服、立时悔改、靠主喜乐的道理，并在伦敦组织了费特巷会社，卫斯理兄弟都加入了，但两人都还没有心灵的平安。

  该书说，1738 年 5 月 21 日，查理在一场大病中悔改归正。三天后，同样的经历临到约翰。那天晚上他很不情愿地去了阿尔德斯门街的一个聚会，会中有人宣读路德《罗马书注释》的序文。他在日记里写道：“九点差一刻，我听到路德描写神如何借着人信基督在人心中作改变之工，我感到心中有一股异常的温暖；我知道我已经真正信靠基督，单靠基督得救，而且得了凭据，知道祂已除去我的罪，救我脱离了罪与死的律。”

  该书说，这次经历定规了约翰对归正的看法：归正是一种“立时的经验”，之前往往有一段长期痛苦的挣扎，人应当能说出自己归主的时间和地点。但这次经验之后，他自己仍摸索了相当长的时间，才进入毫无恐惧、充满喜乐的境界。

  归正后三个礼拜，他去德国见亲岑多夫，在赫恩胡特住了两个礼拜，但不能完全赞同莫拉维派，他自己在信仰上较主动，莫拉维派则重默想、强调安静依靠神。1739 年起他开始露天布道，1740 年 7 月他和跟随他的人退出费特巷会社，另组“联合会社”，莫拉维派与循道派从此分道扬镳。查理的诗歌《哦，愿我有千万舌》相传就是为纪念自己归正一周年而写的。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十六章“循道派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter40.html"
recalled:
  - "约翰·卫斯理《日记》1738 年 5 月 24 日"
