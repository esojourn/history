name: 忽必烈与阿里不哥争位
summary: 蒙哥死后，忽必烈与弟弟阿里不哥各自称汗，交战四年，1264 年阿里不哥投降。
body: |-
  1259 年蒙哥在钓鱼城下去世，没有指定继承人。留守都城和林的幼弟阿里不哥得到漠北许多宗王和大臣的支持，准备召开大会即位；正在围攻鄂州的忽必烈接受南宋的求和，急速北返。1260 年三月，忽必烈抢先在开平召集支持他的宗王开会，即大汗位，建元中统；不久阿里不哥也在和林附近被推举为大汗，蒙古帝国出现了两个大汗。

  双方随即开战。忽必烈控制着汉地的粮食、物资和兵力，下令断绝向漠北的供应，和林很快陷入饥荒。1260 年冬忽必烈亲征，阿里不哥退到吉利吉思一带；次年双方在昔木土脑儿等地激战，阿里不哥战败。他所依靠的察合台汗国首领阿鲁忽又转而与他为敌，他的处境日益困难，1264 年到上都向忽必烈投降，两年后去世。

  这场汗位之争对蒙古帝国影响深远。金帐汗国、察合台汗国以及后来起兵的窝阔台后裔海都，都不再真正听命于大汗，帝国逐渐分裂为大汗统治的元朝和金帐、察合台、伊利等几个各自为政的汗国；只有伊利汗旭烈兀始终支持忽必烈。忽必烈的统治重心也由此转向汉地，此后他改开平为上都，在燕京修建大都，并定国号为“大元”（另见“元朝建立”条）。
sources: []
recalled:
  - 《元史·世祖本纪》
  - 拉施特《史集》
