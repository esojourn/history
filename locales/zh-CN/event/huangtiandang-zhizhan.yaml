name: 黄天荡之战
summary: 1130 年韩世忠以水军在长江截击北撤的完颜宗弼，把金军困在黄天荡四十多天。
body: |-
  建炎三年（公元 1129 年）秋，金将完颜宗弼率军南侵，渡过长江攻下建康，随后攻入临安、越州、明州，追击宋高宗。高宗从明州乘船入海，金军派船追赶未及，只得退回。金军在江南大肆抢掠，后世称这次追击为“搜山检海”。

  建炎四年（1130 年）春，宗弼带着大批掳掠的财物北撤，准备从镇江一带渡江。浙西制置使韩世忠率水军预先在焦山、金山一带的江面上拦截，宋军的海船高大，金军的小船无法与之对抗，几次渡江都被击退。宗弼退入建康东北的黄天荡，这里是一处死水港汊，无法出江。据《宋史·韩世忠传》，双方相持了四十八天，韩世忠的妻子梁氏亲自擂鼓助战。

  后来有人给金军献计，金军连夜开凿旧河道，从黄天荡通到秦淮河，得以退回建康。宗弼再次出江时，又有人教他趁无风时用火箭射击宋军的船帆，宋军海船依靠风帆行驶，无风时难以移动，被烧毁了许多，韩世忠退回镇江，金军这才渡江北去。与此同时，岳飞在建康附近的牛头山、静安一带截击金军，收复了建康。

  黄天荡之战韩世忠虽然最后没有挡住金军，但以少数兵力牵制金军主力四十多天，打击了金军的士气。此后金军再也没有大举渡过长江，南宋的江南局势逐渐稳定下来。
sources: []
recalled:
  - 《宋史·韩世忠传》
  - 《金史·宗弼传》
  - 《建炎以来系年要录》
