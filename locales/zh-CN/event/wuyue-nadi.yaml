name: 吴越纳土
summary: 978 年吴越王钱俶入朝开封，献出所辖全部州县，吴越和平归宋。
body: |-
  吴越据有两浙，国王钱俶在宋朝统一南方的过程中一直奉宋为正朔，开宝年间还出兵配合宋军攻打南唐。宋太宗即位后，太平兴国三年（公元 978 年）钱俶到开封朝见。这年四月，割据漳州、泉州的陈洪进先献出所辖二州。钱俶见此情形，知道已经无法保全国家，于五月上表献出所辖土地。据《宋史·吴越钱氏世家》，共有十三州一军八十六县。

  吴越纳土后，钱俶留居开封，先后被封为淮海国王、汉南国王等，端拱元年（988 年）去世（另见“钱俶”条）。吴越的归附没有经过战争，两浙地区避免了兵祸，经济和文化得以延续发展。钱氏家族在宋代仍很显赫。至此南方的割据政权全部归于宋朝，只剩下北方的北汉。
sources: []
recalled:
  - 《宋史·世家·吴越钱氏》
  - 《宋史·太宗本纪》
  - 《续资治通鉴长编》卷十九
