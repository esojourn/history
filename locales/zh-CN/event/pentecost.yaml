name: 五旬节圣灵降临
summary: 耶稣升天后的五旬节，门徒在耶路撒冷被圣灵充满，当天约三千人受洗。
body: |-
  据《使徒行传》第 1 章，耶稣复活后嘱咐使徒不要离开耶路撒冷，要等候父所应许的圣灵（1:4–5）。他升天以后，使徒同几个妇人、耶稣的母亲马利亚和耶稣的弟兄聚在一处，同心祷告，聚会的约有一百二十人（1:14–15）；众人又摇签，选出马提亚补上加略人犹大的位分（1:26）。五旬节就是律法所定的七七节，在逾越节后第五十天（《利未记》23:15–16），各地的犹太人这时上耶路撒冷过节。

  第 2 章记五旬节那天，门徒都聚集在一处，忽然从天上有响声下来，好像一阵大风吹过，又有舌头如火焰显现，分开落在各人头上，他们就都被圣灵充满，说起别国的话来（2:1–4）。从各国来住在耶路撒冷的犹太人听见门徒用他们各人的乡谈说话，都很惊讶，经文列举了帕提亚、玛代、以拦、埃及、罗马等地的人（2:5–11）；也有人讥诮说，他们是新酒灌满了。

  彼得和十一个使徒站起来向众人讲话，引先知约珥的话和大卫的诗篇，讲耶稣被钉十字架、神叫他复活（2:14–36）。众人听了觉得扎心，问应当怎样行，彼得叫他们悔改，奉耶稣基督的名受洗。那一天，门徒约添了三千人（2:41）。

  此后信徒恒心遵守使徒的教训，彼此交接、擘饼、祈祷，凡物公用（2:42–47）。后世教会把这一天看作教会的开端，每年在复活节后第五十日纪念。这件事的年份取决于耶稣受难的年份，学界通行公元 30 年和 33 年两说，本条取前一说。
sources: []
recalled:
  - 《使徒行传》第 1—2 章
  - 《利未记》23:15–21
  - 《约珥书》2:28–32
