name: "弗吉尼亚宗教自由法令"
summary: "弗吉尼亚议会废除圣公会的官方地位，宣布信仰自由，为美国宪法第一修正案铺路。"
body: |-
  《历史的轨迹》第四十三章说，“州立教会”是州政府认可的教会，照理所有百姓都属于它；只有它的牧师可以施行宗教仪式，所有居民不论是否属于教会，都要纳税支持它。殖民地末期到建国初期，十三州中有九州设有州立教会：马萨诸塞、新罕布什尔、康涅狄格是公理派，纽约、马里兰、弗吉尼亚、南北卡罗来纳和佐治亚是圣公宗。信义宗、改革宗、长老派都希望自己成为州立教会，只有浸礼派根本不希望有州立教会，贵格派也一样。

  书中说，浸礼派在其他不从国教的教会支持下，领导了“取消州立教会”的运动，受认可的教会当然不愿放弃利益和特权。独立战争初期，纽约、马里兰和最南方各州很快就取消了州立教会，弗吉尼亚则经过长期艰苦的奋斗，到 1786 年才完成；这个运动传遍全国，“不得设立国教”终于写进宪法第一修正案。

  据一般记载，1786 年 1 月弗吉尼亚议会通过的是杰斐逊 1777 年起草的《宗教自由法令》，由麦迪逊推动通过；书中没有提到这两人。第一修正案 1791 年生效，起初只约束联邦政府，马萨诸塞的公理会直到 1833 年才失去官方地位。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十三章“新兴国家的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter48.html"
