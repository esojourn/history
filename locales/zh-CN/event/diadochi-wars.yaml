name: 继业者战争
summary: 亚历山大的部将争夺帝国的四十年战争，结果是三大王国并立。
body: |-
  “继业者”是希腊语“狄阿多科伊”的意译，指亚历山大死后瓜分其帝国的部将。从公元前 322 年佩尔狄卡斯与诸将反目，到前 281 年最后两位老将在库鲁佩狄翁决战，战事断续延续了四十年，现代史家通常分为几个阶段。

  起初争的是谁以两位国王的名义执掌全局。摄政佩尔狄卡斯在前 321 年前后进攻埃及的托勒密，被部下所杀；诸将在特里帕拉狄索斯重新分封，由安提帕特摄政。前 319 年安提帕特去世，其子卡山德与继任摄政的波利伯孔开战，太后奥林匹亚斯杀腓力三世，自己又被卡山德处死；在亚洲，忠于王室的欧迈尼斯前 316 年初败死于安提柯之手。

  此后的主题变成各家联合对付最强的一家。安提柯据有小亚细亚到伊朗的广大地区，卡山德、利西马科斯、托勒密和被逐出巴比伦的塞琉古结盟对抗他，自前 315 年打到前 311 年议和；塞琉古在此期间夺回巴比伦并向东扩张。约前 310 年卡山德杀害亚历山大四世母子，王室绝嗣。前 306 年安提柯父子在塞浦路斯海战获胜后称王，其余诸人相继称王，统一帝国的名义不复存在。前 301 年四王联军在伊普苏斯击杀安提柯，他的领土被瓜分。

  伊普苏斯之后的二十年是余波。安提柯之子德米特里一度夺得马其顿，前 288 年被利西马科斯和皮洛士赶走，后死于塞琉古的囚禁中。托勒密一世在前 283 年前后寿终。前 281 年塞琉古在库鲁佩狄翁击杀利西马科斯，几个月后自己被托勒密·克劳诺斯刺死。随后高卢人南侵，马其顿无主数年，前 277 年德米特里之子安提柯二世击败高卢人后入主马其顿。

  到前 270 年代，局面稳定为三大王国：安提柯王朝的马其顿，控制希腊本土的若干要地；托勒密王朝的埃及，兼有昔兰尼加、塞浦路斯和叙利亚南部；塞琉古王朝，从小亚细亚、叙利亚延伸到伊朗和中亚。此外有帕加马、比提尼亚、本都等小国和罗得岛、埃托利亚同盟、亚该亚同盟等城邦与联盟。这一格局延续到罗马人东来。这一时期的主要史料是狄奥多罗斯《历史丛书》第十八至二十卷，所依据的是亲历者卡狄亚的希罗尼穆斯已佚的著作；前 301 年以后只有零散的记载。
sources: []
recalled:
  - 狄奥多罗斯《历史丛书》卷十八至卷二十
  - 普鲁塔克《欧迈尼斯传》《德米特里传》《皮洛士传》
  - 尤斯丁《腓力史纲要》卷十三至卷十七
  - 阿庇安《叙利亚战争》第 52—64 章
