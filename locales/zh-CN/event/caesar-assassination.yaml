name: 恺撒遇刺
summary: 公元前 44 年 3 月 15 日，恺撒在元老院会场被布鲁图、卡西乌斯等人刺死。
body: |-
  公元前 44 年 3 月 15 日（罗马历的“三月望日”），独裁官恺撒在元老院会议上被一群元老刺死。

  内战结束后，恺撒集中的权力和荣衔越来越多，前 44 年 2 月成为终身独裁官；他的头像铸在钱币上，雕像与历代国王的并列。2 月 15 日的卢佩尔卡利亚节上，执政官安东尼几次把王冠献给他，他推开了。他是在试探民意，还是安东尼自作主张，古人已有不同看法。他定于 3 月 18 日出发远征帕提亚；流言说预言书上写着只有国王才能战胜帕提亚人。

  参与密谋的有六十多人，为首的是大法官马尔库斯·布鲁图和卡西乌斯，以及恺撒的旧部将德基姆斯·布鲁图等；许多人受过恺撒的赦免和提拔。他们自称“解放者”，目的是除掉僭主、恢复共和国。按布鲁图的主张，只杀恺撒一人。西塞罗事先不知情。

  据普鲁塔克和苏维托尼乌斯，占卜师曾警告他提防三月望日；前一夜妻子卡尔普尔尼娅梦见他被杀，劝他不要出门，德基姆斯·布鲁图到家中把他劝了出来。会议在庞培剧场附属的议事厅举行，安东尼被人拦在门外谈话。恺撒落座后，一人上前为流放的兄弟求情，抓住他的托加袍往下扯，这是信号。卡斯卡从背后刺了第一刀，众人随即围上。苏维托尼乌斯说他身中二十三刀，倒在庞培雕像的基座下；有人说他见到布鲁图时用希腊语说了“还有你，孩子”，苏维托尼乌斯自己认为他一言未发。

  元老们四散逃走。行刺者举着匕首走到广场，民众的反应冷淡，他们退上卡皮托利山；雷必达把军队调进城里。3 月 17 日元老院在安东尼主持下达成妥协：行刺者不予追究，恺撒的一切法令和任命照旧有效。几天后的葬礼上，安东尼宣读恺撒给每个公民留下钱财的遗嘱，并展示染血的袍子，人群就地焚化遗体，去烧行刺者的住宅。行刺者陆续离开罗马。4 月，恺撒遗嘱指定的继承人、十八岁的屋大维来到意大利。

  西塞罗后来在信里写道，这件事是以成人的勇气和孩童的谋划做成的。
