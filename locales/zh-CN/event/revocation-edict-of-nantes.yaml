name: "废除南特诏谕"
summary: "1685 年路易十四颁枫丹白露诏书，废除南特诏谕，大批胡格诺派逃离法国。"
body: |-
  1598 年亨利四世颁布南特诏谕，给胡格诺派有限的信仰自由。《历史的轨迹》第三十九章说，从那时到 1685 年，法国约有一百万胡格诺信徒、八百间教会、八百多位牧师；信徒遍及各阶层，多数是中产阶级，在商业、银行、工厂中居领导地位，“像胡格诺那么有钱”成了流行话。他们有色当、蒙托邦、尼姆、索米尔四所学校，师资一流。

  该书说，路易十四最恨复原教，1685 年废除了南特诏谕。据一般记载，此前他已用种种法令逐步限制新教，又派龙骑兵驻在新教徒家中逼人改宗；1685 年 10 月他在枫丹白露颁布诏书，下令拆毁新教教堂，牧师限期离境，平信徒则不许出境，儿童须受天主教洗礼。

  该书说，此后法国改革宗上千人殉道，几百人放弃信仰，约五十万到八十万胡格诺信徒逃到德国、荷兰、英国和美国，法国工商业因此大受打击。逃出的人数现代估计多在二十万左右，书中的数字偏高。第三十九章又说，成千上万人逃到勃兰登堡；大选侯腓特烈·威廉同年颁布波茨坦敕令接纳他们。

  该书说，留下的只剩几千“余民”，退到所谓“旷野”的深山荒野中秘密聚会，政府下令屠杀，连妇女也不例外，留下的牧师几乎被杀尽。第三十一章说，路易十四又与英王詹姆士二世合谋在英国恢复天主教，英国人因此更加警觉。直到 1787 年的容忍诏谕，法国新教徒才重新得到合法地位。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
