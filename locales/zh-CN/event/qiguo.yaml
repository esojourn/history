name: 七国之乱
summary: 公元前 154 年，吴、楚等七个诸侯国以诛晁错为名起兵，三个月被平定。
body: |-
  汉初分封的同姓诸侯王地广势大。景帝即位后，御史大夫晁错主张追究诸侯王的过失，削减其封地。据《史记·吴王濞列传》，朝廷先后削去楚国的东海郡、赵国的河间郡和胶西国的六个县，又议削吴国。吴王刘濞因儿子早年被皇太子打死而长期称病不朝，这时担心削地没有止境，便亲自到胶西与胶西王约定共同起兵。

  景帝三年（公元前 154 年）正月，削吴国会稽、豫章两郡的诏书送到，刘濞在广陵起兵，胶西、胶东、菑川、济南、楚、赵相继响应，以诛晁错为名。刘濞征发国中二十余万人，与楚军合兵西进，围攻梁国。景帝听从袁盎的建议，将晁错斩于长安东市，七国并未罢兵。太尉周亚夫率军东出，在荥阳会合后进驻昌邑，坚壁不战，任由吴楚与梁国相攻，而派轻骑截断其粮道。吴楚军攻梁不下，士卒饥饿溃散。刘濞逃到丹徒，被东越人杀死；楚王刘戊自杀。胶西等国围攻齐都临淄三个月未能攻下，汉军一到便各自退兵，其后诸王或自杀或被诛；赵王据守邯郸，被围数月后城破自杀。《史记》总结说“正月起兵，三月皆破，独赵后下”。

  乱事平定后，《汉书·诸侯王表》说景帝“抑损诸侯，减黜其官”，诸侯王的权力从此受到限制。
