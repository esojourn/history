name: 三藩之乱
summary: 1673 年康熙帝撤藩，吴三桂等起兵反清，战争八年，1681 年平定。
body: |-
  清军入关后，降清的明朝将领吴三桂、尚可喜、耿仲明（后由其孙耿精忠承袭）为清朝统一南方立下了大功，分别受封为平西王、平南王、靖南王，镇守云南、广东、福建，合称“三藩”。三藩拥有重兵，在辖区内任免官吏、征收赋税，云南的军费每年要耗费大量朝廷的钱粮，对中央构成了很大的威胁。

  康熙十二年（1673 年）平南王尚可喜请求回辽东养老，让儿子尚之信留镇广东。康熙帝借机下令撤藩，吴三桂、耿精忠也随即上疏试探，朝中多数大臣主张不撤，康熙帝认为“撤亦反，不撤亦反”，下令全部撤藩。同年十一月吴三桂在昆明起兵，杀死云南巡抚，自称“天下都招讨兵马大元帅”，号召“兴明讨虏”。贵州、湖南、四川、广西的清朝官员纷纷响应，福建的耿精忠、广东的尚之信、陕西的王辅臣也先后起兵，清朝一度失去了长江以南的大部分地区。

  康熙帝坐镇北京，调兵遣将，一面集中兵力在湖南与吴三桂对峙，一面先后招降了王辅臣、耿精忠、尚之信。南怀仁奉命为清军铸造了大量火炮。吴三桂在湖南按兵不动，战局逐渐对清军有利。康熙十七年（1678 年）吴三桂在衡州称帝，不久病死，他的孙子吴世璠继位，退守云南。康熙二十年（1681 年）清军包围昆明，吴世璠自杀，三藩之乱平定。

  平定三藩后，清朝消除了地方割据的隐患，随后转而进攻台湾、对付北方的俄国和准噶尔。这场战争前后八年，波及十几个省，对南方社会经济造成了很大的破坏。
sources: []
recalled:
  - 《清圣祖实录》
  - 《清史稿·吴三桂传》
  - 魏源《圣武记》
