name: 钟离之战
summary: 北魏大军围攻淮南重镇钟离，梁将韦叡、曹景宗以火攻烧断浮桥，大破魏军。
body: |-
  天监四年（公元 505 年），梁武帝派临川王萧宏率大军北伐，次年萧宏在洛口不战而溃。北魏乘机南攻，中山王元英与名将杨大眼率大军围攻淮河南岸的钟离城，在淮河中的邵阳洲两岸架起浮桥，连接南北，以便运输兵员粮草。据《梁书》，钟离守将昌义之城中只有三千人，魏军每天轮番攻城，他坚守不下。

  天监六年（507 年），梁武帝派曹景宗和韦叡前往救援。韦叡从合肥出发，取近路兼程而进，到达邵阳后连夜在魏军阵前筑起营垒，魏军天亮时大为吃惊。三月，淮水暴涨六七尺，韦叡派冯道根等人乘战舰进攻洲上的魏营，又用小船装满干草，灌上油脂，顺流放火焚烧浮桥。桥被烧断，魏军大溃，元英单骑逃走，史称魏军伤亡溺死者十余万。

  钟离之战是南朝对北朝少有的大胜，此后很长一段时间北魏没有再大举南攻，梁朝的淮南防线得以稳定。
sources: []
recalled:
  - 《梁书·韦叡传》
  - 《梁书·昌义之传》
  - 《资治通鉴》卷一百四十六
