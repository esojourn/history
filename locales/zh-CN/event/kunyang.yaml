name: 昆阳之战
summary: 公元 23 年，刘秀等以少数兵力在昆阳击溃王莽的主力大军，新朝随即覆灭。
body: |-
  王莽末年，南方的绿林军和东方的赤眉军相继起事。更始元年（公元 23 年）二月，绿林诸将拥立汉朝宗室刘玄为帝，分兵北上，攻占了昆阳等几座县城。王莽派大司空王邑、大司徒王寻征调各州郡的军队前往镇压。《后汉书·光武帝纪》说这支军队有甲士四十二万，号称百万，五月进入颍川，把昆阳团团围住。

  当时昆阳城中只有八九千人，诸将多想弃城分散。偏将军刘秀主张固守，自己带十三名骑兵乘夜出城，到附近各县调集援兵。六月，他带着几千援军回到昆阳城外，先率步骑千余人为前锋接战，连胜数阵，又亲率敢死之士三千人直冲莽军的中军，王寻阵亡。城中守军乘势鼓噪而出，内外夹击。本纪说当时正遇大风雷雨，屋瓦皆飞，城边的滍水暴涨，溃逃的莽军溺死者数以万计。王邑只带少数人逃回雒阳。

  王莽的主力在这一战中瓦解，各地豪强纷纷起兵响应更始政权。同年九月，绿林军攻入长安，王莽被杀，新朝灭亡。刘秀由此知名，但他的兄长刘縯不久被更始帝所杀，他本人被派往河北，在那里另立了基业。
sources: []
recalled:
  - 《后汉书·光武帝纪》
  - 《汉书·王莽传》
