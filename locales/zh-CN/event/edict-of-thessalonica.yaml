name: 帖撒罗尼迦敕令
summary: 公元 380 年狄奥多西一世下令，臣民都应信奉尼西亚信仰，其余为异端。
body: |-
  尼西亚会议之后的五十多年里，关于圣子与圣父关系的争论没有停息。君士坦提乌斯二世和瓦伦斯都偏向阿里乌派的某一支，东部各大城的主教座多在这一派手里，尼西亚派的主教屡遭放逐。378 年瓦伦斯战死，次年格拉提安立西班牙出身的将军狄奥多西为东部皇帝；西部的教会和这两位皇帝都持守尼西亚信仰。

  狄奥多西在帖撒罗尼迦设大营对付哥特人。公元 380 年 2 月 27 日，他在这里发布一道给君士坦丁堡居民的敕令，照例以三位在位皇帝共同的名义。敕令收在《狄奥多西法典》卷 16，开头两个词是“一切人民”。大意说：我们愿意治下的一切人民，都奉行使徒彼得传给罗马人的那个信仰，也就是现在罗马主教达马苏和亚历山大主教彼得所持守的信仰，相信父、子、圣灵同一神性、同等尊荣、三位一体；遵从这条法律的才可称为大公基督徒，其余的人是疯狂愚妄的，要背上异端的恶名，他们聚会的地方不得称为教堂，先受上帝的惩罚，再受皇帝的处分。

  这年秋天狄奥多西大病一场，由帖撒罗尼迦主教施洗。11 月他进入君士坦丁堡，要城里的阿里乌派主教接受尼西亚信条，对方不从，被逐出城，教堂交给了此前只能在一处小礼拜堂里聚会的拿先斯的贵格利。381 年他召开君士坦丁堡会议，重申并补充了尼西亚信经。

  这道敕令针对的是基督教内部的派别，没有提到异教。后世常说它“把基督教定为国教”，这是概括的说法：它第一次用法律规定了什么是正统，并以罗马和亚历山大两位主教的信仰为准。对传统祭祀的禁止是另外几道法令，391 至 392 年间狄奥多西先后禁止献祭、进入神庙，以至在家里向神像焚香。哥特人此前已经从阿里乌派传教士那里接受了基督教，他们和后来进入帝国的各日耳曼部族因此与罗马居民信仰不同，这个分歧延续了两百年。
sources: []
