name: 伊巴密浓达攻入拉科尼亚与美塞尼建城
summary: 伊巴密浓达率军攻入斯巴达本土，解放被奴役数百年的美塞尼亚人，建美塞尼城。
body: |-
  留克特拉之战后，伯罗奔尼撒的局面大变。曼提尼亚重建了被斯巴达拆散的城市，阿卡迪亚各城结成同盟，并决定兴建一座新的大城麦加洛波利斯作为中心。斯巴达出兵干涉，阿卡迪亚人向底比斯求援。

  公元前 370 年冬，伊巴密浓达和佩洛皮达斯率彼奥提亚军及中希腊盟军南下，与阿卡迪亚、阿尔戈斯、埃利斯的军队会合，古代作家所记的总数有五万到七万人。在盟友的催促下，他们分几路越过边界进入拉科尼亚。斯巴达立国以来，这是第一次有敌军进入它的本土。联军沿欧罗塔斯河而下，烧掠村庄，在河对岸望见了没有城墙的斯巴达城。阿格西劳斯二世把兵力布置在要地，不肯出战；城内有边民和黑劳士图谋响应，被他及时压下。斯巴达许诺给参战的黑劳士自由，据色诺芬有六千人应募。联军没有强攻，南下直到海边的吉提翁，然后转入西面的美塞尼亚。

  美塞尼亚在前 8 世纪至前 7 世纪被斯巴达征服，居民沦为黑劳士，为斯巴达公民耕种土地，是斯巴达制度的经济基础。伊巴密浓达宣布他们恢复自由，召回流散在意大利、西西里和北非的美塞尼亚人后裔，前 369 年在当年抵抗斯巴达的据点伊托美山下建起美塞尼城。城墙用大石砌成，周长约九公里，今天仍有很长的段落保存下来。

  斯巴达由此失去约一半的土地和大部分黑劳士，西面有美塞尼，北面有麦加洛波利斯，被封锁在拉科尼亚之内。它此后始终拒绝承认美塞尼独立，因而长期自外于历次共同和约。伊巴密浓达在外停留了约三个月，超过了彼奥提亚长官的任期，回国后受到审判，被判无罪。
