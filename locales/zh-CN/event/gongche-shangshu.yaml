name: 公车上书
summary: 1895 年康有为等在京举人上书，请求拒和、迁都、变法。
body: |-
  汉代用公家的车马接送应举的人，后来就以“公车”代指入京参加会试的举人。光绪二十一年（1895 年）春，各省举人正在北京参加会试，《马关条约》的内容传来，举人们群情激愤，许多人联名上书，反对割地议和，台湾籍的举人尤其悲愤。

  据康有为的《康南海自编年谱》等记载，五月初，康有为与梁启超在松筠庵召集十八省举人集会，由康有为起草了一份一万八千多字的上书，提出“拒和、迁都、练兵、变法”的主张，有一千二百多人（一说六百余人）签名，但都察院以和约已经批准为由拒绝接收，这次上书没有送达光绪帝。这就是后来所说的“公车上书”。

  关于公车上书的经过，学者之间有很大的争议。有研究认为，当时各省举人确实有大量分别上书的行动，部分由官员组织，并且送达了朝廷；而康有为发动的联名上书并没有真正递交，人数和过程可能被康有为、梁启超在事后夸大。不论具体情节如何，这次事件标志着维新思潮开始走向政治行动。同年康有为考中进士，此后他在北京、上海组织强学会，创办报刊，宣传变法。
sources: []
recalled:
  - 康有为《康南海自编年谱》
  - 梁启超《戊戌政变记》
  - 茅海建《“公车上书”考证补》
