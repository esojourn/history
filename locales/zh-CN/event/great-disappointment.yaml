name: "大失望"
summary: "米勒派预言基督 1844 年复临而落空，追随者分散，一支形成复临安息日会。"
body: |-
  《历史的轨迹》第四十五章说，米勒根据《但以理书》和《启示录》，把基督复临的日子定在 1843 年 3 月 21 日，许多人相信并跟从他。那天过去了，他说基督在这一年中随时会来；1844 年 3 月 21 日过去了，日期再度修订；1844 年 10 月 24 日也过去了，每个日期都因所谓预备期的延长而耽搁。他们 1845 年成立了一个很弱的组织，1846 年基督复临安息日会因守安息日和对《但以理书》第八章的解释而分出，早期领袖是怀特夫人。

  据一般记载，最后的日期是 1844 年 10 月 22 日，而不是书中的 24 日；这一天在复临派史上称为“大失望”。当时许多信徒变卖产业、不收庄稼，在家中或聚会处守候。事后多数人回到原来的教会或放弃信仰，留下的人分成几派：一派仍等候主再来，形成后来的“复临基督教会”；另一派认为 1844 年所应验的是基督在天上圣所开始新的工作，再加上守第七日安息日，形成复临安息日会。米勒本人承认推算有误，但没有接受守安息日的主张。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
