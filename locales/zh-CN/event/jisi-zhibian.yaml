name: 己巳之变
summary: 1629 年皇太极绕道蒙古兵临北京，袁崇焕入援后被下狱处死。
body: |-
  袁崇焕督师蓟辽后，在宁远、锦州一线加强防守。皇太极在正面难以突破，便先征服了漠南蒙古的部分部落，取得了绕道蒙古攻明的通道。崇祯二年（1629 年，干支为己巳）十月，皇太极率领后金军和蒙古军，从喜峰口以西的龙井关、大安口等处攻破长城，攻陷遵化，直逼北京。

  袁崇焕得到消息后，率领祖大寿、何可纲等人星夜入援，赶在后金军之前到达北京城外，在广渠门外与后金军交战。当时城中流言四起，有人说袁崇焕与后金有约，故意放敌入关；他此前擅杀皮岛总兵毛文龙，又曾与后金议和，也让崇祯帝起疑。十二月，崇祯帝以议饷为名召袁崇焕入城，随即将他逮捕下狱。祖大寿等辽东将士得知后带兵东归，经孙承宗等人劝说才回师作战。

  后金军在北京周围劫掠后，攻占了遵化、永平、迁安、滦州四城，留兵驻守，皇太极率主力回到沈阳。崇祯三年（1630 年）孙承宗督师收复了四城。同年八月，袁崇焕以“通虏谋叛”等罪名被凌迟处死。清朝官修《明史》说皇太极曾施行反间计，让被俘的明朝宦官听到袁崇焕与后金有密约的假话后放回，此说是否属实、作用多大，学者看法不一。
sources: []
recalled:
  - 《明史·袁崇焕传》
  - 《清太宗实录》
  - 《崇祯长编》
