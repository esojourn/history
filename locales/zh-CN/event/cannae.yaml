name: 坎尼会战
summary: 汉尼拔以两翼包抄，几乎全歼罗马大军。
body: |-
  公元前 216 年，罗马为一举击败汉尼拔，把军队扩充到前所未有的规模，由两位执政官保卢斯和瓦罗统率，在意大利东南部阿普利亚的坎尼与汉尼拔交战。据波利比乌斯，罗马一方有步兵约八万、骑兵六千余；汉尼拔有步兵四万多、骑兵约一万。两位执政官按日轮流指挥，开战那天轮到瓦罗。

  汉尼拔把高卢和伊比利亚步兵排在中央，阵线向前凸出，两侧是非洲步兵，骑兵在两翼。罗马步兵排成纵深很大的密集队形从中央猛攻，迦太基中军逐步后退，罗马人越挤越深，两侧的非洲步兵转向夹击。迦太基骑兵击溃罗马两翼的骑兵后，绕到罗马步兵背后，合围完成。

  罗马的损失各家数字不同：波利比乌斯说约七万人战死，李维说步兵四万五千五百、骑兵两千七百阵亡。保卢斯战死，瓦罗带少数骑兵逃到韦努西亚。战后卡普阿等城倒向汉尼拔。据李维，罗马元老院拒绝赎回战俘，也没有议和。
sources:
  - 波利比乌斯《历史》卷三第 106—118 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/3*.html
  - 英文维基百科“Battle of Cannae”（核对年份） https://en.wikipedia.org/wiki/Battle_of_Cannae
recalled:
  - 李维《罗马史》卷二十二第 43—61 章；卷二十三第 1—10 章
