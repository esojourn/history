name: 节度使设置
summary: 府兵制瓦解后，唐朝在边境设节度使统领募兵，到天宝初年形成十镇。
body: |-
  唐朝前期以府兵制为主要兵制，府兵平时务农，轮流到京城宿卫和到边境戍守，兵器和衣粮大多自备，以均田制为基础。到武则天、唐玄宗时，土地兼并加剧，农民大量逃亡，府兵的兵源日益不足，番上和戍边的负担又重，府兵制逐渐瓦解。同时边境战事频繁，需要常驻的军队。

  原来朝廷遇有战事临时任命行军总管，战后军队解散。高宗、武则天以后，边境逐渐设立常驻的军镇，统帅称为大总管或都督。景云二年（公元 711 年），唐朝任命贺拔延嗣为河西节度使，一般认为这是正式设立节度使的开始。此后各地陆续设立节度使。开元年间，宰相张说建议招募“长从宿卫”，后改称“彍骑”，代替府兵担任京城宿卫；开元二十五年（737 年）又下诏各镇招募长期服役的“健儿”，募兵制取代了府兵制。

  到天宝元年（742 年），在边境设立了安西、北庭、河西、朔方、河东、范阳、平卢、陇右、剑南九个节度使和岭南五府经略使，合称十镇。据《资治通鉴》，各镇共有兵四十九万人、马八万余匹，而中央直接掌握的兵力远不及边镇，形成“外重内轻”的局面。节度使起初只管军事，后来又兼任支度、营田、采访等使，掌握了辖区的财政和民政。

  据《资治通鉴》，李林甫为了巩固自己的相位，建议玄宗多用不通文字的胡人将领，此后安禄山、哥舒翰、高仙芝等人都担任了节度使，有的人长期身兼数镇。天宝十载（751 年）安禄山同时兼任平卢、范阳、河东三镇节度使，最终在天宝十四载（755 年）起兵叛乱。安史之乱后，节度使扩展到内地，形成了长期的藩镇割据。
sources: []
recalled:
  - 《新唐书·兵志》
  - 《旧唐书·地理志》
  - 《资治通鉴》卷二百一十至二百一十六
