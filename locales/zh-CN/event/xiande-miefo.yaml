name: 周世宗灭佛
summary: 955 年周世宗废无敕额寺院、限制出家、收铜像铸钱，为“三武一宗”之一。
body: |-
  五代时期，许多百姓为了逃避赋役而出家，寺院占有大量土地和人口，民间又多以铜铸佛像，加上铜钱短缺，影响了国家的财政和兵源。显德二年（公元 955 年）五月，周世宗下诏整顿佛教：凡没有朝廷颁发敕额的寺院一律废除，已有敕额的保留；禁止私自剃度，出家须经父母或祖父母同意，并须通过读经的考试；禁止烧身、炼指等自残的修行方式。同年九月，他又下令除了法器以外，民间的铜器、铜像限期交官，用来铸钱。

  据《资治通鉴》，这一年全国保留的寺院有二千六百九十四所，废除的有三万零三百三十六所。有人认为毁坏佛像会有报应，据《资治通鉴》，周世宗说，佛以利人为急，如果佛的真身还在，只要有利于世，尚且愿意割舍，何况这些铜像。

  这次限佛与北魏太武帝、北周武帝、唐武宗的灭佛合称“三武一宗”。与前三次相比，周世宗的措施比较温和，没有大规模迫害僧尼，也没有禁止佛教，保留了有敕额的寺院，主要是出于财政和兵源的考虑。
sources: []
recalled:
  - 《旧五代史·周书·世宗纪》
  - 《五代会要》卷十二
  - 《资治通鉴》卷二百九十二
