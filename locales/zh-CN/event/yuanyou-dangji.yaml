name: 元祐党籍碑
summary: 宋徽宗、蔡京把司马光、苏轼等三百多人列为“元祐奸党”，刻碑公布，禁止其子孙做官。
body: |-
  宋徽宗即位之初，曾试图调和新旧两党，改年号为“建中靖国”。不久他转而推崇新法，崇宁元年（公元 1102 年）任命蔡京为宰相。这年九月，徽宗亲笔书写元祐年间反对新法的大臣的名单，刻石立于端礼门外，称为“元祐党籍碑”。崇宁三年（1104 年）名单扩大，据《宋史·徽宗本纪》，共三百零九人，由蔡京书写，颁布全国各州县刻石。名单中有司马光、文彦博、吕公著、苏轼、苏辙、范纯仁、程颐、黄庭坚、秦观等人，甚至包括一些原属新党而与蔡京不和的人。

  列入党籍的人，子孙不得在京城做官，宗室不得与他们的子孙通婚，苏轼、黄庭坚等人的文集也被下令销毁。据宋人记载，九江的刻碑石工李仲宁说自己家靠刻苏轼、黄庭坚的文字才得以温饱，不忍心把他们刻为奸人，官府只好允许他不在碑上刻自己的名字。崇宁五年（1106 年）正月天空出现彗星，徽宗下令毁去党籍碑，解除部分禁令。今天广西桂林等地还保存着南宋时党籍中人的后代重刻的元祐党籍碑。
sources: []
recalled:
  - 《宋史·徽宗本纪》
  - 王明清《挥麈录》
  - 《续资治通鉴长编拾补》卷二十至二十六
