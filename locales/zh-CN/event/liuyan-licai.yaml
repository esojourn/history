name: 刘晏理财
summary: 唐代宗时刘晏整顿漕运、改革盐法，恢复了安史之乱后朝廷的财政来源。
body: |-
  安史之乱后，河北被藩镇割据，河南、关中残破，朝廷的赋税主要依靠江淮。但汴河因战乱淤塞，江淮的粮食运不到长安，关中米价飞涨。广德二年（公元 764 年）前后，唐代宗任命刘晏主管漕运和盐铁等财政事务。

  在漕运上，刘晏亲自考察了汴河、黄河、渭水的水道，组织疏浚汴河，实行分段运输：江船不入汴河，汴船不入黄河，河船不入渭水，在扬州、河阴、渭口等地建仓转运。他用盐利雇用船工，不再向沿途百姓摊派徭役。江淮的粮食得以源源不断运到长安。

  在盐法上，他改革了第五琦制定的官运官销的榷盐法，改为由官府在产地收购亭户所产的盐，加价后卖给商人，任商人运销各地；在偏远地区设常平盐，盐价高时由官府平价出售。据《新唐书·食货志》，盐利从每年四十万缗增加到大历末年的六百余万缗，占天下赋税的一半，宫廷费用、军饷和百官的俸禄都依靠它。他还在各道设巡院，用快马传递各地的物价和收成，以便及时调剂。

  刘晏理财多年，史书称他不增加百姓的负担而使国用充足。建中元年（780 年）他被杨炎陷害致死，但他建立的盐法和漕运制度在唐后期一直沿用。
sources: []
recalled:
  - 《新唐书·食货志》
  - 《旧唐书·刘晏传》
  - 《资治通鉴》卷二百二十六
