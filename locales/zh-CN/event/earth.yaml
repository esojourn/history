name: 测算地球周长
summary: 埃拉托色尼比较赛伊尼与亚历山大夏至正午的日影，推算出地球的周长。
body: |-
  希腊学者在埃拉托色尼之前已经认为大地是球形，亚里士多德还转述过一个周长四十万斯塔德的估计，但没有说明算法。埃拉托色尼在亚历山大任图书馆馆长期间做了有明确方法的测算。他为此写的《论地球的测量》已经失传，测算的年份也没有记载，“约公元前 240 年”只是今人通行的约数。

  现在所知的方法来自公元后的天文学作者克莱奥迈德斯的转述，他自称讲的是简化的版本。埃拉托色尼假定赛伊尼（今阿斯旺）与亚历山大在同一条经线上，两地相距五千斯塔德，又假定太阳光线平行。夏至正午，赛伊尼的日晷指针没有影子，亚历山大的指针影子所对的弧是圆周的五十分之一，因此地球周长是五千斯塔德的五十倍，即二十五万斯塔德。斯特拉波、老普林尼等人所记的数字是二十五万二千斯塔德，合每度七百斯塔德。

  一斯塔德合多少米，今人有约 157 米和约 185 米等不同说法，因此这个结果与实际周长（约四万公里）相差多少，没有定论。赛伊尼其实略在北回归线以北，两地也不在同一条经线上，五千斯塔德的距离是个整数约数。这次测算仍是已知最早的、方法有记载的地球周长测量，其数字为后来的希帕恰斯、斯特拉波等人沿用。
sources:
  - 斯特拉波《地理学》第 2 卷第 5 章第 7 节、第 34 节 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Strabo/home.html
  - 英文维基百科“Earth's circumference”条 https://en.wikipedia.org/wiki/Earth%27s_circumference
recalled:
  - 克莱奥迈德斯《论天体的圆周运动》第 1 卷第 10 章（一作第 1 卷第 7 章）
  - 老普林尼《博物志》第 2 卷第 247 节
