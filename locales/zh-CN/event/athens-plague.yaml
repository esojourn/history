name: 雅典瘟疫
summary: 公元前 430 年起雅典城内瘟疫流行数年，伯里克利病死。
body: |-
  公元前 430 年初夏，伯罗奔尼撒战争进入第二年，斯巴达军队再次侵入阿提卡，乡村的居民都按伯里克利的方略挤进了雅典城和长墙之间，许多人住在闷热的棚屋里。瘟疫就在这时出现。修昔底德说，据传它起于埃及以南的埃塞俄比亚，经埃及、利比亚传入波斯帝国的大部分地区，在雅典最先发作于港口比雷埃夫斯。

  修昔底德自己得过这病，也亲眼见过别人患病，他说写下症状是为了日后再出现时人们能够认出：身体健康的人突然头部高热，眼睛红肿，咽喉和舌头出血，接着打喷嚏、咳嗽、呕吐、抽搐；皮肤发红，出小脓疱和溃疡，体内灼热得不能忍受衣被，口渴不止；多数人在第七天或第九天死去，熬过去的又往往死于随后的腹泻，或者失去手指、脚趾、眼睛，有的丧失记忆。医生不识此病，因为接触病人最多而死得最多；求神问卜一概无效。得过一次的人不会再次致命地染上，只有他们敢去照料病人。

  他还写了人心的变化：尸体堆在神庙里和街上，葬礼的规矩无人遵守，有人把亲人的尸体扔到别人堆好的柴堆上；人们见善恶同归于尽，钱财朝不保夕，便只图眼前的享乐，对神的敬畏和对法律的顾忌都失去了约束力。

  瘟疫流行了两年，间歇之后在前 427 年冬再度发作，又持续一年。据修昔底德，名册上的重装步兵死了四千四百人，骑兵三百人，其余的民众死者无数。现代的估计认为雅典损失了四分之一到三分之一的人口。雅典人一度迁怒伯里克利，把他罢免；他的两个儿子病死，他本人也在前 429 年秋去世。

  这是什么病，至今没有定论。学者根据修昔底德的描述提出过斑疹伤寒、天花、麻疹、伤寒等多种看法。2006 年有研究称在同时期的合葬坑遗骨的牙髓里检出伤寒杆菌的遗传物质，这一结论受到了质疑。
