name: 清统一台湾
summary: 1683 年施琅攻克澎湖，郑克塽投降，次年清朝在台湾设府。
body: |-
  郑成功去世后，他的儿子郑经继续统治台湾，改东都为东宁。三藩之乱时郑经曾出兵福建沿海，失败后退回台湾。康熙二十年（1681 年）郑经去世，部将冯锡范等人杀死郑经的长子郑克臧，拥立年仅十二岁的次子郑克塽，郑氏内部人心不稳。

  同年康熙帝采纳李光地等人的推荐，任命曾是郑成功部将的施琅为福建水师提督，准备进攻台湾。康熙二十二年（1683 年）六月，施琅率领战船三百多艘（各书记载不一）、两万多名官兵从铜山出发，进攻澎湖。郑军大将刘国轩率军防守，双方激战数日，清军攻克澎湖，郑军主力几乎全部覆没，刘国轩逃回台湾。

  澎湖失守后，台湾郑氏君臣决定投降。七月郑克塽上表请降，八月施琅率军进入台湾，郑克塽、刘国轩、冯锡范等人剃发归顺，后来被送到北京，郑克塽被封为汉军公。施琅到郑成功的庙中祭奠，表示与郑氏的旧怨已经了结。

  台湾归附后，清朝内部一度争论是否放弃台湾，施琅上疏力陈台湾的战略地位，主张保留。康熙二十三年（1684 年）清朝在台湾设立台湾府，下辖台湾、凤山、诸罗三县，隶属福建省，台湾从此纳入清朝的版图。同年清朝开放海禁，在广州、厦门、宁波、云台山设立海关。
sources: []
recalled:
  - 施琅《靖海纪事》
  - 《清圣祖实录》
  - 江日昇《台湾外记》
