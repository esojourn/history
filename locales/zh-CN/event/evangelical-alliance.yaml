name: "福音派联盟成立"
summary: "1846 年各国福音派信徒在伦敦组成的联合会，是近代复原教合作的第一次努力。"
body: |-
  《历史的轨迹》第四十九章说，从改教一开始，复原教就显出分裂的趋势，路德、慈运理、加尔文对许多事看法不一；但也从一开始就有人努力克服，例如路德和慈运理在马尔堡的会谈，加尔文在书信、教导和会议中也为复原运动带来相当程度的合一。书中说，近代复原教会谋求合作的第一次努力，是 1846 年在伦敦成立的“福音派联盟”：美国、英国有五十多个福音派团体加入，九个欧洲国家设有支会，推动了许多合作活动，可惜到十九世纪末热诚已经消失。

  该书又说，福音派联盟其实是个人基督徒组成的协会，而不是各教会的联盟；它衰落之际，1908 年在美国成立了“美国基督教联合会”，这才是教会的联盟。据一般记载，1846 年 8 月的伦敦大会有八百多位代表，来自五十多个宗派；联盟订有一份简短的福音派信仰声明，倡导每年一月第一周的联合祷告周，并为各国受逼迫的少数派信徒奔走。英国的福音派联盟至今仍在。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十九章“教会联盟与联合” https://wellsofgrace.com/books/spiritual/2000years/html/chapter54.html"
