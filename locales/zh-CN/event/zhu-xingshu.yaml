name: 子产铸刑书
summary: 前 536 年郑国执政子产把刑法铸在鼎上公之于众，这是中国古代较早的成文法公布。
body: |-
  春秋以前，刑法由贵族掌握，并不向百姓公布，所谓“刑不可知，则威不可测”。公元前 536 年三月，郑国执政子产把刑法条文铸在鼎上，向全国公布，史称“铸刑书”。

  据《左传》昭公六年，晋国大夫叔向写信给子产表示反对，认为先王“议事以制，不为刑辟”，是担心百姓有争夺之心；一旦公布刑书，百姓知道了法律条文，就会依据条文争讼，“锥刀之末，将尽争之”，礼制将被破坏，郑国恐怕要在子产这一代衰败。子产回信说：“侨不才，不能及子孙，吾以救世也。”表示自己只是为了挽救当世的危局。

  二十多年后，公元前 513 年晋国也铸了刑鼎，孔子批评晋国将要灭亡。铸刑书反映了春秋后期社会关系的变化，后世常把它看作中国古代成文法公布的开端之一，与战国时李悝作《法经》、商鞅变法一脉相承。

  铸刑书的具体条文没有流传下来。据《左传》定公九年，后来郑国大夫邓析私自编了一部刑法写在竹简上，称为“竹刑”，郑国执政驷歂杀了邓析，却采用了他的竹刑。这说明公布成文法在当时已成为难以逆转的趋势。

  子产铸刑书比晋国铸刑鼎早二十多年，比战国各国的变法早一百多年，在中国法制史上有重要地位。
sources: []
recalled:
  - 《左传》昭公六年
  - 《左传》昭公二十九年
