name: 三家分晋
summary: 前 403 年周王承认韩、赵、魏为诸侯，晋国一分为三。
body: |-
  春秋后期，晋国的大权落入卿族手中。公元前 453 年，韩、赵、魏三家联手灭了智氏，瓜分其地，晋国国君只剩下绛和曲沃两地，反而要朝见三家。三家各自经营自己的领地，实际上已经成为独立的国家。

  公元前 403 年，周威烈王正式册命魏斯（魏文侯）、赵籍（赵烈侯）、韩虔（韩景侯）为诸侯，三家由卿大夫一跃成为与晋君并列的诸侯。此后晋国名存实亡，公元前 376 年三家废晋静公，把晋国剩下的土地也瓜分了。

  北宋司马光编《资治通鉴》，即从公元前 403 年三家分晋写起。他在第一条“臣光曰”中评论说，周天子亲自册命篡夺君权的大夫为诸侯，等于自己破坏了礼制，“先王之礼于斯尽矣”。关于战国时代的起点，学界有前 475 年（《史记·六国年表》的起点）、前 453 年、前 403 年等不同说法，时间长河上战国一段按前 475 年画出。

  韩、赵、魏合称“三晋”，此后与秦、楚、齐、燕并称“战国七雄”。三家分晋与田氏代齐，都是大夫取代诸侯并得到周王承认，标志着西周以来的宗法分封秩序彻底瓦解。

  三家分晋前后，魏国在文侯时最先强大，赵国后来以邯郸为都，韩国灭郑后迁都新郑。
sources: []
recalled:
  - 《资治通鉴》卷一
  - 《史记·晋世家》
  - 《史记·六国年表》
