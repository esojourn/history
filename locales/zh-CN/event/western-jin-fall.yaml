name: 西晋灭亡
summary: 汉国将领刘曜围攻长安，晋愍帝粮尽出降，西晋灭亡。
body: |-
  永嘉五年（公元 311 年）洛阳陷落后，汉国的军队一度占领长安。关中的晋朝官吏和豪强合力反攻，次年把汉军赶走，逃到那里的秦王司马邺被立为皇太子，建兴元年（313 年）怀帝的死讯传来，他即位为帝，就是晋愍帝。这时的长安久经兵火，人口稀少，朝廷的财用和兵力都极其有限。

  愍帝的朝廷由关中人索綝、麹允主持。他们任命在江东的琅邪王司马睿为左丞相，在秦州的南阳王司马保为右丞相，要求两人分别领兵北上、东进，共同收复洛阳。司马睿以江南初定为由没有出兵，司马保也按兵不动。在并州的刘琨虽然遥相呼应，自身也难以支持。汉国的刘曜则连年进攻关中。

  建兴四年（316 年）八月，刘曜进逼长安，先攻占外城，愍帝和大臣退守小城，内外断绝。据《晋书·愍帝纪》，城中饥饿已极，一斗米值黄金二两，人相食，死者过半，麹允只能把酿酒用的曲饼磨碎煮成粥供愍帝食用。十一月，愍帝对麹允说，如今外无救援，只有忍耻出降，使士民得以活命。他乘坐羊车，袒露上身，口衔玉璧，让人抬着棺材，出东门投降，群臣号哭着攀住车子。刘曜烧掉棺材，接受玉璧，把他送往平阳。

  从泰始元年（按公历已是 266 年）晋武帝称帝算起，西晋历四帝、五十一年；从太康元年（280 年）灭吴统一算起，只有三十六年。愍帝在平阳受到种种羞辱，一年多后被杀。消息传到江东，司马睿即皇帝位，延续晋朝，史称东晋。在北方，汉国的将领石勒已在河北自成一体，刘曜不久也在长安称帝，黄河流域进入各政权并立的时期。
sources: []
recalled:
  - 《晋书·愍帝纪》
  - 《晋书·刘聪载记》
  - 《资治通鉴》卷八十八、八十九
