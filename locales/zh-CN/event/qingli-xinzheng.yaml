name: 庆历新政
summary: 1043 年宋仁宗任用范仲淹等推行改革，整顿吏治，一年多后停止。
body: |-
  宋仁宗时，官员人数不断膨胀，依靠父祖恩荫做官的人很多，考核升迁主要看资历，地方官员中庸碌无能的不少；军队人数多而战斗力弱，宋夏战争中三战三败；财政入不敷出，各地又不时发生兵变和民变。庆历三年（公元 1043 年），仁宗起用范仲淹为参知政事、富弼和韩琦为枢密副使，又任命欧阳修、余靖、王素、蔡襄为谏官，下诏要求他们提出改革的办法。

  这年九月，范仲淹上《答手诏条陈十事》，提出明黜陟、抑侥幸、精贡举、择官长、均公田、厚农桑、修武备、减徭役、覃恩信、重命令十项主张。仁宗大多采纳，陆续颁布诏令：改革官员按资历升迁的磨勘制度，严格考核政绩；限制恩荫的人数和范围；派遣按察使到各路考察地方官，罢免不称职的人；改革科举，先考策论，再考诗赋；下诏州县设立学校。据宋人记载，范仲淹审阅各路官员的名册，看到不称职的就一笔勾去，富弼劝他说，一笔勾去容易，可是一家人要哭了，范仲淹回答，一家哭总比一路哭好。

  新政触动了许多官员的切身利益，反对的声音越来越大。反对者指责范仲淹等人结为朋党，欧阳修写《朋党论》辩驳，反而加深了仁宗的疑虑。据《续资治通鉴长编》，夏竦让家中的婢女模仿石介的笔迹，伪造了一封给富弼的信，诬称他们谋划废立皇帝，范仲淹、富弼因此不安于朝，主动请求到边地任职。庆历五年（1045 年）初，范仲淹、富弼、韩琦等人先后被罢职，新政的大部分措施也被废止，前后只有一年多。

  庆历新政虽然很快失败，但它提出的问题没有解决，二十多年后宋神宗任用王安石推行规模更大的变法（另见“王安石变法”条）。新政中兴办州县学校、改革科举的主张，对宋代教育和学风有长远的影响。
sources: []
