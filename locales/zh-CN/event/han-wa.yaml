name: 倭奴国遣使与“汉委奴国王”金印
summary: 公元 57 年倭奴国使者到雒阳朝贡，光武帝赐以印绶。
body: |-
  《后汉书·东夷列传》记载：“建武中元二年，倭奴国奉贡朝贺，使人自称大夫，倭国之极南界也。光武赐以印绶。”建武中元二年即公元 57 年，这一年二月光武帝去世。这是中国正史中关于日本列岛的政权与中原王朝往来的最早一条有确切年份的记录。

  1784 年，日本九州北部博多湾的志贺岛上出土一枚蛇钮金印，印文为“汉委奴国王”五字。学界一般认为它就是光武帝所赐的那枚印，“委奴国”即《后汉书》的“倭奴国”，是当时九州北部的一个小国。这枚金印现藏于福冈市博物馆，被日本定为国宝。关于印文的读法以及金印的真伪，历来也有不同意见。

  《后汉书》还记载，安帝永初元年（107 年）倭国王帅升等又遣使献上生口一百六十人，请求朝见。
sources: []
recalled:
  - 《后汉书·东夷列传》
  - 《后汉书·光武帝纪》
