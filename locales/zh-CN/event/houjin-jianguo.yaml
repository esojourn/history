name: 后金建立
summary: 1616 年努尔哈赤在赫图阿拉称汗，国号“金”，史称后金。
body: |-
  明朝在东北设立卫所，管理女真各部，女真人大致分为建州、海西和东海（野人）三部分。万历十一年（1583 年）起，建州女真的努尔哈赤起兵，经过三十多年，先后统一了建州女真各部，征服了海西女真的哈达、辉发、乌拉，只有叶赫部还在明朝的支持下与他对抗。

  在这一过程中，努尔哈赤创立了八旗制度：以三百人为一牛录，五牛录为一甲喇，五甲喇为一固山，固山就是“旗”，起初有黄、白、红、蓝四旗，万历四十三年（1615 年）增加镶黄、镶白、镶红、镶蓝四旗，合为八旗。八旗既是军事组织，也是行政和生产组织，旗人平时耕种、狩猎，战时出征。万历二十七年（1599 年）他命额尔德尼等人借用蒙古字母创制满文。

  万历四十四年（1616 年）正月，努尔哈赤在赫图阿拉即汗位，建立“金”国，史称“后金”，年号天命。这个国号表示继承十二世纪女真人建立的金朝。万历四十六年（1618 年）四月，他以“七大恨”告天，列举明朝杀害他的父祖、偏袒叶赫等七件事，起兵反明，攻陷抚顺。明朝随即调集大军征讨，次年在萨尔浒大败（另见“萨尔浒之战”条）。

  后金在 1636 年改国号为“清”（另见“皇太极改国号大清”条）。后金从建国到改号虽然属于明朝时期，但它的历史与此后的清朝是一体的，本站把它放在中国泳道（理由见项目计划）。
sources: []
recalled:
  - 《清太祖武皇帝实录》
  - 《满文老档》
  - 《明神宗实录》
