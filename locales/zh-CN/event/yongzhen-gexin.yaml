name: 永贞革新
summary: 805 年唐顺宗任用王叔文等人革除弊政、谋夺宦官兵权，半年后顺宗让位，革新失败。
body: |-
  贞元二十一年（公元 805 年）正月唐德宗去世，已经中风失语的太子李诵即位，是为唐顺宗。顺宗做太子时的侍读王叔文、王伾随即进入翰林院，联合宰相韦执谊和刘禹锡、柳宗元、韩泰、陈谏、凌准、韩晔、程异等一批年轻官员主持朝政。由于顺宗不能说话，他们通过宦官李忠言和顺宗的宠妃牛昭容传递旨意。

  他们在几个月里推行了一系列措施：罢除宦官借采买之名强取民物的宫市，取消为皇帝捕捉鸟兽、在民间横行的五坊小儿；停止各地节度使在正税之外的进奉；免除百姓积欠的租税；贬斥贪暴的京兆尹李实；召回被贬的陆贽、阳城等人；释放宫女和教坊女乐数百人。他们还任命老将范希朝为京西神策诸军节度使、韩泰为行军司马，想从宦官手中收回神策军的兵权，但神策军各将领事先得到宦官的指示，拒不交出兵权。

  宦官俱文珍、刘光琦等人与剑南西川节度使韦皋、荆南节度使裴均、河东节度使严绶等人联合，上表请求太子监国。三月顺宗被迫立长子李纯为太子。王叔文因母亲去世离职，失去了主持者。八月顺宗让位给太子，自称太上皇，改元永贞。唐宪宗即位后，王伾被贬为开州司马，不久病死；王叔文被贬为渝州司户，次年被赐死；韦执谊、柳宗元、刘禹锡等八人都被贬为远州司马，史称“二王八司马”。这场改革前后只有一百多天，后人称为“永贞革新”。

  唐宋时期的史书多贬斥王叔文等人，韩愈在他主持修撰的《顺宗实录》中也持批评态度；清代王夫之等人则认为他们的措施切中时弊，对他们多有同情。
sources: []
recalled:
  - 《旧唐书·顺宗纪》
  - 韩愈《顺宗实录》
  - 《资治通鉴》卷二百三十六
  - 王夫之《读通鉴论》卷二十五
