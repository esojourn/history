name: 苏特里会议
aliases:
  - 亨利三世废三教皇
summary: 1046 年皇帝亨利三世召开会议，废去三位对立的教皇。
body: |-
  1045 年罗马出现了三位教皇。《历史的轨迹》第十一章说：图斯库伦家族所立的本笃九世品行极坏，被对立的家族赶走，另立西尔维斯特三世；本笃回来后又把职位卖给一位司铎，即贵格利六世，事后却不肯交出，于是三人并立。该书说，无论新教徒还是天主教徒，都应当为这段黑暗的日子伤痛。

  贵格利六世本人名声不坏。第十四章说，他是当时罗马少数几个能干的修士之一，出钱是为了让败坏的教皇离开；年轻的希尔得布兰就在他手下做事。

  1046 年秋德意志国王亨利三世南下，准备在罗马加冕为皇帝。该书说克吕尼一派的改革者向他求援。12 月 20 日他在罗马以北的苏特里召开会议：西尔维斯特三世被革职；贵格利六世承认付过钱，去了职，被送往德意志，希尔得布兰随行。几天后在罗马的会议又废了本笃九世。罗马的教士中找不到合适的人选，亨利让随行的班贝格主教当了教皇，称克莱门特二世，圣诞节那天新教皇为亨利加冕。贵格利六世是自己辞职还是被会议罢免，当时的记载不一致。

  此后十年，教皇都由亨利从德意志主教里挑选：克莱门特二世之后是达马苏斯二世、利奥九世、维克多二世。这些人把改革带进了教廷。但皇帝一人就能废立教皇，这本身正是改革者后来要反对的事；亨利一死，他们就着手使教皇的选举摆脱皇帝的控制。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十一章“教会被政府控制” https://wellsofgrace.com/books/spiritual/2000years/html/chapter13.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十四章“教会为自由奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter16.html"
recalled:
  - 赖兴瑙的赫尔曼《编年史》1046 年条
  - 苏特里的博尼佐《致友人书》卷 5
  - 蒙特卡西诺的德西德里乌斯《对话录》卷 3
