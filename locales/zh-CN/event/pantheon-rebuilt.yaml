name: 哈德良重建万神殿
summary: 哈德良在位前期重建罗马万神殿，穹顶直径四十三米，至今完好。
body: |-
  万神殿最初是奥古斯都的女婿阿格里帕在公元前 27 至前 25 年间建的，位于罗马城北的战神原野。它在公元 80 年的大火里烧毁，图密善修复，110 年又遭雷击起火。现存的建筑是此后重建的。砖上打的印记多属哈德良即位头几年，一般认为工程约在 118 年开始、126 年前后完成；也有学者根据一部分砖印主张图拉真晚年已经动工。门廊的额枋上仍刻着“卢基乌斯之子马尔库斯·阿格里帕第三次任执政官时建造”，《罗马帝王纪》说哈德良修复建筑照例不署自己的名字。

  建筑分前后两部分。前面是门廊，立着十六根整块的埃及花岗岩柱子，每根高约十二米。后面是一个圆筒形的大厅，上覆半球形穹顶。穹顶的内径和从地面到顶点的高度都是四十三米多，一个完整的球体恰好可以放进厅内。顶部正中留了一个直径约九米的圆洞，是厅内唯一的光源，雨水从这里落下，由略微隆起的地面上的小孔排走。

  穹顶用混凝土一层层浇成，没有钢筋。墙基的骨料是沉重的石灰华，向上依次换成凝灰岩和碎砖，到顶部用的是轻质的浮石；内侧做出五圈逐渐缩小的方形凹格，既是装饰，也减了重量；壁厚从底部的六米左右收到洞口处的一米多。它至今仍是世界上最大的无筋混凝土穹顶。

  卡西乌斯·狄奥说，哈德良有时在这里升座审案。它原先供奉哪些神并不清楚，狄奥自己对“万神殿”这个名字也只是猜测其来历。609 年东罗马皇帝把它交给教皇，改作教堂，因此没有像别的神庙那样被拆毁。十七世纪教皇乌尔班八世拆走了门廊屋架上的青铜。文艺复兴以来它一直是建筑师研习的范本，画家拉斐尔葬在这里。
sources: []
