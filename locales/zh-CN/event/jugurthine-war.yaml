name: 朱古达战争
summary: 罗马与努米底亚国王朱古达的战争，暴露贵族将领的受贿无能，马略由此崛起。
body: |-
  公元前 112 年至前 105 年罗马与努米底亚国王朱古达的战争。努米底亚是罗马在北非的属国。前 118 年国王米基普萨死后，养子朱古达杀死一个堂兄弟，与另一个堂兄弟阿德赫巴尔相争，罗马使团把王国一分为二。前 112 年朱古达攻下基尔塔，杀死阿德赫巴尔和城中的意大利商人。在保民官梅米乌斯鼓动下，罗马于前 111 年出兵。

  头几年的战事成了丑闻。执政官贝斯提亚很快与朱古达议和，条件之轻令人怀疑受贿。朱古达被传到罗马作证，一名保民官出面不许他开口。前 110 年一支罗马军队被围投降，从轭下走过。保民官马米利乌斯设立特别法庭追究，贝斯提亚等人被判有罪。

  前 109 年执政官梅特卢斯到任，整顿了军纪，在穆图尔河击败朱古达，攻取数城，但无法捉住在沙漠边缘游击的国王。朱古达说动岳父、毛里塔尼亚国王博库斯参战。梅特卢斯的副将马略出身骑士家庭，他回罗马竞选，指责贵族将领拖延战事，当选前 107 年的执政官；人民大会不顾元老院已延长梅特卢斯的任期，把指挥权交给了他。马略招募没有财产的志愿者补充军队。他攻下卡普萨等要塞，两次击退朱古达和博库斯的联军，仍不能结束战争。

  前 105 年，马略的财务官苏拉冒险深入博库斯的营地谈判。据萨卢斯特，博库斯在出卖朱古达还是出卖苏拉之间犹豫到最后一刻，最终设伏擒住女婿交给罗马人。朱古达在马略的凯旋式上游街后死在狱中。努米底亚西部划给博库斯，其余交给朱古达的异母兄弟。

  这场战争规模不大，记载详细是因为萨卢斯特写了专著。他要说的是贵族的贪婪和无能，以及“新人”马略的崛起；人民大会越过元老院指定统帅，马略与苏拉为谁擒住朱古达而生的嫌隙，都预示了后来的内战。
sources: []
recalled:
  - 萨卢斯特《朱古达战争》
  - 普鲁塔克《马略传》第 7—12 章
  - 李维《建城以来史》卷六十四至卷六十六摘要
