name: 八王之乱
summary: 西晋宗室诸王为争夺朝政连年混战，前后十六年，耗尽国力，直接引出北方各族的起兵。
body: |-
  晋武帝鉴于曹魏宗室无权而亡，大封同姓为王，后来又让诸王出镇要地、统领军队。他去世后，继位的惠帝不能理政，朝廷大权成了外戚和宗王争夺的对象。《晋书》把汝南王亮、楚王玮、赵王伦、齐王冏、长沙王乂、成都王颖、河间王颙、东海王越八人合为一传，“八王之乱”由此得名，实际卷入的宗王不止八位。

  变乱分为两段。元康元年（公元 291 年），皇后贾南风先联合楚王玮杀了辅政的外戚杨骏，又借楚王之手杀汝南王亮和卫瓘，再以擅杀之罪处死楚王，此后她专政近十年，朝局大体平静。永康元年（300 年）贾后害死太子，赵王伦乘机废杀贾后，次年自立为帝，局面再也无法收拾。

  从永宁元年（301 年）起，战事从宫廷政变扩大为各地方镇之间的大战。齐王冏、成都王颖、河间王颙起兵推翻赵王伦，据《晋书》，双方交战六十余日，死者近十万。齐王入洛执政，一年多后被长沙王乂所杀；长沙王又遭成都王、河间王联兵围攻，守城数月后被东海王越出卖。此后成都王在邺城遥控朝政，东海王奉惠帝北征，在荡阴战败，惠帝被俘入邺；幽州的王浚等引鲜卑、乌桓骑兵攻破邺城，河间王的部将张方把惠帝劫往长安。最后东海王越在关东重整兵力，光熙元年（306 年）攻入长安，把惠帝迎回洛阳，成都王、河间王先后被杀。同年底惠帝去世，怀帝即位，东海王独掌大权，乱事才告一段落。

  十六年间，洛阳、长安、邺城几经洗劫，中原的军队和人口损失惨重，朝廷的权威荡然无存。诸王为了取胜，竞相招引匈奴、鲜卑、乌桓的骑兵助战。匈奴贵族刘渊就是以为成都王调兵为名回到并州，在永兴元年（304 年）自立为汉王的；同一年，流民首领李雄在成都称王。西晋的统一维持了不到三十年，此后中国北方陷入长期的分裂。
sources: []
