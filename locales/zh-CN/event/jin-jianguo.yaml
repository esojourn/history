name: 金建国
summary: 1114 年完颜阿骨打起兵反辽，次年称帝，国号大金，并在护步答冈大败天祚帝。
body: |-
  女真人生活在今东北的松花江、黑龙江流域，以渔猎和农耕为生，长期臣服于辽朝。辽朝把女真分为“熟女真”和“生女真”，生女真中的完颜部在十一世纪逐渐统一了附近各部。辽朝每年向女真索取名鹰海东青、北珠等物，派去的“银牌天使”常常勒索欺凌，女真人积怨很深。天庆二年（1112 年）的“头鱼宴”上，完颜阿骨打拒绝为天祚帝起舞，双方的矛盾更加尖锐。

  天庆四年（公元 1114 年）九月，阿骨打以辽朝不肯交出女真叛逃者为理由，在来流水誓师起兵。据《金史》，当时各路兵马会合，共二千五百人。女真军攻下辽朝的边城宁江州；十一月又在出河店击败辽将萧嗣先率领的大军。辽朝的失败震动了东北各部，许多部族投向女真。

  收国元年（1115 年）正月，阿骨打称帝，国号大金。同年九月金军攻下辽朝在东北的重镇黄龙府。天祚帝亲率大军东征，在护步答冈被金军击败，辽军溃散。此后金朝向西、向南扩张，先后攻下辽朝的东京、上京等地（另见“金灭辽”条）。

  金朝建国后，阿骨打把女真原有的猛安谋克组织改为军政合一的基层制度，三百户为一谋克，十谋克为一猛安，平时生产，战时出征；又命完颜希尹创制女真文字。金朝从起兵到灭辽只用了十一年，又在两年后灭亡北宋，成为与南宋长期对峙的北方王朝，直到 1234 年被蒙古和南宋联合灭亡。
sources: []
recalled:
  - 《金史·太祖本纪》
  - 《辽史·天祚皇帝本纪》
  - 《三朝北盟会编》卷三
