name: 平王东迁
summary: 前 770 年周平王把都城从镐京迁到洛邑，东周开始，史称春秋时期由此开端。
body: |-
  公元前 771 年西周灭亡后，周平王即位。镐京一带遭到犬戎的破坏，王室又面临戎人的威胁，据《史记·周本纪》，平王于是在公元前 770 年把都城东迁到洛邑，以躲避戎寇。此后的周朝称为东周。

  东迁得到诸侯的支持。秦襄公率兵护送平王有功，被封为诸侯，并获得岐山以西的土地，秦国从此正式立国；晋文侯、郑武公等也出了力。《左传》隐公六年有“我周之东迁，晋、郑焉依”的话。清华简《系年》对东迁的经过和时间有不同的记载，提到晋文侯杀死携王、把平王迎到京师，学界对东迁的确切年份仍有讨论。

  东迁之后，周王室直接控制的土地大为缩小，财力、兵力都依赖诸侯，威望日益衰落。东周的前半期通常称为春秋时期，名称来自鲁国的编年史《春秋》；一般以公元前 770 年为春秋时期的开始，也有以《春秋》记事的开始（前 722 年）为界的。

  东周又分为春秋和战国两个时期。“春秋”之名来自鲁国的编年史《春秋》，记事起于鲁隐公元年（前 722 年），止于鲁哀公十四年（前 481 年）；“战国”之名来自西汉刘向编订的《战国策》。东迁以后，周王室直接管辖的土地只剩洛邑周围，后来又不断被诸侯蚕食。
sources: []
recalled:
  - 《史记·周本纪》
  - 《史记·秦本纪》
  - 《左传》隐公六年
  - 清华简《系年》
