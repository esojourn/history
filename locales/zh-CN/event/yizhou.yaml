name: 刘备取益州
summary: 公元 211 年刘备应刘璋之请入蜀，次年反目，214 年迫降刘璋，取得益州。
body: |-
  益州在今四川、重庆一带，自刘焉起由刘氏父子割据。建安十六年（公元 211 年），曹操进兵关中，益州牧刘璋担心他接着攻取汉中、威胁益州。据《三国志·蜀书·先主传》和《刘璋传》，属下张松、法正劝刘璋请刘备入蜀，去进攻占据汉中的张鲁；两人暗中则希望由刘备取代刘璋。刘备留诸葛亮、关羽等守荆州，自己带数万人入蜀，与刘璋在涪城相会。刘璋给他增拨兵马物资，让他北上葭萌。

  刘备到葭萌后没有进攻张鲁，而是在当地收揽人心。建安十七年，他以孙权受到曹操攻击为由，向刘璋要求增兵东归，刘璋只给了一部分。这时张松与刘备的密谋败露，被刘璋处死，双方公开破裂。刘备杀了白水关的守将，吞并其部众，南下占据涪城。

  此后的战事持续了两年。刘备在雒城被刘璋之子刘循阻挡了近一年，军师庞统在攻城时中箭身亡。诸葛亮奉命率张飞、赵云等从荆州溯长江而上，分路平定巴东、巴郡等地，前来会师。建安十九年（214 年）夏，雒城攻破，刘备进围成都；从汉中来投的马超也率部到达城下。围城数十日后刘璋开城投降。本传记载，当时城中还有精兵三万、可支一年的粮食，官吏百姓都愿意死战，刘璋说：我们父子在益州二十多年，对百姓没有什么恩德，百姓为我打了三年仗，我于心不忍。

  刘备自领益州牧，以诸葛亮为主要助手，对刘璋的旧部也加以任用。他从此有了稳固的根据地。次年孙权以刘备已得益州为由，要求归还荆州，两家几乎开战。
sources: []
recalled:
  - 《三国志·蜀书·先主传》
  - 《三国志·蜀书·刘二牧传》
  - 《三国志·蜀书·庞统法正传》
