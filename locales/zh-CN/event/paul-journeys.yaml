name: 保罗三次旅行布道
summary: 保罗自安提阿出发三次远行，把福音传到小亚细亚、马其顿和希腊各城。
body: |-
  《使徒行传》第 13 至 21 章记保罗的三次远行，后人习惯称为三次旅行布道，书中本身没有这样编号。第一次由安提阿教会差遣，巴拿巴和扫罗同去，称呼马可的约翰作帮手（13:1–5）。他们先到居比路（塞浦路斯），从撒拉米走到帕弗，方伯士求·保罗信了主；渡海到旁非利亚的别加，马可在这里离开他们回耶路撒冷；两人继续到彼西底的安提阿、以哥念、路司得和特庇。在路司得，保罗被人用石头打，拖到城外（14:19）。他们原路回去，在各教会选立长老，然后回到安提阿（14:21–28）。

  耶路撒冷会议以后，保罗与巴拿巴因马可的事分开，带着西拉第二次出行（15:36–41）。他在路司得带上提摩太，到特罗亚时夜间在异象中见一个马其顿人求他过去，就渡海到腓立比；这一段叙述开始用“我们”（16:10）。保罗和西拉在腓立比被棍打、下在监里，后来又到帖撒罗尼迦、庇哩亚和雅典，在雅典的亚略巴古讲论。在哥林多（科林斯），他与同业的亚居拉、百基拉同住，住了一年零六个月（18:1–11）；迦流作亚该亚方伯时，犹太人把他拉到公堂，迦流不受理（18:12–17）。他经以弗所、该撒利亚回到安提阿。

  第三次出行，他经加拉太和弗吕家到以弗所，在那里住了两年多，先在会堂、后在推喇奴的学房讲论（19:8–10）；银匠底米丢因亚底米神龛的生意受损，聚众生乱（19:23–41）。此后他往马其顿去，在希腊住了三个月，回程经特罗亚，在米利都与以弗所教会的长老话别（20:17–38），最后到耶路撒冷（21:17）。

  一般认为，《帖撒罗尼迦前书》《哥林多前书》《哥林多后书》《罗马书》等书信写于这几次旅行途中。各次行程的年份圣经没有记载，都是以迦流的任期为定点推算的约数；本条的起止年取自第一次出行到抵达耶路撒冷。
sources: []
recalled:
  - 《使徒行传》第 13—14 章，15:36—18:22，18:23—21:17
  - 《哥林多后书》11:23–27
