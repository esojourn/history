name: 司马炎代魏
summary: 魏咸熙二年十二月（公元 266 年初），魏帝曹奂让位于晋王司马炎，晋朝建立。
body: |-
  自公元 249 年高平陵之变以后，曹魏的朝政先后由司马懿、司马师、司马昭父子三人把持，三位皇帝一个被废、一个被杀，最后一位曹奂只是名义上的君主。灭蜀之后，司马昭受封晋王，可以使用天子的仪仗，立长子司马炎为世子。

  据《晋书·武帝纪》，咸熙二年（265 年）八月司马昭去世，司马炎继任相国、晋王。同年十二月，曹奂派人奉上皇帝的玺绶和册书，让出帝位。司马炎按惯例推辞，经群臣劝进后，在雒阳南郊设坛即皇帝位，祭告上天，国号晋，改年号为泰始。即位的日子按公历是 266 年 2 月，所以西晋的起始年份有 265 年和 266 年两种写法。

  曹奂被封为陈留王，迁居邺城，一直活到晋惠帝时。曹魏自曹丕称帝起共历五帝、四十六年。司马炎追尊祖父司马懿为宣皇帝，伯父司马师为景皇帝，父亲司马昭为文皇帝。他认为曹魏压制宗室，以致皇室孤立，于是一次封了二十七位同姓王。

  晋朝建立时蜀汉已亡，南方的吴国还在。十四年后晋军灭吴，统一全国。后世把定都雒阳的这一段称为西晋，以区别于公元 317 年以后在江南重建的东晋。
sources: []
recalled:
  - 《晋书·武帝纪》
  - 《三国志·魏书·三少帝纪》
