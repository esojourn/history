name: 井陉背水一战
summary: 韩信在井陉口背水列阵，以数万人击破号称二十万的赵军。
body: |-
  韩信平定魏、代之后，与张耳领兵数万东下井陉攻赵。据《史记·淮阴侯列传》，赵王歇和成安君陈余聚兵井陉口，号称二十万。广武君李左车建议分兵三万截断汉军粮道，陈余没有采纳。《汉书·高帝纪》把此战记在汉三年冬十月；汉初以十月为岁首，这个月相当于公元前 205 年末，旧时也有换算为前 204 年的。

  韩信夜半派轻骑二千人各持一面赤旗，隐蔽到赵营附近，又派一万人先出井陉口，背水列阵。天明后他出战佯败，退入水边阵地，赵军倾营追击；汉军无路可退，拼死作战，二千骑趁机冲入空营，换上汉军赤旗。赵军回头见营垒尽是汉旗，顿时大乱，汉军前后夹击，斩陈余于泜水上，俘赵王歇。战后韩信引兵法“陷之死地而后生”解释背水列阵的道理，成语“背水一战”出于此役。
sources:
  - 《史记·淮阴侯列传》 https://zh.wikisource.org/wiki/史記/淮陰侯列傳
  - 《汉书·高帝纪》 https://zh.wikisource.org/wiki/漢書/卷001
  - 《史记·张耳陈余列传》 https://zh.wikisource.org/wiki/史記/卷089
