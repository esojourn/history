name: 戊戌变法
summary: 1898 年光绪帝在康有为等人推动下推行变法一百零三天，被慈禧太后发动政变推翻。
body: |-
  甲午战败后，列强在中国强占租借地，德国占领胶州湾，俄国占领旅顺、大连，中国面临被瓜分的危险。康有为、梁启超、谭嗣同、严复等人通过办学会、办报纸宣传变法，各地出现了许多维新团体和报刊。光绪二十四年（1898 年，干支为戊戌）初，康有为再次上书，并得到光绪帝的召见。

  六月十一日，光绪帝颁布“明定国是诏”，宣布变法。此后一百零三天里，他发布了一百多道变法诏令，主要内容有：改革科举，废除八股文，改试策论；设立京师大学堂，在各地开办新式学堂；设立农工商总局，奖励实业和发明；裁撤闲散衙门和冗员；精简军队，改练新式陆军；准许官民上书言事等。光绪帝任命谭嗣同、杨锐、林旭、刘光第为军机章京，参与新政。这次变法史称“戊戌变法”或“百日维新”。

  变法触动了守旧官僚的利益，许多诏令在地方上没有得到执行。慈禧太后虽然没有公开反对变法，但牢牢控制着人事和兵权，变法开始不久就迫使光绪帝罢免了他的老师翁同龢，任命亲信荣禄为直隶总督，掌握北洋军队。九月，光绪帝罢免了阻挠上书的礼部六堂官，又打算开懋勤殿、聘请外国顾问，双方矛盾激化。维新派感到危险，谭嗣同夜访新建陆军的首领袁世凯，希望他起兵保护光绪帝。

  九月二十一日，慈禧太后从颐和园回到紫禁城，宣布重新“训政”，把光绪帝囚禁在中南海瀛台，下令捉拿康有为、梁启超。康、梁逃往日本，谭嗣同、林旭、杨锐、刘光第、杨深秀、康广仁六人被杀，史称“戊戌六君子”。除了京师大学堂以外，新政几乎全部被废除。关于袁世凯告密与政变的关系，有研究认为政变在袁世凯告密之前已经开始，告密使事态进一步扩大，学者看法不一。
