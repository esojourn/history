name: 康斯坦茨会议
aliases:
  - 君士坦斯会议
  - 康士坦斯大公会议
summary: 1414—1418 年的大公会议，结束教皇大分裂，定胡斯为异端并将他烧死。
body: |-
  《历史的轨迹》第二十章说，1409 年到 1449 年间教会开了三次大公会议，有三重目的：弥合教会的分裂，改革教会的腐败，平息异端；在这段时期，大公会议被公认为教会的最高权威。

  康斯坦茨会议由皇帝西吉斯蒙德促成，比萨一系的教皇约翰二十三世召集，1414 年 11 月在博登湖畔的康斯坦茨开幕。到会的除了主教和修道院院长，还有大学的神学、法学博士和各国君主的代表。会议按“民族”分组表决，每组一票，意大利籍主教人数虽多也占不了多数。

  1415 年 3 月约翰二十三世乔装出逃，想使会议解散。会议在 4 月 6 日通过教令，宣称本会议的权力直接来自基督，任何人包括教皇，在信仰、消除分裂和教会改革的事上都必须服从它。随后约翰被捉回废黜，罗马一系的教皇辞职，阿维农一系的教皇在 1417 年被废黜。1417 年 10 月会议规定此后大公会议须定期召开；11 月 11 日选出马丁五世。

  处理异端的事同时进行。1415 年 5 月会议谴责威克里夫的著作，下令掘出他的遗骨焚毁。胡斯持皇帝的安全保证到会，被囚禁了七个多月，6 月三次受审，7 月 6 日被定为异端，当天烧死。次年 5 月他的同道布拉格的耶柔米也被烧死。会议还禁止平信徒在圣餐中领杯，波希米亚的胡斯派偏偏以圣杯为标志，此后与教会和皇帝打了十多年仗。

  三个目的里，改革做得最少。会议原想在选举新教皇之前先定下改革的条款，各“民族”意见不一；马丁五世当选后只与各国分别订了协议，1418 年 4 月宣布散会。该书的总结是：比萨会议毫无成就，康斯坦茨会议以选出马丁五世弥合了大分裂，此外就是烧死胡斯、焚毁威克里夫的遗骨和著作。会议高于教皇的主张后来被教皇逐步否定。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十九章“教会权势衰微” https://wellsofgrace.com/books/spiritual/2000years/html/chapter21.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 康斯坦茨会议教令《此神圣会议》（1415 年 4 月 6 日）与《经常》（1417 年 10 月 9 日）
  - 里亨塔尔的乌尔里希《康斯坦茨会议纪事》
  - 姆拉多尼奥维采的彼得《胡斯受审与殉道记》
  - 波焦·布拉乔利尼记布拉格的耶柔米受审的信
