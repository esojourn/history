name: 武则天称帝
summary: 690 年武则天改国号为周，自称皇帝，以洛阳为神都，705 年退位。
body: |-
  弘道元年（公元 683 年）唐高宗去世，次年武太后废中宗、立睿宗，自己临朝称制，此后一步步为称帝做准备。她改东都为神都，改官名，设铜匦鼓励告密，任用酷吏打击反对者，平定了徐敬业和越王李贞、琅邪王李冲的起兵。垂拱四年（688 年），武承嗣让人在白石上刻“圣母临人，永昌帝业”，伪称得自洛水，武太后加尊号为“圣母神皇”，又拆毁洛阳宫中的乾元殿，修建明堂。

  载初元年（690 年）七月，僧人法明等人进献《大云经》，宣称武太后是弥勒佛下生，应当取代唐朝成为天下之主。九月，侍御史傅游艺率关中百姓九百多人上表，请改国号为周，赐睿宗姓武；据《资治通鉴》，随后百官、宗室、外戚、各地百姓、四夷酋长和僧道等六万多人联名上表请求。九月九日，武太后登上则天门，宣布改唐为周，改元天授，自称圣神皇帝，降睿宗为皇嗣，在神都建立武氏七庙。她是中国历史上唯一正式称帝的女性。

  武周时期，她继续重用酷吏，也提拔了狄仁杰、姚崇、宋璟等有才干的大臣，扩大科举取士，亲自在殿上策问贡士，又设立武举。对外，长寿元年（692 年）王孝杰收复安西四镇；但东北的契丹起兵和北方后突厥的入侵也给河北带来很大破坏。

  她晚年在继承人问题上犹豫，曾考虑立侄子武承嗣或武三思，最后在狄仁杰等人的劝说下，于圣历元年（698 年）召回庐陵王李显立为太子。神龙元年（705 年）正月宰相张柬之等人发动政变，她被迫传位给中宗，二月恢复唐的国号，武周共十五年（另见“神龙政变”条）。
