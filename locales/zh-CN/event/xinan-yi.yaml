name: 开通西南夷
summary: 汉武帝先后招抚和征服夜郎、邛、筰、滇等西南部族，在今云贵川地区设置郡县。
body: |-
  “西南夷”是汉代对巴蜀以西、以南各部族的总称，其中夜郎、滇、邛都等比较大。据《史记·西南夷列传》，建元六年（公元前 135 年），唐蒙在南越吃到蜀地出产的枸酱，得知可以从夜郎顺牂柯江直达番禺，便建议联络夜郎以牵制南越。武帝派他带着厚礼去见夜郎侯，在当地设犍为郡，并征发巴蜀士卒修路。司马相如随后奉命招抚邛、筰等部。筑路工程耗费巨大，士卒死亡很多；朝廷正在经营朔方，公孙弘建议暂停，西南方向的开拓一度中止。

  张骞从西域回来后说，他在大夏见过蜀地的布和邛竹杖，是从身毒贩运去的。武帝于是派使者分几路从西南寻找通往身毒的道路，都被当地部族阻拦，只到达滇国。列传记滇王问汉使“汉孰与我大”，夜郎侯也这样问，成语“夜郎自大”由此而来。

  元鼎六年（前 111 年）平定南越之后，汉军回师攻灭不服调遣的且兰等部，设牂柯郡，夜郎侯入朝，受封为夜郎王；邛、筰等地也相继设郡。元封二年（前 109 年），汉军兵临滇国，滇王投降，朝廷在那里设益州郡，仍让他统领部众，并赐给王印。1956 年，云南晋宁石寨山的古墓中出土了一枚刻有“滇王之印”的金印。
sources: []
recalled:
  - 《史记·西南夷列传》
  - 《史记·司马相如列传》
  - 《史记·大宛列传》
