name: 讨伐亚尔比根派
aliases:
  - 阿尔比十字军
  - 迦他利派的覆灭
summary: 教皇号召北方贵族讨伐法国南部的迦他利派，其后设立宗教裁判所。
body: |-
  十二世纪，一种二元论的教派在法国南部和意大利北部流行，自称“洁净者”，即迦他利派，因法国南部的阿尔比城而被称为亚尔比根派。《历史的轨迹》第二十章说它是摩尼教沿着十字军开辟的商路从保加利亚传回西欧的；又说他们相信有善恶二神，有形的物质世界是恶神造的，灵魂被囚在其中，所以基督不可能有真的身体，也没有真的死；该书先说他们都相信新约出自善神，隔几行又说他们“拒绝圣经”，两处不能相合；按其他记载，他们用新约，否定旧约的大部分和教会的圣礼。

  该书说，道明会和方济会的修士去向他们讲道，收效有限，教会就诉诸武力，设立宗教裁判所，裁判所应付不了，教皇才发起十字军。实际的先后是倒过来的：1208 年 1 月教皇的使节在罗讷河边被杀，英诺森三世认定图卢兹伯爵纵容异端，号召出兵，许给与去圣地同样的赦罪；宗教裁判所是战争结束之后才设立的。

  1209 年夏北方贵族的军队南下，7 月 22 日攻破贝济耶，屠杀全城。教皇使节在给英诺森的报告里说杀了两万人，这个数字未必可靠；相传他说过“把他们全杀了，主认得谁是他的人”，这句话出自几十年后的转述。此后西蒙·德·蒙福尔率军逐城攻取，1213 年在米雷打败前来干预的阿拉贡国王，1218 年自己死在图卢兹城下。1229 年图卢兹伯爵在巴黎订约投降，南方的大片土地后来并入王室领地。

  该书说，贵族们带兵进入法国南部大肆残杀，达二十年之久，使这片美丽的地方成了废墟。1229 年以后，各地设立专门的法庭搜查残余的异端，1230 年代教皇把这件事交给道明会士主持。该书描述了它的办法：嫌疑人不肯撤回主张的，交给世俗政府烧死，因为“教会是不流人血”的；审讯时常用酷刑。1244 年迦他利派最后的据点蒙塞居尔陷落，两百多人被烧死。到十四世纪初，这个教派在法国南部已经绝迹。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
