name: 爱奥尼亚起义
summary: 公元前 499 年至前 493 年小亚细亚的希腊城邦反抗波斯，以米利都被毁告终。
body: |-
  小亚细亚沿岸的希腊城邦在波斯治下由各自的僭主统治，这些僭主靠波斯人扶持。公元前 499 年，米利都的代理僭主阿里斯塔哥拉斯怂恿波斯总督出兵夺取纳克索斯岛，围攻四个月没有成功。据希罗多德，他担心因此失势，便宣布放弃僭主之位，在米利都实行平等的制度，并鼓动爱奥尼亚各城驱逐僭主、举兵反抗。

  他渡海到希腊本土求援。斯巴达王克里昂米尼拒绝了他；雅典公民大会同意派出二十艘战船，优卑亚岛的厄瑞特里亚派出五艘。希罗多德说，这些船是希腊人和异族人灾祸的开端。前 498 年，爱奥尼亚人和雅典人从以弗所上岸，奔袭波斯在小亚细亚西部的首府萨迪斯，下城起火，全城连同库柏勒神庙被烧毁，卫城没有攻下。他们在退回海边的途中被波斯骑兵追上击败，雅典人随即撤回，不再参与。据希罗多德，大流士听说后问雅典人是谁，从此命一个仆人每餐前对他说三遍：“主公，不要忘记雅典人。”

  起义扩展到赫勒斯滂、卡里亚和塞浦路斯。波斯人分路反攻，先收复塞浦路斯，再逐一攻取各城。阿里斯塔哥拉斯逃往色雷斯，死在那里。前 494 年，爱奥尼亚各城集中了三百五十三艘战船，在米利都外海的拉德岛迎战波斯舰队；开战时萨摩斯人的船大半临阵脱逃，莱斯博斯人跟着离去，留下死战的希俄斯人损失惨重。米利都随后被攻陷，男子多被杀，妇孺沦为奴隶，幸存者被迁到底格里斯河口。雅典诗人佛律尼科斯以此写了一部悲剧《米利都的陷落》，观众痛哭，他被罚款一千德拉克马，理由是让人想起了自家的灾难。

  前 493 年起义的余波平息。波斯总督重新丈量土地、核定贡赋，并要各城以仲裁解决争端。大流士决定惩罚雅典和厄瑞特里亚，这是他出兵希腊本土的直接理由。
sources: []
recalled:
  - 希罗多德《历史》卷五第 28—126 章；卷六第 1—42 章
