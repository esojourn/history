name: 罗马帝国东西分治
summary: 公元 395 年狄奥多西一世去世，两个儿子分治东西，帝国从此不再合一。
body: |-
  公元 395 年 1 月 17 日，狄奥多西一世在米兰去世，米兰主教安波罗修为他致悼词。此前他已把两个儿子都立为皇帝。十七八岁的长子阿卡狄乌斯留在君士坦丁堡，治理东部；十岁的次子霍诺里乌斯在米兰，治理西部。两个人都不能亲政：东部先由大臣鲁菲努斯主持，西部由统帅斯提利科摄政。

  由几位皇帝分区治理，这不是第一次。戴克里先设过四帝，君士坦丁的儿子们三分天下，364 年瓦伦提尼安一世与瓦伦斯兄弟也是一西一东。在当时人看来，395 年的安排并没有什么不同：帝国在法律上仍是一个，法令以两位皇帝共同的名义颁布，每年两位执政官通常东西各出一人，一方皇位空缺时由另一方指定人选。两部的分界大体从多瑙河中游向南，经巴尔干半岛西部到亚得里亚海，再越海到北非的大锡尔特湾；以东讲希腊语为主，以西讲拉丁语。

  不同的是，这一次再没有合起来。狄奥多西死后不到一年，两个朝廷就为巴尔干西部的归属和阿拉里克的哥特人闹翻。斯提利科自称受先帝之托兼管两个皇帝，东部不认，一度宣布他为公敌；东部对付阿拉里克的办法，是给他官职，让他到西部的地界上去。此后西部在蛮族入侵时得到过东部的援兵，但两边各有各的将领、财政和打算。

  两部的境遇也越来越不同。东部有埃及和叙利亚的税收，都城易守难攻，军队大体受文官控制，熬过了五世纪。西部的行省一个接一个落入日耳曼各族手中，税源枯竭，兵权落在蛮族出身的统帅手里，476 年最后一位皇帝被废。东部的帝国延续到 1453 年。

  后世的史书把 395 年当作罗马帝国分裂为东、西两个帝国的年份，这是回头看才有的说法。拉丁的西方和希腊的东方在语言、法律和教会习惯上的分歧由来已久，分治使它们在不同的政治环境里各自发展下去。
