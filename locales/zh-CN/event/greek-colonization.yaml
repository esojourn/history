name: 希腊人海外殖民
summary: 公元前 8 世纪至前 6 世纪，希腊人在地中海和黑海沿岸建立了上百座新城。
body: |-
  从公元前 8 世纪中叶起的两百年里，希腊各邦的人成批渡海，在意大利南部、西西里、爱琴海北岸、黑海沿岸、北非等地建立新的城邦。最早的落脚点之一是那不勒斯湾里的皮特库塞岛，由优卑亚人在前 8 世纪前期建立。据修昔底德记下的年代，前 734 年卡尔基斯人在西西里建纳克索斯，次年科林斯人建叙拉古；其后斯巴达人建塔兰托，阿凯亚人建克罗顿和锡巴里斯。前 7 世纪，麦加拉人在博斯普鲁斯海峡建拜占庭，锡拉岛人在北非建昔兰尼，米利都人在黑海沿岸建了许多城。约前 600 年，福凯亚人在今法国南部建马萨利亚（马赛）。在埃及，法老准许希腊人在瑙克拉提斯设立商站。意大利南部希腊城市密集，后来被称为“大希腊”。

  出走的原因各地不同，古人提到的有土地不足、饥荒、政争失败，也有为了贸易和获取金属。通常由母邦指定一位领队，行前到德尔斐求取神谕；领队死后在新城被奉为建城英雄。昔兰尼的建城经过希罗多德记得最详细：锡拉岛连年干旱，按神谕从每家有兄弟的人里抽签选人出海。

  新建的城邦在政治上是独立的，不受母邦管辖，只保留相同的祭祀、历法和方言，遇事互相援助是出于情谊而不是义务。这一点与后来罗马的殖民地不同，所以有的学者认为用“殖民”一词并不贴切。

  向外迁徙使希腊人与腓尼基人、伊特鲁里亚人、斯基泰人、埃及人有了经常的往来。希腊字母由优卑亚人带到意大利，被伊特鲁里亚人采用，再传给罗马人，成为拉丁字母的来源。
