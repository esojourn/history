name: 肥之战
summary: 前 233 年赵将李牧在宜安、肥一带大败秦将桓齮，李牧因功封武安君。
body: |-
  长平之战以后，秦国连年攻赵。公元前 234 年，秦将桓齮在平阳攻破赵军，斩首十万（《史记》数字），杀赵将扈辄。赵王迁急忙从北部边境调回防御匈奴的名将李牧，任为大将军。

  公元前 233 年，桓齮率军越过太行山，进攻赵国的赤丽、宜安，逼近邯郸。据《史记·赵世家》和《战国策》，李牧到任后筑垒坚守，不与秦军交战。桓齮于是分兵进攻肥城，想引诱赵军出救，再在野外与赵军决战。李牧看出秦军主力离营、营中空虚，率军突袭秦军大营，俘获留守的兵卒和辎重，又回师在肥迎击回救的秦军，大败秦军，桓齮逃走（一说他畏罪逃往燕国，有学者认为即后来投奔燕国的樊於期，此说尚有争议）。赵王因此封李牧为武安君。

  肥之战是长平之战后赵国对秦国取得的最大一次胜利。次年秦军攻番吾，又被李牧击退。但赵国这时已十分虚弱，又连年遭遇地震、饥荒，只能依靠李牧勉强支撑。公元前 229 年秦将王翦再攻赵国，秦国用反间计使赵王杀害李牧，次年邯郸陷落。肥之战的地点在今河北晋州西一带。

  司马迁在《廉颇蔺相如列传》的末尾附写李牧的事迹，赵国能在长平之后又支撑三十年，很大程度上依靠他的守御。
sources: []
recalled:
  - 《史记·赵世家》
  - 《史记·廉颇蔺相如列传》
  - 《战国策·秦策五》
