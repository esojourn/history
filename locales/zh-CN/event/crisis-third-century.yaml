name: 三世纪危机
summary: 公元 235 至 284 年罗马帝国皇帝更迭频繁，外敌入侵，瘟疫流行，一度三分。
body: |-
  “三世纪危机”是近代学者的说法，指从公元 235 年亚历山大·塞维鲁被杀到 284 年戴克里先即位的五十年。这期间得到元老院承认的皇帝有二十多位，自立而未成的更多，几乎没有一个善终。238 年一年之内就换了六位皇帝。

  皇帝大多由前线的军队拥立。军队要赏金，皇帝便加税、降低银币的成色：三世纪初一枚银币含银约一半，到 260 年代只剩百分之几，物价飞涨，国家转而直接征收粮食和实物。边境上，莱茵河对岸出现了阿勒曼尼人和法兰克人两个新的部族联盟，多瑙河下游的哥特人从陆上和海上南下劫掠，东方新兴的萨珊波斯连年进攻。251 年皇帝德基乌斯在多瑙河下游的阿布里图斯与哥特人作战时阵亡；260 年皇帝瓦勒良在埃德萨被波斯人生俘。约从 249 年起，又有一场瘟疫流行了十几年，迦太基主教居普良留下了对病状的描写，后人称之为“居普良瘟疫”。

  瓦勒良被俘后，帝国裂成三块。高卢、不列颠和西班牙的军队拥立波斯图穆斯，自设元老院和执政官，前后维持了十四年；东方的行省靠帕尔米拉的奥登纳图斯抵挡波斯，他死后其妻泽诺比娅索性占了埃及和小亚细亚；合法的皇帝伽利埃努斯只保有意大利、巴尔干和北非。

  转机来自一批多瑙河中游出身的军人皇帝。克劳狄二世 269 年在奈苏斯大败哥特人；奥勒良在 272 至 274 年间先后收复东方和高卢，为罗马城修了城墙，放弃了多瑙河以北的达契亚；普罗布斯继续清剿侵入高卢的部族。284 年 11 月戴克里先被军队拥立，随后着手改组军队、行省和税制，危机才告结束。

  经过这五十年，帝国的面貌变了：元老不再领兵，皇帝出自行伍，长年住在靠近边境的城市而不在罗马；内地的城市纷纷筑起城墙；对基督徒的全国性逼迫也是在这期间第一次发生。
