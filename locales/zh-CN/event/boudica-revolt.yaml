name: 布狄卡起事
summary: 公元 60 年前后不列颠爱西尼人的女王布狄卡起兵，焚毁三座罗马城镇后被击败。
body: |-
  不列颠东部爱西尼人的王普拉苏塔古斯是罗马的附庸，死时把皇帝和两个女儿并列为继承人。据塔西佗，罗马官吏照样接管了他的国土，鞭打王后布狄卡，奸污了她的女儿。邻近的特里诺文特人也恨透了占地的退伍老兵和为供奉克劳狄神庙而摊派的捐税。卡西乌斯·狄奥另说，罗马人突然催讨贷款是起因之一。

  公元 60 年（一说 61 年），总督保利努斯正在威尔士西北的莫纳岛攻打德鲁伊祭司的据点，布狄卡率众起事。没有城墙的卡穆洛杜努姆首先被焚，守在神庙里的老兵两天后被杀尽；来援的第九军团步兵几乎全没。保利努斯赶回伦狄尼乌姆，判断守不住，带走肯走的人，这座商埠和北面的维鲁拉米乌姆相继被毁。塔西佗说三地死了约七万人。

  保利努斯集结约一万人，在一处背靠树林的狭谷里迎战。不列颠人人多而无法展开，溃败时又被自己围成一圈的大车挡住。布狄卡不久死去。尼禄随后换了总督，改用怀柔的办法。
sources: []
recalled:
  - 塔西佗《编年史》卷 14 第 29—39 章
  - 塔西佗《阿古利可拉传》第 15—16 章
  - 卡西乌斯·狄奥《罗马史》卷 62 第 1—12 章
