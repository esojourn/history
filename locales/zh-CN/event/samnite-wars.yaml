name: 萨莫奈战争
summary: 罗马与亚平宁山区的萨莫奈人前后三次战争，历时半个世纪，罗马由此控制意大利中部。
body: |-
  公元前 343 年至前 290 年罗马与萨莫奈人之间的三次战争。萨莫奈人是住在亚平宁山脉中南段的奥斯坎语部落，分为四个部族，结成联盟，以畜牧和山地农业为生，常向平原扩张。

  第一次战争（前 343—前 341 年）起因是萨莫奈人进攻坎帕尼亚，卡普亚向罗马求援。这场战争的记载混乱，有学者怀疑其真实性；结果是罗马在坎帕尼亚站住了脚。

  第二次战争（前 326—前 304 年）起于罗马在利里斯河谷设立殖民地，又插手那不勒斯的内争。前 321 年两名执政官率军在考迪乌姆峡谷被萨莫奈统帅盖乌斯·庞提乌斯围困，全军投降，从“轭”下走过。几年后战事重起，前 315 年罗马在劳图莱再败。此后罗马改变打法：在萨莫奈周围设立殖民地，前 312 年监察官阿庇乌斯·克劳狄乌斯修筑通往卡普亚的阿庇亚大道；军团大概也在这个时期由密集方阵改为便于在山地作战的小队编制。前 304 年议和，罗马保住了全部所得。

  第三次战争（前 298—前 290 年），萨莫奈人与伊特鲁里亚人、翁布里亚人和高卢塞农人结成联盟。前 295 年双方在翁布里亚的森提努姆决战，是当时意大利规模空前的一战；据李维，执政官德基乌斯·穆斯献身冲阵，另一名执政官费边·鲁利阿努斯取胜。李维说敌军死两万五千人，希腊史家杜里斯给的数字是十万，都不可靠。前 290 年执政官库里乌斯·登塔图斯结束战争，萨莫奈人成为罗马的“同盟者”，须为罗马出兵。

  三次战争使罗马控制了意大利中部，下一步就与南部的希腊城市相接，引出了皮洛士战争。萨莫奈人后来在皮洛士、汉尼拔来时都倒向对方，直到同盟者战争和苏拉的清洗之后才不再成为独立的力量。
sources: []
recalled:
