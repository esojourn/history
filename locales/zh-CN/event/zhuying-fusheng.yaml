name: 烛影斧声
summary: 976 年宋太祖突然去世，其弟赵光义继位；宋人笔记中的“烛影斧声”成为千古疑案。
body: |-
  开宝九年（公元 976 年）十月，赵匡胤在开封宫中突然去世，年五十岁。他生前没有立太子，也没有公开的传位安排。他去世后，弟弟晋王赵光义随即即位，即宋太宗。

  关于这一夜的经过，正史记载很简略。北宋僧人文莹的《续湘山野录》记载：这天夜里，赵匡胤召晋王入宫饮酒，屏退左右，宫人在远处只看见烛影下晋王不时离席，好像有所退避；饮酒到深夜，赵匡胤拿着柱斧戳地，大声对晋王说“好做，好做”。当夜赵匡胤去世，晋王留宿宫中，次日即位。后人据此称之为“烛影斧声”。司马光《涑水记闻》则记载，赵匡胤去世时已是四更，宋皇后派宦官王继恩去召皇子赵德芳，王继恩却径直去召晋王；宋皇后见到晋王，愕然说“吾母子之命，皆托于官家”。

  太宗即位后，不等到第二年就改元太平兴国，与一般的惯例不同。太平兴国四年（979 年）太祖的长子赵德昭自杀，六年（981 年）次子赵德芳病死，太宗的弟弟赵廷美也被贬死。约在太平兴国六年，赵普奏称太祖、太宗的母亲杜太后生前曾立下遗命，让太祖死后传位给弟弟，誓书藏在金匮之中，即所谓“金匮之盟”。

  对于这些记载，历代史家看法不一。有人认为太宗弑兄夺位，“金匮之盟”是事后编造的；也有人认为太祖是暴病而死，太宗继位符合杜太后的遗命。由于缺乏可靠的直接史料，这件事至今仍是疑案。
sources: []
recalled:
  - 释文莹《续湘山野录》
  - 司马光《涑水记闻》卷一
  - 《续资治通鉴长编》卷十七、二十二及李焘注
  - 《宋史·太祖本纪》《宋史·太宗本纪》
