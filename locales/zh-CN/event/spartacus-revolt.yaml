name: 斯巴达克斯起义
summary: 角斗士斯巴达克斯领导的奴隶起义，转战意大利两年，屡败罗马军队，被克拉苏镇压。
body: |-
  公元前 73 年至前 71 年意大利的奴隶起义，是罗马历史上规模最大的一次。此前西西里已发生过两次奴隶起义。意大利南部的大庄园和牧场使用大量战争中俘获的奴隶，牧奴常年持械在山野放牧，看管很松。

  前 73 年，卡普亚一所角斗士学校的七十多人逃出，推色雷斯人斯巴达克斯和高卢人克里克苏斯、奥诺马乌斯为首，占据维苏威山。罗马起初只当作治安事件，派大法官格拉贝尔带三千人去围山，被从悬崖缒下的起义者袭破。另一名大法官瓦里尼乌斯也屡战屡败。逃亡的奴隶和一些贫苦的自由人大批加入。阿庇安说到前 72 年他们有七万人，后来到十二万；这些数字无法核实，其中包括妇孺。据萨卢斯特的残篇，斯巴达克斯想约束部众不得滥杀抢掠，没有做到。

  前 72 年元老院派两名执政官出征。起义者分成两支，克里克苏斯一支在阿普利亚被歼。斯巴达克斯北上，接连击败两名执政官，一直走到山南高卢的穆提纳；阿尔卑斯山的路已经打开，队伍却掉头南下。古人的解释是部众贪恋劫掠，不愿离开意大利。

  这年秋天，克拉苏出任统帅，得到八个军团。斯巴达克斯退到半岛尖端，想靠海盗的船渡到西西里，未成；克拉苏在地峡上修了一道壕墙。前 71 年初起义军突围。元老院此时已召庞培从西班牙回援，克拉苏急于在他到达之前结束战事。斯巴达克斯在卢卡尼亚的西拉鲁斯河附近与克拉苏决战，战死，尸体没有找到。六千名俘虏被钉死在阿庇亚大道沿途。北逃的五千人被庞培截杀，据普鲁塔克，庞培写信给元老院说，克拉苏打败了逃奴，他则把战争连根拔掉。

  起义者没有提出废除奴隶制，他们要的是自己的自由和回家的路。此后意大利再没有发生大规模的奴隶起义。斯巴达克斯在十八世纪以后被看作反抗压迫的象征。
sources: []
recalled:
  - 普鲁塔克《克拉苏传》第 8—11 章、《庞培传》第 21 章
  - 阿庇安《内战史》卷一第 116—120 章
  - 萨卢斯特《历史》卷三、卷四残篇
  - 弗洛鲁斯《罗马史纲要》卷二第 8 章
