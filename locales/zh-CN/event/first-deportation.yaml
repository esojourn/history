name: 约雅斤被掳
summary: 尼布甲尼撒攻取耶路撒冷，掳走约雅斤王、首领和工匠。
body: |-
  公元前 605 年巴比伦在迦基米施击败埃及以后，犹大成了巴比伦的属国。《列王纪下》24:1 记约雅敬服事尼布甲尼撒三年，然后背叛；迦勒底、亚兰、摩押、亚扪各军来攻击犹大（24:2）。约雅敬死后，他儿子约雅斤接续作王，那时巴比伦王的军兵已经上到耶路撒冷，围困了城（24:10）。

  约雅斤在位三个月。尼布甲尼撒亲自来到城下，约雅斤和他母亲、臣仆、首领、太监一同出城投降，时在巴比伦王第八年（24:11–12）。巴比伦王把圣殿和王宫里的宝物都拿去，毁坏所罗门所造的金器，把耶路撒冷的首领、勇士共一万人，连同木匠、铁匠都掳了去，只剩下国中极贫穷的人（24:13–14）。24:16 另记勇士七千人、木匠铁匠一千人；《耶利米书》52:28 记尼布甲尼撒第七年掳去犹大人三千零二十三名。几处数字不同，可能是计算的范围不一样。王立约雅斤的叔叔玛探雅为王，给他改名西底家（24:17）。

  巴比伦编年史记载：尼布甲尼撒第七年基斯流月出兵哈提地，围攻犹大城，亚达月初二日攻下，擒获其王，另立一位他所选定的王，取了重贡带回巴比伦。按此推算，城破在公元前 597 年 3 月。《列王纪》作第八年，编年史和《耶利米书》52:28 作第七年，一般认为是计算在位年的方法不同。

  被掳的人中有祭司以西结，他后来在迦巴鲁河边见异象，并以约雅斤被掳之年为纪年的起点（《以西结书》1:1–3）。《以斯帖记》2:5–6 说末底改的家族也是这一次被掳去的。留在耶路撒冷的先知耶利米以两筐无花果的异象论到被掳的人和留下的人（《耶利米书》第 24 章），又写信劝被掳的人在巴比伦安居（第 29 章）。《但以理书》1:1 另记约雅敬第三年已有一批少年被带往巴比伦，时间在这一次之前。十一年后西底家背叛，耶路撒冷再度被围而陷落。
sources: []
