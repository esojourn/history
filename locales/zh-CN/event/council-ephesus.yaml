name: 以弗所会议
aliases:
  - 第三次大公会议
summary: 公元 431 年的大公会议，罢免君士坦丁堡主教聂斯脱里，确认马利亚“生神者”的称呼。
body: |-
  公元 428 年，安提阿出身的聂斯脱里作了君士坦丁堡主教。他反对称马利亚为“生神者”，主张称“生基督者”，理由是马利亚所生的是基督的人性。亚历山大主教区利罗认为，这样讲是把基督分成了神和人两个主体；他写信驳斥，并取得罗马主教色勒斯丁的支持。争论背后也有亚历山大与君士坦丁堡两个教座的较量。

  皇帝狄奥多西二世召集各地主教于公元 431 年五旬节在以弗所开会。安提阿主教约翰和叙利亚的主教们路上耽搁了。区利罗不等他们，6 月 22 日开会，聂斯脱里拒绝出席，当天就被罢免，会议确认“生神者”的称呼合乎尼西亚的信仰。几天后约翰一行赶到，另行开会，反过来罢免了区利罗。罗马的代表到后支持区利罗一方。皇帝一度把两边的领袖都关了起来，最后承认了区利罗主持的会议，聂斯脱里被送回修道院，后来流放到埃及。

  公元 433 年，区利罗与安提阿的约翰达成一份和解的信式，双方承认基督是“两性的联合”，马利亚是生神者。聂斯脱里的支持者后来多在波斯境内活动，那里的东方教会不接受这次会议；七世纪传到中国的景教就出自这一支。

  《历史的轨迹》第五章提到这次会议时，讲的是另一项决议：会议把伯拉纠的学说判为异端。会议在致罗马主教的信里确认了西方对伯拉纠和他的学生色勒斯丢的定罪。关于基督神人二性的关系，争论并没有就此结束，二十年后又有迦克墩会议。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
recalled:
  - 以弗所会议记录
  - 区利罗致聂斯脱里的第二、第三封信
  - 苏格拉底《教会史》卷 7 第 29—34 章
