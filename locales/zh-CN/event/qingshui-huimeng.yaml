name: 清水会盟
summary: 783 年唐朝与吐蕃在清水会盟，划定双方边界，承认吐蕃对陇右大部的控制。
body: |-
  安史之乱后吐蕃不断进攻唐朝，占据了陇右大片土地。唐德宗即位后希望与吐蕃和好，以便集中力量对付藩镇，释放了被扣留的吐蕃俘虏，双方多次互派使者。建中四年（公元 783 年）正月，唐朝的陇右节度使张镒与吐蕃大相尚结赞在秦州清水县会盟。

  据《旧唐书·吐蕃传》记载的盟文，双方划定的边界大致是：唐朝的泾州以弹筝峡西口为界，陇州以清水县为界，凤州以同谷县为界，剑南以西山、大渡河以东为唐朝的地界；其余黄河以北、贺兰山一带的土地也作了划分，双方的地界之间设立隔离地带。这实际上承认了吐蕃对陇右大部分地区的占领。

  同年十月泾原兵变，唐德宗出逃奉天，向吐蕃求援，许诺事成后割让安西、北庭。吐蕃出兵帮助唐军击败了朱泚的部队，随后要求兑现承诺，唐朝在李泌的劝说下没有割让，双方关系再次恶化，贞元三年（787 年）发生平凉劫盟（另见该条）。
sources: []
recalled:
  - 《旧唐书·吐蕃传》
  - 《新唐书·吐蕃传》
  - 《资治通鉴》卷二百二十八
