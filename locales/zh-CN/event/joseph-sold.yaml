name: 约瑟被卖到埃及
summary: 约瑟十七岁时被哥哥们卖给商人，带往埃及为奴。
body: |-
  据《创世记》37:2—4，约瑟十七岁，与哥哥们一同牧羊，把他们的恶行报给父亲。雅各因他是年老时生的，爱他过于爱众子，给他做了一件彩衣，哥哥们因此恨他。约瑟又做了两个梦：一是哥哥们的禾捆围着他的禾捆下拜，一是太阳、月亮和十一颗星向他下拜。他把梦说出来，哥哥们越发嫉恨，父亲也责备他，却把这话存在心里（37:5—11）。

  哥哥们往示剑去放羊，雅各从希伯仑谷打发约瑟去看他们平安不平安。约瑟到了示剑，有人告诉他他们往多坍去了，他就追到多坍。哥哥们远远看见他，商议要杀他，丢在坑里，说是被恶兽吃了。流便劝他们不可流他的血，只把他丢在野地的坑里，意思是要救他还给父亲。他们剥了他的彩衣，把他丢在一个没有水的坑里（37:12—24）。

  他们坐下吃饭时，有一伙以实玛利人带着香料从基列来，要往埃及去。犹大说，杀了兄弟没有益处，不如把他卖了；众弟兄听从了。约瑟被从坑里拉上来，以二十舍客勒银子卖掉，带往埃及；经文里以实玛利人和米甸人两个称呼交替出现（37:25—28）。流便回到坑边不见约瑟，就撕裂衣服。他们宰了一只公山羊，把彩衣染了血送给父亲；雅各认得，以为约瑟被野兽撕碎了，便撕裂衣服，腰间围上麻布，多日为儿子悲哀，不肯受安慰（37:29—35）。

  约瑟在埃及被卖给法老的内臣、护卫长波提乏（37:36、39:1）。后来约瑟对哥哥们说，这是神差他在他们以先来，为要保全生命（45:5—8）。《诗篇》105:17—22 和《使徒行传》7:9—10 都回顾了这件事。本条年份按约瑟十七岁推算，是约数。
sources: []
recalled:
  - 《创世记》第 37 章、39:1、45:5—8
  - 《诗篇》105:17—22
  - 《使徒行传》7:9—10
