name: 黄巢入长安
summary: 880 年黄巢攻入长安称帝，国号大齐，唐僖宗逃往成都；883 年黄巢被逐出。
body: |-
  广明元年（公元 880 年）十一月黄巢攻克洛阳，随即西进潼关。宦官田令孜临时派神策军前往防守，据《资治通鉴》，神策军士兵多是长安的富家子弟，花钱雇贫民代替自己出征，这些人不会打仗，潼关很快失守。十二月五日，唐僖宗在田令孜的护卫下从长安出逃，同一天黄巢的前锋进入长安。僖宗经兴元逃到成都，在那里住了四年多。

  黄巢进入长安后，起义军的将领尚让向百姓宣布，黄王起兵本是为了百姓，不像李家那样不爱惜你们。几天后黄巢在含元殿即皇帝位，国号大齐，年号金统，任命尚让等人为宰相。但起义军不久就开始在城中大肆抢掠杀戮，对唐朝的宗室和公卿尤其残酷，据史书，留在长安的唐朝宗室几乎被杀光。

  中和元年（881 年）四月，唐军一度攻入长安，黄巢暂时撤出，入城的唐军忙于抢掠，黄巢回兵反攻，重新占领长安。据《资治通鉴》，黄巢恼恨百姓欢迎唐军，在城中大肆屠杀，称为“洗城”。此后长安被唐军四面包围，城中粮食断绝。中和二年（882 年）九月，镇守同州的朱温投降唐朝。中和三年（883 年）四月，李克用率领的沙陀军和各路唐军攻入长安，黄巢焚烧宫殿后撤出，向东退往河南。

  经过这几年的战乱，长安的宫殿、官署和民居大半被毁。诗人韦庄当时困在长安，后来在洛阳写下长诗《秦妇吟》，描写了战乱中长安的惨状，其中有“内库烧为锦绣灰，天街踏尽公卿骨”之句。二十年后，朱温又强迫唐昭宗迁都洛阳，拆毁长安城，长安从此不再是中国的都城。
sources: []
recalled:
  - 《旧唐书·黄巢传》
  - 《资治通鉴》卷二百五十四至二百五十五
  - 韦庄《秦妇吟》
