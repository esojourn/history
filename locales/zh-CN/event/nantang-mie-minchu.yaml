name: 南唐灭闽楚
summary: 南唐中主乘闽、楚内乱，945 年灭闽，951 年灭楚，但所得之地不久多失。
body: |-
  王审知死后，闽国的王氏子孙互相残杀。王延政在建州称帝，与据有福州的闽主对立，福州又发生兵变，局势十分混乱。南唐中主李璟即位后，查文徽、陈觉、冯延鲁等人主张出兵。保大三年（公元 945 年），南唐军攻下建州，王延政投降，闽国灭亡。但福州的守将李仁达随后投靠吴越，南唐进攻福州，被吴越援军击败，福州归了吴越；泉州、漳州则由当地的将领留从效控制，名义上归附南唐。南唐实际只得到了建州、汀州等几个州。

  楚王马殷死后，他的儿子们也互相争位。马希萼与弟弟马希广争夺王位，向南唐求援。保大九年（951 年），南唐派大将边镐进入长沙，楚国灭亡。南唐把楚国的宗室和财物运回金陵，但在楚地横征暴敛，不得人心。次年楚国旧将刘言、王逵等人起兵，赶走了南唐军，楚地重新落入当地将领之手。

  这两次用兵，南唐耗费了大量人力物力，所得却很少，国力受到很大损耗，主张出兵的冯延巳等人受到批评。不久后周南征，南唐便难以抵挡了。
sources: []
