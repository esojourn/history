name: 富平之战
summary: 1130 年张浚集结西北宋军在富平与金军会战，大败，陕西大部分落入金人之手。
body: |-
  建炎四年（公元 1130 年），金军主力在江南追击宋高宗，川陕宣抚处置使张浚为了牵制金军、减轻江南的压力，调集陕西各路宋军，以刘锡为主帅，刘锜、吴玠、赵哲等将领率部，在耀州富平一带集结，准备与金军决战。吴玠等人认为宋军宜据守险要，不宜在平原上与金军骑兵交战，张浚没有采纳。

  九月，金将完颜娄室和从江南转来的完颜宗弼率军迎战。金军绕过宋军阵前的苇泽，从侧翼进攻，环庆路赵哲的部队首先溃退，宋军全线崩溃，物资损失殆尽。张浚事后斩了赵哲，退守秦州、兴州一带。此战之后陕西大部分地区陷落，宋金在西线的形势发生逆转。吴玠收集残部，退守大散关以东的和尚原，次年在那里击败金军，保住了四川（另见“和尚原之战”条）。
sources: []
recalled:
  - 《宋史·张浚传》
  - 《宋史·吴玠传》
  - 《建炎以来系年要录》
