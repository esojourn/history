name: 祖冲之上《大明历》
summary: 祖冲之上呈《大明历》，首次在历法中考虑岁差，遭宠臣反对，半个世纪后才颁行。
body: |-
  宋孝武帝大明六年（公元 462 年），祖冲之上表，呈上自己编制的新历法，请求取代当时通行的何承天《元嘉历》。因年号得名《大明历》。

  这部历法有几项重要的改进。东晋虞喜已经发现冬至时太阳在恒星间的位置会缓慢移动，即岁差，祖冲之第一次把岁差引入历法计算。他把十九年七闰的旧闰周改为三百九十一年一百四十四闰，使历年与回归年更加吻合。他测定的交点月为 27.21223 日，与今天的测量值极为接近。

  孝武帝的宠臣戴法兴上书反对，认为古人定下的历法万世不易，祖冲之擅改是“诬天背经”。祖冲之写了《驳议》，逐条反驳，表示愿意用确凿的证据和实际的观测来检验是非。孝武帝倾向于采用新历，但大明八年（464 年）他去世，此事就搁置了。

  直到梁武帝天监九年（510 年），经祖冲之的儿子祖暅三次上书，并经过实际观测检验，《大明历》才正式颁行，这时祖冲之已经去世十年。
