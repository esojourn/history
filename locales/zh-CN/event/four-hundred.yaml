name: 四百人政变
summary: 公元前 411 年雅典的寡头派夺权四个月，随后被推翻。
body: |-
  西西里的惨败之后，雅典国库空虚，盟邦相继反叛，波斯开始资助斯巴达。流亡的亚西比德向驻萨摩斯的雅典舰队里的一些将领传话，说如果雅典改行寡头制并召他回去，他能使波斯转而支持雅典。皮珊德洛斯带着这个主张回到雅典，联络城中的贵族团体。后来与亚西比德的交涉破裂，这些人仍然照原计划行事。主要的策划者，据修昔底德，是演说家安提丰。

  公元前 411 年初夏，几位主张民主的人物被暗杀，城里人人自危。公民大会被召到城外的科洛诺斯开会，在场的人不敢反对，通过决议：废除担任公职的津贴，由四百人组成议事会全权执政，名义上另有五千名公民享有参政权，但这份名单始终没有公布。四百人带着匕首进入议事厅，付清津贴把原来的五百人议事会遣散。他们随即向斯巴达求和。

  驻萨摩斯的舰队拒绝承认新政权。士兵们在色拉西布洛斯和色拉叙洛斯带领下宣誓维护民主，另选将军，把亚西比德召来。雅典实际上分裂为城里和舰队两个政府。四百人内部也起了分歧：塞拉门尼斯等人要求兑现五千人的名单；极端的一派在比雷埃夫斯港口的厄厄提俄涅亚修筑工事，被怀疑是要接应斯巴达舰队。重装步兵哗变，拆毁了工事。不久斯巴达舰队在优卑亚附近击败雅典人，优卑亚全岛反叛。雅典人在惊恐中召开大会，废黜四百人，把政权交给五千名能自备武装的公民。四百人执政约四个月。安提丰受审被处死，其他首领逃到斯巴达人那里。

  修昔底德称赞五千人的政体是寡头与民主适度的混合。前 410 年舰队在库济科斯大胜之后，完全的民主政治恢复。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷八第 47—98 章
  - 《雅典政制》第 29—33 章
