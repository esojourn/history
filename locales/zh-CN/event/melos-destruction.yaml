name: 雅典毁灭米洛斯
summary: 公元前 416 年雅典攻陷中立的米洛斯岛，杀尽成年男子。
body: |-
  米洛斯是爱琴海南部的一个小岛，居民自称是斯巴达人的移民后裔。它没有加入提洛同盟，在伯罗奔尼撒战争中保持中立。公元前 426 年尼西阿斯曾率舰队来过，蹂躏了田地而没有使它屈服。

  前 416 年夏，正值《尼西阿斯和约》名义上还有效的时候，雅典派三十八艘战船和约三千名士兵登岛，要求米洛斯加入同盟并纳贡。修昔底德在这里写了一段雅典使者与米洛斯当政者之间的对话，这是全书唯一用戏剧式的一问一答写成的段落。雅典人说，不必讲什么正义的漂亮话，大家都知道，只有双方实力相当时才谈得上正义，强者做他们能做的，弱者忍受他们必须忍受的。米洛斯人回答说，他们保持自由已有七百年，寄希望于神的眷顾和斯巴达人的援助。雅典人说，希望是危险的安慰，斯巴达人只把合乎自己利益的事看作正当。这场对话有多少是实际说过的，有多少出自修昔底德的构思，学者看法不一。

  米洛斯人拒绝屈服。雅典人筑墙围城，围困持续到冬天。城中粮尽，又有人做了内应，米洛斯人无条件投降。雅典人杀死了所有被俘的成年男子，把妇女和儿童卖为奴隶，后来派五百名雅典人移居岛上。

  修昔底德把这一段紧接在西西里远征之前。次年春天，欧里庇得斯上演了写城破之后被俘妇女的《特洛伊妇女》，许多现代学者认为它与米洛斯的事有关，不过剧本须在此前几个月提交，这一联系不能肯定。前 405 年雅典战败后，吕山德把幸存的米洛斯人送回了故乡。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷三第 91 章；卷五第 84—116 章
  - 色诺芬《希腊史》卷二第 2 章
