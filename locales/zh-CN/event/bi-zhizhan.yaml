name: 邲之战
summary: 前 597 年楚庄王在邲大败来救郑国的晋军，楚国由此称霸中原。
body: |-
  楚庄王即位后国力强盛，不断北上争取中原诸侯。公元前 597 年春，楚军包围郑国十七天，攻破郑都，郑襄公袒露上身牵着羊出迎请罪，庄王退兵与郑讲和。晋国派荀林父率军救郑，到达黄河时听说郑已降楚。

  据《左传》宣公十二年，晋军内部意见分歧，主帅荀林父想退兵，副帅先縠坚持求战，擅自带兵渡河，荀林父只得全军渡河。楚庄王起初也想撤兵，伍参力主一战。双方在邲交战，楚令尹孙叔敖下令先发制人，楚军发动猛攻，晋军溃败，争相渡河逃命，先上船的人砍断攀住船舷的手指，“舟中之指可掬也”。

  战后，楚大夫潘党建议收集晋军尸体筑成“京观”，以彰显武功。楚庄王说：“夫文，止戈为武。”认为武德包括禁暴、戢兵、保大、定功、安民、和众、丰财七项，自己一项也没做到，不能筑京观，只是祭祀河神、建造先君的宗庙告捷而回。邲之战后，中原的陈、郑、宋等国多归附楚国，楚庄王成为霸主。

  楚庄王所说的“止戈为武”，是对“武”字字形的一种解释（今天的文字学家多认为“武”的本义是持戈行进），后来成为表达以武止战思想的名言。邲之战是春秋时期晋楚三次大战（城濮、邲、鄢陵）中的第二次。
sources: []
recalled:
  - 《左传》宣公十二年
  - 《史记·楚世家》
  - 《史记·晋世家》
