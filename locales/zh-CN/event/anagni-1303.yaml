name: 阿纳尼事件
aliases:
  - 阿纳尼之辱
  - 阿南宜事件
summary: 1303 年法王腓力四世的手下闯入阿纳尼扣押教皇波尼法修八世，教皇权势由盛转衰。
body: |-
  教皇波尼法修八世与法王腓力四世从 1296 年起为向教士征税的事相争。1302 年 11 月教皇发布《一圣教谕》，宣称属世的权柄要服在属灵的权柄之下，服从罗马教皇是得救所必需的。1303 年 6 月，腓力的大臣在巴黎的集会上列举教皇的罪状，说他是异端、买卖圣职、以不正当的手段取得教皇之位，要求召开大公会议审判他。

  教皇夏天回到家乡阿纳尼，准备在 9 月 8 日公布革除腓力教籍的诏书。9 月 7 日清晨，法王的大臣诺加雷和被教皇夺去产业的科隆纳家族的人带着一队兵冲进城，攻入教皇的宅邸。据同时代的佛罗伦萨人维拉尼记载，波尼法修穿上教皇的礼服，手持十字架坐着等他们。他被扣押了三天，诺加雷要带他去法国受审，科隆纳家的人想当场杀了他，两人争执不下。第三天阿纳尼的市民起来把外兵赶走，救出教皇。

  《历史的轨迹》第十九章说，兵丁对这位八十七岁的老人拳打脚踢，但并不能拘捕他；他返回罗马几天之后带着破碎的心灵去世。他当时约七十岁，确曾被扣押，是否挨打说法不一；他在 10 月 11 日去世，离事发一个多月。

  该书把这件事与 1177 年相比：那一年皇帝腓特烈一世向教皇屈膝，1303 年教皇却受到奇耻大辱。贵格利七世革除亨利四世的教籍曾经奏效，波尼法修依样而行却没有结果，因为封建贵族已经衰落，法国人团结在国王周围；革除教籍这件武器有没有用，全看百姓站在哪一边。

  事后没有人为此受到惩罚。下一任教皇赦免了腓力；1305 年当选的克莱门特五世是法国人，1311 年宣布腓力在这件事上出于正当的热心。教廷随后在阿维农停留了六十多年。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十九章“教会权势衰微” https://wellsofgrace.com/books/spiritual/2000years/html/chapter21.html"
recalled:
  - 乔万尼·维拉尼《新编年史》卷 8 第 63 章
  - 1302 年《一圣教谕》
  - 但丁《神曲·炼狱篇》第 20 歌
  - 1311 年克莱门特五世诏书《荣耀之王》
