name: 潼关之战
summary: 756 年哥舒翰被迫出潼关迎战，在灵宝西原中伏大败，潼关失守，唐玄宗出逃。
body: |-
  天宝十四载（公元 755 年）十二月安禄山攻占洛阳后，唐玄宗处死了兵败的封常清、高仙芝，任命患病在家的哥舒翰为兵马副元帅，据《资治通鉴》统兵八万、号称二十万，镇守潼关。潼关地势险要，哥舒翰坚守半年，叛军无法西进。他和郭子仪、李光弼都主张固守潼关，由朔方军北上直取叛军的老巢范阳。

  宰相杨国忠担心哥舒翰拥兵自重，对自己不利，在唐玄宗面前说叛军守备空虚，劝他催促哥舒翰出战。玄宗接连派宦官督促。天宝十五载（756 年）六月，哥舒翰痛哭出关，在灵宝西原遇到叛将崔乾祐。唐军进入南靠山、北临黄河的狭窄道路，遭到伏击，叛军又点燃草车，烟火弥漫，唐军自相践踏，大批士兵坠入黄河，全军溃败。据《资治通鉴》，哥舒翰收拾残兵，回到潼关时只剩八千余人。

  几天后潼关失守，哥舒翰被部将劫持投降叛军。潼关失守的消息传到长安，玄宗带着杨贵妃、杨国忠等人仓皇西逃，随后发生马嵬之变（另见“马嵬之变”条），叛军不久进入长安。
sources: []
recalled:
  - 《旧唐书·哥舒翰传》
  - 《资治通鉴》卷二百一十八
