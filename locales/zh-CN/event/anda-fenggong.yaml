name: 俺答封贡
summary: 1571 年明朝封俺答汗为顺义王、开放互市，此后北边数十年大体安定。
body: |-
  嘉靖年间蒙古俺答汗屡次请求通贡互市被拒，双方连年交战。隆庆四年（1570 年）俺答汗的孙子把汉那吉因为未婚妻被祖父夺走，愤而投奔明朝。宣大总督王崇古认为这是与俺答汗议和的机会，厚待把汉那吉，内阁大学士高拱、张居正也支持他的主张。

  俺答汗率兵到边境索要孙子，王崇古派人与他谈判，提出以交还叛逃到蒙古的汉人赵全等人为条件送还把汉那吉。俺答汗交出了赵全等人，明朝送回了把汉那吉，随后双方开始商议通贡。朝中有不少反对的声音，高拱、张居正力排众议，隆庆五年（1571 年）明朝封俺答汗为顺义王，封他的子弟和部下为都督、指挥等官，开放大同、宣府、甘肃等地的马市，允许蒙古每年按期朝贡和互市，史称“俺答封贡”或“隆庆和议”。

  此后明朝北方边境的大规模战争明显减少，蒙古用马匹、皮毛换取明朝的布帛、粮食、铁锅等物，互市长期维持。俺答汗死后，他的妻子三娘子继续维护与明朝的和平，被明朝封为“忠顺夫人”。
sources: []
recalled:
  - 《明史·鞑靼传》
  - 《明史·王崇古传》
  - 《万历武功录》
