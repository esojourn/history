name: 第二次鸦片战争
summary: 1856 年英法发动战争，1860 年攻入北京、焚毁圆明园。
body: |-
  鸦片战争后，英国等国家对通商的范围仍不满足，要求修改条约，扩大在华权益，清朝拒绝。咸丰六年（1856 年）十月，广东水师在广州黄埔附近检查中国商船“亚罗号”，逮捕了船上的中国船员，英国人借口这艘船曾在香港登记、船上的英国国旗受到侮辱，进攻广州。法国则以广西西林县处死法国传教士马赖（“马神甫事件”）为借口，与英国联合出兵。美国和俄国也在外交上配合。

  咸丰七年（1857 年）底，英法联军攻陷广州，两广总督叶名琛被俘，后来死在印度加尔各答。次年英法联军北上，攻陷天津大沽炮台，清朝被迫与英、法、美、俄四国分别签订《天津条约》，规定增开牛庄、登州、台南、淡水、潮州、琼州、汉口、九江、南京、镇江等为通商口岸，外国公使驻京，外国人可以到内地游历、传教，赔偿英法军费等。同年俄国又趁机迫使黑龙江将军奕山签订《瑷珲条约》。

  咸丰九年（1859 年）英法公使到大沽口外，坚持率舰队经大沽进京换约，与清军发生冲突，被僧格林沁指挥的炮台击退。咸丰十年（1860 年）英法联军大举进攻，从北塘登陆，攻陷大沽、天津，在通州八里桥击败僧格林沁的军队，咸丰帝逃往热河。十月英法联军攻入北京，在圆明园大肆劫掠后放火焚烧，大火持续了几天，这座经营一百五十多年的皇家园林被毁。

  留京的恭亲王奕訢与英、法签订了《北京条约》，承认《天津条约》有效，增开天津为商埠，割让九龙半岛南端给英国，赔款增加到各八百万两，允许华工出国等。俄国以调停有功为名，迫使清朝签订中俄《北京条约》，割去乌苏里江以东约四十万平方公里的土地。第二次鸦片战争使清朝的主权受到进一步的损害，此后清朝设立总理衙门，开始兴办洋务（另见“洋务运动”条）。
sources: []
recalled:
  - 《筹办夷务始末·咸丰朝》
  - 《第二次鸦片战争》资料丛刊
  - 茅海建《近代的尺度》
