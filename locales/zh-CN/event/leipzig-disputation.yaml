name: "莱比锡辩论"
summary: "1519 年艾克与路德在莱比锡辩论，路德否认教皇首位权，并说公会议也会错。"
body: |-
  1518 年底路德答应教皇的使者，只要对手不开口，他也不再谈赎罪券。因戈尔施塔特的教授艾克却向路德的同事卡尔施塔特下了战书，列出的论题冲着路德。《历史的轨迹》第二十二章说，路德在答辩的论题里宣称，罗马教会高于其他教会的主张只有近四百年教皇法令的根据，此前一千一百年并无此事。为准备辩论他花了几个月读教会史和教会法，发现有许多教令是伪造的。

  辩论由萨克森公爵乔治安排，在莱比锡的普莱森堡举行，1519 年 6 月 27 日开始。该书描写城里气氛紧张，会场有武装卫队，旅店里的餐桌也有人看守，防备维滕贝格和莱比锡的学生打架。艾克先与卡尔施塔特辩了一个星期的恩典与自由意志。7 月 4 日路德上场，辩教皇的首位权，以后又辩炼狱、赎罪券和告解，到 7 月中旬结束。

  路德的论据来自历史：希腊教会从未承认罗马主教的最高权威，早期的公会议也不知道有这回事。艾克指他的说法与威克里夫和胡斯相同。路德回答，康斯坦茨公会议定罪的胡斯论点里，有许多是合乎基督教、合乎福音的。该书说听众哗然，公爵乔治喊道：这真是瘟疫！艾克由此逼出了他要的结论：路德认为公会议也会错。

  双方都自称得胜，原定由巴黎和爱尔福特两所大学评判，一所拖延，一所不肯表态。该书说，这次辩论使所有人看清，路德与罗马教会已无法和好；路德自己也更清楚自己的立场，事后读了胡斯的著作，说自己不知不觉早就是胡斯派了。艾克随即去罗马，催教皇定路德的罪。该书又说布塞是路德在这次辩论中赢得的；布塞是前一年在海德堡听路德辩论而倾心的。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十二章“教会大大骚动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter25.html"
