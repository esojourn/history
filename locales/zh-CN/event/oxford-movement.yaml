name: "牛津运动"
summary: "牛津学者在英国国教内推动恢复大公教会传统的运动，又称书册运动。"
body: |-
  《历史的轨迹》第三十八章说，卫斯理的复兴使成千人离开安立甘教会，怀特菲尔德带领的低派教会也渐渐远离传统；不同意者、天主教和低派协力要废除安立甘教会享有的特权，安立甘教会眼看就要不再是国家教会。一些安立甘领袖惊慌起来，组成了“高派教会”。

  该书说，十九世纪前叶高派代表恢复罗马天主教形态的运动，领袖有基布尔、纽曼和普西，都出身牛津，所以叫牛津运动。他们主张延续天主教的传统做法，认为祭司有赦罪的权柄，不喜欢教会受政府管辖。运动正式开始于基布尔在牛津的讲道，题为“民族的背道”（1833 年 7 月，抗议国会合并裁撤爱尔兰的主教区）。同月一系列小册子开始印发，共九十种，大部分出于纽曼之手，所以又叫“书册运动”。

  该书说，1845 年 10 月 9 日纽曼加入天主教会，有上千人跟从他；其他大部分高派留在英国教会中，崇拜仪式越来越仿效罗马教会，高派在安立甘教会中的力量至今仍在成长。同时还兴起了受德国思想影响的“广派教会”，由柯勒律治引入，主张国家教会可以容纳任何形态的信仰。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十八章“德国与英国的宗教生活” https://wellsofgrace.com/books/spiritual/2000years/html/chapter42.html"
recalled:
  - "基布尔《民族的背道》（1833 年 7 月 14 日讲道）"
  - "《时代书册》（1833—1841 年）"
