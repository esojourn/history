name: 罗马陷落
aliases:
  - 410 年罗马之劫
summary: 公元 410 年阿拉里克率西哥特人攻入罗马，劫掠三天，震动整个罗马世界。
body: |-
  公元 408 年，西部帝国的统帅斯提利科被皇帝霍诺里乌斯处死，军中许多蛮族士兵的家属随后被杀，这些士兵投奔了西哥特王阿拉里克。阿拉里克随即进入意大利，围困罗马。朝廷躲在有沼泽保护的拉文纳。罗马城断了粮，交出大批金银、丝绸和胡椒才得解围。阿拉里克想要的是给部众安身的土地和自己的军职，霍诺里乌斯屡次拒绝。409 年他第二次围城，立了一个傀儡皇帝，又废掉。

  公元 410 年 8 月 24 日夜里，城东北的萨拉里亚门被人打开，西哥特人进了城。劫掠持续了三天。西哥特人是亚流派的基督徒，奥罗修和奥古斯丁都说阿拉里克下令把圣彼得、圣保罗两座大教堂当作避难所，不得侵犯。城里仍有不少房屋被烧，许多人被杀、被掳，皇帝的妹妹加拉·普拉西提阿也被带走。《历史的轨迹》第七章说劫掠有六天六夜，写得更为惨烈。

  罗马上一次被外敌攻破还是八百年前高卢人的事。《历史的轨迹》引了耶柔米在伯利恒写下的话：“谁能相信，征服了全世界的罗马竟会倾覆？”异教徒说，这是罗马人离弃了祖先的神明招来的灾祸。奥古斯丁为回应这种指责，从 413 年起写《上帝之城》，说地上的城有兴有衰，信徒所属的是另一座城。

  西哥特人几天后就离开了罗马。这年年底阿拉里克死在意大利南部，他的继任者带着部众转入高卢，后来在高卢西南和西班牙建立了王国。455 年罗马又被汪达尔人劫掠了一次。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 奥罗修《反异教史》卷 7 第 39—40 章
  - 奥古斯丁《上帝之城》卷 1
  - 耶柔米《书信》第 127 封、《以西结书注释》序言
