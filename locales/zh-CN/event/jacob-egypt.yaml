name: 雅各全家下埃及
summary: 饥荒之年，雅各带全家迁入埃及，住在歌珊地。
body: |-
  约瑟治理埃及时，七个丰年之后饥荒来到，迦南地也在其中。雅各两次打发儿子们下埃及籴粮（《创世记》第 42—44 章）。第二次，约瑟向哥哥们表明身份，说饥荒已经两年，还有五年不能耕种、不能收成，叫他们赶快把父亲接来，住在歌珊地（45:6—11）。法老听说后，也吩咐给他们车辆和路上用的食物（45:16—21）。雅各起初不信，看见约瑟打发来的车辆，心才苏醒（45:25—28）。

  雅各带着一切所有的起行，到了别是巴，向他父亲以撒的神献祭。夜间神在异象中对他说，不要怕下埃及去，神必使他在那里成为大族，也必定带他上来（46:1—4）。创 46:8—27 列出同去的子孙名单，并说雅各家来到埃及的共有七十人；《使徒行传》7:14 作七十五人，与七十士译本的数字相同。

  雅各打发犹大先去见约瑟，约瑟套车到歌珊迎接父亲，伏在他的颈项上哭了许久（46:28—30）。约瑟领五个弟兄见法老，说明他们世代以牧养牲畜为业，法老准他们住在歌珊地。雅各见法老时，法老问他的年岁，他说自己寄居在世的年日是一百三十岁（47:1—10）。约瑟把父亲和弟兄安置在兰塞境内，用粮食奉养全家（47:11—12）。

  雅各在埃及住了十七年，一百四十七岁去世（47:28）。他的子孙留在埃及，生养众多（《出埃及记》1:7）。据《出埃及记》12:40，以色列人住在埃及共四百三十年；七十士译本和撒玛利亚五经在这一节把在迦南的年日也算在内，按那样算，在埃及的时间要短得多。本条年份是照希伯来文本的四百三十年、从出埃及约在公元前 1446 年倒推的约数。
sources: []
recalled:
  - 《创世记》第 42—47 章
  - 《出埃及记》1:1—7、12:40
  - 《使徒行传》7:14
