name: 北魏统一北方
summary: 魏太武帝先后灭夏、北燕、北凉，439 年统一北方，南北朝对峙的局面由此形成。
body: |-
  刘裕代晋时，北方除北魏外，还有赫连氏的夏（都统万城）、冯氏的北燕（都龙城）、沮渠氏的北凉（都姑臧）、乞伏氏的西秦等政权，漠北则有柔然。魏太武帝拓跋焘即位后，采纳崔浩的意见，先打击柔然、夏国，再图其他。

  始光二年（公元 425 年）夏主赫连勃勃去世，次年太武帝乘机进攻，始光四年（427 年）攻克统万城，次年俘获夏主赫连昌。赫连昌的弟弟赫连定在平凉继位，神䴥四年（431 年）他灭了西秦，率部西渡黄河时被吐谷浑截击擒获，送交北魏，夏国灭亡。

  北燕的冯跋死后，弟弟冯弘继位。北魏连年进攻龙城，太延二年（436 年）冯弘率众东逃高句丽，北燕灭亡，冯弘两年后被高句丽所杀。后来北魏的冯太后就是冯弘的孙女。

  北凉的沮渠牧犍娶了太武帝的妹妹武威公主。太延五年（439 年），北魏以牧犍对公主不敬等罪名出兵讨伐。据《魏书·崔浩传》，朝中有人说凉州一带缺乏水草，大军难以行进，崔浩引用《汉书·地理志》“凉州之畜为天下饶”加以反驳，太武帝采纳了他的意见。同年九月，魏军包围姑臧，沮渠牧犍出降，北凉灭亡，余部西走高昌。

  至此，西晋末年以来北方长期分裂的局面结束，北魏统一了黄河流域，与南方的刘宋隔淮河对峙，史家常以这一年作为十六国时期的结束。北魏把凉州的大批学者、工匠和僧人迁到平城，河西保存的中原文化和佛教艺术由此东传，对北魏后来的学术和云冈石窟的开凿都有影响。
sources: []
recalled:
  - 《魏书·世祖纪》
  - 《魏书·崔浩传》
  - 《资治通鉴》卷一百二十至一百二十三
