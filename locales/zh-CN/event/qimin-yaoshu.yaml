name: 《齐民要术》成书
summary: 贾思勰写成《齐民要术》，总结黄河中下游的农牧经验，是现存最早最完整的农书。
body: |-
  《齐民要术》的作者贾思勰生平不详，书前署名“后魏高阳太守”。根据书中的内容推测，此书约成于北魏末年到东魏时期，大约在公元 533 年至 544 年之间。

  全书十卷九十二篇，约十一万字，另有一篇“杂说”，一般认为是后人所加。前几卷讲耕作、收种和各种谷物、豆类、瓜菜的栽培；第四、第五卷讲果树、桑柘和林木；第六卷讲马、牛、羊、猪、鸡、鹅、鸭的饲养和兽医，以及养鱼；第七至第九卷讲酿酒、制醋、作酱、作豉、腌菜和各种饭食的做法；第十卷记载南方和外来的植物。

  书中总结了许多重要的农业技术，如选择优良的穗子单独收藏留作种子；谷田必须年年换种作物；用绿豆、小豆、胡麻作绿肥来改良土壤；用棠梨、杜梨作砧木嫁接梨树等。作者认为，要顺应天时、考虑地利，才能用力少而成功多。书中还引用了一百五十多种前代文献和许多农谚，保存了《氾胜之书》《四民月令》等失传农书的片段。

  贾思勰在自序中说，他的材料来自古书的记载、民间的歌谣谚语、向老农的请教，以及自己的亲身实践。

  《齐民要术》是中国现存最早、最完整的一部农书，后来元代的《农桑辑要》、王祯的《农书》、明代徐光启的《农政全书》，都在很大程度上以它为基础。北宋时已有官刻本，今天日本还保存着宋本的残卷。
sources: []
recalled:
  - 贾思勰《齐民要术》
