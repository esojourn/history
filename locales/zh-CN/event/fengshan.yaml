name: 汉武帝泰山封禅
summary: 元封元年汉武帝登泰山祭天、在山下祭地，宣告功业告成，并因此改元“元封”。
body: |-
  “封”是在泰山顶上筑坛祭天，“禅”是在泰山下的小山上辟场祭地。战国秦汉间的儒生和方士认为，只有受命于天、天下太平的帝王才能举行这种大典。秦始皇曾在公元前 219 年登泰山封禅；汉文帝时有人提议，没有实行。

  据《史记·封禅书》，武帝即位后一直有意封禅，方士们又说封禅可以像黄帝那样成仙登天。但儒生们对仪式各执一词，拿不出确定的方案，武帝最后撇开他们，自己参照祭祀太一神的礼仪来定。元封元年（公元前 110 年），他先率十余万骑兵北巡朔方，向匈奴示威，然后东行到海边。四月，他在泰山下的梁父祭地，随后只带霍去病的儿子霍嬗一人登上山顶行封礼，过程无人得知；次日从北面下山，在肃然山行禅礼。事后他把年号改为“元封”，并免除了所经各地当年的租税。

  太史令司马谈因病滞留在洛阳一带，没能参加典礼，不久去世，临终把著史的事托付给儿子司马迁。此后武帝又多次到泰山修封。《封禅书》详细记录了他一生信用方士、祭神求仙而始终没有应验的经过。
sources: []
recalled:
  - 《史记·封禅书》
  - 《史记·太史公自序》
  - 《汉书·郊祀志》
