name: 康熙擒鳌拜
summary: 1669 年十六岁的康熙帝设计擒拿专权的辅政大臣鳌拜，开始真正掌握朝政。
body: |-
  顺治帝遗诏命索尼、苏克萨哈、遏必隆、鳌拜四大臣辅政。索尼年老，遏必隆依附鳌拜，鳌拜逐渐专擅朝政，与苏克萨哈的矛盾日益尖锐。康熙五年（1666 年）他强行调换八旗圈地，处死反对的大臣。康熙六年（1667 年）索尼去世，康熙帝亲政，但鳌拜仍把持朝政，同年他罗织罪名处死了苏克萨哈，康熙帝不同意，鳌拜在朝堂上攘臂力争，最后仍然得逞。

  据清代的记载，康熙帝挑选了一批身强力壮的少年侍卫，在宫中练习布库（满洲式摔跤），鳌拜以为这是少年皇帝的游戏，不加防备。康熙八年（1669 年）五月，康熙帝先把鳌拜的亲信派到外地，然后召鳌拜入宫，命少年侍卫将他擒拿。

  随后康熙帝命议政王大臣审问鳌拜，列出三十条罪状，请求处死。康熙帝念他是老臣，有战功，只将他革职拘禁，鳌拜不久死于禁所，他的党羽多人被处死或革职，遏必隆也被革职。擒拿鳌拜之后，康熙帝真正掌握了朝政。关于擒拿时的具体情节，民间流传的故事很多，不尽可信。
sources: []
recalled:
  - 《清圣祖实录》
  - 《清史稿·鳌拜传》
  - 昭梿《啸亭杂录》
