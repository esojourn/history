name: 天京事变
summary: 1856 年太平天国领导层内讧，东王杨秀清、北王韦昌辉相继被杀，翼王石达开出走。
body: |-
  太平天国定都天京后，东王杨秀清以“天父”代言人的身份总揽军政大权，权势极大，与天王洪秀全和北王韦昌辉、翼王石达开等人的矛盾逐渐加深。咸丰六年（1856 年）上半年，太平军接连攻破清军的江北大营和江南大营，杨秀清的威望达到顶点。

  据《李秀成自述》等记载，同年八月杨秀清借“天父下凡”，逼洪秀全封他为“万岁”。洪秀全表面应允，暗中密令在外作战的韦昌辉、石达开回京。九月初，韦昌辉率领三千多人连夜进入天京，突袭东王府，杀死杨秀清及其家属，随后又以搜捕“东党”为名，在城中屠杀了杨秀清的部属两万多人（数字见于当时的记载，未必精确）。也有学者认为，逼封万岁一事可能出于后来的说法，事变的起因还有其他因素。

  石达开赶回天京，责备韦昌辉滥杀，韦昌辉又要杀他，石达开连夜缒城逃出，他在城中的家属被韦昌辉全部杀害。石达开在安庆起兵，要求诛杀韦昌辉，洪秀全在众怒之下处死了韦昌辉，召石达开回京主持朝政。但洪秀全对石达开又心存猜忌，封自己的两个哥哥为王加以牵制。咸丰七年（1857 年）石达开率领大批精兵离京出走，再也没有回来。

  天京事变使太平天国的领导核心几乎瓦解，大批将士死于内讧，军心涣散，此后太平天国由盛转衰，清军得以喘息，重建了江南、江北大营。
sources: []
recalled:
  - 《李秀成自述》
  - 《石达开自述》
  - 罗尔纲《太平天国史》
