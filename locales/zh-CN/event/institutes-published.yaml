name: "《基督教要义》出版"
summary: "1536 年加尔文在巴塞尔出版《基督教要义》，后成为改革宗神学的基本著作。"
body: |-
  1534 年 10 月，巴黎等地一夜之间贴满了攻击弥撒的传单，法王弗朗索瓦一世下令搜捕，几十人被烧死。法王正要同德意志的新教诸侯结盟，对外解释说，被处死的是重洗派那样图谋颠覆的人。逃到巴塞尔的加尔文手头有一部写给初学者的信仰纲要，便加上一封致法王的长信，为同道申辩。《历史的轨迹》第二十四章说，这本书起先是为阐释改教的基本教导而写，后来加尔文认为它可以同时向法王说明，在法国受逼迫的信徒不是激进分子，而是坚守圣经的人。

  1536 年 3 月书在巴塞尔印成，拉丁文，小开本，共六章：律法、信经、主祷文、圣礼、被误称为圣礼的五样礼、基督徒的自由与教会和政府。前四章的次序照的是路德的教理问答。该书说加尔文写这部书时二十六岁，出版后几个月就使他闻名欧洲，法雷尔在日内瓦一听说他路过，就知道是那本书的作者。

  加尔文此后一生都在修订它。1539 年在斯特拉斯堡出的第二版扩充到十七章，加进了对神的认识、预定和护理等题目；1541 年他自己译成法文，是最早用法文写的神学大著之一，法国高等法院下令焚毁。1559 年的拉丁文定本分四卷八十章，依次讲创造主、救赎主、领受基督恩典的方式、教会。该书说末版的内容是初版的五倍，又称 1559 年版为第三次修订版；按拉丁文的主要版次，它是第五版。

  该书第二十六章说，法国的改教运动原来没有领袖和组织，因着这部书接纳了加尔文为领导者；它把改教的教导整理成有条理、合逻辑的形式，不久成为福音派主要的信仰依据。它很快被译成荷兰文、德文、英文等多种文字。
