name: 上源驿之变
summary: 884 年朱温在汴州上源驿夜袭前来助战的李克用，两人从此结下世仇。
body: |-
  中和四年（公元 884 年）春，黄巢率军围攻陈州，又进逼汴州，宣武军节度使朱温向河东节度使李克用求援。李克用率沙陀兵南下，五月在王满渡大败黄巢，随后追击到冤句，粮尽而回，路过汴州，驻扎在城外。

  朱温坚持请李克用入城，在上源驿设宴款待。据《资治通鉴》，席间李克用喝醉了酒，言语之间冒犯了朱温。当天夜里，朱温派兵包围上源驿，放火进攻。恰好天降大雨，扑灭了火势，李克用的亲兵薛志勤、史敬思等人拼死保护，李克用借着闪电的光亮缒城逃出，史敬思战死，随行的部众大多被杀。

  李克用回到军中，要立刻攻打汴州，被妻子刘氏劝阻。他回到晋阳后，多次上表请求朝廷讨伐朱温，唐僖宗无力处置，只好派人调解，加封两人官爵了事。从此朱温与李克用结下深仇，两家此后争战了几十年，延续到五代的后梁与后唐之间。
sources: []
recalled:
  - 《旧五代史·武皇纪》
  - 《资治通鉴》卷二百五十五
