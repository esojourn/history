name: 安史之乱
summary: 755 年安禄山在范阳起兵，攻陷两京，战乱持续七年多，唐朝由盛转衰。
body: |-
  唐玄宗后期，边境节度使统兵日重，安禄山身兼平卢、范阳、河东三镇节度使，掌握了北方的重兵。宰相杨国忠与他争权，屡次说他必反。天宝十四载（公元 755 年）十一月，安禄山以奉密旨讨伐杨国忠为名在范阳起兵，据《资治通鉴》，率所部兵和同罗、奚、契丹、室韦等族兵共十五万人，号称二十万，南下进攻。

  河北州县望风瓦解，只有常山太守颜杲卿、平原太守颜真卿等人起兵抵抗。叛军渡过黄河，十二月攻陷东都洛阳。封常清、高仙芝退守潼关，玄宗听信监军边令诚的诬告，把两人斩首，改派哥舒翰守潼关。天宝十五载（756 年）正月，安禄山在洛阳称大燕皇帝。六月，玄宗和杨国忠催促哥舒翰出关进攻，唐军在灵宝西原大败，潼关失守。玄宗逃往蜀中，途中在马嵬驿发生兵变，杨国忠被杀，杨贵妃被缢死（另见“马嵬驿之变”条）。叛军随后攻入长安。

  太子李亨北上，七月在灵武即位（唐肃宗），尊玄宗为太上皇，以郭子仪、李光弼等人率朔方军平叛，并借回纥兵相助。至德二载（757 年）正月安禄山被儿子安庆绪杀死；同年张巡、许远坚守睢阳，阻止叛军南下江淮；九月、十月唐军先后收复长安、洛阳。乾元二年（759 年）安禄山的部将史思明杀死安庆绪，自称大燕皇帝，再次攻占洛阳；上元二年（761 年）史思明又被儿子史朝义所杀。宝应元年（762 年）唐军再次收复洛阳，广德元年（763 年）正月史朝义自缢，叛将相继投降，战乱结束，史称“安史之乱”。

  战乱使黄河流域遭到严重破坏，户籍上的人口急剧减少，这既有死亡流离的原因，也与户籍失控有关。为了尽快结束战争，唐朝让投降的叛将继续担任河北各镇的节度使，内地也普遍设立节度使，形成了长期的藩镇割据；吐蕃趁唐朝西北边军内调，占领了河西、陇右；宦官在战乱中开始掌握兵权。唐朝从此由盛转衰。本站这一段录到战乱爆发前后，此后的详细经过留待以后补录。
sources: []
recalled:
  - 《旧唐书·安禄山传》
  - 《新唐书·逆臣传》
  - 《资治通鉴》卷二百一十七至二百二十二
