name: "明斯特王国"
summary: "1534—1535 年激进的重洗派占据明斯特，实行公有和多妻，城破后被屠。"
body: |-
  皮货商霍夫曼原是路德的追随者，后来自己解释启示录，在莱茵河下游和尼德兰传讲基督即将再来。《历史的轨迹》第二十五章说，他预言基督将于 1533 年再来，荷兰有许多人附从，不但官方的教会反对他，瑞士的重洗派也反对他；他后来被关进斯特拉斯堡的监牢，死在狱中。他的门徒、哈勒姆的面包师马提斯自称是他所预言的先知以诺，并且放弃了霍夫曼不动刀剑的主张。

  威斯特法伦的明斯特是主教管辖的城市，1533 年在牧师罗特曼带领下改行新教，罗特曼又进而反对婴儿洗礼。1534 年 1 月马提斯的使者到城里施洗，一个星期有一千多人受洗；2 月重洗派赢了市议会的选举。马提斯赶来，宣布明斯特是新耶路撒冷，不肯受洗的居民在风雪中被逐出城，财物归公，除圣经以外的书都烧了。荷兰、弗里斯兰有几千人动身来投，大多在路上被拦下。该书把占领明斯特记在 1533 年。

  主教募兵围城，信天主教的科隆和信路德宗的黑森都来助战。复活节那天马提斯带少数人出城冲阵被杀，莱顿的约翰接掌，废议会，立十二长老，7 月宣布准许多妻，镇压了反对的人，9 月称王。城里发行钱币，派“使徒”到各地求援，都被捕杀。

  围城一年多，城里吃尽了猫狗和草根。1535 年 6 月 24 日夜间，两个逃出去的人带围城的军队从一处城门摸进去，守城的男子几乎都被杀死。次年 1 月约翰等三人受酷刑处死。

  该书称这是教会历史上最悲惨的插曲之一，说激进分子的狂热行为玷辱了重洗派的名声；第三十章又说，罗马教会抓住这一点，说改教的教义会破坏教会、国家和社会的一切秩序，许多上层的人因此留在罗马教会。此后各地官府对重洗派不分和平与否，一律严办。门诺·西门把幸存的和平一派聚集起来。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十五章“重洗派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter28.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
