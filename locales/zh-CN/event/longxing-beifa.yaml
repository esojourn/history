name: 隆兴北伐
summary: 1163 年宋孝宗命张浚北伐，宋军在符离溃败，次年宋金订立隆兴和议。
body: |-
  宋孝宗即位后锐意恢复中原，他为岳飞平反，起用主战的老臣张浚，任他为枢密使，都督江淮东西路军马。隆兴元年（公元 1163 年）四月，孝宗绕过主和的宰相，直接下令北伐。

  五月，宋军分两路渡淮：李显忠攻下灵璧，邵宏渊攻下虹县，随后两军会合攻下宿州。但两位主将不和，邵宏渊不服李显忠的节制，宋军赏赐不均，士气低落。金将纥石烈志宁率军反攻，宋军在符离与金军交战，邵宏渊按兵不动，宋军夜间自行溃散，军资器械损失殆尽，史称“符离之败”。

  符离之败后，朝中主和派重新占据上风，宰相汤思退主张议和。隆兴二年（1164 年）张浚被罢，不久去世；金军又南下两淮施加压力。同年冬天双方议定和约，次年即乾道元年（1165 年）正式生效，史称“隆兴和议”，也称“乾道和议”。和约规定：宋帝对金帝改称侄，不再称臣，“岁贡”改称“岁币”，银、绢各减五万，为二十万；宋放弃北伐中收复的唐、邓、海、泗等州，疆界大体恢复绍兴和议时的状况。

  隆兴和议比绍兴和议对宋稍为有利，此后宋金之间维持了四十年的和平，直到开禧二年（1206 年）韩侂胄再次北伐（另见“开禧北伐”条）。
sources: []
recalled:
  - 《宋史·孝宗本纪》
  - 《宋史·张浚传》
  - 《金史·世宗本纪》
