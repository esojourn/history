name: 完璧归赵
summary: 前 283 年蔺相如奉和氏璧入秦，识破秦王骗局，将璧完好送回赵国。
body: |-
  赵惠文王得到了楚国的和氏璧。据《史记·廉颇蔺相如列传》，秦昭王听说后，派人送信给赵王，表示愿意用十五座城交换这块璧。赵王与大臣商议，给了怕被骗，不给又怕秦军来攻。宦者令缪贤推荐了自己的门客蔺相如。

  蔺相如捧璧到了秦国，秦王在章台接见他，得璧后十分高兴，传给美人和左右观看，却丝毫不提交城的事。蔺相如看出秦王无意给城，上前说璧上有一点瑕疵，请让我指给大王看。拿回璧后，他退到柱子旁，怒发冲冠，说大王若一定要逼我，我的头就和璧一起撞碎在这柱子上。秦王怕他真的撞碎玉璧，只好叫人拿来地图，指出要给赵国的十五座城。蔺相如料定这只是假意，又要求秦王斋戒五天、在朝廷上设九宾之礼才献璧，暗中却派随从穿着粗布衣服，怀揣玉璧抄小路送回了赵国。

  五天后秦王设九宾之礼，蔺相如说出实情，并请秦王先割十五城给赵国，赵国一定不敢留璧而得罪大王。秦王与群臣面面相觑，最后以礼相待送他回国。秦国终究没有给城，赵国也没有给璧。蔺相如因此被任为上大夫。

  和氏璧的来历见于《韩非子·和氏》：楚人卞和在山中得到一块璞玉，先后献给两位楚王，都被认为是石头，因此被砍去双脚；到楚文王时才剖开璞石，果然得到美玉，命名为“和氏之璧”。
sources: []
recalled:
  - 《史记·廉颇蔺相如列传》
