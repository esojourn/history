name: 夷陵之战
summary: 公元 221 至 222 年，刘备东征孙权，在夷陵被陆逊用火攻击败，退守白帝城。
body: |-
  公元 219 年孙权袭取荆州、杀关羽，孙刘联盟破裂。章武元年（221 年）刘备称帝后决意东征。裴松之注引《赵云别传》说，赵云曾劝阻，认为首要的敌人是曹魏，刘备没有听从。出兵前，张飞在阆中被部下杀害。孙权派人求和，遭到拒绝，于是向魏文帝曹丕称臣，以免两面受敌。

  据《三国志·吴书·陆逊传》和《蜀书·先主传》，这年七月刘备率军顺江东下，前锋在巫县、秭归击败吴军。孙权任命陆逊为大都督，统率五万人抵御。次年二月，刘备的主力从秭归进到猇亭、夷道一带，在长江南岸沿山扎营，同时派黄权带一支部队在江北防备魏军。陆逊把峡口以西的山地让出，退守夷陵，坚守不战。吴军诸将多是孙策时的旧将或宗室贵戚，对他颇不服气，陆逊按剑申明军令，才使众人听命。

  两军从正月相持到六月。蜀军远道而来，求战不得，时值盛夏，营寨都设在林木之间。陆逊认为反攻的时机已到，先派兵试攻一营，没有成功，但由此想出破敌之法。闰六月，他命士兵每人拿一把茅草，同时放火并发起进攻，接连攻破蜀军四十多座营寨。蜀将冯习、张南等战死，刘备退到马鞍山，再遭围攻，乘夜突围，靠驿站的人焚烧铠甲堵塞山道才摆脱追兵，逃回白帝城。《陆逊传》说蜀军的船只、器械和水陆军资一时丧失殆尽，尸体顺江漂流而下。江北的黄权退路被断，率部投降了魏国。

  蜀军的兵力史书没有明确记载。战后陆逊没有继续西进，他估计曹丕会趁机南下，后来果然如此。章武三年（223 年）四月刘备死在白帝城。诸葛亮主政后派邓芝出使吴国，两国恢复了同盟，此后四十年没有再发生大的战事。
sources: []
recalled:
  - 《三国志·吴书·陆逊传》
  - 《三国志·蜀书·先主传》
  - 《三国志·吴书·吴主传》
