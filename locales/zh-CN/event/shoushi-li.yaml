name: 授时历
summary: 郭守敬等人经实测编成的新历，1281 年颁行，定一年为 365.2425 日。
body: |-
  元朝初年沿用金朝的《大明历》，误差越来越大。至元十三年（公元 1276 年）元军攻下临安后，忽必烈下令设立太史局，修订新历，以王恂主持，郭守敬负责制造仪器、进行观测，许衡等人参与讨论。

  郭守敬认为“历之本在于测验，而测验之器莫先仪表”，他创制和改进了简仪、高表、仰仪、景符、窥几等十多种仪器。简仪简化了传统浑仪的结构，观测更加方便准确；高表把传统的八尺圭表加高到四十尺，配合景符，提高了测量日影的精度。他还组织了大规模的“四海测验”，据《元史》，在南起南海、北至北海（今西伯利亚一带）的范围内设立了二十七个观测点，测量各地的纬度和昼夜长短。今天河南登封告成镇保存的观星台，就是当时所建的观测台之一。

  至元十七年（1280 年）新历编成，忽必烈取《尚书》“敬授人时”的意思，命名为《授时历》，次年正式颁行。据《元史·历志》，《授时历》以 365.2425 日为一个回归年，与现行公历（格里高利历）的平均年长相同，而比后者早了约三百年；它废除了以往历法推算“上元积年”的做法，以至元十八年为历元，并采用了新的数学方法。王恂、许衡相继去世后，郭守敬整理了历法的计算方法和数据，写成多种著作。

  《授时历》是中国古代最精确的历法之一。明朝的《大统历》基本上沿用了它的方法，前后使用了三百多年。它还传到朝鲜和日本，对两国的历法有很大影响。
sources: []
recalled:
  - 《元史·历志》
  - 《元史·郭守敬传》
  - 《元史·天文志》
