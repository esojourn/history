name: 斯巴达大地震与希洛人起义
summary: 公元前 464 年斯巴达遭大地震，希洛人乘机起义，据守伊托墨山多年。
body: |-
  斯巴达公民不事生产，他们的份地由称为“希洛人”的农奴耕种。希洛人世代被束缚在土地上，其中大部分是被斯巴达征服的麦西尼亚人；人数远多于斯巴达公民，斯巴达人对他们始终存有戒心。

  公元前 464 年，拉科尼亚发生强烈地震。狄奥多罗斯说死了两万多人，普鲁塔克说斯巴达城里只剩五所房屋没有倒，这些说法难以核实，但斯巴达公民的人数此后一直没有恢复。希洛人乘机起事，一部分边民城镇也加入了。据普鲁塔克，国王阿希达穆斯及时集合起武装的公民，使逼近城区的希洛人退走。起义者后来退守麦西尼亚的伊托墨山。

  斯巴达人不善攻坚，向盟邦求援。雅典的客蒙力主出兵，前 462 年率四千重装步兵到达。攻山不下，斯巴达人对雅典人“敢作敢为、喜欢变革的脾性”起了疑心，怕他们与山上的人串通，便只把雅典人一家打发回去。雅典人深以为辱，随即废除与斯巴达的盟约，转而与斯巴达的宿敌阿尔戈斯结盟，客蒙也在次年被放逐。

  据修昔底德，起义者坚持到“第十年”才投降，这个数字是否抄写有误，学者有争论，不少人认为围困只持续了四五年。投降的条件是他们带着妻儿离开伯罗奔尼撒，永不返回。雅典人把他们安置在科林斯湾北岸的瑙帕克托斯，这些麦西尼亚人后来在伯罗奔尼撒战争中是雅典可靠的盟友。
sources: []
