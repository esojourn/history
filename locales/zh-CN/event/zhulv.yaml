name: 平定诸吕
summary: 公元前 180 年吕后去世，陈平、周勃等诛灭吕氏一族，迎立代王刘恒。
body: |-
  吕后临朝称制期间，分封吕台、吕产、吕禄等吕氏子弟为王，违背了高祖“非刘氏不得王”的约定。据《史记·吕太后本纪》，公元前 180 年七月吕后病重，命赵王吕禄为上将军统领北军，吕王吕产统领南军，并告诫他们握住兵权、守住宫廷。吕后死后，吕产任相国。

  朱虚侯刘章的妻子是吕禄之女，他得知吕氏的图谋，暗中通知兄长齐王刘襄。八月，齐王起兵西进，吕产派灌婴领兵迎击；灌婴到荥阳后按兵不动，与齐王约定联合。在长安，太尉周勃无法进入军营，便与丞相陈平合谋，让与吕禄交好的郦寄劝他交出将印、回到封国。吕禄交印后，周勃进入北军，下令“为吕氏右袒，为刘氏左袒”，军中都袒露左臂。吕产不知北军已失，进入未央宫，被周勃派去的朱虚侯刘章率千余士卒追杀。次日吕禄被捕斩，吕氏男女不论老少一律处死。

  大臣们商议，认为少帝和几位年幼的诸侯王都不是惠帝的亲生儿子，决定另立皇帝。齐王母家强横，淮南王年少，代王刘恒年长而宽厚，母家薄氏谨慎善良，于是派人迎代王入长安。刘恒于闰九月抵达并即位，是为汉文帝；少帝等人当夜被杀。
sources:
  - 《史记·吕太后本纪》 https://ctext.org/shiji/lv-tai-hou-ben-ji/zhs
  - 《史记·孝文本纪》 https://ctext.org/shiji/xiao-wen-ben-ji/zhs
  - 《史记·绛侯周勃世家》 https://ctext.org/shiji/jiang-hou-zhou-bo-shi-jia/zhs
