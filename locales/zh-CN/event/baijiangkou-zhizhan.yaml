name: 白江口之战
summary: 663 年唐与新罗联军在白江口大败援助百济复国的倭国水军。
body: |-
  显庆五年（公元 660 年）唐朝和新罗攻灭百济后，百济的遗臣鬼室福信、僧人道琛等人起兵复国，派人到倭国（当时的日本）迎回在那里做人质的百济王子扶余丰，立为国王，并请求倭国出兵援助。倭国的齐明天皇亲自到九州筑紫督师，不久去世，由中大兄皇子（后来的天智天皇）继续主持，先后派出数万军队渡海。

  当时唐将刘仁愿、刘仁轨率少数唐军驻守百济故都附近的熊津城，被复国军围攻，坚守了两年多。百济复国军内部又发生内讧，扶余丰杀死了鬼室福信。龙朔三年（663 年）八月，唐将刘仁轨、杜爽等率水军与新罗军会合，在白江口（一般认为是今韩国锦江入海口一带）与倭国水军相遇。据《旧唐书·刘仁轨传》，唐军四战皆捷，焚毁倭船四百艘，烟焰涨天，海水都被染红。日本的《日本书纪》也记载倭军大败，很多士兵落水溺死。扶余丰逃往高句丽，百济复国运动随之失败。

  这次战败对倭国震动很大。此后倭国担心唐军渡海来攻，在对马、九州和濑户内海沿岸修筑了水城和许多山城，设置烽火，并在 667 年把都城迁到近江大津。不久之后，倭国恢复了派遣遣唐使，并更积极地学习唐朝的律令制度，大约在七世纪末改称“日本”。
sources: []
recalled:
  - 《旧唐书·刘仁轨传》
  - 《旧唐书·百济传》
  - 《日本书纪》卷二十七
