name: 洁净圣殿
summary: 犹大收复圣殿，清除异教祭坛后重新献祭，修殿节由此而来。
body: |-
  击退吕西亚的军队之后，犹大和兄弟们率众登上锡安山。《马加比一书》4:38 记他们见到圣所荒凉，祭坛被污，殿门烧毁，院中长满灌木。犹大一面派人牵制卫城里的塞琉古守军，一面选出守律法的祭司清理圣所（4:41–43）。

  被玷污的燔祭坛被拆下，石头另存一处，“等先知兴起再作决定”；他们按律法用未经凿过的石头另筑新坛，重制圣器，把灯台、香坛和供桌搬入殿中（4:44–51）。塞琉古纪元 148 年基斯流月二十五日，即公元前 164 年冬，他们在新坛上献祭，《马加比一书》4:54 和《马加比二书》10:5 都说这正是圣殿当初被亵渎的同一日。献坛之礼持续八天，犹大和会众议定此后每年在这八天守节（4:56–59）。

  这个节期就是修殿节，又称光明节，《约翰福音》10:22 也提到它。约瑟夫斯《犹太古史》卷 12 第 7 章说这个节被称为“光明”。至于一小瓶油点燃八天的故事，不见于两部《马加比书》，出自后来的《巴比伦塔木德·安息日篇》21b。
sources:
  - 《马加比一书》4:36–59
  - 《马加比二书》10:1–8
  - 约瑟夫斯《犹太古史》卷 12 第 7 章第 7 节 https://penelope.uchicago.edu/josephus/ant-12.html
  - 《约翰福音》10:22
  - 《巴比伦塔木德·安息日篇》21b https://www.sefaria.org/Shabbat.21b
