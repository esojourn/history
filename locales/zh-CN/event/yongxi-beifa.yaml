name: 雍熙北伐
summary: 986 年宋太宗三路攻辽，东路军岐沟关大败，杨业战死，宋从此对辽取守势。
body: |-
  乾亨四年（公元 982 年）辽景宗去世，十二岁的辽圣宗即位，由承天太后萧绰摄政。宋朝边将上报说辽朝主少国疑，宋太宗认为这是收复燕云的时机，雍熙三年（986 年）正月下令分三路北伐：东路由曹彬率领主力，从雄州出发进攻幽州；中路由田重进率领，出飞狐；西路由潘美为主帅、杨业为副帅，出雁门。

  开战之初宋军进展顺利，西路军攻下了寰、朔、应、云四州，中路军攻下飞狐、灵丘、蔚州，东路军攻下涿州。但曹彬的大军孤军深入，粮道被辽将耶律休哥的轻骑截断，只得退回雄州补充粮草。太宗命他不要冒进，诸将却因中路、西路屡屡告捷而急于立功，曹彬只好再次进军涿州。这时萧太后和辽圣宗亲率大军赶到，五月，宋军在撤退途中被辽军追上，在岐沟关大败，士卒伤亡惨重。

  东路军失败后，太宗下令中路、西路撤军，并命潘美、杨业掩护四州百姓内迁。监军王侁逼迫杨业正面迎敌，杨业在陈家谷口战败被俘，绝食而死（另见“杨业”条）。这年冬天辽军南下报复，又在君子馆击败宋军。

  雍熙北伐是宋朝收复燕云的最后一次大规模尝试。此后宋朝在河北一线转为守势，依靠城寨和塘泊防御辽朝骑兵。辽朝方面则在萧太后的主持下巩固了统治，到宋真宗时又大举南下，最后双方订立澶渊之盟（另见该条）。
sources: []
recalled:
