name: 汉平南越
summary: 南越丞相吕嘉杀死主张归汉的国王和汉使，汉武帝发兵攻破番禺，在岭南设九郡。
body: |-
  南越国由秦朝的将领赵佗在秦末建立，都番禺，据有今广东、广西和越南北部。汉初赵佗接受汉朝的册封，实际上自主一方。他在武帝初年去世后，王位由子孙相继。

  据《史记·南越列传》，第三代南越王婴齐曾在长安做人质，娶了邯郸女子樛氏，生子赵兴。婴齐死后赵兴继位，樛氏为太后。元鼎四年（公元前 113 年），武帝派使者前去劝说南越王入朝。太后是中原人，又与国内大臣不和，便劝赵兴上书，请求像内地的诸侯王一样三年一朝，撤除边关。丞相吕嘉历仕三代国王，宗族中做官的有七十余人，在国内的威望高于国王，他坚决反对归附。太后想在宴席上借汉使之手杀他，没有成功。

  元鼎五年（前 112 年），武帝派韩千秋和太后的弟弟率两千人进入南越。吕嘉于是起兵，杀死赵兴、太后和汉朝的使者，另立婴齐与越人妻子所生的长子建德为王，并在离番禺四十里的地方全歼了韩千秋的部队。同年秋，武帝调集十万人分路南下：伏波将军路博德出桂阳，楼船将军杨仆出豫章，另有几路分别从零陵和夜郎方向进发。次年冬，杨仆先攻到番禺城下，路博德随后赶到。杨仆在东南面纵火攻城，路博德在西北面设营招降，城中人纷纷出降。吕嘉和建德带着几百人乘船逃入海中，不久被追获。

  列传说南越自赵佗称王起，传五世、九十三年而亡。汉朝在其故地设南海、苍梧、郁林、合浦、交趾、九真、日南、珠崖、儋耳九郡，岭南和今越南北部、中部从此直属朝廷。
sources: []
recalled:
  - 《史记·南越列传》
  - 《汉书·西南夷两粤朝鲜传》
