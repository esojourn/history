name: 开元之治
summary: 唐玄宗开元年间任用贤相、整顿吏治、清查逃户，唐朝国力达到鼎盛。
body: |-
  唐玄宗在先天二年（公元 713 年）掌握全部权力后，改元开元，前后任用姚崇、宋璟、张嘉贞、张说、李元纮、杜暹、韩休、张九龄等人为宰相。姚崇善于应变，宋璟守法持正，后世并称“姚宋”。

  在吏治方面，玄宗裁汰了中宗、睿宗时大量设置的员外官和“斜封官”，重视地方官的选任，曾亲自考核新任县令，把不称职的退回学习；又限制宗室、外戚和功臣干预政事。在宗教方面，他下令淘汰伪滥的僧尼，禁止新建佛寺。在经济方面，他派宇文融清查逃亡的农户，据《资治通鉴》，前后检括出客户八十余万，让他们就地登记户籍，纳税服役；又在各地兴修水利、发展屯田，裴耀卿改革漕运，分段转运江淮的粮食到关中。

  这一时期社会安定，经济繁荣，人口持续增长。据《资治通鉴》，到天宝十三载（754 年），全国有户九百余万，口五千二百余万，这是唐代户口统计的最高数字。杜甫在《忆昔》中回忆开元全盛时“稻米流脂粟米白，公私仓廪俱丰实”，“九州道路无豺虎”。长安、洛阳成为当时世界上最繁华的城市，各国使节、商人和留学生云集。文化上，李白、王维、孟浩然等诗人的创作，吴道子的绘画，张旭的草书，一行的天文历法，都达到很高的水平。

  但这一时期也潜伏着危机：均田制和府兵制逐渐瓦解，边境改设节度使，统兵日重（另见“节度使设置”条）。开元后期玄宗渐渐怠于政事，开元二十四年（736 年）罢免张九龄后，李林甫长期专权，政治日益腐败。天宝十四载（755 年）爆发的安史之乱，使唐朝由盛转衰。
sources: []
recalled:
