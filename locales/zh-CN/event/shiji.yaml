name: 《史记》成书
summary: 司马迁历时十余年写成《史记》，开创了以人物传记为中心的纪传体，为历代正史所沿用。
body: |-
  司马迁的父亲司马谈任太史令时，已着手搜集材料，打算写一部贯通古今的史书，没有完成就在元封元年（公元前 110 年）去世。司马迁继任太史令后，得以阅读朝廷收藏的图书和档案。据《史记·太史公自序》，太初元年（前 104 年）新历颁行以后，他开始正式撰写。

  写到第七年，发生了李陵事件。天汉二年（前 99 年）李陵兵败投降匈奴，司马迁在武帝面前为他辩解，被以诬罔的罪名下狱，判处死刑。按当时的法律，死刑可以用钱赎免，或改受宫刑。他家贫无钱，亲友也没有人出面相救。他在《报任安书》中说，自己之所以忍受这种最大的耻辱活下来，是因为书稿尚未完成；并举出周文王、孔子、屈原、左丘明、孙膑等人的例子，说明古来的著作大多是作者在困厄中抒发愤懑而写成的。出狱后他任中书令，在宫中掌管文书，继续著述。《报任安书》的写作年代有征和二年（前 91 年）和太始四年（前 93 年）两说，信中说全书一百三十篇已经大体完成。

  全书分五个部分：十二本纪按年代记帝王大事，十表排列世系和年代，八书分述礼乐、律历、天文、祭祀、水利、财政等制度，三十世家记诸侯国和重要家族，七十列传写各类人物以及周边的民族和国家。记事从传说中的黄帝开始，到武帝时为止，自序说共五十二万六千五百字。书中为刺客、游侠、商人、医者、占卜者立传，把陈涉列入世家、项羽列入本纪，对当朝的武帝也有不少批评。

  司马迁自己把它叫作《太史公书》，“史记”的名称是东汉以后才通行的。他把正本藏起，副本留在京师。宣帝时，他的外孙杨恽把书公布出来，才逐渐流传。《汉书》说其中十篇在西汉后期已经有目无文，今本里有一些段落是元帝、成帝时的褚少孙等人补写的。班固批评它的是非标准与儒家经典不尽相合，但也称赞它“不虚美，不隐恶”，可称“实录”。此后历代的正史都采用了它所开创的纪传体。
sources: []
recalled:
  - 《史记·太史公自序》
  - 《汉书·司马迁传》（含《报任安书》与班固赞语）
