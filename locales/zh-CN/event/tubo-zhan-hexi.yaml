name: 吐蕃攻占河西陇右
summary: 安史之乱后吐蕃逐年攻占陇右、河西各州，沙州约在 786 年前后最后投降。
body: |-
  安史之乱爆发后，唐朝把河西、陇右的军队大批调往内地平叛。吐蕃乘机进攻，从至德年间起逐年攻取唐朝西部的州县。广德元年（公元 763 年）前后，陇右的兰、廓、河、鄯、洮、岷、秦、成、渭等州都已落入吐蕃之手，河西走廊与长安之间的联系被切断。

  此后吐蕃沿河西走廊向西推进。据史书，凉州在广德二年（764 年）陷落，甘州、肃州在永泰二年（766 年）前后陷落，瓜州在大历十一年（776 年）陷落。沙州军民在孤立无援的情况下坚守了十多年，最后以不把居民迁往别处为条件投降，投降的时间史料记载不一，一般认为在贞元二年（786 年）前后，也有 781 年等说法。远在西域的安西、北庭两个都护府与朝廷隔绝，仍然坚守多年，北庭在贞元六年（790 年）前后陷落，安西坚守的时间更长。

  吐蕃统治河西数十年，推行吐蕃的部落制度，要求当地人改穿吐蕃服装，但当地汉人仍然保留着自己的语言和习俗，敦煌的佛教在这一时期继续繁荣。大中二年（848 年）吐蕃内乱时，张议潮在沙州起事，逐步收复了河西各州（另见“张议潮与归义军”条）。
sources: []
recalled:
  - 《旧唐书·吐蕃传》
  - 《新唐书·吐蕃传》
  - 《元和郡县图志》陇右道
