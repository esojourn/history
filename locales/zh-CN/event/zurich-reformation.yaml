name: "苏黎世改教"
summary: "1523—1525 年苏黎世依慈运理的主张撤除图像、废除弥撒，重洗派同时分出。"
body: |-
  慈运理 1519 年起在苏黎世大教堂逐卷讲解新约。1522 年有人在四旬期吃肉，康斯坦茨主教派人来查问，市议会要求争论的各方拿圣经来证明。1523 年 1 月 29 日议会在市政厅召集辩论，约六百人到场，慈运理提出《六十七条》，说福音的权威不靠教会批准，基督是唯一的中保，弥撒不是献祭，教皇制、圣徒代求、修道誓愿、教士独身和炼狱都没有圣经根据。主教的代表不肯就条文辩论，议会宣布慈运理可以照旧传讲。

  同年 10 月第二次辩论，讨论图像和弥撒。到会的人大多认为两样都该废，慈运理主张由议会决定何时施行，免生骚乱；格列伯等人认为神的话既已清楚，不该等官府，从此与他分手。《历史的轨迹》第二十四章概述其结果：苏黎世教堂里的图像被搬走，弥撒废止，祭坛、圣徒遗物和宗教游行都取消，教会的管理和穷人的照应交给市政府，学校也改善了。图像是 1524 年夏天在官府监督下有秩序地拆除的，修道院同年解散，产业用于济贫和办学；1525 年复活节前，议会以微弱多数废除弥撒，改用德语举行简单的圣餐，信徒坐着领饼和杯。

  同年议会设立婚姻法庭，慈运理又开办每日讲解圣经原文的“先知讲习”，苏黎世译本的德文圣经后来就出自这里。1525 年 1 月，反对婴儿洗礼的一派败诉后自行施洗，该书第二十五章说这事发生在慈运理取消弥撒之前几个月。议会随即查禁他们，1526 年规定重洗者处以淹刑。

  该书说，改教从苏黎世蔓延到瑞士的好几个州，仍有不少州维持天主教。1528 年伯尔尼经过辩论接受改教，巴塞尔、圣加仑等城随后跟进；中部山区的五个州结盟抵制，瑞士从此分成两个阵营。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十四章“瑞士的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter27.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十五章“重洗派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter28.html"
