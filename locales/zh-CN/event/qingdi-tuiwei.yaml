name: 清帝退位
summary: 1912 年 2 月 12 日宣统帝退位，清朝结束，两千多年的帝制随之终结。
body: |-
  武昌起义后，袁世凯被清廷起用为内阁总理大臣，掌握了北洋军的指挥权。他一面派兵进攻武汉，向南方施加压力，一面派唐绍仪到上海与南方代表伍廷芳议和。南方答应，只要清帝退位、袁世凯赞成共和，就推举他为大总统。1912 年 1 月 1 日中华民国在南京成立后，袁世凯加紧逼迫清廷退位。

  清廷内部，以良弼为首的部分皇族组织“宗社党”，坚决反对退位。1 月下旬良弼被革命党人彭家珍炸死，皇族亲贵大为恐慌。段祺瑞等北洋将领联名通电，要求清廷“立定共和政体”。在内外交迫之下，隆裕太后召开御前会议，最终决定接受优待条件、宣布退位。

  宣统三年十二月二十五日（公历 1912 年 2 月 12 日），隆裕太后以六岁的宣统帝溥仪的名义颁布退位诏书，宣布“将统治权公诸全国，定为共和立宪国体”，并授权袁世凯组织临时共和政府。同时公布了《清室优待条件》：清帝退位后保留尊号，暂居宫禁，日后移居颐和园；民国政府每年拨给四百万元；清朝宗庙陵寝永远奉祀；对满、蒙、回、藏各族也有优待条件。

  清帝退位标志着清朝统治的结束，也结束了中国自秦朝以来两千多年的君主专制制度。退位诏书颁布时，农历仍是宣统三年，按公历已是 1912 年，本站按公历把清朝的终点标为 1912 年。此后溥仪仍住在紫禁城中，1917 年张勋复辟时曾短暂复位十二天。
sources: []
recalled:
  - 《清帝逊位诏书》
  - 《宣统政纪》
