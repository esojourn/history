name: 范雎入秦与远交近攻
summary: 范雎向秦昭王提出“远交近攻”，废太后、逐穰侯，任秦相。
body: |-
  秦昭襄王前期，国政由母亲宣太后和舅舅穰侯魏冉把持，魏冉曾越过韩、魏去攻打齐国的刚、寿，想扩大自己在陶的封地。魏人范雎遭魏相魏齐迫害后逃到秦国，改名张禄，等待了一年多才得到昭王召见。

  据《史记·范雎蔡泽列传》和《战国策·秦策三》，范雎先以秦国内政打动昭王，再提出外交方略：越过韩、魏去攻打齐国，出兵少了不足以伤齐，出兵多了又损害秦国，即使取胜，土地也不能与秦相连，只会便宜了韩、魏；不如“远交而近攻，得寸则王之寸也，得尺亦王之尺也”，与较远的齐、楚交好，集中力量蚕食邻近的韩、魏。昭王采纳了这一主张。

  范雎又指出，秦国“闻秦之有太后、穰侯，不闻其有王”。公元前 266 年，昭王废宣太后，把穰侯、华阳君、高陵君、泾阳君等逐出关外，任范雎为相，封为应侯。此后秦国按照远交近攻的方略，连年攻取韩、魏的土地，又在长平大破赵军，为统一六国铺平了道路。

  “远交近攻”后来被列入“三十六计”。范雎之后，蔡泽、吕不韦、李斯等来自东方各国的客卿相继在秦国执政，秦国任用六国人才的传统一直延续到统一。

  远交近攻的方略一直被秦国沿用到统一六国。
sources: []
recalled:
  - 《史记·范雎蔡泽列传》
  - 《战国策·秦策三》
  - 《史记·穰侯列传》
