name: 夺门之变
summary: 1457 年石亨等人拥被软禁的明英宗复位，于谦随后被冤杀。
body: |-
  明英宗从瓦剌回来后，被景泰帝软禁在南宫。景泰帝废掉了英宗的儿子朱见深的太子之位，改立自己的儿子，但新太子次年夭折，此后储位一直空悬。景泰八年（1457 年）正月，景泰帝病重，朝中大臣商议请立太子。

  武清侯石亨与宦官曹吉祥、都督张軏、左副都御史徐有贞等人认为这是取得富贵的机会，在正月十六日夜间带兵进入皇城，撞开南宫的宫门，把英宗接出，拥到奉天殿升座，次日早晨朝臣入朝时，看到的已是英宗复位。英宗改元天顺，景泰帝被废为郕王，一个月后去世。

  复位后，石亨、徐有贞等人以“意欲迎立外藩”的罪名诬陷兵部尚书于谦和大学士王文，两人被处死。参与夺门的人纷纷升官封爵，冒功者多达数千人。此后徐有贞、石亨、曹吉祥之间互相倾轧，徐有贞被流放，石亨死于狱中，曹吉祥在天顺五年（1461 年）谋反失败被杀。英宗晚年也承认夺门一事不足称道。
sources: []
recalled:
  - 《明史·英宗后纪》
  - 《明史·石亨传》
  - 《明史·于谦传》
