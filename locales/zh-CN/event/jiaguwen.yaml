name: 殷墟甲骨卜辞
summary: 商代晚期王室在龟甲兽骨上刻写的占卜记录，是目前所知最早的成体系的汉字。
body: |-
  甲骨卜辞是商代晚期王室占卜后刻在龟甲和牛肩胛骨上的文字。商王遇到祭祀、征伐、田猎、农事、天气、疾病、生育等事，都要占卜：先在甲骨背面钻凿，再用火灼烧，根据正面裂开的“卜”字形纹路判断吉凶，然后把占问的事情和结果刻在旁边。已发现的卜辞从武丁时期开始，一直到商朝灭亡，所以这里按断代工程的年表从约公元前 1250 年画到前 1046 年。

  甲骨文的发现始于清末。一般的说法是，1899 年金石学家王懿荣认出药材“龙骨”上刻有古文字，此后罗振玉查明它们出自河南安阳小屯，即古书所说的“殷墟”。1928 年起，中央研究院历史语言研究所在殷墟进行了十五次发掘，1936 年发现的 YH127 坑一次出土了一万七千多片甲骨。迄今出土的甲骨总数约十几万片，已识读的单字一千多个（各家统计不一）。

  甲骨卜辞的价值在于它是商代同时代的文字记录。王国维根据卜辞考证了商王的世系，证明《史记·殷本纪》所记的商王名号大体可信，只有个别次序有误。这一发现使商代成为中国有同时代文字证据的最早朝代。甲骨文已是相当成熟的文字体系，与后来的金文、篆书一脉相承。
sources: []
recalled:
  - 王国维《殷卜辞中所见先公先王考》
  - 《甲骨文合集》
