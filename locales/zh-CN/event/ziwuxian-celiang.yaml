name: 一行测量子午线
summary: 一行主持在全国多地测量日影和北极高度，算出南北距离与北极高度的对应关系。
body: |-
  古代中国长期流行“日影千里差一寸”的说法，认为南北相距一千里，夏至正午八尺表的影子长度相差一寸。僧人一行在编制《大衍历》时，需要准确的观测数据，于是在开元十二年（公元 724 年）前后主持了一次大规模的天文大地测量，测量点北到铁勒，南到交州一带。

  其中最重要的一组观测，由太史监南宫说等人在河南平原上进行。他们在大致位于同一经线上的滑州白马、汴州浚仪、许州扶沟、豫州上蔡四个地点，测量冬至、夏至和春分、秋分正午的日影长度和北极星的高度，并实地丈量了各点之间的距离。据《旧唐书·天文志》，一行根据这些数据算出，南北相距三百五十一里八十步，北极高度相差一度（古代把圆周分为三百六十五度多），并证明日影长度的变化与距离不成简单的比例，“千里差一寸”的说法不能成立。

  这次测量实际上是对子午线一度弧长的实测，现代学者多认为它是世界上较早的同类测量之一。它的成果被用于编制《大衍历》。
sources: []
recalled:
  - 《旧唐书·天文志》
  - 《新唐书·天文志》
