name: 东西教会分裂
aliases:
  - 东西教会大分裂
  - 1054 年分裂
summary: 1054 年罗马使团与君士坦丁堡主教长互相革除教籍，东西教会分立。
body: |-
  《历史的轨迹》第十二章说，一千年来教会一直是一个整体，到 1054 年分裂为希腊东方教会与拉丁西方教会。东方用希腊文，西方用拉丁文；罗马帝国在行政上分成两半以后，两地各方面越走越远；罗马教皇要君士坦丁堡的主教长服在他的权下，情形更加严重。

  两方在教义和习惯上的分歧积累已久：西方在信经里加了圣灵“和子”而出的字样，圣餐用无酵饼，要求教士独身；东方都不接受。九世纪教皇尼古拉一世与主教长佛提乌已经互相罢免过一次。

  十一世纪中叶，诺曼人侵入意大利南部，那里的希腊礼教会被迫改从拉丁礼。君士坦丁堡的主教长瑟如拉留一方写信指责拉丁人的做法。1054 年春，教皇利奥九世的使团到了君士坦丁堡，为首的是枢机洪贝尔。皇帝希望与教皇联手对付诺曼人，待使团很客气；瑟如拉留不承认他们的身份，拒绝会见。7 月 16 日星期六，使节们在礼拜开始前走进圣索菲亚教堂，把一份革除瑟如拉留及其同党教籍的文书放在祭坛上，随即离城。文书列举的罪状里有不少与事实不符，例如说希腊人从信经里删去了“和子”。几天后瑟如拉留召开会议，咒诅了这份文书和它的作者。

  《历史的轨迹》第十四章说，文书是利奥九世的代表奉教皇的诏谕放上去的，瑟如拉留反过来革除了利奥九世的教籍。利奥九世已在当年 4 月去世，君士坦丁堡的处分只针对几位使节。双方都没有把对方的整个教会逐出，当时的人也不认为这就是最后的决裂；1204 年十字军洗劫君士坦丁堡之后，裂痕才无法弥合。1274 年和 1439 年两次会议宣布过合一，都没有被东方教会接受。1965 年罗马与君士坦丁堡共同宣布撤销 1054 年的处分。

  第十章指出这件事对教皇权势的意义：此后君士坦丁堡的主教长不再是罗马主教的对手，教皇成为西方教会唯一的首脑。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十二章“教会分裂” https://wellsofgrace.com/books/spiritual/2000years/html/chapter14.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十四章“教会为自由奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter16.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十章“教皇权势的发展” https://wellsofgrace.com/books/spiritual/2000years/html/chapter12.html"
recalled:
  - 1054 年洪贝尔的绝罚文书
  - 1054 年 7 月君士坦丁堡会议的决议
  - 洪贝尔《使团纪略》
  - 1965 年 12 月 7 日罗马与君士坦丁堡的共同宣言
