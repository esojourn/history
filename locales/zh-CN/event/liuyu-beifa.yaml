name: 刘裕北伐
summary: 刘裕两次北伐，先灭南燕收复青州，再灭后秦收复洛阳、长安，关中不久得而复失。
body: |-
  刘裕掌握东晋朝政后，需要用更大的功业来确立自己的地位。他的第一个目标是南燕。后燕被北魏击破后，慕容垂的弟弟慕容德南渡黄河，在青州建立南燕，都城在广固。继位的慕容超于义熙五年（公元 409 年）初派兵到淮北掳掠人口。同年四月，刘裕率水军从建康出发。六月在临朐击败燕军主力，包围广固。围城持续到次年二月，城破，慕容超被押送建康斩首，南燕灭亡。

  刘裕还在回师途中，卢循已从广州北上，逼近建康。他赶回布防，用了一年多时间平定卢循，此后又先后消灭了刘毅、诸葛长民、司马休之等内部的对手。

  义熙十二年（416 年）二月，后秦君主姚兴去世，诸子相争，北面又受夏国攻击。八月，刘裕出师北伐，分兵数路：王镇恶、檀道济率步兵从淮河、淝水向许昌、洛阳进发，沈林子等率水军从汴水入黄河，他自己率主力由彭城沿泗水、黄河西上。十月，前锋攻克洛阳。

  次年春，刘裕率水军溯黄河而上。北魏担心晋军北渡，派数千骑兵沿北岸跟随，晋军的船被风吹到北岸就遭到截杀。据《宋书》，刘裕派人带着一百辆战车在北岸靠河列成弧形的阵势，两头抵住河岸，以强弩和长矛迎击来攻的魏军骑兵，大破之，此后魏军不再逼近。八月，王镇恶率水军从黄河转入渭水，乘小型的蒙冲战船直抵长安城北的渭桥，弃船登岸，一战击溃后秦军。后秦主姚泓出降，被送到建康处死。

  刘裕在长安停留了两个多月。十一月，留在建康总管后方的刘穆之病死，他担心朝中有变，留下十二岁的儿子刘义真和王镇恶、沈田子、王修等人镇守关中，自己率军东归。他走后不久，诸将互相猜忌，沈田子杀王镇恶，王修杀沈田子，刘义真又杀王修。义熙十四年（418 年）夏主赫连勃勃乘机南下，晋军在撤退途中大败，关中失守。

  北伐的成果是把东晋的北界从淮河推到了黄河，青州、兖州、司州和洛阳在此后二三十年间属于南方。
sources: []
recalled:
  - 《宋书·武帝纪》
  - 《晋书·姚泓载记》
  - 《晋书·慕容超载记》
  - 《资治通鉴》卷一百一十五至一百一十八
