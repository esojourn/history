name: 埃德萨战役
summary: 公元 260 年沙普尔一世在埃德萨一带击败罗马军，生俘皇帝瓦勒良。
body: |-
  公元 253 年前后，波斯王沙普尔一世攻入叙利亚，洗劫了安条克。同年即位的罗马皇帝瓦勒良把西部交给儿子伽利埃努斯，自己到东方坐镇，一住就是六七年。256 年前后，幼发拉底河边的要塞杜拉-欧罗普斯被波斯人攻破，城墙下的坑道和遗弃的兵器在二十世纪被发掘出来。

  260 年沙普尔再次进兵，围攻卡莱和埃德萨。瓦勒良率军前去解围。关于此后发生的事，双方的记载对不上。沙普尔在纳克什·鲁斯塔姆的铭文里说：瓦勒良带着从二十多个行省和部族征来的七万人前来，“在卡莱和埃德萨的那一边”打了一场大仗，“我们亲手擒住了瓦勒良皇帝”，连同禁卫军长官、元老和军官，全都押回波西斯。希腊文和拉丁文的史书则说没有经过决战：佐西莫斯说罗马军中瘟疫流行，瓦勒良只带少数随从去谈判，被对方扣下；十二世纪的佐纳拉斯还记了一说，是他被困在埃德萨，害怕部下哗变，自己逃到波斯人那里去的。事在这年春夏之间，确切日期不详。

  沙普尔随后长驱直入，铭文列举了奇里乞亚和卡帕多西亚被攻下的三十六座城。罗马的残部在一位财务官和一位将领手下重新集结，帕尔米拉的奥登纳图斯又在波斯人满载而归的路上截击，沙普尔退回本国。

  瓦勒良再没有回来。伽利埃努斯没有设法营救，也没有赎他。基督教作家拉克坦提乌斯说，他被用来给波斯王垫脚上马，死后被剥皮；瓦勒良生前下令逼迫基督徒，这个说法带着报应的意味，不能尽信。波斯方面只说俘虏被安置在波西斯等地做工。在比沙普尔和纳克什·鲁斯塔姆的崖壁上，沙普尔让人刻下了自己骑在马上、罗马皇帝或跪或被他握住手腕的浮雕。

  皇帝被俘使帝国顿时失去重心：东方的军队拥立了那位财务官的两个儿子，高卢另立朝廷，多瑙河一带接连有将领称帝。
sources: []
recalled:
