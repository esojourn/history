name: 玄武门之变
summary: 626 年秦王李世民在玄武门伏兵，杀死太子李建成和齐王李元吉，随后即位。
body: |-
  唐朝建立后，太子李建成留在长安协助高祖处理政务，秦王李世民则在统一战争中屡建大功，秦王府聚集了房玄龄、杜如晦、长孙无忌、尉迟恭等大批文武人才。李建成与齐王李元吉联合，与李世民争夺储位，双方在朝中和后宫各自结纳势力，矛盾日益尖锐，高祖犹豫不决。

  武德九年（公元 626 年）突厥入侵，李建成推荐李元吉领兵出征，并要调用秦王府的精兵猛将。据唐代史书，秦王府的人认为这是要削弱秦王，劝李世民先发制人。六月初三，李世民向高祖密奏李建成、李元吉与后宫妃嫔有私，高祖决定次日召三人入宫对质。

  六月初四清晨，李世民率长孙无忌、尉迟恭等人埋伏在宫城北门玄武门内，据后人根据常何墓碑等资料考证，守门将领常何此前已倾向李世民。李建成、李元吉入宫行至临湖殿，察觉有变，掉转马头要回去，李世民亲手射死李建成，尉迟恭射杀李元吉。东宫和齐王府的兵马赶来攻打玄武门，双方激战，尉迟恭把两人的首级出示给他们看，众人才溃散。当时高祖正在宫中的海池泛舟，尉迟恭披甲持矛前来，报告太子和齐王作乱已被秦王诛杀。高祖随即下手令，命各军都听秦王处置。

  事后，李建成和李元吉的儿子都被杀。六月初七，高祖立李世民为太子，把军国大事都交给他处理；八月，高祖让位，李世民即位，即唐太宗，次年改元贞观。

  关于这次事变的经过，现存记载主要出自太宗朝修订的国史和实录。据《资治通鉴》，太宗曾亲自要求看本朝的国史，并让史官把玄武门之事写得明白些。后世史家因此认为，有关李建成、李元吉如何陷害李世民的不少记载，可能经过修饰。
sources: []
