name: "浸信会、循道会因奴隶问题南北分裂"
summary: "1844—1845 年美国循道会、浸信会因奴隶制问题分为南北两个宗派。"
body: |-
  《历史的轨迹》第四十五章说，殖民地时代蓄奴很普遍，许多有名的公理派牧师，包括爱德华兹，都有奴隶。1769 年罗得岛新港的霍普金斯牧师已在讲道中强烈攻击奴隶制，贵格派是当时唯一坚定反对奴隶制的教派。殖民地末期风气改变，南北都普遍觉得应当释放奴隶，长老会、循道会、浸信会都表示强烈反对奴隶制。

  书中说，1792 年惠特尼发明轧棉机以后，南方对奴隶制的态度完全改变；到 1830 年，南方领袖深信全国的福利全靠棉花，而种棉离不开黑奴。北方反对奴隶制的人越来越多，南北渐成敌对，终于使一些教会分裂：1845 年 5 月南方浸信会宣教团体决定不再与北方合作；同年南方循道会与北方断绝关系，改称“监理会”；长老会中也发生了同样的事。

  据一般记载，循道会是在 1844 年总会上因一位蓄奴的监督问题决裂，南方各年议会 1845 年在路易斯维尔组成“南方监理循道会”；同年 5 月南方浸信会在佐治亚奥古斯塔成立“美南浸信会”。长老会的南北分裂较晚，在 1857 年和内战爆发的 1861 年。惠特尼发明轧棉机一般作 1793 年。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
