name: 高平之战
summary: 954 年周世宗亲征，在高平大败北汉与契丹联军，战后整顿禁军，后周由此强盛。
body: |-
  显德元年（公元 954 年）正月，后周太祖郭威去世，养子柴荣即位，就是周世宗。北汉主刘崇认为后周新君初立，有机可乘，联合契丹大举南下，进攻潞州。周世宗决定亲征，宰相冯道极力劝阻，说世宗刚刚即位，不宜轻动，世宗不听。

  同年三月，两军在泽州的高平以南相遇。据《资治通鉴》，刘崇见后周的前军人少，认为不必借助契丹之力便可取胜。交战之初，后周右翼的将领樊爱能、何徽率先带兵逃跑，右翼溃散，形势危急。周世宗亲自冒着箭矢督战，禁军将领赵匡胤和张永德各率亲兵冲向敌阵，将士们奋勇拼杀，北汉军的前锋大将张元徽战死，北汉军随之大溃。契丹援军由将领杨衮率领，见北汉兵败，没有参战便撤走了。刘崇仅带百余骑逃回太原。

  战后，周世宗斩杀了临阵脱逃的樊爱能、何徽以及他们部下的将校。据《资治通鉴》，被斩的有七十余人，军中为之震动。他随即进围太原，围攻两个多月，因粮草不继、契丹援军到来而撤回。

  高平之战是周世宗即位后的第一场大战，巩固了他的地位。他借此机会整顿禁军，淘汰老弱，挑选各地的精壮之士充实殿前军，后周的军力由此大振（另见“周世宗改革”条）。赵匡胤在此战中崭露头角，从此受到世宗的重用。
sources: []
recalled:
  - 《旧五代史·周书·世宗纪》
  - 《资治通鉴》卷二百九十一
