name: 南明
summary: 明亡后宗室在南方建立的弘光、隆武、永历等抗清政权，1662 年终结。
body: |-
  崇祯十七年（1644 年）北京失陷后，明朝在南方仍保有半壁江山。同年五月福王朱由崧在南京即位，年号弘光。弘光朝廷由马士英、阮大铖掌权，党争不断，江北四镇的将领互相争斗，史可法督师扬州，难以有效防御。顺治二年（1645 年）清军南下，攻破扬州，渡过长江，南京不战而降，朱由崧被俘，弘光政权覆亡（另见“扬州之役”条）。

  此后，唐王朱聿键在福州即位，年号隆武，依靠郑芝龙的兵力；鲁王朱以海在绍兴称监国。两个政权互不相容。顺治三年（1646 年）清军攻入浙江、福建，郑芝龙降清，朱聿键在汀州被俘遇害。同年底桂王朱由榔在肇庆即位，年号永历，唐王朱聿𨮁在广州称帝，年号绍武，绍武政权很快被清军消灭。

  清朝颁布剃发令后，江南、华南各地的抗清斗争此起彼伏（另见“剃发令”条）。大顺军、大西军的余部先后与南明联合，顺治五年（1648 年）前后清朝的江西、广东守将金声桓、李成栋反正，永历政权一度控制了西南、华南的大部分地区。顺治九年（1652 年）大西军将领李定国连败清军，攻克桂林、击毙尼堪。东南沿海的郑成功也以厦门、金门为基地坚持抗清，顺治十六年（1659 年）一度围攻南京。

  但南明内部始终没有形成统一的领导，朝臣党争、将领争权，大西军孙可望与李定国内讧，抗清力量逐渐被各个击破。顺治十六年（1659 年）清军攻入云南，永历帝逃到缅甸。康熙元年（1662 年）吴三桂把从缅甸押回的永历帝在昆明处死，同年李定国、郑成功相继去世，南明作为一个政权的历史基本结束。此后台湾的郑氏仍奉永历年号，直到康熙二十二年（1683 年）。南明的历史在清代长期被讳言，清末以后才受到重视。
sources: []
recalled:
