name: 北京保卫战
summary: 土木之变后于谦拒绝南迁，拥立景泰帝，率军在北京城下击退也先的瓦剌军。
body: |-
  土木之变后，明军精锐大部覆没，北京城中只剩下不到十万老弱士兵，人心惶惶。翰林院侍讲徐珵以星象为由主张迁都南京，兵部侍郎于谦坚决反对，说京师是天下的根本，一旦迁都大事就去了，并以宋朝南渡为戒。孙太后和监国的郕王朱祁钰接受了于谦的意见。

  于谦升任兵部尚书，负责京城防务。他调集两京、河南的备操军，山东和南京沿海的备倭军，以及江北、北京诸府的运粮军，迅速增强了京城的兵力；又把通州仓库的粮食运进北京，整顿兵器。为了防止也先利用被俘的英宗要挟明朝，大臣们请孙太后同意，在九月拥立朱祁钰即位，尊英宗为太上皇。

  十月，也先挟持英宗攻破紫荆关，进抵北京城下。于谦主张出城迎战，他分派将领带兵在九门外列阵，自己与石亨在德胜门外指挥，下令临阵退缩的将士一律斩首。瓦剌军先进攻德胜门，遭到明军伏击，也先的弟弟孛罗等人战死；又转攻西直门、彰义门，也被击退。前后相持五天，也先得知各地援军即将到来，害怕后路被切断，挟持英宗从良乡向西撤退，明军追击，夺回了被掳掠的一些人畜。

  北京保卫战的胜利使明朝度过了危机。此后也先挟持英宗已无利可图，景泰元年（1450 年）把英宗送回北京。
sources: []
recalled:
  - 《明史·于谦传》
  - 《明史·景帝本纪》
  - 《明英宗实录》
