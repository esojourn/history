name: 诸葛亮北伐
summary: 公元 228 至 234 年诸葛亮五次出兵攻魏，均未成功，病死于五丈原。
body: |-
  平定南中以后，诸葛亮于建兴五年（公元 227 年）率军进驻汉中，临行前向后主上《出师表》，说明“北定中原”“兴复汉室”的志向。此后七年间他先后五次出兵。后世小说称“六出祁山”，实际上经由祁山的只有两次。

  建兴六年（228 年）春是第一次。诸葛亮扬言要从斜谷进攻郿县，派赵云、邓芝在箕谷作疑兵，自己率主力西出祁山。魏的天水、南安、安定三郡起而响应，关中震动。魏明帝亲自到长安坐镇，派张郃西进。诸葛亮让马谡率前锋在街亭阻击。据《三国志·蜀书》各传，马谡违背部署，舍弃水源上山扎营，被张郃截断汲水的道路后击溃。蜀军失去屏障，只得退回汉中。诸葛亮处死马谡，上书自请降职三等。同年冬天他第二次出兵，围攻陈仓二十多天没有攻下，粮尽而退。次年他派陈式夺取了武都、阴平两郡。

  建兴九年（231 年）诸葛亮再出祁山，用“木牛”运粮，与接替曹真主持西线的司马懿对阵。蜀军在交战中占了上风，但后方的李严因雨天运粮不继，假传旨意让他退兵；撤退途中，蜀军在木门射死了追来的张郃。事后李严被废为平民。

  建兴十二年（234 年）春，诸葛亮经过三年准备，率大军出斜谷，进驻渭水南岸的五丈原，并约吴国同时出兵。他吸取以往缺粮的教训，让士兵在当地屯田，作长期打算。司马懿奉魏明帝之命坚守不战。两军相持一百多天，八月诸葛亮病死军中，蜀军撤回。

  北伐没有成功，通常归因于两国的国力相差悬殊，以及翻越秦岭运粮的困难。陈寿在《诸葛亮传》的评语中说他“连年动众，未能成功，盖应变将略，非其所长欤”，后人对这一评价一直有不同意见。
sources: []
