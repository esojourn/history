name: 留美幼童
summary: 1872—1875 年清朝派一百二十名幼童赴美留学，1881 年全部撤回。
body: |-
  容闳从耶鲁大学毕业回国后，一直希望清朝选派青少年到美国学习。同治九年（1870 年）他随曾国藩处理天津教案时再次提出这个建议，得到曾国藩和李鸿章的支持。同治十年（1871 年）曾国藩、李鸿章联名上奏，请求选派幼童出洋学习，获得批准，在上海设立了出洋肄业局，挑选十岁到十六岁的幼童。

  同治十一年（1872 年）第一批三十名幼童从上海出发赴美，到光绪元年（1875 年）共派出四批、一百二十人，以陈兰彬为正监督、容闳为副监督，在美国康涅狄格州的哈特福德设立出洋肄业局。幼童们被分散寄住在美国家庭中，进入当地的中小学，后来有五十多人进入了耶鲁、哥伦比亚、麻省理工等大学。

  幼童们在美国逐渐接受了美国的生活方式，有人剪掉辫子，有人信奉基督教，参加体育运动。继任的监督吴子登等人认为他们“沾染洋习”、忘本，向朝廷报告，加上美国拒绝接收中国学生进入军校，以及美国排华的风潮，光绪七年（1881 年）清朝决定把留学生全部撤回，只有詹天佑、欧阳赓两人完成了大学学业。

  回国后的留学生起初没有受到重用，但后来许多人成为各个领域的骨干，如铁路工程师詹天佑、民国第一任国务总理唐绍仪、清华学校首任校长唐国安等，还有多人在甲午战争和中法战争中牺牲。
sources: []
recalled:
  - 容闳《西学东渐记》
  - 高宗鲁译注《中国留美幼童书信集》
