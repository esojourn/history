name: 龙场悟道
summary: 王守仁在贵州龙场悟出“心即理”，此后形成阳明心学。
body: |-
  明代前期，朝廷以程朱理学为科举考试的标准，学者大多遵循朱熹的学说。朱熹认为“理”存在于万事万物之中，要通过“格物”，即一件件地研究事物，逐渐达到对“理”的认识。王守仁年轻时曾按照这个方法对着庭院中的竹子“格”了七天，没有得到任何领悟，反而病倒了，从此对这条道路产生了怀疑。

  正德元年（1506 年）王守仁上疏营救被宦官刘瑾逮捕的言官，被廷杖后贬到贵州龙场驿当驿丞。龙场在万山丛中，当地居民多是苗族、彝族等少数民族，语言不通，生活条件十分艰苦。正德三年（1508 年）他到达龙场后，在山洞中居住，据他的《年谱》记载，他日夜静坐，思考如果圣人处在这种境地会怎样做，一天夜里忽然大悟，认识到“圣人之道，吾性自足，向之求理于事物者误也”，也就是说，“理”不在外物之中，而在人的心中，这就是“心即理”。

  此后王守仁在龙场和贵阳讲学，提出“知行合一”，认为知和行是一件事的两个方面，真正的知必然表现为行动。晚年他又提出“致良知”，认为人人都有天生的良知，只要去除私欲的遮蔽，就能达到圣人的境界。他的学说被称为“心学”或“阳明学”，与南宋陆九渊的学说并称“陆王心学”。

  阳明学在明代中后期广泛流行，门下分出浙中、江右、泰州等许多派别，泰州学派的王艮、何心隐和受其影响的李贽等人把它推向更加重视个人和日常生活的方向。明末清初的一些学者批评阳明后学空谈心性，认为它是明亡的原因之一。阳明学后来也传到日本和朝鲜，在日本影响尤大。
sources: []
recalled:
  - 钱德洪等编《王阳明年谱》
  - 王守仁《传习录》
  - 黄宗羲《明儒学案》
