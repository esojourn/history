name: 参合陂之战
summary: 北魏拓跋珪追击撤退的后燕军，在参合陂将其全歼，两国强弱之势从此逆转。
body: |-
  北魏立国之初依附后燕，后来后燕索要良马并扣留魏的使者，双方断交，魏转而与后燕的对手西燕往来。太元二十年（公元 395 年）五月，年事已高的慕容垂派太子慕容宝率八万人伐魏，另有一万八千人作为后援。

  拓跋珪带着部落和牲畜西渡黄河，退避千余里。燕军到达五原，收取了当地的粮食，造船准备渡河，魏军隔河对峙。魏人截住了燕军与中山之间往来的信使，让被俘的使者隔河喊话说慕容垂已死。燕军几个月得不到后方的消息，军心动摇，将领之间又有人图谋作乱。十月，慕容宝烧掉船只，乘夜撤退，认为黄河尚未封冻，魏军无法追来，没有派兵断后。

  十一月初，暴风使黄河一夜之间结冰。拓跋珪亲率二万精骑渡河急追，几天后在参合陂以西追上燕军。燕军扎营在陂东的山下水边。魏军连夜登上山头，黎明时居高临下冲击，燕军大乱，争相涉水逃命，人马相压。慕容宝等少数人逃脱，四五万人放下武器投降。据《资治通鉴》，拓跋珪只留下有才干的几个人，其余全部活埋。

  第二年慕容垂亲征，路过战场见尸骨成山，发病而死。北魏随即南下夺取河北。
sources: []
recalled:
  - 《魏书·太祖纪》
  - 《晋书·慕容垂载记》
  - 《资治通鉴》卷一百零八
