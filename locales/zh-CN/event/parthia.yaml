name: 安息立国
summary: 约公元前 247 年阿萨息斯称王，安息纪元以此为始；约前 238 年夺取帕提亚。
body: |-
  公元前 3 世纪中叶，塞琉古王国的重心在叙利亚和小亚细亚，对伊朗东部的控制松弛。据《伊朗百科全书》的概括，约前 250 年至前 235 年的十五年间，塞琉古王国失去了伊朗的大片属地，各事件的先后次序学者仍有争议。帕尔尼人是达赫人的一支，原在阿姆河与锡尔河之间游牧，此时已南下到塞琉古帕提亚行省的边缘。

  约前 250 年，帕尔尼人在首领阿萨息斯率领下进入阿特拉克河上游的阿斯陶埃内；约前 247 年阿萨息斯在阿萨克称王，后来的安息纪元即从这一年起算。这时他还没有占有帕提亚。约前 245 年，帕提亚总督安德拉戈拉斯脱离塞琉古自立，巴克特里亚总督狄奥多图斯随后也自立。约前 238 年帕尔尼人攻入帕提亚，杀死安德拉戈拉斯，不久又取希尔卡尼亚，此后他们被称作帕提亚人。查士丁把帕提亚的脱离放在塞琉古二世兄弟相争之时，所记年份与此不尽一致。

  塞琉古二世和安条克三世先后东征，都没能消灭这个政权；安条克三世约前 209 年攻入帕提亚和希尔卡尼亚后与之订约，保留了它事实上的独立。到米特里达梯一世时，安息夺取米底和两河流域，成为大国。中国史书称它为“安息”，一般认为是王号“阿萨息斯”（阿尔沙克）的音译，最早见于《史记·大宛列传》。
sources:
  - 斯特拉波《地理学》第 11 卷第 9 章第 2—3 节 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Strabo/home.html
  - 伊朗百科全书“Arsacids ii. The Arsacid Dynasty”条 https://www.iranicaonline.org/articles/arsacids-ii/
