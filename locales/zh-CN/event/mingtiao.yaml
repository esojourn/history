name: 鸣条之战
summary: 商汤率军在鸣条打败夏桀，夏朝灭亡、商朝建立；断代工程定在约前 1600 年。
body: |-
  据《史记·殷本纪》和《夏本纪》，夏桀暴虐，诸侯多背叛夏而归附商汤。汤先后征伐葛、韦、顾、昆吾等夏的属国，翦除了夏的羽翼，然后率诸侯伐桀。誓师之辞就是《尚书·汤誓》，汤在誓辞中说，不是我小子敢于作乱，而是夏犯下许多罪行，上天命我去讨伐它。

  据《史记》，汤自把钺讨伐昆吾，接着讨伐桀；桀战败，逃到鸣条，夏军溃散。汤又追击，最后桀被放逐而死，《尚书》书序说汤“放桀于南巢”。汤取得天下后，改正朔，易服色，定都于亳，商朝建立。鸣条的地望有今山西运城夏县和河南封丘等不同说法。

  后人把“汤武革命”并称，认为以有德伐无道是顺乎天而应乎人。夏商周断代工程把夏商之际定在约公元前 1600 年。由于夏代没有文字，这次战争的经过只见于后世文献，细节难以确证。

  商人在祭祀和颂诗中反复追述成汤的功业。《诗经·商颂·长发》说“武王载旆，有虔秉钺，如火烈烈，则莫我敢曷”，这里的“武王”就是指成汤。《竹书纪年》佚文说，从汤灭夏到纣，商朝共二十九王，历时四百九十六年。

  后来周武王把夏的后裔封在杞国，延续夏的祭祀；孔子说“夏礼吾能言之，杞不足征也”（《论语·八佾》）。
sources: []
recalled:
  - 《史记·殷本纪》
  - 《史记·夏本纪》
  - 《尚书·汤誓》
