name: 厄菲阿尔特改革
summary: 公元前 462 年雅典削减战神山议事会的权力，民主政治进一步发展。
body: |-
  战神山议事会由历任执政官卸任后终身充任，是雅典最古老的机构。据《雅典政制》，希波战争以后的十七年里它实际上主导着城邦，名义是“守护法律”，可以监督官员、过问公民的行为。从公元前 487 年起，执政官改由抽签在候选人中产生，这个议事会的成员不再是城邦里最有声望的人，而十将军因为由选举产生并可连任，地位日益重要。

  前 462 年，主张亲斯巴达的客蒙率军远赴伊托墨。厄菲阿尔特乘他不在，在公民大会上提出一系列法案，说战神山议事会的许多权力是后来“添加”的，应当剥夺。它审查和监督官员的权力、审理危害城邦罪的权力，分别转给五百人议事会、公民大会和民众法庭，只留下审理故意杀人、蓄意伤害、纵火以及若干宗教案件的职能。客蒙回来后试图恢复旧制，被陶片放逐。次年厄菲阿尔特遇刺身亡。

  此后十余年里，伯里克利等人继续推进：陪审员开始领取津贴，使穷人也能长时间坐在法庭里；前 457 年执政官的资格放宽到第三等级。国家大事由公民大会表决，日常事务由抽签产生、一年一任的议事会和各种委员会办理，官员卸任都要接受审查，这套制度一直延续到前 4 世纪后期。

  前 458 年埃斯库罗斯上演《报仇神》，剧中雅典娜亲自设立战神山法庭来审判杀母的俄瑞斯忒斯。这出戏是赞成还是委婉地批评刚刚发生的改革，历来有不同的解读。
sources: []
recalled:
  - 《雅典政制》第 23、25—27 章
  - 普鲁塔克《客蒙传》第 15 章；《伯里克利传》第 9 章
  - 亚里士多德《政治学》卷二第 12 章
