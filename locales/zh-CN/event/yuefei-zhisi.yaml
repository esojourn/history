name: 岳飞之死
summary: 1141 年岳飞被诬谋反下狱，年底在大理寺狱中被害，岳云、张宪同时被杀。
body: |-
  绍兴十一年（公元 1141 年）四月，岳飞被解除兵权，改任枢密副使。不久他奉命与张俊一同到楚州视察韩世忠的军队，张俊想借机解散韩家军，岳飞没有附和，为此与张俊、秦桧结怨。随后岳飞被罢去枢密副使，以闲职留居。

  秦桧、张俊指使岳家军的副统制王俊诬告统制张宪，说张宪图谋占据襄阳，迫使朝廷归还岳飞的兵权。张宪被抓到镇江审讯，受到严刑逼供。十月，岳飞和儿子岳云被逮捕，关进临安的大理寺狱。最初主审的御史中丞何铸查不出罪证，据记载岳飞在审讯时撕开衣服，露出背上刺的“尽忠报国”四字，何铸向秦桧说明岳飞无罪，秦桧改派万俟卨主审，罗织罪名。

  韩世忠不平，当面质问秦桧，秦桧说“飞子云与张宪书虽不明，其事体莫须有”，韩世忠说“莫须有”三字何以服天下。十二月二十九日，宋金和议已经订立，朝廷下令将岳飞赐死于狱中，换算成公历已是 1142 年 1 月；岳云、张宪被斩首。据说岳飞在供状上只写了“天日昭昭，天日昭昭”八个字。他的家属被流放岭南，许多为他鸣冤的人受到牵连。

  绍兴三十二年（1162 年）宋孝宗即位后，为岳飞平反昭雪，追复原官，以礼改葬于临安西湖栖霞岭，后谥武穆、追封鄂王。岳飞之死被看作南宋放弃恢复中原的标志，后人在岳飞墓前铸了秦桧等人的跪像。至于主谋究竟是秦桧还是宋高宗本人，历来有不同看法。
sources: []
recalled:
  - 《宋史·岳飞传》
  - 岳珂《金佗稡编》
  - 《建炎以来系年要录》
