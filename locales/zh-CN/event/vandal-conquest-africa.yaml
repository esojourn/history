name: 汪达尔人征服北非
summary: 公元 429 年汪达尔人渡海进入北非，439 年夺取迦太基，西罗马失去粮仓。
body: |-
  北非的几个行省没有受过蛮族入侵，那里出产的粮食和橄榄油供养着罗马城，税收是西部朝廷最大的一项进项。420 年代，镇守北非的将领博尼法斯与拉文纳的朝廷失和，朝廷派兵讨伐，当地的山地部族也乘机起事。

  429 年 5 月，汪达尔王盖萨里克带领汪达尔人和阿兰人从西班牙南端渡过海峡。六世纪的普罗科匹厄斯说，他们是博尼法斯为对付朝廷请来的；同时代的史料没有这个说法，现代学者大多不信。据维塔的维克多，盖萨里克出发前清点人数，连老人、孩子和奴隶在内共八万，他把这些人编为八十队，好让人以为兵力很多；能作战的大概只有一两万。

  他们沿海岸向东走了一年。博尼法斯这时已与朝廷和解，出战失利，退守希坡。430 年 5 月汪达尔人围城，城里的主教奥古斯丁在围城的第三个月病逝。围了十四个月，汪达尔人缺粮撤围，后来城还是丢了。东部派来的援军与博尼法斯合兵再战，又被击败。435 年朝廷订约，承认汪达尔人以同盟者身份住在努米底亚等地。

  439 年 10 月 19 日，盖萨里克撕毁和约，突然进占迦太基。西部第二大城和停在港里的船队落到他手里。第二年他的舰队就去抢了西西里。瓦伦提尼安三世下令修复罗马城墙，并准许百姓持械自卫。东部派出的舰队到了西西里，因匈人进犯又被召回。442 年朝廷订立新约，把迦太基所在的阿非利加行省等最富庶的地方割给汪达尔人，换回几块残破的地区。

  西部朝廷的收入因此锐减，再也养不起一支足以收复失地的军队，罗马城的粮食也要看汪达尔人的脸色。在北非，盖萨里克没收了大地主的田产分给部下，汪达尔人信阿里乌派，尼西亚派的主教被赶出教堂，迦太基主教和许多教士被装上破船驱逐出境，漂到了那不勒斯。这个王国延续到 534 年。
