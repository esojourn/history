name: 流民入蜀与成汉建立
summary: 关中饥民流入蜀地，在李特、李雄父子率领下反抗遣返，攻占成都，建立成汉政权。
body: |-
  晋惠帝元康末年，关中连年大旱，又有氐人齐万年起事，略阳、天水等六郡的百姓数万家南下到汉中，再进入蜀地找粮食。賨人首领李特兄弟在流民中很有威望。朝廷起初允许他们在蜀地就食，永宁元年（公元 301 年）新任益州刺史罗尚奉命限期遣返，并在要道设卡搜刮流民的财物。流民正在帮人收割，请求延期到秋后而不得，于是聚到李特的营中，推他为主。

  李特击败前来袭营的官军，据《晋书·载记》，他与蜀地百姓约法三章，军纪比官军好，蜀人作歌谣说“李特尚可，罗尚杀我”。太安二年（303 年）他攻入成都少城，不久因分散部众就食而被罗尚袭杀。弟弟李流、儿子李雄相继统领部众，同年底李雄攻下成都。

  永兴元年（304 年）李雄称成都王，光熙元年（306 年）称帝，国号大成。这是十六国中与刘渊的汉国同时出现的最早的政权。它据有益州四十余年，后来改国号为汉，史称成汉，永和三年（347 年）为东晋桓温所灭。
sources: []
recalled:
  - 《晋书·李特载记》
  - 《晋书·李雄载记》
  - 《华阳国志》卷八
