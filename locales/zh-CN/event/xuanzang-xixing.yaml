name: 玄奘西行
summary: 玄奘私自出关西行求法，经高昌、西突厥抵达天竺，十七年后带回大批佛典回到长安。
body: |-
  唐初玄奘在各地求学，发现各家对佛经的解释分歧很大，决心到天竺寻求原本。当时唐朝禁止百姓私自出境，他上表请求西行，没有得到批准。贞观三年（公元 629 年，一说元年），他随逃荒的人群离开长安，西至凉州、瓜州，在胡人向导的帮助下偷渡玉门关，独自穿越五烽和莫贺延碛的沙漠，据《大慈恩寺三藏法师传》，途中失手打翻水囊，四夜五日滴水未进，几乎渴死，最后到达伊吾。

  高昌王麹文泰听说后，派人把他迎到高昌，想留他做国师，他绝食拒绝。麹文泰于是与他结为兄弟，为他准备了衣物、马匹、随从和二十多封给沿途各国的书信。他经过龟兹，翻越凌山，到达碎叶城附近，拜见西突厥的统叶护可汗，得到可汗的护送，此后经过飒秣建（今撒马尔罕）、铁门、吐火罗，越过兴都库什山，经梵衍那（今阿富汗巴米扬）、迦毕试、犍陀罗等地，进入天竺。

  他在摩揭陀国的那烂陀寺跟随寺主戒贤学习《瑜伽师地论》等经论，前后约五年，又游历天竺各地，遍访名师和圣迹。贞观十五年（641 年）前后，戒日王在曲女城为他召开大会，据《大慈恩寺三藏法师传》，他立论十八日，无人能驳。此后他启程回国，翻越葱岭，经于阗时上表太宗，得到准许回国。

  贞观十九年（645 年）正月，他回到长安，据同书，带回经论五百二十夹、六百五十七部，以及佛像和舍利。他西行往返历时约十七年，行程数万里，经历一百多个国家和地区。回国后他主持译经近二十年，又口述《大唐西域记》，记载了沿途的山川、物产、风俗和宗教，是研究七世纪中亚和南亚的重要文献，近代考古学者曾据书中的记载找到了那烂陀寺等遗址。这段经历后来逐渐演变为民间故事，到明代成为小说《西游记》的题材。
sources: []
recalled:
  - 慧立、彦悰《大慈恩寺三藏法师传》
  - 玄奘、辩机《大唐西域记》
  - 道宣《续高僧传·玄奘传》
