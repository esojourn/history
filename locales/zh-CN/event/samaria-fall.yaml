name: 撒玛利亚陷落、北国灭亡
summary: 亚述军围困撒玛利亚三年后破城，北国以色列灭亡，居民被掳往亚述。
body: |-
  耶罗波安二世死后，北国以色列政局不稳。按《列王纪下》第 15 章的记载，此后相继作王的六个人里，撒迦利雅、沙龙、比加辖、比加四人都是被人所杀。同时亚述向西扩张：米拿现作王时，亚述王普勒来攻，米拿现给了他一千他连得银子（15:19–20）；比加年间，亚述王提革拉毗列色夺取了基列、加利利和拿弗他利全地，把那里的居民掳到亚述（15:29）。

  末代王何细亚起初服事亚述王撒缦以色，向他进贡，后来差人去见埃及王梭，不再照往年进贡。亚述王把何细亚锁禁在监里，随后上来攻击以色列遍地，围困撒玛利亚三年；何细亚第九年，城被攻取，以色列人被掳到亚述，安置在哈腊、歌散的哈博河边和玛代人的城邑（《列王纪下》17:3–6；18:9–12）。这一年一般定在公元前 722 年或前 721 年。

  究竟是哪一位亚述王攻下了撒玛利亚，史料说法不同。《列王纪下》提到的是撒缦以色（即撒缦以色五世）；巴比伦的编年史也说撒缦以色毁了一座城，一般认为所指就是撒玛利亚。继位的撒珥根二世则在自己的铭文里自称攻取撒玛利亚，掳走二万七千二百九十人。学者有的认为城在撒缦以色末年陷落，撒珥根随后才来处置、迁徙居民，也有其他解释，尚无定论。

  据《列王纪下》17:24–41，亚述王又从巴比伦、古他、亚瓦、哈马和西法瓦音迁人来，住在撒玛利亚的城邑里。因为有狮子咬死人，亚述王派一个被掳的祭司回来住在伯特利，教导他们怎样敬畏耶和华；这些人就又敬畏耶和华，又事奉自己的神。《列王纪下》17:7–23 把北国的灭亡归因于以色列人离弃耶和华、随从外邦的风俗和耶罗波安的罪。北国前后约二百年，此后只剩南国犹大。
sources: []
recalled:
  - 《列王纪下》第 15 章、第 17 章、18:9–12
  - 巴比伦编年史（撒缦以色五世在位年间部分）
  - 亚述王撒珥根二世铭文
