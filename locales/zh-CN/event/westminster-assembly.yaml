name: "威斯敏斯特会议"
summary: "长期国会召集的神学家会议，订立《威斯敏斯特信条》、大小要理问答和《崇拜指南》。"
body: |-
  《历史的轨迹》第三十一章说，内战进行中，国会决定改革教会，1643 年废除主教制，并在威斯敏斯特召开会议，制订信条和教会行政制度。会议于 1643 年 7 月在威斯敏斯特大教堂开幕。该书说，与会者有一百二十一位教牧代表和三十位信徒代表，除少数公理派与圣公宗外，大部分是长老派清教徒；苏格兰人在战争中给过帮助，也分到一些席位，虽无投票权，影响却很大。

  该书称这是英国教会史上划时代的会议。会中制订了《崇拜指南》以取代公祷书，至今仍为长老派和公理派所用；订立了著名的《威斯敏斯特信条》，作者称之为改教时期复原教主义最后一份伟大的信经；又为讲道解经预备了《大要理问答》，为教导儿童预备了《小要理问答》。作者认为这些都是加尔文派或改革宗教义最好的文件。

  该书说，1648 年国会通过接受这些文件，只对信条作了少许修订；苏格兰全国大会也采纳了它（苏格兰是 1647 年）。作者说，加尔文派在英国的改教运动至此大功告成，同一年欧洲大陆的三十年战争也因威斯特伐利亚和约而结束。会议中长老派与公理派（独立派）就教会制度争论不休；第三十二章说，1658 年公理派在萨伏伊宫开会，几乎把这份信条全部放进自己的宣言里，只把教会制度一段改为公理派的原则。

  但第三十一章也说，内战后军队的地位至高无上，大部分军人属独立派，国会虽宣布英国教会采长老制，却无法把全英国纳入长老派；1660 年王政复辟，这些决定都被推翻。这份信条后来在苏格兰、北美和世界各地的长老会中一直沿用。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
