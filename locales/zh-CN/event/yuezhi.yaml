name: 月氏西迁
summary: 月氏被匈奴冒顿、老上两代击败，主体西迁，最终定居妫水（阿姆河）以北。
body: |-
  月氏原在敦煌、祁连之间游牧，《史记·大宛列传》说它早先强盛，轻视匈奴。冒顿为太子时曾在月氏作人质，即位后攻破月氏。汉文帝前元四年（公元前 176 年）冒顿致书汉廷，称右贤王已击败月氏，并平定楼兰、乌孙、呼揭等国。到老上单于时，匈奴杀月氏王，“以其头为饮器”，月氏主体于是远徙，留下的小部分依附南山羌人，称小月氏。

  西迁的路线，《史记》只说“过宛，西击大夏而臣之，遂都妫水北”。《汉书》的《张骞传》《西域传》补充了中间一步：月氏先向西赶走塞王，占据其地，即后来的乌孙国境，一般认为在伊犁河流域；后来乌孙昆莫攻破月氏，月氏再向西迁到大夏之地。

  两次迁徙的年代史无明文，今人说法不一：第一次有系于前 176 年前后的，也有系于前 160 年代的；第二次有约前 161 年和前 130 年代两类说法。可以确定的是，张骞出使到达时（他约在前 126 年归汉），大月氏已在妫水（今阿姆河）以北立庭，臣服大夏。汉武帝派张骞出使，本意是联络月氏共击匈奴。
