name: 郾城之战
summary: 1140 年岳飞在郾城、颍昌击败完颜宗弼，前锋逼近开封，随后被召班师。
body: |-
  绍兴十年（公元 1140 年）金朝撕毁和约南侵，刘锜在顺昌获胜后，岳飞从鄂州出兵北伐，部将先后收复颍昌、陈州、郑州、西京洛阳等地，与河北的义军相互呼应。岳飞亲率轻骑驻在郾城（今河南漯河郾城区），兵力比较分散。

  七月初，完颜宗弼集中精锐骑兵，直扑郾城。岳飞派儿子岳云率骑兵迎战，并命令步兵手持麻扎刀冲入敌阵，不要抬头，只砍马足。据岳珂《金佗稡编》和《宋史·岳飞传》，金军以称为“拐子马”的骑兵冲击，宋军砍断马足后，金军人马相连而倒，大败而走。“拐子马”究竟是什么样的骑兵编组，后世有不同理解。部将杨再兴曾单骑冲入敌阵，想活捉宗弼，未能成功，几天后在小商河遭遇金军战死。

  宗弼又转攻颍昌，岳云、王贵在颍昌城西与金军激战，再次获胜。岳飞的前锋随后进到离开封只有四十五里的朱仙镇（据《宋史》），金军军心动摇，一些将领暗中与岳飞联络。关于“朱仙镇大捷”，记载主要出自岳珂的著述，现代学者多认为有夸大之处。

  这时宋高宗和宰相秦桧决意议和，下诏命令各路宋军撤退。据《宋史·岳飞传》，岳飞一日之内接到十二道金字牌，被迫班师，他感叹十年之力，废于一旦。宋军撤退后，河南各地再次被金军占领，随岳飞南撤的百姓很多。郾城、颍昌的胜利是南宋抗金战争的高峰，次年宋金订立绍兴和议，岳飞被冤杀（另见“绍兴和议”“岳飞之死”条）。
sources: []
recalled:
  - 《宋史·岳飞传》
  - 岳珂《金佗稡编》
  - 《建炎以来系年要录》
