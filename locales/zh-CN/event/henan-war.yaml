name: 收复河南地
summary: 卫青出云中击走匈奴白羊王、楼烦王，夺回黄河河套以南的土地，汉在此设朔方郡。
body: |-
  “河南地”指黄河河套以南的地区。秦始皇时蒙恬曾把匈奴逐出这里，沿黄河筑城设县；秦末中原大乱，戍卒离散，匈奴重新南下占据。这一带水草丰美，离长安最近的地方只有七百里，匈奴的白羊王、楼烦王在此驻牧，是汉初以来都城北面最大的威胁。

  据《史记·卫将军骠骑列传》，元朔二年（公元前 127 年），匈奴攻入上谷、渔阳。武帝没有在东面应战，而是派车骑将军卫青从云中出塞，向西绕到高阙，再折向南直抵陇西，从背后包抄了河南地的匈奴各部。白羊王、楼烦王逃走，汉军俘获数千人、牛羊上百万头，全师而还。卫青因此受封长平侯。

  战后，主父偃建议在当地设郡筑城，就地屯垦，既可省去从内地运粮，又可作为进攻匈奴的基地。公孙弘等大臣认为工程耗费太大而反对，武帝让朱买臣与之辩论，最后采纳了主父偃的意见，设置朔方郡和五原郡，派苏建征发十余万人修筑朔方城，并修复蒙恬当年沿河修建的要塞。同年，朝廷招募十万人迁到朔方。

  为了集中财力经营朔方，朝廷暂时停下了西南夷方向的开拓。匈奴的右贤王不甘失地，此后几年多次进攻朔方，元朔五年被卫青夜袭击溃。河南地从此归汉朝所有，成为后来出击漠北的出发地之一。
sources: []
recalled:
  - 《史记·卫将军骠骑列传》
  - 《史记·匈奴列传》
  - 《史记·平津侯主父列传》
