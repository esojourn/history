name: "《基要信仰》出版"
summary: "1910—1915 年出版的十二册护教文集，基要主义运动由此得名。"
body: |-
  《历史的轨迹》第四十八章说，1910 年出版了一套十二册的小书，题为《基要信仰：真理的见证》，带动了基要主义运动，这是一个有组织的运动，反对现代主义，坚守圣经教导。书中列出的基要信仰有五条：圣经绝对无误、基督由童贞女怀孕降世、基督十架代赎、基督肉身复活、基督肉身再来。这套书销售了二百五十万份，引起教会中基要派与现代派的尖锐争论，震动了循道会、圣公会和门徒教会，在浸信会和长老会中更为严重；书中说这场争论从 1916 年开始，一直延续至今，又说基要派绝大部分接受千禧年前说，所以近代常把基要派和千禧年前派连在一起。

  据一般记载，这套书由洛杉矶的石油商斯图尔特兄弟出资，1910 至 1915 年分十二册陆续出版，免费寄给英语世界的牧师、宣教士、神学生等，总数约三百万册，各家说法不一；作者有英美多位学者和传道人。书中列出的“五要点”一般认为出自 1910 年美国长老会总会的决议，《基要信仰》本身涉及的题目要多得多。“基要派”一词是 1920 年才由浸信会的一位编辑提出的。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十八章“教会努力保守信仰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter53.html"
