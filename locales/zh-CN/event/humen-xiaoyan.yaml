name: 虎门销烟
summary: 1839 年林则徐迫使外商交出鸦片二万余箱，在虎门海滩当众销毁。
body: |-
  十九世纪初，英国商人把印度出产的鸦片大量走私到中国，换取白银，用来购买茶叶等中国商品。鸦片输入的数量逐年增加，吸食的人越来越多，白银大量外流，造成银贵钱贱，百姓负担加重，清朝的财政和军队都受到严重影响。朝廷中有人主张弛禁，也有人主张严禁。道光十八年（1838 年）鸿胪寺卿黄爵滋上疏请求严禁，湖广总督林则徐坚决支持，道光帝任命林则徐为钦差大臣，到广东查禁鸦片。

  道光十九年（1839 年）三月林则徐到达广州，与两广总督邓廷桢、水师提督关天培合作，命令外国鸦片商人限期交出全部鸦片，并具结保证以后不再夹带，否则“货即没官，人即正法”。英国驻华商务监督义律起初拒不配合，林则徐下令停止中外贸易，派兵包围外国商馆，撤出商馆中的中国雇员。义律最后命令英商交出鸦片，并承诺由英国政府赔偿。据记载，林则徐共收缴鸦片二万多箱，约二百三十多万斤。

  同年六月三日起，林则徐在虎门海滩当众销毁鸦片。他命人挖了两个大池，引入海水，把鸦片切碎投入池中，再加入盐和石灰，使鸦片分解，退潮时随海水流入大海，前后用了二十多天才销毁完毕。销烟时允许中外人士观看，一些外国人在报道中记述了这一过程。

  虎门销烟显示了清朝禁烟的决心，但英国政府以此为借口，决定对中国发动战争（另见“鸦片战争”条）。六月三日后来被定为禁烟节，虎门销烟池的遗址至今仍有保存。
sources: []
recalled:
  - 《林则徐集·日记》
  - 《筹办夷务始末·道光朝》
  - 梁廷枏《夷氛闻记》
