name: 五帝之年
summary: 公元 193 年康茂德死后皇位几度易手，禁卫军公开拍卖帝位，塞维鲁最终胜出。
body: |-
  公元 192 年最后一天康茂德被杀，禁卫军长官连夜把老将佩蒂纳克斯推上皇位。佩蒂纳克斯整顿财政、约束军纪，只发了一半许下的赏金。193 年 3 月 28 日，几百名禁卫军士兵闯进宫里把他杀死，在位八十七天。

  卡西乌斯·狄奥当时是元老，他写道，禁卫军随后站在军营的墙上，把帝位卖给出价最高的人。两个买主隔墙竞价，富有的元老狄迪乌斯·尤利安努斯许给每人二万五千塞斯特斯，被迎进了营地。

  各省的军队不认这笔买卖。4 月，多瑙河的军团在卡农图姆拥立潘诺尼亚总督塞普提米乌斯·塞维鲁，叙利亚的军团拥立尼格尔，不列颠总督阿尔比努斯也握有重兵。塞维鲁先许给阿尔比努斯“恺撒”的名号稳住他，自己直取罗马。6 月 1 日元老院下令处死尤利安努斯。塞维鲁入城后解散了旧禁卫军，换上自己的军团士兵，194 年在伊苏斯击败尼格尔，197 年在卢格杜努姆击败阿尔比努斯。
sources: []
recalled:
  - 卡西乌斯·狄奥《罗马史》卷 73—75
  - 赫罗狄安《马可以后的帝国史》卷 2—3
  - 《罗马帝王纪》佩蒂纳克斯、狄迪乌斯·尤利安努斯、塞维鲁各传
