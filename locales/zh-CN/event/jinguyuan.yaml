name: 金谷集会
summary: 石崇在洛阳城外的金谷园宴集宾客，饮酒赋诗并结集作序，是兰亭集会仿效的先例。
body: |-
  元康六年（公元 296 年），征西大将军祭酒王诩要回长安，石崇和众人到洛阳城外为他送行，在石崇位于金谷涧的别墅里聚会多日。石崇在《金谷诗序》里说，那里有清泉茂林、果树竹柏和各种药草，又有水碓、鱼池；众人白天黑夜游宴，轮流登高临水，席间奏乐，各自赋诗抒怀，作不出的罚酒三斗。序中说与会者共三十人，他把各人的官职、姓名、年纪和诗作都记录下来。

  这批诗大多没有流传，石崇的序保存在《世说新语》的注文里，潘岳的《金谷集作诗》收入《文选》。当时依附贾谧的一批文士，如石崇、潘岳、陆机、陆云、左思、刘琨等，号称“二十四友”，金谷园是他们常聚会的地方。

  五十多年后王羲之等人在兰亭聚会，同样是饮酒赋诗、结集作序。《世说新语·企羡》记载，有人把《兰亭集序》比作《金谷诗序》，又把王羲之比作石崇，王羲之听了很高兴。
sources: []
recalled:
  - 石崇《金谷诗序》（《世说新语·品藻》刘孝标注引）
  - 《晋书·石苞传附石崇传》
  - 《世说新语·企羡》
