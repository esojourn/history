name: "英王钦定本圣经"
summary: "1604 年汉普顿宫会议决定新译的英文圣经，1611 年出版，通行三百年。"
body: |-
  《历史的轨迹》第三十二章说，1603 年詹姆士一世继承英国王位，清教徒立刻联名请愿，提出各项要求，于是在国王面前举行了主教们与清教徒之间的会议。这次会议没有通过清教徒的要求，却决定了一件非常重要的事，就是出版一本新译圣经，结果有了 1611 年出版的英王钦定本，直到今天仍为说英语的人通用。这次会议是 1604 年 1 月在汉普顿宫召开的。

  据一般记载，提议新译的是清教徒一方的牛津学者雷诺兹。国王很赞成，因为他不喜欢当时流行的日内瓦圣经的边注，认为其中有反对君权的意思。约五十位学者分成六组，分别在威斯敏斯特、牛津、剑桥工作，以 1568 年的“主教圣经”为底本，参照原文和此前的各种英译本，丁道尔译本的措辞被大量保留。规定不加注释性的边注。

  钦定本出版后起初并不比日内瓦圣经更受欢迎，加上清教徒习用日内瓦本，几十年后才完全取而代之。1769 年牛津的布莱尼又统一了拼写和标点，今天通行的多是这个修订本。后来的英文修订本、标准本都以它为基础修订。它的文字深深影响了英语文学，至今仍有许多教会使用。该书在研讨问题中特别请读者留意译者在导言中如何称呼国王。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
recalled:
  - "钦定本卷首《译者致读者》与致詹姆士王的献辞"
