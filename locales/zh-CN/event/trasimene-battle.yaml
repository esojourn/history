name: 特拉西梅诺湖战役
summary: 汉尼拔在特拉西梅诺湖北岸的浓雾中伏击罗马军队，执政官弗拉米尼乌斯阵亡。
body: |-
  公元前 217 年 6 月，第二次布匿战争中汉尼拔在伊特鲁里亚的特拉西梅诺湖北岸伏击歼灭罗马一支执政官军队。

  前一年冬天汉尼拔在特雷比亚河获胜，波河流域的高卢人纷纷加入他的军队。罗马新任的两名执政官分守两条南下的大路：塞尔维利乌斯在亚得里亚海一侧的阿里米努姆，弗拉米尼乌斯在伊特鲁里亚的阿雷提乌姆。汉尼拔翻过亚平宁山后穿越阿尔诺河泛滥的沼泽，走了四天三夜；据波利比乌斯，他因眼疾得不到医治，瞎了一只眼。出了沼泽，他绕过阿雷提乌姆向南，沿途烧掠，引弗拉米尼乌斯来追。弗拉米尼乌斯没有等同僚会合就拔营跟进。

  湖的北岸有一段路，一边是水，一边是山，入口狭窄。汉尼拔把非洲和西班牙步兵摆在路尽头的山坡明处，轻装兵、高卢人和骑兵藏在沿湖的山坡上。罗马军队清晨没有派人侦察就进了隘路，湖上起了浓雾。等大部分队列进入之后，汉尼拔发出信号，各部同时从山上冲下。罗马人还是行军队形，来不及列阵。战斗持续了约三个小时；李维说战得太激烈，以至于没有人察觉当时发生了一场地震。弗拉米尼乌斯被高卢人杀死。前卫约六千人冲了出去，次日也被迫投降。

  据波利比乌斯，罗马一方约一万五千人战死，被俘的也有一万五千；汉尼拔损失一千五百人，多为高卢人。李维引费边·皮克托的数字，说罗马战死一万五千，逃散一万。汉尼拔把俘虏中的意大利同盟者不要赎金全部放回，说他是来同罗马人打仗、为意大利人争自由的。

  消息传到罗马，据李维，大法官向人民宣布：“我们在一场大战中被打败了。”罗马选出费边·马克西穆斯为独裁官，由他开始实行避战拖延的策略。汉尼拔没有进攻罗马城，转向亚得里亚海岸休整。
sources: []
recalled:
  - 波利比乌斯《历史》卷三第 77—86 章
  - 李维《建城以来史》卷二十二第 1—8 章
