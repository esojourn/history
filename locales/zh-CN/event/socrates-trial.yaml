name: 苏格拉底受审
summary: 公元前 399 年雅典法庭以不敬神和败坏青年的罪名判处苏格拉底死刑。
body: |-
  公元前 399 年春，七十岁的苏格拉底被三名公民控告。出面的是年轻的诗人墨勒托斯，支持他的有安尼托斯和吕孔；安尼托斯是制革作坊主，曾与色拉西布洛斯一同推翻三十僭主，是当时很有影响的民主派人物。据第欧根尼·拉尔修转录的诉状，罪名是：苏格拉底不敬城邦所敬的神，引进新的神灵；又败坏青年。求处死刑。

  前 403 年的和解禁止追究此前的政治行为，所以诉状里没有提政治。但后来的演说家埃斯基涅斯说，雅典人处死苏格拉底是因为他教过克里提亚斯；背叛过城邦的亚西比德也曾是他的同伴。色诺芬记载，控告者说他讥笑用抽签选官员的办法，教人轻视现行的法律。二十四年前阿里斯托芬的《云》给他造成的印象，据柏拉图，也起了作用。

  案件由执政官受理后交民众法庭，陪审员五百人或五百零一人，一天之内审结。控方和辩方各自发言，没有法官的引导，陪审员不经讨论直接投票。柏拉图当时在场，他的《申辩篇》是对苏格拉底辩护的再现，其中有多少是原话无从确定；色诺芬也写了一篇《申辩》，他当时身在亚洲。在柏拉图笔下，苏格拉底没有求情，而是说明自己多年来盘问他人是奉神之命，说只要一息尚存就不会停止探究，未经省察的生活不值得过。

  第一次投票判定有罪。据柏拉图，如果有三十票改投，结果就会相反，照五百人算约为二百八十票对二百二十票。按程序，此类案件由原告和被告各提一种刑罚，陪审员二者择一。苏格拉底先说自己对城邦有功，应当在市政厅享用公餐，后来在柏拉图等朋友的担保下提出罚款三十米那。第二次投票判处死刑；第欧根尼·拉尔修说，这一次赞成死刑的比先前认定有罪的还多出八十票。

  因为每年派往提洛岛的祭船刚刚出发，按规矩船未回城不得处决，他在狱中等了约三十天，每天有朋友来探望。克里同安排好了越狱，他不肯，理由是不能以毁坏法律来回报养育自己的城邦。船回来的次日，他在日落时饮下毒芹汁。弟子们此后分散到麦加拉等地。柏拉图的对话和色诺芬的回忆使这场审判成为西方思想史上被讨论得最多的案件之一。
sources: []
recalled:
