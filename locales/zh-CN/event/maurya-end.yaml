name: 孔雀王朝灭亡
summary: 将军弗沙密多罗杀死末代君主巨车王，孔雀王朝亡，巽伽王朝继起。
body: |-
  阿育王约在公元前 232 年去世后，孔雀王朝的历史记载很少。《往世书》各本所记的继承人彼此不同，佛教、耆那教文献的说法又有出入；其中有铭文可证的只有十车王，他在龙树山石窟留下了施舍题记。一般认为这几十年间王朝的疆域不断缩小，但具体过程缺乏可靠的记载。

  《往世书》说，孔雀王朝共历一百三十七年，末代君主巨车王被自己的将军弗沙密多罗所杀。波那《戒日王传》也记此事：弗沙密多罗以请君主观看全军为名，在检阅时杀死了巨车王。此外没有更早的叙述，事发地点也没有明文，本条按都城华氏城著录。从旃陀罗笈多即位的年代下推，此事约在公元前 185 年，只是约数。

  弗沙密多罗随即自立，开创巽伽王朝。据《往世书》，这个王朝传十王，共一百一十二年。佛教文献《阿育王传》的说法不同，把弗沙密多罗当作孔雀王族的末代后裔，学者一般不取。
