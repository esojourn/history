name: 中法战争
summary: 中法因越南开战，清军取得镇南关大捷，但随即议和让步。
body: |-
  十九世纪后期，法国逐步把越南变为它的殖民地。越南是清朝的藩属国，北部邻近广西、云南。刘永福率领的黑旗军应越南之请在越南北部抗击法军，光绪九年（1883 年）在河内附近的纸桥击毙法军指挥官李威利。同年法国迫使越南签订《顺化条约》，越南成为法国的保护国。清朝派兵进入越南北部，同年底中法军队在越南山西交战，中法战争爆发。

  清军在越南北部屡战失利，光绪十年（1884 年）慈禧太后借机罢免了以奕訢为首的全班军机大臣（“甲申易枢”）。同年五月李鸿章与法国代表签订《中法简明条约》，但不久双方军队在观音桥发生冲突，战事扩大。八月法国舰队在福州马尾突袭福建水师，福建水师几乎全军覆没，福州船政局也遭到炮击，史称“马江海战”。法军还进攻台湾的基隆、淡水，刘铭传率军抵抗，在淡水击退了法军的登陆。

  光绪十一年（1885 年）初，法军攻占谅山，进逼镇南关。两广总督张之洞起用老将冯子材，三月冯子材率军在镇南关大败法军，随后收复谅山。同时刘永福的黑旗军和清军在临洮等地也取得了胜利。镇南关大捷的消息传到巴黎，引起法国茹费理内阁的倒台。

  但是清朝没有乘胜争取更有利的条件，而是由赫德派人在巴黎与法国谈判，于同年六月签订了《中法新约》，承认法国对越南的保护权，开放中越边境的通商，日后中国修铁路时要与法国商办。这一结果被时人称为“法国不胜而胜，中国不败而败”。战后清朝在台湾设立行省，又加强了海军的建设。
sources: []
recalled:
  - 《中法战争》资料丛刊
  - 《清德宗实录》
  - 邵循正《中法越南关系始末》
