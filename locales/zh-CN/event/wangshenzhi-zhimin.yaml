name: 王审知治闽
summary: 王审知统治福建近三十年，保境息民，招纳士人，开港通商，闽地得到开发。
body: |-
  乾宁四年（公元 897 年），王潮去世，弟弟王审知继任福建的统治者，开平三年（909 年）被后梁封为闽王。他一直奉中原王朝为正朔，向后梁、后唐称臣纳贡，不称帝号，避免与邻国开战，使福建在五代的乱世中维持了近三十年的安定。

  王审知在境内轻徭薄赋，劝课农桑。中原的士人为避战乱纷纷南下，他设立招贤院加以招纳，唐末的一些文人如韩偓等都曾在闽中居住。他在福州设立四门学，并在各州县兴办学校，教育当地子弟。

  他还重视海上贸易。据史书，福州附近海中有巨石阻碍航行，他命人开凿，开辟出一个港口，称为甘棠港，招徕海外商船，泉州、福州的对外贸易因此兴盛起来。据《新五代史》，当时有传说说开凿时有雷电相助，这是附会之辞。

  同光三年（925 年）王审知去世。此后他的子孙争夺王位，互相残杀，福建陷入混乱，到 945 年闽国被南唐所灭（另见“南唐灭闽楚”条）。福建在王审知时期的开发，对此后宋代福建经济文化的兴盛有重要影响。
sources: []
recalled:
