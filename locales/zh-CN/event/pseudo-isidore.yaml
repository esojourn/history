name: 伪伊西多尔教令集
aliases:
  - 伪教令集
  - 君士坦丁赠礼
summary: 九世纪中叶出现的托名古代教皇的教令汇编，被用来支持教皇的权势。
body: |-
  《历史的轨迹》第十章说，有些人靠欺诈和伪造加强了教皇的地位，举了两份文件为例。

  第一份是“君士坦丁御赐教产谕”，通称“君士坦丁赠礼”，约在八世纪后半叶出现。文中说君士坦丁皇帝因教皇西尔维斯特的祷告治好了麻风病，于是迁都拜占庭，把罗马城和意大利、西方各省都交给教皇，并命所有教士服从他。

  第二份是九世纪中叶出现的教令集，托名塞维利亚的伊西多尔收集，把从一世纪罗马的革利免到八世纪贵格利二世之间历代教皇的书信和会议的决定汇编在一起，其中早期教皇的书信大半出于伪造，“君士坦丁赠礼”也收在里面。它的编者没有留下姓名，一般认为出自法兰克北部的教士之手，确切的地点不详。按这部书，主教可以直接向教皇上诉，主教和教皇都不受世俗政府管辖。

  该书说，整个中世纪都相信这两份文件是真的。1433 年库萨的尼古拉首先指出教令集是伪作，1440 年瓦拉证明“君士坦丁赠礼”出于伪造；今天天主教和新教的学者都承认这一点。瓦拉用的办法是考察文字：文中的拉丁文和所提到的官职都不是四世纪的东西。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十章“教皇权势的发展” https://wellsofgrace.com/books/spiritual/2000years/html/chapter12.html"
recalled:
  - 库萨的尼古拉《论公教的和谐》卷 3
  - 洛伦佐·瓦拉《论伪托的君士坦丁赠礼》
  - 《马格德堡世纪史》与布隆代尔 1628 年的考辨
