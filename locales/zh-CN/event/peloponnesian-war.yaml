name: 伯罗奔尼撒战争
summary: 公元前 431 年至前 404 年雅典与斯巴达两大同盟的战争，以雅典投降告终。
body: |-
  战争的一方是雅典和它在爱琴海上的盟邦，靠舰队和贡金；另一方是斯巴达领导的伯罗奔尼撒同盟，加上彼奥提亚等，靠重装步兵。修昔底德认为，战争最真实的原因是雅典势力的增长引起了斯巴达的恐惧，使战争不可避免。公开的争端有三起：公元前 433 年雅典与科林斯的殖民地克基拉结盟，并在海战中与科林斯人交手；雅典围攻退出同盟的波提代亚，那是科林斯的殖民地；雅典下令禁止麦加拉人进入帝国的港口和雅典的市场。前 432 年斯巴达及其盟邦表决开战。

  前 431 年春，底比斯人夜袭雅典的盟邦普拉提亚，战争开始。头十年称“阿希达穆斯战争”：斯巴达人几乎每年夏天侵入阿提卡毁坏庄稼，雅典人按伯里克利的方略退入城墙之内，以舰队袭扰伯罗奔尼撒沿岸。前 430 年雅典城内爆发瘟疫，次年伯里克利病死。前 425 年雅典人在皮洛斯俘获一批斯巴达公民，斯巴达人此后不敢再入侵阿提卡；前 424 年伯拉西达北上夺取安菲波利斯，雅典人又在德利翁败于彼奥提亚人。前 421 年双方订立《尼西阿斯和约》。

  和平没有真正实现。前 418 年斯巴达在曼提尼亚击败阿尔戈斯和雅典的联军。前 415 年雅典派大军远征西西里，两年后全军覆没。前 413 年斯巴达人依亚西比德之计在阿提卡的狄凯利亚筑垒常驻，雅典人失去了乡村和银矿，据修昔底德有两万多名奴隶逃亡。此后的战事集中在爱琴海东岸和赫勒斯滂，史称“狄凯利亚战争”或“爱奥尼亚战争”。雅典的盟邦纷纷反叛，波斯出钱为斯巴达建造舰队，换取对小亚细亚希腊城邦的控制。前 411 年雅典一度发生寡头政变。雅典人仍在库济科斯和阿吉纽西赢得海战，并两次拒绝了斯巴达的和议。前 405 年吕山德在羊河俘获雅典的全部舰队，前 404 年春被围困的雅典因饥饿投降。

  战争持续二十七年，波及从西西里到小亚细亚的整个希腊世界。许多城邦内部的民主派和寡头派各引外援、互相屠杀，修昔底德对克基拉内乱的描写是其中最著名的一段。雅典失去了帝国、舰队和长墙。斯巴达的霸权只维持了三十多年。战争前二十年的主要史料是修昔底德的著作，其后靠色诺芬的《希腊史》和狄奥多罗斯。
sources: []
