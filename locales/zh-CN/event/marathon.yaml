name: 马拉松战役
summary: 公元前 490 年雅典军队在马拉松平原击败渡海而来的波斯军。
body: |-
  公元前 490 年夏，大流士派达提斯和阿尔塔斐尔涅斯率舰队横渡爱琴海，任务是惩罚曾援助爱奥尼亚起义的雅典和厄瑞特里亚。船队沿途降服了各岛，围攻厄瑞特里亚六天，城被内应出卖，居民被掳走。随后波斯人在阿提卡东北岸的马拉松登陆，带路的是二十年前被逐的雅典僭主希庇亚斯，这里的平原适合骑兵活动。

  雅典人出兵马拉松，同时派长跑信使菲利庇得斯去斯巴达求援，据希罗多德，他第二天就到了，路程约两百四十公里。斯巴达人答应出兵，但说按习俗要等月圆才能出发。前来助战的只有普拉提亚人。希罗多德没有给出希腊一方的兵力，后来的作家说雅典人约九千或一万，普拉提亚人一千。波斯的兵力没有可靠的数字。

  两军对峙了几天。十位将军意见不一，米太亚德说服军事执政官卡利马科斯主战。交战那天，雅典人把阵线拉得与波斯人一样长，中央单薄，两翼厚实，据希罗多德是跑步冲过了八个跑道长度（约一千五百米）的距离；全程奔跑是否可能，后人有怀疑。中央被波斯人和塞种人突破，两翼得胜后不去追击，转身夹击中央。波斯人逃向海边，雅典人追到船边，夺得七艘。希罗多德说波斯人阵亡约六千四百，雅典人一百九十二，卡利马科斯在其中。波斯骑兵在这场战斗里起了什么作用，希罗多德没有交代。

  波斯舰队随即绕过苏尼翁海角，想赶在守军回来之前直取雅典。雅典人急行军赶回，在城外扎营，波斯舰队在外海停了一阵便返航了。斯巴达的两千人在月圆后赶到，只看到了战场上的尸体。雅典阵亡者合葬于战场，那座土丘今天还在。

  信使从马拉松跑回雅典报捷、说完“我们胜利了”就倒地而死的故事，不见于希罗多德，最早出现在六百年后普鲁塔克和琉善的笔下。1896 年第一届现代奥运会根据这个故事设立了马拉松赛跑。
sources: []
recalled:
  - 希罗多德《历史》卷六第 94—120 章
  - 奈波斯《米太亚德传》第 4—5 章
  - 普鲁塔克《论雅典人的荣誉》347c；琉善《论问候时的失言》第 3 节
