name: 戴克里先大逼迫
aliases:
  - 大逼迫
summary: 公元 303 年起戴克里先和伽列里乌斯在全帝国拆毁教堂、焚烧圣经，是最后也是最大的一次逼迫。
body: |-
  公元 303 年 2 月 23 日，尼科米底亚皇宫对面的教堂被军队拆毁。第二天，戴克里先公布了第一道诏令：各地教堂一律拆毁，圣经和礼拜用书上缴焚烧，基督徒不得聚会，有官职和身份的革去身份。此前教会已经有四十年左右没有受到官方逼迫，宫廷和军队里都有基督徒。拉克坦提乌斯当时在尼科米底亚教书，他说这件事主要出于副手伽列里乌斯的怂恿。

  这年稍后又有两道诏令：逮捕各地的神职人员；被捕者献祭就可以获释，不献的用刑逼迫。304 年的第四道诏令要求所有人献祭。执行的宽严各地相差很大。西部君士坦提乌斯管辖的高卢和不列颠只拆了一些教堂；意大利和北非在 305 至 306 年以后基本停了下来。东部最为严厉，时间也最长，优西比乌在《巴勒斯坦殉道者》里记下了他亲眼所见的情形。《历史的轨迹》第二章说，这一次无论殉道人数还是刑罚的残酷都超过以往，因为它是有计划的、全面的行动。

  《历史的轨迹》在这里讲到罗马城外的地下墓窟。这些墓窟是基督徒埋葬死者的地方，其中有许多殉道者的坟墓；说信徒大批躲在里面避难，现代的研究者多不以为然。

  逼迫中交出圣经的神职人员被称为“交出者”。他们日后所行的洗礼和按立算不算数，在北非引出了多纳徒派的分裂。

  公元 305 年戴克里先退位，伽列里乌斯和他的副手马克西米努继续在东部逼迫。311 年 4 月，病重的伽列里乌斯下诏宽容。马克西米努在自己的辖区又重新逼迫了一阵，到 313 年他败亡才完全停止。
sources:
