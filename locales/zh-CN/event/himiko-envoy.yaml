name: 倭女王卑弥呼遣使
summary: 魏明帝景初年间，倭国女王卑弥呼遣使到雒阳朝贡，受封“亲魏倭王”。
body: |-
  《三国志·魏书·乌丸鲜卑东夷传》中有一篇关于倭人的记载，约两千字，是现存最早详细描述日本列岛的文献。其中说，倭地原有一百多个小国，经过多年战乱，共同拥立一位名叫卑弥呼的女子为王。她住在邪马台国，“事鬼道，能惑众”，年纪已长而没有丈夫，由弟弟协助治理国家，自为王以后很少有人见到她。

  该传记载，景初二年六月，卑弥呼派大夫难升米等人到带方郡，请求去京城朝见天子；同年十二月魏帝下诏，封她为“亲魏倭王”，授予金印紫绶，并赐给锦缎、铜镜一百枚等物品。景初二年是公元 238 年。不过《梁书》和《日本书纪》所引的文字都作“景初三年”，而且景初二年六月魏军还在辽东与公孙渊作战，道路未通，所以许多学者认为今本“二年”是“三年”之误，即公元 239 年。正始元年（240 年），带方太守派人把诏书和印绶送到倭国。

  此后双方又有几次往来。传中说，正始八年（247 年）前后卑弥呼与南面的狗奴国交战，向带方郡报告；她死后建起大墓，殉葬的奴婢有一百多人。继立的男王不能服众，国中再度内乱，最后立了卑弥呼同族的一位十三岁少女为王，局势才安定下来。

  邪马台国究竟在哪里，日本学界有九州说和畿内（奈良一带）说，争论了数百年，至今没有定论。卑弥呼这个名字不见于日本自己的古史《古事记》和《日本书纪》。
sources: []
recalled:
  - 《三国志·魏书·乌丸鲜卑东夷传》（倭人）
