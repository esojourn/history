name: 河西之战
summary: 霍去病一年之内两次攻入河西走廊，匈奴浑邪王率部降汉，汉朝取得通往西域的道路。
body: |-
  河西走廊夹在祁连山与北面的沙漠之间，原是月氏的故地，月氏西迁后由匈奴的浑邪王、休屠王驻牧。匈奴经由这里与南面的羌人往来，并控制着西域各国。

  据《史记·卫将军骠骑列传》，元狩二年（公元前 121 年）春，二十岁的骠骑将军霍去病率一万骑兵出陇西，六天之内转战匈奴五个部落，越过焉支山一千余里，斩获八千余人，缴获了休屠王用来祭天的金人。同年夏天，他与公孙敖分道出北地；公孙敖迷路未到，霍去病独自深入两千余里，渡过居延水，到达祁连山，斩获三万余人，俘获匈奴的王和王母、阏氏、王子、将相等多人。

  连续两次大败使伊稚斜单于十分恼怒，要召浑邪王、休屠王问罪。两人商议降汉，派人到边境联络。武帝担心有诈，命霍去病率军前去迎接。这时休屠王反悔，被浑邪王杀死。两军相望时，浑邪王的部下有许多人不愿投降而逃走，霍去病驰入匈奴营中与浑邪王相见，斩杀了八千名想逃的人，先把浑邪王送往长安，再带领降众渡过黄河。《史记》说降者四万余人，号称十万。休屠王的太子被没入官府养马，就是后来的金日磾。

  匈奴人退出河西后，陇西、北地、上郡的边患大为减轻，朝廷把这三郡的戍卒裁减了一半。汉朝先后在河西设置酒泉、武威、张掖、敦煌四郡，各郡设立的具体年份史书记载不一；又修筑边塞，迁入内地的百姓屯垦。从此匈奴与羌人的联系被隔断，汉朝的使者和军队可以直接进入西域。后世流传一首据说是匈奴人唱的歌，说失去祁连山使牲畜不能繁殖，失去焉支山使妇女没有颜色。
sources: []
recalled:
  - 《史记·卫将军骠骑列传》
  - 《史记·匈奴列传》
  - 《汉书·霍光金日磾传》
