name: 西蜀与南唐画院
summary: 后蜀、南唐宫廷设待诏供养画家，形成最早的宫廷画院，为宋代画院先声。
body: |-
  五代时期，中原战乱频繁，西蜀（前蜀、后蜀）和南唐相对安定，经济富庶，宫廷对绘画十分重视，各地的画家纷纷到这两地避乱谋生。两国的宫廷都设置了翰林待诏、祗候等职位，供养画家专门为宫廷作画，后人把这种机构称为“画院”。

  后蜀的宫廷画家以黄筌父子最为有名，黄筌任翰林待诏，主持宫中的绘画事务。据黄休复《益州名画录》，前后蜀的宫廷和成都的寺院中都留下了大量壁画。一般认为后蜀在孟昶时正式设立了翰林图画院，具体年份有不同说法。

  南唐中主、后主都爱好绘画，宫中有顾闳中、周文矩、王齐翰、卫贤等画院画家，董源也在宫中任职。著名的《韩熙载夜宴图》据记载就是顾闳中奉后主之命所画（另见“顾闳中”条）。

  乾德三年（965 年）后蜀灭亡，黄筌父子等画家来到开封；开宝八年（975 年）南唐灭亡，南唐的画家也纷纷入宋。北宋初年设立了翰林图画院，西蜀和南唐的画家成为其中的骨干，黄筌父子的画风更成为宋初宫廷花鸟画的标准。
sources: []
recalled:
  - 黄休复《益州名画录》
  - 郭若虚《图画见闻志》
  - 《宣和画谱》
