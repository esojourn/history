name: 嘉靖抗倭
summary: 嘉靖年间东南沿海倭患严重，明朝经过十多年才基本平定。
body: |-
  “倭寇”指侵扰中国、朝鲜沿海的海盗。明初就有日本的海盗侵扰沿海，明朝在沿海设置卫所防御，同时实行海禁，禁止民间出海贸易。到嘉靖年间，东南沿海的走私贸易十分兴盛，嘉靖二十六年（1547 年）浙江巡抚朱纨严厉执行海禁，次年捣毁了走私据点双屿，但他随后受到弹劾，自杀身亡。此后海禁更加严厉，以汪直为首的海商集团与日本的浪人、海盗结合，从嘉靖三十一年（1552 年）起大规模侵扰浙江、南直隶、福建、广东沿海。据明人的记载，这一时期的倭寇中，真正的日本人只占少数，多数是中国沿海的居民。

  倭寇攻掠城镇，杀伤居民，甚至一度深入南京城外。明朝卫所军腐败，屡战屡败。嘉靖三十四年（1555 年）张经、俞大猷等人在王江泾大败倭寇，但张经随即被诬陷处死。嘉靖三十五年（1556 年）起胡宗宪总督东南军务，剿抚并用，招降、击败了徐海等部，又诱捕了汪直。

  嘉靖三十四年（1555 年）戚继光到浙江，在义乌招募矿工和农民，编练成“戚家军”。嘉靖四十年（1561 年）倭寇大举侵犯台州，戚继光九战九捷，浙江倭患基本平定。此后倭寇转向福建，戚继光、俞大猷、刘显等人入闽作战，嘉靖四十二年（1563 年）收复兴化府城，次年在仙游再次大败倭寇。福建平定后，俞大猷又到广东平定了吴平等海盗。到嘉靖末年，东南沿海的大规模倭患基本平息。

  倭患的平定，一方面靠戚继光等人的军事胜利，另一方面也与海禁政策的调整有关。隆庆元年（1567 年）明朝开放福建月港，准许商民出海贸易（另见“隆庆开关”条），此后沿海的走私和劫掠大为减少。
sources: []
