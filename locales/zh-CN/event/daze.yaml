name: 大泽乡起义
summary: 秦二世元年七月，陈胜、吴广率九百戍卒在大泽乡起事，建立“张楚”。
body: |-
  据《史记·陈涉世家》，秦二世元年（公元前 209 年）七月，朝廷征发闾左贫民九百人去戍守渔阳，途中驻在大泽乡，陈胜、吴广是队中的屯长。遇上大雨，道路不通，估计已经赶不上期限，而“失期，法皆斩”。两人商议，认为逃亡是死，起事也是死，不如为国事而死；又考虑到百姓同情公子扶苏和楚将项燕，决定借两人的名义号召。

  他们先在帛上写“陈胜王”塞进鱼腹，又夜里在丛祠中燃火学狐鸣，喊“大楚兴，陈胜王”，在戍卒中造成声势。随后吴广故意激怒带队的尉，两人趁势杀死两名尉，召集众人说：“王侯将相宁有种乎！”众人袒露右臂为号，称“大楚”，陈胜自立为将军，吴广为都尉。

  起事队伍先攻下大泽乡和蕲县，接连攻克数县，到陈县时已有车六七百乘、骑千余、卒数万人。攻入陈县后，陈胜自立为王，号“张楚”，各郡县百姓纷纷杀秦吏响应。陈胜分遣诸将攻取各地，但周文一军在关中被章邯击败，诸将多自立，他本人于当年腊月被车夫庄贾杀害，为王共六个月。项梁、刘邦等人都在这期间起兵，秦最终亡于继起的各路军队。
sources:
  - 《史记·陈涉世家》 https://zh.wikisource.org/wiki/史記/卷048
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
