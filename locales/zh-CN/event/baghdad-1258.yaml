name: 巴格达陷落
summary: 1258 年旭烈兀率蒙古军攻陷巴格达，处死哈里发，延续五百年的阿拔斯王朝灭亡。
body: |-
  1253 年蒙哥派弟弟旭烈兀率军西征，目标是波斯西北部的木剌夷（伊斯玛仪派，西方称“阿萨辛派”）和巴格达的阿拔斯哈里发政权。阿拔斯王朝建立于 750 年，鼎盛时统治从北非到中亚的广大地区，到十三世纪时实际控制的地方只剩下伊拉克一带，但哈里发在伊斯兰世界仍有崇高的宗教地位。

  1256 年旭烈兀攻破木剌夷的阿剌模忒等山堡，迫使其首领投降。随后他要求哈里发穆斯台绥木前来归顺，哈里发拒绝。1257 年底蒙古军分路向巴格达进军，击败哈里发的军队，1258 年一月包围巴格达，用投石机等器械猛攻。二月，哈里发出城投降，蒙古军入城后进行了大规模的屠杀和劫掠，持续了多日，据当时的穆斯林史家记载死者极多，具体数字说法不一。哈里发本人随后被处死，据记载是被裹在毡子里践踏而死，因为蒙古人认为不应让王族的血洒在地上。城中的清真寺、宫殿和图书馆遭到破坏，大量书籍被毁。

  巴格达陷落标志着延续五百多年的阿拔斯王朝灭亡（本站“两河与波斯”泳道上的“阿拉伯帝国”一段到这一年为止）。此后旭烈兀以波斯为中心建立伊利汗国。1260 年蒙古军继续西进叙利亚，在艾因·贾鲁特被埃及马木留克王朝击败，西进的势头从此停止。阿拔斯家族的后人后来在开罗被马木留克王朝奉为名义上的哈里发。
sources: []
recalled:
  - 拉施特《史集》
  - 志费尼《世界征服者史》
  - 伊本·阿西尔等阿拉伯史家的记载
