name: "南特敕令"
summary: "1598 年法王亨利四世颁布敕令，给予胡格诺派有限的信仰自由和平等的公民权。"
body: |-
  亨利四世 1593 年改信天主教，旧日的同道胡格诺派既失望又不安，一度停止纳税，自行集会要求保障。国王先后收服了天主教同盟的各个首领，1598 年春到布列塔尼接受最后一位同盟贵族的投降，4 月在南特签署敕令。

  敕令开头说，为使臣民在分歧之下仍能和平共处，订立这项“永久而不可撤销”的法律。天主教仍是国教，凡弥撒中断的地方一律恢复，胡格诺派照旧要交什一税、守天主教的节日。在这个前提下，敕令规定：任何人不因信仰受查问和逼迫；胡格诺派可以在 1597 年以前已有礼拜的地方、每个司法区指定的两处城郊以及贵族自己的领地上公开礼拜，巴黎城内及周围五里格之内不准；他们可以担任一切官职，进入学校和医院；几处高等法院设立两教法官合组的法庭审理涉及他们的案件；他们可以办学校、开教会会议。附带的特许状另许他们保留约一百五十处有驻军的城镇，为期八年，军饷由国王出。

  《历史的轨迹》第三十章说，亨利虽不再是新教徒，却没有忘记旧日的同道，敕令给予胡格诺派公民权，并准许他们自由举行家庭和公共的礼拜。教皇克莱门特八世说这是世上最可咒诅的东西；巴黎高等法院拖了十个月才登记。它没有承认信仰自由的原则，只是给一个少数派规定了范围明确的特权，但在当时的欧洲，一国之内两种信仰依法并存是罕有的事。

  1610 年亨利四世遇刺。他的儿子路易十三和首相黎塞留不能容忍国中有国，1628 年围困拉罗谢尔十四个月，城里的人饿死大半才投降；该书把拉罗谢尔陷落记在 1629 年，那一年订的是善后的《阿莱斯敕令》，取消胡格诺派的设防城市和政治集会，保留礼拜的权利。

  1685 年路易十四废除《南特敕令》，约二十万胡格诺派逃往荷兰、英格兰、勃兰登堡等地。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
