name: "德意志农民战争"
summary: "1524—1525 年德意志农民起事，路德先劝和后主张镇压，起义被诸侯扑灭。"
body: |-
  十五世纪末以来，德意志西南部的农民多次起事，反对领主加重劳役、收回公用的林地和水面。1524 年夏天黑森林南面又有农民聚众抗交，到 1525 年春蔓延到施瓦本、法兰克尼亚、阿尔萨斯和图林根，参加的有几十万人，还有一些城镇的贫民和矿工。《历史的轨迹》第三十章说，农民多年受贵族和高级教士压迫，以“神的公义”为名起义。

  1525 年 3 月施瓦本的农民在梅明根拟定《十二条款》：堂区自选牧师；什一税用于供养牧师和救济穷人；废除农奴身份，因为基督用血赎了所有的人；归还公地，减轻劳役和地租。末了说，哪一条若与圣经不合，他们愿意撤回。条款印了二十多版。各地的农民军攻占城堡和修道院，有的地方杀了贵族。在图林根的米尔豪森，原先跟过路德的传道人闵采尔宣讲末日将临，要选民用刀剑除灭不敬神的人。

  该书说，路德起先同情农民，认为他们有权抗议，后来狂热分子起来领导，肆行杀戮破坏，他就转而反对，鼓励官府用铁腕镇压。4 月他写《劝和平》，一面责备诸侯和主教的贪暴，一面对农民说，福音讲的是灵魂的自由，不能拿来做造反的理由。5 月他见起事愈演愈烈，写了《反对杀人越货的农民暴徒》，要诸侯像打疯狗一样击杀叛乱的人。

  这篇文章印出来的时候，胜负已定。5 月 15 日黑森伯爵和萨克森公爵的军队在弗兰肯豪森击溃图林根的农民，闵采尔被俘处死。南方各支农民军在随后几个星期里一一被打散。被杀的农民通常估计为七万至十万。

  农奴的负担没有减轻，诸侯的权力更大了。该书把这件事列为改教运动停顿的第一个原因：下层民众从此疏远路德，改教运动局限在中上层；天主教一方则把叛乱归咎于路德的教训。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
recalled:
  - "《十二条款》（1525 年 3 月，梅明根）"
  - "路德《劝和平》《反对杀人越货的农民暴徒》（1525 年）"
  - "闵采尔《对诸侯讲道》（1524 年）及书信"
