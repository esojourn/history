name: 南诏归唐
summary: 794 年南诏王异牟寻与唐使在点苍山会盟，脱离吐蕃，重新归附唐朝。
body: |-
  南诏是唐代在今云南一带建立的政权，唐初受唐朝册封。天宝年间唐朝两次出兵征讨南诏都遭惨败，南诏王阁罗凤转而依附吐蕃。阁罗凤后来立了南诏德化碑，说明自己是不得已才背叛唐朝，这块碑至今还在大理太和村。

  异牟寻继位后，吐蕃对南诏的征调日益繁重，又在南诏的险要处设置营堡，南诏人不堪其苦。清平官郑回劝异牟寻归唐，西川节度使韦皋也多次来信招抚。贞元十年（公元 794 年）正月，韦皋派崔佐时到南诏，与异牟寻在点苍山神祠前会盟，誓文一式数份，分别藏于神祠、投入西洱河、存于南诏祖庙和送交唐朝。随后异牟寻假称应吐蕃的要求出兵，突然袭击吐蕃军，攻下神川铁桥等地。同年唐朝派袁滋持节到南诏，册封异牟寻为南诏王，云南盐津县豆沙关现存的摩崖题记，就是袁滋路过时留下的。

  此后唐朝与南诏联合，韦皋多次出兵大败吐蕃，吐蕃在西南的势力大为削弱。但九世纪中叶以后，南诏与唐朝再度交恶，屡次进攻西川、安南，唐朝为此长期调兵戍守，耗费巨大（另见“庞勋起义”条）。
sources: []
