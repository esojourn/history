name: "九十五条论纲"
summary: "1517 年 10 月 31 日路德公布反对滥售赎罪券的论纲，宗教改革由此开始。"
body: |-
  中世纪的告解礼要求悔罪的人痛悔、向司铎认罪、再做补赎。《历史的轨迹》第二十一章说，后来教会准许人交一笔钱来代替补赎，发给一张凭证，就是赎罪券；依据是基督和历代圣徒有多余的功德，积存为“功德库”，由教皇支配。赎罪券还可以替已死的亲人买，以缩短他们在炼狱里的时间。

  1515 年教皇利奥十世为修建罗马的圣彼得大教堂颁发大赦。美因茨大主教阿尔布雷希特承办德意志中部的发售，所得一半归他偿还为取得职位欠下的债。多明我会修士台彻尔替他宣讲。萨克森选侯不准他入境，维滕贝格的人却过境去买，回来拿着凭证向路德告解，不肯悔改。

  该书说，1517 年 10 月 31 日约当正午，路德把九十五条钉在维滕贝格教堂的门上；那扇门等于大学的布告栏，张贴论题请人辩论是常事，次日万圣节教堂陈列圣物，来的人很多。贴门的事最早见于梅兰希顿在路德死后的记述，路德自己从没有提过，二十世纪以来学者对此有争论。确凿的是他当天写信给阿尔布雷希特，附上了论纲。

  论纲用拉丁文写成。第一条说，主耶稣说“你们应当悔改”，是要信徒一生悔改。以下说教皇只能免除他自己所定的刑罚，无权过问炼狱；说钱币一响灵魂就飞出炼狱的人是在传人的道理；教皇若知道宣讲员的勒索，宁可圣彼得大教堂化为灰烬。该书指出，论纲没有攻击赎罪券本身，攻击的是销售中的弊端，但它动摇了信徒得救全凭司铎的那套办法。

  没有人来应辩。论纲被人拿去翻印，又译成德文。该书说不到两个星期就传遍德意志，四个星期传遍西欧；这出自当时人米科尼乌斯的说法。赎罪券的销路大减。阿尔布雷希特把论纲送到罗马，教皇起初只叫修会约束路德。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十一章“教会开始动摇” https://wellsofgrace.com/books/spiritual/2000years/html/chapter24.html"
