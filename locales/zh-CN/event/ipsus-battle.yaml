name: 伊普苏斯战役
summary: 公元前 301 年联军在伊普苏斯击杀安提柯一世，帝国不再可能统一。
body: |-
  公元前 302 年，安提柯之子德米特里在希腊重建同盟，逼得马其顿的卡山德求和。安提柯要他无条件投降。卡山德转而联络利西马科斯、托勒密和塞琉古，四人再次结盟。利西马科斯带着卡山德拨给的一部分军队渡海进入小亚细亚，躲避决战，拖住安提柯；塞琉古从东方带着战象长途赶来，在卡帕多西亚过冬。安提柯把德米特里从希腊召回。托勒密进入叙利亚南部，听到安提柯获胜的谣传又退了回去，没有参加会战。

  前 301 年春夏，塞琉古与利西马科斯会师，在弗里吉亚的伊普苏斯与安提柯父子相遇。这一年的狄奥多罗斯原书残缺，会战经过主要见于普鲁塔克的《德米特里传》。据他说，安提柯有步兵七万余、骑兵一万、战象七十五头；联军有步兵六万四千、骑兵一万零五百、战象四百头、战车一百二十辆。狄奥多罗斯在别处说塞琉古带来的战象有四百八十头。

  德米特里率安提柯一方最好的骑兵，击溃了塞琉古之子安条克统领的骑兵，并且穷追不舍。塞琉古趁机把象队调到他的归路上，战马不敢靠近大象，德米特里无法回到战场。安提柯的步兵方阵失去了骑兵掩护，被联军的骑射手和骑兵围着袭扰而不正面交战，一部分人倒戈，其余溃散。八十一岁的安提柯直到最后还说德米特里会回来救他，他身中多支标枪而死。德米特里收集了几千残兵逃往以弗所，年轻的皮洛士当时在他麾下。

  战后胜利者瓜分了安提柯的领土：利西马科斯得到托罗斯山以北的小亚细亚，塞琉古得到叙利亚和小亚细亚东部，卡山德保有马其顿和希腊，他的弟弟得到奇里乞亚。托勒密未参战，却已占了叙利亚南部，塞琉古说看在旧谊上暂不计较，但不放弃权利，后来两个王朝为此打了六次“叙利亚战争”。

  安提柯是最后一个有意也有力量把亚历山大的帝国重新合为一体的人。此后各王国之间仍然争战，谁也不再能吞并其余各家。《但以理书》第 8 章、第 11 章说那位大能的王死后，他的国向四方分开，注释者历来以这次瓜分来解释。
sources: []
recalled:
  - 普鲁塔克《德米特里传》第 28—30 章
  - 狄奥多罗斯《历史丛书》卷二十第 106—113 章、卷二十一残篇
  - 阿庇安《叙利亚战争》第 55 章
  - 《但以理书》第 8 章第 8、22 节，第 11 章第 4 节
