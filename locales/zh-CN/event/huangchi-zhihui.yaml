name: 黄池之会
summary: 前 482 年夫差北上黄池与晋争长，勾践乘虚袭破吴都。
body: |-
  吴王夫差打败越国、在艾陵大败齐军后，决心北上争霸。他开凿沟通长江与淮河的邗沟，又向北开挖水道，使吴军可以乘船直抵中原。公元前 482 年夏，夫差率精兵北上，在黄池与晋定公、鲁哀公以及周王室的代表单平公会盟。

  会上吴、晋两国争当盟主，为谁先歃血相持不下。这件事各书记载不同：《左传》哀公十三年说最后是晋人先歃；《国语·吴语》说吴王先歃；《史记·吴太伯世家》说吴为长，《史记·晋世家》又说晋为长。

  正当夫差在黄池争霸时，越王勾践乘吴国精锐尽出，率军袭击吴国，打败留守的吴军，俘获吴太子友，攻入吴都。消息传来，夫差怕诸侯知道，杀了报信的人，匆匆结束会盟回国，派人以厚礼向越国求和。黄池之会是吴国国势由盛转衰的转折点。

  据《国语·吴语》，夫差得到越军入侵的消息后，为了在会盟中压倒晋国，连夜把三万精兵排成方阵，中军白衣白旗，左军红衣红旗，右军黑衣黑旗，“望之如荼”“望之如火”“望之如墨”，晋人大惊，答应让吴先歃。成语“如火如荼”即出于此。黄池之会以后，吴国在越国的进攻下节节败退，九年后灭亡。

  黄池在今河南封丘县西南，这次会盟可以说是吴国国势的顶点。
sources: []
recalled:
  - 《左传》哀公十三年
  - 《国语·吴语》
  - 《史记·吴太伯世家》
