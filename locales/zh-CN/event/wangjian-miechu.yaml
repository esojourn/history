name: 王翦灭楚
summary: 前 224 年王翦率六十万大军伐楚，次年攻破寿春，楚国灭亡。
body: |-
  楚国是东方六国中疆域最大的国家。秦国灭韩、破赵、攻燕之后，开始谋划灭楚。据《史记·白起王翦列传》，秦王问李信攻楚需要多少兵力，李信说二十万人；问王翦，王翦说非六十万人不可。秦王认为王翦老而怯，于公元前 225 年派李信、蒙恬率二十万人伐楚。李信起初攻下平舆，蒙恬攻下寝，又在鄢郢一带击破楚军，但随后被楚将项燕率军尾随追击三天三夜，大败而回。

  秦王亲自到频阳向王翦道歉，请他出征，答应给他六十万人。公元前 224 年，王翦率大军攻楚。他到达前线后坚壁不出，任楚军挑战也不应战，每天让士兵休息洗浴，改善饮食，自己与士卒同食。过了一段时间，他派人去问军中在玩什么游戏，回报说在比赛投石、跳远，王翦说“士卒可用矣”。楚军求战不得，引兵东撤，王翦率军追击，在蕲南大破楚军，杀了项燕（《史记·秦始皇本纪》说项燕在次年自杀，记载不一）。

  公元前 223 年，王翦、蒙武攻入楚都寿春，俘虏楚王负刍，楚国灭亡。王翦随后南下平定江南，降服越君，设置会稽郡。项燕是项梁的父亲、项羽的祖父，后来陈胜起事时还假托项燕的名义号召楚人；楚地流传“楚虽三户，亡秦必楚”的话，十几年后果然由楚人推翻了秦朝。灭楚之后，秦国又在公元前 222 年灭燕、代，公元前 221 年灭齐，完成统一。
sources: []
recalled:
  - 《史记·白起王翦列传》
  - 《史记·秦始皇本纪》
  - 《史记·楚世家》
  - 《史记·项羽本纪》
