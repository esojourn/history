name: 《花间集》编成
summary: 940 年后蜀赵崇祚编成《花间集》，收十八家五百首词，是最早的文人词总集。
body: |-
  词是隋唐时期兴起的一种配合音乐歌唱的诗体，原来多在民间和酒宴上流传，唐代中后期逐渐有文人参与创作。五代时，偏安一方的西蜀和南唐社会相对安定，宫廷和贵族的宴乐之风盛行，词的创作十分兴盛。

  后蜀广政三年（公元 940 年），卫尉少卿赵崇祚把晚唐五代十八位词人的作品编成一部词集，共十卷五百首，取名《花间集》，由欧阳炯作序。集中以温庭筠的作品为首，收了六十多首；其次是韦庄，其余多为前后蜀的词人，如牛峤、毛文锡、薛昭蕴、顾敻、孙光宪、李珣、欧阳炯等；北方的和凝也有作品入选，南唐的词人则没有收录。

  欧阳炯在序中描写了宴会上歌女手执红牙板、按拍演唱的情景，说明这些词是为在宴席上演唱而写的。集中的作品大多描写女子的容貌、服饰、闺情和离别相思，辞藻华丽，风格婉约，后人把这些词人称为“花间派”。其中温庭筠的词秾艳精致，韦庄的词清疏明朗，代表了两种不同的风格。

  《花间集》是现存最早的一部文人词总集，保存了大量晚唐五代的词作。后世对它的评价不一：有人批评它内容狭窄、格调不高；也有人认为它确立了词的婉约风格，是词体成熟的标志。宋代以后，词人们常把“花间”当作词的正宗或源头。
sources: []
recalled:
  - 《花间集》欧阳炯序
  - 陈振孙《直斋书录解题》
