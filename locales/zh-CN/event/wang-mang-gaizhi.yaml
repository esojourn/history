name: 王莽改制
summary: 王莽称帝后依照儒家经典改革土地、奴婢、币制和工商制度，法令屡变，造成社会混乱。
body: |-
  王莽即位时面对的是西汉后期积累的问题：土地集中在豪强手里，失去土地的农民沦为佃户、奴婢或流民。他的各项新政大多以《周礼》等经典为依据，国师刘歆等人参与了制度的设计。

  据《汉书·王莽传》和《食货志》，始建国元年（公元 9 年）他下令：天下的田地一律改称“王田”，奴婢改称“私属”，都不准买卖；一家男子不满八人而田地超过一井（九百亩）的，要把多余的田分给亲族和邻里；没有田的人由官府按制度授田。这项法令没有相应的办法去执行，从诸侯、官吏到平民因买卖田地、奴婢而获罪的不计其数。始建国四年（12 年）他只得下诏，准许买卖王田和私属。

  始建国二年（10 年）起推行“五均”“赊贷”和“六筦”。五均是在长安和洛阳、邯郸、临淄、宛、成都五个大城市设官管理市场，按季评定物价，货物滞销时由官府按成本收购，物价上涨时平价卖出；赊贷是由官府向百姓发放低息或无息的贷款；六筦是把盐、铁、酒、铸钱、山林川泽的出产和五均赊贷都由官府掌管。主持其事的多是大商人，他们与地方官吏勾结，虚造账簿，官库没有充实，百姓却更加困苦。

  币制的变动最为频繁。王莽在摄政时就在五铢钱之外加铸大钱和刀币；称帝后废除五铢钱和刀币，改用大小钱；始建国二年又推出包括金、银、龟甲、贝壳、铜钱、布币在内的二十八种货币，民间不肯使用；天凤元年（14 年）再改为货布、货泉两种。《食货志》说，每改一次币制，就有大批百姓破产，因私铸钱币而被判罪的人极多。

  他还按经书重新划分州郡、改换地名，一个郡有改名五次的，诏书里不得不注明旧名。对周边各族，他把首领的封号由王降为侯，又更换印玺，激起了匈奴、西南夷和高句丽的反抗；为讨伐匈奴而在北边集结的几十万军队长年屯驻，耗尽了边郡。加上黄河改道和连年的旱灾、蝗灾，各地饥民纷纷起事，新朝在地皇四年（23 年）覆灭。
sources: []
recalled:
  - 《汉书·王莽传中》
  - 《汉书·食货志》
