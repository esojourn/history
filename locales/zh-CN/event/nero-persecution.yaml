name: 尼禄迫害基督徒
summary: 公元 64 年罗马大火后，尼禄把罪名加给基督徒，在罗马大批处死。
body: |-
  这件事新约没有记载，主要依据是罗马史家塔西佗《编年史》卷 15 的一段文字。公元 64 年 7 月，罗马城发生大火。据塔西佗，全城十四个区里只有四个区完好，三个区被夷为平地，其余七个区只剩残垣。城里流传着大火是出于皇帝尼禄授意的说法。

  塔西佗说，尼禄为了平息流言，把罪名加给民众称为“基督徒”的一群人，并交代这名称来自基督，此人在提比略在位时被巡抚本丢·彼拉多处死。官府先拘捕承认身份的人，再凭他们的供述给一大批人定罪。处死的方式是披上兽皮让狗咬死，或钉十字架，或在入夜后点燃当作照明；尼禄为此开放自己的花园。塔西佗本人对基督徒并无好感，但他写道，这样的做法使人对受刑的人起了怜悯之心。苏维托尼乌斯《尼禄传》也提到尼禄惩处基督徒，但没有把这件事和大火连在一起。受害的人数，史料没有记载。

  彼得和保罗在尼禄年间于罗马殉道，是教会的传统，不见于新约。一世纪末罗马的革利免在书信中提到两人为信仰受苦而死，没有说时间和方式。优西比乌《教会史》卷 2 记保罗在罗马被斩首、彼得被钉十字架，都在尼禄在位时；彼得倒钉十字架的说法出自更晚的文献。两人殉道的具体年份没有定论，各说在公元 64 至 68 年尼禄去世之间。
sources: []
recalled:
  - 塔西佗《编年史》卷 15 第 38—44 章
  - 苏维托尼乌斯《罗马十二帝王传·尼禄传》第 16 章
  - 罗马的革利免《致哥林多人前书》第 5 章
  - 优西比乌《教会史》卷 2 第 25 章
