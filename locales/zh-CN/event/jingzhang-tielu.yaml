name: 京张铁路
summary: 詹天佑主持修建的京张铁路，1909 年通车，是中国人自建的第一条干线铁路。
body: |-
  北京到张家口之间是华北通往蒙古地区的要道，张家口是对蒙古和俄国贸易的重要商埠。光绪三十一年（1905 年），清朝决定用关内外铁路的余利修建京张铁路，由直隶总督袁世凯主持，任命詹天佑为总工程师（后来又任总办）。当时英国和俄国都想争夺这条铁路的修筑权，相持不下，最后同意由中国人自己修建，有外国人讥笑说能修这条铁路的中国工程师还没有出生。

  京张铁路全长约二百公里，要经过燕山山脉的南口、居庸关、八达岭等地，山高坡陡。詹天佑带领工程人员实地勘测，比较了几条线路后选定了经过关沟的路线。为了降低坡度，他在青龙桥一带设计了“人”字形（之字形）线路，列车在这里折返爬坡；在开凿八达岭隧道时，采用了两端同时开凿和中间开竖井的方法，加快了工程进度。

  宣统元年（1909 年）京张铁路全线建成通车，比原计划提前了两年，费用也比预算节省。这是第一条完全由中国人自己筹资、设计和修建的干线铁路，后来延伸到绥远、包头，称为京绥铁路。青龙桥车站后来立有詹天佑的铜像。
sources: []
recalled:
  - 詹天佑《京张铁路工程纪略》
  - 凌鸿勋《詹天佑先生年谱》
