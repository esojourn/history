name: 辛酉政变
summary: 1861 年两宫太后与恭亲王除掉八位顾命大臣，开始垂帘听政。
body: |-
  咸丰十一年（1861 年，干支为辛酉）七月，咸丰帝在热河避暑山庄病逝。临终前他立六岁的儿子载淳为皇太子，任命怡亲王载垣、郑亲王端华、协办大学士肃顺等八人为“赞襄政务王大臣”，辅佐幼主；同时把“御赏”“同道堂”两枚印章分别交给皇后钮祜禄氏和载淳的生母懿贵妃那拉氏，规定谕旨要钤这两枚印才有效。

  载淳即位后，皇后和懿贵妃被尊为皇太后，分别称慈安太后和慈禧太后。慈禧不甘心大权落在八大臣手中，与八大臣发生冲突。留在北京的恭亲王奕訢与英法等国交涉有功，也对没有被列入辅政大臣不满。奕訢到热河奔丧时，与两宫太后秘密商议。不久御史董元醇上奏，请求太后“权理朝政”，八大臣拟旨驳斥，双方的矛盾公开化。

  九月，咸丰帝的灵柩运回北京，两宫太后和小皇帝先期抄小路回京。她们一到北京，就与奕訢等人宣布八大臣的罪状，逮捕了载垣、端华和护送灵柩的肃顺。载垣、端华被赐自尽，肃顺被斩首，其余五人被革职或流放。随后改年号“祺祥”为“同治”，两宫太后在养心殿“垂帘听政”，奕訢被授予议政王，主持军机处和总理衙门。这次政变也称“祺祥政变”或“北京政变”。此后慈禧太后逐步掌握了清朝的最高权力，长达近半个世纪。
sources: []
recalled:
  - 《清穆宗实录》
  - 薛福成《庸庵笔记》
  - 吴相湘《晚清宫廷实纪》
