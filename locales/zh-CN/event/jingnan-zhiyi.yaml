name: 靖难之役
summary: 建文帝削藩，燕王朱棣以“清君侧”为名起兵，经三年战争攻入南京，夺取帝位。
body: |-
  朱元璋为了巩固朱家的统治，把儿子们分封到各地为王，北方边境的藩王还统率军队，防御蒙古。洪武三十一年（1398 年）建文帝即位，各位藩王都是他的叔父，他担心藩王势力过大，采纳齐泰、黄子澄的建议削藩，一年之内废黜了五位藩王。燕王朱棣驻守北平，兵力最强，也感到危险，暗中准备。

  建文元年（1399 年）七月，朝廷派人到北平逮捕燕王府的官属，朱棣起兵，杀死朝廷派驻北平的官员。他援引《皇明祖训》中朝中有奸臣时藩王可以起兵讨伐的条文，指齐泰、黄子澄为奸臣，以“清君侧”为号，称自己的军队为“靖难”之师。

  建文帝先后派老将耿炳文、曹国公李景隆率大军北伐。耿炳文在真定失利，李景隆的大军在郑村坝、白沟河被燕军击败。建文二年（1400 年）燕军在济南被铁铉、盛庸挡住，同年冬又在东昌被盛庸大败，燕将张玉战死。此后两年双方在河北、山东一带反复争战，燕军虽然屡胜，但只能控制北平、永平、保定等少数地方。

  建文三年（1401 年）底，朱棣得知南京空虚，决定不再与南军争夺城池，率军绕过山东，直下江淮。建文四年（1402 年）燕军在灵璧击溃南军主力，随后渡过长江，六月抵达南京城下，谷王朱橞和李景隆打开金川门迎降，宫中起火，建文帝下落不明。朱棣即皇帝位，次年改元永乐。他随即诛杀建文帝的大臣，方孝孺、齐泰、黄子澄、铁铉等人和他们的亲族门生被大批杀害。靖难之役后，明朝的政治中心逐渐北移，藩王的兵权被彻底削除。
sources: []
recalled:
  - 《明史·成祖本纪》
  - 《明史纪事本末·燕王起兵》
  - 《奉天靖难记》
