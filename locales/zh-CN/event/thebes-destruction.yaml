name: 底比斯被毁
summary: 公元前 335 年底比斯起兵反抗，亚历山大攻陷该城并将其夷为平地。
body: |-
  公元前 335 年春夏，亚历山大北征多瑙河，又转战伊利里亚。希腊传言他已阵亡。一批被放逐的底比斯人潜回城中，杀了两名马其顿军官，号召同胞争取自由。底比斯人包围了卫城卡德米亚里的马其顿驻军，在外面筑起栅栏和壕沟，并向各邦求援。雅典在德摩斯梯尼推动下送去武器，却没有出兵；伯罗奔尼撒的几个邦派了军队，走到地峡就停下观望。

  亚历山大从伊利里亚急行军南下，据阿里安，十三天后出现在彼奥提亚，底比斯人这才知道他还活着。他在城外等了几天，希望对方求和，条件是交出为首的人。底比斯人反而要求他交出安提帕特，并在城墙上宣称，愿与波斯大王和底比斯人一起解放希腊的人都可以过来。

  据阿里安所本的托勒密的说法，进攻并非亚历山大下令，而是驻守营地的佩尔狄卡斯擅自冲击栅栏开始的，其他部队跟进；狄奥多罗斯则说是亚历山大三路布置的总攻。底比斯人在城外抵抗了很久，退入城门时来不及关闭，马其顿人跟着涌入，卡德米亚的驻军也冲出来夹击。随军的福基斯人、普拉提亚人等与底比斯有世仇，据阿里安，杀戮多出自他们之手。古代作家说有六千多人被杀，三万人被俘。

  处置交给在场的希腊盟邦商议，这些盟邦正是底比斯的仇家。他们决定：城市夷平，土地分给邻邦，俘虏连同妇孺卖为奴隶，逃亡的底比斯人各邦不得收留；卡德米亚留驻军队。得免的只有祭司、马其顿的宾友和诗人品达的后人，品达的故居也特意保留下来。据狄奥多罗斯，卖俘所得为四百四十塔兰特。

  一座有七百年历史、三十年前还称霸希腊的大城就此消失，各邦震恐。亚历山大随后要求雅典交出德摩斯梯尼、吕库古等反马其顿的演说家，经德马德斯和福基翁交涉才作罢。此后他在东方十一年，希腊本土除斯巴达一度起兵外没有再发生大的反抗。前 316 年卡山德重建了底比斯。
sources: []
