name: 两税法
summary: 780 年唐朝改行两税法，按资产和田亩征税，夏秋两征，取代租庸调制。
body: |-
  唐朝前期实行均田制，按丁口授田，再按丁口征收租、庸、调。到唐玄宗时，土地兼并严重，大量农民逃离户籍，均田制名存实亡。安史之乱后户籍更加混乱，按丁征税难以为继，各地又巧立名目征收临时税，百姓不堪重负。

  大历十四年（公元 779 年）唐德宗即位，宰相杨炎建议实行新的税法，建中元年（780 年）正式推行，称为两税法。主要内容是：不论原来的主户还是外来的客户，都按现在居住的地方登记户籍；不论丁男还是中男，都按贫富分等纳税；根据户等和田亩多少征收户税和地税，每年分夏、秋两次征收，夏税在六月以前交纳，秋税在十一月以前交纳；没有固定住处的商人，在所在州县按收入的三十分之一纳税；原来的租庸调和各种杂税一律废除。朝廷先根据开支定出总额，再分配到各州县，称为“量出以制入”。

  两税法把税收的依据从人丁转向了财产和土地，扩大了纳税的范围，简化了税目，朝廷的收入一时有所增加。但它以钱计算税额，百姓却要出卖绢帛和粮食换钱纳税，后来钱少物贱，同样的税额百姓要交出更多的实物。宰相陆贽在贞元年间上疏，详细指出两税法实施中的种种弊端。此外，各地在两税之外仍有加征和摊派。

  尽管如此，两税法基本适应了均田制瓦解以后的社会状况，此后历经五代、宋、元，一直沿用到明代中叶实行一条鞭法为止，是中国赋税制度史上的一次重大转变。
sources: []
recalled:
  - 《旧唐书·杨炎传》
  - 《新唐书·食货志》
  - 陆贽《均节赋税恤百姓六条》
