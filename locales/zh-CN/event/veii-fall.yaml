name: 攻陷维爱
summary: 传统上定在公元前 396 年：罗马经长期围困攻下伊特鲁里亚强邻维爱，领土大增。
body: |-
  传统上定在公元前 396 年。维爱是伊特鲁里亚十二城之一，在罗马西北约十六公里，建在三面峭壁的台地上，控制着台伯河西岸和河口的盐场，是罗马近旁最强的对手。两城在前 5 世纪多次交战；据传说，前 477 年费边家族三百零六人在克雷梅拉河全部战死。

  最后一次战争，李维说从前 406 年打到前 396 年，围城整整十年，与特洛伊战争恰好一样长，这个数字显然经过附会。可以相信的是战事拖得很久，罗马军队第一次不在冬天解散回家，国家因此开始给士兵发饷。其他伊特鲁里亚城市没有出兵援助维爱。

  李维记载了一连串神异的事：阿尔班湖水无故上涨，德尔斐神谕和一名被俘的维爱占卜师都说，要把湖水引走才能破城，罗马人于是开凿了泄水隧道。前 396 年卡米卢斯任独裁官，下令挖地道通到城中卫城的朱诺神庙下面，士兵从地下冲出，同时城外发起总攻。城破后居民被杀或卖为奴隶，朱诺女神的神像被“请”到罗马，在阿文提诺山上立庙。

  维爱的土地被没收，分给罗马公民，前 387 年在这片土地上新设了四个部落，罗马的领土由此大为增加。卡米卢斯举行凯旋式时用四匹白马拉车，被人指为僭越；后来又因战利品的分配受到控告而流亡。据李维，几年后高卢人洗劫罗马，有人提议全体迁到维爱，没有被采纳。
sources: []
recalled:
  - 李维《建城以来史》卷四第 58—61 章、卷五第 1—23 章
  - 普鲁塔克《卡米卢斯传》第 2—8 章
