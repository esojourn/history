name: 稷下学宫
summary: 齐都临淄的学术中心，各家学者云集论辩，是百家争鸣的中心。
body: |-
  稷下学宫因设在齐都临淄的稷门附近而得名。它的创立时间，东汉徐干《中论》说是田齐桓公田午时期（公元前 374 年至前 357 年在位），这里按约公元前 374 年画起；它在齐威王、宣王时最为兴盛，一直延续到齐国被秦所灭（公元前 221 年）。

  据《史记·田敬仲完世家》，齐宣王喜好文学游说之士，像邹衍、淳于髡、田骈、接子、慎到、环渊等七十六人，都赐给府第，封为上大夫，“不治而议论”，稷下学士多达数百上千人。他们来自不同国家，属于儒、道、法、名、阴阳等不同学派，可以自由讲学、著书、辩论，也为齐王提供咨询。孟子曾到齐国，与齐宣王多次对话；荀子在齐襄王时“最为老师”，三次担任稷下的祭酒。

  稷下学宫是战国“百家争鸣”最集中的体现，许多学派在这里相互辩难、吸收。传世的《管子》一书，有学者认为大部分出自稷下学者之手；阴阳家邹衍的“五德终始”说也在这里形成，后来对秦汉的政治产生了很大影响。

  稷下先生中有不少著名人物：淳于髡以滑稽多辩著称，慎到是法家“势”论的代表，邹衍提出“五德终始”和“大九州”之说，宋钘、尹文主张“见侮不辱”“禁攻寝兵”。
sources: []
recalled:
  - 《史记·田敬仲完世家》
  - 《史记·孟子荀卿列传》
  - 徐干《中论·亡国》
