name: 前秦统一北方
summary: 苻坚在七年间先后灭前燕、仇池、前凉和代国，并夺取东晋的益州，统一了北方。
body: |-
  苻坚即位后的十几年里，前秦在王猛主持下整顿内政，国力渐强。东面的前燕则在慕容恪死后由慕容评当权，政治败坏。太和四年（公元 369 年）桓温北伐，前燕以割让洛阳以西的土地为条件向前秦求救，事后反悔；同年，前燕最有声望的将领慕容垂因受排挤投奔长安。苻坚认为时机已到。

  太和五年（370 年），王猛统率步骑六万伐燕，先攻下壶关和晋阳。前燕派慕容评率领号称三十万的大军在潞川抵御。据《晋书·载记》，慕容评封锁山泉，向自己的士兵卖水卖柴牟利，军心离散。十月，王猛在潞川决战，大破燕军，乘胜包围邺城。苻坚亲自率军赶到，十一月邺城陷落，燕主慕容暐出逃被擒。前燕一百五十余郡、九百九十余万人口归入前秦，这个数字见于载记。苻坚把慕容暐和鲜卑四万余户迁到长安。

  此后前秦四面出击。太和六年（371 年）灭氐人杨氏在陇南的仇池国。宁康元年（373 年）攻取东晋的汉中和益州，占领成都。太元元年（376 年）八月，秦军渡过黄河进攻凉州，立国七十多年的前凉君主张天锡出降；同年冬，又乘塞北代国内乱，出兵击溃拓跋部，代王什翼犍死，部众被分为两部，交给匈奴首领刘库仁、刘卫辰统领。

  至此，东起辽东、西到西域东部、南抵汉水和淮河、北至大漠的地区都归前秦所有，这是西晋灭亡六十年来北方第一次统一。载记说当时各国使者来朝，西域诸国也遣使进贡。太元四年（379 年）前秦又夺取襄阳，与东晋隔着淮河、汉水对峙。

  这次统一完成得很快，根基却不牢固。被征服的鲜卑、羌、匈奴各部大体保持着原有的组织，其首领多在前秦朝廷任职领兵；氐人本族人口不多，又被分派到各地镇守。王猛在太元元年以前已经去世，他临终提醒过这些隐患。七年以后淝水一败，这个国家就分裂成近十个政权。
sources: []
recalled:
  - 《晋书·苻坚载记》
  - 《晋书·慕容暐载记》
  - 《资治通鉴》卷一百零二至一百零四
