name: 考迪乌姆峡谷之辱
summary: 第二次萨莫奈战争中，罗马两名执政官率全军在山谷中被困投降，从轭下走过。
body: |-
  公元前 321 年，第二次萨莫奈战争中罗马军队的一次全军投降。

  据李维，这年两名执政官屯兵坎帕尼亚。萨莫奈统帅盖乌斯·庞提乌斯派十名士兵扮成牧人，分头向罗马人散布同一个消息：萨莫奈全军正在围攻阿普利亚的盟城卢凯里亚。执政官决定走近路去救，途中要经过考迪乌姆附近的一处地方：两道狭窄的隘口，中间夹着一块四面环山的草地。罗马军队穿过第一道隘口，发现第二道已被砍倒的树木和巨石堵死，山上出现敌兵；折回去，来路也被封住。全军困在谷中，无法突围，粮尽后求和。

  庞提乌斯提出的条件是：罗马军队解除武装，从“轭”下走过；罗马撤出萨莫奈人的土地，撤销殖民地；六百名骑士留作人质。所谓轭，是把两支长矛插在地上，上面横架一支，战败者只穿一件单衣，弯腰从下面走过。执政官带头，全军依次而过，然后回到卡普亚和罗马，城中如同举丧。

  李维说，订立的不是正式条约，只是执政官个人的担保；次年元老院否认协议，把担保人捆绑着交给萨莫奈人，庞提乌斯拒不接收，罗马随即出兵雪耻，让七千萨莫奈人也从轭下走过。这段“雪耻”的记述与前 137 年努曼提亚和约被否认的经过十分相似，许多学者认为是后人编造；实际上此后五年双方没有大的战事，罗马很可能遵守了和约。这处峡谷究竟在今天的哪个山谷，也没有定论。
sources: []
recalled:
