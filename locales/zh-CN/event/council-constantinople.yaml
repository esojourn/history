name: 君士坦丁堡会议
aliases:
  - 第一次君士坦丁堡公会议
  - 第二次大公会议
summary: 公元 381 年狄奥多西召集的会议，重申尼西亚信经，申明圣灵的神性。
body: |-
  尼西亚会议并没有平息亚流引起的争论。《历史的轨迹》第五章说，亚流一派得到皇帝和宫廷的支持，亚他那修为尼西亚信经奋斗到死；他死后，这个担子落在加帕多家的巴西流、拿先斯的贵格利和女撒的贵格利身上。争论中又出了新题目：有人承认圣子的神性，却说圣灵是受造的；老底嘉的亚波里拿留则说基督没有人的心灵。

  公元 379 年即位的狄奥多西皇帝支持尼西亚信仰。381 年 5 月，他召集东方的主教在君士坦丁堡开会，到会约一百五十人，西方教会没有代表。会议先由安提阿主教墨勒提乌主持，他在会期中去世，由刚被立为君士坦丁堡主教的拿先斯的贵格利接任。贵格利不久因有人质疑他调任的合法性而辞职，会议另选了元老出身的涅克塔留。

  会议重申尼西亚的信仰，定了各派亚流主义、否认圣灵神性的一派和亚波里拿留派的罪。今天各教会礼拜中所用的“尼西亚信经”，比 325 年的原文多出关于圣灵的一段：“我信圣灵，赐生命的主，从父出来，与父、子同受敬拜，同受尊荣。”传统上把这个文本归于这次会议，现存最早引用它的是 451 年迦克墩会议的记录。

  会议的第 3 条教规规定，君士坦丁堡主教的尊荣仅次于罗马主教，“因为君士坦丁堡是新罗马”。亚历山大和罗马对这一条都不满意。

  《历史的轨迹》说，到这时教会对父、子、圣灵为三而一之真神的信仰才正式确立，亚流主义此后在帝国内逐渐消失；它在哥特、汪达尔等日耳曼部族中间又延续了两三百年。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
recalled:
  - 苏格拉底《教会史》卷 5 第 8 章
  - 拿先斯的贵格利《自述生平》《讲章》第 42 篇
  - 君士坦丁堡会议教规第 1、3 条
  - 狄奥多勒《教会史》卷 5 第 7—9 章
