name: 托勒密著《天文学大成》
summary: 约公元 150 年托勒密在亚历山大城写成《天文学大成》，系统阐述地心体系。
body: |-
  《天文学大成》没有标明成书年份。书里用到的托勒密本人的观测，最晚的一次在公元 141 年；他 146 或 147 年在亚历山大城郊所立的碑上刻的一些参数，在书里已经作了修正。据此推断，全书约在 150 年前后完成。

  全书十三卷。第一、二卷讲基本前提和所需的数学：天是球形并且旋转，地是球形，位于天的中心，相对于天只是一个点，本身不动；接着给出一份弦表和球面三角的算法。第三卷讲太阳的运动和一年的长度。第四、五卷讲月亮，第六卷讲日月食。第七、八卷是恒星，星表列出一千零二十多颗星的位置和亮度等级，分属四十八个星座。最后五卷讲五大行星。

  他的办法是用匀速圆周运动的组合去解释看上去不均匀的天体运行。行星在一个小圆“本轮”上转，本轮的中心又沿一个大圆“均轮”转，地球不在均轮的正中心；他又添了一个“偏心匀速点”，本轮中心相对于这一点才是匀速的。每个天体的参数都从选定的几次观测里推算出来，再编成表，供人预推任意时刻的位置。这些办法大多继承自前三百年的希腊天文学家，尤其是喜帕恰斯；他们的著作因为被这部书取代而大都失传了。

  书里也有不准确的地方。他沿用的岁差数值是每百年一度，实际约每七十二年一度；星表与他自称的观测年代有系统的偏差，因此从古到今都有人怀疑它是把喜帕恰斯的星表加上一个改正数得来的。

  九世纪这部书在巴格达被译成阿拉伯文，阿拉伯学者据此观测、修订，也提出批评。十二世纪克雷莫纳的杰拉德在托莱多把它从阿拉伯文译成拉丁文，西方通行的书名就是阿拉伯文标题的音译。1543 年哥白尼的《天体运行论》在编排和算法上仍然以它为蓝本。
sources: []
recalled:
  - 托勒密《天文学大成》卷 1 第 1—8 章、卷 3 第 1 章、卷 7 第 2—4 章
  - 卡诺珀斯碑文
  - 哥白尼《天体运行论》
