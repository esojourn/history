name: 后唐灭梁
summary: 923 年李存勖在魏州称帝建后唐，随即奇袭开封，梁末帝自杀，后梁灭亡。
body: |-
  贞明元年（公元 915 年）魏博军投晋以后，晋与后梁在黄河两岸对峙了七八年，互有胜负，双方都已精疲力竭。龙德三年（923 年）四月，晋王李存勖在魏州即皇帝位，国号唐，史称后唐，年号同光。

  同年闰四月，李嗣源率军渡过黄河，袭取了后梁的郓州，切断了后梁东面的联系。后梁先派王彦章反攻，一度夺回黄河上的德胜南城，但不久王彦章被撤换，由段凝统率梁军主力，屯驻在黄河边，准备决河阻挡唐军，同时分兵几路进攻后唐。九月，王彦章率少量兵马守中都，兵败被俘。

  后唐君臣讨论下一步行动时，不少人主张与后梁议和，郭崇韬、李嗣源则力主乘后梁主力在外、开封空虚之机长驱直入。李存勖采纳了他们的建议，十月亲率大军从郓州出发，直扑开封，沿途没有遇到有力的抵抗。梁末帝朱友贞得知消息，知道无法挽回，命部将皇甫麟杀死自己。次日，李嗣源率前锋进入开封，李存勖随后到达，后梁灭亡。后梁的老臣敬翔听说同僚准备投降，自缢而死。

  后梁自 907 年建立，共十七年。后唐灭梁后，河北、河南都归后唐所有，李存勖随后迁都洛阳。各地的割据者如岐王李茂贞、荆南的高季兴等纷纷表示臣服，后唐一时成为五代中疆域最大的朝代。
sources: []
recalled:
