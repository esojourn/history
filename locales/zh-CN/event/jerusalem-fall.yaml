name: 耶路撒冷陷落、圣殿被毁
summary: 巴比伦军围困耶路撒冷约一年半，城破，圣殿被焚，犹大国亡。
body: |-
  西底家是尼布甲尼撒所立的王，在位十一年。据《历代志下》36:13 和《以西结书》17:13–16，他曾起誓效忠巴比伦王，后来却背叛，并打发使者往埃及去求马匹和军兵。先知耶利米多次劝他归服巴比伦王，他没有听从（《耶利米书》第 27 章、第 38 章）。

  西底家九年十月初十日，尼布甲尼撒率领全军来攻击耶路撒冷，在城的四围筑垒（《列王纪下》25:1）。其间法老的军队从埃及出来，迦勒底人一度离开耶路撒冷，随后又回来（《耶利米书》37:5–11）。犹大的坚固城只剩下拉吉和亚西加（34:7）；拉吉遗址出土的陶片书信，一般认为就写于这段时间。到十一年四月初九日，城里有大饥荒，百姓都没有粮食，城被攻破；西底家和兵丁夜间从靠近王园两城中间的门逃出，在耶利哥的平原被追上（《列王纪下》25:2–5）。他被带到利比拉，巴比伦王审判他，在他眼前杀了他的众子，剜了他的眼睛，用铜链锁着带到巴比伦（25:6–7）。

  尼布甲尼撒十九年五月初七日，护卫长尼布撒拉旦进入耶路撒冷，焚烧耶和华的殿、王宫和城里各大户的房屋，拆毁四围的城墙，把城里所剩下的百姓和已经投降的人都掳去，只留下最穷的人修理葡萄园、耕种田地（25:8–12；《耶利米书》52:12 作初十日）。圣殿的铜柱、铜海被打碎，连同金银器皿运往巴比伦；大祭司西莱雅等人被带到利比拉处死（25:13–21）。《耶利米书》52:29 记尼布甲尼撒十八年从耶路撒冷掳去八百三十二人。

  巴比伦王立亚希甘的儿子基大利作省长，驻在米斯巴。当年七月，宗室以实玛利杀了基大利；余下的人惧怕迦勒底人，带着耶利米逃往埃及（《列王纪下》25:22–26；《耶利米书》第 40—43 章）。《耶利米书》52:30 还记尼布甲尼撒二十三年又掳走七百四十五人。此后直到波斯王古列元年下诏准许归回（《以斯拉记》第 1 章），是被掳时期。《耶利米哀歌》为城毁而作；犹太传统在埃波月初九日纪念圣殿被毁。

  城破之年有公元前 587 年、前 586 年两说。巴比伦编年史现存的部分止于尼布甲尼撒第十一年，没有这次围城的记录，年份只能从圣经的纪年推算。分歧出在犹大王的年数从春季还是秋季算起，以及尼布甲尼撒的年数是否把即位那年算在内（《列王纪》作十九年，《耶利米书》52:29 作十八年），两说学界各有主张。本条的起止年从围城开始算起，到两说中较晚的前 586 年为止。
