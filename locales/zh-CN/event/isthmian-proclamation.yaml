name: 地峡竞技会宣告希腊自由
summary: 公元前 196 年罗马统帅弗拉米尼努斯在地峡竞技会上宣布希腊各邦自由。
body: |-
  公元前 197 年罗马在库诺斯克法莱击败马其顿国王腓力五世。和约规定，腓力退出他在希腊和小亚细亚占据的一切城市。这些城市今后归谁，希腊人十分关心：元老院派来的十人委员会中，有人主张罗马自己接管科林斯、卡尔基斯和德米特里阿斯三处要塞，腓力曾把它们叫作“希腊的镣铐”；埃托利亚人则到处说，希腊只不过是换了主人。统帅弗拉米尼努斯主张全部撤军，以取信于希腊人。

  前 196 年初夏，两年一度的地峡竞技会在科林斯附近举行，各邦来人极多，都在猜测罗马的决定。据波利比乌斯，开幕时传令官走到场中，号手吹号令众人肃静，然后宣布：“罗马元老院和统帅提图斯·昆克提乌斯，既已战胜腓力王和马其顿人，兹令下列各族自由，不驻军，不纳贡，依其祖传之法自治：科林斯人、福基斯人、洛克里斯人、优卑亚人、弗提奥提斯的亚该亚人、马格尼西亚人、色萨利人、佩莱比亚人。”这些正是此前受腓力直接控制的地方。许多人没有听清，要求再念一遍。第二遍念完，全场欢呼。普鲁塔克说，呼声大得使飞过的乌鸦坠落；人群涌向弗拉米尼努斯，他几乎被挤伤。

  “希腊人的自由”是一个老口号，从大王和约到安提柯一世、托勒密一世都用过。罗马这次确实照办了：前 194 年弗拉米尼努斯撤出三处要塞的驻军，全军返回意大利，带走大批战利品和艺术品。但各邦的边界和政体是由罗马的委员会裁定的，各邦此后遇事也都向元老院申诉。

  埃托利亚人自认在战争中出力最多而所得最少，转而邀请塞琉古国王安条克三世来“解放希腊”。前 192 年安条克渡海，次年在温泉关被罗马击败，前 190 年又在小亚细亚的马格尼西亚战败。此后的五十年里，罗马对希腊事务的干预一步步加深。前 146 年亚该亚同盟与罗马开战，科林斯被毁，宣告自由的地方成了废墟。公元 67 年罗马皇帝尼禄在同一个竞技会上又宣布过一次希腊自由。
