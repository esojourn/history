name: 隆庆开关
summary: 1567 年明朝开放漳州月港，准许民间商船出海贸易，部分解除海禁。
body: |-
  明朝建立后实行海禁，禁止民间私自出海贸易，对外贸易只能通过官方的朝贡进行。嘉靖年间严厉的海禁与走私贸易之间的矛盾激化，成为倭患的重要原因之一。倭患平定后，主张开放的意见逐渐得到采纳。

  隆庆元年（1567 年），隆庆帝即位不久，福建巡抚涂泽民奏请开放海禁，朝廷准许在漳州月港设立海澄县，允许民间商船申请“船引”后出海，到东洋（菲律宾、日本方向）和西洋（东南亚方向）贸易，但仍然禁止前往日本，也禁止贩运硝石、硫磺、铜铁等军需物资。万历初年设立督饷馆，对出海商船征收引税、水饷、陆饷等税。这一政策史称“隆庆开关”。

  月港开放后，中国商船大量前往东南亚，特别是西班牙人占据的马尼拉，用生丝、丝绸、瓷器等交换西班牙人从美洲运来的白银，形成了“马尼拉大帆船贸易”的一部分。大约同一时期，葡萄牙人获准在澳门居留，从澳门转运中国商品到日本、印度和欧洲。大量的美洲白银和日本白银流入中国，促进了白银在明朝货币和赋税中的普遍使用，与张居正推行的一条鞭法相互配合。

  不过，隆庆开关只开放了月港一处，管理仍然严格，与日本的直接贸易一直被禁止。学者对隆庆开关的影响评价不一，有人认为它推动了明代后期商品经济的发展，也有人认为白银的大量流入使明朝财政更容易受到外部因素的影响。
sources: []
recalled:
  - 张燮《东西洋考》
  - 《明穆宗实录》
