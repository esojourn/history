name: 乐毅伐齐
summary: 前 284 年乐毅率五国之师破齐，五年间下齐七十余城。
body: |-
  公元前 314 年齐国趁燕国内乱攻破燕都，燕昭王即位后立志复仇。齐湣王时齐国国力强盛，公元前 286 年灭了宋国，引起各国的忌惧。据马王堆帛书《战国纵横家书》，燕国派苏秦到齐国做反间，挑拨齐国与秦、赵的关系。

  公元前 284 年，燕昭王以乐毅为上将军，联合秦、赵、韩、魏伐齐（一说还有楚）。据《史记·乐毅列传》，联军在济西大败齐军。各国军队撤回后，乐毅独率燕军长驱直入，攻占齐都临淄，把齐国的宝物、祭器运回燕国。齐湣王出逃到莒，被前来救援的楚将淖齿所杀。苏秦的反间活动在这时暴露，被齐人车裂。

  乐毅在齐国五年，攻下七十余城，都设为郡县归属燕国，只有莒和即墨两城坚守不下。公元前 279 年燕昭王去世，燕惠王中了田单的反间计，以骑劫代替乐毅，田单随即用火牛阵大破燕军，齐国收复了失地。齐国虽然复国，但经过这场浩劫已大为衰弱，再也无力与秦国抗衡。

  济西之战后，齐湣王先后逃到卫、鲁、邹等国，都不被接纳，最后到了莒，被楚将淖齿所杀。乐毅在齐国减轻赋税、废除苛政、祭祀齐国先贤，试图收服齐人之心，他在《报燕王书》中也追述了这次伐齐的经过。
sources: []
recalled:
  - 《史记·乐毅列传》
  - 《史记·燕召公世家》
  - 《史记·田敬仲完世家》
  - 马王堆汉墓帛书《战国纵横家书》
