name: 喀提林阴谋
summary: 喀提林竞选执政官失败后图谋武力夺权，被执政官西塞罗揭发，同党未经审判被处死。
body: |-
  公元前 63 年，贵族喀提林在竞选执政官失败后图谋以武力夺取政权，被执政官西塞罗揭发镇压。

  当时罗马的债务问题严重：苏拉安置的老兵不善经营，纷纷破产，被苏拉夺去土地的人更是穷困，一些贵族为竞选和排场负债累累。喀提林在前 64 年、前 63 年两次竞选执政官，后一次公开以取消债务为纲领，都落选了。

  前 63 年秋，他的同党曼利乌斯在伊特鲁里亚召集苏拉的旧部准备起事。西塞罗通过一个同谋者的情妇得到消息。10 月 21 日元老院通过最终决议。11 月初喀提林在同党家中开会，布置在罗马放火和刺杀西塞罗；刺客来到西塞罗门前，被拒之门外。11 月 8 日西塞罗召集元老院，当着喀提林的面发表了第一篇《反喀提林》，开头一句是：“喀提林，你要滥用我们的耐心到什么时候？”喀提林当夜出城去了曼利乌斯的军营。

  留在罗马的首领是时任大法官的伦图卢斯。他们想拉拢来罗马申诉的高卢阿洛布罗基人的使节，让他们回去起兵响应。使节报告了西塞罗，西塞罗让他们索取书面保证。12 月 2 日夜，使节一行在穆尔维乌斯桥被截获，书信成了物证。12 月 3 日五名首领被拘押。12 月 5 日元老院辩论如何处置：恺撒主张没收财产、分押各地监禁，指出不经审判处死公民是危险的先例；小加图发言力主处死，得到多数。当晚西塞罗把五人押到地牢，看着他们被绞死；据普鲁塔克，他出来向人群只说了一句：“他们活过了。”

  处决的消息传来，喀提林的队伍大部分逃散。前 62 年 1 月，他在皮斯托里亚附近被执政官安东尼乌斯的军队追上，战死。

  西塞罗被称为“祖国之父”，但卸任当天保民官就不许他发表演说，理由是他未经审判处死公民。前 58 年克洛狄乌斯以同样的理由把他放逐。
sources: []
recalled:
