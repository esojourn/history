name: 耶律大石西行与西辽建立
summary: 1124 年耶律大石率部北走可敦城，后西入中亚，约 1132 年称帝，史称西辽。
body: |-
  保大四年（公元 1124 年），辽朝宗室耶律大石不满天祚帝的作为，率领二百名骑兵离开夹山，北上到漠北的辽朝军镇可敦城。据《辽史》，他在那里召集了附近七州的官员和十八部的首领，申明要复兴辽朝，得到精兵万余人。

  此后数年间，他率众西行，进入今新疆和中亚地区，先后取得高昌回鹘、东喀喇汗王朝等地的臣服。一般认为他在 1132 年前后称帝，尊号“葛儿罕”，又采用汉式年号延庆，后来以喀喇汗王朝的八剌沙衮为都城，改名虎思斡耳朵，具体年份各书记载有出入。中国史书称这个政权为西辽，穆斯林和西方的文献称之为“哈喇契丹”。西辽保留了辽朝的制度和汉文化的许多因素，对中亚各族采取比较宽容的政策。1141 年耶律大石在卡特万草原击败塞尔柱帝国的军队，西辽势力达到顶峰。西辽一直延续到 1218 年才被蒙古灭亡。
sources: []
recalled:
  - 《辽史·天祚皇帝本纪》附耶律大石事迹
  - 志费尼《世界征服者史》
