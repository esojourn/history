name: 呼韩邪单于朝汉
summary: 匈奴呼韩邪单于到甘泉宫朝见汉宣帝，自称臣属，这是匈奴单于第一次入朝。
body: |-
  匈奴内乱中，呼韩邪单于被兄长郅支单于击败，失去了王庭。据《汉书·匈奴传》，他的大臣左伊秩訾王建议入朝事汉，借汉朝的力量安定匈奴。许多贵族反对，说匈奴向来以气力为上、以服从别人为耻，靠马上战斗立国，如今兄弟相争，即使战死也有威名，向汉称臣会被各国耻笑。左伊秩訾王回答说，如今汉朝强盛，西域和乌孙都已归附，匈奴日益衰弱，事汉才能保全，否则就要灭亡。呼韩邪采纳了他的意见，率部南下靠近汉塞，在公元前 53 年派儿子到长安入侍；郅支单于见状，也派儿子入侍。

  前 52 年，呼韩邪到五原塞下，表示愿意在次年正月朝见。朝中讨论接待的礼仪：丞相、御史大夫认为单于应当排在诸侯王之下；太子太傅萧望之认为匈奴本不是汉朝的臣属，应当待以客礼，位在诸侯王之上，将来即使匈奴不再来朝，也不算叛臣。宣帝采纳了萧望之的意见。

  甘露三年（前 51 年）正月，呼韩邪在甘泉宫朝见宣帝。朝见时他只称臣而不必自报名字。汉朝赐给他冠带衣裳、黄金印玺、佩刀、弓箭、车马、黄金二十斤、钱二十万，以及大量丝织品。礼毕，宣帝先行返回长安，途中登上渭桥，前来观礼的各族君长和使者数万人在桥下夹道迎接，齐呼万岁。呼韩邪在长安住了一个多月后北归，请求留居光禄塞下；汉朝派兵护送，并从边郡运去三万四千斛粮食接济。

  此后汉朝的支持使呼韩邪重新立足，郅支单于被迫西迁。呼韩邪后来又两次入朝，最后一次娶了王昭君。从这时起到王莽初年的六十年间，汉与匈奴之间基本没有战事。
sources: []
recalled:
  - 《汉书·匈奴传下》
  - 《汉书·宣帝纪》
  - 《汉书·萧望之传》
