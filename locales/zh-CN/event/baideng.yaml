name: 白登之围
summary: 汉高祖亲征匈奴，在平城白登被冒顿单于围困七日，脱围后与匈奴和亲。
body: |-
  汉初，高祖把韩王信的封地迁到太原以北，以防备匈奴，韩王信请求以马邑为都。据《史记·韩信卢绾列传》，匈奴大举围攻马邑，韩王信多次派使者求和，引起朝廷猜疑，他便以马邑降匈奴，反攻太原。高祖七年冬（约公元前 200 年初），高祖亲自率军出击，在铜鞮击败韩王信的军队，又在晋阳等地连胜匈奴。

  据《史记·匈奴列传》，冒顿单于把精兵藏起来，只露出老弱，引汉军北进；汉军多为步兵，共三十二万。当时天寒，《高祖本纪》说士卒冻掉手指的有十分之二三。高祖先到平城，步兵还没到齐，冒顿以精兵围高祖于白登，前后七日，内外不能相救；《匈奴列传》称围兵有四十万骑。

  高祖派人厚赠单于的阏氏，阏氏劝说冒顿；冒顿又因韩王信部将王黄、赵利的军队没有如约到来而起疑，于是解开包围的一角，高祖得以脱出。《史记·陈丞相世家》说这是用了陈平的计策，而“其计秘，世莫得闻”。此后匈奴仍屡次侵扰，高祖采纳刘敬的建议，以宗室女名为公主嫁给单于，每年送去絮、缯、酒、米等物，约为兄弟。和亲成为汉初对匈奴的基本办法。
sources:
  - 《史记·匈奴列传》 https://ctext.org/shiji/xiong-nu-lie-zhuan/zhs
  - 《史记·高祖本纪》 https://ctext.org/shiji/gao-zu-ben-ji/zhs
  - 《史记·韩信卢绾列传》 https://ctext.org/shiji/han-xin-lu-wan-lie-zhuan/zhs
