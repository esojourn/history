name: 魏灭蜀
summary: 公元 263 年魏军分路伐蜀，邓艾由阴平小道奇袭成都，后主刘禅投降，蜀汉灭亡。
body: |-
  诸葛亮死后，蜀汉先由蒋琬、费祎主政，以守为主；后来姜维连年北伐，胜少败多，国力消耗很大，后主又宠信宦官黄皓。魏国方面，司马昭在平定淮南的反抗和处理完曹髦被杀一事后，决定先灭蜀汉。

  据《三国志·魏书》的《钟会传》《邓艾传》，景元四年（公元 263 年）秋，魏军分三路出兵：征西将军邓艾率三万多人进攻在沓中屯田的姜维；雍州刺史诸葛绪率三万多人截断姜维的退路；镇西将军钟会率主力十多万人从斜谷、骆谷等道进入汉中。蜀军此前改变了在汉中外围据险拒敌的旧法，收缩兵力防守几座城池。钟会留兵围城，直取阳安关，守将投降，汉中失守。姜维摆脱邓艾、绕过诸葛绪，与前来增援的廖化、张翼等会合，退守剑阁。剑阁地势险要，钟会久攻不下，粮运困难，打算撤兵。

  邓艾提出从阴平走小路绕过剑阁，直插成都平原。十月他率部出发，在荒无人烟的山地行军七百多里，凿山开路，遇到陡坡便裹着毡子滚下。魏军到达江由，守将投降。后主派诸葛亮之子诸葛瞻率军阻击，诸葛瞻在绵竹战败，与儿子诸葛尚一同战死。

  成都没有防备，朝中一片混乱。光禄大夫谯周认为逃往南中或投奔吴国都不可行，主张投降，后主采纳。十一月刘禅派人带着印绶到邓艾军前请降，又下令让姜维等人向钟会投降。裴松之注引《蜀记》说，蜀汉灭亡时有户二十八万，人口九十四万，将士十万二千人。

  次年正月，钟会诬告邓艾谋反并将其逮捕，自己又与姜维谋划据蜀自立，结果军队哗变，钟会、姜维被杀，邓艾也在途中遇害。刘禅被迁到雒阳，封为安乐公。
sources: []
recalled:
  - 《三国志·魏书·王毌丘诸葛邓钟传》
  - 《三国志·蜀书·后主传》及裴松之注
  - 《三国志·蜀书·蒋琬费祎姜维传》
