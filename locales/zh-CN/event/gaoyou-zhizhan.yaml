name: 高邮之战
summary: 1354 年脱脱率元军围攻张士诚据守的高邮，城将破时脱脱被元顺帝罢免，元军溃散。
body: |-
  至正十三年（公元 1353 年）张士诚在泰州起兵，攻下高邮，自称诚王，国号大周。高邮地处大运河沿线，张士诚占据这里，切断了江南向大都输送粮食的通道，元朝十分重视。至正十四年（1354 年）九月，丞相脱脱亲自统率各路大军南下，史称兵力号称百万，十一月在高邮城外大败张士诚，随后包围高邮，又分兵攻下六合等地，城中危急。

  正在这时，朝中的哈麻等人在元顺帝面前进谗言，说脱脱出师三个月没有什么战功，劳民伤财。十二月，顺帝下诏削去脱脱的官爵，把他安置到淮安，由别的将领接管军队。诏书到达军中，脱脱接受了处分，元军将士失去统帅，军心大乱，很快溃散，一部分人投奔了红巾军。张士诚趁机反击，转危为安，此后渡江占据平江等地。高邮之战是元末形势的一个转折点，此后元朝再也没有组织起这样大规模的进剿。
sources: []
recalled:
  - 《元史·脱脱传》
  - 《明史·张士诚传》
  - 《庚申外史》
