name: 金灭辽
summary: 1114 年女真起兵反辽，先后攻下辽朝五京，1125 年俘获天祚帝，辽朝灭亡。
body: |-
  天庆四年（公元 1114 年）完颜阿骨打起兵反辽，次年建立金朝，并在护步答冈击败天祚帝亲率的大军（另见“金建国”条）。此后辽朝内部接连发生叛乱，渤海人高永昌在东京辽阳府自立，金军乘机于收国二年（1116 年）攻下东京，辽东之地尽归金朝。

  辽朝一度与金朝议和，因为在册封的名号上争执不下而破裂。天辅四年（1120 年）金军攻下辽朝的都城上京临潢府。天辅六年（1122 年）正月金军攻下中京大定府，天祚帝西逃，后来躲进夹山；不久金军又攻下西京大同府。留在南京（燕京）的辽朝大臣拥立耶律淳为帝，史称北辽。这年年底，金军攻下燕京，北辽灭亡。至此辽朝的五京全部失陷。

  天祚帝在夹山一带收集残部，几次出兵都被金军击败。辽朝宗室耶律大石劝阻无效，于保大四年（1124 年）率部北走（另见“耶律大石西行与西辽建立”条）。保大五年（1125 年）二月，天祚帝在应州一带被金将完颜娄室俘获，辽朝灭亡。辽朝从耶律阿保机称帝（916 年）算起，历九帝，二百多年。

  辽朝灭亡后，金朝随即南下攻宋，两年后北宋也灭亡了（另见“靖康之变”条）。北方草原上的契丹政权从此结束，契丹人一部分随耶律大石西迁，大部分留在故地，归金朝统治。
sources: []
