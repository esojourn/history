name: 雅克萨之战与尼布楚条约
summary: 清军两次围攻雅克萨，1689 年中俄签订《尼布楚条约》划定东段边界。
body: |-
  十七世纪中期，俄国的势力向东扩张到西伯利亚和黑龙江流域，在黑龙江上游北岸修筑了雅克萨、尼布楚等城堡，向当地的达斡尔、鄂温克等部落征收毛皮税，与清军发生多次冲突。清朝忙于南方的战事，无暇顾及。

  三藩之乱平定后，康熙帝开始在黑龙江流域布置兵力，设置黑龙江将军，修建瑷珲城。康熙二十四年（1685 年）清军包围雅克萨，俄军投降撤走，清军拆毁城堡后撤回。不久俄军又回来重建了雅克萨城。康熙二十五年（1686 年）清军再次包围雅克萨，围困数月，城中俄军大量伤亡，俄国政府请求停战议和，清军解围。

  康熙二十八年（1689 年），清朝派索额图、佟国纲为代表，与俄国使臣戈洛文在尼布楚谈判，耶稣会士张诚、徐日升担任翻译。双方经过反复争论，在七月签订了《尼布楚条约》，规定以额尔古纳河、格尔必齐河和外兴安岭为两国的边界，外兴安岭以南、黑龙江流域属于中国；俄国拆毁雅克萨城；两国的人民持有护照可以往来贸易。条约的正式文本是拉丁文，另有满文、俄文本，界碑上刻有满、汉、蒙古、俄、拉丁五种文字。

  《尼布楚条约》是中国与欧洲国家签订的第一个边界条约，是在双方平等谈判的基础上签订的。此后一百七十年间中俄东段边界大体稳定，直到 1858 年、1860 年俄国通过《瑷珲条约》《北京条约》割占了黑龙江以北、乌苏里江以东的大片土地。
sources: []
