name: 孝文帝迁都洛阳
summary: 魏孝文帝以南伐为名率大军到洛阳，借群臣劝阻之机定都洛阳，次年正式迁都。
body: |-
  北魏自道武帝起定都平城。平城地处北边，气候寒冷，粮食要从远处运来，又常受柔然的威胁；而北魏统一北方后，统治的重心已在中原。孝文帝亲政后决心迁都洛阳，以便统治中原、推行汉化，同时为将来南进作准备。但多数鲜卑贵族留恋故土，反对南迁。

  据《魏书》和《资治通鉴》，孝文帝先与任城王元澄密谋，然后在太和十七年（公元 493 年）八月以南伐齐朝为名，率大军从平城出发。九月到达洛阳时，秋雨连绵不止，孝文帝仍穿着戎装、拿着马鞭，下令继续进军。群臣跪在马前苦苦劝阻，孝文帝说，兴师动众却无功而返，如何向后世交代；如果不南伐，就把都城迁到这里。群臣虽然不愿迁都，但更怕南伐，只得同意。于是他下令营建洛阳，派元澄回平城向留守的官员说明迁都的意图。

  太和十八年（494 年），孝文帝回到平城，召集群臣讨论迁都，逐一驳斥了反对的意见，十一月正式迁到洛阳。此后李冲等人在汉魏洛阳故城的基础上主持营建新都，原来留在平城的官员和鲜卑贵族也陆续南迁。

  迁都是孝文帝推行汉化改革的前提，大大加快了鲜卑与汉族的融合。但迁都之后，留在北边的六镇将士地位一落千丈，与洛阳的鲜卑贵族渐渐分化，这成了后来六镇之乱的根源之一。
sources: []
recalled:
  - 《魏书·高祖纪》
  - 《魏书·任城王澄传》
  - 《资治通鉴》卷一百三十八至一百三十九
