name: 克洛维受洗
aliases:
  - 法兰克人归信
summary: 法兰克王克洛维在兰斯受洗，法兰克人成为第一个接受尼西亚派信仰的日耳曼部族。
body: |-
  五世纪末，占据原罗马西部各省的日耳曼王国里，哥特人、汪达尔人、勃艮第人信的都是亚流派的基督教，与当地信尼西亚信经的罗马居民不同教会；高卢北部的法兰克人则还是异教徒。法兰克王克洛维约在 493 年娶了勃艮第公主克洛蒂尔德，她是尼西亚派的信徒。

  图尔的格列高利在《法兰克人史》卷 2 里讲了他归信的经过。王后一再劝说，他不肯听；头生的儿子受洗后夭折，他还埋怨是洗礼的缘故。后来他与阿勒曼尼人交战，军队眼看溃败，他举目向天呼求王后所信的基督，许愿若能得胜就信他、奉他的名受洗。阿勒曼尼人的王随即战死，敌军投降。王后暗中请来兰斯主教雷米吉乌教导他。受洗那天，据格列高利说，主教对他说：“低下头来，烧掉你从前所拜的，拜你从前所烧的。”同时受洗的有他的三千多名部下。

  《历史的轨迹》第七章把受洗定在公元 496 年圣诞节，并说克洛维在战场上看见十字架显在天空，经过与君士坦丁很相似。格列高利的书里没有天上的十字架；他自己倒是把克洛维比作“新的君士坦丁”。受洗的年份格列高利没有写明，496 年是从他的叙述推算出来的，现代学者另有 498、499、508 年等看法。

  《历史的轨迹》指出两点。其一，从前是个人归信基督，从这时起，国王信了，全族一同受洗。其二，法兰克人从一开始就与罗马主教所代表的教会一致，这在二百多年后显出重大的后果：八世纪罗马主教寻求保护时，找的就是法兰克人的王。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 图尔的格列高利《法兰克人史》卷 2 第 28—31 章
  - 维埃纳主教阿维图斯致克洛维的贺信
  - 兰斯主教雷米吉乌致克洛维的信
