name: 宋夏战争（三川口至庆历和议）
summary: 1040 至 1042 年西夏三次大败宋军，1044 年双方议和，史称庆历和议。
body: |-
  李元昊称帝后，宋朝拒绝承认，双方开战。康定元年（公元 1040 年）正月，元昊率军进攻延州，宋将刘平、石元孙率军救援，在延州城外的三川口中伏，全军覆没，两人被俘。宋朝随即任命夏竦为陕西经略安抚使，韩琦、范仲淹为副使，主持西北防务。韩琦主张集中兵力主动进攻，范仲淹主张修筑城寨、以守为主。

  庆历元年（1041 年）二月，韩琦派任福率军出击，任福在好水川中了西夏的埋伏，与部下多名将领一同战死。庆历二年（1042 年）闰九月，泾原路副都部署葛怀敏又在定川寨被西夏军包围，兵败身死。三战三败，宋朝朝野震动。这一时期，出身士兵的狄青在延州一带屡立战功，逐渐知名。辽朝也乘机向宋朝索取关南之地，宋朝派富弼出使，以增加岁币了结此事。

  西夏虽然连战连胜，但国小人少，连年用兵使国内物资匮乏，宋朝停止边境贸易后，西夏人日常所需的粮食、茶叶、布帛都很短缺。双方于是议和，庆历四年（1044 年）达成协议：元昊向宋称臣，宋册封他为夏国主；宋每年“赐”给西夏银、绢、茶，据《宋史·夏国传》，合计二十五万五千两、匹、斤；双方重开边境贸易。这次和议史称“庆历和议”。同年辽兴宗亲征西夏，在河曲被元昊击败。

  宋夏战争暴露了宋朝军队的弱点和财政的困难，成为庆历新政的直接背景（另见“庆历新政”条）。此后宋夏之间时战时和，宋神宗时又爆发了大规模的战争（另见“宋伐西夏与永乐城之战”条）。
sources: []
