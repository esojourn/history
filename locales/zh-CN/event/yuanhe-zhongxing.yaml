name: 元和中兴
summary: 唐宪宗在位时用兵削平割据藩镇，各镇一度都服从朝廷号令，史称“元和中兴”。
body: |-
  唐宪宗即位时，藩镇割据已经持续四十多年。他依靠德宗以来积累的财力和禁军，决心用武力改变这一局面。元和元年（公元 806 年），西川节度使韦皋死后其部将刘辟自立，并进攻东川，宪宗派高崇文讨平西川，刘辟被押到长安处死。次年镇海节度使李锜抗命，很快被部下擒获。这两次胜利使朝廷的威望有所恢复。

  此后的形势并不都很顺利。元和四年（809 年）成德节度使王士真死，其子王承宗自立，宪宗派宦官吐突承璀统兵讨伐，无功而返。元和七年（812 年）魏博的田兴（后赐名弘正）主动归附朝廷，河北的局势开始改变。元和十年（815 年）起朝廷讨伐淮西吴元济，主战的宰相武元衡被刺杀，宪宗仍然坚持用兵，任用裴度为相。元和十二年（817 年）李愬雪夜袭破蔡州，淮西平定（另见“平淮西”条）。

  淮西平定后，成德的王承宗献出德、棣二州，送儿子入朝做人质；元和十四年（819 年）淄青节度使李师道被部将刘悟杀死，淄青被分为三镇；幽州的刘总也表示愿意归附。天下藩镇一时都奉行朝廷的号令，这就是后人所说的“元和中兴”。宪宗还任用李吉甫、李绛、裴度等贤相，李吉甫主持编写了《元和国计簿》和《元和郡县图志》。

  但中兴为时短暂。宪宗晚年任用聚敛之臣皇甫镈，宠信宦官，服食丹药，元和十五年（820 年）被宦官杀害。长庆元年（821 年），幽州军士囚禁了朝廷派去的节度使张弘靖，成德军杀死了节度使田弘正，河朔三镇再度割据（另见“河朔三镇”条）。
sources: []
recalled:
