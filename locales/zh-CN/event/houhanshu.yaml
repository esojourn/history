name: 范晔著《后汉书》
summary: 范晔贬官宣城后，删取十几家东汉史书撰成《后汉书》，后来成为“前四史”之一。
body: |-
  东汉的历史在范晔之前已有许多人写过：东汉官修的《东观汉记》，三国两晋时谢承、薛莹、司马彪、华峤、谢沈、袁山松等人各有后汉书，袁宏又写了编年体的《后汉纪》。

  元嘉九年（公元 432 年），范晔被贬为宣城太守，在郁郁不得志中，以前人的各种后汉史书为基础，删繁补缺，撰写一部新的《后汉书》。他计划写十纪、十志、八十列传，纪和列传完成了，志还没有写成，他就在元嘉二十二年（445 年）因谋反案被杀。南朝梁的刘昭为此书作注时，把西晋司马彪《续汉书》中的八志补了进来，北宋时两书合刊，就是今天看到的一百二十卷本。

  范晔重视史论，各篇的序、论、赞写得很用心，他自己认为可与贾谊的《过秦论》相比。他新设了《党锢》《宦者》《文苑》《独行》《方术》《逸民》《列女》等类传，反映了东汉的社会特点，被后来的正史沿用。范书问世后，其他各家后汉书逐渐失传。它与《史记》《汉书》《三国志》合称“前四史”。
sources: []
recalled:
  - 《宋书·范晔传》
  - 范晔《狱中与诸甥侄书》
