name: "耶稣会成立"
summary: "1534 年罗耀拉与六位同伴在巴黎发愿，1540 年教皇批准成立耶稣会。"
body: |-
  罗耀拉在巴黎大学读书时，用自己的《神操》带领了几个同学。1534 年 8 月 15 日圣母升天节，他和法伯尔、沙勿略、莱内斯、萨尔梅隆、博瓦迪利亚、罗德里格斯共七人，在巴黎城外蒙马特山上的小堂里发愿：守贫穷、守贞洁，到耶路撒冷去为人灵工作；如果一年之内去不成，就到罗马听教皇差遣。当时只有法伯尔是司铎，由他主持弥撒。《历史的轨迹》第三十章把这件事说成罗耀拉与沙勿略两人在 1534 年组织了耶稣会，宗旨是领人归回天主教。

  1537 年他们在威尼斯会齐，一面在医院服侍病人，一面等船。那年威尼斯与土耳其人开战，没有船去圣地。他们受立为司铎，分头到意大利各城讲道，有人问起是哪个团体的，就说是“耶稣的伙伴”。1539 年他们在罗马商议了几个星期，决定组成一个修会，选一人为首领而服从他。

  1540 年 9 月 27 日教皇保罗三世颁布诏书批准，起初限定会士不超过六十人，几年后取消限额。次年罗耀拉被选为总会长。这个修会与旧有的修会不同：不住在与世隔绝的修道院里，不集体唱日课，没有特定的会衣；训练的时间很长；除通常的三愿之外，正式会士另发一愿，教皇派往何处就去何处。

  他们本没有打算专办教育，1548 年在西西里的墨西拿开了第一所招收外间学生的学校以后，各地的城市和君主纷纷来请，到罗耀拉去世时已有三十多所。该书把耶稣会与禁书目录、宗教裁判所并列为罗马教会复兴的三样武器，说由于耶稣会的努力，波兰、奥地利和德意志南部恢复了天主教，巴伐利亚、比利时和爱尔兰留在天主教之内，他们还在南北美洲做了许多传教工作。在亚洲，沙勿略到了印度和日本，后来的会士进入了中国。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
