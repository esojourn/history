name: 加低斯窥探迦南
summary: 十二个探子窥探迦南后百姓不肯进去，被判在旷野漂流四十年。
body: |-
  以色列人离开西奈山以后，到了巴兰旷野的加低斯，已经靠近迦南的南界。据《民数记》第 13 章，摩西按耶和华的吩咐，从十二个支派中各选一个首领去窥探迦南地，其中有犹大支派耶孚尼的儿子迦勒，和以法莲支派嫩的儿子何西阿，就是约书亚。《申命记》1:22–23 追述此事时说，打发人先去窥探是百姓提出来的，摩西以为美。

  探子从南地上去，到了希伯仑，又到以实各谷，在那里砍了一挂葡萄，两个人用杠抬着，还带了些石榴和无花果。过了四十天，他们回到加低斯，向会众报告说，那地果然是流奶与蜜之地，然而居民强壮，城邑坚固宽大，并且在那里看见了亚衲族人（13:21–29）。迦勒主张立刻上去得那地；同去的其余的人却说不能上去，说那地是吞吃居民之地，自己在那些身量高大的人面前就如蚱蜢一样（13:30–33）。

  当夜全会众哭号，埋怨摩西、亚伦，商量另立一个首领回埃及去。约书亚和迦勒撕裂衣服，劝百姓不要背叛耶和华，会众却说要拿石头打死他们（14:1–10）。耶和华要击杀百姓，摩西代求，百姓得了赦免，但耶和华宣告：凡被数点、从二十岁以外向他发怨言的，必倒毙在旷野，只有迦勒和约书亚得以进去；他们的儿女要在旷野飘流四十年，按窥探那地的四十日，一年顶一日（14:26–35）。报恶信的十个探子都遭瘟疫死了（14:36–38）。

  百姓听了甚是悲哀，次日清早擅自上山地去，摩西和约柜没有出营；亚玛力人和迦南人下来击打他们，一直杀退到何珥玛（14:39–45）。此后以色列人在旷野转了将近四十年，下一代才进入迦南。《诗篇》第 95 篇和新约《希伯来书》第 3—4 章都引这件事为鉴戒。
sources: []
recalled:
