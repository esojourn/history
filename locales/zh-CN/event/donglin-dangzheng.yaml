name: 东林党争
summary: 万历后期至天启年间东林党与反对派相争，东林人士遭阉党残酷迫害。
body: |-
  万历二十二年（1594 年）吏部文选司郎中顾宪成因会推阁臣忤旨被革职，回到家乡无锡。万历三十二年（1604 年）他与高攀龙等人重修宋代的东林书院，在那里讲学。他们在讲学中议论朝政、品评人物，主张整顿吏治、反对矿监税使，朝中一些官员与他们观点相近、互相声援，反对者称他们为“东林党”。

  与东林对立的有齐党、楚党、浙党、宣党、昆党等，这些派别多以籍贯结合。双方在立太子、京察（考核京官）、“梃击”“红丸”“移宫”三案等问题上反复争斗。万历后期，东林人士多被排斥出朝。泰昌、天启初年，东林党人因为在“移宫案”中护持天启帝有功，一度在朝中占据优势，叶向高、赵南星、杨涟、左光斗等人身居要职。

  天启年间宦官魏忠贤掌权，失势的其他派别官员纷纷投靠魏忠贤，形成“阉党”。天启四年（1624 年）杨涟上疏弹劾魏忠贤二十四大罪，双方矛盾公开化。次年魏忠贤借熊廷弼一案兴起大狱，杨涟、左光斗、魏大中、袁化中、周朝瑞、顾大章六人被逮捕，在诏狱中被拷打致死，史称“六君子”；天启六年（1626 年）又逮捕周起元、高攀龙、周顺昌、缪昌期等七人，高攀龙投水自尽，其他人死于狱中，史称“七君子”。逮捕周顺昌时，苏州市民数万人聚集抗议，颜佩韦等五人因此被处死，张溥后来写了《五人墓碑记》。阉党还拆毁了天下的书院，东林书院也被毁坏。

  崇祯帝即位后清除阉党，东林人士得到平反，但党争并没有停止，此后又与复社等结合，一直延续到南明。东林党人以气节相尚，敢于抨击时弊，但也有门户之见过深的批评。
