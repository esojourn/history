name: 霍光废立
summary: 汉昭帝死后无子，霍光先立昌邑王刘贺，二十七天后将其废黜，改立武帝曾孙为宣帝。
body: |-
  元平元年（公元前 74 年）四月，二十一岁的昭帝去世，没有儿子。武帝的儿子中当时只有广陵王刘胥在世，群臣都主张立他。据《汉书·霍光传》，霍光因为刘胥行为不合法度、当年武帝就不肯立他而心中不安；这时有人上书说，立君只看是否合适，不必拘于长幼。霍光便以昭帝皇后上官氏的名义，派人迎接武帝的孙子昌邑王刘贺。

  刘贺六月即位。据霍光等人后来的奏章，他在居丧期间饮酒作乐，与从昌邑带来的随从嬉戏，擅自动用宫中的器物和符节，二十七天里派使者向各官署征调索取达一千一百二十七次；昌邑的旧臣被大量安插到朝中。霍光与大司农田延年、车骑将军张安世商议废立。他在未央宫召集群臣，众人都惊愕不敢发言，田延年离席按剑，说谁后响应就斩谁，群臣于是都表示听从大将军的安排。丞相杨敞等联名上奏，年仅十五岁左右的上官太后在承明殿召见刘贺，由尚书令当面宣读奏章，下诏把他废黜。霍光亲自把他送回昌邑王在长安的府邸。

  刘贺从昌邑带来的二百余名臣属被处死。本传记他们被押赴刑场时在街市上呼喊：“当断不断，反受其乱。”后人据此推测，昌邑王一方或许也曾谋划除掉霍光。刘贺究竟是确实荒唐，还是因为想摆脱霍光的控制而被废，史料只有霍光一方的说法，难以断定。

  帝位空缺期间，丙吉向霍光推荐了流落民间的武帝曾孙刘病已，说他已经十八九岁，通晓经术，品行端正。七月，霍光与群臣奏请太后，把他迎入宫中，先封阳武侯，随即立为皇帝，就是汉宣帝。霍光继续执政，直到六年后去世。
sources: []
recalled:
  - 《汉书·霍光金日磾传》
  - 《汉书·武五子传》
  - 《汉书·宣帝纪》
