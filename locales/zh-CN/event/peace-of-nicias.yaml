name: 尼西阿斯和约
summary: 公元前 421 年雅典与斯巴达订立五十年和约，结束战争的头十年。
body: |-
  开战十年，双方都有求和的理由。斯巴达急于换回在斯法克特里亚被俘的公民，又担心与阿尔戈斯的三十年和约即将期满；雅典在德利翁和安菲波利斯接连失利，盟邦不稳。克里昂和伯拉西达战死后，主和的一派在两边都占了上风。公元前 421 年春，酒神节刚过，和约订立，雅典一方的主要谈判者是尼西阿斯，后人因此称为《尼西阿斯和约》。

  修昔底德抄录了和约的全文。和约为期五十年；双方交还战争中夺取的地方和俘虏：斯巴达交还安菲波利斯，雅典交还皮洛斯、库忒拉等地并释放俘虏；色雷斯沿海的若干城邦保持自治，按阿里斯提德当年核定的数额向雅典纳贡；德尔斐的神庙独立自主；争端以仲裁和誓约解决；每年双方重新立誓。

  和约从一开始就没有被完全履行。彼奥提亚、科林斯、厄利斯和麦加拉拒绝签字。安菲波利斯的居民不肯回到雅典治下，斯巴达没有强制移交，雅典便也不交出皮洛斯。斯巴达为安抚雅典，又与它单独订立了五十年的攻守同盟，这使斯巴达原来的盟邦更加不满。

  在雅典，年轻的亚西比德因为斯巴达人谈判时没有通过他而怀恨，据修昔底德，他设计使来访的斯巴达使者在公民大会上出丑，促成雅典在前 420 年与阿尔戈斯、曼提尼亚、厄利斯结盟。前 418 年斯巴达在曼提尼亚击败这个同盟，雅典有部队参战，但双方都不宣布和约失效。修昔底德认为，把中间这几年算作和平是不对的，从开战到雅典投降应看作一场延续二十七年的战争。前 414 年雅典舰队袭击拉科尼亚沿岸，和约公开破裂。
sources: []
