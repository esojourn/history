name: 奥托一世加冕
aliases:
  - 神圣罗马帝国的开端
summary: 962 年教皇约翰十二世在罗马为德意志国王奥托一世加冕为皇帝。
body: |-
  查理曼的帝国在九世纪分裂以后，皇帝的称号落在意大利的小诸侯手里，924 年以后无人再用。《历史的轨迹》第十一章说，意大利没有中央政府，诸侯互相攻伐，谁控制了罗马谁就能指派教皇，十世纪的教皇地位落到了最低点。

  960 年教皇约翰十二世受意大利王贝伦加尔二世逼迫，派人越过阿尔卑斯山向德意志国王奥托一世求援。奥托在 955 年击败马扎尔人之后威望正高。他在 961 年秋南下，贝伦加尔退入山中的堡垒。962 年 2 月 2 日，约翰十二世在圣彼得教堂为奥托和王后加冕。

  十多天后奥托颁布特许状，确认丕平和查理曼献给教皇的土地，同时规定：教皇由罗马的教士和民众选出，但就任之前要当着皇帝的使者宣誓效忠。次年约翰改与贝伦加尔一方联络，奥托回师罗马，召开会议把他废掉，另立一位平信徒出身的官员为教皇，并要罗马人发誓不经皇帝同意不选教皇。

  《历史的轨迹》说，这使教皇制跨进了一个新的时期：帝国恢复了，并从此与德意志结下不解之缘，直到 1806 年被拿破仑终结；此前的教皇都是意大利人，此后皇帝把日耳曼人、法兰西人放上了教皇的位置。该书同时说明奥托的权力靠的是指派主教和修道院院长，这就是后来引起大争执的“平信徒授衣礼”。

  此后三百年，德意志的国王要到罗马去才能加冕为皇帝，一次次带兵南下，卷进意大利的事务；教皇摆脱了罗马贵族，又落在皇帝手里。“神圣罗马帝国”这个国号是十二世纪以后才逐渐使用的。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十一章“教会被政府控制” https://wellsofgrace.com/books/spiritual/2000years/html/chapter13.html"
recalled:
  - 克雷莫纳的利乌特普兰德《奥托史》
  - 962 年《奥托特许状》
  - 维杜金德《萨克森人史》卷 3
