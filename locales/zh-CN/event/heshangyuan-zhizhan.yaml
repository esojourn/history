name: 和尚原之战
summary: 1131 年吴玠、吴璘兄弟据守和尚原，大败完颜宗弼，保住了四川门户。
body: |-
  富平之战后陕西大部分落入金人之手，吴玠收集数千残兵，扼守大散关以东的和尚原，这里是从关中进入汉中、四川的要道。绍兴元年（公元 1131 年）五月，金军进攻和尚原，被吴玠击退。

  同年十月，完颜宗弼亲自率领大军从宝鸡一带进攻和尚原。吴玠与弟弟吴璘利用山地险要，挑选强弓劲弩手分番轮流射击，称为“驻队矢”，连发不绝，金军伤亡惨重；又派兵截断金军的粮道，在金军撤退时设伏夹击，大败金军。据《宋史·吴玠传》，宗弼身中流矢，剃去胡须才得以逃脱。这是金军南下以来遭受的一次重大挫败。绍兴四年（1134 年）宗弼又率大军进攻仙人关，再次被吴玠兄弟击退。此后金军很少再大举进攻四川，川陕防线得以稳固。
sources: []
recalled:
  - 《宋史·吴玠传》
  - 《金史·宗弼传》
