name: 柏乡之战
summary: 911 年晋军在柏乡大败后梁军，后梁精锐损失殆尽，晋国开始在河北占据优势。
body: |-
  开平四年（公元 910 年），朱温想吞并依附于晋的成德（镇州）、义武（定州）两镇，派兵进驻深州、冀州。成德节度使王镕、义武节度使王处直向晋求援，晋王李存勖亲率大军东出，与后梁军在柏乡隔着野河对峙。后梁军由大将王景仁统领，以步兵为主，盔甲鲜明，兵势强盛。

  李存勖年轻气盛，想立即决战。大将周德威认为梁军人多而精锐，晋军以骑兵见长，在狭窄的地方不利于骑兵驰骋，主张退到高邑一带，引梁军出营，以骑兵往来骚扰，使其疲惫，然后再战。李存勖起初不以为然，后来接受了他的建议。

  乾化元年（911 年）正月，晋军先以骑兵挑战，引梁军出营追击，双方从早晨相持到午后，梁军又饥又累，开始后撤。晋军乘机全线出击，梁军大败，被杀和溃散的人很多。据《资治通鉴》，梁军龙骧、神捷等精锐部队几乎全军覆没，主将王景仁只带着少数骑兵逃回。次年（912 年），朱温亲自领兵北上进攻河北，在蓨县一带被晋军的小股骑兵惊扰，仓皇撤退，回去后病情加重，不久便被儿子朱友珪杀死。

  柏乡之战是晋梁争霸的转折点。此后成德、义武两镇完全倒向晋国，后梁在河北的势力大为削弱，晋军开始掌握主动。两年后，晋国又灭了幽州的刘守光（另见“晋灭燕”条）。
sources: []
recalled:
  - 《旧五代史·唐书·周德威传》
  - 《新五代史·唐本纪·庄宗》
