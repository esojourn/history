name: 前三头同盟
summary: 庞培、克拉苏、恺撒三人私下结盟，互相支持，绕开元老院支配罗马政局。
body: |-
  公元前 60 年庞培、克拉苏和恺撒三人结成的私人政治同盟。“前三头同盟”是近代的叫法，套用了后来屋大维等人“三人团”的名称；当时它没有任何法律地位，起初还是保密的。

  三个人各有所求而各自受阻。庞培前 62 年从东方回来，遣散了军队，要求元老院一揽子批准他在东方所作的安排，并给他的老兵分配土地；卢库卢斯、小加图等人坚持逐条审议，拖了两年。克拉苏代表承包亚细亚税收的骑士公司，他们因出价过高要求减免，被小加图阻止。恺撒前 60 年从西班牙回来，想同时举行凯旋式和竞选执政官，请求缺席登记，小加图用长篇发言把会议拖到散会，他只好放弃凯旋式。庞培与克拉苏一直不和，恺撒把两人拉到了一起。他也邀请过西塞罗，西塞罗没有答应。

  前 59 年恺撒任执政官。他先在元老院提出土地法，小加图再次拖延，他便直接交人民大会；庞培和克拉苏公开表态支持。同僚执政官比布卢斯在广场上受辱，此后闭门不出，只发公告称每天都在观察天象、一切公务无效，据苏维托尼乌斯，时人戏称这一年是“尤利乌斯和恺撒执政之年”。庞培在东方的安排获得批准，包税人得到减免。保民官瓦提尼乌斯的法律给了恺撒山南高卢和伊利里库姆五年，元老院又加上山北高卢。庞培娶了恺撒的女儿尤利娅。

  同盟几度不稳。前 56 年三人在卢卡会晤，约定庞培和克拉苏出任前 55 年的执政官，然后分别得到西班牙和叙利亚五年，恺撒在高卢的任期也延长五年。前 54 年尤利娅死于难产，前 53 年克拉苏死于卡莱，剩下的两人之间没有了缓冲。前 52 年庞培单独出任执政官，逐渐与小加图一派接近。前 49 年内战爆发。

  据普鲁塔克，小加图说，毁掉共和国的不是恺撒与庞培的反目，而是他们的结交。
sources: []
recalled:
  - 普鲁塔克《恺撒传》第 13—14 章、《庞培传》第 46—53 章、《克拉苏传》第 14—15 章
  - 苏维托尼乌斯《神圣的尤利乌斯传》第 19—24 章
  - 阿庇安《内战史》卷二第 8—18 章
  - 西塞罗《致阿提库斯书》卷二
