name: 刘备称帝
summary: 公元 221 年四月，刘备在成都即皇帝位，国号仍为汉，史称蜀汉。
body: |-
  公元 220 年十月曹丕代汉称帝。据《三国志·蜀书·先主传》，消息传到益州时，有传言说汉献帝已经遇害，汉中王刘备于是为他发丧、穿孝服，追谥为“孝愍皇帝”。实际上献帝被封为山阳公，一直活到 234 年。

  此后益州各地纷纷上报祥瑞，群臣上书，说汉朝的帝位不可空缺，劝刘备即位。本传收录了许靖、糜竺、诸葛亮等人的劝进表文。也有人表示反对：据《费诗传》，费诗上疏说大敌未灭而先自立，恐怕会让人心生疑惑，因此被降职。

  章武元年（221 年）四月，刘备在成都武担山之南即皇帝位，国号仍称“汉”，表示接续汉朝的统绪，改年号为章武。他任诸葛亮为丞相，许靖为司徒，立吴氏为皇后，儿子刘禅为太子。后世为了与西汉、东汉相区别，把这个政权称为“蜀汉”；陈寿在晋朝写《三国志》，以魏为正统，称之为“蜀”。

  称帝之后，刘备首先要做的是向孙权报夺取荆州、杀害关羽之仇。同年七月他亲率大军东征，次年在夷陵大败。蜀汉立国共四十三年，只传了刘备、刘禅两代，公元 263 年为魏所灭。
sources: []
recalled:
  - 《三国志·蜀书·先主传》
  - 《三国志·蜀书·霍王向张杨费传》（费诗）
