name: 商鞅变法
summary: 商鞅两次变法，奖励耕战、推行县制、废井田，秦国由此富强。
body: |-
  秦孝公即位后下令求贤，商鞅从魏国来到秦国，以富国强兵之术打动孝公。据《史记·商君列传》，孝公召集群臣讨论变法，旧贵族甘龙、杜挚认为“法古无过，循礼无邪”，商鞅反驳说“治世不一道，便国不法古”，孝公支持商鞅。

  公元前 356 年，商鞅以左庶长的身份推行第一次变法。为取信于民，他在国都南门立三丈之木，悬赏五十金给搬到北门的人，并当即兑现。新法的主要内容有：把百姓按五家、十家编为什伍，互相监督，一家有罪，其余连坐；鼓励耕织，生产粟帛多的免除徭役，因懒惰而贫困的没为官奴；按军功授予爵位，宗室没有军功的不得列入宗籍；禁止私斗。太子犯法，商鞅处罚了太子的两位师傅。

  公元前 350 年，秦国迁都咸阳，商鞅推行第二次变法：把小乡邑合并为县，由国君直接任命县令、县丞；“为田开阡陌封疆”，废除井田，按田亩征收赋税；统一度量衡；禁止父子兄弟同室而居，促使大家庭分为小家庭。

  据《史记》，新法推行十年，“道不拾遗，山无盗贼，家给人足，民勇于公战，怯于私斗”。商鞅本人在孝公死后被车裂，但新法一直延续下来。商鞅变法是战国时期最彻底的变法，奠定了秦国此后一百多年强盛的基础，也开启了以郡县制和编户齐民为特征的中央集权国家的先河。
sources: []
recalled:
  - 《史记·商君列传》
  - 《史记·秦本纪》
  - 《商君书·更法》
