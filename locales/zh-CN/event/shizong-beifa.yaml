name: 周世宗北伐
summary: 959 年周世宗亲征契丹，收复瓦桥、益津、淤口三关和瀛、莫二州，因病回师。
body: |-
  后周取得淮南之后，周世宗把目光转向北方，准备收复后晋割给契丹的燕云十六州。显德六年（公元 959 年）三月，他亲自率军北伐，从沧州出发，水陆并进，进入契丹境内。

  契丹在这一带的守将多是汉人，纷纷不战而降。后周军先后收复了宁州，瓦桥关、益津关、淤口关三关，以及瀛州、莫州，关南之地全部归入后周。据史书，这次北伐从出兵到收复关南，前后四十多天，几乎没有经过大的战斗。后周在瓦桥关设置雄州，在益津关设置霸州。

  周世宗打算乘胜进攻幽州，召集诸将商议，将领们大多认为应当见好就收。就在此时，世宗突然病倒，只好下令回师。六月，他在开封去世。此后北宋几次北伐，都没能收复幽州，关南的瀛、莫二州成为此后宋辽对峙的前线。
sources: []
recalled:
  - 《旧五代史·周书·世宗纪》
  - 《辽史·穆宗本纪》
  - 《资治通鉴》卷二百九十四
