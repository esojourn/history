name: 宋高宗即位
summary: 1127 年五月赵构在应天府即位，改元建炎，南宋由此开始。
body: |-
  靖康二年（公元 1127 年）四月，金军押着宋徽宗、宋钦宗和后妃、宗室、大臣北撤，北宋灭亡（另见“靖康之变”条）。金人临走前立北宋旧臣张邦昌为“楚帝”，张邦昌自知不得人心，金军一走便迎请哲宗的废后孟氏（元祐皇后）垂帘听政，并派人向身在河北、手握兵马的康王赵构表示归政。当时宗室中只有赵构在外，宗泽等人和各地官员纷纷劝他即位。

  五月初一，赵构在南京应天府（今河南商丘）即皇帝位，改元建炎，是为宋高宗，后世以此作为南宋的开始。他起用主战的李纲为相，以宗泽为东京留守，张邦昌先被贬，不久被赐死。

  李纲主张整顿军政、坚守河北和中原，但他任相仅七十多天就被罢免，主张南撤的黄潜善、汪伯彦掌握了朝政。这年冬天，高宗离开应天府南下扬州，宗泽二十多次上书请他回到开封，都没有结果。此后金军连年南侵，高宗一路退到江南，建炎三年（1129 年）升杭州为临安府，绍兴八年（1138 年）正式以临安为行在。南宋虽以临安为实际的都城，名义上始终称为“行在”，表示不忘恢复中原。

  南宋立国一百五十多年，北方先后与金、蒙古（元）对峙，疆域以淮河、秦岭为界，经济、文化重心进一步南移到江南。
sources: []
recalled:
  - 《宋史·高宗本纪》
  - 《建炎以来系年要录》
  - 《三朝北盟会编》
