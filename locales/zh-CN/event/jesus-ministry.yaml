name: 耶稣传道
summary: 耶稣受洗后在加利利和犹太各地传道、教训人、选立十二使徒。
body: |-
  据《路加福音》3:1–3，该撒提庇留在位第十五年，施洗约翰出来在约旦河一带传悔改的洗礼。耶稣从加利利来受了他的洗，随后在旷野受试探。《路加福音》3:23 说耶稣开头传道时年纪约有三十岁。约翰下监以后，耶稣来到加利利，宣讲神的国近了，叫人悔改、信福音（可 1:14–15）。

  他离开拿撒勒，住在加利利海边的迦百农，在各城各乡的会堂里教训人。他在海边呼召了打鱼的西门彼得和安得烈、西庇太的儿子雅各和约翰，又从税关上呼召了马太，后来从门徒中选立十二个人，称他们为使徒（可 3:13–19）。《马太福音》第 5—7 章记他在山上的教训，第 13 章集中记了撒种、芥菜种等比喻；好撒玛利亚人和浪子的比喻只见于《路加福音》（第 10 章、第 15 章）。福音书记他医治病人、赶鬼、平静风浪。抹大拉的马利亚等几个妇女与他同行，用自己的财物供给他和门徒（路 8:1–3）。

  施洗约翰被希律处死之后，福音书记了五个饼、两条鱼使五千人吃饱的事，这是四卷福音书都记载的。在该撒利亚腓立比境内，彼得认耶稣是基督，耶稣从此向门徒预言自己要在耶路撒冷受害；随后有山上改变形像一事（太 16—17 章）。他多次与法利赛人和文士就安息日、洁净的规矩等事辩论。《约翰福音》所记多在犹太和耶路撒冷：夜里来见他的尼哥底母、撒玛利亚井旁的妇人、伯大尼的拉撒路复活，都只见于这卷书。最后他上耶路撒冷过逾越节，在那里被捕受难。

  传道历时多久，福音书没有明说。《马太福音》《马可福音》《路加福音》只明确提到最后一次逾越节；《约翰福音》提到三次逾越节（2:13；6:4；11:55），通常据此推算为两年多到三年多。事件的先后各书也有不同，例如洁净圣殿，约翰记在开头，其余三卷记在末后。本条的起止年是约数，按受难在公元 30 年推定；若取 33 年一说，则相应后移。
sources: []
recalled:
  - 《马太福音》第 3—25 章
  - 《马可福音》第 1—13 章
  - 《路加福音》第 3—21 章
  - 《约翰福音》第 1—12 章
