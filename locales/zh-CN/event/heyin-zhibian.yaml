name: 河阴之变
summary: 尔朱荣以替孝明帝报仇为名进军洛阳，把胡太后和幼主沉河，在河阴屠杀王公百官。
body: |-
  北魏孝明帝长大后，与临朝的母亲胡太后矛盾日深，暗中召并州的尔朱荣领兵入京。武泰元年（公元 528 年）二月，孝明帝突然死去，史书多说是胡太后毒死的。胡太后先立了孝明帝刚出生的女儿，谎称是皇子，不久又改立三岁的宗室元钊。

  尔朱荣以为孝明帝报仇为名，从晋阳起兵南下。据《魏书·尔朱荣传》，他按照鲜卑的旧俗，用铜为几位宗室诸王铸像来占卜谁该当皇帝，只有长乐王元子攸的像铸成了。四月，他在河阳拥立元子攸为帝，即孝庄帝。胡太后派去抵御的军队纷纷溃散。

  尔朱荣进入洛阳之前，派人把胡太后和幼主元钊沉入黄河。随后他以迎接新君为名，把朝中百官召集到河阴的陶渚，指责他们贪婪暴虐、不能辅佐朝廷，纵兵围杀，自丞相高阳王元雍、司空元钦以下的王公大臣都被杀死，孝庄帝的兄弟也被杀害。死者人数，《魏书·尔朱荣传》说一千三百余人，《资治通鉴》说两千余人。据记载，尔朱荣事后还一度想自立为帝，铸像占卜四次都没有成功，才打消了念头。

  河阴之变使北魏朝廷的宗室和官员几乎被一扫而空，不少人逃往南方投奔梁朝。此后尔朱荣回到晋阳遥控朝政，北魏中央的权威彻底崩溃。两年后孝庄帝刺杀尔朱荣，尔朱荣的侄子尔朱兆又杀了孝庄帝，高欢随即起兵讨伐尔朱氏，北魏很快分裂为东西两部分。
sources: []
recalled:
  - 《魏书·尔朱荣传》
  - 《资治通鉴》卷一百五十二
