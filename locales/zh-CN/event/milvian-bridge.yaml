name: 米尔维安桥战役
aliases:
  - 米里维桥之役
summary: 公元 312 年君士坦丁在罗马城北击败马克森提乌斯，成为帝国西部的主人。
body: |-
  公元 306 年以后，罗马帝国西部有两位互不相容的皇帝：君士坦丁据有不列颠、高卢和西班牙，马克森提乌斯据有意大利和北非。312 年春天，君士坦丁先发制人，率军越过阿尔卑斯山，在都灵和维罗纳连胜两仗，秋天进抵罗马。

  马克森提乌斯原本打算凭城墙固守，10 月 28 日却出城迎战，把军队摆在台伯河北岸，背靠米尔维安桥和临时搭的浮桥。《历史的轨迹》第四章说两军在罗马以北的萨克沙卢拉相遇，马克森提乌斯的兵力是对方的三倍，军中有禁卫军。君士坦丁的骑兵冲垮了对方的阵线，败兵挤上浮桥，浮桥断裂，马克森提乌斯连人带马落水淹死。

  关于这一仗之前君士坦丁所见的异象，有两种早期记载。拉克坦提乌斯在几年后写道，君士坦丁在梦中受到指示，把一个代表基督的记号画在士兵的盾牌上。优西比乌在君士坦丁死后写的传记里说，皇帝曾起誓告诉他，自己在午后的天空看见太阳上方有光的十字架和“靠此得胜”的字样，当夜基督在梦中吩咐他照样制作军旗。《历史的轨迹》采用的是后一种说法。

  第二天君士坦丁进入罗马，解散了一向支持马克森提乌斯的禁卫军。元老院为他建的凯旋门在 315 年落成，铭文说他得胜是“出于神性的感动”，没有指明是哪一位神。君士坦丁本人把这次胜利归于基督徒的神，第二年就在米兰与李锡尼约定给基督徒自由。《历史的轨迹》称这一仗是世界史上有决定意义的战役之一。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四章“教会全面得胜” https://wellsofgrace.com/books/spiritual/2000years/html/chapter05.html"
recalled:
  - 拉克坦提乌斯《论迫害者之死》第 44 章
  - 优西比乌《君士坦丁传》卷 1 第 27—40 章
  - 优西比乌《教会史》卷 9 第 9 章
  - 君士坦丁凯旋门铭文
