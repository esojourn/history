name: 牛李党争
summary: 唐后期以牛僧孺、李宗闵为首和以李德裕为首的两派官僚长期互相倾轧，前后约四十年。
body: |-
  唐宪宗至唐宣宗年间，朝中官员分成两派，一派以牛僧孺、李宗闵为首，称为“牛党”；一派以李德裕为首，称为“李党”，两派互相排挤，一派当政就把另一派的人贬出朝廷，前后延续约四十年，史称“牛李党争”。

  关于党争的起因，史书通常追溯到元和三年（公元 808 年）的制科考试：牛僧孺、李宗闵在策文中批评时政，宰相李吉甫（李德裕之父）向唐宪宗哭诉，考官被贬，牛、李二人也长期不得升迁。长庆元年（821 年）又发生了科举复试案：李宗闵等人的亲属在礼部考试中及第，翰林学士李德裕、李绅等人揭发考试不公，唐穆宗下令复试，大批及第者被黜落，李宗闵被贬，双方的矛盾从此公开化。

  此后两派在许多问题上针锋相对。大和五年（831 年），西川节度使李德裕接受了吐蕃维州守将的投降，宰相牛僧孺主张归还，唐文宗听从了牛僧孺，后来又认为处置失当。文宗曾感叹去掉河北的藩镇容易，去掉朝中的朋党困难。唐武宗时李德裕执政六年，牛党的人都被贬斥；唐宣宗即位后反过来重用牛党，李德裕被一贬再贬，大中三年（849 年）死在崖州，党争才告结束。夹在两派之间的人也受到牵连，诗人李商隐因为受过令狐楚的提携又娶了王茂元的女儿，被双方都看不起，仕途坎坷。

  对于两派的性质，学者看法不一。陈寅恪认为牛党多出身科举的新兴寒族，李党多是北朝以来的山东旧门第，两派的对立反映了不同社会阶层的冲突；也有学者认为两派的成员出身交错，主要是个人恩怨和权位之争，史书中的记载还带有两派后来互相攻击的色彩。
