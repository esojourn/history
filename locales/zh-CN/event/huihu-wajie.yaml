name: 回鹘汗国瓦解
summary: 840 年黠戛斯攻破回鹘都城，回鹘汗国瓦解，部众分几路西迁或南下。
body: |-
  回纥在唐德宗时改称回鹘，九世纪初仍是漠北的强国。到唐文宗开成年间，回鹘内部为争夺汗位不断发生内讧，又遇上大雪和疫病，据《新唐书》，羊马大批死亡。开成五年（公元 840 年），回鹘的将领句录莫贺引北方的黠戛斯骑兵（据《新唐书》，有十万骑）攻破回鹘都城，杀死可汗，焚毁牙帐，存在近百年的回鹘汗国就此瓦解。

  回鹘部众分几路离散：一支向西投奔葛逻禄，后来在中亚参与建立了喀喇汗王朝；一支迁往天山东部的高昌、北庭一带，后来建立了高昌回鹘；一支进入河西走廊，后来形成甘州回鹘；还有乌介可汗率领的十几万人南下到唐朝的北部边境，挟持着和亲到回鹘的唐朝太和公主，要求唐朝借给城池和粮食，并劫掠云州、朔州一带。

  唐武宗和宰相李德裕一面赈济降附的回鹘部众，一面调兵防御。会昌三年（843 年），河东节度使刘沔派大将石雄夜袭乌介可汗的营地，在杀胡山大破回鹘，迎回了太和公主。乌介可汗逃走，会昌六年（846 年）被部下所杀。唐朝随后也禁止了借回鹘势力传入的摩尼教。此后漠北再没有出现统一的强大游牧政权，直到契丹兴起。
sources: []
recalled:
  - 《旧唐书·回纥传》
  - 《新唐书·回鹘传》
  - 《资治通鉴》卷二百四十六至二百四十八
  - 李德裕《会昌一品集》
