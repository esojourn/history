name: 扫罗受膏为王
summary: 以色列人求立王，撒母耳膏立便雅悯人扫罗，士师时代结束。
body: |-
  据《撒母耳记上》第 8 章，撒母耳年纪老迈，立两个儿子在别是巴作士师，他们却贪图财利，收受贿赂，屈枉正直。以色列的长老聚集到拉玛见撒母耳，求他立一个王治理他们，像列国一样。撒母耳不喜悦这事，就祷告耶和华；耶和华吩咐他依从百姓的话，并把将来王怎样管辖他们预先告诉他们：王必征用他们的儿女、田地和牲畜的十分之一。百姓仍然要立王。

  第 9—10 章记载，便雅悯人基士的儿子扫罗出门寻找父亲丢失的驴，来到撒母耳所在的城。耶和华前一日已经指示撒母耳，于是撒母耳接待扫罗，次日清早把膏油倒在他头上。随后撒母耳招聚百姓到米斯巴，按支派、宗族掣签，掣出便雅悯支派玛特利族基士的儿子扫罗；他藏在器具中间，众人把他领出来，他比众民高过一头，百姓就呼喊愿王万岁。撒母耳把国法对百姓说明，写在书上，放在耶和华面前（10:25）。当时也有人藐视扫罗，不给他送礼物。

  第 11 章记载，亚扪人拿辖围困基列雅比，要剜出城中各人的右眼作为立约的条件。扫罗听见这消息，把一对牛切成块子传送以色列全境，招聚众人；据 11:8，在比色数点，以色列人有三十万，犹大人有三万。他把百姓分为三队，在晨更的时候攻入亚扪人的营，击败了他们。撒母耳就带众人到吉甲，在耶和华面前立扫罗为王，献平安祭，这在经文里称为“立国”（11:14–15）。第 12 章是撒母耳在这时对以色列众人所作的陈述。

  从此以色列由士师治理改为由王治理，撒母耳仍以先知的身份向王传话。圣经没有给出这件事的公元纪年，约公元前 1050 年是通行的约数。有学者认为，第 8—12 章里并存着对立王一事态度不同的几种记述。
sources: []
recalled:
  - 《撒母耳记上》第 8—12 章
