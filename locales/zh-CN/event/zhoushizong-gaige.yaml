name: 周世宗改革
summary: 周世宗整顿禁军、均定田赋、修订刑律、疏通漕运，为北宋统一奠定基础。
body: |-
  周世宗柴荣在位不到六年（公元 954—959 年），推行了一系列改革，目标是富国强兵、统一天下。

  军事方面，高平之战后，他斩杀临阵脱逃的将领，淘汰禁军中的老弱，命各地挑选勇武之士送到京城，由赵匡胤等人从中选拔，编为殿前诸班，禁军的战斗力大为增强，地方节度使的兵力则相对削弱。北宋初年强干弱枝的格局，正是在此基础上形成的。

  经济方面，他招抚流亡的农民，规定逃户的田地可以由别人耕种，原主回来时按年限归还一部分；显德五年（958 年），他读了唐代元稹的《均田表》，命人据此制成《均田图》颁发各地，派使臣到各州县核实田亩、均定赋税。他还疏浚汴河等河道，使江淮的漕运直达开封；下令限制佛教，废除大量寺院，收民间铜器铸钱（另见“周世宗灭佛”条）；扩建开封外城（另见“开封扩建外城”条）。

  政治和法制方面，他命人重新修订刑律，编成《大周刑统》，于显德五年颁行；整顿科举，亲自复试及第的进士，黜落不合格的人；鼓励大臣直言，命群臣上书讨论治国之道和统一方略，王朴的《平边策》就是在这种情况下写成的。

  周世宗的改革使后周成为五代中最有作为的朝代。他去世后半年，赵匡胤代周建宋，北宋继承了后周的军队、制度和统一方略，很快结束了分裂局面。
sources: []
recalled:
  - 《旧五代史·周书·世宗纪》
  - 《新五代史·周本纪·世宗》
  - 《资治通鉴》卷二百九十二至二百九十四
