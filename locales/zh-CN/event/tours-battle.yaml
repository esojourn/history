name: 图尔之战
aliases:
  - 普瓦捷之战
  - 都尔之役
summary: 732 年查理·马特在图尔与普瓦捷之间击退阿拉伯军队。
body: |-
  阿拉伯人占领西班牙后，多次越过比利牛斯山进入高卢南部。732 年，安达卢斯总督阿卜杜勒·拉赫曼率大军北上，在加龙河一带打败阿基坦公爵，洗劫了波尔多，继续向卢瓦尔河进发，那里的图尔有圣马丁的陵墓和教堂，十分富有。阿基坦公爵向法兰克的宫相查理求援。

  两军在图尔与普瓦捷之间相遇，时间一般定在 732 年 10 月，也有学者主张是 733 年，确切的地点没有定论。《历史的轨迹》第八章说，双方对峙了七天，谁也不敢先动；到一个星期六终于交战，阿拉伯军大半是骑兵，法兰克军全是步兵，列队成墙，不留间隙，阿拉伯骑兵冲击了一整天都攻不破。入夜各自回营。第二天法兰克人再度列阵，发现对方的营帐里只剩下掠来的财物，人已连夜撤走。二十多年后一位西班牙基督徒写的编年史也说，北方人像墙一样屹立不动，阿拉伯统帅战死。双方的兵力和伤亡，后世所传的数字都不可靠。

  该书把这一仗与 451 年匈人在高卢战败相提并论，称它是伊斯兰扩张的“最高水位线”：曾是异教蛮族的法兰克人为基督教保全了西欧。查理因此被称为“马特”，即“铁锤”。

  今天的史家对这一仗的分量有不同估计。有人认为阿卜杜勒·拉赫曼的目的只是劫掠，阿拉伯人此后还在高卢南部活动了二十多年，直到 759 年丕平收复纳博讷才退回山南；同一时期阿拉伯帝国内部的动乱和 717 至 718 年围攻君士坦丁堡的失败，对遏止扩张的作用可能更大。可以确定的是，这次胜利大大提高了查理家族的威望，为他的儿子丕平取得王位铺了路。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第八章“教会丧失领域” https://wellsofgrace.com/books/spiritual/2000years/html/chapter10.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十七章“教会发起十字军运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter19.html"
