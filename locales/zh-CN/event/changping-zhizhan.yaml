name: 长平之战
summary: 前 260 年白起在长平大败赵括，坑杀降卒，赵国从此一蹶不振。
body: |-
  公元前 262 年，秦军攻占韩国的野王，切断了韩国上党郡与本土的联系。上党郡守冯亭不愿降秦，把上党十七城献给赵国。赵孝成王接受了，派廉颇率军驻守长平，与秦军对峙。

  廉颇在几次小规模交战失利后，筑起营垒坚守不出，秦军远道而来，粮草供应困难，双方相持了两年多。据《史记·廉颇蔺相如列传》和《白起王翦列传》，秦国派人到邯郸散布流言，说秦国只怕赵括为将，廉颇容易对付，而且就要投降了。赵王本来就不满廉颇坚守不战，于是不顾蔺相如的劝阻和赵括母亲的上书，以赵括代替廉颇。秦国得知后，暗中以白起为上将军，并下令泄露此事的人处斩。

  公元前 260 年，赵括到任后改变廉颇的部署，主动出击。白起佯装败退，诱赵军追至秦军营垒之下，又派奇兵切断赵军的退路和粮道，把赵军分割包围。秦昭王亲自到河内，给当地百姓赐爵一级，征发十五岁以上的男子全部开赴长平，阻断赵国的援军和粮食。赵军断粮四十六天，士兵相互残杀为食，赵括率精兵突围，被秦军射死，赵军四十余万人投降。白起认为赵卒反复无常，怕留下来生乱，把降卒全部坑杀，只放回年幼的二百四十人。

  《史记》说长平之战前后秦军斩首俘虏共四十五万人。1995 年在山西高平永录村发现了埋有大量尸骨的长平之战遗址，证实了战争的惨烈，但具体人数仍有讨论。长平之战是战国时期规模最大的一场战争，赵国的精锐几乎丧失殆尽，东方再也没有一个国家能够单独与秦国抗衡。
sources: []
recalled:
  - 《史记·白起王翦列传》
  - 《史记·廉颇蔺相如列传》
  - 《史记·赵世家》
