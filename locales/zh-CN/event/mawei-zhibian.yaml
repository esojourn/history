name: 马嵬驿之变
summary: 756 年玄宗西逃至马嵬驿，随行将士杀死杨国忠，逼玄宗缢死杨贵妃。
body: |-
  天宝十五载（公元 756 年）六月，潼关失守，长安震动。六月十三日凌晨，唐玄宗带着杨贵妃姐妹、皇子皇孙、杨国忠和少数近臣宦官，在龙武大将军陈玄礼所率禁军的护卫下，悄悄从延秋门逃出长安，百官多不知情。

  次日到达马嵬驿时，随行的将士又饥又累，心中愤怒。陈玄礼认为祸乱都是杨国忠造成的，打算杀死他，通过宦官李辅国把这个意思告诉了太子李亨，太子犹豫未决；太子在这件事中参与了多少，史家看法不一。这时有二十多名吐蕃使者拦住杨国忠的马，诉说没有饭吃，将士们便高喊杨国忠与胡人谋反，一拥而上把他杀死，他的儿子杨暄和韩国夫人、虢国夫人也相继被杀。

  杀死杨国忠后，将士们仍然围住驿站不肯散去。陈玄礼对玄宗说，杨国忠谋反，贵妃不宜再侍奉左右，希望陛下割恩正法。玄宗起初不肯，高力士劝他说，贵妃确实无罪，但将士们已经杀了杨国忠，贵妃还在陛下身边，他们怎能安心，将士安心陛下才能安全。玄宗只好命高力士把贵妃带到佛堂缢死，年三十八。陈玄礼等人进来验看后，才脱下盔甲谢罪，军心安定下来。

  玄宗准备继续西行时，当地父老拦住道路，请求留下抗敌。玄宗让太子留下安抚百姓，太子于是率部分人马北上，不久在灵武即位，即唐肃宗；玄宗则继续南下入蜀。马嵬驿之变后来成为诗歌、小说和戏曲的常见题材，最著名的是白居易的《长恨歌》。
sources: []
recalled:
  - 《旧唐书·玄宗纪》
  - 《旧唐书·杨国忠传》
