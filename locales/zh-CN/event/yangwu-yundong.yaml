name: 洋务运动
summary: 1861 年起清朝官员以“自强”“求富”为口号，兴办军工、民用企业和新式学堂。
body: |-
  两次鸦片战争的失败和镇压太平天国的经历，使清朝的一部分官员认识到西方武器和技术的威力。咸丰十一年（1861 年）清朝设立总理各国事务衙门，由恭亲王奕訢主持，统管外交和洋务。在地方上，曾国藩、李鸿章、左宗棠，以及后来的张之洞等督抚，开始学习西方的军事技术，兴办近代企业，这一系列活动被称为“洋务运动”，持续了三十多年。他们的指导思想后来被概括为“中学为体，西学为用”。

  洋务运动的前期以“自强”为口号，主要兴办军事工业。咸丰十一年（1861 年）曾国藩在安庆设立内军械所，同治四年（1865 年）李鸿章在上海创办江南制造总局，同年在南京设立金陵机器局；同治五年（1866 年）左宗棠在福州马尾创办福州船政局；此后天津机器局等相继建立。

  七十年代以后，洋务派又以“求富”为口号，兴办民用企业，多采取“官督商办”的形式，如轮船招商局（1872 年）、开平矿务局（1877 年）、上海机器织布局、天津电报总局、汉阳铁厂等。他们还创办新式学堂，如京师同文馆（1862 年）、福州船政学堂、天津水师学堂等，派遣留学生出国（另见“留美幼童”条），翻译西方的科技书籍。同时，清朝筹建了北洋、南洋、福建等新式海军（另见“北洋海军成军”条）。赫德主持的海关也为洋务提供了重要的财源。

  洋务运动在军事、工业、交通、教育等方面开启了中国的近代化，但企业多受官僚体制的束缚，效率不高，腐败严重；洋务派没有触及政治制度，又受到守旧势力的阻挠。光绪二十年（1894 年）甲午战争中北洋海军覆没，一般被看作洋务运动失败的标志。
