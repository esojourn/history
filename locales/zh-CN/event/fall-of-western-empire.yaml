name: 西罗马帝国灭亡
aliases:
  - 罗慕路斯·奥古斯都路斯被废
summary: 公元 476 年蛮族将领奥多亚克废黜西部最后一位皇帝，传统上以此为西罗马帝国的终结。
body: |-
  五世纪里，罗马帝国西部的行省一块块落到日耳曼各族手中：西哥特人据有高卢西南和西班牙，汪达尔人在 439 年占了迦太基和北非的产粮区，勃艮第人、法兰克人分占高卢东部和北部，不列颠早在 410 年前后就被放弃。《历史的轨迹》第七章说，从 376 年西哥特人渡过多瑙河算起，蛮族用了一百年才把帝国西部征服。朝廷只剩下意大利，军队则几乎全由蛮族雇佣兵组成，实权在蛮族出身的统帅手里。

  公元 475 年，将领奥瑞斯特赶走了皇帝尼波斯，把自己年幼的儿子罗慕路斯立为皇帝，时人给这个孩子起了个绰号“小奥古斯都”。第二年，军中的蛮族士兵要求在意大利分得三分之一的土地，奥瑞斯特不答应。士兵推举军官奥多亚克为王，杀了奥瑞斯特。476 年 9 月初，奥多亚克在拉文纳废黜罗慕路斯，给他一笔年金，送到那不勒斯附近的一处庄园。

  奥多亚克没有再立皇帝。他派元老院的使团把皇帝的冠服送到君士坦丁堡，对东部皇帝芝诺说，西部不再需要单独的皇帝，请求授给他贵族的头衔，让他代管意大利。被赶走的尼波斯在达尔马提亚仍自称皇帝，直到 480 年被杀。

  当时的人并没有把 476 年看成一个时代的结束，把它定为“西罗马灭亡”之年是六世纪东罗马史家的说法，后世沿用。《历史的轨迹》以蛮族入侵和西罗马亡国作为初期教会史的结束、中世纪的开始。书中指出，帝国虽亡，教会仍在；东部的帝国以君士坦丁堡为都，又延续了近一千年。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 约达尼斯《哥特史》第 45—46 章
  - 无名氏《瓦莱西亚努斯佚文》第 8 章
  - 马尔切利努斯伯爵《编年史》476 年条
  - 普罗科匹厄斯《战史》卷 5 第 1 章
