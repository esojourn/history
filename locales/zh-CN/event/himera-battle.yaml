name: 希梅拉战役
summary: 公元前 480 年叙拉古与阿克拉加斯的联军在西西里北岸大败迦太基军。
body: |-
  公元前 5 世纪初，西西里岛西端是迦太基人的势力范围，东部和南部是希腊城邦。阿克拉加斯僭主塞隆夺取了北岸的希梅拉，赶走那里的僭主特里洛斯，特里洛斯向迦太基求援。前 480 年，迦太基派哈米尔卡率大军在西西里北岸登陆，围攻希梅拉。狄奥多罗斯说迦太基军有三十万，这个数字不可信。

  叙拉古僭主革隆是塞隆的女婿，率军来援，狄奥多罗斯说有步兵五万、骑兵五千。据狄奥多罗斯，革隆截获了一封信，得知迦太基人约了一支希腊骑兵在某天前来会合，便派自己的骑兵冒充，混入敌营，放火烧船，并杀死了正在献祭的哈米尔卡，主力同时进攻，迦太基军溃败。希罗多德记的是迦太基人自己的说法：战斗从早打到晚，哈米尔卡一直在营中向火堆里投献整只的牺牲，见己方败退，便纵身跳入火中。

  迦太基为求和赔付了两千塔兰特白银。西西里的希腊城邦用战利品修建了神庙。希罗多德说西西里人传说此战与萨拉米斯海战发生在同一天，狄奥多罗斯则说与温泉关之战同日；后来有史家说迦太基与波斯事先约定同时进攻，这没有可靠的根据。此后七十年迦太基没有再大举进攻西西里的希腊人。
sources: []
recalled:
  - 希罗多德《历史》卷七第 165—167 章
  - 狄奥多罗斯《历史丛书》卷十一第 20—26 章
