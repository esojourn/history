name: 卡塔隆尼亚平原战役
summary: 公元 451 年埃提乌斯联合西哥特人，在高卢击退阿提拉率领的匈人联军。
body: |-
  公元 450 年，东部新即位的皇帝马尔西安停付给匈人的岁币，阿提拉却转向了西方。古代作家列举的缘由有好几条：西部皇帝的姐姐霍诺里娅私下送去戒指求助，阿提拉便声称她是自己的未婚妻，要半个帝国作嫁妆；法兰克人的两位王子争位，一个投靠罗马，一个投靠匈人；约达尼斯还说，汪达尔王盖萨里克从旁怂恿他去打西哥特人。

  451 年春，阿提拉率匈人以及附属的格皮德人、东哥特人等各族渡过莱茵河，4 月攻破梅斯，随后直趋奥尔良。西罗马的统帅埃提乌斯手里兵不多，他派人说服与罗马素有嫌隙的西哥特王狄奥多里克一世共同出兵，又召集了高卢的法兰克人、勃艮第人、阿兰人等。6 月中，联军赶到奥尔良，阿提拉撤围东退。

  几天后，两军在香槟的平原上会战。约达尼斯称那里为“卡塔隆尼亚平原，又叫毛里亚库斯原野”，确切位置不详，多认为在特鲁瓦附近。日期一般作 6 月 20 日前后，没有确证。约达尼斯在一百年后依据前人的书写下了唯一详细的经过：战场一侧有一处高地，双方争夺，罗马人和西哥特人先占了上风；阿提拉自率匈人居中，联军则把不可靠的阿兰人夹在中间。战斗从午后打到夜里，狄奥多里克在乱军中坠马被踏死，一说是中了标枪。阿提拉退进用大车围成的营垒；据说他叫人堆起马鞍，预备一旦营破就自焚。约达尼斯说双方共战死十六万五千人，同时代的许达提乌斯说三十万，这些数字都不可信。

  第二天联军没有强攻。埃提乌斯劝西哥特人新立的王托里斯蒙德赶快回图卢兹保住王位，自己也收兵。阿提拉得以从容退回莱茵河以东。约达尼斯认为埃提乌斯是有意留着匈人牵制西哥特人。

  十九世纪的史家把这一仗列为决定欧洲命运的战役之一。实际上阿提拉的力量没有被摧毁，第二年他就攻入意大利；匈人帝国的瓦解是在 453 年他死后。对罗马来说，这是西部的军队最后一次在大会战里取胜，而且靠的是蛮族盟军。
sources: []
