name: 石渠阁会议
summary: 汉宣帝召集儒生在石渠阁讨论五经各家解说的异同，亲自裁定，并增立了几家博士。
body: |-
  武帝设五经博士以后，经学成为做官的途径，传授经书的儒生越来越多。同一部经往往有几家不同的解说，各有师承，谁能立为博士、在太学传授，关系到这一派的兴衰。宣帝本人对《穀梁春秋》有兴趣，曾让一批人专门研习，并与已立为博士的《公羊春秋》一派辩论。

  据《汉书·宣帝纪》，甘露三年（公元前 51 年），宣帝下诏让儒生们讨论五经解说的异同，由太子太傅萧望之等人把各方的意见整理上奏，皇帝亲自裁决。会议在未央宫中收藏图书的石渠阁举行，参加者有各经的博士和知名学者，后来以校书著称的刘向也在其中。会后增立了梁丘氏的《易》、大小夏侯氏的《尚书》和《穀梁春秋》博士。

  这次会议的记录称为《石渠议奏》，《汉书·艺文志》著录了其中各经的篇数，今已失传，只有零星的条文保存在后人的引述里。由皇帝出面裁定经义的做法为后世所仿效，东汉章帝时的白虎观会议就是一例。
sources: []
recalled:
  - 《汉书·宣帝纪》
  - 《汉书·儒林传》
  - 《汉书·艺文志》
