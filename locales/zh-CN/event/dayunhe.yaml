name: 大运河开凿
summary: 隋炀帝开通济渠、永济渠、江南河，连成以洛阳为中心、北至涿郡、南达余杭的运河。
body: |-
  隋朝的政治中心在关中和洛阳，而江淮地区的经济日益重要，北方边境又需要大量军需，因此需要一条贯通南北的水道。隋文帝时已开始兴修运河：开皇四年（公元 584 年）宇文恺主持开凿广通渠，从大兴城引渭水东到潼关；开皇七年（587 年）为伐陈开山阳渎，沟通淮河与长江。

  隋炀帝即位后大规模开凿运河。大业元年（605 年）开通济渠，从洛阳西苑引谷水、洛水通到黄河，再从板渚引黄河水通到淮河，据《资治通鉴》，征发河南、淮北各郡的百姓前后一百多万人；同时又征发淮南百姓十余万人重开邗沟，从山阳到扬子入长江。同年八月，炀帝乘龙舟沿新开的运河南下江都。大业四年（608 年）开永济渠，引沁水南通黄河、北达涿郡，据《资治通鉴》，征发河北各郡百姓一百多万人，男丁不够，开始役使妇女。大业六年（610 年）开江南河，从京口到余杭，据同书长八百余里。

  这样，以洛阳为中心，北到涿郡、南到余杭的运河体系基本形成，沟通了海河、黄河、淮河、长江、钱塘江五大水系。开凿运河的工程浩大，期限紧迫，役夫死伤很多，是隋末民怨的原因之一。

  隋朝灭亡后，运河一直是唐宋两代从江南向北方运送粮食的命脉。元朝定都大都后，把运河改为不经洛阳、直接南北贯通的路线，形成后来的京杭大运河。唐代诗人皮日休在《汴河怀古》中说，隋朝因运河而亡，但运河至今仍便利往来。
sources: []
recalled:
  - 《隋书·炀帝纪》
  - 《隋书·食货志》
