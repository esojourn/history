name: 格拉尼库斯河战役
summary: 公元前 334 年亚历山大渡海后的第一战，击败波斯的小亚细亚诸总督。
body: |-
  公元前 334 年春，亚历山大渡过赫勒斯滂海峡。波斯在小亚细亚西部的几位总督和将领在泽莱亚会商对策。据阿里安和狄奥多罗斯，为波斯统领希腊雇佣军的罗得岛人门农主张避战，后撤并烧毁庄稼、村镇，使马其顿人得不到粮草；当地总督阿尔西特斯说，他不容许自己治下有一所房子被烧。众人决定在流入马尔马拉海的格拉尼库斯河东岸迎战。

  波斯人把骑兵排在陡峭的河岸上，希腊雇佣步兵放在后面的高地。双方的兵力，古代作家的数字相差很大，现代学者多认为波斯一方的骑兵多于马其顿，步兵则少。马其顿军傍晚到达河边。阿里安说，帕曼纽劝亚历山大等到次日清晨再渡，亚历山大回答，渡过了赫勒斯滂却被这条小河挡住，是一种耻辱，当即进攻。狄奥多罗斯的说法不同，说军队是在第二天拂晓渡河列阵的。

  按阿里安的记述，亚历山大先派一队骑兵和步兵在右侧强渡，吸引对方，自己率伙伴骑兵斜向渡河，冲上对岸。波斯贵族认出他的头盔，集中向他冲来。他的长矛折断，换了一支，刺倒了大流士的女婿米特里达特斯；另一名波斯贵族一剑砍掉他头盔的一角，他将此人刺死；总督斯皮特里达特斯从背后举刀，被克莱图斯抢先砍断了手臂。波斯骑兵的首领多人战死，其余的溃散。

  留在后面的希腊雇佣兵没有参战，这时被马其顿方阵和骑兵包围。他们请求有条件投降，亚历山大不许，大部分被杀，据阿里安约二千人被俘，戴上镣铐送回马其顿做苦役，理由是他们身为希腊人却违背希腊人的共同决议替蛮族打仗。门农脱身。

  亚历山大为阵亡的二十五名伙伴骑兵在马其顿立了铜像，由雕塑家留西波斯制作。他把三百套波斯铠甲送到雅典卫城献给雅典娜，题辞是：“腓力之子亚历山大和希腊人（拉栖代梦人除外）得自居住在亚洲的蛮族。”战后小亚细亚西部无兵可守，萨迪斯的守将献出卫城和金库，以弗所等城相继归附。
sources: []
recalled:
  - 阿里安《亚历山大远征记》卷一第 12—16 章
  - 狄奥多罗斯《历史丛书》卷十七第 18—21 章
  - 普鲁塔克《亚历山大传》第 16 章
