name: "维也纳之围"
summary: "1683 年奥斯曼大军围攻维也纳，波兰国王索别斯基率援军解围。"
body: |-
  1683 年夏，奥斯曼帝国大维齐尔卡拉·穆斯塔法率大军围攻哈布斯堡的都城维也纳，城中守军苦撑两个月。9 月 12 日，波兰国王约翰三世·索别斯基率波兰军队与神圣罗马帝国各邦援军会合，从城外的卡伦山发动进攻，波兰重骑兵冲垮了土耳其军营，维也纳解围。

  《历史的轨迹》第四十章说，教会在一千年以后失去了许多东方的领土，四周被回教的坚墙挡住；土耳其回教徒向西欧的侵犯，1683 年被波兰英雄索别斯基的军队遏阻在维也纳，过不久匈牙利和巴尔干国家也从回教徒手中夺回，归入基督教世界。据一般记载，此后神圣同盟连年反攻，1699 年卡洛维茨条约使哈布斯堡取得匈牙利大部和特兰西瓦尼亚；巴尔干各国则大多到十九世纪才脱离奥斯曼统治。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十章“教会再度增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter44.html"
