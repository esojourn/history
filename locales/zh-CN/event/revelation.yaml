name: 约翰在拔摩岛写《启示录》
summary: 约翰在拔摩岛上见异象，写成书卷寄给亚西亚的七个教会。
body: |-
  《启示录》开头说，这是耶稣基督的启示，借使者晓谕他的仆人约翰（1:1）。作者自称约翰，说自己为神的道并为给耶稣作的见证，曾在那名叫拔摩的海岛上；当主日他被圣灵感动，听见有大声音吩咐他把所看见的写在书上，达与以弗所、士每拿、别迦摩、推雅推喇、撒狄、非拉铁非、老底嘉七个教会（1:9–11）。拔摩是爱琴海中的小岛，离以弗所不远。教会传统认为约翰是被流放到那里的，经文本身只说他为神的道在那岛上。

  全书共二十二章。第 2—3 章是分别写给七个教会的信，各有称许、责备和应许。第 4—5 章记天上的宝座和被杀过的羔羊，羔羊从坐宝座的手里接过用七印封严的书卷。此后依次是揭开七印、吹七支号、倒七个碗的异象（第 6—16 章），大城巴比伦倾倒（第 17—18 章），羔羊的婚筵、一千年和最后的审判（第 19—20 章），末了是新天新地和从天而降的新耶路撒冷（第 21—22 章）。书中的数字和形象应当怎样解释，历代教会有多种读法，本条不作取舍。

  关于作者和成书年代，学界看法不一。二世纪的殉道者游斯丁和爱任纽认为作者就是使徒约翰；三世纪亚历山大的狄奥尼修根据文体和用语，认为它与《约翰福音》不是出自一人之手，这段议论保存在优西比乌《教会史》卷 7；现代学者也有两种意见，书中只自称“约翰”，没有自称使徒。年代方面，爱任纽说这异象是在图密善在位末年所见，通行的公元 95 年前后即据此而定；另有学者主张写在尼禄死后不久，即公元 68 至 69 年。
sources: []
recalled:
  - 《启示录》第 1—22 章（拔摩岛见 1:9–11）
  - 爱任纽《驳异端》卷 5 第 30 章
  - 优西比乌《教会史》卷 3 第 18 章、卷 7 第 25 章
