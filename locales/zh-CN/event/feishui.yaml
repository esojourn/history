name: 淝水之战
summary: 东晋以八万北府兵在淝水击溃前秦苻坚的南征大军，前秦随即瓦解，南北分立延续下来。
body: |-
  前秦统一北方后，苻坚把灭晋当作最后一件大事。太元七年（公元 382 年）他在朝堂上提出亲征，说自己有兵近百万。大臣中只有少数人附和；主政的弟弟苻融、太子苻宏、苻坚敬重的僧人道安都劝他不要出兵，理由是东晋有长江之险、君臣和睦，而国内的鲜卑、羌人并未真心归附。慕容垂和姚苌则极力怂恿。苻坚最终决定南征。

  太元八年（383 年）八月，前秦在全国征兵，据《晋书·载记》，步兵六十余万、骑兵二十七万，由苻融率二十五万人为前锋。东晋方面，宰相谢安任命弟弟谢石为征讨大都督，侄子谢玄为前锋都督，率领以北府兵为主的八万人迎敌。

  十月，苻融攻下寿阳，并派梁成率五万人进驻洛涧，截断淮河水道。苻坚得知晋军兵少粮乏，留大军在项城，自带八千轻骑赶到寿阳，又派此前被俘的东晋将领朱序去劝降。朱序反而告诉谢石，秦军百万尚未到齐，应当趁早击败它的前锋。十一月，谢玄派刘牢之率五千精兵夜渡洛涧，斩杀梁成，秦军在淮水边溃散，死一万五千人。晋军水陆并进，抵达淝水东岸。苻坚登城瞭望，见晋军阵列整齐，又望见八公山上草木摇动，以为都是晋兵，面露惧色。

  秦军紧贴淝水西岸列阵，晋军无法渡河。谢玄派人对苻融说，请贵军稍向后退，让出一块地方，待晋军渡河后一决胜负。苻坚认为可以趁晋军半渡时用骑兵冲击，就下令后撤。军队一退便收不住，朱序在阵后大喊“秦兵败矣”，后面的人不明真相，争相逃跑。谢玄等率精兵八千渡水追击，苻融骑马整顿队伍时马倒被杀，秦军全线崩溃，自相践踏而死的遮蔽原野、堵塞河流。苻坚中箭，只带少数人逃回淮北。

  前秦的各路军队中只有慕容垂的三万人没有损失。几个月之内，慕容垂、姚苌等相继起兵自立，苻坚两年后被杀，北方重新分裂。此后直到隋朝灭陈，再没有北方政权能够渡江，南北对峙的格局又延续了两百年。
sources: []
recalled:
  - 《晋书·苻坚载记》
  - 《晋书·谢安传》
  - 《晋书·谢玄传》
  - 《资治通鉴》卷一百零四、一百零五
