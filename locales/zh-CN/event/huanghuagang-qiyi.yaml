name: 黄花岗起义
summary: 1911 年四月黄兴在广州率敢死队攻打两广总督署，起义失败，牺牲者合葬于黄花岗。
body: |-
  同盟会成立后，在华南发动的多次起义都失败了。宣统二年（1910 年）底，孙中山、黄兴、赵声等人在马来亚槟榔屿开会，决定集中同盟会的骨干力量，在广州发动一次大规模起义，然后由黄兴率一路进军湖南、湖北，赵声率一路进军江西、南京。他们在海外华侨中筹集经费，在广州设立了几十处秘密据点，挑选了数百名“选锋”（敢死队员），其中有许多是留学生和华侨。

  起义原定于宣统三年（1911 年）四月中旬发动，但由于经费、枪械运输的延误，加上清朝广州将军孚琦被一名革命党人刺杀，清朝加强了戒备，起义计划多次变更。四月二十七日（农历三月二十九日）下午，黄兴率领一百多名敢死队员攻打两广总督署，总督张鸣岐逃走，起义者在城内与清军激战，其他几路没有按计划发动，起义很快失败。黄兴右手被打断两根手指，化装逃到香港。

  在这次起义中牺牲和被捕后遇害的革命党人很多，事后同盟会会员潘达微冒险收殓了七十二具遗骸，合葬于广州城外的红花岗，并把红花岗改名为黄花岗，所以称为“黄花岗七十二烈士”（后来查明的人数多于七十二人）。林觉民的《与妻书》就是在起义前写下的。这次起义虽然失败，但革命党人的牺牲精神震动了全国，孙中山说此役之价值“直可惊天地，泣鬼神”。半年后武昌起义爆发。
sources: []
recalled:
  - 邹鲁《黄花岗七十二烈士事略》
  - 孙中山《黄花岗七十二烈士事略序》
  - 冯自由《革命逸史》
