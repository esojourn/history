name: 濮议
summary: 宋英宗时朝臣争论如何称呼英宗生父濮王，宰执与台谏争执一年多。
body: |-
  宋英宗是宋仁宗的堂侄，过继给仁宗为子而即位。他的生父濮王赵允让已经去世。治平二年（公元 1065 年），朝廷讨论该如何尊崇濮王。宰相韩琦、参知政事欧阳修等人主张称濮王为“皇考”（父亲），理由是生父不可不认；翰林学士王珪、知谏院司马光以及御史吕诲、范纯仁、吕大防等人主张称“皇伯”，理由是英宗既然过继给仁宗，就应以仁宗为父。

  双方争论激烈，台谏官员连连上书弹劾韩琦、欧阳修。治平三年（1066 年）正月，仁宗的曹太后在宰执的安排下发出手书，同意尊濮王为“亲”，称濮安懿王，吕诲等台谏官员被贬出京城。这场争论被称为“濮议”，表面上是礼制之争，实际上也反映了宰执与台谏之间的权力冲突，参与者之间的嫌隙延续到了神宗朝。
sources: []
recalled:
  - 《宋史·英宗本纪》
  - 欧阳修《濮议》
  - 《续资治通鉴长编》卷二百五至二百七
