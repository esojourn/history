name: "威斯特伐利亚和约"
summary: "1648 年结束三十年战争的和约，承认加尔文派与路德派、天主教同享合法地位。"
body: |-
  和谈从 1644 年开始，在威斯特法伦两座相距五十公里的城市分头进行：皇帝与信天主教的法国在明斯特谈，与信路德宗的瑞典在奥斯纳布吕克谈，因为教皇的代表不肯与新教徒同席。到会的使节代表一百多个邦国和城市，仗一边打一边谈。1648 年 1 月西班牙先与荷兰议和，正式承认联省共和国独立。10 月 24 日皇帝与法国、瑞典分别签约。

  《历史的轨迹》第三十章说，这项和约与《奥格斯堡和约》相似，只加了一点：在德意志受到宽容的新教徒，除路德派之外也包括加尔文派；和前一次一样，由每个诸侯决定自己境内的宗教。和约的宗教条款比这要细。教会产业和各地的信仰以 1624 年 1 月 1 日的状况为准，谁在那一天占有就归谁；诸侯以后改宗，不得再强迫臣民跟着改；1624 年已有的少数派可以照旧公开或在家礼拜，其余不同信仰的臣民准许在家祈祷，或在五年内迁走。帝国议会遇到宗教问题不用多数表决，两教各自成团协商。皇帝在自己的世袭领地奥地利和波希米亚不受这些限制，那里的新教从此衰落。

  领土方面，法国得到阿尔萨斯的大部，瑞典得到波美拉尼亚西部等波罗的海南岸的土地，勃兰登堡和巴伐利亚各有所得；瑞士脱离帝国。德意志三百多个邦可以各自对外结盟，皇帝的权力只剩空名。

  教皇英诺森十世发通谕宣布和约中有损教会的条款无效，没有人理会。此后欧洲各国订约，不再以教皇为仲裁，后人常把主权国家并立的格局追溯到这次和会。

  该书说，和约签订后新教与天主教之间的战争结束了，罗马教会与新教各教会的地理界限由此确定，从那时直到如今没有大的变动。该书第三部“改教时期的教会”到此为止；末尾附带提到，东方的希腊教会在土耳其人治下受逼迫而存留下来，在俄罗斯则稳步发展。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
