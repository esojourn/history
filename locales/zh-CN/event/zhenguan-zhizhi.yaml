name: 贞观之治
summary: 唐太宗贞观年间任贤纳谏、轻徭薄赋，政治清明，社会安定，后世奉为治世的典范。
body: |-
  唐太宗即位时，隋末战乱刚刚结束，人口锐减，经济凋敝。他亲身经历了隋朝的覆亡，常以隋炀帝为戒，与大臣讨论治国之道。他在位的贞观年间（公元 627—649 年），政治比较清明，后世称为“贞观之治”。

  在用人上，他任用房玄龄、杜如晦为宰相，不计前嫌地重用原属太子李建成的魏征、王珪，也任用出身寒微的马周等人。他鼓励大臣进谏，规定宰相入宫议事时，谏官可以随同参加；魏征前后进谏两百余事，大多被他采纳。中书省起草诏令，门下省审核，有不妥的可以封还驳正，三省互相制衡。

  在政务上，他精简中央官员，合并州县；修订《贞观律》，减少死刑条目，规定判决死刑须经多次复奏；推行均田制和租庸调法，轻徭薄赋，让百姓休养生息。据《资治通鉴》，贞观四年（630 年）全国判处死刑的只有二十九人；贞观六年（632 年）太宗亲自审录死囚，放三百九十名死囚回家，约定次年秋天回来受刑，到期全部按时归来，太宗将他们全部赦免。

  在对外方面，唐朝在贞观四年攻灭东突厥，西北各族尊太宗为“天可汗”，此后又灭高昌、击败吐谷浑和薛延陀，与吐蕃和亲。文化上，他设弘文馆，命孔颖达等编《五经正义》，命房玄龄等修《晋书》，魏征等修《梁书》《陈书》《北齐书》《周书》《隋书》。

  史家也指出，贞观年间人口远未恢复到隋朝的水平，太宗晚年营建宫殿、亲征高句丽，魏征生前就曾批评他渐不如初。唐玄宗时吴兢把太宗与大臣讨论政事的言论编成《贞观政要》，此后历代君主多把它作为治国的教材，日本、朝鲜也很重视这部书。
sources: []
recalled:
  - 吴兢《贞观政要》
  - 《旧唐书·太宗纪》
  - 《资治通鉴》卷一百九十二至一百九十九
