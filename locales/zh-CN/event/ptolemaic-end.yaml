name: 托勒密王朝灭亡，埃及并入罗马
summary: 屋大维进入亚历山大城，安东尼与克娄巴特拉七世先后自尽，埃及成为罗马行省。
body: |-
  公元前 30 年 8 月，屋大维进入亚历山大城，安东尼和克娄巴特拉七世先后自杀，延续近三百年的托勒密王朝灭亡，埃及成为罗马的行省。

  亚克兴战后，安东尼和克娄巴特拉回到埃及。安东尼驻在昔兰尼的军团倒向屋大维。据普鲁塔克，克娄巴特拉曾想把船队拖过地峡运到红海，远走他乡，船被佩特拉的纳巴泰人烧毁；她又把恺撒里昂送往南方，打算让他经红海去印度。两人分别遣使求和：她请求让子女继承王位，安东尼请求以平民身份住在雅典；屋大维不答复安东尼，对她则含糊许诺。犹太王希律也在这时转到屋大维一边。

  前 30 年夏，屋大维从叙利亚、他的部将加卢斯从昔兰尼两路进兵。东面的门户佩卢西翁不战而降。7 月底安东尼在亚历山大城外击退屋大维的前锋骑兵。8 月 1 日他出城决战，舰队驶出港口后向对方举桨致意，合为一队；骑兵随之倒戈，步兵被击败。他回城时听说克娄巴特拉已死——她其实是躲进了自己的陵墓——便伏剑自刺，没有立刻死去；得知她还活着，让人把自己抬到陵墓，死在她身边。

  屋大维的手下用计进入陵墓，把她活捉。她获准安葬安东尼。据普鲁塔克，她得知自己将被送往罗马，便写信给屋大维，请求与安东尼合葬，然后自尽。屋大维派去的人赶到时，她已死在榻上，两名侍女一死一垂危。死因当时就不清楚：流行的说法是用了藏在无花果篮里的毒蛇，也有说是毒药；屋大维的凯旋式上抬着她被蛇咬的画像。她年三十九岁，在位二十一年。两人被合葬，墓至今没有找到。

  恺撒里昂在途中被劝回，遭处死。安东尼与克娄巴特拉的三个孩子被带到罗马，由屋大维娅抚养。屋大维没有把埃及交给元老院，而是派一名骑士出身的长官治理，元老未经他许可不得入境。埃及的粮食此后供应罗马城，王室的财宝运到罗马。亚历山大的继业者所建的王国，到此全部并入罗马。
sources: []
recalled:
