name: 亚里士多德创办吕克昂学园
summary: 亚里士多德回到雅典，在吕克昂设学讲授并组织研究，其学派称为漫步派。
body: |-
  公元前 335 年，亚里士多德结束在马其顿的十几年，回到雅典。柏拉图的学园这时由色诺克拉底主持，他没有回去，而是在城东郊祭祀“吕克昂的阿波罗”的圣地一带另立学校。那里有一座公共体育场，苏格拉底当年也常去。他是外邦人，按雅典法律不能置产，校舍大概是租的。因为讲学的地方有供人散步的廊道（希腊语叫“佩里帕托斯”），这个学派后来被称为“漫步派”，中文旧译“逍遥派”；说他总是边走边讲，是后人对这个名称的解释。

  据公元 2 世纪的格利乌斯，他上午给入门较深的学生讲逻辑、自然哲学等较难的课，下午或傍晚向更多的人讲修辞、政治等。今天所见的亚里士多德著作大多是这一时期的讲稿。吕克昂与柏拉图学园的不同，在于大规模搜集材料和分门别类的研究：他和学生编了一百五十八个城邦的政制，整理了戏剧比赛和皮提亚竞技会的历年记录，搜集动植物的资料，并且有了相当规模的藏书和地图。老普林尼说亚历山大命令各地的猎人、渔夫为他提供标本，这种说法大概有所夸大。

  前 323 年亚里士多德离开雅典，提奥弗拉斯托斯接掌学校，主持约三十五年。在学生、治理雅典的法勒隆的德米特里帮助下，提奥弗拉斯托斯得以买下一处园子，学校才有了自己的产业。他之后是兰普萨库斯人斯特拉托，专重自然研究。此后漫步派在雅典渐趋平淡，它的学风却由德米特里等人带到亚历山大城，影响了那里的博学园。

  亚里士多德手稿的下落，斯特拉波讲了一个有名的故事：提奥弗拉斯托斯把藏书遗赠给弟子涅琉斯，涅琉斯带回小亚细亚的斯刻普西斯，后人为躲避帕加马国王的搜求把书藏在地窖里，受潮虫蛀，前 1 世纪初才卖给藏书家阿佩利孔，随后被苏拉运到罗马，最后由罗得岛的安德罗尼科斯整理编定。这个故事有多少可信，学者看法不一。1996 年雅典修建现代艺术馆时发现了一处古代体育场遗址，被认定为吕克昂的一部分。
sources: []
recalled:
