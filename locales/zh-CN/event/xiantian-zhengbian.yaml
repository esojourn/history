name: 先天政变
summary: 713 年唐玄宗抢先发兵捕杀太平公主一党，从太上皇手中收回全部权力。
body: |-
  睿宗复位后，太平公主与太子李隆基之间争夺权力，朝中宰相多出自太平公主门下。延和元年（公元 712 年），据《资治通鉴》，太平公主让术士向睿宗进言，说天象显示太子将成为天子，本想借此挑起睿宗的猜忌，睿宗却决定传位给太子。八月玄宗即位，改元先天，睿宗为太上皇，仍掌管三品以上官员的任免和重大政事。

  先天二年（713 年）七月，宰相魏知古告发太平公主与宰相窦怀贞、萧至忠、岑羲以及羽林将军常元楷、李慈等人谋划，准备在七月四日起兵。玄宗与岐王李范、薛王李业、郭元振、王毛仲、高力士等人商定先发制人。七月三日，玄宗派王毛仲率兵斩杀常元楷、李慈，又捕杀萧至忠、岑羲等人，窦怀贞逃入城外的沟中自缢。太平公主逃入山中佛寺，三天后才出来，被赐死在家中，她的儿子和党羽数十人被杀。

  次日太上皇下诰，把全部权力交给玄宗，自己不再过问政事。这年十二月玄宗改元开元，此后开始了开元年间的治理。
sources: []
recalled:
  - 《旧唐书·玄宗纪》
  - 《旧唐书·太平公主传》
  - 《资治通鉴》卷二百一十
