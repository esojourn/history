name: 屋大维获“奥古斯都”称号
summary: 屋大维宣布交还权力，元老院授予“奥古斯都”称号，后世以此为帝国之始。
body: |-
  公元前 27 年 1 月，屋大维在元老院宣布把国家交还元老院和人民，元老院随后授予他“奥古斯都”的称号和一批行省的管辖权。后世通常把这一年当作罗马共和国结束、帝国开始的标志；当时的官方说法则是共和国得到了恢复。

  亚克兴之战后，屋大维的权力靠的是三头时期的非常授权和前 32 年全意大利的效忠宣誓，名分上已经含糊。他从前 31 年起连年任执政官。前 29 年他回到罗马，举行三天凯旋式，关闭雅努斯神庙的大门以示天下太平，开始遣散军队，用埃及的财宝购买土地安置老兵。前 28 年他与阿格里帕同任执政官，举行人口普查，废除三头时期不合法的命令。

  前 27 年 1 月 13 日，他在元老院表示放下一切权力；卡西乌斯·狄奥所记的长篇演说是史家代拟的。结果是：他继续任执政官，并受托管辖西班牙、高卢、叙利亚和埃及，为期十年，这些正是驻有绝大部分军团的地方；其余行省仍由元老院派人轮流出任总督。1 月 16 日，元老院授予他“奥古斯都”的称号，这个词原用于神圣的事物；据苏维托尼乌斯，有人提议叫他“罗慕路斯”，没有采用。元老院议事堂里放了一面金盾，表彰他的勇武、宽仁、公正和虔敬。

  他在晚年自撰的《功业录》里这样描述：在第六和第七次执政官任内，他平息了内战，经全体同意掌握一切之后，把国家从自己的权力下交给元老院和罗马人民处置；此后他在威望上超过所有人，而权力并不比各个官职上的同僚更多。

  这套安排后来又作过调整：前 23 年他辞去执政官，改取保民官权力和高于各省总督的治权。他不用国王或独裁官的名号，自称“元首”，即第一公民。选举、元老院、各级官职都还在，但军队向他宣誓，对外的和战由他决定。塔西佗在一百多年后写道，他用赏赐笼络军队，用粮食笼络民众，用太平的甜头笼络所有人，然后一步一步把元老院、长官和法律的职权集于一身。这一体制史称元首制。
