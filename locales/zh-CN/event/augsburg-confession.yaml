name: "奥格斯堡信条"
summary: "1530 年路德派诸侯在奥格斯堡帝国议会上向皇帝呈递由梅兰希顿执笔的信仰告白。"
body: |-
  1530 年皇帝查理五世与教皇、法国都讲了和，九年来第一次回到德意志，在奥格斯堡召开帝国议会，要各方陈述信仰上的意见，以便恢复统一，合力对付土耳其人。萨克森选侯命维滕贝格的神学家准备一份说明。路德身负帝国的禁令，不能进奥格斯堡，留在萨克森境内最南端的科堡，起草和交涉都由梅兰希顿担当。

  《历史的轨迹》第二十三章说，为了把路德派教会的信仰正式公之于世，路德撰写了一份信仰告白，提交 1530 年的奥格斯堡帝国议会。执笔的其实是梅兰希顿，他用了路德参与拟定的几份旧稿；路德在科堡看了稿子，回信说很满意，自己不会说得这样轻柔。

  6 月 25 日下午，萨克森的大臣在主教府的小厅里用德语向皇帝宣读了两个小时，窗外的人也听得见，由七位诸侯和两座城市签名。信条分两部分：前二十一条讲信仰，从神、原罪、基督讲到称义、教会和圣礼，申明所教导的与圣经和古代教会并无不合，并谴责重洗派；后七条讲已经革除的弊端，如不给平信徒领杯、教士独身、弥撒献祭、修道誓愿和主教的世俗权力。该书说它没有取代初期教会的信经，而是在其上增补扩充，是初期教会以来的第一份信条。

  皇帝命艾克等神学家写了《驳议》，宣布路德派已被驳倒，限期回归。梅兰希顿在谈判中做了不少让步，仍无结果，随后写成《辩护文》。信瑞士一派观点的四座南德城市另递了布塞起草的《四城信条》，慈运理也自己送来一份。

  议会最后重申《沃尔姆斯敕令》。新教诸侯次年在施马尔卡尔登结成防御同盟。土耳其人的威胁使皇帝在 1532 年同意暂时休战，此后十多年路德宗传遍德意志北部和北欧。《奥格斯堡信条》至今是路德宗各教会的基本信条。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十三章“德国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter26.html"
recalled:
  - "《奥格斯堡信条》（1530 年 6 月 25 日宣读）"
  - "《驳议》（1530 年 8 月）与梅兰希顿《奥格斯堡信条辩护文》（1531 年）"
  - "路德自科堡致梅兰希顿的信（1530 年）"
