name: 秦灭巴蜀
summary: 前 316 年秦采纳司马错之策，灭蜀、巴，取得四川盆地。
body: |-
  公元前 316 年，蜀国与苴国、巴国发生冲突，相互求救于秦。秦惠文王想伐蜀，又想伐韩，犹豫不决。据《战国策·秦策一》和《史记·张仪列传》，张仪主张伐韩，进兵三川，挟持周天子，“据九鼎，按图籍，挟天子以令于天下”；司马错主张伐蜀，认为蜀是“西僻之国，而戎狄之长”，取其地足以扩大国土，得其财足以富民缮兵，而且不会招致诸侯的非议，而攻韩劫周会引起各国联合对抗。

  惠文王采纳了司马错的意见，派司马错、张仪等人率军经石牛道入蜀，同年攻灭蜀国，随后又灭了苴国和巴国。秦在当地设置蜀郡和巴郡，并迁移秦人入蜀。

  巴蜀的获得使秦国的领土和财力大为增加。后来李冰在蜀郡修建都江堰，成都平原成为秦国重要的粮仓；秦国又可以从巴蜀顺江而下威胁楚国。《华阳国志》说“蜀既属秦，秦以益强，富厚，轻诸侯”。

  蜀国在被秦灭亡以前已有相当发达的青铜文化。1986 年四川广汉三星堆出土了大量青铜人像、面具和金器，年代相当于商代晚期；2001 年发现的成都金沙遗址年代稍晚，二者都被认为与古蜀国有关。古书中蚕丛、鱼凫、杜宇、开明等蜀王的传说，见于汉代扬雄的《蜀王本纪》和《华阳国志》。
sources: []
recalled:
  - 《战国策·秦策一》
  - 《史记·张仪列传》
  - 《华阳国志·蜀志》
