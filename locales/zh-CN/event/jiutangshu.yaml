name: 《旧唐书》修成
summary: 后晋 941 年下诏修唐史，945 年以宰相刘昫的名义进呈，即《旧唐书》。
body: |-
  唐朝灭亡以后，中原各朝都有意为唐朝修史，但战乱频仍，史料散失，一直没有完成。后晋天福六年（公元 941 年），石敬瑭下诏修撰唐史，由宰相赵莹监修，张昭远、贾纬、赵熙等人执笔。他们收集了唐代的实录、国史和各种文献，尤其是唐前期保存较好的国史，编成本纪、志、列传共二百卷。

  开运二年（945 年）书成时，赵莹已经调任外职，监修国史的宰相是刘昫，所以这部书以刘昫的名义进呈，原名《唐书》。北宋时欧阳修、宋祁等人重修唐史，于嘉祐五年（1060 年）完成《新唐书》，后人便把后晋修的这部称为《旧唐书》。

  《旧唐书》成书仓促，唐后期的部分因为史料缺乏，显得比较简略和混乱，前后也有重复矛盾之处。但它大量保留了原始史料的文字，许多诏令、奏疏都照录原文，史料价值很高，后世学者常把新旧两部唐书对照使用。
sources: []
recalled:
