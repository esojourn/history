name: 周世宗征淮南
summary: 955—958 年周世宗三次亲征南唐，夺取长江以北十四州，南唐去帝号称臣。
body: |-
  显德二年（公元 955 年），周世宗采纳王朴“先易后难”的方略，决定先攻打南唐的江北之地。同年十一月，他命宰相李穀率军南下，进攻淮南的重镇寿州。

  显德三年（956 年）正月，周世宗第一次亲征淮南。后周军在正阳击败南唐援军，赵匡胤率军在清流关大败南唐将领皇甫晖，攻下滁州，擒获皇甫晖。后周军又攻占扬州、泰州等地，但寿州守将刘仁赡坚守不降，后周军久攻不下，世宗只好先回开封，所得的州县也大多被南唐收复。

  显德四年（957 年）二月，周世宗第二次亲征，在紫金山大败南唐的援军，寿州孤立无援。三月，刘仁赡病重，部下以他的名义开城投降，刘仁赡不久去世，世宗嘉奖他的忠义。同年冬天，世宗第三次亲征，攻下濠州、泗州、楚州等地，又建造战舰，训练水军，使后周的舰队得以由淮河进入长江。

  显德五年（958 年）三月，南唐中主李璟派人求和，把长江以北的庐、舒、蕲、黄等十四州全部割让给后周，去掉帝号，改称“国主”，奉后周的年号，每年进贡。后周由此取得了江淮之间的富庶地区，财力大增，南唐则只剩下江南之地，国势一落千丈。赵匡胤在这次战争中屡立战功，声望日隆。
sources: []
recalled:
