name: 钟嵘著《诗品》
summary: 钟嵘评论汉至梁的五言诗人，分为上中下三品，是第一部专论诗歌的批评著作。
body: |-
  《诗品》不评在世的人，书中已评到天监十二年（公元 513 年）去世的沈约，所以一般认为它成书于这一年之后、钟嵘去世之前，约在梁天监年间。

  书中评论汉代至梁代的五言诗作者一百二十余人，分为上、中、下三品，每品之中大致按时代先后排列。他为许多诗人追溯渊源，说某人出于《国风》、某人出于《楚辞》，并用简短的语言概括各家的风格。书前的序言论述了五言诗的起源与发展，开篇说“气之动物，物之感人，故摇荡性情，形诸舞咏”。

  钟嵘认为五言诗是众多文体中最有“滋味”的。他反对在诗中大量堆砌典故，批评当时的风气几乎成了抄书；也反对过分拘泥于四声八病，认为这有伤诗歌的自然之美。他把曹植列为上品之首，把陶渊明列入中品，称之为“古今隐逸诗人之宗”，把曹操列入下品，这些评价后世多有争议。《诗品》与刘勰的《文心雕龙》并称南朝文学批评的双璧。
sources: []
recalled:
