name: 《马关条约》
summary: 1895 年中日签订条约，清朝割让台湾、澎湖等地，赔款二亿两。
body: |-
  甲午战争中清朝陆海军接连失败，被迫向日本求和。光绪二十一年（1895 年）三月，清朝派李鸿章为全权大臣，到日本马关（今下关）的春帆楼与日本首相伊藤博文、外相陆奥宗光谈判。谈判期间，李鸿章在返回住处的途中被日本人小山丰太郎开枪击伤面部，日本迫于国际舆论，同意先行停战，但在条约内容上几乎没有让步。

  四月十七日，双方签订《马关条约》，主要内容有：清朝承认朝鲜“完全无缺之独立自主”，即放弃对朝鲜的宗主权；割让辽东半岛、台湾全岛及所有附属岛屿和澎湖列岛给日本；赔偿日本军费二亿两白银；开放沙市、重庆、苏州、杭州为商埠；允许日本人在中国通商口岸开设工厂。

  条约签订后，俄国、德国、法国出于自身的利益，联合干涉，迫使日本放弃辽东半岛，清朝另付“赎辽费”三千万两，史称“三国干涉还辽”。割让台湾的消息传出后，台湾的士绅和民众强烈反对，成立“台湾民主国”，抵抗日军的接收，经过几个月的战斗，日军才占领台湾全岛，此后日本在台湾统治了五十年。

  《马关条约》的巨额赔款使清朝不得不大举借外债，允许外国在华设厂的条款则使外国资本大量进入中国。同年五月，在北京参加会试的康有为等人联合各省举人上书反对议和（另见“公车上书”条）。
sources: []
recalled:
  - 《中日战争》资料丛刊
  - 陆奥宗光《蹇蹇录》
  - 王芸生《六十年来中国与日本》
