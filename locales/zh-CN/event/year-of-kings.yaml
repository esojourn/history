name: 继业者相继称王
summary: 公元前 306 年起，安提柯、托勒密、塞琉古等继业者相继称王。
body: |-
  亚历山大死后十七年间，他的部将在名义上都是替国王管理各省的总督或统帅。国王先有两位：腓力三世前 317 年被奥林匹亚斯所杀，少年亚历山大四世约在前 310 年被卡山德秘密处死。王位空缺了几年，埃及和巴比伦的文书仍用这位已死少年的在位年数纪年。

  公元前 306 年，安提柯之子德米特里率舰队进攻托勒密控制的塞浦路斯，把托勒密的弟弟围在萨拉米斯城中。托勒密亲率舰队来救，在城外海面上被德米特里击败。据狄奥多罗斯，托勒密损失了大部分战舰和运兵船，只带少数船只逃回埃及，全岛投降。

  普鲁塔克记述了报捷的经过：使者阿里斯托德摩斯独自上岸，一路不肯透露消息，走到安提柯面前才高声说：“向国王安提柯致敬！我们打败了托勒密，占领了塞浦路斯。”在场的人随即拥安提柯为王，为他系上王带；他也给德米特里送去一条，信中称他为王。安提柯以此表示自己是亚历山大整个帝国的继承者。

  他随即进攻埃及，受阻而退。托勒密的部下于是也拥立托勒密为王，埃及文书上他的王年从前 305 年至前 304 年起算。塞琉古在同希腊人打交道时开始用王号，据普鲁塔克，他对东方人早已如此；巴比伦的记录显示他在前 305 年前后称王。色雷斯的利西马科斯和马其顿的卡山德也跟着称王，普鲁塔克说卡山德在信函上仍只署自己的名字。远在西西里的阿伽托克勒斯约在前 304 年也自称国王。

  这些王号的根据不是血统，也不是某个民族的拥戴，而是胜利和军队的承认，即希腊人所说的“用矛赢得的土地”。各人称王之后，亚历山大的帝国在名义上也分开了。希腊化时代的君主制，包括钱币上铸国王头像、王后和王子的地位、对国王的祭祀，大体在这几年间成形。现代史家把前 306 年至前 304 年这段时间称作“诸王之年”。
sources: []
