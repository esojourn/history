name: 羯陵伽之战
summary: 阿育王灌顶第八年征服羯陵伽，诏令自述死伤惨重，他因此悔悟。
body: |-
  羯陵伽在印度东海岸，大致相当于今奥里萨邦和安得拉邦北部沿海，当时还不在孔雀王朝治下。关于这场战争，唯一的同时代记载是阿育王自己的第 13 号摩崖诏令；战事的起因、经过和交战地点，诏令都没有说。

  诏令说：天爱喜见王灌顶第八年征服羯陵伽，十五万人被掳走，十万人在那里被杀，死去的人又数倍于此。这三个数字分别指被掳、被杀和因战祸而死的人，都是整数，出自征服者本人之口。按约前 268 年即位推算，战事约在前 261 年或前 260 年，只是约数。

  诏令接着说，征服一个未曾被征服的国家，必有杀戮、死亡和流徙，天爱为此深感痛悔；那里的婆罗门、沙门和各教派的在家人，或自身受害，或亲友遭难，同样令他难过。他宣布以“正法的胜利”为最上的胜利，并希望子孙不再想着新的征伐。此后未见他再发动征服战争的记载。值得注意的是，羯陵伽境内达乌里和阇伽达两处的摩崖诏令没有刻第 11 至 13 号，而是换成两篇专对当地官员的诏令。
sources:
  - 阿育王摩崖诏令第 13 号（据英文维基条目所引译文）
  - 阿育王达乌里、阇伽达摩崖别刻诏令
  - Wikipedia, "Kalinga War" https://en.wikipedia.org/wiki/Kalinga_War
  - Wikipedia, "Major Rock Edicts" https://en.wikipedia.org/wiki/Major_Rock_Edicts
