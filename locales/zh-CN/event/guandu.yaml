name: 官渡之战
summary: 公元 200 年，曹操在官渡以少胜多击败袁绍，奠定了统一北方的基础。
body: |-
  建安四年（公元 199 年），袁绍消灭公孙瓒，据有冀、青、幽、并四州，随即挑选精兵十万、战马万匹，准备南下进攻许都。曹操此时占有兖、豫、徐等州，兵力和粮食都远不如袁绍。《三国志·魏书·武帝纪》说曹军“兵不满万”，裴松之在注中认为这个数字过少，不合情理，但曹军处于劣势是没有疑问的。

  建安五年正月，曹操先出兵徐州，击败背离他的刘备，俘获关羽，刘备投奔袁绍。二月，袁绍派大将颜良围攻黄河南岸的白马。四月曹操北上解围，他佯装要从延津渡河抄袭袁军后路，引袁绍分兵，然后急袭白马，关羽在阵中斩杀颜良。曹军迁走白马的居民沿河西撤，袁军追来，又在延津以南被击败，大将文丑阵亡。此后曹操退守官渡。

  八月，袁绍大军逼近官渡，依沙堆扎营，东西绵延数十里。双方相持两个多月，袁军堆土山、挖地道，曹军以发石车和壕沟对抗。曹军粮草将尽，士卒疲惫，曹操写信给留守许都的荀彧，打算退兵，荀彧劝他坚持。

  十月，袁绍的谋士许攸因家人犯法被捕，一怒之下投奔曹操，告知袁军的粮草屯在大营以北四十里的乌巢，守备不严。曹操留曹洪守营，亲率步骑五千人打着袁军旗号连夜前往，围攻乌巢，放火烧粮，斩守将淳于琼。袁绍派张郃等进攻曹军大营，没有攻下；张郃听说乌巢已失，便投降了曹操。袁军全线崩溃，袁绍与长子袁谭只带八百骑兵渡河北逃。史书记载曹操把来不及逃走而投降的袁军士卒全部杀死，数字有七万余、八万等不同说法。

  两年后袁绍病死，诸子相争。曹操用七年时间逐步占领河北四州，北方大体统一。
sources: []
recalled:
  - 《三国志·魏书·武帝纪》及裴松之注
  - 《三国志·魏书·董二袁刘传》
  - 《后汉书·袁绍刘表列传》
