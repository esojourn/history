name: "五月花号与普利茅斯殖民地"
summary: "莱顿分离派会众的一部分乘五月花号赴北美，1620 年建立普利茅斯殖民地。"
body: |-
  《历史的轨迹》第三十二章说，斯克鲁比的分离派教会因逼迫在 1609 年迁到荷兰莱顿，由罗宾逊牧养，这间莱顿的公理派教会后来在新大陆的教会史上扮演了重要角色。据一般记载，他们在荷兰生活艰难，又担心子女被同化，于是决定移居北美。

  1620 年夏天，一部分会众先乘“斯皮德韦尔号”到英国，与另一批移民会合，9 月由普利茅斯港乘“五月花号”出发，共约一百零二人，11 月抵达科德角。登岸前，男性成员签订了《五月花号公约》，约定组成公民团体、共同遵守公正的法律。12 月他们在普利茅斯定居，头一个冬天死了一半人。罗宾逊留在莱顿，没有去成。

  第三十一章说，在普利茅斯建立殖民地的是分离派信徒，又称“天路客”；几年后建立马萨诸塞湾殖民地的则是一批清教徒（1630 年）。两者都接受加尔文的信仰，前者主张脱离英国教会，后者主张留在其中改革。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
