name: 冒顿破东胡
summary: 冒顿即位后东袭东胡，西击月氏，南并楼烦、白羊，匈奴由此强盛。
body: |-
  据《史记·匈奴列传》，冒顿初立时东胡强盛，先后遣使索要头曼留下的千里马和单于的一位阏氏，冒顿都给了。东胡王更加骄纵，又索要两国之间千余里的弃地，冒顿说“地者，国之本也”，把主张让地的大臣处斩，随即发兵东袭。东胡没有防备，被击破，其王被杀，民众和牲畜被掳走。

  回师后，冒顿西击月氏，南并楼烦、白羊河南王，收回蒙恬所夺的河南地，兵锋到达朝那、肤施。《史记》没有记下确切年份，只说当时汉军正与项羽相持，即在公元前 209 年冒顿即位之后、楚汉战争结束之前；常见的“前 206 年”只是推定。
sources:
  - 《史记·匈奴列传》 https://zh.wikisource.org/wiki/史記/卷110
  - 维基百科“东胡”条（“前 206 年”之说） https://zh.wikipedia.org/wiki/东胡
