name: 崤之战
summary: 前 627 年秦军偷袭郑国未成，回师时在崤山被晋军伏击，全军覆没。
body: |-
  公元前 628 年晋文公去世，秦国驻在郑国的戍将杞子密报秦穆公，说他掌握了郑国北门的钥匙，可以偷袭郑国。秦穆公询问老臣蹇叔，蹇叔认为劳师远袭必然失败，穆公不听，派孟明视、西乞术、白乙丙率军出发。据《左传》僖公三十二年，蹇叔哭着送行，说晋人必定会在崤山伏击，“余收尔骨焉”。

  秦军经过周都北门时，王孙满看到秦军轻狂无礼，断言必败。到了滑国，郑国商人弦高正要到周去做生意，遇到秦军，便假称奉郑君之命，送上十二头牛犒劳秦军，同时派人回国报信。秦军以为郑国已有防备，灭了滑国后回师。

  晋国新君襄公听从先轸的意见，穿着染黑的丧服出兵，联合姜戎在崤山设伏。公元前 627 年四月，秦军经过崤山时遭到伏击，全军覆没，孟明视等三帅被俘。晋襄公的嫡母文嬴（秦穆公之女）请求放回三帅，襄公答应了。秦穆公素服郊迎，承认是自己的过错，仍然重用孟明视。此后秦晋多次交战，秦国东进的道路长期被晋国阻断。

  这次战争之后，秦晋两国由联姻结好变为长期敌对，此后近百年间两国交战不断。弦高犒师的故事也成为商人爱国的著名事例。

  崤山在今河南洛宁、三门峡一带，山路险峻，是关中通往中原的要道。
sources: []
recalled:
  - 《左传》僖公三十二年至三十三年
  - 《史记·秦本纪》
