name: 海陵王迁都燕京
summary: 1153 年金朝海陵王把都城从上京会宁府迁到燕京，改称中都，统治中心转向华北。
body: |-
  金朝初年的都城是上京会宁府（今黑龙江哈尔滨阿城区），远在东北。灭辽、灭北宋以后，金朝统治的重心已转到华北，上京偏处一隅，不便于控制中原和对宋作战，朝中的女真贵族又以上京为根据地，对皇权形成牵制。

  海陵王完颜亮即位后，决定迁都。天德三年（公元 1151 年）他下诏扩建燕京，派张浩等人主持，仿照北宋汴京的规制修建宫城。贞元元年（1153 年）三月，海陵王正式迁都燕京，改称中都，府名大兴，同时把汴京改为南京，并确定了五京制度。为了断绝女真贵族的退路，正隆二年（1157 年）他又下令削去上京的称号，拆毁上京的宫殿和宗室的宅第。大批女真猛安谋克户也随之迁居华北。

  迁都燕京加速了金朝的汉化，也使金朝的统治中心与中原连为一体。金中都是北京第一次成为一个王朝的正式都城，此后元朝在中都东北另建大都，明、清两代也都定都北京。正隆六年（1161 年）海陵王为了南侵，又一度迁都汴京，他死后金世宗回到中都。此后中都作为金朝的都城六十多年，直到 1214 年金宣宗迫于蒙古的压力南迁汴京，次年中都被蒙古军攻陷（另见“金宣宗南迁”条）。今天北京丰台区一带还保存着金中都城墙的遗址。
sources: []
recalled:
  - 《金史·海陵本纪》
  - 《金史·地理志》
  - 《大金国志》
