name: 宋赎燕京
summary: 1122 年宋军两次攻燕京均被辽军击败，金军攻下燕京后，宋朝以重金换回一座空城。
body: |-
  宣和四年（公元 1122 年），金军攻下辽朝的中京，天祚帝逃入夹山，留在燕京的辽朝大臣拥立耶律淳为帝，史称北辽。宋徽宗按照海上之盟的约定，派童贯为宣抚使，种师道为都统制，率军北上进攻燕京。五月，种师道在白沟被辽将耶律大石击败，宋军退回雄州。

  六月耶律淳病死，北辽由萧太后主政，局势动荡。九月辽将郭药师率常胜军以涿州、易州投降宋朝。十月，宋朝又派刘延庆率军攻燕，郭药师率领一支奇兵乘夜攻入燕京城内，但刘延庆的大军没有及时跟进，郭药师寡不敌众，败退出城。刘延庆见辽军营中火起，以为敌军来攻，烧营溃逃，宋军损失很大。

  这年十二月，完颜阿骨打亲率金军攻入居庸关，北辽君臣逃走，金军不战而得燕京。经过反复交涉，宋朝答应在岁币之外每年另付“代税钱”，金朝才同意交还燕京及附近六州。宣和五年（1123 年）四月，金军把燕京城中的官员、富户、工匠和财物全部掳走，把空城交给宋朝。宋朝上下却把这当作大功庆贺，童贯因此封王（另见“海上之盟”条）。两次攻燕的失败，让金朝看清了宋军的虚弱。
sources: []
recalled:
  - 《三朝北盟会编》卷五至十八
  - 《宋史·宦者传·童贯》
  - 《辽史·天祚皇帝本纪》附耶律淳事迹
