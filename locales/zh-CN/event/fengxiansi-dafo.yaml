name: 龙门奉先寺大佛
summary: 唐高宗时在龙门开凿卢舍那大佛，武后资助脂粉钱，是龙门最大的造像。
body: |-
  龙门石窟始凿于北魏孝文帝迁都洛阳前后（另见“龙门石窟开凿”条），唐代是它的第二个高峰期，唐高宗、武则天常住洛阳，皇室和贵族在这里大量开窟造像。

  规模最大的是奉先寺的卢舍那像龛。据龛下唐玄宗开元十年（公元 722 年）补刻的《河洛上都龙门之阳大卢舍那像龛记》，这尊像是高宗下令营造的，咸亨三年（672 年）皇后武氏资助脂粉钱二万贯，上元二年（675 年）十二月完工。主像卢舍那佛坐于正中，两侧依次是弟子、菩萨、天王和力士，共九尊大像，据现代测量，主像通高约十七米。

  卢舍那佛面容丰满，神情安详，是唐代雕塑的代表作。民间传说这尊佛像是按照武则天的容貌雕刻的，并没有史料依据。2000 年，龙门石窟被列入世界文化遗产名录。
sources: []
recalled:
  - 《河洛上都龙门之阳大卢舍那像龛记》
