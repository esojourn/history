name: 高卢人入侵希腊
summary: 公元前 280 年起高卢人大举南下，攻至德尔斐，一部渡海进入小亚细亚。
body: |-
  凯尔特人（希腊人称“加拉太人”，罗马人称“高卢人”）在公元前 4 世纪已迁到多瑙河中游，亚历山大北征时曾接见过他们的使者。利西马科斯在世时挡住了他们。前 281 年利西马科斯和塞琉古相继死去，巴尔干的屏障顿失。

  前 280 年前后，高卢人分三路南下：一路攻色雷斯，一路攻派奥尼亚，波尔吉乌斯率领的一路进入马其顿。刚夺得王位的托勒密·克劳诺斯不等援军就出战，前 279 年初兵败被俘，头颅被挑在长矛上示众。马其顿此后两年没有像样的国王，一位叫索斯特涅斯的将领勉强组织抵抗。

  前 279 年秋，布伦努斯和阿基科里乌斯率更大的一支队伍南下希腊。希腊中部各邦的联军守在温泉关，保萨尼亚斯说其中雅典出了一千步兵和全部能出海的战舰，统帅是雅典人卡利波斯。高卢人正面攻不下，分兵蹂躏埃托利亚的卡利翁城，手段残酷，引走了埃托利亚人；然后由当地人带路，从当年波斯人走过的山道绕到关后，希腊军由雅典舰队接走。布伦努斯率一部直扑德尔斐。据保萨尼亚斯和尤斯丁，时值严冬，高卢人遇到地震、雷电、山石崩落和大雪，夜间又发生惊乱，被福基斯人和埃托利亚人击退，布伦努斯负伤后自尽。希腊人把这场胜利归功于阿波罗，埃托利亚人在各处追击败军，出力最多。神庙的财宝是否被劫，希腊作家与罗马作家的说法相反。

  高卢人的余部散向各处。前 278 年，列昂诺里乌斯和路塔里乌斯率领的约二万人（李维说其中一半是战士）应比提尼亚国王尼科美德斯一世之邀渡海进入小亚细亚，替他打内战，此后四出勒索，最终定居在安卡拉一带，那里因此叫加拉太；新约《加拉太书》的收信人就在这个地区。另一些人在色雷斯建立了延续几十年的提利斯王国。

  前 277 年，安提柯二世在利西马基亚附近设伏，击溃一支高卢军队，凭这场胜利入主马其顿，建立了延续一百多年的王朝。埃托利亚同盟因保卫德尔斐声望大增，此后长期控制近邻同盟会议，成为希腊中部的强国。德尔斐设立“救主节”，各邦派人参加。塞琉古的安条克一世、帕加马的阿塔罗斯一世后来都以击败加拉太人作为自己称王或称“救主”的资本。
sources: []
recalled:
