name: 开皇之治
summary: 隋文帝开皇年间改革官制、法律和户籍，国家财政充裕，史家称为“开皇之治”。
body: |-
  隋文帝杨坚在开皇元年（公元 581 年）代周建隋，此后二十年间推行了一系列改革，后世史家把这一时期称为“开皇之治”。

  在中央，隋朝把北周仿照《周礼》设立的六官改为尚书、内史（中书）、门下三省，尚书省下设吏、礼、兵、刑、民（户）、工六部，三省分掌决策、审议和执行，这一框架为唐朝所沿用。在地方，北朝以来州郡数量膨胀，有“十羊九牧”之说，开皇三年（583 年）隋朝废除郡一级，改为州、县两级，裁减了大批官员。地方官的僚属原来由长官自行辟署，此后改由中央任免，并规定地方官不得在本乡任职，定期调换。九品中正制也在开皇年间被废除。

  在法律上，开皇元年和三年先后制定、修订《开皇律》，由高颎、苏威等人主持，删去了不少酷刑和死罪条文，确立了笞、杖、徒、流、死五刑，又设立“十恶”之条，这些内容大多为唐律所继承。

  在财政上，隋朝通过“大索貌阅”和“输籍法”清查户口（另见该条），又在各州设置义仓，储粮备荒，并在长安、洛阳附近修建大型粮仓。据《隋书·地理志》，到大业五年（609 年），全国有户八百九十余万。唐初的人常说隋朝的仓库储积丰厚，唐太宗时仍未用完。

  开皇年间也有阴暗面：文帝晚年猜忌功臣，刑罚日益严苛，废太子杨勇，高颎、苏威先后被罢免。仁寿年间修建仁寿宫，役使百姓，死者很多。
