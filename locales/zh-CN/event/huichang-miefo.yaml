name: 会昌灭佛
summary: 唐武宗会昌年间大规模废佛，拆毁寺院、勒令僧尼还俗，外来宗教也一并被禁。
body: |-
  唐代佛教寺院占有大量田产和人口，僧尼不纳税、不服役，与朝廷的财政和兵源产生了矛盾。唐武宗崇信道教，宠信道士赵归真等人，宰相李德裕也主张限制佛教。从会昌二年（公元 842 年）起，朝廷开始清查僧尼，勒令犯有过失、私蓄财产的僧尼还俗，此后又陆续禁止供养佛牙、拆毁没有朝廷赐额的小寺院。

  会昌五年（845 年）四月，朝廷下令检查天下寺院和僧尼的数目；七月下令，长安、洛阳两京的左右街各只保留两座寺院，每寺留僧人三十名，各道节度使、观察使的治所和部分州只保留一座寺院，其余寺院一律拆毁，僧尼全部还俗。据《旧唐书·武宗纪》，这次共拆毁寺院四千六百余所，招提、兰若等小庙宇四万余所，还俗僧尼二十六万零五百人，没收良田数千万顷，寺院奴婢十五万人被编为纳税的平民。寺院的铜像、钟磬被熔化铸钱，铁像用来铸造农具。同时，景教（基督教的一支）、摩尼教、祆教也一并被禁止，据同书记载，这几种外来宗教的僧侣被勒令还俗的有两千多人。

  当时正在唐朝求法的日本僧人圆仁亲历了这次灭佛，被迫还俗回国，他在《入唐求法巡礼行记》中详细记录了各地拆寺、驱僧的情形，也记载了河北的藩镇对朝廷的命令并没有认真执行。

  会昌六年（846 年）武宗去世，唐宣宗即位后下令恢复佛教，但许多寺院和经典已经无法恢复。这次灭佛对依赖经典和寺院的佛教宗派打击尤其沉重，禅宗受到的影响较小，此后逐渐成为中国佛教的主流。佛教史上把北魏太武帝、北周武帝、唐武宗和后周世宗的四次灭佛合称为“三武一宗”之厄。
sources: []
