name: 司马颙
aliases: [河间王颙, 司马文载]
role: 河间王
summary: 晋宗室疏属，镇关中，其部将张方劫晋惠帝到长安，后被东海王越击败。
body: |-
  司马颙字文载，是司马懿之弟司马孚的孙子，在诸王中与皇室的血缘较远，袭封后改为河间王，生年不详。元康九年（公元 299 年）他出镇关中，驻长安。

  赵王伦称帝时，他起初依附赵王，听说齐王冏、成都王颖兵势强盛，才转而加入讨伐的一方。太安元年（302 年）他上表声讨齐王冏，结果长沙王乂杀了齐王而执政；次年他又与成都王颖联兵攻打长沙王，派部将张方进逼洛阳。永兴元年（304 年）成都王颖带着惠帝逃回洛阳后，张方把惠帝和成都王一起劫到长安，朝政由此归他掌握。

  永兴二年（305 年），东海王越在关东起兵，以迎惠帝还洛阳为名西进。他杀了张方求和，没有成功。光熙元年（306 年）东海王的军队攻入长安，惠帝东还，他逃入山中，后来仍据守长安。同年十二月（已入公元 307 年），朝廷下诏征他为司徒，他应召东行，途中在新安被南阳王司马模的部将杀死。
sources: []
recalled:
