name: 秦纳
aliases: [卢基乌斯·科尔内利乌斯·秦纳, 辛纳]
role: 罗马执政官
summary: 罗马执政官，与马略合兵攻入罗马，连任执政官四年，被哗变士兵杀死。
body: |-
  卢基乌斯·科尔内利乌斯·秦纳，罗马贵族，生年不详。同盟者战争中他任副将，与马尔西人作战。公元前 88 年苏拉进军罗马之后主持选举，秦纳当选前 87 年的执政官；苏拉让他上卡皮托利山起誓不改变既定的安排，然后东征。

  他上任后即提出把新得公民权的意大利人平均编入全部三十五个部落，并召回被放逐的马略一派。同僚屋大维乌斯反对，双方支持者在广场上厮杀，秦纳被逐出罗马，元老院宣布罢免他。他到坎帕尼亚争取到驻军，联合塞多留、卡尔波，又与从阿非利加回来的马略会合，分路围困罗马。城内饥疫交加，元老院投降。马略的奴隶卫队连杀五天。

  前 86 年马略就任执政官后十几天病死，此后秦纳又连任两年执政官，实际上未经正常选举，史家称为“秦纳的统治”。他削减债务，新公民的部落分配得以落实；派去东方接替苏拉的军队没有成功。他把女儿科尔内利娅嫁给年轻的恺撒。

  前 85 年苏拉与米特里达梯议和，写信给元老院宣布即将回师。前 84 年初，秦纳在安科纳集结军队，准备渡海迎战。士兵不愿在冬季渡海打内战，他召集大会训话时发生骚乱，被自己的士兵杀死。
sources: []
