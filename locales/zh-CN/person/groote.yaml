name: 革若特
aliases:
  - 格鲁特
  - 海尔特·格罗特
  - 杰拉德·格鲁特
role: 讲道者、共同生活弟兄会的创始人
summary: 荷兰代芬特尔人，悔改后在乌得勒支教区讲道，他的跟随者组成共同生活弟兄会。
body: |-
  革若特 1340 年 10 月生于荷兰艾瑟尔河畔的代芬特尔，父亲是富有的布商、市政官。他十岁时父母死于瘟疫。十五岁他到巴黎大学读书，三年后得硕士学位，又学过法律、医学和神学，回来后在亚琛和乌得勒支领着教会的俸禄，生活优裕。

  约在 1374 年，他得了一场重病，又受一位在修道院作院长的旧友劝导，决心改变生活。他辞掉俸禄，把代芬特尔的家宅让给一些贫穷的敬虔妇女居住，自己到加尔都西会的修道院里住了几年，其间去拜访过佛兰德的灵修作家吕斯布鲁克。

  约 1379 年他受立为执事，自认不配作司铎，得到主教许可后在乌得勒支教区各城讲道。他用当地的语言讲悔改和跟随基督，直言责备教士蓄妾、买卖圣职和修士私蓄财产。《历史的轨迹》第二十章说他向许多渴慕的听众讲道，带起了伟大的宗教复兴。被他责备的教士设法反击，1383 年主教下令执事不得讲道，他服从了，同时向教皇申诉。1384 年 8 月 20 日他因探望染瘟疫的朋友受感染去世，申诉还没有结果。

  他生前聚集了一些青年抄写书籍，以此维持生活。他去世后，同伴弗洛伦斯·拉德韦因斯把这些人组织起来，同住一处，财物公用，不发修道的誓愿，这就是共同生活弟兄会；另一些人按他的遗愿在 1387 年建立了温德斯海姆修道院。这一股风气后人称为“现代灵修”。

  《历史的轨迹》说这个运动约于 1350 年兴起；那时革若特才十岁，实际是在 1370 年代以后。该书强调弟兄会注重教育，希望借教育带出教会的改革，马丁·路德曾在他们设在马格德堡的学校读过一年，多马·肯培、伊拉斯谟等人都受过他们的造就。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 多马·肯培《革若特传》
  - 鲁道夫·迪尔·范·穆伊登《代芬特尔弟兄会纪事》
  - 革若特《书信集》
