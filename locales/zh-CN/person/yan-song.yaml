name: 严嵩
aliases: [严分宜]
role: 嘉靖年间的内阁首辅
summary: 以擅写青词得宠，任首辅近二十年，与儿子严世蕃专权，后被罢免。
body: |-
  严嵩是江西分宜人，弘治十八年（1505 年）考中进士，早年以诗文知名，曾因病在家乡钤山读书近十年。嘉靖年间他升任礼部尚书，在“大礼议”的余波中迎合嘉靖帝，为皇帝生父入太庙称宗出力，受到信任。嘉靖帝崇信道教，经常举行斋醮，需要撰写献给上天的“青词”，严嵩擅长此道，深得宠爱。

  嘉靖二十一年（1542 年）严嵩以礼部尚书入阁，此后排挤首辅夏言，嘉靖二十七年（1548 年）夏言被处死，严嵩成为首辅，直到嘉靖四十一年（1562 年），掌权前后近二十年。他年老后，政事多由儿子严世蕃代为处理，严世蕃聪明机敏，善于揣摩皇帝的心意，父子二人收受贿赂，任用私人。锦衣卫经历沈炼、兵部员外郎杨继盛先后上疏弹劾严嵩，都被害死。嘉靖二十九年（1550 年）俺答汗兵临北京时，据《明史》记载，严嵩告诉兵部尚书丁汝夔不要轻易出战，事后丁汝夔被处死（另见“庚戌之变”条）。

  嘉靖四十一年（1562 年）御史邹应龙弹劾严世蕃，嘉靖帝对严嵩的宠信已经衰减，在徐阶等人的推动下，严嵩被罢官，严世蕃被流放。嘉靖四十四年（1565 年）严世蕃以通倭等罪名被处死，严家被抄没。严嵩回到家乡，据说晚年贫困，寄食于墓舍，约在隆庆元年（1567 年）去世，卒年一说在次年。《明史》把他列入《奸臣传》。他的书法很好，北京的一些匾额相传出自他手。
sources: []
recalled:
  - 《明史·严嵩传》
  - 《明世宗实录》
