name: 塞多留
aliases: [昆图斯·塞多留, 塞尔托里乌斯, 塞多留斯]
role: 罗马将领
summary: 马略派将领，苏拉得势后在西班牙割据八年，屡败庞培，被部下刺杀。
body: |-
  昆图斯·塞多留，约公元前 126 年生于萨宾地区的努尔西亚，家族属骑士等级。前 105 年他在阿劳西奥的惨败中负伤，游过罗讷河逃生；后来在马略麾下，据普鲁塔克，曾扮作凯尔特人混入敌营侦察。同盟者战争中他任财务官，作战时失去一只眼睛。

  前 88 年他竞选保民官，因苏拉反对而落选，从此站到马略和秦纳一边，前 87 年是围攻罗马的将领之一。城破后马略的奴隶卫队滥杀，据普鲁塔克，是他派兵把这些人处决的。前 83 年他任大法官，随后前往自己的行省近西班牙。苏拉派来的军队翻过比利牛斯山，他退到毛里塔尼亚；普鲁塔克说他听水手讲起大西洋上的“幸福岛”，一度想去那里隐居。

  前 80 年卢西塔尼亚人请他回去做首领。他带着两千多罗马人和几百名非洲人，用游击战术接连击败苏拉派的几位总督。他善于笼络当地人：在奥斯卡办学校，让各部落首领的儿子穿罗马服装、学希腊文和拉丁文，这些孩子同时也是人质；他养了一头白色的小鹿，说是狄安娜女神所赐，能向他传达神意。流亡的罗马人不断来投，他从中选三百人组成“元老院”。苏拉的同僚梅特卢斯·庇乌斯同他作战多年没有成效。前 77 年佩尔佩尔纳带着雷必达叛乱的残部来会合，元老院则派年轻的庞培前来。前 76 年他在劳罗击败庞培，次年在苏克罗河又险些把庞培俘获。据阿庇安和普鲁塔克，他还与米特里达梯六世订约，派军官去为本都练兵，换取船只和金钱。

  此后梅特卢斯和庞培改为逐城蚕食，他连遭挫折，西班牙人离心，罗马部下怨他严苛，他也变得多疑，处死了作人质的学生。前 73 年（一说前 72 年），佩尔佩尔纳等人在奥斯卡的一次宴会上把他刺死。佩尔佩尔纳不久败于庞培被杀，战事结束。
sources: []
recalled:
  - 普鲁塔克《塞多留传》
  - 阿庇安《内战史》卷一第 108—115 章
  - 萨卢斯特《历史》残篇
