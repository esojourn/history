name: 颜真卿
aliases: [颜鲁公, 颜清臣]
role: 平原太守、书法家
summary: 唐代书法家、大臣，安史之乱时在平原起兵抗燕，后被叛将李希烈杀害，楷书称“颜体”。
body: |-
  颜真卿字清臣，景龙三年（公元 709 年）生，祖籍琅琊临沂，是北齐颜之推的五世孙，家族世代以学问著称。他自幼丧父，由母亲抚养，开元二十二年（734 年）考中进士，此后任监察御史等职，因为刚直得罪宰相杨国忠，天宝十二载（753 年）被外放为平原太守。

  他在平原时察觉安禄山有反意，借口防备水灾，暗中加固城墙、储备粮草。天宝十四载（755 年）安禄山起兵，河北各郡大多望风而降，他在平原坚守，与任常山太守的堂兄颜杲卿相约起兵，河北十七郡一度响应，推他为盟主。次年常山失陷，颜杲卿和他的儿子颜季明遇害。至德二载（757 年）他到凤翔拜见唐肃宗，任宪部尚书。乾元元年（758 年）他找到颜季明的遗骨，写下祭文，这份草稿就是后世称为“天下第二行书”的《祭侄文稿》。

  此后他因为刚直，屡次被权臣排挤外放，唐代宗时封鲁郡公，所以后人称他“颜鲁公”。他在湖州任刺史时，与陆羽、皎然等人交往。建中四年（783 年），淮西节度使李希烈反叛，宰相卢杞忌恨他，奏请派他前去宣慰。他到达后被李希烈扣留，李希烈多次威逼利诱，他都不屈服。兴元元年（784 年）八月，他在蔡州被李希烈派人缢杀，年七十六（一说死于贞元元年，即 785 年）。

  颜真卿的楷书端庄雄浑，一改初唐以来的秀美风格，后世称“颜体”，代表作有《多宝塔碑》《麻姑仙坛记》《颜勤礼碑》等，与柳公权并称“颜柳”。
sources: []
recalled:
  - 《旧唐书·颜真卿传》
  - 《新唐书·颜真卿传》
  - 殷亮《颜鲁公行状》
