name: 戴德生
aliases: [哈德森·泰勒]
role: 英国来华传教士，中华内地会的创办者
summary: 英国传教士，创办中华内地会，派传教士深入中国内地各省，最后在长沙去世。
body: |-
  戴德生出生于英格兰约克郡的巴恩斯利，父亲是药剂师和循道会的传道人。他十七岁时决志将来到中国传教，此后学习医学，1853 年受“中国传道会”派遣，次年到达上海。他改穿中国服装、留辫子，到上海周边和宁波一带传教，与其他传教士的做法很不相同。

  1860 年他因病回到英国，在伦敦一面学习医学，一面与人修订宁波方言的《新约》，同时思考如何把福音传到中国内地。当时传教士大多集中在通商口岸，内地还有许多省份没有传教士。1865 年他在英国创办了“中国内地会”，不属于任何宗派，不公开募捐，接受各宗派的传教士。1866 年他带领第一批十几名传教士乘“兰茂密尔号”到达上海，随后以杭州为基地开展工作。

  此后中国内地会的传教士逐渐进入中国内地的各个省份，到十九世纪末成为在华规模最大的差会之一。传教士在内地也常与当地民众发生冲突，1868 年发生了扬州教案。1900 年义和团运动中，内地会有很多传教士和中国信徒遇害，戴德生拒绝接受赔偿。1905 年他最后一次来华，到达长沙后不久去世，安葬在江苏镇江。
sources: []
recalled:
  - 戴存义夫妇《戴德生传》
  - 戴德生《中国的属灵需要与呼求》
