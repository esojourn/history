name: 崇祯帝
aliases: [朱由检, 明思宗, 明毅宗]
role: 明朝最后一位皇帝
summary: 铲除魏忠贤，勤政而多疑，内忧外患交加，1644 年北京城破时自缢。
body: |-
  朱由检是泰昌帝的第五个儿子，天启帝的异母弟，封信王。天启七年（1627 年）天启帝死后无子，朱由检即位，次年改元崇祯。他即位后不久就清除魏忠贤，魏忠贤在被贬往凤阳的途中自缢，阉党被大批罢免，朝野一时振奋。

  崇祯帝勤于政事，但性格急躁多疑，在位十七年间更换了五十位内阁大学士，诛杀、逼死的总督、巡抚多人。崇祯二年（1629 年）后金皇太极绕道蒙古攻入长城，兵临北京城下，次年他以通敌的罪名将督师袁崇焕处死（另见“己巳之变”条）。此后辽东的局面更难挽回，崇祯十五年（1642 年）松锦之战失利，蓟辽总督洪承畴投降清朝。

  与此同时，陕西等地连年饥荒，农民起义此起彼伏（另见“明末农民起义”条）。朝廷为了应付辽东和镇压起义的军费，先后加派“辽饷”“剿饷”“练饷”，合称“三饷”，百姓负担更重，更多的人加入起义队伍。朝廷在“剿”与“抚”之间反复，未能平定李自成、张献忠等部。

  崇祯十七年（1644 年）三月，李自成的大顺军攻破北京。十九日凌晨，朱由检在煤山（今景山）自缢，年三十四岁，明朝在北方的统治结束（另见“甲申之变”条）。相传他在衣襟上留下遗诏，有“朕凉德藐躬”“任贼分裂朕尸，勿伤百姓一人”等语，具体文字各书记载不一。清朝入关后以帝礼改葬，南明弘光朝追上庙号思宗，后又改为毅宗，清朝称他为庄烈帝。
sources: []
recalled:
