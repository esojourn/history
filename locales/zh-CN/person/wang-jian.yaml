name: 王建
aliases: [王光图, 贼王八, 前蜀高祖]
role: 前蜀皇帝
summary: 许州舞阳人，唐末据有西川，907 年唐亡后在成都称帝，建立前蜀。
body: |-
  王建是许州舞阳人，大中元年（公元 847 年）生，字光图。据史书，他年轻时游手好闲，以宰牛、偷驴、贩私盐为生，乡里人叫他“贼王八”。后来他投军，在忠武军中任将领，随宦官杨复光镇压黄巢起义。唐僖宗逃往兴元时，他率兵护卫，后来被大宦官田令孜收为养子。

  田令孜失势后投奔西川节度使陈敬瑄，王建也离开朝廷，在利州、阆州一带聚兵。文德元年（888 年）起，他率军进攻西川，大顺二年（891 年）攻入成都，唐朝任命他为西川节度使。此后他陆续夺取东川、山南西道等地，据有整个蜀地，天复三年（903 年）被唐朝封为蜀王。

  天祐四年（907 年）朱温篡唐，王建不承认后梁，传檄各地，号召讨伐，响应者很少。同年九月，他在成都称帝，国号蜀，史称前蜀。中原战乱，许多唐朝的士人逃到蜀地，王建加以任用，以韦庄等人为宰相，前蜀的典章制度大体沿用唐朝。据史书，他虽然不识字，却喜欢和读书人交谈，对唐朝的礼仪典故相当熟悉。

  王建晚年宠信宦官和徐贤妃姐妹。永平三年（913 年），太子王元膺起兵杀了权臣唐道袭，随即兵败被杀，王建改立徐贤妃所生的幼子王衍为太子。光天元年（918 年）他在成都去世，年七十二。他的陵墓永陵在今成都市区，1940 年代经过考古发掘，墓中石棺床上刻有二十四个伎乐人物，是研究五代音乐的重要实物。
sources: []
recalled:
  - 《旧五代史·僭伪列传·王建》
  - 《新五代史·前蜀世家》
  - 《资治通鉴》卷二百五十六至二百七十
