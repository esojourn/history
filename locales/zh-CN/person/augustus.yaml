name: 奥古斯都
aliases: [屋大维, 屋大维乌斯, 盖乌斯·尤利乌斯·恺撒·屋大维努斯, 该撒亚古士督, 亚古士督]
role: 罗马元首
summary: 恺撒的养子，原名屋大维，击败安东尼后结束内战，创立元首制，是罗马第一位皇帝。
body: |-
  本名盖乌斯·屋大维乌斯，公元前 63 年 9 月 23 日生于罗马。父亲出自韦利特莱的骑士家庭，做到大法官；母亲阿提娅是恺撒的外甥女。前 44 年恺撒遇刺时他十八岁，正在伊利里亚的阿波罗尼亚求学，得知恺撒在遗嘱中收他为养子，便回意大利接受遗产，改用恺撒的名字；今人为了区别称他“屋大维”。

  他用恺撒的名字招募老兵，先与元老院和西塞罗合作，前 43 年在穆提纳与安东尼作战；两名执政官阵亡后，他带兵进罗马，十九岁当选执政官。同年 11 月他与安东尼、雷必达结成后三头，公布公敌名单。前 42 年腓立比之战后，他回意大利没收土地安置老兵，随后在佩鲁西亚击败安东尼的弟弟和妻子。前 36 年靠阿格里帕在瑙洛库斯海战中击败塞克斯图斯·庞培，随即解除雷必达的兵权，西部全归他一人。

  他与在东方的安东尼渐成对立，前 32 年让意大利和西部各省向他个人宣誓效忠。前 31 年亚克兴海战获胜，次年进入亚历山大城，安东尼和克娄巴特拉自杀，埃及归他直接管辖。前 29 年他回罗马举行三天凯旋式，关闭雅努斯神庙的大门。

  前 27 年 1 月他在元老院宣布交还权力，元老院请他继续管辖驻有军队的边疆行省，并授予“奥古斯都”（意为“至尊”）的称号。前 23 年他不再连任执政官，改取保民官权力和高于各行省总督的治权。他自称“元首”，即第一公民，共和国的官职照旧选举，实权集中在他手里。后世把前 27 年看作罗马帝国的开端。

  此后四十年他建立常备军和近卫军，把边界推进到多瑙河；公元 9 年瓦卢斯的三个军团在条顿堡森林覆没，他放弃了易北河一线。维吉尔、贺拉斯、李维都在他的时代写作。《路加福音》记耶稣降生时“该撒亚古士督”下旨报名上册，说的就是他。他最后收养妻子李维娅的儿子提比略为继承人，公元 14 年 8 月 19 日在诺拉去世。他自撰的《功业录》刻在各地的神庙墙上，安卡拉的一份保存至今。
sources: []
