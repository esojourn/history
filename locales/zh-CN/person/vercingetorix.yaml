name: 维钦托利
aliases: [韦辛格托里克斯, 维钦及托列克斯, 维尔金格托里克斯]
role: 高卢阿维尔尼人首领
summary: 高卢阿维尔尼人首领，前 52 年统领高卢各部反抗恺撒，在阿莱西亚被围后投降。
body: |-
  高卢阿维尔尼人的贵族，约生于公元前 82 年。父亲凯尔提洛斯曾是高卢势力最大的人，因图谋称王被本族人处死。关于他的记载几乎全出自对手恺撒的《高卢战记》卷七，另有普鲁塔克、狄奥等人的零星补充。

  恺撒在前 58 年至前 53 年间逐步控制高卢。前 52 年初，卡尔努特人在凯纳布姆杀死罗马商人，各部相继响应。维钦托利在格尔戈维亚号召起事，被叔父等人赶出城去，他在乡间聚众打回来，被推为王；不久高卢中西部各部落都奉他为统帅。据恺撒，他军令极严。

  他的办法是避免会战，烧掉沿途的村镇和粮草，用骑兵截杀出来征粮的罗马人。比图里吉人恳求保留他们的城阿瓦里库姆，他勉强同意；恺撒围攻近一个月破城，据恺撒，四万居民只有八百人逃出。随后恺撒进攻格尔戈维亚，在城下受挫，自记损失近七百人和四十六名百夫长。连一向亲罗马的埃杜伊人也倒向起事一方，各部在比布拉克特开会，确认维钦托利为统帅。

  这年夏天他的骑兵袭击行军中的恺撒失利，他退入曼杜比人的山城阿莱西亚。恺撒环城修筑工事，又在外侧筑一道更长的工事以防援军。各部落派来的援军，恺撒说有步兵二十五万、骑兵八千，现代学者认为远没有这么多。内外夹攻数日不能突破，援军溃散。次日维钦托利对部众说，他起兵是为了大家的自由，如今愿任凭处置，随后出城投降。据普鲁塔克，他披挂整齐骑马绕恺撒一周，下马卸甲，坐在他脚前。

  他被关押在罗马六年。前 46 年恺撒举行凯旋式，他被牵着游街，然后被处死。十九世纪他被法国人尊为民族英雄，拿破仑三世在阿莱西亚遗址为他立了巨像。
sources: []
recalled:
  - 恺撒《高卢战记》卷七
  - 普鲁塔克《恺撒传》第 25—27 章
  - 卡西乌斯·狄奥《罗马史》卷四十第 33—41 章、卷四十三第 19 章
