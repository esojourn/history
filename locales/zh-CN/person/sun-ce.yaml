name: 孙策
aliases: [孙伯符, 讨逆将军, 吴侯]
role: 讨逆将军
summary: 孙坚长子，数年间攻取江东六郡，为孙吴政权奠定基础，二十六岁遇刺身亡。
body: |-
  据《三国志·吴书·孙破虏讨逆传》，孙策字伯符，是孙坚的长子。孙坚出征时，他随母亲住在庐江舒县，与同岁的周瑜结为好友。父亲战死后，他到寿春依附袁术，兴平元年（公元 194 年）要回父亲的旧部一千多人。

  兴平二年（195 年），孙策以协助舅父吴景的名义率军渡江，击败扬州刺史刘繇，周瑜带兵前来会合。此后几年他接连攻取丹杨、吴郡、会稽，会稽太守王朗战败投降。建安二年（197 年）袁术称帝，孙策写信劝阻无效，与他断绝了关系。曹操为拉拢他，上表任他为讨逆将军，封吴侯。建安四年他西取庐江，击败黄祖，又收降豫章，江东大体平定。

  建安五年（200 年）春，曹操与袁绍在官渡相持。孙策此前杀了吴郡太守许贡，这时在丹徒外出打猎，被许贡的门客刺伤，伤势很重。本传记载，他把政事托付给张昭等人，又对弟弟孙权说：带领江东的军队在两阵之间决胜，与天下争衡，你不如我；选用贤能、让他们各尽其心以保住江东，我不如你。当夜去世，时年二十六。
sources: []
recalled:
  - 《三国志·吴书·孙破虏讨逆传》
