name: 普罗泰戈拉
aliases: [普罗塔哥拉]
role: 智者
summary: 阿布德拉人，最著名的智者，说“人是万物的尺度”。
body: |-
  色雷斯沿海的希腊城邦阿布德拉人。生卒年是约数：柏拉图在《美诺篇》里说他活了将近七十岁，从业四十年；在《普罗泰戈拉篇》里，他对苏格拉底等人说自己的年纪足以做在场任何人的父亲。

  他周游各城授课，多次到雅典。据柏拉图，他是第一个公开自称“智者”并收取学费的人，自称教的是“善谋”，即怎样把家事和城邦的事务管好，在言行两方面成为最有能力的人。他的学费很高，柏拉图说他赚的钱比菲迪亚斯和另外十个雕塑家加起来还多。他与伯里克利有交往，普鲁塔克记两人曾用一整天讨论一个问题：竞技中有人被标枪误杀，责任在标枪、在掷枪的人，还是在主办者。据第欧根尼·拉尔修转引公元前 4 世纪赫拉克利德的说法，前 444 年前后雅典主持建立殖民城邦图里伊时，由他为之起草法律。

  他的著作只留下几句。《真理》一书开头说：人是万物的尺度，是存在者存在的尺度，也是不存在者不存在的尺度。柏拉图在《泰阿泰德篇》里把这句话解释为，事物对每个人显得怎样，对那个人就是怎样，并加以反驳。《论神》开头说：关于神，我无法知道他们存在还是不存在，也无法知道他们是什么样子，因为妨碍认识的东西很多，问题晦暗不明，人生又短促。古人还说他主张每个问题都有两种相反的说法，并教人“使较弱的论证变强”。在语言方面，他区分过名词的性和句子的种类。

  较晚的作家说，他因《论神》被雅典人判罪，书被搜出在市场上焚烧，他本人在逃往西西里途中溺死。但柏拉图说他直到去世都享有好名声，现代学者因此多不相信这个故事。柏拉图以他的名字命名了一篇对话，其中让他讲了普罗米修斯盗火、宙斯把正义与羞耻分给所有人的神话，来说明政治德行人人有份而又可以教授。
sources: []
