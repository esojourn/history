name: 朱熹
aliases: [朱元晦, 晦庵, 朱子, 朱文公]
role: 理学家
summary: 南宋理学家，集北宋以来理学之大成，所著《四书章句集注》成为元明清科举的标准。
body: |-
  朱熹字元晦，号晦庵，祖籍徽州婺源（今属江西），生于建炎四年（公元 1130 年），出生地是父亲任职的南剑州尤溪（今福建尤溪）。父亲去世后，他依父亲生前的嘱托，随刘子翚等人读书，后来在崇安、建阳一带长期居住。绍兴十八年（1148 年）他十九岁考中进士。此后他师从李侗，李侗是程颐的再传弟子，朱熹由此接上了二程的学统。

  朱熹一生在外做官的时间只有九年左右，在朝廷只有四十多天，大部分时间在福建讲学著述。淳熙六年（1179 年）他知南康军，修复庐山白鹿洞书院，制定学规；后来又任浙东提举常平、知漳州、知潭州，在潭州修复岳麓书院。绍熙五年（1194 年）宋宁宗即位，他被召为侍讲，因上书议论韩侂胄干政，四十多天就被罢免。

  此后韩侂胄发动“庆元党禁”，朱熹的学说被斥为“伪学”，他本人被列为“伪学逆党”之首，门人有的改换门庭（另见“庆元党禁”条）。庆元六年（1200 年）他在建阳考亭去世，送葬的门人被官府限制。党禁解除以后，朝廷追谥他为“文”。

  朱熹继承周敦颐、张载、程颢、程颐的学说，以“理”为万物的根本，主张“格物致知”，通过读书和探究事物来体认天理。他为《大学》《中庸》《论语》《孟子》作注，合称《四书章句集注》，此外还有《周易本义》《诗集传》等，门人编有《朱子语类》。他与陆九渊在鹅湖论学，与陈亮辩论王霸义利，是南宋学术论争的中心人物（另见“鹅湖之会”条）。

  宋理宗时朱熹从祀孔庙，元仁宗皇庆二年（1313 年）恢复科举，规定以《四书章句集注》为考试的标准，此后明清两代沿用，程朱理学成为此后六百年的官方学说。
sources: []
recalled:
