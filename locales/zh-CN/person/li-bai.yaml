name: 李白
aliases: [李太白, 青莲居士, 谪仙人, 诗仙]
role: 诗人
summary: 盛唐诗人，诗风豪放飘逸，后世称为“诗仙”，与杜甫并称“李杜”。
body: |-
  李白字太白，号青莲居士。据他自述和族叔李阳冰的《草堂集序》，他的祖籍是陇西成纪，先人在隋末因罪流徙西域，到他父亲时才迁回蜀中。他的出生地有西域碎叶、蜀中等不同说法，学界至今没有定论；一般认为他五岁左右随家迁居绵州昌隆县（今四川江油）的青莲乡，在蜀中长大。他少年时读书学剑，好任侠，又曾跟随隐士在山中修道。

  开元十二年（公元 724 年）前后，他离开蜀地，沿长江东下，漫游各地。后来他在安陆娶了前宰相许圉师的孙女，在那里住了十年左右。天宝元年（742 年），经人推荐，他应诏入京，据他的《对酒忆贺监》诗序，贺知章读了他的诗，称他为“谪仙人”。玄宗让他供奉翰林，为宫廷写作诗文。但他性情傲岸，不能见容于权贵，天宝三载（744 年）被“赐金放还”。

  离开长安后，他在洛阳与杜甫相识，又与杜甫、高适同游梁宋一带，此后继续漫游各地。天宝十四载（755 年）安史之乱爆发，次年他应永王李璘的邀请进入幕府。永王与肃宗不和，至德二载（757 年）兵败被杀，李白因此被关进浔阳的监狱，后被判流放夜郎。乾元二年（759 年）他在流放途中走到白帝城附近时遇赦，写下了《早发白帝城》。

  宝应元年（762 年）他投靠在当涂任县令的族叔李阳冰，同年病逝，年六十二，临终前把诗稿交给李阳冰编集。后世流传他醉后入水捉月而死的故事，是传说。

  他的诗现存近千首，想象奇特，语言奔放，善于运用乐府和歌行，《蜀道难》《将进酒》《梦游天姥吟留别》《静夜思》等都是名篇。后世称他为“诗仙”，与杜甫并称“李杜”。
sources: []
recalled:
  - 李阳冰《草堂集序》
  - 范传正《唐左拾遗翰林学士李公新墓碑》
  - 《旧唐书·文苑传·李白》
  - 《新唐书·文艺传·李白》
