name: 窦建德
aliases: [夏王]
role: 隋末起事首领
summary: 隋末河北起事首领，建立夏政权，621 年援救王世充时在虎牢兵败被擒。
body: |-
  窦建德是贝州漳南人，出身农家，在乡里以重义气著称，曾任里长。大业七年（公元 611 年）隋炀帝征发兵士征讨高句丽，他被选为二百人长。同乡孙安祖家破人亡，他帮助孙安祖聚众进入高鸡泊起事，自己因此全家被官府杀害，只好率部投奔另一支起事队伍的首领高士达。

  高士达战死后，他收拾余众，势力逐渐壮大。据史书记载，他对俘获的隋朝官吏多加任用，不随意杀戮，与部众同甘苦，所以河北士人多来归附。据《旧唐书》本传，他每次攻城破敌，所得财物都分赏给部下，自己一无所取，平时不吃肉，妻子曹氏也不穿绫罗。大业十三年（617 年）他在乐寿自称长乐王，次年改称夏王，后来定都洺州。武德二年（619 年），他攻破聊城，擒杀了弑君的宇文化及，随宇文化及北上的隋炀帝萧皇后也落入他手中，不久被突厥的义成公主接往突厥。此后他又一度与唐朝争夺河北各地。

  武德四年（621 年），李世民率唐军围攻洛阳的王世充，王世充向他求救。他认为唐若灭郑，夏也难以自保，于是率大军西进。李世民分兵据守虎牢，阻挡他的进路。双方相持一个多月后决战，夏军大败，窦建德受伤被擒（另见“虎牢之战”条）。洛阳的王世充随即投降。窦建德被押到长安处斩，年四十九。他的旧部不久拥立刘黑闼再次起兵，河北又经过两年的战争才平定。
sources: []
recalled:
  - 《旧唐书·窦建德传》
  - 《新唐书·窦建德传》
  - 《资治通鉴》卷一百八十一至一百八十九
