name: 刘禅
aliases: [刘公嗣, 后主, 阿斗, 安乐公]
role: 皇帝
summary: 蜀汉第二位也是最后一位皇帝，在位四十一年，公元 263 年向魏军投降。
body: |-
  据《三国志·蜀书·后主传》，刘禅字公嗣，是刘备的儿子，生母甘夫人。他出生的次年，刘备在长坂兵败，他由赵云保护才得脱险。建安二十四年（公元 219 年）刘备称汉中王，立他为太子。章武三年（223 年）刘备去世，刘禅在成都即位，时年十七。

  他在位的前十二年，国政全由丞相诸葛亮主持。诸葛亮死后，他不再设丞相，先后由蒋琬、费祎主持政务，两人大体沿用诸葛亮的成规，蜀汉内部比较安定。费祎在延熙十六年（253 年）遇刺身亡，此后姜维连年出兵北伐，国力消耗很大；刘禅宠信宦官黄皓，朝政日渐败坏。

  景元四年（263 年）魏军大举进攻。姜维在剑阁挡住钟会，邓艾却从阴平小路绕到后方，在绵竹击败诸葛瞻，逼近成都。朝中有人主张逃往南中，有人主张投奔吴国，刘禅听从谯周的意见，向邓艾投降。他的儿子北地王刘谌反对投降，在祖庙痛哭后自杀。蜀汉自刘备称帝起，共存在四十三年。

  次年刘禅全家被迁到雒阳，受封安乐公。裴松之注引《汉晋春秋》记载，司马昭设宴，席间演奏蜀地的乐舞，随行的人都很伤感，刘禅却嬉笑自若；司马昭问他是否思念蜀地，他回答“此间乐，不思蜀”。成语“乐不思蜀”即出于此。晋泰始七年（271 年）他在雒阳去世。
sources: []
recalled:
  - 《三国志·蜀书·后主传》及裴松之注
