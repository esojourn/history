name: 谢道韫
aliases: [谢道蕴, 王凝之妻]
role: 女诗人
summary: 东晋才女，谢安的侄女、王凝之的妻子，以“柳絮因风起”咏雪知名。
body: |-
  谢道韫是谢安长兄谢奕的女儿、谢玄的姐姐，嫁给王羲之的次子王凝之，生卒年不详。她的事迹见于《晋书·列女传》和《世说新语》。

  《世说新语·言语》记载，一个雪天，谢安与子侄们谈论文章，问大雪纷飞像什么。侄子谢朗说，好比把盐撒在空中。她说：“未若柳絮因风起。”谢安听了大笑。后人因此用“咏絮之才”称赞有文才的女子。《列女传》还说，她婚后回娘家，对丈夫很不满意，说没想到天地之间竟有王郎这样的人。小叔王献之与客人辩论落了下风，她隔着青绫步障接过话题代为申说，客人无法驳倒她。

  隆安三年（公元 399 年）孙恩攻陷会稽，王凝之和几个儿子都被杀。据《列女传》，她让婢女抬着肩舆，自己持刀出门，杀了几个人才被俘。孙恩要杀她年幼的外孙，她说事情在王家，与别的家族无关，孙恩因此放过了他们。此后她寡居会稽。当时有人把她和另一位名门女子相比，说她神情散朗，有“林下风气”。她的诗文曾编成集子，今天只存《泰山吟》等少数几篇。
sources: []
recalled:
  - 《晋书·列女传·王凝之妻谢氏》
  - 《世说新语·言语》
  - 《世说新语·贤媛》
