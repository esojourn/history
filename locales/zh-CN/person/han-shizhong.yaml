name: 韩世忠
aliases: [韩良臣, 蕲王]
role: 南宋抗金将领
summary: 南宋“中兴四将”之一，黄天荡阻击金兵四十余日，长期镇守楚州，岳飞死后曾质问秦桧。
body: |-
  韩世忠字良臣，延安（今陕西延安）人，生于元祐四年（公元 1089 年）。他十八岁从军，在西北与西夏作战中以勇猛著名。宣和三年（1121 年）随军镇压方腊，据记载方腊是他在帮源洞中擒获的，功劳却被上司冒领。靖康年间他在河北抵抗金军。

  宋高宗南渡后，韩世忠成为主要将领之一。建炎三年（1129 年）杭州发生苗傅、刘正彦兵变，他与张浚、吕颐浩等起兵勤王，平定兵变。建炎四年（1130 年）完颜宗弼从江南北撤，韩世忠以水军在镇江一带截击，把金军逼入黄天荡，据《宋史》相持四十八天，最后金军开凿河道才得脱走（另见“黄天荡之战”条）。他的妻子梁氏在阵前擂鼓助战，后世小说称她为梁红玉，这个名字不见于宋代史料。

  绍兴四年（1134 年）他在扬州附近的大仪镇击败金军。此后十年他驻守楚州（今江苏淮安），抵御金和伪齐。绍兴十一年（1141 年）朝廷收回三大将兵权，他被任为枢密使。岳飞下狱后，他当面质问秦桧有何罪证，秦桧答“莫须有”，他说“莫须有”三字何以服天下。此后他辞官闲居，杜门谢客，常骑驴携酒游西湖，不再谈论兵事。绍兴二十一年（1151 年）去世，宋孝宗时追封蕲王。
sources: []
recalled:
  - 《宋史·韩世忠传》
