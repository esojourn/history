name: 杨万里
aliases: [杨廷秀, 诚斋]
role: 诗人
summary: 南宋诗人，“中兴四大诗人”之一，诗风活泼自然，称“诚斋体”。
body: |-
  杨万里字廷秀，号诚斋，吉州吉水（今属江西）人，生于建炎元年（公元 1127 年），绍兴二十四年（1154 年）进士。他在朝中历任国子博士、秘书监等职，在地方做过知州、提点刑狱，为人刚直，多次上书议论时政。

  杨万里的诗早年学江西诗派，后来焚毁旧作，转而从自然景物中直接取材，语言浅近，构思新巧，富于情趣，自成一家，称“诚斋体”。他与尤袤、范成大、陆游并称“中兴四大诗人”，作品数量很多，名句如《小池》“小荷才露尖尖角，早有蜻蜓立上头”，至今传诵。

  绍熙三年（1192 年）以后他辞官家居十余年，因不满韩侂胄专权，不肯出仕。据《宋史》，开禧二年（1206 年）他听说韩侂胄发动北伐，忧愤成疾，不久去世。
sources: []
recalled:
  - 《宋史·儒林传·杨万里》
  - 《诚斋集》
