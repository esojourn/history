name: 阿里斯托芬
aliases: [亚里斯多芬尼斯]
role: 喜剧诗人
summary: 雅典旧喜剧的代表，作《云》《鸟》《吕西斯特拉忒》《蛙》。
body: |-
  雅典人，父亲菲利波斯。生卒年都是推算的约数。他的家族在埃吉那岛有产业。除剧作里的自述外，他的生平几乎没有别的材料。

  他很年轻时就开始写喜剧，最初几部交给别人执导。公元前 426 年上演的《巴比伦人》（已佚）讥讽雅典对待盟邦的方式，据他自己在《阿卡奈人》里说，当权的克里昂为此把他告到议事会，说他当着外邦人的面诽谤城邦。两年后他在《骑士》里把克里昂写成一个靠谄媚和恐吓操纵主人“德谟斯”（人民）的奴隶，并得了头奖。

  古人说他写了四十部左右，今存十一部，是旧喜剧仅有的完整作品：《阿卡奈人》（前 425 年）、《骑士》（前 424 年）、《云》（前 423 年）、《马蜂》（前 422 年）、《和平》（前 421 年）、《鸟》（前 414 年）、《吕西斯特拉忒》和《地母节妇女》（前 411 年）、《蛙》（前 405 年）、《公民大会妇女》（约前 392 年）、《财神》（前 388 年）。这些剧直接拿在世的政客、将军、诗人、哲学家点名取笑，是了解伯罗奔尼撒战争时期雅典日常生活最生动的材料。《阿卡奈人》《和平》《吕西斯特拉忒》都以结束战争为题；《吕西斯特拉忒》写全希腊的妇女以拒绝同房迫使男人议和。《蛙》里酒神下到冥府要带回一位悲剧诗人拯救城邦，让埃斯库罗斯和欧里庇得斯比试。

  《云》把苏格拉底写成一个开“思想所”、教人把歪理说成正理的人，只得了第三名，今存的是他后来修改过的本子。柏拉图在《申辩篇》里让苏格拉底说，多年来对他的成见就来自这出喜剧；但在《会饮篇》里，阿里斯托芬又是与苏格拉底同席的客人，讲了人原本是双体、被神劈成两半的寓言。他最后两部剧已没有对时人的直接攻击，歌队的作用也减弱了，被看作向后来喜剧的过渡。
sources: []
recalled:
