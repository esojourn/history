name: 崔浩
aliases: [崔伯渊]
role: 谋臣
summary: 北魏三朝重臣，为太武帝统一北方出谋划策，后因国史之狱被杀并株连灭族。
body: |-
  崔浩字伯渊，清河东武城人，出身北方第一流的高门清河崔氏。父亲崔宏在道武帝时参与制定北魏的官制礼仪。崔浩博览经史，精通天文、术数，历事道武、明元、太武三帝。

  明元帝时，刘裕北伐后秦，他主张不在黄河上阻拦，让刘裕与后秦相争；刘裕去世后，他又反对乘丧伐宋，明元帝没有采纳。太武帝即位后，朝中大臣多主张先攻打南朝，他力主先击柔然、灭夏国，太武帝采纳了他的意见，屡获大胜，因而对他非常倚重，凡军国大计多向他咨询。

  他信奉道教，向太武帝推荐寇谦之，北魏由此尊奉天师道。他反对佛教，太平真君七年（公元 446 年）的灭佛，是他力劝太武帝施行的。他又主张“齐整人伦，分明姓族”，想按照汉族门第的标准排定北方士族的高下，这与鲜卑贵族的利益多有冲突。

  太武帝命他主持修撰北魏国史。他接受著作令史闵湛、郄标的建议，把修成的国史刻在石碑上，立在平城郊外的大路旁。书中如实记载了拓跋氏先世的事迹，往来行人看了议论纷纷，鲜卑贵族大怒，向太武帝告发他“暴扬国恶”。太平真君十一年（450 年）六月，他被处死，年七十。据《魏书》，清河崔氏不论远近，以及与他有姻亲关系的范阳卢氏、太原郭氏、河东柳氏，都被灭族（另见“国史之狱”条）。他被杀的真正原因，除了国史一事，后世学者还提出了汉族士族与鲜卑贵族的矛盾、他排定门第招致怨恨等多种看法。
sources: []
recalled:
  - 《魏书·崔浩传》
  - 《资治通鉴》卷一百二十五
