name: 米太亚德
aliases: [小米太亚德]
role: 雅典将军
summary: 公元前 490 年在马拉松指挥雅典军队击败波斯人。
body: |-
  出身雅典的菲莱家族，父亲基蒙三次在奥林匹亚赢得四马赛车。这个家族在赫勒斯滂海峡欧洲一侧的刻索尼苏斯半岛（今加里波利半岛）上统治当地居民。约公元前 516 年，雅典僭主希庇亚斯派他去继承这一地位。他娶了色雷斯王奥洛罗斯的女儿，后来的雅典将军客蒙是他们的儿子。

  大流士远征斯基泰时，他随同出征，与爱奥尼亚各城的僭主一起守卫多瑙河上的桥。希罗多德说他主张把桥拆掉，把波斯军困在对岸；这一说法多半是他后来为自己辩护时讲的，现代学者多有怀疑。爱奥尼亚起义失败后，前 493 年他带着几船财物逃回雅典，被控在刻索尼苏斯实行僭主统治，获判无罪。

  前 490 年波斯军在马拉松登陆时，他是十位将军之一。据希罗多德，将军们对是否出战意见各半，他说服了军事执政官卡利马科斯投下决定性的一票；其他将军把轮到自己的指挥日让给他。雅典人和普拉提亚人把阵线的两翼加厚，跑步接敌，两翼得胜后向中央合围。希罗多德说波斯人阵亡约六千四百，雅典人一百九十二。

  次年他要求雅典给他七十艘船，不说明去向，只说能使雅典人致富。他去围攻帕罗斯岛，二十六天没有攻下，自己腿上受了伤。回国后克桑提波斯（伯里克利之父）控告他欺骗人民，他被抬上法庭，判罚五十塔兰特，不久因伤口坏疽死去。罚款由客蒙缴清。
sources: []
recalled:
  - 希罗多德《历史》卷四第 137—138 章；卷六第 34—41、103—140 章
  - 奈波斯《米太亚德传》
