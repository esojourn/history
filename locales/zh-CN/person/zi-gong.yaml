name: 子贡
aliases: [端木赐]
role: 孔子弟子，外交家、商人
summary: 孔子弟子，善于辞令，长于经商，富甲一方，对孔子名声的传扬出力很多。
body: |-
  子贡复姓端木，名赐，卫国人。据《史记·仲尼弟子列传》，他比孔子小三十一岁，即生于公元前 520 年，卒年不详。在孔门四科中，他列于“言语”。

  子贡口才出众。《史记》记载，齐国田常要攻打鲁国，孔子派子贡出使，子贡先后游说齐、吴、越、晋，结果“存鲁，乱齐，破吴，强晋而霸越”。这段记载与《左传》等书所记的史实多有不合，后人多认为是战国游士的夸张之辞。

  子贡又善于经商。《史记·货殖列传》说他在曹、鲁之间买贱卖贵，家累千金，乘着高车大马带着厚礼去拜见诸侯，“所至，国君无不分庭与之抗礼”，并说孔子之所以名扬天下，子贡出力最多。孔子死后，弟子们守丧三年，唯有子贡在墓旁又住了三年。《史记》说他最后死于齐国。
sources: []
recalled:
  - 《史记·仲尼弟子列传》
  - 《史记·货殖列传》
  - 《论语·先进》
