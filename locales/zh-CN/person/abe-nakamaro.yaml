name: 阿倍仲麻吕
aliases: [朝衡, 晁衡]
role: 遣唐留学生、唐朝官员
summary: 日本遣唐留学生，在唐朝做官五十余年，与李白、王维等人交游，最终没有回到日本。
body: |-
  阿倍仲麻吕是日本奈良时代的贵族子弟。开元五年（公元 717 年），他十九岁时随日本遣唐使入唐，同行的留学生和学问僧中有吉备真备、玄昉等人。他进入长安的国子监太学学习，后来留在唐朝做官，改名朝衡（又写作晁衡），历任左春坊司经局校书、左补阙、秘书监等职。他与当时的诗人李白、王维、储光羲等人都有交往。

  天宝十二载（753 年），他获准随遣唐大使藤原清河回国，王维写了《送秘书晁监还日本国》为他送行。归途中他乘坐的船遇到风暴，漂流到安南的驩州，同船的人多被当地人杀害，他与藤原清河辗转回到长安。当时误传他已经遇难，李白写下《哭晁卿衡》，有“明月不归沉碧海”之句。据日本的记载，他临行前在明州望月思乡，作了一首和歌，后来被收入《古今和歌集》和《百人一首》。

  此后他一直在唐朝任职，曾任镇南都护、安南节度使等职，大历五年（770 年）在长安去世，年七十三，唐朝追赠潞州大都督。
sources: []
recalled:
  - 《旧唐书·日本传》
  - 《新唐书·日本传》
  - 日本《续日本纪》
