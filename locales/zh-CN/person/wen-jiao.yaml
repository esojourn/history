name: 温峤
aliases: [温太真, 始安郡公]
role: 江州刺史
summary: 东晋初年大臣，由刘琨派往江东，先后参与平定王敦、苏峻之乱。
body: |-
  温峤字太真，太原祁县人。并州刺史刘琨的妻子是他的姨母，他年轻时在刘琨幕府任参军、长史，随军与刘聪、石勒作战。建武元年（公元 317 年），刘琨派他带着劝司马睿即帝位的表章南下。据《世说新语·尤悔》，他的母亲拉住他不让走，他扯断衣襟而去，此后母亲死在北方，他终身引以为憾。

  他到建康后受到王导、庾亮等人器重，留在江东任职，又是晋明帝做太子时的亲信。王敦想把他调到自己幕府里加以控制，他假意顺从，取得信任后脱身回到建康，把王敦的图谋全部报告明帝，并参与了太宁二年（324 年）讨伐王敦的战事。

  咸和元年（326 年）他出任江州刺史，镇守武昌。苏峻攻陷建康后，他与逃来的庾亮共推陶侃为盟主。陶侃一度想撤兵，是他竭力劝说才留下。咸和四年（329 年）叛乱平定，朝廷想留他辅政，他推辞后返回武昌，不久病逝，时年四十二。
sources: []
recalled:
  - 《晋书·温峤传》
  - 《世说新语》
  - 《资治通鉴》卷九十至九十四
