name: 刘锜
aliases: [刘信叔]
role: 南宋抗金将领
summary: 南宋抗金将领，1140 年率八字军在顺昌以少胜多，击败完颜宗弼。
body: |-
  刘锜字信叔，秦州成纪（今甘肃天水一带）人，生于元符元年（公元 1098 年），父亲刘仲武是北宋西北名将。他早年在西北从军，南宋初年参与川陕的抗金战事。

  绍兴十年（1140 年）金朝撕毁和约，刘锜率领以河北义军“八字军”为骨干的部队赴东京任职，行至顺昌府（今安徽阜阳）时金军已经南下。他决定据城坚守，凿沉船只以示不退，在城下多次击败完颜宗弼的大军，宗弼只得退回开封（另见“顺昌之战”条）。这是南宋以少胜多的著名战例。

  此后他受秦桧排挤，一度被解除兵权。绍兴三十一年（1161 年）海陵王南侵，刘锜受命节制淮东诸军，但他当时已经患病，部下又有失利，只得退守长江。次年闰二月他在临安去世。
sources: []
recalled:
  - 《宋史·刘锜传》
