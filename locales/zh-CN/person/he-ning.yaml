name: 和凝
aliases: [和成绩, 曲子相公]
role: 后晋宰相、词人
summary: 后晋宰相，年轻时以写曲子词出名，人称“曲子相公”，与儿子合编《疑狱集》。
body: |-
  和凝是郓州须昌人，字成绩，后梁贞明年间考中进士。他历仕后梁、后唐，后晋时任宰相，后汉、后周时也居高位，显德二年（公元 955 年）去世。

  和凝年轻时喜欢写曲子词，作品在汴洛一带广为流传，有二十首收入《花间集》，是花间派中少数的北方词人。据宋人记载，他做了宰相以后，想把少年时的词作收回焚毁，但已经流传开来，契丹人称他为“曲子相公”。

  他熟悉法律，与儿子和㠓一同编撰了《疑狱集》，收集古今疑难案件的审理事例，供官吏断案时参考。这是中国现存最早的案例汇编之一，对后来宋慈的《洗冤集录》等法医、刑侦著作有一定影响。他还著有文集多卷，大多已经失传。
sources: []
recalled:
  - 《旧五代史·周书·和凝传》
  - 《新五代史·杂传·和凝》
  - 孙光宪《北梦琐言》
