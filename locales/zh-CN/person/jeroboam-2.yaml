name: 耶罗波安二世
aliases:
  - 约阿施的儿子耶罗波安
role: 北国以色列王
summary: 耶户的曾孙，在位四十一年，收回以色列北到哈马口的疆界。
body: |-
  以色列王约阿施的儿子，耶户的曾孙，生年圣经没有记载。据《列王纪下》14:23，他在犹大王亚玛谢十五年登基，在撒玛利亚作王四十一年，是北国在位最久的王。《列王纪》对他的记载只有 14:23–29 这几节：他行耶和华眼中看为恶的事，不离开尼八的儿子耶罗波安的罪；他收回以色列的边界，从哈马口直到亚拉巴海，正如迦特希弗人亚米太的儿子先知约拿所说的（14:25）；14:28 还提到他收回大马色和哈马。

  先知阿摩司和何西阿都在他作王的时候说预言（《阿摩司书》1:1；《何西阿书》1:1）。《阿摩司书》描述了当时富户的安逸和穷人所受的欺压（如第 6 章），并预言以色列将被掳去。据《阿摩司书》7:10–17，伯特利的祭司亚玛谢向耶罗波安告发阿摩司图谋背叛，又叫阿摩司回犹大地去。

  他死后，儿子撒迦利雅接续作王，只作了六个月就被雅比的儿子沙龙所杀（《列王纪下》15:8–12），耶户的王朝到第四代而止。
sources: []
recalled:
  - 《列王纪下》14:23–29、15:8–12
  - 《阿摩司书》1:1、第 6—7 章
  - 《何西阿书》1:1
