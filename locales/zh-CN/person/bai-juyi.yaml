name: 白居易
aliases: [白乐天, 香山居士, 醉吟先生]
role: 诗人、刑部尚书
summary: 唐代诗人，倡导新乐府运动，代表作有《长恨歌》《琵琶行》，生前诗名已传到日本。
body: |-
  白居易字乐天，祖籍太原，大历七年（公元 772 年）生于郑州新郑。少年时因为战乱随家人迁居江南。据张固《幽闲鼓吹》等笔记，他初到长安时把诗卷送给名士顾况，顾况拿他的名字开玩笑说“长安米贵，居大不易”，读到“野火烧不尽，春风吹又生”后才改口称赞，这个故事出自笔记，未必可靠。贞元十六年（800 年）他考中进士，后来又与元稹同登书判拔萃科，两人从此成为终身好友，世称“元白”。

  元和元年（806 年）他任盩厔县尉时写了《长恨歌》，叙述唐玄宗与杨贵妃的故事。此后他任翰林学士、左拾遗，多次上书直言，又写了《秦中吟》十首和《新乐府》五十首，反映百姓疾苦，批评宫市等弊政，如《卖炭翁》《观刈麦》等，主张“文章合为时而著，歌诗合为事而作”（另见“新乐府运动”条）。

  元和十年（815 年）宰相武元衡被刺，他率先上疏请求缉捕凶手，被指越职言事，又被人借故中伤，贬为江州司马。次年他写了《琵琶行》。此后他历任忠州、杭州、苏州刺史，在杭州时修筑钱塘湖的堤坝，蓄水灌田。看到朝中党争激烈，他自请分司东都，大和三年（829 年）起定居洛阳，以太子宾客、河南尹等闲职度日，与刘禹锡、裴度等人唱和，晚年号香山居士。会昌二年（842 年）他以刑部尚书致仕，会昌六年（846 年）在洛阳去世，年七十五，葬在龙门香山。

  白居易一生作诗三千多首，是唐代存诗最多的诗人之一。他的诗语言通俗，生前就广为流传，元稹在为他的文集作的序中说，新罗的商人到长安求购他的诗，日本平安时代的贵族也非常推崇他的诗。他亲自编定了文集《白氏长庆集》，分别保存在几所寺院里。
sources: []
recalled:
  - 《旧唐书·白居易传》
  - 《新唐书·白居易传》
  - 元稹《白氏长庆集序》
  - 白居易《与元九书》
