name: 陆羽
aliases: [陆鸿渐, 竟陵子, 茶圣]
role: 隐士、茶学家
summary: 唐代隐士，撰写世界上第一部茶学专著《茶经》，后世尊为“茶圣”。
body: |-
  陆羽字鸿渐，复州竟陵人，开元二十一年（公元 733 年）生。据他自己写的《陆文学自传》，他是个弃儿，被竟陵龙盖寺的智积禅师收养，在寺中长大。他不愿出家为僧，逃出寺院，在戏班里演过戏，后来受到竟陵太守李齐物的赏识，得以读书。

  安史之乱后他南下，隐居在湖州苕溪一带，与诗僧皎然结为好友，又与颜真卿、刘长卿等人交往，参与过颜真卿主持编纂的《韵海镜源》。朝廷曾召他任太子文学等职，他都没有赴任。他四处考察各地的茶叶，写成《茶经》三卷，大约在建中元年（780 年）前后成书（另见“《茶经》成书”条）。陆羽大约在贞元二十年（804 年）去世，一般认为卒于湖州，但史书没有明确记载。后世奉他为“茶圣”，茶商还把他的像当作茶神供奉。
sources: []
recalled:
  - 陆羽《陆文学自传》
  - 《新唐书·隐逸传·陆羽》
  - 陆羽《茶经》
