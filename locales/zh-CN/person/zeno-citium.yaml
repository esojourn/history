name: 芝诺（基提翁）
aliases: [基提翁的芝诺, 季蒂昂的芝诺]
role: 哲学家，斯多亚派创始人
summary: 塞浦路斯基提翁人，在雅典的彩绘柱廊讲学，创立斯多亚学派。
body: |-
  塞浦路斯岛基提翁人，那是一座有许多腓尼基居民的城市，古人有称他为腓尼基人的。他的生卒年有不同记载，通常取约公元前 334 年至约前 262 年；弟子珀尔赛奥斯说他活了七十二岁。与前一个世纪提出运动悖论的埃利亚的芝诺不是一人。

  据第欧根尼·拉尔修，他原是商人，二十多岁时运货的船在比雷埃夫斯附近失事，他到了雅典，在书铺里读到色诺芬的《回忆苏格拉底》，问哪里能找到这样的人，书商指着正好路过的犬儒派哲学家克拉特斯说：“跟着他去。”这个故事有几种不同的讲法。他跟了克拉特斯一段时间，又向麦加拉派的斯提尔波和柏拉图学园的波勒蒙等人求学，前后约二十年。

  约前 300 年他开始自己讲学，地点在雅典市场北侧绘有壁画的柱廊，希腊语叫“斯多亚·波伊基勒”，他的学派因此得名“斯多亚派”（旧译“画廊派”）。他把哲学分为逻辑、自然、伦理三部分。他认为宇宙是一个由理性（逻各斯）贯穿和主宰的整体，万事依命运的秩序发生；人的理性是宇宙理性的一部分，所以人生的目的就是“与自然相一致地生活”。德行是唯一的善，恶是唯一的恶，健康、财富、名誉等都属于“无所谓”的东西；有智慧的人不受激情搅扰。他早年写的《国家篇》设想了一个只由智者组成、没有神庙和法庭的共同体，带有犬儒派的痕迹。他的著作全部失传，只有后人的摘引。

  他生活俭朴，在雅典很受敬重。马其顿国王安提柯二世来雅典时常去听他讲学，请他到宫廷去，他以年老推辞，派弟子珀尔赛奥斯代往。第欧根尼·拉尔修抄录了雅典人为他颁布的法令，授予金冠，并用公费在凯拉米克斯为他修墓，理由是他教导青年向善，自己的生活也与所教的一致。

  相传他离开学校时绊倒，折了脚趾，便用手拍着地面说“我就来，何必叫我”，随即屏息而死；这类哲学家之死的故事多不可信。学派由克里安提斯接掌，再传到克律西波斯而体系大备。
sources: []
recalled:
  - 第欧根尼·拉尔修《名哲言行录》卷七第 1—38 节
