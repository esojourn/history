name: 客蒙
aliases: [基蒙, 西门]
role: 雅典将军、政治家
summary: 米太亚德之子，提洛同盟早期的主要统帅，主张与斯巴达友好。
body: |-
  米太亚德之子，母亲是色雷斯王奥洛罗斯的女儿。父亲死后，他缴清了五十塔兰特的罚款。从公元前 470 年代起他多次当选将军，是提洛同盟舰队的主要统帅。

  约前 476 年，他攻下斯特鲁蒙河口波斯人据守的埃翁；随后占领斯基罗斯岛，赶走岛上以劫掠为生的居民，据普鲁塔克，他在岛上找到一副高大的骸骨，当作英雄忒修斯的遗骨隆重迎回雅典。约前 466 年（年份有不同推算），他在小亚细亚南岸的欧律墨冬河口，一天之内在海上和陆上两次击败波斯军队，俘获和击毁的腓尼基战船据修昔底德有两百艘。前 465 年塔索斯岛退出同盟，他围攻两年多，迫其投降。

  他为人慷慨，普鲁塔克说他拆掉自家田地的围篱，任人采摘。政治上他主张雅典与斯巴达并力对付波斯，给一个儿子取名“拉栖代梦尼奥斯”（意为斯巴达人）。前 464 年斯巴达大地震后希洛人起义，据守伊托墨山，斯巴达向雅典求援，他不顾厄菲阿尔特的反对，于前 462 年率四千重装步兵前往。斯巴达人却起了疑心，单独把雅典人打发回去。这一羞辱使他声望大跌，厄菲阿尔特趁他不在时削减了战神山议事会的权力，前 461 年他被陶片放逐。

  他何时回国，史料说法不一。约前 451 年他促成雅典与斯巴达订立五年休战，随后率两百艘战船远征塞浦路斯，前 450 年在围攻基提翁时去世，死因是疾病还是受伤，记载不同。舰队撤退途中在塞浦路斯的萨拉米斯附近又赢了一仗。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷一第 98—102、112 章
  - 普鲁塔克《客蒙传》
  - 《雅典政制》第 26—27 章
