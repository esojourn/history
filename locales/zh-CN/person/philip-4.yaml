name: 腓力四世
aliases:
  - 美男子腓力
  - 菲利普四世
role: 法兰西国王
summary: 法兰西国王，向教士征税而与波尼法修八世冲突，其后教廷迁到阿维农；取缔圣殿骑士团。
body: |-
  腓力 1268 年生于枫丹白露，是路易九世的孙子，1285 年继位。“美男子”是当时人给他的称号。他任用一批出身不高、通晓罗马法的官员，要把王权伸到国内每一个角落。

  他同英格兰争夺加斯科涅，又在佛兰德用兵，1302 年法军在科特赖克被佛兰德的市民步兵打败。连年战争使他急需钱财：他让货币贬值，驱逐犹太人并没收其财产，也向教士征税。《历史的轨迹》第十九章说，教皇波尼法修八世下令不准教士缴纳，腓力立刻禁止金、银、宝石出境，切断了教皇在法国的收入。

  1302 年他召集贵族、教士和市民三个等级的代表在巴黎开会，这是法国第一次三级会议。该书说，三个等级都宣称教皇无权干涉国家内政，除上帝以外没有任何权柄可以超越国王；教皇革除他的教籍，法国百姓反而更加团结地支持他。1303 年他的大臣诺加雷指控教皇犯有异端等罪，要求召开大公会议审判，随后带人到阿纳尼去捉拿教皇。

  波尼法修死后，1305 年波尔多大主教当选教皇，即克莱门特五世。他在里昂加冕，一直没有去罗马，1309 年住到罗讷河畔的阿维农，此后六十多年教皇都是法国人。

  1307 年 10 月腓力下令同一天逮捕全法国的圣殿骑士，指控他们亵渎和异端，用刑取得口供。1312 年克莱门特五世在维埃纳会议上取缔了骑士团，财产名义上转给医院骑士团。1314 年 3 月骑士团的总团长在巴黎被烧死；同年 11 月腓力在枫丹白露去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十九章“教会权势衰微” https://wellsofgrace.com/books/spiritual/2000years/html/chapter21.html"
recalled:
  - 乔万尼·维拉尼《新编年史》卷 8、卷 9
  - 《法兰西大编年史》
  - 1312 年维埃纳会议取缔圣殿骑士团的诏书
