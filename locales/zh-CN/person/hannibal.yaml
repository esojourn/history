name: 汉尼拔
aliases: [ 汉尼拔·巴卡 ]
role: 迦太基统帅
summary: 翻越阿尔卑斯山攻入意大利，坎尼一役重创罗马；后在扎马败于西庇阿，流亡东方。
body: |-
  迦太基将领哈米尔卡之子，公元前 247 年生，一般认为生于迦太基。据波利比乌斯，他晚年对安条克三世说，九岁那年父亲出征西班牙前，曾让他在祭坛前发誓永不与罗马人为友。前 221 年他被驻西班牙的军队推为统帅，前 219 年围攻萨贡托，八个月后破城，罗马随即宣战。

  前 218 年他率军翻越阿尔卑斯山进入意大利，先后在提基努斯河、特雷比亚河、特拉西梅诺湖和坎尼取胜，意大利南部不少城市倒向他。此后他在意大利转战到前 203 年，没有进攻罗马城，也没能瓦解罗马的同盟。奉召回非洲后，前 202 年在扎马败于西庇阿。

  战后他当选迦太基的最高行政官“苏菲特”，整顿财政，为政敌所忌。前 195 年罗马使团到来，他出走东方，在以弗所投奔安条克三世，并在安条克与罗马的战争中指挥过一支舰队。安条克战败后他辗转到比提尼亚国王普鲁西阿斯处。罗马派人索要，他在利比萨服毒自尽。卒年古人说法不一，奈波斯记有前 183、前 182、前 181 年三说。
sources:
  - 波利比乌斯《历史》卷三（第 11 章记誓言，第 13—17 章记继任与萨贡托之围） https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/3*.html
  - 普鲁塔克《弗拉米尼努斯传》第 20—21 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Flamininus*.html
  - 英文维基百科“Hannibal”（核对年份） https://en.wikipedia.org/wiki/Hannibal
recalled:
  - 李维《罗马史》卷二十一至三十；卷三十三第 45—49 章（任苏菲特与出走）；卷三十七第 23—24 章；卷三十九第 51 章（去世）
  - 奈波斯《外族名将传·汉尼拔》第 7—13 章
