name: 公孙弘
aliases: [平津侯]
role: 丞相
summary: 以研习《春秋》从布衣做到丞相并封侯，建议为博士设置弟子，开儒生入仕之途。
body: |-
  据《史记·平津侯主父列传》，公孙弘是菑川国薛县人，年轻时做过狱吏，因罪免职，家贫，在海边放猪。四十多岁才开始学习《春秋》和各家杂说。武帝即位之初征召贤良文学，他已六十岁，被征为博士，出使匈奴后回报不合上意，托病免归。元光五年（公元前 130 年）菑川国再次推举他，武帝把他的对策拔为第一，重新任为博士。

  本传说他熟悉文法吏事，又用儒术加以文饰，在朝议时只陈述事情的几种可能，让皇帝自己选择，不肯当面争辩。他升任御史大夫，元朔五年（前 124 年）任丞相，封平津侯。此前丞相都由列侯担任，他是先拜相而后封侯的第一人。同年他奏请为博士设弟子五十人，学成后依考核授官，朝廷采纳，此后公卿大夫中的儒生逐渐增多。

  他盖布被，吃糙米饭，把俸禄用来供养故人和宾客；汲黯当面指责他位在三公而作此俭朴是欺诈。本传也说他外表宽厚而内心忌刻，主父偃被杀、董仲舒被调往胶西，都与他有关。元狩二年（前 121 年）他死在丞相任上，本传说终年八十。
sources: []
recalled:
  - 《史记·平津侯主父列传》
  - 《汉书·公孙弘卜式兒宽传》
