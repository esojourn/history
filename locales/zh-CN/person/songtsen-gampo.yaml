name: 松赞干布
aliases: [弃宗弄赞, 弃苏农]
role: 吐蕃赞普
summary: 吐蕃赞普，统一青藏高原诸部，定都逻些，与唐朝通婚，迎娶文成公主。
body: |-
  松赞干布在唐朝史书中写作弃宗弄赞，是吐蕃雅隆部赞普囊日论赞的儿子。他的生年各书记载不同，藏文史籍多作公元 617 年，一说 629 年即位时只有十三岁。他即位时父亲刚被谋害，各部纷纷叛离，他平定了内乱，又征服苏毗、羊同等部，统一了青藏高原的大部分地区，把政治中心迁到逻些（今拉萨）。

  据藏文史籍，他在位期间派吞弥·桑布扎等人到天竺学习，参照天竺文字创制藏文；又制定法律和官制，划分军政区域，并引入佛教，修建大昭寺等寺庙。这些事迹的细节多出自后世的史书，学界对其中一些说法有不同看法。

  贞观八年（634 年）他首次遣使到唐朝，请求通婚未成。贞观十二年（638 年）他率军进攻唐朝的松州，被唐将牛进达夜袭击败，随即退兵谢罪，再次请婚。贞观十四年（640 年）他派大相禄东赞到长安下聘，次年唐太宗把文成公主嫁给他，他亲自到柏海迎接（另见“文成公主入藏”条）。藏文史籍说他还娶了尼婆罗（今尼泊尔）的赤尊公主，汉文史籍没有记载。

  他与唐朝保持友好。贞观二十二年（648 年）唐使王玄策在天竺遭劫，他发兵相助。贞观二十三年（649 年）唐高宗即位，封他为驸马都尉、西海郡王，据《旧唐书·吐蕃传》，他写信给长孙无忌，表示天子刚即位，臣下如有不忠的，他愿领兵前来讨伐。永徽元年（650 年）他去世，唐朝派使者吊祭。他的孙子即位时年幼，国政由禄东赞执掌。
sources: []
recalled:
  - 《旧唐书·吐蕃传》
  - 《新唐书·吐蕃传》
  - 敦煌古藏文《吐蕃大事纪年》
