name: 利奥一世
aliases:
  - 大利奥
  - 良一世
role: 罗马主教（教皇）
summary: 罗马主教，以《大卷》影响迦克墩会议，曾出城会见阿提拉；被视为承先启后的教皇。
body: |-
  利奥约生于公元 400 年前后，《教宗名录》说他是托斯卡纳人，具体出生在哪里不详。他在罗马教会任执事多年，很受倚重。公元 440 年罗马主教西斯笃三世去世时，他正奉朝廷之命在高卢调解两位将领的纷争，被缺席选为主教。

  他比前人更清楚地讲明了罗马主教的地位：基督把钥匙交给彼得，彼得的权柄由历任罗马主教继承，罗马主教因此对全教会负有责任。《历史的轨迹》第五章讲述了罗马主教地位上升的经过。445 年，西部皇帝瓦伦提尼安三世下诏，确认罗马主教对西部各省教会的管辖权。

  当时东方为基督的神性与人性如何联合争论不休。公元 449 年，他写了一封长信给君士坦丁堡主教弗拉维安，后世称为《大卷》，说基督是一个位格，具有完整的神性和完整的人性，两性各保持自己的特性。这年在以弗所开的会议不让宣读这封信，他斥之为“强盗会议”。451 年迦克墩会议上，这封信被当众宣读，与会主教表示接受，据会议记录，有人喊道：“彼得借着利奥说话了。”同一次会议的第 28 条规定君士坦丁堡的地位仅次于罗马，享有同等的特权，他拒绝承认这一条，但抗议没有效果。

  公元 452 年阿提拉入侵意大利，他随皇帝的使团北上，在明乔河边与阿提拉会面，匈人随后撤走。455 年汪达尔王盖萨里克兵临罗马，他出城交涉，汪达尔人劫掠了十四天，但答应不放火、不屠杀。《历史的轨迹》第七章说，皇帝保不住罗马城，罗马主教却救了它，教会的地位因此更加稳固。

  他在 461 年 11 月 10 日去世，留下九十多篇讲章和一百多封书信。《历史的轨迹》称他是初期教会与中世纪教会之间承先启后的一位教皇。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 利奥一世《书信》第 28 封（《大卷》）、第 104—106 封
  - 迦克墩会议记录第 2 次会议、教规第 28 条
  - 阿奎丹的普罗斯佩《编年史》452、455 年条
  - 《教宗名录》利奥一世条
