name: 纪昀
aliases: [纪晓岚, 石云, 文达]
role: 《四库全书》总纂官
summary: 《四库全书》总纂官，主持撰写《四库全书总目》，著《阅微草堂笔记》。
body: |-
  纪昀字晓岚，直隶献县人，乾隆十九年（1754 年）考中进士，进入翰林院。乾隆三十三年（1768 年）他的亲家、两淮盐运使卢见曾因盐引案获罪，纪昀因事先走漏消息而被发配到新疆乌鲁木齐效力，两年多后被召回，他在新疆的见闻写成了《乌鲁木齐杂诗》。

  乾隆三十八年（1773 年）朝廷开设四库全书馆，纪昀被任命为总纂官，与陆锡熊一起主持编纂工作十余年。他负责审定各书的提要，主持撰写了《四库全书总目》二百卷，为收录和存目的一万多种书籍写出提要，评述各书的作者、内容和得失，是中国古代最重要的目录学著作之一（另见“《四库全书》编成”条）。在修书的过程中，许多被认为“违碍”的书籍被删改或销毁，纪昀也参与其中。

  此后纪昀历任兵部、礼部尚书，协办大学士等职。他晚年写了笔记小说《阅微草堂笔记》，记述鬼狐故事和各种见闻，文笔质朴简洁，与《聊斋志异》风格不同。嘉庆十年（1805 年）他在北京去世，谥“文达”。后世关于他与和珅斗智、与乾隆帝对答的许多故事，多出于民间传说和影视作品。

  纪昀以学识渊博、诙谐善辩著称，他主张学问要讲求实证，对宋明理学的空疏多有批评，这一态度在《四库全书总目》的许多提要中都有体现。
sources: []
recalled:
  - 《清史稿·纪昀传》
  - 纪昀《阅微草堂笔记》
  - 《四库全书总目》
