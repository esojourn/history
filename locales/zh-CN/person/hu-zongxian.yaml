name: 胡宗宪
aliases: [襄懋]
role: 东南抗倭的总督
summary: 东南抗倭总督，诱擒汪直，起用戚继光、俞大猷，后受严嵩牵连死于狱中。
body: |-
  胡宗宪是徽州绩溪（今安徽绩溪）人，嘉靖十七年（1538 年）考中进士，历任知县、御史。嘉靖三十三年（1554 年）他以御史的身份巡按浙江，当时东南沿海倭寇活动猖獗，他依附严嵩的党羽赵文华，嘉靖三十五年（1556 年）升任浙江巡抚，不久任总督，统一指挥浙江、南直隶、福建的军务。

  胡宗宪的方略是剿抚并用。倭寇中有不少是中国的海商和海盗，最大的首领是同为徽州人的汪直。胡宗宪先后招降、离间，击败了徐海等部，又派人与汪直联络，以开放海禁为饵，嘉靖三十六年（1557 年）诱使汪直登岸，将其拘禁，两年后汪直被处死（另见“嘉靖抗倭”条）。他重用戚继光、俞大猷等将领，又招揽了徐渭、茅坤等文士在幕府中办事。他曾两次向嘉靖帝进献白鹿以邀宠，又主持编纂了海防著作《筹海图编》（主要由幕僚郑若曾编写）。

  嘉靖四十一年（1562 年）严嵩倒台，胡宗宪被弹劾为严嵩党羽，被逮捕入京，嘉靖帝念他有功，只将他革职。嘉靖四十四年（1565 年）他再次被牵连下狱，在狱中自杀。万历初年他得到平反，追谥“襄懋”。
sources: []
recalled:
  - 《明史·胡宗宪传》
  - 郑若曾《筹海图编》
