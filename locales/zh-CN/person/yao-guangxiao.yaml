name: 姚广孝
aliases: [道衍, 少师]
role: 永乐帝的谋士
summary: 僧人道衍，燕王朱棣“靖难”的首要谋臣，永乐年间监修《永乐大典》。
body: |-
  姚广孝是长洲（今江苏苏州）人，出身医家，十四岁出家为僧，法名道衍，又跟道士学习阴阳术数，与当时的文人高启等人交往。洪武十五年（1382 年）马皇后去世，朱元璋挑选僧人随侍各位藩王诵经祈福，道衍被派到燕王朱棣身边，随他到北平，住持庆寿寺。

  据《明史》记载，道衍常与朱棣密谈，劝他起兵。建文帝削藩时，他协助朱棣在府中秘密练兵、打造兵器。靖难之役期间，他留守北平，辅佐朱高炽守城，又为朱棣出谋划策，建议他不要在山东与南军纠缠，直取南京。朱棣即位后论功，他居首位，授官太子少师，恢复本姓，赐名广孝，但他不肯还俗，仍住在寺中，上朝时穿官服，退朝后仍着僧衣。

  永乐年间他与解缙等人一起主持编修《永乐大典》，还监修了《明太祖实录》的重修。永乐十六年（1418 年）他在北京去世，年八十四岁。传说他曾请朱棣赦免方孝孺，被拒绝。他著有《道余录》，书中批评程朱理学排斥佛教的言论，因此受到一些儒者的非议。
sources: []
recalled:
  - 《明史·姚广孝传》
