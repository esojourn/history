name: 万历帝
aliases: [朱翊钧, 明神宗]
role: 明朝第十三代皇帝
summary: 明朝在位最久的皇帝，前期由张居正主持改革，后期因“国本之争”长期怠政。
body: |-
  朱翊钧是隆庆帝的第三个儿子，隆庆六年（1572 年）即位时只有十岁，次年改元万历。即位之初，朝政由内阁首辅张居正主持，宦官冯保在宫中配合，李太后对他管教严格。张居正推行考成法、清丈土地、一条鞭法等改革，国库渐趋充裕，北方边防也比较稳固（另见“张居正改革”条）。

  万历十年（1582 年）张居正去世，朱翊钧开始亲政。不久张居正被追夺官爵、抄没家产，他推行的部分措施也被废止。此后，朱翊钧与大臣们在立太子的问题上争执了十几年：他宠爱郑贵妃，想立郑贵妃所生的朱常洵，大臣们则坚持按长幼之序立皇长子朱常洛，史称“国本之争”，直到万历二十九年（1601 年）才立朱常洛为太子。在这期间他逐渐不再上朝，不见大臣，许多官职出缺也不补，奏章常常留中不发。

  万历年间朝廷先后在西北平定宁夏哱拜之乱、在朝鲜抗击丰臣秀吉的日本军队、在西南平定播州杨应龙之乱，合称“万历三大征”（另见该条），耗费巨大。他又派宦官到各地充当矿监、税使，搜刮民财，引起多次民变。朝中东林党与其他派别的争斗日益激烈（另见“东林党争”条）。东北的女真在努尔哈赤领导下崛起，万历四十七年（1619 年）明军在萨尔浒大败。

  万历四十八年（1620 年）朱翊钧去世，在位四十八年，是明朝在位时间最长的皇帝，葬在昌平的定陵。定陵在 1956 至 1958 年间被发掘。《明史》有“明之亡，实亡于神宗”的说法，后世史家对他的评价多受此影响，也有学者认为不能把明亡的原因都归到他身上。
sources: []
recalled:
  - 《明史·神宗本纪》
  - 《明神宗实录》
  - 黄仁宇《万历十五年》
