name: 珀尔修斯
aliases: []
role: 马其顿末代国王
summary: 彼得那一战败于罗马，马其顿王国灭亡。
body: |-
  腓力五世的长子，生于公元前 212 年前后，出生地史料未载。前 179 年继位后，他与罗马续订了父亲时的和约，娶塞琉古四世之女为后，并在希腊各城邦中争取支持。前 172 年，帕加马国王欧迈尼斯二世到罗马元老院指控他图谋不轨，次年罗马宣战，是为第三次马其顿战争。

  战争头几年他在色萨利打过胜仗，罗马方面进展不大。前 168 年执政官埃米利乌斯·保卢斯接掌指挥，在彼得那击溃马其顿军队。他逃到萨莫色雷斯岛，随后投降，次年被押到罗马，出现在凯旋式的队列中，之后囚禁于阿尔巴富森斯，约两年后死在那里。普鲁塔克记了两种说法：一说他绝食而死，一说看守不许他睡觉，把他折磨致死。
sources:
  - 普鲁塔克《埃米利乌斯传》第 8—37 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Aemilius*.html
  - 英文维基百科“Perseus of Macedon”（核对年份） https://en.wikipedia.org/wiki/Perseus_of_Macedon
recalled:
  - 李维《罗马史》卷四十二第 11—13、57—61 章；卷四十四第 32—46 章；卷四十五第 4—8、42 章
