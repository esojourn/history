name: 盘庚
aliases: [般庚]
role: 商王
summary: 商王，相传把都城迁到殷（今河南安阳），此后商朝不再迁都，后世因此也称商为“殷”。
body: |-
  盘庚是商王阳甲的弟弟，阳甲死后继位，生卒年不详。据《史记·殷本纪》，自中丁以后，商王室屡次废嫡立弟，诸弟子争立，“比九世乱，于是诸侯莫朝”，都城也一再迁徙。

  盘庚即位后决定迁都，许多贵族和民众不愿意。《尚书·盘庚》三篇记录了他在迁都前后告诫臣民的话，是今天能读到的最古老的商代文献之一（一般认为经过周人的整理）。《竹书纪年》佚文说“盘庚自奄迁于北蒙，曰殷”，又说从盘庚迁殷到纣灭亡，二百七十三年不再迁都。《史记》的说法不同，说盘庚是渡河南下，回到成汤的故居亳。

  今天多数学者按《竹书纪年》，认为盘庚迁到了今河南安阳一带。安阳殷墟发现的甲骨卜辞，最早的一批属于武丁时期；殷墟东北的洹北商城年代稍早，有学者认为它才是盘庚所迁之都。夏商周断代工程把盘庚迁殷定在约公元前 1300 年。

  据《史记》，盘庚迁都后“行汤之政，然后百姓由宁，殷道复兴”。盘庚死后，弟弟小辛、小乙相继为王，小乙之子就是武丁。

  《尚书·盘庚》中“若网在纲，有条而不紊”“若火之燎于原，不可向迩”等句，至今仍常被引用。

  盘庚迁殷以后，商朝的统治又维持了两百多年，直到被周武王所灭。
sources: []
recalled:
  - 《史记·殷本纪》
  - 《尚书·盘庚》
  - 《竹书纪年》（佚文）
