name: 大马士革的约翰
aliases:
  - 大马色的约翰
  - 约翰·曼苏尔
role: 修士、神学家
summary: 叙利亚的修士，著《知识之源》总结希腊教父的神学，为敬奉圣像辩护。
body: |-
  约翰约在公元 675 年生于大马士革。这座城在 635 年已被阿拉伯人占领，成了倭马亚王朝的都城。他家姓曼苏尔，是当地有地位的基督徒，祖父和父亲都在哈里发手下管理税收，他年轻时也在宫廷任职。他生平的细节多出自几百年后写成的传记，不尽可靠。

  后来他离开大马士革，到耶路撒冷东南旷野里的圣撒巴修道院作修士，并被立为司铎，在那里写作、讲道，直到约 749 年去世。

  726 年以后，东罗马皇帝利奥三世下令除去教堂里的圣像。约翰住在哈里发的境内，皇帝管不到他，他写了三篇文章为敬奉圣像辩护，说神既然成了肉身、可以看见，就可以用图像表现，对像的尊敬归于像所代表的那一位，与只归给神的敬拜不同。754 年反圣像的会议咒诅了他，787 年第二次尼西亚会议恢复圣像，又肯定了他。

  他最重要的著作是《知识之源》，分三部分：先讲哲学的概念，再列举各种异端，最后是《正统信仰阐释》，把希腊教父关于神、创造、基督和圣礼的教导有条理地汇集起来。讲异端的部分末尾有一章论“以实玛利人的异端”，是基督徒最早论述伊斯兰教的文字之一。他还写了不少圣诗，东方教会复活节所唱的颂歌相传出自他手。

  《历史的轨迹》第十二章把他列为东方教会伟大神学家中的最后一位，说他以简洁平易的手法归纳了东方教会的神学；这部书译成拉丁文后，把希腊教会的神学传给了西方。拉丁译本出现在十二世纪中叶，彼得·伦巴德和多马·阿奎那都用过。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十二章“教会分裂” https://wellsofgrace.com/books/spiritual/2000years/html/chapter14.html"
recalled:
  - 大马士革的约翰《知识之源》（《哲学篇》《论异端》《正统信仰阐释》）
  - 大马士革的约翰《驳斥反对圣像者三论》
  - 787 年第二次尼西亚会议记录
