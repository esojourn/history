name: 摩尼加
aliases:
  - 莫尼卡
role: 奥古斯丁的母亲
summary: 奥古斯丁的母亲，多年为儿子归信祷告，公元 387 年死于奥斯提亚。
body: |-
  摩尼加的生平几乎全部出自她儿子奥古斯丁的《忏悔录》。她约在公元 332 年出生在北非一个基督徒家庭，一般认为就在塔迦斯特。她嫁给当地的小地主帕特里修，丈夫不是基督徒，脾气暴躁，到临终前不久才受洗。他们至少有三个孩子，奥古斯丁之外还有一个儿子和一个女儿。

  奥古斯丁在迦太基读书时加入了摩尼教，生活放纵。《忏悔录》卷 3 记载，她去求一位主教开导儿子，主教说时候未到，见她流泪不止，就说：“去吧，这些眼泪的儿子是不会失落的。”《历史的轨迹》第五章引了这句话。公元 383 年奥古斯丁瞒着她乘船去了罗马，她后来渡海追到米兰，在那里常去听安波罗修讲道。

  公元 387 年复活节奥古斯丁受洗后，母子动身回非洲，在罗马的港口奥斯提亚等船。《忏悔录》卷 9 记载两人在窗前谈论永生的一次长谈。几天后她发热病，九天后去世，终年五十六岁，葬在奥斯提亚。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
recalled:
  - 奥古斯丁《忏悔录》卷 1 第 11 章、卷 3 第 11—12 章、卷 5 第 8 章、卷 6 第 1—2 章、卷 9 第 8—13 章
