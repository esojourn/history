name: 温庭筠
aliases: [温岐, 温飞卿, 温八叉]
role: 词人、国子助教
summary: 唐代诗人、词人，词风秾艳精丽，被奉为“花间派”之祖，与李商隐并称“温李”。
body: |-
  温庭筠本名岐，字飞卿，太原祁人，是唐初宰相温彦博的后裔，生卒年都不确定，一般作 812 年前后至 866 年前后。他精通音律，才思敏捷，据五代孙光宪的《北梦琐言》，他应考作赋时，叉手一次就成一韵，八叉手而八韵成，所以人称“温八叉”。但他屡次考进士都没有考中，据说还常在考场上替人作答，又喜欢出入歌楼酒肆，讥讽权贵，受到当权者的排斥。他只做过随县尉、方城尉、国子助教等小官。

  他的诗与李商隐齐名，世称“温李”。他更重要的成就在词：他大量按照乐曲填写长短句，内容多写闺阁女子的情思，辞藻浓丽，如《菩萨蛮》“小山重叠金明灭”、《望江南》“梳洗罢”等。五代后蜀赵崇祚编《花间集》，把他的词放在卷首，后人因此把他奉为“花间派”的鼻祖，他对词这种文体的定型有重要影响。
sources: []
recalled:
  - 《旧唐书·文苑传·温庭筠》
  - 《新唐书·文艺传·温大雅附温庭筠》
  - 孙光宪《北梦琐言》
  - 赵崇祚《花间集》
