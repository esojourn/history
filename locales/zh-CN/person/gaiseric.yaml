  - 普罗科匹厄斯《战史》卷 3 第 3—7 章
  - 约达尼斯《哥特史》第 33 章
  - 波西迪乌斯《奥古斯丁传》第 28—29 章
  - 许达提乌斯《编年史》；普洛斯佩尔《编年史》
