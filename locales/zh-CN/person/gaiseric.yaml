name: 盖萨里克
aliases: [盖塞里克, 根瑟里克, 盖泽里克]
role: 汪达尔人的王
summary: 汪达尔人的王，渡海征服北非，夺取迦太基，公元 455 年洗劫罗马。
body: |-
  盖萨里克约生于公元 389 年，是汪达尔王戈迪吉塞尔的儿子，母亲据说是女奴。406 年年底汪达尔人越过莱茵河，三年后进入西班牙。428 年异母兄去世，他继位为汪达尔人和阿兰人的王。约达尼斯说他中等身材，因坠马而跛足，沉默寡言，城府很深，善于挑动各族相争。

  429 年 5 月，他带领全族从西班牙南端渡海到北非。据同时代的维克多，他命人清点，男女老幼共八万人。普罗科匹厄斯说他是应罗马将领博尼法斯之邀去的，这一说今人多不采信。430 年他围困希坡十四个月，城中的主教奥古斯丁在围城的第三个月去世。435 年罗马订约让汪达尔人住在努米底亚一带；439 年 10 月 19 日他突然袭取迦太基，西部帝国从此失去最富庶的粮食和税收来源。442 年的新约承认了他对这片地方的统治。

  他建起一支舰队，占了撒丁、科西嘉和巴利阿里群岛，后来又取西西里，年年劫掠意大利和希腊的海岸。455 年瓦伦提尼安三世遇刺后，他率舰队在台伯河口登陆。教皇利奥一世到城门外见他，得到不放火、不杀人的许诺；汪达尔人在罗马搜刮了十四天，把皇后欧多克西娅母女和大批工匠、财宝运回迦太基，普罗科匹厄斯说其中有提图斯从耶路撒冷圣殿取来的器物。皇帝的长女后来嫁给了他的儿子胡内里克。

  罗马人两次大举反攻都告失败：460 年西部皇帝马约里安在西班牙集结的舰队被他先行袭毁；468 年东部派巴西利斯库斯率庞大的舰队进攻，在邦角被他用火船击溃。474 年前后东部与他订了长久的和约。他信阿里乌派，没收尼西亚派的教堂，放逐主教。477 年 1 月 25 日他在迦太基去世，在位近五十年，遗命王位由家族中最年长的男子继承。汪达尔王国又延续了半个多世纪，534 年为东罗马所灭。
sources: []
recalled:
