name: 张士诚
aliases: [张九四, 吴王, 诚王]
role: 元末群雄之一
summary: 元末盐贩出身的割据者，据高邮、平江，称吴王，统治富庶的江浙地区，后被朱元璋所灭。
body: |-
  张士诚小名九四，泰州白驹场（今江苏大丰一带）人，生于至大四年（公元 1321 年），以撑船运盐为业，常受地方富户和盐场官吏的欺压。至正十三年（1353 年）他与弟弟张士德、张士信等人带领盐丁起兵，攻下泰州、兴化，又占据高邮，自称诚王，国号大周。

  至正十四年（1354 年）元朝丞相脱脱统率大军围攻高邮，城中危急，恰好脱脱被元顺帝罢免，元军溃散，张士诚转危为安（另见“高邮之战”条）。至正十六年（1356 年）他渡过长江，攻下平江（今江苏苏州），定都于此，随后占据常州、湖州、杭州等地。次年他的弟弟张士德被朱元璋的部队俘获，他一度接受元朝的招安，受封太尉，每年从海路向大都运粮。至正二十三年（1363 年）他又自称吴王。

  张士诚统治的江浙地区物产富饶，他对士人比较宽厚，减轻赋税，兴修水利，当地百姓对他颇有好感。但他晚年耽于享乐，政事委于弟弟张士信等人，内部腐败，在朱元璋与陈友谅决战时坐观成败。至正二十六年（1366 年）朱元璋派徐达、常遇春进攻张士诚，先取湖州、杭州，然后围攻平江。经过长期围困，平江于至正二十七年（1367 年）九月被攻破，张士诚被俘，押送应天后自缢而死。
sources: []
recalled:
  - 《明史·张士诚传》
  - 《明太祖实录》
