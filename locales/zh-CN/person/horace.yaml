name: 贺拉斯
aliases: [昆图斯·贺拉提乌斯·弗拉库斯, 荷拉斯, 霍拉斯]
role: 诗人
summary: 罗马抒情诗人，著《颂诗》《讽刺诗》《书札》和《诗艺》。
body: |-
  贺拉斯于公元前 65 年 12 月 8 日生在意大利南部的维努西亚。他在诗里说，父亲是获释的奴隶，替人在拍卖中收款，攒了些产业，亲自送他到罗马上学，后来又让他去雅典读书。

  前 44 年恺撒遇刺后，布鲁图到雅典，贺拉斯加入他的军队，做到军团指挥官。前 42 年腓立比兵败，他在诗里自嘲“丢下了盾牌”。大赦后他回到意大利，父亲已死，田产被没收，他买了一个财务官书记的职位糊口，开始写诗。前 38 年前后，维吉尔和瓦里乌斯把他引荐给梅塞纳斯，几年后梅塞纳斯送给他一座萨宾山里的农庄，他从此衣食无忧。

  他先写了两卷《讽刺诗》和一卷《长短句》，前 23 年发表《颂诗》前三卷，用希腊抒情诗的格律写拉丁诗，他自己最看重这一点。“抓住今天”一语出自《颂诗》卷 1 第 11 首。此后他写了两卷《书札》；前 17 年奥古斯都举行世纪庆典，命他作《世纪之歌》，由童男童女合唱；晚年又有《颂诗》第四卷。写给皮索父子的长信谈作诗的道理，后世称为《诗艺》。

  据苏维托尼乌斯所传的传记，奥古斯都想请他做私人秘书，他辞谢了，两人的交情并未受损。前 8 年 11 月 27 日他在罗马去世，离梅塞纳斯之死不过两个月，葬在梅塞纳斯墓旁。
sources: []
