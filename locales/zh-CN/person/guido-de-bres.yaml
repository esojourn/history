name: "德布利"
aliases: ["圭多·德布雷", "基道", "基多·德布利"]
role: "尼德兰改革宗牧师"
summary: "尼德兰南部的改革宗牧师，1561 年写成《比利时信条》，1567 年被绞死。"
body: |-
  德布利 1522 年生于尼德兰南部的蒙斯，学的是玻璃彩绘。他读圣经接受了改教的信仰，1548 年避往伦敦，在那里的难民教会住了几年，回来后在里尔秘密牧养会众。1556 年会众被冲散，他去了法兰克福，又到洛桑和日内瓦，从学于贝扎和加尔文。

  1559 年他回到尼德兰，在图尔奈、里尔、瓦朗谢讷一带轮流讲道，化名往来。《历史的轨迹》第二十六章说，1561 年他拟定了一份信条，称为《比利时信条》，也叫“荷兰信条”或“三十七信条”。信条用法文写成，大体依照两年前法国教会的《高卢信条》，要向官府表明改革宗信徒不是重洗派那样的叛乱者。当年 11 月的一个夜里，他把信条连同一封致国王腓力二世的呈文扔进图尔奈城堡的墙内。官府搜出他的住处，他逃走了。这份信条后来经安特卫普、埃姆登等几次教会会议采纳，与《海德堡教理问答》同为荷兰改革宗教会的信仰准则。

  1566 年夏天尼德兰各地捣毁教堂的圣像，瓦朗谢讷由改革宗的人掌了权，请他去做牧师。政府军围城，次年 3 月城破，他被捕。1567 年 5 月 31 日他和同工在瓦朗谢讷的市集上被绞死。他在狱中写给妻子的信流传下来。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十六章“西欧的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter29.html"
recalled:
  - "《比利时信条》（1561 年）及致腓力二世的呈文"
  - "德布利狱中致妻子、母亲的信"
  - "克雷斯潘《殉道者列传》"
