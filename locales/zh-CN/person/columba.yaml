name: 科伦巴
aliases:
  - 高隆巴
  - 爱奥那的科伦巴
role: 爱奥那修道院创立者
summary: 爱尔兰修士，公元 563 年在苏格兰西岸的爱奥那岛建修道院，向皮克特人传道。
body: |-
  科伦巴约在公元 521 年生于爱尔兰北部，出身于当地最有势力的王族。他的生平主要见于爱奥那第九任院长阿多姆南写的《科伦巴传》，成书在他去世约一百年后。他年轻时在几位有名的修道院教师门下学习，被立为长老，据传在爱尔兰建了德里、达罗等修道院。

  公元 563 年，他带着十二个同伴渡海，在苏格兰西岸的小岛爱奥那建了一所修道院。《历史的轨迹》第七章把这件事说成在圣帕提克死后一百年。他为什么离开爱尔兰，后来的传说讲他因一场由他引起的战事而自愿流放，早期的记载只说他“为基督作客旅”。

  他从爱奥那出发，到苏格兰北部向皮克特人传道，据阿多姆南说，他曾到因弗内斯附近见过皮克特王布里迪。他也为苏格兰西部达尔里阿达的王行过膏立礼。爱奥那成为这一带教会的中心，下面管着爱尔兰和苏格兰的许多修道院，院长是长老而不是主教。

  他在公元 597 年 6 月 9 日去世，阿多姆南说他死前一天还在抄写诗篇。同一年，罗马派出的宣教团在英格兰东南登陆。《历史的轨迹》说从爱奥那差出了许多宣教士；七世纪时，从这里出去的艾丹等人把基督教传到了英格兰北部。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 阿多姆南《科伦巴传》卷 2 第 35 章、卷 3 第 5、23 章
  - 比德《英吉利教会史》卷 3 第 4 章
