name: 周文王
aliases: [姬昌, 西伯昌, 西伯]
role: 周族首领
summary: 商末周族首领，号西伯，曾被纣王囚于羑里，为武王灭商奠定基础。
body: |-
  周文王姓姬名昌，是周族首领季历之子、古公亶父之孙。据《史记·周本纪》，古公亶父因躲避戎狄，从豳迁到岐山之下的周原，周族由此兴起。季历死后昌继位，被商王封为西伯，所以称西伯昌。他的生卒年不详，按古书的说法他在位五十年左右。

  据《史记》，西伯“笃仁，敬老，慈少，礼下贤者”，许多士人都来投奔，伯夷、叔齐也从孤竹来归。崇侯虎向纣王进谗言，纣王把西伯囚禁在羑里。周的大臣闳夭等人献上美女、良马和珍宝，纣王才放了他，并赐给他弓矢斧钺，使他可以专征伐。《史记》说西伯被囚时“盖益易之八卦为六十四卦”，后世由此有“文王演《周易》”之说，但这一说法不能确证。

  据《史记》，虞、芮两国有争讼，到周去请西伯裁决，看见周人互相谦让，惭愧而回，诸侯由此认为西伯是“受命之君”。此后西伯先后征伐犬戎、密须、耆国、邘和崇侯虎，并在今陕西西安西南的沣河西岸营建丰邑，把都城从岐下迁到这里。吕尚（姜太公）也在这一时期归周。

  西伯在伐崇后不久去世，太子发继位，就是周武王。武王灭商后追尊他为文王。《论语·泰伯》说周“三分天下有其二，以服事殷”，孔子称之为“至德”。
sources: []
recalled:
  - 《史记·周本纪》
  - 《论语·泰伯》
  - 《诗经·大雅·文王》
