name: 阿尔西诺伊二世
aliases: [爱兄弟者阿尔西诺伊]
role: 埃及王后
summary: 托勒密一世之女，先嫁利西马科斯，后嫁亲弟托勒密二世，生前即被奉为神。
body: |-
  托勒密一世与贝勒尼基之女，约生于公元前 316 年。约前 300 年她嫁给年长她四十多岁的色雷斯国王利西马科斯，生了三个儿子，并得到黑海边的赫拉克利亚等城作为私产。约前 283 年利西马科斯处死前妻所生的长子阿伽托克勒斯，古代作家多说是她为自己的儿子谋位而进的谗言。此事使利西马科斯众叛亲离，前 281 年在库鲁佩狄翁败死。

  她带着儿子逃到马其顿的卡山德里亚。夺得马其顿王位的托勒密·克劳诺斯是她的异母兄，提出与她结婚，立她的儿子为继承人。据尤斯丁，她打开城门后，他当着她的面杀了她的两个小儿子，长子事先逃脱。她先到萨摩色雷斯岛避难，约前 279 年回到埃及。

  埃及这时的国王是她的同母弟托勒密二世。他的王后（利西马科斯之女，也叫阿尔西诺伊）被指谋反而遭流放，约前 275 年前后，托勒密二世娶了姐姐。亲姐弟结婚在埃及法老中有先例，在希腊人看来却是骇人的事。两人都用“爱姐弟者”的称号，并被合称为“姐弟神”，在世时就有祭祀；钱币上铸有她的头像。法尤姆地区后来以她的名字改称阿尔西诺伊州。

  古今都有人认为她对弟弟的朝政影响很大。雅典人克瑞摩尼德斯提议联合反抗马其顿的法令里，说托勒密王是在遵循“先人和姐姐的方针”，这是较为可靠的一条证据。她的赛车在奥林匹亚得过胜。她去世的年份依据埃及的碑文，有前 270 年和前 268 年两说。死后她在埃及各神庙里被当作女神供奉，亚历山大城为她修了专门的神庙。
sources: []
recalled:
  - 尤斯丁《腓力史纲要》卷十七第 1—2 章、卷二十四第 2—3 章
  - 保萨尼亚斯《希腊志》卷一第 7 章、第 10 章
  - 克瑞摩尼德斯法令（《希腊铭文集成》）
