name: 韩山童
aliases: []
role: 红巾军的发起者
summary: 元末白莲教首领，宣扬“弥勒下生”，与刘福通谋划起义，事泄被杀。
body: |-
  韩山童祖籍赵州栾城（今属河北），生年不详。据《元史》等记载，他的祖父因宣传白莲教被流放到广平永年，韩家世代以白莲教聚众，宣扬“天下大乱，弥勒佛下生”“明王出世”，在河南、江淮一带有很多信徒。

  至正十一年（1351 年）元朝征发大批民夫治理黄河，民间流传“石人一只眼，挑动黄河天下反”的歌谣，据说韩山童等人事先在黄陵冈埋下一只眼的石人，民夫挖出后人心浮动。韩山童自称是宋徽宗的八世孙，应当为中国之主，与刘福通、杜遵道等人在颍州聚众，杀白马黑牛立誓，准备起事，不料消息泄露，官府派兵围捕，韩山童被捕杀，妻子杨氏带着儿子韩林儿逃走。刘福通随即起兵，红巾军起义由此爆发（另见“红巾军起义”条）。
sources: []
recalled:
  - 《元史·顺帝本纪》
  - 叶子奇《草木子》
  - 《庚申外史》
