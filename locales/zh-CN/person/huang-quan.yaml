name: 黄筌
aliases: [黄要叔]
role: 后蜀宫廷画家
summary: 前蜀、后蜀的宫廷画家，花鸟画工整富丽，与南唐徐熙并称“黄徐”。
body: |-
  黄筌是成都人，字要叔，约生于天复三年（公元 903 年）。他少年时就以绘画著称，在前蜀宫中任待诏，后蜀时任翰林待诏，主持宫廷画院的事务，深受后蜀后主孟昶的宠信。他学习过刁光胤、孙位等画家，花鸟、人物、山水、龙水都很擅长，尤以花鸟画最为有名。

  黄筌的花鸟画先用细线勾勒轮廓，再层层填色，形象逼真，色彩富丽。据宋人记载，他曾奉命在后蜀宫殿的墙壁上画了六只鹤，形态逼真，当时把那座宫殿称为“六鹤殿”。北宋郭若虚把他与南唐的徐熙相比，说“黄家富贵，徐熙野逸”。北宋初年的宫廷画院以黄筌父子的画风为标准，影响很长时间。

  乾德三年（965 年）后蜀灭亡，他随孟昶来到开封，同年去世。他传世的作品有《写生珍禽图》（北京故宫博物院藏），画了二十多种禽鸟、昆虫和龟，画上题有“付子居宝习”，是他画给儿子黄居宝临摹学习的范本。
sources: []
recalled:
  - 郭若虚《图画见闻志》卷二
  - 黄休复《益州名画录》
  - 《宣和画谱》卷十六
