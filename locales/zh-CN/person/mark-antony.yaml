name: 安东尼
aliases: [马克·安东尼, 马尔库斯·安东尼乌斯]
role: 罗马统帅、后三头之一
summary: 恺撒部将，后三头之一，掌管东方，与克娄巴特拉结合，亚克兴战败后自尽。
body: |-
  马尔库斯·安东尼乌斯，公元前 83 年生（生年另有几种说法），祖父是著名演说家，母亲尤利娅是恺撒的远亲。他年轻时生活放荡，负债很多。前 57 年起他在叙利亚总督加比尼乌斯手下任骑兵长官，在犹太和埃及作战；前 54 年投到恺撒帐下，参加了阿莱西亚之围。

  前 49 年他任保民官，否决元老院不利于恺撒的决议，被逐后逃到恺撒营中，成了开战的口实。法萨卢斯会战中他指挥左翼。前 44 年他与恺撒同任执政官。恺撒遇刺后，他取得恺撒的文件和钱财，先与行刺者妥协，又在葬礼上发表演说激起民愤，迫使他们离开罗马。

  恺撒的继承人屋大维到罗马后，两人争夺老兵，西塞罗连续发表演说攻击他。前 43 年 4 月他在穆提纳被两名执政官和屋大维击败，退入高卢，与雷必达会合。11 月他与屋大维、雷必达结成后三头，公布公敌名单，西塞罗被杀。前 42 年他在腓立比两战击败卡西乌斯和布鲁图，此后掌管东方各行省。

  前 41 年他在塔尔苏斯召见埃及女王克娄巴特拉七世，随她去亚历山大城过冬。次年他回到布伦迪西乌姆与屋大维和解，娶屋大维的姐姐屋大维娅。前 37 年他回到东方，与克娄巴特拉重聚。前 36 年他远征帕提亚，在米底围城不下，冬季退兵，据普鲁塔克损失两万多人。前 34 年他占领亚美尼亚，在亚历山大城举行庆典，把东方的土地名义上分给克娄巴特拉和她的子女。

  屋大维借此在罗马抨击他，前 32 年公布了他存在维斯塔贞女处的遗嘱，其中要求死后葬在亚历山大城；他则与屋大维娅离婚。罗马向克娄巴特拉宣战。前 31 年 9 月 2 日亚克兴海战，他随克娄巴特拉的船队突围南去，陆军几天后投降。前 30 年 8 月屋大维兵临亚历山大城，他的舰队和骑兵倒戈；他误信克娄巴特拉已死，伏剑自刺，被抬到她藏身的陵墓里死去。
sources: []
recalled:
  - 普鲁塔克《安东尼传》
  - 阿庇安《内战史》卷三至卷五
  - 卡西乌斯·狄奥《罗马史》卷四十五至卷五十一
  - 西塞罗《反腓力辞》
