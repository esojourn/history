name: 孙叔敖
aliases: [蒍敖, 蒍艾猎（一说）]
role: 楚国令尹
summary: 楚庄王时的令尹，以施教导民、为政宽和著称，司马迁把他列为《循吏列传》第一人。
body: |-
  孙叔敖是楚国人，蒍氏，名敖，字孙叔，生卒年不详，一般认为是楚庄王时的令尹。《左传》宣公十二年记邲之战时，令尹孙叔敖起初主张退兵，后来又指挥楚军先发制人；他在战前整顿军备、选拔将领，被晋人称赞楚国“军政不戒而备”。

  《史记·循吏列传》把他列为第一人，说他“三月为楚相，施教导民，上下和合，世俗盛美，政缓禁止，吏无奸邪，盗贼不起”，又说他三次做令尹而不喜，三次被罢免而不悔。后世还传说他兴修了期思陂等水利工程，以及少年时埋杀两头蛇的故事（见《新序》），这些都出于汉代以后的记载。

  《史记·滑稽列传》说孙叔敖死后，儿子贫困，以打柴为生，优孟扮作孙叔敖的样子劝谏庄王，庄王才封给他的儿子寝丘之地。“优孟衣冠”的典故由此而来。
sources: []
recalled:
  - 《史记·循吏列传》
  - 《史记·滑稽列传》
  - 《左传》宣公十二年
  - 《新序·杂事》
