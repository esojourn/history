name: 米特里达梯一世
aliases: [ 米特拉达梯一世 ]
role: 安息国王
summary: 安息国王，夺取米底与两河流域，使安息由伊朗东北的小国成为大国。
body: |-
  米特里达梯一世是安息王弗里阿帕提乌斯之子，弗拉特斯一世的弟弟，生年没有记载。查士丁说，弗拉特斯一世虽有几个儿子，却把王位传给了这个弟弟。他的即位年有约公元前 171 年和前 165 年两说，这里取《伊朗百科全书》所用的前一说。

  他先向东用兵，从希腊—巴克特里亚王国手中夺得一些地方，时间约在前 2 世纪 60 年代末至 50 年代。随后转向西面的塞琉古王国：前 148 年下半年或前 147 年占领米底及其都城埃克巴坦那；前 141 年进入巴比伦尼亚，在底格里斯河畔的塞琉西亚加冕，楔形文字文书表明当年 10 月乌鲁克已承认他的统治。此后他东返抵御游牧部落。塞琉古国王德米特里二世乘机反攻，初有进展，前 138 年兵败被俘；查士丁说，米特里达梯把他送到希尔卡尼亚，以王者之礼相待，并把女儿嫁给他。他晚年又征服了埃利迈斯。

  他的卒年有前 138 年前后和前 132 年两说，子弗拉特斯二世继位。查士丁称他把安息的疆域从高加索山扩展到幼发拉底河；他的钱币上已使用“大王阿萨息斯”的称号。
sources:
  - 伊朗百科全书“Arsacids ii. The Arsacid Dynasty”条 https://www.iranicaonline.org/articles/arsacids-ii/
  - 英文维基百科“Mithridates I of Parthia”条（即位、去世年份的另一说） https://en.wikipedia.org/wiki/Mithridates_I_of_Parthia
recalled:
  - 查士丁《腓力史摘要》第 36 卷第 1 章、第 38 卷第 9 章、第 41 卷第 5—6 章
  - 《马加比一书》第 14 章第 1—3 节（德米特里二世被俘）
