name: 波罗斯
aliases: [波鲁斯]
role: 旁遮普的国王
summary: 印度旁遮普的国王，在希达斯皮斯河抵抗亚历山大，战败后仍保有王位。
body: |-
  印度西北部一位国王，领地在希达斯皮斯河（今杰赫勒姆河）与阿塞西尼斯河（今杰纳布河）之间。他只见于希腊、拉丁作家的记载，印度文献里没有对应的人物；“波罗斯”一般认为与梵语的部族名“补卢”有关，但这只是推测。生年不详。

  公元前 326 年亚历山大渡过印度河，呾叉始罗的国王归附，波罗斯则率军在希达斯皮斯河东岸据守。时值雨季将临，河水上涨。亚历山大把一部分兵力留在对岸牵制，自己带精兵趁夜在上游渡河。波罗斯先派儿子率战车阻截，失败后亲率主力迎战，把战象排在步兵前面。据阿里安，战象约有二百头。马其顿骑兵从两翼包抄，步兵方阵对付象队，战象受伤后往回乱踩，印度军溃败。

  阿里安说波罗斯身高五肘尺有余，骑在象上一直战斗到负伤。被带到亚历山大面前时，亚历山大问他希望受到怎样的对待，他说：“像对待一位国王那样。”亚历山大让他继续统治原来的国土，后来又把东面直到希发西斯河的地方划归他管辖，并调解了他与呾叉始罗国王的旧怨。

  亚历山大死后，前 323 年和前 321 年的两次分封都确认了他的地位。据狄奥多罗斯，约前 318 年，留在当地的马其顿将领欧达摩斯将他杀害，带走了他的战象。史料所载大致如此。
sources: []
recalled:
  - 阿里安《亚历山大远征记》卷五第 8—19 章
  - 狄奥多罗斯《历史丛书》卷十七第 87—89 章、卷十九第 14 章
  - 普鲁塔克《亚历山大传》第 60 章
