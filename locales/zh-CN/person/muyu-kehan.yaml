name: 牟羽可汗
aliases: [移地健, 登里可汗]
role: 回纥可汗
summary: 葛勒可汗之子，762 年助唐收复洛阳，把摩尼教带回漠北，779 年被杀。
body: |-
  牟羽可汗名移地健，是葛勒可汗的儿子，娶仆固怀恩的女儿为可敦，唐乾元二年（公元 759 年）继位。宝应元年（762 年），史朝义派人引诱他南下攻唐，他率军来到黄河边，唐朝派仆固怀恩前去劝说，他转而与唐军联合，一起收复洛阳。据《资治通鉴》，雍王李适到陕州回纥营中相见，回纥人责怪他不行拜舞之礼，把随行的唐朝官员药子昂、魏琚、韦少华、李进各打一百鞭，魏琚、韦少华当晚死去；回纥兵进入洛阳后大肆抢掠。

  他回到漠北时带回了几位摩尼教僧人。据九姓回鹘可汗碑，此后他皈依摩尼教，摩尼教在回纥成为通行的宗教。大历十四年（779 年）唐代宗去世，他听从身边粟特人的劝说，想趁机南侵，宰相顿莫贺达干劝阻无效，把他和他的亲信杀死，自立为可汗。
sources: []
recalled:
  - 《旧唐书·回纥传》
  - 《新唐书·回鹘传》
  - 《资治通鉴》卷二百二十二、卷二百二十六
  - 九姓回鹘可汗碑
