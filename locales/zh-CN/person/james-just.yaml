name: 雅各（主的兄弟）
aliases:
  - 主的兄弟雅各
  - 义者雅各
role: 耶路撒冷教会领袖
summary: 新约称为“主的兄弟”，主持耶路撒冷教会，公元 62 年被大祭司处死。
body: |-
  《马可福音》6:3 和《马太福音》13:55 记拿撒勒人提到耶稣的弟兄雅各、约西、犹大、西门，雅各列在第一位。他的生年没有记载。《约翰福音》7:5 说耶稣的弟兄当时不信他；《哥林多前书》15:7 则记复活的基督曾显给雅各看，《使徒行传》1:14 记耶稣的弟兄和使徒一同祷告。“主的兄弟”指哪一种亲属关系，各教会传统的理解不同：有的认为是马利亚和约瑟后来所生，有的认为是约瑟前妻的儿子，有的认为是表兄弟。

  保罗归信三年后上耶路撒冷，除矶法以外只见了“主的兄弟雅各”（《加拉太书》1:19）。彼得从监里出来，嘱咐人把这事告诉雅各和众弟兄（徒 12:17）。《加拉太书》2:9 把雅各、矶法、约翰并称为教会的柱石。在耶路撒冷会议上，雅各在彼得、巴拿巴和保罗之后发言，引先知的话，主张不可难为归服神的外邦人，只写信吩咐他们禁戒几件事，会议照此决定（徒 15:13–29）。保罗末次到耶路撒冷，也是去见雅各和众长老（徒 21:18）。

  新约的《雅各书》开头自称“作神和主耶稣基督仆人的雅各”，教会传统认为就是此人；《犹大书》的作者自称是雅各的弟兄。“义者”的称号不见于新约，出自二世纪以后的教会作者。

  新约没有记他的死。据约瑟夫斯《犹太古史》卷 20，巡抚非斯都死后、继任的亚勒比努还在路上的时候，大祭司亚拿召集公会，把“被称为基督的耶稣的兄弟雅各”和另外几个人定为违犯律法，交出去用石头打死；城中有人为此不满，亚基帕王随即免去亚拿的大祭司职分。通行的公元 62 年就是据此推定的。优西比乌《教会史》所引赫格西仆的说法细节不同，说他先被人从圣殿高处推下。
sources: []
recalled:
  - 《马可福音》6:3；《马太福音》13:55；《约翰福音》7:5
  - 《使徒行传》1:14，12:17，第 15 章，21:18
  - 《加拉太书》1:19，2:9，2:12
  - 《哥林多前书》15:7
  - 《雅各书》1:1；《犹大书》第 1 节
  - 约瑟夫斯《犹太古史》卷 20 第 9 章
  - 优西比乌《教会史》卷 2 第 23 章
