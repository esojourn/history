name: 雅各
aliases:
  - 西庇太的儿子雅各
  - 大雅各
role: 十二使徒之一
summary: 西庇太的儿子，约翰的哥哥，十二使徒之一，被希律王用刀杀害。
body: |-
  雅各是西庇太的儿子、约翰的兄弟，在加利利海打鱼，和西门是伙伴（路 5:10）。他的生年没有记载。耶稣在海边呼召他们兄弟二人时，他们正在船上补网，就把父亲西庇太和雇工留在船上，跟从耶稣去了（可 1:19–20）。《马可福音》3:17 说，耶稣给这兄弟二人起名叫半尼其，就是雷子的意思。

  他和彼得、约翰三人常被耶稣带在身边：睚鲁的女儿复活时、在山上改变形像时、在客西马尼祷告时，都只带了这三个人（可 5:37；9:2；14:33）。《马可福音》10:35–40 记兄弟二人求耶稣让他们在他的荣耀里一个坐在左边、一个坐在右边；《马太福音》20:20–23 记这是他们的母亲来代求的。

  《使徒行传》12:1–2 记希律王下手苦害教会中的几个人，用刀杀了约翰的哥哥雅各。这位希律是大希律的孙子亚基帕一世，死于公元 44 年，雅各遇害的年份据此推定。十二使徒中，他的殉道是新约明文记载的唯一一例。新约里另有亚勒腓的儿子雅各和主的兄弟雅各，与他不是一人。
sources: []
recalled:
  - 《马可福音》1:19–20、3:17、5:37、9:2、10:35–40、14:33
  - 《马太福音》20:20–23
  - 《路加福音》5:10
  - 《使徒行传》12:1–2
