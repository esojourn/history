name: 克拉特鲁斯
aliases: [克拉特洛斯]
role: 马其顿将领
summary: 亚历山大后期最得力的将领，继业者战争初起时败于欧迈尼斯而阵亡。
body: |-
  马其顿西部奥雷斯提斯人，约生于公元前 370 年。东征开始时他统领一个步兵方阵团，在伊苏斯和高加米拉指挥左侧的步兵。前 330 年他是主张严办菲洛塔斯的人之一，帕曼纽死后，独当一面的任务多交给他。他保持马其顿的旧习，不赞成亚历山大改用波斯礼仪，与赫费斯提翁不和，据普鲁塔克，两人在印度曾拔剑相向。亚历山大说过，克拉特鲁斯爱的是国王，赫费斯提翁爱的是亚历山大。

  前 326 年希达斯皮斯河之战，他奉命率一部留在原营地牵制波罗斯，待主力得手后渡河追击。次年亚历山大穿越格德罗西亚沙漠，他带着老兵、伤员和战象走北面较易行的路线回到波斯腹地。前 324 年苏萨的集体婚礼上，他娶了大流士三世的侄女阿玛斯特里斯。同年他受命率一万名退役老兵回马其顿，并接替安提帕特留守欧洲。

  亚历山大去世时他才走到奇里乞亚。前 322 年他渡海到色萨利与安提帕特会合，甘居其下，一同在克兰农击败希腊联军，随后娶了安提帕特之女菲拉。次年两人渡海进入小亚细亚，对抗摄政佩尔狄卡斯。

  佩尔狄卡斯留下抵挡他们的是欧迈尼斯。据普鲁塔克，欧迈尼斯知道马其顿士兵敬爱克拉特鲁斯，便不让部下知道对面是谁，并用亚洲骑兵去迎击他。交战中克拉特鲁斯的马跌倒，他受了重伤，不久死去。这一战在赫勒斯滂海峡附近（一说在卡帕多西亚边境），确切地点没有记载，年份有前 321 年和前 320 年两说。
sources: []
recalled:
  - 阿里安《亚历山大远征记》卷五、卷六、卷七第 12 章
  - 普鲁塔克《欧迈尼斯传》第 5—7 章；《亚历山大传》第 47 章
  - 狄奥多罗斯《历史丛书》卷十八第 29—30 章
