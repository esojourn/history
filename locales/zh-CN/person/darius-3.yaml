name: 大流士三世
aliases: [大利乌三世, 科多曼努斯]
role: 波斯国王
summary: 阿契美尼德王朝末代国王，在伊苏斯和高加米拉两度败于亚历山大，逃亡途中被部下所杀。
body: |-
  阿契美尼德王室的旁支，约生于公元前 380 年。据巴比伦的记录，他即位前名阿尔塔沙塔；尤斯丁称他“科多曼努斯”。狄奥多罗斯和尤斯丁说，他在阿尔塔薛西斯三世征讨卡杜西亚人时与敌方勇士单独决斗取胜，因而出名，后来做过亚美尼亚总督。

  前 338 年阿尔塔薛西斯三世去世，据狄奥多罗斯是被宦官巴戈阿斯毒死的，巴戈阿斯立其子阿尔塞斯，两年后又将他杀害，王室近支已尽，于是在前 336 年拥立大流士。狄奥多罗斯说，巴戈阿斯又想毒死新王，大流士逼他自己喝下了毒药。他即位之初，埃及一度出现自立的法老，后被平定。

  前 334 年亚历山大进入小亚细亚，在格拉尼库斯河击败当地诸总督。大流士任命希腊人门农统领沿海军队和舰队，在爱琴海上反攻，但门农次年病死。前 333 年大流士亲率大军到叙利亚北部，在伊苏斯的狭窄海岸与亚历山大交战，阵线被突破后乘车逃走，母亲、妻子和子女都落入对方手中。此后他几次致书求和，据阿里安，最后一次提出割让幼发拉底河以西的土地，付一万塔兰特赎金，并把女儿嫁给亚历山大，被拒绝。

  他用近两年时间在东部各省重新集结军队，选定底格里斯河以东的高加米拉平原，平整了场地以便使用卷镰战车和骑兵。前 331 年 10 月 1 日的会战中，亚历山大直冲他所在的中军，他再度逃离战场，退往埃克巴坦那。巴比伦、苏萨、波斯波利斯相继失陷。

  前 330 年亚历山大北上，他率余部东撤，打算退到巴克特里亚。途中巴克特里亚总督贝苏斯等人将他拘禁，用车载着继续走；亚历山大的追兵逼近时，他们把他刺伤后丢下。他在亚历山大赶到之前死去，时在当年夏天，地点在里海以南通往赫卡通皮洛斯的路上。亚历山大把遗体送到波斯波利斯，按国王的礼仪安葬。贝苏斯自称国王，次年被擒处死。延续两百多年的阿契美尼德王朝至此结束。
sources: []
recalled:
  - 阿里安《亚历山大远征记》卷二、卷三
  - 狄奥多罗斯《历史丛书》卷十七第 5—6 章、第 73 章
  - 库尔提乌斯《亚历山大史》卷三至卷五
  - 尤斯丁《腓力史纲要》卷十第 3 章
