name: 米特里达梯六世
aliases: [米特里达梯大王, 米特拉达梯六世, 本都王米特里达梯]
role: 本都国王
summary: 本都国王，称雄黑海沿岸，三次与罗马开战，前后四十年，最终兵败自尽。
body: |-
  本都国王，王室自称出自波斯贵族，都城在黑海南岸的希腊城市锡诺普。他约生于公元前 135 年（一说前 132 年）。前 120 年父亲米特里达梯五世被毒死，他年幼即位，由母亲摄政；据查士丁，他为躲避谋害在山野里过了七年，后来夺回权力，囚禁母亲，杀死弟弟。古人盛传他长期服用小剂量毒药以求免疫，并说他通晓治下二十二个民族的语言。

  他先向北扩张，应克里米亚希腊城市之请出兵抵御斯基泰人，得到博斯普鲁斯王国和黑海北岸、东岸的大片土地，由此有了充足的粮食和兵源。在小亚细亚，他与比提尼亚争夺帕夫拉戈尼亚和卡帕多基亚，多次被罗马勒令退出。他把女儿嫁给亚美尼亚国王提格兰二世，结成同盟。

  前 89 年罗马使节阿奎利乌斯怂恿比提尼亚国王入侵本都。他乘罗马困于同盟者战争，出兵击溃比提尼亚和罗马的军队，占领亚细亚行省，受到苦于罗马包税人的各城欢迎。前 88 年他密令各城在同一天杀死境内的罗马人和意大利人，古代作家说有八万人，普鲁塔克说十五万，现代学者认为有夸大。他的将军阿基劳斯渡海进入希腊，雅典倒向他。苏拉在前 86 年攻下雅典，两败本都军队，前 85 年双方在达尔达诺斯议和：他退回原有疆界，交出舰队，赔款两千塔兰特。

  前 74 年前后比提尼亚国王把王国遗赠给罗马，他再度开战。卢库卢斯在基齐库斯使他的大军因饥饿溃散，继而攻入本都，他逃到女婿提格兰那里。前 67 年他趁罗马军队哗变打回本都，在泽拉取胜。次年庞培接任，在幼发拉底河上游夜战击溃了他。他绕道高加索退到克里米亚，据阿庇安，还计划沿多瑙河进攻意大利。前 63 年儿子法尔纳凯斯起兵反叛，他被困在潘提卡彭的城堡里，服毒不死，让一名高卢卫兵把自己杀死。
