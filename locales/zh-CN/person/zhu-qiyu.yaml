name: 景泰帝
aliases: [朱祁钰, 明代宗, 郕王]
role: 明朝第七代皇帝
summary: 土木之变后被拥立为帝，任用于谦保卫北京；“夺门之变”后被废，不久去世。
body: |-
  朱祁钰是宣德帝的次子，明英宗的异母弟，封郕王。正统十四年（1449 年）明英宗亲征瓦剌，命他留守北京。土木之变后，英宗被俘，京城人心惶惶，有人主张南迁，兵部侍郎于谦力主坚守。在大臣们的请求和孙太后的同意下，朱祁钰于当年九月即位，次年改元景泰，尊英宗为太上皇。

  他任命于谦为兵部尚书，全力备战，当年十月击退了也先对北京的进攻（另见“北京保卫战”条）。景泰元年（1450 年）英宗被送回，朱祁钰把他安置在南宫，严加防范。景泰三年（1452 年）他废掉英宗的儿子朱见深的太子之位，改立自己的儿子朱见济，但朱见济次年就夭折了，此后储位一直空悬。

  景泰八年（1457 年）正月朱祁钰病重，石亨等人发动“夺门之变”拥英宗复位。朱祁钰被废为郕王，迁到西宫，一个月后去世，死因史书说法不一，有人怀疑是被害死的。英宗以亲王之礼把他葬在北京西山，不入皇陵。成化年间朱见深恢复了他的帝号，南明时追上庙号代宗。
sources: []
recalled:
  - 《明史·景帝本纪》
  - 《明英宗实录》
