name: 赵充国
aliases: [赵翁孙, 营平侯]
role: 后将军
summary: 西汉将领，七十多岁时受命平定羌人，主张以屯田代替进攻，不战而使羌人归降。
body: |-
  据《汉书·赵充国辛庆忌传》，赵充国字翁孙，陇西上邽人，后来迁居金城令居，自幼熟悉边疆事务。武帝时他随贰师将军李广利出击匈奴，全军被围，他率百余名壮士突围开路，身受二十余处伤，武帝亲自察看他的伤口，任为中郎。昭帝时他升为后将军，后来参与拥立宣帝，封营平侯。

  神爵元年（公元前 61 年），湟水流域的先零等羌人部落起事。当时他已七十多岁，宣帝派人问他谁可以领兵，他回答说没有人比老臣更合适；问到用兵方略，他说“百闻不如一见”，要到金城实地察看之后再上报。到前线后，他主张只打带头的先零部，对被胁迫的其他部落加以安抚，不同意朝中速战的意见。

  先零败退后，他上奏请求撤回骑兵，留下一万多名步兵在当地开垦屯田，就地取粮，等待羌人自行瓦解，并列举了屯田的十二条好处。奏章几次往返，朝中赞成的人逐渐增多，宣帝最终批准。次年羌人内部杀死首领来降，汉朝在当地设金城属国安置。他随即请求罢屯回朝。甘露二年（前 52 年）他去世，本传说终年八十六岁。
sources: []
recalled:
  - 《汉书·赵充国辛庆忌传》
