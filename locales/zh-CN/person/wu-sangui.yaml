name: 吴三桂
aliases: [平西王, 周帝]
role: 明朝山海关总兵，清朝平西王，三藩之乱的首领
summary: 引清军入关，为清朝攻灭永历政权，封平西王；1673 年起兵反清。
body: |-
  吴三桂祖籍南直隶高邮，生于辽东，出身将门，父亲吴襄是明朝的辽东总兵，舅父祖大寿是锦州守将。他武举出身，年轻时就以勇武知名，崇祯年间升任宁远总兵，参加过松锦之战。

  崇祯十七年（1644 年）李自成进军北京，崇祯帝召吴三桂入关勤王，他放弃宁远，率军入关，还没赶到北京，北京就已失陷。李自成派人招降，他起初准备归顺，后来又改变了主意，史书多说是因为父亲吴襄被大顺军拷掠、爱妾陈圆圆被大顺将领刘宗敏所夺，但具体原因学者看法不一。四月，李自成亲率大军东征，吴三桂向清朝的多尔衮求援，与清军联合在山海关一片石击败大顺军，随后剃发降清，被封为平西王（另见“清军入关”条）。

  此后吴三桂追击大顺军，转战陕西、四川。顺治十六年（1659 年）他率清军攻入云南，永历帝逃到缅甸；顺治十八年（1661 年）他率军进入缅甸，次年缅甸交出永历帝，吴三桂在昆明将永历帝父子处死（另见“南明”条）。清朝让他镇守云南，兼管贵州，他在云南拥有重兵，掌握当地的官员任免和财政，与镇守广东的尚可喜、镇守福建的耿精忠合称“三藩”。

  康熙十二年（1673 年）康熙帝下令撤藩，吴三桂随即起兵反清，自称“天下都招讨兵马大元帅”，号召“兴明讨虏”，贵州、湖南、四川、广西等地纷纷响应，耿精忠、尚之信等人也先后起兵（另见“三藩之乱”条）。但他曾杀害永历帝，号召力有限，又在湖南长期按兵不动。康熙十七年（1678 年）三月他在衡州称帝，国号周，年号昭武，同年八月病死。他的孙子吴世璠继位，康熙二十年（1681 年）清军攻破昆明，吴世璠自杀，三藩之乱结束。
sources: []
