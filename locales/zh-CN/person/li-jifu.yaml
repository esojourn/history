name: 李吉甫
aliases: [李弘宪]
role: 宰相、地理学家
summary: 唐宪宗时的宰相，主张削藩，编成《元和郡县图志》，李德裕之父。
body: |-
  李吉甫字弘宪，赵郡人，乾元元年（公元 758 年）生，以门荫入仕，德宗时长期在地方任职。唐宪宗即位后召他回京，元和二年（807 年）任宰相，与宪宗谋划削藩，并编成《元和国计簿》，统计朝廷实际能征收赋税的州县和户口。

  元和三年（808 年）朝廷举行制科考试，牛僧孺、李宗闵等人在策文中尖锐批评时政。据《旧唐书》，李吉甫向宪宗哭诉，考官因此被贬，牛僧孺等人也长期不得重用。后世多把这件事看作牛李党争的起因之一，但也有学者认为史书的说法出自后来的党争双方，不尽可信（另见“牛李党争”条）。

  他熟悉各地的地理形势，元和八年（813 年）编成《元和郡县图志》，按当时的方镇分区记述各州县的沿革、户口、山川、道里和物产，原书附有地图，地图后来失传，正文是现存最早的较完整的全国地理总志。元和九年（814 年）他在宰相任上去世，年五十七。他的儿子李德裕后来也任宰相。
sources: []
recalled:
  - 《旧唐书·李吉甫传》
  - 《新唐书·李吉甫传》
  - 李吉甫《元和郡县图志》
