name: 范宽
aliases: [范中正, 范中立]
role: 北宋山水画家
summary: 北宋初年山水画家，师法自然，代表作《溪山行旅图》。
body: |-
  范宽是华原人，生卒年都不详，活动在北宋初年。据刘道醇《圣朝名画评》，他名中正，字中立，因为性情宽厚，人们称他为“范宽”。他起初学李成的画法，后来认识到“与其师人，不若师诸造化”，于是长期住在终南山、太华山一带，观察山川的变化，形成了雄伟浑厚的画风。

  他的代表作《溪山行旅图》现藏台北故宫博物院，画面上巨大的山峰占据大半，山下有一队旅人和驮畜，笔法以密集的短条皴为特色。二十世纪五十年代，研究者在画中树叶之间发现了“范宽”二字的题款，为这幅画的作者提供了证据。郭若虚《图画见闻志》把他与李成、关仝并称为北宋山水画的三大家。
sources: []
recalled:
  - 刘道醇《圣朝名画评》卷二
  - 郭若虚《图画见闻志》卷一、卷四
  - 《宣和画谱》卷十一
