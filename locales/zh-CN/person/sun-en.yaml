name: 孙恩
aliases: [孙灵秀]
role: 五斗米道首领
summary: 五斗米道首领，东晋末年从海岛登陆，在三吴发动大规模起事，兵败投海而死。
body: |-
  孙恩字灵秀，祖籍琅邪，家族世代信奉五斗米道，生年不详。他的叔父孙泰师从钱唐的道首杜子恭，在江东士庶中信徒很多。隆安二年（公元 398 年），孙泰见晋室内乱，聚众准备起事，被会稽王司马道子诱杀。孙恩逃到海岛上，聚集了一百多人。

  隆安三年（399 年），执政的司马元显征发三吴各郡已由奴隶放免为佃客的人到建康当兵，各郡骚动。十月，孙恩乘机从海上登陆，攻下上虞，随即攻陷会稽郡城，杀死内史王凝之。会稽、吴郡、吴兴等八郡的人纷纷杀官响应，据《晋书》本传，十来天里聚众数十万。他自称征东将军，把部下称为“长生人”。朝廷派谢琰和北府将领刘牢之进讨，他带着大批人口退回海岛。

  此后两年他几次登陆，隆安四年击杀谢琰，隆安五年率船队沿海北上，直抵丹徒，建康戒严，被刘裕等击退。元兴元年（402 年）他进攻临海郡失败，部众因饥饿疾疫死亡殆尽，他投海自尽。本传说他的信徒称他成了“水仙”，跟着投水的有上百人。余众推他的妹夫卢循为首领。
sources: []
recalled:
  - 《晋书·孙恩传》
  - 《资治通鉴》卷一百一十至一百一十二
