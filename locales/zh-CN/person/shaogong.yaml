name: 召公
aliases: [召公奭, 姬奭, 太保奭, 召康公]
role: 周初重臣，燕国始封君
summary: 周初重臣，与周公分陕而治，辅佐成王、康王；受封于燕，是燕国的始封君。
body: |-
  召公名奭，姬姓，与周王同宗，因采邑在召而称召公，生卒年不详。据《史记·燕召公世家》，武王灭纣后封召公于北燕，他和周公一样留在朝中辅政，由子孙到燕地就封。北京房山琉璃河遗址出土的青铜器克罍、克盉，铭文记载周王命“克”到匽（燕）为侯，多数学者认为这与召公封燕有关。

  成王时召公官居太保，与周公共同辅政。据《史记》，当时“自陕以西，召公主之；自陕以东，周公主之”。周公摄政时召公曾有疑虑，《尚书·君奭》就是周公向召公表明心迹的诰辞。营建洛邑时，召公先到洛邑勘察选址，事见《尚书·召诰》。

  《史记》说召公巡行乡邑，在一棵棠树下处理诉讼政事，上至侯伯、下至庶人各得其所，他去世后百姓怀念他，不忍砍伐这棵棠树，作《甘棠》之诗。成王临终时，召公和毕公受命辅佐康王，事见《尚书·顾命》。
sources: []
recalled:
  - 《史记·燕召公世家》
  - 《尚书·君奭》
  - 《尚书·召诰》
  - 《诗经·召南·甘棠》
