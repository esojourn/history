name: 多马
aliases:
  - 低土马
role: 十二使徒之一
summary: 十二使徒之一，又称低土马，起初不信耶稣复活，亲眼见到后才信。
body: |-
  多马是十二使徒之一，《约翰福音》说他又称为低土马，这个名字是双生子的意思。他的出身、籍贯和生年，圣经都没有记载。《马太福音》《马可福音》《路加福音》只在十二使徒的名单里提到他；他说过的话、作过的事，都出自《约翰福音》。

  《约翰福音》有几处记到他。拉撒路死后，耶稣要回犹太去，门徒提醒说犹太人近来要拿石头打他，多马就对同作门徒的说，我们也去和他同死吧（约 11:16）。耶稣复活的那天晚上向门徒显现，多马不在场；别的门徒告诉他，他说除非亲眼看见耶稣手上的钉痕，用指头探入钉痕，又用手探入肋旁，他总不信。过了八日，耶稣又向门徒显现，叫多马伸手来摸，多马就称他为自己的主、自己的神（约 20:24–29）。后来在提比哩亚海边打鱼的七个门徒里也有他（约 21:2）。《使徒行传》1:13 记他在耶稣升天后与众使徒同在耶路撒冷，此后新约不再提到他。

  据三世纪的《多马行传》和印度圣多马基督徒的传统，他后来到印度传道，相传约在公元 72 年在今金奈附近殉道。这些说法都出自新约以外。
sources: []
recalled:
  - 《约翰福音》11:16、20:24–29、21:2
  - 《马太福音》10:3
  - 《使徒行传》1:13
  - 《多马行传》（新约以外的著作，往印度传道之说的出处）
