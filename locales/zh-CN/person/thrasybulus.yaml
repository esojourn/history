name: 色拉西布洛斯
aliases: [特拉叙布洛斯]
role: 雅典将军、民主派领袖
summary: 公元前 403 年率流亡者推翻三十僭主，恢复雅典民主政治。
body: |-
  雅典人，吕科斯之子，属斯忒里亚村社。公元前 411 年雅典城内的寡头派建立四百人政权时，他是驻萨摩斯舰队里的一名战船长。他和色拉叙洛斯带头让全军宣誓拥护民主，士兵们选他为将军。他主张召回亚西比德，并亲自去接。此后他在库诺塞马、库济科斯等海战中都是主要指挥者之一。前 406 年阿吉纽西海战时他只是战船长，战后与塞拉门尼斯一起受命去救起落水的人，因风暴未能成行；后来将军们因此被处死，他没有被追究。

  前 404 年三十僭主当政，他被放逐，逃到底比斯。那年冬天，他带七十人越过边境，占据阿提卡北部山上的要塞菲莱。三十人派兵来攻，遇雪退回。投奔他的人增加到约千人后，他夜间下山进入比雷埃夫斯，据守穆尼基亚的高处，击败了前来进攻的三十人的军队，克里提亚斯战死。据色诺芬，战后他对城里来的人说，你们并不比我们更正义，也不比我们更勇敢。斯巴达国王保萨尼阿斯随后率军前来，没有支持吕山德的强硬做法，而是调停双方和解。前 403 年秋流亡者回城，民主政治恢复，双方立誓除三十人等少数首恶外，对过去的事一概不追究。他提议给予所有同他一起从比雷埃夫斯回城的人公民权，其中有外邦人和奴隶，这一提案被判为违法而未能实行。

  此后他仍是雅典的重要人物。科林斯战争期间，前 390 年前后他率四十艘战船出征，在色雷斯、拜占庭和莱斯博斯恢复雅典的影响，重新征收过往货物的税。为筹措军费他沿小亚细亚南岸征敛，在阿斯彭杜斯，士兵抢掠了当地人的田地，居民夜袭营地，把他杀死在营帐里。
