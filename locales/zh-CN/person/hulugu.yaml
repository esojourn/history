name: 狐鹿姑单于
aliases: [狐鹿姑]
role: 匈奴单于
summary: 且鞮侯单于之子，在位十二年，击降汉将李广利；死后匈奴因继位之争开始分裂。
body: |-
  据《汉书·匈奴传》，狐鹿姑是且鞮侯单于的长子，原为左贤王。公元前 96 年且鞮侯病逝时他不在王庭，贵人们以为他有病，改立他的弟弟左大将；他赶到后，弟弟把单于之位让还给他。他许诺日后传位给弟弟，立弟弟为左贤王。几年后弟弟去世，他却立自己的儿子为左贤王，弟弟的儿子先贤掸只做了日逐王。

  征和三年（前 90 年），汉朝派李广利等三路大军出塞。狐鹿姑把辎重和老弱转移到北方，自己率精兵迎战。李广利得知家属在长安被捕，想立功赎罪，孤军深入；回师途中，狐鹿姑亲率五万骑在燕然山一带截击，夜里在汉军阵前挖掘壕沟，然后从背后急攻，汉军大乱，李广利投降。

  次年他致书汉朝，信中说“南有大汉，北有强胡。胡者，天之骄子也”，要求汉朝开放关市、嫁女和亲，每年赠送酒、米和丝织品。这时武帝已无意再大举用兵，但也没有答应。

  前 85 年他病重，遗言立弟弟右谷蠡王。他的阏氏与降将卫律隐瞒死讯，伪造命令，改立他的儿子为壶衍鞮单于。左贤王和右谷蠡王心怀不满，从此不再到王庭参加集会。《汉书》把这件事看作匈奴衰落的开始。
sources: []
recalled:
  - 《汉书·匈奴传上》
