name: 刘娥
aliases: [章献明肃皇后, 刘太后]
role: 宋真宗皇后，临朝听政
summary: 宋真宗的皇后，仁宗年幼时临朝听政十一年，是宋代第一位垂帘的太后。
body: |-
  刘娥是宋真宗的皇后。据《宋史·后妃传》，她祖籍太原，生于成都，幼年父母双亡，由外家抚养，善于击鼗（一种拨浪鼓）。蜀人龚美带她到京城，龚美以锻银为业，有的记载说他们原是夫妻，后来龚美改称是她的兄长，改姓刘。她在少年时进入当时还是韩王的赵恒府中，深受宠爱；太宗知道后命令把她逐出，赵恒只好把她藏在指挥使张耆家里。

  真宗即位以后，刘娥入宫，逐步晋升，大中祥符五年（1012 年）被立为皇后。她通晓书史，处理事情周密，真宗批阅奏章常与她商量。真宗晚年多病，政事多由她裁决。乾兴元年（1022 年）真宗去世，十三岁的仁宗即位，遗诏尊她为皇太后，军国大事由她处分。

  她临朝听政十一年，罢免了专权的丁谓，任用王曾、吕夷简等人，政局大体稳定，宋代太后垂帘的先例由此开始。她曾穿着衮冕之服到太庙行礼，引起大臣议论；有人劝她仿效武则天，她没有接受。仁宗的生母李氏是她宫中的侍女，在她生前，仁宗一直不知道自己的身世。明道二年（1033 年）刘太后去世，仁宗才得知真相，开棺查验，见李氏以皇后之礼安葬，才没有追究。后世的“狸猫换太子”故事就是由此附会编成的。
sources: []
recalled:
  - 《宋史·后妃传上·章献明肃刘皇后》
  - 《续资治通鉴长编》卷九十八至一百一十二
