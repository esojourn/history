name: 弗拉米尼努斯
aliases: [提图斯·昆克提乌斯·弗拉米尼努斯, 弗拉米宁, 弗拉米尼乌斯]
role: 罗马执政官
summary: 罗马统帅，在库诺斯克法莱击败腓力五世，在地峡竞技会上宣告希腊自由。
body: |-
  提图斯·昆克提乌斯·弗拉米尼努斯，罗马贵族，约生于公元前 229 年。第二次布匿战争后期他在马塞卢斯麾下任军事保民官，后来管理过收复的塔兰托。他通希腊语，熟悉希腊人的习俗。

  前 198 年他不到三十岁，没有任过大法官就当选执政官，接手对马其顿腓力五世的战争。他在阿奥斯河谷由当地牧人带路绕到敌后，迫使腓力退入色萨利；又争取到亚该亚同盟加入罗马一方。他与腓力在尼凯亚会谈，提出马其顿须撤出全希腊，谈判未成，他的指挥权得到延长。前 197 年两军在色萨利的库诺斯克法莱丘陵遭遇，罗马军团在起伏的地形上击破马其顿方阵。和约规定腓力放弃在希腊的全部据点，交出舰队，赔款一千塔兰特。

  埃托利亚人等盟友怀疑罗马要取代马其顿做希腊的主人。前 196 年科林斯地峡竞技会上，传令官宣布：罗马元老院和统帅弗拉米尼努斯让原属腓力的各希腊城邦自由，不驻军、不纳贡，按自己的法律生活。据波利比乌斯和普鲁塔克，全场欢声雷动，人们几乎把他挤伤。前 195 年他联合希腊各邦讨伐斯巴达的纳比斯，迫其交出阿尔戈斯。前 194 年他说服元老院撤出科林斯卫城、卡尔基斯和德米特里亚斯的驻军，离开希腊；希腊多座城市为他立像、设祭，他的头像出现在金币上。

  此后他多次出使希腊，试图阻止各邦倒向安条克三世，未能挽回埃托利亚人。前 189 年他任监察官。前 183 年他出使比提尼亚，要求国王普鲁西亚斯交出流亡的汉尼拔，汉尼拔服毒自尽；普鲁塔克说罗马有不少人认为此举有失体面。他约在前 174 年去世。
sources: []
