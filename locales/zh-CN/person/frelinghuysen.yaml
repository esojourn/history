name: "弗瑞林海森"
aliases: ["富瑞林浩生", "西奥多·弗瑞林海森"]
role: "新泽西荷兰改革宗牧师，大觉醒的先驱"
summary: "受敬虔派影响的荷兰改革宗牧师，在新泽西拉里坦河谷点起大觉醒的最早火种。"
body: |-
  《历史的轨迹》第四十二章说，弗瑞林海森在荷兰时已受德国敬虔派影响，1720 年到美洲，做了新泽西拉里坦河谷荷兰改革宗教会的牧师。他是能干的讲员，讲道强调悔改归正的必要，火热有力，教会增加许多新人，别处教会也请他去讲，复兴之火从拉里坦河谷向外延烧。第四十一章说，荷兰改革宗在新阿姆斯特丹被英国人占领、改名纽约以后发展很慢，直到他出现，才把复兴之火重新带进教会。

  书中说，滕能特的长子吉尔伯特在他附近一间长老会做牧师时，他尽力在各方面帮助这位年轻人，准许他在荷兰改革宗教会里讲道，复兴之火由此烧进长老会。据一般记载，他严格要求领圣餐的人有悔改的凭据，曾与会众中的富户和纽约的荷兰牧师发生长期争执；他约 1691 年生于德国西部，约 1747 年去世，生卒地点史料记载不一。

  第四十五章说他在美国创办了第一间神学院，即设在新泽西的皇后学院，是今天罗格斯大学的前身。据一般记载，皇后学院 1766 年才获特许状，那时他已去世近二十年，倡办者是他的儿子小西奥多等荷兰改革宗牧师，书中的说法与此不同。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十一章“教会进入新大陆” https://wellsofgrace.com/books/spiritual/2000years/html/chapter46.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十二章“教会经历大觉醒” https://wellsofgrace.com/books/spiritual/2000years/html/chapter47.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
