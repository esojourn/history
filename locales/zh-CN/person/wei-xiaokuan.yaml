name: 韦孝宽
aliases: [韦叔裕]
role: 名将
summary: 西魏北周名将，坚守玉壁击退高欢，后为杨坚平定尉迟迥起兵。
body: |-
  韦孝宽名叔裕，以字行，京兆杜陵人，出身关中大族京兆韦氏。北魏末年入仕，西魏时受命镇守汾水南岸的玉壁城，这是西魏东面的要塞。

  大统十二年（公元 546 年），东魏高欢亲率大军围攻玉壁，前后五十多天，筑土山、挖地道、用攻车撞城、放火烧城楼，韦孝宽都一一设法破解。高欢派人劝降，他回答说，我是关西的男儿，决不做投降的将军。城始终没有攻下，东魏军伤亡惨重，高欢撤军后不久病死（另见“玉壁之战”条）。

  北周时，他长期镇守东境，与北齐名将斛律光对峙。他编造歌谣，派间谍到邺城散布，离间北齐君臣，斛律光因此被杀。他曾向周武帝上书陈述灭齐的方略。大象二年（580 年）杨坚辅政，相州总管尉迟迥起兵反对，韦孝宽受命为元帅前往讨伐，两个多月后攻破邺城，尉迟迥自杀。同年十一月，他回到长安后去世，年七十二。
sources: []
recalled:
  - 《周书·韦孝宽传》
  - 《资治通鉴》卷一百五十九、一百七十四
