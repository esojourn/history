name: 贾谊
aliases:
  - 贾生
role: 太中大夫、诸侯王太傅
summary: 西汉文帝时的政论家、辞赋家，上疏主张削弱诸侯王，作《吊屈原赋》《鵩鸟赋》。
body: |-
  雒阳人。据《史记·屈原贾生列传》，他十八岁时就以能诵诗作文闻名郡中。文帝即位后，经廷尉吴公推荐，他被召为博士，一年之内升到太中大夫。他提议改正朔、易服色、更定制度，遭到周勃、灌婴等老臣排挤，被外放为长沙王太傅。渡湘水时他作赋凭吊屈原，在长沙又作《鵩鸟赋》。

  一年多后文帝召他回长安，任他为梁怀王太傅。《汉书·贾谊传》收有他论时政的长篇上疏，后世称《治安策》，其中提出“众建诸侯而少其力”；他分析秦朝灭亡原因的《过秦论》，《史记·秦始皇本纪》篇末有引录。梁怀王坠马而死，他自责没有尽到太傅之责，哭泣一年多后也去世了，年三十三。梁怀王死于文帝十一年（公元前 169 年），据此推算他约卒于前 168 年，生于前 200 年左右。
sources:
  - 《史记·屈原贾生列传》 https://ctext.org/shiji/qu-yuan-jia-sheng-lie-zhuan/zhs
  - 《汉书·贾谊传》 https://ctext.org/han-shu/jia-yi-zhuan/zhs
  - 《汉书·文帝纪》 https://ctext.org/han-shu/wen-di-ji/zhs
  - 《史记·秦始皇本纪》 https://ctext.org/shiji/qin-shi-huang-ben-ji/zhs
