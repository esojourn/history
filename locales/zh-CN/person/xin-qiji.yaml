name: 辛弃疾
aliases: [辛幼安, 稼轩]
role: 词人、抗金将领
summary: 南宋词人，青年时起兵抗金南归，一生主张恢复，以豪放词著称，与苏轼并称“苏辛”。
body: |-
  辛弃疾字幼安，号稼轩，济南历城（今山东济南）人，生于绍兴十年（公元 1140 年）。他出生时山东已在金朝统治之下，祖父辛赞在金朝做官，常带他登高望远，指画山河，教他不忘宋朝。

  绍兴三十一年（1161 年）海陵王南侵，北方各地起兵反金，辛弃疾聚众二千人（据《宋史》），投奔耿京的义军，任掌书记，并劝耿京归附南宋。次年他奉命南下联络，回程中得知耿京被叛将张安国杀害，张安国已投降金朝。辛弃疾带领数十名骑兵突入金军营中，把张安国擒获，押到建康交给南宋朝廷斩首，一时名声大振。

  南归以后，辛弃疾先后上《美芹十论》《九议》，陈述恢复中原的方略，没有被采纳。他在江西、湖北、湖南等地任安抚使等职，处理地方事务很有才干，在湖南创建了“飞虎军”。但他性格刚直，又是“归正人”（从北方南归的人），屡遭弹劾，前后两次罢官闲居，在上饶带湖、铅山瓢泉一带住了将近二十年。

  嘉泰三年（1203 年）韩侂胄筹划北伐，起用辛弃疾知绍兴府，次年改知镇江府。他在镇江作了《永遇乐·京口北固亭怀古》，对仓促北伐表示忧虑。不久他又被罢免，开禧三年（1207 年）在铅山去世。

  辛弃疾现存词六百多首，是两宋存词最多的词人，风格多样，以豪放悲壮为主，常用典故和散文句法，与苏轼并称“苏辛”。他与陈亮、朱熹都有交往，淳熙十五年（1188 年）陈亮到铅山访他，两人纵谈十天，留下唱和词篇。
sources: []
recalled:
  - 《宋史·辛弃疾传》
  - 《稼轩长短句》
  - 邓广铭《辛稼轩年谱》
