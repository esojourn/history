name: 王僧辩
aliases: [王君才]
role: 将领
summary: 梁元帝的大将，坚守巴陵、收复建康，平定侯景之乱，后被陈霸先袭杀。
body: |-
  王僧辩字君才，祖籍太原祁县，父亲王神念从北魏投奔梁朝。他长期在湘东王萧绎手下任职。侯景之乱时，萧绎以他为大都督，率军东下讨伐侯景。

  大宝二年（公元 551 年），侯景率大军溯江西上，攻打巴陵。王僧辩坚守城池，侯景久攻不下，又遭疾疫，只得撤退，侯景的势力从此由盛转衰。次年，王僧辩与从岭南北上的陈霸先在白茅湾会师，合兵东下，攻克建康，侯景出逃后被部下杀死。他因功任司徒，镇守建康。

  承圣三年（554 年）江陵陷落、梁元帝被杀，他与陈霸先在建康拥立元帝之子萧方智为梁王。次年，北齐送被俘的梁宗室萧渊明南归，要立为梁帝，王僧辩起初拒绝，出兵战败后接受了北齐的要求，迎萧渊明即位，立萧方智为太子。陈霸先反对此事，同年九月从京口突袭建康石头城，擒杀王僧辩及其子王頠，废萧渊明，改立萧方智为帝。王僧辩的生年史书没有记载。
sources: []
recalled:
  - 《梁书·王僧辩传》
  - 《资治通鉴》卷一百六十四至一百六十六
