name: 提奥弗拉斯托斯
aliases: [泰奥弗拉斯托斯, 提尔塔摩斯]
role: 哲学家、植物学家
summary: 亚里士多德的同事和继承人，主持吕克昂三十多年，所著植物学著作为古代之冠。
body: |-
  莱斯博斯岛埃雷索斯人，约生于公元前 371 年，父亲是漂洗工。据第欧根尼·拉尔修，他本名提尔塔摩斯，“提奥弗拉斯托斯”意为“说话如神”，是亚里士多德因他口才好而起的。他可能先在家乡受教，又到雅典听过柏拉图讲学，后来追随亚里士多德，两人年纪相差十几岁，更像同事。亚里士多德离开雅典后在阿索斯、米提利尼的几年，以及在马其顿的时期，他大概都在一起。

  前 335 年亚里士多德在雅典吕克昂讲学，他是主要的助手。前 323 年亚里士多德退居卡尔基斯，把学园和藏书交给他；他此后主持吕克昂约三十五年。据第欧根尼·拉尔修，前来听讲的先后有两千人，喜剧诗人米南德和后来治理雅典的法勒隆的德米特里都是他的学生。前 307 年雅典通过一项法律，规定办哲学学校须经议事会和公民大会许可，他与其他哲学家一同离开雅典；次年该法被判违法废止，他又回来。

  他的著作目录很长，传世的只是一小部分。《植物志》九卷和《植物之生成》六卷记述了约五百种植物，按乔木、灌木、小灌木、草本分类，讨论它们的构造、繁殖、产地和用途，其中有随亚历山大东征的人带回来的见闻；后世称他为植物学的创始人。《论石》是现存最早的矿物著作。《性格种种》用三十段短文刻画吝啬、吹牛、迷信等三十种人，对后来欧洲的人物素描文体影响很大。他还汇编过早期哲学家关于自然的学说，这部书是后世了解苏格拉底以前各家的主要来源，现只存《论感觉》等片段。他的一篇短论《形而上学》对亚里士多德的目的论提出了一些疑问。

  他约在前 287 年去世，享年约八十五岁，雅典人为他送葬。吕克昂由兰普萨库斯人斯特拉托接掌。
sources: []
recalled:
  - 第欧根尼·拉尔修《名哲言行录》卷五第 36—57 节
