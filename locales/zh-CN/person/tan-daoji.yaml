name: 檀道济
aliases: []
role: 名将
summary: 刘裕北伐的前锋大将，宋初重臣，因功高被宋文帝猜忌杀害。
body: |-
  檀道济是高平金乡人，家族侨居京口，早年父母双亡。元兴三年（公元 404 年）刘裕在京口起兵讨伐桓玄，他是参与者之一，此后一直随刘裕征战。义熙十二年（416 年）刘裕北伐后秦，他与王镇恶为前锋，攻取许昌、洛阳，次年进入长安。《宋书》本传说他在洛阳俘获秦军四千余人，有人主张全部坑杀，他说“伐罪吊民，正在今日”，把俘虏都放了回去，因而颇得人心。

  刘裕代晋后，他是开国功臣。刘裕临终，命他与徐羡之、傅亮、谢晦同受遗诏辅政。后来徐、傅等人废杀少帝、迎立宋文帝，他也参与其事；元嘉三年（426 年）文帝诛徐、傅，讨伐谢晦，他站在文帝一边率军西上，谢晦兵溃。此后他出任江州刺史，镇守寻阳。

  元嘉八年（431 年），他率军北救滑台，与魏军交战三十余次，多有胜绩，但到历城时粮尽，滑台失守，只得撤退。《南史》记载，他夜里让士兵量沙，高声唱数，把仅剩的一点米盖在沙上，魏军以为宋军粮足，不敢追击，全军得以退回。这就是“唱筹量沙”的典故。

  他威名日盛，部将多是久经战阵的人，几个儿子也有才气，朝廷因而猜忌。元嘉十三年（436 年），文帝病重，彭城王刘义康等人担心文帝去世后无人能制他，将他召入建康，以谋反的罪名逮捕处死，同死的还有他的几个儿子和部将薛彤、高进之。据史书记载，他被捕时愤然说朝廷这是自毁万里长城。元嘉二十七年魏军逼近长江时，文帝曾叹息说，若檀道济还在，不会到这种地步。
sources: []
recalled:
  - 《宋书·檀道济传》
  - 《南史·檀道济传》
