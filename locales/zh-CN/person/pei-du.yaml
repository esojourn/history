name: 裴度
aliases: [裴中立, 晋国公]
role: 宰相
summary: 唐宪宗时的宰相，主持讨伐淮西并亲赴前线督战，元和中兴的主要功臣。
body: |-
  裴度字中立，河东闻喜人，永泰元年（公元 765 年）生，贞元五年（789 年）考中进士，此后在朝中和地方任职，以敢于直言著称。唐宪宗元和年间，他任御史中丞，坚决主张讨伐割据的淮西节度使吴元济。

  元和十年（815 年）六月，主战的宰相武元衡在上朝路上被刺客杀死，裴度也被刺中头部，跌入沟中，据史书，因为戴着厚毡帽才保住性命。朝中有人主张罢免裴度以安抚藩镇，宪宗没有同意，反而任他为宰相。元和十二年（817 年），讨伐淮西的战事拖了三年仍无进展，他请求亲往前线，以淮西宣慰处置使的身份到郾城督战，奏请撤回监军的宦官，诸将得以专心作战。同年十月李愬雪夜袭破蔡州，擒获吴元济，裴度随后入蔡州安抚，因功封晋国公（另见“平淮西”条）。韩愈作《平淮西碑》，即以裴度为首功。

  此后他又参与平定淄青李师道。唐穆宗、敬宗、文宗时，他几度出任宰相，又几度被李逢吉等人排挤外放。宦官势力日盛，他在文宗时出任东都留守，在洛阳城南建别墅，名为绿野堂，常与白居易、刘禹锡等人饮酒赋诗。开成四年（839 年）他去世，年七十五。他历事宪宗、穆宗、敬宗、文宗四朝，史书称他的威望德行为中外所重。
sources: []
