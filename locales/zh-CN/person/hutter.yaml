name: "胡特尔"
aliases: ["雅各·胡特尔", "胡特"]
role: "摩拉维亚重洗派的领袖"
summary: "蒂罗尔的重洗派传道人，在摩拉维亚建立凡物公用的弟兄团体，1536 年被烧死。"
body: |-
  胡特尔约 1500 年生于蒂罗尔普斯特河谷的莫斯村，做过制帽匠，“胡特尔”就是“帽匠”的意思。他约在 1529 年成为蒂罗尔重洗派的传道人。蒂罗尔属哈布斯堡家，对重洗派查禁极严，他几次带人翻山到摩拉维亚去，那里的贵族肯容留他们。

  摩拉维亚的重洗派从 1528 年起就有人把财物摊在一件斗篷上归公。《历史的轨迹》第二十五章说，1533 年瑞士弟兄派的传道人胡特尔加入那里的重洗派，后来做了他们的牧者，实行严格的公社生活，每个单位称为一个“弟兄社区”。他是蒂罗尔人，称他为瑞士弟兄派只是就其来源说的。他到的时候那里的团体正闹分裂，是他把各群人合成一体，定下财物、劳作和管教的规矩，这些人后来就用他的名字，叫胡特尔派。

  1535 年明斯特事件之后，摩拉维亚也下令驱逐重洗派，他带着会众露宿野外，写信给总督申诉。他潜回蒂罗尔，同年 11 月被捕，受了酷刑，1536 年 2 月 25 日在因斯布鲁克被烧死。

  他的会众后来几经迁徙，从摩拉维亚到匈牙利、俄国，十九世纪后期到了北美。该书说，直到今天加拿大的艾伯塔省和曼尼托巴省仍有上百个这样的社区。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十五章“重洗派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter28.html"
recalled:
  - "《胡特尔派大纪事》"
  - "胡特尔 1535 年致摩拉维亚总督的信"
