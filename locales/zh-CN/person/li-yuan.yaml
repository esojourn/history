name: 唐高祖
aliases: [李渊, 李叔德]
role: 皇帝
summary: 唐朝开国皇帝，617 年在太原起兵，次年在长安称帝，626 年玄武门之变后让位。
body: |-
  李渊字叔德，北周天和元年（公元 566 年）生于长安。祖父李虎是西魏八柱国之一，父亲李昞袭封唐国公；母亲独孤氏是独孤信的女儿、隋文帝独孤皇后的姐姐，所以他与隋炀帝是姨表兄弟。他七岁丧父，承袭唐国公的爵位，隋朝时历任多地刺史、郡守。

  大业十一年（615 年）他任山西、河东抚慰大使，次年任太原留守，负责防御突厥、镇压当地的起事队伍。大业十三年（617 年）五月，他在晋阳起兵，杀死炀帝派来监视他的副留守王威、高君雅，同时向东突厥始毕可汗称臣求援。七月他率军南下，在霍邑击斩隋将宋老生，渡过黄河进入关中，十一月攻克长安，拥立炀帝的孙子代王杨侑为帝，自任大丞相，进封唐王（另见“晋阳起兵与唐朝建立”条）。至于起兵是出于李渊本人还是次子李世民的谋划，唐初官修史书多归功于李世民，近代学者多认为有所夸大。

  次年（618 年）炀帝在江都被杀的消息传来，五月他接受杨侑禅位，即皇帝位，国号唐，年号武德。此后数年间，唐军先后平定陇右的薛举父子、河东的刘武周、洛阳的王世充、河北的窦建德与刘黑闼、江陵的萧铣、江淮的辅公祏等势力。武德七年（624 年）他颁布新律令，重定均田制和租庸调法（另见“均田令与租庸调”条）。

  统一过程中，次子秦王李世民功劳最大，与太子李建成之间的矛盾日益尖锐，李渊始终没有妥善处理。武德九年（626 年）六月玄武门之变，李世民杀死李建成和齐王李元吉，李渊随即立李世民为太子，八月让位，自称太上皇（另见“玄武门之变”条）。贞观九年（635 年）五月他在长安大安宫去世，年七十，葬献陵。
