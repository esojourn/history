name: 努尔哈赤
aliases: [清太祖, 天命汗, 爱新觉罗·努尔哈赤]
role: 后金的建立者
summary: 建州女真首领，统一女真各部，创立八旗，1616 年建立后金。
body: |-
  努尔哈赤姓爱新觉罗，是建州左卫女真人，生于嘉靖三十八年（1559 年），家住赫图阿拉一带。万历十一年（1583 年）他的祖父觉昌安和父亲塔克世在明军攻打古勒寨时被误杀，明朝让他承袭建州左卫指挥使的职位。同年他以父祖留下的十三副铠甲起兵，攻打引明军攻寨的尼堪外兰。

  此后三十年，努尔哈赤先后统一了建州各部，又征服了海西女真的哈达、辉发、乌拉等部。他在这一时期对明朝保持恭顺，多次进京朝贡，被明朝授予都督佥事、龙虎将军等职。他在女真原有的狩猎组织“牛录”的基础上创建八旗制度，把军事、行政和生产结合在一起；又命额尔德尼等人借用蒙古字母创制满文，即“无圈点满文”。

  万历四十四年（1616 年）努尔哈赤在赫图阿拉称汗，国号“金”，史称“后金”，年号天命（另见“后金建立”条）。万历四十六年（1618 年）他以“七大恨”告天，起兵反明，攻陷抚顺。次年明朝派四路大军进攻后金，努尔哈赤集中兵力，在萨尔浒等地各个击破，明军惨败（另见“萨尔浒之战”条）。此后后金攻陷开原、铁岭，天命六年（1621 年）攻占沈阳、辽阳，迁都辽阳，天命十年（1625 年）又迁都沈阳。

  进入辽东汉人地区后，努尔哈赤推行“计丁授田”，强迫汉人与女真人合居，又屠杀被认为反抗的汉人，激起汉人的大规模反抗和逃亡。天命十一年（1626 年）正月他率军进攻宁远，被袁崇焕用西洋大炮击退（另见“宁远之战”条）。同年八月他在沈阳附近的叆鸡堡去世，年六十八岁。关于他的死因，有病死和在宁远受炮伤后不治两种说法，后一说多见于朝鲜和明朝方面的记载，学者看法不一。他死后，第八子皇太极继承汗位。清朝建立后追尊他为太祖。
