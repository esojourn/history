name: 帕曼纽
aliases: [帕尔梅尼翁, 帕曼纽恩]
role: 马其顿将军
summary: 腓力二世和亚历山大的头号将领，公元前 330 年被亚历山大下令处死。
body: |-
  马其顿贵族，菲洛塔斯之子，约生于公元前 400 年。他是腓力二世最倚重的将军。据普鲁塔克，前 356 年腓力同时接到三个消息：帕曼纽大败伊利里亚人，他的赛马在奥林匹亚得胜，儿子亚历山大出生。前 346 年他是与雅典议和的使节之一。前 336 年腓力派他和阿塔罗斯率先头部队渡海到小亚细亚，为东征做准备。

  同年腓力遇刺。帕曼纽支持亚历山大继位，并听任亚历山大派人除掉他的同僚兼女婿阿塔罗斯。东征开始后，他是全军的副统帅，在格拉尼库斯河、伊苏斯和高加米拉三次会战中都指挥由色萨利骑兵等组成的左翼，承受波斯军的主要压力，使亚历山大得以在右翼突击。他的三个儿子也在军中：长子菲洛塔斯统领伙伴骑兵，尼卡诺尔统领持盾卫队，幼子赫克托耳死在埃及。

  阿里安和普鲁塔克多次记载他的建议被亚历山大否决，例如在格拉尼库斯劝他等到次日清晨再渡河，在高加米拉之前劝他夜袭。最有名的一则是大流士提出割让幼发拉底河以西并付巨额赎金求和，帕曼纽说“如果我是亚历山大，我就接受”，亚历山大答道“如果我是帕曼纽，我也会”。现代学者怀疑这类故事有一部分出自贬低他的宫廷史家。

  前 330 年大军继续东进，他奉命留守埃克巴坦那，看管从波斯各都城运来的财宝和后方交通线。同年秋，在德兰吉亚那，菲洛塔斯被指知道一桩谋害国王的阴谋而不上报，经军中审判处死。亚历山大随即派人骑快骆驼穿过沙漠，赶在消息传到之前，命当地将领把帕曼纽杀死。他时年约七十岁。史料没有他参与阴谋的证据，古今多认为这是为防他报复。
sources: []
recalled:
  - 阿里安《亚历山大远征记》卷一至卷三，卷三第 26 章
  - 普鲁塔克《亚历山大传》第 3 章、第 29 章、第 48—49 章
  - 库尔提乌斯《亚历山大史》卷六、卷七
