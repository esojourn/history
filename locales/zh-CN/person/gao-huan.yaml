name: 高欢
aliases: [贺六浑, 北齐神武帝]
role: 东魏大丞相
summary: 出身六镇的将领，消灭尔朱氏后掌握北魏朝政，另立孝静帝建立东魏。
body: |-
  高欢字贺六浑，自称渤海蓨人，出身渤海高氏。他的祖上因罪迁居北边的怀朔镇，世代生活在那里，沿袭了鲜卑的风俗。他家境贫寒，娶了鲜卑富家女娄昭君，才有了马，当上镇里的队主、函使。六镇之乱后，他先后投奔杜洛周、葛荣，后来归附尔朱荣，受到重用。

  永安三年（公元 530 年）尔朱荣被杀，尔朱兆让他统领六镇降户二十余万人到河北一带就食，他的势力由此壮大。普泰元年（531 年），他在信都起兵反对尔朱氏，次年在韩陵大败尔朱兆等人的联军，进入洛阳，拥立孝武帝元修，自己坐镇晋阳，建立大丞相府，遥控朝政。

  永熙三年（534 年），孝武帝与他不和，西奔关中投靠宇文泰。高欢另立元善见为帝，即孝静帝，把都城从洛阳迁到邺，史称东魏，北魏由此分裂为东、西两部分（另见“北魏分裂”条）。据《资治通鉴》，他调和鲜卑人与汉人的关系，对鲜卑人说，汉人是你们的奴仆，男人为你们耕田，女人为你们织布，你们为何欺凌他们；对汉人则说，鲜卑人是你们的雇客，得你们一斛粟、一匹绢，为你们抵御贼寇，你们为何怨恨他们。

  此后他与西魏宇文泰连年交战。天平四年（537 年）在沙苑大败；武定元年（543 年）在邙山获胜；武定四年（546 年）他亲率大军围攻玉壁，五十天攻不下来，据《北齐书》，士卒战死、病死七万人，他只得撤军，忧愤成病。撤军途中，他令大将斛律金唱《敕勒歌》，自己相和，感伤流泪。武定五年（547 年）正月，他在晋阳去世，年五十二。长子高澄继承了他的权位；550 年次子高洋代东魏建立北齐，追尊他为神武皇帝。
sources: []
recalled:
