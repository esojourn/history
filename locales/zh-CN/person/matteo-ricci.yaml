name: 利玛窦
aliases: [西泰]
role: 耶稣会来华传教士
summary: 意大利耶稣会士，1583 年进入中国内地，与徐光启合译《几何原本》。
body: |-
  利玛窦是意大利马切拉塔人，1571 年在罗马加入耶稣会，在罗马学院学习神学，也跟随数学家克拉维乌斯学习数学和天文。1578 年他被派往东方，先在印度果阿等地工作，1582 年来到澳门学习汉语。

  1583 年他与罗明坚获准进入广东肇庆居住，建立了教堂。他起初穿僧服，后来发现儒家士大夫在中国社会中的地位更高，便改穿儒服，以“西儒”自居，结交士大夫，以天文、地理、数学知识引起他们的兴趣。他绘制的世界地图经过多次刊印，让许多中国人第一次看到包括美洲在内的世界全图。此后他迁居韶州、南昌、南京等地，结识了瞿汝夔、李贽、徐光启等人。

  利玛窦在传教上采取适应中国文化的策略，他认为儒家的“天”“上帝”与基督教的天主相通，祭祖、祭孔是表达敬意的礼节而非宗教崇拜，可以允许中国信徒参加。他用中文写了《天主实义》等书。这一策略在他死后引起了天主教内部的长期争论，最终演变为“礼仪之争”。

  1601 年他到北京向万历帝进献自鸣钟、《万国图志》、西洋琴等物，获准在北京居住，此后在北京结交士大夫，与徐光启合译了欧几里得《几何原本》的前六卷，与李之藻合作翻译了数学著作（另见“利玛窦入华”条）。1610 年他在北京去世，万历帝特许把他安葬在北京阜成门外的滕公栅栏，这是第一位获准葬在北京的西方传教士。他晚年用意大利文写下的回忆录，后来由金尼阁整理成拉丁文出版，中译本称《利玛窦中国札记》。
sources: []
recalled:
  - 利玛窦、金尼阁《利玛窦中国札记》
  - 《明史·意大里亚传》
  - 利玛窦《天主实义》
