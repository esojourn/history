name: 约瑟夫斯
aliases:
  - 弗拉维乌斯·约瑟夫斯
  - 马提亚的儿子约瑟
role: 犹太史家
summary: 祭司出身的犹太将领，降罗马后著《犹太战记》《犹太古史》。
body: |-
  公元 37 年生于耶路撒冷，本名约瑟，父亲名叫马提亚。据他的《自传》，他出身祭司家族，母亲一系出自哈斯摩尼家。

  66 年犹太人起事后，他受命主持加利利的防务。67 年韦斯巴芗进兵加利利，围攻约他帕他城。据他自己在《犹太战记》卷 3 的记述，城守了四十七天后陷落，他和四十个同伴躲在洞里，众人约定抽签相继自尽，最后只剩他和另一个人，他就出来投降。他见到韦斯巴芗时预言对方将作皇帝；69 年韦斯巴芗果然称帝，他获得释放，此后改用皇室的族名弗拉维乌斯。70 年提多围攻耶路撒冷，他在军中，曾奉命向城里的人喊话劝降。

  战后他随提多到罗马，得到罗马公民权和皇室的供养，在那里写作。《犹太战记》七卷记公元 66—73 年的战争；《犹太古史》二十卷从创世写到战争爆发前，据书末自述成于图密善在位第十三年（公元 93—94 年）；另有《自传》和《驳阿皮翁》。他的卒年没有记载，一般认为在公元 100 年前后。

  他的著作是了解第二圣殿晚期犹太历史的主要史料。《犹太古史》卷 18 提到施洗约翰，卷 20 提到“被称为基督的耶稣的兄弟雅各”；卷 18 另有一段直接讲到耶稣的文字，学界多认为经过后世抄写者的增改。
sources: []
recalled:
  - 约瑟夫斯《自传》
  - 约瑟夫斯《犹太战记》卷 3（约他帕他之围）、卷 5—6
  - 约瑟夫斯《犹太古史》卷 18、卷 20
