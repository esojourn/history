name: 辽圣宗
aliases: [耶律隆绪, 耶律文殊奴]
role: 辽朝皇帝
summary: 辽景宗长子，在位近五十年，前期由萧太后摄政，订立澶渊之盟，是辽朝的鼎盛时期。
body: |-
  辽圣宗耶律隆绪是辽景宗的长子，生于保宁四年（公元 972 年），小字文殊奴。乾亨四年（982 年）景宗去世，他十二岁即位，由母亲承天太后萧绰摄政。

  在太后摄政期间，辽朝两次与宋朝大规模交战。统和四年（986 年）宋军北伐，辽军在岐沟关、陈家谷等地获胜（另见“雍熙北伐”条）。统和二十二年（1004 年）他随太后南下，在澶州与宋真宗议和，订立澶渊之盟（另见该条）。统和二十五年（1007 年）辽朝在奚族故地修建中京大定府。

  统和二十七年（1009 年）太后归政，不久去世，圣宗亲政。他几次出兵攻打高丽，开泰七年（1018 年）辽将萧排押率军深入高丽，次年在龟州被高丽将领姜邯赞击败，此后双方议和，高丽仍向辽称臣，使用辽朝的年号。在内政上，他推行汉化的措施，开科取士，整顿刑法，减轻对汉人的歧视，提倡儒学和佛教。史称他精通音律，喜爱汉文诗书，曾把白居易的诗译成契丹文，命大臣诵读。

  太平十一年（1031 年）六月，圣宗在出行途中去世，在位四十九年，是辽朝在位最久的皇帝。他的儿子耶律宗真继位，即辽兴宗。一般认为圣宗时期是辽朝国力最强的时候。
sources: []
recalled:
  - 《辽史·圣宗本纪》
  - 《契丹国志·圣宗天辅皇帝》
  - 《高丽史·姜邯赞传》
