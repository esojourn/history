name: "亨利四世"
aliases: ["纳瓦拉的亨利", "波旁的亨利", "波邦的亨利"]
role: "法国国王"
summary: "胡格诺派出身的法国国王，改信天主教以结束内战，1598 年颁布南特敕令。"
body: |-
  亨利 1553 年 12 月 13 日生于法国西南部的波城，父亲是波旁家的安托万，母亲是纳瓦拉女王让娜·达尔布雷。母亲信改革宗，按这个信仰教养他。1572 年 6 月母亲去世，他继位为纳瓦拉国王，8 月 18 日在巴黎与法王的妹妹玛格丽特结婚。

  六天之后发生圣巴多罗买大屠杀。《历史的轨迹》第三十章说他总算逃脱；他是王室的近支，被留在宫里，国王要他在弥撒和死之间选择，他改信了天主教，在宫中被看管了三年多，1576 年逃走，重新宣布自己是新教徒，成为胡格诺派的首领。

  1584 年法王亨利三世的弟弟死了，国王无子，按继承法该轮到他。天主教同盟不肯接受一个新教徒做国王，由吉斯公爵亨利领头起兵。该书称这场战争是三个亨利之间的三角冲突。1588 年底亨利三世派人刺杀了吉斯公爵，次年与纳瓦拉的亨利联合围攻巴黎，8 月被一个多明我会修士刺死，临终指定他为继承人。

  他成了亨利四世，却进不了巴黎。打了四年仗，西班牙出兵帮助同盟，他看出大多数臣民不会接受新教的国王。1593 年 7 月 25 日他在圣但尼正式改信天主教，次年 3 月进入巴黎。“巴黎值得一场弥撒”这句话相传是他说的，没有可靠的出处。

  1598 年 4 月他在南特颁布敕令，给胡格诺派信仰自由、平等的公民权和一批设防的城市。该书说他虽不再是新教徒，却没有忘记旧日的同道。同年他与西班牙议和。此后他与大臣叙利整理财政，恢复农业。1610 年 5 月 14 日他在巴黎街上被狂热的天主教徒拉瓦亚克刺死。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
recalled:
  - "1598 年《南特敕令》"
  - "叙利《回忆录》"
  - "莱图瓦勒《日记》"
  - "《亨利四世书信集》"
