name: 林则徐
aliases: [少穆, 文忠]
role: 钦差大臣，虎门销烟的主持者
summary: 道光年间以钦差大臣到广东禁烟，主持虎门销烟，鸦片战争中被革职，遣戍伊犁。
body: |-
  林则徐是福建侯官（今福州）人，嘉庆十六年（1811 年）考中进士。他先后在浙江、江苏、陕西、湖北、河南等地任职，兴修水利，整顿财政，赈济灾民，以干练著称，道光十七年（1837 年）任湖广总督。他在湖广严禁鸦片，收缴烟枪、烟土，成效显著。

  道光十八年（1838 年）鸿胪寺卿黄爵滋上疏请求严禁鸦片，林则徐上奏支持，并指出如果不禁烟，几十年后“中原几无可以御敌之兵，且无可以充饷之银”。道光帝召他进京，任命他为钦差大臣，到广东查禁鸦片。道光十九年（1839 年）他到达广州，会同两广总督邓廷桢、水师提督关天培，命令外国商人交出鸦片，并保证以后不再夹带。英国商务监督义律起初拒绝，林则徐封锁商馆，最后迫使外商交出鸦片二万多箱，六月在虎门海滩当众销毁（另见“虎门销烟”条）。

  林则徐重视了解外国情况，组织人员翻译外国报刊和书籍，把英国人慕瑞的《世界地理大全》译编为《四洲志》，被后人称为“开眼看世界的第一人”。他整顿广东的海防，加强虎门的炮台。道光二十年（1840 年）英国发动鸦片战争，英军转而北上，道光帝把战事的责任归咎于林则徐，将他革职，次年又把他遣戍新疆伊犁（另见“鸦片战争”条）。他在伊犁协助开垦屯田，兴修水利，后来被重新起用，任陕甘总督、陕西巡抚、云贵总督等职。

  道光三十年（1850 年）咸丰帝任命林则徐为钦差大臣，到广西镇压拜上帝会的起事，他在赴任途中于广东潮州普宁病逝，年六十六岁，谥“文忠”。他的诗句“苟利国家生死以，岂因祸福避趋之”流传很广。
