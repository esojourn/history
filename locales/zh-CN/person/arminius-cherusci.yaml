name: 阿米尼乌斯
aliases: [阿尔米尼乌斯, 赫尔曼, 切鲁西人阿米尼乌斯]
role: 切鲁西人首领
summary: 日耳曼切鲁西人的首领，公元 9 年在条顿堡森林歼灭罗马三个军团。
body: |-
  阿米尼乌斯是日耳曼切鲁西人的贵族，父亲名叫塞吉默。切鲁西人住在威悉河中游一带。他的生年由塔西佗所说的享年倒推，约在公元前 18 或前 17 年。据维莱伊乌斯·帕特尔库鲁斯，他年轻时带本族人在罗马军中服役，得了罗马公民权和骑士身份，会说拉丁语。“阿米尼乌斯”是他的拉丁名字，本名没有留下来。

  公元 7 年前后，瓦卢斯到莱茵河以东主持军政，按行省的办法征税、审案，各部族不满。阿米尼乌斯是瓦卢斯的座上客，暗中联络各部。公元 9 年秋，他诱使瓦卢斯带着三个军团绕道去平定一处虚报的叛乱，在条顿堡森林的林地和沼泽间设伏，几天之内把这支军队全部歼灭。他的岳父塞格斯特斯亲附罗马，事前向瓦卢斯告过密，瓦卢斯没有相信。

  此后罗马人退回莱茵河。公元 14 至 16 年，日耳曼尼库斯几次渡河报复。15 年，阿米尼乌斯怀孕的妻子图斯内尔达被岳父交给罗马人，儿子生在囚禁中，他再没有见过他们。16 年他在威悉河边的伊狄斯塔维索战败负伤，但部众没有被打散，提比略随即召回了日耳曼尼库斯，罗马从此不再谋求占领莱茵河以东。

  17 年他又与马科曼尼人的王马罗博杜斯交战，迫使对方退走。塔西佗说，他后来想做王，为族人所不容，公元 21 年被亲族谋害，终年三十七岁，掌权十二年。塔西佗称他“无疑是日耳曼的解放者”，又说希腊人的史书不知道他，罗马人也不大提他。

  十六世纪塔西佗的著作重新流传以后，他在德意志被叫作“赫尔曼”，十九世纪成了民族统一的象征，代特莫尔德附近的赫尔曼纪念像落成于 1875 年。
