name: 马致远
aliases: [东篱]
role: 杂剧、散曲作家
summary: 元代杂剧、散曲作家，“元曲四大家”之一，代表作有《汉宫秋》和《天净沙·秋思》。
body: |-
  马致远号东篱，大都人，生卒年都不详，大约生活在元朝前期到中期。据《录鬼簿》，他曾任江浙行省务官，晚年退隐，过着闲适的生活。他与一些艺人合组“元贞书会”，合作编写杂剧。

  马致远作杂剧十几种，今存七种，以《汉宫秋》最为著名，写汉元帝与王昭君的故事，改动了史实，让王昭君在出塞途中投江而死，抒发了深沉的兴亡之感。他的散曲成就更高，今人辑得小令一百多首，题材多写隐逸和叹世，语言清丽。《天净沙·秋思》“枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯”最为人传诵，元人周德清称之为“秋思之祖”；这首小令在早期的元人选本中也有不署作者的，归属有不同意见。他与关汉卿、郑光祖、白朴并称“元曲四大家”。
sources: []
recalled:
  - 钟嗣成《录鬼簿》
  - 周德清《中原音韵》
