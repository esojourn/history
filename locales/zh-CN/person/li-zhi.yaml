name: 唐高宗
aliases: [李治, 晋王, 天皇]
role: 皇帝
summary: 唐朝第三位皇帝，在位期间唐朝疆域达到极盛；立武则天为后，晚年由武后参决政事。
body: |-
  李治是唐太宗与长孙皇后的第三子，贞观二年（公元 628 年）生于长安，封晋王。贞观十七年（643 年）太子李承乾谋反被废，魏王李泰也因争位被贬，在长孙无忌等人的支持下，他被立为太子。贞观二十三年（649 年）太宗去世，他即位，次年改元永徽。

  即位初期，他由长孙无忌、褚遂良等顾命大臣辅政，沿用贞观的政策，永徽四年（653 年）颁行《唐律疏议》，史家把这一时期称为“永徽之治”。在对外方面，唐军在他在位期间先后攻灭西突厥（657 年）、百济（660 年）和高句丽（668 年），在西域设安西都护府、在朝鲜半岛设安东都护府，唐朝的疆域在这一时期达到最大。

  永徽六年（655 年），他不顾长孙无忌、褚遂良等人的反对，废王皇后，立武昭仪为皇后（另见“废王立武”条），此后陆续贬逐了反对的大臣，显庆四年（659 年）逼死长孙无忌。显庆末年起他患头风，发作时目不能视，武后开始参决政事。麟德元年（664 年）他一度让宰相上官仪起草废后的诏书，事情泄露，武后前来申诉，他把责任推给上官仪，上官仪被杀。此后他上朝时武后在帘后听政，朝野称为“二圣”。上元元年（674 年）他称天皇，武后称天后。

  他在位后期，唐朝与吐蕃争夺吐谷浑故地和西域，咸亨元年（670 年）薛仁贵在大非川大败，安西四镇一度失守。他立的太子李弘在上元二年（675 年）突然去世，次立的太子李贤又在调露二年（680 年）被废。弘道元年（683 年）十二月，他在东都洛阳的贞观殿去世，年五十六，遗诏太子李显在柩前即位，军国大事有不能决断的，听取天后的意见。他与武则天合葬于乾陵。
sources: []
