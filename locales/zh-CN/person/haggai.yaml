name: 哈该
aliases: []
role: 先知
summary: 归回后的先知，在大流士第二年劝勉百姓重建圣殿。
body: |-
  归回时期的先知。圣经没有记载他的家世、生卒年和出生地。《以斯拉记》5:1、6:14 把他和撒迦利亚并提，说犹大的长老因这两位先知的劝勉，建造的工程得以亨通。

  《哈该书》共两章，收录他在大流士第二年六月初一日到九月二十四日之间传的四段话，每段都标明日期，换算为公元前 520 年。第一段责问百姓：自己住在天花板的房屋里，耶和华的殿却仍然荒凉；又说他们收成微薄正是因此。所罗巴伯、大祭司约书亚和百姓听了，在六月二十四日动工（1:12–15）。

  第二段是对见过旧殿、觉得新殿算不得什么的人说的，应许这殿后来的荣耀必大过先前的荣耀（2:1–9）。第三段借洁净与污秽的条例发问，并说从立殿根基的日子起耶和华必赐福（2:10–19）。第四段单对所罗巴伯说，耶和华要以他为印（2:20–23）。此后圣经不再提到哈该。
sources: []
recalled:
  - 《哈该书》第 1—2 章
  - 《以斯拉记》5:1、6:14
