name: 石勒
aliases: [石世龙, 后赵明帝]
role: 后赵开国君主
summary: 羯人，从奴隶成为将领，建立后赵，灭前赵后占有北方大部，重用张宾、兴办学校。
body: |-
  石勒字世龙，上党武乡的羯人，祖父和父亲都是部落里的小首领。他年轻时为人佣耕、贩货。西晋太安年间并州饥荒，并州刺史司马腾捕捉胡人卖到山东换取军粮，他也在其中，被卖到茌平给人做奴隶，后来被主人放免。他与汲桑等人结伙为盗，又投入成都王颖旧部的军中，“石勒”这个名字是汲桑给他取的。汲桑败死后，他在永嘉元年（公元 307 年）投奔刘渊。

  此后几年，他率军转战于黄河南北，部众日多。他任用赵郡人张宾为谋主，另设“君子营”安置投奔他的士人。永嘉五年（311 年），他在宁平城歼灭了东海王越留下的晋军主力，杀王衍等大批朝官，随后参与攻陷洛阳，又袭杀了同为汉国将领的王弥，吞并其部众。次年他想南下进攻建业，在葛陂遇上连绵大雨和疫病，听从张宾的建议北还，以襄国为根据地。

  他在襄国逐步经营河北，建兴二年（314 年）假意推戴幽州的王浚而袭杀之，建兴四年击败刘琨取得并州。大兴二年（319 年）他自称赵王，史称后赵。祖逖在世时他不敢进犯河南，祖逖死后才夺取那里，又取青州。咸和三年（328 年）底他在洛阳生擒刘曜，次年灭前赵。至此除辽东的慕容氏、凉州的张氏等以外，北方大部归他所有。咸和五年（330 年）他先称大赵天王，随后称皇帝。

  他不识字，常让人读史书给他听。《晋书·载记》记载，他听到郦食其劝刘邦分封六国之后时大惊，说这样做必定失败，听到张良谏止才放心。他在襄国设立学校，命将佐子弟入学，亲自去考试学生；清查户口，减轻租赋，沿用九品之制选拔士人，并禁止胡人欺侮衣冠士族。他曾说，如果遇到汉高祖，自己甘愿称臣；遇到光武帝，可以并驾争先；但做事应当光明磊落，不能像曹操、司马懿父子那样欺负孤儿寡妇而取天下。此语见载记。

  咸和八年（333 年）七月他去世，时年六十。太子石弘继位，实权落入侄子石虎手中，第二年石弘被废杀。
sources: []
recalled:
  - 《晋书·石勒载记》
  - 《资治通鉴》卷八十六至九十五
