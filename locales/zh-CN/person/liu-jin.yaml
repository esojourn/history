name: 刘瑾
aliases: []
role: 正德年间专权的宦官
summary: 正德帝宠信的“八虎”之首，掌司礼监，专权五年，排斥异己，后以谋反罪被凌迟处死。
body: |-
  刘瑾是陕西兴平人，本姓谈，幼年自宫，投靠一个姓刘的宦官，改姓刘。他在东宫侍奉太子朱厚照，朱厚照即位后，刘瑾与马永成、谷大用、张永等八个宦官整日陪伴他游乐，被称为“八虎”。

  正德元年（1506 年）内阁大学士刘健、谢迁和户部尚书韩文等人联名上奏，请求诛杀“八虎”，正德帝起初有所动摇，但刘瑾等人连夜哭诉，正德帝反而任命刘瑾掌管司礼监，刘健、谢迁被迫辞官。此后刘瑾专权，朝臣奏章要先送给他看，他还设立内行厂，侦察官民。正德二年（1507 年）他把刘健、谢迁、王守仁等五十多人列为“奸党”，榜示朝堂。地方官员入京要向他行贿，当时有人称他为“立皇帝”，称正德帝为“坐皇帝”。

  正德五年（1510 年）安化王朱寘鐇以诛刘瑾为名起兵，很快被平定。监军的张永回京后向正德帝告发刘瑾谋反，从刘瑾家中抄出大量金银和伪玺、衣甲等物，刘瑾被凌迟处死。他家中抄出的财物数目，各书记载出入很大，不足凭信。
sources: []
recalled:
