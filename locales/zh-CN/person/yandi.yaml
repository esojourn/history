name: 炎帝
aliases: [神农氏（一说）]
role: 传说中的部落首领
summary: 传说中与黄帝同时的部落首领，相传与黄帝战于阪泉而败，后世并称“炎黄”。
body: |-
  炎帝是中国上古传说中的人物，没有同时代的文字记载，相关说法都出自战国至汉代的古书。据《国语·晋语》，少典娶有蟜氏之女，生黄帝和炎帝，“黄帝以姬水成，炎帝以姜水成”，所以黄帝姓姬，炎帝姓姜。后世以姜姓的齐、吕、申、许等国为炎帝的后裔。

  《史记·五帝本纪》说，轩辕的时候“神农氏世衰”，诸侯相互侵伐；炎帝想要侵陵诸侯，诸侯都归附轩辕。轩辕于是与炎帝战于阪泉之野，“三战，然后得其志”。这是司马迁所记炎帝事迹的全部。

  炎帝和神农氏是否同一人，古书说法不一。《史记》的行文里，“神农氏”与“炎帝”分开出现；汉代以后的一些书（如《帝王世纪》）把二者合而为一，说神农氏教民耕种、尝百草，这一说法流传最广，但出现得较晚。今天习称的“炎黄子孙”，是把炎帝、黄帝并称为华夏的共同祖先。
sources: []
recalled:
  - 《史记·五帝本纪》
  - 《国语·晋语四》
