name: 马祖道一
aliases: [道一, 马大师]
role: 禅宗僧人
summary: 唐代禅宗高僧，南岳怀让的弟子，在洪州弘法，开创“洪州宗”，提出“平常心是道”。
body: |-
  道一俗姓马，汉州什邡人，景龙三年（公元 709 年）生，后人尊称他为马祖。他幼年出家，后来到南岳衡山跟随六祖慧能的弟子怀让学禅，得到印可。此后他到福建、江西各地弘法，大历年间起长期在洪州开元寺讲禅，四方的学僧纷纷前来，所以他的一派被称为“洪州宗”。

  他主张“即心即佛”“平常心是道”，认为佛法就在日常的行住坐卧之中，不必刻意修行；教学时常用棒喝、扬眉、竖拂等动作和机锋问答来启发弟子，对后世禅宗的风格影响很大。他的弟子很多，据《景德传灯录》，入室弟子有一百三十九人，其中百丈怀海、南泉普愿、西堂智藏等最为有名，百丈怀海后来制定了禅院的规制“百丈清规”。贞元四年（788 年）他在洪州的石门山去世，年八十，唐宪宗时追谥大寂禅师。后世有“马祖建丛林，百丈立清规”的说法。
sources: []
recalled:
  - 《宋高僧传·道一传》
  - 《景德传灯录》卷六
  - 权德舆《洪州开元寺石门道一禅师塔碑铭》
