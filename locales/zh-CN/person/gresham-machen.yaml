name: "梅钦"
aliases: ["格雷欣·梅钦", "梅琴"]
role: "新约学者，威斯敏斯特神学院与正统长老会的创办人"
summary: "普林斯顿新约学者，反对现代主义，创办威斯敏斯特神学院，后组正统长老会。"
body: |-
  《历史的轨迹》第四十八章说，在传统基督教信仰与现代主义之争中新兴的一个教会是正统长老会。公理派受新英格兰神学影响降下加尔文主义的旗帜时，北部长老会仍高举加尔文主义达几十年之久；但现代主义渐渐侵入普林斯顿神学院，再进入长老会。

  书中说，1929 年在梅钦的领导下，在费城成立了威斯敏斯特神学院，以对抗普林斯顿神学院的现代主义；经过激烈奋斗，加尔文派在 1935 年的大会中被现代派击败，书中认为这是因为多数长老会信徒把“和平”放在“真理”之上。一批忠于先人信仰的人于是在 1934 年组织了正统长老会。书中这里的年份前后倒置：据一般记载，梅钦因在 1933 年另立独立的长老会海外宣教部，1935 年被区会审判、停职，1936 年 6 月总会维持原判，他与支持者随即成立新教会，起初叫“美国长老会”，1939 年才改称正统长老会。

  据一般记载，梅钦 1881 年生于巴尔的摩，在约翰·霍普金斯大学、普林斯顿神学院读书，又到德国马尔堡、哥廷根进修，一度为自由派神学所困扰。1906 年起他在普林斯顿神学院教新约，著有《保罗宗教的起源》《童女生子》等学术著作。1923 年他出版《基督教与自由主义》，认为自由主义不是基督教的另一种形式，而是另一种宗教。1929 年普林斯顿神学院改组，他与几位同事离开，到费城创办威斯敏斯特神学院。1936 年底他冒严寒到北达科他讲道，染肺炎，1937 年元旦在俾斯麦去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十八章“教会努力保守信仰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter53.html"
recalled:
  - "梅钦《基督教与自由主义》（1923 年）"
