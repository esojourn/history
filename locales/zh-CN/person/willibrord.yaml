name: 卫利勃罗
aliases:
  - 威利布罗德
  - 弗里斯兰人的使徒
role: 乌得勒支大主教
summary: 英格兰修士，公元 690 年起向弗里斯兰人传道，是第一任乌得勒支大主教。
body: |-
  卫利勃罗约在公元 658 年生于英格兰北部的诺森布里亚。父亲后来作了隐修士，把他从小送进里彭修道院，在威尔弗里德门下受教。二十岁时他去了爱尔兰，在一所有许多英格兰修士的修道院里住了十二年，被立为长老。他的生平见于比德的《英吉利教会史》和阿尔昆写的传记，阿尔昆是他的同族。

  公元 690 年，他带着十一个同伴渡海到弗里斯兰，就是今天荷兰的沿海地区。法兰克的宫相丕平刚从弗里斯兰王拉德博德手里夺得南部一带，支持他们传道。他两次去罗马，695 年由教皇塞尔吉乌一世立为弗里斯兰人的大主教。丕平把乌得勒支给他作驻地。698 年他在今天卢森堡的埃希特纳赫建了一所修道院。

  公元 714 年丕平死后，拉德博德夺回失地，毁了教堂，他退到埃希特纳赫。719 年拉德博德去世，他才回去重整。这以后的三年里，后来被称为“日耳曼人的使徒”的波尼法修在他手下工作。他还到过丹麦人那里，没有什么结果。

  他在公元 739 年 11 月 7 日死于埃希特纳赫，葬在那里。《历史的轨迹》第七章说，从 690 到 739 年，他的努力使乌得勒支成为大主教区。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 比德《英吉利教会史》卷 5 第 9—11 章
  - 阿尔昆《卫利勃罗传》
