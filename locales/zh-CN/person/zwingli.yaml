name: "慈运理"
aliases: ["乌尔里希·慈运理", "茨温利"]
role: "苏黎世大教堂牧师、改教家"
summary: "瑞士德语区的改教家，在苏黎世废除弥撒，主张圣餐是纪念，1531 年战死。"
body: |-
  慈运理 1484 年 1 月 1 日生于瑞士东部山区的维尔德豪斯，父亲是村长。《历史的轨迹》第二十四章说，他在巴塞尔、伯尔尼、维也纳受教育，1506 年得硕士学位；他受的是人文学者的训练，没有进过修道院，也没有路德那样的内心挣扎。此后他在格拉鲁斯做了十年司铎，两次随瑞士雇佣兵去意大利，从此反对雇佣兵制度。他结识了伊拉斯谟，1516 年希腊文新约出版后，把保罗书信亲手抄了一遍来背诵。

  1519 年初他任苏黎世大教堂的牧师，不照节期的选段，从马太福音第一章起逐章讲道。该书说他 1518 年开始攻击赎罪券，又受路德在莱比锡的立场感动；他本人则说自己早在知道路德之前就传福音了，两人谁影响谁，学者看法不一。1522 年四旬期有人当他的面吃香肠，他出来为他们辩护。1523 年他在市议会主持的辩论会上提出《六十七条》，议会判他得胜。此后苏黎世撤去教堂的图像，解散修道院，1525 年复活节废除弥撒，改行简单的圣餐。他主张教会只可行圣经吩咐的事，连管风琴也停了。

  他原先的一些追随者要求只给信徒施洗，他不同意，苏黎世议会对重洗派处以淹刑。在圣餐问题上，他把“这是我的身体”解作“这代表我的身体”，与路德争论多年。1529 年 10 月两人在马尔堡会面，十五条中十四条达成一致，唯独圣餐一条谈不拢。

  改教传到伯尔尼、巴塞尔等地，山区几个州仍守旧教，双方结盟对峙。1531 年 10 月 11 日天主教各州的军队在卡珀尔击败苏黎世人，慈运理以随军牧师的身份在阵中被杀，尸体被分割焚烧。布林格接替了他在苏黎世的职位。该书说，他死后这一带的新教徒渐渐倾向加尔文。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十一章“教会开始动摇” https://wellsofgrace.com/books/spiritual/2000years/html/chapter24.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十四章“瑞士的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter27.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十五章“重洗派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter28.html"
