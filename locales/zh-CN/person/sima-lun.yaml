name: 司马伦
aliases: [赵王伦, 司马子彝]
role: 赵王
summary: 司马懿第九子，废杀贾后，又废晋惠帝自立，在位三个多月被诸王推翻。
body: |-
  司马伦字子彝，是司马懿的第九子，生年不详。晋初封琅邪王，后改封赵王。惠帝元康年间他镇守关中，因刑赏不当引起氐、羌反抗，被召回洛阳。他本人才能平庸，事事听从亲信孙秀。

  永康元年（公元 300 年）四月，贾后害死太子司马遹以后，他以此为名带兵入宫，废杀贾后，又杀张华、裴頠等大臣，自任相国。淮南王司马允起兵讨他，兵败被杀。次年正月，他把惠帝迁到金墉城，自己称帝，改元建始。为了收买人心，他滥授官爵，连奴仆走卒也加封，朝会时冠上的貂尾不够用，当时有“貂不足，狗尾续”的谚语，见《晋书·赵王伦传》。

  齐王冏、成都王颖、河间王颙随即起兵。四月，洛阳城内的将领起事，迎惠帝复位。他被送到金墉城，赐金屑酒而死，孙秀等同党被杀。
sources: []
recalled:
  - 《晋书·赵王伦传》
  - 《资治通鉴》卷八十三、八十四
