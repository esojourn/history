name: 阎立本
aliases: []
role: 画家、右相
summary: 唐初画家，绘凌烟阁功臣像，传世名作有《步辇图》《历代帝王图》，官至右相。
body: |-
  阎立本是雍州万年人，出身工艺世家。父亲阎毗在隋朝任将作少监，擅长绘画和工艺；哥哥阎立德在唐朝任将作大匠、工部尚书，主持营建过翠微宫、玉华宫等。阎立本以绘画著称，尤其擅长人物肖像。

  贞观十七年（公元 643 年），太宗命他在凌烟阁画二十四位功臣的像。传世的《步辇图》描绘太宗接见吐蕃使者禄东赞的情景，《历代帝王图》画了从汉到隋的十三位帝王，一般都归于他名下，但现存的画卷是否为他亲笔，学界有不同看法。

  据《旧唐书》本传，太宗曾在春苑池中泛舟，见水鸟可爱，召阎立本当场作画，侍从传呼“画师阎立本”。当时他已任主爵郎中，趴在池边调色作画，满头大汗，深感羞辱，回家告诫儿子不要再学绘画。总章元年（668 年）他任右相，而左相姜恪以军功起家，时人说“左相宣威沙漠，右相驰誉丹青”，讥讽他不是宰相之才。咸亨四年（673 年）他去世。
sources: []
recalled:
  - 《旧唐书·阎立德传》附阎立本
