name: 奕訢
aliases: [恭亲王, 鬼子六]
role: 恭亲王，总理衙门的首任领班大臣
summary: 道光帝第六子，与英法议和，参与辛酉政变，主持总理衙门，是洋务运动的中枢人物。
body: |-
  奕訢是道光帝的第六个儿子，咸丰帝的异母弟，聪明能干，据说道光帝曾考虑立他为储君，最后在他名字前写下封亲王的朱谕，他被封为恭亲王。咸丰年间他一度任军机大臣，后来被咸丰帝罢免。

  咸丰十年（1860 年）英法联军进逼北京，咸丰帝逃往热河，命奕訢留京议和。奕訢与英、法、俄三国签订了《北京条约》。通过这次交涉，他认识到西方国家的实力，回奏中提出外国“志在通商”，建议设立专门的外交机构。咸丰十一年（1861 年）初，清朝设立总理各国事务衙门，奕訢任领班大臣。同年咸丰帝去世，奕訢与慈禧、慈安两宫太后联合发动辛酉政变，除掉肃顺等八大臣，被授予“议政王”，主持军机处和总理衙门（另见“辛酉政变”条）。

  此后二十多年，奕訢在中央支持曾国藩、李鸿章、左宗棠等人兴办洋务，设立同文馆，聘请赫德主持海关，派员出洋考察，被看作洋务运动在中央的主持者（另见“洋务运动”条）。守旧派讥讽他亲近洋人，称他为“鬼子六”。他与慈禧太后的关系时好时坏，同治四年（1865 年）曾被罢去议政王的头衔；光绪十年（1884 年）中法战争期间，他和全班军机大臣被慈禧罢免，史称“甲申易枢”。

  甲午战争爆发后，奕訢被重新起用，主持总理衙门和军机处，但已年老多病，无力扭转局面。光绪二十四年（1898 年）四月他去世，不久戊戌变法开始。
sources: []
recalled:
  - 《清史稿·诸王传·恭忠亲王奕訢》
  - 《筹办夷务始末》
