name: 脱脱
aliases: [脱脱帖木儿, 托克托]
role: 元朝丞相
summary: 元末丞相，推行“至正更化”，主持修三史、治黄河；围攻高邮时被罢免，后被毒死。
body: |-
  脱脱是蔑儿乞部人，生于延祐元年（公元 1314 年），伯父伯颜是元顺帝初年的权臣。他少年时跟随浙东儒士吴直方读书。伯颜专权跋扈，脱脱担心家族受到牵连，与顺帝密谋，至元六年（1340 年）趁伯颜出城打猎时关闭城门，将其贬逐。

  此后脱脱任中书右丞相，改元至正，恢复伯颜废除的科举，放宽对汉人的限制，史称“至正更化”。他担任辽、金、宋三史的都总裁官，三部史书在至正三年至五年（1343—1345 年）之间修成，对“正统”问题采取三朝各自为正统的办法。他一度辞相，至正九年（1349 年）再次任相。

  至正十一年（1351 年）脱脱采纳贾鲁的方案，征发大批民夫治理黄河，使黄河回到故道，同时变更钞法，发行新钞，造成物价飞涨。同年红巾军起义爆发（另见“红巾军起义”条）。次年他亲自率军攻破徐州，镇压了芝麻李的起义军。

  至正十四年（1354 年）脱脱统率大军南下，围攻据守高邮的张士诚，城将被攻破时，顺帝听信哈麻等人的谗言，下诏削去他的官职，把他贬到淮安，元军随即溃散（另见“高邮之战”条）。此后他又被流放到云南，至正十五年（1355 年）哈麻假传圣旨，派人把他毒死。史家多把脱脱被罢看作元末局势的转折：此后元朝再也没有能力组织大规模的围剿。
sources: []
recalled:
  - 《元史·脱脱传》
  - 《庚申外史》
