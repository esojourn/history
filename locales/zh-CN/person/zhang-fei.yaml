name: 张飞
aliases: [张益德, 西乡侯, 桓侯]
role: 车骑将军
summary: 刘备的主要将领，以勇猛闻名，刘备伐吴前夕在阆中被部下杀害。
body: |-
  据《三国志·蜀书·张飞传》，张飞字益德，涿郡人，生年不详，年轻时与关羽一同跟随刘备，因关羽年长几岁，待之如兄。建安十三年（公元 208 年）刘备在当阳长坂被曹军追上，仓皇南逃，张飞率二十名骑兵断后。本传记他据水断桥，横矛大喝“身是张益德也，可来共决死”，曹军没有人敢靠近，刘备因此得以脱身。

  刘备入蜀后与刘璋反目，张飞随诸葛亮溯江而上，在江州击败并俘获巴郡太守严颜。本传说严颜面无惧色，张飞很敬重他，将他释放并待为宾客。益州平定后，张飞任巴西太守。曹操取得汉中，留张郃等驻守，张郃南下进入巴西，张飞与他相持五十多天，最后率精兵从小路截击，大破其军。

  刘备称汉中王，拜张飞为右将军；称帝后升他为车骑将军，领司隶校尉，封西乡侯。陈寿说关羽善待士卒而轻慢士大夫，张飞敬重君子而不体恤下属。刘备常告诫他刑杀过重，又每天鞭打身边的士兵，这是取祸之道，他没有改。章武元年（221 年）刘备准备东征孙权，张飞应从阆中率军会合，临出发时被部将张达、范强杀死，二人带着他的首级投奔孙权。
sources: []
recalled:
  - 《三国志·蜀书·关张马黄赵传》
