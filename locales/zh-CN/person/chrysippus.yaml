name: 克律西波斯
aliases: [ 索里的克律西波斯 ]
role: 哲学家
summary: 斯多葛学派第三代领袖，把这一学派的学说整理成体系。
body: |-
  奇里乞亚的索里人（一说塔尔苏斯人），父亲名阿波罗尼乌斯。关于他的生平，主要的材料是第欧根尼·拉尔修《名哲言行录》卷七。据该书，他早年练过长跑，到雅典后师从斯多葛学派的克里安提斯，老师去世后继任学派领袖，是继芝诺、克里安提斯之后的第三代。

  他以勤于著述闻名，第欧根尼·拉尔修说他的著作超过七百零五种，其中大量是逻辑学论著；书中还引了一句当时的话：没有克律西波斯，就没有斯多葛学派。这些著作今天只有残篇留存。据阿波罗多罗斯的《编年史》，他死于第 143 届奥林匹亚周期（公元前 208—前 204 年），享年七十三岁。死因书中记了两种说法：一说在宴席上喝了未掺水的酒后发病，一说是看见驴吃无花果，大笑不止而死。
sources:
  - 英文维基百科“Chrysippus”（核对年份） https://en.wikipedia.org/wiki/Chrysippus
recalled:
  - 第欧根尼·拉尔修《名哲言行录》卷七第 179—202 节
