name: 李煜
aliases: [李从嘉, 李重光, 南唐后主, 违命侯]
role: 南唐国主、词人
summary: 南唐最后一位君主，975 年国亡被俘，后期词作抒写亡国之痛，成就极高。
body: |-
  李煜是李璟的第六子，原名从嘉，字重光，昇元元年（公元 937 年）生于金陵。据史书，他的一只眼睛有两个瞳仁。他自幼喜好读书，工诗词，精书画，通音律，无意于政事。他的几个哥哥都早死，太子李弘冀也于 959 年去世，于是被立为太子。建隆二年（961 年）李璟去世，他在金陵继位，史称南唐后主。

  当时南唐已经去掉帝号，向北宋称臣纳贡。李煜即位后继续对宋恭顺，年年进贡大量财物，开宝四年（971 年）宋灭南汉后，他又主动改称“江南国主”，降低礼仪等级。他在国内崇信佛教，生活奢华，前期的词多写宫廷宴乐和与大周后、小周后的爱情生活。大周后精通音律，曾整理《霓裳羽衣曲》，乾德二年（964 年）病逝，李煜后来又娶了她的妹妹小周后。

  开宝七年（974 年），宋太祖以李煜拒绝入朝为由，派曹彬领兵进攻南唐。次年十一月金陵城破，李煜率群臣出降，南唐灭亡。开宝九年（976 年）初他被押到开封，被封为“违命侯”；宋太宗即位后改封陇西郡公。

  在开封的两年多里，他写下了一生中最有名的作品，如《虞美人》（“春花秋月何时了”）、《浪淘沙》（“帘外雨潺潺”）、《相见欢》（“无言独上西楼”）等，抒写故国之思和亡国之痛，语言朴素自然而感情真挚深沉。王国维在《人间词话》里说：“词至李后主而眼界始大，感慨遂深，遂变伶工之词而为士大夫之词。”

  太平兴国三年（978 年）七月七日，李煜在开封去世，年四十二。据宋人笔记，他是因作词怀念故国触怒宋太宗，被赐牵机药毒死的，此说流传很广，但正史没有记载，真伪难以确定。
sources: []
