name: "艾迪夫人"
aliases: ["玛丽·贝克·艾迪"]
role: "基督教科学会的创始人"
summary: "自称靠属灵方法从重伤中痊愈，写成《科学与健康》，创立基督教科学会。"
body: |-
  《历史的轨迹》第四十五章说，在摩门教、安息日会和属灵主义出现之后几十年，又兴起了基督教科学会。1866 年艾迪夫人突然从重伤中痊愈，她过去学过精神与属灵关系之学，此后发展出她的“科学神医体系”。书中认为这个运动既不合圣经，也不合科学。她写了《科学与健康》，成为该会的教科书；1879 年照她的指示在波士顿建立了一间教会，1892 年重组为“基督科学家第一教会”，其他教会都是这间母会的分支，地方上由“诵读者”“从业者”和“教师”分担工作。书中又说，该会创办的《基督教科学箴言报》是全世界最好的报纸之一，而这个团体从不公布信徒人数。

  据一般记载，她本姓贝克，1821 年生于新罕布什尔鲍镇，早年多病，跟过一位叫昆比的精神疗法者；1866 年她在马萨诸塞林恩滑倒受伤后康复，以此为她“发现”的开始。《科学与健康》初版于 1875 年，后来多次修订。《基督教科学箴言报》创刊于 1908 年。她 1910 年在马萨诸塞栗山去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
recalled:
  - "艾迪《科学与健康》（1875 年）"
