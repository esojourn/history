name: 秦九韶
aliases: [秦道古]
role: 数学家
summary: 南宋数学家，著《数书九章》，提出“大衍求一术”和高次方程的数值解法。
body: |-
  秦九韶字道古，生于嘉定元年（公元 1208 年）前后，自称鲁郡人，一般认为出生在普州安岳（今四川安岳），卒年有不同说法。他的父亲在朝廷任职，他少年时随父到临安，曾向太史局的官员学习天文历算，又学过诗词、骑射、营造等。成年后他在四川、湖北、安徽、江苏等地任官，为官的名声不好，宋人笔记对他多有贬词。

  淳祐七年（1247 年）他写成《数书九章》，分大衍、天时、田域、测望、赋役、钱谷、营建、军旅、市易九类。书中的“大衍求一术”系统解决了一次同余式组的求解问题，西方称为“中国剩余定理”；“正负开方术”给出了求高次方程数值解的完整方法。这两项成就在当时世界上都处于领先地位。他晚年被贬到梅州，据说死于任所。
sources: []
recalled:
  - 《数书九章》序
  - 周密《癸辛杂识续集》
