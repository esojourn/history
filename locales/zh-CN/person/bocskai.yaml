name: "博奇考伊"
aliases: ["博奇考伊·伊什特万", "波士开"]
role: "特兰西瓦尼亚亲王"
summary: "匈牙利贵族，1604 年起兵反抗哈布斯堡，迫使皇帝承认新教信仰自由。"
body: |-
  博奇考伊 1557 年生于特兰西瓦尼亚的科洛斯堡，出身匈牙利大贵族，信奉改革宗。他早年在哈布斯堡宫廷待过，后来在特兰西瓦尼亚做军事统帅。

  《历史的轨迹》第三十九章说，匈牙利在加尔文时代已热诚接受了改革宗，1567 年采纳《瑞士信条》（即《第二瑞士信条》）；哈布斯堡家的鲁道夫决定镇压时，匈牙利人在博奇考伊领导下举兵起义。据一般记载，起义始于 1604 年，他的兵力以被称为“海杜克”的自由兵为主，1605 年被推为特兰西瓦尼亚亲王和匈牙利亲王。

  该书说，他们的胜利迫使鲁道夫签署了维也纳和约，匈牙利获得宗教自由；和约是 1606 年 6 月由鲁道夫的弟弟马提亚斯代表签订的。他同年年底在考绍去世，有人疑为被毒杀。该书说，因此他的像被刻在日内瓦的宗教改革纪念墙上，永久纪念。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
recalled:
  - "《维也纳和约》（1606 年）"
