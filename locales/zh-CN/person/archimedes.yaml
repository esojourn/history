name: 阿基米德
aliases: []
role: 数学家、工程师
summary: 叙拉古人。奠定杠杆与浮力的原理；城破时被罗马士兵所杀。
body: |-
  西西里岛叙拉古人。他在《数沙者》中提到父亲菲迪亚斯是天文学家。生年没有同时代的记载，拜占庭作家策策斯说他活了七十五岁，由此上推约为公元前 287 年。他的著作多以书信形式寄给亚历山大的学者科农、多西修斯和埃拉托色尼；他本人是否到过亚历山大，史料没有明说。

  传世著作有《圆的度量》《论球与圆柱》《论平面图形的平衡》《论浮体》《方法》等。他证明圆周率介于三又七十一分之十与三又七分之一之间，求出球的体积与表面积，论证了杠杆的平衡条件和浮力的原理。他为叙拉古王希耶隆鉴定金冠、跑出浴室高喊“尤里卡”的故事，出自两百年后维特鲁威的《建筑十书》；“给我一个立足之处，我就能移动大地”一语，见于更晚的帕普斯，普鲁塔克也记有类似的话。

  罗马围攻叙拉古时，据波利比乌斯，他设计的投石机械和能把战船船头吊起的铁爪使罗马人放弃了强攻。约前 212 年城破，他被一名罗马士兵所杀。李维说他当时正专心于画在沙土上的图形，士兵不知道他是谁；普鲁塔克则并列了三种不同的说法。据西塞罗，他的墓碑上刻着球和圆柱，西塞罗在西西里任财务官时找到了这座已被荒草遮没的墓。
sources:
  - 波利比乌斯《历史》卷八第 3—7 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/8*.html
  - 普鲁塔克《马塞卢斯传》第 14—19 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Marcellus*.html
  - 英文维基百科“Archimedes”（核对年份与著作） https://en.wikipedia.org/wiki/Archimedes
