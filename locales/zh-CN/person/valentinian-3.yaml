name: 瓦伦提尼安三世
aliases: [瓦伦丁尼安三世, 华伦提年三世]
role: 西罗马皇帝
summary: 加拉·普拉西提阿之子，在位三十年，亲手杀死埃提乌斯，次年遇刺。
body: |-
  瓦伦提尼安三世于公元 419 年 7 月 2 日生在拉文纳，父亲是做过几个月皇帝的君士坦提乌斯三世，母亲是加拉·普拉西提阿。423 年舅舅霍诺里乌斯去世时，他随母亲在君士坦丁堡。表兄狄奥多西二世派兵送他们回意大利，425 年 10 月他在罗马即位，时年六岁，由母亲摄政。437 年他到君士坦丁堡娶了狄奥多西二世的女儿欧多克西娅。

  他在位三十年，军权始终在埃提乌斯手里。汪达尔人 429 年渡海到北非，439 年夺取迦太基，442 年朝廷订约承认；不列颠已经放弃，高卢和西班牙大半在各蛮族王国手中。445 年他颁布敕令，确认罗马主教对西部各地教会的管辖权。450 年他的姐姐霍诺里娅私下向阿提拉求助，给了阿提拉索要一半国土的借口。

  454 年 9 月，他在宫里亲手杀死埃提乌斯。455 年 3 月 16 日，他在罗马城外的战神原野看士兵操练，被埃提乌斯的两名旧部刺死，主使者是元老佩特罗尼乌斯·马克西穆斯。狄奥多西家族在西部的统治到此为止。
sources: []
