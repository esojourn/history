name: 李广
aliases: [飞将军]
role: 将军
summary: 西汉名将，历任边郡太守，匈奴称为“飞将军”，一生未得封侯，漠北之战后自杀。
body: |-
  据《史记·李将军列传》，李广是陇西成纪人，先祖李信是秦国的将军，家中世代习射。汉文帝十四年（公元前 166 年）匈奴大举入萧关，他以良家子从军，因善于骑射、斩获较多而任中郎。列传记文帝曾感叹他生不逢时，说若在高帝的时代，封万户侯也不在话下。

  景帝时他随周亚夫平定七国之乱，在昌邑城下夺得敌军军旗，但因私下接受梁王授予的将军印，回朝后没有得到封赏。此后他先后任上谷、上郡、陇西、北地、雁门、代郡、云中等边郡的太守，都以力战闻名。

  武帝时他调任未央宫卫尉。元光六年（前 129 年）他率军出雁门，兵败被俘，在押送途中夺了匈奴人的马逃回，按律当斩，赎为平民。几年后他被起用为右北平太守，列传说匈奴称他为“汉之飞将军”，好几年不敢进犯右北平。列传还记他出猎时把草中的石头当作老虎，一箭射去，箭头没入石中。元狩二年（前 121 年）他与张骞出右北平，被匈奴左贤王的大军包围，苦战两日，等到援军才得脱身，功过相抵。

  元狩四年（前 119 年）漠北之战，他已年过六十，再三请求后被任为前将军。出塞后卫青把他调往东路，这一路因没有向导而迷失道路，未能赶上与单于的会战。大将军幕府派人追究责任，他说自己与匈奴大小七十余战，如今不愿再面对刀笔之吏，于是拔刀自刎。司马迁在传末引用谚语“桃李不言，下自成蹊”来评价他。
sources: []
recalled:
  - 《史记·李将军列传》
  - 《汉书·李广苏建传》
