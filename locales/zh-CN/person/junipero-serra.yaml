name: "胡尼佩罗·塞拉"
aliases: ["塞拉神父", "西拉神父"]
role: "方济各会传教士，加利福尼亚传教站的创建者"
summary: "1769 年随西班牙人到圣迭戈，在加利福尼亚沿海建起一串传教站。"
body: |-
  《历史的轨迹》第四十一章说，1542 年西班牙已从墨西哥派远征队探查加利福尼亚海岸，但直到 1769 年才有四队人前往殖民。他们先到圣迭戈，领袖是塞拉神父。此后十五年中他设立了九个传教站，后来一共设立了二十一个，分布在圣迭戈与旧金山之间。神父们劝印第安人住进传教站，不但把基督教传给他们，也教他们农事和畜牧。

  据一般记载，塞拉 1713 年生于西班牙马略卡岛的佩特拉，入方济各会，在帕尔马教过哲学和神学，1749 年到墨西哥，在山区印第安人中工作多年。1769 年他随波托拉的远征队北上，在圣迭戈建立第一个传教站，次年在蒙特雷建第二个，后迁到卡梅尔，以此为总部；他 1784 年在卡梅尔去世时，亲手建立的有九个，其余十二个是继任者陆续建立的，与书中的说法相合。传教站制度后来受到批评，因为印第安人在站内被管束、劳役，又受欧洲疾病侵袭，人口大减；2015 年天主教会封他为圣人，当时也引起争议。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十一章“教会进入新大陆” https://wellsofgrace.com/books/spiritual/2000years/html/chapter46.html"
