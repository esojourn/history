name: 瓦勒度
aliases:
  - 彼得·瓦勒度
  - 瓦尔多
  - 瓦尔德斯
role: 里昂穷人派的创始人
summary: 里昂的富商，约 1176 年散尽家产，带门徒用方言传讲圣经，跟随者称瓦勒度派。
body: |-
  瓦勒度是法国里昂的富商，生年和出生地都没有记载。同时代的文献只叫他“瓦尔德斯”，“彼得”这个名字是一百多年后才加上的。

  据当时的编年史，他约在 1173 至 1176 年间听了一位圣徒舍弃家产的故事，去请教神学教师，对方用耶稣的话回答他：“你若愿意作完全人，可去变卖你所有的，分给穷人。”他把一部分财产留给妻子，安顿了女儿，其余的散给穷人，又出钱请两位教士把福音书和圣经的其他部分译成当地的方言。《历史的轨迹》第二十章说，他相信圣经尤其是新约是基督徒生活信仰的准则；他和门徒把大部分新约背下来，穿着简单的衣服，赤着脚，两个两个地出去传道。这些人被称为“里昂的穷人”。

  1179 年他们到罗马参加第三次拉特兰会议，请求准许讲道。教皇亚历山大三世称许他们甘守贫穷，但规定非经当地教士邀请不得讲道。瓦勒度表示自己的信仰与教会一致，却不肯停止讲道，理由是顺从神不顺从人是应当的。约在 1182 年里昂大主教把他们逐出城，1184 年教皇卢修斯三世在维罗纳把他们与迦他利派等一并列为异端。

  《历史的轨迹》列举他们的做法：每星期一、三、五禁食，不起誓，不打仗，祷告只用主祷文，不信炼狱，不接受为死人祷告和弥撒，认为在家里或马厩里祷告与在教堂里一样有效，平信徒不分男女都可以讲道。该书强调，他们与持二元论的亚尔比根派不同，并不与教会的信仰为敌。

  瓦勒度本人后来的行踪不详，约在 1205 年前后去世，地点不明。他的跟随者传到伦巴第、普罗旺斯、德意志和波希米亚，屡遭宗教裁判所追捕，一部分人退入阿尔卑斯山的深谷，宗教改革时接受了改教的信仰，留存至今。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 《拉昂无名氏编年史》1173 年条
  - 沃尔特·马普《宫廷琐闻》卷 1 第 31 章
  - 波旁的司提反《论圣灵七恩》
