name: "查理·卫斯理"
aliases: ["卫斯理查理"]
role: "循道派圣诗作家"
summary: "约翰·卫斯理之弟，牛津“圣洁会”的发起人，一生写了数千首圣诗。"
body: |-
  查理·卫斯理 1707 年生于爱普沃斯，是撒母耳·卫斯理第十八个孩子。《历史的轨迹》第三十六章说，他比哥哥约翰晚六年进牛津基督教会学院。约翰不在牛津时，查理和另外两位同学组织了一个互相切磋的社团，读有益灵命的书；1729 年约翰回来后做了领袖。这就是后来被讥为“圣洁会”“循道派”的那个团体，所以循道运动的源头可以说是查理开始的。怀特菲尔德也是经他介绍入会的。

  1735 年他随约翰去佐治亚，做奥格尔索普总督的秘书。该书说两兄弟勤奋工作，但缺乏策略，又勉强信徒守严格的规条，结果一败涂地；查理病倒，到达当年就回了英国。

  该书说，1738 年 5 月 21 日查理在一场大病中悔改归正，比约翰早三天。此后他也做过几年巡回讲道，娶了一位富家女子，她常陪他骑马到各地，在聚会中领唱。

  作者说查理是循道派的圣诗作家，一共写了数千首圣诗（一般统计约六千首），许多至今仍为所有说英语的教会所用，如《天使歌唱在高天》《哦，愿我有千万舌》《耶稣，我心爱的良人》。他身体不如约翰强壮，1756 年以后很少出外旅行，先在布里斯托尔，1771 至 1788 年在伦敦工作，直到去世。他始终比哥哥更坚持留在英国国教之内，对约翰 1784 年自行按立牧师很不以为然。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十六章“循道派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter40.html"
recalled:
  - "查理·卫斯理《日记》"
