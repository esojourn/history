name: 提多
aliases:
  - 提图斯
  - 提图斯·弗拉维乌斯·韦斯巴芗
role: 罗马皇帝
summary: 韦斯巴芗长子，公元 70 年攻陷耶路撒冷，79 年继位为罗马皇帝。
body: |-
  公元 39 年生于罗马，是韦斯巴芗的长子。他与新约《提多书》的收信人、保罗的同工提多不是同一个人。据苏维托尼乌斯《罗马十二帝王传》，他年轻时在日耳曼和不列颠任军事保民官。公元 66 年犹太人起事，尼禄派韦斯巴芗前往平定，提多率一个军团随父亲作战，67 年参加了加利利的战事。

  69 年韦斯巴芗被军队拥立为皇帝，把犹太的战事交给提多。70 年春，提多率军围攻耶路撒冷，当年夏天圣殿被焚，随后全城陷落；这次围城的经过主要见于随军的约瑟夫斯所著《犹太战记》。71 年他回到罗马，与父亲一同举行凯旋式。罗马广场旁的提多凯旋门是他死后所建，浮雕上刻着士兵抬着圣殿的金灯台等器物。韦斯巴芗在位期间，提多担任近卫军长官，实际参与执政。

  79 年 6 月韦斯巴芗去世，提多继位。同年维苏威火山喷发，庞贝和赫库兰尼姆被掩埋；80 年罗马城又遭大火。他在位时，父亲动工兴建的圆形剧场（后世称斗兽场）落成启用。81 年 9 月他病逝于萨宾地区的库提利亚温泉，在位两年多，由弟弟图密善继位。
sources: []
recalled:
  - 苏维托尼乌斯《罗马十二帝王传·提图斯传》
  - 约瑟夫斯《犹太战记》卷 3—7
  - 卡西乌斯·狄奥《罗马史》卷 66
