name: "萨克森的莫里茨"
aliases: ["莫里茨", "摩里斯", "萨克森选侯莫里茨"]
role: "萨克森公爵、选侯"
summary: "信路德宗的萨克森公爵，先助查理五世打败新教诸侯，1552 年倒戈，迫使皇帝议和。"
body: |-
  莫里茨 1521 年 3 月生于萨克森的弗赖贝格，属韦廷家族的阿尔布雷希特一支；选侯的头衔在另一支手里，就是保护过路德的那一家。他父亲在自己的领地推行了路德宗，1541 年他继位为公爵，娶了新教领袖黑森伯爵腓力的女儿。

  1546 年皇帝查理五世对新教诸侯的施马尔卡尔登同盟开战。莫里茨虽信路德宗，却与皇帝密约，出兵攻入堂兄萨克森选侯的领地。次年皇帝在米尔贝格获胜，俘虏了选侯，把选侯的头衔和维滕贝格一带的土地转给莫里茨。新教徒骂他是“迈森的犹大”。《历史的轨迹》第三十章说他原是皇帝最强的支持者之一。

  皇帝得胜后长期扣押他的岳父，又要在帝国全境推行偏向旧教的临时办法，诸侯对皇帝权势过大都感不安。莫里茨奉命围攻不肯屈服的马格德堡，却借机保留军队，1552 年初与法国国王订约，用帝国西部的三座主教城换取法国的津贴，随即挥兵南下。皇帝在因斯布鲁克毫无防备，冒着风雨连夜翻山逃走。该书说莫里茨本可以捉住皇帝却放他逃脱，引他的话说：我没有一个够好的笼子，可以关这样一只鸟。这句话是流传的说法。

  同年 8 月他与皇帝的弟弟斐迪南订立《帕绍条约》，释放被俘的诸侯，暂许路德派自由，三年后的《奥格斯堡和约》即以此为底本。1553 年 7 月他在西弗斯豪森与一个四处劫掠的诸侯作战，得胜而身负枪伤，两天后去世，年三十二岁。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
recalled:
  - "1547 年《维滕贝格降约》"
  - "1552 年《尚博尔条约》《帕绍条约》"
  - "斯莱丹《查理五世时代宗教与国家纪事》"
