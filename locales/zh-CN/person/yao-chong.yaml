name: 姚崇
aliases: [姚元崇, 姚元之, 梁国公]
role: 宰相
summary: 武则天、睿宗、玄宗三朝宰相，开元初年辅佐玄宗整顿朝政，与宋璟并称“姚宋”。
body: |-
  姚崇本名元崇，字元之，陕州硖石人，后因避开元年号，改名姚崇。他早年以挽郎入仕，武则天时任夏官郎中，处理契丹起兵时的军务文书条理分明，受到赏识，圣历元年（公元 698 年）升为宰相。神龙元年（705 年）他参与了诛杀张易之兄弟的政变，但武则天迁居上阳宫时，他流泪呜咽，因此被贬出京城。睿宗复位后他再次入相，与宋璟一起革除中宗时滥授的“斜封官”，又请求让太平公主迁居东都，触怒太平公主，被贬为刺史。

  开元元年（713 年）十月，玄宗在骊山讲武，召见他商议政事，随即任命他为宰相。据《新唐书》本传，他在受任前提出十条建议，要求玄宗施行仁政、不贪边功、宦官不得干政、不许贵戚任职、远离佞人、纳谏等，玄宗全部同意，后世称“十事要说”；但这一段记载不见于《旧唐书》和《资治通鉴》，有学者怀疑其真实性。

  他为相期间办事干练，裁汰冗官，抑制滥度僧尼，据《资治通鉴》，他奏请淘汰的伪滥僧尼有一万二千多人。开元四年（716 年）山东发生蝗灾，当时不少人认为蝗灾是天降灾异，只能修德禳灾，他力主组织百姓扑打焚埋，蝗灾因此减轻。

  同年年底，他的儿子和亲信官员受贿，他受牵连罢相，推荐宋璟接替自己。开元九年（721 年）他去世，年七十二。据记载，他在遗嘱中告诫子孙不要抄经造像、为他做佛事，丧事从简。后世把他和宋璟并称为“姚宋”，与贞观时的“房杜”相提并论。
sources: []
recalled:
  - 《旧唐书·姚崇传》
  - 《新唐书·姚崇传》
  - 《资治通鉴》卷二百六至二百一十二
