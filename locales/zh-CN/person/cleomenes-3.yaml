name: 克列奥美涅斯三世
aliases: [克里昂米尼三世]
role: 斯巴达国王
summary: 斯巴达国王，废监察官、重分土地，在塞拉西亚败于马其顿后流亡埃及。
body: |-
  斯巴达阿吉亚德王室的国王，列奥尼达二世之子，约生于公元前 260 年。他父亲处死改革的国王阿吉斯四世后，让他娶了阿吉斯的遗孀阿吉阿提斯，普鲁塔克说他从妻子那里了解了阿吉斯的主张。他还听过斯多亚派哲学家斯法埃鲁斯讲学。前 235 年他继位。

  前 229 年起，斯巴达与阿拉托斯领导的亚该亚同盟争夺阿卡迪亚的城镇，他在吕凯翁山和拉多凯亚接连取胜。前 227 年他把公民兵留在外地，带雇佣军回到斯巴达，杀死五名监察官中的四人，流放八十名反对者，宣布废除监察官。然后他推行阿吉斯未能做成的事：取消债务，重分土地，从边民中补充公民，使重装步兵达到四千人，并改用马其顿式的长矛；恢复公共食堂和青年训练。他立自己的兄弟为另一位国王，斯巴达的双王从此出自一家。

  此后两年他大败亚该亚同盟，阿尔戈斯、科林斯等许多城市倒向他，各地的贫民盼着他带来销债分地。亚该亚同盟濒于瓦解，阿拉托斯转而向宿敌马其顿求援，答应把科林斯卫城交还。前 224 年马其顿国王安提柯三世率大军南下，斯巴达的盟友纷纷离去。为筹措军费，克列奥美涅斯让黑劳士以五明那的价钱赎身，据普鲁塔克得了五百塔兰特；前 223 年他突袭攻破麦加洛波利斯，把城毁掉。

  前 222 年夏，他在斯巴达以北的塞拉西亚据守两座山头，迎战安提柯三世和亚该亚人的联军，兵力处于劣势，战败，斯巴达军几乎全部战死。他回到城中，劝公民接纳安提柯，自己连夜乘船去了埃及。托勒密三世待他不错，答应助他复国，但不久去世。继位的托勒密四世和权臣索西比乌斯对他起了疑心，把他软禁在亚历山大城。前 219 年他和十几名同伴冲出住所，上街号召市民争取自由，没有人响应，他们便一起自杀了。
sources: []
recalled:
  - 普鲁塔克《克列奥美涅斯传》
  - 波利比乌斯《历史》卷二第 45—70 章、卷五第 35—39 章
