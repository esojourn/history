name: 瓦卢斯
aliases: [普布利乌斯·昆克提利乌斯·瓦卢斯, 瓦鲁斯]
role: 罗马将领、总督
summary: 罗马总督，公元 9 年在条顿堡森林兵败自杀，三个军团全军覆没。
body: |-
  瓦卢斯出身罗马贵族，约生于公元前 46 年。前 13 年他与提比略同任执政官，先后娶阿格里帕的女儿和奥古斯都的甥孙女，与皇室是姻亲。他做过阿非利加总督，前 7 年前后起任叙利亚总督；前 4 年大希律死后犹太各地起事，他带兵南下镇压，约瑟夫斯说他把两千人钉了十字架。

  公元 7 年前后，他受命统辖莱茵河以东新占的日耳曼地区。古代作家说他把那里当作已经驯服的行省，征税、开庭审案。公元 9 年秋，他听信切鲁西人阿米尼乌斯的话，带三个军团离开大路，在条顿堡森林中伏，苦战几天后自杀，全军覆没。

  苏维托尼乌斯记，奥古斯都得到消息后几个月不剃须发，有时用头撞门，喊道：“瓦卢斯，把军团还给我！”这三个军团的番号十七、十八、十九此后不再使用。同时代的维莱伊乌斯对他评价很低，这类记载都带有事后归罪的成分。
sources: []
recalled:
  - 维莱伊乌斯·帕特尔库鲁斯《罗马史》卷 2 第 117—120 章
  - 卡西乌斯·狄奥《罗马史》卷 56 第 18—22 章
  - 苏维托尼乌斯《罗马十二帝王传·奥古斯都传》第 23 章
  - 约瑟夫斯《犹太古史》卷 17
