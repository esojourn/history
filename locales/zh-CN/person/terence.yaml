name: 泰伦提乌斯
aliases: [泰伦斯, 普布利乌斯·泰伦提乌斯·阿非尔, 特伦斯]
role: 罗马喜剧作家
summary: 罗马喜剧作家，生于迦太基，原为奴隶，传世喜剧六部，以文辞纯净著称。
body: |-
  普布利乌斯·泰伦提乌斯·阿非尔，罗马喜剧作家。生平主要见于苏维托尼乌斯所写、由多纳图斯保存的一篇小传。据小传，他生于迦太基，被带到罗马做元老泰伦提乌斯·卢卡努斯的奴隶；主人赏识他的才貌，让他受教育，不久释放了他，他由此得到主人的族名。“阿非尔”意为“阿非利加人”，他是迦太基人还是利比亚的柏柏尔人，无从确定。生年有公元前 195 年和前 185 年两说。

  他与小西庇阿、莱利乌斯等年轻贵族交往密切。当时就有人说，他的剧本其实是这些贵族朋友写的；他在《两兄弟》的开场白里提到这种传言，没有明确否认，只说受到大人物赏识是一种荣耀。

  他一共写了六部喜剧，在前 166 年至前 160 年间上演，全部流传至今：《安德罗斯女子》《婆母》《自责者》《阉奴》《福尔弥昂》《两兄弟》，其中四部改编自米南德。与普劳图斯相比，他较少滑稽打闹，注重人物心理和语言的纯净；开场白不介绍剧情，而用来回应同行的指责，特别是把两部希腊原作糅成一部的做法。《婆母》头两次上演都半途而废，一次是因为观众跑去看走绳索和拳击。《自责者》里有一句常被引用的台词：“我是人，凡是人的事我都不觉得与我无关。”

  前 160 年之后他去了希腊，再没有回来；据小传，他在前 159 年去世，有的说死于海难，有的说病死在阿卡狄亚。他的剧本在古代晚期和中世纪一直是学校里的拉丁文读本。
sources: []
recalled:
