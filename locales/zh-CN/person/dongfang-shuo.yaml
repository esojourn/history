name: 东方朔
aliases: [东方曼倩]
role: 太中大夫
summary: 汉武帝的侍从文臣，以言辞诙谐、善于讽谏著称，作有《答客难》。
body: |-
  据《汉书·东方朔传》，东方朔字曼倩，平原郡厌次县人，生卒年不详。武帝即位之初征召天下有才能的人，他上书自荐，自称学过诗书和兵法，言辞很是夸张；武帝觉得他不同寻常，让他在公车署待诏，后来升为常侍郎，又任太中大夫、给事中。

  本传记载了他不少诙谐的言行，如用恐吓宫中侏儒的办法求得召见，在宫中受赐肉时不等诏令自己割肉回家等。他也曾直言进谏：武帝要扩建上林苑，他上书陈述侵占民田的害处；武帝的姑母馆陶公主的宠臣董偃得幸入宫，他持戟拦阻，指其有罪。不过武帝始终把他当作俳优一类的人，没有委以政事。

  他晚年上书谈农战强国之计，不被采用，于是假设有客人质问他为何官位不高，作《答客难》自我解嘲，又写了《非有先生论》。班固说，后世好事的人把许多奇言怪语都附会到他名下，本传所记以外的故事不可信。
sources: []
recalled:
  - 《汉书·东方朔传》
  - 《史记·滑稽列传》（褚少孙补）
