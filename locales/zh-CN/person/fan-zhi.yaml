name: 范质
aliases: [范文素]
role: 后周宰相
summary: 后周宰相，周世宗临终受命辅政；陈桥兵变后被迫拥立赵匡胤，宋初仍任宰相。
body: |-
  范质是大名宗城人，字文素，后唐时考中进士。后晋时他任翰林学士，以文章见长。郭威起兵入开封时，据史书，郭威在兵乱中找到他，见他从容有学识，十分器重，后周建立后便任他为宰相。

  显德六年（公元 959 年）周世宗病危，命范质等人辅佐年仅七岁的柴宗训。次年正月，赵匡胤在陈桥兵变后回到开封，范质等宰相被带到他面前，事已至此，只得下拜，接受了禅让的安排（另见“陈桥兵变”条）。

  北宋建立后，范质仍任宰相，乾德二年（964 年）罢相，同年去世。他为官清廉，据史书，他死时家无余财。宋人对他的评价是，他才能和品行都可称道，只可惜没有为后周殉节。
sources: []
recalled:
  - 《宋史·范质传》
  - 《资治通鉴》卷二百八十九至二百九十四
