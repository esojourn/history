name: 子路
aliases: [仲由, 季路]
role: 孔子弟子
summary: 孔子弟子，性情刚直勇武，长期追随孔子，后在卫国内乱中战死，临死前结好冠缨。
body: |-
  子路名仲由，字子路，又字季路，鲁国卞人。据《史记·仲尼弟子列传》，他比孔子小九岁，即生于公元前 542 年，是孔子早期的弟子之一。他年轻时好勇斗狠，曾对孔子无礼，孔子以礼慢慢引导他，他才穿上儒服，委托门人请为弟子。

  子路性格直率，常当面批评孔子，孔子也常批评他鲁莽。他在孔门四科中列于“政事”，曾任鲁国季氏的家宰，参与了拆除三家城邑的行动。他随孔子周游列国，始终追随左右。孔子说：“道不行，乘桴浮于海，从我者其由与？”

  子路后来任卫国大夫孔悝的邑宰。公元前 480 年卫国发生蒯聩夺位之乱，孔悝被劫持，子路闻讯赶去救援，与蒯聩的武士搏斗，冠缨被砍断。据《左传》哀公十五年，子路说“君子死，冠不免”，结好冠缨而死。孔子听说卫乱时就预料子路会死。
sources: []
recalled:
  - 《史记·仲尼弟子列传》
  - 《左传》哀公十五年
  - 《论语·公冶长》
