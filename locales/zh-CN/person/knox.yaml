name: "诺克斯"
aliases: ["约翰·诺克斯", "约翰·诺克司"]
role: "苏格兰的改教家"
summary: "苏格兰改教家，受教于加尔文，1560 年使苏格兰改行长老制的新教。"
body: |-
  诺克斯生于苏格兰东洛锡安的哈丁顿。《历史的轨迹》第二十七章说他生于 1505 至 1515 年间；旧说是 1505 年，现在学者多取 1514 年前后。他读过大学，受立为司铎，做过公证人和家庭教师。1545 年他跟随布道家威沙特，次年威沙特被圣安德鲁斯的枢机比顿烧死，不久比顿遇刺，行刺的人占据了圣安德鲁斯城堡，诺克斯带着学生进去避难，被众人推举讲道。

  1547 年 7 月法国舰队攻下城堡，他被俘。该书说他在战船上做了十九个月的苦工；他是被锁在桨座上划船。1549 年获释后他到英格兰，在边境的贝里克、纽卡斯尔讲道，后来做了爱德华六世的宫廷牧师，参与审阅克兰麦的《四十二信条》，并对公祷书中跪领圣餐的规定提出异议。1553 年玛丽即位，他逃往欧洲大陆，在日内瓦牧养英国难民教会。他称加尔文的日内瓦是使徒时代以来世上最完美的基督学校。

  1555 年秋他回苏格兰住了几个月，在贵族家中讲道。1557 年底一批贵族立约，誓言维护神的道。1559 年 5 月 2 日他回到苏格兰，几天后在珀斯讲道斥责偶像崇拜，会后民众捣毁了城里的修道院，摄政太后吉斯的玛丽与新教贵族开战。英格兰出兵相助，1560 年太后去世，法军撤走。

  同年 8 月苏格兰议会废除教皇的权柄，禁止弥撒，采纳了诺克斯等六人在四天内写成的《苏格兰信条》。年底召开第一次全国大会，提出《教会管理法规第一集》，要在全国每个堂区设牧师、长老和学校；贵族不肯把旧教会的产业全交出来，这份法规没有得到议会批准。

  1561 年女王玛丽从法国回来，在宫里做弥撒，诺克斯在爱丁堡圣吉尔斯教堂的讲台上抨击，女王几次召他去辩论。1567 年玛丽被迫退位。该书说到 1570 年长老教会已稳固建立，两年后的 11 月 24 日诺克斯在爱丁堡去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十七章“苏格兰教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter30.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十八章“英国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter31.html"
