name: 安提柯二世
aliases: [安提柯·戈纳塔斯]
role: 马其顿国王
summary: 围城者德米特里之子，击败高卢人后取得马其顿王位，安提柯王朝由他稳固下来。
body: |-
  德米特里一世与安提帕特之女菲拉的儿子，约生于公元前 319 年。绰号“戈纳塔斯”的含义不明。前 287 年父亲渡海去亚洲，把在希腊的城池和驻军留给他；父亲被塞琉古俘虏后，他曾表示愿意用自己和所有据点去交换。此后十年他只有一支舰队和德米特里阿斯、卡尔基斯、科林斯等几处要塞。

  前 279 年高卢人南侵，马其顿无主。前 277 年他在色雷斯半岛的利西马基亚附近设伏，击溃一支高卢军，凭这场胜利进入马其顿称王。前 274 年皮洛士从意大利回来，把他赶出大部分国土；前 272 年皮洛士在阿尔戈斯死于巷战，他才重新坐稳王位。

  约前 267 年，雅典人克瑞摩尼德斯提议与斯巴达结盟，在托勒密二世支持下反抗马其顿，是为克瑞摩尼德斯战争。斯巴达国王阿瑞乌斯在科林斯附近战死，托勒密的舰队未能解围，雅典约在前 262 年或前 261 年因饥饿投降，城内重新驻进马其顿军。他在科斯岛外海击败过托勒密的舰队，年代不能确定。前 243 年亚该亚同盟的阿拉托斯夜袭夺取科林斯的卫城，这是他晚年最大的损失；此后他与埃托利亚人联手对付亚该亚同盟。

  他年轻时在雅典听过斯多亚派创始人芝诺讲学，即位后请芝诺到宫廷，芝诺派弟子珀尔赛奥斯代往。诗人阿拉托斯（写《现象》的那一位，不是亚该亚的将军）、史家希罗尼穆斯都在他的宫中。据埃利安，他对儿子说过，王权是一种光荣的奴役。前 239 年他去世，年约八十，在位近四十年，其子德米特里二世继位。
sources: []
