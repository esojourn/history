name: 李靖
aliases: [李药师, 卫国公]
role: 大将
summary: 唐初名将，灭萧铣、平辅公祏，630 年率军攻灭东突厥，后又击败吐谷浑。
body: |-
  李靖字药师，京兆三原人。据《旧唐书》本传，他的舅舅韩擒虎常与他谈论兵法，称赞说能和自己讨论孙吴之术的只有这个外甥。隋末他任马邑郡丞。据本传，他察觉太原留守李渊有起兵的意图，想赴江都向炀帝告发，因道路阻塞没有成行；李渊攻克长安后要杀他，他大声抗辩，李世民为他求情，才得以免死，此后归附唐朝。

  武德四年（公元 621 年），他协助赵郡王李孝恭率军沿长江东下，攻灭了据守江陵的萧铣。武德七年（624 年）他又随李孝恭平定江淮的辅公祏。贞观三年（629 年）冬，唐朝大举进攻东突厥，李靖任定襄道行军总管。次年正月，他率三千骑兵从马邑出发，夜袭定襄，颉利可汗惊走；二月他又在阴山附近突袭颉利的牙帐，大破突厥，颉利不久被擒，东突厥灭亡（另见“唐灭东突厥”条）。

  贞观九年（635 年），年过六十的李靖又率军出征吐谷浑，深入青海以西，迫使吐谷浑归附。此后他闭门谢客，不再领兵。他封卫国公，在凌烟阁二十四功臣之列。贞观二十三年（649 年）他去世，年七十九。后世流传的兵书《唐太宗李卫公问对》托名于他和太宗的问答，一般认为是后人所作。
sources: []
recalled:
