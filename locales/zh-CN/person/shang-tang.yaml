name: 商汤
aliases: [成汤, 天乙, 大乙, 武汤]
role: 商朝的开创者
summary: 商朝的开创者，任用伊尹，在鸣条打败夏桀，约在前 1600 年。
body: |-
  商汤是商族的首领，名天乙，甲骨卜辞中称“大乙”“唐”。据《史记·殷本纪》，商人的始祖契曾佐禹治水，受封于商，从契到汤共十四代，其间屡次迁徙，到汤时居于亳。汤的生卒年不详，以下事迹都出自后世古书。

  据《史记》，汤出行时看见有人四面张网捕鸟，祷告说天下四方的鸟都入我网中；汤说“嘻，尽之矣”，让他撤去三面。诸侯听说后，都说“汤德至矣，及禽兽”。这就是成语“网开一面”（原作“网开三面”）的出处。汤起初征伐不祭祀的葛伯，此后又讨伐韦、顾、昆吾等夏的与国，任用伊尹为相。

  夏桀暴虐，汤一度被桀召去囚禁于夏台，获释后起兵伐夏。誓师之辞就是《尚书·汤誓》。双方战于鸣条，桀战败逃走，被放逐而死，汤即天子位，建立商朝。孟子说汤“十一征而无敌于天下”。后世把汤伐桀与武王伐纣并称为“汤武革命”，“革命”一词出自《周易·革卦》的彖辞。

  据《史记》，汤死后，太子太丁早死，先后立外丙、中壬，然后立太丁之子太甲。夏商周断代工程把商朝的开始定在约公元前 1600 年，这只是一个估计，并非确切纪年。

  甲骨卜辞中商王祭祀大乙的记录很多，说明他在商代就被尊为开国之君。
sources: []
recalled:
  - 《史记·殷本纪》
  - 《尚书·汤誓》
  - 《孟子·滕文公下》
  - 《周易·革卦》
