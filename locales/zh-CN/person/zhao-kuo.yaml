name: 赵括
aliases: [马服子]
role: 赵国将军
summary: 赵奢之子，长平之战代廉颇为将，被白起围歼，赵军四十余万投降。
body: |-
  赵括是赵国名将马服君赵奢的儿子，生年不详。据《史记·廉颇蔺相如列传》，他从小学习兵法，谈论军事时连父亲也难不倒他，但赵奢并不认为他会用兵，说打仗是生死攸关的事，赵括却说得那样轻巧，将来赵国若用他为将，必定败军。后世把这种只会空谈的人称为“纸上谈兵”。

  公元前 260 年，秦赵两军在长平对峙，廉颇坚守不出。秦国派人散布流言，说秦军只怕马服君之子赵括为将。赵孝成王于是以赵括代替廉颇，蔺相如劝阻无效。赵括的母亲也上书说赵括不能为将，赵王不听，她便请求日后赵括若有不称职之处，不要连坐她的家人，赵王答应了。

  赵括到任后改变廉颇的部署，撤换将领，主动出击。秦国暗中以白起为上将军，白起佯装败退，切断赵军的粮道，把赵军分割包围。赵军断粮四十六天，“阴相杀食”，赵括亲率精兵突围，被秦军射死。赵军四十余万人投降，据《史记》几乎全部被白起坑杀。

  据《史记》，赵括的母亲上书说，赵奢为将时把所得的赏赐都分给军吏士大夫，受命之日便不再过问家事；赵括一做将军，就把赐金藏在家里，天天察看哪里有便宜的田宅可买。赵王仍不改主意。战后赵王守约，没有连坐赵括的家人。
sources: []
recalled:
  - 《史记·廉颇蔺相如列传》
  - 《史记·白起王翦列传》
