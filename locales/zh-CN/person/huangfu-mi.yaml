name: 皇甫谧
aliases: [皇甫士安, 玄晏先生]
role: 学者、医学家
summary: 魏晋学者，终身不仕，撰有现存最早的针灸专著《针灸甲乙经》和《帝王世纪》等。
body: |-
  皇甫谧字士安，自号玄晏先生，安定朝那人，是东汉太尉皇甫嵩的曾孙。他幼年过继给叔父，迁居新安。据《晋书》本传，他到二十岁还不肯读书，叔母任氏流着泪劝诫，他才发愤向学，一边耕种一边带着经书诵读，后来博通典籍百家之言。

  他中年患了风痹病，半身不便，仍然手不释卷，当时人叫他“书淫”。曹魏和西晋朝廷多次征召，他都推辞不就。晋武帝屡次下诏敦促，他上表自陈病苦，并向武帝借书，武帝送给他一车书。

  他因自己患病而钻研医学，把《素问》《针经》和《明堂孔穴针灸治要》三部书中有关针灸的内容分类整理，编成《针灸甲乙经》。他还著有记述上古以来帝王事迹的《帝王世纪》，以及《高士传》《列女传》《玄晏春秋》等。门人挚虞等后来都成为名臣。他主张薄葬，写了《笃终》一文预作安排。太康三年（公元 282 年）去世，时年六十八。
sources: []
recalled:
  - 《晋书·皇甫谧传》
