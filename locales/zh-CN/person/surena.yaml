name: 苏雷纳
aliases: [苏莱纳, 苏伦]
role: 帕提亚将领
summary: 帕提亚贵族将领，在卡莱以骑射手和重甲骑兵全歼克拉苏的罗马军团。
body: |-
  帕提亚（安息）的贵族将领。“苏雷纳”是家族的名号，苏伦家族世袭为国王加冕的特权；他本人的名字没有流传下来。他的事迹几乎只见于普鲁塔克的《克拉苏传》。

  据普鲁塔克，他在财富、门第和声望上仅次于国王，卡莱之战时还不满三十岁。国王奥罗德二世与兄弟争位被逐，是他带兵把奥罗德送回王位，并攻下塞琉西亚城。

  公元前 53 年罗马的克拉苏入侵美索不达米亚。奥罗德自己领兵去亚美尼亚，把迎击克拉苏的任务交给他。他的军队全是骑兵，据普鲁塔克，有重甲骑兵一千，骑射手约一万，另有一千头骆驼专门运送箭矢。在卡莱附近的平原上，骑射手环绕罗马人的方阵不停放箭，罗马人一出击他们就边退边回身射击；克拉苏之子普布利乌斯带骑兵追出，被引开后歼灭。罗马人连夜向山地撤退。苏雷纳提出会谈，克拉苏在部下逼迫下前往，在争执中被杀。

  这一战使幼发拉底河成为罗马与帕提亚之间长期的界线。普鲁塔克说，奥罗德嫉妒他的名声，不久就把他处死了。
sources: []
recalled:
  - 普鲁塔克《克拉苏传》第 21—33 章
  - 卡西乌斯·狄奥《罗马史》卷四十第 16—27 章
