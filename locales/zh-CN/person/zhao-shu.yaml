name: 宋英宗
aliases: [赵曙, 赵宗实]
role: 北宋皇帝
summary: 宋仁宗的堂侄和养子，1063 年继位，在位四年，有“濮议”之争。
body: |-
  宋英宗赵曙是濮王赵允让的儿子、宋仁宗的堂侄，本名宗实。仁宗无子，曾把他接到宫中抚养，嘉祐七年（1062 年）正式立为皇子，赐名曙。次年仁宗去世，他继位，即位不久就病倒，由仁宗的曹皇后垂帘听政，一年多后才亲政。

  他在位时最大的争议是“濮议”：治平二年（1065 年）起，朝廷讨论应当如何称呼他的生父濮王。宰相韩琦、欧阳修主张称“皇考”，司马光等台谏官员主张称“皇伯”，双方争执一年多，最后英宗以曹太后的名义尊濮王为“亲”，几位反对的台谏官员被贬出京城。治平三年（1066 年），他命司马光设局编写历代君臣事迹，这就是后来的《资治通鉴》。治平四年（1067 年）正月英宗去世，年三十六岁，太子赵顼继位，即宋神宗。
sources: []
recalled:
  - 《宋史·英宗本纪》
  - 《续资治通鉴长编》卷一百九十八至二百九
