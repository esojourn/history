name: 苏轼
aliases: [苏东坡, 东坡居士, 苏子瞻, 苏文忠]
role: 北宋文学家、书画家
summary: 北宋文学家、书画家，诗词文书画皆精，因乌台诗案贬黄州，晚年远谪惠州、儋州。
body: |-
  苏轼是苏洵的长子，景祐三年（1037 年初）生于眉州眉山。嘉祐二年（1057 年）他与弟弟苏辙同榜考中进士，主考官欧阳修读了他的文章，说自己应当让此人出人头地。嘉祐六年（1061 年）他又考中制科，此后任凤翔府签判。

  熙宁年间他反对王安石的新法，自请外任，先后任杭州通判，密州、徐州、湖州知州。在密州时他写了《水调歌头·明月几时有》《江城子·密州出猎》；在徐州时黄河决口，他率领军民守城抗洪。元丰二年（1079 年），御史从他的诗文中摘出讥讽新法的句子，把他逮捕入御史台监狱，这就是“乌台诗案”（另见该条）。经多方营救，他被从轻发落，贬为黄州团练副使。

  在黄州的四年多，他在城东的坡地上开荒种地，自号“东坡居士”，写下了前、后《赤壁赋》和《念奴娇·赤壁怀古》等名作，书法作品《黄州寒食诗帖》也写于此时。元祐年间旧党执政，他被召回朝廷，任翰林学士，但他反对司马光全部废除免役法，又与程颐一派不和，于是请求外任。元祐四年（1089 年）他出任杭州知州，疏浚西湖，用挖出的葑泥筑成长堤，后人称为“苏堤”。

  绍圣元年（1094 年）哲宗亲政，新党重新执政，苏轼被贬到惠州，绍圣四年（1097 年）又被贬到海南岛的儋州。元符三年（1100 年）徽宗即位，他遇赦北归，建中靖国元年（1101 年）七月在常州去世。

  苏轼在诗、词、散文、书法、绘画方面都有很高的成就。他的散文列入“唐宋八大家”；他的诗与黄庭坚并称“苏黄”；他的词开拓了题材和意境，后人把他与南宋的辛弃疾并称“苏辛”，看作豪放词的代表；他的书法与黄庭坚、米芾、蔡襄并称宋代四大家；他提倡“士人画”，强调画中的意趣。
sources: []
