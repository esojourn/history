name: 阿格里帕
aliases: [马尔库斯·维普萨尼乌斯·阿格里帕, 阿格里巴, 亚基帕]
role: 罗马统帅、执政官
summary: 屋大维的挚友和主将，赢得瑙洛库斯和亚克兴两场海战，在罗马兴建水渠和万神殿。
body: |-
  马尔库斯·维普萨尼乌斯·阿格里帕，约公元前 63 年生，与屋大维同龄，出身不显，家乡不详。两人少年相识。前 44 年恺撒遇刺时，他同屋大维一起在阿波罗尼亚，随之回意大利。佩鲁西亚之战中他是屋大维的主要将领。前 39 年至前 38 年他治理高卢，平定阿奎塔尼人，渡过莱茵河。

  前 37 年他任执政官，受命对付控制西西里和海路的塞克斯图斯·庞培。他在那不勒斯湾开凿水道，把卢克里努斯湖、阿韦尔努斯湖与大海连通，建成“尤利乌斯港”，在里面造船练兵。前 36 年他先在米莱取胜，9 月 3 日在瑙洛库斯决战，据阿庇安，对方三百艘船只逃出十七艘。此后他在伊利里亚作战。前 33 年他以前任执政官的身份屈就营造官，修复旧水渠，新建尤利乌斯水渠，清理大下水道，并向市民开放浴场。

  前 31 年他是对安东尼作战的实际指挥者：先攻取伯罗奔尼撒的墨托涅等据点，切断安东尼的粮道，9 月 2 日在亚克兴指挥舰队获胜。前 28 年、前 27 年他与屋大维同任执政官，一同清理元老名单、举行人口普查。他在战神广场建造万神殿、浴场等建筑；今天的万神殿是哈德良时重建的，门楣上仍刻着他的名字。

  前 23 年奥古斯都病重，把印戒交给他。此后他两度以近乎共治者的身份巡视东方，前 21 年娶奥古斯都的女儿尤利娅，前 19 年平定西班牙北部的坎塔布里人，前 18 年得到保民官权力。约瑟夫斯记载，他与犹太王希律交好，前 15 年访问耶路撒冷，在圣殿献祭。前 12 年 3 月他从潘诺尼亚回来，在坎帕尼亚病逝，葬在奥古斯都陵墓。他的两个儿子盖乌斯、卢基乌斯曾被奥古斯都收养为继承人，都早死；女儿大阿格里皮娜是皇帝卡利古拉的母亲。
sources: []
recalled:
