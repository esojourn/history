name: 欧里庇得斯
aliases: [尤里比底斯]
role: 悲剧诗人
summary: 雅典悲剧诗人，作《美狄亚》《特洛伊妇女》《酒神的伴侣》。
body: |-
  雅典人，父亲涅萨尔科斯。古人说他出生在萨拉米斯岛，而且就在公元前 480 年海战的当天；后一点显然是为了把三位悲剧诗人与这场海战连在一起而编的，《帕罗斯碑》把他的生年记在前 485 年或前 484 年。喜剧里说他母亲是卖菜的，古人已指出这不是事实。

  他在前 455 年第一次参加悲剧比赛，前 441 年才第一次获胜，生前一共只赢了四次。他写了约九十部剧，今存十八部（另有一部《瑞索斯》是否他作有争议），比埃斯库罗斯和索福克勒斯留下的加起来还多，其中一部分是靠一种按剧名字母排列的抄本偶然保存下来的。年代确定的有：《阿尔刻提斯》（前 438 年）、《美狄亚》（前 431 年）、《希波吕托斯》（前 428 年）、《特洛伊妇女》（前 415 年）、《海伦》（前 412 年）、《俄瑞斯忒斯》（前 408 年）。《特洛伊妇女》写城破之后被俘的女人，上演于雅典人毁灭米洛斯的第二年、远征西西里的前夕。

  他的剧中常有激烈的辩论，女性、奴隶说出的道理并不输于英雄；神的行事往往经不起人的质问；有的剧以神从机械上降临来收场。亚里士多德批评他在布局上有毛病，但称他是“最具悲剧性的诗人”。阿里斯托芬在《阿卡奈人》《地母节妇女》《蛙》里不断拿他取笑，说他让国王穿破烂上台，教坏了雅典人。古人说他与阿那克萨戈拉、普罗泰戈拉、苏格拉底有交往，这些说法多半是从剧作里推想的。

  约前 408 年他离开雅典，到马其顿国王阿凯劳斯的宫廷，前 406 年死在那里；说他被猎犬咬死，是后来的传说。消息传到雅典，据说年迈的索福克勒斯在戏剧节的预演仪式上身穿丧服，让歌队不戴花冠出场。他死后，《酒神的伴侣》和《伊菲革涅亚在奥利斯》由他的儿子（一说侄子）在雅典上演，得了头奖。
sources: []
recalled:
  - 《帕罗斯碑》
  - 亚里士多德《诗学》第 13 章
  - 古代《欧里庇得斯传》
  - 阿里斯托芬《蛙》《地母节妇女》
