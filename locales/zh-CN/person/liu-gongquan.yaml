name: 柳公权
aliases: [柳诚悬, 柳少师]
role: 书法家、太子少师
summary: 唐代书法家，楷书骨力劲健，世称“柳体”，与颜真卿并称“颜柳”。
body: |-
  柳公权字诚悬，京兆华原人，大历十三年（公元 778 年）生，是河东节度使柳公绰的弟弟。他在宪宗元和初年考中进士，在地方幕府中任职。唐穆宗即位后，看到他的书法，召他入朝任侍书。据《旧唐书》，穆宗问他怎样用笔最好，他回答说“心正则笔正”，穆宗听了脸色一变，明白他是借书法进谏。此后他历任敬宗、文宗、武宗、宣宗、懿宗各朝，长期在宫中担任侍书、翰林学士等职，官至太子少师，所以人称“柳少师”。咸通六年（865 年）他去世，年八十八。

  他的楷书初学王羲之，后来遍观唐代各家，吸收了颜真卿、欧阳询的长处，结构紧密，笔画瘦硬，骨力劲健，世称“柳体”，与颜真卿并称“颜柳”，后人有“颜筋柳骨”的说法。当时大臣家立碑，如果不是他书写，就会被人认为不孝；外国使者来朝，也专门出钱购买他的字。代表作有《玄秘塔碑》《神策军碑》等。
sources: []
recalled:
  - 《旧唐书·柳公绰传附柳公权》
  - 《新唐书·柳公绰传附柳公权》
