name: 晋孝武帝
aliases: [司马曜, 司马昌明, 烈宗]
role: 皇帝
summary: 东晋在位最久的皇帝，在位时有淝水之捷，后期与弟弟司马道子酣饮怠政，被张贵人所杀。
body: |-
  司马曜字昌明，是晋简文帝的儿子。咸安二年（公元 372 年）简文帝去世，他继位时年仅十一岁，由太后褚氏临朝听政。桓温去世后，谢安等人辅政，朝廷得以安定。太元元年（376 年）他开始亲政。太元八年（383 年）东晋在淝水击败前秦，随后一度收复黄河以南的大片土地。

  谢安去世后，他把朝政交给同母弟会稽王司马道子。《晋书·孝武帝纪》说兄弟二人都沉湎于酒，常常通宵宴饮，政事荒废，官员靠贿赂升迁。后来他对司马道子的专权也起了戒心，任命王恭、殷仲堪等人出镇京口、荆州，用来牵制朝中，这些安排成为日后内战的伏线。他和司马道子都崇信佛教，宫中常有僧尼出入。

  太元二十一年（396 年）九月的一个晚上，他酒后对宠爱的张贵人开玩笑说，你快三十岁了，按年纪该废掉了。当夜张贵人趁他熟睡，叫婢女用被子把他闷死，时年三十五。继位的太子司马德宗不能理事，事情没有人追究。
sources: []
recalled:
  - 《晋书·孝武帝纪》
  - 《资治通鉴》卷一百零三至一百零八
