name: 鲧
aliases: [崇伯]
role: 传说中的治水者，禹的父亲
summary: 传说中禹的父亲，受命治理洪水九年无功，被舜殛于羽山。
body: |-
  鲧是传说时代的人物。据《尚书·尧典》和《史记》的《五帝本纪》《夏本纪》，尧的时候洪水滔天，四岳推举鲧去治水，尧认为他“负命毁族”，不可任用，四岳坚持请求试用，尧才答应。鲧治水九年，水患没有平息。

  后来舜摄政，巡行天下，认为鲧治水无功，把他“殛”于羽山，与共工、驩兜、三苗并称“四罪”。随后舜又举用鲧的儿子禹继续治水。《国语》等书称他为“崇伯鲧”，所以后世也称他为崇伯。

  古书里还有更带神话色彩的记载。《山海经·海内经》说鲧偷了天帝的“息壤”来堵塞洪水，天帝命祝融杀鲧于羽郊。后世常把鲧“堵”与禹“疏”对比，说明治水方法的不同，但这是后人的概括，早期文献只说鲧治水不成。
sources: []
recalled:
  - 《尚书·尧典》
  - 《史记·夏本纪》
  - 《山海经·海内经》
  - 《国语·周语下》
