name: 加利流
aliases:
  - 伽列里乌斯
role: 罗马皇帝
summary: 罗马皇帝，戴克里先的副手和继承人，力主逼迫基督徒，临终前下诏宽容。
body: |-
  加利流约在公元 258 年前后生于多瑙河南岸的达契亚，离塞尔迪卡不远，据说年轻时放过牲口。他从军中升上来，公元 293 年被戴克里先立为“凯撒”，并娶了戴克里先的女儿。298 年他大败波斯王纳尔塞，订立了对罗马有利的和约，声望大增。

  拉克坦提乌斯说，公元 303 年开始的大逼迫主要出于加利流的主张：他在尼哥米底亚与戴克里先商议了一个冬天，才促成第一道诏令。305 年戴克里先退位，加利流成为东方的正皇帝，逼迫在他和他的副手马克西米努管辖的地方继续进行。此后几年，帝国几位皇帝之间内战不断，他始终没能控制西方。

  公元 311 年，他患了重病，拉克坦提乌斯和优西比乌都详细描写了他的病状。这年 4 月 30 日，他与其他几位皇帝联名在尼哥米底亚公布诏令，原文保存在拉克坦提乌斯的书里。诏令说，原想让基督徒回到祖先的规矩上去，但许多人既不敬拜诸神，也不能敬拜自己的神，因此准许他们重新作基督徒，恢复聚会，只要不扰乱秩序；并要他们为皇帝和国家的平安向自己的神祈求。几天以后他就死了。

  《历史的轨迹》第二章说，这道诏谕只是给了基督徒一部分容忍，还算不上完全的得胜；两年后的米兰诏谕才给了基督徒与其他宗教同等的地位。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四章“教会全面得胜” https://wellsofgrace.com/books/spiritual/2000years/html/chapter05.html"
recalled:
  - 拉克坦提乌斯《论迫害者之死》第 9—14、33—35 章
  - 优西比乌《教会史》卷 8 第 16—17 章
