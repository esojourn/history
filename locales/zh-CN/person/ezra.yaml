name: 以斯拉
aliases: []
role: 祭司、文士
summary: 亚伦后裔，通达摩西律法的文士，率众归回并向百姓宣读律法。
body: |-
  祭司，亚伦的后裔。《以斯拉记》7:1–5 列出他的家谱，上溯到西莱雅、撒督、非尼哈、以利亚撒，直到亚伦。7:6 说他是敏捷的文士，通达耶和华以色列神所赐摩西的律法书；7:10 说他定志考究、遵行耶和华的律法，又将律例典章教训以色列人。他从巴比伦上来，生卒年和出生地圣经没有记载。

  亚达薛西王第七年，以斯拉得王的谕旨，率领一批人从巴比伦回耶路撒冷。谕旨准许愿意同去的以色列人随行，让他带上王和谋士献的金银，查问犹大和耶路撒冷的景况，并授权他设立士师、审判官，教导不明白律法的人（7:11–26）。他在亚哈瓦河边召集众人，发现其中没有利未人，又派人去请；启程前宣告禁食，因为他曾对王说神必帮助寻求他的人，就不好意思再求王派兵护送（第 8 章）。一行人正月启程，五月到达（7:8–9）。按亚达薛西一世计算，这一年是公元前 458 年。

  到耶路撒冷之后，首领告诉他，百姓连祭司和利未人在内，娶了当地外族的女子。以斯拉撕裂衣服，忧闷而坐，到献晚祭时跪下认罪祷告（第 9 章）。众人于九月在耶路撒冷聚集，议定逐一查办，到次年正月初一日查清；第 10 章末尾列有娶外邦女子为妻者的名单。

  《尼希米记》第 8 章记，城墙修完后的七月初一日，百姓聚集在水门前的宽阔处，请以斯拉把律法书带来。他站在木台上从清早念到晌午，利未人帮助讲解，使百姓明白。随后众人照书上所写的住棚守节。《尼希米记》12:36 又记他在城墙告成之礼上走在一队称谢的人前面。

  犹太传统很看重他在传授律法上的地位，相传他与圣经书卷的整理有关。他与尼希米谁先到耶路撒冷，学界有不同看法。圣经没有交代他的结局。
sources: []
recalled:
  - 《以斯拉记》第 7—10 章
  - 《尼希米记》第 8 章、12:36
