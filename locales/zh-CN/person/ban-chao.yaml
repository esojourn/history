name: 班超
aliases: [班仲升, 定远侯]
role: 西域都护
summary: 东汉将领、使者，在西域活动三十一年，使西域诸国重新归附汉朝。
body: |-
  据《后汉书·班超传》，班超字仲升，扶风安陵人，班彪的幼子、班固的弟弟。班固被召到雒阳任职后，他随母亲同往，家境贫寒，靠替官府抄写文书养家。本传记他曾扔下笔感叹，说大丈夫应当像傅介子、张骞那样立功异域，成语“投笔从戎”即出于此。

  永平十六年（公元 73 年），窦固出击北匈奴，班超任假司马，立功后被派出使西域。他到鄯善时，正遇匈奴使者也到了，鄯善王态度转冷。班超率随从三十六人乘夜火攻匈奴使者的营帐，将其全部杀死，鄯善于是归附汉朝。本传所记“不入虎穴，不得虎子”一语就是他在这时说的。此后他又使于阗、疏勒等国归汉。

  明帝死后，西域局势反复，章帝下诏召班超回朝。他行至于阗，当地王侯挽留，于是决定留下，以疏勒为根据地，联合归附的各国兵力，逐步平定莎车、龟兹等国。永元三年（91 年）朝廷任他为西域都护，驻龟兹。永元六年他发诸国兵攻破焉耆，本传说至此西域五十余国都遣子入侍、归属汉朝。次年他被封为定远侯。

  永元九年（97 年），班超派属下甘英出使大秦，甘英到达条支海边后折回。班超在西域前后三十一年，晚年上书请求回乡，妹妹班昭也为他上书陈情。永元十四年（102 年）八月他回到雒阳，九月去世，本传记其终年七十一。
sources: []
recalled:
  - 《后汉书·班梁列传》
  - 《后汉书·西域传》
