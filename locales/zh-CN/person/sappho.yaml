name: 萨福
aliases: [莎孚]
role: 抒情诗人
summary: 莱斯博斯岛的女诗人，作品多写爱与思念，今只存残篇。
body: |-
  莱斯博斯岛人，出生在岛上的厄瑞索斯或米提利尼，一生主要在米提利尼度过。生卒年是约数，与同乡诗人阿尔凯奥斯同时。关于她的生平，可靠的材料很少，多出自她自己的诗和后人的零星记载。她的诗里提到女儿克勒伊斯，还提到兄弟。希罗多德说，她的兄弟卡拉克索斯在埃及花重金赎出一名妓女，她在诗中责备过他；2014 年公布的一份纸草上的“兄弟诗”，写的正是盼望卡拉克索斯平安返航。公元前 3 世纪的《帕罗斯碑》记载她曾流亡西西里，时间约在前 600 年前后，原因没有说明，可能与米提利尼的政争有关。

  她的诗用莱斯博斯当地的爱奥利亚方言写成，以竖琴伴唱，题材多是爱、思念、婚礼和对神的祈祷，许多诗写给她身边的年轻女子。亚历山大的学者把她的作品编为九卷，后来全部散失。今天所见的，一部分是古代作家的引文，一部分是 19 世纪末以来在埃及出土的纸草残片。完整的只有一首向阿佛洛狄忒祈祷的诗，因哈利卡纳苏斯的狄奥尼修斯引用而保存；另一首写看见所爱之人与别人交谈时身体的种种反应，由《论崇高》引用而留下大半。

  她常用的一种诗节后来称为“萨福体”，罗马诗人卡图卢斯和贺拉斯都仿写过。一首归在柏拉图名下的短诗称她为“第十位缪斯”。说她为爱上船夫法翁而从琉卡斯的悬崖跳海，是后世的传说。
sources: []
recalled:
  - 希罗多德《历史》卷二第 135 章
  - 《帕罗斯碑》第 36 条
  - 哈利卡纳苏斯的狄奥尼修斯《论文章作法》第 23 章
  - 《论崇高》第 10 章
