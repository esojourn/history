name: 僧格林沁
aliases: [科尔沁亲王, 忠亲王]
role: 蒙古亲王、清军统帅
summary: 科尔沁蒙古亲王，曾击败太平军北伐军，在大沽口击退英法舰队，后在山东被捻军所杀。
body: |-
  僧格林沁是蒙古科尔沁左翼后旗人，成吉思汗之弟哈萨尔的后裔。道光五年（1825 年）他被选为科尔沁郡王的继承人，此后在宫中任御前大臣等职，深受道光、咸丰两帝的信任。

  咸丰三年（1853 年）太平军派林凤祥、李开芳率军北伐，一度进抵天津附近，京城震动。僧格林沁率领蒙古骑兵和清军堵截，经过两年的战斗，在连镇和冯官屯先后消灭了北伐军，林凤祥、李开芳被俘处死，他因功晋封亲王。

  第二次鸦片战争期间，僧格林沁负责天津大沽口的防务。咸丰九年（1859 年）英法舰队强行闯入大沽口，被他指挥的炮台击退，英法舰队损失严重。次年英法联军大举进攻，从北塘登陆，攻陷大沽炮台，僧格林沁在通州八里桥一带与联军交战，清军骑兵大败（另见“第二次鸦片战争”条）。

  此后僧格林沁转战山东、河南等地，镇压捻军。同治四年（1865 年）他率领骑兵穷追捻军，在山东曹州高楼寨陷入捻军的包围，战死，年五十五岁。他死后，清朝改派曾国藩、李鸿章负责镇压捻军，此后清军的主力由八旗、绿营转为湘军和淮军。
sources: []
recalled:
