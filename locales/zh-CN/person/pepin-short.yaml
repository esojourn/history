name: 丕平
aliases:
  - 矮子丕平
  - 丕平三世
role: 法兰克国王
summary: 查理·马特之子，751 年取代墨洛温王朝称王，两次出兵意大利，把土地献给教皇。
body: |-
  丕平约生于公元 714 年，是查理·马特的儿子。741 年父亲去世，他与兄长卡洛曼分任宫相；747 年卡洛曼进了修道院，丕平独掌大权。“矮子”是后世加给他的绰号。

  当时在位的墨洛温王朝国王希尔德里克三世只有名义。据《法兰克王国年代记》，丕平派人去问教皇撒迦利亚：没有实权的人称王是否妥当。教皇答复说，有权的人称王，比没有权的人称王要好。751 年丕平在苏瓦松被法兰克人推举为王，由主教们膏立，希尔德里克被剃发送进修道院。《历史的轨迹》第九章说丕平在 751 年由教皇撒迦利亚加冕；按上述史料，撒迦利亚只是表示赞同，没有到场，亲手膏立丕平的教皇是他的继任者司提反二世，时间在 754 年。《历史的轨迹》说，丕平请教皇批准这件事，开了教皇有权立王废王的先例，后来教皇与皇帝的争斗由此而来。

  伦巴第王艾斯图尔夫在 751 年占领拉文纳，威胁罗马。754 年初教皇司提反二世越过阿尔卑斯山来见丕平，同年 7 月在圣但尼再次膏立他和两个儿子。丕平在 754（一说 755）年和 756 年两次进兵意大利，围困帕维亚，迫使艾斯图尔夫交出拉文纳一带的城邑，把这些地方献给教皇，这就是教皇国的开端。《历史的轨迹》把请丕平出兵的教皇写作撒迦利亚，撒迦利亚已在 752 年去世，应是司提反二世。

  丕平还从阿拉伯人手中夺回纳博讷，多年征讨阿基坦，并支持波尼法修等人整顿法兰克教会。768 年 9 月他在圣但尼去世，国土分给两个儿子查理和卡洛曼。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第九章“教会组成联盟” https://wellsofgrace.com/books/spiritual/2000years/html/chapter11.html"
recalled:
  - 《法兰克王国年代记》749—768 年
  - 《弗雷德加编年史续编》
  - 《教皇列传》司提反二世传
