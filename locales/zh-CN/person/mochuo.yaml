name: 默啜可汗
aliases: [阿史那默啜]
role: 后突厥可汗
summary: 后突厥汗国的可汗，在武则天时多次侵扰河北，716 年在征战归途中被杀。
body: |-
  默啜可汗名阿史那默啜，是后突厥汗国建立者骨咄禄的弟弟（另见“后突厥复国”条）。天授二年（公元 691 年）前后骨咄禄去世，默啜自立为可汗。万岁通天元年（696 年）契丹李尽忠、孙万荣起兵反周，他出兵袭击契丹后方，向武则天索要六胡州的降户和种子、农具，武则天答应了他。

  圣历元年（698 年），他请求与武周和亲，武则天派侄孙武延秀前去娶他的女儿。据《资治通鉴》，他说自己的女儿要嫁给李家天子的儿子，武家的儿子算什么，于是扣留武延秀，以拥护李唐为名大举入侵河北，攻掠赵州、定州等地，掳走大批百姓，武则天派狄仁杰率军防御，突厥退去。

  此后他征服了周边许多部落，势力达到极盛，但晚年统治暴虐，各部多有叛离。开元四年（716 年），他北征拔曳固部，得胜回师时轻装而行，被拔曳固的散兵袭击杀死，首级被送到长安。他死后，骨咄禄之子阙特勤起兵杀死他的儿子，拥立哥哥默棘连为毗伽可汗。
sources: []
recalled:
  - 《旧唐书·突厥传》
  - 《新唐书·突厥传》
  - 《资治通鉴》卷二百五至二百一十一
