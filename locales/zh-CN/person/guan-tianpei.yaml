name: 关天培
aliases: [仲因, 忠节]
role: 广东水师提督
summary: 鸦片战争时的广东水师提督，协助林则徐禁烟，1841 年在虎门战死。
body: |-
  关天培是江苏山阳（今淮安）人，行伍出身，从低级武官逐步升迁，道光年间曾负责漕粮海运的护航。道光十四年（1834 年）他任广东水师提督，此后加固虎门的炮台，添铸大炮，在横档、武山等处设置拦江木排和铁链，形成虎门的防御体系。

  道光十九年（1839 年）林则徐到广东禁烟，关天培全力协助，参与了收缴和销毁鸦片的工作。同年英国船只在穿鼻洋向清军水师开炮，关天培率军还击。道光二十年（1840 年）鸦片战争爆发，林则徐被革职，琦善接任后裁撤了部分防务。

  道光二十一年（1841 年）二月，英军进攻虎门，关天培率领数百名士兵坚守靖远炮台，向琦善请求援兵，没有得到回应。炮台被攻破时他身受重伤，仍持刀奋战，最后战死，年六十一岁。据说他的仆人孙长庆在英军撤走后找到他的遗体，送回家乡安葬。朝廷追谥“忠节”。
sources: []
recalled:
  - 《清史稿·关天培传》
  - 梁廷枏《夷氛闻记》
