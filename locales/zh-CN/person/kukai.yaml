name: 空海
aliases: [弘法大师, 遍照金刚]
role: 真言宗创始人
summary: 日本僧人，804 年入唐，在长安青龙寺从惠果学密教，回国后创立日本真言宗。
body: |-
  空海是日本赞岐国人，宝龟五年（公元 774 年）生，俗姓佐伯。他少年时到京城学习儒学，后来弃学修行佛法。延历二十三年（唐贞元二十年，804 年），他作为留学僧随遣唐使藤原葛野麻吕入唐，同行的另一艘船上有最澄。他们的船在海上遇到风暴，漂到福州一带才登陆。

  同年年底他到达长安，次年拜青龙寺的密教高僧惠果为师，在几个月内接受了金刚界、胎藏界两部大法的灌顶，惠果当年年底去世，他受众弟子推举，撰写了惠果的碑文。原定留学二十年，他学成后在元和元年（806 年）就随遣唐使的船回国，带回大量经典、法器和曼荼罗。

  回国后他得到嵯峨天皇的支持，弘仁七年（816 年）获赐高野山作为修行道场，弘仁十四年（823 年）又获赐京都的东寺，创立了日本的真言宗。他擅长书法，与嵯峨天皇、橘逸势并称“三笔”；他编写的《文镜秘府论》辑录了大量唐代的诗歌理论，有些在中国已经失传。承和二年（835 年）他在高野山去世，后来被追赐“弘法大师”的称号。日本民间相传平假名和“伊吕波歌”是他所创，学界一般认为不可信。
sources: []
recalled:
  - 空海《御请来目录》
  - 空海《大唐神都青龙寺故三朝国师灌顶阿阇梨惠果和尚之碑》
  - 《续日本后纪》
