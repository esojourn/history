name: 班固
aliases: [班孟坚]
role: 史学家
summary: 东汉史学家、辞赋家，《汉书》的主要作者，因窦宪案牵连死于狱中。
body: |-
  据《后汉书·班固传》，班固字孟坚，扶风安陵人。父亲班彪曾接续司马迁《史记》，撰写西汉史事数十篇。班彪去世后，班固回乡整理父亲的遗稿，准备写成全书。有人上书告发他私自改作国史，他被捕入狱，书稿也被抄走。弟弟班超赶到雒阳上书申辩，明帝看过书稿后很赏识，任他为兰台令史，后升为郎，让他继续完成这部书。

  班固前后用了二十多年，到章帝建初年间基本写成《汉书》。全书记述西汉一代，从高祖起到王莽败亡为止，分纪、表、志、传，开创了以一个朝代为断限的纪传体史书的体例。他死时八表和《天文志》尚未完成，后来由妹妹班昭和马续奉诏补成。

  班固也以辞赋知名，所作《两都赋》描写长安、雒阳两座都城。建初四年（公元 79 年）章帝在白虎观召集诸儒讨论五经，班固奉命把讨论的结果撰集成书，即《白虎通义》。

  永元元年（89 年）大将军窦宪出击北匈奴，班固以中护军随行。汉军登燕然山，由班固作铭刻石记功。永元四年窦宪失势自杀，班固受到牵连被免官；雒阳令种兢与他家有旧怨，乘机将他逮捕下狱，班固死于狱中，本传记其终年六十一。
sources: []
recalled:
