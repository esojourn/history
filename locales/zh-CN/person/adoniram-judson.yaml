name: "耶德逊"
aliases: ["阿多尼拉姆·耶德逊", "贾德森"]
role: "美国浸信会派往缅甸的宣教士"
summary: "赴印途中改信浸礼，转往缅甸宣教近四十年，译成缅文圣经。"
body: |-
  《历史的轨迹》第四十四章说，大复兴带来的热诚促成许多差会成立、宣教刊物出版和基督教大学、神学院设立。公理派在 1810 年成立了美国公理会海外宣教部，三十年内差派了六百九十四位宣教士。书中说，最戏剧化的是浸礼派差会的成立：赖斯和耶德逊原是公理派差往印度的宣教士，在赴印途中接受了浸礼派的原则，抵达加尔各答后重新受洗；耶德逊留在缅甸继续宣教，赖斯则回到美国组织浸礼派差会。

  据一般记载，耶德逊 1788 年生于马萨诸塞的莫尔登，父亲是公理会牧师。他在布朗大学读书时一度受自然神论影响，后来归信，进安多弗神学院；他与几位同学的请愿促成了美国公理会海外宣教部的成立。1812 年他与新婚妻子安·哈塞尔廷等人启程，在船上研读新约，认为应当为信徒行浸礼，到加尔各答后由克理的同工施浸。东印度公司不准他们留在英属印度，1813 年他们转往仰光。

  据一般记载，他在缅甸头六年才有第一个缅人信徒受洗。1824 年英缅战争爆发，他被缅甸当局当作间谍关押近两年，受尽折磨，妻子安四处奔走营救，不久病故。此后他以毛淡棉为基地，1834 年译完缅文圣经，又编成缅英词典。他先后丧偶两次，1850 年在前往法国就医的海上去世，遗体海葬。他去世时缅甸已有数千名浸信会信徒，克伦人中尤多。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十四章“十九世纪初期的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter49.html"
recalled:
  - "耶德逊译缅文圣经（1834 年）"
