name: 李清照
aliases: [易安居士]
role: 两宋之际的词人
summary: 两宋之际的女词人，与丈夫赵明诚收藏金石，南渡后流离江南，有《漱玉词》。
body: |-
  李清照号易安居士，济南章丘人，生于元丰七年（公元 1084 年）。父亲李格非是苏轼的学生，以文章知名，母亲也出身名门。她少年时随父亲住在开封，已经以诗词知名。建中靖国元年（1101 年）她嫁给太学生赵明诚，赵明诚是后来的宰相赵挺之的儿子。夫妇二人都喜爱书画金石，常常典当衣物去买碑帖古器，一起校勘、题记。

  崇宁年间新旧党争激烈，李格非被列入元祐党籍，赵挺之则是新党的要人，李清照曾上诗赵挺之请求援救父亲。大观元年（1107 年）赵挺之去世后，赵明诚一家受到排挤，夫妇回到青州故居，在那里住了十多年，专心收集和整理金石，赵明诚后来据此写成《金石录》。这一时期她写了不少描写闺中生活和离别相思的词，如《一剪梅》《醉花阴》。

  靖康二年（1127 年）北宋灭亡，夫妇先后南渡，青州的大批藏品毁于战火。建炎三年（1129 年）赵明诚在建康病逝。此后李清照独自带着剩余的藏品，在越州、明州、杭州、金华等地辗转流离，藏品大多散失。据宋人记载，绍兴二年（1132 年）她改嫁张汝舟，不久发现张汝舟意图谋夺她的藏品，便告发他的过失，与他离异，自己也因此入狱数日。改嫁一事，明清以来有人认为是诬蔑，学者至今仍有争论。

  她晚年为《金石录》写了《后序》，回忆夫妇收藏的经过和藏品的散失，是宋代散文的名篇。她的卒年不详，一般认为在绍兴二十五年（1155 年）前后。她的词前期清丽，后期多写国破家亡和孤独的悲苦，如《声声慢》（“寻寻觅觅”）、《武陵春》，善用口语，音律和谐，后人称为“易安体”。她写的《词论》提出词“别是一家”，批评了柳永、苏轼等多位前辈。她的诗也有慷慨之作，如《夏日绝句》。她的作品后人辑为《漱玉词》。
sources: []
recalled:
  - 李清照《金石录后序》
  - 李心传《建炎以来系年要录》卷五十八
  - 胡仔《苕溪渔隐丛话》
  - 王灼《碧鸡漫志》
