name: 吕夷简
aliases: [吕坦夫, 吕文靖]
role: 北宋宰相
summary: 宋仁宗前期长期执政的宰相，与范仲淹多有冲突。
body: |-
  吕夷简是寿州人，宰相吕蒙正的侄子，生于太平兴国四年（公元 979 年），咸平三年（1000 年）考中进士。仁宗即位后，刘太后听政，他任宰相。明道元年（1032 年）仁宗的生母李宸妃去世，他力劝刘太后以厚礼安葬，后来仁宗得知身世、开棺查验，见安葬合乎礼制，才没有追究刘氏一家，时人认为这是他的远见。

  他前后三次拜相，执政二十年左右，善于处理政务，但也被批评揽权用私。明道二年（1033 年）他支持仁宗废黜郭皇后，范仲淹等台谏官伏阁力争，被贬出朝廷；景祐三年（1036 年）范仲淹又献《百官图》批评他用人不公，再次被贬，欧阳修、余靖、尹洙等人也因声援范仲淹被贬，朝中由此开始了“朋党”之争。宋夏战争期间他再次执政，庆历三年（1043 年）因病罢相，次年去世，谥“文靖”。
sources: []
recalled:
  - 《宋史·吕夷简传》
  - 《续资治通鉴长编》卷九十九至一百五十二
