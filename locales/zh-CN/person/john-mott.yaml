name: "穆德"
aliases: ["约翰·穆德", "穆特"]
role: "学生志愿海外宣教运动的领袖、普世运动的推动者"
summary: "学生宣教运动领袖，倡“在这一代把福音传遍世界”，主持爱丁堡宣教大会。"
body: |-
  《历史的轨迹》第四十六章说，1886 年“学生立志布道运动”兴起后，宣教工作得到强烈的热诚和支持，穆德成为这个运动的伟大领袖；1906 年又组织了平信徒宣教运动。书中接着说，现代主义渗入以后，教会的经费和宣教人力惊人地下降，曾在各大学轰轰烈烈的学生立志布道运动销声匿迹，穆德“在这一代把福音遍传全球”的口号也失去了意义，到 1930 年宣教工作显然面临严重危机。

  第四十九章说，普世基督教协会的成立要追溯到 1910 年在爱丁堡举行的国际宣教会议，许多教会在会上看到了彼此合作的可能。书中没有点名，据一般记载，主持爱丁堡会议的正是穆德，他随后任国际宣教协会主席，1948 年普世教会协会成立时被推为名誉主席。

  据一般记载，穆德 1865 年生于纽约州，在康奈尔大学读书时参加基督教青年会的学生工作，1886 年参加慕迪在诺斯菲尔德召开的学生夏令会，是首批立志的学生之一；他长期主持青年会学生部和世界基督徒学生联合会。1946 年他与人同获诺贝尔和平奖，1955 年在佛罗里达奥兰多去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十六章“教会面对新问题” https://wellsofgrace.com/books/spiritual/2000years/html/chapter51.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十九章“教会联盟与联合” https://wellsofgrace.com/books/spiritual/2000years/html/chapter54.html"
