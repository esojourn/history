name: 孟知祥
aliases: [孟保胤, 后蜀高祖]
role: 后唐西川节度使、后蜀皇帝
summary: 李克用的侄女婿，后唐灭前蜀后镇守成都，逐渐割据两川，934 年称帝建立后蜀。
body: |-
  孟知祥是邢州龙冈人，乾符元年（公元 874 年）生，字保胤。李克用把侄女（弟弟李克让的女儿）嫁给他，他从此在晋军中任职，李存勖时任中门使，后来任太原尹、北京留守。

  同光三年（925 年）后唐灭前蜀，郭崇韬推荐他镇守蜀地，庄宗任命他为西川节度使。次年他到达成都时，郭崇韬已经被杀，蜀中有乱兵作乱，他平定了叛乱，安抚百姓。庄宗死后，他整顿军队，扩充兵力，与朝廷渐渐疏远。

  后唐明宗时，枢密使安重诲猜忌两川，在东川、西川安插亲信，分割辖地。长兴元年（930 年）孟知祥与东川节度使董璋联合起兵，朝廷讨伐无功，明宗只好杀了安重诲，派人安抚两川。长兴三年（932 年）孟知祥与董璋反目，击败并杀死董璋，兼并东川，据有两川全境。次年后唐封他为蜀王。长兴四年（933 年）底后唐明宗去世，闵帝李从厚与潞王李从珂相争，朝廷自顾不暇，孟知祥于是决定自立。

  应顺元年（934 年）正月，孟知祥在成都称帝，国号蜀，史称后蜀。他在位只有半年，同年七月便病逝，年六十一，儿子孟昶继位。他的陵墓和陵在今成都市北郊，1970 年代经过考古发掘。后蜀此后延续了三十年，965 年才被北宋所灭。
sources: []
recalled:
  - 《旧五代史·僭伪列传·孟知祥》
  - 《新五代史·后蜀世家》
  - 《资治通鉴》卷二百七十三至二百七十九
