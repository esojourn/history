name: 奥维德
aliases: [普布利乌斯·奥维狄乌斯·纳索, 奥维狄乌斯]
role: 诗人
summary: 罗马诗人，著《变形记》《爱的艺术》，晚年被奥古斯都放逐到黑海边。
body: |-
  奥维德于公元前 43 年 3 月 20 日生在意大利中部的苏尔莫，出身骑士之家。他的生平主要见于他自己的诗，尤其是《哀歌》卷 4 第 10 首。父亲送他和哥哥到罗马学修辞，准备走仕途；他又去雅典游学，回来做过几任低级官职，随后放弃仕途，专心写诗。

  他很早成名。《恋歌》《女杰书简》之后是三卷《爱的艺术》，前两卷教男子怎样求爱，第三卷教女子。他最大的作品是十五卷的《变形记》，用六音步诗体把从开天辟地到恺撒化为星辰的二百多个变形故事连缀成篇，是后世了解希腊罗马神话最常用的一部书。同时他还在写《岁时记》，按罗马历逐月讲节庆的来历，只完成了前六个月。

  公元 8 年，奥古斯都下令把他放逐到黑海西岸的托米斯。没有经过审判，他的公民权和财产也保留着。原因他自己只说是“一首诗和一个过错”：诗指《爱的艺术》，过错是什么，他说不便明言，只说是看见了不该看的事。后人有种种猜测，多与同年被放逐的奥古斯都外孙女小尤利娅相联系，都没有证据。

  他在托米斯写了《哀歌》五卷和《黑海书简》四卷，一再向奥古斯都和后来的提比略求情，都没有结果。哲罗姆的《编年史》记他死于公元 17 年；《岁时记》里有提到这一年年底之事的句子，也有人把卒年定在 18 年。
sources: []
recalled:
  - 奥维德《哀歌》卷 2、卷 4 第 10 首
  - 奥维德《黑海书简》
  - 哲罗姆《编年史》
