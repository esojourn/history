name: 落下闳
aliases: []
role: 历算家
summary: 巴郡阆中的民间历算家，汉武帝时参与制定《太初历》。
body: |-
  落下闳是巴郡人，生卒年不详，正史中关于他的记载很少。据《汉书·律历志》，元封七年（公元前 104 年），公孙卿、壶遂、太史令司马迁等人上言旧历已经失准，武帝下诏改历。朝廷从官府和民间选拔了二十余名通晓历法的人，其中有方士唐都和“巴郡落下闳”。《律历志》说落下闳“运算转历”，他与邓平所定的方法把一日分为八十一分，因此又称“八十一分律历”。经过比较，这一方案被认为最为精密而获采用，就是《太初历》。新历改以正月为一年的开始。

  扬雄《法言》中有人问起浑天，回答说是落下闳营造的，可见西汉后期人们已把浑天之说同他联系在一起。他是阆中人、字长公等说法，出自后来的地方史志。史料所载大致仅此。
sources: []
recalled:
  - 《汉书·律历志上》
  - 扬雄《法言·重黎》
