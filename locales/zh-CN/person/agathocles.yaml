name: 阿伽托克勒斯
aliases: [阿加托克利斯]
role: 叙拉古僭主、国王
summary: 叙拉古僭主，被迦太基围城时反而渡海攻入非洲，后自称西西里国王。
body: |-
  约公元前 361 年生于西西里北岸的塞尔迈（在希梅拉故城附近），父亲卡尔基诺斯是从意大利的瑞吉昂迁来的陶工。提摩勒昂重建叙拉古时，他们一家迁入并取得公民权。他学过制陶，后来从军，以勇力升为军官，又娶了一位富有的遗孀。他两次因与当权的寡头派冲突而被放逐，在外带兵做雇佣军首领。

  前 317 年他带着一支由雇佣军和内地西西里人组成的队伍回到叙拉古，发动政变。据狄奥多罗斯，两天之内有四千人被杀，六千人逃亡。公民大会推他为全权将军，他许诺取消债务、重分土地。此后他陆续兼并西西里东部各城，与控制西部的迦太基冲突。

  前 311 年他在南岸的希梅拉斯河边大败，各城纷纷倒向迦太基，叙拉古被海陆围困。前 310 年 8 月，他把城防交给弟弟，带一支舰队冲出封锁，在迦太基以东的海岸登陆。狄奥多罗斯说，途中遇到日食；又说他上岸后烧掉了全部船只，使士兵只能向前。他攻下突尼斯等多座城镇，逼近迦太基城下。他又诱使昔兰尼的统治者奥菲拉斯率军来会，随后将其杀害，吞并了他的军队。但他始终没有力量攻下迦太基城，而西西里各城乘机反对他。前 307 年他回西西里救急，再到非洲时军队已败，他丢下部队只身逃走，留在营中的两个儿子被士兵所杀。前 306 年他与迦太基议和，仍以哈吕科斯河为界。

  约前 304 年，他仿效东方的继业者自称国王。他娶了托勒密一世的继女，把女儿拉纳萨嫁给伊庇鲁斯的皮洛士，以克基拉岛为嫁妆，并几次出兵意大利南部。前 289 年他在家族争位的纷扰中去世，有被毒死的传说；据狄奥多罗斯，他死前宣布把政权交还给叙拉古人民。他从坎帕尼亚招来的雇佣兵在他死后占据了墨西拿，自称“马麦尔提尼人”，后来成为第一次布匿战争的导火线。
sources: []
recalled:
  - 狄奥多罗斯《历史丛书》卷十九至卷二十一
  - 尤斯丁《腓力史纲要》卷二十二、卷二十三
