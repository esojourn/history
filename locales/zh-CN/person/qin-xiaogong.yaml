name: 秦孝公
aliases: [嬴渠梁]
role: 秦国国君
summary: 秦国国君，下令求贤，任用商鞅变法，迁都咸阳，使秦国由弱转强。
body: |-
  秦孝公名渠梁，是秦献公之子，生于公元前 381 年，前 361 年即位。当时秦国地处西陲，长期被魏国压制，河西之地也被魏国夺去，东方诸侯把秦国当作戎狄看待，不让它参加会盟。

  据《史记·秦本纪》，孝公即位后发布求贤令，说秦国自厉公以来屡有内乱，“诸侯卑秦，丑莫大焉”，宣布“宾客群臣有能出奇计强秦者，吾且尊官，与之分土”。卫国人商鞅闻令而来，经宠臣景监引见，以富国强兵之术说动孝公。

  孝公不顾甘龙、杜挚等旧臣的反对，任用商鞅于公元前 356 年和前 350 年两次推行变法，奖励耕战，实行县制，并把都城从栎阳迁到咸阳。秦国很快富强起来，公元前 343 年周显王致伯于秦孝公，前 340 年商鞅率军击败魏军，魏国被迫献出部分河西之地。孝公死于公元前 338 年，儿子惠文王即位后虽然车裂了商鞅，但新法继续推行，为秦国后来统一六国奠定了基础。

  孝公的求贤令成为后世招贤的范例。汉代贾谊的《过秦论》开篇即说“秦孝公据崤函之固，拥雍州之地”，“当是时也，商君佐之”，把孝公看作秦国崛起的起点。

  孝公在位二十四年，秦国从一个被东方诸侯轻视的西方国家，成为能与魏、齐抗衡的强国。
sources: []
recalled:
  - 《史记·秦本纪》
  - 《史记·商君列传》
