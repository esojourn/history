name: 阿摩司
aliases: []
role: 先知
summary: 提哥亚的牧人，在耶罗波安二世年间向北国以色列说预言。
body: |-
  《阿摩司书》1:1 称他是提哥亚牧人中的一个，在犹大王乌西雅、以色列王约阿施的儿子耶罗波安在位的时候，大地震前二年得默示论以色列。提哥亚在犹大境内，他说预言的对象却主要是北国。他自述原不是先知，也不是先知的门徒，是牧人，又是修理桑树的；耶和华选召他，叫他不再跟从羊群，去向以色列民说预言（7:14–15）。他的生卒年圣经没有记载。

  全书先宣告大马士革、迦萨、推罗、以东、亚扪、摩押和犹大的罪，再转向以色列，责备其中欺压贫寒人、屈枉正直，在伯特利和吉甲献祭却不行公义的事，并预言以色列必被掳到大马士革以外（第 1—6 章）。第 7—9 章记有蝗虫、火、准绳、一筐夏天的果子等异象。

  伯特利的祭司亚玛谢打发人向耶罗波安王告发他图谋背叛，又叫他逃往犹大地去，不要再在伯特利说预言，因为那里有王的圣所。阿摩司以自己蒙召的经过作答，并宣告亚玛谢一家的结局（7:10–17）。书的末尾预言大卫倒塌的帐幕要重新建立（9:11–15）。他此后的经历和去世，圣经没有记载。
sources: []
recalled:
  - 《阿摩司书》第 1—9 章（蒙召自述见 7:10–17）
