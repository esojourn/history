name: 曹彬
aliases: [曹武惠]
role: 北宋大将、枢密使
summary: 北宋初年大将，统兵灭南唐，以约束部下、不妄杀著称；雍熙北伐时兵败岐沟关。
body: |-
  曹彬是真定灵寿人，生于后唐长兴二年（公元 931 年）。他的姨母是后周太祖郭威的贵妃，他由此在后周任职。宋朝建立后，乾德二年至三年（964—965 年）宋军伐后蜀，他任都监。据《宋史》本传，攻下成都后诸将多纵兵掳掠，只有曹彬约束部下，回朝时行囊里只有图书和衣物，赵匡胤因此更加器重他（另见“宋灭后蜀”条）。

  开宝七年（974 年）赵匡胤命他为主帅，率军攻打南唐。据《宋史》本传，金陵将要攻破时，曹彬忽然称病不理事，诸将来探望，他说自己的病不是药物能治好的，只要诸位发誓城破之日不乱杀一人，病就好了。诸将焚香立誓，次日城破，李煜出降（另见“宋灭南唐”条）。回朝后他升任枢密使。

  雍熙三年（986 年）宋太宗分三路北伐辽朝，曹彬率主力东路军进攻幽州。他先攻下涿州，因粮草不继退兵，后来又在诸将的催促下再次进军，在岐沟关被辽军大败，士卒死伤很多（另见“雍熙北伐”条）。战后他被降职，不久又被起用。咸平二年（999 年）他去世，追封济阳郡王，谥“武惠”。他的孙女后来成为宋仁宗的曹皇后。曹彬为人谦和谨慎，宋人把他看作宋初将领中不嗜杀、能约束部下的代表，后来配享赵匡胤庙庭。
sources: []
recalled:
  - 《宋史·曹彬传》
  - 《续资治通鉴长编》卷五至四十五
