name: 恩尼乌斯
aliases: [昆图斯·恩尼乌斯, 恩纽斯]
role: 罗马诗人
summary: 罗马诗人，以荷马的六音步格律写成史诗《编年纪》，被称为罗马诗歌之父。
body: |-
  昆图斯·恩尼乌斯，罗马诗人，公元前 239 年生于意大利东南部卡拉布里亚的鲁狄埃。那里是梅萨皮人的地方，通行奥斯坎语和希腊语。格利乌斯记载，他说自己有三颗心，因为他会说希腊语、奥斯坎语和拉丁语。

  第二次布匿战争期间他在撒丁岛的罗马辅助部队中服役。据奈波斯，前 204 年任财务官的老加图把他带到罗马。他住在阿文提诺山，靠教书和写剧本为生，与大西庇阿等贵族有交往。前 189 年执政官孚尔维乌斯·诺比利奥尔出征埃托利亚，带他随行；前 184 年诺比利奥尔的儿子为他取得罗马公民权。

  他的主要作品是史诗《编年纪》十八卷，从埃涅阿斯离开特洛伊写到他自己的时代。此前的拉丁诗人用本土的萨图尔努斯格律，他改用荷马的六音步格律，此后成为拉丁史诗的标准；他在序诗里说梦见荷马，荷马的灵魂转到了他身上。在维吉尔的《埃涅阿斯纪》出现之前，这部诗是罗马的民族史诗，现存约六百行残句。他还改编了二十多部希腊悲剧，多取自欧里庇得斯，另写有喜剧、杂咏和介绍希腊思想的作品。

  他于前 169 年去世。西塞罗常引用他的诗句；后人称他为罗马诗歌之父。
sources: []
recalled:
  - 西塞罗《布鲁图斯》《论老年》
  - 格利乌斯《阿提卡之夜》卷十七第 17、21 章
  - 奈波斯《加图传》
  - 恩尼乌斯《编年纪》残篇
