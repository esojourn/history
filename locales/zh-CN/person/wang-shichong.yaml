name: 王世充
aliases: [王行满, 郑帝]
role: 郑国皇帝
summary: 隋末据守东都的将领，击败李密后废杨侗称帝，国号郑，降唐后被仇人所杀。
body: |-
  王世充字行满，祖上是西域胡人，本姓支，父亲随母亲改嫁王氏，才改姓王。他通晓经史和律令，善于逢迎，得到隋炀帝的信任，任江都通守，在江淮一带镇压起事的民众。

  大业十三年（公元 617 年），李密的瓦岗军围攻东都洛阳，炀帝派王世充率军救援，双方相持很久。次年炀帝在江都被杀，洛阳的官员拥立越王杨侗为帝，王世充是辅政大臣之一。不久他发动政变，杀死同僚元文都等人，独揽大权。同年九月，他在邙山大败李密，收编了瓦岗军的不少将领，成为中原最强的势力之一。

  武德二年（619 年），他逼杨侗禅位，自称皇帝，国号郑，不久又杀害杨侗。他为政猜忌苛刻，部下多有叛去投唐的。武德四年（621 年），李世民率唐军围攻洛阳，他向窦建德求救，窦建德在虎牢兵败被擒后，他开城投降。唐高祖免他一死，把他流放到蜀地，他在长安等候启程时，被仇人独孤修德假借诏命杀死。
sources: []
recalled:
