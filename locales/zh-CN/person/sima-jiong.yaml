name: 司马冏
aliases: [齐王冏, 司马景治]
role: 齐王
summary: 晋武帝之侄，首倡起兵讨赵王伦，入洛辅政后专权，被长沙王乂攻杀。
body: |-
  司马冏字景治，是齐王司马攸的儿子、晋武帝的侄子，袭封齐王，生年不详。永康元年（公元 300 年）他参与赵王伦废黜贾后的行动，事后只得到游击将军的职位，心怀不满，不久出镇许昌。

  赵王伦称帝后，他在永宁元年（301 年）传檄各地起兵，成都王颖、河间王颙等响应。赵王伦败死，他率军进入洛阳，以大司马的身份辅政。《晋书·齐王冏传》说他大起府第，沉湎酒色，选官用人只凭亲近，朝臣屡次劝谏都不听。

  太安元年十二月（302 年底），河间王颙上表列举他的罪状，并声称以长沙王乂为内应。他派兵攻打长沙王乂，双方在洛阳城内交战三天，他兵败被擒，随即被杀，同党被夷三族。
sources: []
recalled:
  - 《晋书·齐王冏传》
  - 《资治通鉴》卷八十四
