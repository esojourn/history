name: 张弘范
aliases: [张仲畴]
role: 元朝将领
summary: 元朝将领，汉人世侯张柔之子，俘获文天祥，指挥崖山海战灭亡南宋。
body: |-
  张弘范字仲畴，易州定兴（今河北定兴）人，生于 1238 年，是金末元初汉人世侯张柔的第九子。他擅长骑射，也能作诗词。至元年间他随军围攻襄阳，率部切断襄阳与外界的联系，参与了襄阳之战（另见“襄阳之战”条），此后随伯颜沿江东下伐宋。

  至元十五年（1278 年）他被任为蒙古汉军都元帅，率水陆大军南下追击南宋的残余势力。这年十二月他的部下在海丰五坡岭俘获了文天祥。张弘范要文天祥写信招降张世杰，文天祥写下《过零丁洋》作答。至元十六年（1279 年）二月，他指挥元军在崖山大败宋军，陆秀夫背负赵昺投海，南宋灭亡（另见“崖山海战”条）。后世相传他在崖山刻石记功，后人在石上加刻一字作为讽刺，此说出自后世传闻。张弘范回到大都后不久就患病，至元十七年（1280 年）去世。
sources: []
recalled:
  - 《元史·张弘范传》
