name: "威廉三世"
aliases: ["奥兰治的威廉", "威廉三世"]
role: "荷兰执政、英格兰国王"
summary: "荷兰执政，1688 年应邀渡海逐走岳父詹姆士二世，与玛丽共登英国王位。"
body: |-
  威廉三世是“沉默者”威廉的曾孙，1650 年生于海牙，出生前八天父亲去世。1672 年法国入侵荷兰，他被推为执政，此后一生与法王路易十四为敌。1677 年他娶了英国约克公爵詹姆士的长女玛丽。

  《历史的轨迹》第三十一章称他是荷兰复原教主义的斗士。詹姆士二世即位后要在英国恢复天主教，英国人民在极度困境中向威廉求救；1688 年他率军从荷兰渡海而来，把岳父赶出英国，与玛丽一同加冕为英国的国王和王后，史称光荣革命。

  该书说，第二年詹姆士在法军援助下登陆爱尔兰，北爱尔兰的复原教徒站在威廉一边，称“奥兰治党”。1690 年两军在博因河决战，詹姆士一见败势就逃往法国，威廉虽然负伤，仍身先士卒（他是决战前一天被炮弹擦伤肩膀的）。作者说，威廉为复原教主义保全了荷兰、英国与美洲，此后再没有因复原教与天主教的分歧而引起的战争。这是作者的评价；此后欧洲的战争中仍常夹着宗教因素。

  第三十一、三十二章都说，他在位时国会通过了 1689 年的信仰容忍法案，复原派的不同意者从此可以公开崇拜；但有约四百名英国教会的教牧人员（含七位主教）不肯宣誓效忠新王，被革去教职。玛丽 1694 年去世，他独自在位到 1702 年，在伦敦坠马后不久病逝。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
recalled:
  - "1689 年《权利法案》"
