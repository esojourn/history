name: 约西亚
aliases: []
role: 南国犹大王
summary: 犹大王，八岁登基，因圣殿中发现律法书而清除偶像、守逾越节，死于米吉多。
body: |-
  犹大王亚们的儿子，母亲名叫耶底大。亚们作王二年，被臣仆杀在宫里；国民杀了背叛的人，立约西亚接续作王（《列王纪下》21:23–24）。据 22:1，他登基时八岁，在耶路撒冷作王三十一年；出生地圣经没有记载。

  据《列王纪下》22:3–20，约西亚王十八年，他差书记沙番去见大祭司希勒家，办理修理圣殿的银钱。希勒家告诉沙番，他在殿里得了律法书。沙番把书念给王听，王听了就撕裂衣服，差人去求问女先知户勒大。户勒大回话说，书上所写的灾祸必降在这地，但约西亚可以平平安安地归到坟墓，不致亲眼看见。王于是召集犹大和耶路撒冷的众民上到圣殿，把约书念给他们听，并在耶和华面前立约（23:1–3）。近代以来，许多学者认为这卷律法书与《申命记》有关。

  第 23 章接着记载，他把圣殿里为巴力、亚舍拉和天上万象所造的器皿搬出去烧掉，废去拜偶像的祭司，污秽了欣嫩子谷的陀斐特。他又到伯特利，拆毁耶罗波安所筑的坛和丘坛，把坟墓里的骸骨取出来烧在坛上，对从前预言此事的神人的坟墓则不许人动（23:15–18）。随后他吩咐众民照约书上所写的守逾越节；23:22 说，自从士师治理以色列的时候直到列王的时候，没有守过这样的逾越节。

  公元前 609 年，埃及法老尼哥北上往伯拉河去，约西亚出兵抵挡，在米吉多被杀，臣仆用车把他的尸首送回耶路撒冷安葬（《列王纪下》23:29–30）。《历代志下》35:20–24 记得较详：尼哥差人对他说此行不是要攻击他，约西亚不听，改装上阵，在米吉多平原中箭，被送回耶路撒冷后去世。和合本《列王纪下》23:29 说尼哥是去攻击亚述王，而据巴比伦的编年史，埃及这时是去援助亚述抵挡巴比伦的。国民立他的儿子约哈斯作王，三个月后约哈斯被尼哥废去，另一个儿子以利亚敬被立为王，改名约雅敬。
sources: []
recalled:
  - 《列王纪下》21:23—23:30
  - 《历代志下》第 34—35 章
  - 巴比伦编年史（那波帕拉萨尔在位年间部分）
