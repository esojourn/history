name: 高颎
aliases: [高昭玄, 独孤颎]
role: 尚书左仆射
summary: 隋文帝的首席宰相，主持伐陈，参与营建大兴城、制定户籍之法，后被隋炀帝处死。
body: |-
  高颎字昭玄，自称渤海蓨县人。父亲高宾是独孤信的僚佐，被赐姓独孤，所以他与独孤家关系密切。北周末年杨坚辅政，把他召到身边。大象二年（公元 580 年）尉迟迥在相州起兵，前线诸将互相观望，高颎自请前往监军，在沁水架桥进兵，随后平定了尉迟迥。

  隋朝建立后，他任尚书左仆射兼纳言，执掌朝政近二十年。开皇二年（582 年）营建新都大兴城，他总领其事。他向文帝提出“输籍法”，由国家定出各户应纳的税额，使依附豪强的人户愿意登记为国家编户（另见“大索貌阅与输籍法”条）。他又先后推荐了苏威、杨素、贺若弼、韩擒虎等人。据《隋书》本传，他还献策在江南收获季节反复声言出兵，使陈朝疲于应付，并派人焚烧陈朝的储积。

  开皇八年（588 年）伐陈，晋王杨广任行军元帅，高颎任元帅长史，实际主持军务。次年攻入建康后，杨广派人要求留下陈后主的宠妃张丽华，高颎以周武王灭商后杀妲己为由，把她斩首，杨广由此怀恨。

  后来文帝和独孤皇后想废太子杨勇，高颎的儿子娶了杨勇的女儿，他又认为长幼有序，不可轻易废立，因此与帝后疏远。据《隋书》，独孤皇后得知他称自己为“一妇人”后，更加不满。开皇十九年（599 年），他被罢免官职，以齐公的身份回家。

  炀帝即位后起用他为太常卿。大业三年（607 年）炀帝北巡，厚待突厥启民可汗，高颎私下议论朝政奢靡，被人告发，与贺若弼、宇文弼一同被杀，年六十七。据《隋书》本传，天下人都为他的死感到冤屈。
sources: []
recalled:
  - 《隋书·高颎传》
  - 《资治通鉴》卷一百七十五至一百八十
