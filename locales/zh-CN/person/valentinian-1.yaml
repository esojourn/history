name: 瓦伦提尼安一世
aliases: [瓦伦丁尼安一世, 华伦提年一世, 瓦伦提尼安]
role: 罗马皇帝
summary: 西部的罗马皇帝，瓦伦斯之兄，一生在莱茵河、多瑙河边防作战筑垒。
body: |-
  瓦伦提尼安一世于公元 321 年生在潘诺尼亚的基巴莱，父亲是行伍出身的将领。364 年 2 月皇帝约维安暴卒，军中将领在尼西亚推举了他。一个月后，他在君士坦丁堡立弟弟瓦伦斯同为皇帝，让他治东方，自己到西部，先驻米兰、巴黎，367 年起长驻特里尔。

  他在位十一年多，大半用在边防上。阿勒曼尼人几次越过莱茵河，他亲自渡河反击，又沿莱茵河和多瑙河上游修了一连串堡垒和瞭望塔，这是罗马在西部最后一次大规模经营边防。367 年不列颠同时遭到几路入侵，他派大将狄奥多西去收拾局面；这位将军就是后来的皇帝狄奥多西一世的父亲。他是尼西亚派的基督徒，在教义争论中不偏袒哪一方，也不干涉异教的祭祀。

  阿米阿努斯说他性情暴烈，用刑严酷。375 年 11 月 17 日，他在多瑙河边的布里格提奥接见夸迪人的使者，听了对方的辩解后勃然大怒，当场中风而死。长子格拉提安此前已被他立为皇帝。
sources: []
recalled:
  - 阿米阿努斯·马尔凯利努斯《历史》卷 26—30（卷 30 第 6—9 章）
  - 佐西莫斯《新历史》卷 3 第 36 章、卷 4 第 1—17 章
  - 《狄奥多西法典》卷 9 第 16 章第 9 条
