name: 维特利乌斯
aliases: [奥卢斯·维特利乌斯, 维提里乌斯]
role: 罗马皇帝
summary: 公元 69 年由莱茵河军团拥立的皇帝，同年年底在罗马被杀。
body: |-
  维特利乌斯生于公元 15 年，父亲三次出任执政官，是克劳狄朝的重臣。他本人 48 年任执政官，做过阿非利加总督。68 年年底，加尔巴派他去统领下日耳曼的军团。

  69 年 1 月初，莱茵河的军团在科隆拥立他为皇帝。他的部将凯基纳和瓦伦斯领兵南下，4 月在贝德里亚库姆打败奥托。他夏天才到罗马，把原来的禁卫军解散，换上自己的日耳曼军团士兵。苏维托尼乌斯着力写他贪吃和挥霍，说他一天要摆几次宴席。

  7 月 1 日，东方的军团在亚历山大城拥立韦斯巴芗。多瑙河的军团不等东方兵到就攻进意大利，10 月在贝德里亚库姆再次获胜，洗劫了克雷莫纳。12 月维特利乌斯想退位，部下不答应；两派在罗马城内交战，卡皮托山上的朱庇特神庙被烧毁。12 月 20 日前后敌军入城，他被拖到街上杀死，尸体抛进台伯河。
sources: []
recalled:
  - 塔西佗《历史》卷 2—3
  - 苏维托尼乌斯《罗马十二帝王传·维特利乌斯传》
  - 卡西乌斯·狄奥《罗马史》卷 64—65
