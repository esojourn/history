name: 陈后主
aliases: [陈叔宝, 长城公]
role: 皇帝
summary: 陈朝最后一位皇帝，荒于政事，589 年隋军攻入建康时被俘。
body: |-
  陈叔宝是陈宣帝陈顼的长子，梁承圣二年（公元 553 年）生于江陵。太建十四年（582 年）宣帝去世，他即位，丧礼上被弟弟陈叔陵砍伤颈部，幸而没有致命。

  他在位期间不理政事，大兴土木。至德二年（584 年），他在光昭殿前建起临春、结绮、望仙三座高阁，自己住临春阁，张贵妃住结绮阁，龚、孔二贵嫔住望仙阁。他宠信江总、孔范、施文庆等人，每天与妃嫔和文士饮酒赋诗，创作了《玉树后庭花》等艳曲。朝政败坏，民力困乏。

  此时北方已由隋朝统一。开皇八年（588 年）冬，隋文帝以晋王杨广为统帅，分兵八路伐陈。据《隋书》，隋军总数五十一万八千人。陈后主自恃长江天险，没有认真防备。次年正月，隋将贺若弼、韩擒虎分别从京口、采石渡江，攻入建康。他与张贵妃、孔贵嫔躲进景阳殿的一口井里，被隋军用绳子拉了出来，陈朝灭亡（另见“隋灭陈”条）。

  他被押送到长安，隋文帝待他颇为优厚。据《隋书》，他曾请求给自己一个官号，文帝说“叔宝全无心肝”。仁寿四年（604 年），他在洛阳去世，年五十二，隋朝追赠长城县公，谥号为“炀”。唐代杜牧的诗句“商女不知亡国恨，隔江犹唱后庭花”，说的就是他的故事。
sources: []
recalled:
