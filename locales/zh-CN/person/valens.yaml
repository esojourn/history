name: 瓦伦斯
aliases:
  - 华伦斯
role: 罗马皇帝
summary: 东部的罗马皇帝，准许哥特人渡过多瑙河，公元 378 年在阿德里安堡战败身亡。
body: |-
  瓦伦斯约在公元 328 年生于潘诺尼亚的基巴莱。公元 364 年，他的哥哥瓦伦提尼安一世被军队立为皇帝，随即立他为共治皇帝，让他治理东部。

  他在教会事务上支持亚流派中较温和的一支，放逐了不少坚持尼西亚信经的主教，亚他那修最后一次离开亚历山大就在他手下。他曾派人威逼该撒利亚的巴西流，没有成功。

  公元 376 年，西哥特人受匈人逼迫，请求渡过多瑙河进入帝国，他同意了。罗马官员在安置中克扣粮食，哥特人起而反抗。378 年 8 月 9 日，他没有等西部的援军到达，就在阿德里安堡城外与哥特人交战，全军溃败，他本人战死，尸体没有找到。《历史的轨迹》第七章把这件事作为蛮族进入帝国的开端。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 阿米阿努斯《历史》卷 31
  - 苏格拉底《教会史》卷 4
  - 拿先斯的贵格利《讲章》第 43 篇
