name: "克里斯蒂安·大卫"
aliases: ["克利斯丁大卫"]
role: "莫拉维弟兄会的木匠"
summary: "摩拉维亚木匠，带领弟兄会余民到亲岑多夫的地产避难，建成赫恩胡特。"
body: |-
  克里斯蒂安·大卫 1692 年生于摩拉维亚的森夫特莱本，原是天主教徒，做木匠，后来接触到路德派的信仰，成为敬虔派信徒。《历史的轨迹》第三十四章说，他多年努力把弟兄合一会的余民聚在一处，并请求亲岑多夫准许这批“隐藏的种子”到贝特尔斯多夫避难；亲岑多夫并不认识弟兄合一会，只知道他们为信仰受逼迫，出于同情答应了。

  该书说，1722 年他得到准许，带两个弟兄会家庭过去；到 1727 年已有几百位弟兄会信徒住进来，建起赫恩胡特。据一般记载，他亲手砍下了建第一座房子的第一棵树，此后多次潜回摩拉维亚接人出来。1733 年他随首批宣教士去了格陵兰。他 1751 年死于赫恩胡特。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十四章“敬虔主义 莫拉维弟兄会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter38.html"
