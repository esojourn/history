name: 曹植
aliases: [曹子建, 陈思王]
role: 诗人、诸侯王
summary: 曹操之子，建安时期最负盛名的诗人，曹丕即位后屡遭贬徙，郁郁而终。
body: |-
  据《三国志·魏书·陈思王植传》，曹植字子建，是曹操与卞氏所生之子、曹丕的同母弟。本传说他十多岁就能诵读诗、论和辞赋数十万字，善于写文章。邺城的铜雀台建成，曹操让儿子们登台作赋，曹植提笔立成，曹操很是惊异。他先后被封为平原侯、临菑侯。

  曹操几次想立他为继承人，杨修、丁仪、丁廙等人也为他出力。但本传说他“任性而行，不自雕励，饮酒不节”。他曾乘车在只有天子才能使用的驰道上行驶，并私开司马门而出，曹操大怒，此后对他的宠爱日渐减少。建安二十四年（公元 219 年）曹仁被关羽围困，曹操想派曹植领兵去救，他喝醉了不能受命。

  曹丕即位后，杀了丁仪兄弟，命诸侯都回到各自的封国。曹植受到监国使者的弹劾，被贬为安乡侯，此后封地屡次迁改，先后为鄄城王、雍丘王、东阿王、陈王。明帝时他多次上书，希望得到任用，都没有结果。太和六年（232 年）他在陈去世，终年四十一，谥号为“思”。

  他的作品有《洛神赋》《白马篇》《赠白马王彪》等。南朝钟嵘的《诗品》把他列为上品，评他“骨气奇高，词采华茂”。流传很广的“七步诗”故事出自南朝的《世说新语》，不见于本传，是否属实已难确定。
sources: []
recalled:
