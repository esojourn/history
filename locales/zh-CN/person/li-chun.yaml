name: 李春
aliases: []
role: 工匠
summary: 隋朝工匠，相传主持建造了赵县安济桥（赵州桥），生平几乎不见于史籍。
body: |-
  李春的生平几乎不见于史籍，史料所载仅此：唐代开元年间，张嘉贞写的《石桥铭序》说，赵郡洨河上的石桥是“隋匠李春之迹也”，构造奇特，人们不知道是怎样建成的。后人据此把赵州桥的建造归于李春，这座桥大约建成于隋朝开皇、大业年间（公元 6 世纪末至 7 世纪初）。

  这座桥今称安济桥，俗称赵州桥，至今仍在河北赵县。它是一座单孔石拱桥，主拱是一段较平的圆弧，而不是半圆；主拱两肩上又各开两个小拱，这种做法称为“敞肩拱”，既减轻了桥身重量，也便于洪水通过。据现代测量，主拱跨度约三十七米。它是世界上现存最早的敞肩石拱桥之一，经历了多次地震和洪水仍然保存下来。
sources: []
recalled:
  - 张嘉贞《石桥铭序》（见《全唐文》）
