name: "卜威廉"
aliases: ["威廉·布斯", "卜维廉"]
role: "救世军创始人"
summary: "原循道派牧师，在伦敦东区向贫民布道，1878 年把差会改组为救世军。"
body: |-
  卜威廉 1829 年生于诺丁汉，少年时在当铺做学徒，在循道派中归信，后来到伦敦，做过循道派新联会的牧师。他与妻子凯瑟琳都热心布道，他们辞去牧职，做独立的巡回布道家。

  《历史的轨迹》第三十八章说，救世军由一位前循道派牧师卜威廉发起，他先在威尔士的卡迪夫带起一场成功的复兴，后来在英国开展类似的工作，到 1878 年发展成军事形式的组织，称救世军。一般的记载是：1865 年他在伦敦东区的帐篷里开始布道，成立“基督徒布道团”，1878 年改名救世军，他自任“大将”。书中先在卡迪夫的说法与此不同，两说并存。

  该书说，救世军不是教会，专做慈善和街头布道，几乎每个城市都有中心，收容孤苦无家的人，也举行福音聚会；当时已在八十一个国家设立。1890 年他出版《最黑暗的英格兰及其出路》，提出收容所、职业介绍、移民垦殖等计划。他 1912 年在伦敦去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十八章“德国与英国的宗教生活” https://wellsofgrace.com/books/spiritual/2000years/html/chapter42.html"
recalled:
  - "布斯《最黑暗的英格兰及其出路》（1890 年）"
