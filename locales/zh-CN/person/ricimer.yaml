name: 里西梅尔
aliases: [李希梅尔, 里基梅尔, 弗拉维乌斯·里西梅尔]
role: 西罗马统帅
summary: 蛮族出身的西罗马统帅，十六年间先后废立四位皇帝。
body: |-
  里西梅尔约生于公元 418 年，父亲是苏维汇人的王族，母亲是西哥特王瓦利亚的女儿。他在埃提乌斯麾下从军，与马约里安是同僚。456 年他在西西里和科西嘉击败汪达尔人，升任统帅，同年与马约里安一起推翻皇帝阿维图斯，次年得到“贵族”头衔。因为他终身是罗马的将领，本站没有给他标蛮族的派别。

  他是蛮族出身，又信阿里乌派，自己做不了皇帝，便立别人来做。461 年他处死不肯受他摆布的马约里安，立了利比乌斯·塞维鲁；465 年塞维鲁死后，皇位空了一年多，东部朝廷派来安特米乌斯，里西梅尔娶了他的女儿。468 年东西两部合力讨伐汪达尔人，大败而回，两人随即反目。

  472 年他围困罗马五个月，城破后安特米乌斯被杀，他改立奥利布里乌斯。四十天后，8 月 18 日，他自己也病死了。高卢北部和达尔马提亚的罗马将领一直不肯听命于他，西部朝廷实际能管的只剩意大利。
sources: []
recalled:
  - 普里斯库斯《历史》残篇
  - 安条克的约翰残篇第 202—209 条
  - 西多尼乌斯·阿波利纳里斯《安特米乌斯颂》
  - 约达尼斯《哥特史》第 45 章
