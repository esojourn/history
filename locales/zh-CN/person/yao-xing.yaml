name: 姚兴
aliases: [姚子略, 后秦文桓帝]
role: 后秦君主
summary: 姚苌之子，灭前秦余部，一度称雄关陇，迎鸠摩罗什到长安译经，晚年国势转衰。
body: |-
  姚兴字子略，是姚苌的长子。太元十九年（公元 394 年）他继位后不久，就在关中击败并杀死前秦的苻登，结束了两秦多年的对峙。此后几年他向东取得洛阳和淮河、汉水以北各郡，向西使陇右的西秦和河西的几个凉国先后降附，是当时西北最强的势力。

  《晋书·载记》说他留意政事，下令释放因饥荒卖身为奴的百姓，在长安设立律学培养司法官吏，又礼遇从各地来的儒者，让他们聚徒讲学。他笃信佛教，弘始三年（401 年）击败后凉以后，把滞留凉州多年的鸠摩罗什迎到长安，请他主持译经，自己也常去听讲。载记说当时关中各州郡信佛的人家十有其九。

  他在位的后半期形势转坏：弘始四年（402 年）在柴壁被北魏打得大败；他一向厚待的匈奴人赫连勃勃在弘始九年反叛，建立夏国，连年袭扰北部边境；河西各国也相继脱离。他晚年多病，几个儿子争夺继承权，国内不安。弘始十八年（416 年）他去世，时年五十一。儿子姚泓继位的第二年，后秦被东晋的刘裕灭亡。
sources: []
recalled:
  - 《晋书·姚兴载记》
  - 《资治通鉴》卷一百零八至一百一十七
