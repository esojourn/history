name: 高允
aliases: [高伯恭]
role: 大臣
summary: 北魏大臣，与崔浩共修国史，国史之狱中直言不讳而得免。
body: |-
  高允字伯恭，渤海蓨人，少年丧父，曾一度出家为僧，不久还俗。他博通经史，精于天文历算。神䴥四年（公元 431 年），太武帝征召北方各地的名士，他应征到了平城，后来与崔浩一起修撰国史。

  太平真君十一年（450 年）国史之狱发生，太子拓跋晃曾跟他学过经书，想保护他，教他在太武帝面前推说国史都是崔浩写的。据《魏书》本传，他见到太武帝后却照实说，自己写的部分比崔浩还多。太武帝认为他诚实正直，赦免了他，据说也因他的劝谏减少了株连。

  此后他历事文成、献文、孝文诸帝，官至中书令，参与修订律令，建议在各郡设立学校。太和十一年（487 年）去世，年九十八。
sources: []
recalled:
  - 《魏书·高允传》
