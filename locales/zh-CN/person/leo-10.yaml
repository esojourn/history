name: "利奥十世"
aliases: ["乔万尼·德·美第奇", "良十世"]
role: "罗马教皇"
summary: "出身美第奇家族的教皇，为建圣彼得大教堂发售赎罪券，1521 年开除路德教籍。"
body: |-
  利奥十世本名乔万尼·德·美第奇，1475 年生于佛罗伦萨，是“豪华者”洛伦佐的次子。他十三岁就被内定为枢机，受的是人文学者的教育。1494 年美第奇家族被逐出佛罗伦萨，他在外流亡多年，1512 年家族复位，次年他三十七岁当选教皇。

  他在位期间罗马的文艺极盛，拉斐尔为他作画，圣彼得大教堂继续修建，教廷开支浩大。《历史的轨迹》第二十九章说他举止高雅、生活检点，却很世俗，引他当选后的话：“现在让我们来享受教皇职位吧。”这句话出自当时威尼斯使节的转述，是否他的原话无从确定。为筹款他准许美因茨大主教在德意志发售赎罪券。

  九十五条论纲送到罗马，他起初没有当回事，只叫奥古斯丁会约束路德。1518 年他传路德到罗马受审，因萨克森选侯出面，改由迦耶坦在奥格斯堡审问。该书第二十二章说，这时皇帝马克西米连将死，教皇不愿哈布斯堡家的查理当选，想拉拢萨克森选侯，路德的案子因此搁了一年多。

  1519 年查理当选以后，艾克到罗马催办。1520 年 6 月 15 日利奥签发诏书《主啊，求你起来》，列举路德的四十一条论点，限六十天内收回。路德把诏书烧了，1521 年 1 月 3 日教皇正式开除他的教籍。同年 10 月他因英王亨利八世著书驳路德，赐给“信仰的护卫者”称号。12 月 1 日他在罗马突然病死，身后教廷负债累累。
sources:
