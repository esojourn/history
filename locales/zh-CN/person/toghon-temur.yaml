name: 元顺帝
aliases: [妥懽帖睦尔, 元惠宗]
role: 元朝末代皇帝
summary: 元朝最后一位统治中国的皇帝，在位期间红巾军起义，1368 年明军逼近大都时北走。
body: |-
  妥懽帖睦尔是元明宗的长子，生于延祐七年（公元 1320 年）。明宗被弟弟元文宗害死后，他先被流放到高丽的大青岛，后来又移居静江（今广西桂林）。元宁宗在位不到两个月就去世，元统元年（1333 年）他被迎回大都即位，这时他十四岁。

  即位之初，朝政由权臣伯颜把持。至元六年（1340 年）他依靠伯颜的侄子脱脱把伯颜逐出朝廷，随后任用脱脱为相，改元至正，恢复科举，修辽、金、宋三史，史称“至正更化”。至正十一年（1351 年）朝廷征发大批民夫治理黄河，又变更钞法，同年韩山童、刘福通领导红巾军起义，各地起兵者蜂起（另见“红巾军起义”条）。至正十四年（1354 年）脱脱在高邮围攻张士诚，顺帝听信谗言将他罢免，元军随即溃散（另见“高邮之战”条）。

  此后顺帝怠于政事，据说沉迷于宫中的宗教仪式和机械制作，朝廷内部又有太子与权臣之间的倾轧，各地将领孛罗帖木儿、扩廓帖木儿等人相互攻战，元朝对南方失去了控制。

  至正二十八年（1368 年）正月朱元璋在应天称帝，派徐达北伐。闰七月明军逼近大都，顺帝带着后妃、太子从健德门出城，逃往上都，明军随即进入大都，元朝在中原的统治结束（另见“明朝建立”条）。次年上都也被明军攻下，他退到应昌，洪武三年（1370 年）四月在应昌去世。明朝认为他顺应天命、退出中原，给了他“顺帝”的称号；北元给他的庙号是惠宗。
sources: []
recalled:
  - 《元史·顺帝本纪》
  - 权衡《庚申外史》
