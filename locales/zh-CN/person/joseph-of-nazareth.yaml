name: 约瑟
aliases:
  - 拿撒勒的约瑟
  - 木匠约瑟
role: 马利亚的丈夫
summary: 大卫的后裔，拿撒勒的木匠，马利亚的丈夫，抚养耶稣长大。
body: |-
  约瑟是大卫的后裔，住在加利利的拿撒勒，以木匠为业（太 13:55）。他的生年没有记载。《马太福音》1:16 说他的父亲名叫雅各，《路加福音》3:23 则称他是希里的儿子，两处家谱从大卫以下所列的人名大多不同，福音书没有作解释。

  据《马太福音》1:18–25，马利亚许配给他以后，还没有迎娶就怀了孕；约瑟想要暗暗地把她休了。主的使者在梦中向他显现，告诉他所怀的孕是从圣灵来的，他就把妻子娶过来，孩子生下后起名叫耶稣。据《路加福音》2:1–5，该撒亚古士督降旨叫人报名上册，约瑟带着马利亚从拿撒勒上伯利恒去，耶稣就生在那里。马太又记他两次在梦中得指示：先是带着孩子和母亲逃往埃及，躲避希律；希律死后回来，因为亚基老在犹太作王，就往加利利去，住在拿撒勒（太 2:13–23）。

  约瑟最后一次出现，是耶稣十二岁时全家上耶路撒冷守逾越节（路 2:41–51）。耶稣出来传道以后，福音书只在别人称耶稣为约瑟的儿子时提到他的名字，不再记他的活动；一般据此推测那时他已经去世，但圣经没有记载他去世的时间和地点。
sources: []
recalled:
  - 《马太福音》第 1—2 章、13:55
  - 《路加福音》第 2 章、3:23、4:22
  - 《约翰福音》1:45、6:42
