name: 秦二世
aliases: [胡亥, 二世皇帝]
role: 皇帝
summary: 名胡亥，始皇少子，沙丘之变后即位，在位三年，被赵高逼迫自杀。
body: |-
  胡亥是秦始皇的少子，出生地史无记载。《史记·秦始皇本纪》正文说他二世元年即位时“年二十一”，据此生于公元前 230 年；同篇末尾所附的秦世系却说“二世生十二年而立”，两说不一。始皇三十七年（前 210 年）出巡，胡亥请求随行，得到允许。始皇死于沙丘，中车府令赵高与丞相李斯伪造诏书立他为太子，赐死长兄扶苏；车驾回到咸阳后发丧，胡亥即位为二世皇帝。

  即位后他任赵高为郎中令，听从其计，诛杀大臣和兄弟姊妹：《秦始皇本纪》记六公子被杀于杜，《李斯列传》说公子十二人死于咸阳市、公主十人死于杜。他东巡郡县，继续修建阿房宫。二世元年（前 209 年）七月，陈胜等在大泽乡起事，各地纷纷响应。此后右丞相冯去疾、将军冯劫自杀，李斯被处死，政事都由赵高决定。

  二世三年（前 207 年），秦军主力在巨鹿战败，章邯降楚。八月赵高指鹿为马，随后派女婿阎乐率兵闯入望夷宫。二世请求见丞相、降为一郡之王乃至做平民，都被拒绝，于是自杀，以平民之礼葬于杜南宜春苑。
sources:
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
  - 《史记·李斯列传》 https://zh.wikisource.org/wiki/史記/卷087
