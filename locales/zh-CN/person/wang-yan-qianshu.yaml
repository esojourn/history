name: 王衍
aliases: [王宗衍, 前蜀后主]
role: 前蜀皇帝
summary: 王建的幼子，918 年即位，荒于游乐，925 年后唐军入蜀时投降，次年被杀。
body: |-
  王衍是王建的幼子，原名王宗衍，母亲是徐贤妃。光天元年（公元 918 年）王建去世，他即位，史称前蜀后主。他喜好诗文，但即位后沉溺于游乐宴饮，大兴土木，修建宫苑，常常带着宫人出游，政事交给宦官和亲信。他的母亲徐太后和姨母徐太妃干预朝政，卖官鬻爵。

  同光三年（925 年）九月，后唐庄宗派李继岌、郭崇韬率军伐蜀，前蜀军队一路溃败，十一月王衍在成都出降，前蜀灭亡（另见“后唐灭前蜀”条）。次年，王衍和他的宗族被押往洛阳，走到秦川驿时，庄宗听信伶人景进的话，担心他们日后作乱，下令把王衍及其亲族全部杀死。据史书，王衍的母亲临刑前斥责庄宗失信。不久庄宗自己也死于兵变。
sources: []
recalled:
