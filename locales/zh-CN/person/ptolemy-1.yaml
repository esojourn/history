name: 托勒密一世
aliases: [救主托勒密, 托勒密·索特尔]
role: 埃及国王
summary: 亚历山大的部将，据有埃及并建立托勒密王朝，创设亚历山大的博学园和图书馆。
body: |-
  马其顿人，拉古斯之子，母亲阿尔西诺伊，约生于公元前 367 年，他的王朝因此也称拉吉德王朝。后世有他实为腓力二世之子的说法，是王朝建立后才出现的。他是亚历山大少年时的朋友，前 337 年因卷入亚历山大与卡里亚总督联姻一事被腓力流放，亚历山大即位后召回。前 330 年他升为近身护卫官，次年受命追捕并押回杀害大流士的贝苏斯，此后在巴克特里亚和印度多次独立领兵。

  前 323 年亚历山大去世，他在分封中要了埃及。到任后他除掉原来掌管财政的克列奥美涅斯，次年把西面的昔兰尼加并入治下。亚历山大的灵柩运往马其顿途中，他在叙利亚把它截下，先安葬在孟菲斯，后来移到亚历山大城。摄政佩尔狄卡斯为此进攻埃及，在尼罗河边受挫，被部下所杀；据狄奥多罗斯，军队想请托勒密接任摄政，他没有接受。

  此后四十年他始终以埃及为根本，向外只取叙利亚南部、塞浦路斯和昔兰尼加等屏障之地。前 312 年他与塞琉古在迦萨击败德米特里。前 306 年他的舰队在塞浦路斯的萨拉米斯惨败，丢了该岛，同年却挡住了安提柯对埃及的进攻。前 305 年或前 304 年他称王，并按埃及的方式做了法老。罗得岛被围时他运粮接济；“救主”这个称号，保萨尼亚斯说是罗得岛人所赠，现代学者对此有怀疑。前 301 年他没有参加伊普苏斯的决战，却占了叙利亚南部，塞琉古王朝始终不承认，这是后来历次“叙利亚战争”的由来。据约瑟夫斯转述，他曾趁安息日占领耶路撒冷，并把许多犹太人迁到埃及。

  他把都城定在亚历山大城，在上埃及建了希腊式的城市托勒密城，推行融合希腊与埃及成分的塞拉皮斯神崇拜。博学园（缪斯宫）和附设的图书馆一般认为创始于他在位的末期，出主意的据说是流亡来的法勒隆的德米特里。几何学家欧几里得在他在位时在亚历山大城教学。他晚年写了一部亚历山大东征史，原书已佚，是阿里安《亚历山大远征记》的两种主要依据之一。

  前 285 年他立贝勒尼基所生的儿子为共治者，即托勒密二世，前妻欧律狄刻所生的长子托勒密·克劳诺斯出走。他在前 283 年或前 282 年去世，享年八十余岁，是继业者中唯一善终于床榻的一位。
sources: []
recalled:
