name: 王敦
aliases: [王处仲]
role: 大将军
summary: 王导的堂兄，东晋初年都督上游军事，两次起兵进逼建康，第二次途中病死。
body: |-
  王敦字处仲，琅邪临沂人，是王导的堂兄，娶晋武帝的女儿襄城公主为妻。西晋末年他历任青州、扬州刺史，随后追随司马睿，与王导一内一外支撑起江东的局面。他督率诸将平定了江州的华轶和湘州的杜弢，升为大将军、江州牧，驻在武昌，长江中上游的军政都归他掌握。

  晋元帝即位后任用刘隗、刁协削弱王氏，又派亲信出镇以防备他。永昌元年（公元 322 年）正月，他以讨伐刘隗为名在武昌起兵，三月攻入建康的石头城，杀了周顗、戴渊等人。元帝被迫任他为丞相，他没有入朝，回到武昌遥控朝政。第二年他移镇离建康更近的姑孰。

  太宁二年（324 年）他病重，晋明帝下诏讨伐。他派兄长王含和亲信钱凤等率军进攻建康，在秦淮河一带被朝廷军队击败。他在军营中病死，时年五十九。叛乱平定后，朝廷把他的尸体掘出斩首示众，王导等王氏族人没有受到牵连。
sources: []
recalled:
