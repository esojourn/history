name: 安尼克托
aliases:
  - 亚尼斯德
role: 罗马主教
summary: 二世纪中叶的罗马主教，曾与坡旅甲商议复活节日期。
body: |-
  安尼克托约在公元 154 年至 166 年间任罗马主教。《历史的轨迹》说罗马的第一位（专制）主教"似乎是"安尼克托，并说明主教制是逐渐形成的，罗马比安提阿、士每拿等地晚。按教会传统的名单，他在罗马主教中排在第十位左右；名单的早期部分是否可靠，学界看法不一。

  据爱任纽的信（优西比乌《教会史》卷 5 第 24 章所引），士每拿的坡旅甲在他任内到罗马访问，两人就复活节应守在哪一天交换意见：亚西亚的教会按犹太历尼散月十四日守，罗马按星期日守。两人都没有说服对方，但仍保持相交，安尼克托请坡旅甲在会中主持圣餐。他的其余事迹史料所载很少。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三章“教会内部的成长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter04.html"
recalled:
  - 爱任纽致维克多的信，见优西比乌《教会史》卷 5 第 24 章
  - 爱任纽《驳异端》卷 3 第 3 章第 3 节
