name: 小阿格里皮娜
aliases: [阿格里皮娜, 尤利娅·阿格里皮娜, 小阿格丽品娜]
role: 克劳狄之妻、尼禄之母
summary: 日耳曼尼库斯之女，克劳狄的妻子，尼禄的母亲，被尼禄派人杀死。
body: |-
  小阿格里皮娜于公元 15 年 11 月 6 日生在莱茵河边乌比人的城里，是日耳曼尼库斯和大阿格里皮娜的女儿、卡利古拉的妹妹。公元 50 年那里设为殖民地，用她的名字命名，就是后来的科隆。28 年她嫁给多米提乌斯·阿赫诺巴尔布斯，37 年生下尼禄。39 年卡利古拉以参与阴谋的罪名把她流放，克劳狄即位后召回。

  49 年她嫁给叔父克劳狄，元老院为此专门改了法律。次年她得到“奥古斯塔”称号，让克劳狄收养尼禄，又召回塞涅卡做尼禄的老师，安排布鲁斯出任禁卫军长官。54 年克劳狄去世，古代作家都说是她下的毒。

  尼禄即位之初，她的权势极大，头像与皇帝并列在钱币上；不久母子失和，她被迁出皇宫。59 年 3 月，尼禄先用一条会散架的船在那不勒斯湾谋害她，她游上了岸，随后被派去的军官杀死在巴亚附近的别墅里。她写过回忆录，塔西佗引用过，今已不存。
sources: []
recalled:
  - 塔西佗《编年史》卷 12—14（卷 14 第 1—9 章）
  - 苏维托尼乌斯《罗马十二帝王传·尼禄传》第 34 章
  - 卡西乌斯·狄奥《罗马史》卷 61
