name: 唐玄宗
aliases: [李隆基, 唐明皇, 临淄王]
role: 皇帝
summary: 唐朝皇帝，前期有“开元之治”，后期怠于政事，755 年安史之乱爆发。
body: |-
  李隆基是唐睿宗的第三子，垂拱元年（公元 685 年）生于东都洛阳，封临淄王，幼年时母亲窦氏被武则天秘密处死。景龙四年（710 年）中宗暴卒，韦后专权，他与姑母太平公主联合，率羽林军攻入宫中，诛杀韦后和安乐公主，拥立父亲睿宗复位，自己被立为太子（另见“唐隆政变”条）。延和元年（712 年）睿宗传位给他。次年七月他发兵诛杀太平公主一党，掌握了全部权力，改元开元（另见“先天政变”条）。

  开元年间，他先后任用姚崇、宋璟、张说、张九龄等人为相，整顿吏治，裁减冗官，抑制佛寺和僧尼的增长，清查逃户，兴修水利，国力达到唐朝的鼎盛，史称“开元之治”（另见该条）。杜甫在《忆昔》诗中描写开元全盛时“稻米流脂粟米白，公私仓廪俱丰实”。这一时期也是唐代文化的高峰，李白、王维、孟浩然等诗人都活跃于此时。他本人精通音乐，设梨园教习乐工歌舞。

  与此同时，府兵制逐渐瓦解，朝廷改用募兵，在边境设置节度使，统领大量常备军队（另见“节度使设置”条）。开元后期他渐渐怠于政事，开元二十四年（736 年）罢免张九龄，此后李林甫为相十九年，排斥异己。天宝四载（745 年），他册立原为儿媳的杨玉环为贵妃，杨氏一门显贵，堂兄杨国忠在李林甫死后继任宰相。他又宠信身兼平卢、范阳、河东三镇节度使的安禄山。

  天宝十四载（755 年）十一月，安禄山在范阳起兵，很快攻陷洛阳（另见“安史之乱”条）。次年六月潼关失守，他仓皇出逃，在马嵬驿随行将士杀死杨国忠，逼他缢死杨贵妃（另见“马嵬驿之变”条）。他继续逃往成都，太子李亨在灵武即位，尊他为太上皇。至德二载（757 年）长安收复后他回到长安，起初住在兴庆宫，后被宦官李辅国强迁到太极宫，亲信高力士等人被流放。宝应元年（762 年）四月他在神龙殿去世，年七十八。后世诗文、戏曲中他与杨贵妃的故事很多，如白居易的《长恨歌》。
sources: []
recalled:
  - 《旧唐书·玄宗纪》
  - 《新唐书·玄宗纪》
  - 《资治通鉴》卷二百九至二百二十二
