name: 李泌
aliases: [李长源, 邺侯]
role: 谋臣、宰相
summary: 历仕玄宗至德宗四朝的谋臣，安史之乱中以布衣身份辅佐唐肃宗，晚年任宰相。
body: |-
  李泌字长源，开元十年（公元 722 年）生于长安。据史书，他七岁就能作文，受到唐玄宗和宰相张说、张九龄的赏识。成年后他喜好道家，游历名山。天宝年间他向玄宗上书议论时政，被召入翰林院，与太子李亨交好，后来因作诗讽刺杨国忠等人，被安置到蕲春，于是隐居。

  天宝十五载（756 年）唐肃宗在灵武即位，召他前来。他不肯接受官职，以“山人”的身份参与机密，与肃宗同行同住，时人称他“白衣山人”。据《资治通鉴》，他建议先派兵直取叛军的老巢范阳，再收复两京，肃宗急于收复长安，没有采纳。两京收复后，他受到李辅国等人的忌恨，请求离去，到衡山隐居。

  唐代宗即位后召他回朝，宰相元载排挤他，他又被外放；代宗死后，他历任杭州刺史等职。唐德宗在奉天之难后召他到身边，贞元三年（787 年）任宰相，封邺县侯。他劝德宗与回纥和亲，并联络南诏、大食、天竺，共同牵制吐蕃（另见“南诏归唐”条）。德宗一度想废掉太子李诵，他极力劝谏，保全了东宫。他还建议在关中屯田，恢复府兵。贞元五年（789 年）他在任上去世，年六十八。他的儿子李繁为他写过家传，后世关于他的不少故事出自这部家传，有学者认为其中颇多夸饰。
sources: []
recalled:
  - 《旧唐书·李泌传》
  - 《新唐书·李泌传》
  - 《资治通鉴》卷二百一十八至二百三十三
