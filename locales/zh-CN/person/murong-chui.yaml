name: 慕容垂
aliases: [慕容道明, 慕容霸, 后燕成武帝]
role: 后燕开国君主
summary: 慕容皝之子，枋头击败桓温后遭猜忌投奔前秦，淝水战后在河北复国，建立后燕。
body: |-
  慕容垂字道明，原名霸，是慕容皝的第五子。他少年时就以勇略受到父亲喜爱，十三岁随军作战立功。兄长慕容儁即位后对他心存忌恨，他改名为垂，长期不得重用。

  太和四年（公元 369 年）东晋的桓温北伐，前燕朝廷一度打算放弃邺城退回辽东。他请求出战，在枋头阻住晋军，又在桓温退兵途中设伏于襄邑，大败晋军。他由此威名大振，却招致执政的慕容评和太后的猜忌，听说他们要杀自己，便带着儿子们投奔前秦。苻坚亲自出城迎接，待他十分优厚。王猛认为他终究是祸患，劝苻坚除掉他，苻坚没有听。第二年前秦灭了前燕。

  太元八年（383 年）苻坚南征，他赞成出兵。淝水之战秦军溃散，只有他率领的三万人完整无损。苻坚带着千余骑投奔他，儿子和部下都劝他乘机杀掉苻坚，他说不能负人，把军队交还给苻坚，并一路护送。到洛阳附近，他请求去河北安抚百姓、祭扫祖陵，得到允许。他到邺城后联合丁零人翟斌起兵，太元九年（384 年）正月自称燕王，史称后燕，随即围攻苻坚之子苻丕据守的邺城。次年苻丕弃城西走，太元十一年（386 年）他在中山称帝。此后几年他先后灭了丁零翟氏和占据并州的西燕慕容永，大体恢复了前燕的旧境。

  北面的拓跋珪原先依靠他的支持，后来因索要马匹之事反目。太元二十年（395 年）他派太子慕容宝讨伐北魏，在参合陂全军覆没。次年春他抱病亲征，翻山袭取平城。回军路过参合陂，见去年战死者的尸骨堆积如山，军中痛哭，据《晋书·载记》，他惭愤吐血，病势加重，四月死在归途上的沮阳，时年七十一。第二年北魏攻下中山，后燕分裂衰落。
sources: []
recalled:
