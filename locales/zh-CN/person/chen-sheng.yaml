name: 陈胜
aliases: [陈涉, 陈王, 隐王]
role: 起义首领、张楚王
summary: 字涉，阳城人，在大泽乡率戍卒起事，称王于陈，号“张楚”。
body: |-
  陈胜字涉，阳城人，生年史无记载。据《史记·陈涉世家》，他年轻时受雇为人耕田，曾对同伴说“苟富贵，无相忘”，被人取笑后叹道：“燕雀安知鸿鹄之志哉！”

  秦二世元年（公元前 209 年）七月，朝廷征发闾左九百人戍守渔阳，途中驻在大泽乡，陈胜、吴广都是屯长。大雨阻路，估计已经误期，按法当斩。两人于是杀死带队的两名尉，假托公子扶苏、楚将项燕的名义起事，陈胜自立为将军，吴广为都尉。队伍攻下大泽乡和蕲县，一路扩充，到陈县时已有战车六七百乘、骑兵千余、步卒数万人。攻下陈县后，陈胜自立为王，号“张楚”，以吴广为假王西攻荥阳，又派武臣、周文等分路进兵。周文一军打到戏，《陈涉世家》称有“车千乘，卒数十万”，被秦将章邯击败。

  此后吴广在荥阳被部将田臧所杀，派往各地的将领多自立为王。章邯进逼陈县，陈胜出战失利，腊月退到下城父，被车夫庄贾杀害，葬于砀，谥隐王。《陈涉世家》说他为王共六个月。司马迁认为，他所封立派遣的王侯将相最终灭秦，“由涉首事也”；汉高祖时为他在砀设置守冢三十家。
sources:
  - 《史记·陈涉世家》 https://zh.wikisource.org/wiki/史記/卷048
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
