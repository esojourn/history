name: 亚当
aliases: []
role: 人类始祖
summary: 圣经所记的第一个人，受造后住在伊甸园，因吃禁果被逐出。
body: |-
  据《创世记》，亚当是神所造的第一个人。第 1 章说神照着自己的形像造人，造男造女，叫他们生养众多，管理地上的活物（1:26–28）。第 2 章记得更细：耶和华神用地上的尘土造人，把生气吹在他鼻孔里，他就成了有灵的活人（2:7）。“亚当”在希伯来文里就是“人”的意思，与“土地”一词同源。

  神在东方的伊甸立了一个园子，把亚当安置在那里，叫他修理、看守（2:8、2:15），并吩咐他：园中各样树上的果子都可以吃，只有分别善恶树上的果子不可吃，吃的日子必定死（2:16–17）。亚当给各样牲畜、飞鸟、走兽起了名字（2:19–20）。神又使他沉睡，取下他的一条肋骨造成一个女人，领到他面前，就是他的妻子夏娃（2:21–24）。

  第 3 章记载，夏娃受蛇引诱吃了禁果，又给亚当，亚当也吃了。神对亚当说，地要因他的缘故受咒诅，他必终身劳苦才能从地里得吃的，直到归于尘土（3:17–19）。神把二人赶出伊甸园，在园子东边安设基路伯和发火焰的剑，把守生命树的道路（3:23–24）。

  出园之后，亚当与夏娃生了该隐和亚伯；亚伯被该隐所杀，后来又生了塞特（4:1–2、4:25）。据《创世记》5:3–5，亚当一百三十岁生塞特，此后又活了八百年，并且生儿养女，共活了九百三十岁。他死在哪里、葬在哪里，圣经没有记载。

  新约《路加福音》把耶稣的家谱上溯到亚当（3:38）。保罗在《罗马书》第 5 章和《哥林多前书》第 15 章里把亚当与基督对举，说罪是从一人入了世界，死又是从罪来的。
sources: []
recalled:
  - 《创世记》第 1—5 章
  - 《路加福音》3:38
  - 《罗马书》第 5 章
  - 《哥林多前书》第 15 章
