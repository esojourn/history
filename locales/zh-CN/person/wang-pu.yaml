name: 王朴
aliases: [王文伯]
role: 后周枢密使
summary: 周世宗的重臣，955 年献《平边策》提出先南后北的统一方略，并制定《钦天历》。
body: |-
  王朴是东平人，字文伯，后汉时考中进士。后汉末年朝政混乱，他辞官回乡，因而躲过了乾祐三年（公元 950 年）的大臣被杀之祸。后周时，他在柴荣幕下任职，柴荣即位后重用他。

  显德二年（955 年），周世宗命大臣们各写一篇讨论如何统一天下的文章，王朴所上的《平边策》最受赏识。据《资治通鉴》所载，他主张攻取天下应当先易后难：先取南唐的江北淮南之地，再取岭南、巴蜀，最后才对付北汉和契丹。他还提出要先修明内政、收揽人心，再向外用兵。周世宗此后的征伐，基本按这个思路进行，北宋初年的统一战争也大致先南后北。

  此后王朴升任枢密使，主管军事。周世宗亲征淮南时，他留守开封，处理朝政。他还主持扩建开封的外城，规划街道。王朴精通历法和音律，编成了《钦天历》，又考订雅乐，制作律准。

  显德六年（959 年）三月，王朴在开封视察工程时突然发病去世，年五十四。周世宗亲临吊唁，据史书，他用玉钺叩地，痛哭数次。王朴死后不到三个月，周世宗也去世了。宋人很看重他，有记载说宋太祖曾对着他的画像整肃衣冠，说如果此人还在，自己就不能穿上这身龙袍了，这一说法出自宋人笔记。
sources: []
recalled:
