name: 宋光宗
aliases: [赵惇]
role: 南宋皇帝
summary: 宋孝宗第三子，在位五年，因病不能理政、不为孝宗执丧，被朝臣以“内禅”方式让位。
body: |-
  赵惇是宋孝宗的第三个儿子，生于绍兴十七年（公元 1147 年）。孝宗的长子早死，他越过次兄被立为太子，淳熙十六年（1189 年）受禅即位，次年改元绍熙，是为宋光宗。

  光宗即位后不久患病，史书记载他精神失常，朝政多受皇后李氏左右。李后与孝宗不和，光宗也长期不去重华宫朝见父亲，朝臣屡次劝谏无效。绍熙五年（1194 年）孝宗去世，光宗称病不肯主持丧礼，朝野震动。知枢密院事赵汝愚与知閤门事韩侂胄通过宪圣太后（高宗的吴皇后）的支持，宣布光宗“内禅”，扶立皇子赵扩即位，即宋宁宗，史称“绍熙内禅”。光宗成为太上皇，此后居于寿康宫，庆元六年（1200 年）去世。
sources: []
recalled:
  - 《宋史·光宗本纪》
  - 《宋史·后妃传·光宗慈懿李皇后》
