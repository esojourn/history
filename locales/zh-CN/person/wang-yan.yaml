name: 王衍
aliases: [王夷甫]
role: 太尉
summary: 西晋末年的清谈领袖，位至三公而不以国事为念，兵败被石勒所杀。
body: |-
  王衍字夷甫，琅邪临沂人，是“竹林七贤”之一王戎的堂弟。他容貌出众，喜谈老庄，手持玉柄麈尾与人辩论，觉得说得不妥就随口更改，当时人称为“口中雌黄”。朝野的年轻士人纷纷效仿他，清谈之风因此大盛。

  他历任尚书令、司空、司徒，官至太尉。他的女儿是太子司马遹的妃子，太子被贾后废黜时，他上表请求让女儿离婚。《晋书》本传说他身居高位而专为自己打算，曾安排弟弟王澄任荆州刺史、族弟王敦任青州刺史，自己留在京师，称之为“三窟”。

  永嘉五年（公元 311 年）东海王越死在项县，众人推他为主帅，他推辞不成，率军民护丧东行，在宁平城被石勒的骑兵围歼，他也被俘。本传记载，他向石勒陈说晋朝败亡的原因，自称从来不参与政事，并劝石勒称帝。石勒斥责他位居宰辅，“破坏天下，正是君罪”，当夜叫人推倒墙壁把他压死，时年五十六。本传说他临死前叹息：如果当初不崇尚浮虚，合力匡救天下，还不至于到今天的地步。
sources: []
recalled:
  - 《晋书·王戎传附王衍传》
  - 《世说新语》
  - 《资治通鉴》卷八十七
