name: 一行
aliases: [张遂, 大慧禅师]
role: 僧人、天文学家
summary: 唐代僧人和天文学家，主持编制《大衍历》，组织测量了子午线上的纬度差。
body: |-
  一行俗名张遂，魏州昌乐人，是唐初功臣张公谨的孙子。他少年时博览经史，精通天文历算。据《旧唐书》本传，武三思仰慕他的学问，想与他结交，他避而不见，逃到嵩山跟随普寂禅师出家。此后他游学各地，又学习了密宗，曾协助天竺僧人善无畏翻译《大日经》，并为它作疏。

  开元五年（公元 717 年）玄宗派人把他召到长安。开元九年（721 年）原有的《麟德历》推算日食屡次不准，玄宗命他编制新历。他与率府兵曹参军梁令瓒一起设计制造了黄道游仪和水力推动的浑天铜仪，用来观测日月星辰的运行。开元十二年（724 年）前后，他主持在全国多个地点测量日影长度和北极高度，其中南宫说等人在河南平原上测得的结果，证明了旧说“日影千里差一寸”是错误的（另见“一行测量子午线”条）。

  开元十五年（727 年）他写成《大衍历》的初稿，同年去世，年四十五，玄宗赐谥大慧禅师。《大衍历》经张说等人整理，于开元十七年（729 年）颁行，它的编排体例被后来的历法长期沿用。
sources: []
recalled:
  - 《旧唐书·方伎传·一行》
  - 《新唐书·历志》
  - 《旧唐书·天文志》
