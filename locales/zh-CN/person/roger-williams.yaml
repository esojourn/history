name: "罗杰·威廉斯"
aliases: ["威廉斯"]
role: "罗得岛殖民地创建者、政教分离的倡导者"
summary: "被逐出马萨诸塞的牧师，建普罗维登斯，主张政教分开与信仰自由。"
body: |-
  罗杰·威廉斯约 1603 年生于伦敦，在剑桥受教育，做过英国国教的牧师，倾向清教徒中最激进的一派。《历史的轨迹》第四十一章说，他 1631 年初带着妻子抵达波士顿港。当时马萨诸塞殖民地的官方教会是公理派，他却极力主张政教分开，因此立刻与波士顿教会当局水火不容，转往普利茅斯，做了天路客教会的牧师。在那里他与印第安的纳拉甘西特人交好，学会了他们的语言。

  该书说，他 1634 年应召到塞勒姆做公理派牧师，赞同他看法的人不少。1635 年法院判他六个星期内离开马萨诸塞，因他身体虚弱，准他延到次年春天；但他在家中向跟从的人讲道，谈到自己被政府非难的事，法院大怒，要他立刻离开。他撇下妻儿逃进荒野，在冬天的森林雪地里流落了十四个星期，被他在普利茅斯结识的印第安人接回家中。次年夏天，他向印第安人买下一块地，跟从他的人陆续前来，建起普罗维登斯，这就是罗得岛的开始。

  书中说，1647 年按威廉斯的原则成立了罗得岛的政府：政教分开、不强迫信徒投票、宗教自由，这些原则后来成为美国政府的基本原则。据一般记载，他 1639 年前后在普罗维登斯与人一同重新受浸，建立了北美第一间浸礼派教会，但不久即离开，自称“寻求者”，不再属任何教会；1644 年他为殖民地取得英国国会颁发的特许状，同年发表《为良心之故而受逼迫的血腥教义》。他 1683 年在普罗维登斯去世。

  该书特别指出，威廉斯并不是美洲浸礼派的创始人，他建立的那间教会后来既没有成为母会，也没有分出支会，大部分美洲浸礼派信徒在来美洲之前就已经是浸礼派；他的重要性在于强调政教分开和随之而来的宗教自由，书中认为这解决了自君士坦丁大帝信主以来的问题，而浸礼派是最先采用这两项原则的团体。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十一章“教会进入新大陆” https://wellsofgrace.com/books/spiritual/2000years/html/chapter46.html"
recalled:
  - "罗杰·威廉斯《为良心之故而受逼迫的血腥教义》（1644 年）"
