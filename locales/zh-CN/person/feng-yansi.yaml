name: 冯延巳
aliases: [冯延嗣, 冯正中]
role: 南唐宰相、词人
summary: 南唐中主的宰相，五代最重要的词人之一，有词集《阳春集》。
body: |-
  冯延巳又名延嗣，字正中，广陵人，约生于天复三年（公元 903 年），一说生于次年。他的父亲冯令頵是吴国和南唐的官员。冯延巳多才多艺，能言善辩，南唐烈祖李昪在位时，他任太子李璟的属官，与李璟关系密切。

  李璟即位后，冯延巳得到重用，几度出任宰相。他与弟弟冯延鲁以及陈觉、魏岑、查文徽等人一起参与朝政，当时有人把他们合称为“五鬼”。他们主张对外用兵，南唐出兵闽、楚，都与这些人有关，但两次用兵都得不偿失，冯延巳因此一度罢相。后来南唐败于后周，失去江北，他也受到批评。建隆元年（960 年）他在金陵去世。

  冯延巳在政治上评价不高，在文学上却地位很高。他的词作很多，后人辑为《阳春集》，代表作有《鹊踏枝》（又名《蝶恋花》）、《谒金门》等。据马令《南唐书》，他写了《谒金门》中的“风乍起，吹皱一池春水”一句，李璟和他开玩笑说，吹皱一池春水，与你有什么相干；他回答说，比不上陛下的“小楼吹彻玉笙寒”。

  他的词多写离愁别恨和人生的感慨，比花间词人更深婉含蓄。王国维在《人间词话》里说他的词“虽不失五代风格，而堂庑特大，开北宋一代风气”。北宋的晏殊、欧阳修等人都深受他的影响，有些作品甚至与欧阳修的词互相混淆，作者难以分辨。
sources: []
recalled:
  - 陆游《南唐书·冯延巳传》
  - 马令《南唐书·党与传》
  - 王国维《人间词话》
