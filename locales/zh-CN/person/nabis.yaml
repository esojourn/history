name: 纳比斯
aliases: [那比斯]
role: 斯巴达统治者
summary: 斯巴达最后一位独立的统治者，放逐富人、解放奴隶、扩充军队，被埃托利亚人刺杀。
body: |-
  斯巴达人，生年不详，自称是前 5 世纪流亡波斯的国王德马拉托斯的后裔。公元前 207 年斯巴达的统治者马卡尼达斯在曼提尼亚被菲洛皮门杀死，纳比斯随后掌权，除掉年幼的国王，自己称王，钱币和铭文上都用王号。古代作家一律称他为僭主。

  关于他的记载主要出自波利比乌斯和依据波利比乌斯的李维，而波利比乌斯是他的敌人亚该亚同盟的人，笔下极为憎恶。据他们说，纳比斯放逐和杀害富有的公民，把他们的土地、甚至妻女分给自己的部下；解放了大批奴隶（是否包括黑劳士，学者有争论），让他们成为公民；豢养雇佣兵，与克里特的海盗勾结。他为斯巴达修了城墙。波利比乌斯还说他造了一具模样像他妻子阿佩伽的刑具，手臂和胸前藏着铁钉，用来逼人交钱。现代学者一般认为，他是在继续阿吉斯四世、克列奥美涅斯三世以来的社会变革，只是手段更激烈。

  前 204 年起他与亚该亚同盟冲突不断，前 201 年偷袭美塞尼，被菲洛皮门逼退。第二次马其顿战争中，腓力五世把阿尔戈斯交给他以换取支持，他接收之后却与罗马统帅弗拉米尼努斯讲和。前 195 年罗马击败腓力之后，希腊各邦要求讨伐他。弗拉米尼努斯率联军攻入拉科尼亚，逼他交出阿尔戈斯、沿海各城和舰队，但没有推翻他。

  前 192 年他试图夺回沿海城镇，被菲洛皮门击败。同年，正准备联合塞琉古王安条克三世对抗罗马的埃托利亚人派了一支千人的队伍，名义上来援助他，却在城外操演时将他刺杀。埃托利亚人随即抢掠王宫，被斯巴达人赶走。菲洛皮门闻讯赶到，把斯巴达并入亚该亚同盟。
sources: []
recalled:
  - 波利比乌斯《历史》卷十三第 6—8 章、卷十六第 13 章
  - 李维《罗马史》卷三十四第 22—41 章、卷三十五第 35—36 章
