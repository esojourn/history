name: 托勒密六世
aliases: [ 托勒密六世·菲洛墨托尔, 爱母者 ]
role: 埃及国王
summary: 托勒密王朝国王，在位时安条克四世两度入侵埃及，后与弟弟托勒密八世争位。
body: |-
  托勒密六世是托勒密五世与克娄巴特拉一世的长子，生于公元前 186 年。前 180 年父亲去世，他约六岁即位，先由母亲摄政，母亲死后由欧莱乌斯和勒奈乌斯摄政。他娶妹妹克娄巴特拉二世，前 170 年起与妹妹、弟弟托勒密八世三人共治。

  第六次叙利亚战争中，安条克四世于前 169 年击败埃及军队，占领培琉喜阿姆，托勒密六世一度受其控制；前 168 年安条克四世再度入侵，逼近亚历山大。罗马使节波皮利乌斯·莱纳斯在亚历山大城郊的埃琉西斯要求他撤军，安条克四世被迫退出埃及。前 164 年托勒密六世被弟弟逐出，前往罗马求助，次年被亚历山大人迎回复位，弟弟改治昔兰尼加。

  晚年他介入塞琉古王国的王位之争，先把女儿嫁给亚历山大·巴拉斯，后转而支持德米特里二世。前 145 年他在安条克附近的俄诺帕拉斯河击败巴拉斯，自己却在战斗中受伤，数日后去世。
sources:
  - 英文维基百科“Ptolemy VI Philometor”条 https://en.wikipedia.org/wiki/Ptolemy_VI_Philometor
recalled:
  - 波利比乌斯《历史》第 28 卷第 18—23 章，第 29 卷第 23—27 章（埃琉西斯之会）
  - 李维《罗马史》第 45 卷第 11—12 章
  - 《马加比一书》第 10 章第 51—58 节、第 11 章第 1—18 节（嫁女、进军叙利亚与去世）
