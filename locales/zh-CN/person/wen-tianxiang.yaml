name: 文天祥
aliases: [文宋瑞, 文履善, 文山]
role: 南宋末年丞相
summary: 南宋状元、丞相，起兵抗元，被俘后不肯降元，在大都就义，作《过零丁洋》《正气歌》。
body: |-
  文天祥字宋瑞，又字履善，号文山，吉州庐陵（今江西吉安）人，生于端平三年（公元 1236 年）。宝祐四年（1256 年）他考中状元，此后任官时多次因直言触犯权贵而被罢免。

  德祐元年（1275 年）元军沿长江东下，朝廷下诏各地勤王，文天祥变卖家产，在赣州招募义兵入卫临安。次年正月元军兵临城下，他被任为右丞相兼枢密使，奉命到元军营中谈判，因言辞激烈被伯颜扣留，随后临安投降。他被押往北方，途中在镇江逃脱，历经艰险南下，著有《指南录》记述这段经历。

  此后他在福建、江西、广东一带召集兵马抗元，一度收复江西部分州县，不久兵败，家人多被俘或死去。祥兴元年（1278 年）十二月他在海丰五坡岭被元将张弘范的部下俘获，服毒未死。张弘范要他写信招降张世杰，他写下《过零丁洋》作答，诗末两句“人生自古谁无死，留取丹心照汗青”。次年他在元军船上目睹了崖山海战宋军的覆灭。

  文天祥被押到大都，囚禁三年多，元朝多次劝降，忽必烈也曾亲自召见，许以高官，他始终不从。他在狱中作《正气歌》。至元十九年十二月（1283 年 1 月）他在大都柴市被处死，年四十七岁。据记载，他的衣带中有自赞，有“孔曰成仁，孟曰取义”等语。
sources: []
recalled:
  - 《宋史·文天祥传》
  - 文天祥《指南录》
  - 《文山先生全集》
