name: 冒顿单于
aliases: [冒顿]
role: 匈奴单于
summary: 匈奴单于，杀父头曼自立，东破东胡、西逐月氏，曾在白登围困汉高祖。
body: |-
  冒顿是匈奴单于头曼的太子，生年不详。据《史记·匈奴列传》，头曼想改立所宠阏氏生的少子，把冒顿送到月氏作人质，随即急攻月氏；月氏要杀冒顿，他盗马逃回，头曼让他统领万骑。冒顿制作鸣镝训练部下，规定鸣镝所射而不跟着射的一律斩首，后来在随父出猎时射杀头曼，自立为单于。《史记集解》引徐广说，事在秦二世元年，即公元前 209 年。

  即位后，冒顿先东袭东胡，再西击月氏，南并楼烦、白羊河南王，收回秦将蒙恬所夺之地，后又北服浑庾、屈射、丁零、鬲昆、薪犁诸部。《史记》称他有“控弦之士三十余万”。前 201 年匈奴围马邑，韩王信投降。前 200 年汉高祖亲征，被围于白登七日，史称匈奴出动精兵四十万骑。其后汉朝遣刘敬送宗室女为单于阏氏，每年奉送絮、缯、酒、米等物，约为兄弟。

  惠帝、吕后时，冒顿致书吕后，言辞轻慢，吕后最终没有出兵，仍与匈奴和亲。汉文帝前元四年（前 176 年），冒顿致书汉廷，称已派右贤王击破月氏，并平定楼兰、乌孙、呼揭及旁近二十六国。文帝前元六年（前 174 年）汉廷复书后不久，冒顿去世，子稽粥继立，即老上单于。
sources:
  - 《史记·匈奴列传》 https://zh.wikisource.org/wiki/史記/卷110
  - 《史记集解》引徐广说（冒顿即位之年） https://zh.wikisource.org/wiki/史記三家註/卷110
  - 《史记·韩信卢绾列传》 https://zh.wikisource.org/wiki/史記/卷093
  - 《汉书·匈奴传上》 https://zh.wikisource.org/wiki/漢書/卷094上
