name: 鱼朝恩
aliases: []
role: 宦官、观军容使
summary: 唐肃宗、代宗时的宦官，以观军容使监军，统领神策军，770 年被唐代宗处死。
body: |-
  鱼朝恩是泸州泸川人，天宝末年入宫做宦官。乾元元年（公元 758 年），唐肃宗派九个节度使围攻邺城，不设元帅，以他为观军容宣慰处置使，实际上节制各军。次年唐军溃败，他把责任推给郭子仪，使郭子仪被解除兵权（另见“相州之战”条）。上元二年（761 年）他又催促李光弼进攻洛阳，导致邙山之败。

  广德元年（763 年）吐蕃攻入长安，唐代宗逃往陕州，他率领驻陕州的神策军前来护驾，此后神策军随代宗回京，成为禁军，由他统领（另见“宦官掌神策军”条）。他权倾朝野，又兼判国子监，在国子监讲解经书。他与宰相元载争权，对代宗也日渐骄横。大历五年（770 年）寒食节，代宗与元载合谋，在宫中宴会后把他留下缢杀，对外宣称他是自缢。
sources: []
recalled:
