name: 该隐
aliases: []
role: 亚当的长子
summary: 亚当和夏娃的长子，种地为业，因献祭的事杀了弟弟亚伯。
body: |-
  据《创世记》第 4 章，该隐是亚当和夏娃被逐出伊甸园以后所生的头一个儿子，以种地为业；弟弟亚伯是牧羊的。有一日，该隐拿地里的出产为供物献给耶和华，亚伯献上羊群中头生的和羊的脂油。耶和华看中了亚伯和他的供物，没有看中该隐和他的供物，该隐就大大发怒，变了脸色。耶和华对他说，他若行得好，岂不蒙悦纳；若行得不好，罪就伏在门前（4:3–7）。

  后来二人在田间，该隐起来打他兄弟亚伯，把他杀了。耶和华问他亚伯在哪里，他回答说不知道，又反问自己难道是看守兄弟的吗。耶和华说，亚伯的血有声音从地里向他哀告；该隐从此受咒诅，种地，地不再给他效力，他必流离飘荡在地上（4:8–12）。该隐说自己的刑罚太重，恐怕遇见他的人会杀他。耶和华就给他立了一个记号，免得人遇见他就杀他，并说凡杀该隐的必遭报七倍（4:13–15）。

  该隐离开耶和华的面，住在伊甸东边的挪得之地。他的妻子生了以诺，他建造了一座城，按儿子的名字给那城起名（4:16–17）。他的后代里有拉麦，拉麦的儿子中有牧养牲畜、弹琴吹箫和打造铜铁器具的人的祖师（4:18–22）。该隐活了多少岁、怎样死的，圣经没有记载。新约《希伯来书》11:4、《约翰一书》3:12 等处提到他。
sources: []
recalled:
  - 《创世记》第 4 章
  - 《希伯来书》11:4
  - 《约翰一书》3:12
