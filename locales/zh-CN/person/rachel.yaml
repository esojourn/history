name: 拉结
aliases: []
role: 雅各之妻
summary: 拉班的小女儿，雅各所爱的妻子，约瑟和便雅悯的母亲。
body: |-
  拉班的小女儿，利亚的妹妹，圣经没有记她的生年。雅各来到哈兰时，她正领着父亲的羊到井旁（《创世记》29:9—12）。雅各爱她，为她服事拉班七年；拉班先把利亚给了他，满了利亚的七日才把拉结也给他，雅各为此再服事七年（29:18—30）。拉班把婢女辟拉给她作使女。

  她起初不生育，嫉妒姐姐，把辟拉给雅各为妾，辟拉生了但和拿弗他利（30:1—8）。后来她自己生了约瑟（30:22—24）。雅各离开拉班时，她偷了父亲家中的神像；拉班追上来搜查，她把神像藏在骆驼的驮篓里，坐在上面，没有被搜出（31:19、31:33—35）。

  据创 35:16—20，一家人从伯特利起行，离以法他还有一段路程，她临产艰难，生下一个儿子就死了；她临终给儿子起名便俄尼，雅各给他改名便雅悯。她葬在通往以法他（就是伯利恒）的路旁，雅各在坟上立了一统碑。圣经没有记她去世时的年纪。《耶利米书》31:15 说到拉结哭她的儿女，《马太福音》2:18 引用了这句话。
sources: []
recalled:
  - 《创世记》第 29—31 章、35:16—20
  - 《耶利米书》31:15
  - 《马太福音》2:18
