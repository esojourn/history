name: 智伯
aliases: [荀瑶, 知伯瑶, 智襄子]
role: 晋国正卿
summary: 春秋末年晋国最有权势的卿，向韩、赵、魏索地，围攻赵氏于晋阳，反被三家联手所灭。
body: |-
  智伯名瑶，属晋国的荀氏，因封于智（一作知），称智伯，谥襄子，生年不详。春秋后期，晋国的政权落到了智、范、中行、韩、赵、魏六家卿族手中，即所谓“六卿”。公元前 490 年前后，范氏、中行氏被其余四家打败，智氏成为势力最大的一家，智伯执掌晋国国政。

  据《资治通鉴》卷一，智宣子要立瑶为继承人时，族人智果劝阻，说瑶有五样胜过别人，只有一样不足，就是不仁，若立他为嗣，智氏必定灭亡。智宣子不听。

  智伯执政后，先后向韩康子、魏桓子索要土地，二人都给了；又向赵襄子索地，赵襄子拒绝。公元前 455 年，智伯率韩、魏两家的军队攻打赵氏，赵襄子退守晋阳。智伯围城两年多，引晋水灌城，城墙只剩三版（约六尺）没有被淹。赵襄子派张孟谈暗中联络韩、魏，公元前 453 年，三家联手决水反灌智伯军营，智伯兵败被杀，智氏被灭族，土地被三家瓜分。据《史记》，赵襄子把智伯的头骨漆成饮器。智伯的家臣豫让后来两次刺杀赵襄子为主报仇，事见《史记·刺客列传》。
sources: []
recalled:
  - 《资治通鉴》卷一
  - 《史记·赵世家》
  - 《史记·刺客列传》
  - 《战国策·赵策一》
