name: 司马昭
aliases: [司马子上, 晋文帝, 晋王]
role: 大将军、晋王
summary: 司马懿次子，继兄执掌魏政，在位时魏帝曹髦被杀，派兵灭蜀，受封晋王。
body: |-
  据《晋书·文帝纪》，司马昭字子上，是司马懿的次子、司马师的弟弟。正元二年（公元 255 年）司马师死于许昌，朝廷命司马昭留守许昌，他没有奉命，带兵回到雒阳，继任大将军、录尚书事。

  甘露二年（257 年），镇守淮南的征东大将军诸葛诞在寿春起兵，并向吴国求援。司马昭带着皇帝和太后一同出征，围城近一年，次年初攻破寿春，杀诸葛诞。这是淮南的第三次反抗，至此曹魏朝廷内外已没有能与司马氏抗衡的力量。

  甘露五年（260 年）五月，二十岁的皇帝曹髦不甘受制。据裴松之注引《汉晋春秋》，他对几位大臣说“司马昭之心，路人所知也”，随后亲自带着宫中的僮仆数百人出宫讨伐司马昭。司马昭的亲信贾充率兵迎战，命部下成济上前把皇帝刺死。事后司马昭把成济灭族，另立曹奂为帝。

  景元四年（263 年），司马昭派钟会、邓艾等分路伐蜀，当年刘禅投降。在此之前朝廷已多次要封他为晋公、加九锡，他都推辞，到这时才接受；次年进爵晋王。咸熙二年（265 年）八月司马昭去世，终年五十五。数月后其子司马炎代魏称帝，追尊他为文皇帝。
sources: []
recalled:
  - 《晋书·文帝纪》
  - 《三国志·魏书·三少帝纪》及裴松之注
