name: 扶苏
aliases: [公子扶苏]
role: 公子
summary: 秦始皇长子，因劝谏被派往上郡监蒙恬军，始皇死后被伪诏赐死。
body: |-
  扶苏是秦始皇的长子，生年史无记载。据《史记·秦始皇本纪》，始皇三十五年（公元前 212 年）在咸阳坑杀诸生，扶苏劝谏说天下初定，诸生都诵法孔子，用重法惩治恐怕天下不安。始皇发怒，派他到上郡去监蒙恬的军队。

  前 210 年始皇出巡途中病重，写下玺书命扶苏“与丧会咸阳而葬”，书未发出始皇就去世了。据《李斯列传》，赵高、李斯、胡亥另造一份诏书，指责扶苏无功而多怨言，赐剑令他自裁。使者到上郡，蒙恬怀疑有诈，劝他请示核实后再死；扶苏说“父而赐子死，尚安复请”，随即自杀。次年陈胜起事，还曾借用扶苏的名义号召民众。
sources:
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
  - 《史记·李斯列传》 https://zh.wikisource.org/wiki/史記/卷087
  - 《史记·陈涉世家》 https://zh.wikisource.org/wiki/史記/卷048
