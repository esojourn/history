name: 萧何
aliases: [酂侯, 文终侯, 萧相国]
role: 丞相、相国
summary: 沛丰人，汉初丞相，留守关中供给军需，举荐韩信为大将。
body: |-
  萧何是沛县丰邑人，生年史无记载。据《史记·萧相国世家》，他在秦时任沛县主吏掾，刘邦还是平民和亭长时，他常以吏事相护。刘邦起兵为沛公，萧何为丞，督办事务。沛公进入咸阳，诸将争着去分金帛财物，萧何独自先收取秦丞相、御史府的律令图书加以保存。《世家》说，汉王后来能详知天下的要塞、户口多少和强弱所在，靠的就是这批图书。

  汉元年（公元前 206 年）刘邦为汉王，以萧何为丞相。韩信逃亡，萧何亲自追回，向汉王力荐，韩信于是被拜为大将。楚汉相争期间，萧何留守关中，辅佐太子，治栎阳，制定法令，计户口转运粮饷；汉王多次兵败，他每次征发关中士卒补足。汉五年论功，高祖以萧何功最高，封酂侯，位次列第一，准许他带剑着履上殿。

  高祖十一年（前 196 年），吕后用萧何之计，把韩信骗入宫中处死，萧何由丞相进为相国。南宋洪迈《容斋续笔》卷八说，韩信做大将军是萧何举荐的，死又出于萧何的计谋，所以俚语有“成也萧何，败也萧何”。次年他因替百姓请求开放上林苑空地而被下狱，数日后获释。《汉书·刑法志》说他采摭秦法，“作律九章”。孝惠二年（前 193 年）去世，谥文终侯；临终前惠帝问谁可接任，他赞同曹参。去世的地点史书未载。
sources:
  - 《史记·萧相国世家》 https://zh.wikisource.org/wiki/史記/卷053
  - 《史记·淮阴侯列传》 https://zh.wikisource.org/wiki/史記/卷092
  - 《汉书·刑法志》 https://zh.wikisource.org/wiki/漢書/卷023
  - 洪迈《容斋续笔》卷八“萧何绐韩信” https://zh.wikisource.org/wiki/容齋續筆/卷八
