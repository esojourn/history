name: 郑和
aliases: [马三保, 三宝太监]
role: 宦官，七下西洋的统帅
summary: 云南回族人，入宫为宦官，从永乐三年起七次率领船队远航西洋，最远到达东非沿岸。
body: |-
  郑和本姓马，小名三保，云南昆阳州（今昆明市晋宁区）人，出身回族家庭，祖父和父亲都曾到麦加朝觐，这些事迹见于永乐初年李至刚撰写的《故马公墓志铭》。洪武十四年（1381 年）明军进攻云南，他被俘，后来被阉割，进入燕王朱棣府中服役。

  靖难之役中他随朱棣作战有功，朱棣即位后赐他姓郑，升为内官监太监。永乐三年（1405 年），朱棣命郑和与王景弘等人率领庞大的船队出使西洋。此后到宣德八年（1433 年）为止，郑和先后七次远航，到过占城、爪哇、满剌加、苏门答剌、锡兰、古里、忽鲁谟斯等地，分出的船队还到达阿拉伯半岛的阿丹、天方（麦加）和东非沿岸的木骨都束、麻林等地（另见“郑和下西洋”条）。据《明史》，第一次出使的船队有士卒二万七千八百余人，大船长四十四丈、宽十八丈，这一尺寸后世有不少学者表示怀疑。

  出使途中，郑和的船队既进行朝贡贸易、赏赐各国，也动用过武力：永乐五年（1407 年）在旧港擒获海盗首领陈祖义，永乐九年（1411 年）在锡兰与当地国王交战，将其俘虏送到南京。永乐年间他还担任过南京守备。

  宣德六年（1431 年）郑和受命第七次出使，宣德八年（1433 年）船队归国。一般认为郑和在这次航行的归途中去世，地点可能在古里，也有学者认为他回国后才去世，卒年、卒地都有不同说法。南京牛首山有郑和墓，据说只是衣冠冢。郑和船队的航海资料后来部分保存在《武备志》所收的《郑和航海图》中，随行的马欢、费信、巩珍分别写下了《瀛涯胜览》《星槎胜览》《西洋番国志》。
sources: []
recalled:
  - 《明史·郑和传》
  - 马欢《瀛涯胜览》
  - 李至刚《故马公墓志铭》
  - 《天妃灵应之记》碑
