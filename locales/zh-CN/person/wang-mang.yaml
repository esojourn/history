name: 王莽
aliases: [王巨君, 安汉公, 新都侯]
role: 新朝皇帝
summary: 西汉外戚，以辅政大臣身份代汉称帝，建立新朝，推行托古改制，十五年后败亡。
body: |-
  据《汉书·王莽传》，王莽字巨君，祖籍魏郡元城，是元帝皇后王政君的侄子。他的伯父、叔父在成帝朝相继封侯辅政，只有他的父亲王曼早死，没有封爵。本传说他年轻时俭朴勤学，伯父王凤病重时他日夜照料，因此受到推荐。永始元年（公元前 16 年）他被封为新都侯；绥和元年（前 8 年）继叔父王根任大司马，年三十八岁。

  哀帝即位后，他辞去官职，后来被遣回封国南阳新野。在封国期间，他的次子杀死了一名奴婢，他责令儿子自杀偿命。元寿二年（前 1 年）哀帝去世，王政君召他回朝重任大司马，立年幼的平帝。此后他以“安汉公”的名义执政，把女儿立为皇后，平帝死后，他选两岁的刘婴为继承人，自己称“摄皇帝”。东郡太守翟义等起兵反对，被镇压下去。初始元年十二月（已入公元 9 年），他以符命为依据即皇帝位，改国号为“新”，把刘婴降为定安公。

  称帝后，他依照《周礼》等儒家经典推行一系列新制度：把天下的田地改称“王田”，奴婢改称“私属”，都不许买卖；在长安等大城市设“五均”官管理市价、办理赊贷；把盐、铁、酒、铸钱和山泽的出产收归官营，合称“六筦”；又四次改变币制，种类繁多的新钱使交易陷入混乱。王田和私属的禁令因为遭到普遍反对，实行三年就取消了。对外，他把匈奴单于、西域各国和高句丽等的王号降为侯，更换印玺，引起边境战事，西域从此与内地断绝。

  始建国三年（公元 11 年）黄河在魏郡决口，此后关东连年水旱蝗灾。天凤年间，荆州的饥民聚集在绿林山，琅邪的樊崇在莒起兵，后来分别发展为绿林军和赤眉军。地皇四年（23 年），绿林军拥立的更始帝刘玄称帝，王莽派出的大军在昆阳被击溃。同年汉军攻入长安，王莽逃到未央宫的渐台，被商人杜吴所杀，时年六十八岁。新朝历时十五年而亡。班固在传末把他比作窃取帝位的伪朝；近代以来，也有学者把他看作一位失败的改革者。
sources: []
recalled:
  - 《汉书·王莽传》
  - 《汉书·食货志》
  - 《资治通鉴》卷三十五至三十九
