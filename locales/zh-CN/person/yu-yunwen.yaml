name: 虞允文
aliases: [虞彬甫, 雍国公]
role: 南宋大臣
summary: 南宋大臣，以文官身份在采石组织宋军击退海陵王，后任宰相。
body: |-
  虞允文字彬甫，隆州仁寿（今四川仁寿）人，生于大观四年（公元 1110 年）。他早年在家侍奉父母，绍兴二十四年（1154 年）才考中进士，后来入朝任职，绍兴三十年（1160 年）以贺正旦使的身份出使金朝，沿途看到金人大量运粮、造船，回朝后向高宗陈述金人必将南侵，请求早作防备。

  绍兴三十一年（1161 年）金海陵王率大军南侵，宋军主将王权从淮西溃退，被撤职，接替的李显忠还没有到任。这时虞允文以中书舍人的身份到采石犒军，见江边宋军无人统率、士气低落，便召集将领，以朝廷名义激励他们迎战。十一月，金军渡江，被宋军击退，次日宋军又焚毁金军船只。海陵王转往扬州，不久被部下杀死（另见“采石之战”条）。一个文官临危主持了这场战事，当时朝野都很惊异。战后他又赶往镇江，协助防守长江下游，与扬州方面的金军隔江相持。

  宋孝宗时虞允文受到重用，曾任四川宣抚使，乾道五年（1169 年）拜相，与孝宗筹划恢复中原。乾道八年（1172 年）他再次出任四川宣抚使，孝宗希望他从四川出兵、与东路会师北伐，他以准备未足为由迟迟未发，淳熙元年（1174 年）在任上去世，谥忠肃。诗人杨万里曾受过他的举荐。
sources: []
recalled:
