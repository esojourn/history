name: 阿格西劳斯二世
aliases: [阿格西劳斯]
role: 斯巴达国王
summary: 斯巴达国王，在位四十年，曾攻入小亚细亚，晚年目睹斯巴达霸权在留克特拉瓦解。
body: |-
  欧里庞提德王室成员，阿基达摩斯二世之子，阿吉斯二世的异母弟。他天生跛足，因为不是王位继承人，照普通公民的方式受了严格的训练。阿吉斯二世死后（约公元前 400 年，一说前 398 年），吕山德支持他继位，理由是阿吉斯之子列奥提基达斯被疑为亚西比德所生。有人举出神谕说要提防“跛足的王权”，吕山德解释说那是指血统不正。

  前 396 年他率军到小亚细亚，援助那里的希腊城邦对抗波斯。出发前他到奥利斯献祭，效仿阿伽门农，被彼奥提亚人打断。到亚洲后他很快摆脱了吕山德的左右，前 395 年在萨迪斯附近击败波斯总督提萨斐尼斯的军队。前 394 年，底比斯、雅典、科林斯、阿尔戈斯在希腊联合对抗斯巴达，他奉召回国，经陆路穿过色雷斯和色萨利，在科罗尼亚与联军交战，身受多处伤。

  此后三十多年他是斯巴达政策的主导者。前 387 年或前 386 年的“大王和约”把小亚细亚的希腊城邦交还波斯，斯巴达则以和约执行者的身份拆散各地的联盟。他对底比斯尤其敌视：斯巴达人占据底比斯卫城、斯福德里亚斯偷袭比雷埃夫斯未遂，事后都因他的态度而未受惩处；前 378 年、前 377 年他两度率军侵入彼奥提亚。前 371 年在斯巴达举行的和会上，伊巴密浓达坚持代表全彼奥提亚签字，他把底比斯从和约中除名。二十天后斯巴达军在留克特拉战败，统兵的是另一位国王克列翁布洛托斯。

  前 370 年冬伊巴密浓达攻入拉科尼亚，前 362 年再次逼近，他两次守住了没有城墙的斯巴达。为筹措军费，他年过八十还到埃及为法老塔科斯统领雇佣军，随后转而支持起兵的涅克塔涅博二世。归途中他死在昔兰尼加海岸一处叫“墨涅拉奥斯港”的地方，时约前 360 年。色诺芬是他的朋友，为他写了一篇颂传。
sources: []
recalled:
