name: 游斯丁
aliases:
  - 殉道者游斯丁
  - 犹斯定
  - 查士丁
role: 护教士、殉道者
summary: 二世纪最著名的护教士，在罗马写成《护教书》，后在罗马被斩首。
body: |-
  游斯丁生在撒玛利亚的弗拉维亚·尼亚波利，就是旧日的示剑、今天的纳布卢斯一带，父母都不是基督徒。他自述早年先后跟从斯多亚派、逍遥派、毕达哥拉斯派和柏拉图派的老师寻求真理。据他的《与特来弗对话录》，他在海边遇见一位老人，老人向他讲论旧约先知，他由此归信基督。《历史的轨迹》说他是在以弗所研读先知书时归信的，书中引了他自述心中"燃起一道火焰"的话。归信之后，他仍穿着哲学家的外袍，把基督教看作"唯一稳妥有益的哲学"。

  他后来在罗马开设学塾教导人。约公元 153 年前后，他在罗马写成《护教书》，上书给安东尼·庇护皇帝，驳斥当时加给基督徒的种种罪名，说明基督徒聚会、洗礼和圣餐的做法。这是现存对二世纪中叶基督徒礼拜最详细的描述。他另有一篇篇幅较短的《第二护教书》，以及与犹太人特来弗辩论的《对话录》，都流传至今。

  当时与基督教辩论的人当中，有一位叫克理索的哲学家，约在公元 177 年写书攻击基督教。游斯丁并没有和他交锋，回应克理索的是七十年后的俄利根。

  据《游斯丁殉道记》，他和另外六位基督徒在罗马城长官鲁斯提库斯面前受审，拒绝向神像献祭，被鞭打后斩首。鲁斯提库斯任此职约在公元 162—168 年之间，所以他的殉道通常定在 165 年前后；《历史的轨迹》作约 165 年，又在另一处写他生卒为公元 100—166 年。后世因此称他为"殉道者游斯丁"。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三章“教会内部的成长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter04.html"
recalled:
  - 游斯丁《第一护教书》《与特来弗对话录》第 2—8 章
  - 《游斯丁殉道记》
