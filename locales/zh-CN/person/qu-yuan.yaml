name: 屈原
aliases: [屈平, 灵均]
role: 楚国大夫，诗人
summary: 楚国大夫、诗人，遭谗被放逐，郢都陷落后自沉汨罗江；著《离骚》。
body: |-
  屈原名平，字原，是楚国王族的同姓，生卒年说法不一，一般认为约在公元前 340 年至前 278 年。他的出生地传统上认为在今湖北秭归，也有其他说法。

  据《史记·屈原贾生列传》，屈原博闻强记，明于治乱，娴于辞令，曾任楚怀王的左徒，对内与怀王商议国事、起草法令，对外接待宾客、应对诸侯。上官大夫想夺取他起草的宪令未成，在怀王面前进谗，怀王从此疏远了屈原。屈原主张联合齐国对抗秦国。张仪欺骗楚怀王，使楚与齐绝交，楚军随后在丹阳、蓝田大败。公元前 299 年，秦昭王约怀王在武关相会，屈原劝阻，怀王听从儿子子兰的意见前往，被秦国扣留，三年后死在秦国。

  顷襄王即位后，子兰为令尹，屈原再次遭到谗毁，被放逐到江南。公元前 278 年，秦将白起攻破楚都郢，据传屈原悲愤之下作《哀郢》，不久抱石自沉汨罗江。后世把端午节与纪念屈原联系起来，这一说法见于南朝时的《续齐谐记》《荆楚岁时记》等书。

  屈原是中国最早留下姓名的大诗人。他的作品以楚地的语言和音乐为基础，形成了“楚辞”这一文体，代表作《离骚》是中国古代最长的抒情诗，另有《九歌》《天问》《九章》等。《离骚》与《诗经》的《国风》并称“风骚”，对后世文学影响极为深远。哪些作品确为屈原所作，学界有不同意见。
sources: []
recalled:
  - 《史记·屈原贾生列传》
  - 《楚辞》
  - 《荆楚岁时记》
