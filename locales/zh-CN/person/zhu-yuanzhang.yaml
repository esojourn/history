name: 朱元璋
aliases: [朱重八, 明太祖, 洪武帝]
role: 明朝开国皇帝
summary: 出身贫苦农家，元末参加红巾军，先后消灭陈友谅、张士诚，1368 年建立明朝。
body: |-
  朱元璋原名朱重八，后改名兴宗，濠州钟离（今安徽凤阳）人，生于天历元年（公元 1328 年），出身贫苦的佃农家庭。至正四年（1344 年）淮北大旱，又有蝗灾和瘟疫，他的父母和长兄相继去世，他到皇觉寺当了行童，不久寺中断粮，他又外出化缘，在淮西一带流浪了三年。

  至正十二年（1352 年）他投奔在濠州起兵的郭子兴，因作战勇敢、机智，受到郭子兴的赏识，娶了郭的养女马氏。此后他回乡招兵，收罗了徐达、汤和等人，又招纳李善长等文士。郭子兴死后，他逐渐掌握了这支队伍，名义上奉韩林儿的龙凤年号。至正十六年（1356 年）他攻下集庆，改名应天（今江苏南京），作为根据地。他采纳朱升“高筑墙，广积粮，缓称王”的建议，一面屯田积粮，一面延揽刘基、宋濂等浙东士人。

  当时朱元璋西有陈友谅、东有张士诚。他采纳刘基的意见，先对付势力更强的陈友谅，至正二十三年（1363 年）在鄱阳湖决战，陈友谅中箭身死（另见“鄱阳湖之战”条）。次年他自称吴王。至正二十六年（1366 年）他派人从滁州迎韩林儿到应天，途中船只在瓜步沉没，韩林儿溺死，此事一般认为出于朱元璋的授意。至正二十七年（1367 年）他攻下平江，张士诚被俘，浙东的方国珍也随后投降。同年十月他派徐达、常遇春北伐，发布檄文，提出“驱逐胡虏，恢复中华”。

  至正二十八年（1368 年）正月，朱元璋在应天称帝，国号大明，建元洪武，是为明太祖。同年闰七月元顺帝北走，八月徐达攻入大都，元朝在中原的统治结束（另见“明朝建立”条）。此后他在位三十年，废除丞相制度，大兴胡惟庸、蓝玉等大案，诛杀大批功臣，洪武三十一年（1398 年）在应天去世，葬于孝陵。
sources: []
recalled:
