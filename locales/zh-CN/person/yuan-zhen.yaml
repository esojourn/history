name: 元稹
aliases: [元微之]
role: 诗人、宰相
summary: 唐代诗人，与白居易齐名，并称“元白”，著有传奇《莺莺传》，曾短暂任宰相。
body: |-
  元稹字微之，河南洛阳人，大历十四年（公元 779 年）生，北魏皇族的后裔。他八岁丧父，由母亲郑氏教他读书。十五岁明经及第，贞元十九年（803 年）与白居易同登书判拔萃科，任校书郎，两人从此结为好友。元和元年（806 年）他又考中制科第一，任左拾遗。

  元和四年（809 年）他任监察御史，出使东川，弹劾已故东川节度使严砺违法加征赋税，得罪了不少权贵。次年他从洛阳回京，途中在华州敷水驿与宦官刘士元争住上房，被刘士元打伤，朝廷反而把他贬为江陵士曹参军，此后又转任通州司马。在这十年间，他与白居易书信往来、诗歌唱和不断。他的妻子韦丛去世后，他写了《遣悲怀》三首等悼亡诗。

  唐穆宗时他被召回朝中，任翰林学士，他结交宦官崔潭峻，受到朝野的非议。长庆二年（822 年）他任宰相，只做了三个多月，就因与裴度互相攻讦被罢，出为同州刺史，后任浙东观察使多年。大和四年（830 年）他任武昌军节度使，次年在鄂州去世，年五十三。

  元稹与白居易一起提倡新乐府，诗风相近，世称“元白”（另见“新乐府运动”条），代表作还有《连昌宫词》等。他写的传奇《莺莺传》，讲述张生与崔莺莺的爱情故事，后来金代董解元的《西厢记诸宫调》和元代王实甫的杂剧《西厢记》都由此改编而成。白居易的文集是他编订作序的。
sources: []
recalled:
  - 《旧唐书·元稹传》
  - 《新唐书·元稹传》
  - 白居易《唐故武昌军节度使元公墓志铭》
