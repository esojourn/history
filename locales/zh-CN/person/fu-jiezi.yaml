name: 傅介子
aliases: [义阳侯]
role: 使者
summary: 汉昭帝时出使西域的使者，设计刺杀亲附匈奴的楼兰王，楼兰由此改名鄯善。
body: |-
  据《汉书·傅常郑甘陈段传》，傅介子是北地郡人，从军出身。武帝以后，西域的楼兰、龟兹在汉与匈奴之间摇摆，曾多次截杀汉朝使者。昭帝元凤年间，傅介子以骏马监的身份请求出使大宛，奉诏顺路责问楼兰王和龟兹王，两王都表示服罪。他从大宛返回经过龟兹时，得知有匈奴使者在那里，便率随从把匈奴使者杀死。回朝后他被任为中郎，升平乐监。

  他向大将军霍光建议刺杀反复无常的国王以警示各国。元凤四年（公元前 77 年），他带着金帛到楼兰，声称是来赏赐各国的。楼兰王安归起初不肯亲近，他假装离去，让翻译转告说带有大量黄金锦绣，楼兰王于是前来会见。席间他请楼兰王入帐密谈，两名壮士从背后把楼兰王刺死。他向楼兰的贵人宣告这是汉天子对其罪行的惩罚，汉兵将到，不得妄动。

  汉朝改立在长安做人质的楼兰王之弟尉屠耆为王，把国名改为鄯善，并应新王的请求派兵在伊循屯田。傅介子被封为义阳侯，元康元年（前 65 年）去世。
sources: []
recalled:
  - 《汉书·傅常郑甘陈段传》
  - 《汉书·西域传上》
