name: 范晔
aliases: [范蔚宗]
role: 史学家
summary: 《后汉书》的作者，元嘉二十二年因参与拥立彭城王的密谋被杀。
body: |-
  范晔字蔚宗，顺阳人，祖父范宁注过《春秋穀梁传》，父亲范泰在宋初官至侍中。他少年好学，博通经史，善写文章，通晓音律，擅长弹琵琶。入宋后在彭城王刘义康府中任职，后任尚书吏部郎。

  元嘉九年（公元 432 年），刘义康的母亲去世，下葬前夕，宾客聚集王府，他与朋友夜里饮酒，打开北窗听挽歌取乐。刘义康大怒，把他贬为宣城太守。据《宋书》本传，他在宣城郁郁不得志，于是删取各家的后汉史书，撰成一部《后汉书》。后来他又回朝任职，官至太子詹事。

  元嘉二十二年（445 年），鲁国人孔熙先等谋划拥立已被贬斥的刘义康，范晔参与其中，事情泄露，他与同谋者一起被处死，年四十八。他是否真的有意谋反，后世有人怀疑，清代王鸣盛等学者认为他是被诬陷的。

  范晔原计划写十纪、十志、八十列传，志没有完成就被杀了。今本《后汉书》中的八志，是南朝梁刘昭把西晋司马彪《续汉书》的志补进来作注的，宋代以后才与范书合刊。范晔在纪传之外新设了《党锢》《宦者》《文苑》《独行》《方术》《逸民》《列女》等类传，为后来的正史沿用。他在狱中写给甥侄的信里，自称书中的序论“皆有精意深旨”，可与《过秦论》相比。他的书出现后，原有的十几家后汉史书逐渐失传，只有袁宏的《后汉纪》和片段流传下来。
sources: []
recalled:
  - 《宋书·范晔传》
  - 范晔《狱中与诸甥侄书》
