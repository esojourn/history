name: 马西尼萨
aliases: [马西尼撒, 马辛尼萨]
role: 努米底亚国王
summary: 努米底亚国王，由迦太基转投罗马，扎马会战中率骑兵助西庇阿取胜。
body: |-
  努米底亚马西利人的王子，国王盖亚之子，约生于公元前 238 年，据说少年时在迦太基受教育。

  第二次布匿战争期间，他起初率努米底亚骑兵在西班牙为迦太基作战，前 211 年参与击溃西庇阿兄弟。前 206 年迦太基人在伊利帕战败后，他与大西庇阿秘密会面，转投罗马。同年他父亲去世，王位几经争夺，西边马赛西利人的国王西法克斯在迦太基支持下占了他的国土，他一度只带着少数骑兵在山野间流亡。

  前 204 年西庇阿在非洲登陆，他带骑兵来会。次年两人夜袭焚毁了西法克斯和迦太基人的营地，又在大平原获胜；他与罗马将领莱利乌斯追入努米底亚，俘获西法克斯，夺取都城基尔塔。据李维，他当天娶了西法克斯的妻子、迦太基贵族之女索福尼斯巴；西庇阿担心她使他倒向迦太基，要求把她交出，他送去毒药让她自尽。前 202 年扎马会战，他率努米底亚骑兵在罗马右翼，先逐走对方骑兵，再回头冲击汉尼拔步兵的后背，决定了战局。

  战后罗马承认他为全努米底亚的国王。他在位五十多年，波利比乌斯和斯特拉波说他使游牧的努米底亚人转向定居农耕。和约规定迦太基未经罗马同意不得开战，他借此不断蚕食迦太基的土地，罗马派去仲裁的使团几乎总是偏向他。前 150 年迦太基出兵反击，被他击败；罗马以违约为由宣战，是为第三次布匿战争。

  波利比乌斯见过他，说他年近九十仍能整日骑马。前 148 年他去世，临终请小西庇阿来安排后事，王国由三个儿子米基普萨、古卢萨、马斯塔纳巴尔分掌。
sources: []
recalled:
  - 波利比乌斯《历史》卷十四、卷十五、卷三十六第 16 章
  - 李维《建城以来史》卷二十八至卷三十
  - 阿庇安《布匿战争》
  - 斯特拉波《地理学》卷十七
