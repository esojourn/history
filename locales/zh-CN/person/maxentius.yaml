name: 马克森提乌斯
aliases: [马克森狄, 马克森丢, 马克森提]
role: 罗马皇帝
summary: 马克西米安之子，在罗马自立六年，兵败米尔维安桥，溺死台伯河。
body: |-
  马克森提乌斯约生于公元 278 年，是马克西米安的儿子、伽列里乌斯的女婿。305 年两位老皇帝退位，新立的“恺撒”里没有他。306 年 10 月 28 日，罗马的禁卫军和市民拥立了他；当时朝廷正要向罗马城征税，并打算裁撤禁卫军。

  他占有意大利和北非。奉命讨伐的皇帝塞维鲁因部下倒戈而败死，伽列里乌斯亲自来攻也无功而返。308 年的卡农图姆会议宣布他为僭主。他在罗马大兴土木，广场边的大会堂就是他开工的。他在自己的地盘上停止了对基督徒的逼迫，后来还发还教会产业；优西比乌和拉克坦提乌斯却把他写成暴君，这些都是胜利者一方的记述。

  312 年君士坦丁越过阿尔卑斯山，在都灵、维罗纳连胜。10 月 28 日，他即位整六年的那天，他出城在米尔维安桥迎战，兵败后退上浮桥，落进台伯河淹死。2006 年考古学家在帕拉丁山脚发现一批埋藏的权杖和仪仗矛，推测是他的遗物。
sources: []
recalled:
  - 拉克坦提乌斯《论迫害者之死》第 26—27、43—44 章
  - 优西比乌《教会史》卷 8 第 14 章、卷 9 第 9 章
  - 佐西莫斯《新历史》卷 2 第 9—17 章
  - 《拉丁颂词集》第 12 篇
