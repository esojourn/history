name: 郭象
aliases: [郭子玄]
role: 太傅主簿
summary: 西晋玄学家，所注《庄子》是流传至今最重要的古注，今本《庄子》三十三篇由他编定。
body: |-
  郭象字子玄，河南人，生年和具体乡里不详。他年少时就有才理，喜好《老子》《庄子》，善于清谈。据《晋书》本传，太尉王衍常说，听郭象说话就像瀑布倾泻，滔滔不绝。州郡征召，他起初都不应，后来出任司徒掾、黄门侍郎。东海王越执政时用他做太傅主簿，他在职专权，本传说他“熏灼内外”，舆论因此看轻了他。永嘉末年（公元 312 年）病逝。

  他的《庄子注》与向秀的旧注是什么关系，古来有不同说法。《晋书》本传和《世说新语·文学》说，向秀的注没有流传，他据为己有，只自注了《秋水》《至乐》两篇、改换了《马蹄》一篇，其余不过点定文句。《晋书·向秀传》则说他是在向秀注的基础上“述而广之”。后世学者多认为他在向注之上有自己的发展。

  他的注主张万物各自生成变化，没有造物者，称为“独化”；又认为遵行名教与顺应自然并不矛盾。现在通行的《庄子》内、外、杂三十三篇，就是他注本的篇目。
sources: []
recalled:
  - 《晋书·郭象传》
  - 《晋书·向秀传》
  - 《世说新语·文学》
