name: 布狄卡
aliases: [布迪卡, 布狄卡女王, 波阿狄西亚]
role: 不列颠爱西尼人的女王
summary: 不列颠爱西尼人的女王，公元 60 年前后起兵反抗罗马，兵败身死。
body: |-
  布狄卡是不列颠东部爱西尼人的王后，丈夫普拉苏塔古斯是依附罗马的王。她的事迹只见于塔西佗和卡西乌斯·狄奥，生年和出身都没有记载。

  据塔西佗，普拉苏塔古斯在遗嘱里让罗马皇帝与自己的两个女儿共同继承，想借此保全家国。他死后，罗马官吏把爱西尼人的土地当作战利品接管，布狄卡遭到鞭打，两个女儿被奸污。公元 60 年（一说 61 年），她趁总督苏埃托尼乌斯·保利努斯远征西边的莫纳岛，联合邻近的特里诺文特人起兵，烧毁了卡穆洛杜努姆，击溃赶来的第九军团一部，又毁掉伦狄尼乌姆和维鲁拉米乌姆。塔西佗说三地被杀的罗马人和盟友约有七万。

  保利努斯带约一万人回师，选了一处背靠树林的狭地决战，地点今天已不能确指。不列颠人大败。塔西佗说布狄卡服毒自尽，狄奥说她是病死的。十九世纪她在英国被奉为民族英雄，伦敦威斯敏斯特桥边立有她驾战车的铜像。
sources: []
recalled:
  - 塔西佗《编年史》卷 14 第 29—39 章
  - 塔西佗《阿古利可拉传》第 14—16 章
  - 卡西乌斯·狄奥《罗马史》卷 62 第 1—12 章
