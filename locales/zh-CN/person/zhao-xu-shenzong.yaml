name: 宋神宗
aliases: [赵顼, 赵仲鍼]
role: 北宋皇帝
summary: 宋英宗之子，1067 年继位，任用王安石推行变法，又发动对西夏的战争。
body: |-
  宋神宗赵顼是宋英宗的长子，庆历八年（公元 1048 年）生于开封。治平四年（1067 年）英宗去世，他二十岁即位。当时朝廷财政拮据，军队人数多而战斗力弱，对辽、对西夏都处于被动，年轻的神宗有心改变这种局面。

  熙宁二年（1069 年），他任命王安石为参知政事，设立制置三司条例司，陆续推行青苗、均输、农田水利、免役、市易、保甲、将兵等新法（另见“王安石变法”条）。新法遭到韩琦、富弼、司马光、苏轼等许多大臣的反对，朝廷由此分为支持和反对新法的两派。熙宁七年（1074 年）发生大旱，郑侠献上《流民图》，加上两宫太后的反对，神宗一度罢免王安石，次年又复用，熙宁九年（1076 年）王安石第二次罢相，此后不再回朝。神宗亲自主持，继续推行新法。

  元丰年间（1078—1085 年）神宗改革官制，按照《唐六典》恢复三省六部的职能，史称“元丰改制”。对外，他支持王韶经营熙河，收复了今甘肃东南一带；元丰四年（1081 年）又发动五路大军攻打西夏，次年在永乐城遭到惨败（另见“宋伐西夏与永乐城之战”条）。据说他得知永乐城失守，在朝堂上痛哭，此后身体日渐衰弱。元丰七年（1084 年）司马光进呈《资治通鉴》，神宗为它写了序。

  元丰八年（1085 年）三月神宗去世，年三十八岁。年仅九岁的儿子赵煦继位，即宋哲宗，由神宗的母亲高太后垂帘听政，新法随即被大量废除（另见“元祐更化”条）。
sources: []
recalled:
  - 《宋史·神宗本纪》
  - 《续资治通鉴长编》卷二百九至三百五十三
