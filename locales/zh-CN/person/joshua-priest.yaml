name: 大祭司约书亚
aliases: [耶书亚]
role: 大祭司
summary: 约萨达的儿子，归回后的首任大祭司，与所罗巴伯一同重建圣殿。
body: |-
  约萨达的儿子；《以斯拉记》《尼希米记》把他的名字写作“耶书亚”，《哈该书》《撒迦利亚书》写作“约书亚”。据《历代志上》6:14–15，他的祖父西莱雅是耶路撒冷陷落时的大祭司，父亲约萨达被掳到巴比伦。圣经没有记载他的生卒年。

  他与所罗巴伯一同率众归回（拉 2:2），在耶路撒冷筑坛献祭、立殿的根基（拉 3 章）；大流士第二年又同所罗巴伯起来复工（拉 5:2；该 1:14）。

  《撒迦利亚书》第 3 章记先知在异象中看见他穿着污秽的衣服站在耶和华的使者面前，撒但站在他右边与他作对；使者吩咐给他脱去污秽的衣服，换上华美的衣服，戴上洁净的冠冕。6:9–15 又记先知奉命用金银作冠冕戴在他头上，并提到那称为“苗裔”的要建造耶和华的殿。《尼希米记》12:10 记他的儿子是约雅金，其后大祭司的世系由此延续。
sources: []
recalled:
  - 《以斯拉记》第 2—5 章
  - 《哈该书》第 1—2 章
  - 《撒迦利亚书》第 3 章、6:9–15
  - 《历代志上》6:14–15
  - 《尼希米记》12:10
