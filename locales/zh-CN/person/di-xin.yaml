name: 商纣王
aliases: [帝辛, 纣, 受]
role: 商朝末代君主
summary: 商朝最后一位君主，古书称他暴虐，在牧野之战中败于周武王，自焚而死。
body: |-
  商纣王名受，又称帝辛，“纣”是后人加给他的恶谥。据《史记·殷本纪》，他是帝乙的少子，母亲是正后，所以虽有庶兄微子启，仍由他继位。夏商周断代工程把他的在位年代定为约公元前 1075 年至前 1046 年。

  《史记》说纣天资聪颖、力气过人，但好酒淫乐，宠爱妲己，加重赋税充实鹿台、钜桥，“以酒为池，县肉为林”，又设“炮格之刑”。他以西伯昌、九侯、鄂侯为三公，杀九侯、鄂侯，囚西伯于羑里。叔父比干强谏被剖心，箕子装疯为奴，庶兄微子出走。

  关于纣的种种恶行，古人已有怀疑。《论语·子张》记子贡说：“纣之不善，不如是之甚也。是以君子恶居下流，天下之恶皆归焉。”许多细节可能是周人和后世的渲染。另一方面，甲骨卜辞和《左传》都提到商末对东方夷人的大规模征伐，《左传》昭公十一年说“纣克东夷而陨其身”，长期用兵可能削弱了商朝的力量。

  周武王联合诸侯伐商，双方在牧野会战，商军倒戈，纣兵败，登上鹿台，穿上饰有宝玉的衣服，自焚而死。周武王用黄钺斩下他的头，悬挂在白旗上。商朝至此灭亡。

  “酒池肉林”“炮烙之刑”等说法都出自关于纣的记载（《史记》作“炮格”）。
sources: []
recalled:
  - 《史记·殷本纪》
  - 《史记·周本纪》
  - 《论语·子张》
  - 《左传》昭公十一年
