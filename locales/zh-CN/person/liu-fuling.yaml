name: 汉昭帝
aliases: [刘弗陵, 孝昭皇帝]
role: 皇帝
summary: 汉武帝幼子，八岁即位，由霍光辅政，在位十三年，其间减轻赋役、召开盐铁会议。
body: |-
  刘弗陵是汉武帝最小的儿子，生于太始三年（公元前 94 年），母亲赵倢伃号钩弋夫人。巫蛊之祸后太子之位空缺，武帝晚年决定立他为嗣。他的母亲在武帝去世前不久受谴责而死。后元二年（前 87 年）二月武帝去世，他继位，年仅八岁，由姐姐鄂邑长公主在宫中照料，朝政委托给大司马大将军霍光等辅政大臣。

  他在位时，朝廷多次减免田租和口赋，派使者到各地巡视，赈济贫民。始元六年（前 81 年），朝廷召集各地的贤良、文学讨论盐铁官营等政策，会后取消了酒类专卖。同年苏武从匈奴归来。据《汉书·霍光传》，元凤元年（前 80 年）有人以燕王的名义上书告霍光专权，十四岁的昭帝看出其中的破绽，认定上书是伪造的，继续信任霍光；不久上官桀等人的阴谋败露被杀。

  元凤四年他行冠礼，但政事仍由霍光主持。元平元年（前 74 年）四月，他在未央宫去世，年二十一岁，没有儿子，葬于平陵。《汉书·昭帝纪》的赞语说，他在位时百姓的生活渐渐充实，四夷归附。
sources: []
recalled:
  - 《汉书·昭帝纪》
  - 《汉书·霍光金日磾传》
  - 《汉书·外戚传上》
