name: 贯休
aliases: [姜德隐, 禅月大师]
role: 诗僧、画家
summary: 唐末五代的诗僧和画家，晚年入蜀，受王建礼遇，赐号禅月大师，以罗汉画著称。
body: |-
  贯休俗姓姜，字德隐，婺州兰溪人，太和六年（公元 832 年）生，年幼时便出家为僧。他能诗善书，又擅长绘画，唐末已经很有名气，往来于江浙一带。

  据宋人记载，他曾去杭州拜见钱镠，献诗中有“满堂花醉三千客，一剑霜寒十四州”之句，钱镠让他把“十四州”改为“四十州”，他不肯，说州难添、诗也难改，随即离去。这个故事流传很广，但细节出自后人的记载。

  天复三年（903 年），他到达成都，蜀王王建对他十分礼遇，赐号“禅月大师”。他在成都度过了晚年，乾化二年（912 年）去世，年八十一。他的诗集名为《禅月集》。贯休画的罗汉像形貌奇特，粗眉大眼、高鼻深目，号称“胡貌梵相”，据说是他在梦中所见。传为他所作的《十六罗汉图》现藏日本，是否为原作学界尚有争议。
sources: []
recalled:
  - 《宋高僧传·贯休传》
  - 黄休复《益州名画录》
  - 《宣和画谱》卷三
