name: "巴罗"
aliases: ["亨利·巴罗", "巴饶"]
role: "伦敦分离派的律师"
summary: "伦敦律师，因举行分离派聚会被捕，在狱中著文，1593 年与格林伍德一同被处死。"
body: |-
  巴罗约 1550 年生于诺福克郡，剑桥出身，在伦敦做律师。《历史的轨迹》第三十二章说，1587 年他和一位名叫格林伍德的牧师因举行分离派聚会在伦敦被捕入狱。两人在狱中写了几篇文章，攻击安立甘派，也攻击留在国家教会里的清教徒，阐明公理派原则；这些文章被偷运到荷兰出版，使公理派思想传得更广，赢得许多信徒。

  书中说，受他们文章影响而加入的人当中，有一位清教徒牧师强生。1592 年伦敦成立了公理派教会，强生被选为牧师，格林伍德任教师。第二年春天，巴罗和格林伍德因不肯承认伊丽莎白女王在教会中有最高权柄，被处死刑；据一般记载是 1593 年 4 月在伦敦泰伯恩被绞死。同年国会立法，凡不服女王最高治权、拒绝到国家教会聚会的人一概放逐，伦敦的公理派信徒大多逃往阿姆斯特丹，强生继续在那里做他们的牧师。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
