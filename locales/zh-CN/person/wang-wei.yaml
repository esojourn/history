name: 王维
aliases: [王摩诘, 王右丞, 诗佛]
role: 诗人、画家
summary: 盛唐诗人和画家，山水田园诗的代表，诗中有画，信奉佛教，官至尚书右丞。
body: |-
  王维字摩诘，祖籍太原祁县，父亲迁居蒲州。他的生年有 699 年、701 年等说法。他少年时即以诗文和音乐闻名，开元九年（公元 721 年）进士及第，任太乐丞，不久因属下伶人私舞黄狮子获罪，被贬为济州司仓参军。开元二十二年（734 年）前后，张九龄任宰相，提拔他为右拾遗。开元二十五年（737 年）他以监察御史的身份出使河西节度使的幕府，写下《使至塞上》，其中“大漠孤烟直，长河落日圆”一联广为传诵。

  他笃信佛教，母亲崔氏师事北宗禅师普寂多年，他自己也与禅宗僧人往来，名、字都取自佛经中的维摩诘居士。中年以后他亦官亦隐，在长安东南的蓝田买下初唐诗人宋之问的辋川别业，与好友裴迪在其间游赏唱和，编成《辋川集》。他的山水田园诗清淡幽远，与孟浩然并称“王孟”。

  天宝十五载（756 年）安禄山的叛军攻入长安，他没有逃出，被俘后服药装作哑病，仍被押到洛阳，被迫接受伪职。他在被拘禁的菩提寺中听说叛军在凝碧池奏乐，写诗表达对唐室的思念。叛乱平定后，接受伪职的官员都要治罪，因为这首诗和弟弟王缙请求削减自己的官职为他赎罪，他只被降为太子中允，后来逐步升任尚书右丞，世称“王右丞”。

  上元二年（761 年）七月他去世。他也是著名的画家，擅长水墨山水，苏轼评论他“味摩诘之诗，诗中有画；观摩诘之画，画中有诗”。明代董其昌把他尊为“南宗”山水画之祖，但传世署名为他的画作是否真迹，学界多有怀疑。
sources: []
recalled:
  - 《旧唐书·文苑传·王维》
  - 《新唐书·文艺传·王维》
  - 苏轼《书摩诘蓝田烟雨图》
