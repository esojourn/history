name: 董贤
aliases: [董圣卿, 高安侯]
role: 大司马
summary: 汉哀帝的宠臣，二十二岁任大司马，哀帝一死即被王莽罢免，当日自杀。
body: |-
  据《汉书·佞幸传》，董贤字圣卿，云阳人。哀帝还是太子时他任太子舍人，哀帝即位后随例为郎。两年多后，他在殿下报时，哀帝望见他相貌俊美，召他上殿谈话，任为黄门郎，从此得宠，不久升为驸马都尉、侍中，出则同车，入则随侍左右，短时间内得到的赏赐极多。

  本传记两人常同卧起。有一次白天同睡，哀帝要起身，衣袖被董贤压着，他不想惊醒董贤，就把袖子割断，后世“断袖”一词出于此。哀帝让董贤的妻子可以出入宫中，立他的妹妹为昭仪，又在宫阙旁为他修建大宅，在自己的陵墓旁预先为他修墓。他被封为高安侯。丞相王嘉反对给他加封，被下狱，绝食而死。元寿元年（公元前 2 年）末，他被任命为大司马卫将军，这时才二十二岁。本传还记哀帝在酒宴上说想仿效尧把帝位让给舜，把天下传给董贤，被在场的王闳劝阻。

  元寿二年（前 1 年）六月哀帝去世。太皇太后王政君召见董贤，问他丧事如何安排，他答不上来。王政君随即召来王莽，王莽让人弹劾董贤，不许他进入宫中，并收回大司马的印绶。董贤当天与妻子一同自杀。他的家产被官府没收变卖，本传说共值四十三万万钱。
sources: []
recalled:
  - 《汉书·佞幸传》
