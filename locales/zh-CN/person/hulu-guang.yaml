name: 斛律光
aliases: [斛律明月, 落雕都督]
role: 名将
summary: 北齐名将，屡败北周，后被北周的反间计和朝中奸臣陷害致死。
body: |-
  斛律光字明月，斛律金的儿子。他少年善骑射，据《北齐书》本传，他曾随高澄打猎，一箭射中正在高飞的大雕，从此被称为“落雕都督”。他历仕东魏、北齐，多次与西魏、北周作战，很少失败。河清三年（公元 564 年）北周与突厥联军进攻洛阳，他与兰陵王高长恭等人在邙山击败周军；武平二年（571 年），他在汾水以北与北周名将韦孝宽相持，击败周军，修筑城戍。他官至左丞相，女儿是北齐后主的皇后。

  北周的韦孝宽忌惮他，编造了“百升飞上天，明月照长安”“高山不推自崩，槲树不扶自竖”等歌谣，派间谍在邺城散布。“百升”就是一斛，暗指斛律光；“明月”是他的字。朝中的祖珽、穆提婆等人与他有隙，借机诬告他谋反。武平三年（572 年），后主把他召入宫中，派力士刘桃枝用弓弦把他勒死，年五十八，他的家族也遭诛杀。

  据《北齐书》，北周武帝听到他的死讯后大喜，下令大赦。五年后北周灭齐，周武帝追赠他为上柱国，说如果此人还在，自己哪能到得了邺城。
sources: []
recalled:
  - 《北齐书·斛律光传》
  - 《资治通鉴》卷一百七十一
