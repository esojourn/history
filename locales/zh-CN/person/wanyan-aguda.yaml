name: 完颜阿骨打
aliases: [金太祖, 完颜旻]
role: 金朝开国皇帝
summary: 女真完颜部首领，1114 年起兵反辽，次年称帝建立金朝，攻下辽朝五京中的四京。
body: |-
  完颜阿骨打是女真完颜部首领劾里钵的次子，生于辽咸雍四年（公元 1068 年）。当时女真各部臣服于辽朝，辽朝每年派使者到女真地区索取名鹰“海东青”等物，使者常常勒索欺凌，女真人深为不满。天庆二年（1112 年）天祚帝在春州召集女真各部首领参加“头鱼宴”，让他们轮流起舞，阿骨打拒不从命，天祚帝一度想杀他。次年他的哥哥乌雅束去世，他继任为首领。

  天庆四年（1114 年）九月，阿骨打以辽朝不肯交还女真叛逃者阿疏为理由，在来流水誓师起兵，攻下宁江州；十月又在出河店大败辽军。据《金史》，这时他的军队已有一万人。次年正月他称帝，国号大金，年号收国，据说取名“金”是因为按出虎水出产金子，又寓意金不会变坏。同年他在护步答冈击败天祚帝亲率的辽军（另见“金建国”条）。

  他把女真部落原有的猛安谋克组织改为军政合一的制度，以三百户为一谋克、十谋克为一猛安；又命完颜希尹创制女真文字。此后金军接连攻下辽朝的东京、上京、中京、西京。天辅四年（1120 年）他与宋朝约定夹攻辽朝，即“海上之盟”（另见该条）。天辅六年（1122 年）年底，宋军攻燕京失败，他亲率金军攻下燕京，后来按约定把燕京及附近六州交给宋朝，换取宋朝的岁币和“代税钱”。

  天辅七年（1123 年）八月，阿骨打在回师途中病逝，终年五十六岁，他的弟弟吴乞买继位，即金太宗。
sources: []
recalled:
  - 《金史·太祖本纪》
  - 《三朝北盟会编》
  - 《辽史·天祚皇帝本纪》
