name: 加拉·普拉西提阿
aliases: [加拉·普拉西狄亚, 普拉西提阿, 加拉·普拉基狄娅]
role: 西罗马皇太后、摄政
summary: 狄奥多西一世之女，做过哥特王后，后为幼子瓦伦提尼安三世摄政十余年。
body: |-
  加拉·普拉西提阿是狄奥多西一世与第二位皇后所生的女儿，生年有公元 388 年至 393 年几种推算。父亲死后，她在斯提利科和塞蕾娜家里长大。408 年斯提利科被杀，阿拉里克围困罗马，元老院怀疑塞蕾娜通敌，把她处死；佐西莫斯说普拉西提阿也表示了同意。

  410 年罗马陷落前后，她落到哥特人手里，被带往高卢。414 年 1 月，哥特王阿陶尔夫在纳尔博按罗马的礼仪娶了她。两人生了一个儿子，取名狄奥多西，不久夭折。415 年阿陶尔夫在巴尔基诺遇刺，继位的西格里克逼她徒步走在自己的马前，走了十二里。下一位王瓦利亚与罗马讲和，416 年把她送回，换得六十万斗粮食。

  417 年 1 月，哥哥霍诺里乌斯强令她嫁给将军君士坦提乌斯，生下女儿霍诺里娅和儿子瓦伦提尼安。421 年君士坦提乌斯被立为皇帝，她得到“奥古斯塔”称号；同年丈夫去世，她与哥哥失和，423 年带着子女去了君士坦丁堡。这年霍诺里乌斯死，拉文纳的一个文官被拥立。侄子狄奥多西二世派兵护送她母子回意大利，425 年六岁的瓦伦提尼安三世即位，由她摄政。

  她主政的十来年里，几位将领争权。432 年她倚重的博尼法斯打败埃提乌斯，自己却伤重而死；次年埃提乌斯借匈人之力回来，从此兵权都在他手里，北非也在这期间落入汪达尔人之手。儿子成年后她渐渐退居幕后，在拉文纳修建教堂。450 年她写信给东部朝廷，支持教皇利奥一世在基督论争议中的立场，同年 11 月 27 日在罗马去世。拉文纳那座以她命名、满壁镶嵌画的小陵墓是她在世时所建，她本人多半葬在罗马。
