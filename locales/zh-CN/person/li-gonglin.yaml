name: 李公麟
aliases: [李龙眠, 龙眠居士, 李伯时]
role: 北宋画家
summary: 北宋画家，擅长人物和鞍马，以白描著称，晚年归隐龙眠山。
body: |-
  李公麟是舒州人，生于皇祐元年（公元 1049 年），熙宁三年（1070 年）考中进士，此后在京城做官三十年左右，与苏轼、黄庭坚、米芾等人交游。他博学多识，收藏古器，精于鉴别。元符三年（1100 年）他因病退休，回到家乡的龙眠山居住，自号龙眠居士，崇宁五年（1106 年）去世。

  李公麟擅长画人物、佛道像和鞍马，取法顾恺之、吴道子等前代名家，把原来只用于起稿的墨线勾勒发展成独立的画法，不施色彩或只略加淡彩，称为“白描”，对后世人物画影响很大。传为他所作的《五马图》描绘西域进贡的骏马和牵马的人，原作曾流入日本，长期下落不明，2019 年在东京国立博物馆公开展出。宋人记载他曾画苏轼、米芾等人在驸马王诜家聚会的《西园雅集图》，这次聚会是否真有其事，学者有不同看法。
sources: []
recalled:
  - 《宋史·文苑传·李公麟》
  - 《宣和画谱》卷七
  - 邓椿《画继》卷三
