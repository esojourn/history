name: 李成
aliases: [李营丘, 李咸熙]
role: 五代宋初的山水画家
summary: 五代宋初的山水画家，擅画寒林平远，与关仝、范宽并称北宋三大山水画家。
body: |-
  李成字咸熙，生于后梁贞明五年（公元 919 年）。据《宋史》，他的先世是唐朝宗室，五代时为避战乱迁居北海，于是成为营丘（今山东青州一带）人。他博学多才，喜欢饮酒，以作画自娱，不肯为权贵作画。宋初他客游陈州，乾德五年（967 年）醉死在那里的客舍中。

  李成擅长画山水，尤其是北方平原上的寒林和平远景色，用墨清淡，后人有“惜墨如金”之说。北宋时他的名声极高，郭若虚《图画见闻志》把他与关仝、范宽并列，称为“三家鼎峙”。当时人收藏他的画成风，宋人记载中已有“世之所传李成画多伪”的说法，米芾甚至提出“无李论”，认为真迹几乎看不到了。今天传为他的作品，如《读碑窠石图》《晴峦萧寺图》等，作者归属都有争议。
sources: []
recalled:
  - 《宋史·文苑传·李成》
  - 郭若虚《图画见闻志》卷一、卷三
  - 刘道醇《圣朝名画评》
  - 米芾《画史》
