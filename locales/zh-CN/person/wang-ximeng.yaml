name: 王希孟
aliases: []
role: 北宋画家
summary: 宋徽宗时的少年画家，十八岁画成青绿山水长卷《千里江山图》。
body: |-
  王希孟的生平，史书没有记载，所知的情况几乎都来自《千里江山图》卷后蔡京的题跋。据题跋，政和三年（1113 年）闰四月，宋徽宗把这幅画赐给蔡京；王希孟这年十八岁，原是画学的学生，后来被召入宫中的文书库，几次献画都不够精妙，徽宗认为他可以造就，亲自加以指点，不到半年，他就画成此图献上。照此推算，他大约生于 1096 年。他后来的经历和卒年都不清楚，清代有人说他二十多岁就死了，没有可靠的根据。

  《千里江山图》现藏北京故宫博物院，绢本设色，长近十二米，用石青、石绿等矿物颜料描绘连绵的山峦、江湖、村舍、桥梁和舟船，是现存宋代青绿山水画中规模最大的作品之一。画上没有作者的署名，“王希孟”这个名字也只见于题跋和后人的著录，有学者对题跋所说的情况提出过疑问。
sources: []
recalled:
  - 《千里江山图》卷后蔡京跋
  - 宋荦《西陂类稿》中的题诗
