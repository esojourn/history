name: 奥瑞斯特斯
aliases: [欧瑞斯特, 奥雷斯特斯, 弗拉维乌斯·奥瑞斯特斯]
role: 西罗马统帅
summary: 做过阿提拉的书记，后为西罗马统帅，立幼子罗慕路斯为帝，被奥多亚克所杀。
body: |-
  奥瑞斯特斯是潘诺尼亚的罗马人，生年不详。那一带划归匈人以后，他给阿提拉当书记。449 年他作为阿提拉的使者到过君士坦丁堡，同行的匈人显贵埃德科，一般认为就是奥多亚克的父亲；随东罗马使团回访的普里斯库斯在书里几次写到他。

  阿提拉死后他回到罗马一方任职。475 年皇帝尤利乌斯·尼波斯任命他为统帅，他却带兵进逼拉文纳，尼波斯逃往达尔马提亚。同年 10 月 31 日，他没有自己称帝，而是把年少的儿子罗慕路斯立为皇帝，东部朝廷始终不予承认。

  476 年，军中的赫鲁利、斯基里等蛮族士兵要求分得意大利三分之一的土地，他拒绝了。士兵们在 8 月 23 日推奥多亚克为王。奥瑞斯特斯退守帕维亚，城被攻破；28 日他在普拉肯提亚被擒杀，他的弟弟几天后死在拉文纳城外。
sources: []
recalled:
  - 普里斯库斯《历史》残篇
  - 《无名氏瓦莱西亚努斯》第二部第 7—8 章
  - 约达尼斯《哥特史》第 45—46 章
  - 恩诺迪乌斯《埃皮法尼乌斯传》
