name: 范雎
aliases: [张禄, 应侯, 范且]
role: 秦国相
summary: 魏人，受辱后入秦，提出“远交近攻”，任秦相，封应侯。
body: |-
  范雎字叔，魏国人，生年不详。据《史记·范雎蔡泽列传》，他原在魏国中大夫须贾门下。须贾出使齐国，范雎随行，齐襄王听说他有辩才，赐给他金和牛酒，须贾怀疑他向齐国出卖魏国的情报，回国后告诉魏相魏齐。魏齐命人鞭打范雎，打断了他的肋骨和牙齿，用竹席裹起来丢在厕所里，让宾客往他身上撒尿。范雎装死逃出，在郑安平的帮助下改名张禄，随秦国使者王稽到了秦国。

  公元前 266 年前后，范雎向秦昭王进言，主张“远交近攻”，先与较远的齐、楚交好，集中力量蚕食邻近的韩、魏；又指出秦国内政被宣太后、穰侯魏冉等把持，“闻秦之有太后、穰侯，不闻其有王”。昭王于是废黜太后，把穰侯等人逐出关外，任范雎为相，封于应，号应侯。后来须贾出使秦国，范雎穿着破衣去见他，须贾见他贫寒，送给他一件绨袍，范雎因此饶了须贾一命，但逼迫魏国交出魏齐，魏齐最终自杀。

  长平之战时，据说是范雎派人在赵国散布流言，使赵王以赵括代替廉颇。战后他与白起不和，劝昭王与赵讲和，后来又促成昭王赐死白起。他推荐的郑安平率军攻赵时投降，王稽也因私通诸侯被处死，按秦法范雎应当连坐，昭王没有追究，但范雎不久就让出相位给蔡泽。

  范雎的结局，《史记》只说他称病辞相；湖北云梦睡虎地出土的秦简《编年记》记载秦昭王五十二年（公元前 255 年）“王稽、张禄死”，有学者据此认为范雎死于这一年。
sources: []
recalled:
  - 《史记·范雎蔡泽列传》
  - 《战国策·秦策三》
  - 睡虎地秦简《编年记》
