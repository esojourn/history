name: 女撒的贵格利
aliases:
  - 尼撒的格列高利
  - 尼萨的贵格利
role: 女撒主教
summary: 巴西流的弟弟，“加帕多家三杰”之一，女撒主教，著《驳欧诺米》等书。
body: |-
  贵格利约在公元 335 年出生，是巴西流的弟弟，生在加帕多家还是本都的家族庄园，没有明确记载。他没有像哥哥那样出外求学，自己说哥哥巴西流和姐姐玛格里娜就是他的老师。他年轻时教过修辞学，一般认为他结过婚。

  公元 372 年，巴西流立他为加帕多家小城女撒的主教。他不善于处理事务，376 年亚流派的主教会议以账目不清为由把他罢免，他被迫离开；378 年华伦斯皇帝死后才回到女撒，受到民众迎接。

  巴西流在 379 年去世，此后他接着哥哥的工作著书。他写了长篇的《驳欧诺米》，反驳极端的亚流派；写了《大教理讲授》，为教导慕道者的人系统陈述信仰；又有《摩西传》《雅歌讲章》等讲灵修生活的书，以及记述姐姐生平的《玛格里娜传》。381 年他出席君士坦丁堡会议，会后皇帝的诏令把他列为东方信仰正统的标准人物之一。

  他最后一次见于记载，是公元 394 年在君士坦丁堡出席一次主教会议，此后不久去世，确切年份不详。《历史的轨迹》第五章把他与巴西流、拿先斯的贵格利并称“加帕多家三杰”。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
recalled:
  - 女撒的贵格利《玛格里娜传》《驳欧诺米》卷 1
  - 巴西流《书信》第 225、237 封
  - 《狄奥多西法典》卷 16 第 1 章第 3 条
