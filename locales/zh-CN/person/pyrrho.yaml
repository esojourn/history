name: 皮浪
aliases: [皮罗, 埃利斯的皮浪]
role: 哲学家
summary: 埃利斯人，随亚历山大远征到过印度，主张对一切悬置判断，被奉为怀疑论的始祖。
body: |-
  伯罗奔尼撒西部埃利斯人，约生于公元前 360 年。据第欧根尼·拉尔修，他起初是个不出名的画家，后来学哲学，追随德谟克利特一派的阿那克萨库斯，并同他一起参加了亚历山大的远征，在印度见过希腊人所说的“裸体智者”，在波斯见过祭司。有人认为他的思想受了印度修行者的影响，这只是推测。

  他回到埃利斯后过着平静的生活，没有写过著作。他的想法是由弟子、弗利乌斯人提蒙用诗文记下的，提蒙的作品也只存残篇。据后人转述，他认为事物本身无从分辨、无法断定，我们的感觉和意见既不能说真也不能说假；因此对任何事都应当不下判断，这样心灵才能不受搅扰。

  关于他的轶事不少。一种说法是他什么都不躲避，车马、悬崖、恶狗全靠朋友拉开；公元前 1 世纪重振这一派的埃涅西德穆斯否认此说，说他只是在理论上悬置判断，日常行事并不鲁莽。另一个故事说，船遇风暴，众人惊慌，他指着一头照常吃食的小猪说，智者应当像它那样不动心。

  埃利斯人很尊重他，推他做祭司长，并因他的缘故免除了哲学家的赋税。他活到约九十岁，约前 270 年去世。几百年后塞克斯都·恩披里柯的《皮浪学说概要》系统阐述了以他命名的怀疑论，其中有多少是他本人的主张，已难分辨。
sources: []
recalled:
  - 第欧根尼·拉尔修《名哲言行录》卷九第 61—69 节
  - 塞克斯都·恩披里柯《皮浪学说概要》卷一
