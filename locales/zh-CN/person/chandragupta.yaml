name: 旃陀罗笈多
aliases: [月护王, 桑德罗科托斯]
role: 孔雀王朝创立者
summary: 孔雀王朝的建立者，推翻难陀王朝，统一北印度，与塞琉古一世订约，是阿育王的祖父。
body: |-
  印度孔雀王朝的开国君主，希腊人称他“桑德罗科托斯”。他的出身各说不同：佛教文献说他出自刹帝利的孔雀族，后世婆罗门教一系的作品则说他出身低微。生年不详，在位年代也只能大致推定，通常作约公元前 321 年至约前 297 年。

  印度的传统说，他得到婆罗门谋士阇那伽（又名考底利耶）的辅佐，起兵推翻了统治恒河流域的难陀王朝，在华氏城即位。普鲁塔克说他年轻时见过亚历山大；尤斯丁说，亚历山大死后，是他带领印度人赶走了留守印度河流域的马其顿官员。这两件事孰先孰后，学者意见不一。

  约前 305 年塞琉古一世东进到印度河。两人是否交战，史料没有明说，结果是订立和约：据斯特拉波和阿庇安，塞琉古让出印度河以西的若干地区（一般认为包括阿拉霍西亚、格德罗西亚和兴都库什山南麓），双方结为姻亲，旃陀罗笈多送给塞琉古五百头战象。此后塞琉古派麦加斯梯尼为使节驻在华氏城。麦加斯梯尼写的《印度志》已佚，从后人的引述里可以看到他对华氏城的木栅城墙、王宫、军队编制和社会等级的描述，是关于这个时代印度的主要外部资料。

  他的版图从孟加拉湾到阿拉伯海，向西北达到今阿富汗东部，南面到何处不能确定。托名考底利耶的《政事论》讲述治国、赋税和用间的办法，过去常被用来说明他的制度，但这部书成于何时有很大争议，现代学者多认为其现存形式晚于孔雀王朝。

  他的结局只见于耆那教的传统：据说他晚年让位给儿子宾头娑罗，随耆那教长老跋陀罗巴睺南行到今卡纳塔克邦的什拉瓦纳贝拉戈拉，按耆那教的方式绝食而终。这一传统形成较晚，是否可信没有定论。宾头娑罗之子即阿育王。
sources: []
recalled:
  - 斯特拉波《地理志》卷十五第 1—2 章
  - 尤斯丁《腓力史纲要》卷十五第 4 章
  - 普鲁塔克《亚历山大传》第 62 章
  - 阿庇安《叙利亚战争》第 55 章
  - 麦加斯梯尼《印度志》残篇（见于阿里安《印度志》等）
