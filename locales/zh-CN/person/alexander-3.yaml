name: 亚历山大三世
aliases:
  - 罗兰多·班迪内利
  - 亚历山大叁世
role: 罗马主教（教皇）
summary: 与皇帝腓特烈一世相持十八年的教皇，1179 年召开第三次拉特兰会议。
body: |-
  亚历山大原名罗兰多，约在 1100 年生于锡耶纳，曾在博洛尼亚教书，1150 年任枢机，三年后任教廷的秘书长。1157 年他作为教皇的使节到贝桑松见皇帝腓特烈一世，带去的信里把帝位说成教皇给的“恩惠”，这个词也可以解作“封地”，皇帝一方大怒，两边从此结怨。

  1159 年 9 月多数枢机选他为教皇，少数亲皇帝的枢机另选了一位。腓特烈召开会议承认后者，亚历山大革除了皇帝的教籍。他几次被迫离开罗马，1162 至 1165 年住在法国，得到法、英两国国王的承认。北意大利各城结成同盟与皇帝对抗，把新建的一座城命名为亚历山德里亚。他在位时英格兰发生国王亨利二世与坎特伯雷大主教贝克特之争，1170 年贝克特被杀，三年后亚历山大把他列为圣徒。

  皇帝在莱尼亚诺战败后求和。《历史的轨迹》第十八章说，这是教皇权势高涨的时候，1177 年皇帝在威尼斯圣马可教堂前跪下亲吻教皇的脚，承认亚历山大是合法的教皇，整整一百年前亨利四世在卡诺莎的一幕似乎重演了。该书还说两人另有一次在阿纳尼相遇；1176 年双方使者在阿纳尼议定过条款，两人会面则只有威尼斯一次。

  1179 年他在罗马召开第三次拉特兰会议，规定此后选举教皇须得到枢机三分之二的票数，以免再出现对立教皇；会议还谴责了法国南部的迦他利派。里昂的瓦勒度一派到会请求准许讲道，教皇称许他们甘守贫穷，但规定非经当地教士邀请不得讲道。

  他晚年又被罗马人赶出城，1181 年 8 月在奇维塔卡斯泰拉纳去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十九章“教会权势衰微” https://wellsofgrace.com/books/spiritual/2000years/html/chapter21.html"
recalled:
  - 枢机博索《亚历山大三世传》
  - 萨莱诺的罗穆阿尔德《编年史》
  - 1179 年第三次拉特兰会议教规
