name: 邵雍
aliases: [邵康节, 安乐先生, 邵尧夫]
role: 北宋理学家
summary: 北宋理学家，以象数之学著称，著《皇极经世》，隐居洛阳不仕。
body: |-
  邵雍字尧夫，祖籍范阳，生于大中祥符五年（公元 1012 年），幼年随父亲迁居共城（今河南辉县），在苏门山百源之上读书。他跟随李之才学习《河图》《洛书》和伏羲八卦等象数之学，形成了自己的一套学说。皇祐元年（1049 年）前后他移居洛阳，住所简陋，自称“安乐窝”，自号安乐先生。

  在洛阳，富弼、司马光、吕公著等退居的大臣都与他往来，为他购置了园宅。朝廷几次征召他做官，他都推辞不去。他的代表作《皇极经世》用元、会、运、世推算天地的始终和历史的兴衰，认为一元为十二万九千六百年。他的诗通俗自然，结集为《伊川击壤集》。熙宁十年（1077 年）他在洛阳去世，谥“康节”。邵雍与周敦颐、张载、程颢、程颐被后世合称“北宋五子”。
sources: []
recalled:
  - 《宋史·道学传·邵雍》
  - 程颢《邵尧夫先生墓志铭》
  - 邵伯温《邵氏闻见录》
