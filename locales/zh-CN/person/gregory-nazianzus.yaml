name: 拿先斯的贵格利
aliases:
  - 神学家贵格利
  - 纳西盎的格列高利
role: 君士坦丁堡主教
summary: “加帕多家三杰”之一，以五篇《神学讲章》阐明三位一体，曾主持 381 年君士坦丁堡会议。
body: |-
  贵格利约在公元 329 年生于加帕多家拿先斯附近的庄园，父亲也叫贵格利，是拿先斯的主教。他先后在该撒利亚、亚历山大和雅典读书，在雅典住了将近十年，与巴西流成为至交。

  他生性喜欢安静读书，几次担任圣职都很勉强。公元 362 年父亲立他为长老，他一度逃到本都巴西流那里，后来写了一篇讲章解释自己为什么逃走。372 年巴西流为了在教区之争中多一个帮手，立他为小镇萨西玛的主教，他始终没有去上任，两人的交情因此受了伤。

  公元 379 年，君士坦丁堡信守尼西亚信经的少数信徒请他去牧养。当时城里的教堂都在亚流派手中，他在一所改作礼拜堂的住宅里讲道，五篇《神学讲章》就是在这里讲的，后世因此称他为“神学家”。380 年狄奥多西皇帝进城，把大教堂交给他。381 年君士坦丁堡会议开会，主席安提阿主教墨勒提乌去世后由他接任；有人指他先前已是萨西玛主教，调任不合教规，他就辞了职，回到家乡。

  他晚年在庄园里写了大量诗歌和书信，其中有一首长篇自传诗，约在公元 390 年去世。《历史的轨迹》第五章把他与巴西流、女撒的贵格利并称“加帕多家三杰”。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
recalled:
  - 拿先斯的贵格利《讲章》第 2、27—31、42、43 篇
  - 拿先斯的贵格利《自述生平》（诗）
  - 苏格拉底《教会史》卷 5 第 6—8 章
