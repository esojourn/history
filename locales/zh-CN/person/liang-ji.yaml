name: 梁冀
aliases: [梁伯卓]
role: 大将军
summary: 东汉外戚，专擅朝政近二十年，毒杀质帝、拥立桓帝，后被桓帝联合宦官诛灭。
body: |-
  据《后汉书·梁冀传》，梁冀字伯卓，安定乌氏人，生年不详。他的妹妹是顺帝的皇后。永和六年（公元 141 年），他接替去世的父亲梁商任大将军。建康元年（144 年）顺帝死，梁太后临朝，两岁的冲帝和八岁的质帝先后即位。质帝年幼而聪明，曾在朝会上看着梁冀说“此跋扈将军也”；梁冀便让人在饼里下毒，把他毒死，另立十五岁的蠡吾侯刘志，就是桓帝。反对他的大臣李固、杜乔先后被害。

  梁冀掌权近二十年，本传说朝廷大小政事都由他决定，官员升迁要先到他门下谢恩，他一家前后出了七位侯、三位皇后、两位大将军。他和妻子孙寿大建宅第园林，侵夺民田，强迫平民为奴婢。

  延熹二年（159 年）梁皇后去世，桓帝与宦官单超等五人密谋，派兵包围梁冀的宅第，收缴大将军印绶，梁冀与孙寿当天自杀，宗族亲党多被处死。本传说官府变卖他的家产，得钱三十余亿，朝廷因此减收当年天下租税的一半。
sources: []
recalled:
  - 《后汉书·梁统列传》（附梁冀）
