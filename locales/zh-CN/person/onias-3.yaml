name: 奥尼亚三世
aliases: []
role: 大祭司
summary: 耶路撒冷的大祭司，被兄弟耶孙夺去职位，后在安条克附近遇害。
body: |-
  塞琉古四世在位时的耶路撒冷大祭司。《马加比二书》第 3 章称他敬虔守法，并记圣殿管事西门与他不和，向官府告发圣殿库中存有巨款，国王因此派赫略多洛斯前去查取，未能得手。

  据《马加比二书》第 4 章，公元前 175 年安条克四世即位后，奥尼亚的兄弟耶孙许以重金，取得大祭司之位；约三年后默涅拉俄斯又出更高的价钱取代耶孙。奥尼亚指责默涅拉俄斯盗卖圣殿器皿，避入安条克附近达夫尼的一处圣所，默涅拉俄斯唆使大臣安德洛尼科斯把他诱出杀害，时间约在前 171 或前 170 年。约瑟夫斯所记不同：《犹太古史》只说奥尼亚去世后由兄弟继任，《犹太战记》则说他逃往埃及，在那里另建圣殿。
sources:
  - 《马加比二书》3:1–40、4:1–38
  - 约瑟夫斯《犹太古史》卷 12 第 5 章第 1 节 https://penelope.uchicago.edu/josephus/ant-12.html
  - 约瑟夫斯《犹太战记》卷 1 第 1 章第 1 节、卷 7 第 10 章第 2 节 https://penelope.uchicago.edu/josephus/war-1.html
  - Wikipedia, "Onias III" https://en.wikipedia.org/wiki/Onias_III
