name: 李商隐
aliases: [李义山, 玉谿生, 樊南生]
role: 诗人
summary: 唐代诗人，以无题诗和咏史诗著称，因卷入牛李党争而仕途坎坷，与杜牧并称“小李杜”。
body: |-
  李商隐字义山，号玉谿生，怀州河内人，生年一般作元和八年（公元 813 年），另有 812 年之说。他幼年丧父，家境贫寒。少年时他以文才受到天平节度使令狐楚的赏识，令狐楚让他跟儿子令狐绹一起读书，亲自教他写作骈文，又聘他入幕府。开成二年（837 年），经令狐绹推荐，他考中进士。

  同年令狐楚去世，次年李商隐到泾原节度使王茂元的幕府任职，王茂元很赏识他，把女儿嫁给了他。当时牛僧孺、李德裕两派相争，令狐父子被视为牛党，王茂元则与李德裕亲近，牛党的人因此认为李商隐背恩，令狐绹从此对他很冷淡（另见“牛李党争”条）。此后他在朝中只做过秘书省正字等小官，大部分时间辗转于桂州、徐州、东川等地的幕府中，做文书工作。妻子王氏在大中五年（851 年）前后去世。他晚年回到郑州一带，一般认为卒于大中十二年（858 年）前后。

  李商隐的诗构思精巧，用典繁密，辞藻华美，情致深婉。他的不少爱情诗以“无题”为名，如“相见时难别亦难”“昨夜星辰昨夜风”等，所写的对象和寄托的含义，历来众说纷纭。《锦瑟》一诗尤其难解，宋代以来解说不下十几种。他的咏史诗如《贾生》《隋宫》，借古讽今，也很有名。他与杜牧并称“小李杜”，与温庭筠并称“温李”。他的骈文也很出色，自己编过《樊南甲集》《樊南乙集》。
sources: []
recalled:
  - 《旧唐书·文苑传·李商隐》
  - 《新唐书·文艺传·李商隐》
  - 李商隐《樊南甲集序》
