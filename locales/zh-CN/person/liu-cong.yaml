name: 刘聪
aliases: [刘玄明, 汉昭武帝]
role: 汉国（前赵）皇帝
summary: 刘渊之子，在位时攻陷洛阳、长安，俘杀晋怀帝、愍帝，灭亡西晋。
body: |-
  刘聪字玄明，是刘渊的第四子，生年不详。《晋书·载记》说他自幼聪明好学，通习经史和诸子，擅长草书、隶书，又能开硬弓。他年轻时到过洛阳，与名士交游，后来在成都王颖手下任职。刘渊起兵后，他领兵作战，两次攻打洛阳。

  永嘉四年（公元 310 年）刘渊死，太子刘和即位，想要除掉几个弟弟。他起兵攻杀刘和，自己即位。永嘉五年，他派呼延晏、刘曜、王弥等攻陷洛阳，俘虏晋怀帝；建兴四年（316 年）刘曜又攻下长安，俘虏晋愍帝。两位皇帝被送到平阳后，都先受折辱而后被杀。

  载记说他在位后期沉溺酒色，同时立了几位皇后，宠信宦官王沉和外戚靳准，杀死了原定继位的皇太弟刘乂。这时石勒在河北、曹嶷在青州已各自为政，汉国实际控制的只有平阳周围和关中。麟嘉三年（318 年）他病逝。儿子刘粲继位不久，就被靳准杀死，在平阳的刘氏宗族被屠戮殆尽。
sources: []
recalled:
  - 《晋书·刘聪载记》
  - 《资治通鉴》卷八十七至九十
