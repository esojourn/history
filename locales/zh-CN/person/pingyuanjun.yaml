name: 平原君
aliases: [赵胜]
role: 赵国相，“战国四公子”之一
summary: 赵国公子，三任赵相，邯郸被围时带毛遂赴楚求援。
body: |-
  平原君名胜，是赵武灵王之子、赵惠文王之弟，封于东武城，号平原君，生年不详。他在赵惠文王和孝成王时三次任相，好养士，门下宾客据说有数千人，与齐孟尝君、魏信陵君、楚春申君并称“战国四公子”。

  公元前 262 年，韩国上党郡守冯亭要把上党献给赵国，平阳君赵豹认为这是嫁祸，平原君则主张接受，赵王采纳了平原君的意见，由此引发了长平之战。《史记》批评他“利令智昏”。

  长平战后，秦军围攻邯郸。据《史记·平原君虞卿列传》，平原君奉命赴楚求救，要从门客中挑选二十名文武兼备的人随行，只选出十九人，门客毛遂自荐，平原君说贤士处世就像锥子放在布袋里，尖端很快就会露出来，先生在我门下三年，我没听说过你。毛遂说：“臣乃今日请处囊中耳。”到了楚国，谈判从早上到中午没有结果，毛遂按剑上前，陈说利害，楚王终于同意出兵，与赵国歃血订盟。这就是“毛遂自荐”和“脱颖而出”的出处。

  回到邯郸后，平原君听从李同的建议，散尽家财犒赏士卒，组织三千敢死之士出击秦军。不久魏信陵君和楚春申君的援军赶到，邯郸之围得解。平原君死于公元前 251 年。

  司马迁称他为“翩翩浊世之佳公子”。
sources: []
recalled:
  - 《史记·平原君虞卿列传》
  - 《史记·白起王翦列传》
