name: 田忌
aliases: [田期思]
role: 齐国将军
summary: 齐威王时的将领，任用孙膑为军师，在桂陵、马陵两战中大败魏军；“田忌赛马”的主角。
body: |-
  田忌是齐国的宗族，齐威王时为将，生卒年不详。据《史记·孙子吴起列传》，孙膑逃到齐国后，田忌以客礼相待，并在孙膑的指点下赢了与齐国诸公子的赛马，于是把孙膑推荐给齐威王。

  公元前 354 年魏围赵都邯郸，田忌任主将、孙膑为军师，引兵直攻大梁，在桂陵击败回救的魏军；公元前 342 年，田忌、孙膑再次率军救韩，在马陵大败魏军，魏将庞涓自杀，太子申被俘。

  据《史记·田敬仲完世家》，田忌与齐相邹忌不和。邹忌派人假冒田忌的门客到集市上占卜，问能否起事，以诬陷田忌谋反，田忌被迫出奔楚国，后来齐宣王即位才把他召回。各篇所记的年代有出入，具体经过难以确定。
sources: []
recalled:
  - 《史记·孙子吴起列传》
  - 《史记·田敬仲完世家》
  - 《战国策·齐策一》
