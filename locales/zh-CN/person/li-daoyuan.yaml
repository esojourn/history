name: 郦道元
aliases: [郦善长]
role: 地理学家、官员
summary: 北魏官员，《水经注》的作者，在出使关中途中被萧宝夤杀害。
body: |-
  郦道元字善长，范阳涿县人。父亲郦范在北魏任青州刺史，他少年时随父住在青州。他的生年史书没有记载，有约 466 年、约 470 年、约 472 年等推测。孝文帝时他入仕，任尚书郎，曾随孝文帝北巡。此后历任冀州镇东府长史、颍川太守、鲁阳太守、东荆州刺史、河南尹、御史中尉等职。《魏书》把他列入《酷吏传》，说他执法严峻，所到之处官吏百姓都很畏惧他。

  他任御史中尉时不避权贵，得罪了汝南王元悦等人。孝昌三年（公元 527 年），雍州刺史萧宝夤有反叛的迹象，元悦等人借机让朝廷任命郦道元为关右大使，派他前往关中。萧宝夤担心他是来查办自己的，派兵在阴盘驿把他包围。驿亭在山冈上，没有水源，他们凿井十余丈仍不见水，最后力竭，郦道元与弟弟郦道峻和两个儿子一同被杀。萧宝夤随即起兵反魏。

  他一生好学，博览群书，尤其留意地理。他的《水经注》四十卷，以三国时人所作的《水经》为纲，逐条为水道作注，记载了一千多条河流及其流经地区的山川、城邑、物产、古迹、风俗和传说，注文的篇幅是原书的二十多倍。书中引用的文献很多，其中不少已经失传；他还亲自考察了许多地方，纠正前人记载的错误。书中写长江三峡等段落，文笔优美，常被后人选读（另见“《水经注》成书”条）。
sources: []
recalled:
  - 《魏书·酷吏传·郦道元》
  - 《北史·郦道元传》
