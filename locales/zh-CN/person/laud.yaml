name: "劳德"
aliases: ["威廉·劳德", "络得"]
role: "坎特伯雷大主教"
summary: "查理一世的大主教，推行仪式统一、打压清教徒，被长期国会定罪处死。"
body: |-
  劳德 1573 年生于雷丁，牛津出身，做过牛津圣约翰学院院长。查理一世即位后他步步高升，1633 年任坎特伯雷大主教。他重视礼仪，要求圣餐桌移到圣坛东端围起来，压制清教徒讲道，用星室法庭等机构处罚印发小册子批评主教的人。1637 年他和国王要在苏格兰推行新公祷书，引起苏格兰人起来立约反抗。

  《历史的轨迹》第三十一章说，1640 年长期国会召开，长老派清教徒占了多数，立刻将最反对清教徒的两个人斯特拉福伯爵和大主教劳德送去审问、定罪、斩首。书中把两件事连在一起说，实际上斯特拉福 1641 年 5 月被处死，劳德 1641 年下狱，1645 年 1 月才在伦敦塔丘被斩首。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
recalled:
  - "长期国会对劳德的弹劾与褫夺公权法案"
