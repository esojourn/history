name: 詹天佑
aliases: [眷诚]
role: 铁路工程师
summary: 留美幼童之一，耶鲁大学毕业，主持修建中国人自行设计的京张铁路。
body: |-
  詹天佑祖籍安徽婺源（今属江西），生于广东南海。同治十一年（1872 年）他作为第一批留美幼童之一赴美，后来考入耶鲁大学学习土木工程，光绪七年（1881 年）毕业，同年随全体留美学生被撤回国内（另见“留美幼童”条）。回国后他先被派到福州船政学堂学习驾驶，在军舰上服务，又在广东博学馆教书，长期没有机会从事铁路工作。光绪十四年（1888 年）他进入中国铁路公司，参加了津榆铁路等工程。

  光绪三十一年（1905 年）清朝决定修建从北京到张家口的铁路，由詹天佑任总工程师（后来又任总办）。京张铁路要穿越燕山山脉，地形复杂，当时有外国人认为中国人不可能独立完成。詹天佑亲自勘测选线，在八达岭一带采用“人”字形线路以减缓坡度，开凿了居庸关、八达岭等隧道。宣统元年（1909 年）京张铁路全线通车，比原计划提前两年，费用也比预算节省（另见“京张铁路”条）。这是第一条由中国人自己设计、建造的干线铁路。

  此后詹天佑又主持或参与了粤汉铁路、川汉铁路等工程，1912 年创立中华工程师会，任会长。1919 年他在汉口去世。
sources: []
recalled:
