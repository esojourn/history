name: 庞培
aliases: [格奈乌斯·庞培, 伟大的庞培]
role: 罗马统帅、执政官
summary: 罗马共和国末年的统帅，平定东方并攻取耶路撒冷，内战中败于凯撒。
body: |-
  格奈乌斯·庞培，公元前 106 年生，父亲庞培·斯特拉波是前 89 年的执政官，家族在意大利东部的皮凯努姆有大量地产和门客；他的出生地史料没有明确记载。前 83 年苏拉从东方回师打内战，二十三岁的庞培自己在皮凯努姆募集三个军团投奔他，随后为苏拉收复西西里和阿非利加，得到“伟大”的称号，并在没有担任过任何官职的情况下举行了凯旋式。

  此后他被派往西班牙对付塞多留，战事拖到前 72 年前后。回师途中他截杀了斯巴达克起义军的残部，前 70 年与克拉苏同任执政官。前 67 年，加比尼乌斯法授他广泛权力清剿地中海的海盗，据普鲁塔克等记载，他在三个月内完成。次年马尼利乌斯法又把对本都王米特里达梯六世的战争交给他。

  他击败米特里达梯，迫使亚美尼亚王提格兰臣服，前 64 年结束塞琉古王朝的残余统治，把叙利亚设为罗马行省。此时犹太的许尔堪二世和阿里斯托布鲁斯二世兄弟争位，双方都到大马士革向他申诉。前 63 年他进军耶路撒冷，围攻圣殿山，到第三个月破城。据约瑟夫斯《犹太古史》卷 14，他进入了圣殿的至圣所，但没有动殿中的财物，次日吩咐洁净圣殿、照常献祭。他立许尔堪为大祭司，削减犹太的领土，使其向罗马纳贡。

  前 61 年他回罗马举行第三次凯旋式。元老院迟迟不批准他在东方的安排，他于是在前 60 年前后与凯撒、克拉苏结成后世所称的“前三头同盟”，并娶凯撒的女儿尤利娅。尤利娅在前 54 年去世，克拉苏次年死于卡莱，同盟瓦解。前 49 年凯撒渡过卢比孔河，内战爆发，庞培率元老院一方退往希腊；前 48 年他在法萨卢斯战败，逃到埃及，在佩卢西翁附近登岸时被托勒密十三世的廷臣派人刺死。
sources: []
recalled:
