  - 阿庇安《内战史》卷 2、《米特里达梯战争》
  - 约瑟夫斯《犹太古史》卷 14 第 3—4 章
  - 约瑟夫斯《犹太战记》卷 1 第 6—7 章
  - 凯撒《内战记》卷 3
