name: 贺若弼
aliases: [贺若辅伯]
role: 大将
summary: 隋朝伐陈的主将之一，由广陵渡江，在钟山击溃陈军主力，后与高颎同被处死。
body: |-
  贺若弼字辅伯，河南洛阳人。他的父亲贺若敦是北周将领，被宇文护逼令自杀，据《隋书》本传，贺若敦临死时用锥刺贺若弼的舌头出血，告诫他要谨慎言语。隋朝建立后，贺若弼任吴州总管，镇守广陵，向文帝献上平陈的策略。

  开皇九年（公元 589 年）正月初一，他乘陈朝君臣过节，从广陵渡过长江，攻取京口。随后他率军进至钟山，与陈军主力决战，以少胜多，擒获陈将萧摩诃。但韩擒虎已经抢先从南面进入建康，俘获了陈后主。贺若弼到后，与韩擒虎在文帝面前争功，文帝两边都给了封赏。

  此后他自以为功高，常对宰相人选表示不满，多次因怨言获罪，被免官下狱。大业三年（607 年），炀帝北巡时，他与高颎、宇文弼私下议论朝政奢侈，被人告发，三人同时被杀，年六十四。
sources: []
recalled:
  - 《隋书·贺若弼传》
  - 《资治通鉴》卷一百七十七、一百八十
