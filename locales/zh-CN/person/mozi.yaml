name: 墨子
aliases: [墨翟]
role: 思想家，墨家创始人
summary: 战国初年思想家，墨家创始人，主张兼爱、非攻，曾止楚攻宋。
body: |-
  墨子名翟，生卒年不详，一般认为活动在孔子之后、孟子之前，约当公元前五世纪后期至前四世纪初。他的籍贯有鲁国、宋国等说法。《史记》对他的记载只有二十四个字，附在《孟子荀卿列传》之末：“盖墨翟，宋之大夫，善守御，为节用。或曰并孔子时，或曰在其后。”他的事迹主要见于《墨子》一书。

  据《淮南子》等书，墨子早年学习儒术，后来不满儒家的繁礼厚葬，自创学派。墨家的主张包括：兼爱，即不分亲疏地爱一切人；非攻，反对侵略战争；尚贤、尚同，主张选贤任能、上下统一是非；节用、节葬、非乐，反对贵族的奢侈浪费；天志、明鬼，认为上天和鬼神会赏善罚恶。墨家是一个有严密组织的团体，首领称为“巨子”，成员生活俭朴，纪律严格。

  《墨子·公输》记载，楚国请公输盘（即鲁班）造云梯，准备攻打宋国。墨子听说后走了十天十夜赶到郢都，与公输盘在楚王面前模拟攻守，公输盘多次变换攻城的方法，都被墨子挡住；墨子又说他的弟子禽滑釐等三百人已带着守城器械在宋城上等候。楚王于是放弃攻宋。

  《墨子》中的《经》《经说》等篇，涉及逻辑、几何、光学、力学等方面的知识，在先秦诸子中独具特色。战国时墨家与儒家并称“显学”（《韩非子·显学》），秦汉以后逐渐衰落，到清代才重新受到重视。
sources: []
recalled:
  - 《墨子》
  - 《史记·孟子荀卿列传》
  - 《韩非子·显学》
  - 《淮南子·要略》
