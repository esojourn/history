name: 喀提林
aliases: [卢基乌斯·塞尔吉乌斯·喀提林, 卡提利纳, 喀提林那]
role: 罗马元老
summary: 没落贵族，两次竞选执政官失败后图谋武力夺权，被西塞罗揭发，兵败战死。
body: |-
  卢基乌斯·塞尔吉乌斯·喀提林，约公元前 108 年生于一个久已没落的贵族家庭。同盟者战争中他在庞培·斯特拉波麾下。苏拉公敌宣告期间他是积极的执行者。前 73 年他被控与维斯塔贞女私通，获判无罪。

  前 68 年他任大法官，随后治理阿非利加行省，回来即被控勒索，因而未能参加前 65 年的执政官竞选；所谓他在这年年初图谋刺杀执政官的“第一次阴谋”，多数学者认为不可信。前 64 年他与西塞罗等人竞选，落败。前 63 年他再次竞选，以取消债务为号召，支持者有负债的贵族、失地的农民和苏拉的破产老兵，再度落选。

  此后他转向武力。他的同党曼利乌斯在伊特鲁里亚的费苏莱聚集老兵。10 月 21 日元老院通过最终决议。11 月 7 日两名同党企图到西塞罗家中行刺未成，次日西塞罗在元老院发表第一篇反喀提林演说，喀提林当晚出城去了曼利乌斯的军营，被宣布为公敌。留在城里的伦图卢斯等人与高卢阿洛布罗基人的使节联络，后者把信件交给西塞罗；12 月 3 日五人被捕，12 月 5 日元老院辩论后，五人在地牢里被绞死。

  消息传来，他的队伍大半散去。他带余部想翻越亚平宁山去高卢，被前后两支军队堵住，前 62 年 1 月在皮斯托里亚附近决战。据萨卢斯特，他的部下都死在各自的战位上，伤口在前；他本人倒在敌阵深处，被发现时还有呼吸。

  关于他的记载几乎全出自对手西塞罗的演说和萨卢斯特的专著。近代学者指出，债务问题和意大利乡村的困苦确实存在，他的主张有其社会基础；阴谋究竟到何种程度，西塞罗有没有夸大，至今仍有争论。
sources: []
recalled:
  - 萨卢斯特《喀提林阴谋》
  - 西塞罗《反喀提林》四篇、《为穆雷纳辩护》
  - 普鲁塔克《西塞罗传》第 10—22 章
  - 阿庇安《内战史》卷二第 2—7 章
