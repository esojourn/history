name: "台彻尔"
aliases: ["约翰·台彻尔", "帖次勒", "特策尔"]
role: "多明我会修士、赎罪券宣讲员"
summary: "多明我会修士，1517 年在萨克森边境宣讲赎罪券，引出路德的九十五条论纲。"
body: |-
  台彻尔约 1465 年生于萨克森的皮尔纳，在莱比锡大学读书，后来进了莱比锡的多明我会修道院。从 1504 年起他在德意志各地替人宣讲赎罪券，办这件事很有名气。

  1517 年，美因茨大主教阿尔布雷希特受教皇利奥十世委托，在自己的辖区发售赎罪券，名义是修建罗马的圣彼得大教堂，实际上所得的一半用来偿还他为取得大主教职位向银行借的债。台彻尔受聘为主要的宣讲员。《历史的轨迹》第二十一章称他善于辞令，引他的话说，金币投入钱箱的一刹那，灵魂就跳出炼狱；这句顺口溜是当时人归在他名下的，路德在论纲第 27 条里批评的正是这种讲法。该书说他在维滕贝格城门口叫卖；按同书第二十二章，萨克森选侯不许他入境，他是在边界外的于特博格等地宣讲，维滕贝格的居民过境去买。

  九十五条论纲传开以后，台彻尔在法兰克福（奥得河畔）大学发表反驳的论纲，由温皮纳执笔，并得了博士学位。1519 年初教皇的使者米尔蒂茨到德意志调停，把事情闹大的责任推给他，斥责他行为不检、账目不清。他退居莱比锡的修道院，同年 8 月病死。相传路德听说他病重，曾写信安慰他。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十一章“教会开始动摇” https://wellsofgrace.com/books/spiritual/2000years/html/chapter24.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十二章“教会大大骚动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter25.html"
recalled:
  - "美因茨大主教阿尔布雷希特《赎罪券宣讲须知》（1517 年）"
  - "路德《九十五条论纲》第 27、28 条"
  - "台彻尔与温皮纳《一百零六条反论纲》（1518 年）"
  - "弗里德里希·米科尼乌斯《宗教改革史》"
