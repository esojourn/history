name: 宗泽
aliases: [宗汝霖, 宗忠简]
role: 东京留守
summary: 南宋初年东京留守，招抚义军坚守开封，多次上书请高宗还都，临终连呼“过河”。
body: |-
  宗泽字汝霖，婺州义乌（今属浙江）人，生于嘉祐五年（公元 1060 年）。元祐六年（1091 年）进士及第，此后长期在地方任职，以敢言、有吏干著称，仕途并不显达。

  靖康元年（1126 年）他已年近七十，出任磁州知州，修城募兵，抵抗南下的金军。康王赵构出使途经磁州时，宗泽劝他不要去金营，赵构因此留在河北，后被任为兵马大元帅，宗泽任副元帅，率兵转战于开德府、卫州一带。

  宋高宗即位后，宗泽出任东京留守、知开封府。当时开封经过金军洗劫，盗贼横行，他整顿治安，修复城防，招抚王善等各路义军和溃兵，据说聚集了很多人马，岳飞也在这时受到他的赏识。他前后二十多次上书，请高宗回到开封主持恢复，都没有被采纳。

  据《宋史·岳飞传》，宗泽曾授给岳飞阵图，岳飞回答说，先布阵而后交战是兵法的常规，运用之妙在于用心体会，宗泽认为他说得对。

  建炎二年（1128 年）七月宗泽因忧愤成疾去世。据《宋史》，他临终时没有一句话说到家事，只连呼三声“过河”。他死后，继任的杜充不能维持，开封一带的义军相继离散；这年冬天杜充为阻挡金军掘开黄河，造成黄河改道南流。宗泽死后谥忠简，诗文后人编为《宗忠简公集》。
sources: []
recalled:
  - 《宋史·宗泽传》
  - 《宗忠简公集》
