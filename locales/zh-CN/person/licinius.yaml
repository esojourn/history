name: 李锡尼
aliases: [李锡尼乌斯, 利西尼乌斯, 李基尼乌斯]
role: 罗马皇帝
summary: 帝国东部的皇帝，与君士坦丁共同约定信仰自由，后被君士坦丁击败处死。
body: |-
  李锡尼约生于公元 263 年，出身多瑙河南岸的农家，是伽列里乌斯的老部下和朋友。308 年 11 月卡农图姆会议上，伽列里乌斯直接立他为“奥古斯都”。311 年伽列里乌斯死后，他与马克西米努斯·达亚分据东方。

  313 年初他到米兰，娶君士坦丁的异母妹妹君士坦提娅，两人约定给基督徒和所有人信仰自由。同年 4 月他在色雷斯击败马克西米努斯，6 月在尼科米底亚公布了那封后世称为“米兰敕令”的通函。得胜之后，他杀了几位前皇帝的家属，连戴克里先的妻女也没有放过。

  他与君士坦丁很快失和。316 年前后两人第一次交战，他丢了巴尔干的大半。此后他在东部限制基督徒，不许主教集会，把基督徒逐出宫廷和军队。324 年君士坦丁再次来攻，7 月在阿德里安堡、9 月在博斯普鲁斯海峡对岸的克里索波利斯两次击败他。经君士坦提娅求情，他被安置在帖撒罗尼迦，次年春被处死。
sources: []
recalled:
