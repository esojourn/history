name: 乌斐拉
aliases:
  - 乌尔菲拉
  - 武尔菲拉
role: 哥特人的主教
summary: 哥特人的主教，创制哥特字母，把圣经译成哥特文。
body: |-
  乌斐拉约在公元 311 年生于多瑙河以北哥特人的地方。据五世纪史家菲洛斯托吉乌斯，他的祖上是三世纪哥特人从加帕多家掳去的基督徒。他的名字是哥特语，意思是“小狼”。他通晓哥特语、希腊语和拉丁语。

  约公元 341 年，他随哥特人的使团来到罗马帝国，由尼科米底亚的优西比乌等主教立为“哥特地方基督徒的主教”。他回到多瑙河以北传道约七年。后来哥特人的首领逼迫基督徒，他带着一批信徒渡河，经君士坦提乌斯二世准许，在默西亚的尼科波利斯附近定居下来。

  他为哥特语创制了一套字母，主要取自希腊字母，并把圣经译成哥特文。菲洛斯托吉乌斯说，他有意不译《列王纪》各卷，因为哥特人已经太好战了。这个译本有一部分流传下来，最著名的抄本是藏在瑞典乌普萨拉的“银字抄本”，这是日耳曼语言最早的长篇文献。

  他所受的是当时在东方宫廷占上风的亚流派信仰，临终留下的信条说圣子从属于圣父。《历史的轨迹》第七章说，由于他多年前的宣教工作，东、西哥特人在进入罗马帝国以前就接受了基督教，不过是亚流派的。公元 383 年他应召到君士坦丁堡参加会议，到后不久去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 菲洛斯托吉乌斯《教会史》卷 2 第 5 章
  - 奥克森提乌斯《论乌斐拉的信仰、生平与去世》
  - 约达尼斯《哥特史》第 51 章
