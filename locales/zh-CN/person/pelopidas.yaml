name: 佩洛皮达斯
aliases: [派洛皮德]
role: 底比斯将军
summary: 底比斯将军，公元前 379 年率流亡者夺回底比斯，统领“圣队”。
body: |-
  底比斯人，出身富家，希波克勒斯之子。普鲁塔克说他乐于散财，与清贫的伊巴密浓达交情深厚。公元前 382 年，斯巴达将领腓比达斯趁节日占据底比斯的卫城卡德米亚，扶植亲斯巴达的一派执政，佩洛皮达斯等人逃往雅典。

  前 379 年冬，他和少数流亡者扮作猎人潜回底比斯，在城内同党配合下于夜间杀死执政的几位军事长官，随后召集市民，在雅典援军的帮助下迫使卡德米亚的斯巴达驻军撤出。此后他连年当选彼奥提亚长官。他统领的“圣队”是三百名精选的重装步兵，由城邦供养，相传由一对对情侣组成。前 375 年在特居拉，他以圣队和少量骑兵击败了人数多得多的两队斯巴达军，普鲁塔克说这是斯巴达人头一次在兵力占优的阵战中落败。前 371 年留克特拉之战，他率圣队在左翼抢先冲击，配合伊巴密浓达击溃了斯巴达国王所在的一翼。

  前 370 年冬他与伊巴密浓达一同攻入伯罗奔尼撒，回国后两人因逾期未交卸兵权受审，都被开释。此后他主要经营北方。他几次进入色萨利，对抗斐赖的僭主亚历山大；又到马其顿调停王室之争，带回一批人质，其中有后来的腓力二世。前 368 年他去见斐赖的亚历山大时被扣押，后由伊巴密浓达率军救出。前 367 年他出使苏萨，波斯国王接受了底比斯的主张，承认美塞尼独立。

  前 364 年他再次率军入色萨利，在库诺斯克法莱击败亚历山大的军队，自己却在冲向亚历山大本人时阵亡。色萨利人为他举行了隆重的葬礼。
sources: []
recalled:
  - 普鲁塔克《佩洛皮达斯传》
  - 色诺芬《希腊史》卷五第 4 章、卷七第 1 章
  - 狄奥多罗斯《历史丛书》卷十五
