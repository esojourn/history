name: "慕勒"
aliases: ["乔治·慕勒", "乔冶穆勒"]
role: "弟兄会的孤儿院创办者"
summary: "德国出生的弟兄会传道人，在布里斯托尔凭信心办孤儿院，不向人募捐。"
body: |-
  慕勒 1805 年生于普鲁士的克罗彭施泰特，少年时生活放荡，1825 年在哈雷大学读神学时参加一次家庭查经聚会而归信。他到英国想做向犹太人宣教的工作，后来与克雷克一同在布里斯托尔牧养会众，加入了早期的弟兄会。

  《历史的轨迹》第三十八章说，早期英国弟兄会中有一位著名人物，就是布里斯托尔的慕勒，他受弗兰克的激励成立孤儿院，这项工作以凭信心而闻名。据一般记载，他 1836 年开办第一所孤儿院，后来在阿什利当建了五座大楼，先后收养过一万多名孤儿；他从不向人募捐，只向神祈求，把收支详细记在报告里。七十岁后他周游各国讲道十七年，1898 年死于布里斯托尔。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十八章“德国与英国的宗教生活” https://wellsofgrace.com/books/spiritual/2000years/html/chapter42.html"
recalled:
  - "慕勒《主与慕勒的交往记》"
