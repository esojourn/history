name: 狄仁杰
aliases: [狄怀英, 梁国公]
role: 宰相
summary: 武则天时的宰相，断案公允，劝武则天召回庐陵王立为太子，推荐了张柬之、姚崇等人。
body: |-
  狄仁杰字怀英，并州太原人，以明经科入仕。高宗仪凤年间他任大理丞，据《旧唐书》本传，他一年之中判决积压的案件，涉及一万七千人，没有人申诉冤屈。此后他历任侍御史、宁州刺史、豫州刺史等职，在地方以宽厚爱民著称。

  天授二年（公元 691 年），他被武则天任命为宰相。次年来俊臣诬告他谋反，当时的法令规定，一经审问就认罪的可以减免死刑，他便承认谋反，暂免一死，随后把申冤的帛书藏在棉衣里，托家人送出，武则天召见查问后免他死罪，贬为彭泽县令。万岁通天元年（696 年）契丹李尽忠、孙万荣起兵，攻陷河北多地，他被起用为魏州刺史，安抚百姓。神功元年（697 年）他再次入朝为相。

  当时武则天曾考虑立侄子武承嗣或武三思为太子，据《资治通鉴》，狄仁杰对她说，姑侄与母子相比哪个更亲，陛下立儿子，千秋万岁之后可以配享太庙，从来没有听说侄子当了天子为姑母立庙的。武则天因而回心转意，圣历元年（698 年）召回庐陵王李显，立为太子。同年突厥默啜入寇河北，名义上以太子为元帅，由他任副元帅主持军务，事后他又安抚被突厥胁迫的百姓。

  他前后推荐了张柬之、姚崇、桓彦范、敬晖等数十人，这些人后来多成为名臣，时人说“天下桃李，悉在公门”。久视元年（700 年）九月他去世，年七十一，据记载武则天哭着说“朝堂空矣”。中宗复位后追赠司空，睿宗时追封梁国公。清代以后，以他为主角的公案小说流传很广，书中的断案故事多出于虚构。
sources: []
recalled:
  - 《旧唐书·狄仁杰传》
  - 《新唐书·狄仁杰传》
  - 《资治通鉴》卷二百二至二百七
