name: 苏定方
aliases: [苏烈, 邢国公]
role: 大将
summary: 唐朝名将，随李靖袭破颉利牙帐，657 年攻灭西突厥，660 年渡海攻灭百济。
body: |-
  苏定方名烈，以字行，冀州武邑人。隋末他随父亲聚众保卫乡里，后来先后在窦建德、刘黑闼部下任将领，刘黑闼失败后回乡。贞观初年他被起用，贞观四年（公元 630 年）随李靖进攻东突厥，率二百骑兵为前锋，趁大雾突袭颉利可汗的牙帐，颉利逃走。

  高宗显庆二年（657 年），他任伊丽道行军大总管，讨伐西突厥的阿史那贺鲁，在曳咥河一带以少胜多，又冒雪追击，阿史那贺鲁逃到石国后被擒，西突厥灭亡（另见“唐灭西突厥”条）。显庆五年（660 年），他率水陆大军从山东渡海，与新罗军队夹击百济，攻克百济都城，俘获百济王扶余义慈，百济灭亡。次年他又进军围攻高句丽的平壤，因严冬和补给困难，没有攻下而撤回。

  此后他又在西北防御吐蕃。乾封二年（667 年）他去世，年七十六。
sources: []
recalled:
