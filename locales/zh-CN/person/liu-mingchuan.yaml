name: 刘铭传
aliases: [省三, 壮肃]
role: 淮军将领、台湾首任巡抚
summary: 淮军名将，中法战争时保卫台湾，台湾建省后任首任巡抚，推行近代化建设。
body: |-
  刘铭传是安徽合肥人，早年在家乡办团练，同治元年（1862 年）率部加入李鸿章的淮军，号称“铭军”，参加了与太平军、捻军的作战，是淮军的主要将领之一。此后他一度辞官回乡。

  光绪十年（1884 年）中法战争爆发，清朝任命刘铭传督办台湾军务。他到台湾后，在基隆、淡水一带与法军作战，为了保住台北，一度主动放弃基隆，集中兵力守住淡水，击退了法军的进攻（另见“中法战争”条）。

  光绪十一年（1885 年）清朝决定台湾建省，刘铭传被任命为第一任台湾巡抚。他在台湾清查田亩，整顿税收，修筑从基隆到新竹的铁路，架设电报线，开办邮政、煤矿，设立西学堂和电报学堂，推行了一系列近代化的措施。他也对台湾的原住民用兵，推行“开山抚番”。光绪十七年（1891 年）他因病辞职，回到家乡，光绪二十二年（1896 年）去世，谥“壮肃”。据说他在病中得知台湾被割让给日本，十分悲痛。
sources: []
recalled:
