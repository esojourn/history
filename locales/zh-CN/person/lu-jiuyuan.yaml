name: 陆九渊
aliases: [陆子静, 象山先生]
role: 理学家，心学的开创者
summary: 南宋理学家，主张“心即理”，与朱熹在鹅湖论学，开创心学，后由明代王守仁发扬。
body: |-
  陆九渊字子静，抚州金溪（今属江西）人，生于绍兴九年（公元 1139 年）。陆家是累世同居的大家族，兄弟六人，他最小，与兄长陆九韶、陆九龄都以学问知名，合称“三陆”。据记载，他少年时读书读到“宇宙”二字的解释，便悟出“宇宙便是吾心，吾心即是宇宙”。

  乾道八年（1172 年）陆九渊考中进士，此后回乡讲学，学者很多。他认为“心即理”，人人本心都具备天理，为学的关键在于“发明本心”，不必像朱熹那样依靠大量读书、逐一格物。淳熙二年（1175 年）吕祖谦约朱熹与陆九龄、陆九渊兄弟在信州鹅湖寺相会，双方围绕为学的方法辩论，朱熹认为陆氏的方法“太简”，陆氏则认为朱熹的方法“支离”，没有达成一致（另见“鹅湖之会”条）。

  虽然学术主张不同，两人仍然互相敬重。淳熙八年（1181 年）陆九渊到南康拜访朱熹，朱熹请他在白鹿洞书院讲学，他讲《论语》“君子喻于义，小人喻于利”一章，据说听讲的人有的感动流泪，朱熹把讲义刻在石上。此后他在临安任国子正等职，又回到家乡附近的贵溪应天山讲学，把山改名为象山，学者称他为象山先生。

  绍熙二年（1191 年）陆九渊知荆门军，整顿城防和政务，颇有政绩。绍熙三年十二月他在任上去世，换算成公历已是 1193 年初。他的学说后来由明代王守仁发展，合称“陆王心学”，与“程朱理学”并为宋明理学的两大派别。
sources: []
recalled:
  - 《宋史·儒林传·陆九渊》
  - 《象山先生全集》所附年谱
