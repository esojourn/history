name: 亨利三世
aliases:
  - 黑亨利
role: 德意志国王、皇帝
summary: 萨利安王朝的皇帝，1046 年废去三位对立的教皇，接连指派德意志人任教皇。
body: |-
  亨利生于 1017 年，是萨利安王朝第一位皇帝康拉德二世的儿子，1039 年继位为德意志国王。他为人虔诚，自己不收钱卖圣职，在国内多次宣布和平、赦免仇敌。1043 年他娶阿基坦公爵的女儿阿格尼丝为后，她的娘家就是创立克吕尼修道院的那个家族。

  《历史的轨迹》第十四章说，罗马出现三位教皇互相对立时，克吕尼一派的改革者向亨利求援。1046 年他带兵进入意大利，12 月在苏特里开会，废掉西尔维斯特三世，让贵格利六世去职并把他流放到德意志；几天后又在罗马开会废掉本笃九世。他另选班贝格主教为教皇，即克莱门特二世，新教皇在当年圣诞节为他加冕为皇帝。

  克莱门特二世和下一任教皇都在位不久就去世，1049 年亨利指派图勒主教布鲁诺为教皇，即利奥九世。《历史的轨迹》称布鲁诺是亨利的表兄弟；他是皇室的亲属，按辈分是康拉德二世的堂表兄弟。利奥九世去世后，亨利又指派了一位德意志主教，即维克多二世。经他之手，教皇的位置从罗马贵族手里转到了有心改革的人手里。

  《历史的轨迹》指出改革者的难处：教皇制脱离了罗马贵族，却是靠皇帝维持的，不过换了一个主人；他们容忍这一点，是因为没有别的出路，而亨利本人又赞同改革。

  1056 年 10 月亨利在哈茨山的行宫博德费尔德突然去世，年三十八岁，葬在施派尔。教皇维克多二世当时在他身边，扶助将满六岁的亨利四世即位，由太后阿格尼丝摄政。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十四章“教会为自由奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter16.html"
recalled:
  - 维波《康拉德二世皇帝行传》
  - 赖兴瑙的赫尔曼《编年史》
  - 《阿尔泰希大年代记》
