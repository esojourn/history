name: 希西家
aliases: []
role: 南国犹大王
summary: 犹大王，废丘坛、洁净圣殿，在亚述王西拿基立进攻时守住耶路撒冷。
body: |-
  犹大王亚哈斯的儿子，母亲是撒迦利雅的女儿亚比。据《列王纪下》18:2，他登基时二十五岁，在耶路撒冷作王二十九年；出生地圣经没有记载。他废去丘坛，毁坏柱像，砍下亚舍拉，又把摩西所造的铜蛇打碎，因为以色列人到那时还向它烧香（18:4）。《历代志下》第 29—30 章记载，他元年就叫祭司和利未人洁净圣殿，又请犹大和以色列各地的人到耶路撒冷守逾越节。

  《列王纪下》18:7–8 说他背叛亚述王，不肯事奉他，又攻击非利士人直到迦萨。据 18:13–16，希西家王十四年，亚述王西拿基立上来攻取犹大的一切坚固城；希西家差人到拉吉见亚述王认罪，被罚银子三百他连得、金子三十他连得，他把圣殿门上和柱上包的金子都刮下来交出。亚述王又从拉吉派大军到耶路撒冷，拉伯沙基在城外用犹大言语向城上的百姓喊话劝降（18:17–37）。希西家撕裂衣服进了圣殿，差人去见先知以赛亚，又在耶和华面前祷告。据 19:35–37，当夜耶和华的使者在亚述营中杀了十八万五千人，西拿基立回到尼尼微，后来被自己的儿子所杀。

  西拿基立的棱柱铭文也记载了这次出征（公元前 701 年），说他攻取犹大四十六座城，把希西家困在耶路撒冷，像笼中的鸟，并列出希西家送来的贡物，其中金三十他连得与圣经所记相合，银则作八百他连得。铭文没有说攻下耶路撒冷，也没有提到军队遭灾。

  第 20 章记载，希西家病得要死，以赛亚来告诉他必不能活；他转脸朝墙祷告痛哭，以赛亚又奉命告诉他可再活十五年，并以日影在亚哈斯的日晷上后退十度为兆头。后来巴比伦王比罗达巴拉但遣使送来书信和礼物，希西家把宝库里的东西都给使者看了，以赛亚因此预言这一切日后都要被掳到巴比伦去（20:12–19）。

  20:20 提到他挖池、挖沟、引水入城，《历代志下》32:30 说他塞住基训的上源，引水直下，流到大卫城的西边。1880 年在耶路撒冷发现的西罗亚水道及其铭文，一般认为就是这项工程。他死后儿子玛拿西接续作王。按 18:13 的十四年推算，他约在前 715 年登基；18:1 和 18:9–10 却把他的元年系于北国何细亚第三年，两处不易调和，学界有不同的解法。
sources: []
recalled:
  - 《列王纪下》第 18—20 章
  - 《历代志下》第 29—32 章
  - 《以赛亚书》第 36—39 章
  - 亚述王西拿基立棱柱铭文（第三次出征）
  - 西罗亚水道铭文
