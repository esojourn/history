name: 载沣
aliases: [醇亲王, 摄政王]
role: 宣统朝的监国摄政王
summary: 光绪帝之弟、溥仪之父，宣统年间以监国摄政王执政，组建“皇族内阁”。
body: |-
  载沣是醇亲王奕譞的第五个儿子，光绪帝的异母弟，承袭醇亲王爵位。光绪二十七年（1901 年）他作为专使到德国，为义和团运动中德国公使克林德被杀一事道歉，这次出使让他接触到了欧洲的情况。

  光绪三十四年（1908 年）光绪帝和慈禧太后相继去世，载沣三岁的长子溥仪即位，载沣被任命为监国摄政王，掌握朝政。他上台后罢免了北洋军的首领袁世凯，让他回河南“养疴”，又任命自己的兄弟载洵、载涛分管海军和军谘府，把兵权集中到皇族手中。

  宣统三年（1911 年）四月，清朝宣布成立责任内阁，十三名国务大臣中满洲贵族占九人，其中皇族七人，被讥为“皇族内阁”，立宪派大失所望。同年又宣布“铁路国有”政策，引发四川保路运动。十月武昌起义爆发后，清朝被迫重新起用袁世凯，十二月载沣辞去摄政王，退归藩邸（另见“辛亥革命”条）。此后他长期在北京居住，没有参与溥仪后来在东北的活动，1951 年在北京去世。
sources: []
recalled:
  - 《清史稿·宣统皇帝本纪》
  - 溥仪《我的前半生》
  - 《醇亲王载沣日记》
