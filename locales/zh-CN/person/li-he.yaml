name: 李贺
aliases: [李长吉, 诗鬼]
role: 诗人、奉礼郎
summary: 唐代诗人，唐宗室后裔，诗风奇诡，后人称“诗鬼”，二十七岁去世。
body: |-
  李贺字长吉，河南福昌昌谷人，是唐朝宗室郑王的后裔，但家道早已衰落，生卒年一般作 790—816 年，另有 791—817 年之说。他少年时就以诗闻名，据说曾受到韩愈的赏识。他准备参加进士考试时，有人以他父亲名叫晋肃，“晋”与“进”同音，儿子应当避父讳为由，反对他应考，韩愈专门写了《讳辩》替他辩护，但他最终没有参加考试，只做了三年奉礼郎这样的小官，后来因病辞官回乡，不久去世，年仅二十七。

  据李商隐写的《李贺小传》，他常骑着瘦驴出游，让小书童背着一只旧锦囊跟随，想到好句子就写下来投入囊中，晚上回家再整理成篇，他的母亲看了说，这孩子要把心呕出来才罢休。他的诗想象奇特，多写神仙鬼怪，用词瑰丽冷峭，代表作有《雁门太守行》《李凭箜篌引》《金铜仙人辞汉歌》等，后人称他为“诗鬼”。杜牧为他的诗集作了序。
sources: []
recalled:
  - 李商隐《李贺小传》
  - 杜牧《李长吉歌诗叙》
  - 《新唐书·文艺传·李贺》
  - 韩愈《讳辩》
