name: 李存勖
aliases: [亚子, 后唐庄宗, 李天下]
role: 晋王、后唐皇帝
summary: 李克用之子，908 年继为晋王，923 年建后唐、灭后梁，926 年死于兵变。
body: |-
  李存勖是沙陀人，晋王李克用的长子，光启元年（公元 885 年）生于晋阳，小字亚子，善骑射，通音律。天祐五年（908 年）李克用去世，他继为晋王，当时晋军被后梁围困在潞州已经一年多，他亲自率军南下，趁大雾突袭梁军的夹寨，解了潞州之围（另见“夹寨之战”条）。据说朱温听到消息后叹息说，生子当如李亚子。

  此后十余年，他与后梁争夺河北。乾化元年（911 年），晋军在柏乡大败梁军（另见“柏乡之战”条）；乾化三年（913 年），灭了幽州称帝的刘守光；贞明元年（915 年）魏博军哗变投晋，他据有河北大部，此后与梁军隔黄河对峙。他又多次击退南下的契丹军。欧阳修在《新五代史·伶官传序》里记载了一个传说：李克用临终给他三支箭，嘱咐他向梁、燕、契丹报仇，他每次出征都带着这三支箭。这个故事不见于更早的史书。

  同光元年（923 年）四月，他在魏州称帝，国号唐，史称后唐；十月从郓州直取开封，梁末帝自杀，后梁灭亡（另见“后唐灭梁”条）。他随后迁都洛阳。同光三年（925 年），他派长子李继岌和枢密使郭崇韬出兵，灭了前蜀（另见“后唐灭前蜀”条）。

  称帝以后，他宠信伶人和宦官，常亲自粉墨登场，自号“李天下”；刘皇后聚敛财物，军士的赏赐却不能按时发放。同光四年（926 年），他听信宦官的谗言，纵容刘皇后杀死郭崇韬，又杀了大将朱友谦，人心离散。同年二月，魏州戍卒作乱，他派李嗣源前去平定，李嗣源反被乱军拥戴。四月，洛阳的禁军将领郭从谦发动兵变，李存勖中流矢而死（另见“兴教门之变”条）。欧阳修据此写道，“忧劳可以兴国，逸豫可以亡身”。
sources: []
