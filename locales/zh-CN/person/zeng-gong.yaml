name: 曾巩
aliases: [曾子固, 南丰先生, 曾文定]
role: 北宋文学家
summary: 北宋文学家，欧阳修的学生，以文章平正典雅著称，列入“唐宋八大家”。
body: |-
  曾巩是建昌军南丰人，生于天禧三年（公元 1019 年），少年时就以文章知名，后来受到欧阳修的赏识，拜在他门下，又与王安石是好友，曾向欧阳修推荐王安石。他屡次应考不中，直到嘉祐二年（1057 年）才与苏轼、苏辙等人同榜考中进士。

  此后他在馆阁任职多年，负责校勘古籍，整理了《战国策》《说苑》等书，并为它们写了序。熙宁以后他长期在越州、齐州、襄州、洪州、福州等地任知州，据《宋史》本传，他在齐州治理盗贼、疏浚湖泊，颇有政绩。元丰年间他被召回朝廷，任中书舍人。元丰六年（1083 年）他在江宁去世。他的散文以议论平正、结构严谨著称，被列入“唐宋八大家”，著有《元丰类稿》。
sources: []
recalled:
  - 《宋史·曾巩传》
  - 林希《曾巩墓志》
  - 《元丰类稿》
