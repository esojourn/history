name: 王仙芝
aliases: [天补平均大将军]
role: 起义军首领
summary: 濮州私盐贩子，874 年前后在长垣起兵反唐，黄巢起兵响应，878 年兵败被杀。
body: |-
  王仙芝是濮州人，以贩卖私盐为业。唐懿宗、僖宗时，朝廷赋税沉重，关东连年水旱，百姓流离。乾符元年（公元 874 年）末到次年初，王仙芝聚众数千人在濮州长垣起兵，发布檄文指斥官吏贪暴、赋税繁重、赏罚不平，自称“天补平均大将军”。他攻陷濮州、曹州，曹州冤句人黄巢也聚众响应，两支队伍会合，转战河南、山南、淮南各地（另见“王仙芝黄巢起义”条）。

  乾符三年（876 年），起义军攻打蕲州，蕲州刺史裴偓与王仙芝讲和，答应奏请朝廷授予官职。朝廷任命他为左神策军押牙，他打算接受，黄巢大怒，据《资治通鉴》，黄巢打伤了他的头部，部众也纷纷反对，他只好作罢，此后两人分兵作战。乾符五年（878 年）二月，他在黄梅被唐将曾元裕击败，与部众五万余人（据《资治通鉴》）一同被杀，余部归附黄巢。他的生年史书没有记载。
sources: []
recalled:
