name: 约拿
aliases: []
role: 先知
summary: 北国以色列的先知，奉命往尼尼微宣告，事见《约拿书》。
body: |-
  亚米太的儿子，迦特希弗人。《列王纪下》14:25 记载，以色列王耶罗波安二世收回以色列的边界，从哈马口直到亚拉巴海，正如耶和华藉他仆人先知约拿所说的。圣经里能把他系于某位君王年间的只有这一处；他的生卒年没有记载。

  《约拿书》记载，耶和华吩咐他往尼尼微大城去，向其中的居民呼喊。他却下到约帕，上了一条往他施去的船。海上起了大风，船上的人掣签掣出约拿，照他自己的话把他抛进海里，风浪就平息了。耶和华安排一条大鱼吞了他，他在鱼腹中三日三夜，向耶和华祷告，鱼把他吐在旱地上（第 1—2 章）。

  他第二次受命，进尼尼微城宣告再等四十日这城必倾覆。尼尼微人信服神，从王到百姓都披麻禁食，神就不降所说的灾。约拿为此发怒，出城在城的东边搭棚坐下。神使一棵蓖麻长起来给他遮荫，次日又使它枯槁，然后问他：这蓖麻一夜发生、一夜干死，他尚且爱惜，这大城里不能分辨左手右手的就有十二万多人，岂能不爱惜（第 3—4 章）。全书到这句问话为止，没有交代约拿后来的事。福音书记载耶稣曾提到约拿三日三夜在大鱼腹中的事（《马太福音》12:39–41）。
sources: []
recalled:
  - 《列王纪下》14:25
  - 《约拿书》第 1—4 章
  - 《马太福音》12:39–41
