name: 汉成帝
aliases: [刘骜, 孝成皇帝]
role: 皇帝
summary: 汉元帝之子，在位二十六年，把朝政交给母家王氏兄弟，宠幸赵飞燕姐妹，身后无子。
body: |-
  刘骜是汉元帝与王政君所生，甘露三年（公元前 51 年）生于太子宫，祖父宣帝很喜欢他。据《汉书·成帝纪》，他年轻时好读经书，后来渐渐喜欢饮酒游乐。元帝晚年想改立另一个儿子定陶王，因大臣史丹劝阻而作罢。竟宁元年（前 33 年）他继位。

  即位后他任命舅舅王凤为大司马大将军，总管尚书事务，元帝朝专权的宦官石显被免职。河平二年（前 27 年），他在同一天把另外五位舅舅封为列侯，世称“五侯”。此后王氏兄弟相继任大司马辅政，前后二十余年。光禄大夫刘向等人屡次上书，劝他抑制外戚，他心里明白却不能采纳。

  他常常微服出游。鸿嘉三年（前 18 年）许皇后被废，两年后他立歌女出身的赵飞燕为皇后，又以其妹为昭仪。他在长安城东另建昌陵，工程五年不成，耗费巨大，只得停工。在位期间，他命刘向等人整理校订宫中所藏的图书。

  他没有存活的儿子，绥和元年（前 8 年）立侄子定陶王刘欣为太子。次年三月他在未央宫突然去世，葬于延陵。本纪的赞语说他仪表庄重，但沉湎酒色，赵氏在宫内作乱，外戚在朝中专权。
sources: []
recalled:
  - 《汉书·成帝纪》
  - 《汉书·元后传》
  - 《汉书·外戚传下》
