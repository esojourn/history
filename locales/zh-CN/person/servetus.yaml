name: "塞尔维特"
aliases: ["米格尔·塞尔维特", "瑟维特", "塞尔维图斯"]
role: "西班牙医生、反三位一体论者"
summary: "西班牙医生，著书否认三位一体，1553 年在日内瓦被判为异端烧死。"
body: |-
  塞尔维特约 1511 年生于西班牙，另有 1509 年一说；他自称是阿拉贡的锡赫纳新镇人，也说过自己生在纳瓦拉的图德拉。他学过法律，二十岁时出版《论三位一体之谬误》，说三位一体的教义在圣经里找不到根据，新旧两教都不能容他。他改名换姓到巴黎学医，后来在法国南部的维埃纳给大主教做医生，隐居了十多年。

  他同加尔文通过信，把自己的书稿寄给他。1553 年初他匿名印行《基督教的复原》，书中在讨论圣灵时顺带写到血液经肺由右心流到左心，这是欧洲最早印出来的肺循环的记述。日内瓦有人向维埃纳的宗教裁判所告发，证据里有加尔文交出的信件。他被捕后越狱，天主教的法庭缺席判他火刑。

  8 月他路过日内瓦，在教堂里被认出，遭到逮捕。《历史的轨迹》第二十四章说，经过审讯证实有罪，他以异端之名于 1553 年 10 月 27 日被烧死，所有新教神学家连最温和的梅兰希顿，以及罗马天主教，都赞同处死他。日内瓦议会判决前征询过瑞士几个城市的教会，都主张严办；加尔文曾请求改用斩首，没有获准。该书又说，加尔文的对手想借此案反对他，结果自己失了信誉。

  次年巴塞尔的卡斯特利奥编书反对用死刑对付异端。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十四章“瑞士的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter27.html"
recalled:
