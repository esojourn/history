name: 安波罗修
aliases:
  - 米兰的安波罗修
  - 盎博罗削
role: 米兰主教
summary: 米兰主教，原为省长，被民众推举为主教；曾令狄奥多西皇帝公开悔罪，为奥古斯丁施洗。
body: |-
  安波罗修约在公元 339 或 340 年生于特里尔，在今天德国西部。父亲是高卢大区的长官，是帝国最高的文官之一。父亲去世后，母亲带着孩子回到罗马，他在那里受了法律和修辞的教育，随后进入仕途。约公元 370 年，他被任命为意大利北部埃米利亚—利古里亚省的省长，驻在米兰，当时米兰是西部皇帝常住的地方。

  公元 374 年，米兰的亚流派主教奥克森提乌去世，亚流派和尼西亚派为继任人选争执不下。他以省长身份到教堂维持秩序。据他的秘书保利努写的传记，这时有个孩子喊了一声“安波罗修作主教”，全场随即同声附和。他当时只是慕道者，还没有受洗，再三推辞不成，于是受洗，几天之内被立为主教。《历史的轨迹》第五章讲了这段经过。他把财产分给穷人和教会，从头学习神学，读了大量希腊教父的著作。

  他坚决支持尼西亚信经。385 至 386 年，信亚流派的皇太后尤斯蒂娜要他让出一座教堂给亚流派使用，他带着会众日夜守在教堂里，军队围了几天后撤走。他在这次对峙中教会众轮流对唱诗篇和他自己写的诗歌，西方教会会众唱诗的习惯由此传开，有几首诗歌一般认为确是他的作品。384 年罗马元老院请求把胜利女神祭坛搬回议事厅，他上书皇帝反对，祭坛没有恢复。

  公元 390 年帖撒罗尼迦屠杀之后，他写信给狄奥多西皇帝，要求他公开悔罪，否则不为他献圣餐，皇帝照办了。他在讲道和书信里一再说，皇帝在教会之内，不在教会之上。

  他的讲道吸引了在米兰教修辞学的奥古斯丁，387 年复活节前夜，他为奥古斯丁施洗。他的著作有仿西塞罗体例写的《论神职人员的本分》，以及许多解经讲章。397 年 4 月 4 日，他在米兰去世。《历史的轨迹》把他与耶柔米、奥古斯丁并称“拉丁教会之父”。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第六章“教会渐趋腐化” https://wellsofgrace.com/books/spiritual/2000years/html/chapter07.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
