name: "夸美纽斯"
aliases: ["扬·阿摩司·夸美纽斯", "柯墨纽乌"]
role: "弟兄合一会主教、教育家"
summary: "弟兄合一会最后一位主教，著名教育家，称流散的会众为“隐藏的种子”。"
body: |-
  夸美纽斯 1592 年生于摩拉维亚（出生地有尼夫尼采、乌赫尔斯基布罗德等说），属于胡斯派传下来的弟兄合一会。他在德国的赫博恩、海德堡读书，回国后做牧师和教师。

  《历史的轨迹》第三十四章说，弟兄合一会是 1457 年波希米亚的胡斯派余众所立，路德时代已有二十万信徒、四百间教会，1501 年最早使用圣诗集。反改教运动和三十年战争几乎把这个教会扫荡殆尽，只剩一小部分“余民”。1620 年白山之战后，新教在波希米亚、摩拉维亚被禁，他失去妻儿和藏书，1628 年流亡到波兰的莱什诺，后来被选为弟兄合一会的主教。

  该书称他是弟兄合一会最后一位主教，也是著名的教育家。他主张人人受教育、按儿童的能力循序施教，写了《大教学论》和最早的儿童看图课本《世界图解》，被后世称为近代教育学的奠基人之一。1656 年莱什诺毁于战火，他迁居阿姆斯特丹，1670 年在那里去世，葬在纳尔登。

  该书说，他称这批余民为“隐藏的种子”，后来的历史果然证实了他的话。一百多年后亲岑多夫读了他写的书，详知弟兄会的信仰与实践，决心把古代弟兄会重新组织起来。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十四章“敬虔主义 莫拉维弟兄会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter38.html"
recalled:
  - "夸美纽斯《大教学论》"
  - "夸美纽斯《世界图解》（1658 年）"
