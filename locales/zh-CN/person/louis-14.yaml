name: "路易十四"
aliases: ["太阳王"]
role: "法国国王"
summary: "法国在位最久的国王，1685 年废除南特诏谕，迫害胡格诺派与詹森派。"
body: |-
  路易十四 1638 年生于圣日耳曼昂莱，1643 年五岁即位，先由母后和首相马扎然摄政，1661 年起亲政，在位七十二年。他把宫廷迁到凡尔赛，集权于一身，相传说过“朕即国家”，这句话是否出自他口并无确证。

  《历史的轨迹》第三十九章说，到 1648 年时西班牙已失去强权地位，荷兰与英国争夺海上霸权，德国因三十年战争而疲惫，欧洲最强的就是法国。路易十四雄心勃勃，觊觎西班牙、荷兰和德国莱茵河谷，还想降服英国。作者说他身为专制君主，最恨复原教，尤其是加尔文主义，因为它强烈主张宗教与政治的自由。

  1685 年他废除南特诏谕。该书说，此后法国改革宗有上千人殉道、几百人放弃信仰，约五十万到八十万胡格诺信徒逃往德国、荷兰、英国和美国，法国工商业因此大受打击。逃出的人数各家估计出入很大，常见的说法在二十万上下，书中的数字偏高。

  第三十一章说他与英王詹姆士二世合谋，要在英国恢复天主教，1688 年后又援助詹姆士登陆爱尔兰。第三十七章说，在耶稣会的影响下他大力迫害詹森派，1710 年巴黎附近波尔罗亚尔修道院的建筑全被拆毁。他 1715 年死于凡尔赛，曾孙路易十五继位。第三十九章说，他死后对胡格诺派的逼迫暂时中止，1724 年又以新的气势爆发。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十七章“东方教会与罗马教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter41.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
