name: 亚历山大的革利免
aliases:
  - 提图斯·弗拉维乌斯·革利免
  - 克莱门
role: 亚历山大教理学校教师
summary: 二世纪末在亚历山大教导信仰的学者，俄利根的前辈，著有《杂记》等书。
body: |-
  革利免约生于公元 150 年，生在哪里没有可靠记载，四世纪的伊皮法纽说有人说是雅典，有人说是亚历山大。他自述曾到各地寻访老师，最后在埃及找到一位，一般认为就是潘代努。他后来接替潘代努，在亚历山大的教理学校教导人。《历史的轨迹》称他是亚历山大“能干的神学教授”，并提醒不要把他和一百年前罗马的革利免混淆。

  他传世的主要著作有三部：《劝勉希腊人》劝异教徒归信；《导师》讲信徒日常生活的操守；《杂记》篇幅最大，讨论信仰与哲学的关系。他认为希腊哲学对希腊人的作用，有如律法对希伯来人的作用，是引人到基督那里的预备。

  公元 202 年前后，塞维鲁皇帝在位时亚历山大发生逼迫，他离开埃及。此后他的行踪只在耶路撒冷主教亚历山大的信里有零星的反映：约 211 年他还带着这位主教的信到安提阿，约 215 年的另一封信提到他时，他已经去世。优西比乌说俄利根是他的学生；两人是否真有师生关系，现代学者有不同看法。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三章“教会内部的成长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter04.html"
recalled:
  - 亚历山大的革利免《杂记》卷 1 第 1、5 章
  - 优西比乌《教会史》卷 5 第 11 章、卷 6 第 6、11、14 章
