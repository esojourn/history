name: 谢安
aliases: [谢安石, 谢太傅, 文靖]
role: 宰相
summary: 东晋名相，早年隐居东山，四十余岁出仕，挫败桓温代晋的图谋，主持了淝水之战。
body: |-
  谢安字安石，祖籍陈郡阳夏，西晋末年其家南渡，他的出生地史书没有记载。他年少时就受到王导等人称赏，名声很大，朝廷和地方长官多次征召，他都推辞不就，住在会稽的东山，与王羲之、许询和僧人支遁等游山玩水、作文清谈，并教导家中子弟。当时人说：谢安不肯出来，叫天下百姓怎么办？此语见《世说新语·排调》。

  升平三年（公元 359 年）他的弟弟谢万领兵北伐失败，被废为庶人，谢氏的地位岌岌可危。第二年他已四十多岁，才应征出任桓温的司马，后来历任吴兴太守、侍中、吏部尚书。简文帝去世时，他与王坦之等人顶住压力，没有让桓温得到帝位。宁康元年（373 年）桓温带兵入朝，传言要杀他和王坦之，两人到新亭迎接，王坦之紧张得汗流浃背，他则神色自若，从容交谈，事见《晋书》本传。桓温要求加九锡，也被他拖延到桓温病逝。

  此后他辅佐年少的孝武帝，逐渐总揽朝政。他与镇守上游的桓温之弟桓冲和睦相处，又举荐侄子谢玄镇守广陵，招募北来流民中的勇士组成“北府兵”。太元八年（383 年）前秦苻坚大举南下，朝野震恐，他任征讨大都督，派弟弟谢石、侄子谢玄等率八万人迎战，在淝水大破秦军。本传和《世说新语·雅量》记载，捷报送到时他正与客人下棋，看完后不动声色，客人问起，他才慢慢地说：孩子们已经把敌人打败了。下完棋回屋，他过门槛时高兴得把木屐的齿碰断了也没有察觉。

  淝水之战后他上表请求乘胜北伐，谢玄等一度收复黄河以南许多地方。这时孝武帝的弟弟会稽王司马道子开始排挤他，太元十年（385 年）他自请出镇广陵，不久患病回到建康，八月去世，时年六十六，追赠太傅。
sources: []
recalled:
  - 《晋书·谢安传》
  - 《世说新语》
  - 《资治通鉴》卷一百零一至一百零六
