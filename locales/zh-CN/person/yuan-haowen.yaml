name: 元好问
aliases: [元裕之, 遗山先生]
role: 金末元初文学家
summary: 金末元初文学家，金亡后不仕，编《中州集》保存金代诗作，是金代成就最高的诗人。
body: |-
  元好问字裕之，号遗山，忻州秀容（今山西忻州）人，生于明昌元年（公元 1190 年），先世出自北魏拓跋氏。他自幼聪慧，七岁能诗，少年时随叔父游宦各地，从郝天挺学习。兴定五年（1221 年）他考中进士，后来在河南几个县做县令，又入朝任尚书省掾、左司都事等职。

  天兴元年（1232 年）蒙古军围攻汴京，元好问在城中。次年汴京守将崔立投降，他致书蒙古的中书令耶律楚材，推荐一批中原的儒士，请求加以保护。随后他作为金朝官员被羁管在聊城等地，目睹了金朝的覆亡。他写了大量“丧乱诗”，记述战乱中百姓的苦难，如《岐阳》《癸巳五月三日北渡》等，被认为是继杜甫之后的“诗史”。

  金亡以后，元好问不在蒙古朝廷做官，以保存金代历史为己任。他在家中修筑“野史亭”，搜集金朝君臣的言行和遗事，又编成《中州集》，收录金代二百多位诗人的作品，后来元朝修《金史》时多取材于他的著述。他的诗、文、词、曲都有成就，著有《遗山集》，《论诗绝句三十首》是重要的诗论；他的《摸鱼儿·雁丘词》有“问世间，情是何物，直教生死相许”之句。他晚年往来于山西、河北各地，宪宗七年（1257 年）在获鹿（今属河北石家庄）寓所去世。
sources: []
