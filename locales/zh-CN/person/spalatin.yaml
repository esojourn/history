name: "施帕拉丁"
aliases: ["格奥尔格·布克哈特", "施巴拉丁"]
role: "萨克森选侯的秘书与宫廷牧师"
summary: "萨克森选侯智者腓特烈的秘书，路德与选侯之间的联络人。"
body: |-
  施帕拉丁本名格奥尔格·布克哈特，1484 年生于纽伦堡附近的施帕尔特，以家乡为名。他在爱尔福特和维滕贝格读书，属于爱尔福特的人文学者圈子，1508 年受立为司铎。同年萨克森选侯请他做侄子的教师，后来让他管理维滕贝格的图书馆，做自己的秘书、宫廷牧师和告解神父。

  他与路德大约在 1514 年相识。《历史的轨迹》第二十三章说，选侯给路德许多关怀，两人却始终没有见过面，全靠施帕拉丁居间。路德的想法由他转达给选侯，选侯的意思由他带回；路德写给他的信留下四百多封。1518 年教皇传路德去罗马，是他陪选侯在奥格斯堡交涉，把审问改在德意志进行。1521 年他随选侯到沃尔姆斯，路德藏身瓦特堡期间的书稿、信件也多经他的手。该书第二十二章说教皇的使者米尔蒂茨与他很熟；说他是选侯派驻罗马的代理人，则没有别的依据。

  他时常劝路德措辞缓和些，压下过路德几篇文章。1525 年选侯去世，他离开宫廷，到阿尔滕堡做牧师，同年结婚。此后他参加萨克森各地教会的巡视，1530 年出席奥格斯堡帝国议会，又编写了萨克森和宗教改革的史事。1545 年 1 月他在阿尔滕堡去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十二章“教会大大骚动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter25.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十三章“德国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter26.html"
recalled:
