name: 老子
aliases: [李耳, 老聃, 太上老君]
role: 思想家，道家创始人
summary: 春秋末年思想家，相传为周守藏室之史，著《老子》，被奉为道家创始人。
body: |-
  老子的生平在古代就已不甚清楚，生卒年不详。据《史记·老子韩非列传》，老子是楚国苦县厉乡曲仁里人，姓李，名耳，字聃，曾任周的守藏室之史，即管理王室藏书的史官。孔子曾到周向他问礼，老子告诫孔子要去掉骄气和多欲。孔子回去后对弟子说，老子就像龙一样，难以捉摸。

  《史记》说，老子修道德，其学以自隐无名为务。他在周住了很久，看到周的衰落，就离开了；到达关口时，关令尹喜请他著书，于是老子写下上下篇，“言道德之意五千余言而去，莫知其所终”。司马迁同时记下了另外两种说法：有人说老子就是与孔子同时的楚人老莱子，也有人说是孔子死后一百多年的周太史儋。司马迁自己也说“世莫知其然否”。

  《老子》又称《道德经》，今本八十一章，以“道”为天地万物的根源，主张清静无为、柔弱不争、反对过多的智巧和欲望，治国则主张“小国寡民”。书中“道可道，非常道”“上善若水”“祸兮福之所倚”等语流传极广。关于此书的成书年代，二十世纪有学者认为晚至战国；1973 年长沙马王堆汉墓出土了帛书《老子》两种，1993 年湖北荆门郭店楚墓出土了竹简《老子》，后者的抄写年代不晚于公元前 300 年前后，说明《老子》在战国中期已经流传，但竹简本只有今本的一部分。

  汉初的“黄老之学”以老子为宗，东汉以后兴起的道教奉老子为教主，尊为“太上老君”；唐朝皇室姓李，追尊老子为祖先。
sources: []
recalled:
  - 《史记·老子韩非列传》
  - 《老子》
  - 郭店楚墓竹简
  - 马王堆汉墓帛书
