name: 朱泚
aliases: []
role: 幽州节度使、僭号皇帝
summary: 原幽州节度使，泾原兵变后被乱兵拥立称帝，围攻奉天，次年兵败被部下所杀。
body: |-
  朱泚是幽州昌平人，天宝元年（公元 742 年）生，在幽州军中任职。大历七年（772 年）幽州节度使朱希彩被部下所杀，他被推为节度使。两年后他主动入朝，表示忠心，此后留在长安，幽州由他的弟弟朱滔掌管。

  建中三年（782 年）朱滔在河北反叛，他受到牵连，被解除兵权，闲居长安。建中四年（783 年）十月泾原兵变，唐德宗逃往奉天，乱兵拥立他为首领，他随即在长安称帝，国号大秦，次年改为汉，并亲自率军围攻奉天一个多月，因援军赶到而退回长安（另见“泾原兵变”条）。

  兴元元年（784 年）五月，李晟收复长安，他向西逃往泾州方向，途中被部将梁庭芬、韩旻等人杀死，首级被送到朝廷。
sources: []
