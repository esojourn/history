name: 方孝孺
aliases: [正学先生]
role: 建文帝的近臣、学者
summary: 宋濂的弟子，建文帝的老师和顾问；拒绝为永乐帝起草即位诏书，被杀，受牵连者众多。
body: |-
  方孝孺是台州宁海（今属浙江）人，从小以文章知名，曾跟随明初大学者宋濂学习，宋濂十分器重他。他的书斋名“正学”，因此被称为“正学先生”。洪武年间他两次被举荐，朱元璋认为他品行端正，但没有重用，让他到汉中担任府学教授，后来又被蜀王聘为世子的老师。

  建文帝即位后召他入京，任翰林侍讲、侍讲学士，国家大政多征求他的意见，削藩的诏令和讨伐燕王的檄文多出自他手。他主张依照《周礼》改革官制，在建文年间推行了一些变更。

  建文四年（1402 年）朱棣攻入南京，召方孝孺起草即位诏书，方孝孺身穿丧服入宫，当众痛哭，拒绝起草，被处死，年四十六岁。据《明史》等书记载，他的亲族和门生受到牵连而被杀的很多；后世流传的“诛十族”之说，见于野史，学者对具体人数和是否真有“十族”有不同看法。万历年间朝廷为建文朝的殉难诸臣平反，南明时追谥方孝孺为“文正”。
sources: []
recalled:
  - 《明史·方孝孺传》
  - 《明史纪事本末·壬午殉难》
