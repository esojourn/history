name: 同治帝
aliases: [载淳, 清穆宗]
role: 清朝第十位皇帝
summary: 咸丰帝独子，六岁即位，由两宫太后垂帘听政，亲政不到两年即病逝。
body: |-
  载淳是咸丰帝唯一长大的儿子，母亲是慈禧太后。咸丰十一年（1861 年）咸丰帝在热河去世，六岁的载淳即位，原定年号“祺祥”，辛酉政变后改为“同治”，意思是两宫太后共同治理。

  同治年间，清朝依靠曾国藩、左宗棠、李鸿章等人镇压了太平天国和捻军，又在西北镇压回民起义，朝廷开展洋务，社会秩序一度恢复，史称“同治中兴”。这些事务实际上都由两宫太后和恭亲王奕訢主持。

  同治十二年（1873 年）载淳亲政，不久提出重修圆明园，遭到恭亲王等大臣的反对，被迫停止。同年他在紫光阁接见了各国公使，各国公使没有行跪拜礼，这是清朝皇帝第一次按照西方礼节接见外国使节。同治十三年十二月（公历已是 1875 年 1 月）他在北京去世，年十九岁。清朝官方记载他死于天花，民间有死于梅毒等传说，学者多认为天花之说较为可信。他没有儿子，慈禧太后立他的堂弟载湉继位。
sources: []
recalled:
  - 《清穆宗实录》
  - 《翁同龢日记》
