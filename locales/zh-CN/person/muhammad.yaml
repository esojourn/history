name: 穆罕默德
aliases:
  - 穆罕默德·本·阿卜杜拉
role: 伊斯兰教的创立者
summary: 阿拉伯麦加人，创立伊斯兰教，622 年迁往麦地那，去世前统一了阿拉伯半岛大部。
body: |-
  穆罕默德约在公元 570 年生于阿拉伯半岛的麦加，属古莱什部落的哈希姆家族。据穆斯林传记，他出生前父亲已去世，幼年丧母，先后由祖父和叔父艾布·塔利卜抚养。《历史的轨迹》第八章说他年轻时牧过羊，后来随商队到各地经商，途中接触到犹太人和基督徒，知道一些他们的信仰。约二十五岁时他与富孀赫蒂彻结婚。

  他常到麦加城外僻静的地方默想。据传约在 610 年，他在希拉山洞里宣称得到天使加百列传来的启示，此后开始传讲独一的神，反对麦加人的多神崇拜和偶像。他宣讲的内容在他去世后被收集编定为《古兰经》。伊斯兰教的基本信条是：只有一位神，穆罕默德是他的使者。《历史的轨迹》是一部基督教会史，从教会的立场称这是一个新的、错误的宗教；本条只叙述经过。

  起初信从的人不多，麦加的大多数人反对他。622 年他带着跟随者迁往北面的麦地那，这次迁徙称为“希吉拉”，后来被定为伊斯兰历的纪元。在麦地那他既是宗教领袖，也是政治和军事的首领，与麦加人打了白德尔、吴侯德、壕沟几仗，628 年订立侯代比亚和约，630 年兵不血刃进入麦加，清除了克尔白里的偶像。

  632 年他到麦加朝觐后回到麦地那，同年 6 月病逝。《历史的轨迹》说，迁到麦地那之后十年之内，他成了阿拉伯的统治者。他死后，继任的哈里发率领阿拉伯人向外征服，一百年间从东罗马帝国手中夺去叙利亚、巴勒斯坦、埃及和北非。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第八章“教会丧失领域” https://wellsofgrace.com/books/spiritual/2000years/html/chapter10.html"
recalled:
  - 伊本·易斯哈格《先知传》（伊本·希沙姆校订本）
  - 《古兰经》
  - 塔巴里《历代先知与帝王史》
