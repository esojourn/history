name: 阿米阿努斯·马尔凯利努斯
aliases: [阿米阿努斯, 阿米安, 阿米亚努斯·马塞里努斯]
role: 军官、历史学家
summary: 希腊人出身的罗马军官，用拉丁文写成记到公元 378 年的《历史》。
body: |-
  阿米阿努斯约在公元 330 年生于叙利亚，一般认为是安条克人，母语是希腊语。他年轻时进了皇帝的卫队，353 年起在将军乌尔西基努斯麾下当参谋，随他到过尼西比斯、米兰和高卢。359 年波斯王沙普尔二世围攻阿米达，他在城里，城破那夜趁乱逃出。363 年他又参加了尤利安对波斯的远征。

  退役后他游历埃及、希腊等地，八十年代定居罗马，用拉丁文写了一部三十一卷的《历史》，从公元 96 年涅尔瓦即位写起，接着塔西佗往下，写到 378 年阿德里安堡之战。前十三卷已经失传，现存的十八卷只记 353 年以后的二十五年，大多是他亲身经历或向当事人打听来的。他在书末自称“一个当过兵的希腊人”。

  他不是基督徒，敬佩尤利安，但也批评尤利安禁止基督徒教书。书里穿插着各地风土的长篇叙述，匈人的习俗、波斯的地理、罗马贵族的排场都在其中。此书约在 390 年前后完成，他的卒年不详。
sources: []
recalled:
  - 阿米阿努斯·马尔凯利努斯《历史》卷 18 第 6—8 章、卷 19 第 8 章、卷 31 第 2 章、卷 31 第 16 章
  - 利巴尼乌斯《书信》第 1063 封
