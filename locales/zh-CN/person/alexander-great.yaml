name: 亚历山大大帝
aliases: [亚历山大三世, 亚历山大]
role: 马其顿国王
summary: 马其顿国王，十年间灭波斯帝国，兵锋直抵印度河流域，三十二岁病逝于巴比伦。
body: |-
  公元前 356 年生于马其顿都城佩拉，父亲是国王腓力二世，母亲是伊庇鲁斯公主奥林匹亚斯。前 343 年前后起，亚里士多德在米埃扎教了他约三年。前 340 年腓力出征，十六岁的他留守监国，平定了色雷斯一个部落的叛乱。前 338 年喀罗尼亚之战，他指挥左翼骑兵。前 336 年腓力遇刺，他在安提帕特等人支持下继位，除掉可能争位的人；次年北征多瑙河一带和伊利里亚，又回师攻陷起事的底比斯，把城夷为平地。

  前 334 年春他渡过赫勒斯滂海峡进入亚洲。兵力各书所记不同，大致是步兵三万余、骑兵五千左右。同年在格拉尼库斯河击败波斯的小亚细亚诸总督，沿海而下，攻取米利都和哈利卡纳苏斯。前 333 年 11 月在伊苏斯击败亲自统兵的大流士三世，俘获其母亲、妻子和女儿。他没有立即东追，而是南下夺取腓尼基沿海以断绝波斯舰队的基地：围攻推罗七个月，筑堤连岛才把它攻下；随后取迦萨，进入埃及。他在尼罗河口以西选址建亚历山大城，又穿过沙漠去锡瓦绿洲求问阿蒙神谕。前 331 年 10 月 1 日，他在底格里斯河以东的高加米拉再次击败大流士，随后进入巴比伦、苏萨和波斯波利斯，取得波斯历代积存的巨额金银。前 330 年波斯波利斯的王宫被焚；同年大流士在东逃途中被部下贝苏斯等人杀害。

  此后三年他在巴克特里亚和索格底亚那作战，对手是贝苏斯和当地首领斯皮塔美涅斯的游击。他开始穿波斯式的衣服，任用波斯贵族，前 327 年娶巴克特里亚贵族之女罗克珊娜。这些做法引起一些马其顿人的不满。前 330 年他处死骑兵统领菲洛塔斯，并派人杀了其父帕曼纽；前 328 年在酒宴上亲手刺死救过他性命的克莱图斯；前 327 年他试行波斯式的跪拜礼受阻，随军史家卡利斯提尼不久因侍从谋刺案牵连而死。

  前 327 年他越过兴都库什山进入印度河流域，前 326 年在希达斯皮斯河击败波罗斯王。到了希发西斯河（今比亚斯河），久战的士兵不肯再向东走，他只得折回，顺印度河而下，途中攻一座城时胸部中箭，几乎丧命。前 325 年他率一部穿越格德罗西亚沙漠西返，损失很大；尼阿库斯率舰队沿海岸航行到波斯湾。前 324 年他在苏萨为自己和八十多名部将举行与波斯贵族女子的集体婚礼；在奥皮斯遣散老兵时又遇到一次抗命。同年秋，他最亲近的朋友赫费斯提翁病逝。

  前 323 年他回到巴比伦，筹备环航阿拉伯半岛。5 月底他在宴饮后发烧，十来天后于 6 月 10 日或 11 日去世，不满三十三岁，在位十二年零八个月。死因古代即有中毒之说，现代多认为是疾病，具体是哪一种没有定论。他没有指定继承人，帝国在部将的争夺中分裂。他沿途建立的许多城市和随之而来的希腊移民、希腊语，开启了后人所称的“希腊化时代”。

  关于他的同时代记载都已失传。现存主要有五种，都写于三百至五百年后：阿里安的《亚历山大远征记》（主要依据托勒密和阿里斯托布洛斯的回忆）、普鲁塔克的传记、狄奥多罗斯《历史丛书》卷十七、库尔提乌斯的《亚历山大史》和尤斯丁的摘要，彼此出入不少。《马加比一书》开头简述了他的征服和死后帝国的分裂。
