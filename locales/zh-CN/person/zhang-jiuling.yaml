name: 张九龄
aliases: [张子寿, 曲江公]
role: 宰相、诗人
summary: 开元后期的宰相和诗人，以直言著称，反对任用李林甫，被罢相后不久去世。
body: |-
  张九龄字子寿，韶州曲江人，是唐朝少有的出身岭南的宰相。他进士及第后入朝为官，得到宰相张说的赏识。开元四年（公元 716 年）他告假回乡期间，奏请开凿大庾岭的山路，打通了岭南与中原之间的交通，这条路后来成为南北往来的要道。

  开元二十一年（733 年）他被任命为宰相，次年任中书令。他敢于直言，玄宗想任用李林甫为相，他认为不可；玄宗又想重用边将牛仙客，他也坚持反对。据《资治通鉴》，开元二十四年（736 年）安禄山讨伐契丹战败，被押送京城，张九龄主张依军法处斩，并说安禄山有反相，玄宗没有听从，赦免了他。同年他在李林甫的排挤下罢相，次年被贬为荆州长史，当时孟浩然曾在他的幕府中任职。

  开元二十八年（740 年）他请假回乡扫墓，在曲江病逝，年六十三。安史之乱后，据《新唐书》，玄宗在蜀地想起张九龄当年的话，后悔不已，派使者到曲江祭奠他。

  他的诗文在当时很有名声，《感遇》十二首寄托了自己的志向，《望月怀远》中“海上生明月，天涯共此时”一联流传尤广。他仪表端庄，举止有度，后来玄宗选用宰相时常问：此人风度能比得上九龄吗？后世以“曲江风度”称赞他。
sources: []
recalled:
