name: 黄兴
aliases: [克强, 黄轸]
role: 革命家，同盟会的主要领导人
summary: 创立华兴会，与孙中山共建同盟会，领导黄花岗起义，武昌起义后任战时总司令。
body: |-
  黄兴原名轸，字克强，湖南善化（今长沙）人，秀才出身，后来进入武昌两湖书院学习，光绪二十八年（1902 年）被派往日本留学。在日本期间他积极参加留学生的反清活动。光绪二十九年（1903 年）他回国后在长沙创立华兴会，次年策划在慈禧太后七十寿辰时起义，事泄后逃往日本。

  光绪三十一年（1905 年）黄兴与孙中山在东京共同创立中国同盟会，任执行部庶务，地位仅次于孙中山，人们常把两人并称“孙黄”。此后他亲自领导和参加了多次武装起义，如钦州、镇南关、河口等起义。宣统三年（1911 年）四月，他在广州领导起义，亲率一百多人攻打两广总督署，失败后右手被打断两根手指，起义的牺牲者后来合葬在黄花岗，史称“黄花岗起义”（另见该条）。

  同年十月武昌起义爆发后，黄兴赶到武汉，任战时总司令，指挥革命军在汉口、汉阳与北洋军作战，坚持了一个月，牵制了清军，为各省独立赢得了时间（另见“辛亥革命”条）。南京临时政府成立后，他任陆军总长兼参谋总长，后任南京留守。1913 年宋教仁被刺后，他参加“二次革命”，失败后流亡日本、美国。1916 年他在上海病逝，年四十二岁。
sources: []
recalled:
