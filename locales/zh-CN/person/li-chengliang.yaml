name: 李成梁
aliases: [宁远伯]
role: 镇守辽东的总兵官
summary: 镇守辽东约三十年的总兵官，屡败蒙古和女真，客观上助长了努尔哈赤崛起。
body: |-
  李成梁是辽东铁岭卫人，祖上是朝鲜人，世袭铁岭卫指挥佥事。他早年家贫，到四十岁左右才袭职，隆庆四年（1570 年）起任辽东总兵官。当时辽东的边防残破，他招募精兵，屡次击败入侵的蒙古土蛮部和泰宁部，又攻破了建州女真首领王杲的古勒寨，后来封宁远伯。

  万历十一年（1583 年）李成梁攻打王杲的儿子阿台，在战斗中，为明军带路的建州女真首领觉昌安和他的儿子塔克世被明军误杀。觉昌安是努尔哈赤的祖父，塔克世是他的父亲。事后明朝给努尔哈赤敕书、马匹，让他承袭官职。努尔哈赤后来以这件事作为“七大恨”的第一条。

  李成梁在辽东前后两次镇守，共约三十年，战功显赫，但他也被指责冒功、贪污、骄奢，家族子弟多人任总兵等职，势力很大。万历十九年（1591 年）他被弹劾去职，万历二十九年（1601 年）又以七十六岁的高龄再次镇守辽东，期间放弃了宽甸等六堡，迁走当地居民。他对努尔哈赤的扶植和纵容，后世认为是建州女真得以坐大的原因之一。万历四十三年（1615 年）他在北京去世，年九十岁。他的长子李如松在万历朝鲜之役中率军收复平壤。
sources: []
