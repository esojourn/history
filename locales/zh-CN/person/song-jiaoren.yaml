name: 宋教仁
aliases: [遁初, 渔父]
role: 革命家，国民党的实际组建者
summary: 华兴会、同盟会的骨干，主张议会政治与责任内阁，1913 年在上海被刺身亡。
body: |-
  宋教仁是湖南桃源人，光绪二十九年（1903 年）在武昌文普通学堂读书时开始从事革命活动，次年与黄兴等人创立华兴会，长沙起义计划失败后流亡日本，在日本学习法政。光绪三十一年（1905 年）他参与创立中国同盟会，主编《二十世纪之支那》等刊物。

  宣统三年（1911 年）宋教仁回到上海，与谭人凤等人组织同盟会中部总会，策划在长江流域发动起义，与湖北的革命团体保持联系，为武昌起义作了准备。南京临时政府成立后，他任法制院院长，参与起草《中华民国临时约法》，主张实行责任内阁制，以限制总统的权力。

  1912 年他把同盟会与几个小党合并，组成国民党，任代理理事长。在次年初的国会选举中，国民党获得多数席位，宋教仁准备以多数党的身份组织内阁。1913 年 3 月 20 日，他在上海火车站被刺客枪击，两天后去世，年三十一岁。调查显示此案与袁世凯政府有关，这一事件导致了“二次革命”。
sources: []
recalled:
  - 《宋教仁日记》
  - 陈旭麓编《宋教仁集》
