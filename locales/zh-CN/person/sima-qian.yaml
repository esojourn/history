name: 司马迁
aliases: [司马子长, 太史公]
role: 太史令
summary: 西汉史学家，继父职任太史令，受宫刑后写成中国第一部纪传体通史《史记》。
body: |-
  司马迁字子长，左冯翊夏阳人。他的生年史无明文，后人据《史记》的旧注推算，有景帝中元五年（公元前 145 年）和武帝建元六年（前 135 年）两说，前一说较为通行。父亲司马谈在武帝朝任太史令。据《史记·太史公自序》，他十岁诵读古文，二十岁南游江淮，到过会稽、沅湘、齐鲁和梁楚等地，回京后任郎中，曾奉命出使巴蜀以南。

  元封元年（前 110 年）武帝东行封禅，司马谈留滞途中病重，临终嘱咐儿子完成自己想写的史书。三年后司马迁继任太史令，得以阅读朝廷收藏的图书档案。太初元年（前 104 年），他参与制定的《太初历》颁行，此后开始著述。

  天汉二年（前 99 年），李陵兵败投降匈奴。武帝问及此事，司马迁认为李陵以少击众，投降或许是想找机会报效汉朝。武帝认为他有意贬低贰师将军李广利、为李陵开脱，把他下狱，后处以宫刑。他在《报任安书》中说，自己忍辱活下来，是因为书稿尚未完成。出狱后他任中书令，继续写作。

  他把这部书称为《太史公书》，后世通称《史记》。全书一百三十篇，自序说共五十二万六千五百字，分为本纪、表、书、世家、列传五种体裁，从传说中的黄帝写到武帝太初年间。他自述写作的宗旨是“究天人之际，通古今之变，成一家之言”。以人物传记为主干的这种写法被后来历代的正史沿用。他的卒年不见记载，一般认为在武帝末年或昭帝初年。
sources: []
recalled:
  - 《史记·太史公自序》
  - 《汉书·司马迁传》（含《报任安书》）
