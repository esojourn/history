name: 桓玄
aliases: [桓敬道, 南郡公]
role: 桓楚皇帝
summary: 桓温幼子，据荆州东下控制朝廷，废晋安帝自立为楚帝，数月后被刘裕等人击败身死。
body: |-
  桓玄字敬道，是桓温最小的儿子，五岁时父亲去世，由他袭封南郡公。因为桓温晚年有代晋的图谋，朝廷对他一直存有戒心，他到二十三岁才得到太子洗马的职位，后来出任义兴太守，不久弃官回到江陵。

  隆安二年（公元 398 年）他随王恭、殷仲堪起兵反对司马道子，王恭败死后，朝廷为了分化余下的各方，授他江州刺史。第二年荆州大水，他乘机攻杀殷仲堪和雍州刺史杨佺期，占有长江中上游。元兴元年（402 年）司马元显下令讨伐他，他率军东下，北府将领刘牢之归降，他进入建康，杀司马元显，自任丞相、太尉，随即夺去刘牢之的兵权，刘牢之自杀。

  元兴二年（403 年）十二月，他废晋安帝为平固王，自己即皇帝位，国号楚。《晋书》本传说他喜欢书画珍玩，政令繁细而多变，人心不附。元兴三年二月，刘裕、刘毅、何无忌等北府旧将在京口起兵，三月在建康城外击败他的军队。他挟安帝退往江陵，五月又在峥嵘洲战败，打算逃往蜀地，途中被益州的军官所杀，时年三十六。
sources: []
recalled:
  - 《晋书·桓玄传》
  - 《资治通鉴》卷一百一十至一百一十三
