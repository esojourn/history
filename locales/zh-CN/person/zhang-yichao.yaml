name: 张议潮
aliases: [张义潮]
role: 归义军节度使
summary: 沙州人，848 年驱逐吐蕃守将，收复河西诸州归唐，唐朝设归义军，以他为节度使。
body: |-
  张议潮是沙州敦煌人，贞元十五年（公元 799 年）生，出身当地大族。他出生时沙州已经被吐蕃占领十多年，当地汉人在吐蕃统治下生活，但仍保留着汉地的语言和习俗。据敦煌文书，他早年抄写过佛经和诗文。

  会昌二年（842 年）前后，吐蕃赞普朗达玛被杀，吐蕃陷入内乱，各地将领互相攻战（另见“吐蕃王朝崩溃”条）。大中二年（848 年），张议潮在沙州联合当地豪族起事，驱逐了吐蕃守将，随后收复瓜州，派使者分几路前往长安报捷。大中五年（851 年），他派兄长张议潭带着沙、瓜、伊、西、甘、肃等十一州的地图和户籍入朝，唐宣宗在沙州设立归义军，任命他为节度使（另见“张议潮与归义军”条）。咸通二年（861 年），他又率军收复凉州。

  咸通八年（867 年），张议潭在长安去世，张议潮亲自入朝，此后留在长安，被授予右神武统军等官职，归义军由他的侄子张淮深主持。咸通十三年（872 年）他在长安去世，年七十四。敦煌莫高窟第 156 窟有一幅《张议潮统军出行图》，描绘了他率领军队出行的场面，是研究这段历史的重要图像资料。归义军此后由张氏、曹氏相继统治，一直延续到十一世纪。
sources: []
recalled:
  - 《新唐书·吐蕃传》
  - 《资治通鉴》卷二百四十九
  - 敦煌文书《张淮深碑》
  - 敦煌莫高窟第 156 窟题记
