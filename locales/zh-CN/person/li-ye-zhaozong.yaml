name: 唐昭宗
aliases: [李晔, 李杰, 寿王]
role: 皇帝
summary: 唐懿宗之子，想重振朝廷，却屡受藩镇和宦官挟制，最后被朱温迁到洛阳杀害。
body: |-
  李晔原名李杰，是唐懿宗的第七子，咸通八年（公元 867 年）生，封寿王。黄巢入长安时他随哥哥唐僖宗逃往成都。文德元年（888 年）僖宗病逝，宦官杨复恭拥立他即位。

  他即位时二十二岁，史书说他有英气，想恢复朝廷的威望。他扩充禁军，大顺元年（890 年）听从宰相张濬等人的主张，出兵讨伐李克用，大败而回，朝廷的实力更加削弱。此后凤翔的李茂贞、邠宁的王行瑜、华州的韩建等关中藩镇屡次带兵进逼长安，干预朝政，乾宁二年（895 年）甚至杀害宰相。乾宁三年（896 年）李茂贞再次进犯，他逃往华州投靠韩建，在那里住了近两年，韩建趁机杀了宗室诸王十余人。

  宫中的宦官也与他为敌。光化三年（900 年）十一月，神策军中尉刘季述等人把他废黜，幽禁在少阳院，立太子李裕为帝；次年正月，神策军将领孙德昭等人杀了刘季述，他才复位，改元天复。宰相崔胤勾结宣武节度使朱温，想借外力诛除宦官，宦官韩全诲等人抢先挟持他投奔凤翔的李茂贞。朱温围攻凤翔一年多，城中断粮，天复三年（903 年）正月李茂贞被迫交出他与朱温讲和。朱温护送他回到长安，随即把宦官几百人全部杀死，从此朝政落入朱温手中。

  天祐元年（904 年）正月，朱温逼他迁都洛阳，拆毁长安的宫殿、官署和民居，木料顺渭水、黄河漂往洛阳，长安从此残破。同年八月，朱温派蒋玄晖、朱友恭、氏叔琮等人夜入洛阳宫中，把他杀死，年三十八。随后朱温立他的儿子李柷为帝（另见“朱温篡唐”条）。
