name: 耶柔米
aliases:
  - 哲罗姆
  - 热罗尼莫
role: 圣经译者
summary: 拉丁教父，晚年住在伯利恒，从希伯来文和希腊文译成拉丁文圣经《武加大译本》。
body: |-
  耶柔米生于达尔马提亚与潘诺尼亚交界处的斯特里同，这个小城后来毁于战乱，位置已经无从确定。他的生年有两说：《历史的轨迹》第五章作约 340 年，另有古代记载推到 331 年；现代学者多取 347 年前后。父母是富裕的基督徒，送他到罗马，跟文法家多纳图读书，他在罗马受了洗。

  他到过高卢的特里尔，又在意大利北部的阿奎莱亚与一班朋友过苦修生活。约公元 373 年他去东方，在安提阿大病一场。此后他到安提阿以东的卡尔基斯旷野独居了两三年，跟一位归信的犹太人学希伯来文。他回到安提阿后被立为长老，380 年前后在君士坦丁堡听过拿先斯的贵格利讲解圣经。

  公元 382 年他到罗马，作了主教达马苏的秘书。当时通行的拉丁文圣经译本很多，文字彼此出入，达马苏请他校订。他先按希腊文校订了四福音。他在罗马指导一班贵族妇女读经、苦修，又写文章讥刺罗马神职人员的习气，得罪了不少人。384 年达马苏去世，第二年他离开罗马。

  公元 386 年他在伯利恒定居。跟随他来的罗马贵妇保拉出资建了一所男修道院、几所女修道院和一所接待朝圣者的客店。他在这里住了三十四年。约从 390 年起，他不再依据希腊文的七十士译本，而是直接从希伯来文翻译旧约，约在 405 年完成。《历史的轨迹》说，他可以说是当时西方教会唯一懂希伯来文的人。这个译本起初受到不少人反对，后来逐渐通行，中世纪称为“武加大”，意思是通行本。

  他还写了许多圣经注释，编了记载基督教作家的《名人传》，留下一百多封书信。他性情急躁，与旧友鲁菲努为俄利根的学说反目，又写文章驳斥伯拉纠。公元 410 年罗马城被攻破的消息传到伯利恒，他正在注释《以西结书》，在序言里写下了自己的震惊。他在 420 年 9 月 30 日去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 耶柔米《书信》第 22、45、108、127 封
  - 耶柔米《名人传》第 135 章
  - 耶柔米《以西结书注释》卷 1、卷 3 序言
