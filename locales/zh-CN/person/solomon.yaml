name: 所罗门
aliases:
  - 耶底底亚
role: 以色列王
summary: 大卫之子，继位为以色列王，在耶路撒冷建造圣殿，在位四十年。
body: |-
  所罗门是大卫和拔示巴的儿子，生在耶路撒冷；耶和华藉先知拿单给他起名叫耶底底亚（《撒母耳记下》12:24–25）。圣经没有记载他的生年，只说他在耶路撒冷作以色列众人的王四十年（《列王纪上》11:42）；本条所标的约公元前 970—前 930 年在位，是通行的约数。

  据《列王纪上》第 1—2 章，大卫年老的时候，所罗门的哥哥亚多尼雅自立为王。大卫听了拔示巴和拿单的话，吩咐祭司撒督和先知拿单在基训膏所罗门作王。大卫死后，所罗门先后处死亚多尼雅、约押和示每，革除了亚比亚他的祭司职分，王位就坚定了。第 3 章记载，他在基遍献祭，夜间梦中向耶和华求智慧，可以判断百姓；同一章里记有他审断两个妇人争一个孩子的事。4:32 说他作箴言三千句，诗歌一千零五首。

  所罗门与推罗王希兰立约，从黎巴嫩取得香柏木和松木。他作王第四年开始建造耶和华的殿，第十一年完工（6:1、6:37–38），又用十三年建造自己的宫室（7:1）。殿成之后，他把约柜运进至圣所，在会众面前祷告献殿（第 8 章）。他在以旬迦别造船队，与希兰的仆人一同出海往俄斐运回金子；示巴女王听见他的名声，也来用难解的话试问他（第 9—10 章）。

  第 11 章记载，所罗门宠爱许多外邦女子，有妃七百、嫔三百；他年老的时候，妃嫔诱惑他的心去随从别神，他为摩押的神基抹和亚扪的神摩洛建筑丘坛。耶和华向他发怒，说必将他的国夺回，但因大卫的缘故，不在他活着的日子行这事，并且仍留一个支派给他的儿子。他手下的以法莲人耶罗波安得了先知亚希雅的预言，所罗门想要杀他，他就逃往埃及。

  所罗门死后葬在大卫城，儿子罗波安接续作王，国随即分裂。传统上把《箴言》的大部分以及《传道书》《雅歌》归在他名下，《诗篇》第 72、127 篇的题注也提到他。就目前所知，还没有发现与他同时代、提到他名字的圣经以外的文字记录。
sources: []
recalled:
  - 《撒母耳记下》第 12 章
  - 《列王纪上》第 1—11 章
  - 《历代志下》第 1—9 章
