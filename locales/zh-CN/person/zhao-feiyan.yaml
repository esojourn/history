name: 赵飞燕
aliases: [孝成赵皇后]
role: 皇后
summary: 汉成帝的皇后，歌舞出身，与妹妹赵昭仪专宠十余年，哀帝死后被废自杀。
body: |-
  据《汉书·外戚传》，赵飞燕本是长安的官婢，后来在阳阿公主家学习歌舞，因体态轻盈而号称“飞燕”。她的本名和生年都没有记载。成帝微服出游时到阳阿公主家，见到她很是喜欢，召入宫中，随后又召入她的妹妹，姐妹二人都封为倢伃。

  鸿嘉三年（公元前 18 年），她告发许皇后等人用巫术诅咒后宫，许皇后被废。成帝想立她为后，太后王政君嫌她出身微贱，经人说情才同意。永始元年（前 16 年）她被立为皇后，妹妹升为昭仪。此后成帝更宠爱妹妹，姐妹二人都没有生育。

  绥和二年（前 7 年）成帝突然去世，朝野归咎于赵昭仪，昭仪自杀。哀帝即位后，因飞燕曾帮助他成为太子，尊她为皇太后。不久司隶校尉解光上奏，说赵昭仪当年曾迫使成帝杀死其他宫人所生的两个皇子；哀帝只罢免了赵家的外戚，没有追究飞燕。元寿二年（前 1 年）哀帝去世，王莽执政，把她贬为孝成皇后，一个多月后又废为平民，她当天自杀。后世流传的《飞燕外传》等书出于小说家之手，其中的情节不可作为史实。
sources: []
recalled:
  - 《汉书·外戚传下》
