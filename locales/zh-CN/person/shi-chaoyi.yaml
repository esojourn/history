name: 史朝义
aliases: []
role: 大燕皇帝
summary: 史思明长子，761 年杀父自立，次年洛阳失守，763 年自缢，安史之乱结束。
body: |-
  史朝义是史思明的长子，常年随父亲领兵作战。史思明偏爱少子史朝清，让他留守范阳，打算立为继承人。上元二年（公元 761 年）三月，史思明进攻陕州受挫，迁怒于史朝义，扬言要杀他；史朝义的部将骆悦等人劝他先下手，夜间拘捕史思明并把他缢杀。史朝义随即即位，又派人到范阳杀死史朝清，范阳因此发生内乱，叛军内部从此离心。

  宝应元年（762 年）冬，唐军在雍王李适的统率下，与回纥兵一起进攻洛阳，史朝义大败，向东北逃走，一路上部将纷纷降唐。广德元年（763 年）正月，他逃到范阳，守将李怀仙已经降唐，拒不接纳；他再向北逃，走投无路，在林中自缢而死，首级被送到长安。延续七年多的安史之乱至此结束（另见“安史之乱”条）。他的生年史书没有记载。
sources: []
recalled:
  - 《新唐书·逆臣传·史思明》
