name: 许慎
aliases: [许叔重]
role: 经学家、文字学家
summary: 东汉经学家，著《说文解字》，是中国第一部按部首编排、分析字形的字典。
body: |-
  据《后汉书·儒林列传》，许慎字叔重，汝南召陵人。他博通经籍，当时人称“五经无双许叔重”。曾任郡功曹，被举为孝廉，后来做过洨县的县长，最后死于家中。本传很简略，没有记载他的生卒年；现在常见的“约公元 58 年至约 147 年”只是后人的推测，各家说法不一。据《说文解字》所附的文字，他曾跟随古文经学家贾逵学习。

  《说文解字》正文十四篇，另有叙目一篇。全书收字九千三百五十三个，按字形分为五百四十部，每字先列小篆，再解释字义和字形结构，并用“六书”的理论说明造字方法。据书后的叙，此书始作于和帝永元十二年（100 年）；安帝建光元年（121 年），许慎在病中让儿子许冲把书献给朝廷。

  他还著有《五经异义》，比较今文、古文两派经学的不同说法，原书已经散佚。《说文解字》保存了大量小篆和古文字形，后世研究汉字、释读古文字都以它为基础。
sources: []
recalled:
  - 《后汉书·儒林列传》（许慎）
  - 《说文解字·叙》及许冲《上说文解字表》
