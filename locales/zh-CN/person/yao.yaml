name: 尧
aliases: [放勋, 陶唐氏, 唐尧, 帝尧]
role: 传说中的五帝之一
summary: 传说中的五帝之四，号陶唐氏，相传晚年把天子之位让给舜，即“禅让”。
body: |-
  尧是传说时代的人物，事迹主要见于《尚书·尧典》和《史记·五帝本纪》。据《史记》，他名放勋，是帝喾之子，兄长挚继位后“不善”，由他继立。后世称他为陶唐氏，晋代以后的古书多以平阳（今山西临汾）为尧都。

  《尚书·尧典》说，尧命羲氏、和氏观测日月星辰，“敬授民时”，定一年为三百六十六日，以闰月定四时，这是古书中关于历法起源的著名记载。尧的时候洪水为患，四岳推举鲧去治水，尧认为鲧不可用，四岳坚持，于是任用鲧，九年没有成功。

  据《尚书》和《史记》，尧在位七十年时访求继承人，不传给儿子丹朱，而是由四岳推举出身微贱、以孝闻名的舜。尧把两个女儿嫁给舜，观察他治家，又让他历试各种职事，三年后命舜摄行天子之政。《史记》说尧让位后二十八年去世，百姓如丧父母，三年之内四方不奏音乐。

  关于禅让，古书另有不同的说法。《竹书纪年》佚文说“舜囚尧于平阳”，《韩非子·说疑》也说“舜逼尧，禹逼舜”，认为并非和平让位。儒家则把尧舜禅让奉为理想的政治，孔子、孟子都推崇尧，“尧舜”成为后世称颂圣君的固定说法。

  《论语·泰伯》记孔子赞叹尧说：“大哉尧之为君也！巍巍乎，唯天为大，唯尧则之。”
sources: []
recalled:
  - 《尚书·尧典》
  - 《史记·五帝本纪》
  - 《竹书纪年》（佚文）
  - 《韩非子·说疑》
  - 《孟子·万章上》
