name: 拿单
aliases: []
role: 先知
summary: 大卫宫廷中的先知，传达建殿的应许，责备大卫，并助所罗门登基。
body: |-
  拿单是大卫作王时的先知。圣经没有记载他的家世、生年和卒年。

  据《撒母耳记下》第 7 章（另见《历代志上》第 17 章），大卫住进香柏木的宫中以后，对拿单说起约柜还在幔子里。拿单起初请王照心意而行；当夜耶和华的话临到拿单，他就转告大卫：为耶和华建殿的不是大卫，而是他的后裔，耶和华必坚定大卫的家和他的国。第 12 章记载，大卫取了乌利亚的妻子、又借刀杀了乌利亚以后，耶和华差遣拿单去见他。拿单讲了一个富户夺取穷人仅有的一只小母羊羔的故事，大卫听了十分恼怒，拿单就指明那人正是大卫，并宣告刀剑必不离开他的家，拔示巴所生的孩子也必要死。后来所罗门出生，耶和华藉着拿单给他起名叫耶底底亚（12:25）。

  《列王纪上》第 1 章记载，大卫年老，亚多尼雅自立为王。拿单让拔示巴去见大卫，自己随后进去证实她的话。大卫吩咐祭司撒督、先知拿单和耶何耶大的儿子比拿雅送所罗门骑王的骡子下到基训，在那里膏他作王。《历代志上》29:29 和《历代志下》9:29 提到“先知拿单的书”，说其中记有大卫和所罗门的事迹，这部书没有流传下来。
sources: []
recalled:
  - 《撒母耳记下》第 7 章、第 12 章
  - 《列王纪上》第 1 章
  - 《历代志上》第 17 章、第 29 章
  - 《历代志下》第 9 章
