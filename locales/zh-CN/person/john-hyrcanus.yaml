name: 约翰·许尔堪
aliases: [许尔堪一世]
role: 大祭司、统治者
summary: 西门之子，哈斯蒙尼王朝第二代统治者，征服以土买和撒玛利亚。
body: |-
  西门的儿子，生年没有记载。《马加比一书》13:53 记西门见他已经成人，立他为全军统帅，驻在基色；第 16 章记他和兄弟犹大击败安条克七世派来的将领。公元前 134 年初（一说前 135 年），西门在多克堡被女婿多利买杀害，约翰当时在基色，得到消息后抢先进入耶路撒冷，继任大祭司（16:19–22）。《马加比一书》到此结束，此后的事主要见于约瑟夫斯《犹太古史》卷 13 和《犹太战记》卷 1。

  据约瑟夫斯，他即位不久，塞琉古王安条克七世围攻耶路撒冷，约翰被迫议和，交出武器，缴纳贡款，后来还随安条克出征帕提亚。安条克七世在前 129 年战死，塞琉古王国内乱不止，约翰趁机扩张：攻取示剑，毁掉撒玛利亚人在基利心山上的圣所；征服以土买，要当地人受割礼、守犹太律法才可留居；晚年又由他的儿子们围攻撒玛利亚城，将其夷平。

  约瑟夫斯还记，他原先亲近法利赛人，后来因宴席上有人要他辞去大祭司之职而与之决裂，转向撒都该人。《犹太古史》卷 13 第 10 章说他执政三十一年。他在前 104 年去世，长子阿里斯托布鲁斯一世继位并称王。
sources: []
recalled:
  - 《马加比一书》13:53、第 16 章
  - 约瑟夫斯《犹太古史》卷 13 第 8—10 章
  - 约瑟夫斯《犹太战记》卷 1
