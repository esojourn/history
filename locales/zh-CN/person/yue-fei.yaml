name: 岳飞
aliases: [岳鹏举, 岳武穆, 鄂王]
role: 南宋抗金将领
summary: 南宋抗金名将，收复襄阳六郡，郾城、颍昌大败金军，后被宋高宗、秦桧以罪名冤杀。
body: |-
  岳飞字鹏举，相州汤阴（今属河南）人，生于崇宁二年（公元 1103 年），出身农家。宣和年间他几次应募从军。靖康之变前后，他在河北追随抗金的队伍，后来归于东京留守宗泽麾下，宗泽很器重他。宗泽死后，他随杜充南下，建炎四年（1130 年）金军北撤时，他在建康（今南京）一带截击，收复建康，从此成为一方将领。

  绍兴四年（1134 年）岳飞出兵击败伪齐，收复襄阳等六郡，是南宋第一次主动收复失地。次年他奉命镇压洞庭湖的杨幺，收编其部众，军力大增，驻屯鄂州（今武汉）。岳飞治军严格，据《宋史》，他的部队“冻死不拆屋，饿死不掳掠”，金人称“撼山易，撼岳家军难”。

  绍兴十年（1140 年）金朝撕毁和约，完颜宗弼南侵。岳飞出兵中原，部将先后收复颍昌、郑州、洛阳等地，他本人在郾城击败宗弼亲率的骑兵，岳云、王贵又在颍昌获胜，前锋进到离开封不远的朱仙镇（另见“郾城之战”条）。这时宋高宗和宰相秦桧决意议和，连下诏令班师，据记载一日之内接到十二道金字牌，岳飞只得撤军，所收复的地方随即又失去。

  绍兴十一年（1141 年）朝廷收回岳飞、韩世忠、张俊三大将的兵权，任岳飞为枢密副使。秦桧与张俊指使人诬告岳飞部将张宪谋反，又把岳飞牵连下狱。韩世忠质问秦桧有何证据，秦桧答“其事体莫须有”。这年十二月除夕之前，岳飞在大理寺狱中被害，换算成公历已是 1142 年初，岳云、张宪同时被杀。据《宋史·何铸传》，审讯时岳飞袒露背上的“尽忠报国”四字。

  宋孝宗即位后为岳飞平反，以礼改葬于西湖栖霞岭，后谥武穆，宋宁宗时追封鄂王。传为岳飞所作的《满江红·怒发冲冠》，自近代起有学者怀疑是明人伪托，至今仍有争论。
sources: []
recalled:
  - 《宋史·岳飞传》
  - 岳珂《金佗稡编》
  - 《建炎以来系年要录》
