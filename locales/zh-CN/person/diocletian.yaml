name: 戴克里先
aliases:
  - 戴克里仙
  - 丢克理田
role: 罗马皇帝
summary: 罗马皇帝，创立四帝共治，公元 303 年发动对基督徒最后也是最大的一次逼迫。
body: |-
  戴克里先约在公元 244 年生于达尔马提亚，据说就在萨罗纳附近，出身低微，有记载说他父亲是获释的奴隶。他从行伍中升上来，公元 284 年在尼哥米底亚附近被军队拥立为帝，第二年击败对手卡里努斯，结束了此前半个世纪皇帝频繁更替的局面。

  他认为帝国太大，一个人治理不过来。286 年他立马克西米安为共治皇帝，分管西方；293 年又各设一位副手，称“凯撒”，他自己的副手是加利流，马克西米安的是君士坦提乌斯，后人称这套办法为四帝共治。他把行省划小，把文职和军职分开，扩充军队，改革税制，301 年还颁布过限定物价的诏令。他常驻东方的尼哥米底亚。

  他在位的前十八年没有逼迫教会，宫中和军中都有基督徒。公元 303 年 2 月，他在尼哥米底亚下了第一道诏令：拆毁教堂，焚烧圣经，有身份的基督徒革去身份。随后又接连下令，逮捕神职人员，逼他们献祭；304 年的诏令要求所有人献祭。拉克坦提乌斯当时就在尼哥米底亚，他说这件事主要是加利流怂恿的。逼迫在东方最厉害，在君士坦提乌斯管的高卢和不列颠最轻。《历史的轨迹》第二章说，无论殉道人数还是刑罚的残酷，这一次都超过以前各次。逼迫中交出圣经的神职人员日后还能不能任职，在北非引出了多纳徒派的分裂。

  公元 305 年 5 月，他与马克西米安同日退位，这在罗马皇帝中没有先例。他回到家乡，住在斯帕拉图姆海边新建的宫殿里，就是今天斯普利特老城的所在。他亲眼看到自己安排的继承办法在内战中瓦解，约在 311 年底或 312 年去世，年份有几种说法。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
