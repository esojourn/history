name: 普鲁塔克
aliases: [普卢塔克, 卢基乌斯·梅斯特里乌斯·普鲁塔尔库斯, 蒲鲁塔克]
role: 传记作家、德尔斐祭司
summary: 希腊传记作家，著《希腊罗马名人传》和《道德论集》。
body: |-
  普鲁塔克约在公元 46 年生于希腊中部的喀罗尼亚，家境富裕。66 至 67 年尼禄巡游希腊时，他正在雅典跟柏拉图派的阿莫尼乌斯学哲学。他到过亚历山大城，至少两次去罗马讲学，结交了一批罗马显贵，其中一位帮他取得罗马公民权，另一位就是《名人传》题献的对象索西乌斯·塞涅基奥。他自己说拉丁文是年纪大了才学的。

  他大半生住在家乡。他说喀罗尼亚是个小城，他留在那里，免得它变得更小。他在城里担任过各种公职，生命的最后二三十年又是德尔斐阿波罗神庙的两位祭司之一。后世辞书说图拉真授过他执政官的荣衔，又有记载说哈德良让他主管希腊事务，这两件事都不能证实。卒年在 120 年前后。

  《希腊罗马名人传》把一位希腊人和一位罗马人配成一对，如亚历山大与恺撒、德摩斯梯尼与西塞罗，多数在末尾加一段比较；现存二十二对和四篇单传，共五十篇。他在《亚历山大传》开头说，他写的是传记而不是历史，一句话、一个玩笑往往比死伤千万的战役更能显出人的性情。他离所写的人物常有几百年，材料取自前人的书，其中许多今天已经失传；也因为他重在品评人物，取舍并不严格。其余七十多篇谈伦理、宗教、教育和杂学的文章，后人合编为《道德论集》。

  十六世纪《名人传》被译成法文和英文，莎士比亚的《裘力斯·凯撒》《安东尼与克莉奥佩特拉》《科利奥兰纳斯》都取材于它。本站希腊、罗马人物的条目，大量出处也是这部书。
sources: []
recalled:
  - 普鲁塔克《亚历山大传》第 1 章
  - 普鲁塔克《德摩斯梯尼传》第 1—2 章
  - 普鲁塔克《道德论集》中的《会饮问题》《论德尔斐的 E》
  - 《苏达辞书》“普鲁塔克”条
