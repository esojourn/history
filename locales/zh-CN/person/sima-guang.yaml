name: 司马光
aliases: [司马温公, 涑水先生, 司马文正]
role: 北宋宰相、史学家
summary: 北宋史学家、宰相，主持编写《资治通鉴》，反对王安石变法。
body: |-
  司马光是陕州夏县涑水乡人，天禧三年（公元 1019 年）生于光州光山县，他父亲司马池当时任光山县令。据《宋史》本传，他七岁时和小伙伴在院中玩耍，有个孩子爬上大瓮，失足掉进水里，众人都吓跑了，司马光拿起石头砸破瓮，救出了这个孩子。宝元元年（1038 年）他考中进士。仁宗晚年无子，他与范镇等人多次上书请立皇嗣。

  治平三年（1066 年）宋英宗命他设局编修历代君臣事迹，宋神宗即位后为这部书赐名《资治通鉴》并作序。熙宁年间王安石变法，司马光是反对派的代表人物，他认为祖宗之法不可轻改，新法与民争利。他多次写信与王安石辩论，神宗想任命他为枢密副使，他坚辞不受。熙宁四年（1071 年）他退居洛阳，此后十五年专心编书，与刘攽、刘恕、范祖禹等人分工合作。

  元丰七年（1084 年）《资治通鉴》编成进呈。全书二百九十四卷，记事从战国初年三家分晋（前 403 年）起，到五代后周显德六年（959 年）止，是中国最重要的编年体通史（另见“《资治通鉴》成书”条）。

  元丰八年（1085 年）神宗去世，高太后听政，召司马光回朝。次年他出任尚书左仆射，在几个月内废除了青苗、免役、保甲等新法，并把熙宁以来新占的西夏边地中的几处还给西夏，史称“元祐更化”（另见该条）。苏轼认为免役法有可取之处，与他发生争执，没能说服他。这时他已患病，元祐元年（1086 年）九月在宰相任上去世，谥“文正”。绍圣年间新党得势，他的谥号和赠官被追夺，名字被列入元祐党籍碑。
sources: []
recalled:
  - 《宋史·司马光传》
  - 苏轼《司马温公行状》
  - 《资治通鉴》卷首《进书表》与神宗御制序
  - 《续资治通鉴长编》卷二百十至三百八十七
