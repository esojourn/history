name: 以利沙
aliases: []
role: 先知
summary: 以利亚的继承者，北国以色列的先知，从约兰年间活动到约阿施年间。
body: |-
  沙法的儿子，亚伯米何拉人（《列王纪上》19:16）。以利亚从何烈山回来，遇见他正赶着十二对牛耕地，就把自己的外衣搭在他身上；以利沙宰牛、与父母告别，然后跟随并服事以利亚（19:19–21）。圣经没有记载他的生年。

  以利亚被接升天之前，以利沙求他让感动他的灵加倍地感动自己。以利亚升天后，他拾起落下的外衣击打约旦河水，水左右分开；耶利哥的先知门徒看见，就说感动以利亚的灵感动以利沙了（《列王纪下》第 2 章）。此后他在北国活动，从以色列王约兰年间直到约阿施年间。

  《列王纪下》第 2—8 章记载了他的许多事迹：治好耶利哥的水；以色列、犹大、以东三王攻打摩押途中缺水，他为他们求问耶和华；使一个先知门徒的寡妇的油倒满借来的器皿，卖油还债；书念妇人的儿子死后，他使孩子活过来；用二十个大麦饼让一百人吃饱（4:42–44）；吩咐亚兰王的元帅乃缦在约旦河里沐浴七次，乃缦的大麻风得了洁净；亚兰军到多坍捉拿他，他把敌军领进撒玛利亚，又让以色列王放他们回去；撒玛利亚被围闹饥荒时，他预言次日粮价大跌。他还到过大马士革，对哈薛说他必作亚兰王（8:7–15），又差一个先知门徒到基列的拉末去膏耶户作以色列王（9:1–10）。

  以利沙得了必死的病，以色列王约阿施下来看他。他叫王向东开窗射箭，又叫王用箭打地；王打了三次便止住，他说王只能打败亚兰三次（13:14–19）。他死后，人把他葬了。13:20–21 记载，后来有人把死人抛在他的坟墓里，死人一碰着他的骸骨就复活站起来。他去世的年份和葬地，圣经没有记载。
sources: []
recalled:
  - 《列王纪上》19:16–21
  - 《列王纪下》第 2—9 章
  - 《列王纪下》13:14–21
