name: 玛拉基
aliases: []
role: 先知
summary: 旧约最后一卷先知书所题的先知，责备归回后的祭司与百姓。
body: |-
  《玛拉基书》1:1 只写耶和华借玛拉基传给以色列的默示，没有提他的家世、籍贯和年代。“玛拉基”在希伯来文里意为“我的使者”，所以也有人认为这不是人名而是称号；七十士译本在这里译作“他的使者”。圣经所载仅此，生卒年不详。

  书中提到省长（1:8），圣殿里已有献祭，所责备的事如祭司轻慢祭物、百姓娶外邦女子、不纳十分之一，与《尼希米记》第 13 章的情形相近，所以一般把这卷书定在公元前五世纪中叶前后、尼希米的时代。

  全书四章，多用问答的方式展开：责备祭司把瞎眼、瘸腿、有病的牲畜献上（1:6–14）；责备人以诡诈待幼年所娶的妻（2:13–16）；说百姓在十分之一和供物上夺取了神的物（3:8–10）。3:1 说耶和华要差遣使者在他前面预备道路，4:5 说在耶和华大而可畏之日来到以前要差先知以利亚来；福音书把这些话与施洗约翰联系起来（如《马太福音》11:10、11:14）。在基督教的旧约正典里，这是最后一卷书。
sources: []
recalled:
  - 《玛拉基书》第 1—4 章
  - 《尼希米记》第 13 章
  - 《马太福音》11:10、11:14
