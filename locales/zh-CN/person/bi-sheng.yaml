name: 毕昇
aliases: []
role: 北宋平民工匠，活字印刷术发明者
summary: 北宋平民，庆历年间发明泥活字印刷术，事迹见于沈括《梦溪笔谈》。
body: |-
  毕昇是北宋的一位平民，生平只见于沈括《梦溪笔谈》卷十八的一条记载，史料所载仅此。据沈括记述，雕版印书在唐代还没有大规模流行，五代时冯道才开始用雕版印行五经，此后典籍都用雕版印刷。宋仁宗庆历年间（1041—1048 年），有一位布衣毕昇发明了活版印刷。

  沈括详细记录了他的方法：用胶泥刻字，每字一个印，字薄如钱唇，用火烧硬；先在铁板上铺一层松脂、蜡和纸灰混合的药剂，四周围上铁框，把字印排满铁框作为一版，然后在火上加热，等药剂稍稍熔化，用平板把字面压平，冷却后即可印刷。准备两块铁板交替使用，一块在印刷时，另一块排字，可以连续不断。常用的字如“之”“也”等，每字备二十多个印，以备一版中重复出现；遇到没有准备的冷僻字，就临时刻制烧成。印完后再用火烘烤，药剂熔化后用手一拂，字印就自行脱落，不会沾污。沈括还说，毕昇试过用木头刻字，因为木头纹理疏密不一、沾水后高低不平，又会与药剂粘在一起，所以不用。

  沈括说，毕昇死后，他的字印被沈括的子侄辈收藏。毕昇的籍贯和生卒年都没有记载。1990 年湖北英山县发现一块刻有“毕昇”字样的墓碑，有人认为就是这位发明家的墓，也有学者认为证据不足，至今仍有争论。毕昇发明的泥活字比欧洲古登堡的金属活字早约四百年。
sources: []
recalled:
  - 沈括《梦溪笔谈》卷十八《技艺》
