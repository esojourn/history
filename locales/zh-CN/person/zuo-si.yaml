name: 左思
aliases: [左太冲]
role: 文学家
summary: 西晋文学家，出身寒微，以《三都赋》使“洛阳纸贵”，另有《咏史》诗八首。
body: |-
  左思字太冲，齐国临淄人，生卒年史书没有记载。《晋书·文苑传》说他相貌丑陋，不善言谈，而文辞壮丽。他家世代习儒，门第不高。他的妹妹左棻因有文才被晋武帝选入宫中，全家随之迁到洛阳。

  他用了十年时间构思《三都赋》，分写蜀都、吴都、魏都，家中门旁、庭院乃至厕所都放着纸笔，想到一句就记下来。赋成之初没有人重视。据本传，他请当时享有盛名的皇甫谧作序，张载、刘逵等人为之作注，张华也加以称赞，于是富贵人家争相传抄，洛阳的纸价因此上涨，这就是“洛阳纸贵”的出处。

  他曾列名贾谧的“二十四友”。贾谧被杀后，他退居专心读书，齐王冏召他任职，他称病不去。河间王的部将张方在洛阳纵兵劫掠时，他举家迁往冀州，几年后病逝。他的《咏史》诗八首抒写寒门士人不得进用的不平，“世胄蹑高位，英俊沉下僚”即出于其中。
sources: []
recalled:
  - 《晋书·文苑传·左思》
  - 《文选》
