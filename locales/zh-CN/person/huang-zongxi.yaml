name: 黄宗羲
aliases: [太冲, 梨洲, 南雷]
role: 思想家、史学家
summary: 曾起兵抗清，入清不仕，著《明夷待访录》批判君主专制。
body: |-
  黄宗羲是浙江余姚人，父亲黄尊素是东林党人，天启年间被魏忠贤害死。崇祯元年（1628 年）黄宗羲十九岁，进京为父鸣冤，在刑部会审时用锥子刺伤阉党许显纯，又与人一起殴打狱卒，一时名震京城。此后他师从刘宗周，参加复社的活动。

  清军南下后，黄宗羲在家乡招募义兵，组成“世忠营”，响应鲁王监国政权抗清，后来在四明山结寨，又随鲁王到舟山，曾以使者的身份前往日本求援（这次出使是否成行，学者有不同看法）。抗清失败后，他回乡隐居，著书讲学，清廷多次征召他参加博学鸿儒科和修撰《明史》，他都没有接受，只让儿子和学生万斯同参与了《明史》的修撰。

  黄宗羲的代表作《明夷待访录》写成于康熙二年（1663 年）前后。书中批判君主专制，认为“为天下之大害者，君而已矣”，主张“天下为主，君为客”；提出设立宰相、使学校成为议论政事的场所，主张“工商皆本”。这部书在清代长期不能公开流传，到清末被梁启超等人大量翻印，对维新派和革命派都有很大影响。

  他又著有《明儒学案》，系统整理了明代各家学派的学说，是中国第一部完整的学术史著作，晚年还开始编写《宋元学案》，由后人续成。他重视史学，开创了“浙东史学”。康熙三十四年（1695 年）他在家乡去世，年八十六岁。他与顾炎武、王夫之并称“清初三大儒”。
sources: []
recalled:
  - 黄宗羲《明夷待访录》
  - 全祖望《梨洲先生神道碑文》
  - 《清史稿·儒林传》
