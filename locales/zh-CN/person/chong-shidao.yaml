name: 种师道
aliases: [种彝叔, 老种经略相公]
role: 北宋末年将领
summary: 北宋末年西北名将，曾随张载求学，靖康元年率兵援救开封，同年病逝。
body: |-
  种师道是洛阳人，“种”在这里读作 chóng，生于皇祐三年（公元 1051 年）。他出身将门，祖父种世衡是宋仁宗时防御西夏的名将，家族中多人在西北为将，人称“种家将”。他年轻时曾跟随张载学习，后来以荫补入仕，长期在西北领兵，屡次击败西夏军。

  宣和四年（1122 年）宋朝联金攻辽，他被任命为都统制，随童贯进攻燕京，他反对这次出兵，在白沟被辽军击败，被迫退休。靖康元年（1126 年）正月金军包围开封，他以年迈之身率西北兵马入援，被任命为同知枢密院事。他主张坚守待援，等金军北撤渡河时半渡而击，没有被采纳。金军撤走后，他又建议加强黄河防线，防备金军再来，也未被采纳。这年十月他病逝，不久开封就被金军攻破。
sources: []
recalled:
  - 《宋史·种师道传》
  - 《三朝北盟会编》
