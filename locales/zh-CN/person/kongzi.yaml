name: 孔子
aliases: [孔丘, 仲尼, 至圣先师]
role: 思想家、教育家，儒家创始人
summary: 春秋末年鲁国人，儒家创始人，私人讲学、周游列国，言行见于《论语》。
body: |-
  孔子名丘，字仲尼，鲁国陬邑（今山东曲阜东南）人。据《史记·孔子世家》，他生于鲁襄公二十二年（公元前 551 年），《公羊传》《穀梁传》则作前一年。父亲叔梁纥是鲁国的武士，在他幼年时去世，母亲颜氏带着他生活。孔子自称“吾少也贱，故多能鄙事”，年轻时做过管理仓库的委吏和管理牲畜的乘田。

  孔子“十有五而志于学”，学无常师，《史记》说他曾到周向老子问礼。他很早就开始授徒讲学，主张“有教无类”，不论出身都收为弟子，打破了贵族对教育的垄断。据《史记》，他的弟子有三千人，精通六艺的有七十二人。

  鲁定公时，孔子先后任中都宰、司空、大司寇。公元前 500 年齐鲁两国国君在夹谷相会，孔子相礼，使齐国归还了侵占的鲁地。他主张削弱把持鲁国政权的季孙、叔孙、孟孙三家，推动拆除三家的城邑（“堕三都”），没有完全成功。公元前 497 年，孔子离开鲁国，带着弟子先后到卫、曹、宋、郑、陈、蔡等国，寻求施展抱负的机会，但都没有被重用，途中曾在匡地被围，在陈、蔡之间断粮。

  公元前 484 年，孔子回到鲁国，此后专心教学和整理文献。传统说法认为他删订《诗》《书》，修订礼乐，晚年喜读《易》，并根据鲁国史书修成《春秋》，这些说法的具体程度学界有不同看法。他死于公元前 479 年，葬于鲁城北泗水之上。

  孔子的核心思想是“仁”与“礼”，主张以德治国、正名、孝悌忠恕。他的言行由弟子及再传弟子编成《论语》。汉武帝以后儒学成为官方学说，孔子被尊为“至圣先师”，对中国和东亚文化的影响极其深远。
sources: []
recalled:
  - 《史记·孔子世家》
  - 《论语》
  - 《左传》定公十年
  - 《公羊传》襄公二十一年
