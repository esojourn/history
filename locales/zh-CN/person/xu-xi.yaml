name: 徐熙
aliases: []
role: 南唐花鸟画家
summary: 南唐布衣画家，以水墨为主的“野逸”花鸟画闻名，与西蜀黄筌并称“黄徐”。
body: |-
  徐熙是南唐人，据宋人记载是钟陵人，一说是金陵人，出身江南名族，终身没有做官，史书称他为“江南处士”。他的生卒年不详，一般认为他死在南唐灭亡（公元 975 年）之前。

  徐熙擅长画花竹、禽鱼、蔬果、草虫，喜欢到园圃中观察写生。据北宋郭若虚《图画见闻志》，他作画先用墨笔勾勒枝叶花蕊，再略施淡彩，称为“落墨”，风格清淡洒脱。郭若虚把他与西蜀的黄筌相比，说“黄家富贵，徐熙野逸”，认为两人代表了五代花鸟画的两种风格：黄筌一派工整富丽，是宫廷的趣味；徐熙一派潦草自然，是文人隐士的趣味。他的孙子徐崇嗣后来创造了不用墨线勾勒、直接用色彩点染的“没骨”画法。

  据宋人记载，南唐后主十分喜爱他的画，宫中挂有不少他的作品。传为徐熙的作品有《雪竹图》（上海博物馆藏）等，作者归属尚有争议。
sources: []
recalled:
  - 郭若虚《图画见闻志》卷一、卷四
  - 《宣和画谱》卷十七
  - 沈括《梦溪笔谈》卷十七
