name: "凯瑟琳·冯·博拉"
aliases: ["卡塔琳娜·冯·博拉", "凯蒂", "路德夫人"]
role: "路德的妻子"
summary: "原为西多会修女，1523 年逃出修道院，1525 年与路德结婚，操持路德一家。"
body: |-
  凯瑟琳 1499 年 1 月生于萨克森的没落贵族家庭，出生地通常说是利彭多夫。她幼年丧母，被送进修道院寄读，后来进了格里马附近宁布申的西多会修道院，1515 年发愿做修女。

  路德的著作传进修道院，一些修女想离开。1523 年复活节前夜，托尔高的一位商人受路德之托，用运货的马车把十二名修女带了出来，其中九人到了维滕贝格。相传她们是藏在装鲱鱼的桶里出来的，这个说法出自后来的记述。路德为她们一一找归宿，凯瑟琳的婚事两次没有成。

  《历史的轨迹》第二十三章说，1525 年 6 月 13 日路德与她结婚，她原是修女，路德原是修士；此后许多司铎、修士、修女照样成家，这是脱离罗马教会的又一步。当时路德四十一岁，她二十六岁。梅兰希顿嫌时机不好，那时农民战争刚被镇压下去。

  选侯把原来的奥古斯丁会修道院给了路德夫妇居住。她管理这所大房子，种菜、养牲口、酿啤酒，接待寄宿的学生和不断的来客，使路德不必为生计操心。路德在信里叫她“我的主人凯蒂”。两人生了六个孩子，有两个女儿早死。1546 年路德去世，随后的战争使她两度逃难，产业受损。1552 年维滕贝格发生鼠疫，她去托尔高途中翻车受伤，12 月死在那里。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十三章“德国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter26.html"
recalled:
  - "路德致妻子的书信"
  - "路德《桌边谈话》"
  - "路德 1542 年遗嘱"
