name: 卫满
aliases: [满]
role: 卫满朝鲜开国君主
summary: 燕人，汉初东渡浿水，取代朝鲜王准自立，都王险。
body: |-
  卫满是燕地人，生卒年不详。《史记·朝鲜列传》和《汉书》都只称他为“满”，“卫”姓见于《三国志·魏书·东夷传》及裴松之注所引《魏略》。公元前 195 年，燕王卢绾反汉后逃入匈奴，满也流亡，聚集党徒千余人，梳椎髻、穿蛮夷服装，向东出塞，渡过浿水，住在秦时的空地上下鄣。

  据《魏略》，他先投奔朝鲜王准，请求住在西部边界，准拜他为博士，封给方圆百里之地，让他守卫西边。满招集流亡者，部众渐多，于是谎称汉兵分十路来攻，请求入卫，转而攻打准，准战败出走。《史记》则只说他逐渐役使真番、朝鲜的蛮夷和燕、齐流亡者，自立为王，定都王险。这一年史无明文，通常系于前 194 年。

  惠帝、吕后时，辽东太守与满约定：满为汉朝外臣，约束塞外蛮夷不得侵扰边境，蛮夷君长想入见天子的不得阻拦。满因此得到兵威和财物，降服周围的小邑，真番、临屯都来归属，《史记》称其地“方数千里”。王位后来传给儿子，再传到孙子右渠；元封三年（前 108 年），右渠之国为汉所灭。
sources:
  - 《史记·朝鲜列传》 https://zh.wikisource.org/wiki/史記/卷115
  - 《汉书·西南夷两粤朝鲜传》 https://zh.wikisource.org/wiki/漢書/卷095
  - 《三国志·魏书·东夷传》及裴松之注引《魏略》 https://zh.wikisource.org/wiki/三國志/卷30
