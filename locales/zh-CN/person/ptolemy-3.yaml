name: 托勒密三世
aliases: [ 托勒密三世·欧厄尔革忒斯, 施惠者 ]
role: 埃及国王
summary: 托勒密王朝第三位国王，第三次叙利亚战争中攻入两河流域，在位时王朝国势最盛。
body: |-
  托勒密三世是托勒密二世与阿尔西诺伊一世的长子，约生于公元前 280 年。母亲获罪被流放后，他一度失去继承资格，到前 3 世纪 50 年代末才重新被定为继承人。前 246 年 1 月即位，随后与昔兰尼的贝勒尼基二世成婚，昔兰尼加由此重归托勒密王朝。

  同年安条克二世去世，他的两位王后各拥其子争位。托勒密三世出兵支持自己的姐妹贝勒尼基，是为第三次叙利亚战争（前 246—前 241 年）。他抵达安条克时贝勒尼基母子已经遇害，仍继续进军，攻入两河流域并占领巴比伦；后因埃及国内发生叛乱而回师，塞琉古一方不久收复了两河。前 241 年议和，埃及保有小亚细亚沿岸和叙利亚北部的若干地方，包括安条克的外港塞琉西亚·皮埃里亚。

  前 238 年埃及祭司在卡诺普斯集会，为他颁布诏令，用圣书体、世俗体和希腊文三种文字刻石，其中规定每四年增加一个闰日。前 237 年他下令兴建埃德夫的荷鲁斯神庙，又在亚历山大的塞拉皮斯神庙增设一座图书馆；学者埃拉托色尼在他的宫廷中任职。在希腊，他先后资助亚该亚同盟和斯巴达王克莱奥梅涅斯三世对抗马其顿。前 222 年底他病逝，子托勒密四世继位。
sources:
  - 英文维基百科“Ptolemy III Euergetes”条 https://en.wikipedia.org/wiki/Ptolemy_III_Euergetes
recalled:
  - 卡诺普斯诏令（前 238 年，三种文字的祭司诏令）
  - 古罗布纸草（托勒密三世自述第三次叙利亚战争初期经过）
  - 查士丁《腓力史摘要》第 27 卷第 1 章
