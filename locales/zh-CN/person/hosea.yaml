name: 何西阿
aliases: []
role: 先知
summary: 北国以色列末期的先知，以自己的婚姻比喻耶和华与以色列。
body: |-
  备利的儿子。《何西阿书》1:1 说，耶和华的话临到他，是在犹大王乌西雅、约坦、亚哈斯、希西家在位，以色列王约阿施的儿子耶罗波安在位的时候。书中多称北国为以法莲，所论以北国为主；他的籍贯、生卒年和活动的具体地点，书中都没有记载。

  第 1—3 章记载，耶和华吩咐他去娶淫妇为妻，他就娶了滴拉音的女儿歌篾。所生的三个孩子依次起名耶斯列、罗路哈玛（意思是不蒙怜悯）、罗阿米（意思是非我民），各指向以色列将要遭遇的事。后来他又奉命去爱一个淫妇，用银子十五舍客勒、大麦一贺梅珥半把她买回来（3:1–2）。书中以此比喻以色列离弃耶和华去随从巴力，而耶和华仍要把她领回。

  第 4—14 章是对以色列的责备和劝告：国中没有诚实、良善和对神的认识，君王和祭司都有过犯，以法莲时而求告埃及、时而投奔亚述。书中预言撒玛利亚必担当自己的罪，末了呼吁以色列归向耶和华（第 14 章）。书中没有记述撒玛利亚陷落的经过，也没有记载何西阿的结局。
sources: []
recalled:
  - 《何西阿书》第 1—14 章
