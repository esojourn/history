name: 耶弗他
aliases: []
role: 士师
summary: 基列人，被长老请回作首领，击败亚扪人，因所许的愿失去独生女儿。
body: |-
  耶弗他是基列人，《士师记》11:1 称他是大能的勇士，又说他是妓女的儿子，父亲名叫基列。他父亲正妻所生的儿子长大以后把他赶出去，不许他承受产业，他就逃到陀伯地居住。圣经没有记载他的生年和卒年。

  据《士师记》第 11 章，亚扪人攻打以色列，基列的长老到陀伯地请耶弗他回来作元帅。耶弗他先打发使者与亚扪王交涉，亚扪王不听，他就出兵。出战之前他向耶和华许愿：若能得胜平安回来，无论什么先从他家门出来迎接他，就必归耶和华，献为燔祭。他大败亚扪人，攻取了二十座城。回到米斯巴的家，出来迎接他的是拿着鼓跳舞的独生女儿。女儿求得两个月的时间，与同伴在山上为自己终为处女哀哭；期满回来，耶弗他就照所许的愿向她行了（11:39）。他是否真的把女儿献为燔祭，还是使她终身不嫁，历来有不同的解释。

  第 12 章记载，以法莲人责问耶弗他为什么不招他们同去，双方交战。基列人把守约旦河的渡口，凭“示播列”一词的发音辨认以法莲人；据 12:6，那时以法莲人被杀的有四万二千。耶弗他作以色列的士师六年，死后葬在基列的一座城里。
sources: []
recalled:
  - 《士师记》第 11—12 章
  - 《希伯来书》第 11 章
