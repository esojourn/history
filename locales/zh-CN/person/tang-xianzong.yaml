name: 唐宪宗
aliases: [李纯]
role: 皇帝
summary: 唐顺宗长子，任用裴度等人用兵平定淮西等藩镇，史称“元和中兴”，后被宦官所杀。
body: |-
  李纯是唐顺宗的长子，大历十三年（公元 778 年）生于长安。永贞元年（805 年）三月，在宦官和部分朝臣的推动下，他被立为太子，八月接受顺宗让位，次年改元元和。王叔文、王伾等人随即被贬（另见“永贞革新”条）。

  他即位后决心改变藩镇割据的局面。元和元年（806 年）派高崇文讨平西川的刘辟，次年平定镇海节度使李锜的叛乱。此后成德、淮西等地与朝廷时战时和，朝中对是否用兵争论不休。元和十年（815 年），主战的宰相武元衡在长安街头被藩镇派来的刺客杀死，御史中丞裴度也被刺伤。他没有退让，任裴度为相，坚持讨伐淮西。元和十二年（817 年）裴度亲赴前线督战，李愬雪夜袭破蔡州，擒获吴元济（另见“平淮西”条）。此后成德的王承宗、幽州的刘总相继归顺，元和十四年（819 年）淄青的李师道被部将所杀，各地藩镇一时都奉朝廷号令，史称“元和中兴”（另见该条）。他还任用李吉甫、李绛等人，命李吉甫编成《元和国计簿》，清点了朝廷能控制的户口和赋税。

  晚年他宠信宦官吐突承璀，又好神仙，服食方士柳泌炼的丹药，性情变得暴躁，左右宦官常因小过被处死。元和十四年（819 年）他派人到凤翔法门寺迎佛骨入宫，刑部侍郎韩愈上表谏阻，被贬为潮州刺史（另见“韩愈谏迎佛骨”条）。元和十五年（820 年）正月，他在长安突然去世，年四十三。据《旧唐书》，当时人都说是宦官陈弘志等人弑逆，但宦官对外只说是服丹药中毒，此事没有追究。太子李恒即位，是为唐穆宗。
sources: []
recalled:
  - 《旧唐书·宪宗纪》
  - 《新唐书·宪宗纪》
  - 《资治通鉴》卷二百三十六至二百四十一
