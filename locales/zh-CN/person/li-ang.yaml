name: 唐文宗
aliases: [李昂, 李涵]
role: 皇帝
summary: 唐穆宗之子，宦官拥立，谋除宦官，甘露之变失败后受制于仇士良，抑郁而终。
body: |-
  李昂原名李涵，是唐穆宗的次子，元和四年（公元 809 年）生。宝历二年（826 年）十二月，他的哥哥唐敬宗被宦官刘克明等人杀害，宦官王守澄、梁守谦等人又杀了刘克明，拥立他即位，次年改元大和。

  他生活节俭，勤于听政，喜爱读书，想改变宦官专权的局面。大和五年（831 年），他与宰相宋申锡密谋诛除宦官，事情泄露，宋申锡反被诬陷谋反，贬死远方。后来他起用李训、郑注，先利用宦官之间的矛盾，罢黜并毒死了王守澄。大和九年（835 年）十一月，李训以大明宫左金吾仗院石榴树上夜降甘露为名，想把宦官引去观看时伏兵诛杀，被神策军中尉仇士良察觉，宦官挟持他退回内宫，随即派神策军大杀朝官，宰相王涯等人被族诛，李训、郑注也被杀，史称“甘露之变”（另见该条）。

  此后朝政完全由仇士良等宦官把持。朝中的牛僧孺、李德裕两派又互相倾轧，他曾感叹去掉河北的藩镇容易，去掉朝中的朋党困难（另见“牛李党争”条）。据《资治通鉴》，他晚年曾问身边的学士，自己比周赧王、汉献帝如何，又说那两位受制于强大的诸侯，自己却受制于家奴，说罢落泪。开成五年（840 年）正月他病逝于长安，年三十二。仇士良等人废掉他所立的太子，拥立他的弟弟李炎，是为唐武宗。
sources: []
recalled:
  - 《旧唐书·文宗纪》
  - 《新唐书·文宗纪》
  - 《资治通鉴》卷二百四十三至二百四十六
