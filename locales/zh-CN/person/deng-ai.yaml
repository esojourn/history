name: 邓艾
aliases: [邓士载]
role: 征西将军、太尉
summary: 曹魏将领，率军从阴平小道越过山地直取成都，灭蜀汉，随后被诬谋反遇害。
body: |-
  据《三国志·魏书·邓艾传》，邓艾字士载，义阳棘阳人。他幼年丧父，曹操取荆州后被迁到汝南一带，替屯田的农户放牛。他有口吃的毛病，起初只做看守稻草的小吏。后来他因公事到雒阳见到司马懿，受到赏识，被调入太尉府任职。正始年间他奉命考察淮河南北，建议开凿河渠、大兴屯田以积蓄军粮，被朝廷采纳。

  嘉平元年（公元 249 年）起，邓艾在西线与蜀将姜维多次交战。甘露元年（256 年）他在段谷大败姜维，此后升任征西将军，主持陇右防务。

  景元四年（263 年）魏军分路伐蜀，邓艾负责牵制姜维。姜维摆脱追击，退守剑阁，挡住了钟会的主力。邓艾于是从阴平出发，在没有人烟的山地走了七百多里，一路凿山开道、架设桥阁。本传说山高谷深之处，他用毡子裹住身体滚下山坡，将士们攀着树木崖壁鱼贯而进。魏军出现在江由，守将投降；随后在绵竹击败并斩杀诸葛亮之子诸葛瞻，进逼成都，刘禅出降。

  邓艾进入成都后，以皇帝的名义自行任命官员，又上书主张暂不把刘禅送往京师，并提出下一步进攻吴国的计划。钟会等人乘机告他谋反。景元五年（264 年）正月，朝廷下令用囚车把他押回。不久钟会在成都叛乱被杀，邓艾的部下追上去想把他接回来，监军卫瓘怕他报复，派人在绵竹以西把他和儿子邓忠杀死。直到晋武帝泰始年间，朝廷才为他平反。
sources: []
recalled:
  - 《三国志·魏书·王毌丘诸葛邓钟传》
