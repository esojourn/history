name: 耶律倍
aliases: [耶律突欲, 东丹王, 人皇王, 李赞华]
role: 契丹皇太子、东丹国王
summary: 阿保机长子，精通汉文化，失去帝位后渡海投奔后唐，937 年在洛阳被杀。
body: |-
  耶律倍是耶律阿保机的长子，小字突欲。神册元年（公元 916 年）阿保机称帝，立他为皇太子。据《辽史》，他喜好汉文化，读书万卷，通晓阴阳、音律和医药，还擅长绘画。天显元年（926 年）契丹灭渤海，改为东丹国，阿保机封他为人皇王，统治东丹。

  同年阿保机去世，母亲述律平主持立次子耶律德光为帝，耶律倍被迫让位，此后受到弟弟的监视和猜忌。天显五年（930 年），他从海路逃往后唐，据《辽史》，临行前他在海边立木刻诗，以“小山压大山，大山全无力”起头，表达自己的处境。后唐明宗厚待他，赐他姓名李赞华。

  清泰三年闰十一月（已是公历 937 年初），石敬瑭与契丹军逼近洛阳，后唐末帝李从珂在自焚前派人杀了他。他的儿子耶律阮后来成为辽世宗。传世的《射骑图》等画旧题为他所作，作者归属学界尚有不同意见。
sources: []
recalled:
  - 《辽史·宗室传·义宗倍》
  - 《资治通鉴》卷二百七十七、二百八十
