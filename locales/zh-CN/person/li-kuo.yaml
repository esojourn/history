name: 唐德宗
aliases: [李适, 雍王]
role: 皇帝
summary: 唐代宗长子，推行两税法，削藩引发泾原兵变而出逃奉天，此后让宦官统领禁军。
body: |-
  李适是唐代宗的长子，天宝元年（公元 742 年）生于长安。安史之乱末期他以雍王身份任天下兵马元帅，宝应元年（762 年）率军与回纥兵收复洛阳。大历十四年（779 年）五月代宗去世，他即位，年三十八。

  即位之初他颇想振作，任用杨炎为相，建中元年（780 年）推行两税法，改变了均田制瓦解后的税收制度（另见“两税法”条）。他也想改变藩镇父死子继的局面。建中二年（781 年）成德节度使李宝臣死，他拒绝让其子李惟岳承袭，魏博的田悦、淄青的李正己父子、山南东道的梁崇义随即联合抗命，朝廷调兵征讨，战火遍及河北、河南，淮西的李希烈也趁机反叛。建中四年（783 年）十月，调往东方前线的泾原兵在长安哗变，他仓皇出逃奉天，叛军拥立朱泚称帝，围攻奉天一个多月（另见“泾原兵变”条）。次年正月他采纳陆贽的建议，下诏罪己，赦免除朱泚以外的叛乱藩镇；不久救援奉天的李怀光又反，他再逃到梁州。五月李晟收复长安，七月他回到京城。

  经过这场变乱，他对武将深怀戒心，把禁军神策军交给宦官统领，贞元十二年（796 年）正式设左右神策军护军中尉，由宦官担任，宦官掌兵从此成为定制（另见“宦官掌神策军”条）。他对藩镇转为姑息，又让各地进奉，在长安实行“宫市”，由宦官低价强买百姓的货物，时人多有怨言。对外，贞元三年（787 年）平凉会盟时吐蕃劫盟，此后他采纳李泌的建议，与回纥和亲，又联合南诏共抗吐蕃。贞元二十一年（805 年）正月他在长安去世，年六十四。
sources: []
