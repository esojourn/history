name: 郅支单于
aliases: [呼屠吾斯, 郅支骨都侯单于]
role: 匈奴单于
summary: 呼韩邪单于之兄，与弟争立，后率部西迁康居，杀汉使，被陈汤、甘延寿攻杀。
body: |-
  据《汉书·匈奴传》，郅支单于名呼屠吾斯，是呼韩邪单于的哥哥。父亲死后他流落民间，呼韩邪自立后把他找回，立为左谷蠡王。公元前 56 年，他在匈奴东部自立为郅支骨都侯单于。两年后他击败呼韩邪，占据了单于庭。

  呼韩邪转而向汉朝称臣，郅支也曾派儿子到长安入侍，想争取汉的支持。看到汉朝出兵出粮扶助呼韩邪，他知道自己无力统一匈奴，便率部向西迁移，先后击败乌孙的军队，吞并乌揭、坚昆、丁令三个部族，把驻地设在坚昆。

  初元四年（前 45 年）前后，他要求汉朝送还入侍的儿子。汉朝派卫司马谷吉护送，到达后，郅支把谷吉等人杀死。他自知得罪了汉朝，又听说呼韩邪日渐强大，恰好康居王想借他的力量对付乌孙，派人来迎，他便再度西迁。途中遇上严寒，部众冻死很多，到康居时只剩三千人。康居王把女儿嫁给他，他借康居的兵多次攻打乌孙。后来他与康居王反目，杀了康居王的女儿和贵人，征发民众在都赖水边筑城，并向大宛等国索取贡物。

  建昭三年（前 36 年），汉朝的西域副校尉陈汤和都护甘延寿调集四万余人远征，攻破郅支城。《汉书·陈汤传》说郅支在城楼上中箭受伤，城破后被杀。他的死使呼韩邪成为匈奴唯一的单于。
sources: []
recalled:
  - 《汉书·匈奴传下》
  - 《汉书·傅常郑甘陈段传》
