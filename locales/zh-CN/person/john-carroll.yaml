name: "约翰·卡罗尔"
aliases: ["卡罗尔", "卡洛尔"]
role: "美国天主教第一位主教"
summary: "耶稣会出身，1789 年成为美国第一位天主教主教，以巴尔的摩为第一个教区。"
body: |-
  《历史的轨迹》第四十三章说，独立以后，罗马天主教在美国一直归伦敦的宗座代牧管理。1784 年教皇派卡罗尔赴美管理美国的天主教会，1789 年立他为主教，以巴尔的摩为天主教在美国的第一个教区。第四十一章说，天主教是随马里兰殖民地来到美洲的，巴尔的摩勋爵统治时期发展很慢，只占人口的四分之一，但今天美国庞大的天主教会就是从这个小小的开始发展出来的。

  据一般记载，卡罗尔 1735 年生于马里兰一个富裕的天主教家庭，在法国和比利时受教育，加入耶稣会；1773 年耶稣会被教皇解散，他回到马里兰。独立战争中他支持美国，1776 年曾随富兰克林等人出使加拿大，争取当地支持，没有成功。1784 年他被任命为美国传教区的总监，1789 年由美国神父选举、经教皇批准为巴尔的摩主教，次年在英国受祝圣，1808 年升为总主教。他创办了今天的乔治城大学。他 1815 年在巴尔的摩去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十一章“教会进入新大陆” https://wellsofgrace.com/books/spiritual/2000years/html/chapter46.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十三章“新兴国家的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter48.html"
