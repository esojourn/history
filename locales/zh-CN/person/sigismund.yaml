name: 西吉斯蒙德
aliases:
  - 西基斯门
  - 卢森堡的西吉斯蒙德
role: 匈牙利国王、德意志国王、皇帝
summary: 卢森堡家族的皇帝，促成康斯坦茨会议结束大分裂，却未能保全他许以安全的胡斯。
body: |-
  西吉斯蒙德 1368 年生于纽伦堡，是皇帝查理四世的儿子、波希米亚国王瓦茨拉夫四世的弟弟。1387 年他因婚姻成为匈牙利国王。1396 年他率领西欧各国的十字军在多瑙河畔的尼科波利斯与奥斯曼人作战，大败而回。1410 至 1411 年他被选为德意志国王。

  当时西方教会有三位教皇并立。比萨一系的约翰二十三世被那不勒斯国王赶出罗马，需要他的保护，他乘机要约翰召集大公会议。《历史的轨迹》第二十章说，1414 年底由皇帝西吉斯蒙德召集，在康斯坦茨开了大公会议，目的是终止分裂、改革教会。会议期间他亲自到法国南部去劝说阿维农一系的支持者，1417 年会议选出马丁五世，分裂结束。

  该书记载，他邀请胡斯到会，应允保证安全；胡斯被捕后，波希米亚人和皇帝本人都被激怒，提出抗议，得到的答复是：对异端分子所作的应许可以不必遵守。西吉斯蒙德起初要求放人，会议以解散相威胁，他让了步。1415 年 7 月 6 日宣判时他在场。

  1419 年瓦茨拉夫四世去世，西吉斯蒙德继承波希米亚王位，胡斯派把胡斯之死归咎于他，不肯接受。他几次带十字军进攻波希米亚，1420 年在布拉格城外被独眼将领杰士卡打败，此后十多年屡战屡败。巴塞尔会议改用谈判，1436 年与胡斯派达成协议，准许他们在圣餐中饼杯同领，他这才进入布拉格即位。

  1433 年他在罗马由教皇加冕为皇帝。1437 年 12 月他在摩拉维亚的兹诺伊莫去世，卢森堡家族的男系至此断绝。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十九章“教会权势衰微” https://wellsofgrace.com/books/spiritual/2000years/html/chapter21.html"
recalled:
  - 埃伯哈德·温德克《西吉斯蒙德皇帝纪事》
  - 里亨塔尔的乌尔里希《康斯坦茨会议纪事》
  - 姆拉多尼奥维采的彼得《胡斯受审与殉道记》
