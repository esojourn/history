name: "弗朗西斯·亚斯理"
aliases: ["亚斯理", "亚斯布理", "艾斯伯里"]
role: "美国循道会监督，骑马巡回讲员的领袖"
summary: "卫斯理派到北美的传道人，任美国循道会监督，骑马巡回四十多年。"
body: |-
  《历史的轨迹》第四十一章说，循道派运动到 1739 年才在英国开始，来到美洲已近殖民地时代末期：1766 年恩伯里在纽约家中开始聚会，同时斯特劳布里奇在马里兰工作；1771 年卫斯理派亚斯理来美洲做进一步的工作，但循道派直到独立战争以后才在美国成立教会。

  据一般记载，亚斯理 1745 年生于英国伯明翰附近，做过五金工匠的学徒，少年时归信，二十出头成为卫斯理的巡回讲员。独立战争中英国派的循道会传道人纷纷回国，他留了下来。第四十三章说，1784 年的大会上，他与科克都被选为监督；据一般记载，他坚持要由美国传道人选举才肯接受卫斯理的委派，这次大会就是在巴尔的摩召开的“圣诞大会”。

  书中第四十四章说，在所有教派中，循道派在西部的工作最成功：他们传亚米念派的自由意志教义，正合拓荒者的心；又照卫斯理“全世界都是我的教区”的格言，派骑马的巡回讲员走遍各个“联区”，有的一圈要走四五个星期，沿途成立“班”，选出“班长”，加上平信徒讲道，不必等信徒聚齐就能建立教会。亚斯理是全美循道派的总监督，多次越过阿勒格尼山脉，讲道、开会、给牧师们分派联区；1789 年他派出第一个联区骑马讲员到新英格兰。书中说，十九世纪初西部的循道派信徒不到三千人，到 1830 年已增至十七万五千人。

  据一般记载，亚斯理终身未婚，没有固定居所，四十五年间在北美骑马走了约二十七万英里，讲道一万六千多次；他 1816 年在弗吉尼亚斯波特瑟尔韦尼亚途中病逝，当时美国循道会已有二十万左右会友。
