name: 刘裕
aliases: [刘德舆, 寄奴, 宋武帝]
role: 东晋太尉、宋朝开国皇帝
summary: 出身寒微的北府将领，平桓玄、孙恩卢循，北伐灭南燕、后秦，420 年代晋建立宋朝。
body: |-
  刘裕字德舆，小名寄奴，祖籍彭城，曾祖父南渡后定居京口，《宋书·武帝纪》说他是汉高祖之弟楚元王刘交的后代。他幼年丧母，家境贫困，史书说他年轻时靠卖草鞋为生，又喜好赌博，被乡里看不起。后来他投身驻在京口的北府军，做下级军官。

  隆安三年（公元 399 年）孙恩起事，他随刘牢之出征，几年间屡次以少胜多，逐渐知名。桓玄入建康后夺了北府将领的兵权，又在元兴二年（403 年）篡位。次年二月，他与刘毅、何无忌等二十余人在京口起兵，很快攻下建康，把桓玄赶回江陵。晋安帝复位后，他以大功掌握朝政，起初仍驻京口，义熙四年（408 年）入朝任扬州刺史、录尚书事。

  义熙五年他北伐据有青州的南燕，围攻都城广固，次年攻克，俘虏南燕主慕容超。卢循乘机从广州北上进逼建康，他赶回防守，把卢循击退并追击消灭。此后几年，他先后除掉同时起兵的刘毅、宗室司马休之等对手，派兵灭了割据蜀地的谯纵，又在义熙九年（413 年）再行土断，把北来侨民的户籍归入所住的郡县。

  义熙十二年（416 年）后秦君主姚兴去世，他率大军分路北伐，当年收复洛阳，次年王镇恶的水军沿渭水直上，攻克长安，俘虏后秦主姚泓。北魏在黄河北岸牵制，他用车阵和强弩在岸边击败魏军。年底，留守建康主持后方的刘穆之病逝，他留下年幼的儿子刘义真和诸将镇守关中，自己匆忙东归。第二年留守将领自相残杀，长安被夏主赫连勃勃夺去，河南之地仍为晋有。

  回到南方后，他受封宋公，进爵宋王，派人缢杀晋安帝，改立晋恭帝。元熙二年（420 年）六月，他接受恭帝禅让即皇帝位，国号宋，东晋灭亡。他在位不到两年，永初三年（422 年）五月去世，时年六十。
