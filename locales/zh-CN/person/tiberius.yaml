name: 提比略
aliases: [提比略·尤利乌斯·恺撒, 提贝里乌斯, 提庇留, 该撒提庇留]
role: 罗马皇帝
summary: 罗马第二位皇帝，奥古斯都的继子和养子，晚年隐居卡普里岛。
body: |-
  提比略于公元前 42 年 11 月 16 日生在罗马，父亲是提比略·克劳狄乌斯·尼禄，母亲莉薇娅在他三岁时改嫁屋大维。他年轻时就带兵：前 20 年随军到东方，从帕提亚人手里接回克拉苏在卡莱丢失的军旗；前 15 年与弟弟德鲁苏斯征服阿尔卑斯山以北的雷蒂亚；此后在潘诺尼亚和日耳曼尼亚连年作战。

  前 12 年阿格里帕死后，奥古斯都命他与妻子维普萨尼娅离婚，改娶自己的女儿尤利娅。这段婚姻很不和睦。前 6 年他忽然辞去一切职务，退居罗得岛，公元 2 年才获准回罗马。奥古斯都的两个外孙相继早死，公元 4 年收他为养子，同时要他收养侄子日耳曼尼库斯。公元 6 至 9 年他平定了潘诺尼亚和达尔马提亚的大起事；瓦卢斯在条顿堡森林全军覆没后，又是他去稳住莱茵河防线。

  公元 14 年奥古斯都去世，他继位，时年五十五岁。他谨守奥古斯都留下的边界，不再扩张，把日耳曼尼库斯从莱茵河召回；开支节省，苏维托尼乌斯说他留下了二十七亿塞斯特斯的国库。官员的选举从公民大会移到了元老院。他在位后期，以“损害罗马人民尊严”为名的叛逆罪审判越来越多，告密成风，塔西佗的《编年史》前六卷着力写的就是这一面。

  26 年他离开罗马，次年起住在卡普里岛，再没有回过都城，政事经由禁卫军长官塞扬努斯转达，直到 31 年他设计除掉塞扬努斯。苏维托尼乌斯写了他在岛上的种种淫乱，现代学者多认为是敌对的传闻。37 年 3 月 16 日他死在米塞努姆，终年七十七岁；塔西佗记有一说，是继任的禁卫军长官马克罗用被褥把他闷死的。

  施洗约翰出来传道、耶稣受难，都在他在位期间；《路加福音》3:1 里的“该撒提庇留”就是他。
sources: []
recalled:
