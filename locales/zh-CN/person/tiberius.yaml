  - 苏维托尼乌斯《罗马十二帝王传·提比略传》
  - 维莱伊乌斯·帕特尔库鲁斯《罗马史》卷 2
  - 卡西乌斯·狄奥《罗马史》卷 57—58
  - 《路加福音》3:1
