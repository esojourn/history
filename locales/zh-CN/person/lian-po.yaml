name: 廉颇
aliases: [信平君]
role: 赵国大将
summary: 赵国名将，与蔺相如“将相和”；长平前期坚守，晚年客死楚国。
body: |-
  廉颇是赵国的名将，生卒年不详。据《史记·廉颇蔺相如列传》，赵惠文王十六年（公元前 283 年），他率军伐齐，大破齐军，攻取阳晋，被拜为上卿，以勇气闻名于诸侯。

  蔺相如因完璧归赵和渑池之会有功，位在廉颇之上，廉颇不服，扬言要当面羞辱他。蔺相如处处回避，说强秦之所以不敢攻赵，是因为有我们两人在，“两虎共斗，其势不俱生”，我这样做是先国家之急而后私仇。廉颇听说后，袒露上身、背着荆条到蔺相如门前请罪，二人结为刎颈之交，这就是“负荆请罪”和“将相和”的故事。

  公元前 262 年秦赵争夺上党，廉颇率军驻守长平，面对强大的秦军，他筑垒坚守，不肯出战。秦国派人散布流言，说秦国只怕赵括为将，赵孝成王于是以赵括替代廉颇，结果赵军大败。长平之战后，公元前 251 年燕国乘赵国新败来攻，廉颇大败燕军，杀燕将栗腹，被封为信平君，任假相国。

  赵悼襄王即位后，以乐乘代替廉颇，廉颇愤而攻打乐乘，随后出奔魏国大梁，魏国不信用他。赵国屡被秦军所困，想再起用廉颇，派使者去看他是否还能用。廉颇当着使者的面“一饭斗米，肉十斤，被甲上马，以示尚可用”，但使者受了廉颇仇人郭开的贿赂，回报说“廉将军虽老，尚善饭，然与臣坐，顷之三遗矢矣”，赵王于是作罢。后来廉颇到楚国做将军，没有建立功业，说“我思用赵人”，最后死在寿春。
sources: []
recalled:
  - 《史记·廉颇蔺相如列传》
