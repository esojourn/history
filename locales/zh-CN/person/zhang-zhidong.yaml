name: 张之洞
aliases: [孝达, 香涛, 文襄]
role: 湖广总督、军机大臣
summary: 洋务派后期的代表，长期任湖广总督，创办汉阳铁厂，提出“中学为体，西学为用”。
body: |-
  张之洞籍贯直隶南皮，生于贵州兴义府（父亲在当地任知府），同治二年（1863 年）考中探花。早年他是朝中“清流派”的重要人物，以敢于直言、弹劾大臣著称。光绪七年（1881 年）他出任山西巡抚，此后逐渐转向洋务。

  光绪十年（1884 年）中法战争期间他任两广总督，起用老将冯子材，取得镇南关大捷（另见“中法战争”条）。他在广州创办了枪炮厂、水陆师学堂等。光绪十五年（1889 年）他调任湖广总督，此后在湖北长达十几年，创办了汉阳铁厂、湖北枪炮厂（后称汉阳兵工厂）、织布局、纺纱局等企业，设立自强学堂（武汉大学的前身之一）等新式学校，编练湖北新军，又力主修建卢汉铁路。汉阳铁厂是当时亚洲规模最大的钢铁厂之一，但因为选址、选矿等问题，经营长期亏损，后来交给盛宣怀，组成汉冶萍公司。

  戊戌变法前，他写了《劝学篇》，主张“旧学为体，新学为用”，后人概括为“中学为体，西学为用”，既支持学习西方的技术和部分制度，又反对改变纲常名教，与康有为等维新派划清界限。光绪二十六年（1900 年）义和团运动期间，他与刘坤一、李鸿章等人实行“东南互保”。此后他参与推动清末新政，与袁世凯等人联名奏请废除科举（另见“清末新政”条）。

  光绪三十三年（1907 年）张之洞入京任军机大臣，宣统元年（1909 年）在北京去世，谥“文襄”。他编练的湖北新军后来在辛亥年的武昌起义中成为主力，这是他没有预料到的。
sources: []
recalled:
