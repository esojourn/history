name: 黄庭坚
aliases: [黄山谷, 山谷道人, 涪翁, 黄鲁直]
role: 北宋诗人、书法家
summary: 北宋诗人、书法家，“苏门四学士”之一，开创江西诗派。
body: |-
  黄庭坚是洪州分宁人，生于庆历五年（公元 1045 年），治平四年（1067 年）考中进士。他早年以诗文受到苏轼的赏识，与秦观、晁补之、张耒并称“苏门四学士”，后来他的诗与苏轼并称“苏黄”。

  元祐年间他在朝中任校书郎、著作佐郎，参与编修《神宗实录》。绍圣年间新党执政，有人指控《神宗实录》中有诬蔑之辞，他被贬为涪州别驾，安置在黔州，后来又移到戎州。徽宗即位后他一度获得起用，崇宁二年（1103 年）又因所作的《荆南承天院记》被指为“幸灾谤国”，被除名，编管宜州。崇宁四年（1105 年）他死在宜州。据宋人记载，他在宜州时被禁止住在城中，只能寄居在城楼上，生活十分困苦，仍然读书写字不辍。他是著名的孝子，元代编成的《二十四孝》中有他亲自为母亲洗涤溺器的故事。

  在诗歌上，他主张学习杜甫，讲究字句的出处和锤炼，提出“点铁成金”“夺胎换骨”等说法，诗风生新瘦硬。南宋初年吕本中作《江西诗社宗派图》，把他奉为江西诗派之祖，这一派对宋代诗坛影响很大。他也是著名的书法家，行书和草书都很有特色，与苏轼、米芾、蔡襄并称宋代四大家，传世作品有《松风阁诗帖》《李白忆旧游诗卷》等。
sources: []
recalled:
