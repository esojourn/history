name: 雅各
aliases: [以色列]
role: 族长
summary: 以撒之子，改名以色列，十二个儿子是以色列十二支派的祖先。
body: |-
  以撒和利百加的儿子，与以扫是双生，出生时手抓着以扫的脚跟，那时以撒六十岁（《创世记》25:24—26）。以扫打猎回来疲乏，他用饼和红豆汤换了长子的名分（25:29—34）。以撒年老时，他照母亲的安排冒充以扫，得了父亲给长子的祝福；以扫怀恨要杀他，父母便打发他往巴旦亚兰的舅舅拉班那里去（第 27—28 章）。路上他在伯特利梦见一个梯子立在地上，梯子的头顶着天，耶和华向他重申给亚伯拉罕、以撒的应许（28:10—22）。

  在哈兰，他为娶拉结服事拉班七年，拉班却把大女儿利亚给了他；他娶了拉结，又再服事七年（第 29 章）。利亚、拉结和两个使女辟拉、悉帕给他生了十一个儿子和女儿底拿，后来拉结又生便雅悯（29:31—30:24、35:16—18）。据 31:38、41，他在拉班家共二十年，然后带着家眷、牲畜离开，拉班追到基列山，两人立约分别（第 31 章）。

  回程中，他在雅博渡口与一人摔跤直到黎明，那人给他改名以色列（32:22—32）。他与以扫相见和好（第 33 章），先住在示剑，后来上伯特利筑坛，又回到希伯仑幔利父亲以撒那里（第 34—35 章）。

  他偏爱约瑟；约瑟被哥哥们卖掉后，他以为儿子已被野兽所害，多日悲哀（第 37 章）。饥荒中他打发儿子们下埃及籴粮，后来得知约瑟还活着，便带全家下埃及，住在歌珊地；见法老时他说自己一百三十岁（46:1—47:12）。他在埃及住了十七年，享寿一百四十七岁（47:28）。临终前他给约瑟的两个儿子和自己的众子祝福（第 48—49 章）。众子照他的嘱咐，把他运回迦南，葬在麦比拉洞（50:1—14）。
sources: []
recalled:
  - 《创世记》第 25 章、第 27—35 章、第 37 章、第 42—50 章
  - 《何西阿书》第 12 章
