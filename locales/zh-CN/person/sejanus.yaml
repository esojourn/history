name: 塞扬努斯
aliases: [卢基乌斯·埃利乌斯·塞扬努斯, 谢雅努斯, 塞亚努斯]
role: 禁卫军长官
summary: 提比略的禁卫军长官，一度权倾朝野，公元 31 年被处死。
body: |-
  塞扬努斯约在公元前 20 年生于伊特鲁里亚的沃尔西尼，骑士出身，父亲是禁卫军长官。公元 14 年提比略继位，他与父亲同任长官，父亲调任埃及总督后由他独掌。他把原先分驻各处的禁卫军集中到罗马城东北的一座营地里，这支军队从此成了都城里举足轻重的力量。

  23 年提比略的独子德鲁苏斯去世。八年后，塞扬努斯的前妻揭发说，是他与德鲁苏斯的妻子莉维拉合谋下的毒。26 年提比略离开罗马，后来长住卡普里岛，与外界的往来经他之手；日耳曼尼库斯的遗孀大阿格里皮娜和她的两个儿子先后被控流放或下狱。31 年他与皇帝同任执政官。

  同年 10 月 18 日，提比略的一封长信在元老院宣读，结尾下令逮捕他。他当天被处死，尸体被抛进台伯河，子女也被杀。塔西佗《编年史》记这一年的部分已经失传，他是否真的图谋篡位，现存史料不足以断定。
sources: []
recalled:
  - 塔西佗《编年史》卷 4
  - 卡西乌斯·狄奥《罗马史》卷 58
  - 苏维托尼乌斯《罗马十二帝王传·提比略传》第 55、65 章
