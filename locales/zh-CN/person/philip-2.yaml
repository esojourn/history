name: "腓力二世"
aliases: ["费利佩二世", "菲利普二世"]
role: "西班牙国王"
summary: "查理五世之子，西班牙国王，镇压尼德兰起义，派无敌舰队攻打英格兰。"
body: |-
  腓力 1527 年 5 月 21 日生于西班牙的巴利亚多利德，是皇帝查理五世的独子，在西班牙长大。1554 年他为父亲的外交娶了英格兰女王玛丽一世，在英格兰住了一年多。1555 至 1556 年父亲退位，把尼德兰、西班牙、意大利的属地和美洲交给他；帝位和奥地利归了他的叔父。1559 年他回西班牙，从此没有再离开，在马德里附近修建了兼作王宫、修道院和陵墓的埃斯科里亚尔宫，终日批阅各地送来的文书。

  他说过，宁可失去所有的国土，也不做异端的君主。他一回国，巴利亚多利德和塞维利亚就举行了几次判决仪式，烧死当地新发现的新教徒，西班牙的新教从此绝迹。他在尼德兰增设主教区，坚持执行惩治异端的法令，不肯听当地贵族的劝告。1566 年尼德兰发生捣毁圣像的风潮，次年他派阿尔瓦公爵带兵去镇压。《历史的轨迹》第三十章说，他的暴政到了令人无法忍受的地步，1568 年荷兰人在沉默者威廉领导下起来反抗；又说在查理五世和他治下，尼德兰有一万八千多信徒死于宗教裁判所，这个数字出自阿尔瓦自己的夸口，一般认为偏高。

  1571 年他的舰队与威尼斯、教皇的舰队在勒班陀大败土耳其海军。1580 年他兼并葡萄牙。他出钱支持法国的天主教同盟，不让新教徒坐上法国王位。英格兰女王伊丽莎白援助尼德兰，纵容海盗劫掠西班牙的船只，1587 年又处死了苏格兰女王玛丽。该书说，他建立号称“无敌”的庞大舰队，打算先征服英格兰，再回头平定尼德兰；1588 年舰队失败，只有一部分回到西班牙。

  他在位期间国库几次宣告无力偿债。1598 年他与法国议和，9 月 13 日在埃斯科里亚尔宫病逝，尼德兰北部那时仍在同他作战。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
