name: 且鞮侯单于
aliases: [且鞮侯]
role: 匈奴单于
summary: 匈奴单于，在位五年，扣留汉使苏武，在浚稽山围降李陵。
body: |-
  据《史记·匈奴列传》和《汉书·匈奴传》，且鞮侯原为匈奴的左大都尉。太初四年（公元前 101 年），他的哥哥呴犁湖单于在位一年就去世，匈奴人立他为单于。这时汉朝刚刚征服大宛，声威震动西域，武帝有意乘势压服匈奴。且鞮侯初立，担心汉军来袭，便把历年扣留而不肯投降的汉使都送回去，并说自己是晚辈，汉天子是长辈。

  天汉元年（前 100 年），武帝派苏武护送被扣的匈奴使者回去，并赠送厚礼。《汉书》说且鞮侯反而更加骄横。恰好使团的副使卷入匈奴内部的一场叛乱，他便扣下使团，逼苏武投降，不成，把他流放到北海。

  次年汉军分路出击。骑都尉李陵率五千步兵深入，在浚稽山与且鞮侯亲率的大军遭遇。《汉书》说匈奴以数万骑围攻多日仍不能取胜，且鞮侯怀疑汉军有埋伏，一度想撤走，后来从汉军的逃兵口中得知李陵没有后援，才全力进攻，迫使李陵投降。他把女儿嫁给了李陵。天汉四年（前 97 年），他率十万骑在余吾水南岸迎战李广利的大军，交战十余日，汉军退回。次年他病逝，在位五年，长子左贤王继位，即狐鹿姑单于。
sources: []
recalled:
  - 《史记·匈奴列传》
  - 《汉书·匈奴传上》
  - 《汉书·李广苏建传》
