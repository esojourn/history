name: "法雷尔"
aliases: ["纪尧姆·法雷尔", "法惹勒"]
role: "瑞士法语区的布道家"
summary: "法国布道家，把改教带到纳沙泰尔和日内瓦，1536 年挽留加尔文在日内瓦同工。"
body: |-
  法雷尔 1489 年生于法国东南部加普附近的一个小贵族家庭。他到巴黎读书，从学于勒费弗尔；《历史的轨迹》第二十四章说他全心接受了老师靠恩得救的教导。1521 年他随老师到莫城，因言辞激烈，不久离开。1524 年他在巴塞尔发起辩论，得罪了伊拉斯谟，被逐出城。

  此后他靠伯尔尼的支持，在瑞士法语区一村一镇地讲道，常常挨打、被赶。1530 年纳沙泰尔接受了改教。1532 年他出席阿尔卑斯山中瓦勒度派的会议，该书说他使他们立时接受了改教的信仰；这次会议上瓦勒度派决定与瑞士的改教者联合，并出资印行奥利维坦的法文圣经。

  同年秋天他第一次到日内瓦，被赶了出来，1533 年底再去。该书说经过他几个月激烈的讲道，风向转了过来：1535 年夏他占用了圣彼得座堂，城里捣毁图像，弥撒停止；1536 年 5 月 21 日全体市民举手表决，愿意按福音生活。那年夏天加尔文路过，法雷尔到旅店把他留下。该书称他为“老先生”“老传道人”，那时他四十七岁，比加尔文大二十岁。

  1538 年两人一同被逐。法雷尔回纳沙泰尔做牧师，直到去世，其间仍四出布道，与加尔文通信不断。他六十九岁时娶了一个年轻女子，加尔文很不以为然。1564 年他赶到日内瓦见了病危的加尔文最后一面。1565 年 9 月他在纳沙泰尔去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十四章“瑞士的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter27.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十六章“西欧的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter29.html"
recalled:
  - "法雷尔《简明宣言》（1529 年）"
  - "加尔文《诗篇注释》序言（1557 年）"
