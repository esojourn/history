name: 周武王
aliases: [姬发]
role: 周朝的开创者
summary: 西周的开创者，在牧野打败商纣王，建立周朝，分封诸侯。
body: |-
  周武王姓姬名发，是周文王的次子。文王死后他继位，以吕尚（太公望）为师，弟弟周公旦为辅，召公、毕公等人左右辅佐。他的生年不详。

  据《史记·周本纪》，武王继位后曾东进到孟津检阅军队，不期而会的诸侯有八百，都说可以伐纣了，武王认为时机未到，退兵而回。两年后，纣王杀比干、囚箕子，武王遂率战车、虎贲和甲士，会合庸、蜀、羌、髳、微、卢、彭、濮等族东进伐商（兵力数字各书记载不同）。甲子日清晨，双方在牧野会战，武王誓师，誓辞即《尚书·牧誓》；商军倒戈，纣自焚于鹿台，商朝灭亡。1976 年陕西临潼出土的利簋，铭文记载“武王征商，唯甲子朝”，与古书相合。

  克商后，武王封纣的儿子武庚（禄父）以继续商的祭祀，派弟弟管叔、蔡叔监视他；又访问箕子，问以治国之道。他分封功臣和宗室，封吕尚于齐、周公旦于鲁、召公奭于燕等。据《史记》，他还考察了洛邑一带，打算在那里营建都邑。他的都城在丰邑对岸的镐京，后世称宗周。

  《史记》说武王克商后二年患病，周公作册祷告，愿以身代（见《尚书·金縢》），不久武王去世，儿子成王继位。夏商周断代工程把武王克商定在公元前 1046 年，在位到前 1043 年。克商的年份，学界有四十多种不同推算，断代工程的结论也有争议。
sources: []
recalled:
  - 《史记·周本纪》
  - 《尚书·牧誓》
  - 《尚书·金縢》
  - 利簋铭文
  - 《夏商周断代工程 1996—2000 年阶段成果报告》
