name: "马丁·路德"
aliases: ["路德", "马丁路德"]
role: "维滕贝格大学教授、改教家"
summary: "德意志修士、圣经教授，1517 年发表九十五条论纲，主张因信称义，开启宗教改革。"
body: |-
  路德 1483 年 11 月 10 日生于德意志的艾斯莱本，不久全家迁到曼斯费尔德，父亲靠矿业起家。他在爱尔福特大学读书，1505 年得硕士学位，按父亲的意思改读法律，同年却进了爱尔福特的奥古斯丁会修道院。1508 年他被派到维滕贝格大学教书，后来奉修会之命去过一次罗马，1512 年得神学博士学位，此后一直在维滕贝格讲授圣经。

  《历史的轨迹》第二十一章说，他在修道院里禁食、鞭打自己，仍得不着平安；约 1512 年底在维滕贝格的斗室里读到罗马书 1 章 17 节“义人必因信得生”，才明白人得救是凭信心而不是凭善行。这次转变的年份没有同时代的记载，路德晚年的自述也说得不一，学者的推定从 1513 年到 1518 年不等。

  1517 年多明我会修士台彻尔在萨克森边境推销赎罪券。10 月 31 日路德写成九十五条论纲。该书说他在正午把论纲钉在维滕贝格教堂的门上；可以确定的是他当天把论纲寄给了美因茨大主教，贴门一事最早见于梅兰希顿在路德死后的记述，是否属实学者有争论。此后他在奥格斯堡、莱比锡都不肯收回言论，进而否认教皇和公会议不会错；1520 年写了三篇改教论著，烧了教皇限期认错的诏书，次年初被开除教籍。

  1521 年 4 月他在沃尔姆斯帝国议会上当着皇帝查理五世拒绝收回著作。该书引他的话说“我站在此，神啊，帮助我，我无其它选择”；“我站在此”一句不见于当场的记录，是稍后的印本加上的。回程途中，萨克森选侯派人把他藏进瓦特堡。该书第二十三章说他在瓦特堡把圣经译成德文；他在那里译完的是新约，1522 年 9 月出版，全本圣经到 1534 年才出齐。

  1522 年 3 月他回到维滕贝格，平息了同事们过急的变革，此后废弥撒献祭之说，让信徒兼领饼和杯，用德语礼拜，写了大小两种教理问答和许多圣诗。1525 年农民起事，他先劝和，后来写文章要诸侯镇压，同年与离开修道院的修女凯瑟琳·冯·博拉结婚。1546 年 2 月 18 日他在出生地艾斯莱本去世。
