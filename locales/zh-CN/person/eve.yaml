name: 夏娃
aliases: []
role: 亚当的妻子
summary: 圣经所记的第一个女人，亚当的妻子，该隐、亚伯和塞特的母亲。
body: |-
  据《创世记》第 2 章，神把亚当安置在伊甸园以后说，那人独居不好，要为他造一个配偶帮助他（2:18）。神使亚当沉睡，取下他的一条肋骨，造成一个女人，领到他面前；亚当称她为“女人”，说她是自己骨中的骨、肉中的肉（2:21–23）。经文接着说，人要离开父母，与妻子连合，二人成为一体（2:24）。这段话在新约里多次被引用来谈婚姻，如《马太福音》第 19 章。

  第 3 章记载，蛇对女人说，吃分别善恶树上的果子不一定死，反而能像神一样知道善恶。女人见那果子好作食物，也悦人的眼目，就摘下来吃了，又给她丈夫，她丈夫也吃了（3:1–6）。神追问时，她说是蛇引诱了她。神对她说，要多多加增她怀胎的苦楚，她生产儿女必多受苦楚（3:16）。此后亚当给妻子起名叫夏娃，因为她是众生之母（3:20）；这个名字在希伯来文里与“生命”一词相关。神用皮子做衣服给二人穿，把他们赶出伊甸园（3:21–24）。

  出园以后，夏娃生了该隐，说这是耶和华使她得了一个男子；后来又生了亚伯（4:1–2）。亚伯被该隐杀死以后，她生了塞特，说这是神另给她立的一个儿子，代替亚伯（4:25）。

  关于夏娃的记载到此为止。她活了多少岁、死在何处，圣经都没有记载。新约里有两处提到她的名字：《哥林多后书》11:3 提到蛇用诡诈诱惑了夏娃，《提摩太前书》2:13 提到先造的是亚当，后造的是夏娃。
sources: []
recalled:
  - 《创世记》第 2—4 章
  - 《马太福音》第 19 章
  - 《哥林多后书》11:3
  - 《提摩太前书》2:13
