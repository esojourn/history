name: 慕容恪
aliases: [慕容玄恭, 太原王]
role: 前燕太宰
summary: 前燕名将，擒冉闵、取洛阳，辅佐幼主慕容暐，执政期间前燕国势最盛。
body: |-
  慕容恪字玄恭，是慕容皝的第四子，生年不详。据《晋书·载记》，他十五岁就开始领兵。咸康四年（公元 338 年）石虎进攻棘城后撤退，他率骑兵追击，大获全胜，此后参与了征讨高句丽、宇文部的历次战事。

  永和八年（352 年），他的兄长慕容儁派他南下讨伐冉闵。冉闵骁勇，起初接连取胜。载记记载，他挑选善射的骑兵，用铁锁把马连在一起组成方阵居中，两翼夹击，在廉台把冉闵击败擒获。此后他又迫降了据有青州的段龛，前燕因此占有河北和山东。

  升平四年（360 年）慕容儁去世，继位的慕容暐只有十一岁，他以太宰的身份主持朝政。辅政大臣慕舆根图谋作乱，被他除掉。兴宁三年（365 年）他率军攻克洛阳。载记说他为政宽和，凡事与叔父慕容评商量，用兵不求严苛而防备周密，从未打过败仗。太和二年（367 年）他病重，向慕容暐推荐弟弟慕容垂接替自己，没有被采纳。他去世后三年，前燕被前秦灭亡。
sources: []
recalled:
  - 《晋书·慕容暐载记附慕容恪》
  - 《资治通鉴》卷九十九至一百零一
