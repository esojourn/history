name: 大卫
aliases: []
role: 以色列王
summary: 耶西之子，继扫罗为以色列王，定都耶路撒冷，在位四十年。
body: |-
  大卫是犹大支派伯利恒人耶西最小的儿子，少年时为父亲放羊。据《撒母耳记上》第 16 章，撒母耳奉命到伯利恒，在耶西的众子中膏了他。圣经没有给出公元纪年，只说他登基的时候三十岁，作王四十年（《撒母耳记下》5:4）；本条所标的约公元前 1010—前 970 年在位，是通行的约数，生年由此上推。

  大卫先被召到扫罗跟前弹琴。第 17 章记载，他在以拉谷用机弦甩石，击杀了非利士人歌利亚（《撒母耳记下》21:19 另有一处说杀歌利亚的是伊勒哈难）。此后他在扫罗手下领兵，娶了扫罗的女儿米甲，与扫罗的儿子约拿单结盟。扫罗嫉恨他，屡次要杀他，他就逃亡在犹大的旷野，两次有机会杀扫罗都没有下手，后来投奔迦特王亚吉，住在洗革拉。

  扫罗死后，犹大人在希伯仑膏大卫作犹大家的王，他在那里作王七年零六个月（撒下 5:5）；随后以色列众支派的长老也来膏他作以色列的王。他攻取耶布斯人的锡安保障，定都耶路撒冷，把约柜运进城中。他有意为耶和华建殿，先知拿单传话说，建殿的是他的后裔，他的家和他的国必永远坚立（第 7 章）。他先后战胜非利士人、摩押人、亚兰人、以东人和亚扪人。

  第 11—12 章记载，大卫与乌利亚的妻子拔示巴同房，又使乌利亚死在阵上；拿单奉差遣责备他，他承认自己得罪了耶和华。此后他的家中接连出事：长子暗嫩玷辱妹妹他玛，押沙龙杀了暗嫩，后来又起兵反叛，大卫一度逃离耶路撒冷；押沙龙兵败被杀，大卫为他哀哭（第 13—19 章）。

  大卫年老的时候，吩咐让拔示巴所生的所罗门受膏接续王位（《列王纪上》第 1 章）。他死后葬在大卫城；据 2:11，他在希伯仑作王七年，在耶路撒冷作王三十三年。《诗篇》里有许多篇的题注归在他名下。在圣经以外，以色列北部但遗址出土的公元前 9 世纪亚兰文石碑残片上，有通常读作“大卫家”的字样。
sources: []
recalled:
