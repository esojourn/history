name: 亚历山大六世
aliases:
  - 罗德里戈·波吉亚
  - 罗德里戈·博尔哈
role: 罗马主教（教皇）
summary: 波吉亚家族出身的文艺复兴时期教皇，以扶植子女、生活败坏著称。
body: |-
  罗德里戈·波吉亚 1431 年 1 月生于西班牙瓦伦西亚附近的哈蒂瓦。他的舅父在 1455 年当选教皇，次年就把二十五岁的他提为枢机，随后让他主管教廷的文书机构。这个职位他一连做了三十五年，历经五位教皇，积下巨大的财富。他作枢机时有好几个子女，其中切萨雷和卢克雷齐娅最为人知。

  1492 年 8 月他当选教皇。同时代的人普遍说他是用钱财和职位换来选票的。他在位十一年，主要的心思用在为子女谋取地位上：切萨雷先被立为枢机，后来辞去，靠教廷的钱和法国的兵在意大利中部为自己打下一片领地；卢克雷齐娅三次出嫁，每次都出于政治的需要。1497 年他的另一个儿子被人杀死，他一度表示要改革教廷，指派了委员会，不久不了了之。

  《历史的轨迹》第二十章说，十五世纪后半期的教皇热衷于文艺复兴，出钱供养学者、画家和建筑师，对异教文艺的兴趣超过对基督教的关心；他们奢靡不道德的生活和向各国征收的苛捐杂税，使阿尔卑斯山以北的人对教会和教皇制日益不满。该书说这些教皇多半品行卑劣，亚历山大六世尤甚。同时代人的记述出自他的仇敌的不少，有些传闻难以证实，但他公开承认子女、任人唯亲是没有疑问的。

  哥伦布首航归来后，他在 1493 年发布诏书，在大西洋上划一条线，把线以西新发现的土地划给西班牙。佛罗伦萨的修士萨伏那罗拉在讲坛上斥责他，他在 1497 年革除了萨伏那罗拉的教籍。1500 年他主持了禧年。

  1503 年 8 月他在罗马去世，死因一般认为是热病，当时也有中毒的传言。他死后切萨雷的势力很快瓦解。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 约翰·布尔夏德《日记》
  - 圭恰迪尼《意大利史》卷 1—6
  - 1493 年诏书《在其他事务之中》
