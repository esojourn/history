name: 北齐文宣帝
aliases: [高洋, 高子进, 齐显祖]
role: 皇帝
summary: 高欢次子，550 年代东魏建立北齐，前期颇有作为，后期嗜酒暴虐。
body: |-
  高洋字子进，高欢的次子，母亲娄昭君。他少年时沉默寡言，看起来有些愚钝，哥哥高澄很轻视他。据《北齐书》，高欢曾想试试几个儿子的见识，给每人一团乱丝让他们理清，高洋抽刀把乱丝斩断，说“乱者须斩”，这就是“快刀斩乱麻”的出处。

  武定七年（公元 549 年），掌握东魏大权的高澄在邺城被家奴兰京刺杀，高洋迅速平定局面，接掌了政权。次年五月，他逼东魏孝静帝禅位，建立齐朝，史称北齐，年号天保。

  他在位前期留心政务，任用杨愔等人，修订律令，合并州郡，裁减冗官，整顿吏治。他亲自领兵北征柔然、突厥、契丹和山胡，屡获胜利，又在北边修筑长城，北齐的国力一时强盛。

  后期他嗜酒无度，喜怒无常，常在醉后亲手杀人。据《北齐书》，有司专门从死囚中挑出人来，称为“供御囚”，供他酒醉时处决。他醉后曾推倒母亲娄太后所坐的小床，使太后跌伤，酒醒后惭愧不已，要人用杖打自己赎罪。天保十年（559 年），他下令大杀东魏皇族元氏，据《资治通鉴》，被杀者七百二十一人，尸体投入漳水。同年十月，他因长期酗酒，在晋阳病死，年三十四，太子高殷继位，不久被叔父高演废黜。
sources: []
recalled:
  - 《北齐书·文宣帝纪》
  - 《资治通鉴》卷一百六十二至一百六十七
