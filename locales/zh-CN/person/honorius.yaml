name: 霍诺里乌斯
aliases: [洪诺留, 何挪留, 荷诺里乌斯]
role: 西罗马皇帝
summary: 狄奥多西一世次子，西部皇帝，在位期间不列颠、高卢失控，罗马城陷落。
body: |-
  霍诺里乌斯于公元 384 年 9 月 9 日生在君士坦丁堡，是狄奥多西一世的次子。395 年父亲去世，十岁的他在米兰继承帝国西部，由统帅斯提利科摄政，并先后娶了斯提利科的两个女儿。402 年哥特人侵入意大利后，他把朝廷迁到四面是沼泽的拉文纳。

  408 年他听信谗言处死斯提利科，又拒绝阿拉里克索要土地和官职的条件，410 年 8 月罗马城被哥特人攻破劫掠。同时不列颠和高卢的军队另立皇帝，汪达尔人、阿兰人、苏维汇人越过莱茵河后又进了西班牙。佐西莫斯记他在 410 年写信给不列颠各城，叫他们自行设防；这封信的收信地有学者怀疑是抄写之误。

  411 年以后，将军君士坦提乌斯逐个平定僭主，418 年把哥特人安置在高卢西南部。霍诺里乌斯把同父异母的妹妹加拉·普拉西提阿嫁给他，421 年立他同为皇帝，他当年就死了。423 年 8 月 15 日霍诺里乌斯病死在拉文纳，没有子嗣。据狄奥多勒，是他下令禁了角斗表演。
sources: []
recalled:
  - 佐西莫斯《新历史》卷 5—6
  - 奥罗修《反异教史》卷 7 第 36—43 章
  - 奥林匹奥多罗斯残篇
  - 狄奥多勒《教会史》卷 5 第 26 章
