name: 汉桓帝
aliases: [刘志, 威宗]
role: 皇帝
summary: 东汉皇帝，依靠宦官诛灭外戚梁冀，在位末年发生第一次党锢。
body: |-
  据《后汉书·桓帝纪》，桓帝名志，是章帝的曾孙，原袭父爵为蠡吾侯。本初元年（公元 146 年）质帝被梁冀毒死，梁太后与梁冀把十五岁的刘志迎入宫中立为皇帝，他又娶了梁冀的妹妹为后。此后十三年，朝政都在梁冀手中。

  延熹二年（159 年），桓帝与宦官单超、徐璜、具瑗、左悺、唐衡五人定计诛灭梁氏。五人同日封侯，世称“五侯”，宦官从此得势，其亲属出任州郡官吏，多有贪暴。官僚、太学生与宦官的冲突日益激烈。延熹九年（166 年），司隶校尉李膺等二百多人被指为“党人”逮捕下狱，次年赦免回乡，终身不许做官，这是第一次党锢。

  《后汉书》记载桓帝喜好黄老和浮屠，曾在宫中设祠祭祀。延熹九年，大秦王安敦的使者经日南来到汉朝，这是史书记载的罗马与中国的第一次直接往来。桓帝死于永康元年十二月，按公历已是 168 年初，本纪记其终年三十六。他没有儿子，窦皇后与其父窦武迎立解渎亭侯刘宏。
sources: []
recalled:
  - 《后汉书·孝桓帝纪》
  - 《后汉书·宦者列传》
  - 《后汉书·西域传》
