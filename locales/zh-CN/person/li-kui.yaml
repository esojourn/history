name: 李悝
aliases: [李克（一说）]
role: 魏国相，法家先驱
summary: 魏文侯时主持变法，推行“尽地力之教”和平籴法，相传编有《法经》，是法家的先驱。
body: |-
  李悝是魏文侯时的大臣，生卒年不详，大致与魏文侯同时。《史记》中有时称“李克”，二者是否同一人，学界有不同看法。

  据《汉书·食货志》，李悝为魏文侯推行“尽地力之教”，认为土地的产量取决于耕作是否勤谨，鼓励农民精耕细作、增加产量；又推行“平籴法”，在丰年由国家按平价收购粮食，荒年平价出售，使粮价稳定，“使民无伤而农益劝”。《汉书》所载他对一个五口之家一年收支的计算，是研究战国农业经济的重要资料。

  据《晋书·刑法志》和唐代的《唐律疏议》，李悝汇集各国的法律编成《法经》六篇，即盗、贼、网（囚）、捕、杂、具，后来商鞅把它带到秦国，改法为律。《法经》早已失传，这一说法出自较晚的文献，学界对其可靠性有不同意见。李悝的变法被看作战国变法运动的开端，后世把他列为法家的先驱。

  李悝与李克是否同一人，学界看法不一：《史记·货殖列传》说“李克务尽地力”，《汉书·食货志》说“李悝为魏文侯作尽地力之教”，二者说的是同一件事，所以许多学者认为是一人；也有学者根据《汉书·艺文志》分别著录了儒家的《李克》七篇和法家的《李子》三十二篇，认为是两个人。
sources: []
recalled:
  - 《汉书·食货志》
  - 《晋书·刑法志》
  - 《史记·魏世家》
