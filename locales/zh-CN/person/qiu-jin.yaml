name: 秋瑾
aliases: [璇卿, 竞雄, 鉴湖女侠]
role: 革命家
summary: 女革命家，留学日本加入同盟会，在上海创办《中国女报》，1907 年在绍兴就义。
body: |-
  秋瑾祖籍浙江山阴（今绍兴），生于福建（一说生于绍兴），自号鉴湖女侠。她十九岁时嫁给湖南湘潭的富家子弟王廷钧，后来随丈夫到北京。目睹八国联军侵华后的情景，她决心投身救国。光绪三十年（1904 年）她冲破家庭的阻挠，变卖首饰，自费到日本留学，次年加入光复会和同盟会。

  光绪三十二年（1906 年）她回国，在上海创办《中国女报》，提倡男女平等，宣传革命。次年她到绍兴主持大通学堂，以学堂为基地联络会党，训练学生，准备与在安徽的徐锡麟同时起义。光绪三十三年（1907 年）七月徐锡麟在安庆刺杀巡抚恩铭后被杀，秋瑾的计划也暴露，她拒绝出走，在大通学堂被捕。审讯时她只写了“秋风秋雨愁煞人”七个字（据记载，这句诗的来源有不同说法）。七月十五日她在绍兴轩亭口被杀害，年三十二岁。她的遗骨后来迁葬于杭州西湖畔。
sources: []
recalled:
  - 《秋瑾集》
  - 陶成章《浙案纪略》
