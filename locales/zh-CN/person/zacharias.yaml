name: 撒迦利亚
aliases:
  - 匝加利亚
  - 扎加利
role: 罗马主教（教皇）
summary: 最后一位希腊裔教皇，答复丕平“有王权的人当有王名”，赞同他称王。
body: |-
  撒迦利亚是出生在意大利南部卡拉布里亚的希腊人，生年不详，公元 741 年底当选教皇。他是最后一位希腊裔的教皇。

  他即位时伦巴第人正威胁罗马。742 年他亲自去见伦巴第王利乌特普兰德，要回了几座被占的城，订立和约；次年又出面劝阻伦巴第人进攻拉文纳。他与在日耳曼地区传教的波尼法修书信往来很多，支持他整顿法兰克教会。他还把大贵格利的《对话录》译成希腊文。

  《历史的轨迹》第九章记他答复丕平的话：“有国王之权的人也当拥有国王之名。”丕平据此在 751 年取代了墨洛温王朝。该书说丕平是由撒迦利亚加冕的，又说撒迦利亚要求丕平对付伦巴第人作为回报；按《法兰克王国年代记》和《教皇列传》，撒迦利亚没有到过法兰克，他在 752 年 3 月去世，向丕平求援并膏立他的是继任的司提反二世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第九章“教会组成联盟” https://wellsofgrace.com/books/spiritual/2000years/html/chapter11.html"
recalled:
  - 《教皇列传》撒迦利亚传
  - 《法兰克王国年代记》749 年条
  - 波尼法修《书信集》
