name: 本笃九世
aliases:
  - 本尼狄克九世
  - 狄奥菲拉克特
role: 罗马主教（教皇）
summary: 图斯库伦家族出身的教皇，三度在位，1045 年把教皇职位卖给贵格利六世。
body: |-
  本笃原名狄奥菲拉克特，出自控制罗马的图斯库伦伯爵家族，前两任教皇都是他的叔伯。1032 年他父亲把他扶上教皇的位置。《历史的轨迹》第十一章说他在 1033 年即位，当时只有十二岁；十二岁的说法出自同时代的编年史家格拉贝，今天多数学者认为他那时大约二十岁，即位在 1032 年。

  同时代的人对他的品行评价极坏。1044 年（《历史的轨迹》作 1045 年）与图斯库伦家族为敌的一派把他赶出罗马，另立西尔维斯特三世；不久本笃又夺回了位置。1045 年 5 月他把教皇职位让给自己的教父、司铎约翰·格拉提安，收了一笔钱，后者即贵格利六世。钱的数目各书所记不同，《历史的轨迹》作一千磅银子。事后他又反悔，于是罗马同时有三个人自称教皇。

  1046 年皇帝亨利三世南下，在苏特里和罗马的会议上把三人都废掉。本笃在 1047 年底又回来占据了几个月，次年被逐。他后来的下落不清楚，相传约在 1056 年死于罗马附近的一所修道院。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十一章“教会被政府控制” https://wellsofgrace.com/books/spiritual/2000years/html/chapter13.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十四章“教会为自由奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter16.html"
recalled:
  - 拉乌尔·格拉贝《历史五卷》
  - 蒙特卡西诺的德西德里乌斯《对话录》卷 3
  - 《教皇列传》
