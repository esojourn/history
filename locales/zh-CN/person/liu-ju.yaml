name: 刘据
aliases: [卫太子, 戾太子]
role: 皇太子
summary: 汉武帝的长子，卫皇后所生，立为太子三十余年，巫蛊之祸中兵败自杀。
body: |-
  刘据生于元朔元年（公元前 128 年），是武帝的第一个儿子，母亲卫子夫因他而立为皇后。元狩元年（前 122 年）他七岁，被立为皇太子。据《汉书·武五子传》，他成年后武帝为他建博望苑，让他按自己的喜好结交宾客。《资治通鉴》说他性情宽厚，常平反冤案，与用法严峻的武帝及其身边的大臣不合。

  武帝晚年多病，怀疑有人用巫蛊诅咒自己。征和二年（前 91 年），曾与太子结怨的江充受命查办巫蛊，声称在太子宫中掘出了桐木人。当时武帝在甘泉宫养病，太子无法自辩，便听从少傅石德的建议，假称奉诏捕杀江充，并发兵自卫。武帝闻讯回到长安城西的建章宫，命丞相刘屈氂率军平乱。双方在长安城中交战五日，《汉书》说死者数万人。

  太子兵败，逃到湖县的泉鸠里，藏在一户贫苦人家。八月，地方官吏发觉后前来围捕，他自缢而死，随行的两个儿子也一同遇害。事后壶关三老令狐茂、高寝郎田千秋相继上书为他辩冤，武帝有所悔悟，族灭江充一家，并在湖县筑思子宫和归来望思之台。他留下的一个孙子后来即位，就是汉宣帝；宣帝为祖父定谥号为“戾”。
sources: []
recalled:
  - 《汉书·武五子传》
  - 《资治通鉴》卷二十二
