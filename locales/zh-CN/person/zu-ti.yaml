name: 祖逖
aliases: [祖士稚]
role: 豫州刺史
summary: 东晋初年的将领，率部曲渡江北伐，数年间收复黄河以南大片土地，壮志未酬而卒。
body: |-
  祖逖字士稚，范阳遒县人，家中世代为官。据《晋书》本传，他年少时轻财好侠，不拘小节，十四五岁还没有认真读书，后来才博览群籍。他与刘琨同任司州主簿，交情很深，常常一起议论时局，半夜闻鸡起舞。八王之乱中，他先后在齐王冏、长沙王乂、东海王越等人手下任职。

  永嘉五年（公元 311 年）洛阳陷落，他带着亲族乡党几百家南下避乱，一路上把车马让给老弱，自己步行，被众人推为首领。到达泗口后，镇守江东的琅邪王司马睿任他为徐州刺史，后来让他住在京口。他上书请求北伐。建兴元年（313 年），司马睿任他为豫州刺史，只给了一千人的口粮和三千匹布，不给兵器铠甲，让他自己募兵。他带着原来的部曲百余家渡江，船到中流，敲着船桨发誓：“祖逖不能清中原而复济者，有如大江！”此语见本传。

  他在淮阴铸造兵器，招募到二千多人，随后进驻谯城。当时黄河以南有许多据坞自守的豪强，彼此攻伐，有的依附石勒。他或攻或抚，使他们大多归附，又几次击败石勒派来的军队，大兴三年（320 年）进驻雍丘，黄河以南大部分地方重归晋朝。本传说他生活俭朴，督促农桑，优待归附的人，石勒不敢再向河南用兵，还派人修缮了他在北方的祖坟，请求通商。

  大兴四年（321 年），朝廷派戴渊出任都督来统辖他，他又听说王敦与朝中大臣不和，担心内乱将起、北伐无成，忧愤成疾，九月在雍丘去世，时年五十六。他的弟弟祖约接管了部众，几年之间，他收复的土地又被后赵夺去。
sources: []
recalled:
  - 《晋书·祖逖传》
  - 《资治通鉴》卷八十八至九十一
