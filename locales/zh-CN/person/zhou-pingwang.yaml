name: 周平王
aliases: [姬宜臼]
role: 周王，东周第一位君王
summary: 周幽王的太子，被废后由申侯等拥立，前 770 年东迁洛邑，东周由此开始。
body: |-
  周平王名宜臼，是周幽王与申后所生的太子。幽王宠爱褒姒，废黜申后和宜臼，宜臼逃到母亲的娘家申国。公元前 771 年，申侯联合缯国和犬戎攻杀幽王，申侯与诸侯拥立宜臼为王，就是平王。

  据《史记·周本纪》，平王即位后，为躲避戎人的侵扰，于公元前 770 年把都城东迁到洛邑，此后的周朝称为东周。秦襄公率兵护送平王有功，被封为诸侯，并获得岐山以西的土地，秦国从此立国。晋文侯、郑武公等也在东迁中出了力。《史记》说平王之时“周室衰微，诸侯强并弱”，齐、楚、秦、晋开始强大。

  关于东迁的经过，古书另有记载。《竹书纪年》佚文和清华简《系年》都说，幽王死后虢公翰另立王子余臣为王，称“携王”，与平王并立，后来携王被晋文侯所杀。《系年》所记的东迁时间与《史记》也有出入，学界对此仍在讨论。

  平王在位五十一年，死于公元前 720 年。他晚年与郑庄公互相猜疑，双方交换人质，史称“周郑交质”（《左传》隐公三年），王室的威望大不如前。孔子所修的《春秋》从鲁隐公元年（前 722 年）记起，正是平王在位的后期。

  平王的太子早死，平王死后由孙子林继位，就是周桓王。
sources: []
recalled:
  - 《史记·周本纪》
  - 《左传》隐公三年
  - 《竹书纪年》（佚文）
  - 清华简《系年》
