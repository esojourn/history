name: 准王
aliases: [朝鲜王准, 箕准]
role: 古朝鲜国王
summary: 卫满之前的朝鲜王，被卫满攻夺后南走韩地。
body: |-
  准是卫满之前的朝鲜王，生卒年不详。他不见于《史记》，事迹主要见于《三国志·魏书·东夷传》及裴注所引《魏略》。《魏略》说他是箕子的后裔，父亲朝鲜王否在秦筑长城到辽东时服属于秦；否死后准继立，二十多年后陈胜、项羽起兵，燕、齐、赵的百姓陆续逃到朝鲜，准把他们安置在西部。

  卢绾反汉（公元前 195 年）后，燕人卫满来投，准拜他为博士，封地百里，让他守西边。后来卫满谎称汉兵来攻，回师攻准，准战败。《三国志》说他带着左右宫人渡海，居于韩地，自号韩王，后来世系断绝；《后汉书·东夷传》则说他率余众数千人攻破马韩自立。
sources:
  - 《三国志·魏书·东夷传》及裴松之注引《魏略》 https://zh.wikisource.org/wiki/三國志/卷30
  - 《后汉书·东夷列传》 https://zh.wikisource.org/wiki/後漢書/卷85
