name: 奥多亚克
aliases: [奥多亚塞, 奥多瓦卡, 奥多阿克]
role: 意大利的王
summary: 蛮族军官，公元 476 年废黜西罗马最后一位皇帝，统治意大利十七年。
body: |-
  奥多亚克约生于公元 433 年。他属于哪一族，古代作家说法不一，有斯基里人、鲁吉人、赫鲁利人几种；他的父亲埃德科，一般认为就是阿提拉手下那位出使过君士坦丁堡的显贵。《圣塞维里努斯传》记，他年轻时披着兽皮去意大利投军，路过诺里库姆，这位隐修士对他说：到意大利去吧，你不久就要把厚礼分给许多人了。到 472 年里西梅尔与皇帝安特米乌斯交兵时，他已是军中有名的军官。

  476 年，意大利的蛮族士兵向统帅奥瑞斯特斯要求分地被拒，8 月 23 日推他为王。他杀了奥瑞斯特斯，9 月初在拉文纳废黜小皇帝罗慕路斯，念其年幼，给他年金，送到坎帕尼亚居住。他没有另立皇帝，而是让元老院把皇帝的冠服送到君士坦丁堡，请东部皇帝芝诺授他“贵族”头衔代管意大利。芝诺答复说，合法的西部皇帝尼波斯还在，信里却仍称他为贵族。480 年尼波斯被杀，他顺势占了达尔马提亚。

  他治理意大利十七年，自称为王，仍用罗马人管民政，元老院、执政官一如往常，把三分之一的土地或其收入分给部下。他信阿里乌派，对大公教会并不干涉。他向汪达尔人纳贡换回西西里；487 至 488 年攻灭多瑙河边的鲁吉人，并把诺里库姆的罗马居民迁回意大利。

  芝诺对他起了疑忌，便怂恿在巴尔干为患的东哥特王狄奥多里克去取意大利。489 年狄奥多里克越过阿尔卑斯山，在伊松佐河、维罗纳和次年的阿达河三次得胜，奥多亚克退守拉文纳，被围三年。493 年 3 月 5 日，经拉文纳主教调停，双方约定共治意大利。十天后狄奥多里克设宴，席间亲手把他砍死；据安条克的约翰，狄奥多里克还说了一句：这家伙身上好像连骨头都没有。他的妻子、兄弟和儿子也先后被杀。
