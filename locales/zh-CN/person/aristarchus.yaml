name: 阿里斯塔克斯
aliases: [萨摩斯的阿里斯塔克, 阿利斯塔克]
role: 天文学家、数学家
summary: 萨摩斯的天文学家，最早提出地球绕太阳运行，并用几何方法估算日月的距离和大小。
body: |-
  萨摩斯岛人，生卒年不详，一般推为约公元前 310 年至约前 230 年。他是漫步派学者斯特拉托的学生。托勒密的《天文学大成》记载他在前 280 年观测过夏至，这是他生平唯一确切的年份。他在哪里工作没有记载，常被推测是亚历山大城。

  他唯一传世的著作是《论日月的大小和距离》。书中从几条假设出发，用几何方法推算：月亮恰好半圆时，日、月、地三者成直角三角形，他取这时日月之间的角距为八十七度，算出太阳到地球的距离是月亮的十八到二十倍；再由月食时地影的大小，推出太阳的直径是地球的六七倍。方法是对的，但那个角度极难测准，实际约为八十九度五十分，所以结果比真实数值（约三百九十倍）小得多。这部书本身仍按地球居中的框架写。

  他更有名的主张见于阿基米德的《数沙者》。阿基米德说，阿里斯塔克斯提出过这样的假说：恒星和太阳不动，地球沿一个圆周绕太阳运行，太阳在圆心；恒星天球大到这样的程度，地球的轨道同它相比，就像球心同球面相比。后一点是为了解释为什么看不出恒星的视差。普鲁塔克在《论月面》里提到，斯多亚派的克里安提斯认为应当控告他不敬神，因为他让“宇宙的炉灶”动了起来；是否真有过控告，没有记载。

  古代接受这个假说的人很少，见于记载的只有一个世纪以后巴比伦的塞琉古。当时的反对理由是看不到恒星视差，以及与亚里士多德的物理学不合；喜帕恰斯和托勒密都仍用地心体系。哥白尼知道他的名字，《天体运行论》手稿中有一段提到他，付印时删去了。
sources: []
recalled:
  - 阿里斯塔克斯《论日月的大小和距离》
  - 阿基米德《数沙者》第 1 章
  - 普鲁塔克《论月面》第 6 章
  - 托勒密《天文学大成》卷三第 1 章
