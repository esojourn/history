name: 王翦
aliases: [武成侯（一说）]
role: 秦国大将
summary: 秦国名将，先后攻破赵、燕，又率六十万大军灭楚，是秦统一六国功劳最大的将领之一。
body: |-
  王翦是秦国频阳东乡人，生卒年不详。据《史记·白起王翦列传》，他年轻时喜好兵法，事奉秦王嬴政。秦王政十一年（公元前 236 年），王翦率军攻赵，攻取阏与等九城。公元前 229 年他大举攻赵，赵将李牧坚守，秦国用反间计使赵王杀了李牧，次年王翦攻破邯郸，俘虏赵王迁，赵国实际灭亡。公元前 227 年荆轲刺秦王失败后，秦王派王翦攻燕，次年攻下燕都蓟，燕王喜退守辽东。

  灭楚之前，秦王问将领需要多少兵力。年轻的将军李信说二十万人就够了，王翦说非六十万人不可。秦王认为王翦老了、胆子小，派李信、蒙恬率二十万人伐楚，王翦于是称病回到频阳。公元前 225 年李信被楚将项燕打败，秦王亲自到频阳向王翦道歉，请他出山。王翦仍坚持要六十万人，秦王答应了。

  据《史记》，出征时王翦一再向秦王请求赏赐良田美宅，到了关口又五次派人回去请求。有人说他太过分，王翦说，秦王性情粗暴而多疑，现在把全国的兵力都交给我，我不多为子孙请求田宅以表示没有野心，秦王就会怀疑我。到了楚地，他坚守营垒不出战，让士卒休息、洗浴、吃好，等楚军东撤时才发兵追击，大破楚军，杀了项燕（一说项燕自杀），公元前 223 年俘虏楚王负刍，楚国灭亡。他又南下平定百越之君。王翦的儿子王贲在这一时期攻灭了魏国、燕国和齐国。

  《史记》说秦统一后王氏、蒙氏功劳最大，名扬后世。王翦的结局史书没有明确记载，他的孙子王离在秦末巨鹿之战中被项羽俘虏。
sources: []
recalled:
  - 《史记·白起王翦列传》
  - 《史记·秦始皇本纪》
