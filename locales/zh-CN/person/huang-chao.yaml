name: 黄巢
aliases: [冲天大将军, 大齐皇帝]
role: 起义军首领、大齐皇帝
summary: 唐末农民起义的首领，转战大半个中国，880 年攻入长安称帝，884 年兵败身死。
body: |-
  黄巢是曹州冤句人，家里世代贩卖私盐，富有资财。据史书，他善于骑射，略通诗书，几次参加进士考试都没有考中。乾符二年（公元 875 年），他聚众数千人响应王仙芝的起义，此后与王仙芝转战各地。乾符三年（876 年）王仙芝打算接受朝廷招安，黄巢坚决反对，两人从此分兵。

  乾符五年（878 年）王仙芝战死，余部推黄巢为首领，号“冲天大将军”。他避开唐军重兵所在的中原，率部渡过长江，经江西、浙东，据《新唐书》开山路七百里进入福建，次年攻陷广州。由于岭南发生疫病，部众多有死亡，他又率军北上，经湖南、江西、皖南，广明元年（880 年）渡过淮河，十一月攻克洛阳，十二月攻入长安，唐僖宗逃往成都。黄巢在长安即皇帝位，国号大齐，年号金统（另见“黄巢入长安”条）。

  入长安之初，起义军向百姓宣布黄王起兵本是为了百姓，但不久就开始大肆杀掠，对唐朝宗室和公卿尤其残酷。各地唐军和藩镇逐渐包围长安，城中粮食断绝。中和二年（882 年），镇守同州的大将朱温降唐。中和三年（883 年），李克用率沙陀兵大破起义军，黄巢撤出长安，向东进入河南，围攻陈州将近一年不下。中和四年（884 年），他在中牟一带被李克用击败，部众溃散，退入山东，六月在泰山狼虎谷走投无路，据《旧唐书》，被外甥林言杀死，首级送到唐军；《新唐书》则说他先自刎未死，再由林言斩首。

  这次起义前后十年，转战今天的十几个省份，沉重打击了唐朝的统治，地方藩镇借镇压起义之机进一步坐大，唐朝随之走向灭亡。后世流传的几首黄巢咏菊诗，如“待到秋来九月八，我花开后百花杀”，最早见于宋人的笔记，是否为他所作难以确定。
sources: []
recalled:
  - 《旧唐书·黄巢传》
  - 《新唐书·逆臣传·黄巢》
  - 《资治通鉴》卷二百五十二至二百五十六
