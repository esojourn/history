name: 刘歆
aliases: [刘子骏, 刘秀, 国师公]
role: 国师
summary: 刘向之子，编成图书目录《七略》，倡立古文经，后为王莽国师，谋反事泄自杀。
body: |-
  刘歆字子骏，是刘向的小儿子，生年不详，一般推定在公元前 50 年前后。据《汉书·楚元王传》，他年轻时因通晓《诗》《书》被成帝召见，任黄门郎，后来受命与父亲一同校订宫中的藏书。刘向去世后，哀帝让他接续这项工作。他把所有图书分为六艺、诸子、诗赋、兵书、术数、方技六类，加上一篇总说，写成《七略》。这部目录后来失传，但班固的《汉书·艺文志》就是据它删节而成的。

  校书时他读到用先秦古文字抄写的《春秋左氏传》，十分喜爱，开始引用传文来解释《春秋》经文。哀帝初年，他建议把《左氏春秋》《毛诗》《逸礼》和《古文尚书》都立为官学，五经博士们不肯与他讨论。他写了一封措辞严厉的信责备太常博士，得罪了朝中的儒者和执政大臣，只得请求外调，先后任河内、五原、涿郡太守。汉代经学的今文与古文之争由此开始。

  他早年与王莽同任黄门郎。哀帝死后王莽执政，把他召回，让他主管礼仪、历法和学术，封红休侯。他考订律历，编成《三统历谱》。王莽称帝后，他任国师，封嘉新公，新朝的许多典章制度出自他的设计。哀帝时他为避皇帝的名讳改名刘秀。

  后来他的两个儿子和一个女儿先后因罪被王莽处死。地皇四年（公元 23 年）王莽的军队在昆阳大败，他与卫将军王涉、大司马董忠密谋劫持王莽、归降汉军，事情泄露，他自杀。清代以来，有学者认为《左传》等古文经是他为帮助王莽而伪造的；现代学者多不赞成这一说法。
sources: []
recalled:
  - 《汉书·楚元王传》
  - 《汉书·王莽传》
  - 《汉书·艺文志》
