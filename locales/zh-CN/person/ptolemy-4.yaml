name: 托勒密四世
aliases: [ 托勒密四世·菲洛帕托尔, 爱父者 ]
role: 埃及国王
summary: 托勒密王朝第四位国王，在拉菲亚击败安条克三世；晚年上埃及叛离。
body: |-
  托勒密四世是托勒密三世与贝勒尼基二世之子，约生于公元前 244 年，前 222 年底继位。即位之初，权臣索西比乌斯清洗王族，他的母亲和弟弟马加斯等人被杀，朝政此后主要由索西比乌斯和阿加托克利斯把持。他娶姐姐阿尔西诺伊三世为后。

  第四次叙利亚战争（前 219—前 217 年）中，安条克三世夺取了南叙利亚大片地方。埃及用两年时间整编军队，并首次大批征召埃及本地人编入方阵。前 217 年 6 月，他在拉菲亚击败安条克三世，收回南叙利亚。波利比乌斯认为，埃及人因这次胜利而自信大增，是后来本土叛乱的原因之一；约前 206 年起上埃及发生叛乱，底比斯一带脱离了王朝控制。

  前 204 年夏他在不明情况下去世，死讯一度被隐瞒，年幼的儿子托勒密五世继位。波利比乌斯把他写成耽于享乐、不理政事的君主；古代作者多把托勒密王朝的衰落追溯到他在位之时。
sources:
  - 波利比乌斯《历史》第 5 卷第 34—39、79—87、107 章，第 15 卷第 25 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/5*.html
  - 英文维基百科“Ptolemy IV Philopator”条（生卒与即位年月） https://en.wikipedia.org/wiki/Ptolemy_IV_Philopator
recalled:
  - 查士丁《腓力史摘要》第 30 卷第 1—2 章
