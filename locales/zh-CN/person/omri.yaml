name: 暗利
aliases: []
role: 北国以色列王
summary: 北国元帅，被军中立为王，买山建撒玛利亚城为都，开创暗利王朝。
body: |-
  圣经没有记载暗利的出身和生年，他的事迹见《列王纪上》16:15–28。他原是以色列的元帅。当时臣子心利在得撒杀了以色列王以拉，自立为王；以色列军队正在围攻非利士人的基比顿，听到消息，当天就在营中立暗利作王。暗利率军从基比顿回师围困得撒，心利见城被攻破，进了王宫的卫所放火自焚，作王只有七日（16:15–18）。

  此后以色列民分成两半，一半跟从基纳的儿子提比尼，一半跟从暗利；跟从暗利的人得胜，提比尼死了，暗利才独自作王（16:21–22）。据 16:23，他作以色列王十二年，其中在得撒六年。他用二他连得银子向撒玛买了撒玛利亚山，在山上造城，按山的原主撒玛的名字给城起名叫撒玛利亚（16:24），此后这城一直是北国的都城。《列王纪》说他行耶和华眼中看为恶的事，比他以前的列王更甚（16:25）。他死后葬在撒玛利亚，儿子亚哈接续作王。

  圣经对暗利的记载很短，圣经以外的史料却多次提到他。摩押王米沙的石碑（米沙石碑）说，以色列王暗利曾长期压制摩押。亚述的铭文后来常把以色列称作“暗利家”，撒缦以色三世的黑色方尖碑上还把后来推翻暗利王朝的耶户称作“暗利之子”。
sources: []
recalled:
  - 《列王纪上》16:15–28
  - 米沙石碑（摩押王米沙的铭文）
  - 亚述王撒缦以色三世黑色方尖碑铭文
