name: 多纳徒
aliases:
  - 大多纳徒
  - 多纳图斯
role: 迦太基分离派主教
summary: 北非分离派的领袖，多纳徒派因他得名；该派不承认逼迫中交出圣经者所行的圣礼。
body: |-
  多纳徒的出身没有可靠记载，有史料说他来自努米底亚的“黑屋”，这个多纳徒与后来的迦太基主教是不是同一人，学者看法不一。

  事情起于戴克里先逼迫之后。公元 311 年前后，凯基里安被立为迦太基主教，努米底亚的一批主教指为他行按立礼的人在逼迫中交出过圣经，按立无效，于是另立马约里努为主教。马约里努不久去世，约 313 年多纳徒接任，这一派从此以他为名。《历史的轨迹》第五章说，多纳徒派在教义上并无错误，问题在于他们主张逼迫中否认信仰的人不得再回教会，交出圣经的主教不能主持圣礼、按立别人，并因此退出教会自立门户。

  他们向君士坦丁皇帝申诉。313 年罗马的主教会议、314 年高卢阿尔勒的会议和 316 年皇帝本人的裁决都判凯基里安一方有理。皇帝一度用武力压制，321 年作罢。这一派在北非乡间扩展很快，一度比大公教会人数更多。

  公元 347 年皇帝派专员到非洲促成合一，多纳徒据说回答：“皇帝与教会有什么相干？”随后压制再起，他被流放到高卢，约 355 年死在流放地。多纳徒派在他死后继续存在，到奥古斯丁的时代仍是北非教会的大问题，直到七世纪才从记载中消失。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
recalled:
  - 奥普塔图《驳多纳徒派》卷 1 第 15—26 章、卷 3 第 3 章
  - 奥古斯丁《书信》第 43、88 封
  - 优西比乌《教会史》卷 10 第 5—6 章
