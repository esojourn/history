name: 安阳王
aliases:
  - 蜀泮
role: 瓯雒国君主
summary: 名蜀泮，传为瓯雒国君主，后被南越赵佗攻灭；年代有两说。
body: |-
  安阳王不见于《史记》《汉书》正文，较早的记载是《水经注》所引《交州外域记》：交趾原有雒王、雒侯，后来“蜀王子”率兵三万征服诸雒将，自称安阳王；南越王尉佗来攻，被神人皋通所造的神弩击退，后来南越太子始与安阳王之女媚珠相通，锯断神弩，安阳王战败，乘船入海。

  越南《大越史记全书》称他姓蜀名泮，国号瓯貉（即瓯雒），都封溪，在位自公元前 257 年至前 208 年。《史记·南越列传》则说赵佗在吕后死后（前 180 年）才使西瓯、骆归附，据此推算，瓯雒并入南越当在前 179 年前后。两说相差近三十年，他的生卒年均无可靠记载。
sources:
  - 《水经注》卷三十七引《交州外域记》 https://zh.wikisource.org/wiki/水經注/37
  - 《大越史记全书·外纪》卷一《蜀纪》 https://zh.wikisource.org/wiki/大越史記全書/外紀卷之一
  - 《史记·南越列传》 https://zh.wikisource.org/wiki/史記/卷113
