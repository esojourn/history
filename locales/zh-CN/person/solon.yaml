name: 梭伦
aliases: []
role: 雅典立法者、诗人
summary: 公元前 594 年任雅典执政官，废除债务奴役，按财产划分公民等级。
body: |-
  雅典人，出身贵族而家产中等。他是雅典最早有作品传世的诗人，了解他的主张，最可靠的依据是他自己的诗，今存若干残篇。普鲁塔克说，雅典与麦加拉争夺萨拉米斯岛失利后一度禁止再提此事，梭伦当众朗诵一首哀歌，鼓动雅典人重新开战，夺回了该岛。

  公元前 6 世纪初，阿提卡的许多农民因欠债失去土地，有的连同家人沦为奴隶，甚至被卖到外邦。公元前 594 年（一说前 593 年），梭伦被推举为执政官，受命调停。他颁布“解负令”，取消以土地和人身作抵押的债务，禁止再以人身作抵押借贷，并赎回被卖到外邦的雅典人。他在诗里说，自己拔掉了插遍田地的债碑，让原先被奴役的大地获得了自由。他没有答应贫民重新分配土地的要求。

  在政制上，他按每年的收成把公民分为四个等级，担任官职的资格依等级而定，最低一等也可以出席公民大会和陪审法庭；公民可以就官员的判决向法庭上诉。据《雅典政制》和普鲁塔克，他还设立了四百人议事会，这一点现代学者有怀疑。除杀人法外，他废除了德拉古的法律，另立新法，刻在木板上公布。

  据说他立法后离开雅典十年，到过埃及和塞浦路斯。希罗多德所记他与吕底亚王克洛伊索斯的会面，在年代上很难相合，一般认为是传说。他晚年回到雅典，反对庇西特拉图夺取政权而没有成功，不久去世。后世把他列为“七贤”之一。
sources: []
recalled:
  - 梭伦诗残篇（韦斯特编号第 4、36 首等）
  - 《雅典政制》第 5—13 章
  - 普鲁塔克《梭伦传》
  - 希罗多德《历史》卷一第 29—33 章
