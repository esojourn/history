name: 王羲之
aliases: [王逸少, 王右军]
role: 右军将军、会稽内史，书法家
summary: 东晋书法家，官至右军将军、会稽内史，作《兰亭集序》，后世尊为“书圣”。
body: |-
  王羲之字逸少，琅邪临沂人，父亲王旷是王导的堂弟。他的生卒年有几种说法，通行的是生于太安二年（公元 303 年）、卒于升平五年（361 年），另有生于 321 年、卒于 379 年等说。据《晋书》本传，他小时候不善言谈，十三岁时拜见名士周顗，周顗把席上最珍贵的烤牛心先分给他，他由此为人所知。太尉郗鉴派人到王家挑女婿，王家子弟个个矜持，只有他敞着衣襟躺在东边的床上吃东西，郗鉴便选中了他，“东床”的典故出自《世说新语·雅量》。

  他从秘书郎做起，在庾亮幕府任参军、长史，后来历任江州刺史、护军将军。他不愿留在京城，永和七年（351 年）出任右军将军、会稽内史，后人因此称他“王右军”。在任上他遇到饥荒就开仓赈济，多次上书议论赋役和漕运的弊端，还写信劝阻殷浩北伐。永和九年三月三日，他与谢安、孙绰等四十余人在山阴的兰亭聚会，饮酒赋诗，他为诗集写了序，就是《兰亭集序》。

  他与出身太原王氏的王述素来不和。王述出任扬州刺史，成了他的上司，派人检查会稽郡的政务。他深以为耻，永和十一年（355 年）称病辞官，在父母墓前发誓不再出仕。此后他与东南一带的名士游览山水，钓鱼采药，又与道士往来，他家世代信奉五斗米道。去世后朝廷追赠官职，他的儿子们遵照遗嘱没有接受。

  他早年向卫夫人学习书法，后来广泛取法张芝、钟繇等前人，把汉魏以来质朴的字体变得流美多姿，楷书、行书、草书都对后世影响极大。本传记有他为山阴道士抄写经书换取一群鹅的故事。唐太宗极爱他的字，亲自为《晋书》本传写了评论，并四处搜求他的手迹；《兰亭集序》的真迹相传随葬于太宗的昭陵。他的亲笔今天已不可见，流传的是唐代以来的摹本和刻帖。他的第七子王献之也以书法著称，父子并称“二王”。
sources: []
recalled:
  - 《晋书·王羲之传》
  - 《世说新语》
  - 孙过庭《书谱》
