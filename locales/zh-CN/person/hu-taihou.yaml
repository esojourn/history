name: 胡太后
aliases: [灵太后, 宣武灵皇后]
role: 皇太后
summary: 魏孝明帝的生母，两度临朝听政，崇佛奢靡，河阴之变中被尔朱荣沉入黄河。
body: |-
  胡氏是安定临泾人，父亲胡国珍。她在魏宣武帝时入宫。据《魏书·皇后传》，因为北魏有“子贵母死”的旧制，宫中嫔妃都祈祷不要生太子，她却说不能因为怕死而让皇家断了嫡嗣。永平三年（公元 510 年）她生下元诩，宣武帝没有按旧制处死她。延昌四年（515 年）宣武帝去世，六岁的元诩即位，即孝明帝，她被尊为皇太后，临朝听政。

  她笃信佛教，在洛阳建造了永宁寺，寺中九层木塔极为高大；又派宋云、惠生等人出使西域求取佛经。她执政期间赏赐无度，宗室贵族竞相奢侈，朝政日益腐败。正光元年（520 年），领军将军元叉与宦官刘腾发动政变，把她幽禁起来；孝昌元年（525 年），她重新临朝。这时北方六镇已经起事，各地动乱不断。

  孝明帝长大后不满她宠信郑俨、徐纥等人，暗中召尔朱荣领兵入京。武泰元年（528 年）二月，孝明帝突然死去，史书多说是她毒死的。她立三岁的元钊为帝。尔朱荣以替孝明帝报仇为名进军洛阳，同年四月，把她和元钊沉入黄河（另见“河阴之变”条）。她的生年史书没有记载。
sources: []
recalled:
  - 《魏书·皇后传·宣武灵皇后胡氏》
  - 《资治通鉴》卷一百四十八至一百五十二
