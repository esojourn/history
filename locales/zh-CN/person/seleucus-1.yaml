name: 塞琉古一世
aliases: [胜利者塞琉古, 塞琉古·尼卡托]
role: 塞琉古王朝创立者
summary: 亚历山大的部将，自巴比伦起家，据有从叙利亚到中亚的土地，建立塞琉古王朝。
body: |-
  马其顿欧罗波斯人，安条克之子，约生于公元前 358 年。他随亚历山大东征，前 326 年希达斯皮斯河之战时统领持盾卫队。前 324 年苏萨的集体婚礼上，他娶了索格底亚那首领斯皮塔美涅斯之女阿帕玛；亚历山大死后，将领们大多抛弃了波斯妻子，他没有，阿帕玛是他的继承人安条克一世的母亲。

  前 323 年他出任伙伴骑兵的统领，是摄政佩尔狄卡斯的副手。佩尔狄卡斯在埃及受挫时，他是入帐行刺的将领之一。随后的特里帕拉狄索斯分封中，他得到巴比伦尼亚。前 316 年安提柯消灭欧迈尼斯后来到巴比伦，向他查问账目，他带着少数随从逃到埃及投奔托勒密。

  前 312 年托勒密在迦萨击败德米特里，塞琉古只带了一千人左右回到巴比伦，受到当地人欢迎，重新掌权。塞琉古王朝后来就从这一年起算纪年（巴比伦历法从前 311 年春起算），这种连续纪年的办法在西亚沿用了很久。此后几年他挡住了安提柯父子的反攻，并向东收取米底、波斯直到巴克特里亚的各省。约前 305 年他称王。

  他越过印度河，遇到新兴的孔雀王朝的旃陀罗笈多。约前 303 年双方订约，据斯特拉波，他让出印度河以西邻近的若干地区，结为姻亲，换得五百头战象。前 301 年他带着这些战象赶到小亚细亚，与利西马科斯会师，在伊普苏斯击败安提柯，象队挡住德米特里的骑兵是取胜的关键。战后他分得叙利亚，重心随之西移。

  他建的城很多：约前 305 年在底格里斯河畔建塞琉西亚，取代巴比伦成为东方的都会；前 300 年在叙利亚北部建安条克（以父亲的名字命名）及其外港塞琉西亚、阿帕米亚、劳狄基亚四城。约前 294 年他让儿子安条克一世做共治者，掌管幼发拉底河以东，并把自己年轻的妻子斯特拉托尼刻让给了他；普鲁塔克和阿庇安说，这是因为医生发现安条克对继母相思成疾。前 285 年他俘获并软禁了斯特拉托尼刻的父亲德米特里。

  前 281 年他在库鲁佩狄翁击败利西马科斯，得到小亚细亚。同年他渡过赫勒斯滂海峡，要去接收阔别五十年的马其顿，在利西马基亚附近被随行的托勒密·克劳诺斯刺死。亚历山大的部将至此全部谢世。
sources: []
