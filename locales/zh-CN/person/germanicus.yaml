name: 日耳曼尼库斯
aliases: [日耳曼尼库斯·尤利乌斯·恺撒, 格马尼库斯]
role: 罗马将领
summary: 提比略的侄子和养子，统兵渡莱茵河作战，三十三岁死在叙利亚。
body: |-
  日耳曼尼库斯生于公元前 15 年 5 月 24 日，父亲是莉薇娅的次子大德鲁苏斯，母亲是安东尼的女儿小安东尼娅。公元 4 年，奥古斯都让提比略收他为养子。他娶奥古斯都的外孙女大阿格里皮娜，子女中有后来的皇帝卡利古拉和尼禄的母亲小阿格里皮娜。

  公元 14 年奥古斯都去世，莱茵河的军团哗变，有人要拥立他，他拒绝并平息了事端。此后三年他几次渡过莱茵河，到条顿堡森林掩埋了瓦卢斯部下的遗骨，夺回丢失的三面鹰旗中的两面，16 年在威悉河边打败阿米尼乌斯。提比略把他召回，17 年为他举行凯旋式，随后派往东方。

  在东方他与叙利亚总督皮索不和。19 年 10 月 10 日他在安条克附近病死，临终认定是皮索下的毒。消息传到罗马，民众极为悲痛；皮索受审，没等判决就自杀了。塔西佗的记述明显偏向他。
sources: []
recalled:
  - 塔西佗《编年史》卷 1—3
  - 苏维托尼乌斯《罗马十二帝王传·卡利古拉传》第 1—6 章
