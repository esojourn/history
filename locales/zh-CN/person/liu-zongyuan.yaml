name: 柳宗元
aliases: [柳子厚, 柳河东, 柳柳州]
role: 文学家、柳州刺史
summary: 唐代文学家，参与永贞革新后被贬永州、柳州，与韩愈倡导古文运动，并称“韩柳”。
body: |-
  柳宗元字子厚，祖籍河东解县，所以后人称他柳河东，大历八年（公元 773 年）生于长安。贞元九年（793 年）他二十一岁考中进士，与刘禹锡同榜，此后又考中博学宏词科，任集贤殿正字、蓝田县尉、监察御史里行等职。他与刘禹锡等人一起结交王叔文。

  永贞元年（805 年）唐顺宗即位，王叔文主政，柳宗元任礼部员外郎，参与了这次革新（另见“永贞革新”条）。同年八月顺宗让位，王叔文等人被贬，柳宗元先被贬为邵州刺史，途中再贬为永州司马；与他同时被贬为远州司马的共有八人，史称“二王八司马”。

  他在永州住了十年，官职闲散，常游山玩水，写了《始得西山宴游记》《钴鉧潭记》《小石潭记》等一组山水游记，后人称“永州八记”。他还写了《捕蛇者说》，借捕蛇人之口说赋税比毒蛇更可怕；又写了《封建论》，论证郡县制胜于分封制，以及许多寓言和诗。

  元和十年（815 年）他和刘禹锡等人被召回长安，不久又被外放为更远的州刺史，他被派往柳州。刘禹锡被派往播州，据韩愈所作墓志铭，柳宗元因为刘禹锡家有老母，上书请求与刘禹锡对调，后来刘禹锡改授连州。他在柳州兴办学校，开凿水井，并设法让以身抵债的奴婢用做工的工钱赎回自由。元和十四年（819 年）他在柳州去世，年四十七。

  柳宗元和韩愈都提倡古文，世称“韩柳”（另见“古文运动”条）。两人在许多问题上见解不同，韩愈排佛，柳宗元则与僧人交往，认为佛教有与儒家相合之处。他死后，韩愈为他写了《柳子厚墓志铭》，刘禹锡为他编了文集。后世把他列为唐宋八大家之一。
sources: []
recalled:
  - 《旧唐书·柳宗元传》
  - 《新唐书·柳宗元传》
  - 韩愈《柳子厚墓志铭》
  - 《柳河东集》
