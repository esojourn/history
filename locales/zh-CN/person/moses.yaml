name: 摩西
aliases: []
role: 以色列人的领袖、立法者
summary: 带领以色列人出埃及，在西奈山领受律法，率众在旷野四十年。
body: |-
  摩西属利未支派，父亲暗兰，母亲约基别（《出埃及记》6:20），生在以色列人寄居的埃及。当时法老下令把希伯来人所生的男孩都丢在河里（1:22）。他母亲把他藏了三个月，后来放在一个蒲草箱里，搁在河边的芦荻中；法老的女儿来洗澡时发现了他，收为自己的儿子，给他起名叫摩西（2:1–10）。

  摩西长大后，见一个埃及人打希伯来人，就把那埃及人打死，事情传开后逃往米甸，在那里娶了米甸祭司的女儿西坡拉，为岳父牧羊（2:11–22、3:1）。新约《使徒行传》第 7 章说，他出逃时将近四十岁，在米甸又过了四十年。他在何烈山看见荆棘被火烧着却没有烧毁，神从荆棘里呼叫他，差他去领以色列人出埃及（第 3—4 章）。

  摩西和哥哥亚伦去见法老。据《出埃及记》7:7，那时摩西八十岁，亚伦八十三岁。法老不肯放人，埃及遭了十样灾，末一样是长子都被击杀；以色列人守了逾越节，离开埃及，过了红海（第 7—14 章）。此事按经文数字推算约在公元前 1446 年。同年在西奈山，摩西上山领受十诫和律例，在山上四十昼夜；下山见百姓拜金牛犊，就把两块法版摔碎，后来又上山另得两块（第 19—34 章）。

  因为百姓在加低斯听了探子的报告不肯进迦南，以色列人在旷野漂流了四十年。在米利巴，摩西用杖击打磐石出水；耶和华说他和亚伦没有在以色列人眼前尊他为圣，所以不得领会众进入应许之地（《民数记》20:2–13）。摩西按神的吩咐立约书亚接续他（27:18–23），在约旦河东的摩押平原向百姓重申律法，这就是《申命记》的内容。

  据《申命记》第 34 章，摩西登上尼波山，从毗斯迦山顶观看了迦南全地，就死在摩押地，葬在伯毗珥对面的谷中，没有人知道他的坟墓在哪里。他死时一百二十岁，眼目没有昏花，精神没有衰败（34:7）。犹太教和基督教传统以他为五经的作者；近代不少学者认为五经经过长期编纂而成。
sources: []
