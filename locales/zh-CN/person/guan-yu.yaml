name: 关羽
aliases: [关云长, 汉寿亭侯, 壮缪侯]
role: 前将军
summary: 刘备的主要将领，镇守荆州，北攻樊城时声威大振，随即被孙权袭取后方，兵败被杀。
body: |-
  据《三国志·蜀书·关羽传》，关羽字云长，本字长生，河东解县人，早年逃亡到涿郡，生年不详。刘备在乡里聚集部众时，他与张飞前往投奔。本传说刘备与二人“寝则同床，恩若兄弟”；“桃园结义”是后世小说的情节，不见于史书。

  建安五年（公元 200 年）曹操东征刘备，关羽在下邳被俘。曹操任他为偏将军，待遇优厚。同年袁绍的大将颜良进攻白马，关羽随曹军前往解围，在万军之中刺杀颜良，取其首级而回，被封为汉寿亭侯。此后他把曹操的赏赐全部封存，留下书信告辞，回到当时在袁绍处的刘备身边；曹操没有让人追赶。

  赤壁之战后，关羽任襄阳太守、荡寇将军。刘备入蜀，留他总督荆州事务。建安二十四年（219 年）刘备称汉中王，拜关羽为前将军。这一年他率军北上，在樊城围攻曹仁。秋季汉水暴涨，曹操派来增援的于禁所部七军被淹，于禁投降，庞德被杀。本传说关羽“威震华夏”，曹操一度考虑迁都以避其锋芒。

  孙权此前与刘备争夺荆州已有嫌隙，这时与曹操联络，派吕蒙偷袭关羽的后方，留守江陵、公安的守将不战而降。关羽在樊城又被徐晃击败，南撤途中部众离散，退到麦城。建安二十四年十二月，他在临沮被孙权的军队截获，与儿子关平一同被杀；这时按公历已是 220 年初。蜀汉后来追谥他为壮缪侯。宋代以后历朝不断给他加封，民间奉为“关帝”，各地都建有庙宇。
sources: []
recalled:
  - 《三国志·蜀书·关张马黄赵传》
  - 《三国志·吴书·吕蒙传》
