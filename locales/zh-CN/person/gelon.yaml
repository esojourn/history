name: 革隆
aliases: [格隆, 盖隆]
role: 革拉与叙拉古僭主
summary: 以叙拉古为都称雄西西里，公元前 480 年在希梅拉击败迦太基。
body: |-
  西西里岛南岸革拉人，原是革拉僭主希波克拉底的骑兵统帅。希波克拉底死后，他名义上扶助其子，实际上于公元前 491 年自己夺取了政权。前 485 年，他趁叙拉古内乱，把被赶出城的地主送回去，顺势占有了这座城，并迁居于此，把革拉交给弟弟希耶隆。他把卡马里那的全部居民、革拉的半数居民和邻近几座城的富人迁入叙拉古。据希罗多德，他说平民是最讨厌的同住者，把被征服城市的平民卖到岛外为奴。叙拉古由此成为西方最大的希腊城市。

  前 481 年，希腊本土各邦派使者请他出兵抵御波斯。希罗多德说他答应提供两百艘战船和两万重装步兵，条件是由他担任统帅，至少统率海军或陆军之一；斯巴达和雅典的使者都不肯让步，他便什么也没有派。

  前 480 年，迦太基人以哈米尔卡为将，大举登陆西西里北岸，围攻希梅拉。革隆与岳父、阿克拉加斯僭主塞隆合兵，大败迦太基军，哈米尔卡死于此役。希罗多德说，西西里人传说这场战斗与萨拉米斯海战发生在同一天；狄奥多罗斯则说与温泉关之战同日。迦太基人此后七十年没有再进攻西西里的希腊人。他于前 478 年去世，希耶隆继位。
sources: []
recalled:
  - 希罗多德《历史》卷七第 153—167 章
  - 狄奥多罗斯《历史丛书》卷十一第 20—26、38 章
