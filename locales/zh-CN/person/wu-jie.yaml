name: 吴玠
aliases: [吴晋卿]
role: 南宋抗金将领
summary: 南宋抗金将领，在和尚原、仙人关多次击败金军，保住了川陕防线。
body: |-
  吴玠字晋卿，德顺军陇干（今甘肃静宁）人，生于元祐八年（公元 1093 年）。他少年从军，在西北抵御西夏，逐渐升任偏将。建炎四年（1130 年）张浚在富平与金军会战失败，陕西大部分落入金人之手，吴玠收拾残部，扼守大散关以东的和尚原。

  绍兴元年（1131 年）完颜宗弼率军进攻和尚原，吴玠与弟弟吴璘依托山险，以强弓劲弩轮番射击，大败金军，据记载宗弼中箭，仅以身免（另见“和尚原之战”条）。绍兴四年（1134 年）金军又以重兵进攻仙人关，吴玠兄弟再次击退。此后金军不敢轻易入蜀，四川得以保全。吴玠在汉中一带屯田，供给军粮。绍兴九年（1139 年）他病逝于仙人关，其弟吴璘继续镇守川陕。
sources: []
recalled:
