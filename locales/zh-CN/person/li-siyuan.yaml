name: 李嗣源
aliases: [邈佶烈, 李亶, 后唐明宗]
role: 后唐皇帝
summary: 李克用的养子，926 年被乱军拥立为后唐皇帝，在位七年，史称政局相对安定。
body: |-
  李嗣源是沙陀人，原名邈佶烈，咸通八年（公元 867 年）生于应州，少年时以善骑射为李克用所器重，被收为养子。他长期在晋军中作战，柏乡之战、解幽州之围、胡柳陂之战都有他的身影。同光元年（923 年），他率军袭取后梁的郓州，随后与李存勖一同直取开封，为灭梁立下首功。

  同光四年（926 年），魏州戍卒作乱，庄宗李存勖派他前去平定，他的部下却与乱军联合，拥他为主。他率军南下，途中庄宗在洛阳死于兵变（另见“兴教门之变”条），他进入洛阳，先称监国，不久即皇帝位，改名李亶，史称后唐明宗。

  明宗不识字，以亲信安重诲为枢密使，冯道等人为宰相。他即位后遣散了庄宗宠信的伶人和宦官，减少宫人，废除了一些苛捐杂税。欧阳修在《新五代史》里评价说，五代的君主中他在位时间算是长的，那几年战事稍息、连年丰收，百姓得以休养。长兴三年（932 年），冯道等人奏请由国子监校定九经、雕版印行，得到他的批准（另见“雕版印刷九经”条）。另一方面，安重诲专权，猜忌两川的孟知祥、董璋，激起两川叛乱，长兴二年（931 年）明宗杀了安重诲，此后孟知祥实际上割据了蜀地。

  长兴四年（933 年）十一月，明宗病重，他的儿子秦王李从荣领兵进入宫城，想抢先掌权，被禁军击杀。明宗受到惊吓，几天后去世，由另一个儿子李从厚继位。据宋代史书记载，明宗常在夜里焚香祷告上天，愿天早生圣人来安定天下；宋人又附会说宋太祖赵匡胤正是在他在位时出生的。
sources: []
recalled:
