name: 戴震
aliases: [东原]
role: 思想家、考据学家
summary: 乾嘉考据学皖派的代表，著《孟子字义疏证》批评理学“以理杀人”。
body: |-
  戴震是徽州休宁人，出身小商人家庭。据说他少年读《大学章句》时，曾问老师怎么知道朱熹的注释就是孔子、曾子的原意，老师无法回答。他早年师从江永，学习经学、天文、数学、音韵。乾隆十九年（1754 年）他为了躲避族人的诉讼来到北京，他的学问受到钱大昕、纪昀、王鸣盛等人的推重，从此知名。

  戴震多次参加会试都没有考中。乾隆三十八年（1773 年）四库全书馆开设，他以举人的身份被召为纂修官，负责校订天文、算学、地理等方面的书籍，从《永乐大典》中辑出了《九章算术》等多种古代算书。乾隆四十年（1775 年）他被特许参加殿试，赐同进士出身。

  戴震主张通过文字、音韵、训诂来理解经书的本义，“由字以通其词，由词以通其道”，是乾嘉考据学中“皖派”的代表人物，段玉裁、王念孙等都是他的学生。他晚年写成《孟子字义疏证》，批评程朱理学把“理”与人的情欲对立起来，认为“人死于法，犹有怜之者；死于理，其谁怜之”，主张“理存乎欲”。这部书在当时没有引起多少重视，到近代才受到胡适、梁启超等人的推崇。乾隆四十二年（1777 年）他在北京去世。
sources: []
recalled:
  - 段玉裁《戴东原先生年谱》
  - 戴震《孟子字义疏证》
  - 《清史稿·儒林传》
