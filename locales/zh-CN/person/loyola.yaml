name: "罗耀拉"
aliases: ["依纳爵·罗耀拉", "伊格纳修·罗耀拉", "圣依纳爵"]
role: "耶稣会创始人、首任总会长"
summary: "西班牙巴斯克贵族，负伤后弃武从教，著《神操》，创立耶稣会并任首任总会长。"
body: |-
  罗耀拉本名伊尼戈，1491 年生于西班牙巴斯克地区的罗耀拉城堡，是家里最小的孩子，年轻时在贵族门下做侍从和军官。《历史的轨迹》第三十章说，他在 1521 年的一场战役中负伤，养伤期间有人给他一本《圣徒言行录》，读后决定放弃军旅，跟随基督。那是 5 月法军攻打潘普洛纳时的事，炮弹打断了他的右腿。据他的自述，家里找不到骑士小说，他读的是一部基督生平和一部圣徒传。

  伤愈后他到蒙塞拉特的圣母像前挂起刀剑，在附近的曼雷萨住了将近一年，乞食、祈祷、苦修，把内心的经历记下来，后来成为《神操》：一套约四个星期的默想功课，由导师带领，默想罪、基督的生平与受难，最后选定自己一生的去向。1523 年他去了耶路撒冷，当地的方济各会士不准他留下。

  他回国从拉丁文法学起，时年三十三岁，后来在阿尔卡拉、萨拉曼卡读书，因为没有学位就指导别人灵修，几次被宗教裁判所拘押查问。1528 年他到巴黎大学，读了七年。该书说他在那里认识了方济各·沙勿略，两人在 1534 年组织了耶稣会。那年 8 月 15 日是他与沙勿略、法伯尔等六个同伴在蒙马特发愿，誓守贫穷、贞洁，去耶路撒冷，去不成就听凭教皇差遣。修会的正式成立，是 1540 年 9 月教皇保罗三世批准的。

  他被选为总会长，此后没有离开罗马，靠几千封信指挥散在各处的会士，并写成《会宪》。耶稣会不设统一的会衣，不集体唱日课，会士除三愿之外另发一愿，在传教的派遣上服从教皇。他们办学校，做君主的告解神父，到海外传教。该书说，由于耶稣会的努力，波兰、奥地利和德意志南部恢复了天主教。

  1556 年 7 月 31 日他在罗马去世，那时会士已有一千人左右。1622 年他与沙勿略同日被封为圣徒。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
recalled:
  - "罗耀拉《神操》（1548 年印行）"
  - "罗耀拉口述《自传》（卡马拉笔录）"
  - "《耶稣会会宪》"
  - "保罗三世诏书《战斗教会的治理》（1540 年）"
