name: 富弼
aliases: [富郑公, 富文忠]
role: 北宋宰相
summary: 北宋宰相，1042 年出使辽朝，以增加岁币化解辽朝索地的要求。
body: |-
  富弼是河南洛阳人，生于景德元年（公元 1004 年）。他年轻时受到范仲淹的赏识，宰相晏殊把女儿嫁给了他。庆历二年（1042 年），辽朝乘宋夏交战之机，派使者要求宋朝归还“关南十县”之地。富弼两次出使辽朝，面见辽兴宗，坚持不割地，最后议定在澶渊之盟的基础上每年增加银十万两、绢十万匹，事情才平息。

  庆历三年（1043 年）他任枢密副使，与范仲淹、韩琦一同推行庆历新政，新政失败后出知外州。在青州任上，他组织救济河北流民，据宋人记载救活了很多人。至和二年（1055 年）他与文彦博同时拜相，神宗初年再度拜相，因反对青苗法等新法，熙宁二年（1069 年）罢相。此后他退居洛阳，与司马光、文彦博等人往来。元丰六年（1083 年）他在洛阳去世，谥“文忠”。
sources: []
recalled:
  - 《宋史·富弼传》
  - 《续资治通鉴长编》卷一百三十五至一百三十八
