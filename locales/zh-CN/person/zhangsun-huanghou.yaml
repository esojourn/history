name: 长孙皇后
aliases: [文德皇后, 长孙观音婢]
role: 皇后
summary: 唐太宗的皇后，长孙无忌之妹，以节俭、谨慎著称，常从旁规劝太宗。
body: |-
  长孙皇后是隋朝将领长孙晟的女儿，长孙无忌的妹妹，小字观音婢。长孙晟以出使突厥、离间突厥诸部闻名。她幼年丧父，由舅舅高士廉抚养。据《旧唐书·后妃传》，她十三岁时嫁给李世民。

  武德九年（公元 626 年）玄武门之变前夕，据记载她亲自到秦王府将士中慰勉，众人感奋。李世民即位后，她被立为皇后。她生活节俭，服饰器用够用就止。太宗有时与她谈论朝政，她以妇人不宜干预政事为由，不肯发表意见。她的哥哥长孙无忌位高权重，她多次请求太宗不要让外戚居于宰相之位。

  据《资治通鉴》，有一次太宗罢朝后发怒，说要杀了魏征这个“田舍翁”，她换上朝服向太宗道贺，说君主圣明，臣下才敢直言，太宗因而转怒为喜。她曾采集古代妇女的事迹，编成《女则》一书。

  贞观十年（636 年）六月，她在长安立政殿去世，年三十六。据记载，她临终嘱咐太宗亲近君子、远离小人；当时房玄龄因事被遣回家，她特别请求太宗不要弃用这位旧臣。她还要求丧事从简，因山为陵，不用棺椁之外的器物。太宗为她营建昭陵，此后亦葬于此。她的三个儿子中，李承乾、李泰先后卷入储位之争，最后即位的是第三子李治，即唐高宗。
sources: []
recalled:
  - 《旧唐书·后妃传》
  - 《新唐书·后妃传》
  - 《资治通鉴》卷一百九十四
