name: 阿塔罗斯一世
aliases: [阿塔卢斯一世, 救主阿塔罗斯]
role: 帕加马国王
summary: 帕加马国王，击败加拉太人后称王，联合罗马对抗马其顿的腓力五世。
body: |-
  生于公元前 269 年。帕加马原是利西马科斯存放金库的一座山城，看守金库的菲勒泰罗斯在前 282 年前后改投塞琉古，此后他和侄子欧迈尼斯一世实际上自成一国，但不称王。阿塔罗斯是欧迈尼斯一世的堂侄和养子，前 241 年继位。

  定居在小亚细亚中部的加拉太人（渡海而来的高卢人）向周边各国索取贡金，他拒绝缴纳，在凯库斯河源头附近的会战中击败他们，年代约在前 238 年前后，不能确定。他由此取“救主”的称号，并开始称王，是这个王朝第一位国王。为纪念这场胜利，他在帕加马卫城的雅典娜圣所立了一组青铜群像，今天罗马所藏的大理石像《垂死的高卢人》《自杀的高卢人》一般认为是其仿制品。

  此后他击败塞琉古王室的安条克·希埃拉克斯，一度占有托罗斯山以西的小亚细亚，几年后又被塞琉古的将领阿凯乌斯夺回，只剩帕加马周围。他转而经营海上和希腊本土。第一次马其顿战争中，他与埃托利亚人、罗马人一起对抗腓力五世。前 205 年罗马人依神谕到小亚细亚迎请“大母神”的圣石，是由他协助办成的。

  前 201 年腓力五世在爱琴海扩张，他与罗得岛联合，在希俄斯岛外海与之海战，腓力随后蹂躏了帕加马城外的神庙。他和罗得岛人派使节到罗马控诉，促成罗马在前 200 年向腓力宣战。同年他到雅典，受到盛大欢迎，雅典人新设了一个以他命名的部落。

  前 197 年春，他在底比斯向彼奥提亚人演说、劝他们加入罗马一方时中风倒地，被送回帕加马，同年秋天去世，年七十二岁，在位四十四年。他与王后阿波罗尼斯有四个儿子，长子欧迈尼斯二世和次子阿塔罗斯二世先后继位；帕加马的大祭坛和图书馆是在他们手里建成的。
sources: []
