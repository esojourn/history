name: 庾亮
aliases: [庾元规]
role: 中书令、征西将军
summary: 晋明帝皇后之兄，成帝初年执政，执意征召苏峻入朝而激起变乱，后出镇武昌。
body: |-
  庾亮字元规，颍川鄢陵人，西晋末年随父亲南渡。《晋书》本传说他仪容出众，善于谈论，喜好老庄，而举止严整。晋元帝听说他的名声，为太子司马绍聘他的妹妹为妃，他也在东宫侍讲，与太子结为好友。

  太宁三年（公元 325 年）明帝去世，他与王导等人同受遗诏辅政。成帝年幼，他的妹妹庾太后临朝，朝政实际由他这个皇帝的舅舅决断。王导为政宽和，他则依法严办，杀了宗室南顿王司马宗，引起不少人不满。驻在历阳的流民帅苏峻兵力强盛，他认为终究是祸患，咸和二年（327 年）不顾王导等人反对，下诏召苏峻入朝任职，苏峻于是联合祖约起兵。

  第二年建康失陷，他逃到寻阳投奔温峤，两人一同推举陶侃为盟主，平定了叛乱。事后他请求外任以谢罪。咸和九年（334 年）陶侃去世，他接任都督六州军事，镇守武昌。咸康五年（339 年）他准备北伐后赵，前锋据守的邾城被石虎的军队攻陷，计划作罢。次年正月他去世，时年五十二。
sources: []
recalled:
  - 《晋书·庾亮传》
  - 《资治通鉴》卷九十三至九十六
