name: 阿西西的方济各
aliases:
  - 法兰西斯
  - 圣方济
  - 亚西西的法兰西斯
role: 方济会创立者
summary: 意大利阿西西富商之子，舍弃家产，以贫穷和讲道跟随基督，创立方济会。
body: |-
  方济各生于意大利翁布里亚的阿西西，生年有 1181、1182 年两说，父亲是富有的布商。《历史的轨迹》第十八章说他自幼过享乐的生活，二十岁时因一场危险的疾病归向基督。据他最早的传记，1202 年他参加阿西西与佩鲁贾的战事，被俘关了一年，回来后大病一场；此后几年间他逐渐改变，在城外破旧的圣达米亚诺小堂祷告时，觉得听见基督吩咐他“去修理我的房子”。他变卖父亲的布匹去修教堂，父亲告到主教那里，他当众脱下身上的衣服还给父亲，从此不再有家产。

  1208 年前后，他听到福音书里耶稣差遣门徒不带金银、不带口袋的话，认定这就是自己要过的生活。有人来跟随他，到有了十二个人时，他们去罗马请求教皇英诺森三世认可。《历史的轨迹》说这是在 1215 年拉特兰会议上的事；按早期传记，英诺森是在 1209 或 1210 年口头批准的，成文的会规到 1223 年才由何诺略三世正式批准。他们自称“小兄弟”。

  该书记述他的主张：弟兄们亲手做工，不计酬劳，不为明天忧虑，当天所需以外的都周济穷人；他爱一切受造之物，向小鸟讲道，称贫穷为他所爱的女士。他晚年写的《太阳兄弟颂》是意大利语最早的诗歌之一。1212 年阿西西的贵族女子克拉拉跟从他，后来成立了女修会。1219 年第五次十字军围攻埃及的达米埃塔时，他到军中，并越过阵线去向苏丹讲道。

  修会人数增长很快，在是否可以拥有房屋和书籍等事上起了分歧，他在 1220 年把管理的职务交给别人。据他的同伴记载，1224 年他在拉维纳山上禁食祷告时，身上出现了与基督钉痕相同的伤痕。他晚年多病，几乎失明，1226 年 10 月 3 日傍晚在阿西西城外去世，两年后被列为圣徒。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 切拉诺的托马斯《圣方济各传》（第一传、第二传）
  - 波纳文图拉《圣方济各大传》
  - 方济各《遗嘱》《太阳兄弟颂》与 1223 年会规
