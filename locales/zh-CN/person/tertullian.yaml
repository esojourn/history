name: 特土良
aliases:
  - 德尔图良
role: 迦太基的拉丁教父
summary: 迦太基人，第一位大量用拉丁文写作的基督教作家，“三位一体”一词出自他。
body: |-
  特土良约在公元 150 至 160 年间生于北非的迦太基。四世纪末的耶柔米说他父亲是一名百夫长。他受过很好的修辞和法律训练，《历史的轨迹》说他曾到罗马进修法律并执业律师；他与《学说汇纂》里那位同名的法学家是不是同一个人，学者看法不一。他成年以后才归信基督，时间约在公元 197 年以前。耶柔米说他是迦太基教会的长老，《历史的轨迹》沿用此说，但他自己的著作里没有提到这一点。

  他是第一位大量用拉丁文写作的基督教作家，传世著作三十多种。公元 197 年前后写成的《护教篇》向罗马的官长申辩，指出基督徒只因名称就被定罪是不合法理的。“殉道者的血是教会的种子”这句常被引用的话，就化自该书第 50 章。在《论异端的时效》里，他主张只有使徒所立的教会才有权解释圣经，书中问道：“雅典与耶路撒冷有什么相干？”他又写了五卷《驳马吉安》。

  在《驳帕克西亚》一书中，他用“三位一体”这个拉丁词来讲父、子、圣灵，又用“一个本质，三个位格”的说法，这些用语后来为西方教会沿用。《历史的轨迹》说，他对基督的认识并未超越游斯丁和爱任纽，但能用最清晰、最准确的字汇把教义说明白。

  约在公元 207 年以后，他转向孟他努派。这一派起于小亚细亚的弗吕家，强调圣灵新的启示和严格的操守，后来被大公教会定为异端。他晚年的著作责备大公教会对犯罪的信徒过于宽容。他去世的年份没有记载，最晚的著作约写于 220 年前后；耶柔米说他活到高龄。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三章“教会内部的成长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter04.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四章“教会全面得胜” https://wellsofgrace.com/books/spiritual/2000years/html/chapter05.html"
recalled:
  - 特土良《护教篇》第 50 章、《论异端的时效》第 7 章、《驳帕克西亚》
  - 耶柔米《名人传》第 53 章
  - 优西比乌《教会史》卷 2 第 2 章
