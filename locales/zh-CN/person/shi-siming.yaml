name: 史思明
aliases: [窣干, 大燕皇帝]
role: 安史叛军首领
summary: 安禄山的同乡与部将，安史之乱的另一位首领，杀安庆绪后称大燕皇帝，后被儿子所杀。
body: |-
  史思明原名窣干，是营州一带的胡人，与安禄山是同乡，也通晓多种语言，最初在营州做互市牙郎。后来他从军，在幽州节度使张守珪部下立功，唐玄宗赐名思明。安禄山兼任平卢、范阳节度使后，他是安禄山的主要部将之一。

  天宝十四载（755 年）安禄山起兵，他负责经略河北。次年他攻破常山，俘获颜杲卿；随后在嘉山被郭子仪、李光弼击败，但潼关失守后唐军撤出河北，他又占领了河北大部。至德二载（757 年）安禄山被儿子安庆绪所杀，史思明不服安庆绪，据守范阳，掌握了大量从两京运来的财物。同年唐军收复两京，他上表归降，被封为归义王、范阳节度使。

  次年唐朝谋划除掉他，事情败露，他再次反叛。乾元二年（759 年）三月，他率军救援被唐军九个节度使围困的邺城，唐军溃败（另见“相州之战”条）。随后他召安庆绪出城相见，把安庆绪杀死，回到范阳自称大燕皇帝，改范阳为燕京。同年秋他再次南下，攻占洛阳，但被李光弼牵制在河阳一带，无法西进。

  史思明偏爱少子史朝清，想废掉长子史朝义。上元二年（761 年）三月，他在进攻陕州受挫后，被史朝义的部将骆悦等人拘捕缢杀，史朝义即位（另见“史朝义”条）。
sources: []
recalled:
