name: 李茂贞
aliases: [宋文通, 岐王, 秦王]
role: 凤翔节度使、岐王
summary: 唐末凤翔节度使，曾劫持唐昭宗；唐亡后以岐王名义割据关西，924 年归附后唐。
body: |-
  李茂贞本名宋文通，深州博野人，早年在禁军中服役，因护卫唐僖宗有功被赐姓名李茂贞，光启三年（公元 887 年）起任凤翔节度使。唐昭宗时他凭借兵力干预朝政，多次进兵长安。天复元年（901 年），宦官劫持唐昭宗到凤翔投奔他，朱温率军围攻凤翔一年多，城中粮尽，他被迫交出昭宗，与朱温讲和。

  唐亡以后，他不承认后梁，以岐王的名义开设官署，继续使用唐朝的天祐年号，据有凤翔一带，但始终没有称帝。他的辖地后来被前蜀蚕食，势力日渐衰弱。同光元年（923 年）后唐灭梁，次年他上表称臣，被封为秦王，同年在凤翔去世，由儿子李从曮继任凤翔节度使。
sources: []
