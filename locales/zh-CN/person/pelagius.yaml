name: 伯拉纠
aliases:
  - 贝拉基
  - 皮拉久
role: 苦修教师
summary: 来自不列颠的苦修教师，否认原罪，主张人能凭自由意志行善，被教会定为异端。
body: |-
  伯拉纠约在公元 354 年前后生于不列颠，耶柔米在文章里讥讽过他的爱尔兰或不列颠出身。《历史的轨迹》第五章称他为英国僧侣；他过的是苦修生活，但没有记载表明他属于哪一所修道院，也没有担任圣职。他约在 380 年代到罗马，为人严谨，在贵族信徒中很受敬重，写过保罗书信的注释。

  他看到罗马信徒道德松懈，认为这是因为人们拿人性软弱作借口。据奥古斯丁记述，他听人引用《忏悔录》里“求你赐下你所命令的”一句，大为不满。他主张神既然吩咐人行善，人就有能力做到；亚当的罪只害了他自己，给后人留下的是坏榜样，婴儿生来无罪。奥古斯丁则主张人人生在罪中，若没有神的恩典先行，人就不能向善。

  公元 410 年罗马城陷落前后，他与学生色勒斯丢渡海到北非，不久转往巴勒斯坦。411 年迦太基的会议定了色勒斯丢的罪。415 年巴勒斯坦的两次会议审查伯拉纠本人，判他无罪。北非的主教不服，416 年开会再定其罪，并上诉罗马。罗马主教英诺森一世在 417 年定了他的罪；继任的佐西玛起初想翻案，418 年迦太基大会再次定罪、皇帝霍诺里乌也下令驱逐之后，才改变态度。

  此后伯拉纠不知所终，一般推测他不久死在东方。公元 431 年以弗所会议重申了对他学说的定罪。他的主张经人修改后，以“半伯拉纠派”的形式在高卢延续，529 年奥兰治会议加以否定。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
recalled:
  - 奥古斯丁《论伯拉纠的行事》《论恒忍的恩赐》第 20 章
  - 伯拉纠《致德米特里亚书》
  - 耶柔米《驳伯拉纠派对话录》、《耶利米书注释》序言
