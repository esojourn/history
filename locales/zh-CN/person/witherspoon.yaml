name: "约翰·维特斯普恩"
aliases: ["维特斯普恩", "威瑟斯庞"]
role: "长老会牧师、新泽西学院院长、《独立宣言》签署人"
summary: "苏格兰来的长老会牧师，任新泽西学院院长，是唯一签署《独立宣言》的牧师。"
body: |-
  《历史的轨迹》第四十三章讲独立战争时说，新英格兰大部分教牧人员和圣公会信徒仍效忠英国，南部各殖民地站在美国一边，中部一半一半；牧师的处境尴尬，因为他们按立时都宣誓效忠教会元首英国国王。但除少数例外，其余教会的牧师几乎全体支持独立，许多人以反抗英国为神圣使命，也有很多人做了随军牧师。书中特别提到长老会的杰出领袖维特斯普恩被选为大陆会议代表，是《独立宣言》签署人中唯一的牧师。

  据一般记载，他 1723 年生于苏格兰东洛锡安的吉福德，在爱丁堡大学读书，在苏格兰教会牧会多年，属于反对温和派的福音派。1768 年他应聘到北美任新泽西学院（今普林斯顿大学）院长，扩充课程，培养了许多后来的政界人物。1776 年起他代表新泽西出席大陆会议，此后又参与起草《邦联条例》；1789 年美国长老会第一次总会由他主持开会。他晚年双目失明，1794 年在普林斯顿附近去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十三章“新兴国家的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter48.html"
