name: 塞尔维乌斯·图利乌斯
aliases: [塞尔维乌斯]
role: 传说中的罗马第六位国王
summary: 传说中的罗马第六位国王，相传创立人口普查和按财产划分的百人队制度。
body: |-
  相传为罗马第六位国王，传统上定在公元前 578 年至前 535 年在位。出身有多种说法：李维说他的母亲奥克里西娅是拉丁城市科尔尼库鲁姆被攻陷后带到王宫的贵妇；另一说她是女奴，“塞尔维乌斯”一名即由此而来。传说他幼时睡觉，头上冒出火焰而无伤，王后塔娜奎尔认为他将成大器，把他当作王子抚养，后来招为女婿。皇帝克劳狄在一篇演说里提到，按伊特鲁里亚人的说法，他本名马斯塔尔纳，是伊特鲁里亚首领凯利乌斯·维本纳的伙伴。

  老塔克文遇刺后，他在塔娜奎尔安排下先代行王权，未经人民选举就做了国王，后来才补行表决。罗马人把几项基本制度归于他：举行第一次人口和财产普查；按财产多少把公民分为若干等级和百人队，财产多的出重装步兵，在百人队大会上先投票；按居住地而不是血缘划分部落，城内分四个区。传说他还修了环绕七丘的城墙，并在阿文提诺山为拉丁各城共建狄安娜神庙。现存称作“塞尔维乌斯城墙”的石墙，主体建于前 4 世纪高卢人入侵之后。

  据李维，他的小女儿图利娅与丈夫、老塔克文之子（一说孙子）卢基乌斯·塔克文合谋夺位。塔克文闯进元老院自坐王位，把赶来的塞尔维乌斯扔下台阶，随后派人把他杀死在街上；图利娅驱车从父亲的尸体上碾过，那条街后来叫“罪恶街”。

  现代学者认为，百人队制度反映的是重装步兵战术传入后的军事改革，其完整形式要晚于前 6 世纪；传说把逐步形成的制度归到了一个人名下。
sources: []
recalled:
  - 李维《建城以来史》卷一
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷四
  - 克劳狄皇帝里昂铜版演说辞
