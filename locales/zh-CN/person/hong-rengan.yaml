name: 洪仁玕
aliases: [干王]
role: 太平天国干王，《资政新篇》的作者
summary: 洪秀全的族弟，在香港接触西方文化，1859 年到天京封为干王，提出《资政新篇》。
body: |-
  洪仁玕是广东花县人，洪秀全的族弟，是拜上帝会最早的信徒之一。金田起事时他没有赶上，此后被清朝通缉，逃到香港，在那里跟随西方传教士学习，在伦敦会的传教机构中工作了几年，接触了西方的政治、经济和科学知识。

  咸丰九年（1859 年）洪仁玕辗转到达天京，洪秀全十分高兴，封他为干王，总理朝政。同年他提出了《资政新篇》，主张学习西方，兴办铁路、轮船、银行、邮政，开矿、办报，奖励发明，允许私人投资，与外国平等通商，这是中国近代较早提出的比较系统的学习西方的方案。洪秀全批准了这份方案，但在战争环境下大多没有实行。

  由于洪仁玕没有军功，太平军的将领们对他并不服气，他的施政受到很大限制。同治三年（1864 年）天京陷落后，他护送幼天王洪天贵福在江西一带流亡，十月在江西石城被清军俘获，十一月在南昌被处死。
sources: []
recalled:
  - 洪仁玕《资政新篇》
  - 《洪仁玕自述》
  - 罗尔纲《太平天国史》
