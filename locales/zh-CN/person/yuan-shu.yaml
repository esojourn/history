name: 袁术
aliases: [袁公路]
role: 左将军
summary: 汉末割据淮南的军阀，袁绍的从弟，建安二年在寿春称帝，两年后败亡。
body: |-
  据《三国志·魏书·袁术传》，袁术字公路，汝南汝阳人，司空袁逢之子，与袁绍同族，生年不详。灵帝末年任虎贲中郎将。董卓入京后他逃到南阳；恰好长沙太守孙坚北上杀了南阳太守，袁术便占据南阳，以孙坚为部将进攻董卓。

  他与袁绍不和，各自联络外援互相牵制。初平四年（公元 193 年）他被曹操击败，退到淮南，以寿春为根据地。孙坚死后，其子孙策在他手下领兵，后来渡江攻取江东。

  建安二年（197 年）袁术在寿春称帝，国号“仲”。孙策写信与他断绝关系，吕布、曹操先后出兵进攻，他的部众逐渐离散。本传说他生活奢侈，而当时江淮之间饥荒严重。建安四年（199 年）他打算北上投奔袁绍之子袁谭，被曹操派出的刘备等人拦截，退回寿春附近的江亭，六月病死。
sources: []
recalled:
  - 《三国志·魏书·董二袁刘传》
  - 《后汉书·刘焉袁术吕布列传》
