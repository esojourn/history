name: 安东尼·庇护
aliases: [安敦尼·庇护, 安东尼努斯·皮乌斯, 安敦宁·毕尤]
role: 罗马皇帝
summary: 五贤帝中的第四位，在位二十三年，帝国大体太平。
body: |-
  安东尼·庇护于公元 86 年 9 月 19 日生在罗马东南的拉努维乌姆附近，家族出自高卢南部的内毛苏斯，祖父和外祖父都做过执政官，家产极厚。他 120 年任执政官，后来是哈德良派在意大利的四位巡回法官之一，135 年前后任亚细亚总督，在各任上名声都很好。

  138 年 2 月，病重的哈德良收他为养子，条件是他同时收养妻子的侄子马可·奥勒留，以及哈德良原定继承人的儿子卢基乌斯·维鲁斯。7 月哈德良去世，他继位，时年五十一岁。元老院不肯为哈德良封神，他坚持办成了。“庇护”意思是恭敬尽孝，《罗马帝王纪》为这个称号列了好几种解释，这是其中之一。

  他在位二十三年，是奥古斯都以后最长的，其间没有离开过意大利，战事都交给各地总督。142 年前后，不列颠总督把防线从哈德良长城向北推进，在福斯湾与克莱德湾之间筑起一道土墙，后世称为安东尼长城，二十来年后又放弃了。148 年罗马庆祝建城九百年。皇后福斯蒂娜在 141 年前后去世，他为她建了神庙，至今立在罗马广场边上，又以她的名义设立资助孤女的基金。他留下的法律批复中，有主人无故杀死奴隶要治罪的规定。据卡西乌斯·狄奥，他去世时国库存有二十七亿塞斯特斯。

  161 年 3 月 7 日他在罗马西郊的洛里乌姆庄园去世。《罗马帝王纪》说，他最后给卫队的口令是“镇定”。马可·奥勒留在《沉思录》第一卷里用很长的一段追述从他身上学到的东西。

  《后汉书·西域传》记，延熹九年（166 年）“大秦王安敦”遣使从日南郡境外来献象牙、犀角、玳瑁。“安敦”一般认为是“安东尼”的译音，这时在位的已是也用这个名字的马可·奥勒留；来人究竟是使节还是商人，学者看法不一。
sources: []
