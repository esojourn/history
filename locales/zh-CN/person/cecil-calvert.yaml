name: "塞西尔·卡尔弗特"
aliases: ["第二代巴尔的摩男爵", "巴尔的摩勋爵"]
role: "马里兰殖民地领主"
summary: "天主教徒领主，建马里兰殖民地，1649 年推动通过《信仰容忍法》。"
body: |-
  《历史的轨迹》第四十一章说，罗马天主教随马里兰殖民地的设立来到美洲。1632 年英王查理一世把切萨皮克湾一带的土地颁给乔治·卡尔弗特及其子孙，封他为第一代巴尔的摩勋爵；他当时已是天主教徒，以王后之名称之为马里兰。乔治在获颁之后不久去世，他的儿子塞西尔继为第二代巴尔的摩勋爵，1634 年建立了马里兰殖民地。据一般记载，乔治 1625 年公开改宗天主教，书中说他“当时刚成为天主教徒”，与此略有出入；塞西尔本人终生没有到过马里兰。

  该书说，巴尔的摩勋爵是第一个把宗教自由写进法律的人，但他和威廉斯不同，这是一种“政策”而不是一项“原则”：为了让殖民地兴旺，他必须把土地卖给移民，而当时来美洲的大多是复原教徒，天主教徒很少，为保障少数天主教徒，只得宣布宗教自由。唯有不信三位一体的人不在容忍之列，可处死刑。1649 年，在他的要求下，马里兰议会通过了《信仰容忍法》，书中称之为美洲宗教自由史上的里程碑。1692 年巴尔的摩家族失去了在美洲的产业，马里兰成为王室殖民地，英国国教在那里设立起来。他 1675 年去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十一章“教会进入新大陆” https://wellsofgrace.com/books/spiritual/2000years/html/chapter46.html"
