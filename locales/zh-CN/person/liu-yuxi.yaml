name: 刘禹锡
aliases: [刘梦得, 诗豪]
role: 诗人、太子宾客
summary: 唐代诗人，参与永贞革新后长期被贬，与白居易唱和，被白居易称为“诗豪”。
body: |-
  刘禹锡字梦得，大历七年（公元 772 年）生，自称祖籍中山，一般认为生于苏州嘉兴。贞元九年（793 年）他与柳宗元同榜考中进士，此后在淮南节度使杜佑幕府中任职，又任监察御史。永贞元年（805 年）王叔文主政，他任屯田员外郎，协助管理财政，是革新的骨干之一。顺宗让位后，他先被贬为连州刺史，途中改贬为朗州司马，成为“八司马”之一（另见“永贞革新”条）。

  他在朗州住了将近十年。元和十年（815 年）他被召回长安，写了一首游玄都观看桃花的诗，有“玄都观里桃千树，尽是刘郎去后栽”之句，被认为讽刺朝中新贵，随即被外放为播州刺史，经柳宗元、裴度等人求情，改为连州。此后他历任夔州、和州刺史，在夔州时仿照当地民歌写了《竹枝词》。

  宝历二年（826 年）他罢和州刺史北归，在扬州遇见白居易，写下“沉舟侧畔千帆过，病树前头万木春”的诗句。大和二年（828 年）回到长安，他再游玄都观，又写了一首诗，说当年种桃的道士已不知去向。后来他历任苏州、汝州、同州刺史，晚年在洛阳任太子宾客，与白居易、裴度等人唱和，白居易称他为“诗豪”。会昌二年（842 年）他在洛阳去世，年七十一。

  他的诗以咏史和民歌风格的作品著称，如《乌衣巷》《石头城》《西塞山怀古》等。流传很广的《陋室铭》一般署他的名，但最早见于宋人的记载，有学者对作者是否是他提出过疑问。
sources: []
recalled:
