name: 颛顼
aliases: [高阳氏, 帝颛顼]
role: 传说中的五帝之一
summary: 《史记》所记五帝之二，黄帝之孙，号高阳氏。
body: |-
  颛顼是传说时代的人物。据《史记·五帝本纪》，他是黄帝之孙、昌意之子，号高阳，黄帝死后继位。司马迁形容他“静渊以有谋，疏通而知事”，又说他的教化所及，北至幽陵，南至交阯，西至流沙，东至蟠木，这些都是概括性的颂辞。

  《国语·楚语下》记楚国大夫观射父的话，说少皞衰落时“民神杂糅”，颛顼命重主管天上的神事、命黎主管地上的民事，称为“绝地天通”。这是古书里关于颛顼最有名的一条记载，常被用来讨论上古宗教的演变。《左传》昭公十七年说卫国所在的帝丘是“颛顼之虚”，所以后世以今河南濮阳一带为颛顼的都邑。

  据《史记》，颛顼死后，由黄帝的曾孙、玄嚣之孙高辛继位，就是帝喾。楚国王族自认为是颛顼的后代，屈原《离骚》开篇即说“帝高阳之苗裔兮”。
sources: []
recalled:
  - 《史记·五帝本纪》
  - 《国语·楚语下》
  - 《左传》昭公十七年
  - 《楚辞·离骚》
