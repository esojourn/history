name: 长孙无忌
aliases: [长孙辅机, 赵国公]
role: 太尉
summary: 唐太宗的妻兄和功臣，参与策划玄武门之变，辅佐高宗，因反对立武后被逼死。
body: |-
  长孙无忌字辅机，是隋将长孙晟的儿子、长孙皇后的哥哥。他与李世民自幼交好，李渊起兵后投奔李世民，常随军征战。武德九年（公元 626 年），他与房玄龄、杜如晦等人一同劝李世民先发制人，是玄武门之变的主要策划者之一。

  太宗即位后，他历任吏部尚书、尚书右仆射、司空、司徒等职，被封为赵国公。贞观十七年（643 年）太宗命人在凌烟阁画二十四位功臣的像，他名列第一。同年太子李承乾谋反被废，魏王李泰与晋王李治争立，他力主立晋王，太宗最终采纳。太宗临终前，把太子托付给他和褚遂良。

  高宗即位初年，他以元舅的身份辅政，任太尉、同中书门下三品，权势最盛。永徽年间，他主持修订律令，并为《唐律》撰写疏议，于永徽四年（653 年）颁行，就是今天所见的《唐律疏议》（另见该条）。同年房遗爱等人谋反案发，他借机牵连杀死了吴王李恪等人。

  永徽六年（655 年）高宗要废王皇后、立武昭仪为后，他与褚遂良、韩瑗等人反对，遭到高宗和武后的疏远（另见“废王立武”条）。显庆四年（659 年），许敬宗诬告他谋反，高宗不加对质，削去他的官爵，流放黔州。同年七月，朝廷派人到黔州重审此案，逼他自缢而死。上元元年（674 年）高宗为他恢复了官爵。
