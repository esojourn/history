name: 赫拉克利特
aliases: []
role: 哲学家
summary: 以弗所人。讲万物流变、对立统一，以文辞晦涩著称。
body: |-
  小亚细亚以弗所人，盛年约在公元前 500 年前后，生卒年是由此推出的约数。关于他的生平，材料主要是七百年后第欧根尼·拉尔修的记述，其中许多是后人从他的言论里附会出来的。据说他出身以弗所的王族，按世袭可任“王”这一祭司性质的职位，他让给了弟弟。又说他写成一部书，存放在以弗所的阿耳忒弥斯神庙里。关于他得水肿病、把自己埋在牛粪里而死的故事，不可信。

  他的著作没有流传下来，今存一百多条残篇，都是后来的作家引用的，多是简短的格言，古人已称他为“晦涩者”。他说有一个“逻各斯”，万物都依它而生，人们却听而不闻。他把世界比作一团“永恒的活火”，按一定的分寸燃烧，按一定的分寸熄灭。对立的东西在他看来是一体的：上坡的路和下坡的路是同一条；弓和琴的和谐来自相反的张力；“战争是万物之父”。

  “人不能两次踏进同一条河”这句话，出自柏拉图在《克拉底鲁》中的转述；残篇里的原话是，踏进同一条河的人，流过他的是不同的、又不同的水。柏拉图和亚里士多德把他的学说概括为“一切皆流”。

  他对前人和同时代人多有贬斥，说博学并不使人有见识，否则赫西俄德、毕达哥拉斯、克塞诺芬尼早就有见识了；又说荷马应当从竞技会上被赶出去挨鞭子。他对后来的斯多亚学派影响很大。
