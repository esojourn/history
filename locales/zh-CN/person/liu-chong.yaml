name: 刘崇
aliases: [刘旻, 北汉世祖]
role: 北汉皇帝
summary: 刘知远之弟，951 年在太原称帝，史称北汉，依附契丹；954 年高平之战大败。
body: |-
  刘崇是刘知远的弟弟，后来改名刘旻。后汉建立后，他出任河东节度使，镇守太原。乾祐三年（公元 950 年）郭威起兵入开封，刘承祐被杀，郭威一度宣称要迎立刘崇的儿子刘赟为皇帝，随后自己称帝，刘赟也被杀害。

  广顺元年（951 年）正月郭威建立后周，同月刘崇在太原称帝，仍用乾祐年号，国号汉，史称北汉。北汉只有河东十余州，地狭兵少，刘崇向契丹求援，自称“侄皇帝”，接受契丹的册封。他几次联合契丹进攻后周，都未成功。

  显德元年（954 年）郭威去世，刘崇以为柴荣新立、可以乘机进取，联合契丹大举南下。柴荣亲自迎战，两军在高平相遇，北汉军大败（另见“高平之战”条），刘崇仅带百余骑逃回太原。同年十一月，他忧愤成疾而死，儿子刘承钧继位。北汉此后又延续了二十多年，直到 979 年才被北宋所灭。
sources: []
recalled:
  - 《旧五代史·僭伪列传·刘崇》
  - 《新五代史·东汉世家》
  - 《资治通鉴》卷二百九十至二百九十二
