name: 马吉安
aliases:
  - 马西昂
role: 异端领袖
summary: 二世纪自立教会的领袖，拒绝旧约，只承认删订过的路加福音和十封保罗书信。
body: |-
  马吉安生在黑海南岸本都省的锡诺普，据说是一位富有的船主。《历史的轨迹》说他在君士坦丁堡发迹后到罗马，但君士坦丁堡要到四世纪才建城，这一处应是笔误；早期记载一致说他来自本都。他约在公元 140 年前后到罗马，据特土良记载，他向罗马教会捐了一大笔钱，约在 144 年被罗马教会开除，钱也退还给他。

  他认为旧约中的神与耶稣所启示的慈爱的父不是同一位，因而拒绝整部旧约。他编定了自己的经书：一部删订过的路加福音，加上十封保罗书信。许多学者认为，正统教会确定新约书目的过程，有一部分就是为回应马吉安而推动的。《历史的轨迹》把他算作诺斯底派的领袖；今天的学者多把他和诺斯底派分开看待，因为他的学说里没有诺斯底派那套复杂的神话体系，但两者都有轻视物质世界的倾向。

  他的追随者另立教会，在东方存在了好几个世纪。坡旅甲在罗马遇见他时称他为"撒但的长子"，这件事见于爱任纽的记载。马吉安本人的著作没有流传下来，后人只能从特土良的《驳马吉安》等反驳他的书中了解他的学说。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三章“教会内部的成长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter04.html"
recalled:
  - 特土良《驳马吉安》卷 1、4
  - 爱任纽《驳异端》卷 1 第 27 章、卷 3 第 3 章第 4 节
