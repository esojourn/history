name: 汉哀帝
aliases: [刘欣, 孝哀皇帝]
role: 皇帝
summary: 汉元帝之孙，以定陶王入继成帝，在位六年，限田之议未行，宠信董贤，二十五岁去世。
body: |-
  刘欣是汉元帝的孙子，父亲定陶恭王刘康是成帝的异母弟。他三岁继承王位，由祖母傅太后抚养长大。成帝没有儿子，绥和元年（公元前 8 年）立他为太子，次年成帝去世，他继位，年约二十岁。

  据《汉书·哀帝纪》，他即位之初躬行节俭，裁撤乐府，亲自处理政事。大臣师丹、孔光、何武等提出，应当限制贵族、官吏和百姓占有田地与奴婢的数量，议定以三十顷为限。这个方案触动了外戚和宠臣的利益，结果搁置不行。他的祖母傅氏、母亲丁氏两家的外戚纷纷封侯任职，成帝朝掌权的王氏一时失势，王莽被罢官。

  建平二年（前 5 年），方士夏贺良等说汉朝的历数已到中衰，应当重新受命。他正在病中，便改元并更改帝号，一个多月后不见应验，又下诏取消，处死了夏贺良。他宠爱年轻的侍臣董贤，赏赐无度，最后任命二十二岁的董贤为大司马；丞相王嘉因反对加封董贤而下狱致死。

  他长期患病，元寿二年（前 1 年）六月在未央宫去世，没有儿子。他在位六年，去世时年约二十五岁。太皇太后王政君随即召回王莽，朝政重新落入王氏手中。
sources: []
recalled:
  - 《汉书·哀帝纪》
  - 《汉书·食货志上》
  - 《汉书·佞幸传》
