name: 冯云山
aliases: [南王]
role: 拜上帝会的组织者，太平天国南王
summary: 洪秀全的同乡，在紫荆山区发展拜上帝会，太平天国封为南王，1852 年战死。
body: |-
  冯云山是广东花县人，与洪秀全是同乡和同学，也是一名落第的读书人。道光二十三年（1843 年）他与洪秀全一起创立拜上帝会。次年他们到广西传教，洪秀全不久回到广东，冯云山留在桂平紫荆山区，一边当塾师、打短工，一边传教，几年间发展了数千名会众，杨秀清、萧朝贵等人就是在这一时期加入的。拜上帝会能够在广西扎根，冯云山出力最多。

  道光二十七年（1847 年）冯云山被当地士绅告发，被捕入狱，后来被押解回广东。在他离开期间，杨秀清、萧朝贵分别以“天父”“天兄”下凡附体的名义发号施令，在会中取得了很高的地位。冯云山回到广西后，承认了他们的地位。

  据说太平天国的许多制度，如天历、军制等，都与冯云山有关。咸丰元年（1851 年）在永安他被封为南王。咸丰二年（1852 年）太平军北上进攻湖南，在广西全州蓑衣渡附近，冯云山被清军的炮火击中，伤重而死。
sources: []
recalled:
  - 韩山文《太平天国起义记》
  - 罗尔纲《太平天国史》
