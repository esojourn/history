name: 希罗多德
aliases: []
role: 历史学家
summary: 哈利卡纳苏斯人，作《历史》记希波战争，被西塞罗称为“历史之父”。
body: |-
  小亚细亚西南岸的哈利卡纳苏斯人，这座城当时在波斯治下，居民是希腊人与卡里亚人杂处。生卒年都是约数：生年据古人的推算在公元前 484 年前后；他的书里提到的最晚的事发生在前 430 年左右，卒年当在此后不久。10 世纪的辞书《苏达》说，他因为反对僭主吕格达米斯而流亡萨摩斯，后来回乡参与驱逐僭主。这段记载的可靠程度不清楚。

  他游历很广，书中多处说到自己亲眼所见：在埃及溯尼罗河到过象岛，到过腓尼基的推罗、黑海北岸的希腊城市，可能还到过巴比伦；他在意大利南部和希腊本土各地向人打听。他在雅典住过，书中对雅典所知甚详。前 444 年前后雅典主持在意大利南部建立殖民城邦图里伊，据说他去了那里，所以古人也称他为“图里伊人希罗多德”。他死在何处，古人说法不一。

  他的著作后来被分为九卷。开篇说，写下这部探究的结果，是为了使人们做过的事不致因年深日久而被遗忘，使希腊人和异族人的伟大功业不致失去光彩，特别是要说明他们为什么彼此交战。前半部从吕底亚王克洛伊索斯讲起，随着波斯的扩张依次叙述吕底亚、米底、巴比伦、埃及、斯基泰的地理、风俗和往事；后半部写爱奥尼亚起义、马拉松，以及薛西斯的远征，直到前 479 年。他把“探究”一词用作书名，这个词后来就成了“历史”的意思。

  他常把听来的不同说法并列写下，声明自己的职责是把人们讲的记下来，并不一定都相信。修昔底德不点名地批评了这种为取悦听众而作的写法。西塞罗称他为“历史之父”，同时说他书里有无数传闻故事；普鲁塔克写过一篇《论希罗多德的恶意》。近代的考古发现和东方文献证实了他的不少记述，也显示出一些是误传。
sources: []
recalled:
  - 希罗多德《历史》序言；卷二第 29、44 章；卷七第 152 章
  - 修昔底德《伯罗奔尼撒战争史》卷一第 21—22 章
  - 西塞罗《论法律》卷一第 5 节
  - 《苏达》“希罗多德”条
