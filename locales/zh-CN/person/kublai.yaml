name: 忽必烈
aliases: [元世祖, 薛禅汗]
role: 元朝的建立者
summary: 拖雷之子，1260 年即大汗位，1271 年定国号“大元”，1279 年灭南宋。
body: |-
  忽必烈是拖雷和唆鲁禾帖尼的第四子，生于 1215 年。他青年时就留意汉地的人物和学问，延揽了一批汉族儒士和僧人。1251 年哥哥蒙哥即大汗位，委任他总领漠南汉地军国庶事，他在金莲川设立幕府，刘秉忠、姚枢、许衡、郝经等人先后进入幕府，为他出谋划策。1253 年他率军远征大理，次年平定（另见“蒙古灭大理”条）。1256 年他命刘秉忠在金莲川修建开平城，作为驻地。

  1258 年蒙哥亲征南宋，忽必烈率东路军进攻鄂州。次年蒙哥死于钓鱼城下，他接受南宋贾似道的求和，北返争位。1260 年他在开平即大汗位，建元中统，与在和林称汗的弟弟阿里不哥交战，1264 年阿里不哥投降（另见“忽必烈与阿里不哥争位”条）。1262 年汉人世侯李璮在山东叛乱，平定之后，忽必烈逐步削夺汉人世侯的兵权，实行军民分治。

  忽必烈采用汉法，建立中书省、枢密院、御史台和地方行省等机构（另见“行省制度”条），改开平为上都，在金中都东北修建新城，1272 年定名为大都，作为都城。至元八年（1271 年）他取《易经》“大哉乾元”之意，定国号为“大元”（另见“元朝建立”条）。随后他发动对南宋的全面进攻，1273 年攻下襄阳，1276 年南宋朝廷在临安投降，1279 年崖山海战后南宋灭亡（另见“襄阳之战”“崖山海战”条）。

  统一中国后，忽必烈继续向海外用兵，两次征日本都告失败（另见“元军征日本”条），征安南、占城、缅国、爪哇也代价沉重。他重用阿合马、卢世荣、桑哥等人理财，三人先后因聚敛被杀或被处死。他命八思巴创制蒙古新字，尊崇藏传佛教，同时也兴修水利、开通运河、修订历法。至元三十一年正月（1294 年），忽必烈在大都去世，由孙子铁穆耳即位，即元成宗。
