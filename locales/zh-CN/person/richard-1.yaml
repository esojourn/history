name: 理查一世
aliases:
  - 狮心王理查
  - 狮心理查
role: 英格兰国王
summary: 英格兰国王，第三次十字军的统帅，夺回阿卡，与萨拉丁议和，未能收复耶路撒冷。
body: |-
  理查 1157 年 9 月生于牛津，是英王亨利二世和阿基坦的埃莉诺的第三个儿子。他少年时受封母亲的阿基坦公国，在法国西南部长大，几次与兄弟一同起兵反对父亲。1189 年亨利二世去世，他继位为英格兰国王，同时领有诺曼底、安茹和阿基坦。“狮心”是同时代人给他的称号。

  1187 年耶路撒冷失守的消息传到西欧，他是最早宣誓参加十字军的王侯之一。即位后他出售官职、土地筹措军费，1190 年启程，在西西里过冬，次年途中占领了塞浦路斯，1191 年 6 月到达围攻已近两年的阿卡，7 月城破。法王腓力二世随即回国。8 月因赎金没有如期交付，理查下令处死被俘的守军，据英方的记载约有二千七百人。

  他沿海岸南下，9 月在阿尔苏夫击败萨拉丁，两次逼近耶路撒冷，都判断即使攻下也守不住而退回。1192 年 9 月他与萨拉丁订约停战三年，沿海归基督徒，耶路撒冷仍在穆斯林手中，基督徒可以去朝圣。《历史的轨迹》第十七章说，第三次十字军的三位君主里只有他到达，也只订了这样一个协约。

  回程中他在维也纳附近被奥地利公爵扣留，转交给皇帝亨利六世，英格兰为他付出十五万马克的赎金，1194 年才获释。此后他一直在法国与腓力二世作战。1199 年他围攻利穆赞的沙吕城堡时中弩箭，4 月 6 日伤重去世。在位十年，他留在英格兰的时间总共只有半年左右。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十七章“教会发起十字军运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter19.html"
recalled:
  - 《理查王东征纪行》
  - 豪登的罗杰《编年史》
  - 巴哈丁·伊本·沙达德《萨拉丁传》
