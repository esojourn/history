name: 韩熙载
aliases: [韩叔言]
role: 南唐大臣
summary: 北海人，后唐时南奔吴国，仕南唐三代君主；相传为避拜相而纵情声色，有《夜宴图》。
body: |-
  韩熙载是潍州北海人，字叔言，后唐同光年间考中进士。天成元年（公元 926 年）他的父亲在后唐的兵变中被杀，他逃往南方投奔吴国。据《资治通鉴》，他南下前与好友李穀告别，说如果江南用我为宰相，必当长驱北上平定中原；李穀回答说，如果中原用我为宰相，取江南就像探囊取物。后来李穀做了后周的宰相，参与谋划征伐南唐。

  韩熙载在南唐历仕烈祖、中主、后主三代，官至中书侍郎、光政殿学士承旨，以文章和才学著称。后主李煜时，南唐国势已衰，他在家中蓄养了许多歌伎，常常通宵宴饮。据宋人记载，后主曾想任他为宰相，他认为国家难以挽救，不愿担当，便故意放浪以自污。后主派画家顾闳中夜里到他家中观察，画成了《韩熙载夜宴图》（另见“顾闳中”条）。开宝三年（970 年）他去世，后主追赠他为平章事。
sources: []
