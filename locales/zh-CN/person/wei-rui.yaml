name: 韦叡
aliases: [韦怀文, 韦虎]
role: 名将
summary: 梁朝名将，天监六年与曹景宗在钟离大破北魏军，魏人称为“韦虎”。
body: |-
  韦叡字怀文，京兆杜陵人，出身关中大族京兆韦氏。齐末他任上庸太守，萧衍在襄阳起兵时，他率郡兵响应，是梁朝的开国将领之一。天监四年（公元 505 年）梁朝北伐，他率军攻合肥，筑堰拦截肥水，水涨后乘船攻城，攻克了合肥。

  天监六年（507 年），北魏中山王元英率大军围攻淮南的钟离，梁将昌义之坚守。梁武帝派曹景宗和韦叡前往救援。韦叡连夜在魏军阵前筑起营垒，魏军天亮时大惊。随后淮水暴涨，梁军乘高舰冲击魏军架在淮水上的浮桥，又用小船载草灌油放火，烧断浮桥，魏军大溃，史称伤亡溺死者十余万。

  据《梁书》本传，他体弱不能骑马，常坐着板舆督战，手持白角如意指挥军队，魏人很畏惧他，称为“韦虎”。他为人谦退，钟离之战后曹景宗与诸将争先报捷，只有他在后面，时人称赞他不争功。普通元年（520 年）去世，年七十九。
sources: []
recalled:
  - 《梁书·韦叡传》
  - 《资治通鉴》卷一百四十六
