name: 抹大拉的马利亚
aliases:
  - 马利亚·抹大拉
role: 跟随耶稣的妇女
summary: 从加利利跟随耶稣的妇女，见证耶稣受难和安葬，福音书记她最先发现坟墓已空。
body: |-
  她的称呼来自加利利海西岸的抹大拉，圣经没有记载她的生年和家世。《路加福音》8:1–3 记耶稣在各城各乡传道时，有十二个门徒和几个妇女同行，其中有称为抹大拉的马利亚，曾有七个鬼从她身上赶出来；这些妇女用自己的财物供给耶稣和门徒。

  四卷福音书都记她在耶稣受难的现场：符类福音说她和别的妇女从远处观看，《约翰福音》19:25 说她站在十字架旁边。耶稣安葬时，她看见了安放的地方（可 15:47）。七日的第一日清早，她到坟墓那里去，发现石头已经挪开。同去的人各书所记不一：约翰只提她一个人，马太提到还有另一个马利亚，马可再加上撒罗米，路加提到约亚拿和别的妇女。

  《约翰福音》20:11–18 记她站在坟墓外面哭，转过身来看见耶稣站在那里，起先以为是看园的；耶稣叫了她的名字，她才认出来，随后去告诉门徒自己已经看见了主。此后新约不再提到她。

  西方教会从六世纪末教皇大格列高利起，把她和《路加福音》第 7 章里那个有罪的女人、伯大尼的马利亚当作同一个人，福音书本身没有这样说。她后来的经历没有可靠的记载。
sources: []
recalled:
  - 《路加福音》8:1–3、24:1–10
  - 《马太福音》27:55–61、28:1–10
  - 《马可福音》15:40–47、16:1–8
  - 《约翰福音》19:25、20:1–18
