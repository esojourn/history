name: 萧绰
aliases: [承天太后, 萧太后, 萧燕燕]
role: 辽景宗皇后，摄政太后
summary: 辽景宗的皇后，圣宗年幼时摄政二十七年，击退宋军北伐，与宋订立澶渊之盟。
body: |-
  萧绰是辽朝北府宰相萧思温的女儿，生于应历三年（公元 953 年），后世相传她的小字叫燕燕。保宁元年（969 年）辽景宗即位，选她入宫，不久立为皇后。景宗身体多病，朝政常由她参与决断。

  乾亨四年（982 年）景宗去世，十二岁的长子耶律隆绪即位，即辽圣宗，萧绰以皇太后身份摄政，号承天太后。据《辽史》，她对大臣说，自己母寡子弱，宗族强盛，边防未宁，该怎么办；耶律斜轸、韩德让表示愿意效力，她便委任他们主持朝政，又以耶律休哥镇守南京（今北京）。她赏罚分明，善于用人，辽朝在她摄政期间政局稳定，汉人官员的地位也有所提高。宋人笔记有她与韩德让关系亲密甚至再嫁的说法，《辽史》没有这样的记载，学者看法不一。

  统和四年（986 年）宋太宗分三路北伐，萧绰与圣宗亲临前线，辽军在岐沟关大败宋东路军，在陈家谷俘获杨业，迫使宋军全线撤退（另见“雍熙北伐”条）。统和二十二年（1004 年）她与圣宗率大军南下，深入到澶州，宋真宗亲征，双方议和，订立澶渊之盟，宋每年给辽绢、银，两国以兄弟相称（另见“澶渊之盟”条）。此后宋辽之间一百多年没有大的战争。

  统和二十七年（1009 年）萧绰把政权交还圣宗，同年十二月在前往南京的途中去世。她摄政二十七年，是辽朝鼎盛时期的实际主持者。
sources: []
recalled:
  - 《辽史·后妃传·景宗睿智皇后萧氏》
  - 《辽史·圣宗本纪》
  - 《契丹国志》
