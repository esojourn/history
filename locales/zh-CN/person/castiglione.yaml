name: 郎世宁
aliases: [朱塞佩·伽斯底里奥内]
role: 耶稣会士、宫廷画家
summary: 意大利耶稣会修士，在清宫任画师五十多年，融合中西画法。
body: |-
  郎世宁是意大利米兰人，早年学习绘画，1707 年加入耶稣会，成为修士。1715 年他以画家的身份来到中国，经澳门进入北京，此后在康熙、雍正、乾隆三朝宫廷中担任画师，直到去世，在中国生活了五十多年。

  当时清朝禁止天主教在各地传教，郎世宁等在宫中服务的传教士主要以技艺侍奉皇帝。他把西方绘画的透视、明暗等技法与中国绘画的工具和审美结合起来，形成一种中西合璧的画风。他的作品有大量帝后肖像、骏马、花鸟和记录重大事件的画，如《百骏图》《乾隆皇帝大阅图》《平定准噶尔回部得胜图》（与其他画家合作起稿，后来送到法国制成铜版画）等。乾隆帝很赏识他，常到他作画的如意馆观看。

  乾隆年间，郎世宁与蒋友仁、王致诚等传教士一起，参与设计了圆明园长春园北部的西洋楼建筑群，包括谐奇趣、海晏堂、大水法等，这些建筑在 1860 年被英法联军焚毁，今天只留下残迹。据说郎世宁曾借机向乾隆帝请求宽容天主教，未获允准。乾隆三十一年（1766 年）他在北京去世，乾隆帝追赠他侍郎衔。
sources: []
