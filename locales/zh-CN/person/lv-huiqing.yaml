name: 吕惠卿
aliases: [吕吉甫]
role: 北宋参知政事
summary: 王安石变法的主要助手，后与王安石反目，被列入《宋史·奸臣传》。
body: |-
  吕惠卿是泉州晋江人，嘉祐二年（1057 年）考中进士。王安石与他讨论经义，非常器重他。熙宁二年（1069 年）变法开始，他在制置三司条例司任职，许多新法的条文都出自他手，是王安石最得力的助手，当时人把他比作王安石的“护法”。

  熙宁七年（1074 年）王安石第一次罢相，推荐吕惠卿任参知政事。他继续推行新法，又创行“手实法”，让百姓自报家产，允许互相告发，引起很大的骚扰。他与王安石的关系也逐渐恶化，王安石复相后两人互相攻击。据宋人记载，吕惠卿曾把王安石写给他的私信交给神宗，其中有“无使上知”等语，两人从此彻底决裂。熙宁八年（1075 年）他被罢免，出知外州。元祐年间他被贬到建州安置；绍圣以后重新起用，长期在西北边地任职，主持对西夏的防务。他死于政和元年（1111 年）。《宋史》把他列入《奸臣传》，这一评价反映了南宋以后史家对新党的看法。
sources: []
recalled:
  - 《宋史·奸臣传·吕惠卿》
  - 《续资治通鉴长编》卷二百十至二百七十
