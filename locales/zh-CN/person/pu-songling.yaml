name: 蒲松龄
aliases: [留仙, 柳泉居士, 聊斋先生]
role: 小说家
summary: 山东淄川人，科举屡试不第，长期在乡间教书，写成文言短篇小说集《聊斋志异》。
body: |-
  蒲松龄是山东淄川人，十九岁时以县、府、道三个第一考中秀才，受到当时任山东学政的诗人施闰章的赏识。但此后他屡次参加乡试，一直没有考中，直到七十一岁才援例成为岁贡生。康熙九年（1670 年）他曾到江苏宝应县给任知县的同乡孙蕙做幕宾，一年后回乡。此后他在本县西铺村的毕家坐馆教书三十多年。

  蒲松龄从青年时代起就搜集民间的奇闻异事，写成文言短篇小说，到四十岁左右已初具规模，取名《聊斋志异》，此后又不断增补。书中近五百篇作品多写狐鬼花妖与人的故事，借以讽刺科举的弊病和官场的黑暗，赞美真挚的爱情，文笔简洁生动。据说他在路边设茶摊，请过路人讲故事，这一说法出于后人的传闻，未必属实。

  《聊斋志异》在他生前只以抄本流传，王士禛读后很欣赏，写了评语。乾隆三十一年（1766 年）才有刻本问世，此后流传极广，被改编成大量戏曲、电影和电视剧。蒲松龄还写了俚曲、杂著，涉及农业、医药等方面。康熙五十四年（1715 年）他在家乡去世。
sources: []
recalled:
  - 蒲松龄《聊斋自志》
  - 张元《柳泉蒲先生墓表》
