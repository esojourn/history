name: 涅尔瓦
aliases: [马尔库斯·科克基乌斯·涅尔瓦, 内尔瓦, 涅尔发]
role: 罗马皇帝
summary: 图密善遇刺后由元老院推立的皇帝，收养图拉真为继承人。
body: |-
  涅尔瓦于公元 30 年 11 月 8 日生在翁布里亚的纳尔尼亚，祖父和父亲都是法学家。65 年他帮尼禄查办皮索一案，得到重赏；71 年与韦斯巴芗、90 年与图密善同任执政官。

  96 年 9 月 18 日图密善遇刺，元老院当天推他为皇帝。这年他六十五岁，没有子女。他发誓不处死元老，召回流放的人，退还被没收的财产，拨款买地分给罗马的贫民。资助意大利贫家子女的“抚养金”制度，有的古代记载也说从他开始。

  军队还念着图密善。97 年禁卫军哗变，把他围在宫里，逼他交出刺杀图密善的人，他只得答应。同年 10 月，他在卡皮托山宣布收养上日耳曼总督图拉真，与之共掌大权。98 年 1 月底他病逝，在位十六个月。皇位从此接连四次传给养子，后世把从他到马可·奥勒留的五位皇帝合称“五贤帝”。
sources: []
recalled:
  - 卡西乌斯·狄奥《罗马史》卷 68 第 1—4 章
  - 小普林尼《图拉真颂》第 6—8 章
  - 奥勒留·维克多《诸恺撒传》第 12 章
