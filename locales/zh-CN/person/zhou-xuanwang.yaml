name: 周宣王
aliases: [姬静]
role: 周王
summary: 周厉王之子，共和之后即位，在位四十六年，北伐玁狁、南征淮夷，后世称“宣王中兴”。
body: |-
  周宣王姓姬名静，是周厉王的太子。国人暴动时他藏在召公家里，召公以亲生儿子顶替他，他才得以活下来。共和十四年（公元前 828 年）厉王死于彘，次年他被立为王，在位到公元前 782 年。

  据《史记·周本纪》，宣王即位后，由周公、召公二相辅佐，效法文、武、成、康的遗风，诸侯重新朝周。《诗经》中的《六月》《采芑》《江汉》《常武》等篇，记述了宣王时尹吉甫北伐玁狁、方叔南征荆蛮、召虎平定淮夷等事；兮甲盘等青铜器铭文也记录了伐玁狁的战事。后世称这一时期为“宣王中兴”。

  宣王后期屡有失误。据《国语·周语上》，他不按惯例举行籍田之礼，虢文公劝谏不听；他又干预鲁国君位的继承，立鲁武公的少子，引起鲁国内乱。宣王三十九年，王师在千亩被姜氏之戎打败。战败后他在太原清点人口（“料民”），也遭到大臣反对。

  宣王死于公元前 782 年，儿子宫湦继位，就是周幽王。

  宣王时期的青铜器很多，著名的毛公鼎、虢季子白盘、兮甲盘一般都认为属于这一时期。毛公鼎铭文近五百字，是目前所知铭文最长的青铜器，记录了周王对毛公的册命和告诫。

  宣王是西周的倒数第二位君王。
sources: []
recalled:
  - 《史记·周本纪》
  - 《国语·周语上》
  - 《诗经·小雅·六月》
  - 《诗经·大雅·江汉》
