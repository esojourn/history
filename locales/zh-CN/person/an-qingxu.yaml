name: 安庆绪
aliases: [安仁执]
role: 大燕皇帝
summary: 安禄山次子，757 年杀父自立，两京失守后退守邺城，后被史思明所杀。
body: |-
  安庆绪原名仁执，是安禄山的次子，唐玄宗赐名庆绪。安禄山起兵后，长子安庆宗在长安被唐朝处死，安庆绪随父亲南下。安禄山在洛阳称帝后，眼病加重，脾气暴躁，又宠爱妃子段氏所生的安庆恩，打算立他为继承人。至德二载（757 年）正月，安庆绪与谋臣严庄、宦官李猪儿合谋，夜间在洛阳宫中杀死安禄山，自立为帝。

  同年唐军和回纥兵收复长安、洛阳，他逃到邺城，改称安成府，部下多有离散，史思明据范阳归降唐朝。乾元元年（758 年）秋，郭子仪、李光弼等九个节度使率军围攻邺城，引漳河水灌城，城中粮尽。次年三月史思明率军来救，唐军溃败（另见“相州之战”条）。安庆绪出城与史思明相见，被史思明斥责杀父之罪，与他的几个弟弟一同被杀。他的生年史书没有记载。
sources: []
recalled:
