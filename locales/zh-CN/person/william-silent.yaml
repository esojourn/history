name: "沉默者威廉"
aliases: ["奥兰治的威廉", "奥兰治亲王威廉一世", "沉默的威廉"]
role: "奥兰治亲王、尼德兰起义领袖"
summary: "奥兰治亲王，领导尼德兰反抗西班牙，主张两教并容，1584 年遇刺。"
body: |-
  威廉 1533 年 4 月 24 日生于德意志的迪伦堡，是拿骚伯爵的长子，父母信路德宗。十一岁时他继承了堂兄在尼德兰的大片领地和法国南部的奥兰治亲王国，皇帝查理五世要他改受天主教的教育，在布鲁塞尔的宫廷里长大。《历史的轨迹》称他为“橙县王侯”，就是奥兰治亲王。1555 年查理在布鲁塞尔宣布退位时，是扶着他的肩膀走进大厅的。腓力二世任命他为荷兰、泽兰等省的总督。

  据他后来的《辩护书》，1559 年他在法国做人质时，法王以为他知情，对他讲了与西班牙国王合力铲除新教徒的打算，他不动声色地听着，“沉默者”的绰号相传由此而来。他同别的大贵族一起反对在尼德兰严办异端。1567 年阿尔瓦公爵带兵到来，他退回迪伦堡，被缺席判罪，产业充公。

  该书第三十章说，1568 年荷兰人在这位改教运动的英雄领导下起来反抗西班牙。那年他和兄弟们变卖家产募兵，几路进攻都失败了。1572 年“海上乞丐”夺取布里勒，荷兰、泽兰的城市纷纷响应，推他为总督。次年他加入了改革宗教会。1574 年莱顿被围，他下令掘开堤坝，引水行船解了围。

  1576 年西班牙士兵因欠饷洗劫安特卫普，南北各省订立《根特协定》共同驱逐西班牙军队，这是他最接近成功的时候。他希望天主教徒和新教徒在一国之内并存，两边的人都不肯。1579 年南方几省与西班牙和解，北方七省结成乌得勒支同盟。1580 年腓力二世宣布他不受法律保护，悬赏两万五千金币买他的命；次年北方各省宣布不再认腓力为君主。

  1584 年 7 月 10 日他在代尔夫特的住所被一个信天主教的勃艮第人热拉尔开枪打死。他的儿子莫里茨继续作战。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
recalled:
  - "奥兰治的威廉《辩护书》（1581 年）"
  - "1576 年《根特协定》、1579 年《乌得勒支同盟》、1581 年《誓绝法案》"
  - "彭图斯·帕延《回忆录》（记“沉默者”绰号的由来）"
