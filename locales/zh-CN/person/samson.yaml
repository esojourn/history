name: 参孙
aliases: []
role: 士师
summary: 但支派的拿细耳人，力大过人，屡次击杀非利士人，最后死在迦萨。
body: |-
  参孙是但支派琐拉人玛挪亚的儿子。据《士师记》第 13 章，那时以色列人被交在非利士人手中四十年；玛挪亚的妻子不能生育，耶和华的使者向她显现，说她必生一个儿子，这孩子一出母胎就归神作拿细耳人，不可用剃头刀剃他的头，他要起首拯救以色列人脱离非利士人的手。圣经没有记载参孙的生年和卒年。

  第 14—15 章记载，参孙要娶亭拿的一个非利士女子。去亭拿的路上，他空手把一只少壮狮子撕裂；后来见死狮之内有蜂蜜，就在婚筵上用这事给三十个陪伴的人出谜语，以三十件里衣、三十套衣裳为赌。那些人逼他的妻子探出谜底，参孙就到亚实基伦击杀了三十个人，夺了衣裳给猜出谜语的人。岳父把他的妻子给了别人，他捉了三百只狐狸，把火把捆在尾巴中间，烧了非利士人的禾稼；非利士人用火烧了那女子和她的父亲。犹大人有三千人到以坦磐来，把参孙捆绑交给非利士人；到了利希，他挣断绳子，用一块未干的驴腮骨击杀了一千人（15:15）。

  第 16 章记载，参孙在迦萨夜半起来，把城门的门扇、门框、门闩一齐拆下，扛到希伯仑前的山顶上。后来他喜爱梭烈谷的妇人大利拉，非利士人的首领各许给她一千一百舍客勒银子，要她探出参孙力气的来由。参孙三次用假话应付，最后把心中所藏的都告诉了她。大利拉使他睡着，叫人剃去他头上的七条发绺，他的力气就离开了。非利士人剜了他的眼睛，带他下到迦萨，用铜链拘索他，让他在监里推磨。

  他的头发后来又渐渐长起来。非利士人的首领聚集向他们的神大衮献大祭，把参孙从监里提出来戏耍；据 16:27，房里充满男女，房的平顶上约有三千人。参孙求告耶和华，抱住托房的两根柱子，尽力屈身，房子倒塌，压住首领和房内的众人。《士师记》16:30 说，他死时所杀的人比活着所杀的还多。他的弟兄和父亲的全家把他葬在琐拉和以实陶中间他父亲玛挪亚的坟墓里。他作以色列的士师二十年。
sources: []
recalled:
  - 《士师记》第 13—16 章
  - 《希伯来书》第 11 章
