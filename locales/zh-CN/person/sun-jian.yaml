name: 孙坚
aliases: [孙文台, 破虏将军, 乌程侯]
role: 破虏将军
summary: 汉末将领，孙策、孙权之父，讨伐董卓时率先攻入雒阳，后在攻刘表时战死。
body: |-
  据《三国志·吴书·孙破虏讨逆传》，孙坚字文台，吴郡富春人。他十七岁时在钱塘只身吓退并追杀海盗，由此知名，后在几个县担任县丞。中平元年（公元 184 年）黄巾起事，他随朱儁征讨，作战勇猛；其后又随张温西征凉州叛军。本传记载，当时董卓应召迟到而且态度傲慢，孙坚曾劝张温将他按军法处斩，张温没有听从。此后他任长沙太守，平定当地的反叛，封乌程侯。

  初平元年（190 年）关东起兵讨董卓，孙坚从长沙北上，沿途杀了荆州刺史王叡和南阳太守张咨，到鲁阳与袁术会合，袁术表他为破虏将军、豫州刺史。次年他在阳人击败董卓的军队，斩其都督华雄，进而攻入雒阳。此时雒阳已被焚毁，他修复了被发掘的汉朝帝陵后退兵。裴松之注引《吴书》说，他的部下在雒阳城南的井中得到了汉朝的传国玺。

  此后袁术派他进攻荆州的刘表。孙坚击败刘表的部将黄祖，渡过汉水包围襄阳，在岘山追击时被黄祖的士兵射死。本传把他的死记在初平三年，裴松之注据其他史料认为应是初平二年（191 年），终年三十七。
sources: []
recalled:
  - 《三国志·吴书·孙破虏讨逆传》及裴松之注
