name: 张衡
aliases: [张平子]
role: 太史令
summary: 东汉科学家、文学家，制作浑天仪和候风地动仪，著有《灵宪》《二京赋》。
body: |-
  据《后汉书·张衡传》，张衡字平子，南阳西鄂人。青年时游历长安一带，又到雒阳进入太学学习，通晓五经六艺。和帝永元年间他在南阳太守手下任主簿，仿照班固《两都赋》写作《二京赋》，本传说他构思修改了十年才完成。

  安帝听说他擅长天文历算，征召入朝，任郎中，后升为太史令，掌管天文历法。他前后两次担任此职。在任期间他制作了用水力推动的浑天仪，著《灵宪》《算罔论》。《灵宪》讲述天地的结构和日月星辰的运行，其中说月光来自日光的照射，月食是由于大地遮住了日光。

  顺帝阳嘉元年（公元 132 年），张衡造成候风地动仪。本传描述它用精铜铸成，形似酒樽，外有八条龙，各衔铜丸，下有蟾蜍张口承接；某个方向发生地震，那一方的龙就吐出铜丸。本传还记载，有一次一龙吐丸而雒阳并无震感，几天后驿使来报陇西地震，众人才信服。原器早已失传，其内部构造后人只能依据这段文字推测复原。

  当时朝廷上下崇信图谶，张衡上疏指出图谶出于西汉哀帝、平帝之际，并非圣人之言，请求禁绝。后来他升任侍中，因受宦官排挤，于永和初年出任河间相，任职三年后请求退休，被征回朝任尚书。永和四年（139 年）去世，本传记其终年六十二。他的文学作品还有《思玄赋》《归田赋》《四愁诗》等。
sources: []
recalled:
