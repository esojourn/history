name: 许佩里德斯
aliases: [希佩里德斯]
role: 演说家
summary: 雅典演说家，反马其顿派领袖之一，拉米亚战争失败后被安提帕特处死。
body: |-
  雅典人，约生于公元前 390 年，相传是伊索克拉底的学生，早年以代写法庭讲稿为业。前 343 年他控告主持对马其顿议和的菲洛克拉底，后者不等宣判就逃亡了。此后他与德摩斯梯尼同属主张抵抗腓力二世的一派。前 338 年喀罗尼亚战败后，他提议释放奴隶、给予外侨公民权以充实兵员，被人控告提案违法，据说他答辩时说，遮住他眼睛的是马其顿人的武器，提案的不是他，而是喀罗尼亚这一战。他被判无罪。

  前 324 年哈帕洛斯案发，他是控告德摩斯梯尼受贿的几位公诉人之一，这篇演说有残篇存世。次年亚历山大去世，他与将军列奥斯特涅斯是雅典起兵的主要推动者。战争第一年冬天列奥斯特涅斯在拉米亚城下阵亡，他被选出为阵亡者致悼词。

  前 322 年希腊联军在克兰农战败，安提帕特要求雅典交出他和德摩斯梯尼等人。他逃离雅典，被阿基亚斯捕获，送交安提帕特处死，地点有克列奥奈和马其顿两说。相传他被割去舌头。

  古人把他列入阿提卡十大演说家，称赞他的文风机敏自然；他为名妓芙丽涅辩护的故事流传很广，属于轶事。他的演说在中世纪全部失传，十九世纪中叶起才从埃及出土的纸草上陆续发现了《葬礼演说》《诉德摩斯梯尼》《为欧克塞尼波斯辩护》等篇；二十一世纪初，学者又在“阿基米德羊皮书”被刮去的底层文字里辨认出他另外两篇演说的片段。
sources: []
recalled:
  - 托名普鲁塔克《十大演说家传·许佩里德斯》
  - 许佩里德斯《葬礼演说》
  - 普鲁塔克《福基翁传》《德摩斯梯尼传》
