name: 孟珙
aliases: [孟璞玉]
role: 南宋将领
summary: 南宋后期名将，率宋军与蒙古合围蔡州灭金，后多次击退蒙古军，收复襄阳。
body: |-
  孟珙字璞玉，随州枣阳（今湖北枣阳）人，生于庆元元年（公元 1195 年），出身将门，父亲孟宗政是京西的抗金将领。他少年随父作战，嘉定十年（1217 年）宋金重开战事，金军进攻襄阳、枣阳，他随父亲守御，此后几年在枣阳一带多次击退金军，逐渐升为将领。

  绍定六年（1233 年）宋与蒙古约定联合攻金，孟珙率宋军北上，会同蒙古将领塔察儿围攻金哀宗所在的蔡州。端平元年（1234 年）正月城破，金哀宗自尽，金朝灭亡，孟珙带回了金哀宗的部分遗骸（另见“蒙古灭金”条）。

  宋蒙战争爆发后，孟珙长期主持京湖防务。端平三年（1236 年）襄阳因守军内乱落入蒙古之手，嘉熙年间孟珙多次击退蒙古军，嘉熙三年（1239 年）收复樊城、襄阳；他在长江中游和四川东部之间设置防线，招募兵士屯田。淳祐年间他任京湖安抚制置使，驻江陵，是南宋后期支撑长江中游的主要将领。他与朝中主政者意见不合，又有降将不得接纳等事，忧郁成疾，淳祐六年（1246 年）在江陵去世，谥忠襄。

  孟珙晚年信佛，自号无庵居士。据《宋史》，他临终前推荐贾似道接替自己，此后京湖防务由贾似道主持。
sources: []
recalled:
  - 《宋史·孟珙传》
