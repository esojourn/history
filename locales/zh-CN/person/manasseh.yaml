name: 玛拿西
aliases: []
role: 南国犹大王
summary: 希西家之子，在位五十五年，重建丘坛、敬拜偶像；《历代志》记他晚年悔改。
body: |-
  犹大王希西家的儿子，母亲名叫协西巴。据《列王纪下》21:1，他登基时十二岁，在耶路撒冷作王五十五年，是犹大诸王中在位最久的；出生地圣经没有记载。

  据 21:2–9，他重新建筑父亲希西家所毁坏的丘坛，为巴力筑坛，作亚舍拉像，在圣殿的两院中为天上的万象筑坛，又使他的儿子经火，观兆，用法术，立交鬼的和行巫术的。21:16 说他流了许多无辜人的血，充满了耶路撒冷。耶和华藉众先知说，要降祸与耶路撒冷和犹大（21:10–15）；《列王纪下》23:26 和 24:3 都把后来犹大的灾祸归因于玛拿西所行的事。

  《历代志下》33:10–17 另有一段《列王纪》没有的记载：亚述王的将帅来攻，用铙钩钩住玛拿西，用铜链锁住他，带到巴比伦去；他在急难中自卑，向耶和华祷告，得以回到耶路撒冷，此后除掉圣殿中的外邦神像，重修耶和华的祭坛，并在大卫城外修筑城墙。次经中有一篇《玛拿西祷言》，托名于此。亚述王以撒哈顿和亚述巴尼拔的铭文都把犹大王玛拿西列在向亚述纳贡、供役的诸王之中。他死后葬在自己宫院乌撒的园内（《列王纪下》21:18），儿子亚们接续作王。
sources: []
recalled:
  - 《列王纪下》21:1–18、23:26、24:3
  - 《历代志下》33:1–20
  - 亚述王以撒哈顿、亚述巴尼拔铭文（纳贡诸王名单）
