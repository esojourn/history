name: 沈约
aliases: [沈休文, 沈隐侯]
role: 文学家、史学家
summary: 历仕宋齐梁三朝，撰《宋书》，倡导四声八病之说，是永明体的领袖。
body: |-
  沈约字休文，吴兴武康人，出身江东豪族吴兴沈氏。他十三岁时，父亲沈璞因在宋孝武帝起兵讨伐刘劭时没有及时响应，被孝武帝所杀，他随家人流离躲藏。据《梁书》本传，他笃志好学，昼夜不倦，母亲担心他累坏身体，常减少灯油、撤去炉火。

  他历仕宋、齐、梁三朝。在齐时，他是竟陵王萧子良西邸“竟陵八友”之一，与谢朓、王融等人把汉字的平上去入四声运用到诗歌写作中，提出作诗应避免的“八病”，形成“永明体”，为后来唐代近体诗格律的形成打下基础。他撰有《四声谱》，已经失传。永明五年（公元 487 年），他奉命撰写《宋书》，次年就完成了纪传部分，速度如此之快，是因为他利用了何承天、徐爰等人此前编成的宋史旧稿；志稍后完成。全书一百卷，流传至今。

  萧衍起兵攻入建康后，沈约积极劝进，是梁朝的开国功臣，官至尚书令、太子少傅。晚年他与武帝渐生嫌隙。《梁书》记载，有一次武帝与他比赛列举有关栗子的典故，他故意少说了三条，出来后对人说，这位天子好胜，不让他就要羞死，武帝听说后大怒。后来又因他替张稷说话而遭武帝斥责，他惊惧成病。天监十二年（513 年）去世，年七十三，谥隐。

  他著述很多，除《宋书》外，还有《晋书》《齐纪》等史书，都已失传；诗文后人辑为《沈隐侯集》。
sources: []
recalled:
