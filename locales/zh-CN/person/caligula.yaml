name: 卡利古拉
aliases: [盖乌斯, 盖乌斯·恺撒·日耳曼尼库斯, 卡里古拉]
role: 罗马皇帝
summary: 罗马第三位皇帝，在位不到四年，被禁卫军军官刺杀。
body: |-
  卡利古拉本名盖乌斯，公元 12 年 8 月 31 日生于安提乌姆，是日耳曼尼库斯和大阿格里皮娜的儿子。他幼时随父亲住在莱茵河的军营里，穿一双小军靴，士兵们叫他“卡利古拉”，意思是小靴子。父亲死后，母亲和两个哥哥在塞扬努斯当权时被害。31 年起他跟提比略住在卡普里岛。

  37 年提比略去世，元老院把全部权力授给这个二十四岁的年轻人。他是日耳曼尼库斯的儿子，起初极受欢迎：召回流放者，停办叛逆罪案件，发放赏金，大办竞技。这年秋天他得了一场重病。古代作家说病愈以后他像换了一个人：处死提比略的孙子格梅卢斯和扶他上台的禁卫军长官马克罗，恢复叛逆罪审判，没收富人的家产来填补挥霍一空的国库。

  他要人把他当作神来敬拜。据约瑟夫斯和斐洛，他下令在耶路撒冷圣殿里立自己的像，叙利亚总督佩特罗尼乌斯拖延不办，犹太王希律·亚基帕又从旁劝说，事情才没有办成；斐洛本人曾随亚历山大城犹太人的使团去见过他。39 至 40 年他到高卢和莱茵河巡视，苏维托尼乌斯说他在海峡边列阵之后命士兵捡贝壳。至于要让爱马做执政官的故事，苏维托尼乌斯和狄奥都只说是“据说他打算”。

  现存的记载出自塞涅卡、斐洛、苏维托尼乌斯和狄奥，都对他怀有敌意，塔西佗写他的几卷又已失传，其中多少是实情、多少是夸大，学者看法不一。41 年 1 月 24 日，禁卫军军官卡西乌斯·凯瑞亚等人在帕拉丁山的通道里把他刺死，他的妻子和幼女同时遇害。
