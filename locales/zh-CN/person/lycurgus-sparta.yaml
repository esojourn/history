name: 吕库古
aliases: [来库古]
role: 传说中的斯巴达立法者
summary: 相传为斯巴达制度的创立者，是否实有其人没有定论。
body: |-
  斯巴达人把自己的政治制度和生活方式都归于一位名叫吕库古的立法者。关于他，古人自己就莫衷一是。公元 1 世纪末的普鲁塔克为他作传，开头便说，关于这位立法者，没有一件事是没有争议的，他的出身、游历、死亡，尤其是他生活的年代，各家说法都不一样。古人给他定的年代从公元前 9 世纪到前 8 世纪不等。

  据希罗多德，吕库古是斯巴达王勒奥波特斯的叔父和监护人；亚里士多德和普鲁塔克则说他监护的是另一王室的卡里拉奥斯。希罗多德记了两种说法：一说他的法律得自德尔斐的神谕，一说（斯巴达人自己这样讲）是从克里特带回来的。普鲁塔克抄录了一段称为“大瑞特拉”的古老文告，规定设立长老会议、定期召集公民大会，被看作斯巴达政制的根本。

  归在他名下的还有：平分土地，禁用金银而改用铁钱，男性公民一律在公共食堂吃饭，男孩七岁起离家接受集体训练。普鲁塔克说，他让斯巴达人发誓在他回来以前不改动法律，然后前往德尔斐，在外绝食而死，使誓言永远有效。

  现代学者多认为，斯巴达的这些制度是在公元前 7 世纪到前 6 世纪间逐步形成的，不是一人一时所定；吕库古究竟是一位被后世附会了许多事迹的真实人物，还是纯属传说，无法确定。斯巴达人为他建有神庙，每年献祭。
sources: []
recalled:
  - 希罗多德《历史》卷一第 65—66 章
  - 普鲁塔克《吕库古传》
  - 亚里士多德《政治学》卷二第 9—10 章
