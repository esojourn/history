name: "塞缪尔·西伯里"
aliases: ["西伯里", "西伯立"]
role: "美国圣公会第一位主教"
summary: "英国拒绝为他祝圣，1784 年在苏格兰受祝圣，成为美国第一位圣公会主教。"
body: |-
  《历史的轨迹》第四十三章说，美国立国之初，圣公宗教会相当软弱，仍隶属英国国教；不久许多文章和会议呼吁成立独立的组织。1783 年在一次非正式会议中，十位圣公宗圣职人员推选西伯里前往英国接受按立，结果他在英国被拒，只得前往苏格兰，在那里被按立为主教。接着 1785 年举行大会，订立了“美国圣公宗章程”。书中还说，殖民地时期各教会都反对英国派主教来美洲，1766 年新英格兰公理派与中部长老派曾联合起来阻止主教制在美洲设立。

  据一般记载，他 1729 年生于康涅狄格格罗顿，独立战争中是效忠英国的一派，坐过牢，做过英军随军牧师。英国主教不肯为他祝圣，是因为他不能向英王宣誓效忠；1784 年 11 月苏格兰圣公会的三位主教在阿伯丁为他祝圣。他回国后任康涅狄格和罗得岛主教，住在新伦敦。1785 年的大会是南部和中部各州的圣公会召开的，正式的章程和新版公祷书到 1789 年才通过，西伯里一派也在那时加入，书中把章程订立放在 1785 年，与此略有出入。他 1796 年在新伦敦去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十三章“新兴国家的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter48.html"
