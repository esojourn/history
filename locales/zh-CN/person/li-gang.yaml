name: 李纲
aliases: [李伯纪, 梁溪先生, 李忠定]
role: 两宋之际的宰相
summary: 两宋之际的主战大臣，1126 年主持开封防守，打退金军，南宋初任宰相七十余日。
body: |-
  李纲，祖籍邵武，生于元丰六年（公元 1083 年），政和二年（1112 年）考中进士。宣和元年（1119 年）开封发大水，他上书指出这是内忧外患的征兆，被贬到南方。宣和七年（1125 年）金军南下，他任太常少卿，刺破手臂写血书，劝宋徽宗传位给太子，以号召天下。

  靖康元年（1126 年）正月金军包围开封，宋钦宗想离京南逃，李纲力劝留守，被任命为尚书右丞、亲征行营使，主持城防。他组织军民据城抵抗，打退了金军的多次进攻（另见“开封保卫战”条）。朝中主和派却与金议和，答应割让三镇。各地援军赶到后，金军撤退，李纲主张趁金军渡河时追击，没有被采纳。此后他受到排挤，被派去救援太原，因兵力调度受制而失败，随即被贬。不久金军再次南下，开封失守。

  建炎元年（1127 年）宋高宗即位，任命李纲为宰相。他主张整顿军政、坚守中原，推荐宗泽留守开封，但与高宗身边主张南逃的黄潜善、汪伯彦意见不合，在相位只有七十五天就被罢免。此后他长期被贬在外，一度出任地方帅臣，多次上书反对与金议和。绍兴十年（1140 年）他在福州去世，谥“忠定”，著有《梁溪集》。
sources: []
recalled:
  - 《宋史·李纲传》
  - 李纲《靖康传信录》
  - 《三朝北盟会编》
