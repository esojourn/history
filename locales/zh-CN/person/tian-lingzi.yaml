name: 田令孜
aliases: [陈令孜]
role: 宦官、神策军中尉
summary: 唐僖宗宠信的宦官，被称为“阿父”，黄巢入长安时护送僖宗入蜀，后被王建所杀。
body: |-
  田令孜是蜀人，本姓陈，入宫后随义父改姓田。唐僖宗做亲王时，他负责照料僖宗的起居，僖宗即位后对他非常信任，称他为“阿父”，任他为神策军中尉，把朝政交给他处理。据《资治通鉴》，他预见天下将乱，为退路考虑，让僖宗命他的哥哥陈敬瑄等四人以击球比赛决定三川节度使的人选，陈敬瑄得第一，出任西川节度使。

  广明元年（公元 880 年）黄巢攻入长安，他带领神策军护送僖宗逃往成都。光启元年（885 年）回到长安后，他为了把河中的盐池收归神策军，与河中节度使王重荣发生冲突，王重荣联合李克用打败了他派出的军队，进逼长安，他挟持僖宗逃往凤翔、兴元。各地藩镇纷纷要求处置他，他被迫辞职，投奔成都的陈敬瑄。后来王建攻打成都，大顺二年（891 年）陈敬瑄、田令孜投降，景福二年（893 年）两人被王建杀死。他的生年史书没有记载。
sources: []
recalled:
  - 《旧唐书·僖宗纪》
  - 《新唐书·宦者传·田令孜》
  - 《资治通鉴》卷二百五十二至二百五十九
