name: 徐达
aliases: [徐天德, 中山王]
role: 明朝开国大将
summary: 明朝开国大将，攻灭张士诚，1368 年率军北伐攻入大都，结束元朝在中原的统治。
body: |-
  徐达字天德，濠州钟离（今安徽凤阳）人，生于至顺三年（公元 1332 年），出身农家，与朱元璋是同乡。至正十三年（1353 年）朱元璋回乡招兵，徐达前来投奔，从此跟随朱元璋征战。

  此后他参与攻取滁州、和州，渡江攻下集庆，在对陈友谅的战争中屡立战功，鄱阳湖之战时担任前锋。至正二十六年（1366 年）他任大将军，与副将军常遇春进攻张士诚，次年攻破平江，俘获张士诚（另见“张士诚”条）。同年十月他们奉命北伐，先取山东，再下河南，然后进军河北。至正二十八年（1368 年）闰七月明军攻下通州，元顺帝从大都北走，八月初徐达进入大都，元朝在中原的统治结束（另见“明朝建立”条）。随后他又攻取山西、陕西，击败扩廓帖木儿。

  洪武五年（1372 年）徐达率军深入漠北，在岭北被扩廓帖木儿击败，此后几年主要镇守北平，修筑城防，屯田练兵。他为人谨慎，治军严整，入大都后封存府库、约束部下，受到朱元璋的信任，被称为“万里长城”。洪武十八年（1385 年）他在应天病死，追封中山王，名列功臣庙第一。民间相传他是被朱元璋赐蒸鹅害死的，此说出自后世野史，不可信。
sources: []
recalled:
  - 《明史·徐达传》
  - 《明太祖实录》
