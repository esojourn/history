name: 楚平王
aliases: [熊弃疾, 熊居]
role: 楚国国君
summary: 楚国国君，夺太子之妻，杀伍奢父子，伍子胥由此奔吴复仇。
body: |-
  楚平王原名弃疾，是楚共王之子、楚灵王之弟，生年不详。公元前 529 年楚国发生内乱，灵王众叛亲离自缢而死，弃疾即位，改名熊居，就是平王，在位到前 516 年。

  据《史记·楚世家》和《伍子胥列传》，平王派少傅费无极到秦国为太子建迎娶秦女，费无极见秦女美貌，劝平王自己娶了她，另为太子娶妻。费无极担心太子将来报复，屡次在平王面前诋毁太子，太子建被迫出奔宋国。平王又囚禁了太子的太傅伍奢，并以伍奢为人质召他的两个儿子伍尚、伍员。伍尚应召而来，与父亲一同被杀；伍员（伍子胥）逃往吴国。

  平王死于公元前 516 年，秦女所生的儿子即位，就是楚昭王。十年后，伍子胥引吴军攻破郢都，据《史记》，伍子胥掘开平王的坟墓，鞭尸三百以报父兄之仇；《左传》没有这一记载。
sources: []
recalled:
  - 《史记·楚世家》
  - 《史记·伍子胥列传》
  - 《左传》昭公十九年至二十年
