name: 瓦罗
aliases: [马尔库斯·泰伦提乌斯·瓦罗, 雷阿特的瓦罗, 瓦罗内]
role: 罗马学者、作家
summary: 罗马学者，著述六百余卷，被称为最博学的罗马人，建城纪年出自他的推算。
body: |-
  马尔库斯·泰伦提乌斯·瓦罗，公元前 116 年生于萨宾地区的雷阿特，家族属骑士等级。他在罗马师从拉丁语文学者埃利乌斯·斯提洛，又到雅典跟学园派哲学家安条克学习。为区别于同姓的诗人，后人称他“雷阿特的瓦罗”。

  他在政治上追随庞培，做到大法官。前 67 年剿灭海盗的战争中，他负责爱奥尼亚海一带，得到一顶海战金冠。前 49 年内战爆发，他是庞培在远西班牙的副将，部下倒向恺撒，他只得投降，后来得到恺撒宽赦；恺撒委托他筹建罗马第一座公共图书馆，因恺撒遇刺而没有办成。前 43 年安东尼把他列入公敌名单，他的别墅和藏书被抢，本人由友人藏匿，逃过一死。此后他专心著述，前 27 年去世，享年近九十。

  昆体良称他为“最博学的罗马人”。据格利乌斯转述，他自己说到七十八岁时已写了四百九十卷书；后人统计他的著作有七十多种、六百多卷，涉及语言、历史、宗教、法律、哲学、农业等。完整流传的只有晚年写的《论农业》三卷；《论拉丁语》二十五卷存第五至第十卷。失传的重要著作有：《人事与神事的古事记》四十一卷，系统记述罗马的制度和宗教，其内容主要靠奥古斯丁在《上帝之城》里的引述和批评为人所知；《图像集》收七百位希腊罗马名人的画像并各配短诗；《学科九卷》分述文法、论辩、修辞、几何、算术、天文、音乐、医学、建筑，后人去掉末两科，成为中世纪“七艺”的源头；还有一百五十卷诗文相间的《墨尼波斯式杂咏》。

  罗马建城于公元前 753 年这一通行的纪年，就出自他的推算，称为“瓦罗纪年”。
sources: []
recalled:
  - 瓦罗《论农业》《论拉丁语》
  - 格利乌斯《阿提卡之夜》卷三第 10 章
  - 奥古斯丁《上帝之城》卷六
  - 昆体良《演说术原理》卷十
  - 阿庇安《内战史》卷四第 47 章
