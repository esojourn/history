name: 马利亚
aliases:
  - 耶稣的母亲马利亚
  - 童女马利亚
role: 耶稣的母亲
summary: 拿撒勒的童女，约瑟的妻子，福音书记她从圣灵怀孕生下耶稣。
body: |-
  福音书没有记载马利亚的生年和父母的名字；后世流传她的父母名叫约雅敬和亚拿，出自新约以外的《雅各原始福音》。据《路加福音》1:26–38，她是加利利拿撒勒城的童女，已经许配给大卫家的约瑟。天使加百列奉差遣向她报信，说她要从圣灵怀孕生子，给他起名叫耶稣。她随后往犹大山地探望亲戚以利沙伯，住了约三个月（路 1:39–56），路加在这里记下了她的一篇颂歌。

  按路加的记载，她随约瑟往伯利恒报名上册，在那里生下头胎的儿子；满了洁净的日子，夫妻二人带着婴孩上耶路撒冷圣殿，遇见西面和女先知亚拿（路 2:1–38）。按马太的记载，东方的博士来拜之后，约瑟带着她和孩子逃往埃及，希律死后才回来，住在拿撒勒（太 2 章）。耶稣十二岁那年，一家人上耶路撒冷守逾越节，回程时不见了孩子，三天后在殿里找着（路 2:41–51）。

  耶稣传道期间，她出现的次数不多。《约翰福音》2:1–11 记她在迦拿的娶亲筵席上，把酒用尽的事告诉耶稣。《马可福音》3:31–35 记她和耶稣的弟兄来找他；6:3 提到耶稣的弟兄雅各、约西、犹大、西门和几个妹妹。这些弟兄姐妹是否为马利亚所生，各教会传统的解释不同。《约翰福音》19:25–27 记她站在十字架旁边，耶稣把她托付给他所爱的那门徒，那门徒从此接她到自己家里。

  她在新约中最后一次出现是《使徒行传》1:14：耶稣升天之后，她与使徒和耶稣的弟兄在耶路撒冷一同祷告。她的卒年和去世的地点，新约没有记载；教会传统中有耶路撒冷和以弗所两种说法。
sources: []
recalled:
  - 《路加福音》第 1—2 章
  - 《马太福音》第 1—2 章
  - 《马可福音》3:31–35、6:3
  - 《约翰福音》2:1–11、19:25–27
  - 《使徒行传》1:14
  - 《雅各原始福音》（新约以外的著作，父母名字的出处）
