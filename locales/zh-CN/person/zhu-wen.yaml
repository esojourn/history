name: 朱温
aliases: [朱全忠, 朱晃, 后梁太祖]
role: 宣武军节度使、后梁皇帝
summary: 原为黄巢部将，降唐后任宣武军节度使，逐步控制朝廷，907 年篡唐建立后梁。
body: |-
  朱温是宋州砀山人，大中六年（公元 852 年）生，父亲是乡间的教书先生，早年去世，他随母亲在萧县刘崇家做佣工。乾符四年（877 年）前后，他和哥哥朱存参加了黄巢的起义军，屡立战功。黄巢攻入长安后，他奉命镇守同州。中和二年（882 年），他在唐军的压力下投降唐朝，唐僖宗赐名全忠，次年任宣武军节度使，治所在汴州。

  此后他参与围剿黄巢余部。中和四年（884 年），他在汴州上源驿设宴款待前来助战的李克用，夜里派兵围攻，李克用侥幸逃脱，两人从此结下深仇（另见“上源驿之变”条）。此后二十年间，他先后消灭了蔡州的秦宗权、徐州的时溥、郓州的朱瑄和兖州的朱瑾，又迫使河北的魏博、成德等镇依附，成为黄河以南最强大的藩镇。

  天复元年（901 年）宰相崔胤召他诛除宦官，宦官挟唐昭宗投奔凤翔李茂贞。他围攻凤翔，天复三年（903 年）迫使李茂贞交出昭宗，随即把宫中宦官几百人全部杀死，朝政从此由他控制。天祐元年（904 年）他逼昭宗迁都洛阳，拆毁长安城，同年八月派人杀害昭宗，立年幼的李柷为帝（另见“唐昭宗”条）。天祐二年（905 年）他杀昭宗的九个儿子，又在白马驿杀死裴枢等三十多位朝官（另见“白马驿之祸”条）。天祐四年（907 年）四月，他接受唐哀帝禅位，建立梁朝，史称后梁，改名晃，定都汴州，改称东都开封府，唐朝灭亡（另见“朱温篡唐”条）。

  称帝后，他与李克用、李存勖父子的晋国连年交战，开平五年（911 年）在柏乡之战中大败。晚年他荒淫无度，在立储问题上犹豫不决。乾化二年（912 年）六月，次子朱友珪带兵入宫，把他杀死在洛阳，年六十一。
sources: []
recalled:
