name: 列奥尼达一世
aliases: [莱奥尼达斯, 利奥尼达]
role: 斯巴达国王
summary: 公元前 480 年率希腊联军扼守温泉关，与三百斯巴达人一同战死。
body: |-
  斯巴达阿基斯家族的国王阿那克桑德里达斯之子，克里昂米尼一世的异母弟。约公元前 490 年克里昂米尼死后没有儿子，他继承王位，并娶了克里昂米尼的女儿戈尔戈。生年没有记载，一般推测在前 540 年前后。

  前 480 年夏，薛西斯的大军南下。希腊联军决定在温泉关阻击，舰队同时在附近的阿提密西安布防。当时斯巴达正在过卡尼亚节，又逢奥林匹亚竞技会，各邦只派出先头部队。列奥尼达带了三百名斯巴达公民，据希罗多德，都是已有儿子的人。加上伯罗奔尼撒各邦、塞斯皮亚、底比斯以及当地的福基斯人和洛克里斯人，守军共约六七千。

  温泉关是山与海之间的一条窄道。波斯军连攻两天，包括号称“不死军”的精锐，都没有攻下。当地人厄菲阿尔特向薛西斯指出一条绕过关口的山路，波斯军连夜包抄，守山路的福基斯人退走。第三天清晨列奥尼达得到消息，让大部分盟军撤离，自己率三百斯巴达人留下；七百名塞斯皮亚人自愿留下，四百名底比斯人也在其中，希罗多德说他们是被扣作人质，这一说法后人有异议。留下的人退到一个小丘上战至最后。希罗多德说，德尔斐曾有神谕称，要么斯巴达被毁，要么一位国王战死。

  列奥尼达阵亡后，双方争夺他的遗体。据希罗多德，薛西斯下令砍下他的头钉在木桩上。战场上后来立了石狮和碑铭，其中西摩尼德斯所作的一首写道：过客啊，请告诉斯巴达人，我们遵从他们的命令，长眠在这里。据保萨尼阿斯的《希腊志》，四十年后他的遗骨被迁回斯巴达。
sources: []
recalled:
