name: 赵匡胤
aliases: [宋太祖]
role: 后周殿前都点检、宋朝开国皇帝
summary: 后周禁军统帅，960 年发动陈桥兵变，代周建立北宋。
body: |-
  赵匡胤是涿郡人，天成二年（公元 927 年）生于洛阳的夹马营，父亲赵弘殷是后唐、后晋、后汉的禁军将领。他二十岁左右离家游历，后来投奔郭威，在郭威帐下当兵。郭威建立后周后，他在禁军中任职，与柴荣关系密切。

  显德元年（954 年）高平之战，后周右翼溃退，他与张永德各率兵冲击敌阵，扭转了战局，战后升任殿前都虞候。周世宗整顿禁军时，命他挑选精兵组建殿前诸班。显德三年（956 年）征淮南时，他攻下滁州，擒获南唐大将皇甫晖，此后多次参加对南唐的战役，屡立战功。显德六年（959 年），周世宗北伐期间，据宋代史书，有人捡到一块写着“点检作天子”的木牌，世宗回到开封后罢免了殿前都点检张永德，改任赵匡胤为殿前都点检，掌管禁军。同年六月世宗去世，七岁的柴宗训继位。

  显德七年（960 年）正月初一，朝廷接到北汉与契丹联合入侵的报告，派赵匡胤率军北上。大军在陈桥驿驻扎时，将士们把黄袍披在他身上，拥他为帝，他随即回师开封，柴宗训禅位，他改国号为宋，史称北宋（另见“陈桥兵变”条）。这次边境报警是否属实，后人有怀疑；兵变是否事先谋划，也有不同说法。

  此后的事迹属于北宋：他用和平的方式解除了石守信等大将的兵权，即后世所说的“杯酒释兵权”，这个故事的细节出自宋人笔记；又按先南后北的方略，先后灭了荆南、湖南、后蜀、南汉、南唐。开宝九年（976 年）十月他突然去世，弟弟赵光义继位，关于他的死因，宋人笔记中有“烛影斧声”的记载，成为千古疑案。
sources: []
recalled:
  - 《宋史·太祖本纪》
  - 《续资治通鉴长编》卷一
