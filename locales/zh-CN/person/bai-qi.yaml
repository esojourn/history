name: 白起
aliases: [公孙起, 武安君]
role: 秦国大将
summary: 秦国名将，伊阙、鄢郢、长平等战屡破强敌，后被秦昭王赐死。
body: |-
  白起是秦国郿人，生年不详，善于用兵，侍奉秦昭襄王。据《史记·白起王翦列传》，公元前 293 年，白起在伊阙大败韩魏联军，斩首二十四万，升为国尉。公元前 279 年至前 278 年，他率军攻楚，先拔鄢城，再破楚都郢，烧毁楚先王的陵墓夷陵，楚国被迫迁都于陈，秦以郢为南郡，白起被封为武安君。公元前 273 年他在华阳大破魏赵联军。

  公元前 262 年，秦攻韩国的上党，上党郡守冯亭降赵，秦赵之间爆发长平之战。秦国使用反间计，使赵国以赵括代替坚守不出的廉颇，秦国暗中改派白起为主将。公元前 260 年，白起佯败诱敌，断绝赵军粮道，把赵军四十余万人围困四十六天，赵括突围被射死，赵军投降。白起把降卒全部坑杀，只放回年幼的二百四十人。《史记》说长平之战秦军前后斩首俘虏四十五万人，这些数字是否确切，学界有讨论，但长平之战极其惨烈是无疑的。

  长平战后，白起想乘胜灭赵，范雎担心他功劳太大，劝昭王接受韩、赵割地讲和。后来秦军围攻邯郸不利，昭王命白起出征，白起认为时机已失，称病不肯赴任。公元前 257 年，他被贬为士卒，迁往阴密，走到咸阳西门外的杜邮，昭王派人赐剑命他自杀。据《史记》，白起临死前说：“我固当死。长平之战，赵卒降者数十万人，我诈而尽坑之，是足以死。”遂自杀。
sources: []
recalled:
  - 《史记·白起王翦列传》
  - 《史记·秦本纪》
  - 《战国策·中山策》
