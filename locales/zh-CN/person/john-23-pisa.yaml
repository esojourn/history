name: 约翰二十三世（比萨系）
aliases:
  - 巴尔达萨雷·科萨
  - 对立教皇约翰二十三世
role: 比萨一系的教皇
summary: 大分裂末期比萨一系的教皇，召集康斯坦茨会议，拘禁胡斯，后出逃被会议废黜。
body: |-
  巴尔达萨雷·科萨约在 1370 年生于那不勒斯一带的贵族家庭，在博洛尼亚学法律，1402 年任枢机，作教皇的代表治理博洛尼亚。1409 年他是比萨会议的主要推动者；会议废掉罗马、阿维农两位教皇，另选亚历山大五世，结果成了三位并立。次年亚历山大五世去世，科萨继任，称约翰二十三世。

  《历史的轨迹》第二十章称他为“亚威农的约翰廿三世”，他其实属于比萨一系。该书说，他为了同那不勒斯国王作战而发售赎罪券，胡斯起来反对，被他革除教籍；胡斯到康斯坦茨几星期后，被他以异端的罪名关进监牢。

  1413 年他被赶出罗马，不得不依靠西吉斯蒙德，答应召开大公会议。会议在 1414 年 11 月开幕后按“民族”投票，意大利籍主教人数虽多也占不了上风，三位教皇都被要求退位。1415 年 3 月他乔装逃出康斯坦茨，不久被捉回，5 月 29 日被会议废黜，关押了三年。1419 年他到佛罗伦萨向马丁五世表示服从，同年底在那里去世。天主教会不把他算作正式的教皇，1958 年当选的教皇又用了约翰二十三世这个名号。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十九章“教会权势衰微” https://wellsofgrace.com/books/spiritual/2000years/html/chapter21.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 尼姆的迪特里希《约翰二十三世行状》
  - 康斯坦茨会议第 12 次会议（1415 年 5 月 29 日）判决
