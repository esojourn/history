name: 以撒
aliases: []
role: 族长
summary: 亚伯拉罕与撒拉所生的应许之子，以扫和雅各的父亲。
body: |-
  亚伯拉罕和撒拉的儿子，亚伯拉罕一百岁时出生，第八日受割礼（《创世记》21:1—5）。圣经没有明说他生在何处。第 22 章记神叫亚伯拉罕带他往摩利亚地去献为燔祭；路上他问父亲燔祭的羊羔在哪里，后来被捆绑放在坛的柴上，耶和华的使者拦住亚伯拉罕，一只公羊代替他被献上。圣经没有记当时他的年纪。

  亚伯拉罕差老仆人回本族，从拿鹤的城为他带回彼土利的女儿利百加（第 24 章）。据创 25:20，他娶利百加时四十岁。利百加不生育，他为妻子祈求，六十岁时得了双生子以扫和雅各（25:21—26）。他爱以扫，利百加爱雅各（25:28）。

  因饥荒他住到基拉耳，耶和华吩咐他不要下埃及，并向他重申对亚伯拉罕的应许。他在那里也称妻子为妹妹，被非利士人的王亚比米勒发觉。他耕种、牧放都很兴旺，非利士人嫉妒他，塞住他父亲在世时所挖的井；他几次另挖新井，后来到别是巴，与亚比米勒立约（第 26 章）。

  他年老眼睛昏花，要在死前给长子以扫祝福。利百加叫雅各扮作以扫，他把长子的福给了雅各；以扫回来后事情才显明，他说雅各将来也必蒙福（第 27 章）。随后他打发雅各往巴旦亚兰去娶妻（28:1—5）。据创 35:27—29，雅各后来回到希伯仑幔利他父亲那里；以撒享寿一百八十岁，以扫和雅各把他安葬。按 49:31，他葬在麦比拉洞。
sources: []
recalled:
  - 《创世记》第 21—28 章、35:27—29、49:31
  - 《希伯来书》11:17—20
