name: 郑芝龙
aliases: [一官, 尼古拉, 平国公]
role: 明末海商首领，南明隆武朝重臣
summary: 海商出身，受明朝招安，拥立隆武帝，后降清，被清朝处死。
body: |-
  郑芝龙是福建南安人，小名一官。他少年时到澳门投靠舅舅，学会了葡萄牙语，受洗加入天主教，教名尼古拉。后来他到日本平户，依附海商首领李旦，与日本女子田川氏结婚，生下郑成功。李旦死后，郑芝龙继承了他的大部分船队，在台湾海峡一带从事海上贸易和劫掠，与荷兰人时而合作、时而竞争。

  崇祯元年（1628 年）郑芝龙接受明朝的招安，任海防游击，此后他利用官方身份打击其他海盗集团，崇祯六年（1633 年）又在金门料罗湾击败荷兰东印度公司的舰队。到崇祯末年，他控制了中国东南沿海的海上贸易，往来船只要向他交纳“牌饷”。

  顺治二年（1645 年）南京弘光政权覆灭后，郑芝龙和黄道周等人在福州拥立唐王朱聿键为帝，改元隆武，郑芝龙封平国公，掌握兵权。次年清军进攻福建，郑芝龙认为大势已去，不顾儿子郑成功的苦劝，降清，被清军带到北京，隆武帝在汀州被俘遇害。此后清朝多次让郑芝龙写信招降郑成功，都没有成功。顺治十四年（1657 年）郑芝龙被削爵下狱，顺治十八年（1661 年）在北京被处死，家属多人一同被杀。
sources: []
