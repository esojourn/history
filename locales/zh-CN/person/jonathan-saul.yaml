name: 约拿单
aliases: []
role: 扫罗的长子
summary: 扫罗之子，在密抹击败非利士人，与大卫结盟为友，战死于基利波山。
body: |-
  约拿单是以色列王扫罗的儿子，在扫罗众子的名单里列在最前（《撒母耳记上》14:49）。圣经没有记载他的生年。据第 14 章，他只带着拿兵器的少年人，越过密抹的隘口去攻击非利士人的防营，据 14:14 起头所杀的约有二十人，以色列人乘势得胜。那一天扫罗曾叫百姓起誓不到晚上不可吃什么，约拿单不知情，吃了蜂蜜；扫罗要治死他，百姓把他救了下来。

  大卫击杀歌利亚以后，约拿单与他结盟，18:1–4 说他爱大卫如同爱自己的性命，把自己的外袍、战衣、刀、弓、腰带都给了大卫。扫罗要杀大卫，约拿单先为大卫向父亲说情，后来又与大卫约定以射箭为暗号，探明父亲的心意，让大卫逃走（第 19—20 章）。大卫躲在西弗的旷野，约拿单去见他，两人再次立约（23:16–18）。

  约公元前 1010 年，约拿单与父亲、兄弟一同在基利波山与非利士人作战，被杀（31:2）。大卫为扫罗和约拿单作了一首哀歌（《撒母耳记下》1:17–27）。约拿单留下一个瘸腿的儿子米非波设，大卫作王以后因约拿单的缘故恩待他，让他常在王的席上吃饭（撒下第 9 章）。
sources: []
recalled:
  - 《撒母耳记上》第 14 章、第 18—20 章、第 23 章、第 31 章
  - 《撒母耳记下》第 1 章、第 9 章
