name: 斯提利科
aliases: [弗拉维乌斯·斯提利科, 斯提里科, 史提里科]
role: 西罗马统帅、摄政
summary: 汪达尔人后裔的罗马统帅，辅佐霍诺里乌斯，两败阿拉里克，后被处死。
body: |-
  斯提利科约生于公元 359 年，父亲是在罗马军中带骑兵的汪达尔人，母亲是罗马人。他年轻时随使团去过波斯，回来后娶了狄奥多西一世的侄女兼养女塞蕾娜，一路升到统兵大将。因为他生在帝国、一生为罗马效力，本站没有把他归入汪达尔人一派。

  395 年 1 月狄奥多西在米兰去世，十岁的霍诺里乌斯在西部继位。斯提利科说先帝临终把两个儿子都托付给他，东部的朝廷不认这个说法，双方从此不和，东部一度宣布他为公敌。阿拉里克的哥特人在希腊劫掠，他两次率军前往，都让对方走脱，原因当时就有争议。397 年北非的吉尔多倒向东部、扣住运往罗马的粮食，他派兵平定。他把两个女儿先后嫁给霍诺里乌斯。

  401 年底阿拉里克侵入意大利。次年复活节，斯提利科在波伦提亚与之交战，夺回被掳的人口和财物，随后在维罗纳再胜，迫使哥特人退出意大利。朝廷从此迁到拉文纳。406 年，拉达盖苏斯带着另一大群蛮族南下，他在佛罗伦萨附近将其围歼。为了保卫意大利，他调走了莱茵河和不列颠的驻军；这年最后一天，汪达尔人、阿兰人和苏维汇人越过莱茵河，次年不列颠的军队拥立君士坦丁三世，高卢随之失守。

  408 年，他想借阿拉里克之力同东部争夺伊利里亚，为此强迫元老院付给阿拉里克四千磅黄金，元老们十分愤恨。这时东部的皇帝阿卡狄乌斯去世，大臣奥林匹乌斯散布说，他要立自己的儿子做东部的皇帝。8 月驻帕维亚的军队哗变，杀了他的亲信。他回到拉文纳，躲进教堂，得到保全性命的许诺才出来，随即被处死，据佐西莫斯，他不许亲兵抵抗。事后各城的罗马士兵屠杀蛮族士兵的家属，佐西莫斯说有三万人转投阿拉里克。两年后罗马城陷落。
sources: []
