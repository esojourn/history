name: 英诺森三世
aliases:
  - 依诺森三世
  - 诺森三世
  - 塞尼的洛塔里奥
role: 罗马主教（教皇）
summary: 教皇权势极盛时的教皇，使多国君主称臣，召开第四次拉特兰会议。
body: |-
  英诺森原名洛塔里奥，约在 1161 年生于罗马东南加维尼亚诺的塞尼伯爵家。《历史的轨迹》第十八章说他在巴黎学语言学，在博洛尼亚学法律；一般的记载是在巴黎学神学。他二十九岁任枢机，1198 年 1 月当选教皇，年三十七岁。

  该书引他的话说，神把权柄赐给彼得，不只是让他管辖普世教会，也让他管理全世界。他在一封信里把教皇与君王比作太阳和月亮，月亮的光是从太阳来的。他又提出“由于罪”的原则：纯属政治的事归君王，但君王的行为涉及罪时，教皇有权也有责任干预。该书分析他得势的原因，除了贵格利七世的榜样、当时被信以为真的“君士坦丁御赐教产谕”和十字军之外，还有时势：腓特烈一世的儿子早死，留下三岁的腓特烈二世，欧洲没有一个强大的君主能向他挑战。

  他收回了教皇国的土地。德意志两人争位，他先支持奥托四世并为他加冕，后来又革除他的教籍，改立自己监护过的腓特烈二世。法王腓力二世休妻，他对法国下禁令，迫使国王让步。英王约翰不接受他指定的坎特伯雷大主教，他在 1208 年对英格兰下禁令，停止一切教会礼仪，次年革除约翰的教籍；1213 年约翰屈服，把英格兰和爱尔兰献给罗马教会，再作为封地领回，每年纳贡一千马克。《历史的轨迹》说，除法王以外，各国君主都承认自己是教皇的封臣。

  他在位时的两次十字军都偏离了原意。第四次十字军在 1204 年攻占了君士坦丁堡，他事先曾禁止攻打基督徒，事后接受了既成的拉丁帝国。1208 年他的使节在法国南部被杀，他号召出兵讨伐那里的亚尔比根派。阿西西的方济各和道明创立的两个修会都在他任内开始。

  1215 年他召开第四次拉特兰会议，这是他权势的顶点。次年 7 月他在佩鲁贾去世，当时正在筹备新的十字军。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 《英诺森三世行传》
  - 英诺森三世《书信录》（含 1198 年论日月的信、1204 年教令 Novit）
  - 温多弗的罗杰《历史之花》1208—1213 年
  - 1215 年第四次拉特兰会议教规
