name: 佛图澄
aliases: [竺佛图澄, 大和尚]
role: 僧人
summary: 西域僧人，永嘉年间来到中原，受石勒、石虎尊奉，使佛教在北方广泛传布。
body: |-
  佛图澄是西域人，本姓帛，一说是天竺人。据《高僧传》和《晋书·艺术传》，他在晋怀帝永嘉四年（公元 310 年）来到洛阳，想在那里建立寺院，不久洛阳陷于战乱，没有办成。两书都说他去世时已一百一十七岁，这个岁数无从核实，他的生年只能说不详。

  他通过石勒的部将郭黑略见到石勒。两书记载了他许多预言吉凶、施行法术的事迹，说他借此取得石勒的信任，并劝石勒少行杀戮。石虎即位后对他更加尊崇，称他为“大和尚”，朝会时让太子和王公扶他上殿。

  当时有官员上奏说，佛是外国的神，汉人不应出家。石虎下书回答，自己生在边地，佛既是戎神，正该供奉，各族百姓愿意信佛的都听其出家。《高僧传》说他前后的门徒将近一万，所到的州郡共建了八百九十三所寺院。他的弟子里有道安、竺法汰等人，后来都成为一方的佛教领袖。建武十四年（348 年）十二月，他在邺城的寺中去世，次年石虎死，后赵大乱。
sources: []
recalled:
  - 《高僧传·竺佛图澄传》
  - 《晋书·艺术传·佛图澄》
