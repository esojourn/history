name: 年羹尧
aliases: [亮工]
role: 川陕总督、抚远大将军
summary: 雍正帝的亲信重臣，平定青海罗卜藏丹津之乱，后被赐死。
body: |-
  年羹尧是汉军镶黄旗人，康熙三十九年（1700 年）考中进士，后来他的妹妹嫁给雍亲王胤禛为侧妃，他也成为胤禛的亲信。他在康熙后期升任四川巡抚、四川总督，参与了对西藏和青海的用兵。

  雍正帝即位后，年羹尧任川陕总督、抚远大将军。雍正元年（1723 年）青海和硕特部首领罗卜藏丹津起兵反清，年羹尧与岳钟琪率军进剿，次年春天岳钟琪率精兵奔袭，迅速平定了叛乱，清朝随后在青海设立西宁办事大臣，加强了对青海的统治。雍正帝对年羹尧极为倚重，封他为一等公，在朱批中称他为“恩人”，说要做“千古君臣知遇榜样”。

  此后年羹尧居功自傲，在西北任用私人，排场很大，接见地方官员态度傲慢，雍正帝对他的不满逐渐加深。雍正三年（1725 年）年羹尧在贺表中把“朝乾夕惕”写成“夕阳朝乾”，雍正帝借此发难，把他调任杭州将军，随后一贬再贬。同年底朝臣议定他九十二条大罪，雍正帝令他在狱中自尽。年羹尧的兴衰，被认为是雍正帝打击功臣、集中皇权的一个例子。
sources: []
recalled:
  - 《清史稿·年羹尧传》
  - 《清世宗实录》
