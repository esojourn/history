name: 顾宪成
aliases: [东林先生, 泾阳]
role: 东林书院的创办者
summary: 被革职回乡后重建东林书院，讲学议政，被视为东林党的领袖。
body: |-
  顾宪成是常州府无锡县人，万历八年（1580 年）考中进士，在户部、吏部任职。他敢于直言，曾因反对张居正而受到排斥。万历年间他支持立皇长子朱常洛为太子，在“国本之争”中与内阁意见不合。万历二十二年（1594 年）他任吏部文选司郎中，在会推阁臣时推举了万历帝不喜欢的人，被革职回乡。

  万历三十二年（1604 年）顾宪成与弟弟顾允成、高攀龙等人在无锡重修宋代杨时讲学的东林书院，定期集会讲学。他们讲学之余也议论朝政、品评人物，书院的对联“风声雨声读书声声声入耳，家事国事天下事事事关心”相传就是顾宪成所作。一些在朝的官员与他们声气相通，反对者称他们为“东林党”（另见“东林党争”条）。

  万历三十九年（1611 年）朝廷考察京官，东林一派与齐、楚、浙等派别激烈争斗，顾宪成写信为淮抚李三才辩护，被对手攻击为遥控朝政。次年他在家乡去世。天启年间东林书院被阉党拆毁，崇祯初年才恢复。
sources: []
recalled:
  - 《明史·顾宪成传》
  - 黄宗羲《明儒学案·东林学案》
