name: 北齐后主
aliases: [高纬, 高仁纲]
role: 皇帝
summary: 北齐的末代皇帝，宠信奸佞、杀害名将，577 年北齐被北周所灭。
body: |-
  高纬字仁纲，北齐武成帝高湛的长子。河清四年（公元 565 年），武成帝把皇位传给十岁的他，自称太上皇，仍掌握实权，直到 568 年去世。

  他在位期间宠信乳母陆令萱及其子穆提婆、和士开、高阿那肱等人，卖官鬻爵，朝政败坏。他先后杀害斛律光、兰陵王高长恭等名将，北齐的军事力量大为削弱。他宠爱冯淑妃（冯小怜），常带她出游打猎。

  武平七年（576 年），北周武帝进攻平阳（晋州）。据史书记载，告急文书传来时，他正与冯淑妃在外打猎，冯淑妃要求再打一围，他便没有立即回师。随后齐军在平阳城下大败，他逃回晋阳，又逃到邺城。次年正月，他把皇位传给八岁的太子高恒，自己向东逃往青州，想投奔陈朝，途中被周军俘获，北齐灭亡（另见“北周灭北齐”条）。

  他被押到长安，北周封他为温国公。同年十月，北周以谋反的罪名把他和北齐宗室一并赐死，年二十二。
sources: []
recalled:
  - 《北齐书·后主纪》
  - 《资治通鉴》卷一百六十九至一百七十三
