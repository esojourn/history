name: 周亚夫
aliases:
  - 条侯
role: 太尉、丞相
summary: 周勃之子，封条侯。屯军细柳以军纪严明著称，任太尉平定七国之乱。
body: |-
  绛侯周勃之子，生年不详。据《史记·绛侯周勃世家》，他原任河内郡守，兄长周胜之因罪失去爵位后，文帝封他为条侯，延续周勃的封爵。文帝后六年（公元前 158 年）匈奴大举入边，他以将军驻军细柳。文帝前往劳军，也要派使者持节通报后才得入营。文帝称他是“真将军”，临终前嘱咐太子，有急事可以让周亚夫领兵。

  前 154 年吴楚七国起兵，他以太尉率军东出，进驻昌邑，深沟高垒，坚守不战，任凭吴军猛攻梁国也不去救，只派轻骑断绝吴楚的粮道。吴军饥饿退走，他出精兵追击，大破吴军，前后三个月平定叛乱。五年后他升任丞相，因反对废栗太子、反对封皇后之兄王信为侯，与景帝渐渐疏远，景帝中三年因病免相。后来他因儿子私买殉葬用的甲盾一事受牵连，被召到廷尉，绝食五日，吐血而死。《汉书·景帝纪》把此事记在后元年（前 143 年）。
sources:
  - 《史记·绛侯周勃世家》 https://ctext.org/shiji/jiang-hou-zhou-bo-shi-jia/zhs
  - 《史记·吴王濞列传》 https://ctext.org/shiji/wu-wang-bi-lie-zhuan/zhs
  - 《汉书·景帝纪》 https://ctext.org/han-shu/jing-di-ji/zhs
