  - 《加拉太书》第 1—2 章
  - 《腓立比书》3:4–6
  - 《哥林多后书》第 11 章
  - 罗马的革利免《致哥林多人前书》第 5 章
  - 优西比乌《教会史》卷 2 第 25 章
