name: 保罗
aliases:
  - 扫罗
  - 大数的扫罗
role: 外邦人的使徒
summary: 原为迫害教会的法利赛人，归信后三次远行布道，新约多封书信归于他名下。
body: |-
  原名扫罗，又名保罗（《使徒行传》13:9），生在基利家的大数（徒 22:3），生年新约没有记载。他自述属便雅悯支派，是法利赛人（《腓立比书》3:5），生来就是罗马公民（徒 22:28），在耶路撒冷迦玛列门下受教（徒 22:3），以制造帐棚为业（徒 18:3）。司提反被石头打死时他在场，并且赞同（徒 7:58、8:1），此后又进各人的家捉拿信徒下监（徒 8:3）。

  据《使徒行传》第 9 章，他带着大祭司的文书往大马色（大马士革）捉拿门徒，在路上被大光照倒，听见耶稣向他说话，随后受洗。《加拉太书》1:17–19 说他先往亚拉伯去，又回到大马色，过了三年才上耶路撒冷见矶法和主的兄弟雅各。后来巴拿巴到大数找到他，带他到安提阿，同在那里的教会一年（徒 11:25–26）。

  从安提阿出发，他先后三次远行（徒 13—21 章），足迹到居比路（塞浦路斯）、加拉太、马其顿、亚该亚和亚西亚，在哥林多（科林斯）住了一年零六个月（徒 18:11），在以弗所住了两年多（徒 19:10）。其间他上耶路撒冷，与使徒和长老商定外邦信徒不必受割礼（徒 15 章；加 2:1–10）。新约中有十三封书信题他的名，其中几封是否出自他本人，学界看法不一。

  最后一次到耶路撒冷时，他在圣殿被人拿住，由罗马驻军带走，在该撒利亚（凯撒利亚）被押两年（徒 24:27），因上告于该撒而被解往罗马，途中船在米利大搁浅。他在罗马自己所租的房子里住了足足两年（徒 28:30），《使徒行传》记到这里为止。

  新约没有记他的结局。一世纪末罗马的革利免在书信中提到他殉道；据教会传统，他在尼禄年间于罗马被斩首。他一生的年份新约没有直接记载，学界以徒 18:12 所记迦流任亚该亚方伯的时间（据德尔斐出土的铭文，约在公元 51—52 年）为主要定点前后推算，都是约数，各家相差几年。
sources: []
