name: 耶利米
aliases: []
role: 先知
summary: 犹大亡国前后的先知，劝王归服巴比伦，亲历耶路撒冷陷落。
body: |-
  便雅悯地亚拿突城的祭司希勒家的儿子。据《耶利米书》1:1–3，耶和华的话在犹大王约西亚十三年临到他，此后经约雅敬年间，直到西底家十一年五月耶路撒冷人被掳的时候。约西亚十三年通常换算为公元前 627 年前后。蒙召时他自称年幼（1:6）；生年圣经没有记载。他奉命不娶妻、不生儿女（16:1–2）。

  约雅敬登基之初，他在圣殿院中宣告这殿必如示罗，祭司和先知要治他死罪，首领和长老援引弥迦的先例，沙番的儿子亚希甘保护了他（第 26 章）。约雅敬四年，他口述，由尼利亚的儿子巴录写成书卷；书卷念给王听的时候，王用刀割破，扔在火盆里烧了，耶利米又口述重写（第 36 章）。他预言这地的人要服事巴比伦王七十年（25:11），并写信给已被掳到巴比伦的人，叫他们在那里盖房、栽种，为那城求平安（第 29 章）。

  西底家年间，他把轭加在颈项上作记号，劝王和列国归服巴比伦王尼布甲尼撒，与先知哈拿尼雅对立（第 27—28 章）。耶路撒冷被围期间，他被指为投降迦勒底人而遭拘禁，后来被下在只有淤泥的牢坑里，古实人以伯米勒把他救上来，此后他住在护卫兵的院中直到城破（第 37—38 章）。围城之中，他照耶和华的话向叔叔的儿子哈拿篾买了亚拿突的一块地，用银子十七舍客勒，作为日后这地必再有人置买房屋田地的凭据（第 32 章）。

  城破后，尼布甲尼撒吩咐护卫长尼布撒拉旦善待他。他选择留在犹大，住在米斯巴的省长基大利那里（第 39—40 章）。基大利被刺杀后，约哈难等人不听他的劝告，带着余民和他一同下埃及，到了答比匿；他在埃及仍向犹大人说预言（第 43—44 章）。此后的事圣经没有记载，他的卒年和去世地都不详；相传他在埃及被同胞用石头打死。圣经中的《耶利米书》系于他的名下，《耶利米哀歌》传统上也归于他。
sources: []
recalled:
  - 《耶利米书》第 1 章、第 16 章、第 25—29 章、第 32 章、第 36—44 章
  - 《列王纪下》第 24—25 章
