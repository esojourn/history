name: "亲岑多夫"
aliases: ["尼古拉·路德维希·冯·亲岑多夫伯爵", "钦岑多夫"]
role: "莫拉维弟兄会的复兴者"
summary: "敬虔派伯爵，收容波希米亚弟兄会余民建立赫恩胡特，开创莫拉维教会的宣教事工。"
body: |-
  亲岑多夫 1700 年生于德累斯顿，祖上是奥地利贵族。《历史的轨迹》第三十四章说，他父亲是萨克森宫廷的官员，也是施本尔的密友，施本尔做了他的教父。一幅耶稣钉十架的画，上面写着“我为你被钉死，你为我做何事？”，给他留下长远的印象。

  该书说，他十岁被送到弗兰克在哈雷的学校，在男同学中组织了“芥菜种会”，宗旨是促进个人敬虔生活和世界宣道；九岁时他已读过东印度宣教士的报导，十二岁时与同学立誓，无论什么环境都要承认基督、带领人归向基督。家里反对他做宣教士，要他从政，他顺从父母，1716 至 1719 年在维滕贝格大学读法律，后来进萨克森政府任职，又用继承的遗产买下祖母在贝特尔斯多夫的大片地产。

  1722 年木匠克里斯蒂安·大卫请求让受逼迫的弟兄会余民到他的地产上避难，他出于同情答应了；到 1727 年已有几百人住进来，建起“赫恩胡特”，意思是“主的守望”（书中译为“主的居所”）。他读了夸美纽斯写弟兄会的书，相信神呼召他把古代弟兄会重新组织起来，推动宣教。他辞去官职定居赫恩胡特，按施本尔的原则在教会中成立小教会。该书说，1727 年 8 月 12 日的一次圣餐聚会中，全体感到圣灵强烈的工作，这一天被定为弟兄会再生之日；一般记载这次圣餐聚会是 8 月 13 日。

  他本属敬虔的路德派，希望弟兄会留在路德派之内，但他们最终组织了自己的教会，有主教、长老、执事。1732 年起弟兄会差派宣教士到西印度、格陵兰等地；该书说他们是复原教中最先认真遵行“大使命”的教会。他强调基督受死，讲道和诗歌很重感情，一度对基督肋旁的伤口多有幻想，后来渐渐放弃。1736 年他被萨克森放逐，到过荷兰、英国和北美，1747 年获准回国。第三十六章说约翰·卫斯理归正后曾到德国见他，在赫恩胡特住了两个礼拜。他 1760 年死于赫恩胡特。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十四章“敬虔主义 莫拉维弟兄会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter38.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十六章“循道派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter40.html"
recalled:
  - "赫恩胡特 1727 年的《兄弟协约》"
