name: 品达
aliases: [品达罗斯]
role: 抒情诗人
summary: 底比斯人，以歌颂竞技会优胜者的合唱颂歌传世。
body: |-
  彼奥提亚人，生于底比斯附近的村子库诺斯刻法莱，一生以底比斯为家。生卒年是约数：他有诗提到自己生在皮托竞技会举行的那一年，古人据此定在公元前 518 年或前 522 年；可以确定年代的作品中，最早的是前 498 年的《皮托颂》第十首，最晚的是前 446 年的《皮托颂》第八首。古代的传记说他年轻时在雅典学过音乐。

  亚历山大的学者把他的作品编为十七卷，包括颂神歌、酒神颂、少女歌、挽歌等多种体裁。完整流传下来的只有四卷凯歌，按竞技会分为《奥林匹亚颂》《皮托颂》《涅墨亚颂》《伊斯特摩斯颂》，共四十五首，其余只存残篇。凯歌是受优胜者或其家族委托而作的，由歌队在庆典上边唱边舞。诗中通常只用几句交代比赛，主要篇幅用来讲一段与优胜者的城邦或家族有关的神话，穿插格言，告诫人在得意时不要逾越凡人的限度。他的句子长，转折突兀，古人已觉得难读；罗马诗人贺拉斯把他比作冲出河岸的山洪。

  请他写诗的有叙拉古僭主希耶隆、阿克拉加斯僭主塞隆、昔兰尼国王阿尔刻西拉斯，以及埃吉那等地的贵族家族。前 476 年前后他去过西西里，《奥林匹亚颂》第一首就是庆贺希耶隆的赛马在那一年获胜。

  前 480 年波斯入侵时，底比斯站在波斯一边，战后受到惩处；他的诗里对这段往事说得很含蓄。他写过一首酒神颂，称雅典为“希腊的支柱”，后来的作家说底比斯人为此罚了他的款，雅典人替他付了。古人说他八十岁死在阿尔戈斯，没有更早的佐证。据阿里安和普鲁塔克，前 335 年亚历山大毁灭底比斯时，下令保留品达的故居，不伤害他的后人。
sources: []
recalled:
  - 品达《皮托颂》第 8、10 首；《奥林匹亚颂》第 1 首；残篇第 76 首
  - 贺拉斯《颂诗集》卷四第 2 首
  - 阿里安《亚历山大远征记》卷一第 9 章
