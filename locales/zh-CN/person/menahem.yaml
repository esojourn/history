name: 米拿现
aliases: []
role: 北国以色列王
summary: 迦底的儿子，杀沙龙自立，在撒玛利亚作王十年，向亚述王普勒纳贡。
body: |-
  迦底的儿子。据《列王纪下》15:14，他从得撒上到撒玛利亚，杀了作王才一个月的沙龙，自己作王。15:16 说，那时他从得撒起攻打提斐萨和它的四境，因为那里的人没有给他开城门，他就攻破那城，把城中所有的孕妇剖开。提斐萨在哪里有不同说法。

  据 15:17–18，犹大王亚撒利雅三十九年，米拿现登基作以色列王，在撒玛利亚作王十年；经文说他终身行恶。亚述王普勒来攻击以色列，米拿现给了普勒一千他连得银子，请他帮助坚定国位；这笔银子向以色列的富户索取，每人五十舍客勒，亚述王就回去了（15:19–20）。

  一般认为普勒就是亚述王提革拉毗列色三世，亚述铭文的纳贡名单中也有“撒玛利亚的米拿现”。米拿现死后，儿子比加辖接续作王（15:22）。
sources: []
recalled:
  - 《列王纪下》15:14–22
  - 《历代志上》5:26
  - 亚述王提革拉毗列色三世年代记铭文
