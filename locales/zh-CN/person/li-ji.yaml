name: 李勣
aliases: [徐世勣, 李世勣, 李懋功, 英国公]
role: 大将
summary: 出身瓦岗军的唐初名将，镇守北边多年，668 年率军攻灭高句丽。
body: |-
  李勣本名徐世勣，字懋功，曹州离狐人。隋末他十七岁时加入翟让的瓦岗军，后随李密。武德元年（公元 618 年）李密降唐，徐世勣据守李密旧有的郡县，他把当地的户口和兵马登记成册，交给李密，让李密亲自献给唐朝，而不自己邀功。唐高祖得知后称他为“纯臣”，赐姓李，所以又称李世勣，高宗时为避太宗的名讳，改名李勣。

  他此后参与平定窦建德、王世充和刘黑闼。贞观年间，他任并州都督十余年，镇守北方边境，太宗称他胜过长城。贞观四年（630 年）他与李靖一同出兵攻灭东突厥，贞观十五年（641 年）又击败薛延陀。贞观十七年（643 年）他支持立晋王李治为太子，太宗临终前把他贬为叠州都督，以便新君即位后再加提拔，示恩于他。

  永徽六年（655 年）高宗想立武昭仪为皇后，询问李勣，据《资治通鉴》，他回答说这是陛下的家事，何必问外人，高宗于是决意立后（另见“废王立武”条）。乾封元年（666 年）高句丽内乱，他以七十多岁的高龄任辽东道行军大总管，总章元年（668 年）攻克平壤，高句丽灭亡（另见“唐灭高句丽”条）。总章二年（669 年）十二月他去世，年七十六。他的孙子徐敬业在光宅元年（684 年）起兵反对武则天，失败后李勣的官爵被追削，坟墓被掘，后来才恢复。
sources: []
recalled:
  - 《旧唐书·李勣传》
  - 《新唐书·李勣传》
  - 《资治通鉴》卷一百八十六至二百一
