name: 项羽
aliases: [项籍, 西楚霸王, 项王]
role: 西楚霸王
summary: 名籍字羽，下相人，巨鹿破秦后自立为西楚霸王，与刘邦争天下而败。
body: |-
  项羽名籍，字羽，下相人，楚将项燕之孙。《史记·项羽本纪》说他“初起时，年二十四”，据此生于公元前 232 年。秦二世元年（前 209 年）九月，他随叔父项梁在吴杀会稽郡守起兵，得精兵八千人渡江西进；项梁在定陶战死后，怀王以宋义为上将军、项羽为次将，北上救赵。

  宋义在途中停留不进，项羽杀之，夺取兵权，率军渡河，“皆沉船，破釜甑，烧庐舍，持三日粮”，在巨鹿城下大破秦军，俘虏王离，从此成为诸侯上将军。章邯投降后，他在新安坑杀秦降卒，《项羽本纪》称有二十余万人。入关后他在鸿门会见先到的刘邦，数日后引兵屠咸阳，杀秦王子婴，焚烧秦宫室，随后分封诸侯，自立为西楚霸王，统九郡，都彭城（前 206 年）。

  同年刘邦自汉中还定三秦，楚汉相争开始。项羽在彭城大败汉军，又长期把刘邦困在荥阳、成皋一带，但后方屡遭彭越袭扰，齐地为韩信所取。前 203 年双方约定以鸿沟为界，项羽东归，汉军随后追击。汉五年十二月（前 202 年初），他被围于垓下，夜闻四面楚歌，率八百余骑突围，到东城只剩二十八骑。到乌江边，亭长备船请他渡江，他不肯，自刎而死。
sources:
  - 《史记·项羽本纪》 https://zh.wikisource.org/wiki/史記/卷007
  - 《史记·高祖本纪》 https://zh.wikisource.org/wiki/史記/卷008
  - 《汉书·高帝纪》 https://zh.wikisource.org/wiki/漢書/卷001
