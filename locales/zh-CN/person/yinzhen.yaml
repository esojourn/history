name: 雍正帝
aliases: [胤禛, 清世宗]
role: 清朝第五位皇帝
summary: 康熙帝第四子，设军机处，推行摊丁入亩、改土归流，勤政而严苛。
body: |-
  胤禛是康熙帝的第四个儿子，康熙三十七年（1698 年）封贝勒，四十八年（1709 年）封雍亲王。康熙晚年诸皇子争夺储位，形成多个派别，胤禛表面上不露声色，自称“天下第一闲人”，与佛教僧人交往，同时得到隆科多、年羹尧等人的支持。

  康熙六十一年（1722 年）十一月康熙帝在畅春园去世，步军统领隆科多宣布遗诏传位给胤禛，胤禛即位，次年改元雍正。民间长期流传他篡改遗诏、把“传位十四子”改为“传位于四子”等说法，史学界一般认为这类说法不可靠，但他继位的具体过程确实有不少疑点，至今仍有争论。即位后，他囚禁了与他争位的兄弟允禩、允禟等人，两人不久死去；后来又先后处置了年羹尧和隆科多。

  雍正帝勤于政事，据说每天批阅奏折到深夜，留下了大量朱批。他推行“摊丁入亩”，把丁银并入田赋征收（另见“摊丁入亩”条）；实行“火耗归公”，把地方官私征的附加税改为公费，从中发给官员“养廉银”；清理各省钱粮亏空，惩治贪官。他在西南推行“改土归流”，以流官取代土司（另见“改土归流”条）。雍正七年（1729 年）前后因对准噶尔用兵，设立军机房，后来称军机处，成为皇帝直接控制的中枢机构（另见“设立军机处”条）。他还确立了秘密立储的制度，把继承人的名字写好藏在乾清宫“正大光明”匾额后面。

  雍正帝也兴起多次文字狱，曾静、吕留良案影响最大，他还把自己与曾静的问答编成《大义觉迷录》颁行全国（另见“清代文字狱”条）。他在雍正元年（1723 年）下令禁止天主教在各地传教。雍正十三年（1735 年）八月他在圆明园突然去世，年五十八岁，死因史书没有明确记载，民间有被刺杀、服丹药中毒等说法，后一说有一定的史料线索。皇四子弘历继位。
