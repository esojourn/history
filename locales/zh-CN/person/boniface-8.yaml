name: 波尼法修八世
aliases:
  - 卜尼法斯八世
  - 博义八世
  - 本笃·卡埃塔尼
role: 罗马主教（教皇）
summary: 发布《一圣教谕》宣称教皇至上的教皇，与法王腓力四世相争，在阿纳尼受辱。
body: |-
  波尼法修原名本笃·卡埃塔尼，约在 1235 年生于罗马东南的阿纳尼，是教会法学者，1281 年任枢机。1294 年隐修士出身的教皇塞莱斯廷五世在位五个月后辞职，卡埃塔尼当选继任，把辞职的前任看管起来，直到他去世。《历史的轨迹》第十九章说他博学而自大，就任典礼极其壮观，上马时左右各有一位国王为他扶马镫。

  法王腓力四世为筹措战费向教士征税。1296 年波尼法修下诏，不经教皇许可，教士不得向世俗君主纳税；腓力禁止金银出境，断了教廷在法国的收入，教皇只得让步。1300 年他宣布这一年为禧年，到罗马朝圣的人极多。1301 年腓力逮捕一位主教，争端再起。1302 年法王召集贵族、教士、市民三个等级开会，都站在国王一边。同年 11 月波尼法修发布《一圣教谕》，说教会有属灵和属世两把剑，属世的剑要在属灵权柄之下使用，末了说：服从罗马教皇是每一个人得救所必需的。

  《历史的轨迹》说他像贵格利七世一样革除了法王的教籍，却没有效果，因为时代变了：封建贵族已经衰落，法国人的民族意识兴起，百姓团结在国王周围。按其他记载，他在 1303 年 4 月宣布凡阻挠法国教士前往罗马的人都已受绝罚，点名处分腓力的诏书定在 9 月 8 日公布。前一天，法王的大臣诺加雷和与教皇有仇的科隆纳家族带兵冲进阿纳尼的教皇宅邸，把他扣押了三天，镇民起来才把他救出。

  《历史的轨迹》说兵丁对这位八十七岁的老人拳打脚踢，却没有能拘捕他，他回到罗马几天后去世。他当时大约七十岁，是否挨了打各书说法不一；他回罗马后约一个月，于 1303 年 10 月 11 日去世。该书认为，这次失败标志着教皇权势衰落的开始。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十九章“教会权势衰微” https://wellsofgrace.com/books/spiritual/2000years/html/chapter21.html"
recalled:
  - 1296 年《教士不纳俗税》、1302 年《一圣教谕》等诏书
  - 乔万尼·维拉尼《新编年史》卷 8
  - 但丁《神曲·地狱篇》第 19 歌、《炼狱篇》第 20 歌
