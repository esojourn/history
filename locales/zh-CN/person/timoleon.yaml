name: 提摩勒昂
aliases: [提莫莱昂]
role: 科林斯将军
summary: 科林斯人，晚年受命赴西西里，赶走叙拉古僭主，击败迦太基，重建西西里的希腊城邦。
body: |-
  科林斯人，出身名门。约公元前 365 年，他的兄长提摩法涅斯倚仗一支雇佣军图谋做科林斯的僭主，提摩勒昂劝阻无效，默许或参与了刺杀兄长的行动。科林斯人对此毁誉不一，他的母亲不肯再见他。据普鲁塔克，他此后约二十年不问政事。

  前 344 年，陷于内乱的叙拉古向母邦科林斯求援，这时狄奥尼修斯二世重新占据奥尔提吉亚岛，莱昂提尼的僭主希克塔斯与迦太基人联手围攻他。科林斯选派提摩勒昂带一支不大的雇佣军前往。他避开迦太基舰队在西西里登陆，在阿德拉农击败希克塔斯。狄奥尼修斯二世把奥尔提吉亚和军队交给他，自己被送往科林斯，以平民身份度过余生。迦太基军不久撤走，提摩勒昂占领叙拉古全城，拆毁了僭主的堡垒。

  迦太基随后派大军在西西里西部登陆。在克里米索斯河（年份有前 341 年和前 339 年两说），他趁敌军半渡时进攻，又逢暴雨迎面打向迦太基人，全歼了其中由迦太基公民组成的重装部队。此后他与迦太基订约，仍以哈吕科斯河为界，并逐一废黜了西西里各城的僭主，希克塔斯等人被处死。

  叙拉古当时人口凋零，他通过科林斯向希腊各地招募移民，据普鲁塔克引古人之说，前后来了数万人。他为叙拉古订立了新的政制，然后辞去兵权，留在当地居住。晚年双目失明，遇有大事，叙拉古人仍把他用车接到剧场征询意见。他约在前 337 年去世，葬在叙拉古的市场上，人们在墓旁建了以他命名的体育场。
sources: []
recalled:
  - 普鲁塔克《提摩勒昂传》
  - 狄奥多罗斯《历史丛书》卷十六
  - 奈波斯《提摩勒昂传》
