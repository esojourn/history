name: 索福克勒斯
aliases: [索福克里斯]
role: 悲剧诗人
summary: 雅典悲剧诗人，作《安提戈涅》《俄狄浦斯王》，一生得奖最多。
body: |-
  雅典人，生于城外的科洛诺斯村，父亲索菲洛斯家境富裕。生年约在公元前 497 年或前 496 年。古代的传记说，萨拉米斯海战胜利后，少年的他被选为领唱，带领歌队绕着战利品唱凯歌。

  前 468 年他第一次参加悲剧比赛就获得头奖，据普鲁塔克，被他胜过的是埃斯库罗斯。此后六十年他写了一百二十多部剧，据古代的记载获胜十八次到二十四次不等，从未落到第三名。亚里士多德说他把演员增加到三个，并采用了布景画。今存七部：《埃阿斯》《安提戈涅》《特拉基斯妇女》《俄狄浦斯王》《厄勒克特拉》《菲罗克忒忒斯》（前 409 年）和《俄狄浦斯在科洛诺斯》。最后一部写年老失明的俄狄浦斯来到诗人的故乡科洛诺斯，在他死后由孙子于前 401 年搬上舞台。《俄狄浦斯王》被亚里士多德在《诗学》里一再举为悲剧的范例；它当年参赛只得了第二名。

  他一生参与城邦事务。前 443 年至前 442 年，他担任管理盟邦贡金的司库；前 441 年至前 440 年当选将军，与伯里克利一同参加了对萨摩斯的战争。前 413 年西西里远征失败后，雅典设立十人委员会处理危局，其中有一位索福克勒斯，一般认为就是他。医神阿斯克勒庇俄斯的崇拜传入雅典时，据说神像先安放在他家里，他死后因此被奉为英雄。

  他死于前 406 年至前 405 年冬天，比欧里庇得斯晚几个月。古人关于他死因的几种说法（被葡萄噎住、朗诵时气绝、因获胜而喜极）都是传说。阿里斯托芬在次年上演的《蛙》里说他“在世时随和，到了那边也随和”。
sources: []
recalled:
  - 亚里士多德《诗学》第 4、11、13—16 章
  - 古代《索福克勒斯传》
  - 普鲁塔克《客蒙传》第 8 章
  - 阿里斯托芬《蛙》第 76—82 行
