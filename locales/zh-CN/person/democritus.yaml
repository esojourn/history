name: 德谟克利特
aliases: [德谟克里特]
role: 哲学家
summary: 阿布德拉人，与老师留基伯创立原子论。
body: |-
  色雷斯沿海的阿布德拉人。据第欧根尼·拉尔修，他自己说在阿那克萨戈拉年老时他还年轻，比后者小四十岁，由此推算约生于公元前 460 年。古人都说他高寿，所说的岁数从九十到一百零九不等，卒年只能是约数。他的老师留基伯生平几乎无可考，古人常把两人的学说合在一起讲，亚里士多德也往往并称。

  古人说他把继承的家产用于游历，到过埃及、波斯，甚至印度，这些说法无从核实。他有一句话流传下来：我到过雅典，没有一个人认识我。柏拉图的著作里从未提到他的名字。

  他著述极多，公元 1 世纪的特拉叙洛斯为他编的书目有六七十种，涉及伦理、自然、数学、音乐、技艺各方面，全部亡佚。今存约三百条残篇，大部分是伦理方面的格言，其真伪有争议；他的自然学说主要靠亚里士多德及其注释者的转述。他认为，真实存在的只有原子和虚空。原子数目无限，不可分割，没有质的差别，只在形状、排列和位置上不同；它们在虚空中运动、碰撞、勾连，形成万物以至无数个世界。甜、苦、冷、热、颜色，都只是约定俗成的说法，实际上只有原子和虚空。灵魂也由一种精细的球形原子组成。一切都出于必然而发生。他这样回应巴门尼德：承认原子本身不生不灭，同时承认“不存在”（虚空）也和存在一样真实，于是变化和多样就可以解释了。

  在伦理方面，他把人生的目的说成是一种安宁愉快的心境，靠节制和分辨快乐来达到。后世因此称他为“欢笑的哲学家”，与“哭泣的”赫拉克利特相对。他的原子论由伊壁鸠鲁继承并加以改动，又经罗马诗人卢克莱修的《物性论》流传到近代。
sources: []
recalled:
  - 亚里士多德《形而上学》卷一第 4 章；《论生成与毁灭》卷一第 2、8 章
  - 塞克斯都·恩披里柯《驳数学家》卷七第 135—139 节
  - 第欧根尼·拉尔修《名哲言行录》卷九第 34—49 节
