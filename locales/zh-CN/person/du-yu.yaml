name: 杜预
aliases: [杜元凯, 当阳侯, 杜武库]
role: 镇南大将军
summary: 西晋名将、学者，指挥灭吴之役的中路，撰有《春秋左氏经传集解》。
body: |-
  杜预字元凯，京兆杜陵人，祖父杜畿、父亲杜恕都是曹魏的官员。司马昭执政时，他娶了司马昭的妹妹高陆公主。曹魏伐蜀时他在钟会军中任长史，钟会作乱，他得以幸免。入晋后他参与修订律令，并为新律作注；任度支尚书期间提出过许多有关财政、历法、水利的建议，又在黄河富平津架起浮桥。他学问广博，朝野称他为“杜武库”。

  咸宁四年（公元 278 年）羊祜病重，举荐他接替自己。他以镇南大将军都督荆州诸军事，驻襄阳，多次上表请求及早伐吴。咸宁五年冬晋军六路出兵，他攻取江陵，招降沅、湘以南各郡。当时有人主张等到冬天再进兵，他说如今兵威已振，“譬如破竹，数节之后，皆迎刃而解”，“势如破竹”一语即出于此，见《晋书》本传。吴亡后他封当阳县侯，在荆州兴修水利，开凿运河。

  他自称有“《左传》癖”，所撰《春秋左氏经传集解》是现存最早的完整《左传》注本。太康五年闰月（已入公元 285 年），他被征回朝，途中在邓县去世，时年六十三。
sources: []
recalled:
  - 《晋书·杜预传》
  - 《资治通鉴》卷八十、八十一
