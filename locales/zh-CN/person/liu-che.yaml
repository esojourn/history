name: 汉武帝
aliases: [刘彻, 孝武皇帝, 世宗]
role: 皇帝
summary: 西汉第七位皇帝，在位五十四年，尊儒术、行盐铁官营，连年出击匈奴，开通西域。
body: |-
  刘彻是汉景帝之子，母亲为王夫人。据《汉书·武帝纪》，他四岁封胶东王，七岁立为皇太子。景帝后元三年（公元前 141 年）即位，时年十六。次年定年号为建元，后世帝王以年号纪年即由此而来。

  即位之初，朝政仍受祖母窦太后牵制。建元六年（前 135 年）窦太后去世后，他起用儒者，设五经博士，后来又为博士置弟子员，令郡国举孝廉。对诸侯王，他采纳主父偃的建议推行“推恩令”，使王国越分越小，又以酎金成色不足为由夺去大批列侯的爵位。朝廷之内，他重用身边的侍从近臣参与决策，并分全国为十三部，各派刺史巡察。

  对外，他放弃汉初的和亲政策。元光二年（前 133 年）马邑设伏未成，此后卫青、霍去病等连年出塞，夺回河南地，取得河西走廊，元狩四年（前 119 年）又深入漠北。他派张骞出使西域，后来在河西设郡，遣李广利远征大宛；向南灭南越、平西南夷，向东灭卫氏朝鲜，各设郡县。连年用兵耗费巨大，他任用桑弘羊等人实行盐铁官营、均输平准，统一铸造五铢钱，并向商人征收算缗。

  他在位时屡次出巡，元封元年（前 110 年）到泰山封禅，又长期信用方士求仙。太初元年（前 104 年）改用新历，以正月为岁首。晚年法令严酷，各地多有民变。征和二年（前 91 年）“巫蛊之祸”中，皇后卫子夫和太子刘据先后自杀。征和四年他下诏否决在轮台屯田的建议，诏中自言以往的过失，后人称为“轮台诏”。后元二年（前 87 年）二月，他在五柞宫去世，立八岁的幼子刘弗陵为嗣，由霍光等人辅政，葬于茂陵。
sources: []
recalled:
  - 《史记·孝武本纪》
  - 《汉书·武帝纪》
  - 《资治通鉴》卷十七至二十二
