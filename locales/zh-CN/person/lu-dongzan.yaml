name: 禄东赞
aliases: [噶尔·东赞域松]
role: 吐蕃大相
summary: 吐蕃大相，640 年到长安为松赞干布求婚，松赞干布死后执掌吐蕃国政。
body: |-
  禄东赞是吐蕃噶尔氏家族的人，藏文名噶尔·东赞域松，是松赞干布的大相。据《旧唐书·吐蕃传》，他虽然不识文字，但性情明达严重，善于用兵，吐蕃能够兼并诸部、称雄一方，多得力于他的谋略。

  贞观十四年（公元 640 年），他奉松赞干布之命到长安求婚，太宗答应以文成公主相嫁。据同传，太宗欣赏他应对得体，想把琅邪长公主的外孙女段氏嫁给他，他以本国已有妻室、赞普还未见到公主为由推辞。后世传说他在长安通过了太宗出的种种难题，才为赞普求得公主，这些故事出自藏文史籍和民间，不见于唐代史书。传世的《步辇图》画的就是太宗接见他的情景。

  永徽元年（650 年）松赞干布去世，继位的赞普年幼，国政由他主持。他整顿户籍和赋税，又连年攻打吐谷浑，龙朔三年（663 年）吐谷浑被吐蕃攻破，吐谷浑王逃入唐境。乾封二年（667 年）前后他去世，此后他的儿子钦陵等人继续掌握吐蕃的军政大权，与唐朝在青海和西域反复交战。
sources: []
recalled:
  - 《旧唐书·吐蕃传》
  - 《新唐书·吐蕃传》
  - 敦煌古藏文《吐蕃大事纪年》
