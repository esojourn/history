name: 居普良
aliases:
  - 迦太基的居普良
  - 西普里安
role: 迦太基主教、殉道者
summary: 迦太基主教，主张教会合一在于主教，公元 258 年被斩首。
body: |-
  居普良约在公元 200 至 210 年间生于北非的迦太基，一生都住在那里。他家境富有，受过很高的教育，是有名的修辞学教师。《历史的轨迹》说他在公元 246 年成为基督徒，两年后就作了迦太基的主教；据他的执事庞提乌写的传记，带领他归信的是一位年长的长老。归信之后，他变卖了产业周济穷人。

  他作主教不久，公元 250 年德修皇帝下令全国人献祭，逼迫临到迦太基。居普良离城躲避，靠书信治理教会，为此受到一些人的批评。逼迫过后，大批曾经献祭或买了献祭证明的信徒要求回到教会。有人主张一概不收，有人主张凭殉道者的一纸推荐就立刻接纳。居普良召开主教会议，定下先悔改、按情节分别处理的办法。罗马的长老诺瓦天因为反对重新接纳这些人而另立教会。

  在这场争论里，他写了《论大公教会的合一》。书中说：“不以教会为母的，就不能以神为父。”《历史的轨迹》引了他的几句话，说明他的看法：教会以外没有救恩，教会建立在主教身上。他同时主张各地主教彼此平等。约 255 至 256 年，他与罗马主教司提反为异端所施的洗礼是否有效发生争执，他认为无效，应当重洗，司提反则认为有效；两人到死都没有和解。

  公元 257 年瓦勒良皇帝下令禁止基督徒聚会，居普良被流放到库鲁比斯。第二年又有诏令，主教、长老一律处死。258 年 9 月 14 日，他在迦太基受审，听到判决后说“感谢神”，随即被斩首。审讯的记录保存在《居普良行传》里。《历史的轨迹》第二章把他的殉道写在戴克里先逼迫一段，按年代是在瓦勒良年间。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三章“教会内部的成长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter04.html"
recalled:
