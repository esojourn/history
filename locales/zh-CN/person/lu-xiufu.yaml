name: 陆秀夫
aliases: [陆君实]
role: 南宋末年丞相
summary: 南宋末年大臣，与张世杰拥立二王抗元，崖山海战失败后背负赵昺投海殉国。
body: |-
  陆秀夫字君实，楚州盐城（今江苏盐城）人，生于端平三年（公元 1236 年），与文天祥同年。宝祐四年（1256 年）他与文天祥同榜考中进士，后来长期在两淮制置使李庭芝的幕府中任职，以沉静有才干受到器重。李庭芝长期镇守扬州，是南宋末年两淮防务的主持者，后来在扬州城破后被元军所杀。

  德祐元年（1275 年）他入朝任官。次年临安投降，他与张世杰等人护送益王赵昰、卫王赵昺南下，在福州拥立赵昰为帝。行朝在海上辗转期间，他主持朝政的日常事务，一度因与陈宜中意见不合被罢免，经张世杰力争才被召回。据《宋史》，他在流离之中每逢朝会仍端正手持笏板，像在朝廷一样，有时独自流泪，以至于沾湿朝服。

  景炎三年（1278 年）赵昰病死，群臣有人想就此散去，陆秀夫说古代有凭一成之地、一旅之众而复兴的，劝大家拥立赵昺，他自任左丞相，与张世杰把行朝迁到崖山。

  祥兴二年（1279 年）二月元军总攻崖山，宋军大败。陆秀夫见无法突围，先让妻子儿女投海，然后背着八岁的赵昺跳海而死（另见“崖山海战”条）。南宋至此灭亡。据《宋史》，他在海上时把二王的事迹详细记成一书，交给礼部侍郎邓光荐，后来这部书没有流传下来。
sources: []
recalled:
  - 《宋史·陆秀夫传》
