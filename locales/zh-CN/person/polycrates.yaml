name: 波吕克拉底
aliases: [波利克拉特斯]
role: 萨摩斯僭主
summary: 以舰队称霸爱琴海东部，约公元前 522 年被波斯总督诱杀。
body: |-
  萨摩斯人。据希罗多德，他约在公元前 538 年与两个兄弟一起夺取政权，随后杀死一个，赶走另一个，独自统治全岛。他有一百艘五十桨战船和一千名弓箭手，四处劫掠，占领了许多岛屿和大陆上的城镇。

  他与埃及法老阿玛西斯结盟。希罗多德讲了一个著名的故事：阿玛西斯见他事事顺利，担心招来神的嫉妒，劝他丢掉最珍爱的东西；他把一枚戒指抛入大海，几天后渔夫献上一条大鱼，戒指就在鱼腹里，阿玛西斯于是与他断交。波斯王冈比西斯进攻埃及时，波吕克拉底派船助战。被他流放的萨摩斯人请来斯巴达和科林斯的军队围攻萨摩斯，四十天后无功而返。

  希罗多德说，希腊人最大的三项工程都在萨摩斯：穿山引水的隧道（工程师是麦加拉人欧帕利诺斯）、港口的防波堤和赫拉神庙。诗人阿那克瑞翁曾在他的宫廷里。约前 522 年，波斯驻萨迪斯的总督奥洛特斯把他骗到马格尼西亚杀害，尸体被钉在木桩上示众。
sources: []
recalled:
  - 希罗多德《历史》卷三第 39—60、120—125 章
  - 修昔底德《伯罗奔尼撒战争史》卷一第 13 章
