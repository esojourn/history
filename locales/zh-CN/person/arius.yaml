name: 亚流
aliases:
  - 阿里乌
  - 亚利乌
role: 亚历山大长老
summary: 亚历山大的长老，主张圣子是受造的、与圣父不同质，在尼西亚会议上被定为异端。
body: |-
  亚流约在公元 256 年生于利比亚，后来在亚历山大作长老，负责城里包卡利斯区的教堂。《历史的轨迹》第五章说，争论达到高潮时，他已是一位生活严谨、有口才的长者。

  约公元 318 年，他与本城主教亚历山大发生争执。他认为，只有圣父是无始的；圣子是圣父在万有之先所造的，是受造者中最先、最高的一位，但“曾有一个时候还没有他”，他与圣父并不同质。《历史的轨迹》解释他的用意：当时的异教是多神的，他担心说圣子与圣父同样是神，就成了两位神。主教亚历山大召集埃及和利比亚的主教开会，把他革除。亚流离开埃及，得到尼哥米底亚主教优西比乌等人的支持，争论扩大到整个东方教会。他把自己的主张编成歌谣，题为《塔利亚》，原书只剩亚他那修引用的片段。

  公元 325 年，君士坦丁皇帝在尼西亚召开会议。会议定下的信经说圣子“是生的，不是造的，与父同质”，并咒诅“曾有一个时候还没有他”等说法。亚流和两位拒绝签字的利比亚主教被流放到伊利里库姆。《历史的轨迹》把他和亚他那修都称作亚历山大教会的长老；按当时的职分，亚他那修还是执事。

  几年以后，君士坦丁改变了态度，把他召回。亚他那修不肯在亚历山大接纳他。公元 336 年，皇帝命令君士坦丁堡主教接纳亚流领圣餐，就在预定日子的前一天，他在城里突然死去。这段经过出自他的对手亚他那修的记述。他死后，围绕他的主张的争论又持续了四十多年，到 381 年君士坦丁堡会议才告一段落；哥特等日耳曼部族接受的基督教则是亚流派的。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 亚他那修《驳亚流派》卷 1 第 5—6 章、《致塞拉皮翁论亚流之死》
  - 苏格拉底《教会史》卷 1 第 5—9、37—38 章
  - 亚流致尼哥米底亚的优西比乌的信，见狄奥多勒《教会史》卷 1 第 4 章
