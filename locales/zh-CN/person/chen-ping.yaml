name: 陈平
aliases:
  - 曲逆侯
  - 献侯
role: 丞相
summary: 汉初谋臣，封曲逆侯；吕后死后与周勃诛灭诸吕，迎立文帝。
body: |-
  阳武户牖乡人，生年不详。据《史记·陈丞相世家》，他年轻时家贫而好读书，在乡里主持分祭肉，分得很均匀。陈胜起兵后，他先投魏王咎，又改投项羽，因惧怕被杀而逃走，到修武归降汉王刘邦，被任为都尉，后升护军中尉，监护诸将。

  楚汉在荥阳相持时，刘邦给他黄金四万斤，让他离间项羽与亚父范增、钟离眛等人。公元前 201 年，他建议刘邦假称出游云梦，趁机擒住楚王韩信。次年刘邦在平城被匈奴围困七日，用他的计策才得解围，计策的内容《史记》称“其计秘，世莫得闻”。回师途中他被改封为曲逆侯。《史记》说他“凡六出奇计”。

  惠帝六年他任左丞相，吕后时升右丞相。吕后欲封诸吕为王，他没有反对；吕后一死，他便与太尉周勃合谋诛灭诸吕，迎立代王刘恒，《史记》称此事“陈平本谋也”。文帝即位后，他把右丞相让给周勃，自己居左；周勃辞相后，他独任丞相。据《汉书·文帝纪》，他死于文帝二年冬十月；汉初以十月为岁首，这一月合公元前 179 年末，旧说多径记作前 178 年。谥献侯。
sources:
  - 《史记·陈丞相世家》 https://ctext.org/shiji/chen-cheng-xiang-shi-jia/zhs
  - 《史记·吕太后本纪》 https://ctext.org/shiji/lv-tai-hou-ben-ji/zhs
  - 《汉书·文帝纪》 https://ctext.org/han-shu/wen-di-ji/zhs
