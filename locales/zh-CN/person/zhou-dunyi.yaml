name: 周敦颐
aliases: [周濂溪, 濂溪先生, 周元公]
role: 北宋理学家
summary: 北宋理学家，著《太极图说》《通书》，二程少年时曾从他学习，后世尊为理学开山。
body: |-
  周敦颐是道州营道人，生于天禧元年（公元 1017 年），原名敦实，因避英宗旧名的讳改为敦颐。他少年丧父，由舅父郑向抚养，后来以舅父的恩荫入仕，一生做的都是县令、州判官、知军等地方官，以断案公正著称。

  庆历六年（1046 年）前后他在南安军任司理参军，程珦让两个儿子程颢、程颐拜他为师。程颢后来回忆，周敦颐常让他们寻思孔子、颜回所乐的是什么，自己从此有志于求道。晚年他在庐山莲花峰下筑屋，屋前有溪，用家乡的溪名命名为濂溪，人称濂溪先生。熙宁六年（1073 年）他去世。

  周敦颐的著作不多，主要是《太极图说》和《通书》。《太极图说》用二百多字阐述“无极而太极”，由阴阳五行化生万物，人得其秀而最灵，圣人定之以中正仁义而主静，把宇宙生成与人的道德修养联系在一起。《通书》以“诚”为核心，讨论圣人之道。他的《爱莲说》写莲花“出淤泥而不染，濯清涟而不妖”，是传诵很广的散文。他在世时学术上的名声不大，到了南宋，朱熹等人推崇他，把他奉为理学的开创者，宋宁宗时赐谥“元”。《太极图》的来源，有人认为出自道士陈抟，也有不同意见。
sources: []
