name: 张良
aliases: [子房, 留侯, 文成侯]
role: 谋士
summary: 韩相之后，刘邦的主要谋臣，封留侯。
body: |-
  据《史记·留侯世家》，张良的先人是韩国人，祖父、父亲先后辅佐五代韩王为相；他的生年和出生地史无记载。秦灭韩时他年纪尚轻，没有出仕，此后用全部家财寻求刺客为韩报仇。他与一名力士趁秦始皇东游，在博浪沙用铁椎狙击，误中副车（《秦始皇本纪》系于始皇二十九年，即公元前 218 年）。此后他改名换姓，逃到下邳躲藏。《世家》记他在下邳桥上遇到一位老人，得授《太公兵法》。

  陈胜起事后，张良聚众百余人，路遇沛公，从此追随刘邦。鸿门宴前项伯来报信，他引项伯见刘邦，宴上又留下代为辞谢。楚汉相争中，他劝阻刘邦采纳郦食其重立六国之后的主张，又建议许给韩信、彭越封地，使两人率军会于垓下。高祖称“运筹策帷帐中，决胜千里外，子房功也”，让他自择齐地三万户，他只请封于留，是为留侯。

  汉立国后，张良赞成娄敬入都关中的建议，后来又为吕后出主意，请来“商山四皓”辅佐太子，保住了刘盈的地位。他多病，学辟谷导引，不多过问政事。他的卒年两书记载不同：《史记》说高帝去世“后八年卒”，《汉书·张良传》作“后六岁薨”，这里取前说，约在前 186 年。谥文成侯。
sources:
  - 《史记·留侯世家》 https://zh.wikisource.org/wiki/史記/卷055
  - 《史记·项羽本纪》 https://zh.wikisource.org/wiki/史記/卷007
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
  - 《汉书·张陈王周传》 https://zh.wikisource.org/wiki/漢書/卷040
