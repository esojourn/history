name: 尼布甲尼撒二世
aliases:
  - 尼布甲尼撒
role: 巴比伦王
summary: 新巴比伦王，两度攻取耶路撒冷，焚毁圣殿，掳犹大人到巴比伦。
body: |-
  新巴比伦（迦勒底）王朝建立者拿波帕拉萨的儿子，生年没有记载。据巴比伦编年史，公元前 605 年他以王储身份领兵，在幼发拉底河畔的迦基米施击败埃及军队，又追击到哈马一带；《耶利米书》46:2 也记法老尼哥的军队在约雅敬第四年于迦基米施被他打败。同年夏天父亲去世，他赶回巴比伦即位。

  编年史记载他即位后几乎年年出兵哈提地（叙利亚、巴勒斯坦一带），前 604 年攻取亚实基伦，前 601 年与埃及交战，双方损失都很重。《列王纪下》24:1 说犹大王约雅敬服事他三年，然后背叛。他在位第七年出兵围攻犹大城，亚达月初二日（公元前 597 年 3 月）攻下，擒获其王，另立一王，带走重贡；这与《列王纪下》24:10–17 所记约雅斤出降被掳、玛探雅被立为王并改名西底家相合。现存的巴比伦编年史泥板只记到他在位第十一年，此后的战事没有编年史可查。

  西底家背叛后，他再度出兵。据《列王纪下》第 25 章，西底家九年十月初十日开始围城，十一年四月初九日城破；西底家逃到耶利哥平原被擒，押到利比拉受审，众子在他眼前被杀，他本人被剜去双眼带到巴比伦。尼布甲尼撒十九年五月，护卫长尼布撒拉旦焚烧圣殿、王宫和城中房屋，拆毁城墙，把余民掳走。《耶利米书》52:28–30 记他三次掳走的犹大人共四千六百名。约瑟夫斯引述更早的作者说他曾围困推罗十三年；《以西结书》29:17–20 也提到他攻打推罗和日后攻打埃及。

  他留下的铭文大多是建筑铭文，记他重修巴比伦的城墙、王宫、游行大道和伊什塔尔门，以及马尔杜克神庙埃萨吉拉和塔庙。希腊化时代的作者把空中花园归于他，但巴比伦的楔形文字文献里至今没有找到相应的记载。《但以理书》第 1—4 章记他与但以理的往来：但以理为他讲解大像和大树两个梦，他在杜拉平原立金像，以及他被赶出离开世人、与野地的兽同居，经过七期才复位；最后一事不见于现存的巴比伦史料。他在位四十三年，前 562 年去世，儿子以未米罗达继位。
sources: []
