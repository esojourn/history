name: 克拉苏
aliases: [马尔库斯·李锡尼·克拉苏, 克拉苏斯]
role: 罗马统帅、执政官
summary: 罗马首富，镇压斯巴达克斯起义，与庞培、恺撒结成前三头，远征帕提亚败死。
body: |-
  马尔库斯·李锡尼·克拉苏，罗马平民贵族，约生于公元前 115 年。父亲是前 97 年的执政官。前 87 年马略和秦纳攻入罗马，他的父亲和一个兄长死难，他逃到西班牙，据普鲁塔克，在海边的山洞里躲了八个月。后来他自募一支人马投奔苏拉；前 82 年科林门之战，他指挥的右翼获胜。

  他在苏拉的公敌宣告中低价收购被没收的产业，由此起家。普鲁塔克说，他养着五百名懂建筑的奴隶，罗马城常有火灾，他趁房屋起火或邻屋危急时压价买下，再行修建；他还经营银矿、田产，出租受过训练的奴隶。据普鲁塔克，他的财产从最初的三百塔兰特增加到七千一百塔兰特。他肯借钱给人，又常替人出庭辩护，在元老和骑士中人缘很广。

  前 72 年斯巴达克斯连败两名执政官，元老院把指挥权交给他。他对临阵脱逃的部队恢复“十一抽杀”的旧法，前 71 年在卢卡尼亚歼灭起义军主力。庞培截杀残部后声称是自己结束了战争，两人从此不和。前 70 年他们同任执政官，恢复了被苏拉削减的保民官权力。

  前 60 年，他与庞培经恺撒撮合，三人约定互相支持，后世称“前三头同盟”。前 56 年三人在卢卡重申盟约，次年他与庞培再度同任执政官，得到叙利亚行省五年。他打算进攻帕提亚，这场战争没有得到元老院的授权，出征时有保民官当众诅咒。前 54 年他渡过幼发拉底河，占了几座城，又回叙利亚过冬；据约瑟夫斯，他取走了耶路撒冷圣殿的金库。

  前 53 年他率七个军团再次渡河，进入美索不达米亚的平原。在卡莱附近，帕提亚将领苏雷纳以骑射手和重甲骑兵围攻，罗马步兵无从还手；他的儿子普布利乌斯带骑兵出击，全军覆没。军队连夜向山地撤退，士兵逼他去同苏雷纳会谈，他在会面的混乱中被杀。据普鲁塔克，出征的人有两万战死、一万被俘。
sources: []
recalled:
  - 普鲁塔克《克拉苏传》
  - 阿庇安《内战史》卷一、卷二
  - 卡西乌斯·狄奥《罗马史》卷四十
  - 约瑟夫斯《犹太古史》卷十四第 7 章
