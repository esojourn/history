name: 陶渊明
aliases: [陶潜, 陶元亮, 五柳先生, 靖节先生]
role: 诗人
summary: 东晋末年诗人，辞去彭泽令后归隐田园，作《归去来兮辞》《桃花源记》和大量田园诗。
body: |-
  陶渊明字元亮，一说名潜、字渊明，寻阳柴桑人。他的曾祖父是东晋名将陶侃，外祖父孟嘉是当时的名士，到他这一代家道已经衰落。他的生年史书没有明载，通行的说法是兴宁三年（公元 365 年），此外还有早十余年和晚数年的几种推算。

  他二十九岁才出来做官，任江州祭酒，不久辞职回家。此后十来年里，他断续在桓玄、刘裕和刘敬宣的幕府中任职，都为时不长。义熙元年（405 年）八月，他出任离家不远的彭泽县令，在任八十多天，十一月就辞官而去，写下《归去来兮辞》。他在序里说，辞官是因为本性不能勉强，又赶上妹妹去世要去奔丧。《宋书·隐逸传》则记载，郡里派督邮来县，县吏告诉他应当整束衣带去拜见，他叹息说：“我不能为五斗米折腰向乡里小人。”当天就交还了官印。

  此后二十多年他没有再出仕，在家乡亲自耕种。义熙四年（408 年）他家遭了火灾，后来迁居，生活越来越艰难，诗里写到过向人乞食。朝廷征他做著作佐郎，他没有去。江州刺史王弘、檀道济先后来看望他，檀道济送来粮肉，被他挥手谢绝；友人颜延之留下二万钱，他全部送到酒家，以便随时取酒。《宋书》说他因为曾祖是晋朝的宰辅，耻于再向后来的朝代屈身，所以晋亡以后写文章只用干支纪年，不写刘宋的年号；这个说法后人有不同意见。元嘉四年（427 年）他去世，颜延之为他写了诔文，友人私下给他定谥号为“靖节”。

  他流传下来的诗有一百二十多首，大多写田园生活和饮酒读书的心境，语言平淡自然，《归园田居》和《饮酒》中的“采菊东篱下，悠然见南山”最为人熟知；也有《咏荆轲》这样慷慨的作品。文章有《桃花源记》《五柳先生传》《闲情赋》等，其中《桃花源记》描写了一个与世隔绝、没有战乱和赋税的村落。他的诗在当时不很受重视，南朝梁的萧统为他编集作序，唐宋以后评价越来越高，被看作田园诗的开创者。
sources: []
recalled:
  - 《宋书·隐逸传·陶潜》
  - 《晋书·隐逸传·陶潜》
  - 萧统《陶渊明传》
  - 颜延之《陶征士诔》
