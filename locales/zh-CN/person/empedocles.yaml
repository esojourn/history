name: 恩培多克勒
aliases: [恩培多克利斯]
role: 哲学家、诗人
summary: 阿克拉加斯人，提出土、气、火、水四种“根”和爱与争两种力量。
body: |-
  西西里岛南岸阿克拉加斯人，出身显贵之家，祖父与他同名，在奥林匹亚赢过赛马。生卒年是约数；据第欧根尼·拉尔修转引亚里士多德，他活了六十岁。古人说僭主统治结束后他在本城站在民主一边，有人要推他为王，他拒绝了。亚里士多德称他是修辞术的发明者；后人又说他是医生，能行奇事。前 444 年前后图里伊建城时他去过那里。

  他用六音步诗体写作，古人提到《论自然》和《净化》两部诗，今存约四百五十行，在早期哲学家中是留存最多的；这究竟是两部诗还是一部，1999 年公布的斯特拉斯堡纸草残片使问题重新引起讨论。他认为万物由四种永恒的“根”构成：土、气、火、水，后人称为四元素。没有什么东西真正产生或消灭，只有四根的混合与分离。使它们结合的是“爱”，使它们分开的是“争”，两种力量轮流占上风，宇宙就在完全融合与完全分离之间循环往复。他还讲到生物最初是零散的肢体，偶然拼合，合适的才存活下来；视觉是由于物体发出的流射进入眼睛的孔道。

  《净化》的残篇讲灵魂的轮回。他说自己曾经做过男孩、女孩、灌木、鸟和海里的鱼；作恶的神灵要离开福地流浪三万个季节。他因此要人不杀生、不吃肉。诗的开头，他对同乡说，自己走在他们中间，已是不死的神，不再是凡人。

  他的结局有多种传说。最有名的一种说他跳进埃特纳火山口，好让人以为他升天成神，火山却喷出了他的一只铜鞋。较为平实的记载说他离开西西里，死在伯罗奔尼撒。亚里士多德的《形而上学》《论生成与毁灭》多次讨论他的学说，四元素说经亚里士多德采纳，影响延续了两千年。
sources: []
