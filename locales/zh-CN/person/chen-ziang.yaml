name: 陈子昂
aliases: [陈伯玉, 陈拾遗]
role: 诗人
summary: 唐初诗人，倡导恢复“汉魏风骨”，代表作《登幽州台歌》《感遇》，后冤死狱中。
body: |-
  陈子昂字伯玉，梓州射洪人，出身富豪之家。据卢藏用的《陈氏别传》，他少年时任侠使气，十七八岁还不读书，后来有一次进入乡学，受到触动，才发愤读书。文明元年（公元 684 年）他考中进士，上书议论高宗灵柩是否应运回长安安葬，受到武则天赏识，此后任麟台正字、右拾遗等职，多次上书议论时政。

  万岁通天元年（696 年）契丹李尽忠、孙万荣起兵，他随建安王武攸宜出征，任参谋。武攸宜作战不利，他多次献策，武攸宜不但不采纳，还把他降职为军曹。据记载，他登上幽州的蓟北楼，感慨古今，写下了《登幽州台歌》：“前不见古人，后不见来者。念天地之悠悠，独怆然而涕下。”

  圣历元年（698 年）他以父亲年老为由辞官回乡。父亲去世后，射洪县令段简贪图他家的财产，罗织罪名把他下狱，他在狱中去世，年四十二（一说四十一）。他的生卒年因此有 659—700 年、661—702 年等不同推算。

  他反对齐梁以来过分注重辞藻的诗风，在《与东方左史虬修竹篇序》中提出恢复“汉魏风骨”、重视“兴寄”，代表作有《感遇》三十八首。他的主张对盛唐诗风影响很大。
sources: []
recalled:
  - 卢藏用《陈氏别传》
  - 《旧唐书·文苑传·陈子昂》
  - 《新唐书·陈子昂传》
