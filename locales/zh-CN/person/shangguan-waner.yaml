name: 上官婉儿
aliases: [上官昭容]
role: 昭容、掌诏命
summary: 唐代女官、诗人，上官仪的孙女，为武则天和唐中宗掌管诏命，在唐隆政变中被杀。
body: |-
  上官婉儿是宰相上官仪的孙女。麟德元年（公元 664 年），上官仪因替高宗起草废黜武后的诏书被杀，她的父亲上官庭芝同时被杀，她随母亲郑氏没入宫中为奴婢，当时还在襁褓中。她在宫中长大，通晓文学和吏事。据《旧唐书》，她十四岁时被武则天召见，此后为武则天起草和掌管诏命，参与机要。

  中宗复位后，她被封为昭容，仍专掌制命，并劝中宗扩大修文馆，延揽文学之士，常代帝后与群臣唱和，评定诗文的高下。她与韦后、武三思关系密切，也与太平公主交好，在朝政中有很大的影响力。景龙四年（710 年）六月中宗去世，她与太平公主一同起草遗诏，立温王李重茂，并安排相王李旦参与辅政。同月临淄王李隆基起兵诛杀韦后，她持烛率宫人迎接，出示遗诏草稿，但李隆基仍下令把她斩于旗下，年四十七。2013 年，她的墓志在陕西咸阳出土。
sources: []
recalled:
  - 《旧唐书·后妃传》
  - 《新唐书·后妃传》
  - 《资治通鉴》卷二百二至二百九
