name: 吕文焕
aliases: []
role: 襄阳守将，后降元
summary: 南宋襄阳守将，坚守襄阳近六年，1273 年城孤援绝后降元，随后为元军前导。
body: |-
  吕文焕是南宋名将吕文德的弟弟，生卒年不详。吕文德长期主持京湖防务，吕氏兄弟、子侄多在沿江任要职。咸淳三年（1267 年）起，元将阿术、刘整开始包围襄阳、樊城，吕文焕以知襄阳府的身份守城。

  元军在襄樊周围筑城、修堡，切断水陆交通。吕文焕坚守了将近六年，南宋几次派兵救援都被击退，只有张顺、张贵率领的一支民兵曾冲入城中，旋即战死。咸淳九年（1273 年）正月樊城被攻破，元军又用回回炮轰击襄阳城楼，二月吕文焕献城投降（另见“襄阳之战”条）。

  降元后，吕文焕被任为襄汉大都督，随伯颜沿江东下。长江沿线州郡的守将很多是吕氏旧部，他们先后望风归降，元军因此得以迅速东进。此后他在元朝任官，晚年的事迹史书记载很少。
sources: []
recalled:
  - 《宋史·度宗本纪》
  - 《元史·阿术传》
