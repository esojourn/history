name: 姚苌
aliases: [姚景茂, 后秦武昭帝]
role: 后秦开国君主
summary: 羌人首领，原为前秦将领，淝水战后自立，俘杀苻坚，在长安建立后秦。
body: |-
  姚苌字景茂，是南安赤亭的羌人，父亲姚弋仲是后赵时迁到关东的羌人首领。后赵崩溃后，他的兄长姚襄率部众辗转于淮河、洛阳一带，先归附东晋，后又反叛，升平元年（公元 357 年）西进关中时被前秦击败杀死。姚苌率余众投降，此后在苻坚手下为将二十多年，屡立战功。

  太元八年（383 年）苻坚在淝水战败。第二年鲜卑人慕容泓在关中起兵，他随苻坚之子苻叡前去讨伐，苻叡不听劝告轻进而战死。他派人向苻坚请罪，使者被杀，他害怕获罪，逃到渭北，被当地的羌人豪强推为盟主，自称万年秦王，史称后秦。

  太元十年（385 年）苻坚从长安出奔五将山，被他的部将俘获，送到新平。他向苻坚索要传国玺，遭到痛骂，随后把苻坚缢死。第二年慕容氏的鲜卑人东归，他进入长安称帝。此后他与继承前秦名号的苻登在关中、陇东相持多年。《晋书·载记》记载，他屡战不利时，曾在军中立起苻坚的神像祈祷请罪。太元十八年十二月他去世，按公历已是 394 年初，时年六十四。
sources: []
recalled:
  - 《晋书·姚苌载记》
  - 《资治通鉴》卷一百零五至一百零八
