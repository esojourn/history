name: 主父偃
aliases: []
role: 中大夫
summary: 汉武帝时的谋臣，建议推行“推恩令”分割诸侯王国，又主张在朔方筑城，后被族诛。
body: |-
  据《史记·平津侯主父列传》，主父偃是齐国临菑人，早年学纵横家的学说，后来才学《易》《春秋》和百家之言。他在齐地受儒生排挤，家贫借贷无门，北游燕、赵、中山，都不被任用。元光元年（公元前 134 年）他西入长安，直接到宫门上书，早上递入，傍晚就被召见，与同时上书的徐乐、严安一起任郎中，一年之内四次升迁，官至中大夫。

  他向武帝建议：诸侯王国地广势强，容易生变，强行削地又会激起反抗，不如准许诸侯王把封地分给所有的子弟为侯，这样朝廷施了恩德，王国却自然分小。武帝采纳，在元朔二年（前 127 年）下令施行，这就是“推恩令”。卫青收复河南地后，他又力主在那里设朔方郡筑城，还建议把各地的豪强迁到茂陵。

  他揭发过燕王刘定国的罪行，燕王自杀。后来他出任齐国相，追查齐王的隐私，齐王畏罪自杀。赵王趁机上书告他收受诸侯的贿赂。武帝本不想杀他，时任御史大夫的公孙弘说齐王自杀无后，不杀主父偃无以向天下交代，于是他被灭族。本传记他曾说，大丈夫活着不能列五鼎而食，死了就受五鼎烹煮；又记他显贵时宾客上千，死后只有一人为他收葬。
sources: []
recalled:
  - 《史记·平津侯主父列传》
  - 《汉书·严朱吾丘主父徐严终王贾传》
