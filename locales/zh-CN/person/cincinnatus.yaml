name: 辛辛纳图斯
aliases: [卢基乌斯·昆克提乌斯·辛辛纳图斯, 辛辛那图斯]
role: 罗马独裁官
summary: 罗马共和国早期贵族，相传从田间受命为独裁官，十六天解围后辞职归田。
body: |-
  卢基乌斯·昆克提乌斯·辛辛纳图斯，罗马共和国早期的贵族，传统上说约生于公元前 519 年。“辛辛纳图斯”是绰号，意为“卷发的”。他的事迹主要见于李维《建城以来史》卷三，年代和细节都属传统说法。

  据李维，他的儿子凯索因带头阻挠保民官、殴打平民而被控告，交保后逃往伊特鲁里亚；他为偿付保证金卖掉了大部分田产，搬到台伯河对岸，只剩四尤格拉地（约合一公顷），自己耕种。前 460 年执政官瓦勒里乌斯阵亡，他被选为补任执政官，任内反对平民提出的编订成文法的要求。

  前 458 年，执政官米努基乌斯率领的军队在阿尔吉杜斯山被埃奎人围困。元老院决定任命独裁官，使者找到他时，他正在地里干活；他让妻子取来托加袍，擦去汗土，听取了任命。他征集全部适龄男子，每人带十二根木桩，连夜赶到阿尔吉杜斯，在埃奎人外面筑起一道栅栏，反过来围住他们。埃奎人投降，被迫从三支长矛搭成的“轭”下走过。据李维，他举行凯旋式后在第十六天辞去独裁官，回去种地，而独裁官的任期原是六个月。

  李维还记载，前 439 年他年过八十，再度出任独裁官，起因是富有的平民斯普里乌斯·梅利乌斯在饥荒时散粮收买人心，被控图谋称王；骑兵长官塞尔维利乌斯·阿哈拉在他拒捕时把他杀死。这第二次任职的真实性疑问更多。

  辛辛纳图斯在罗马人那里成了临危受命、事毕归田的典范。美国独立战争后，军官们组织的“辛辛纳提协会”以他命名，俄亥俄州的辛辛那提市又因这个协会得名。
sources: []
recalled:
  - 李维《建城以来史》卷三第 11—29 章、卷四第 13—16 章
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷十
