name: 郭威
aliases: [郭雀儿, 后周太祖]
role: 后周皇帝
summary: 后汉枢密使，950 年家属被汉隐帝杀害后起兵，次年称帝建立后周，推行多项改革。
body: |-
  郭威是邢州尧山人，天祐元年（公元 904 年）生，幼年父母双亡，由姨母抚养。他十八岁左右投军，在潞州的昭义军中当兵，勇武有力，据说脖子上刺有飞雀，人称“郭雀儿”。他读过兵书，后来成为刘知远的部下，深受信任。后汉建立后，他任枢密使。

  刘知远临终时，他是受托辅佐刘承祐的大臣之一。乾祐元年至二年（948—949 年），河中李守贞、永兴赵思绾、凤翔王景崇三镇叛乱，郭威受命统兵，一年多后平定。此后他出镇邺都，防御契丹。乾祐三年（950 年）十一月，刘承祐诛杀杨邠、史弘肇等大臣，又派人去邺都杀郭威，并把他留在开封的妻儿全部杀害。郭威在部下的拥戴下起兵南下，刘承祐兵败被杀。

  郭威进入开封后，起初宣称要迎立刘崇的儿子刘赟为帝。不久契丹入侵的消息传来，他率军北上，走到澶州时，据《资治通鉴》，将士们撕下黄旗披在他身上，拥他为天子。他回到开封，广顺元年（951 年）正月称帝，国号周，史称后周（另见“郭威代汉”条）。

  郭威出身贫寒，了解民间疾苦。他在位三年，废除了后汉的一些苛法，把各地的营田分给耕种的佃户作为永业，减轻刑罚，禁止各地进献珍奇之物，自己也很节俭。显德元年（954 年）正月他病逝，据史书，他遗命丧事从简，用纸衣、瓦棺。由于亲生儿子都已遇害，由养子柴荣继位。
sources: []
recalled:
  - 《旧五代史·周书·太祖纪》
  - 《新五代史·周本纪·太祖》
  - 《资治通鉴》卷二百八十八至二百九十一
