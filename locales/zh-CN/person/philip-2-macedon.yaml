name: 腓力二世（马其顿）
aliases: [菲利普二世, 腓力]
role: 马其顿国王
summary: 马其顿国王，改革军队，在喀罗尼亚击败雅典与底比斯，成为希腊的霸主；亚历山大之父。
body: |-
  马其顿国王阿敏塔斯三世的第三子，生于公元前 382 年。少年时他作为人质在底比斯住了约三年，正值伊巴密浓达和佩洛皮达斯主政，后人认为他在那里见识了底比斯的战法。前 359 年他的兄长佩尔狄卡斯三世与伊利里亚人作战阵亡，据狄奥多罗斯同时战死四千人，王国四面受敌。他先是做年幼侄子的摄政还是直接称王，记载不一；总之很快就独掌王权。

  他一面用钱和婚姻稳住周边，一面整顿军队：步兵改用长约五六米的长矛“萨里沙”，列成密集的方阵，与贵族组成的“伙伴骑兵”配合作战；士兵常年操练，并配有攻城器械。前 358 年他击败伊利里亚人，前 357 年夺取雅典一直想收回的安菲波利斯，同年娶伊庇鲁斯公主奥林匹亚斯。前 356 年他占领克列尼德斯，改名腓立比，据狄奥多罗斯，附近潘盖翁山的金矿每年给他一千塔兰特的收入。前 354 年围攻墨托涅时他被箭射瞎右眼。

  希腊中部因德尔斐神庙而起的“神圣战争”给了他南下的机会。前 352 年他在色萨利的番红花原野击败福基斯人，成为色萨利的统领；前 348 年攻毁奥林托斯，吞并卡尔基狄刻；前 346 年与雅典订立《菲洛克拉底和约》，随即结束神圣战争，取得福基斯在近邻同盟会议中的两票。此后他经营色雷斯，前 340 年围攻佩林托斯和拜占庭未克。前 338 年 8 月，他在喀罗尼亚击败雅典和底比斯的联军，十八岁的亚历山大指挥左翼骑兵。次年他在科林斯召集希腊各邦（斯巴达除外）结成同盟，自任统帅，宣布东征波斯。

  前 337 年他娶马其顿贵族阿塔罗斯的侄女克列奥帕特拉，与奥林匹亚斯母子失和。前 336 年他派帕曼纽率先头部队渡海到小亚细亚，自己在旧都埃盖为女儿办婚礼，走进剧场时被侍卫保萨尼亚斯刺死，时年四十六岁。亚里士多德说凶手出于私怨；古人也有怀疑奥林匹亚斯或亚历山大知情的，没有证据。1977 年希腊考古学家安德罗尼科斯在韦尔吉纳发掘出未经盗扰的王室墓葬，其中二号墓的墓主是不是他，学界至今仍有争论。
sources: []
recalled:
  - 狄奥多罗斯《历史丛书》卷十六
  - 德摩斯梯尼《反腓力辞》《奥林托斯辞》
  - 尤斯丁《腓力史纲要》卷七至卷九
  - 普鲁塔克《亚历山大传》第 2—10 章
