name: "詹森"
aliases: ["科内利乌斯·詹森", "杨森"]
role: "伊普尔主教、詹森派的源头"
summary: "鲁汶神学家、伊普尔主教，遗著《奥古斯丁》引出天主教内的詹森派运动。"
body: |-
  詹森 1585 年生于荷兰的阿克瓦伊，在鲁汶和巴黎读书，与法国人圣西朗结为好友，一同钻研奥古斯丁论恩典的著作。他长期在鲁汶大学任教，1636 年任伊普尔主教，1638 年死于瘟疫。

  他生前写成一部大书《奥古斯丁》，1640 年在他身后出版，强调人的堕落和神恩典的有效，反对耶稣会较重人自由意志的神学。《历史的轨迹》第三十七章说，十七世纪“荷兰南部的伊普尔”主教詹森成了一个反对运动的首脑，他的看法吸引了许多法国天主教徒，巴黎附近的波尔罗亚尔女修道院成为中心。伊普尔当时属西属尼德兰，今在比利时；书中说的“荷兰南部”是指这一带。

  该书说，詹森派遭到耶稣会反对，路易十四在耶稣会影响下大力迫害他们，1710 年波尔罗亚尔的建筑全被拆毁。教皇先后谴责从他书中摘出的五条命题。运动的结果是在荷兰成立了一个小小的詹森派天主教会，至今仍在（即 1723 年脱离罗马的乌得勒支教会）。作者说詹森主义在天主教的大洋中只是一个小浪头。法国的帕斯卡也是波尔罗亚尔的同情者，写过《致外省人信札》批评耶稣会。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十七章“东方教会与罗马教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter41.html"
recalled:
  - "詹森《奥古斯丁》（1640 年）"
  - "教皇英诺森十世通谕《就着时机》（1653 年）"
