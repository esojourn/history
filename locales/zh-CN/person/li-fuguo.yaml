name: 李辅国
aliases: [李静忠, 博陆郡王]
role: 宦官、元帅府行军司马
summary: 唐肃宗的亲信宦官，掌管禁军与朝政，开唐后期宦官专权之先，后被唐代宗派人刺杀。
body: |-
  李辅国原名静忠，是宦官，据《旧唐书》，早年在高力士手下做杂役，后来被派到东宫侍奉太子李亨。天宝十五载（公元 756 年）马嵬之变后，他劝李亨北上朔方，随后在灵武拥立李亨即位，任元帅府行军司马，掌管军中文书和禁军，改名辅国。

  两京收复后，他的权势日益膨胀，掌管禁军，宰相和百官要通过他才能见到皇帝，皇帝的诏书要经他签署才能施行。上元元年（760 年），他以太上皇身边有人图谋不轨为名，带兵把唐玄宗从兴庆宫迁到太极宫，高力士等人被流放。宝应元年（762 年）四月，他与程元振带兵阻止张皇后的废立图谋，拥立唐代宗，自恃有功，对代宗说皇帝只需深居宫中，外事由老奴处置。代宗表面尊他为尚父，暗中削去他的兵权。同年十月，他在家中被刺客杀死，首级被割去，据史书，刺客是代宗派去的。
sources: []
recalled:
  - 《旧唐书·宦官传·李辅国》
  - 《新唐书·宦者传·李辅国》
  - 《资治通鉴》卷二百一十八至二百二十二
