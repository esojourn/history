name: 德摩斯梯尼（将军）
aliases: [狄摩西尼（将军）]
role: 雅典将军
summary: 伯罗奔尼撒战争中的雅典将军，在皮洛斯立功，后死于西西里。
body: |-
  雅典人，阿尔基斯忒涅斯之子。他与一百年后反对马其顿的演说家德摩斯梯尼不是一人。公元前 426 年他率军在希腊西北部作战，贸然深入埃托利亚山地，被当地的轻装兵打得大败，不敢回雅典；同年冬天他在奥尔帕伊设伏，大败伯罗奔尼撒人和安布拉基亚人，才挽回声誉。修昔底德说，他从埃托利亚的失败中学会了使用轻装部队。

  前 425 年他随一支开往西西里的舰队出航，途中在麦西尼亚西岸的皮洛斯登陆，用几天时间筑起工事，并留下来防守。斯巴达人从海陆两面进攻，没有攻下；雅典舰队返回后，把四百二十名斯巴达重装步兵困在港外的斯法克特里亚岛上。后来克里昂带援兵前来，两人以弓箭手和轻装兵四面袭扰，迫使岛上的守军投降。皮洛斯此后长期是雅典袭扰斯巴达、收容逃亡希洛人的据点。前 424 年他参与策划夺取麦加拉和同时从几面进攻彼奥提亚，都没有成功。

  前 413 年他率七十三艘战船和五千名重装步兵增援西西里。到达后他认为必须速战，夜袭叙拉古城外的厄庇波莱高地，起初得手，随后在黑暗中陷入混乱，损失惨重。他主张立即撤军，被尼西阿斯拖延。最后的陆路撤退中，他率后队六千人被围，投降时约定不得处死任何人。叙拉古人仍然把他和尼西阿斯处死。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷三第 94—114 章；卷四第 2—41、66—77 章；卷七第 16—86 章
