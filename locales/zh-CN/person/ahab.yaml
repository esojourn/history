name: 亚哈
aliases: []
role: 北国以色列王
summary: 暗利之子，娶耶洗别，在撒玛利亚建巴力庙，后在基列的拉末阵亡。
body: |-
  暗利的儿子，生年圣经没有记载。据《列王纪上》16:29，他在犹大王亚撒三十八年登基，在撒玛利亚作以色列王二十二年。他娶了西顿王谒巴力的女儿耶洗别，在撒玛利亚为巴力建庙筑坛，又作亚舍拉（16:31–33）。

  他在位时，先知以利亚宣告境内要有旱灾（17:1）。到第三年，以利亚与亚哈相见，在迦密山上同四百五十个巴力的先知对峙，事后天降大雨（第 18 章）。第 20 章记载，亚兰王便哈达率军围困撒玛利亚，亚哈两次击败他；第二次在亚弗得胜后，亚哈与便哈达立约，放他回去，为此受到一位先知的责备。第 21 章记载，耶斯列人拿伯不肯把祖传的葡萄园让给亚哈，耶洗别便托亚哈的名写信，叫人诬告拿伯，用石头把他打死。亚哈下去要得那葡萄园时，以利亚迎着他，预言他的家要被除灭。亚哈听了就撕裂衣服、披麻禁食，于是耶和华说这祸要到他儿子的日子才降下。

  据第 22 章，三年以后，亚哈约同犹大王约沙法去夺回基列的拉末。出兵前先知米该雅预言此战不利，亚哈把他下在监里，自己改换装束上阵。有一个人随便开弓，恰巧射入他的甲缝里；他在车上撑到傍晚就死了。众人把他送回撒玛利亚安葬，儿子亚哈谢接续作王。22:39 还提到他修造的象牙宫和所建的城邑。

  亚述王撒缦以色三世的库尔赫石碑记载了公元前 853 年的夸夸之战，在抵挡亚述的联军中列有“以色列人亚哈”，称他出动战车二千辆、步兵一万人。圣经没有提到这一战。
sources: []
recalled:
  - 《列王纪上》16:29—22:40
  - 《历代志下》第 18 章
  - 亚述王撒缦以色三世库尔赫石碑铭文（夸夸之战）
