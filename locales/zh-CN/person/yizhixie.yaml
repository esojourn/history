name: 伊稚斜单于
aliases: [伊稚斜]
role: 匈奴单于
summary: 军臣单于之弟，夺位自立；在位时匈奴失去河西，又在漠北之战中大败，王庭北迁。
body: |-
  据《史记·匈奴列传》，伊稚斜是军臣单于的弟弟，原为左谷蠡王。公元前 126 年军臣单于去世，他自立为单于，击败军臣的太子於单，於单逃到汉朝投降，几个月后死去。此后几年，匈奴连年攻入汉朝的代郡、雁门、定襄、上郡等地，汉朝则由卫青屡次出塞反击。

  元朔六年（前 123 年），原为匈奴小王、降汉后又兵败归匈奴的赵信得到伊稚斜的重用。他建议把王庭迁到大漠以北，引诱汉军远来，等其疲惫再打。元狩二年（前 121 年）霍去病两次攻入河西，伊稚斜要追究驻守河西的浑邪王、休屠王的责任，浑邪王于是杀休屠王降汉，列传说降者四万余人，号称十万。匈奴从此失去河西。

  元狩四年（前 119 年），卫青、霍去病分道越过大漠。伊稚斜在漠北列阵等候卫青，交战至傍晚，被汉军从两翼包围，他带着数百名精骑向西北突围而去。因为他十几天与部众失去联系，右谷蠡王一度自立为单于，等他重新聚集部众后才取消称号。列传说，此后匈奴远遁，大漠以南不再有匈奴的王庭。

  战后他采纳赵信的主意，派使者到汉朝请求恢复和亲。汉朝的使者要求他到边境朝见、做汉的外臣，他大怒，把使者扣留。在位十三年后，他于前 114 年去世，儿子乌维继位。
sources: []
recalled:
  - 《史记·匈奴列传》
  - 《汉书·匈奴传上》
