name: 桑弘羊
aliases: []
role: 御史大夫
summary: 汉武帝的理财大臣，主持盐铁官营、均输平准数十年，昭帝时因谋废霍光被杀。
body: |-
  据《史记·平准书》，桑弘羊是洛阳商人的儿子，擅长心算，十三岁就入宫任侍中。他的生年是由此推算的，学者说法不一。《汉书》没有为他单独立传，他的事迹散见于《平准书》《食货志》和《盐铁论》。

  武帝连年对匈奴用兵，又遇水灾，国库空虚。元狩年间，朝廷任用大盐商东郭咸阳、大冶铁商孔仅主管盐铁，桑弘羊以侍中参与筹划，《平准书》说这三人“言利事析秋毫”。元鼎二年（公元前 115 年）他任大农丞，开始试行均输。元封元年（前 110 年）他任治粟都尉，代管大农的事务，在各郡国普遍设均输官，把各地应缴的贡物运到价高的地方出售；又在京师设平准，贵时抛售、贱时收购，以平抑物价。盐、铁由官府专营，天汉三年（前 98 年）又实行酒类专卖。《平准书》说，此后百姓的赋税没有增加而国家的用度充足。

  后元二年（前 87 年）武帝临终，他被任命为御史大夫，与霍光、金日磾、上官桀一同辅佐昭帝。始元六年（前 81 年），朝廷召集各地举荐的贤良、文学六十余人讨论民间疾苦，这些人要求废除盐铁官营和酒类专卖，桑弘羊与他们当面辩论，坚持这些政策是边防费用所系。会后只取消了酒类专卖和关内的铁官。

  他自认为国家兴利有功，想为子弟求官，被霍光拒绝，由此结怨。元凤元年（前 80 年），他被指与上官桀父子、燕王刘旦合谋除掉霍光、另立皇帝，事情败露后被处死，家族也被诛灭。
sources: []
recalled:
  - 《史记·平准书》
  - 《汉书·食货志》
  - 《汉书·霍光金日磾传》
  - 桓宽《盐铁论》
