name: 蒙恬
aliases: []
role: 将军、内史
summary: 秦将，率军北逐匈奴、修筑长城，驻守上郡；二世即位后被逼自杀。
body: |-
  蒙恬的祖先是齐人，祖父蒙骜、父亲蒙武都是秦将，他的生年和出生地史无记载。据《史记·蒙恬列传》，始皇二十六年（公元前 221 年）他因家世得为秦将，攻齐有功，拜为内史。《秦始皇本纪》记始皇三十二年（前 215 年）派他发兵三十万北击胡，夺取河南地。此后他主持修筑长城，本传说西起临洮、东至辽东，“延袤万余里”。他驻守上郡十余年，始皇长子扶苏后来被派到他军中监军。

  前 210 年始皇死于沙丘，赵高与李斯、胡亥伪造诏书赐扶苏、蒙恬死。扶苏自杀，蒙恬心存怀疑，请求复核，被囚禁在阳周。二世即位后，赵高因与蒙氏有旧怨，日夜进谗，先杀其弟蒙毅，又派使者到阳周逼蒙恬自尽，蒙恬吞药而死。
sources:
  - 《史记·蒙恬列传》 https://zh.wikisource.org/wiki/史記/卷088
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
