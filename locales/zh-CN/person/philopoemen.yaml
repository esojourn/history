name: 菲洛皮门
aliases: [菲洛波门, 斐洛波门]
role: 亚该亚同盟将军
summary: 亚该亚同盟的统帅，八次当选将军，把斯巴达并入同盟，人称“最后一个希腊人”。
body: |-
  阿卡迪亚的麦加洛波利斯人，生于公元前 253 年，早年丧父，由父亲的朋友和两位曾在西西里和昔兰尼推翻僭主的同乡哲学家教养。他以伊巴密浓达为榜样，生活简朴，热衷军事。前 223 年斯巴达国王克列奥美涅斯三世夜袭麦加洛波利斯，他率众断后，使大部分居民撤到美塞尼。次年塞拉西亚之战，他在骑兵队中，不待号令就发起冲击，打乱了敌军一翼，自己两腿被标枪穿透；据普鲁塔克，马其顿国王安提柯三世事后说，这个年轻人做了一件大将该做的事。

  此后他到克里特岛当了约十年雇佣军将领。回国后，前 210 年前后他任亚该亚同盟的骑兵统领，前 208 年首次当选将军。他让步兵改用大盾和长矛，像马其顿方阵那样密集列阵，并严加操练。前 207 年在曼提尼亚，他击败斯巴达的统治者马卡尼达斯，亲手用矛将其刺死。继起的纳比斯仍是亚该亚人的大敌，他几次与之交战，其间又去克里特待了几年。

  前 192 年纳比斯被埃托利亚人刺杀，他立即带兵赶到斯巴达，说服该城加入亚该亚同盟。至此同盟囊括了整个伯罗奔尼撒。前 188 年斯巴达发生变乱，他率军前往，处死一批人，拆毁城墙，废除相传出自吕库古的教育和制度，改用亚该亚的法律。这时罗马已击败马其顿和塞琉古，希腊各邦的争端动辄告到元老院；他主张在盟约范围内尽量自主，不事事迎合罗马。

  前 183 年美塞尼脱离同盟。他年已七十，抱病出征，在山路上坠马被俘。美塞尼人把他关进地牢，当夜送去毒药。亚该亚人随即攻下美塞尼，为他报仇。送葬时捧骨灰瓮的是同盟将军吕科塔斯之子、后来的史家波利比乌斯。波利比乌斯为他写过一部传记，已佚，是普鲁塔克所作传记的依据。普鲁塔克说，有位罗马人称他为“最后一个希腊人”。
sources: []
recalled:
  - 普鲁塔克《菲洛皮门传》
  - 波利比乌斯《历史》卷十第 21—24 章、卷十一第 9—18 章、卷二十三第 12 章
  - 保萨尼亚斯《希腊志》卷八第 49—51 章
