name: 汉平帝
aliases: [刘衎, 刘箕子, 孝平皇帝]
role: 皇帝
summary: 汉元帝之孙，九岁被王莽和太皇太后迎立，在位期间政事全由王莽主持，十四岁去世。
body: |-
  刘衎原名箕子，是汉元帝的孙子，父亲中山孝王刘兴，他三岁继承中山王位。元寿二年（公元前 1 年）哀帝去世，没有儿子，太皇太后王政君和大司马王莽把九岁的他迎到长安立为皇帝，由太皇太后临朝，王莽执政。

  王莽鉴于哀帝朝外戚得势的教训，不许平帝的母亲卫姬和卫氏亲属到长安来。王莽的长子王宇担心日后招怨，暗中联络卫氏，又在夜里让人往王莽家门上洒血，想借鬼神之说劝父亲改变主意。事情败露后，王莽逼王宇自杀，并借此案诛灭了卫氏一族和许多异己。元始四年（公元 4 年），王莽把自己的女儿立为平帝的皇后。

  这几年以平帝名义颁布的政令都出自王莽，如在郡国和县普遍设立学校，在长安扩建太学等。《汉书·地理志》记录了元始二年全国的户口，共一千二百二十三万余户，五千九百五十九万余口。

  元始五年十二月（已入公元 6 年），平帝在未央宫去世，年十四岁。《汉书·平帝纪》没有记载死因。后来翟义起兵讨伐王莽，檄文中说平帝是被王莽毒死的；《资治通鉴》采用了王莽在腊日进献毒酒的说法。平帝死后，王莽选了两岁的宗室幼儿刘婴为继承人，自己代行皇帝的职权。
sources: []
recalled:
  - 《汉书·平帝纪》
  - 《汉书·王莽传上》
  - 《汉书·地理志》
  - 《资治通鉴》卷三十五、三十六
