name: 晋文公
aliases: [重耳, 公子重耳]
role: 晋国国君，春秋霸主
summary: 晋国国君，流亡十九年后回国即位，在城濮之战中大败楚军，成为继齐桓公之后的霸主。
body: |-
  晋文公名重耳，是晋献公之子。他的生年有不同说法：按《史记·晋世家》，他出亡时四十三岁、回国时六十二岁，应生于公元前 697 年左右；按《左传》《国语》的一些记载推算，则要晚得多。

  晋献公晚年宠爱骊姬，骊姬设计害死太子申生，又诬陷重耳和夷吾。公元前 655 年，重耳出奔狄地，在那里住了十二年。此后他辗转经过卫、齐、曹、宋、郑、楚、秦等国，有的国家冷遇他，有的以礼相待：齐桓公把宗室之女嫁给他，楚成王设宴款待，重耳答应日后若两国交兵，晋军将“退避三舍”。跟随他流亡的有狐偃、赵衰、胥臣、魏犨、介子推等人。

  公元前 636 年，秦穆公派兵护送重耳回国，晋人杀死晋怀公，重耳即位。次年周王室发生王子带之乱，周襄王出居郑地，晋文公出兵平乱，送襄王回到王城，获得了“勤王”的名声和南阳一带的土地。他在国内整顿政治，扩充三军。

  公元前 632 年，晋楚为争夺宋国在城濮交战。晋军践约退避三舍，然后击败楚将子玉率领的楚军。战后文公在践土会盟诸侯，周襄王亲临，策命他为“侯伯”，晋国由此成为霸主，晋的霸业此后延续了一百多年。

  文公死于公元前 628 年。《左传》记载，介子推跟随他流亡，回国后没有求取禄位，与母亲隐居而死，文公以绵上之田作为他的封地。寒食节源于介子推的说法，出现在汉代以后。
sources: []
recalled:
  - 《左传》僖公二十三年至二十八年
  - 《国语·晋语四》
  - 《史记·晋世家》
