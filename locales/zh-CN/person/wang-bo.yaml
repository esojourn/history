name: 王勃
aliases: [王子安]
role: 诗人
summary: 唐初诗人，“初唐四杰”之一，作《滕王阁序》，二十多岁时渡海溺水后惊悸而死。
body: |-
  王勃字子安，绛州龙门人，是隋末学者王通的孙子。他自幼聪慧，以神童著称，年少时即应试及第，被授予朝散郎。沛王李贤召他为王府修撰。据《旧唐书》本传，当时诸王斗鸡，王勃戏作《檄英王鸡》，高宗看到后大怒，认为他挑拨诸王关系，把他逐出王府。

  此后他游历蜀中，又任虢州参军。他藏匿了一个犯罪的官奴曹达，又怕事情泄露，把曹达杀死，因此被判死罪，遇到大赦才得免，他的父亲王福畤也受牵连，被贬为交趾县令。上元二年（公元 675 年）前后，他南下交趾探望父亲，途经洪州，写下了《滕王阁序》，其中“落霞与孤鹜齐飞，秋水共长天一色”一联流传千古。关于他即席作序、令洪州都督惊服的故事，出自五代王定保的《唐摭言》等笔记。

  次年他渡海时落水，被救起后惊悸而死，年仅二十七（一说二十八），因此他的生年有 649、650 年两说。他与杨炯、卢照邻、骆宾王并称“初唐四杰”，名句还有《送杜少府之任蜀州》中的“海内存知己，天涯若比邻”。
sources: []
recalled:
  - 《旧唐书·文苑传·王勃》
  - 《新唐书·文艺传·王勃》
  - 杨炯《王勃集序》
