name: "欧文"
aliases: ["约翰·欧文"]
role: "公理派神学家"
summary: "克伦威尔时代最能干的公理派神学家，任牛津大学副校长，参与拟定萨伏伊宣言。"
body: |-
  欧文 1616 年生于牛津郡斯塔德汉普顿，父亲是清教徒牧师。他在牛津读书，内战期间在埃塞克斯做教区牧师，由长老派转向公理派，曾随克伦威尔出征爱尔兰和苏格兰，做随军牧师。

  《历史的轨迹》第三十二章说，克伦威尔很倾向公理派，得势后让当时公理派中最能干的神学家欧文担任教会的高级职务和牛津大学副校长；他 1651 年任牛津基督教会学院院长，1652 年起任副校长。

  该书说，1658 年 9 月 29 日，克伦威尔死后第二十六天，公理派长老在伦敦的萨伏伊宫开会，订立“公理派信仰与制度宣言”。与会领袖大多参加过威斯敏斯特会议，几乎把威斯敏斯特信条全部放了进去，只把教会制度一段改为公理派的原则。欧文是这次会议的主要人物之一。

  王政复辟后他被逐出牛津，在伦敦牧养一个不从国教的会众，屡受限制。他著述极多，1683 年在伦敦近郊伊灵去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
recalled:
  - "欧文《基督之死中死亡之死》（1647 年）"
  - "《萨伏伊宣言》（1658 年）"
