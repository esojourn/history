name: 李克用
aliases: [朱邪克用, 独眼龙, 晋王]
role: 河东节度使、晋王
summary: 沙陀首领，率军收复被黄巢占据的长安，任河东节度使，与朱温长期争战，封晋王。
body: |-
  李克用是沙陀人，大中十年（公元 856 年）生，本姓朱邪，父亲朱邪赤心因帮助唐朝镇压庞勋有功，被赐姓名李国昌。李克用骁勇善射，一只眼睛失明，人称“独眼龙”。乾符五年（878 年）前后，他在大同杀死防御使段文楚，与父亲一同起兵，占据代北一带，广明元年（880 年）被唐军和吐谷浑首领赫连铎击败，逃往鞑靼部落。

  黄巢攻入长安后，唐朝赦免了他，召他南下。中和三年（883 年），他率沙陀等部兵马入关，所部多穿黑衣，号称“鸦儿军”，大破黄巢军，收复长安，因功任河东节度使，治所在晋阳。次年他追击黄巢到河南，在王满渡大败黄巢。回师途中，他在汴州上源驿被朱温设宴伏击，靠部下拼死保护才逃出，从此与朱温结为世仇（另见“上源驿之变”条）。

  此后他屡次干预朝政。乾宁二年（895 年）关中的王行瑜、李茂贞、韩建三镇带兵进逼长安，他出兵讨伐，击败王行瑜，被封为晋王。但在与朱温的争战中，他多处于下风，河北诸镇先后倒向朱温，晋阳也曾两次被朱温围攻。天祐四年（907 年）朱温篡唐，他不承认后梁，继续使用唐朝的天祐年号。天祐五年（908 年）正月他在晋阳去世，年五十三，由儿子李存勖继位，李存勖后来灭后梁，建立后唐。宋代欧阳修在《五代史伶官传序》中写他临终交给李存勖三支箭，嘱咐他报仇，这个故事不见于更早的史书。
sources: []
recalled:
  - 《旧五代史·武皇纪》
  - 《新五代史·庄宗纪》
  - 《资治通鉴》卷二百五十三至二百六十六
