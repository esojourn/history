name: 勾践
aliases: [越王勾践, 鸠浅, 菼执]
role: 越王
summary: 越王，被吴王夫差打败后屈身求和，任用文种、范蠡发愤图强，最终灭吴，北上称霸。
body: |-
  勾践是越王允常之子，公元前 496 年即位，生年不详。越国在今浙江一带，都城在会稽（今绍兴）。勾践即位当年，吴王阖闾来攻，两军在檇李对阵。据《左传》定公十四年，勾践派罪人排成三行走到吴军阵前，自刎而死，吴军看得发呆，越军趁机进攻，大败吴军，阖闾受伤而死。

  公元前 494 年，勾践不听范蠡劝阻，先发兵攻吴，在夫椒被夫差打败，带着五千残兵退守会稽山。他派大夫文种用美女财宝贿赂吴太宰伯嚭，向夫差求和，夫差不顾伍子胥的反对，答应了。据《国语·越语》，勾践此后曾到吴国为臣，几年后才被放回。

  回国后，勾践“苦身焦思，置胆于坐，坐卧即仰胆，饮食亦尝胆”（《史记·越王勾践世家》），亲自耕作，夫人亲自织布，礼贤下士，抚恤百姓。“卧薪尝胆”这一成语中的“卧薪”是宋代以后才加上的。伍子胥曾预言：“越十年生聚，而十年教训，二十年之外，吴其为沼乎！”（《左传》哀公元年）

  公元前 482 年，勾践趁夫差北上黄池会盟，袭入吴都；此后连年进攻，公元前 473 年灭吴，夫差自杀。勾践随后渡淮北上，在徐州与齐、晋等诸侯会盟，向周王室进贡，周元王赐胙，承认他为霸主。他死于公元前 465 年。1965 年湖北江陵望山一号楚墓出土的一把青铜剑，铭文为“越王鸠浅自作用剑”，即越王勾践剑，至今寒光闪闪。
sources: []
recalled:
  - 《史记·越王勾践世家》
  - 《左传》定公十四年
  - 《左传》哀公元年
  - 《国语·越语》
