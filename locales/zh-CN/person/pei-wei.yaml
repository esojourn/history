name: 裴頠
aliases: [裴逸民]
role: 尚书左仆射
summary: 西晋大臣、思想家，与张华同辅朝政，著《崇有论》批评贵无之风。
body: |-
  裴頠字逸民，河东闻喜人，是曾主持绘制《禹贡地域图》的司空裴秀之子。他年少时就以见识通博知名，袭父爵为钜鹿郡公。贾充的妻子郭槐是他的姨母，所以他与贾后是表亲。

  惠帝时他历任国子祭酒、侍中、尚书左仆射等职，与张华、贾模一同主持政务。他虽是贾后的亲戚，却担心贾后乱政，据《晋书》本传，他曾与张华、贾模商议废贾后而改立谢淑妃，因张华等顾虑而没有实行。

  当时王衍等人崇尚老庄，以“无”为万物的根本，士大夫以不问世务为高。他作《崇有论》加以反驳，主张万物自生，“无”不能生“有”，礼法和职事不可废弃。永康元年（公元 300 年）赵王伦废贾后，他与张华同时被杀，时年三十四。
sources: []
recalled:
  - 《晋书·裴頠传》
