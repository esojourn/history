name: 周瑜
aliases: [周公瑾, 周郎]
role: 偏将军、南郡太守
summary: 孙吴将领，孙策的好友，赤壁之战中统率孙刘联军击败曹操。
body: |-
  据《三国志·吴书·周瑜传》，周瑜字公瑾，庐江舒县人，出身官宦世家，堂祖父和堂叔都做过太尉。孙坚出兵讨董卓时把家眷安置在舒县，周瑜与孙策同岁，交情很深，把自家的大宅让给孙策一家居住。

  兴平二年（公元 195 年）孙策渡江，周瑜带兵前往会合，帮助他击败刘繇。后来他被袁术留用，建安三年（198 年）设法回到江东，孙策亲自迎接，任他为建威中郎将。本传说吴中的人都称他“周郎”；孙策与他分别娶了桥公的两个女儿。孙策遇刺后，周瑜带兵赶回奔丧，以中护军的身份与张昭一同主持事务，辅佐孙权。

  建安十三年（208 年）曹操取得荆州，写信给孙权，声称要率水军八十万东下。群臣多主张迎降。周瑜对孙权分析说，曹军的北方士兵不习水战，远来疲惫，水土不服，荆州的降兵又未必归心，请求带兵迎击。孙权任他和程普为左右督，率三万人与刘备会合，在赤壁与曹军相遇。他采用部将黄盖的计策，以诈降的船只满载柴草，顺风纵火，烧毁曹军的战船，火势延及岸上的营寨，曹操率残部北退。

  此后周瑜进攻曹仁据守的江陵，围城一年多，曹仁撤走，孙权任他为南郡太守。他向孙权建议乘胜西取益州，再并张鲁，然后联合马超进逼曹操。建安十五年（210 年）他在准备出征的途中病死于巴丘，时年三十六。本传还说他精通音乐，酒过三巡仍能听出演奏的错误，当时有“曲有误，周郎顾”的说法。
sources: []
recalled:
  - 《三国志·吴书·周瑜鲁肃吕蒙传》及裴松之注
