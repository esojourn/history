name: 陈庆之
aliases: [陈子云]
role: 将领
summary: 梁朝将领，率数千白袍军护送元颢北上，一度攻入洛阳。
body: |-
  陈庆之字子云，义兴国山人，出身寒微，幼年就跟随萧衍。据《梁书》本传，他喜好下棋，常陪梁武帝通宵对弈，很受信任。他身体文弱，不善骑射，到四十多岁才开始带兵。

  北魏河阴之变后，北海王元颢投奔梁朝，梁武帝立他为魏王，大通二年（公元 528 年）冬派陈庆之率兵七千人护送他北归。陈庆之的军队都穿白袍，一路攻克睢阳、荥阳、虎牢。《梁书》说他自铚县出发到洛阳，一百四十天里攻下三十二城，打了四十七仗，全都获胜，洛阳一带流传童谣“名师大将莫自牢，千兵万马避白袍”。元颢进入洛阳称帝，北魏孝庄帝出逃。不久，尔朱荣率大军反攻，元颢兵败被杀，陈庆之的军队也溃散了，他剃去须发扮成僧人，才逃回江南。这些战果的数字出自《梁书》本传，有学者认为有夸大之处。

  此后他历任北兖州、南北司二州刺史，在边境屡次击败东魏军，又劝课农桑，开垦田地。大同五年（539 年）去世，年五十六。
sources: []
recalled:
  - 《梁书·陈庆之传》
  - 《资治通鉴》卷一百五十三
