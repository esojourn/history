name: "宾"
aliases: ["威廉·宾", "彭威廉", "威廉·佩恩"]
role: "贵格会信徒、宾夕法尼亚的创建者"
summary: "海军上将之子，加入贵格会，1681 年获赐北美土地，建立宾夕法尼亚殖民地。"
body: |-
  宾 1644 年生于伦敦，父亲是海军上将威廉·宾爵士。他在牛津读书时因不从国教被开除，约 1667 年在爱尔兰加入贵格会，此后多次因信仰被捕，在伦敦塔中写了《不背十字架，就无冠冕》。

  1681 年查理二世为抵偿欠他父亲的债，把北美的一大片土地赐给他，命名为宾夕法尼亚。他把这里当作信仰自由的“神圣实验”，1682 年亲自渡海，规划费城，订立政府框架，凡信神的人都可以在此居住，不受宗教逼迫。

  《历史的轨迹》第三十三章说，贵格派尊重所有人的尊严和价值，这使宾善待印第安人。一般记载他与当地的伦尼莱纳佩人订约购地，关系和睦。他晚年为债务所困，1712 年中风，1718 年死于英国伯克郡拉斯科姆。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十三章“亚米纽斯主义 贵格派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter37.html"
recalled:
  - "宾《宾夕法尼亚政府框架》（1682 年）"
