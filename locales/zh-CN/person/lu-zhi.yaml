name: 陆贽
aliases: [陆敬舆, 陆宣公]
role: 翰林学士、宰相
summary: 唐德宗的翰林学士和宰相，奉天之难中起草罪己诏，所写奏议后世称《陆宣公奏议》。
body: |-
  陆贽字敬舆，苏州嘉兴人，天宝十三载（公元 754 年）生。大历八年（773 年）他十八岁考中进士，此后任县尉等职。唐德宗即位后召他为翰林学士，参与机密。

  建中四年（783 年）泾原兵变，他随德宗逃到奉天，此时军情紧急，诏书多出自他手。他劝德宗反省过失、收拾人心，兴元元年（784 年）正月以德宗的名义起草《奉天改元大赦制》，承认自己的过错，赦免除朱泚以外参与叛乱的藩镇。据《旧唐书》，诏书传到各地，前线将士读后无不感动流泪（另见“泾原兵变”条）。当时他常在德宗身边出谋划策，人称“内相”。

  贞元八年（792 年）他任宰相，整顿吏治，选拔人才，主持科举时录取了韩愈等人。他多次上疏，批评两税法实施中的弊病，反对德宗聚敛财货。他与德宗宠信的户部侍郎裴延龄不和，贞元十年（794 年）被罢相，次年被贬为忠州别驾。在忠州的十年里，他闭门不出，据说为了当地缺医少药，编了《陆氏集验方》。

  贞元二十一年（805 年）唐顺宗即位，下诏召他回京，诏书还没有到，他已经在忠州去世，年五十二，谥号宣，后人称他陆宣公。他的奏议文字明白透彻，后世编为《陆宣公奏议》，宋代苏轼等人很推崇。
sources: []
recalled:
  - 《旧唐书·陆贽传》
  - 《新唐书·陆贽传》
  - 权德舆《陆宣公翰苑集序》
