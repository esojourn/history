name: 唐代宗
aliases: [李豫, 李俶, 广平王]
role: 皇帝
summary: 唐肃宗长子，收复两京的元帅；在位时安史之乱平定，但河北藩镇从此割据。
body: |-
  李豫原名李俶，是唐肃宗的长子，生于开元十四年十二月，按公历已是公元 727 年初。天宝年间封广平王。安史之乱中他随父亲北上灵武，至德二载（757 年）任天下兵马元帅，以郭子仪为副元帅，率唐军和回纥援兵先后收复长安、洛阳（另见“收复两京”条）。次年他被立为太子，改名豫。

  宝应元年（762 年）四月，宦官李辅国、程元振带兵挫败了张皇后废立的图谋，肃宗随即去世，他即皇帝位。即位之初李辅国自恃拥立之功专横，他先尊之为尚父，同年派人夜间刺杀了李辅国。同年冬，唐军和回纥兵再次收复洛阳；广德元年（763 年）正月，史朝义兵败自缢，安史之乱结束（另见“安史之乱”条）。但为了尽快结束战争，朝廷让投降的安史部将田承嗣、李怀仙、李宝臣等人继续统领原来的地盘，河北藩镇割据从此形成（另见“河朔三镇”条）。

  同年十月吐蕃攻入长安，他逃往陕州，郭子仪收复京城后才得以回来（另见“吐蕃攻入长安”条）。次年仆固怀恩反叛，引回纥、吐蕃入侵，也是靠郭子仪化解。在朝中，他先后倚重宦官程元振、鱼朝恩，大历五年（770 年）与宰相元载合谋诛杀鱼朝恩；元载专权贪纵，大历十二年（777 年）又被他赐死。财政上，他任用刘晏整顿漕运和盐政，朝廷收入有所恢复（另见“刘晏理财”条）。他对河北藩镇多加姑息。大历十四年（779 年）五月他在长安去世，年五十三。
