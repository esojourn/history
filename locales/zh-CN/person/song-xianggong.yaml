name: 宋襄公
aliases: [子兹甫]
role: 宋国国君
summary: 宋国国君，齐桓公死后谋求霸业，在泓水之战中坚持“不鼓不成列”而败于楚国。
body: |-
  宋襄公名兹甫，是宋桓公之子，公元前 650 年即位，生年不详。宋国是商朝后裔微子启的封国，都城在今河南商丘一带。据《左传》，他做太子时曾想把君位让给庶兄目夷（字子鱼），目夷推辞不受，襄公即位后任他为司马。

  齐桓公死后齐国内乱，宋襄公率诸侯之师送齐孝公回国即位，于是想继承齐桓公的霸业。公元前 639 年他召集诸侯在盂会盟，楚成王在会上把他扣押起来，后来才放回。前 638 年，宋伐郑，楚国出兵救郑，两军在泓水相遇。

  据《左传》僖公二十二年，楚军渡河时，子鱼请求趁其半渡出击，襄公不许；楚军渡河后尚未列好阵势，子鱼再请出击，襄公仍不许。等楚军列好阵，宋军大败，襄公大腿受伤。国人都埋怨他，他说君子“不重伤，不禽二毛”，“不鼓不成列”。子鱼反驳说，他根本不懂战争。

  襄公次年即公元前 637 年因伤去世。后人对他的评价分歧很大：《左传》借子鱼之口批评他迂腐，《公羊传》却称赞他“临大事而不忘大礼”。《史记》《荀子》把他列入“春秋五霸”的说法之一，但多数人认为他并未真正称霸。
sources: []
recalled:
  - 《左传》僖公二十二年
  - 《公羊传》僖公二十二年
  - 《史记·宋微子世家》
