name: 卡拉卡拉
aliases: [马尔库斯·奥勒留·安东尼努斯, 卡拉卡拉大帝, 巴西亚努斯]
role: 罗马皇帝
summary: 塞维鲁之子，杀弟独掌大权，公元 212 年把公民权给予帝国全体自由民。
body: |-
  卡拉卡拉于公元 188 年 4 月 4 日生在卢格杜努姆，是塞普提米乌斯·塞维鲁和尤利娅·多姆娜的长子，本名巴西亚努斯，父亲称帝后给他改用马可·奥勒留的名字。“卡拉卡拉”是绰号，指他爱穿的一种高卢式连帽长袍。198 年父亲立他同为皇帝。

  211 年塞维鲁死在不列颠，他与弟弟盖塔共同继位，年底把盖塔杀死，接着清洗盖塔的人，卡西乌斯·狄奥说死了两万，法学家帕皮尼安也在其中。212 年他颁布敕令，把罗马公民权授给帝国境内几乎所有的自由人。他给士兵大幅加饷，为此铸行成色不足的新银币；罗马城南的大浴场在他手里落成。

  他崇拜亚历山大大帝，处处模仿。213 年他在莱茵河上游与阿勒曼尼人作战，215 年在亚历山大城纵兵屠杀市民，次年进攻帕提亚。217 年 4 月 8 日，他在埃德萨去卡莱的路上被身边的士兵刺死，主谋是禁卫军长官马克里努斯。
sources: []
recalled:
  - 卡西乌斯·狄奥《罗马史》卷 77—78
  - 赫罗狄安《马可以后的帝国史》卷 4
  - 《罗马帝王纪·卡拉卡拉传》
