name: 钱镠
aliases: [钱具美, 吴越武肃王]
role: 吴越国王
summary: 吴越国的建立者，据有两浙，保境安民，尊奉中原王朝；曾修筑钱塘江捍海塘。
body: |-
  钱镠是杭州临安人，大中六年（公元 852 年）生，字具美。据史书，他年轻时贩卖私盐，喜好武艺。唐末黄巢军进入浙东时，他在乡兵首领董昌手下，以少量兵力设伏，使黄巢军绕道而过。此后他随董昌平定浙东，光启三年（887 年）任杭州刺史。

  乾宁二年（895 年），董昌在越州称帝，钱镠奉唐朝之命讨伐，次年攻破越州，董昌被杀。此后钱镠兼领镇海、镇东两镇，据有两浙十余州。他与淮南的杨行密长期争战，互有胜负。唐朝先后封他为越王、吴王。开平元年（907 年）后梁封他为吴越王，后唐同光元年（923 年）又封他为吴越国王。

  钱镠在位四十多年，一直奉中原王朝为正朔，接受中原的封号，不轻易与邻国开战，境内相对安定。他重视水利，开平四年（910 年）征发民工修筑钱塘江的捍海塘，用竹笼装石筑堤，保护杭州城不受潮水冲击（另见“钱镠修捍海塘”条）；还疏浚西湖，设置专人负责太湖地区的治水。杭州在他手里扩建城垣，成为东南的大城市。

  长兴三年（932 年），钱镠在杭州去世，年八十一。据史书，他临终嘱咐子孙要善事中原王朝，不可因朝代更替而失去奉事大国的礼节。吴越国此后传了三代五王，到 978 年钱俶纳土归宋，两浙没有经历大的战乱。后世流传的钱王射潮的故事是宋人笔记里的传说。
sources: []
recalled:
  - 《旧五代史·世袭列传·钱镠》
  - 《新五代史·吴越世家》
  - 《资治通鉴》卷二百五十四至二百七十七
