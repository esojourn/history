name: 克洛狄乌斯
aliases: [普布利乌斯·克洛狄乌斯·普尔喀, 克劳狄乌斯·普尔喀]
role: 罗马保民官
summary: 贵族出身的保民官，免费发粮，放逐西塞罗，以帮伙控制街头，死于斗殴。
body: |-
  普布利乌斯·克洛狄乌斯·普尔喀，罗马贵族克劳狄乌斯家族的成员，约生于公元前 93 年，他采用了名字的平民化拼法“克洛狄乌斯”。前 68 年他在姐夫卢库卢斯军中，煽动士兵抗命。

  前 62 年 12 月，只许妇女参加的“善良女神”祭礼在大祭司长恺撒家中举行，他扮成女人混了进去，被人识破。恺撒因此与妻子离婚，据普鲁塔克，说自己的妻子不容怀疑。次年他受审，自称当天不在罗马，西塞罗出庭作证推翻了这个说法；陪审团受贿，他被判无罪，从此与西塞罗结仇。

  前 59 年他在恺撒帮助下过继给一个平民，取得竞选保民官的资格。前 58 年任保民官时，他立法由国家向公民免费发放粮食，恢复曾被取缔的街坊行会；又通过法律放逐未经审判处死公民的人，迫使西塞罗流亡，并把小加图派往塞浦路斯。此后他靠行会组织起来的帮伙控制街头。保民官米洛组织另一帮人与他对抗，罗马的选举几年间屡因暴力推迟。

  前 52 年 1 月，他与米洛各带随从在阿庇亚大道上博维莱附近相遇，随从斗殴，他受伤被抬进路边的客店，米洛派人把他拖出杀死。他的支持者把尸体抬进元老院议事堂火化，议事堂被烧毁。元老院于是让庞培单独出任执政官以恢复秩序，米洛受审流放；西塞罗为米洛所作的辩护词流传至今。
sources: []
recalled:
  - 西塞罗《为米洛辩护》《论他的住宅》
  - 阿斯科尼乌斯《〈为米洛辩护〉注》
  - 普鲁塔克《恺撒传》第 9—10 章、《西塞罗传》第 28—33 章
  - 卡西乌斯·狄奥《罗马史》卷三十八至卷四十
