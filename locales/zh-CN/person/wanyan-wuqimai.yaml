name: 金太宗
aliases: [完颜吴乞买, 完颜晟]
role: 金朝皇帝
summary: 完颜阿骨打之弟，1123 年继位，俘获辽天祚帝，又发动对宋战争，造成靖康之变。
body: |-
  金太宗完颜吴乞买是完颜阿骨打的弟弟，生于辽大康元年（公元 1075 年），汉名晟。阿骨打起兵后，他任谙班勃极烈，相当于储君，阿骨打出征时由他留守后方。天辅七年（1123 年）阿骨打去世，他即位，改元天会。

  天会三年（1125 年）二月，金军俘获辽天祚帝，辽朝灭亡（另见“金灭辽”条）。这时宋朝收容辽朝降将张觉，又迟迟不交付约定的粮食，金朝以此为由，在同年十月分东西两路伐宋。东路军由完颜宗望率领，次年正月围攻开封，宋朝答应割地赔款后撤回。天会四年（1126 年）秋，金军再次南下，年底（已是公历 1127 年初）攻破开封，次年把宋徽宗、宋钦宗等人押到北方，北宋灭亡（另见“靖康之变”条）。

  靖康之变后，金朝先后扶植张邦昌的“楚”、刘豫的“齐”作为傀儡政权，统治黄河以南地区，同时派兵追击南逃的宋高宗。在内政上，太宗参照辽宋的制度，开始设立汉式的官制，并举行科举考试；对新占领的辽、宋旧地，则保留原有的州县制度，任用汉人和契丹人官员治理，形成女真旧制与汉制并行的局面。天会十三年（1135 年）正月，他在上京会宁府去世，阿骨打的嫡孙完颜亶继位，即金熙宗。
sources: []
recalled:
  - 《金史·太宗本纪》
  - 《三朝北盟会编》
  - 《大金国志》
