name: 柴荣
aliases: [郭荣, 周世宗]
role: 后周皇帝
summary: 郭威的养子，954 年即位，整顿禁军，限佛，南征淮南、北伐契丹，959 年病逝。
body: |-
  柴荣是邢州尧山人，天祐十八年（公元 921 年）生，是郭威妻子柴氏的侄子。他年少时投奔姑父郭威，被收为养子，改姓郭，所以也叫郭荣。据宋人记载，他早年曾跟随商人往来江陵一带贩茶。郭威称帝后，他出任澶州节度使，后来封晋王。

  显德元年（954 年）郭威去世，柴荣即位。北汉刘崇以为他新立可欺，联合契丹南下。柴荣不顾冯道等大臣的劝阻，亲自领兵迎战，在高平大败北汉军（另见“高平之战”条）。战后他斩了临阵先逃的将领樊爱能、何徽等人，整顿禁军，挑选精壮编成殿前诸班，从此后周军力大振（另见“周世宗改革”条）。

  他在内政上也有很多作为：显德二年（955 年）下令限制佛教，废除没有朝廷敕额的寺院，收民间铜器、铜佛铸钱（另见“周世宗灭佛”条）；扩建开封外城；派人到各地均定田赋；整理刑律。据宋人记载，他曾说自己要以十年开拓天下、十年休养百姓、十年致太平。

  在对外方面，他采纳王朴“先易后难”的建议，显德二年至五年（955—958 年）三次亲征南唐，取得淮南江北十四州（另见“周世宗征淮南”条）；又派兵西取后蜀的秦、凤等四州。显德六年（959 年）四月，他亲自北伐契丹，很快收复了瓦桥、益津、淤口三关和瀛、莫、宁三州（另见“周世宗北伐”条）。正当他准备进攻幽州时，突然病倒，只好回师。同年六月他在开封去世，年三十九，七岁的儿子柴宗训继位。半年后，殿前都点检赵匡胤发动陈桥兵变，后周被北宋取代。
sources: []
recalled:
