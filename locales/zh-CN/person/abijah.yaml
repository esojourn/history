name: 亚比央
aliases: [亚比雅]
role: 南国犹大王
summary: 罗波安的儿子，在耶路撒冷作王三年，与耶罗波安交战，夺取伯特利等城。
body: |-
  罗波安的儿子，《列王纪》称亚比央，《历代志》称亚比雅。他的母亲《列王纪上》15:2 作押沙龙的女儿玛迦，《历代志下》13:2 作基比亚人乌列的女儿米该雅，历来解释不一。据《列王纪上》15:1–3，以色列王耶罗波安十八年，他登基作犹大王，在耶路撒冷作王三年；经文说他行他父亲在他以前所行的一切恶，心不像大卫那样诚实，耶和华却因大卫的缘故仍使他的后裔坚立。15:7 说亚比央常与耶罗波安争战。

  《历代志下》第 13 章对这场争战记得较详。据 13:3，亚比雅率领精兵四十万，耶罗波安率领精兵八十万。亚比雅站在以法莲山地的洗玛脸山上向以色列人说话，指责耶罗波安背叛大卫家、驱逐亚伦子孙作祭司、铸造金牛犊。耶罗波安派伏兵绕到犹大军后，犹大人呼求耶和华，祭司吹号，神就击败了耶罗波安；13:17 说以色列人被杀的精兵有五十万。亚比雅追赶耶罗波安，攻取了伯特利、耶沙拿、以法拉音和属这些城的乡村（13:19）。

  据 13:21，亚比雅娶了十四个妻子，生了二十二个儿子、十六个女儿。他死后葬在大卫城，儿子亚撒接续作王（《列王纪上》15:8）。
sources: []
recalled:
  - 《列王纪上》15:1–8
  - 《历代志下》第 13 章
