name: 弗里蒂格恩
aliases: [菲列德根, 弗里提格恩]
role: 哥特人首领
summary: 哥特人首领，公元 376 年率部渡过多瑙河，两年后在阿德里安堡击杀瓦伦斯。
body: |-
  弗里蒂格恩是多瑙河北岸哥特人中特尔温吉部的一位首领，生卒年都没有记载。据教会史家苏格拉底，他与另一位首领阿塔纳里克相争，得到罗马皇帝瓦伦斯的援助，便带着部众改信了皇帝所奉的阿里乌派基督教。

  376 年匈人西进，哥特人无力抵挡。他和阿拉维乌斯率大批族人来到多瑙河边，请求进入帝国安身，瓦伦斯答应了。阿米阿努斯说，负责安置的罗马官员克扣粮食，拿狗肉换哥特人的孩子做奴隶；随后又在一次宴会上企图扣押哥特首领。哥特人就此反叛，在色雷斯各地劫掠，弗里蒂格恩成为主要的统帅。攻城不下之后，他说过自己“与城墙讲和”。

  378 年 8 月 9 日，瓦伦斯在阿德里安堡城外来攻。他一再派人议和以拖延时间，等外出的骑兵赶回，一举击溃罗马军，瓦伦斯阵亡。此后他率部南下希腊北部，380 年以后不再见于记载。382 年狄奥多西一世与哥特人订约，让他们在多瑙河以南自成一体地住下来。
sources: []
recalled:
  - 阿米阿努斯·马尔凯利努斯《历史》卷 31
  - 苏格拉底《教会史》卷 4 第 33 章
  - 约达尼斯《哥特史》第 25—27 章
  - 佐西莫斯《新历史》卷 4 第 20—34 章
