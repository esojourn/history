name: 蒙哥
aliases: [元宪宗, 蒙哥汗]
role: 大蒙古国第四代大汗
summary: 拖雷长子，夺得汗位后派忽必烈、旭烈兀分掌东西，亲征南宋，死于钓鱼城下。
body: |-
  蒙哥是拖雷的长子，生于 1209 年。他早年随窝阔台攻金，又参加了拔都统率的第二次西征，转战钦察草原和罗斯，参与攻打基辅等城。

  贵由汗在位不到两年就去世，皇后海迷失称制。1251 年在拔都的支持下，蒙哥被推举为大汗，汗位从窝阔台一系转到拖雷一系。窝阔台、察合台两系的一些宗王密谋反对，蒙哥即位后加以镇压，处死、流放了大批宗王和大臣。

  蒙哥在位时整顿财政、统一户籍，加强大汗的集权。他委任弟弟忽必烈总领漠南汉地军国庶事，1253 年派忽必烈远征大理（另见“蒙古灭大理”条）；又派弟弟旭烈兀率军西征，灭掉木剌夷，1258 年攻陷巴格达，阿拔斯王朝灭亡（另见“巴格达陷落”条）。

  1258 年蒙哥亲自率军进攻南宋的四川，同时让忽必烈率东路军进攻鄂州。蒙古军在四川连下多城，1259 年围攻合州钓鱼城，守将王坚坚守，蒙古军久攻不下。这年七月蒙哥死于钓鱼城下，死因有染病和中炮受伤等不同记载（另见“钓鱼城之战”条）。他的死使蒙古攻宋的计划中止，正在西亚的旭烈兀也率主力东返，随后忽必烈与阿里不哥争夺汗位。元朝建立后，忽必烈追尊他为元宪宗。
sources: []
recalled:
  - 《元史·宪宗本纪》
  - 拉施特《史集》
  - 志费尼《世界征服者史》
