name: 杨廷和
aliases: [文忠]
role: 正德、嘉靖之际的内阁首辅
summary: 正德帝死后主持迎立嘉靖帝、诛杀江彬、革除弊政，后因“大礼议”与嘉靖帝不合而去职。
body: |-
  杨廷和是四川新都（今成都市新都区）人，十九岁考中进士，弘治、正德年间在翰林院、内阁任职，正德七年（1512 年）起任内阁首辅。正德帝荒于游乐，政务多由他维持。

  正德十六年（1521 年）三月正德帝去世，没有儿子，皇位空缺了三十多天。杨廷和依据《皇明祖训》“兄终弟及”的规定，与张太后商定迎立兴献王之子朱厚熜，同时设计逮捕正德帝宠信的边将江彬，裁撤豹房、遣散番僧和冗员，革除正德年间的许多弊政，被称为“天下称快”。

  朱厚熜即位后，要尊生父兴献王为皇帝，杨廷和主张他应当以伯父弘治帝为“皇考”，称生父为“皇叔父”，坚持不让，多次封还皇帝的诏书（另见“大礼议”条）。嘉靖三年（1524 年）他被迫辞官回乡。嘉靖七年（1528 年）嘉靖帝颁布《明伦大典》，把他定为大礼议的罪魁，削去官籍，次年他在家乡去世。他的儿子杨慎也因在左顺门哭谏而受廷杖，被流放云南三十多年，以诗文著称。隆庆初年杨廷和恢复官职，追谥“文忠”。
sources: []
recalled:
  - 《明史·杨廷和传》
  - 《明史·杨慎传》
