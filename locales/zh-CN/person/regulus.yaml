name: 雷古卢斯
aliases: [马尔库斯·阿提利乌斯·雷古卢斯, 列古鲁斯]
role: 罗马执政官
summary: 第一次布匿战争中的罗马执政官，攻入阿非利加后兵败被俘，相传守约赴死。
body: |-
  马尔库斯·阿提利乌斯·雷古卢斯，罗马平民出身的将领，生年不详。公元前 267 年他首次任执政官，征服意大利东南端的萨伦托人，占领布伦迪西乌姆。

  第一次布匿战争进行到第九年，前 256 年他补任执政官，与同僚曼利乌斯·武尔索率舰队前往阿非利加。据波利比乌斯，罗马一方有三百三十艘战船，在西西里南岸的埃克诺穆斯海角击败迦太基舰队，这是古代规模最大的海战之一。罗马军队在阿斯皮斯登陆，劫掠乡间。入冬后武尔索奉命带大部分军队回国，雷古卢斯留下，波利比乌斯说他有步兵一万五千、骑兵五百。他在阿底斯击败迦太基军队，占领图内斯，逼近迦太基城。迦太基求和，他提出的条件极为苛刻，谈判破裂。

  前 255 年春，迦太基人把军队交给斯巴达雇佣军官克桑提普斯训练指挥。克桑提普斯选择平原决战，用战象冲击罗马步兵，用优势骑兵包抄两翼。据波利比乌斯，罗马军队只有约两千人逃脱，雷古卢斯和五百人被俘。前来接应的罗马舰队在返航途中遇风暴，损失了大部分船只。

  他此后的遭遇是罗马最著名的故事之一：前 250 年前后迦太基派他回罗马商谈和约或交换战俘，他发誓谈不成就回去；到罗马后他反而劝元老院拒绝，然后守约返回迦太基，被酷刑处死。西塞罗、贺拉斯和李维的摘要都讲到这件事。但年代最近的波利比乌斯完全没有提到出使和酷刑；狄奥多罗斯的残篇则说，他的遗孀在罗马虐待交给她看管的迦太基战俘。许多现代学者因此认为酷刑的故事是后来形成的，他大概是在囚禁中去世。
sources: []
