name: 班昭
aliases: [曹大家, 班惠班]
role: 史学家
summary: 班固、班超之妹，续成《汉书》，在宫中教授后妃，著有《女诫》。
body: |-
  据《后汉书·列女传》，班昭字惠班，是班彪的女儿，班固、班超的妹妹。她嫁给同郡的曹世叔，丈夫早死。她的生卒年史书没有记载，本传只说她活了七十多岁，后人据邓太后临朝的年代推算，大致生于公元 45 至 49 年之间，死于 117 至 120 年之间。

  班固死时，《汉书》的八表和《天文志》还没有写完。和帝下诏让班昭到东观藏书阁续写。《汉书》刚问世时很多人读不通，马融曾跟随班昭学习诵读。和帝多次召她入宫，让皇后和贵人们以她为师，称她为“曹大家”。邓太后临朝后，她也参与议论政事。

  班超年老思归，班昭曾上书为兄长陈情。她著有《女诫》七篇，讲述女子在夫家的行为规范，在后世流传很广。
sources: []
recalled:
  - 《后汉书·列女传》（曹世叔妻）
