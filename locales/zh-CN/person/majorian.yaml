name: 马约里安
aliases: [马约良, 尤利乌斯·瓦勒里乌斯·马约里亚努斯, 马乔里安]
role: 西罗马皇帝
summary: 西罗马末期最有作为的皇帝，收复高卢和西班牙，征讨汪达尔人未成，被里西梅尔处死。
body: |-
  马约里安约生于公元 420 年，祖父是狄奥多西一世时的将领。他年轻时在埃提乌斯麾下，在高卢与法兰克人打过仗。456 年他与同僚里西梅尔联手推翻了皇帝阿维图斯，457 年被军队拥立。

  他留下的十来道敕令里，有免除积欠的税款、整顿各城官吏的，还有一道禁止拆毁罗马城的古建筑去取石料。458 年冬他率一支多由蛮族组成的军队翻过阿尔卑斯山，在阿尔勒城外打败西哥特人，迫使他们重新做同盟者，又从勃艮第人手里收回里昂；诗人西多尼乌斯为他写了颂词。460 年他进入西班牙，在今阿利坎特一带的海湾集结了三百条船，准备渡海收复北非，汪达尔王盖萨里克抢先下手，靠内应把船队毁掉、掳走。

  他只得议和回师。461 年 8 月 2 日，他遣散军队后走到意大利北部的德尔托纳，被里西梅尔扣押，五天后处死。此后西部再没有亲自领兵出征的皇帝。
sources: []
recalled:
