name: 邓禹
aliases: [邓仲华, 高密侯]
role: 大司徒、太傅
summary: 光武帝的同学与谋臣，东汉开国功臣，后世列为“云台二十八将”之首。
body: |-
  据《后汉书·邓禹传》，邓禹字仲华，南阳新野人，少年时在长安求学，与刘秀相识。更始年间刘秀受命安抚河北，邓禹北渡黄河追到邺县相见，劝他招揽人才、争取民心，自己成就帝业。此后刘秀遇事常与他商议，任用将领也多听他的举荐。

  建武元年（公元 25 年），邓禹率军西入河东、关中，击败更始帝的部将。刘秀即位后拜他为大司徒，封酂侯，本传说他当时二十四岁。赤眉军入长安后，邓禹与之相持，屡战不利，建武三年在回谿大败，交还大司徒印绶，后改任右将军。天下平定后定封高密侯。

  明帝即位，以邓禹为太傅。永平元年（58 年）去世，本传记其终年五十七。明帝后来在南宫云台图画建武功臣二十八人，邓禹居首。和帝的皇后邓绥是他的孙女。
sources: []
recalled:
  - 《后汉书·邓寇列传》
