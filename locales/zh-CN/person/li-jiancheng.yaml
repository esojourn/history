name: 李建成
aliases: [隐太子, 毗沙门]
role: 太子
summary: 唐高祖的长子，唐初的太子，与秦王李世民争位，在玄武门之变中被杀。
body: |-
  李建成是唐高祖李渊的长子，小字毗沙门。李渊在太原谋划起兵时，他留在河东，奉命暗中结交豪杰。大业十三年（公元 617 年）李渊起兵，他赶到太原，与李世民一同攻下西河郡，这是唐军的第一战。此后他统领左军，与统领右军的弟弟李世民一同进军关中，攻克长安。武德元年（618 年）李渊称帝，立他为太子。

  作为太子，他多留在长安协助处理政务，也领兵防御突厥。武德五年（622 年）河北的刘黑闼再次起兵，据《资治通鉴》，太子中允王珪、太子洗马魏征劝他主动请缨，以建立威望、结交山东豪杰。他率军东征，采用安抚的办法，次年平定刘黑闼。

  李世民战功日盛，秦王府人才济济，李建成与弟弟齐王李元吉联合，在朝廷和后宫中与李世民相争。据唐代史书，他曾设法调走秦王府的将领，又曾在宴饮时让李世民中毒吐血；但这些记载出自太宗朝主持修订的国史，有学者认为其中有为李世民开脱的成分。武德九年（626 年）六月初四，他与李元吉入朝，在玄武门被李世民伏兵袭击，李世民亲手射死了他，年三十八。他的五个儿子也都被杀。贞观年间追封他为息王，谥号隐，后世多称隐太子。
sources: []
recalled:
  - 《旧唐书·隐太子建成传》
  - 《资治通鉴》卷一百九十至一百九十一
