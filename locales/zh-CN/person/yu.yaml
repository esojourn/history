name: 禹
aliases: [大禹, 夏禹, 文命, 夏后氏]
role: 传说中的治水者，夏朝的开创者
summary: 传说中平治洪水的人，受舜禅让为天子，古书以他为夏朝的开创者。
body: |-
  禹是传说时代的人物，事迹主要见于《尚书》的《尧典》《禹贡》和《史记·夏本纪》。据《史记》，禹名文命，是鲧的儿子、颛顼的孙子（这一世系在年代上很难讲通，古人已有怀疑）。鲧治水失败被殛之后，舜举用禹继续治水。

  据《史记》，禹与伯益、后稷一道，“劳身焦思，居外十三年，过家门不敢入”，开九州之道，疏导九条大川，陂九泽，度九山。《尚书·禹贡》把天下分为九州，记述各州的山川、土壤、贡赋，后世因此以“禹迹”“九州”代称中国。《禹贡》的成书年代学界多认为在战国时期，并非禹时的记录。

  舜因禹治水有功，向上天推荐禹为继承人。据《史记》，舜死后，禹避让舜的儿子商均于阳城，诸侯都离开商均来朝见禹，禹于是即天子位，国号夏后，姓姒氏。《左传》哀公七年说“禹合诸侯于涂山，执玉帛者万国”。

  据《史记》，禹东巡至会稽而死，起初把天下授给伯益；三年丧毕，伯益让位于禹的儿子启，诸侯都去朝见启，启遂即位，此后王位由父传子。《竹书纪年》佚文则说“益干启位，启杀之”。二十世纪初的“疑古”学者曾怀疑禹是否实有其人，至今学界对夏朝及禹的历史性仍有不同看法。

  在时间长河里，禹排在“五帝传说时代”一段的末尾，只排先后、不标年份；夏朝从启开始按断代工程的年表（约公元前 2070 年起）画出。
sources: []
recalled:
  - 《史记·夏本纪》
  - 《尚书·禹贡》
  - 《左传》哀公七年
  - 《孟子·万章上》
  - 《竹书纪年》（佚文）
