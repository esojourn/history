name: 箕子
aliases: [胥余（一说）]
role: 商朝王族
summary: 商纣王的亲族，谏纣不听而装疯为奴；相传向周武王陈述了《洪范》。
body: |-
  箕子是商朝王族，《史记·宋微子世家》说他是“纣亲戚”，后世多说是纣的叔父，生卒年不详。据《史记》，纣开始使用象牙筷子时，箕子就叹息说，用了象箸必然要用玉杯，此后就会追求远方的珍奇，奢侈将不可收拾。纣淫乱，箕子进谏不听，有人劝他离开，他认为“为人臣谏不听而去，是彰君之恶”，于是披发装疯，做了奴隶，被纣囚禁。

  武王克商后释放箕子，并向他请教治国之道。《尚书·洪范》记载的就是箕子对武王陈述的“洪范九畴”，即五行、五事、八政等九类治国大法。《洪范》的成书年代学界有不同看法，有人认为是战国时的作品。

  《史记·宋微子世家》说武王“封箕子于朝鲜而不臣也”，《尚书大传》也有类似说法，后世由此有“箕子朝鲜”之说。这一说法是否属实，朝鲜半岛和中国学界都有争议。
sources: []
recalled:
  - 《史记·宋微子世家》
  - 《尚书·洪范》
  - 《论语·微子》
  - 《尚书大传》
