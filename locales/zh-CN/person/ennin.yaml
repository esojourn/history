name: 圆仁
aliases: [慈觉大师]
role: 天台宗僧人
summary: 日本天台宗僧人，838 年入唐求法九年，亲历会昌灭佛，著《入唐求法巡礼行记》。
body: |-
  圆仁是日本下野国人，延历十三年（公元 794 年）生，十五岁登比叡山，拜日本天台宗的创始人最澄为师。承和五年（唐开成三年，838 年），他作为请益僧随最后一次实际成行的遣唐使来到唐朝，在扬州登陆。他想去天台山求法，没有获准，按规定应随使团回国，但他设法留了下来，在登州文登县新罗人所建的赤山法华院住了将近一年。

  开成五年（840 年），他获得通行文书，北上巡礼五台山，随后到达长安，在大兴善寺、青龙寺等处学习密教和悉昙梵文。会昌年间唐武宗大规模废佛，外国僧人也被勒令还俗离境（另见“会昌灭佛”条），会昌五年（845 年）他被迫离开长安，辗转回到登州，大中元年（847 年）搭乘新罗商人的船回到日本，带回大量经卷和法器。

  回国后他在比叡山传授密教，仁寿四年（854 年）成为第三代天台座主。贞观六年（864 年）他去世，年七十一，后来被追赐“慈觉大师”的称号。他用汉文写的日记《入唐求法巡礼行记》四卷，逐日记载在唐九年多的见闻，详细记录了会昌灭佛的经过和唐朝的交通、民俗、宗教、新罗人社区等情况，是研究晚唐社会的重要史料。
sources: []
recalled:
  - 圆仁《入唐求法巡礼行记》
  - 《慈觉大师传》
