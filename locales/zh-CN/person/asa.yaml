name: 亚撒
aliases: []
role: 南国犹大王
summary: 犹大王，除去偶像，联合亚兰抵挡北国巴沙，在位四十一年。
body: |-
  犹大王亚比央的儿子，生年圣经没有记载。据《列王纪上》15:9–10，他在以色列王耶罗波安二十年登基，在耶路撒冷作王四十一年。他从国中除去娈童和列祖所造的偶像；祖母玛迦造了亚舍拉的像，他就贬了她太后的位，把像砍下，烧在汲沦溪边（15:11–13）。

  《历代志下》第 14 章记载，古实人谢拉率大军来攻，亚撒在玛利沙的洗法谷迎战得胜。第 15 章记载，俄德的儿子亚撒利雅劝勉他，他在位第十五年召集百姓在耶路撒冷立约寻求耶和华。后来以色列王巴沙修筑拉玛，封锁犹大的出入。亚撒把圣殿和王宫府库里的金银送给住在大马色的亚兰王便哈达，请他背弃与巴沙的盟约；便哈达攻打以色列北部的城邑，巴沙只得停工，亚撒便用拉玛的石头、木头修筑便雅悯的迦巴和米斯巴（《列王纪上》15:16–22）。据《历代志下》16:7–10，先见哈拿尼责备他倚靠亚兰王，他把哈拿尼囚在监里。

  亚撒年老时脚上有病（《列王纪上》15:23）；《历代志下》16:12 说那是他作王第三十九年，病得很重。他死后葬在大卫城，儿子约沙法接续作王。《历代志下》16:1 把巴沙筑拉玛一事系于亚撒三十六年，而按《列王纪上》的记载巴沙那时已经去世，这处年数历来有不同的解释。
sources: []
recalled:
  - 《列王纪上》15:9–24
  - 《历代志下》第 14—16 章
