name: 刘昫
aliases: [刘耀远]
role: 后晋宰相
summary: 后唐、后晋两朝宰相，后晋时监修国史，945 年以他的名义进呈《旧唐书》。
body: |-
  刘昫是涿州归义人，字耀远，早年以文学知名，后唐时任翰林学士，后来出任宰相，兼管财政。他为人谨慎，在任时曾清理积欠的赋税，免除了不少百姓无力缴纳的旧账。

  后晋时他再度任宰相，兼任监修国史。后晋天福六年（公元 941 年），朝廷下令修撰唐史，最初由宰相赵莹监修，张昭远、贾纬等人执笔，到开运二年（945 年）书成时，监修的宰相是刘昫，所以以他的名义进呈，这就是后来所说的《旧唐书》（另见“《旧唐书》修成”条）。实际主持修撰的主要是赵莹等人。开运三年（946 年），刘昫在开封去世。
sources: []
recalled:
  - 《旧五代史·晋书·刘昫传》
  - 《新五代史·杂传·刘昫》
