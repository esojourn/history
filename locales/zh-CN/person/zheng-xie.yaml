name: 郑燮
aliases: [郑板桥, 克柔]
role: 书画家、文学家
summary: “扬州八怪”的代表人物，曾任潍县知县，以画竹兰石著称。
body: |-
  郑燮号板桥，江苏兴化人，早年家贫，在扬州卖画为生。他在康熙年间考中秀才，雍正十年（1732 年）中举，乾隆元年（1736 年）考中进士，此后在北京等候任用多年，乾隆七年（1742 年）起先后任山东范县、潍县知县。

  据记载，乾隆十一年（1746 年）前后山东发生灾荒，郑燮在潍县开仓赈济，又兴办工程，让饥民以工代赈，还劝富户捐粮。后来他因为替灾民请求赈济而得罪了上司，乾隆十八年（1753 年）辞官，回到扬州以卖画为生。据说他自定润格，写道“大幅六两，中幅四两，小幅二两”，又说“送现银则心中喜乐，书画皆佳”。

  郑燮擅长画兰、竹、石，所画的竹子清劲挺拔，常在画上题诗，诗、书、画融为一体。他的书法把隶书、楷书、行书等融合在一起，自称“六分半书”，被称为“乱石铺街”。他的诗文平易质朴，关心民间疾苦，家书也很有名。“难得糊涂”是他的一幅题字。他与金农、黄慎、李鱓等人被后世合称为“扬州八怪”。乾隆三十年十二月（公历 1766 年 1 月）他在兴化去世。
sources: []
recalled:
  - 郑燮《郑板桥集》
  - 《清史稿·文苑传》
