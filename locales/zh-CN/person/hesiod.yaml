name: 赫西俄德
aliases: []
role: 诗人
summary: 彼奥提亚的农民诗人，作《神谱》《工作与时日》。
body: |-
  赫西俄德是第一位在作品里谈到自己的希腊诗人，关于他的生平，可靠的材料都出自他自己的诗。据《工作与时日》，他的父亲原住小亚细亚的库麦，因贫困渡海迁到彼奥提亚赫利孔山下的阿斯克拉，他说那是个“冬天难熬、夏天难受、什么时候都不好”的村子。父亲死后，他与兄弟佩耳塞斯为分家产起了争执，他指责佩耳塞斯贿赂了断案的“王公”。

  《神谱》开篇说，他在赫利孔山下放羊时，缪斯女神给了他一根月桂杖，教他歌唱。这部诗一千余行，从混沌讲起，叙述天地和诸神的世系，以及宙斯怎样取得统治，是希腊神话最早的系统记述。《工作与时日》八百余行，是写给佩耳塞斯的劝诫，讲正义与劳作，其中有潘多拉的故事、人类从黄金时代到黑铁时代的五个时代，后半部是一年里的农事历和航海的时令。

  他在诗中还提到，自己一生只坐过一次船，是到优卑亚岛的卡尔基斯参加安菲达马斯的葬礼竞技，以一首颂歌赢得一只三足鼎，献给了赫利孔山的缪斯。后世流传的《荷马与赫西俄德之争》说两人在这次竞技中同场比试，那是后人的编排。

  他的年代一般定在公元前 700 年前后，没有确切依据。古代归在他名下的还有《名媛录》《赫拉克勒斯之盾》等，今天多认为不是他本人所作。关于他的死，古代有几种彼此不同的传说，都不可靠。
sources: []
recalled:
