name: 李锡尼·斯托洛
aliases: [盖乌斯·李锡尼·斯托洛, 李锡尼乌斯·斯托洛]
role: 罗马保民官、执政官
summary: 罗马平民领袖，与塞克斯提乌斯提出法案，使平民得以出任执政官。
body: |-
  盖乌斯·李锡尼·斯托洛，罗马平民出身的政治家，生卒年不详。据李维，他娶了贵族马尔库斯·费边·安布斯图斯的小女儿；传说她因姐姐嫁给贵族、享有平民之妻没有的排场而不平，促成丈夫投身政治。

  公元前 376 年他与卢基乌斯·塞克斯提乌斯同任保民官，提出三项法案：已付的利息从本金中扣除，余额分三年还清；任何人占有公有地不得超过五百尤格拉；恢复执政官的选举，两名执政官中须有一名平民。贵族利用其他保民官的否决权加以阻挠，二人则连年当选，据李维连任十年，并一度阻止高级长官的选举达五年之久（这个数字学者多有怀疑）。前 367 年法案终于通过，塞克斯提乌斯在次年成为第一位平民执政官；同时新设由贵族担任的大法官一职。

  李锡尼本人在前 364 年或前 361 年任执政官（名录上有两位同名者，不易分辨）。据李维，前 357 年他因与儿子合计占有一千尤格拉公有地、用解除父权的办法规避法律，被依自己制定的法律判处罚金。占地限额的规定是否真属于前 367 年，学者有争议，有人认为是格拉古时代的条款被上推到了这里。
sources: []
recalled:
  - 李维《建城以来史》卷六第 34—42 章、卷七第 16 章
  - 普鲁塔克《卡米卢斯传》
