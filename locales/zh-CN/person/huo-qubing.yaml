name: 霍去病
aliases: [冠军侯, 骠骑将军, 景桓侯]
role: 骠骑将军
summary: 汉武帝时的骠骑将军，两出河西，又在漠北大败匈奴左贤王，封狼居胥山而还。
body: |-
  霍去病是卫青的外甥，母亲是卫青的姐姐卫少儿，父亲霍仲孺是平阳县的小吏。姨母卫子夫立为皇后以后，他以外戚的身份在宫中任侍中。据《史记·卫将军骠骑列传》，元朔六年（公元前 123 年）他十八岁，以票姚校尉的身份跟随卫青出定襄，率八百轻骑离开大军数百里袭击匈奴，斩获甚多，被封为冠军侯。

  元狩二年（前 121 年）春，他任骠骑将军，率一万骑兵出陇西，越过焉支山千余里。同年夏天，他再出北地，深入到祁连山。当年秋天，匈奴浑邪王因屡败而惧怕被单于处死，杀休屠王，率部降汉；霍去病受命前往迎接，渡过黄河后驰入匈奴营中，斩杀企图逃走的人，把降众带回。汉朝由此得到河西走廊，此后陆续在那里设郡。

  元狩四年（前 119 年）漠北之战，他率五万骑兵出代郡，行军两千余里，与匈奴左贤王部交战，大获全胜，在狼居胥山祭天，在姑衍山祭地，到达翰海而还。战后他与卫青同任大司马，俸禄与大将军相等。

  本传记武帝曾想教他孙子、吴起的兵法，他回答说只看临阵的方略如何，不必学古兵法；武帝为他修建宅第，他说“匈奴未灭，无以家为也”。本传也说他年少显贵，不大体恤士卒。元狩六年（前 117 年）他病逝，年仅二十余岁。武帝调发属国的铁甲军列阵送葬，为他修的坟墓形状仿照祁连山，陪葬茂陵。
sources: []
recalled:
  - 《史记·卫将军骠骑列传》
  - 《汉书·卫青霍去病传》
