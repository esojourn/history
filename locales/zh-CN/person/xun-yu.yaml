name: 荀彧
aliases: [荀文若, 荀令君]
role: 尚书令
summary: 曹操的首席谋臣，主持许都朝政十余年，因不赞成曹操进爵魏公而失意，忧郁而死。
body: |-
  据《三国志·魏书·荀彧传》，荀彧字文若，颍川颍阴人，出身名门，年轻时被名士何颙称为“王佐才”。董卓掌权时他弃官回乡，带着宗族迁往冀州。袁绍待他以上宾之礼，但他认为袁绍终不能成事，初平二年（公元 191 年）改投当时还在东郡的曹操。本传记曹操高兴地说“吾之子房也”，把他比作张良。

  兴平元年（194 年）曹操东征徐州，留守的张邈、陈宫叛迎吕布，兖州各郡县纷纷响应。荀彧与程昱守住鄄城等三座城，曹操才有回师的立足之地。建安元年（196 年）献帝东归，荀彧力主迎接天子，曹操采纳，把献帝迁到许县。此后荀彧任侍中、守尚书令，曹操出征在外，朝中政务由他主持。荀攸、钟繇、郭嘉等人都出于他的举荐。

  建安五年官渡相持，曹操军粮将尽，写信与荀彧商量退守许都。荀彧回信说，此时正是决胜的关头，先退者势必受制于人，劝他坚持。不久曹操奇袭乌巢获胜。

  建安十七年（212 年），董昭等人提议晋封曹操为魏公、加九锡，私下征求荀彧的意见。荀彧认为曹操兴兵本为匡扶朝廷，不应如此，曹操由此心中不快。同年曹操南征孙权，上表请荀彧到谯县劳军，随后把他留在军中。荀彧走到寿春，“以忧薨”，终年五十。裴松之注引《魏氏春秋》说，曹操送给他一个空的食盒，他于是服毒自尽；这只是一种说法。次年曹操即进爵魏公。
sources: []
recalled:
  - 《三国志·魏书·荀彧荀攸贾诩传》及裴松之注
  - 《后汉书·郑孔荀列传》
