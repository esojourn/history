name: 提格兰二世
aliases: [提格兰大帝, 提格拉涅斯二世]
role: 亚美尼亚国王
summary: 亚美尼亚国王，一度据有从里海到地中海的土地，败于卢库卢斯后向庞培称臣。
body: |-
  亚美尼亚国王，约生于公元前 140 年。他年轻时作为人质住在帕提亚宫廷多年，前 95 年前后割让“七十河谷”换得回国即位。不久他吞并邻近的索菲涅，娶本都王米特里达梯六世的女儿克娄巴特拉，两国结盟；前 90 年代他出兵卡帕多基亚，把罗马扶立的国王赶走。

  帕提亚国王米特里达梯二世死后，帕提亚陷入内乱。他乘机收回割让的土地，夺取阿特罗帕特尼、阿迪亚贝尼、戈尔迪耶尼和美索不达米亚北部，使这些地方的国王称臣，并采用“万王之王”的称号。前 83 年叙利亚各城厌倦塞琉古王室的内斗，据查士丁，是他们主动请他去统治的；此后十四年叙利亚和奇里乞亚平原由他的总督管辖。他在南部新建都城提格兰诺塞塔，从卡帕多基亚、奇里乞亚等地强行迁来大批居民，其中许多是希腊人。

  前 71 年米特里达梯败于罗马，逃到他那里。罗马使者要求交人，他拒绝了。前 69 年卢库卢斯渡过幼发拉底河，在提格兰诺塞塔城外以少胜多。据普鲁塔克，提格兰看到罗马军队时说：做使团太多，做军队太少。城破后被迁来的居民各自回乡。次年卢库卢斯北上进攻旧都阿尔塔克萨塔，因士兵拒绝前进而退兵。

  前 66 年他的儿子小提格兰叛逃到帕提亚，又引庞培入境。年过七十的提格兰亲自到庞培营中，摘下王冠。庞培让他保留亚美尼亚本土，放弃叙利亚等全部征服的土地，缴纳六千塔兰特。此后他以罗马“朋友和同盟者”的身份在位，约前 55 年去世，儿子阿尔塔瓦斯德斯二世继位。
sources: []
recalled:
