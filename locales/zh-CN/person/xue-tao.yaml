name: 薛涛
aliases: [薛洪度, 女校书]
role: 诗人
summary: 唐代女诗人，长居成都，与元稹、白居易等人唱和，自制深红小笺，后世称“薛涛笺”。
body: |-
  薛涛字洪度，长安人，生年一般作大历三年（公元 768 年）前后。她幼年随父亲到蜀地，父亲死后家境贫困，因为通晓音律、能诗善文而入乐籍。贞元年间韦皋任西川节度使，常召她在宴席上赋诗。据后世的记载，韦皋曾想奏请朝廷授予她校书郎的官职，虽然没有实现，人们从此称她为“女校书”，此事的真实程度难以确定。

  此后历任西川节度使大多对她以礼相待。她与元稹、白居易、刘禹锡、王建、杜牧等诗人都有诗歌往来，留下了不少唱和之作。她晚年住在成都浣花溪一带，自己设计制作了一种深红色的小笺纸，用来写诗，后世称为“薛涛笺”；后来又迁居碧鸡坊，建吟诗楼。大和六年（832 年）她在成都去世。她的诗原有《锦江集》五卷，后来散佚，现存的诗不足一百首，以《春望词》《送友人》等最为有名。
sources: []
recalled:
  - 《全唐诗》卷八百零三
  - 元稹《寄赠薛涛》
  - 何光远《鉴诫录》
