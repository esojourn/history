name: 虞姬
aliases: [虞美人]
role: 项羽姬妾
summary: 项羽身边的美人，名虞，仅见于《史记》垓下一段；自刎之说出于后世。
body: |-
  虞姬的事迹在正史中只见于《史记·项羽本纪》垓下被围一段：项羽夜闻四面楚歌，起身在帐中饮酒，“有美人名虞，常幸从”。项羽作歌，其中有“虞兮虞兮奈若何”一句，唱了几遍，“美人和之”。史料所载仅此。她的姓名（“虞”是名还是姓）、籍贯、生卒年都没有记载，《史记》《汉书》也没有写她的结局。

  唐代张守节《史记正义》引《楚汉春秋》，录有一首相传为她所和的歌。她在垓下自刎的说法不见于《史记》《汉书》，出自后世的传说和戏曲。
sources:
  - 《史记·项羽本纪》 https://zh.wikisource.org/wiki/史記/卷007
  - 张守节《史记正义》（引《楚汉春秋》） https://zh.wikisource.org/wiki/史記三家註/卷007
