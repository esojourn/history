name: 徐温
aliases: [徐敦美, 南唐义祖]
role: 吴国权臣
summary: 杨行密的部将，908 年起掌握吴国大权近二十年，养子徐知诰后来建立南唐。
body: |-
  徐温是海州朐山人，字敦美，据史书，他年轻时贩卖私盐，后来追随杨行密起兵，是杨行密的亲信将领之一。

  天祐五年（公元 908 年），他与张颢合谋杀死杨行密的继承人杨渥，随后又除掉张颢，拥立杨渥的弟弟杨隆演，从此掌握吴国大权。他后来出镇昇州（今南京），遥控朝政，留长子徐知训在扬州辅政。徐知训骄横无礼，918 年被大将朱瑾杀死，徐温改派养子徐知诰入扬州辅政。天祐十六年（919 年），他拥杨隆演即吴国王位，建立吴国的官制和年号。

  徐温掌权期间，吴国与吴越讲和，境内比较安定。据史书，他晚年想让亲生儿子徐知询取代徐知诰执政，还没来得及实施，天成二年（927 年）便在金陵去世。徐知诰继续掌权，十年后受吴禅让，建立南唐，追尊徐温为义祖。
sources: []
recalled:
  - 《新五代史·吴世家》
  - 《资治通鉴》卷二百六十六至二百七十六
  - 马令《南唐书》
