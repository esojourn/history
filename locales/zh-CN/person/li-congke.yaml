name: 李从珂
aliases: [王二十三, 后唐末帝, 后唐废帝]
role: 后唐皇帝
summary: 李嗣源的养子，934 年起兵夺位，石敬瑭引契丹兵南下时自焚，后唐亡。
body: |-
  李从珂本姓王，镇州平山人。李嗣源早年作战时掳得他的母亲魏氏，把他收为养子。他长大后勇猛善战，跟随李嗣源和李存勖作战，屡立战功。

  长兴四年（公元 933 年）明宗死，李从厚即位，即后唐闵帝。闵帝想削弱各地节度使，调任当时镇守凤翔的李从珂。次年他在凤翔起兵，朝廷派来讨伐的军队纷纷倒戈，他进入洛阳，废闵帝而自立，史称后唐末帝。

  即位后，他与河东节度使、明宗的女婿石敬瑭互相猜忌。清泰三年（936 年），他调石敬瑭离开太原，石敬瑭拒命，并向契丹求援，许以割让燕云十六州（另见“后晋灭后唐”条）。契丹皇帝耶律德光亲率大军南下，在太原城外击败后唐军。当年闰十一月（已是公历 937 年 1 月），石敬瑭与契丹军逼近洛阳，李从珂带着家人登上玄武楼自焚而死，后唐灭亡。自焚之前，他派人杀了投奔后唐的契丹东丹王耶律倍。
sources: []
recalled:
  - 《旧五代史·唐书·末帝纪》
  - 《新五代史·唐本纪·废帝》
