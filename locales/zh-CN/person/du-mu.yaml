name: 杜牧
aliases: [杜牧之, 樊川居士, 小杜]
role: 诗人、中书舍人
summary: 唐代诗人，宰相杜佑之孙，擅长七言绝句和咏史诗，与李商隐并称“小李杜”。
body: |-
  杜牧字牧之，京兆万年人，贞元十九年（公元 803 年）生，祖父是宰相、《通典》的作者杜佑。他二十三岁时写了《阿房宫赋》，借秦朝的灭亡劝诫当时的君主不要大兴土木。大和二年（828 年）他考中进士，随后到江西、宣歙观察使沈传师的幕府任职。

  大和七年（833 年）起，他在淮南节度使牛僧孺的幕府中任掌书记，住在扬州，后来写下“十年一觉扬州梦，赢得青楼薄幸名”等诗句。此后他回到朝中任监察御史等职，又历任黄州、池州、睦州、湖州刺史，最后官至中书舍人。他的卒年一般作大中六年（852 年），另有 853 年之说。去世前他烧掉了大部分文稿，他的外甥裴延翰把留下的诗文编成《樊川文集》。

  杜牧关心时政和军事，注释过《孙子》，写过《罪言》《战论》等文章，主张削平河北藩镇，也曾向李德裕献策讨伐泽潞和回鹘。他的诗以七言绝句最为人称道，风格俊爽，咏史诗常翻出新意，如《赤壁》《题乌江亭》《泊秦淮》《过华清宫》，写景诗如《江南春》《山行》等也流传很广。那首以“清明时节雨纷纷”开头的《清明》，最早见于宋代以后的选本，是否是他所作，学界有疑问。

  后人把他与李商隐并称“小李杜”，以区别于李白、杜甫。
sources: []
recalled:
  - 《旧唐书·杜牧传》
  - 《新唐书·杜牧传》
  - 裴延翰《樊川文集序》
  - 杜牧《自撰墓志铭》
