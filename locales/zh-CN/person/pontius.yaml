name: 盖乌斯·庞提乌斯
aliases: [庞提乌斯, 萨莫奈人庞提乌斯]
role: 萨莫奈统帅
summary: 萨莫奈人的统帅，在考迪乌姆峡谷围困罗马全军，迫其从轭下走过。
body: |-
  萨莫奈人的将领，赫伦尼乌斯·庞提乌斯之子，生年不详。他的事迹几乎全出自李维，细节难以核实。

  第二次萨莫奈战争期间，公元前 321 年他任萨莫奈人的统帅。据李维，他派士兵扮作牧人散布假消息，说萨莫奈人正在围攻阿普利亚的卢凯里亚；两名罗马执政官率军抄近路赶去，进入考迪乌姆附近两头狭窄的山谷，发现出口已被树木巨石堵死，回头时入口也被封住。罗马全军被困，粮尽求和。

  李维记载了一个故事：庞提乌斯派人问年迈的父亲如何处置，父亲先说全部放走，再问又说全部杀掉；他解释说，放走可以换来罗马人的友谊，杀光可以使罗马多年无力再战，除此没有第三条路。庞提乌斯两者都没有采纳：他同执政官订约，罗马撤出萨莫奈、放弃殖民地，留下六百名骑士为人质，全军解除武装，只穿一件单衣从长矛搭成的“轭”下走过。罗马人视为奇耻大辱。李维说元老院随后否认和约，把订约的执政官交给萨莫奈人，庞提乌斯拒绝接收；许多学者认为罗马实际上遵守了和约若干年。

  据李维的摘要，前 292 年他在战斗中被俘，在费边·古尔格斯的凯旋式上游街后被斩首。
sources: []
recalled:
  - 李维《建城以来史》卷九第 1—15 章、卷十一摘要
