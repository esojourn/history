name: 萨伏那罗拉
aliases:
  - 萨沃那柔拉
  - 萨佛纳罗拉
  - 吉罗拉莫·萨伏那罗拉
role: 道明会士、讲道者
summary: 佛罗伦萨圣马可修道院院长，痛斥教廷与城中的败坏，1498 年被处死。
body: |-
  萨伏那罗拉 1452 年 9 月生于意大利的费拉拉，祖父是公爵的御医。1475 年他离家到博洛尼亚加入道明会。1482 年他被派到佛罗伦萨的圣马可修道院，几年后调往别处，1490 年又被请回，次年任院长。

  当时佛罗伦萨在美第奇家族治下，是文艺复兴的中心。他讲解《启示录》和旧约的先知书，说教会将受刑罚而后更新，责备贵族和教士的奢侈放纵，听众挤满了主教座堂。1494 年法王查理八世率军进入意大利，许多人认为这应验了他的话。美第奇家族被逐出城，他出面与法王交涉，随后在讲坛上推动佛罗伦萨建立有三千多人参加的大议会，说基督才是这城的王。1497 年狂欢节时，他的追随者把搜集来的纸牌、首饰、镜子、不雅的书画堆在广场上烧掉，称为“焚烧虚荣”。

  《历史的轨迹》第二十章说，他大胆地在讲道中指责当时的败坏，教皇亚历山大六世也被他斥责；他不是教会的改革者，没有攻击天主教的制度，只是指出道德的低落。教皇先召他去罗马，又禁止他讲道，他都没有照办。1497 年 5 月他被革除教籍，次年初重新登台，并写信吁请各国君主召开大公会议废黜教皇。教皇威胁要对佛罗伦萨全城下禁令，城里的人也渐渐厌倦了他。

  1498 年 4 月，一位方济会士提出以穿火来验证谁是真先知，到了那天双方争执不下，没有举行，等了一天的群众转而怪罪他。次日暴民攻进圣马可修道院，他被捕，受了酷刑。5 月 23 日他和两位同会修士在市政广场被绞死，尸体当场焚烧，骨灰投入阿尔诺河。他在狱中所写的《诗篇》默想，后来由路德在德意志刊印。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 萨伏那罗拉《论先知的真理》《〈诗篇〉第 51 篇默想》及讲章
  - 兰杜奇《佛罗伦萨日记》
  - 圭恰迪尼《佛罗伦萨史》
