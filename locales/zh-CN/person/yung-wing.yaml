name: 容闳
aliases: [纯甫]
role: 第一位毕业于美国大学的中国人，留美幼童计划的倡导者
summary: 耶鲁大学毕业生，为曾国藩购买机器，倡导并主持留美幼童计划。
body: |-
  容闳是广东香山（今珠海）南屏村人，幼年进入澳门的教会学校读书。道光二十七年（1847 年）他随美国传教士布朗到美国留学，后来进入耶鲁大学，咸丰四年（1854 年）毕业，是第一位毕业于美国大学的中国人。

  回国后，容闳做过翻译、商人，一度到天京考察太平天国，向洪仁玕提出改革建议，没有被采纳。同治二年（1863 年）他进入曾国藩的幕府，受命到美国购买机器，这些机器后来成为江南制造总局的重要设备。他向曾国藩等人提出派遣幼童出洋留学的建议。

  同治十一年（1872 年），在曾国藩、李鸿章的支持下，清朝开始派遣幼童赴美留学，容闳任留学监督，四年间共派出一百二十名幼童（另见“留美幼童”条）。这些幼童在美国学习，有的进入了耶鲁、哥伦比亚等大学。后来清朝的保守官员认为幼童“沾染洋习”，光绪七年（1881 年）把他们全部撤回。

  此后容闳长期在美国居住。戊戌变法期间他回国支持维新，变法失败后避居上海租界，后来又因与革命党人有联系而被清廷通缉，回到美国。他用英文写了自传《我在中国和美国的生活》（中译本名《西学东渐记》）。1912 年他在美国哈特福德去世。
sources: []
recalled:
