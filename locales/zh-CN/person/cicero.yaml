name: 西塞罗
aliases: [马尔库斯·图利乌斯·西塞罗, 图利]
role: 罗马演说家、执政官、哲学作家
summary: 罗马演说家、政治家和哲学作家，任执政官时镇压喀提林阴谋，后被安东尼所杀。
body: |-
  马尔库斯·图利乌斯·西塞罗，公元前 106 年 1 月 3 日生于阿尔皮努姆，与马略同乡，家族属骑士等级，在罗马没有人任过高官。他在罗马学习法律和修辞。前 80 年他为被控弑父的罗斯基乌斯辩护，矛头指向苏拉的宠信，一举成名；随后去雅典和罗得岛游学两年。

  前 75 年他在西西里任财务官。前 70 年应西西里人之请控告贪婪的前总督维勒斯，西塞罗只发表了第一篇控词，维勒斯即自行流亡。前 63 年他以“新人”的身份任执政官，揭发并镇压喀提林的阴谋，按元老院的决议未经审判处死五名同党，得到“祖国之父”的称号。

  前 58 年保民官克洛狄乌斯立法，凡未经审判处死罗马公民者一律放逐，他被迫流亡希腊，住宅被拆毁；次年在庞培等人支持下被召回。此后三头当政，他难有作为，转而写作《论演说家》《论共和国》《论法律》。前 51 年他出任奇里乞亚总督。内战爆发后他犹豫数月，最终去了庞培的阵营；法萨卢斯战后回到意大利，得到恺撒宽待。

  恺撒独裁期间他退出政坛，又遭逢爱女图利娅之死，在前 45 年至前 44 年间集中写成一批哲学对话：《学园派》《论至善与至恶》《图斯库卢姆论辩集》《论神性》《论老年》《论友谊》《论义务》等。他把希腊各派哲学介绍给罗马读者，许多哲学术语的拉丁文译名出自他手。

  恺撒遇刺后他重回政坛，从前 44 年 9 月起发表十四篇抨击安东尼的演说，仿德摩斯梯尼之例称为《反腓力辞》，并扶持年轻的屋大维与安东尼对抗。前 43 年秋后三头结盟，安东尼把他列入公敌名单。12 月 7 日他在福尔米埃的别墅附近被追兵赶上杀死；据普鲁塔克，他的头和手被钉在罗马广场的讲坛上。

  他留下五十多篇演说、多部修辞学和哲学著作，以及九百多封书信，使共和国最后二十年成为古代史上记载最详细的时期。他的文体长期是拉丁散文的范本。
sources: []
recalled:
  - 普鲁塔克《西塞罗传》
  - 西塞罗《致阿提库斯书》《致亲友书》《反喀提林》《反腓力辞》《布鲁图斯》
  - 阿庇安《内战史》卷四第 19—20 章
