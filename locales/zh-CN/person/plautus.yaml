name: 普劳图斯
aliases: [提图斯·马克基乌斯·普劳图斯, 普劳图]
role: 罗马喜剧作家
summary: 罗马喜剧作家，据希腊新喜剧改编拉丁语喜剧，有二十部大体完整传世。
body: |-
  提图斯·马克基乌斯·普劳图斯，罗马喜剧作家，约公元前 254 年生于翁布里亚的萨尔西纳。生平可靠的记载很少。格利乌斯转述瓦罗的说法：他早年在剧场做工挣了钱，外出经商全部赔光，回到罗马后在磨坊里推磨糊口，并在这期间写了三部剧本。这个故事是否可信，学者有怀疑。西塞罗说他死于前 184 年。

  他的剧本属于“披衫剧”，即根据希腊新喜剧改编、人物穿希腊服装、故事发生在希腊城市的拉丁语喜剧。原作出自米南德、菲勒蒙、狄菲洛斯等人，大多已经失传。他改编时相当自由：增加可以演唱的段落，加入罗马的风俗、法律用语和双关笑话，让机灵的奴隶成为推动剧情的主角。常见的人物有吝啬的父亲、恋爱的儿子、吹牛的军人、食客和妓院老板。

  古代署他名字的剧本据说有一百三十部。瓦罗考订出公认为真作的二十一部，流传至今的正是这一批，其中二十部大体完整，一部只剩残片。有上演年代可考的只有两部：《斯提库斯》在前 200 年，《普修多卢斯》在前 191 年。较著名的有《一坛金子》《吹牛军人》《孪生兄弟》《安菲特律翁》《俘虏》《绳子》等。

  他是作品完整传世的最早的拉丁作家，剧中的口语是研究早期拉丁语的主要材料。他的喜剧在文艺复兴时期重新上演，影响很大：莎士比亚的《错误的喜剧》取材于《孪生兄弟》，莫里哀的《吝啬鬼》取材于《一坛金子》。
sources: []
recalled:
  - 格利乌斯《阿提卡之夜》卷三第 3 章
  - 西塞罗《布鲁图斯》第 60 节
  - 普劳图斯传世喜剧二十一种
