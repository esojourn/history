name: 仆固怀恩
aliases: [大宁郡王]
role: 朔方节度使、河北副元帅
summary: 铁勒仆骨部出身的朔方名将，平定安史之乱立有大功，后受猜疑而反叛。
body: |-
  仆固怀恩是铁勒仆骨部人，祖上在唐初归附，世袭金微都督。他在朔方军中任职，安史之乱中随郭子仪、李光弼作战，屡立战功。为了联络回纥，他把女儿嫁给回纥王子，后来这位王子即位为牟羽可汗。宝应元年（公元 762 年），他引回纥兵与唐军一起收复洛阳，此后任河北副元帅、朔方节度使，追击史朝义直到范阳。据他后来的上表，他家族中为国战死的有四十六人。

  战后他上奏让田承嗣、李怀仙、张忠志等安史降将留任原职，被一些人指为有意养寇自重（另见“河朔三镇”条）。广德元年（763 年），他护送回纥可汗北归，路过太原，河东节度使辛云京闭城不出，宦官骆奉仙也向朝廷告他谋反。他上表申辩，又拒绝入朝，次年起兵反叛（另见“仆固怀恩之叛”条）。永泰元年（765 年）他引回纥、吐蕃等军队数十万人入侵关中，九月在进军途中病死于灵州鸣沙。
