name: "施本尔"
aliases: ["菲利普·雅各·施本尔", "斯彭内尔"]
role: "敬虔主义之父"
summary: "路德派牧师，在法兰克福创“敬虔小会”，提倡活的信仰，被称为敬虔主义之父。"
body: |-
  施本尔 1635 年生于阿尔萨斯的拉波尔茨魏勒（今法国里博维莱），属路德派。《历史的轨迹》第三十四章说他生在“德国西部”，那里当时属神圣罗马帝国，今属法国。他在斯特拉斯堡读书，到过巴塞尔、日内瓦等地。该书说他在日内瓦住过一段时间，与改革宗牧师接触很多，但始终是忠实的路德派。

  该书说，他那时路德派教会充满“死的道理”，只讲保守纯正教义，信徒只要懂信仰问答、参加聚会和圣礼，不谈灵命长进，有的牧师生活与职分不相称。他年轻时读了阿恩特的《真基督教》，又读清教徒著作，尤其受巴克斯特的影响。

  1666 年他任法兰克福的首席牧师，改进信仰问答的教导，又在家中聚集一小批人读经、祷告、讨论上主日的讲道，以培养更深的灵命，这种聚会后来称“敬虔小会”，路德派中的这个新运动由此称为“敬虔主义”。1675 年他发表《敬虔的愿望》，提出改革的建议。该书说，他主张在教会里成立许多“教会中的小教会”；认为基督教不只是头脑的知识，更是活的生命；传道人应有个人的属灵经历，讲道要造就人，不要争辩；真基督徒的生活从重生开始。他也和清教徒一样反对看戏、跳舞、打牌。

  他的主张招来强烈反对。1686 年他任德累斯顿宫廷牧师，1691 年转往柏林，在那里工作愉快，直到 1705 年去世。他请弗兰克到新办的哈雷大学任教，又做了亲岑多夫的教父。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十四章“敬虔主义 莫拉维弟兄会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter38.html"
recalled:
  - "施本尔《敬虔的愿望》（1675 年）"
