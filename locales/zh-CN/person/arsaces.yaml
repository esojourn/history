name: 阿萨息斯一世
aliases: [ 阿尔沙克 ]
role: 安息开国君主
summary: 帕尔尼人首领，约公元前 247 年称王，后夺取帕提亚，是安息王朝的创立者。
body: |-
  阿萨息斯的出身，古代作者说法不一。斯特拉波说他是斯基泰人，率领达赫人中的一支帕尔尼游牧部落；查士丁说他出身不明，惯于劫掠；阿里安的《帕提亚志》（今存摘要）则说他与兄弟提里达特斯一同起事。生年没有记载。

  据今人的通行重建，约公元前 250 年他率帕尔尼人进入阿特拉克河上游的阿斯陶埃内，约前 247 年在阿萨克称王，安息纪元即以这一年为起点。其后塞琉古的帕提亚总督安德拉戈拉斯脱离中央自立；约前 238 年阿萨息斯攻入帕提亚，杀死安德拉戈拉斯，不久又占据希尔卡尼亚。称王与占据帕提亚是先后两件事，各自的年份都有争议。塞琉古二世后来东征，斯特拉波说阿萨息斯一度退避到阿帕西亚凯人那里；塞琉古二世因西部有事撤军，他得以恢复并巩固领地。查士丁说帕提亚人把战胜塞琉古二世的日子当作自由的开端来纪念。

  他的卒年有约前 217 年和约前 211 年两说，这里取前一说，继位的是他的儿子阿萨息斯二世。旧说认为他在位仅两年即由兄弟提里达特斯继位，源于阿里安一系的记载，今人多不采信。此后安息诸王都以“阿萨息斯”为王号。
