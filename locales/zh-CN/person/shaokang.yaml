name: 少康
aliases: [夏后少康]
role: 夏后（夏朝君主）
summary: 夏朝君主，相传在夏一度失国后复兴夏朝，古书称“少康中兴”。
body: |-
  少康是夏朝的君主，年代不详。他的事迹主要见于《左传》：哀公元年伍员劝谏吴王夫差时追述了这段往事，襄公四年魏绛也说到相关的事。据这些记载，太康之后，有穷氏的后羿趁夏衰弱夺取了政权，后羿又被亲信寒浞所杀；寒浞的儿子浇杀死了夏后相。相的妻子后缗当时怀着身孕，逃回娘家有仍氏，生下少康。

  少康长大后做了有仍氏的牧正，为躲避浇的追杀又逃到有虞氏，做了庖正。有虞氏的首领把两个女儿嫁给他，封给他纶邑，“有田一成，有众一旅”。少康广施恩德，收聚夏的旧部；夏的旧臣靡收拾两国的余众灭了寒浞，少康灭浇，儿子杼灭浇的弟弟豷，夏朝得以恢复，后世称为“少康中兴”。

  《史记·夏本纪》没有记载后羿、寒浞代夏的事，只说帝相死后，子少康立。这段历史主要依靠《左传》所记春秋人的追述。
sources: []
recalled:
  - 《左传》哀公元年
  - 《左传》襄公四年
  - 《史记·夏本纪》
