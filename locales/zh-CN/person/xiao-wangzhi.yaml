name: 萧望之
aliases: [萧长倩]
role: 前将军、太傅
summary: 西汉儒臣，宣帝时任御史大夫，受遗诏辅佐元帝，与宦官石显等相争，被迫自杀。
body: |-
  据《汉书·萧望之传》，萧望之字长倩，东海兰陵人，后来迁居杜陵。他家世代务农，自己好学，研习《齐诗》，又到长安太常门下受业，向夏侯胜请教《论语》和礼服。霍光执政时接见士人，要先搜身并由吏卒挟持，他不肯接受，因此没有得到任用，只做了看门的小吏。

  霍光死后他上书宣帝，受到赏识，历任谏大夫、平原太守、左冯翊，升到御史大夫，后来因与丞相丙吉不合，降为太子太傅。呼韩邪单于来朝时，朝中讨论接待的礼仪，他主张以客礼相待，位在诸侯王之上，不把单于当作臣属，宣帝采纳了这一意见。甘露三年（公元前 51 年）的石渠阁会议上，由他评定各家经说的异同后上奏。

  宣帝临终，任命他为前将军、光禄勋，与史高、周堪一同辅佐元帝。他与周堪、刘更生等主张任用儒生，建议不要让宦官掌管中书。中书令弘恭、仆射石显与外戚史高联合，先后两次诬告他结党、怨望。初元二年（前 47 年），元帝批准召他到廷尉受审，却不知道这意味着下狱。使者到门，他说自己做过将相，年过六十，不愿老来入狱求生，饮鸩自杀。元帝闻讯痛哭，但没有惩办石显等人。
sources: []
recalled:
  - 《汉书·萧望之传》
