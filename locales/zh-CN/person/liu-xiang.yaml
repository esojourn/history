name: 刘向
aliases: [刘更生, 刘子政]
role: 光禄大夫、中垒校尉
summary: 西汉宗室、学者，主持整理宫廷藏书并撰写叙录，编有《新序》《说苑》《列女传》。
body: |-
  据《汉书·楚元王传》，刘向本名更生，字子政，是汉高祖的弟弟楚元王刘交的四世孙。他十二岁凭父亲的官职任辇郎，宣帝时任谏大夫，以文辞见长。他曾把家藏的讲炼金术的书献给宣帝，试验不成，被判死罪，哥哥出钱为他赎罪。此后他受命研习《穀梁春秋》，在石渠阁参加了五经的讨论。

  元帝即位，他任宗正，与萧望之、周堪一同辅政，主张罢黜掌权的宦官弘恭、石显和外戚，反而两次下狱，被免为平民，在家闲居十余年。成帝即位后石显失势，他重新被起用，改名为向，任光禄大夫。当时太后的兄弟王凤等人执政，他多次上书，借历代的灾异和兴亡说明外戚权重的危险。成帝认为他说得对，想提拔他，都被王氏阻止，他最后的官职是中垒校尉。

  河平三年（公元前 26 年），成帝派人到各地搜求遗书，命刘向主持校订宫中所藏的经传、诸子和诗赋，另由专人分校兵书、数术和方技。每校完一部书，他就排定篇目，写一篇提要，说明书的内容和校订经过，连同定本一起上奏。这些提要后来汇集成《别录》，是中国最早的图书提要。今天所见的先秦和西汉古书，许多都是经他这次整理才有了定本。

  他还采集古事编成《新序》《说苑》，又辑录历代妇女的事迹写成《列女传》，都是为了规谏皇帝。他还著有讲灾异的《洪范五行传论》。本传说他不与世俗交接，白天读书，夜里观察星象。他的卒年有不同推算，一般取建平元年（前 6 年），终年七十二岁；校书的工作由儿子刘歆完成。
sources: []
recalled:
  - 《汉书·楚元王传》
  - 《汉书·艺文志》序
