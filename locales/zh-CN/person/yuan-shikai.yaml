name: 袁世凯
aliases: [慰亭, 项城, 洪宪皇帝]
role: 北洋军阀的首领，清末重臣，中华民国首任正式大总统
summary: 小站练兵创建北洋新军，清末任直隶总督，促成清帝退位，后任民国大总统，称帝失败。
body: |-
  袁世凯是河南项城人，出身官宦世家，两次参加乡试都没有考中，后来投奔淮军将领吴长庆。光绪八年（1882 年）朝鲜发生“壬午兵变”，他随吴长庆入朝，此后在朝鲜十二年，任驻朝鲜总理交涉通商事宜，干预朝鲜内政。甲午战争爆发前他回国。

  光绪二十一年（1895 年）他受命在天津小站督练“新建陆军”，按照德国的军制编练，这支军队成为北洋军的基础，段祺瑞、冯国璋、曹锟等后来的北洋将领都出自这里。戊戌变法期间，维新派希望借助他的兵力，谭嗣同夜访他，他回到天津后向荣禄告密，这一过程的具体细节学者有不同看法（另见“戊戌变法”条）。光绪二十五年（1899 年）他任山东巡抚，镇压义和团，并参与了“东南互保”。

  光绪二十七年（1901 年）李鸿章去世，袁世凯继任直隶总督兼北洋大臣，此后编练北洋六镇新军，推行警察、新式学堂等新政，与张之洞联名奏请废除科举（另见“清末新政”条）。光绪三十三年（1907 年）他入京任军机大臣兼外务部尚书。宣统元年（1909 年）摄政王载沣以“足疾”为由将他罢免，他回到河南彰德（今安阳）的洹上村隐居。

  宣统三年（1911 年）武昌起义爆发，清廷无法控制局势，被迫起用袁世凯，任命他为内阁总理大臣。他一面派北洋军进攻武汉，一面与南方的革命党人谈判，最后以清帝退位、由他出任大总统为条件达成协议。1912 年 2 月 12 日清帝退位，次日孙中山辞职，袁世凯随后在北京就任临时大总统（另见“清帝退位”条）。

  此后他逐步扩大权力，1913 年派人刺杀宋教仁，镇压“二次革命”，解散国会。1915 年底他宣布恢复帝制，改元洪宪，引起全国反对，护国战争爆发，他被迫在 1916 年 3 月取消帝制，同年 6 月在北京病死。民国以后的事迹，本站在这里只作简述。
sources: []
recalled:
  - 《袁世凯全集》
  - 《清德宗实录》
  - 陶菊隐《北洋军阀统治时期史话》
