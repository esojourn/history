name: 德基乌斯
aliases:
  - 德修
  - 德西乌斯
  - 图拉真·德基乌斯
role: 罗马皇帝
summary: 罗马皇帝，公元 250 年下令全国人向诸神献祭，是第一次遍及全帝国的逼迫。
body: |-
  德基乌斯约在公元 201 年生于潘诺尼亚的西尔米乌姆附近，是元老出身。公元 249 年，菲利普皇帝派他去整顿多瑙河一带的军队，军队却拥立他为帝。他回师意大利，在维罗纳附近击败菲利普，成为皇帝。

  公元 250 年初，他下令帝国全体居民向诸神献祭，并在地方官员面前领取证明。埃及出土了四十多份这样的献祭证明书，上面写着某人“一向向诸神献祭”，并有官员的签字。诏令的原文没有传下来，它是否专门针对基督徒，学者有不同看法；但对基督徒来说，献祭就等于否认信仰。《历史的轨迹》第二章称他是第一位有计划地要毁灭教会、展开全国性大逼迫的皇帝。

  这次逼迫中，罗马主教法比安、安提阿主教巴比拉、耶路撒冷主教亚历山大都死了，俄利根在狱中受了酷刑。同时也有大批信徒去献了祭，或者花钱买了证明。逼迫过后，怎样对待这些想回教会的人，成了迦太基和罗马教会争论的大问题，居普良的许多书信谈的就是这件事。

  逼迫不到一年半就停了。公元 251 年夏天，德基乌斯在多瑙河下游与哥特人作战，在阿布里图斯兵败，与儿子一同阵亡，是第一位死于对外战争的罗马皇帝。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
recalled:
  - 优西比乌《教会史》卷 6 第 39—42 章
  - 居普良《论背道者》
  - 拉克坦提乌斯《论迫害者之死》第 4 章
  - 埃及出土的德基乌斯年间献祭证明书（纸草）
