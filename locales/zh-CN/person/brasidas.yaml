name: 伯拉西达
aliases: [布拉西达斯]
role: 斯巴达将领
summary: 远征色雷斯沿海，夺取安菲波利斯，是战争前期斯巴达最出色的将领。
body: |-
  斯巴达人，特利斯之子。公元前 431 年战争第一年，雅典舰队袭击麦西尼亚的墨托涅，他带一百名重装步兵冲过敌阵进城固守，成为这场战争中第一个受到斯巴达公开表彰的人。此后几年他在舰队中任顾问和指挥。前 425 年在皮洛斯，他命舵手把战船冲上礁岸强行登陆，自己站在舷梯上受伤多处，昏倒在船里，盾牌落入海中被雅典人拾去。

  前 424 年他正在科林斯一带集结兵力，雅典人突袭麦加拉，他迅速赶到，保住了这座城。随后他率一千七百名重装步兵北上，其中七百人是被武装起来的希洛人，其余是从伯罗奔尼撒招募的佣兵。他疾行穿过亲雅典的色萨利，到达色雷斯沿海的卡尔基狄刻。这一带是雅典木材和税收的重要来源。他每到一城就宣布自己是来解放希腊人的，不干涉各城内政；阿坎托斯等城听了他的演说后脱离雅典。同年冬天他冒雪夜行，突然出现在安菲波利斯城外，开出宽大的条件，城中居民未等雅典将军修昔底德的援兵赶到就开城投降。修昔底德说他“就一个斯巴达人而言并不拙于言辞”，他的公正和节制使许多城邦在多年以后仍然倾向斯巴达。

  前 423 年双方订立一年休战，他仍然接受了在休战之后倒戈的斯基奥涅。前 422 年克里昂率军前来，他在安菲波利斯城内看准雅典人撤退时队形散乱，带少数精兵从城门冲出，一举击溃对方，自己受了重伤，被抬进城，得知获胜后死去。安菲波利斯人把他葬在城内，奉为建城英雄，每年为他举行竞技和献祭。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷二第 25 章；卷四第 11—12、70—88、102—116、120—135 章；卷五第 6—11 章
