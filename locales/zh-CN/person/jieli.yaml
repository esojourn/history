name: 颉利可汗
aliases: [阿史那咄苾]
role: 东突厥可汗
summary: 东突厥可汗，屡次南侵，626 年兵临渭水，630 年被唐军击败俘获，东突厥灭亡。
body: |-
  颉利可汗名阿史那咄苾，是启民可汗的儿子，始毕可汗、处罗可汗的弟弟。隋末中原大乱时，东突厥非常强盛，中原各路割据势力多向它称臣。武德三年（公元 620 年）处罗可汗去世，他继位为可汗，此后几乎每年南下侵扰唐朝的边境。

  武德九年（626 年）八月，唐太宗刚即位，颉利率十余万骑兵直抵长安城北的渭水便桥。据《资治通鉴》，太宗只带六骑到渭水边，隔水责备颉利背约，随后大军赶到，颉利见唐军阵容严整，又听说唐朝已有准备，于是请和，双方在便桥上刑白马结盟，突厥退兵。

  此后东突厥连年遭受大雪和饥荒，所属的薛延陀、回纥等部纷纷叛离，颉利的侄子突利可汗也与他不和，降附唐朝。贞观三年（629 年）冬，唐朝派李靖、李勣等人分路出击。次年正月李靖夜袭定襄，颉利退走；二月唐军又在阴山突袭他的牙帐，突厥大败。三月他被唐将张宝相擒获，送到长安，东突厥灭亡（另见“唐灭东突厥”条）。

  太宗当面列举他的罪状后赦免了他，授予右卫大将军，赐给田宅。据《资治通鉴》，消息传来时，已退位的太上皇李渊在凌烟阁设宴，亲自弹琵琶，太宗起舞庆贺。颉利在长安郁郁不乐，贞观八年（634 年）去世，唐朝按突厥的习俗焚尸安葬。
sources: []
recalled:
  - 《旧唐书·突厥传》
  - 《新唐书·突厥传》
  - 《资治通鉴》卷一百八十八至一百九十四
