name: 魏征
aliases: [魏徵, 魏玄成, 郑国公]
role: 谏议大夫、侍中
summary: 唐太宗时以直言敢谏著称的大臣，前后进谏两百余事，主持修撰《隋书》。
body: |-
  魏征字玄成，本写作魏徵，少年时孤贫，曾出家为道士。隋末他先后依附武阳郡丞元宝藏和瓦岗军的李密，随李密降唐后，自请到山东招抚旧部，被窦建德俘获，在夏政权中任起居舍人。窦建德败亡后他再次归唐，任太子李建成的洗马，曾劝李建成及早除掉秦王李世民。

  玄武门之变后，李世民召见他，责问他为什么离间兄弟，他回答说，太子如果早听我的话，就不会有今天的祸事。李世民欣赏他的直率，任他为詹事主簿，即位后任谏议大夫，后来历任秘书监、侍中等职，封郑国公。

  据两《唐书》本传，他前后进谏两百余事，往往当面直言，不顾太宗的脸色。贞观二年（公元 628 年），太宗问怎样才算明君、暗君，他回答“兼听则明，偏信则暗”。贞观十一年（637 年）他上《谏太宗十思疏》，劝太宗居安思危、戒奢以俭。他还主持了《隋书》等前代史书的修撰，《隋书》的序论多出自他手。

  贞观十七年（643 年）正月他病逝，年六十四。据《旧唐书》本传，太宗对侍臣说，以铜为镜可以正衣冠，以古为镜可以知兴替，以人为镜可以明得失，魏征去世，自己失去了一面镜子。太宗亲自为他撰写碑文。但不久因为他生前推荐的杜正伦、侯君集先后获罪，又有人说他把谏言抄给史官，太宗大怒，推倒了他的墓碑，取消了衡山公主与他儿子的婚约。贞观十九年（645 年）征高句丽失利后，太宗感叹如果魏征还在，不会让他有这次出征，又命人重新立碑。
sources: []
recalled:
  - 《旧唐书·魏徵传》
  - 《新唐书·魏徵传》
  - 吴兢《贞观政要》
  - 《资治通鉴》卷一百九十二至一百九十八
