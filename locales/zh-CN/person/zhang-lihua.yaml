name: 张丽华
aliases: [张贵妃]
role: 贵妃
summary: 陈后主的宠妃，陈亡时与后主一同被俘，随即被隋军处死。
body: |-
  张丽华出身兵家，家境贫寒，父兄以织席为业。陈叔宝做太子时，她被选入东宫，原是龚良娣的侍女，因美貌得宠，生下皇子陈深。陈叔宝即位后，她被封为贵妃，住在结绮阁。据《陈书》《南史》，她头发长七尺，光亮可鉴，聪慧敏捷，记性很好。后主怠于政事，百官的奏事常由宦官传达，后主抱她坐在膝上一起决定，宫中内外的事务她无不预闻。

  祯明三年（公元 589 年）隋军攻入建康，她与后主躲在景阳殿的井中，一同被俘。据《隋书·高颎传》，晋王杨广想留下她，高颎以姜太公蒙面斩妲己为例，坚持把她处死在青溪，杨广因此怀恨高颎。她的生年史书没有记载。
sources: []
recalled:
  - 《陈书·皇后传》附张贵妃
  - 《南史·后妃传》
  - 《隋书·高颎传》
