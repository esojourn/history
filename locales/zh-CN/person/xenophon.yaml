name: 色诺芬
aliases: []
role: 历史学家、军人
summary: 雅典人，苏格拉底的弟子，率万人雇佣军自波斯腹地退回，著《长征记》《希腊史》。
body: |-
  雅典人，属厄尔基亚村社，父亲名格吕洛斯，约生于公元前 430 年。年轻时与苏格拉底交往。前 401 年，他应朋友、彼奥提亚人普罗克塞诺斯之邀，加入波斯王子小居鲁士招募的希腊雇佣军。据他自己在《长征记》里说，他行前问过苏格拉底，苏格拉底让他去德尔斐求问，他问的却是向哪位神献祭才能平安往返。

  小居鲁士在库纳克萨战死，希腊雇佣军的将领又被波斯总督提萨斐尼斯诱捕杀害。他被推为新的将领之一，同斯巴达人刻里索福斯等人率军北上，穿过卡杜齐亚人的山地和亚美尼亚的雪原，前 400 年初抵达黑海边的特拉佩祖斯。此后他带这支军队在色雷斯为塞乌提斯效力，前 399 年转归在小亚细亚作战的斯巴达人。他结识了斯巴达国王阿格西劳斯，前 394 年随其回到希腊，科罗尼亚之战时在斯巴达一方。雅典判他流放，是在此前还是此后、因何罪名，说法不一。

  斯巴达人把奥林匹亚附近的斯基卢斯一处田庄给他，他在那里住了二十年左右，打猎、著述。前 371 年留克特拉之战后埃利斯人收回该地，他迁居科林斯。雅典后来撤销了对他的流放；前 362 年曼提尼亚之战，他的儿子格吕洛斯在雅典骑兵中阵亡。他是否回过雅典、卒于何处，都没有定论，去世大约在前 354 年前后。

  他的著作全部传世。《长征记》记万人雇佣军的进退；《希腊史》接着修昔底德中断的地方，从前 411 年写到前 362 年；《居鲁士的教育》借居鲁士大帝写理想的君主；《回忆苏格拉底》《申辩》《会饮》《齐家》是关于苏格拉底的；此外有《阿格西劳斯传》《斯巴达政制》《论骑术》《雅典的收入》等。
sources: []
recalled:
  - 色诺芬《长征记》卷三第 1 章、卷五第 3 章
  - 第欧根尼·拉尔修《名哲言行录》卷二
  - 色诺芬《希腊史》
