name: 石达开
aliases: [翼王]
role: 太平天国翼王
summary: 太平天国翼王，天京事变后率部出走，1863 年在大渡河畔被困，就义于成都。
body: |-
  石达开是广西贵县人，出身富裕农家，据说少年时就有侠义之名。他十几岁时加入拜上帝会，带领族人和乡亲参加了金田起事。咸丰元年（1851 年）在永安被封为翼王，当时只有二十岁左右。

  太平天国定都天京后，石达开主持安庆的政务，后来率军西征，咸丰五年（1855 年）在湖口、九江一带大败曾国藩的湘军水师，曾国藩一度投水自杀被救起。此后他在江西攻占了许多府县。咸丰六年（1856 年）他回师参加攻破江南大营的作战。

  同年天京事变爆发，韦昌辉杀死杨秀清后，又杀了石达开在天京的全家。石达开从前线赶回，号召讨伐韦昌辉，洪秀全杀了韦昌辉，请石达开回京主政。但洪秀全对他心存猜忌，重用自己的兄弟牵制他。咸丰七年（1857 年）石达开率领大批精兵离开天京出走，此后转战江西、浙江、福建、湖南、广西、贵州、四川等地，始终没能建立稳固的根据地，部众逐渐散失。

  同治二年（1863 年）石达开率部到达四川大渡河畔的紫打地（今安顺场），被涨水的河流和清军、当地土司的武装所阻，几次渡河都失败了。他为了保全部众，走进清营，据记载他的部下仍有许多被清军屠杀。随后他被押送到成都，被四川总督骆秉章处死，年三十三岁。
