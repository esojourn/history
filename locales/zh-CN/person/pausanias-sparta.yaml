name: 保萨尼阿斯
aliases: [波桑尼阿斯, 斯巴达摄政保萨尼阿斯]
role: 斯巴达摄政、将军
summary: 在普拉提亚统率希腊联军击败波斯，后被控通敌，困死于神庙。
body: |-
  斯巴达阿基斯王室成员，克列奥姆布罗托斯之子，列奥尼达的侄子。列奥尼达战死后，其子普雷斯塔科斯年幼，保萨尼阿斯以摄政身份行使王权。他与公元 2 世纪写《希腊志》的保萨尼阿斯不是一人。

  公元前 479 年，他统率希腊联军在普拉提亚与马铎尼斯决战。据希罗多德，联军共有重装步兵三万八千余人，连轻装兵在内约十一万；这是希腊人到那时为止集结的最大兵力。马铎尼斯战死，波斯军营被攻破。希罗多德称这是“我们所知道的最辉煌的胜利”，又记他看到波斯统帅营帐里的奢华陈设后，让人另做一餐斯巴达饭食摆在旁边，对希腊将领们说，波斯人过着这样的日子，却来抢我们这点可怜的东西。

  前 478 年他率联军舰队出征，夺取塞浦路斯大部和拜占庭。据修昔底德，他在拜占庭变得专横，穿波斯服装，出行带着米底和埃及卫兵，并暗中写信给薛西斯，表示愿娶其女，帮助波斯控制希腊；修昔底德引了双方的书信。盟邦因此转投雅典。他被召回受审，重罪未能坐实。此后他私自再去拜占庭，被雅典人逐出，又在特洛阿德逗留，再度被召回。

  监察官怀疑他图谋煽动希洛人，但没有证据。最后他的一名信使拆开了要带给波斯总督的信，发现信中要求处死送信人，便向监察官告发。监察官设计偷听到他亲口承认。他逃进卫城上“铜屋雅典娜”神庙的一间小屋，监察官下令封死门户、揭去屋顶，等他饿到垂死才抬出来，以免死在圣地。此事约在前 470 年，确切年份不能肯定。德尔斐的蛇柱三足鼎上他刻下的自夸的题词，被斯巴达人凿去，改刻参战各邦的名字。
sources: []
recalled:
  - 希罗多德《历史》卷九第 10—88 章
  - 修昔底德《伯罗奔尼撒战争史》卷一第 94—95、128—134 章
