name: 桑维翰
aliases: [桑国侨]
role: 后晋宰相
summary: 石敬瑭的谋士，力主向契丹称臣求援，后晋时两度为相，947 年契丹入汴时被杀。
body: |-
  桑维翰是洛阳人，字国侨，光化元年（公元 898 年）生。据《新五代史》，他年轻时参加进士考试，主考官嫌他的姓与“丧”同音，不肯录取，有人劝他另谋出路，他铸了一方铁砚给人看，说铁砚磨穿了才改行，后来终于考中进士。这就是“磨穿铁砚”这个说法的来历。

  此后他在石敬瑭幕下任掌书记。清泰三年（936 年）石敬瑭在太原拒命，桑维翰力主向契丹求援，亲自起草了称臣、割地的表章。契丹皇帝耶律德光南下后，后唐的卢龙节度使赵德钧也派人与契丹交涉，许以更优厚的条件，耶律德光有些动心。据《资治通鉴》，桑维翰赶到契丹营帐，在帐前跪了一整天，流着泪力争，耶律德光才决定继续支持石敬瑭。

  后晋建立后，他任宰相兼枢密使，主持朝政，主张对契丹保持恭顺、在国内休养兵力。他理财用人颇有成效，但也被批评收受贿赂。石重贵即位后，景延广主张与契丹决裂，桑维翰被排挤出朝，开运年间一度复相，不久又被罢免。开运三年十二月（947 年初）契丹军攻入开封，投降契丹的将领张彦泽奉命把他抓起来，夜里将他勒死，对外声称他是自缢。

  后世对桑维翰的评价多是批评。他一手促成了割让燕云十六州，宋代以后的史家常把他与石敬瑭一同指责；也有人认为他在后晋执政期间维持了数年的和平。
sources: []
recalled:
  - 《旧五代史·晋书·桑维翰传》
  - 《新五代史·晋臣传·桑维翰》
