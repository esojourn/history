name: 阿那克萨戈拉
aliases: []
role: 哲学家
summary: 克拉佐美奈人，把哲学带到雅典，主张“心灵”安排万物，后被控不敬神。
body: |-
  小亚细亚爱奥尼亚地区的克拉佐美奈人，据说出身富家，为了研究学问放弃了家产。生卒年是古人推算的约数。他来到雅典，在那里住了大约三十年，是第一位在雅典长住的哲学家；他到达的时间有两种推法，相差二十多年。他是伯里克利的朋友和老师。普鲁塔克说，伯里克利那种庄重的气度和不为迷信所动的见识，都得自阿那克萨戈拉。

  他写过一部散文著作，柏拉图让苏格拉底说，这书在市场上花一个德拉克马就能买到。今存若干残篇，主要由辛普里丘引用。他接受巴门尼德的前提，认为没有什么东西产生或消灭，只有混合与分离。最初万物混在一起，每一样东西里都含有其他一切东西的一份。使这团混合物旋转起来、从而分出万物的，是“心灵”，它是最纯的，不与任何东西相混，知晓并安排一切。柏拉图《斐多篇》里的苏格拉底说，自己年轻时听到这个说法很高兴，读下去却失望了，因为书里并不用心灵来解释事物为什么这样安排最好，仍然只讲气、以太和水。

  他说太阳是一块炽热的石头，比伯罗奔尼撒半岛还大；月亮是土质的，上面有山谷，它的光来自太阳；他由此正确解释了日食和月食的成因。公元前 467 年前后有一块陨石落在羊河附近，古人把它与他的学说联系起来，甚至说他预言了这件事。

  他在雅典被控不敬神。控告的时间、控告人（有的说是克里昂，有的说是麦勒西亚斯之子修昔底德）和判决，各种记载互相矛盾；多数现代学者认为这是伯罗奔尼撒战争前夕针对伯里克利的攻击之一。他离开雅典，到赫勒斯滂海峡边的兰普萨库斯定居，死在那里。亚里士多德记载，当地人为他举行公葬，此后一直纪念他；据说他临终时请求每年在他去世的那个月给孩子们放假。
