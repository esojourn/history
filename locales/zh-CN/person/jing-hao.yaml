name: 荆浩
aliases: [荆浩然, 洪谷子]
role: 山水画家
summary: 唐末五代的山水画家，隐居太行山洪谷，著有《笔法记》，为北方山水画开派人物。
body: |-
  荆浩是河内沁水人，字浩然，约生于大中四年（公元 850 年）前后，卒年不详。唐末战乱时，他隐居在太行山的洪谷，自号洪谷子，以耕种为生。他博通经史，擅长写文章，但主要以绘画著名。

  荆浩长于山水画，他自己说，吴道子的画有笔而无墨，项容的画有墨而无笔，他要兼取两人之长。据《笔法记》中的自述，他在太行山中写生，画了数万本古松，力求得其真貌。他画的是北方的崇山峻岭，山势雄伟，往往在画面中央耸立一座主峰，构图饱满，开创了此后北方山水画的格局。

  他著有一篇论画的文章《笔法记》，假托与山中老人问答，提出画有“六要”：气、韵、思、景、笔、墨。他解释说，气是心随笔运、取象不迷惑，韵是隐去笔迹、立出形象而不流于俗；文中并论述了“真”与“似”的区别，认为画的目的在于“度物象而取其真”。这是中国山水画理论的重要文献，学界对其中部分文字是否为原文有过讨论。

  荆浩的学生关仝继承了他的画风，二人合称“荆关”，与南方的董源、巨然以及北宋的李成、范宽一起，被看作五代北宋山水画的代表人物。现藏台北故宫博物院的《匡庐图》旧题为荆浩所作，学界对作者归属有不同看法。
sources: []
recalled:
  - 荆浩《笔法记》
  - 郭若虚《图画见闻志》卷二
  - 《宣和画谱》卷十
