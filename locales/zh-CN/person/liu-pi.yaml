name: 刘濞
aliases:
  - 吴王濞
role: 吴王
summary: 汉高祖之侄，封吴王四十余年；公元前 154 年联合六国起兵，兵败被杀。
body: |-
  汉高祖刘邦兄长刘仲的儿子，初封沛侯。据《史记·吴王濞列传》，英布叛乱时他二十岁，以骑将随高祖作战；高祖担心吴地、会稽民风强悍而没有年长的王镇守，便立他为吴王，辖三郡五十三城，时在高祖十二年。按这一年龄推算，他约生于公元前 215 年。吴国有豫章郡的铜山，他招集各地逃亡的人铸钱，又煮海水制盐，国用富足。

  文帝时，吴太子入朝，与皇太子刘启下棋时起了争执，被皇太子用棋盘砸死，他从此称病不朝。景帝采纳晁错的主张，下令削去吴国的会稽、豫章两郡。前 154 年正月，他在广陵起兵，自称年六十二，征发二十余万人，联合楚、赵、胶西、胶东、菑川、济南六国，以诛晁错为名西进。吴楚联军攻梁国不下，粮道又被周亚夫切断，终于溃败。他渡江逃到丹徒，投靠东越，被受汉朝利诱的东越人杀死。
sources:
  - 《史记·吴王濞列传》 https://ctext.org/shiji/wu-wang-bi-lie-zhuan/zhs
  - 《汉书·荆燕吴传》
  - 《史记·绛侯周勃世家》 https://ctext.org/shiji/jiang-hou-zhou-bo-shi-jia/zhs
