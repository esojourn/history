name: 亚达薛西一世
aliases: [阿尔塔薛西斯一世, 长手亚达薛西]
role: 波斯国王
summary: 波斯王，薛西斯一世之子；在位时以斯拉、尼希米先后回耶路撒冷。
body: |-
  波斯阿契美尼德王朝的君主，薛西斯一世之子，通行译名为阿尔塔薛西斯一世，和合本作“亚达薛西”。希腊作家称他为“长手”，普鲁塔克说是因为他右手比左手长。公元前 465 年薛西斯在宫廷阴谋中被杀，他随后即位；生年没有可靠记载。

  据修昔底德等希腊史料，他在位初年埃及在伊纳罗斯领导下起事，并得到雅典舰队的支援，波斯用了数年才平定。曾在萨拉米斯击败波斯的雅典人地米斯托克利遭本国放逐后投奔波斯宫廷，修昔底德说接待他的是刚即位的亚达薛西。古代作家还提到雅典与波斯在公元前 449 年前后订立的“卡里阿斯和约”，这一和约是否真有其事，学界有争论。

  圣经方面，《以斯拉记》第 7 章记他在位第七年颁谕旨给文士以斯拉，准他带人回耶路撒冷，并供给圣殿所需；《尼希米记》第 2 章记他在位第二十年准许酒政尼希米回去重修城墙，13:6 又提到他的第三十二年。《以斯拉记》4:7–23 另记他曾因撒玛利亚官员的奏告下令停止修造耶路撒冷城。多数学者认为这几处的亚达薛西都是一世，以斯拉那一处也有人认为是二世。他死于公元前 424 年。
sources: []
recalled:
  - 《以斯拉记》4:7–23、第 7 章
  - 《尼希米记》第 2 章、5:14、13:6
  - 修昔底德《伯罗奔尼撒战争史》卷 1
  - 普鲁塔克《亚达薛西传》《地米斯托克利传》
