name: 郑玄
aliases: [郑康成]
role: 经学家
summary: 东汉经学家，遍注群经，兼采今文、古文两派之说，后世称其学为“郑学”。
body: |-
  据《后汉书·郑玄传》，郑玄字康成，北海高密人。年轻时做过乡里的小吏，不愿为吏，常到学官那里求教。后来他进入太学，先后跟随第五元先、张恭祖学习今文和古文经典，又西入关中，经卢植介绍拜在马融门下。马融门徒众多，郑玄三年没能见到老师本人，只由高足弟子转授。本传说他学成辞归时，马融对门人感叹“郑生今去，吾道东矣”。

  他在外游学十多年后回到家乡，靠种田为生，跟随他学习的有成百上千人。第二次党锢时他也被列入禁锢，前后十四年不能出仕，于是闭门研究经学。当时今文经学与古文经学各守门户，互相攻驳。郑玄以古文经为主，兼采今文经的说法，为《周礼》《仪礼》《礼记》《毛诗》《周易》《尚书》《论语》等作注。他的注本流行以后，其他各家的注本大多逐渐失传；今天通行的“三礼”注和《毛诗》笺都出自他的手。

  党禁解除后，何进、董卓、袁绍等人先后征召他，他或不应召，或到任不久便辞归。朝廷任命他为大司农，他也因病请还。建安五年（公元 200 年）袁绍与曹操在官渡相持，袁绍让儿子袁谭逼迫郑玄随军，郑玄抱病上路，走到元城病重，六月去世，本传记其终年七十四。
sources: []
recalled:
  - 《后汉书·张曹郑列传》
