name: 童贯
aliases: [童道夫, 广阳郡王]
role: 北宋宦官、领兵大臣
summary: 宋徽宗宠信的宦官，掌兵二十年，镇压方腊，攻燕失败，钦宗时被处死。
body: |-
  童贯是开封人，宦官出身。宋徽宗即位后，他奉命到杭州搜罗书画珍玩，与当时被贬在杭州的蔡京结交，两人互相援引。崇宁年间他以监军身份到西北，参与对西夏和青唐吐蕃的战事，后来长期主管西北兵事，官至枢密使，前后掌兵二十年左右。

  宣和二年（1120 年）方腊起义，他奉命率军南下镇压，次年平定（另见“方腊起义”条）。他力主联金攻辽，宣和四年（1122 年）两次率军进攻燕京，都被辽军击败（另见“海上之盟”“宋赎燕京”条）。后来宋朝以输钱的方式从金朝手里换回燕京等地，他因此被封为广阳郡王。宦官封王，在宋朝只有他一人。

  宣和七年（1125 年）他在太原得知金军南下，借口回京禀报而逃离，太原守将张孝纯责备他临阵脱逃。宋钦宗即位后，他被列为“六贼”之一，一再贬谪，靖康元年（1126 年）七月在流放途中于南雄州被朝廷派去的人斩首。
sources: []
recalled:
