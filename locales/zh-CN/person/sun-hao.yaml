name: 孙皓
aliases: [孙元宗, 归命侯]
role: 皇帝
summary: 孙吴最后一位皇帝，孙权之孙，为政暴虐，公元 280 年向晋军投降。
body: |-
  据《三国志·吴书·三嗣主传》，孙皓字元宗，是孙权的孙子、废太子孙和的儿子。永安七年（公元 264 年）吴主孙休去世，当时蜀汉刚刚灭亡，交趾又发生叛乱，大臣们想立一位年长的君主，于是迎立了二十三岁的孙皓。

  本传说他即位之初下诏抚恤百姓、开仓赈济、放出宫女，受到称赞；地位稳固以后变得粗暴多疑，沉迷酒色。拥立他的大臣濮阳兴、张布不久被杀，孙休的皇后和两个儿子也被害。他曾把都城迁到武昌，一年多后又迁回建业，往来搬运给下游的百姓带来很重的负担。他大建宫殿，并使用剥面皮、凿眼睛等酷刑，朝臣人人自危。镇守荆州的陆抗多次上书劝谏，都没有被采纳；陆抗在凤凰三年（274 年）去世后，长江上游的防务日渐空虚。

  咸宁五年（279 年）冬，晋军分六路大举南下，吴军各处的防线很快瓦解。次年三月，王濬的水军顺江而下到达建业城外的石头城，孙皓反绑双手、抬着棺木出城投降。吴国自孙权称帝起共五十二年，至此灭亡。孙皓被送到雒阳，受封归命侯，太康五年（284 年）死于雒阳。
sources: []
recalled:
  - 《三国志·吴书·三嗣主传》及裴松之注
  - 《晋书·武帝纪》
