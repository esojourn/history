name: 苏秦
aliases: [季子]
role: 纵横家
summary: 战国纵横家，以合纵之说游说诸侯；《史记》与出土帛书对他的事迹和年代记载差异很大。
body: |-
  苏秦是东周洛阳人，生年不详。他是战国纵横家中最著名的人物之一，但他的事迹在史料中相当混乱。

  据《史记·苏秦列传》，苏秦曾师从鬼谷先生，起初游说秦惠王不被采用，穷困而归，家人都看不起他，“妻不下纴，嫂不为炊”。《战国策·秦策一》说他发愤读书，读到困倦时“引锥自刺其股，血流至足”。后来他游说燕、赵、韩、魏、齐、楚六国合纵抗秦，被任为纵约长，佩六国相印，秦兵因此十五年不敢出函谷关。最后他在齐国被人刺杀，一说被车裂。

  1973 年湖南长沙马王堆汉墓出土的帛书《战国纵横家书》，保存了苏秦的书信和游说辞，与《史记》差别很大。学者据此认为，苏秦的活动年代要比《史记》所说的晚，他与张仪并非同时的对手，而主要活动在燕昭王、齐湣王时期：他受燕昭王之托到齐国做“反间”，取得齐湣王的信任，促使齐国攻宋、与秦交恶，削弱齐国，为燕国报仇创造条件。公元前 284 年乐毅率五国之师破齐，苏秦的反间活动暴露，被齐人车裂而死。《史记》中苏秦佩六国相印、主持合纵的情节，很可能是战国末年游士夸张附会的产物。

  成语“头悬梁，锥刺股”中的“锥刺股”，就出自苏秦的故事。
sources: []
recalled:
  - 《史记·苏秦列传》
  - 《战国策·秦策一》
  - 马王堆汉墓帛书《战国纵横家书》
