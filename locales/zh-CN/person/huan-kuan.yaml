name: 桓宽
aliases: [桓次公]
role: 学者
summary: 汉宣帝时的学者，根据盐铁会议的记录整理成《盐铁论》。
body: |-
  桓宽字次公，汝南人，生卒年不详。关于他的记载只见于《汉书·公孙刘田王杨蔡陈郑传》篇末的赞语：他研习《公羊春秋》，宣帝时被举荐为郎，官至庐江太守丞，学识广博，善写文章。昭帝始元六年（公元前 81 年）盐铁会议的议论文字保存了下来，他加以推衍，增广条目，把双方的辩难铺陈出来，写成数万字的著作，想借此探究治乱的道理，成一家之言。史料所载仅此。

  他整理的这部书就是《盐铁论》，今本六十篇，用对话的体裁记录御史大夫桑弘羊一方与贤良、文学一方的往复辩论，涉及盐铁官营、均输平准、对匈奴的和战以及德治与法治等问题，是了解西汉中期经济政策和社会状况的重要材料。书中的言辞经过他的加工，立场倾向于贤良、文学一方。
sources: []
recalled:
  - 《汉书·公孙刘田王杨蔡陈郑传》赞
  - 桓宽《盐铁论》
