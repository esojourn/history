name: 犹利安
aliases:
  - 叛道者犹利安
  - 朱利安
role: 罗马皇帝
summary: 君士坦丁的侄子，即位后公开信奉异教并设法复兴，公元 363 年死于征波斯途中。
body: |-
  犹利安约在公元 331 年生于君士坦丁堡，父亲是君士坦丁同父异母的弟弟。337 年君士坦丁死后，军队杀了皇族的许多男子，他的父亲也在其中，他因年幼得免。他在基督教的教养下长大，受过洗，在教堂里担任过诵经员，同时师从几位希腊修辞学和哲学的教师，后来自述约在二十岁时暗中转向了诸神。355 年他在雅典求学，同时在那里读书的有巴西流和拿先斯的贵格利。

  这一年，堂兄君士坦提乌斯二世立他为“凯撒”，派往高卢。357 年他在斯特拉斯堡附近大败阿勒曼尼人。360 年军队在巴黎拥立他为“奥古斯都”。两人还没有交战，君士坦提乌斯就在 361 年病死，犹利安成为唯一的皇帝，随即公开自己的信仰。

  他下令重开神庙，恢复献祭，取消神职人员的特权，召回此前被放逐的各派主教。362 年他规定教师任命须经审查，实际上不许基督徒讲授希腊古典。他还写了《驳加利利人》，并打算重建耶路撒冷的圣殿，工程不久就停了。《历史的轨迹》第四章说，他对基督教的攻击主要是用笔，恢复异教的努力以失败告终。

  公元 363 年他率大军攻入波斯，打到都城泰西封城下，未能攻克，只得北撤。6 月 26 日他在途中的一次战斗里受伤，当夜去世。同在军中的阿米阿努斯说他被一支骑兵的矛刺中肋部；《历史的轨迹》说是箭伤大腿。“加利利人哪，你胜了”这句话，最早见于五世纪狄奥多勒的《教会史》，当时的记载里没有，书中也注明是“据传说”。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四章“教会全面得胜” https://wellsofgrace.com/books/spiritual/2000years/html/chapter05.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第六章“教会渐趋腐化” https://wellsofgrace.com/books/spiritual/2000years/html/chapter07.html"
recalled:
  - 阿米阿努斯《历史》卷 22、卷 25 第 3 章
  - 犹利安《致雅典人书》
  - 狄奥多勒《教会史》卷 3 第 25 章
  - 苏格拉底《教会史》卷 3
