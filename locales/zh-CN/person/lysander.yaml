name: 吕山德
aliases: [莱山德, 来山得]
role: 斯巴达海军统帅
summary: 在羊河全歼雅典舰队，迫使雅典投降，结束伯罗奔尼撒战争。
body: |-
  斯巴达人，阿里斯托克里托斯之子，据普鲁塔克，家族出自赫拉克勒斯的后裔而并非王室，自幼贫穷。生年没有记载。公元前 407 年他出任海军统帅，以以弗所为基地。这时波斯王子小居鲁士来到萨迪斯主持小亚细亚西部的军政，吕山德赢得了他的信任，用波斯的钱把桨手的日薪提高，吸引雅典舰队里的雇佣桨手投奔过来。前 406 年他在诺提翁击败亚西比德的副手。任期届满后，继任者在阿吉纽西战败身亡。

  斯巴达的法律不许一人两任海军统帅，应小居鲁士和盟邦的要求，前 405 年他以副职的名义再度掌兵。他把舰队开到赫勒斯滂海峡，攻下兰普萨库斯，威胁雅典的粮道。雅典舰队一百八十艘战船赶来，停在对岸的羊河。一连四天雅典人列阵求战，他按兵不动；第五天，等雅典人照例上岸四散觅食时，他突然渡海进攻，俘获了几乎全部战船，只有科农带着几艘逃脱。据色诺芬，被俘的雅典人约三千，都被处死。

  他随后逐一夺取雅典的盟邦，把各地的雅典人都赶回雅典，以加重城内的饥荒，再从海上封锁比雷埃夫斯。前 404 年春雅典投降。色诺芬写道，拆毁长墙时有吹笛女伴奏，人们以为这一天是希腊自由的开始。他在雅典扶植了三十人的寡头政权，在各地设立由他的亲信十人组成的委员会和斯巴达驻军长官。萨摩斯人为他设坛献祭，把节日改用他的名字；普鲁塔克转引史家杜里斯说，他是第一个在生前被希腊人当作神来敬奉的人。

  他的权势引起国王和监察官的猜忌。前 403 年国王保萨尼阿斯到雅典主持和解，三十僭主垮台；各地的十人委员会后来也被撤销。约前 400 年他帮助阿格西劳斯取得王位，前 396 年随其出征小亚细亚，却被有意冷落。前 395 年科林斯战争爆发，他率一支军队进入彼奥提亚，没有等到保萨尼阿斯的主力会合，就在哈利阿图斯城下遭底比斯人袭击阵亡。据普鲁塔克，他死后人们在他家中发现一篇讲稿，主张国王不再由两个王室世袭而从全体公民中推选，当局没有公布。
sources: []
recalled:
  - 色诺芬《希腊史》卷一第 5—6 章；卷二；卷三第 3—5 章
  - 普鲁塔克《吕山德传》
  - 狄奥多罗斯《历史丛书》卷十三第 104—107 章
