name: 冯太后
aliases: [文明太后, 文成文明皇后]
role: 皇后、太皇太后
summary: 魏文成帝的皇后，两度临朝听政，主持推行俸禄制、均田制、三长制。
body: |-
  冯氏是北燕皇族的后代，祖父冯弘是北燕最后一位君主。父亲冯朗降魏后任秦、雍二州刺史，太平真君三年（公元 442 年）她生于长安。后来父亲获罪被杀，她被没入宫中，由身为太武帝昭仪的姑母抚养。文成帝即位后，她被选为贵人，太安二年（456 年）立为皇后。

  和平六年（465 年）文成帝去世，十二岁的献文帝拓跋弘即位，丞相乙浑专权。次年，她定计诛杀乙浑，临朝听政。不久孝文帝出生，她归政于献文帝，亲自抚养孙子。献文帝杀了她宠信的李弈，母子之间嫌隙日深。皇兴五年（471 年）献文帝传位给五岁的孝文帝，自称太上皇帝；承明元年（476 年）献文帝突然死去，史书大多说是她所为。此后她以太皇太后的身份第二次临朝，直到去世，前后执政二十余年。

  这一时期北魏推行了一系列重要改革：太和八年（484 年）开始给官吏发放俸禄，严惩贪赃；太和九年（485 年）颁行均田制；太和十年（486 年）采纳李冲的建议，设立邻、里、党三长，取代原先的宗主督护制（另见“太和改制”条）。这些改革为孝文帝后来的迁都和汉化奠定了基础。

  据《魏书·皇后传》，她对孝文帝管教极严，一度想废掉他，曾在寒冬把他关在空屋里，三天不给饭吃，经大臣劝谏才作罢。孝文帝始终对她恭顺。太和十四年（490 年），她在平城去世，年四十九，葬于方山永固陵。孝文帝哀痛逾礼，执意守丧。
sources: []
recalled:
  - 《魏书·皇后传·文成文明皇后冯氏》
  - 《资治通鉴》卷一百三十二至一百三十七
