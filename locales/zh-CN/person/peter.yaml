name: 彼得
aliases:
  - 西门
  - 西门彼得
  - 矶法
role: 十二使徒之首
summary: 加利利的渔夫，十二使徒中列名第一，耶路撒冷教会早期的领袖，相传在罗马殉道。
body: |-
  彼得本名西门，父亲名叫约拿（《约翰福音》作约翰），是伯赛大人（约 1:44），生年没有记载。他和兄弟安得烈在加利利海打鱼，家在迦百农，已经娶妻，《马可福音》1:29–31 记耶稣在他家里医好了他的岳母。马可记耶稣在海边呼召这兄弟二人，他们就舍了网跟从他（可 1:16–18）；《约翰福音》1:40–42 则记安得烈先领他去见耶稣，耶稣给他起名叫矶法，翻出来就是彼得。

  福音书里的几份十二使徒名单都把他列在第一位。他和雅各、约翰三人常在耶稣身边，一同看见睚鲁的女儿复活和耶稣在山上改变形像。在该撒利亚腓立比境内，耶稣问门徒说他是谁，彼得回答他是基督（太 16:13–19）。耶稣被捕后，他跟到大祭司的院子里，三次否认自己认识耶稣，鸡叫以后出去痛哭，四卷福音书都记了这件事。耶稣复活后向他显现（路 24:34）；《约翰福音》第 21 章记在提比哩亚海边，耶稣三次问他是否爱自己，并嘱咐他牧养自己的羊。

  《使徒行传》前半部以彼得为中心。五旬节那天他站起来向众人讲道，据《使徒行传》2:41，那一天门徒约添了三千人。他和约翰在圣殿门口医好一个生来瘸腿的人，为此在公会前受审（第 3—4 章）；后来到撒玛利亚，又在该撒利亚给罗马百夫长哥尼流一家施洗（第 10 章）。希律王把他下在监里，他在夜间被天使领出（第 12 章）。他最后一次出现在《使徒行传》，是在耶路撒冷的会议上发言（第 15 章）。保罗在《加拉太书》2:11–14 说，自己曾在安提阿当面抵挡他。新约中有《彼得前书》《彼得后书》两封书信归在他名下。

  新约没有记载彼得的结局，只有《约翰福音》21:18–19 一处暗示他将怎样死。据教会传统，他后来到了罗马，在尼禄皇帝在位时殉道，年份有公元 64 年至 67 年几种说法；相传他是倒钉十字架而死，此说见于二世纪末的《彼得行传》等新约以外的著作。
sources: []
