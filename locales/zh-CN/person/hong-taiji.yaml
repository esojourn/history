name: 皇太极
aliases: [清太宗, 天聪汗, 崇德帝]
role: 后金第二代大汗，清朝的建立者
summary: 努尔哈赤之子，改族名为满洲，1636 年改国号为大清，击溃明军关外主力。
body: |-
  皇太极是努尔哈赤的第八个儿子，生于万历二十年（1592 年），早年随父作战，是四大贝勒之一。天命十一年（1626 年）努尔哈赤去世，皇太极被推举为汗，次年改元天聪。即位之初，他与代善、阿敏、莽古尔泰三大贝勒并坐受朝，此后他逐渐削弱诸贝勒的权力，把大权集中到自己手中。

  皇太极调整了对汉人的政策，把一部分汉人编为民户，由汉官管理，重用范文程、宁完我等汉族文人，仿照明朝设立六部，又组建汉军八旗。他先后征服了朝鲜和漠南蒙古，天聪九年（1635 年）蒙古察哈尔部林丹汗的儿子额哲投降，献上元朝的传国玉玺（据说如此）。同年他下令把族名“诸申”（女真）改为“满洲”。天聪十年（1636 年）他在盛京即皇帝位，改国号为“大清”，改元崇德（另见“皇太极改国号大清”条）。同年冬他亲征朝鲜，朝鲜国王仁祖出城投降，断绝与明朝的宗藩关系，改奉清朝为宗主。

  对明朝，皇太极多次绕过山海关，从蒙古地区攻入长城，深入华北劫掠。崇祯二年（1629 年）他率军直逼北京，袁崇焕随后被崇祯帝处死（另见“己巳之变”条）。此后清军又四次入关，最远打到山东。崇祯十三年（1640 年）起清军围攻锦州，崇祯十五年（1642 年）在松山击溃明朝蓟辽总督洪承畴所率的明军（史称十三万），洪承畴被俘投降，锦州守将祖大寿也献城出降，明朝在关外的防线基本瓦解（另见“松锦之战”条）。

  崇德八年（1643 年）八月皇太极在盛京突然去世，年五十二岁，没有指定继承人。经过诸王的争夺，他的第九子、六岁的福临即位，由多尔衮和济尔哈朗辅政。次年清军入关。清朝追尊他为太宗。
sources: []
