name: 穆米乌斯
aliases: [卢基乌斯·穆米乌斯, 亚该亚征服者穆米乌斯]
role: 罗马执政官
summary: 罗马执政官，击溃亚该亚同盟，奉元老院之命毁灭科林斯。
body: |-
  卢基乌斯·穆米乌斯，罗马平民出身的将领，家族中第一个做到执政官的人，生卒年不详。公元前 153 年他任大法官，管辖远西班牙，起初被卢西塔尼亚人击败，后来扭转战局，回国举行了凯旋式。

  前 146 年他任执政官，奉派到希腊接手对亚该亚同盟的战争。此前驻马其顿的梅特卢斯已在希腊中部击败同盟军队。穆米乌斯到达科林斯地峡后，击溃了同盟将军狄埃乌斯仓促拼凑、包含被释奴隶的军队。按照元老院的命令，科林斯的男子被杀，妇女儿童被卖为奴，城市被焚毁。他随后与十人使团一起处置希腊事务：解散各城同盟，扶持富有者执政，希腊由驻马其顿的总督监管。据波利比乌斯，他本人在处置中表现得克制而廉洁。

  科林斯的大量艺术品被运往罗马和意大利各城。古代作家拿他的外行取笑：维莱伊乌斯说，他同承运商订约，雕像绘画如有损毁，须以新的赔偿。他没有把战利品据为己有，用它们装饰罗马和各地的神庙，自己得到“亚该亚征服者”的称号。前 142 年他与小西庇阿同任监察官，两人作风一宽一严，合作并不融洽。此后不见记载。
sources: []
recalled:
