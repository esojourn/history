name: 克里昂米尼一世
aliases: [克列欧美涅斯]
role: 斯巴达国王
summary: 斯巴达阿基斯家族的国王，驱逐雅典僭主希庇亚斯，屡次干预各邦事务。
body: |-
  斯巴达有两个并立的王室，克里昂米尼属阿基斯家族，是国王阿那克桑德里达斯的长子，约公元前 520 年继位。他的事迹见于希罗多德，希罗多德对他的评价不高，说他近于疯狂。

  前 510 年，他应德尔斐神谕的一再催促，率军进入阿提卡，把僭主希庇亚斯赶出雅典。两三年后他又应伊萨哥拉斯之请再去雅典，驱逐克里斯提尼一派，结果被雅典民众围困在卫城上，两天后被迫撤走。前 499 年，米利都的阿里斯塔哥拉斯带着一幅刻有世界地图的铜板来求援，想说动斯巴达出兵波斯；听说从海边到波斯都城要走三个月，他便下了逐客令。希罗多德说，阿里斯塔哥拉斯转而行贿，价码越开越高，他八九岁的女儿戈尔戈在旁说：“父亲，你再不走开，这个外邦人就要把你败坏了。”

  约前 494 年，他在塞佩亚大败阿尔戈斯。前 491 年，他买通德尔斐的女祭司，废黜了与他不和的另一位国王德玛拉托斯。事情败露后他逃离斯巴达，被召回不久就发了疯。据希罗多德，他被亲属关押起来，向看守要了一把刀，从小腿起把自己割成碎条而死。继位的是异母弟列奥尼达，戈尔戈嫁给了列奥尼达。
sources: []
recalled:
  - 希罗多德《历史》卷五第 39—51、62—76 章；卷六第 50—84 章
