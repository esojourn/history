name: 魏惠王
aliases: [梁惠王, 魏罃, 魏惠成王]
role: 魏国国君
summary: 魏国国君，迁都大梁，桂陵、马陵两败于齐，曾与孟子论“义利”。
body: |-
  魏惠王名罃，是魏武侯之子，生于公元前 400 年。武侯死后，他与公子缓争位，几乎亡国，最后在公元前 369 年即位，在位五十年，死于前 319 年。《史记·魏世家》对他的纪年有误，今人据《竹书纪年》订正。因为他把都城从安邑迁到大梁（今河南开封），魏国又称梁国，他也被称为梁惠王。

  惠王继承了文侯、武侯留下的强国，前期四出征伐，一度称霸。公元前 354 年魏围赵都邯郸，齐国派田忌、孙膑救赵，次年在桂陵击败魏军；公元前 342 年魏攻韩，齐军再次出兵，在马陵大败魏军，魏太子申被俘，大将庞涓战死。此后秦国在西面不断进攻，魏国被迫献出河西之地。公元前 334 年，他与齐威王在徐州相互承认为王，史称“徐州相王”。

  晚年的惠王招揽贤士，孟子曾到大梁见他。《孟子》开篇即记惠王问孟子：“叟不远千里而来，亦将有以利吾国乎？”孟子回答：“王何必曰利？亦有仁义而已矣。”惠王对孟子说起魏国“东败于齐，长子死焉；西丧地于秦七百里；南辱于楚”，希望洗雪耻辱。名家惠施曾长期任他的相。

  据《竹书纪年》佚文，惠王时引黄河水入圃田泽，又开大沟引圃田之水东通大梁，这就是后来连接黄河与淮河水系的鸿沟的前身。
sources: []
recalled:
  - 《史记·魏世家》
  - 《孟子·梁惠王上》
  - 《竹书纪年》（佚文）
