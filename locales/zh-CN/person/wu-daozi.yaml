name: 吴道子
aliases: [吴道玄, 画圣]
role: 画家
summary: 盛唐画家，擅长佛道人物和壁画，笔法圆转飘动，后世尊为“画圣”。
body: |-
  吴道子是阳翟人，生卒年不详。据张彦远的《历代名画记》，他年少时孤贫，曾跟随张旭、贺知章学习书法，没有学成，转而学画，很早就有了名声。他曾在地方任小吏，后来玄宗听说他的名声，召他入宫任内教博士，为他改名道玄，并规定没有诏令不得作画。

  他擅长画佛道人物、鬼神和山水，在长安、洛阳的寺观中画了大量壁画，据唐人记载有数百间之多。他的用笔圆转有力，线条粗细富于变化，画中人物的衣带像被风吹起，后世称为“吴带当风”。据朱景玄的《唐朝名画录》，玄宗曾命他到蜀中描绘嘉陵江山水，他回来后只用一天就在大同殿的墙壁上画完了三百多里的嘉陵江风光，而李思训画同一题材用了几个月；这则故事出自唐人笔记，带有传说色彩。

  他的真迹今天已经没有可靠的传世作品，传为他所作的《送子天王图》一般认为是宋代的摹本。后世画工尊他为祖师，称他为“画圣”。
sources: []
recalled:
  - 张彦远《历代名画记》卷九
  - 朱景玄《唐朝名画录》
