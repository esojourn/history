name: 武则天
aliases: [武曌, 武后, 则天大圣皇帝, 天后]
role: 皇帝（武周）
summary: 唐高宗的皇后，690 年称帝改国号为周，是中国历史上唯一正式称帝的女性。
body: |-
  武则天的父亲武士彟是并州文水人，早年经营木材，曾资助李渊起兵，唐初任工部尚书、利州都督、荆州都督。她的生年一般据卒年推算为公元 624 年，出生地有长安、利州等说法。贞观十一年（637 年）她十四岁时被选入宫，为太宗的才人，赐号武媚。太宗去世后，她按惯例入感业寺为尼。

  高宗即位后不久把她召回宫中，封为昭仪。永徽六年（655 年）高宗废王皇后，立她为皇后（另见“废王立武”条）。此后她逐步参与朝政，高宗患病后由她决断政事，与高宗并称“二圣”。弘道元年（683 年）高宗去世，中宗李显即位，次年二月她废中宗为庐陵王，改立幼子李旦（睿宗），自己临朝称制。

  这一年徐敬业在扬州起兵反对她，骆宾王为之起草檄文，不到三个月即被平定；垂拱四年（688 年）唐宗室越王李贞、琅邪王李冲起兵，也很快失败。她设置铜匦接受告密，任用来俊臣、周兴等酷吏审讯大臣和宗室，许多人被杀。天授元年（690 年）九月，她改国号为周，即皇帝位，以洛阳为神都，睿宗降为皇嗣，赐姓武（另见“武则天称帝”条）。

  她在位期间重视科举，扩大进士科的录取，亲自在洛城殿策问贡士，又设立武举；她提拔了狄仁杰、姚崇、宋璟等人，也重用武氏子弟和张易之、张昌宗兄弟。圣历元年（698 年），在狄仁杰等人的劝说下，她召回庐陵王李显，立为太子，确定了身后由李家继承。她崇信佛教，在龙门奉先寺营造大像（另见“龙门奉先寺大佛”条），又自造“曌”等新字。

  神龙元年（705 年）正月，宰相张柬之等人发动政变，杀张易之兄弟，逼她传位给中宗，恢复唐的国号（另见“神龙政变”条）。同年十一月她在洛阳上阳宫去世，年八十二（另有八十一、八十三之说）。遗制去掉帝号，称则天大圣皇后，与高宗合葬乾陵。乾陵前为她立的石碑没有刻字，后世称“无字碑”。
sources: []
recalled:
  - 《旧唐书·则天皇后纪》
  - 《新唐书·则天皇后纪》
  - 《资治通鉴》卷一百九十九至二百八
