name: 司马颖
aliases: [成都王颖, 司马章度]
role: 成都王
summary: 晋武帝第十六子，镇邺城，一度以皇太弟遥控朝政，荡阴之战后失势被杀。
body: |-
  司马颖字章度，是晋武帝的第十六子，封成都王，元康末年出镇邺城。永宁元年（公元 301 年）他响应齐王冏讨伐赵王伦，事成后听从谋士卢志的建议，把功劳让给齐王，自己回到邺城，并出粮赈济饥民、收葬阵亡将士，一时很得人心。

  太安二年（303 年），他与河间王颙联兵进攻在洛阳执政的长沙王乂，任用陆机为前锋都督，兵败后听信谗言杀了陆机。次年长沙王乂死，他入洛阳后又回邺城，被立为皇太弟，任丞相，在邺城遥控朝廷。《晋书》本传说他这时日益骄奢，信任宦官孟玖，大失众望。

  永兴元年（304 年）七月，东海王越奉惠帝北征，他在荡阴击败王师，把惠帝带进邺城。不久幽州的王浚等人引鲜卑、乌桓兵来攻，他带着惠帝逃回洛阳，落入河间王部将张方手中，被废去皇太弟的名号。此后他辗转流亡，光熙元年（306 年）被捕，在邺城的狱中被缢杀，时年二十八。
sources: []
recalled:
  - 《晋书·成都王颖传》
  - 《资治通鉴》卷八十四至八十六
