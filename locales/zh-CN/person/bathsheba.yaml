name: 拔示巴
aliases:
  - 拔书亚
role: 大卫的妻子、所罗门的母亲
summary: 原为赫人乌利亚之妻，后归大卫，生所罗门，并助他继承王位。
body: |-
  拔示巴是以连的女儿，赫人乌利亚的妻子（《撒母耳记下》11:3）；《历代志上》3:5 把她的名字写作拔书亚，父亲写作亚米利。圣经没有记载她的生年和卒年。

  据《撒母耳记下》第 11 章，以色列军围攻亚扪人的拉巴，大卫留在耶路撒冷。一天傍晚他在王宫的平顶上看见拔示巴沐浴，就差人把她接来同房，她怀了孕。大卫把乌利亚从前线召回，乌利亚却不肯回家；大卫于是写信给约押，要他把乌利亚派到阵势极险的地方，乌利亚就阵亡了。哀哭的日子过了，大卫把她接到宫里作妻子，她生了一个儿子。第 12 章记载，先知拿单为这事责备大卫，那孩子得了重病，到第七日死了。后来拔示巴又生了所罗门。

  《列王纪上》第 1 章记载，大卫年纪老迈，亚多尼雅自立为王。拿单叫拔示巴进去见王，提醒大卫曾经起誓让所罗门接续作王，拿单随后也进去证实；大卫当即吩咐让所罗门受膏。所罗门登基以后，亚多尼雅托拔示巴向王求娶书念女子亚比煞。所罗门起来迎接母亲，为她设座在右边，却没有答应，并在当日处死了亚多尼雅（2:13–25）。《马太福音》1:6 的家谱提到她，称为乌利亚的妻子。
sources: []
recalled:
  - 《撒母耳记下》第 11—12 章
  - 《列王纪上》第 1—2 章
  - 《历代志上》第 3 章
  - 《马太福音》第 1 章
