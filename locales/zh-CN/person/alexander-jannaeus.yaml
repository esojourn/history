name: 亚历山大·雅纳
aliases: [雅纳, 亚历山大·詹尼亚斯]
role: 犹太国王、大祭司
summary: 约翰·许尔堪之子，哈斯蒙尼国王兼大祭司，在位时疆土最广，内乱不断。
body: |-
  约翰·许尔堪的儿子。据约瑟夫斯《犹太古史》卷 13，他不受父亲喜爱，自幼在加利利长大。兄长阿里斯托布鲁斯一世即位后把几个兄弟囚禁起来；公元前 103 年阿里斯托布鲁斯在位一年病死，遗孀放出他们，立雅纳为王。

  他在位二十七年，大半时间都在打仗。即位之初他围攻沿海的多利买城，引来塞浦路斯的托勒密九世出兵，雅纳在约旦河附近大败；后来他攻取加沙，又在约旦河东和沿海夺得许多城邑，其间也曾败于拿巴提人。到他去世时，哈斯蒙尼王国的疆域达到最大。

  他与国内民众、尤其是法利赛人关系恶劣。约瑟夫斯记，有一年住棚节他在祭坛前供职，众人用手中的香橼掷他，他出动军队镇压。其后内乱持续约六年，反对者请来塞琉古王德米特里三世，在示剑附近打败雅纳。雅纳重新得势后，据约瑟夫斯记载，把八百名俘虏钉在十字架上，并在他们眼前杀死其妻儿。前 76 年他在围攻约旦河东的拉迦巴要塞时病死，据约瑟夫斯终年四十九岁，王位传给妻子亚历山德拉。
sources: []
recalled:
  - 约瑟夫斯《犹太古史》卷 13 第 12—15 章
  - 约瑟夫斯《犹太战记》卷 1 第 4 章
