name: 燕太子丹
aliases: [太子丹, 姬丹]
role: 燕国太子
summary: 燕王喜的太子，曾在秦为质，逃回后派荆轲刺秦王；事败后燕王喜斩其首献秦。
body: |-
  太子丹是燕王喜的儿子，生年不详。据《史记·刺客列传》，他早年在赵国做人质，与同在邯郸出生长大的嬴政交好。嬴政做了秦王，太子丹又到秦国做人质，秦王待他不好，他心怀怨恨，于公元前 232 年逃回燕国。

  此时秦国连年出兵蚕食东方各国，兵锋逐渐逼近燕国。太子丹想报复秦国，向太傅鞠武请教。鞠武主张西约三晋、南连齐楚、北与匈奴讲和，太子丹认为旷日持久，等不及。秦将樊於期得罪秦王逃到燕国，太子丹收留了他，鞠武劝他把樊於期送往匈奴以免招祸，太子丹不肯。鞠武推荐了隐士田光，田光又推荐了荆轲。太子丹嘱咐田光不要泄露机密，田光为表明自己不会泄密而自杀。

  太子丹尊荆轲为上卿，供给他车骑美女，又用百金买来赵人徐夫人的匕首，淬上毒药，以勇士秦舞阳为副手。公元前 227 年，荆轲带着樊於期的首级和燕国督亢的地图入秦，太子丹和知道此事的宾客都穿着白衣白帽在易水边送行。刺杀失败后，秦王大怒，派王翦攻燕，次年攻破燕都蓟，燕王喜和太子丹率精兵退守辽东。秦将李信追击，代王嘉写信劝燕王喜杀太子丹献给秦国以求罢兵。据《史记》，太子丹藏在衍水之中，燕王喜派人斩了他的首级献给秦国。秦军仍未停止，公元前 222 年燕国灭亡。

  汉代以后流传的《燕丹子》一书演绎了许多太子丹与荆轲的故事，如“乌头白、马生角”之类，属于小说家言。
sources: []
recalled:
  - 《史记·刺客列传》
  - 《史记·燕召公世家》
  - 《战国策·燕策三》
