name: 押沙龙
aliases: []
role: 大卫之子
summary: 大卫第三子，杀兄暗嫩后逃亡，又起兵反叛父亲，兵败被约押所杀。
body: |-
  押沙龙是大卫的第三个儿子，生在希伯仑，母亲玛迦是基述王达买的女儿（《撒母耳记下》3:3）。圣经没有给出他出生和去世的年份。14:25–26 说以色列全地没有人像他那样俊美，他每到年底剪发一次，所剪下的头发按王的平称有二百舍客勒。

  据《撒母耳记下》第 13 章，大卫的长子暗嫩玷辱了押沙龙的同母妹妹他玛。过了二年，押沙龙趁剪羊毛的时候请王的众子赴席，吩咐仆人杀了暗嫩，自己逃到基述，在那里住了三年。约押设法使大卫准他回耶路撒冷，又过了二年他才得见父亲的面（第 14 章）。

  第 15 章记载，押沙龙常站在城门的道旁，向前来求王判断的人示好，得了以色列人的心。后来他借口还愿前往希伯仑，在那里称王。大卫带着臣仆离开耶路撒冷，押沙龙进了城。两军在以法莲树林交战，押沙龙的军队战败，据 18:7 阵亡的有二万人。押沙龙骑着骡子从大橡树的密枝底下经过，被树枝挂住，悬在半空；约押不顾大卫的嘱咐，把他刺死，尸首丢在林中一个大坑里，上面堆起一大堆石头。大卫听到消息，上城门楼去哀哭。
sources: []
recalled:
  - 《撒母耳记下》第 3 章、第 13—19 章
