name: 军臣单于
aliases: [军臣]
role: 匈奴单于
summary: 老上之子。在位三十余年，与汉时和时战，经历马邑之谋。
body: |-
  军臣单于是老上单于之子，生年不详，约在公元前 161 年或前 160 年继立。汉文帝后元六年（前 158 年）冬，匈奴以各三万骑攻入上郡、云中，数月后退去。景帝时与匈奴和亲，通关市，遣公主，终景帝之世只有小规模入边。

  元光二年（前 133 年），汉朝以马邑城为饵引诱单于，伏兵三十余万；军臣率十万骑入武州塞，见牲畜遍野而无人放牧，生疑，俘获雁门尉史得知实情，引兵退回。此后匈奴断绝和亲，屡攻边塞。元朔二年（前 127 年）卫青夺取河南地，其后的冬天军臣去世，通常系于前 126 年；弟伊稚斜击败太子於单，自立为单于。
sources:
  - 《史记·匈奴列传》 https://zh.wikisource.org/wiki/史記/卷110
