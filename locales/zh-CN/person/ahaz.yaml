name: 亚哈斯
aliases: []
role: 南国犹大王
summary: 犹大王，受亚兰和以色列夹攻时向亚述称臣求援，并仿造大马色的祭坛。
body: |-
  犹大王约坦的儿子。据《列王纪下》16:2，他登基时二十岁，在耶路撒冷作王十六年。《列王纪》说他行以色列诸王所行的道，使他的儿子经火，并在丘坛上、山冈上、各青翠树下献祭烧香（16:3–4）。

  他在位时，亚兰王利汛和以色列王比加上来攻打耶路撒冷，围困亚哈斯，却不能取胜（16:5）。据《以赛亚书》第 7 章，先知以赛亚奉命去见亚哈斯，叫他不要因这两个王惧怕，并给他以马内利的兆头。亚哈斯却差使者去见亚述王提革拉毗列色，自称是他的仆人、他的儿子，把圣殿和王宫府库里的金银送去作礼物；亚述王于是攻取大马色，杀了利汛（《列王纪下》16:7–9）。亚哈斯到大马色迎接亚述王，看见那里的一座坛，就把坛的样式送给祭司乌利亚，叫他照样建造，又把原来的铜坛挪开（16:10–16）。亚述王提革拉毗列色三世的一份纳贡名单里有犹大的“约哈斯”，一般认为就是亚哈斯。

  《历代志下》第 28 章另记，比加在犹大杀人甚多，掳走许多妇孺，经先知俄德劝说，以色列人才把被掳的人送到耶利哥放回；以东人和非利士人也来侵扰。28:24 说亚哈斯封锁了圣殿的门。他死后葬在耶路撒冷城里，没有送入以色列诸王的坟墓（28:27），儿子希西家接续作王。
sources: []
recalled:
