name: "范拉尔特"
aliases: ["范饶特", "阿尔贝图斯·范拉尔特"]
role: "荷兰分离派牧师，密歇根霍兰的创建者"
summary: "1847 年带荷兰移民定居密歇根西部，建霍兰城，1850 年加入美国改革宗。"
body: |-
  《历史的轨迹》第四十五章说，欧洲大移民潮带来许多荷兰人，很多教会是全体信徒和牧师一同移民。范拉尔特牧师带领的一群人 1847 年定居在密歇根西部，称那地为霍兰，1850 年加入美国改革宗教会；另一群由舒尔特牧师率领，定居在艾奥瓦中部的佩拉。

  书中说，在密歇根定居的改革宗信徒中，有一批人对太快加入美国改革宗教会和教会的一些作风非常不满，从 1850 到 1857 年不满日增：批评用东部的诗歌，质疑“临时会员制”和“公开圣餐”，抱怨信仰问答教导、慕道班和探访的疏忽；最后的争论起因于范拉尔特向人介绍巴克斯特的《呼吁未信者》，有人批评此书带有亚米念主义的看法。1857 年分出的人组成了基督徒改革宗教会。

  据一般记载，范拉尔特 1811 年生于荷兰上艾瑟尔省，在莱顿读神学，参加了 1834 年脱离荷兰国家教会的“分离运动”，因此受过罚款和监禁；1846 年他带领移民赴美，次年建立霍兰，后来创办了霍普学院的前身。他 1876 年在霍兰去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
