name: 宋仁宗
aliases: [赵祯, 赵受益]
role: 北宋皇帝
summary: 宋真宗之子，在位四十余年，是北宋在位最久的皇帝，经历宋夏战争与庆历新政。
body: |-
  宋仁宗赵祯是宋真宗的第六子，大中祥符三年（公元 1010 年）生于开封，生母是宫人李氏，自幼由刘皇后抚养。乾兴元年（1022 年）真宗去世，他十三岁即位，由刘太后临朝听政。明道二年（1033 年）刘太后去世，他才亲政，也是在这时才知道自己的生母是已经去世的李宸妃。后世戏曲小说里的“狸猫换太子”故事由此附会而来，并非史实。

  亲政以后边患加剧。宝元元年（1038 年）党项首领李元昊称帝，建立夏国，宋夏随即开战，宋军在三川口、好水川、定川寨接连失利，直到庆历四年（1044 年）才议和（另见“宋夏战争”条）。辽朝乘机索要关南土地，庆历二年（1042 年）富弼出使辽朝，以增加岁币了结此事。内外交困之下，仁宗在庆历三年（1043 年）起用范仲淹、富弼、韩琦等人推行改革，但新政触动了许多官员的利益，一年多后就停止了（另见“庆历新政”条）。

  仁宗性格宽厚，能够容纳批评，在位期间名臣辈出，范仲淹、韩琦、富弼、包拯、欧阳修等人都在朝中任职；嘉祐二年（1057 年）欧阳修主持的科举，录取了苏轼、苏辙、曾巩、程颢等人。这一时期宋代的学术、文学都很兴盛，民间也流行由官府发行的纸币“交子”（另见“官交子发行”条）。另一方面，官员和军队的人数不断增长，财政负担越来越重，这成为下一代变法的背景。

  仁宗的几个儿子都早夭，他晚年在大臣的催促下以堂兄濮王赵允让之子赵宗实为继承人，赐名赵曙。嘉祐八年（1063 年）三月仁宗去世，在位四十一年多，是北宋在位时间最长的皇帝。
sources: []
