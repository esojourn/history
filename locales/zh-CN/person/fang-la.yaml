name: 方腊
aliases: [圣公]
role: 北宋末年起义首领
summary: 北宋末年两浙起义的首领，1120 年在睦州起兵，攻占杭州等地，次年兵败被杀。
body: |-
  方腊是睦州青溪人，生年不详。据宋人记载，他家有漆园，当时朝廷为宫中营建搜罗东南的奇花异石，设有“花石纲”，又有造作局等机构摊派漆、竹等物，青溪一带的百姓深受其害。宣和二年（1120 年）十月，方腊聚众起事，自称“圣公”，建年号永乐，设置官职。史称他的部众以摩尼教（明教）的信徒为骨干，但这种说法也有不同意见。

  起义军先后攻下睦州、歙州、杭州等地，两浙一带纷纷响应，据《宋史》，共攻陷六州五十二县。宋徽宗派童贯率领原定北伐辽朝的西北军南下镇压。宣和三年（1121 年）四月，方腊在青溪的帮源洞被宋军俘虏，同年八月在开封被处死（另见“方腊起义”条）。
sources: []
recalled:
  - 《宋史·徽宗本纪》
  - 《宋史·宦者传·童贯》
  - 方勺《青溪寇轨》
