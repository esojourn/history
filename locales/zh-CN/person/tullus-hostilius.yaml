name: 图卢斯·霍斯提利乌斯
aliases: [图鲁斯·荷斯提里乌斯]
role: 传说中的罗马第三位国王
summary: 传说中的罗马第三位国王，以好战著称，相传毁灭了母邦阿尔巴隆加。
body: |-
  相传为罗马第三位国王，传统上定在公元前 673 年至前 642 年在位。李维说他的祖父霍斯图斯·霍斯提利乌斯曾在罗慕路斯时与萨宾人作战阵亡。与前任努马相反，他以好战著称。

  他在位时最有名的事是与母邦阿尔巴隆加的战争。据李维，双方约定各出三名孪生兄弟决斗以定胜负，罗马的荷拉提乌斯三兄弟对阿尔巴的库里亚提乌斯三兄弟；荷拉提乌斯兄弟死了两个，剩下的一个佯装逃跑，把追来的三名对手逐一杀死。阿尔巴由此臣服。后来阿尔巴的首领梅提乌斯·富斐提乌斯在战场上观望不前，图卢斯把他处以车裂，拆毁阿尔巴隆加，把居民迁到罗马的凯里乌斯山，阿尔巴的几家贵族进入元老院，据说其中有尤利乌斯家族。传说他还建了元老院议事堂，后世称“霍斯提利乌斯议事堂”。

  李维记载，他晚年遇到瘟疫，转而迷信，在举行祭仪时出了差错，被雷电击中，连同房屋一起烧毁。另一说是继任者安库斯·马尔基乌斯谋害了他。
sources: []
recalled:
  - 李维《建城以来史》卷一
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷三
