name: 希伦二世
aliases: [希耶隆二世]
role: 叙拉古国王
summary: 叙拉古国王，在位五十余年，第一次布匿战争起就是罗马的盟友，阿基米德为他效力。
body: |-
  叙拉古人，约生于公元前 308 年，父亲是贵族，母亲据说是女奴。他在皮洛士征战西西里时任军官。前 275 年皮洛士离去后，叙拉古的军队推他为将军，他娶了城中显贵之女，地位得到公民承认。

  占据墨西拿的坎帕尼亚雇佣兵“马麦尔提尼人”四出劫掠。希伦在隆伽努斯河边将他们击败（年份有前 269 年和前 265 年两说），叙拉古人因此拥他为王。前 264 年马麦尔提尼人向罗马求助，罗马军队渡过海峡，这是罗马第一次出兵海外。希伦起初与迦太基联手围攻墨西拿，战败后退回叙拉古。前 263 年罗马大军压境，他转而与罗马订约，赔款一百塔兰特，保有西西里东南一隅。此后他始终守约，在第一次布匿战争中供给罗马军粮和攻城器械。

  他在位期间叙拉古没有再遭战祸。他按收成抽取十分之一的税制，后来被罗马人沿用为西西里行省的征税办法，称“希伦法”。他扩建了叙拉古的剧场，修了一座长近二百米的大祭坛，遗迹尚存。数学家阿基米德是他的亲戚或朋友，为他设计城防器械；检验王冠是否掺银、一个人拉动大船下水等有关阿基米德的故事，都以他为背景。据阿特奈奥斯，他造过一艘巨大的运粮船“叙拉古号”，因为没有港口容得下，送给了埃及的托勒密。

  前 218 年第二次布匿战争爆发，他照旧支援罗马。前 216 年坎尼惨败之后，他送去粮食、弓手和一尊黄金的胜利女神像。前 215 年他去世，年约九十，儿子已先他而死，十五岁的孙子希罗尼穆斯继位，倒向迦太基，次年被刺；叙拉古随后被罗马围攻，前 212 年陷落，阿基米德死于城破之时。
sources: []
recalled:
