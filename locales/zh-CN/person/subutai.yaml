name: 速不台
aliases: [速别额台]
role: 蒙古帝国将领
summary: 蒙古帝国名将，两次西征远至罗斯和匈牙利，又主持攻取汴京。
body: |-
  速不台是兀良合部人，生于 1176 年，父亲是铁木真早年的追随者，他少年时就在铁木真帐下效力，与者勒蔑、哲别、忽必来并称“四狗”，以骁勇善战著称。统一蒙古的战争中，他曾奉命追击蔑儿乞部的残余，到 1217 年前后在西方的垂河一带将其消灭。

  1219 年随成吉思汗西征花剌子模，他与哲别率军追击花剌子模国王摩诃末，直到里海。此后两人继续西进，越过高加索山，1223 年在迦勒迦河畔击败罗斯诸公和钦察的联军，然后东返与大军会合（另见“蒙古第一次西征”条）。1232 年他随窝阔台攻金，在三峰山之战后主持围攻汴京，次年迫使汴京投降。据《元史·耶律楚材传》，他曾奏请破城后屠城，被耶律楚材劝阻。

  1235 年起他辅佐拔都西征，是这次远征实际上的主要指挥者，转战钦察、罗斯，1241 年又在匈牙利赛约河畔击败匈牙利国王的军队（另见“蒙古第二次西征”条）。西征结束后他回到蒙古，1248 年去世。他的儿子兀良合台后来随忽必烈远征大理，又从云南北上攻宋。速不台一生转战于蒙古高原、中原、中亚和东欧，是蒙古帝国最重要的将领之一，《元史》有他的传记。
sources: []
recalled:
  - 《元史·速不台传》
  - 《元朝秘史》
