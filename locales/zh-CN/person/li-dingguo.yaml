name: 李定国
aliases: [晋王]
role: 大西军将领，南明抗清名将
summary: 张献忠养子，联明抗清，1652 年在桂林、衡州大败清军。
body: |-
  李定国是陕西人，一说延安，一说榆林。他少年时参加张献忠的起义军，被张献忠收为养子，与孙可望、刘文秀、艾能奇并称“四将军”，以作战勇敢著称。顺治三年（1646 年）张献忠战死后，他们率领大西军余部转入贵州、云南，在云南建立了根据地。

  顺治八年（1651 年）前后，孙可望与南明永历政权联合，次年把永历帝迎到贵州安龙。顺治九年（1652 年）李定国率军东出，攻入广西，攻破桂林，清朝定南王孔有德自焚而死；随后他又北上湖南，在衡州设伏，击毙清朝的敬谨亲王尼堪。这是清军入关后在战场上遭受的最大挫败之一，据说黄宗羲称之为“两蹶名王”。

  此后孙可望嫉妒李定国的功劳，两人发生冲突。顺治十三年（1656 年）李定国把永历帝从安龙迎到昆明，次年孙可望举兵进攻昆明，被李定国击败，随后投降清朝。大西军的内讧大大削弱了抗清的力量。顺治十五年（1658 年）清军三路进攻云南，次年李定国在磨盘山设伏，未能挡住清军，永历帝逃入缅甸。

  此后李定国在滇缅边境坚持作战，多次试图迎回永历帝，都没有成功。康熙元年（1662 年）他得知永历帝被吴三桂杀害，悲愤成疾，同年六月在勐腊病逝。临终前据说嘱咐儿子宁死荒野，不要投降。
sources: []
recalled:
  - 《明史·李定国传》（附于《张献忠传》）
  - 刘彬《晋王李定国列传》
  - 顾诚《南明史》
