name: 以扫
aliases: [以东]
role: 以东人的始祖
summary: 以撒的长子，雅各的孪生哥哥，以东人的始祖。
body: |-
  以撒和利百加的长子，与雅各是双生。《创世记》25:25 说他出生时身体发红，浑身有毛。他长大后善于打猎，常在田野，以撒爱他（25:27—28）。有一次他从田野回来疲乏，为了饼和红豆汤，起誓把长子的名分卖给雅各，他因此又叫以东（25:29—34）。据创 26:34，他四十岁时娶了两个赫人女子为妻，以撒和利百加因此心里愁烦。

  以撒年老时叫他去打猎，预备美味，好给他祝福；他回来时福已被雅各得去，他放声痛哭，求父亲也为他祝福。他怀恨雅各，打算等父亲死后杀他（第 27 章）。他见父亲不喜欢迦南的女子，又娶了以实玛利的女儿玛哈拉（28:6—9）。

  雅各在拉班家住了二十年后回来，他带着四百人来迎，跑上去抱住雅各，两人都哭了；他起初不肯收雅各的礼物，雅各再三请求才收下，随后回西珥去（第 33 章）。以撒去世时，他和雅各一同安葬父亲（35:29）。第 36 章记他因财物、牲畜太多，与雅各分开，住在西珥山，并列出他的后代和以东的族长、君王。圣经没有记他的寿数和去世的经过。
sources: []
recalled:
  - 《创世记》第 25—28 章、第 32—33 章、35:29、第 36 章
