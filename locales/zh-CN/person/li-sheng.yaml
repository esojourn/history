name: 李晟
aliases: [西平郡王]
role: 神策军将领
summary: 唐德宗时的名将，泾原兵变后率军收复长安，封西平郡王，李愬之父。
body: |-
  李晟是洮州临潭人，开元十五年（公元 727 年）生，少年从军，在陇右与吐蕃作战，以善射闻名。后来他成为神策军的将领，大历年间多次击败入侵的吐蕃和南诏军队。

  建中四年（783 年），他奉命在河北征讨成德、魏博等叛乱藩镇。同年泾原兵变，唐德宗出逃奉天，他率军回援，驻扎在东渭桥。次年朔方节度使李怀光反叛，与朱泚勾结，他孤军处在两股叛军之间，仍然整顿军队，安抚百姓。兴元元年（784 年）五月，他率军攻入长安，打败朱泚，据史书，他号令严明，军队入城后秋毫无犯（另见“泾原兵变”条）。德宗回京后，封他为西平郡王，绘像于凌烟阁。

  此后他任凤翔、陇右节度使，对付吐蕃。吐蕃大相尚结赞忌惮他，用反间计，加上宰相张延赏与他不和，德宗解除了他的兵权，让他回京任太尉。贞元九年（793 年）他在长安去世，年六十七。他的儿子中，李愬在宪宗时雪夜袭取蔡州，最为知名。
sources: []
recalled:
  - 《旧唐书·李晟传》
  - 《新唐书·李晟传》
  - 《资治通鉴》卷二百二十八至二百三十二
