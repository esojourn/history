name: 汉章帝
aliases: [刘炟, 肃宗]
role: 皇帝
summary: 东汉第三位皇帝，为政宽厚，曾召集诸儒在白虎观讨论五经异同。
body: |-
  据《后汉书·章帝纪》，章帝名炟，是明帝的第五子，由马皇后抚养长大。永平十八年（公元 75 年）即位，先后用建初、元和、章和三个年号。《后汉书》记他死时三十三岁，按此推算生于公元 56 年或 57 年。

  与明帝的严察不同，章帝为政宽厚。他采纳陈宠等人的建议，废除一批严酷的刑罚条文，又多次下诏减轻赋役、鼓励垦田。建初四年（79 年），他下诏让诸儒在白虎观讨论五经的异同，亲自裁决，讨论的结果由班固整理成《白虎通义》。元和二年（85 年）改行四分历。

  章帝在位时，窦皇后一家开始得势。章和二年（88 年）章帝去世，十岁的和帝即位，窦太后临朝，外戚窦宪兄弟掌权。后人常把明帝、章帝两朝并称，视为东汉较为安定的时期。
sources: []
recalled:
  - 《后汉书·肃宗孝章帝纪》
