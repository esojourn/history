name: 北周武帝
aliases: [宇文邕, 祢罗突, 周高祖]
role: 皇帝
summary: 北周皇帝，诛杀权臣宇文护后亲政，下诏禁断佛道二教，577 年灭北齐。
body: |-
  宇文邕字祢罗突，宇文泰的第四子，大统九年（公元 543 年）生于同州。武成二年（560 年），宇文护毒死周明帝，立他为帝。此后十二年，他对宇文护处处恭顺，不露声色。天和七年（572 年），他亲手击倒宇文护，命弟弟宇文直将其杀死，从此亲政。

  亲政后，他整顿吏治，多次下诏把官私奴婢和杂户放免为平民，又扩充府兵，招募均田农户当兵，据《隋书·食货志》，此后“夏人半为兵矣”。建德三年（574 年），他下诏同时禁断佛、道二教，令僧尼、道士还俗，寺观的财产没收入官，另设通道观研究三教的义理（另见“北周武帝灭佛”条）。他生活节俭，平时穿布衣，宫中不用金玉装饰。

  建德四年（575 年），他第一次出兵伐齐，因病撤回。次年再次出兵，攻克平阳，在城下大败北齐后主的援军，随即攻破晋阳，建德六年（577 年）正月攻入邺城，北齐灭亡，北方重新统一（另见“北周灭北齐”条）。他又在原北齐境内推行禁佛的政策。同年，他派兵在吕梁全歼陈朝吴明彻的北伐军，夺回淮北之地。

  宣政元年（578 年），他亲率大军北伐突厥，途中病重，回到云阳去世，年三十六。太子宇文赟即位，即周宣帝，荒淫无度，次年把皇位传给七岁的儿子宇文阐，580 年去世。外戚杨坚由此掌握大权，第二年代周建隋。
sources: []
recalled:
  - 《周书·武帝纪》
  - 《资治通鉴》卷一百六十八至一百七十三
