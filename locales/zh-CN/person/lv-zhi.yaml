name: 吕后
aliases:
  - 吕雉
  - 吕太后
  - 高后
role: 皇后，临朝称制
summary: 汉高祖皇后。惠帝死后临朝称制八年，分封吕氏子弟为王。
body: |-
  汉高祖刘邦的皇后。据《史记·高祖本纪》，她的父亲吕公是单父人，为避仇迁居沛县，把女儿嫁给当时还是亭长的刘邦，生惠帝和鲁元公主。楚汉相争时，项羽把刘邦的父母妻子扣在军中作人质，到两军约定以鸿沟为界后才放回。

  刘邦称帝后她为皇后。《史记·吕太后本纪》说她“为人刚毅，佐高祖定天下，所诛大臣多吕后力”。公元前 196 年，她与萧何设计，在长乐宫杀死淮阴侯韩信。前 195 年高祖去世，太子刘盈即位，她毒死赵王如意，残害其母戚夫人，惠帝从此不理政事。

  前 188 年惠帝去世，她先后立两位年幼的皇帝，自己临朝称制，“号令一出太后”。她不顾右丞相王陵反对，分封吕台、吕产、吕禄等吕氏子弟为王。前 180 年七月她在未央宫去世，不久诸吕被大臣诛灭。司马迁为她单独立了本纪，评论说惠帝、高后时“政不出房户，天下晏然”，刑罚少用，百姓致力耕作，衣食渐丰。她的生年史书没有记载。
sources:
  - 《史记·吕太后本纪》 https://ctext.org/shiji/lv-tai-hou-ben-ji/zhs
  - 《史记·高祖本纪》 https://ctext.org/shiji/gao-zu-ben-ji/zhs
  - 《史记·淮阴侯列传》 https://ctext.org/shiji/huai-yin-hou-lie-zhuan/zhs
  - 《汉书·高后纪》 https://ctext.org/han-shu/gao-hou-ji/zhs
