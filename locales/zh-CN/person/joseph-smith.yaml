name: "约瑟·斯密"
aliases: ["约瑟斯密特", "小约瑟·史密斯"]
role: "摩门教创始人"
summary: "自称得天使指示挖出金页，1830 年出版《摩门经》、成立教会，后被暴民杀死。"
body: |-
  《历史的轨迹》第四十五章把摩门教列为这一时期兴起的教派之一，说纽约州中西部同时是米勒派、属灵运动和摩门教的发源地。书中说，约瑟·斯密住在纽约州帕尔迈拉，年轻时见过许多异象，宣称天使摩罗乃向他显现，说为西方世界写的经书埋在附近山里；1827 年 9 月 22 日他宣布挖出一个石盒，内有一本金页书。他用三年时间翻译，1830 年出版了《摩门经》，书中自称是从巴别塔讲起的美洲历史，说摩罗乃是摩门的儿子，是神选民最后的幸存者，在公元四世纪把金页埋藏起来。据摩门教自己的说法，埋藏的年代是公元 421 年，即五世纪，与书中所说不同。

  书中说，跟随他的人 1830 年 4 月成立了教会；1831 至 1837 年总部设在俄亥俄的柯特兰，后因纠纷迁到密苏里，1840 年又迁到伊利诺伊的纳府。1843 年 7 月他宣称看见异象，创立一夫多妻制，引起人们不满；他和兄弟被关在监牢时，暴民破门而入，将他们杀死。据一般记载，这事发生在 1844 年 6 月伊利诺伊卡西奇的县监狱。他 1805 年生于佛蒙特沙伦，1816 年前后随家迁到帕尔迈拉。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
