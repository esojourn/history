name: 罗得
aliases: []
role: 亚伯拉罕之侄
summary: 亚伯拉罕的侄儿，住在所多玛，城毁之前被救出。
body: |-
  哈兰的儿子，亚伯拉罕的侄儿；他的父亲死在吾珥（《创世记》11:27—28）。圣经没有记他的生年和卒年。他随祖父他拉到哈兰，又随亚伯兰进入迦南（11:31、12:4—5）。后来两家的牲畜多起来，牧人相争，亚伯兰让他先选地方，他选了约旦河的平原，渐渐挪移帐棚，直到所多玛（第 13 章）。

  四王攻打所多玛等城时，他和财物被掳走，亚伯兰带人追上去把他救回（第 14 章）。据第 19 章，两位天使晚上到所多玛，他接到家里住宿；城里的人围住房子，要他交出客人。天使告诉他耶和华要毁灭这城，催他带家人离开。他的女婿们以为是戏言；天明时天使拉着他和妻子、两个女儿的手出城。他求准逃到小城琐珥。他的妻子在后边回头一看，就变成了一根盐柱。

  后来他怕住在琐珥，同两个女儿住在山洞里。两个女儿用酒灌醉父亲，从他怀了孕，各生一个儿子，就是摩押人和亚扪人的始祖（19:30—38）。此后圣经不再记他的事。《彼得后书》2:7 称他为义人。
sources: []
recalled:
  - 《创世记》第 11—14 章、第 19 章
  - 《彼得后书》2:7
