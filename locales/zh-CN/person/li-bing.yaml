name: 李冰
aliases: []
role: 秦国蜀郡守
summary: 秦昭王时的蜀郡守，主持修建都江堰，使成都平原免除水旱之害，成为“天府之国”。
body: |-
  李冰是秦昭襄王时期的蜀郡守，生卒年和籍贯都不详，史书中关于他的记载很少。《史记·河渠书》说：“蜀守冰凿离碓，辟沫水之害，穿二江成都之中。”意思是他凿开离碓，消除了沫水的水害，在成都平原上开凿了两条江，既可以行船，又可以灌溉，百姓享其利。这就是都江堰的起源。

  东晋常璩的《华阳国志·蜀志》记载更详细：李冰在湔堰（即都江堰）筑分水工程，壅江作堋，把岷江分为内外二江，又设三个石人立于水中作为水位标尺，约定“水竭不至足，盛不没肩”，从此“水旱从人，不知饥馑”，蜀地被称为“天府”。都江堰的鱼嘴、飞沙堰、宝瓶口等名称和形制，是后世历代整修中逐渐形成的。

  1974 年，在都江堰外江河道中出土了一尊东汉建宁元年（168 年）的李冰石像，胸前刻有“故蜀郡李府君讳冰”等字。后世传说他的儿子“二郎”协助治水，民间把他父子奉为神明，修建了二王庙祭祀他们，这些都是后来的传说。

  据《华阳国志》，李冰还在蜀地开凿盐井、疏通航道、修建桥梁，被看作开发蜀地的功臣。都江堰建成后历代都有岁修制度，“深淘滩，低作堰”的治水六字诀相传出自李冰，但这一说法见于较晚的文献。
sources: []
recalled:
  - 《史记·河渠书》
  - 《华阳国志·蜀志》
  - 《汉书·沟洫志》
