name: 宋高宗
aliases: [赵构, 康王]
role: 南宋开国皇帝
summary: 宋徽宗第九子，靖康之变后在应天府即位，建立南宋，与金订立绍兴和议。
body: |-
  赵构是宋徽宗的第九个儿子，生于大观元年（公元 1107 年），封康王。靖康元年（1126 年）金军第一次围开封时，他曾作为人质入金营，不久被换回。同年冬金军再次南下，宋钦宗派他出使议和，他在河北相州被任命为河北兵马大元帅，因而没有被困在开封。靖康二年（1127 年）徽宗、钦宗被金军押往北方，赵构于五月在南京应天府（今河南商丘）即位，改元建炎，是为宋高宗，南宋由此开始。

  即位之初，高宗起用李纲为相、宗泽留守开封，但不久罢免李纲，一路南撤到扬州。建炎三年（1129 年）金军奔袭扬州，他仓皇渡江；同年在杭州发生苗傅、刘正彦兵变，被迫退位，一个月后由韩世忠、张浚等人起兵勤王才得复位。这一年冬天金将完颜宗弼渡江追击，高宗从明州（今浙江宁波）乘船入海，漂泊到温州，直到次年金军北撤才回到陆地。此后南宋的局势逐渐稳定，岳飞、韩世忠、吴玠等将领在各条战线上抵御金军和伪齐。

  绍兴八年（1138 年）高宗正式以临安（今杭州）为行在，并任用秦桧主持与金议和。绍兴十年（1140 年）金朝撕毁前约南下，岳飞等人连获胜利，高宗却连下诏令班师。绍兴十一年（1141 年）宋金订立绍兴和议，宋向金称臣，每年纳银绢各二十五万；同年年底岳飞以莫须有的罪名被害。后世对高宗的评价多集中在这一点上，也有学者指出他担心武将坐大、希望迎回生母韦太后，是促成和议的重要原因。

  高宗唯一的儿子早夭，他选立宋太祖的后裔赵昚为皇子，绍兴三十二年（1162 年）在海陵王南侵被击退后禅位，即宋孝宗，自己做了二十五年太上皇，淳熙十四年（1187 年）去世。高宗擅长书法，有《养生论》等墨迹传世。
sources: []
