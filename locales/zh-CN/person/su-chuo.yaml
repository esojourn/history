name: 苏绰
aliases: [苏令绰]
role: 大臣
summary: 宇文泰的重臣，拟定“六条诏书”和计账、户籍之法，奠定西魏的治国规制。
body: |-
  苏绰字令绰，京兆武功人，博览群书，尤其擅长算术。他由堂兄苏让推荐给宇文泰。据《周书》本传，宇文泰与他谈论治国之道，从白天谈到天亮仍不知疲倦，随即任命他为大行台左丞，参与机要。

  他制定了公文的程式，规定收支账目用朱笔和墨笔分别书写，又创立了计账和户籍之法，使国家能够掌握户口和赋役。大统七年（公元 541 年），他拟定“六条诏书”：一是先治心，二是敦教化，三是尽地利，四是擢贤良，五是恤狱讼，六是均赋役。宇文泰命百官诵习，规定地方长官不通晓六条和计账的不得任职。他又反对魏晋以来浮华的骈文，仿照《尚书》的文体写了《大诰》，要求朝廷文书依此体写作。

  据《隋书·苏威传》，他曾感叹当时的赋税好比张满的弓，不是太平时代的办法，希望后人能放松一些。他的儿子苏威在隋朝奏请减轻赋役，以完成父亲的心愿。大统十二年（546 年），苏绰去世，年四十九。宇文泰用一辆白布车送他的灵柩回武功安葬，亲自步行送出城门。
sources: []
recalled:
  - 《周书·苏绰传》
  - 《隋书·苏威传》
