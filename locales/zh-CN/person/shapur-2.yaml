name: 沙普尔二世
aliases: [沙普尔大帝, 沙布尔二世, 萨波尔二世]
role: 萨珊波斯国王
summary: 萨珊波斯在位最久的国王，与罗马交战数十年，夺回尼西比斯。
body: |-
  沙普尔二世生于公元 309 年。波斯的传说讲，父王死时他还在母腹，贵族们把王冠放在王后的肚子上为他加冕。他在位七十年，是萨珊王朝在位最久的国王。亲政之初，他先讨伐侵扰波斯湾沿岸的阿拉伯部落。

  337 年起他与罗马开战，三次围攻尼西比斯都没有攻下。君士坦丁归信基督教以后，波斯境内的基督徒被怀疑心向罗马，从四十年代起遭到逼迫，塞琉西亚—泰西封的主教西缅等人被处死。359 年他亲率大军围攻底格里斯河上游的阿米达，七十三天后破城，罗马军官阿米阿努斯当时就在城里，留下了详细的记述。

  363 年罗马皇帝尤利安攻到泰西封城下，退兵途中阵亡。继位的约维安急于脱身，与他订约，割让尼西比斯、辛加拉和底格里斯河以东的五个地区，并答应不再过问亚美尼亚。这是罗马三百年来第一次大片割地。他约在 379 年去世。
sources: []
recalled:
  - 阿米阿努斯·马尔凯利努斯《历史》卷 18—19、卷 25 第 7 章
  - 塔巴里《历代先知与帝王史》萨珊部分
  - 《波斯殉道者行传》
