name: 春申君
aliases: [黄歇]
role: 楚国令尹，“战国四公子”之一
summary: 楚国令尹，护送太子归国即位，任相二十余年，后被李园所杀。
body: |-
  春申君名黄歇，楚国人，生年不详。他游学四方，见识广博，侍奉楚顷襄王。据《史记·春申君列传》，秦国正要联合韩、魏攻楚时，他上书秦昭王，劝秦不要攻楚而应先图韩、魏，秦王于是停止了进攻。此后他陪同楚太子完到秦国做人质。

  公元前 263 年楚顷襄王病重，秦国不肯放太子回国。黄歇让太子化装成楚国使者的车夫逃出函谷关，自己留在客舍中替他应付，估计太子走远后才向秦昭王请罪，秦昭王听从范雎的意见放他回国。三个月后顷襄王去世，太子即位，就是楚考烈王，任黄歇为令尹，封以淮北十二县，号春申君，后来改封于江东的吴地。

  春申君任相二十多年。公元前 257 年他率军救赵，参与解了邯郸之围；他还灭了鲁国，以荀子为兰陵令。他门下也有食客三千人，与孟尝君、平原君、信陵君并称“战国四公子”。公元前 241 年，他主持的五国合纵攻秦在函谷关失败，楚国随后把都城迁到寿春。

  据《史记》，考烈王没有儿子，赵人李园把妹妹献给春申君，怀孕后又通过春申君献给考烈王，生下的儿子被立为太子。公元前 238 年考烈王去世，李园怕事情泄露，在宫门棘门埋伏刺客杀了春申君，并杀尽他的全家。这一故事的真实性，后世有人怀疑。
sources: []
recalled:
  - 《史记·春申君列传》
  - 《战国策·楚策四》
