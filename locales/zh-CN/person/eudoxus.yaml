name: 欧多克索斯
aliases: [尼多斯的欧多克索斯]
role: 数学家、天文学家
summary: 克尼多斯的数学家、天文学家，创立比例论和穷竭法，提出同心球的行星运动模型。
body: |-
  小亚细亚西南克尼多斯人。生卒年通常依阿波罗多罗斯的说法推为约公元前 408 年至前 355 年，也有学者主张约前 390 年至前 337 年。他的著作全部失传，生平主要依据第欧根尼·拉尔修。他年轻时到塔兰托跟阿尔库塔斯学几何，又学过医。约二十三岁时到雅典，因为穷，住在比雷埃夫斯，每天步行进城听柏拉图等人讲学。后来他带着斯巴达国王阿格西劳斯的介绍信去埃及，在赫利奥波利斯跟祭司学习天文，住了一年多。回来后在马尔马拉海南岸的库济科斯办学，又带着许多学生来到雅典，与柏拉图的学园往来。晚年回到克尼多斯，为家乡制定法律，享年五十三岁。

  在数学上，他建立了不依赖可公度性的比例论，使涉及无理量的比例也能严格处理，一般认为欧几里得《几何原本》第五卷的内容出自他。他又用后来称为“穷竭法”的办法求面积和体积；据阿基米德说，圆锥的体积是同底等高圆柱的三分之一、棱锥是棱柱的三分之一，这两条是欧多克索斯最先证明的。

  在天文学上，他提出第一个几何化的行星模型：每个天体附着在几个同心球上，各球以不同的轴和速度匀速旋转，叠加起来解释日、月、行星看上去的不规则运动，包括行星的逆行。据亚里士多德和辛普里丘的转述，他一共用了二十七个球。亚里士多德的宇宙论即以这个模型为基础。他描述星座的著作《现象》后来被诗人阿拉托斯改写成诗，流传很广。

  亚里士多德在《尼各马可伦理学》里还提到，他主张快乐就是善，理由是一切生物都追求它；又说人们相信他的话，是因为他本人品行节制。
sources: []
recalled:
  - 第欧根尼·拉尔修《名哲言行录》卷八
  - 亚里士多德《形而上学》卷十二第 8 章；《尼各马可伦理学》卷十第 2 章
  - 阿基米德《论球和圆柱》《方法》序
