name: "艾克"
aliases: ["约翰·艾克", "约翰·迈尔", "厄克"]
role: "因戈尔施塔特大学神学教授"
summary: "因戈尔施塔特的神学教授，1519 年在莱比锡与路德辩论，是旧教一方的主要辩士。"
body: |-
  艾克本姓迈尔，1486 年生于施瓦本的埃克村，后来以村名为姓。他十一岁多进海德堡大学，又在蒂宾根、科隆、弗赖堡读书，二十四岁得神学博士学位，1510 年起在巴伐利亚的因戈尔施塔特大学教神学，直到去世。他记忆力强，善于辩论，早年与人文学者也有交往。

  九十五条论纲传开后，他写了一份评语在朋友间传阅，说其中有波希米亚异端的毒素。《历史的轨迹》第二十一章说他著小册回驳路德，路德又写书反驳。路德的同事卡尔施塔特出来替路德辩护，艾克便向卡尔施塔特提出公开辩论，论题却冲着路德，尤其是教皇的首位权。

  1519 年 6 月底至 7 月中，辩论在莱比锡的公爵府里举行。艾克先与卡尔施塔特辩自由意志，7 月 4 日起与路德辩教皇权。该书第二十二章说，论学识和辩才两人差不多平手，但艾克把路德逼到承认：康斯坦茨公会议定罪的胡斯论点里，有一些是合乎福音的。这样路德就等于说公会议也会错。

  辩论后艾克去了罗马，参与起草谴责路德的诏书《主啊，求你起来》，并受命回德意志公布。该书说很少有地方准他张贴，爱尔福特的学生把印本扔进河里；他在莱比锡也要躲进修道院才得安全。

  此后他不断著书驳路德、慈运理和梅兰希顿，1525 年出的《驳路德常用论题手册》印了许多版。1526 年他在巴登与瑞士的改教者辩论，1530 年在奥格斯堡帝国议会上主持起草对《奥格斯堡信条》的驳议，1541 年又出席雷根斯堡的会谈。他还把圣经译成德文供旧教信徒使用。1543 年他在因戈尔施塔特去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十一章“教会开始动摇” https://wellsofgrace.com/books/spiritual/2000years/html/chapter24.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十二章“教会大大骚动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter25.html"
