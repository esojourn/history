name: 范缜
aliases: [范子真]
role: 思想家
summary: 齐梁之际的思想家，作《神灭论》，反对佛教的因果报应和灵魂不灭之说。
body: |-
  范缜字子真，南乡舞阴人，生卒年都不确切。据《梁书》本传，他少年丧父，家境贫寒，跟随名儒刘瓛求学，性情质直，好发危言高论。齐时任尚书殿中郎，曾出使北魏。

  竟陵王萧子良崇信佛教，范缜则宣称没有佛。萧子良问他：你不信因果，世间为什么有富贵贫贱？范缜说，人生好比一棵树上同时开的花，随风飘落，有的拂过帘幌落在坐垫上，有的越过篱墙落在粪坑边；落在坐垫上的是殿下，落在粪坑边的是下官，贵贱虽然不同，哪有什么因果。此后他写了《神灭论》，主张“形者神之质，神者形之用”，用刀刃与锋利的关系比喻形体与精神：没有刀刃就无所谓锋利，形体消亡，精神也就不存在了。萧子良召集僧人辩难，他没有屈服。据说王融劝他放弃此论，可以做到中书郎，他大笑说自己不会“卖论取官”。

  入梁后，他任晋安太守、尚书左丞，因与被贬的王亮交好，被流放广州，后来召回任中书郎、国子博士，死在任上。梁武帝曾亲自下诏批驳神灭之说，命王公朝贵和僧人作文辩难，这些文章和《神灭论》都收在僧祐编的《弘明集》里。
sources: []
recalled:
  - 《梁书·儒林传·范缜》
  - 《南史·范缜传》
  - 僧祐《弘明集》
