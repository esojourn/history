name: 小居鲁士
aliases: [居鲁士]
role: 波斯王子、小亚细亚统帅
summary: 波斯王子，资助斯巴达打赢伯罗奔尼撒战争，后起兵与兄长争位，在库纳克萨战死。
body: |-
  波斯国王大流士二世与王后帕吕萨提斯的次子。据普鲁塔克，他生于父亲即位之后，即公元前 423 年以后。母亲偏爱他。约前 408 年或前 407 年，他十几岁时被派到萨迪斯，统辖小亚细亚西部诸省并节制沿海驻军，使命是支持斯巴达对雅典作战。

  他到任后与斯巴达海军统帅吕山德相交甚厚，提高了桨手的饷额，使斯巴达舰队得以维持和重建。前 405 年他奉召去见病重的父亲，行前把手中的税款交给吕山德支配；同年吕山德在羊河歼灭雅典舰队。

  前 404 年大流士二世去世，长子阿尔塔薛西斯二世继位。总督提萨斐尼斯告发小居鲁士图谋在即位礼上行刺，他因母亲求情得免，回到萨迪斯。此后他以各种名义招兵：围攻米利都，讨伐皮西狄亚山民，并托斯巴达流亡者克列阿科斯等人在各处募集希腊雇佣军。据色诺芬，集结起来的希腊人有重装步兵约一万零四百人，轻盾兵约二千五百人。

  前 401 年春他从萨迪斯出发，起初不告诉士兵真正的目的地，到幼发拉底河边才公开说要去攻打国王，并许以重赏。同年秋，两军在巴比伦以北的库纳克萨相遇。希腊人在右翼击溃了当面之敌并追出很远；小居鲁士率亲兵直冲国王所在的中军，据克特西亚斯刺伤了国王，自己随即被杀，头和右手被砍下。他的亚洲部队溃散，希腊雇佣军虽然未败，却被留在了敌国腹地。

  色诺芬在《长征记》里为他写了一段很长的赞词，说在居鲁士大帝以后的波斯人中，他最有君主之才。这一评价出自追随者之手。
sources: []
recalled:
  - 色诺芬《长征记》卷一，赞词在第 9 章
  - 色诺芬《希腊史》卷一第 4—5 章、卷二第 1 章
  - 普鲁塔克《阿尔塔薛西斯传》《吕山德传》
