name: 施洗约翰
aliases:
  - 施洗的约翰
  - 撒迦利亚的儿子约翰
role: 先知，施洗者
summary: 祭司撒迦利亚之子，在约旦河传悔改的洗礼，为耶稣施洗，后被希律斩首。
body: |-
  据《路加福音》第 1 章，约翰的父亲撒迦利亚是亚比雅班里的祭司，母亲以利沙伯是亚伦的后人，两人年纪老迈，没有孩子。撒迦利亚在殿里烧香时，天使加百列向他报信，说他的妻子要生一个儿子，要给他起名叫约翰。以利沙伯是马利亚的亲戚，按路加所记，约翰比耶稣早生约六个月（路 1:26、36）。他出生在犹大山地的一座城里，路加没有写城名；他长大后住在旷野，直到向以色列人显明的日子（路 1:80）。

  《路加福音》3:1–2 说，该撒提庇留在位第十五年，神的话临到旷野里的约翰。他来到约旦河一带，宣讲悔改的洗礼，使罪得赦。《马太福音》3:4 记他身穿骆驼毛的衣服，腰束皮带，吃的是蝗虫、野蜜。耶路撒冷和犹太全地的人出去到他那里受洗。他说自己不是基督，在他以后来的那一位比他更大。耶稣从加利利来，在约旦河里受了他的洗（太 3:13–17）。《约翰福音》1:29–40 记他指着耶稣说这是神的羔羊，他的两个门徒听见，就跟从了耶稣。

  后来约翰因为责备分封的王希律娶了兄弟的妻子希罗底，被希律拿住，关在监里（可 6:17–18）。他在监里听见基督所作的事，曾打发门徒去问耶稣是不是那将要来的（太 11:2–6）。希律生日摆设筵席，希罗底的女儿进来跳舞，希律欢喜，起誓随她所求；女儿受母亲指使，要施洗约翰的头，希律就差人在监里斩了他（可 6:21–29）。约翰的门徒把尸首领去安葬。

  福音书没有写监禁和处死的地点。约瑟夫斯《犹太古史》卷 18 说，约翰被押往死海以东的马盖鲁斯堡，在那里被处死，本条的去世地即据此。约瑟夫斯所说的原因是希律担心约翰在民众中的影响会引起变乱，与福音书的记载侧重不同。福音书没有写希罗底女儿的名字，约瑟夫斯在同卷提到她名叫撒罗米。
sources: []
recalled:
  - 《路加福音》第 1 章、3:1–20、7:18–35
  - 《马太福音》第 3 章、11:2–19、14:1–12
  - 《马可福音》1:1–11、6:14–29
  - 《约翰福音》1:19–40、3:22–30
  - 约瑟夫斯《犹太古史》卷 18（约翰被囚、处死于马盖鲁斯）
