name: 约阿施
aliases: []
role: 北国以色列王
summary: 约哈斯的儿子，三败亚兰收复失地，又在伯示麦大败犹大、拆毁耶路撒冷城墙。
body: |-
  约哈斯的儿子，与同时代的犹大王约阿施同名。据《列王纪下》13:10–11，犹大王约阿施三十七年，他在撒玛利亚登基作以色列王，共十六年；经文说他行恶，没有离开耶罗波安的罪。

  先知以利沙病重将死，约阿施下去看他，伏在他脸上哭着说“我父啊，我父啊，以色列的战车马兵啊”。以利沙叫他开向东的窗户射箭，说这是耶和华得胜的箭，必在亚弗击败亚兰人；又叫他拿箭击地，他击了三次就止住，以利沙向他发怒，说应当击五六次，如今只能打败亚兰人三次（13:14–19）。后来约阿施果然三次打败哈薛的儿子便哈达，收回了他父亲失去的城邑（13:24–25）。

  犹大王亚玛谢打败以东以后，差人向约阿施挑战。约阿施用蒺藜向香柏树求亲、被野兽践踏的比喻劝他不要自取祸患，亚玛谢不听。两军在犹大的伯示麦交战，犹大大败，亚玛谢被擒；约阿施到耶路撒冷，拆毁城墙，从以法莲门到角门共四百肘，掠取耶和华殿和王宫府库里的金银器皿，带着人质回撒玛利亚（14:8–14）。他死后葬在撒玛利亚，儿子耶罗波安接续作王（14:16）。亚述王亚达德尼拉里三世的一块石碑上记有“撒玛利亚人约阿施”进贡，圣经没有记载这件事。
sources: []
recalled:
  - 《列王纪下》13:10–25、14:8–16
  - 《历代志下》25:17–24
  - 亚述王亚达德尼拉里三世特尔里玛石碑铭文
