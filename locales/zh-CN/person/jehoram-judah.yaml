name: 约兰
aliases: []
role: 南国犹大王
summary: 约沙法的儿子，娶亚哈之女亚他利雅，在位时以东、立拿背叛，患肠病而死。
body: |-
  约沙法的长子，与同时代的以色列王约兰同名。据《列王纪下》8:16–18，他三十二岁登基，在耶路撒冷作王八年；他娶了亚哈的女儿为妻（即亚他利雅），行以色列诸王的道，与亚哈家一样。8:16 说他登基时约沙法还在作王，《列王纪》中两国纪年的交错一般也认为反映了父子共同执政。《历代志下》21:4 说他坐稳国位以后，用刀杀了他的众兄弟和以色列的几个首领。

  在他的年间，以东背叛犹大，自己立王。约兰率领战车往撒益去，夜间起来攻打围困他的以东人，犹大的百姓却逃回帐棚；经文说以东从此背叛犹大，直到写书的时候。同时立拿也背叛了（《列王纪下》8:20–22）。

  《历代志下》21:12–20 说先知以利亚有信给他，责备他不行约沙法的道，预言他必患肠病。后来非利士人和阿拉伯人上来攻击犹大，掳掠了王宫里的财货和他的妻子、儿子，只剩下小儿子约哈斯（即亚哈谢）。约兰果然患了肠病，过了两年，病重而死；他死时无人思慕，葬在大卫城，却不在列王的坟墓里。儿子亚哈谢接续作王。
sources: []
recalled:
  - 《列王纪下》8:16–24
  - 《历代志下》第 21 章
