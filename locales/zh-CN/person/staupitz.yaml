name: "施道比茨"
aliases: ["约翰·冯·施道比茨", "施道比次"]
role: "奥古斯丁会德意志严规派总代理"
summary: "奥古斯丁会在德意志的上司，路德的告解神父，劝他读圣经、教圣经，后来留在旧教会。"
body: |-
  施道比茨约 1460 年生于萨克森的莫特维茨，出身贵族，在科隆、莱比锡读书，进了奥古斯丁会，1500 年在蒂宾根得神学博士学位。1502 年萨克森选侯创办维滕贝格大学，请他筹划，他是神学院第一任院长。1503 年起他任奥古斯丁会德意志严规派的总代理。

  路德进修道院后为自己的罪极度不安，反复告解。《历史的轨迹》第二十一章说，施道比茨常常鼓励他。据路德后来的回忆，施道比茨叫他不要盯着自己的罪，要看基督的伤痕；又不顾他推辞，命他读博士、讲道，1512 年把自己的圣经教席让给他。路德说过，若没有施道比茨，他早已沉在地狱里。

  1518 年教廷要修会约束路德，施道比茨到奥格斯堡陪他见迦耶坦，随后解除了他对修会的服从义务，免得修会受牵连。他赞成路德讲的恩典，却不肯与教会决裂。1520 年他辞去修会的职务，到萨尔茨堡，改入本笃会，做了圣彼得修道院的院长。1524 年他在给路德的最后一封信里说，自己对他的情谊没有变，但看不懂他为什么要废掉那些无关紧要的外表礼仪。同年 12 月他在萨尔茨堡去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十一章“教会开始动摇” https://wellsofgrace.com/books/spiritual/2000years/html/chapter24.html"
recalled:
  - "路德与施道比茨往来书信（1518—1524 年）"
  - "路德《桌边谈话》"
  - "施道比茨《论永恒预定的施行》（1517 年）"
