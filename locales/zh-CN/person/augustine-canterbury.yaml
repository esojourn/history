name: 坎特伯雷的奥古斯丁
aliases:
  - 英格兰的使徒
role: 第一任坎特伯雷大主教
summary: 罗马修士，受大贵格利差派到英格兰传道，是第一任坎特伯雷大主教。
body: |-
  这位奥古斯丁与两百年前北非希坡的主教同名，不是一个人。他的出身和生年没有记载，只知道他原是罗马圣安德烈修道院的院长。他的事迹主要见于八世纪比德的《英吉利教会史》和大贵格利的书信。

  公元 596 年，教皇大贵格利派他带约四十名修士去英格兰。一行人走到高卢，听说海那边的人野蛮凶悍，就打发他回罗马请求免去这趟差事。贵格利写信勉励，叫他们继续前行。597 年他们在英格兰东南的萨尼特岛登陆。肯特王艾塞尔伯特的王后伯莎是法兰克公主，本来就是基督徒。国王在露天接见了他们，准他们住在都城坎特伯雷，自由传道。不久国王受洗。贵格利在一封信里说，这年圣诞节有一万多人受洗。

  他到高卢受了主教的按立，在坎特伯雷设立教堂和修道院。601 年贵格利又派来一批帮手，授给他大主教的披肩，并写信指示：不必拆毁异教的庙宇，除去偶像后可以改作教堂。约 603 年，他两次约见不列颠西部原有的凯尔特教会的主教，要他们改从罗马的复活节算法，并与他一同向盎格鲁人传道，没有谈成。

  他约在公元 604 年 5 月去世，一说 605 年。《历史的轨迹》第七章说，此后经过约一百年的宣教工作，英格兰成为基督教国家。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 比德《英吉利教会史》卷 1 第 23—33 章、卷 2 第 2—3 章
  - 大贵格利《书信集》卷 6 第 51 封、卷 8 第 30 封、卷 11 第 56 封
