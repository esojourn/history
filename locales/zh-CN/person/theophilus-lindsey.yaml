name: "林赛"
aliases: ["西奥菲勒斯·林赛", "林西"]
role: "英国神体一位论教会的创立者"
summary: "英国圣公会牧师，请愿免签三十九信条被否决，1774 年在伦敦组织神体一位会。"
body: |-
  林赛 1723 年生于柴郡米德尔威奇，剑桥出身，在约克郡卡特里克做英国圣公会的教区牧师。《历史的轨迹》第三十五章说，十八世纪英国的苏西尼主义变成了神体一位论。林赛发出请愿书，要求国会准许牧师不必接受三十九信条，只需对圣经效忠；作者认为这说明苏西尼派牧师不肯相信承认基督神性的三十九信条。请愿书得到二百五十多人签名，1772 年呈给国会，遭到否决。

  该书说，林赛于是退出圣公会，1774 年在伦敦组织了神体一位会（在埃塞克斯街的一间拍卖厅里开始聚会）。1779 年国会修改信仰容忍法案，以接受圣经取代接受三十九信条；不久又取消了对否认三位一体者的刑罚。作者认为这为各种异端打开了大门。林赛 1808 年在伦敦去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十五章“苏西尼主义，神体一位论，现代主义” https://wellsofgrace.com/books/spiritual/2000years/html/chapter39.html"
