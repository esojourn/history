name: 梅塞纳斯
aliases: [盖乌斯·梅塞纳斯, 迈克纳斯, 米西纳斯]
role: 奥古斯都的谋士、文艺赞助人
summary: 屋大维早年的朋友和谋士，资助维吉尔、贺拉斯等诗人。
body: |-
  梅塞纳斯出身阿雷提乌姆的伊特鲁里亚贵族之家，生年不详，一般推定在公元前 70 年前后。他终身只是骑士，没有进元老院，也没有担任过正式的高级官职。

  他是屋大维最早的朋友和谋士之一。前 40 年他参与布伦迪西乌姆和约的谈判；屋大维出征西西里和亚克兴时，由他留守，代管罗马和意大利。他把维吉尔、贺拉斯、普罗佩提乌斯等诗人聚在身边，给他们资助，贺拉斯的萨宾农庄就是他送的。据苏维托尼乌斯，前 23 年前后他把一桩阴谋案的消息透露给妻子，此后与奥古斯都有些疏远。

  前 8 年他去世，把遗产留给奥古斯都。他自己也写诗文，只存残篇，塞涅卡批评他文风浮华。在西方语言里，他的名字后来成了“文艺赞助人”的代称。
sources: []
recalled:
  - 苏维托尼乌斯《罗马十二帝王传·奥古斯都传》第 66 章
  - 贺拉斯《颂诗》卷 1 第 1 首、《讽刺诗》卷 1 第 6 首
  - 卡西乌斯·狄奥《罗马史》卷 55
