name: 汉文帝
aliases:
  - 刘恒
  - 孝文皇帝
  - 代王
role: 皇帝
summary: 名刘恒，原为代王，诸吕被诛后入继帝位；在位时减田租、除肉刑。
body: |-
  汉高祖刘邦之子，母亲是薄姬。公元前 196 年陈豨之乱平定后，他被立为代王，都中都。本纪没有记他的生年，通常据享年推算为前 203 年左右。前 180 年吕后去世，诸吕被诛，陈平、周勃等大臣派人迎他入长安即位。

  即位后，他废除了一人犯法、家属连坐为奴的“收帑相坐”律令，又废除诽谤、妖言之罪。据《汉书·文帝纪》，文帝二年、十二年两次只收当年田租的一半，十三年下诏免除田租；同年因齐太仓令之女缇萦上书，废除肉刑。《史记·孝文本纪》记他曾想造一座露台，听说要花百金便作罢；他为自己修霸陵，只用瓦器，不许用金银铜锡装饰。

  对外，他与匈奴延续和亲，匈奴仍多次入边。南越王赵佗自称武帝，他派陆贾出使，并优待赵佗在中原的兄弟，赵佗于是去掉帝号称臣。他在位二十三年，前 157 年六月在未央宫去世，葬霸陵。后世把他与其子景帝两朝合称“文景之治”。
sources:
  - 《史记·孝文本纪》 https://ctext.org/shiji/xiao-wen-ben-ji/zhs
  - 《汉书·文帝纪》 https://ctext.org/han-shu/wen-di-ji/zhs
  - 《史记·郦生陆贾列传》 https://ctext.org/shiji/li-sheng-lu-jia-lie-zhuan/zhs
  - 《史记·匈奴列传》 https://ctext.org/shiji/xiong-nu-lie-zhuan/zhs
