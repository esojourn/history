name: 奥林匹亚斯
aliases: [奥林匹娅丝]
role: 马其顿王后
summary: 伊庇鲁斯公主，腓力二世之妻，亚历山大之母，在继业者战争中被卡山德处死。
body: |-
  伊庇鲁斯莫洛西亚人的国王涅俄普托勒摩斯一世之女，约生于公元前 375 年。这个王室自称是阿喀琉斯之子的后裔。据普鲁塔克，她与腓力二世是在萨摩色雷斯岛参加秘仪时相识的；又说她早年另有别的名字，“奥林匹亚斯”是后来取的。前 357 年她嫁给腓力，是他的几位妻子之一，次年生亚历山大，后又生女儿克列奥帕特拉。普鲁塔克说她热衷狄奥尼索斯一类的秘仪，行礼时手持驯养的大蛇；又记有亚历山大为宙斯所生的种种传闻，这些都是后来的附会。

  前 337 年腓力另娶马其顿贵族之女克列奥帕特拉，婚宴上新娘的叔父阿塔罗斯祝愿王室得一个“合法的继承人”，亚历山大与父亲当场冲突，母子二人离开宫廷，她回到伊庇鲁斯。次年腓力遇刺。古代有她指使凶手的说法，无法证实。她回马其顿后，处死了腓力的新妻克列奥帕特拉和她的婴儿。

  亚历山大东征期间，她留在马其顿，与留守的安提帕特不和，两人都不断写信向亚历山大申诉。约前 331 年她又回到伊庇鲁斯。

  亚历山大死后，王位名义上属于他的异母兄腓力三世和遗腹子亚历山大四世。前 317 年，摄政波利伯孔为对抗卡山德，请她回马其顿照管孙子。她与伊庇鲁斯国王埃阿基德斯率军入境，腓力三世之妻欧律狄刻领兵迎战，马其顿士兵见到亚历山大的母亲便倒戈了。她处死腓力三世，逼欧律狄刻自尽，又杀了卡山德的弟弟尼卡诺尔和他的党羽，据狄奥多罗斯有一百人。卡山德回师，把她围在彼得那。经过一冬的饥饿，她在前 316 年春以保全性命为条件投降。卡山德让马其顿人的集会缺席判她死刑，派去的士兵不忍下手，最后由被她所杀者的亲属动手。
sources: []
recalled:
  - 普鲁塔克《亚历山大传》第 2—10 章
  - 狄奥多罗斯《历史丛书》卷十九第 11 章、第 35—36 章、第 49—51 章
  - 尤斯丁《腓力史纲要》卷九、卷十四
