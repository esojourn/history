name: 信陵君
aliases: [魏无忌, 魏公子]
role: 魏国公子，“战国四公子”之一
summary: 魏国公子，礼贤下士，前 257 年窃符救赵，后遭猜忌郁郁而终。
body: |-
  信陵君名无忌，是魏昭王的少子、魏安釐王的异母弟，封于信陵，生年不详。据《史记·魏公子列传》，他为人仁厚，礼贤下士，不论贤与不贤都以礼相待，门下食客有三千人，诸侯因此十多年不敢出兵攻魏。他亲自驾车去迎接看守大梁夷门的七十岁老人侯嬴，空出车上的尊位请侯嬴坐，又在侯嬴的介绍下结交了屠夫朱亥。

  公元前 257 年秦军围攻赵都邯郸，魏王派晋鄙率十万大军救赵，但在秦国的威胁下让大军停在邺地观望。信陵君的姐姐是平原君的夫人，平原君屡次写信求救。信陵君多次劝魏王进兵无效，听从侯嬴之计，请魏王的宠姬如姬从王的卧室中偷出调兵的虎符，带着朱亥赶到邺地。晋鄙合符后仍有怀疑，朱亥用藏在袖中的四十斤铁椎击杀了晋鄙。信陵君挑选八万精兵进击秦军，与楚国的援军一起解了邯郸之围。侯嬴在信陵君到达晋鄙军中的那天，面向北方自刎。

  信陵君因窃符杀将，不敢回魏国，留在赵国十年。公元前 247 年秦军攻魏，魏王请他回国。他回国后被任为上将军，各国听说后纷纷派兵相助，他率五国联军在河外大败秦将蒙骜，追击到函谷关。秦国于是派人在魏王面前离间，魏王夺去了他的兵权。信陵君称病不朝，日夜饮酒，四年后即公元前 243 年病死。传说他的门客编有《魏公子兵法》。
sources: []
recalled:
  - 《史记·魏公子列传》
  - 《战国策·魏策四》
