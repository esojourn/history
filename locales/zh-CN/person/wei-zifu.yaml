name: 卫子夫
aliases: [卫皇后, 孝武卫皇后, 思后]
role: 皇后
summary: 汉武帝的第二位皇后，卫青之姐、太子刘据之母，在位三十八年，巫蛊之祸中自杀。
body: |-
  据《史记·外戚世家》和《汉书·外戚传》，卫子夫出身微贱，原是平阳公主家的歌女。建元二年（公元前 139 年），武帝到霸上祓除后顺路到平阳公主家，看中了她，公主于是把她送入宫中。入宫一年多她没有再受召见，后来才重新得宠，先后生了三个女儿。她的弟弟卫青、外甥霍去病都因她的关系进入宫中任职。

  元朔元年（前 128 年）她生下皇子刘据，同年被立为皇后；此前的陈皇后已在元光五年因巫蛊事被废。刘据七岁时立为太子。此后卫青、霍去病相继以军功封侯，卫氏一门显赫。武帝后来另有宠爱的夫人，她年长色衰，但仍居后位。

  征和二年（前 91 年），江充借查办巫蛊陷害太子，太子起兵诛杀江充，派人禀告皇后，调用了皇后宫中的车马和武库的兵器。太子兵败出逃后，武帝派人收回皇后的玺绶，她随即自杀。她做了三十八年皇后。她的曾孙宣帝即位后，为她改葬并追加谥号“思”。
sources: []
recalled:
  - 《史记·外戚世家》
  - 《汉书·外戚传上》
