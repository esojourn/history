name: 克莱尔沃的伯尔纳
aliases:
  - 明谷的伯尔纳
  - 克勒窝的伯尔纳
  - 圣伯纳德
role: 克莱尔沃修道院院长
summary: 西多会修士，克莱尔沃修道院的创立者和院长，十二世纪西欧最有影响的讲道者。
body: |-
  伯尔纳 1090 年生于勃艮第第戎附近的骑士家庭。1112 年前后，他带着三十来个亲友进了创立不久、规矩极严的西多修道院。1115 年他受派带十二个修士到香槟的一处山谷另建新院，取名克莱尔沃，意为“明亮的山谷”，他在那里作院长直到去世。西多会因他而兴盛，他去世时全会已有三百多所修道院。《历史的轨迹》第十八章把西多会列在因渴望革新而兴起的新修会当中。

  他没有担任过更高的职位，却是那一代人中说话最有分量的人。1130 年出现两位教皇，他奔走各国，使英诺森二世得到承认。圣殿骑士团成立时，他为他们争取到教会的认可，写了《新骑士颂》。他认为巴黎教师亚伯拉德用辩证法讨论三位一体是把信仰当作意见，1141 年在桑斯的会议上使他的若干论点受到谴责。1145 年他从前的修士当选教皇，即尤金三世，他写了《论省察》提醒教皇不要被俗务淹没。

  1146 年他受教皇委托宣讲第二次十字军，在韦兹莱和德意志各地讲道，说动了法王和德意志国王。莱茵地区有修士煽动杀害犹太人，他赶去制止。这次十字军以失败告终，他为此受到许多责难。

  他的《雅歌讲章》和《论爱神》讲人怎样以爱回应神的爱，对后世的灵修影响很深。《历史的轨迹》说圣诗《至圣之首今受创伤》是他写的；这首诗的拉丁原文长期归在他名下，今天多认为出自十三世纪的修士阿努尔夫之手。该书还引他给教皇的信：“谁能让我在离世之前，看到教会恢复旧日的秩序？当日使徒撒网，是为得人，不为得金银！”并说他的一些著作后来帮助马丁·路德得到心灵的平安。

  他于 1153 年 8 月 20 日在克莱尔沃去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
recalled:
  - 圣蒂埃里的威廉等《伯尔纳传初编》
  - 伯尔纳《雅歌讲章》《论爱神》《论省察》《新骑士颂》
  - 弗赖辛的奥托《腓特烈皇帝行传》卷 1
