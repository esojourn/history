name: 楚成王
aliases: [熊恽]
role: 楚国国君
summary: 楚国国君，北上争霸，与齐订召陵之盟，城濮之战败于晋，被太子逼死。
body: |-
  楚成王名熊恽，是楚文王之子，生年不详。据《史记·楚世家》，兄长堵敖（庄敖）想杀他，他逃到随国，借随人之力袭杀堵敖而自立，公元前 671 年为元年，在位到前 626 年。他在位期间楚国不断向北扩张，攻灭了汉水、淮水一带的许多小国。

  公元前 656 年，齐桓公率诸侯之师伐楚，楚成王派屈完与诸侯谈判，在召陵订立盟约，楚国的北进暂时受到遏制。齐桓公死后，楚国势力进入中原，前 638 年在泓水打败宋襄公。重耳流亡到楚国时，成王以国君之礼款待他，重耳许诺将来两军相遇时退避三舍。公元前 632 年，楚令尹子玉率军与晋军战于城濮，楚军大败，成王迫使子玉自杀。

  成王晚年想废掉太子商臣，改立少子。商臣得知后率宫中卫士包围成王，成王请求吃了熊掌再死，想借此拖延时间，商臣不许，成王自缢而死（《左传》文公元年）。商臣即位，就是楚穆王，楚庄王是他的儿子。
sources: []
