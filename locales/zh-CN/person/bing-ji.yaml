name: 丙吉
aliases: [邴吉, 丙少卿, 博阳侯]
role: 丞相
summary: 巫蛊之祸中保全了襁褓中的皇曾孙，后来建议霍光迎立他为宣帝，官至丞相。
body: |-
  据《汉书·魏相丙吉传》，丙吉字少卿，鲁国人，学习律令出身，由鲁国的狱吏逐步升到廷尉右监。巫蛊之祸发生后，他被调来审理郡邸狱中的案犯。戾太子的孙子当时才出生几个月，也关在狱中，丙吉知道太子冤枉，挑选谨厚的女囚哺育这个婴儿，自己出钱供给衣食。后元二年（公元前 87 年）武帝病重，有人说长安狱中有天子气，武帝下令把各狱的囚犯一律处死；使者夜里来到郡邸狱，丙吉关门拒绝，僵持到天亮。武帝得知后有所醒悟，下令大赦。

  后来他任大将军霍光的长史。昌邑王被废后，他写信给霍光，推荐已经长大的皇曾孙，霍光采纳，立为宣帝。宣帝并不知道当年的经过，丙吉也绝口不提。直到一名曾经照看过宣帝的宫婢上书自陈，宣帝追查之下才知道真相，封他为博阳侯。

  神爵三年（前 59 年）他继魏相任丞相，为政崇尚宽大，属吏有过失多加包容。本传记他外出时遇到百姓群殴死伤，不加过问；见到有人赶的牛喘息吐舌，却派人去问牛走了多远。他解释说，斗殴由京兆尹等官员处理，而春天牛就因热喘息，恐怕是时气失调，这才是三公应当关心的事。五凤三年（前 55 年）他去世。
sources: []
recalled:
  - 《汉书·魏相丙吉传》
