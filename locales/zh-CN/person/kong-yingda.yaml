name: 孔颖达
aliases: [孔冲远]
role: 国子祭酒
summary: 唐初经学家，孔子后裔，奉诏主编《五经正义》，统一了经书的注释。
body: |-
  孔颖达字冲远，冀州衡水人，是孔子的后裔。他年少时精通《左传》《尚书》《周易》《毛诗》《礼记》等经典，隋朝时以明经科及第。据《旧唐书》本传，隋炀帝大业年间召集各地儒者在东都辩论经义，他辩论第一，一些年长的儒者感到羞耻，暗中派刺客想害他，他躲在礼部尚书杨玄感家中才得免。

  唐朝建立后，他被李世民召入秦王府文学馆，为十八学士之一。太宗即位后，他历任国子博士、国子司业、国子祭酒，曾为太子讲经。南北朝以来，南北学风不同，对经书的解释分歧很多，太宗命他与其他学者整理《周易》《尚书》《毛诗》《礼记》《春秋左传》五部经书的注疏，编成《五经正义》一百八十卷。书成后又有学者指出其中的疏漏，经过修订，到高宗永徽四年（653 年）正式颁行，成为科举明经科的标准，此后各家异说逐渐被统一。

  贞观二十二年（648 年）他去世，年七十五，陪葬昭陵。
sources: []
recalled:
  - 《旧唐书·孔颖达传》
  - 《新唐书·孔颖达传》
