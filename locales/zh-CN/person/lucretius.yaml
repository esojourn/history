name: 卢克莱修
aliases: [提图斯·卢克莱修·卡鲁斯, 卢克莱茨]
role: 罗马诗人、伊壁鸠鲁派哲学家
summary: 罗马诗人，以长诗《物性论》阐述伊壁鸠鲁的原子论，劝人不必畏惧神灵和死亡。
body: |-
  提图斯·卢克莱修·卡鲁斯，罗马诗人，生平几乎无可考。哲罗姆的编年史在公元前 94 年（一些抄本作前 96 年）下记：诗人卢克莱修出生，后来因服春药而发疯，在清醒的间歇写了几卷书，由西塞罗校订，四十四岁时自杀。多纳图斯的《维吉尔传》则说他死于维吉尔穿上成年托加的那一天。两处记载彼此不合，一般把他的生卒定在前 99 年前后至前 55 年前后；发疯和自杀的说法不见于更早的材料，许多学者认为出于后来对伊壁鸠鲁派的敌意。同时代唯一提到他的是西塞罗前 54 年写给弟弟的一封信，说他的诗既有天才的闪光，又很见技巧。

  他唯一的作品是六音步长诗《物性论》，共六卷，约七千四百行，题献给贵族盖乌斯·梅米乌斯。诗的目的是用伊壁鸠鲁的学说解除人对神灵和死亡的恐惧。第一、二卷讲万物由不可分割的原子和虚空构成，原子在下落中有极微小的偏斜，由此才有碰撞结合，也才有自由意志；第三卷论证灵魂也由原子组成，随身体一同消散，所以死与我们无关；第四卷讲感觉和爱欲；第五卷讲世界的生成，以及人类从野蛮状态逐步学会语言、用火、农耕、法律的过程；第六卷讲雷电、地震、火山等现象，结尾是对雅典瘟疫的描写。他认为神存在，但与世界无关，不必畏惧。

  他在诗里抱怨拉丁语词汇贫乏，许多希腊哲学概念要自己造词。他把哲理比作苦药，把诗句比作涂在杯口的蜜。维吉尔、奥维德都受他影响。

  这部诗在中世纪几乎失传。1417 年，意大利人文学者波焦·布拉乔利尼在德意志的一所修道院里发现了一部抄本，此后流传开来，对文艺复兴以后原子论的复兴有很大影响。
sources: []
recalled:
  - 卢克莱修《物性论》
  - 哲罗姆《编年史》
  - 西塞罗《致弟昆图斯书》卷二
  - 多纳图斯《维吉尔传》
