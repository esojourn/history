name: 桓温
aliases: [桓元子, 南郡公, 大司马]
role: 大司马
summary: 东晋权臣，灭成汉，三次北伐，一度收复洛阳，晚年废立皇帝，图谋代晋未成。
body: |-
  桓温字元子，谯国龙亢人，父亲桓彝是东晋初年的名士。咸和三年（公元 328 年）桓彝在苏峻之乱中遇害，他当时十五岁。据《晋书》本传，三年后他趁仇人江播的丧事闯入其家，亲手杀了江播的儿子，由此受到时人称许。他后来娶晋明帝的女儿南康公主为妻。

  永和元年（345 年）他出任荆州刺史，都督长江中上游六州军事。第二年冬天，他不等朝廷答复就率军西征成汉，永和三年攻入成都，成汉君主李势投降。朝廷担心他难以控制，起用名士殷浩主持北伐来与他抗衡。殷浩连年无功，永和十年被他上表弹劾而废黜，此后内外大权都归于他。

  他先后三次北伐。永和十年（354 年）他由武关进入关中，在蓝田击败前秦军，推进到长安东面的灞上。本传说当地的老人流着泪说没想到今天还能见到官军。前秦割尽麦子坚壁清野，他因缺粮退兵。永和十二年他在伊水打败羌人首领姚襄，收复洛阳，修复西晋诸帝的陵墓，上表请求还都洛阳，朝廷没有同意；洛阳后来又被前燕夺去。太和四年（369 年）他率五万人北伐前燕，沿水路进到枋头，被慕容垂阻住，粮道不通，烧船撤退，途中在襄邑遭到伏击，本传称死者三万。

  枋头之败使他的威望受损。太和六年（371 年），他采纳参军郗超的主意，废皇帝司马奕为东海王，改立会稽王司马昱，即简文帝。简文帝在位不到一年去世，遗诏只让他像诸葛亮、王导那样辅政，没有把帝位让给他。宁康元年（373 年）他入朝，谢安、王坦之到新亭迎接。他示意朝廷加九锡，谢安等人借修改文稿一再拖延。同年七月他在姑孰病逝，时年六十二。本传记他曾说：既不能流芳后世，难道不能遗臭万年吗？他在职时还主持过整顿户籍的“庚戌土断”。
sources: []
recalled:
  - 《晋书·桓温传》
  - 《世说新语》
  - 《资治通鉴》卷九十七至一百零三
