name: 冉闵
aliases: [石闵, 冉永曾, 棘奴]
role: 冉魏君主
summary: 石虎的养孙，后赵内乱中夺取政权，屠杀胡羯，建立冉魏，两年后被前燕所灭。
body: |-
  冉闵字永曾，小字棘奴，魏郡内黄人，生年不详。他的父亲冉瞻是汉人，十二岁时被石勒俘获，石勒让石虎收为养子，所以他从小姓石，石虎待他如同亲孙。他成年后骁勇善战，咸康四年（公元 338 年）后赵进攻慕容皝失利，各军溃散，只有他率领的一军完整撤回，由此知名。

  太宁元年（349 年）石虎死后，他先帮助石遵夺得帝位，石遵转而想除掉他，他便废杀石遵，改立石鉴，朝政由他掌握。据《晋书·载记》，邺城内的胡、羯人不肯为他所用，他下令：赵人斩一个胡人的首级送到凤阳门的，文官进位三等，武官拜为牙门。一天之内被杀的有几万人，前后死者二十余万，其中不少只是长相高鼻多须而被误杀。

  永和六年（350 年）他杀石鉴和石虎的子孙，自立为帝，国号大魏，恢复冉姓。此后他与据守襄国的石祗以及羌人姚氏、氐人苻氏等连年混战，中原残破不堪。永和八年（352 年），前燕的慕容恪南下，在廉台把他击败俘获。他被送到蓟城，随后在龙城被斩。同年邺城陷落，冉魏灭亡。
sources: []
recalled:
  - 《晋书·石季龙载记附冉闵》
  - 《资治通鉴》卷九十八、九十九
