name: 蚩尤
aliases: []
role: 传说中的部落首领
summary: 传说中与黄帝作战的首领，相传在涿鹿之战中被黄帝擒杀。
body: |-
  蚩尤是传说时代的人物。《史记·五帝本纪》只说“蚩尤作乱，不用帝命”，黄帝征调诸侯的军队，与蚩尤战于涿鹿之野，“遂禽杀蚩尤”。

  其他古书的记载带有更浓的神话色彩。《山海经·大荒北经》说，蚩尤起兵攻伐黄帝，黄帝命应龙在冀州之野迎战；蚩尤请来风伯、雨师，纵大风雨，黄帝又降下名叫“魃”的天女，雨才停止，于是杀了蚩尤。《尚书·吕刑》则说“蚩尤惟始作乱”，把他当作作乱的开端。

  后世对蚩尤的看法并不一致。汉代有祭祀蚩尤为“兵主”的风俗，《史记·封禅书》所记齐地八神之中就有兵主蚩尤；也有一些民族把蚩尤奉为祖先。这些都是传说与后世信仰，不能当作信史。
sources: []
recalled:
  - 《史记·五帝本纪》
  - 《山海经·大荒北经》
  - 《尚书·吕刑》
  - 《史记·封禅书》
