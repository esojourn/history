name: 罗贯中
aliases: [罗本, 湖海散人]
role: 小说家
summary: 元末明初的小说家，一般认为是《三国志通俗演义》的作者，生平事迹所知甚少。
body: |-
  罗贯中名本，号湖海散人，生卒年不详，大约生活在元末明初。他的籍贯有太原、东原（今山东东平）、钱塘等不同说法。关于他生平的直接记载很少，最常被引用的是明初贾仲明《录鬼簿续编》中的一条，说他“与人寡合”，是贾仲明的“忘年交”，至正二十四年（1364 年）两人重逢，此后六十余年不知所终；书中还列出了他所作的杂剧《赵太祖龙虎风云会》等。另有传说他曾在元末群雄之一张士诚的幕府中做事，没有可靠的证据。

  罗贯中的主要作品是《三国志通俗演义》（后世通称《三国演义》）。这部书以陈寿《三国志》和裴松之注为骨干，吸收了宋元以来说书、戏曲中的三国故事，叙述从东汉末年黄巾起义到西晋统一的近百年历史，有“七分实事，三分虚构”的说法。现存最早的刊本是明嘉靖元年（1522 年）的刻本，清代毛纶、毛宗岗父子修订评点的本子流传最广。

  明代的一些刊本还把《水浒传》署为“施耐庵的本，罗贯中编次”，此外《隋唐两朝志传》《残唐五代史演义》《三遂平妖传》等书也题有他的名字，这些书与他的关系，学界看法不一。施耐庵的生平更加模糊，有人甚至怀疑是否确有其人。
sources: []
recalled:
  - 贾仲明《录鬼簿续编》
  - 郎瑛《七修类稿》
  - 鲁迅《中国小说史略》
