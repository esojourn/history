name: "勒费弗尔"
aliases: ["埃塔普勒的勒费弗尔", "雅克·勒费弗尔", "赖非甫尔", "法贝尔·斯塔普伦西斯"]
role: "巴黎的人文学者、圣经学者"
summary: "法国人文学者，注释保罗书信，讲靠恩得救，把圣经译成法文，始终未离开罗马教会。"
body: |-
  勒费弗尔约 1455 年生于法国北部海边的埃塔普勒，生年只是推定。他在巴黎读书，去过意大利，回来后在巴黎的勒穆瓦纳枢机学院教哲学，整理注释亚里士多德的著作，是法国人文学者中的前辈。五十岁以后他转向圣经。

  1509 年他出版把五种拉丁文诗篇并排对照的《五译本诗篇》，1512 年出版保罗书信的注释。《历史的轨迹》说，他在书中否认善行可以赚取救恩，讲靠恩得救，比路德出名早了几年；路德早年讲诗篇和罗马书时用过他的这两部书。法雷尔是他在巴黎的学生。

  1521 年他的学生布里索内任莫城主教，请他去协助整顿教区，一批有心改革的人聚在那里讲解圣经。1523 年他从拉丁文武加大译本译出法文新约，1530 年全本法文圣经在安特卫普印行。巴黎神学院几次谴责他的著作；该书第二十四章说 1525 年他的书与路德的书一同被定罪。那年法王战败被俘，莫城的团体被解散，他逃到斯特拉斯堡。法王回国后召他回来，让他在布卢瓦做王子的教师。1531 年他到内拉克，受法王的姐姐、纳瓦拉王后玛格丽特庇护，1536 年在那里去世。该书把玛格丽特写成法王的妹妹，她其实比弗朗索瓦一世大两岁。

  该书第二十六章说有人称他为“小路德”，又说他和门徒并不发动改教运动，因为他们不愿脱离罗马教会，只希望革除显著的弊端。相传加尔文逃亡途中在内拉克见过他。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十一章“教会开始动摇” https://wellsofgrace.com/books/spiritual/2000years/html/chapter24.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十四章“瑞士的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter27.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十六章“西欧的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter29.html"
