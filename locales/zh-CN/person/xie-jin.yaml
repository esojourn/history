name: 解缙
aliases: [文毅]
role: 明初大学士，《永乐大典》总纂
summary: 以才学闻名，永乐初入内阁，主持编纂《永乐大典》，后死于狱中。
body: |-
  解缙是江西吉水人，洪武二十一年（1388 年）十九岁时考中进士，以才思敏捷著称，朱元璋很喜欢他，曾说与他“义则君臣，恩犹父子”。他上万言书批评朝政，言辞直率，后来被朱元璋让他父亲带回家读书，说十年后再用。

  朱棣即位后，解缙被召入文渊阁参与机务，与黄淮、杨士奇、杨荣等人同在内阁，明代内阁制度由此发端。永乐元年（1403 年）他奉命主持编纂一部大型类书，次年完成《文献大成》，朱棣嫌它简略，又命姚广孝与他扩大重修，永乐五年（1407 年）编成，赐名《永乐大典》（另见“《永乐大典》编成”条）。

  在立太子的问题上，解缙支持立长子朱高炽，因此得罪了朱棣的次子汉王朱高煦。后来他被贬到广西、交趾任职，永乐八年（1410 年）入京奏事时，正值朱棣北征，他只见了太子就回去了，朱高煦借机告他“无人臣礼”，他被逮捕下狱。永乐十三年（1415 年）锦衣卫纪纲把他灌醉后埋在雪中致死，年四十七岁。民间流传许多他机智对答的故事，多出于附会。
sources: []
recalled:
  - 《明史·解缙传》
