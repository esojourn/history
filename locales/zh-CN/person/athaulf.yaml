name: 阿陶尔夫
aliases: [阿道夫, 阿塔乌尔夫, 阿萨尔夫]
role: 西哥特人的王
summary: 阿拉里克的继任者，率哥特人进入高卢，娶罗马公主加拉·普拉西提阿。
body: |-
  阿陶尔夫是阿拉里克的妻弟，生年不详。409 年他从潘诺尼亚带着一支哥特人和匈人的队伍到意大利与阿拉里克会合。410 年罗马被劫之后，阿拉里克在意大利南部去世，他被推为王。

  412 年他率部众翻过阿尔卑斯山进入高卢，先与在那里称帝的约维努斯联手，随后倒向霍诺里乌斯，擒杀了约维努斯。罗马没有如约供给粮食，他便占了纳尔博和图卢兹。414 年 1 月，他在纳尔博娶了被掳的皇帝之妹加拉·普拉西提阿。奥罗修在《反异教史》里转述一个纳尔博人的话：阿陶尔夫常说，他起初想抹掉罗马的名字，把“罗马尼亚”变成“哥特亚”，后来看出哥特人不肯守法，没有法就没有国家，便立志用哥特人的力量来恢复罗马的声名。

  罗马将军君士坦提乌斯封锁海岸断他的粮，他退到西班牙的巴尔基诺。415 年夏末，他在马厩里被一个要替旧主报仇的随从刺伤，临死嘱咐把普拉西提阿送还罗马。
sources: []
recalled:
  - 奥罗修《反异教史》卷 7 第 43 章
  - 奥林匹奥多罗斯残篇
  - 约达尼斯《哥特史》第 31 章
