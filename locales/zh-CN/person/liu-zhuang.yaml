name: 汉明帝
aliases: [刘庄, 刘阳, 显宗]
role: 皇帝
summary: 东汉第二位皇帝，光武帝之子，在位时治理黄河，重新经营西域。
body: |-
  据《后汉书·明帝纪》，明帝名庄，初名阳，是光武帝的第四子，母亲是阴丽华。建武十七年（公元 41 年）光武帝废郭皇后、立阴氏为后，两年后原太子刘彊让位，刘阳被立为太子并改名。他自幼跟随桓荣学习《尚书》。中元二年（57 年）即位，年号永平。

  明帝为政以严明细察见称，对宗室、外戚约束很紧，不让后妃之家封侯干政。永平十三年（70 年）有人告发楚王刘英图谋不轨，刘英被废后自杀，朝廷穷治此案，受牵连而被处死、流放的人很多。《后汉书》评价他“善刑理”，也批评其苛察。

  永平十二年，他任用王景治理黄河与汴渠，筑堤自荥阳至千乘海口，历时一年完工。同年西南的哀牢人内附，设置永昌郡。永平十六年（73 年），他派窦固等分道出击北匈奴，班超即在这次出征中出使西域；次年重设西域都护，中断数十年的西域与汉朝的联系得以恢复。他重视经学，曾亲临辟雍讲经。

  后世相传明帝夜梦金人，遣使往西域求佛法，这是关于佛教传入中国流传最广的说法，见于《后汉书·西域传》等书。永平十八年（75 年）明帝死于雒阳，《后汉书》记其终年四十八，太子刘炟继位。
sources: []
recalled:
  - 《后汉书·显宗孝明帝纪》
  - 《后汉书·循吏列传》（王景）
  - 《后汉书·西域传》
