name: 王钦若
aliases: [王定国, 瘿相]
role: 北宋宰相
summary: 宋真宗时的宰相，澶渊之役时主张南迁，后来策划天书封禅，主修《册府元龟》。
body: |-
  王钦若是临江军新喻人，生于建隆三年（公元 962 年），淳化三年（992 年）考中进士。他善于揣摩皇帝的心意，在宋真宗朝升迁很快。景德元年（1004 年）辽军南下，他是江南人，主张迁都金陵，被寇准斥责。澶渊之盟以后，他对真宗说这是城下之盟，又说寇准把皇帝当作赌博时孤注一掷的“孤注”，真宗从此疏远寇准。

  他又向真宗建议用封禅来“镇服四海，夸示外国”，与丁谓等人策划了“天书”降临和泰山封禅等一系列活动（另见“天书封禅”条）。他奉命主持编纂大型类书《册府元龟》，汇集历代君臣事迹。天禧元年（1017 年）他第一次拜相，仁宗初年再次拜相，天圣三年（1025 年）在相位上去世。他身材矮小，颈上有瘤，人称“瘿相”。宋人把他与丁谓、林特、陈彭年、刘承珪合称“五鬼”。
sources: []
recalled:
  - 《宋史·王钦若传》
  - 《续资治通鉴长编》卷五十八至一百三
