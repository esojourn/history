name: 提比略·格拉古
aliases: [提比略·塞姆普罗尼乌斯·格拉古, 大格拉古, 提贝里乌斯·格拉古]
role: 罗马保民官
summary: 罗马保民官，提出限制占有公有地、分地给无地公民的土地法，被元老打死。
body: |-
  提比略·塞姆普罗尼乌斯·格拉古，罗马平民贵族出身，约生于公元前 163 年。父亲同名，两任执政官并任过监察官；母亲科尔内利娅是大西庇阿的女儿。他少年时入选占卜官团，娶元老首席阿庇乌斯·克劳狄乌斯·普尔喀之女。前 146 年他随姐夫小西庇阿围攻迦太基，据普鲁塔克，是第一个登上城墙的人。

  前 137 年他任财务官，随执政官曼基努斯出征西班牙的努曼提亚。罗马军队被围，努曼提亚人因信任他父亲当年的名声，只肯同他谈判；他订约救出了全军，据普鲁塔克有两万公民。元老院事后否认和约，他因民众袒护而免于追究。普鲁塔克引他弟弟盖乌斯的话说，他赴西班牙途经伊特鲁里亚，看见田野荒芜，耕牧的都是外来的奴隶，由此有了改革的念头。

  前 133 年他任保民官，在岳父和法学家穆基乌斯·斯凯沃拉等人支持下提出土地法案：重申任何人占有公有地不得超过五百尤格拉的旧限，每个儿子可另加二百五十，超出部分由国家收回，分成小块交给无地公民，不得转卖。同僚保民官屋大维乌斯行使否决权，他让部落大会投票罢免了屋大维乌斯，这在罗马没有先例。法案通过后，由他本人、弟弟盖乌斯和岳父组成三人委员会负责执行。恰逢帕加马国王阿塔罗斯三世去世，把王国遗赠给罗马人民，他提议用这笔遗产资助新得地的农户，触动了元老院主管财政和外交的权限。

  为了保住法律和自身安全，他谋求连任保民官，这也违反惯例。选举当天会场发生冲突，大祭司长西庇阿·纳西卡带领一群元老和随从冲进会场。提比略在卡皮托利山上被人用板凳腿打死，据普鲁塔克，同时被杀的有三百多人，尸体夜里被扔进台伯河。土地委员会在他死后继续工作了若干年，各地发现的界石上刻有委员的名字。古代作家把这一年看作罗马人在内政中流血的开端。
sources: []
recalled:
  - 普鲁塔克《提比略·格拉古传》
  - 阿庇安《内战史》卷一第 7—17 章
  - 李维《建城以来史》卷五十八摘要
