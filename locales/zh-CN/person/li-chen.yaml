name: 唐宣宗
aliases: [李忱, 李怡, 光王]
role: 皇帝
summary: 唐宪宗之子，以皇太叔身份即位，贬李德裕，恢复佛教，收复河湟，史称“大中之治”。
body: |-
  李忱原名李怡，是唐宪宗的第十三子，元和五年（公元 810 年）生，封光王。他是唐穆宗的弟弟，穆宗、敬宗、文宗、武宗在位时他都只是一个王爷。据《资治通鉴》，他平时沉默寡言，宫中人都以为他不聪明，常拿他取笑。会昌六年（846 年）唐武宗病危，宦官马元贽等人以为他容易控制，立他为皇太叔，随即即位，次年改元大中。

  即位以后，他处事精明果断，出乎宦官的意料。他先罢免了李德裕，此后一再贬斥，李德裕最后死在崖州，李德裕一派的官员也纷纷被贬，牛李党争以此告终（另见“牛李党争”条）。他下令恢复佛教，重修寺院，会昌年间的废佛政策大部分被取消（另见“会昌灭佛”条）。吐蕃在 842 年以后陷入内乱，大中三年（849 年）唐朝收复了秦、原、安乐三州和石门等七关；大中五年（851 年），沙州人张议潮派使者奉表归唐，河西十一州的地图户籍送到长安，朝廷在沙州设归义军，以张议潮为节度使（另见“张议潮与归义军”条）。

  他重视官吏的选拔与考核，熟读太宗的《贞观政要》，又爱惜官爵，赏罚严明，所以后人称他为“小太宗”，称这一时期为“大中之治”。但宦官的兵权和藩镇问题并没有解决，晚年各地兵变时有发生。他也服食方士的丹药，大中十三年（859 年）八月因丹药中毒发病去世，年五十。宦官拥立他的长子李漼即位，是为唐懿宗。
sources: []
recalled:
  - 《旧唐书·宣宗纪》
  - 《新唐书·宣宗纪》
  - 《资治通鉴》卷二百四十八至二百四十九
