name: 巴西流
aliases:
  - 该撒利亚的巴西流
  - 大巴西流
  - 巴西尔
role: 该撒利亚主教
summary: 加帕多家该撒利亚的主教，“加帕多家三杰”之首，为东方修道生活立下规章。
body: |-
  巴西流约在公元 330 年生于加帕多家的该撒利亚，家境富裕，几代都是基督徒。祖母老玛格里娜受过殉道者时代教师的教导，姐姐玛格里娜、弟弟女撒的贵格利都以敬虔著称。他先在该撒利亚和君士坦丁堡读书，约 351 年起在雅典求学五年，与拿先斯的贵格利成为至交。

  回乡后他教了一段时间修辞学，约在 357 年受洗。他到埃及、巴勒斯坦和叙利亚访问修士，回来后在本都的伊里斯河边隐居。他不赞成独自苦修到极端，主张修士住在一起，祷告、劳动、读经，并且服事穷人。他为此写的长短两种《会规》，后来成为东方教会修道生活的基本规章。

  公元 364 年他被立为长老，370 年当选该撒利亚主教。当时东方的皇帝华伦斯支持亚流派，派大臣莫德斯图来威逼他，拿先斯的贵格利的讲章里记下了他不肯让步的答话。皇帝后来没有放逐他。他在该撒利亚城外建了一大片房舍，有医院、收容穷人和旅客的地方，当地人称为“巴西流城”。

  《历史的轨迹》第五章说，亚他那修死后，为正统信仰奋斗的责任落在“加帕多家三杰”身上，巴西流是其中之一。他在 375 年写成《论圣灵》，论证圣灵应当与父、子同受尊荣；又分清“本质”和“位格”两个词的用法，说神是一个本质、三个位格，为 381 年君士坦丁堡会议的结论作了准备。他在 379 年 1 月 1 日去世，没有看到那次会议。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
recalled:
  - 巴西流《论圣灵》《书信》第 2、14、223 封
  - 拿先斯的贵格利《讲章》第 43 篇（巴西流悼词）
  - 女撒的贵格利《玛格里娜传》
