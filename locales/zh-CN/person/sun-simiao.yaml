name: 孙思邈
aliases: [药王]
role: 医学家
summary: 隋唐之际的医学家，屡次辞谢朝廷的官职，著《备急千金要方》和《千金翼方》。
body: |-
  孙思邈是京兆华原人，生年说法不一：《旧唐书》本传说西魏、北周之际的独孤信曾见过他，称他为“圣童”，照此他应生于公元 6 世纪中期，到去世时已一百多岁；但本传又引他自述生于隋开皇元年（581 年），二者矛盾，学界至今没有定论。据本传，他幼年聪颖，七岁读书，每天能诵读一千多字，长大后精通老庄学说和佛典。

  北周和隋朝都曾征召他做官，他都没有接受，隐居在太白山等地。唐太宗即位后召他到京城，据本传，太宗惊讶他年纪很大而容貌仍像年轻人，想授他爵位，他坚决辞谢。高宗时又要任命他为谏议大夫，他仍不接受。上元元年（674 年）他称病请求还山，高宗赐给他良马和鄱阳公主的旧宅。当时的名士宋令文、孟诜、卢照邻等人都以对待老师的礼节对待他。永淳元年（682 年）他去世，遗嘱薄葬，不用冥器。

  他认为人命至重，贵于千金，因此把自己编著的医书命名为《备急千金要方》，共三十卷，后来又编成《千金翼方》三十卷作为补充。这两部书收集了大量方剂，涉及内科、外科、妇科、儿科、针灸、食疗和养生等方面，书中把妇科和儿科放在卷首，强调对妇女和儿童的诊治。《千金要方》卷首的《大医精诚》一篇，论述医生应有的品德，要求对病人不分贵贱贫富、一视同仁，至今仍被医界引用。

  后世尊他为“药王”，各地多有药王庙祭祀他。他的家乡耀州（今陕西铜川耀州区）有药王山，相传是他隐居采药的地方。
sources: []
recalled:
  - 《旧唐书·孙思邈传》
  - 《新唐书·孙思邈传》
  - 孙思邈《备急千金要方》序及《大医精诚》
