name: "阿德里安六世"
aliases: ["亚得良六世", "哈德良六世", "乌得勒支的阿德里安"]
role: "罗马教皇"
summary: "荷兰人，查理五世的老师，任教皇二十个月，公开承认教廷腐败，想改革而未成。"
body: |-
  阿德里安 1459 年 3 月生于乌得勒支，父亲是木匠。他幼年在共同生活弟兄会办的学校读书，后来在鲁汶大学读神学、任教，做到校长。1507 年他被请去做未来的皇帝查理的老师。1515 年他被派到西班牙，次年任托尔托萨主教，与西曼乃斯一同摄政，以后又任宗教裁判所总裁判长和枢机，1520 年查理去德意志时留他做西班牙的总督。

  1521 年底利奥十世去世，枢机们相持不下。《历史的轨迹》第二十九章说，打破僵局的唯一办法是接受皇帝查理提出的人选；按通行的记载，1522 年 1 月是枢机美第奇提了这个不在场的外国人的名字，结果出乎众人意料，连查理事先也不知道。他沿用本名，称阿德里安六世，8 月底才到罗马。

  该书说他敬虔严谨，完全赞同西曼乃斯，想把西班牙的改革搬到罗马，却一败涂地：他不懂意大利人的生活和语言；教廷有数千人靠各种规费为生，取消弊端就是断他们的生计；他又没有伊莎贝拉那样的君主做后盾。他裁减宫廷开支，停建工程，罗马人嫌他吝啬、不懂艺术。他在位时，罗得岛被土耳其人攻陷，罗马又闹鼠疫。

  1522 年底他派使节到纽伦堡的帝国议会，要求执行处置路德的敕令，同时让使节当众承认：这场祸患起于教士的罪，多年来教廷里出了许多可憎的事，病是从头传到肢体的；他愿意先从教廷改起。该书说教廷的朝臣为此讥笑他，却认为这件事意义重大，罗马教会的改革由此发端。德意志诸侯的回答是开列了一百条对教廷的不满。

  1523 年 9 月 14 日他在罗马去世。该书引他墓上的话，大意是他一生最大的不幸是做了统治者；又说他是最后一位非意大利人的教皇。这话写于 1951 年，直到 1978 年才有波兰人约翰·保罗二世当选。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十九章“罗马教会从事改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter32.html"
recalled:
  - "阿德里安六世给使节基耶雷加蒂的训令（1522 年 11 月，次年初在纽伦堡帝国议会宣读）"
  - "保罗·焦维奥《阿德里安六世传》"
  - "圭恰迪尼《意大利史》"
