name: 刘备
aliases: [刘玄德, 汉昭烈帝, 先主, 汉中王]
role: 皇帝
summary: 蜀汉的建立者，辗转半生后取得荆州、益州，公元 221 年在成都称帝。
body: |-
  据《三国志·蜀书·先主传》，刘备字玄德，涿郡涿县人，自称是汉景帝之子中山靖王刘胜的后代。他幼年丧父，与母亲靠贩鞋织席为生。十五岁时外出求学，拜同郡的卢植为师。中平元年（公元 184 年）黄巾起事，他带领一批人参加镇压，开始做县尉一类的小官，关羽、张飞从这时起跟随他。

  此后二十多年他一直没有稳固的地盘。他先依附公孙瓒，后来应徐州牧陶谦之请前往救援，陶谦死后接管徐州，不久被吕布夺去。他投奔曹操，随献帝到许都，被任为左将军；建安四年（199 年）借出兵拦截袁术之机重占徐州，背离曹操。次年曹操东征，他兵败投奔袁绍，随后南下依附荆州的刘表，驻在新野。在荆州期间，他到隆中请出诸葛亮。

  建安十三年（208 年）曹操南下，刘表之子刘琮投降，刘备在当阳长坂被曹军追上击溃，退到夏口，派诸葛亮去见孙权，结成联盟，在赤壁击败曹军。战后他占据荆州南部四郡，又向孙权借得南郡。建安十六年，益州牧刘璋请他入蜀抵御张鲁；次年双方反目，建安十九年（214 年）他包围成都，刘璋出降。建安二十四年他从曹操手里夺得汉中，自称汉中王；同年冬，留守荆州的关羽被孙权袭杀，荆州丢失。

  曹丕代汉的次年（221 年）四月，刘备在成都称帝，国号仍为汉，年号章武，史称蜀汉。七月他亲自率军东征孙权，次年在夷陵被陆逊击败，退到白帝城。章武三年（223 年）四月他在白帝城的永安宫去世，终年六十三，临终把儿子刘禅托付给丞相诸葛亮。
sources: []
recalled:
  - 《三国志·蜀书·先主传》及裴松之注
