name: 狄奥多西一世
aliases:
  - 狄奥多西
  - 狄奥多西大帝
role: 罗马皇帝
summary: 罗马皇帝，定尼西亚信仰为国教，召开君士坦丁堡会议，是最后一位统治帝国全境的皇帝。
body: |-
  狄奥多西于公元 347 年生在西班牙的考卡，父亲是同名的将军，376 年被处死，他因此回乡闲居。公元 378 年瓦伦斯皇帝在阿德里安堡阵亡，西部的皇帝格拉提安起用他，379 年 1 月立他为共治皇帝，让他治理东部。《历史的轨迹》第七章称他是能干的政治家和军事家。他花了几年稳住局面，382 年与哥特人订约，让他们在多瑙河以南定居，为帝国当兵。

  公元 380 年 2 月，他在帖撒罗尼迦下诏，命令所有臣民信奉罗马主教和亚历山大主教所传的信仰，即父、子、圣灵同为一位神。这年他在一场重病中受洗。进入君士坦丁堡后，他把城里的教堂从亚流派手中收回。381 年他召集东方主教在君士坦丁堡开会，会议重申尼西亚信经，并申明圣灵的神性。391 至 392 年，他接连下令禁止献祭和进入神庙，异教的公开敬拜从此不合法。

  公元 390 年，帖撒罗尼迦的民众在骚乱中打死了当地的驻军长官，狄奥多西下令报复，军队在赛车场里屠杀了大批市民，狄奥多勒说有七千人。米兰主教安波罗修写信给他，说他若不公开悔罪，自己就不能当着他的面献圣餐。皇帝接受了，脱去皇袍在教堂里认罪，几个月后才重新领圣餐。《历史的轨迹》第五章讲了这件事，书中说被杀的是省长。

  他两次西征，388 年击败篡位的马克西穆，394 年在冷河击败欧根尼乌，此后几个月里独自统治整个帝国。395 年 1 月 17 日他在米兰去世，安波罗修致悼词。帝国由两个儿子分治，阿卡狄乌斯在东，霍诺里乌斯在西，此后再没有合一。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 《狄奥多西法典》卷 16 第 1 章第 2 条、第 10 章第 10—12 条
  - 安波罗修《书信》第 51 封、《狄奥多西悼词》
  - 狄奥多勒《教会史》卷 5 第 17—18 章
  - 佐西莫斯《新历史》卷 4
