name: "卡利克斯特"
aliases: ["格奥尔格·卡利克斯特", "加历斯都"]
role: "路德派神学家"
summary: "黑尔姆施泰特的路德派神学家，主张各宗派以圣经和古信经为共同基础，引起长年争论。"
body: |-
  卡利克斯特 1586 年生于石勒苏益格的梅德尔比，父亲是路德派牧师。他在黑尔姆施泰特读书，游历英国、法国、荷兰，与改革宗、安立甘派和天主教学者多有接触，1614 年起在黑尔姆施泰特大学任神学教授，直到去世。

  《历史的轨迹》第三十八章说，他极力反对路德派内部这么多不愉快的争论，认为路德派与改革派、天主教的差异并不重要，重要的是基督徒的生活，教会有圣经和使徒信经就够了。据一般记载，他主张以头五个世纪教会共同承认的信仰作为合一的基础。作者认为他的看法缺乏远见，但仍吸引不少人，因为人们早已厌倦教义争论。

  该书说，在 1645 年召开的会议中，他的看法遭到强烈反对，争论又持续了多年，到他去世时大家已争得筋疲力尽。这次会议是波兰国王召集的托伦宗教对话，他作为改革宗一方的顾问出席，路德派代表因此对他大为不满。他的主张被正统派称为“调和主义”。他 1656 年死于黑尔姆施泰特。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十八章“德国与英国的宗教生活” https://wellsofgrace.com/books/spiritual/2000years/html/chapter42.html"
