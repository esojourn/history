name: 高太后
aliases: [宣仁圣烈皇后, 高滔滔]
role: 宋英宗皇后，哲宗初年垂帘听政
summary: 宋英宗的皇后，哲宗年幼时垂帘听政，起用司马光，废除新法。
body: |-
  高太后是宋英宗的皇后、宋神宗的母亲，出身将门，曾祖父是宋初名将高琼，母亲是仁宗曹皇后的姐姐，她幼年在宫中长大，后来嫁给英宗。英宗即位后立为皇后，神宗即位后尊为皇太后。神宗推行新法时，她和曹太皇太后都表示反对，熙宁七年（1074 年）王安石第一次罢相，与两宫太后的态度有关。

  元丰八年（1085 年）神宗去世，九岁的哲宗即位，她以太皇太后的身份垂帘听政，召回司马光、吕公著任宰相，废除了免役、青苗、保甲等大部分新法，贬逐蔡确、章惇等推行新法的大臣，史称“元祐更化”（另见该条）。她约束外戚，不让娘家人担任要职，生活俭朴，旧党士大夫称她为“女中尧舜”。元祐八年（1093 年）她去世，哲宗亲政后不久就改变了她的政策。
sources: []
recalled:
  - 《宋史·后妃传上·英宗宣仁圣烈高皇后》
