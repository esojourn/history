name: 赫费斯提翁
aliases: [赫菲斯提昂]
role: 马其顿将领
summary: 亚历山大自幼的挚友，后期统领伙伴骑兵，公元前 324 年病逝。
body: |-
  马其顿佩拉人，阿明托尔之子，与亚历山大年纪相仿，自少年时就在一起，可能一同在米埃扎听过亚里士多德讲课。他早期的经历记载很少。阿里安转述说，前 334 年大军经过特洛伊，亚历山大向阿喀琉斯的墓献花环，赫费斯提翁向帕特洛克罗斯的墓献花环。另一则故事说，伊苏斯之战后两人一同去见被俘的波斯太后，太后见赫费斯提翁身材更高，误向他行礼，亚历山大说：“您没有弄错，他也是亚历山大。”阿里安记下这事时说明自己并不确信。

  前 330 年菲洛塔斯被处死，伙伴骑兵分为两部，由他和克莱图斯分领。此后他常受命办理需要信任的事务：建城、架桥、运送辎重。前 327 年进军印度，他与佩尔狄卡斯先行到印度河架设浮桥；顺印度河南下时，他和克拉特鲁斯各领一军沿两岸行进。他支持亚历山大采用波斯礼仪和任用波斯人的做法，因此与克拉特鲁斯、欧迈尼斯等人不和。普鲁塔克记载亚历山大说过，克拉特鲁斯爱的是国王，赫费斯提翁爱的是亚历山大。

  回到波斯腹地后，他担任“千夫长”，在波斯官制里这是国王之下的首席大臣。前 324 年苏萨的集体婚礼上，亚历山大娶大流士三世的长女，让他娶其妹德吕佩提斯，据阿里安，是希望两人的孩子成为表亲。

  同年秋，宫廷在埃克巴坦那举行竞技和宴饮，他发烧卧病，第七天去世。亚历山大悲痛之极，史书记载他伏尸不起、剪发志哀，有的说他处死了医生。他派人到锡瓦绿洲求问，神谕准许把赫费斯提翁奉为英雄来祭祀。他下令在巴比伦修建巨大的火葬堆，据狄奥多罗斯和阿里安，预计耗费一万塔兰特或更多。八个月后亚历山大自己也去世了。
sources: []
recalled:
  - 阿里安《亚历山大远征记》卷一第 12 章、卷二第 12 章、卷七第 4 章、第 14 章
  - 普鲁塔克《亚历山大传》第 47 章、第 72 章
  - 狄奥多罗斯《历史丛书》卷十七第 110 章、第 114—115 章
