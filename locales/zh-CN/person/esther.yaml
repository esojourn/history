name: 以斯帖
aliases: [哈大沙]
role: 波斯王后
summary: 犹太女子，作了波斯王亚哈随鲁的王后，救本族免遭灭绝。
body: |-
  犹太女子，本名哈大沙，是亚比孩的女儿（《以斯帖记》2:7、2:15）。她父母早亡，由堂兄末底改收养，住在波斯的书珊城。圣经没有记载她的生卒年。书中的亚哈随鲁王，一般认为就是希腊史料中的薛西斯一世（公元前 486—前 465 年在位）。

  据《以斯帖记》第 1—2 章，亚哈随鲁第三年设宴时，王后瓦实提不肯奉召到席前，被废。后来王在国中选召女子入宫，以斯帖在其中；她照末底改的嘱咐没有说出自己的籍贯宗族。王第七年十月她被带进宫见王，得王喜爱，被立为王后。

  王第十二年，大臣哈曼因末底改不向他跪拜，求得王旨，定在十二月十三日灭绝国中所有犹太人（第 3 章）。末底改托人告诉以斯帖，劝她去见王，说她得了王后的位分或许正是为了现今的机会。按当时的规矩，未蒙召而擅入内院见王的人要治死，除非王向他伸出金杖。以斯帖吩咐书珊的犹太人为她禁食三昼三夜，然后进去见王，王向她伸出金杖（第 4—5 章）。

  她两次请王和哈曼赴宴，在第二次席上说明自己的民族，指出要害她和她本族的人就是哈曼。王下令把哈曼挂在他为末底改预备的木架上（第 7 章）。因为先前的谕旨不能废除，王让末底改另写谕旨，准许犹太人在那一天聚集自卫（第 8 章）。事后以斯帖和末底改写信，嘱咐各地犹太人每年守普珥节（9:20–32）。

  《以斯帖记》的希伯来文本通篇没有出现神的名字。希罗多德记薛西斯的王后名叫阿美斯特里斯，圣经以外的史料中尚未见到以斯帖的名字，这卷书的历史性学界有不同看法。书中没有交代她后来的事。
sources: []
recalled:
  - 《以斯帖记》第 1—10 章
  - 希罗多德《历史》卷 7、卷 9
