name: 杨业
aliases: [杨继业, 刘继业, 杨无敌, 杨重贵]
role: 北宋将领
summary: 北汉降将，入宋后镇守雁门，号称“杨无敌”，雍熙北伐时兵败陈家谷，被俘绝食而死。
body: |-
  杨业本名重贵，据《宋史》本传是并州太原人（一说是麟州人），生年史书没有记载。他年轻时侍奉北汉开国君主刘崇，被赐姓刘，改名继业，屡立战功，人称“杨无敌”。太平兴国四年（979 年）宋太宗攻打太原，北汉末主刘继元投降，杨业随之归宋，恢复本姓，单名业。

  宋太宗知道他熟悉边事，任命他为代州知州兼三交驻泊兵马部署，镇守雁门一带。太平兴国五年（980 年）辽军大举进攻雁门，杨业率数百骑兵从小路绕到辽军背后，与正面的宋军夹击，辽军大败。此后辽军望见杨业的旗帜就撤退。一些宋将嫉妒他，向朝廷暗中诋毁，太宗把这些奏章封好交给杨业，表示信任。

  雍熙三年（986 年）宋军北伐，杨业为西路军副帅，随潘美攻下云、应、寰、朔四州。东路军在岐沟关大败后，西路军奉命掩护四州百姓南迁。据《宋史》本传，杨业主张避开辽军锋芒，从小路护送百姓；监军王侁讥笑他怯战，逼他正面迎敌。杨业出战前请潘美等人在陈家谷口布置伏兵接应，自己且战且退到谷口时却不见援军，率部下力战，身受几十处伤，最终被辽军俘虏。他在辽营中绝食三天而死（另见“雍熙北伐”条）。

  杨业死后，宋太宗下诏痛惜，追赠太尉，处罚了潘美和王侁。他的儿子杨延昭（本名延朗）、孙子杨文广后来也是守边的将领。民间以他们一家为原型，发展出“杨家将”的故事，其中佘太君、穆桂英等人物和许多情节都是后世文学的创作。
sources: []
recalled:
  - 《宋史·杨业传》
  - 《辽史·圣宗本纪》
  - 《续资治通鉴长编》卷二十七
