name: 晋元帝
aliases: [司马睿, 司马景文, 琅邪王, 中宗]
role: 皇帝
summary: 东晋开国皇帝，原为琅邪王，依靠王导等南北士族在建康重建晋室。
body: |-
  司马睿字景文，是司马懿的曾孙，祖父司马伷、父亲司马觐相继为琅邪王。他生在洛阳，十五岁袭封。永兴元年（公元 304 年）他随晋惠帝北征成都王颖，兵败后叔父被成都王所杀，他逃出邺城，回到封国。此后他依附东海王越，受命镇守下邳，以同郡的王导为司马，事事与他商议。

  永嘉元年（307 年），他采纳王导的建议，请求移镇江南，同年渡江到达建邺。他在皇族中名位不高，据《晋书·王导传》，到任一个多月，江东的士人没有来拜见的。王导安排他在三月上巳出行观禊，自己和王敦等北方名士骑马随从，江东大族看到这种阵势，才陆续归附，顾荣、贺循等人都受到任用。洛阳陷落后，中原士族和百姓大批南渡，他的幕府成为晋室在南方的中心，先后平定了不服号令的江州刺史华轶和在湘州一带起事的流民首领杜弢。

  建兴四年（316 年）长安陷落，晋愍帝被俘。次年三月，他在建康称晋王，改元建武；大兴元年（318 年）三月愍帝的死讯传来，他即皇帝位。当时王导在朝辅政，王敦领兵镇守上游，时人有“王与马，共天下”的说法，见《晋书·王敦传》。

  他不甘心大权旁落，重用刘隗、刁协来抑制王氏，又征发扬州各郡大族的僮客当兵，以北伐为名分派亲信镇守要地。永昌元年（322 年）正月，王敦以讨刘隗为名从武昌起兵，攻入建康的石头城，杀了周顗、戴渊等大臣，刁协被杀，刘隗逃往后赵。他受制于王敦，同年闰十一月（已入公元 323 年）忧愤而死，时年四十七。
sources: []
recalled:
  - 《晋书·元帝纪》
  - 《晋书·王导传》
  - 《资治通鉴》卷八十六至九十二
