name: 胡斯
aliases:
  - 约翰·胡斯
  - 扬·胡斯
  - 胡司
role: 布拉格大学校长、改教先驱
summary: 波希米亚的讲道者、布拉格大学校长，受威克里夫影响，反对赎罪券，在康斯坦茨被烧死。
body: |-
  胡斯生于波希米亚南部的胡西内茨。《历史的轨迹》第二十章说他大约生于 1369 年，学者推定的年份在 1369 至 1372 年之间。他在布拉格大学读书，1396 年得硕士学位，1400 年受立为司铎。该书说他作过大学神学部主任，后来成为校长；他担任的是文学院院长，1409 年任校长。从 1402 年起，他在布拉格的伯利恒小堂用捷克语讲道。

  威克里夫的著作这时已传到布拉格。胡斯接受了他关于教会的看法，但没有否定化质说。《历史的轨迹》引他的话：神圣的教会包括所有预定得救的人；一个人可以在教会里而不真正属于教会；在普世教会中唯独基督是头；教皇和枢机不是教会必不可少的。1410 年布拉格大主教焚烧威克里夫的书，革除了胡斯的教籍。

  该书说当时在位的两位教皇是“亚威农的约翰廿三世及罗马的贵格利十二世”。那时其实有三位教皇，约翰二十三世属于比萨会议选出的一系，在阿维农一系的是本笃十三世。1412 年约翰为了同保护贵格利十二世的那不勒斯国王作战，在布拉格发售赎罪券，胡斯公开反对，再次被革除教籍，布拉格全城受到禁令。他离开布拉格，在乡间写了《论教会》。《历史的轨迹》说他转而向大公会议上诉；按他自己留下的文字，1412 年他是向基督上诉。

  1414 年皇帝西吉斯蒙德召集康斯坦茨会议，给他安全通行的保证。他 11 月初到达，月底就被拘禁，囚禁了七个多月。该书说会议完全不给他申辩的机会；1415 年 6 月会议三次公开提审他，会场喧哗，他难以把话说完。他表示，凡能用圣经指明他错的，他愿意改正，但不能承认自己没有讲过的东西。

  1415 年 7 月 6 日，他在康斯坦茨的主教座堂被定为异端，当众被剥去司铎的礼服，戴上画着魔鬼的纸帽，押到城外烧死，骨灰撒进莱茵河。此后波希米亚人同讨伐他们的十字军打了十多年的仗。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 胡斯《论教会》及狱中书信
  - 姆拉多尼奥维采的彼得《胡斯受审与殉道记》
  - 康斯坦茨会议第 15 次会议（1415 年 7 月 6 日）判决
