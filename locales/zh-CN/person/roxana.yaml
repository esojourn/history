name: 罗克珊娜
aliases: [罗克萨娜]
role: 亚历山大之妻
summary: 巴克特里亚贵族之女，亚历山大的妻子，亚历山大四世之母，母子都被卡山德杀害。
body: |-
  巴克特里亚（一说索格底亚那）贵族奥克夏特斯之女，生年不详。公元前 327 年亚历山大攻下当地一处山寨，她在被俘的人当中；这处山寨是“索格底亚那岩”还是另一处，各书所记不一。阿里安说，见过她的人认为她是亚洲仅次于大流士之妻的美人，亚历山大没有把她当作俘虏，而是正式娶她。这桩婚姻也有安抚当地贵族的用意，奥克夏特斯后来被任命为总督。

  前 324 年亚历山大在苏萨又娶了大流士三世的女儿斯塔泰拉。前 323 年 6 月他在巴比伦去世，罗克珊娜已有身孕。据普鲁塔克，她在佩尔狄卡斯默许下，把斯塔泰拉骗来杀死。几个月后她生下一个男孩，即亚历山大四世，与亚历山大的异母兄腓力三世并立为王，由佩尔狄卡斯摄政。

  佩尔狄卡斯死后，安提帕特把两位国王和她带回马其顿。前 317 年太后奥林匹亚斯回国掌权，母子随她同住。次年卡山德攻下彼得那，处死奥林匹亚斯，把罗克珊娜和孩子关在安菲波利斯的卫城，不再给予王室的待遇。

  前 311 年几位继业者议和，约定卡山德任欧洲的统帅，“直到亚历山大四世成年”。孩子这时已十二三岁。据狄奥多罗斯，卡山德随后命看守格劳基亚斯把母子二人秘密杀死、掩埋，事在前 310 年前后。亚历山大的直系至此断绝。
sources: []
recalled:
  - 阿里安《亚历山大远征记》卷四第 18—20 章
  - 普鲁塔克《亚历山大传》第 47 章、第 77 章
  - 狄奥多罗斯《历史丛书》卷十九第 52 章、第 105 章
