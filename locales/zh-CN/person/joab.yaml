name: 约押
aliases: []
role: 大卫的元帅
summary: 洗鲁雅之子，大卫的外甥和元帅，屡立战功，所罗门即位后被处死。
body: |-
  约押是洗鲁雅的儿子，洗鲁雅是大卫的姐妹（《历代志上》2:16），他有两个兄弟亚比筛和亚撒黑。圣经没有记载他的生年。大卫在希伯仑作犹大王的时候，约押在基遍池旁与扫罗家的元帅押尼珥对阵，亚撒黑被押尼珥所杀；后来押尼珥来投大卫，约押在希伯仑的城门把他刺死（《撒母耳记下》第 2—3 章）。

  据《历代志上》11:6，大卫攻打耶布斯人的时候，约押先上去，就作了元帅。他此后统领全军，攻打亚兰人、以东人和亚扪人；围攻拉巴时，他照大卫信上的吩咐把乌利亚派到险处（撒下第 11 章）。押沙龙反叛，大卫嘱咐众将宽待押沙龙，约押却用三杆短枪刺透了他的心（18:14）。大卫改立亚玛撒作元帅，约押又刺死亚玛撒，随后平定了示巴的叛乱（第 20 章）。大卫要数点百姓，约押曾出言劝阻（24:3）。

  大卫年老的时候，约押随从亚多尼雅。大卫临终嘱咐所罗门，不要容约押白头安然下阴间（《列王纪上》2:5–6）。约公元前 970 年所罗门即位以后，约押逃到耶和华的帐幕，抓住祭坛的角；所罗门差比拿雅在那里把他杀了（2:28–34）。
sources: []
recalled:
