name: 袁崇焕
aliases: [元素, 自如]
role: 明末督师蓟辽
summary: 坚守宁远击退努尔哈赤，后督师蓟辽，己巳之变后以通敌罪被处死。
body: |-
  袁崇焕的籍贯是广东东莞，一说他生于广西藤县，祖籍东莞。万历四十七年（1619 年）他考中进士，任福建邵武知县，喜欢谈论兵事。天启二年（1622 年）广宁失守后，他单骑出关考察形势，回京后自请守辽，被任命为兵部职方司主事，随后到山海关，在孙承宗的支持下修筑宁远城。

  天启五年（1625 年）孙承宗去职，经略高第下令放弃关外诸城，袁崇焕拒绝撤退，坚守宁远。天启六年（1626 年）正月努尔哈赤率大军攻城，袁崇焕用从澳门葡萄牙人那里购得的西洋大炮（时称“红夷大炮”）轰击，后金军损失很大，被迫退兵，这是努尔哈赤起兵以来少有的挫败（另见“宁远之战”条）。次年皇太极进攻宁远、锦州，又被击退。但魏忠贤一派认为他没有救援锦州，他被迫辞职。

  崇祯元年（1628 年）崇祯帝起用袁崇焕为兵部尚书、督师蓟辽，他向崇祯帝表示五年可以恢复辽东。崇祯二年（1629 年）他以擅自通敌、不听节制等罪名，在双岛设计斩杀驻守皮岛的总兵毛文龙，这件事引起很大争议。同年十月皇太极绕过宁锦防线，从蒙古地区攻破长城入关，直逼北京。袁崇焕率军入援，在北京城外与后金军交战。由于他此前曾与后金议和，又没有阻止后金军入关，城中流言说他引敌入关，崇祯帝将他逮捕下狱（另见“己巳之变”条）。

  崇祯三年（1630 年）八月袁崇焕以“通敌谋叛”等罪名在北京被凌迟处死，据说北京百姓痛恨他，争食其肉。清朝修《明史》时，根据清朝的档案写明皇太极曾使用反间计，让被俘的明朝宦官听到袁崇焕与后金有密约的假话，再故意放他回去报告崇祯帝。这一记载是否可信、反间计在袁崇焕之死中起了多大作用，学者有不同看法。乾隆年间清朝为他平反。他的部下佘姓义士偷偷收葬他的头颅，后人世代守墓，墓在今北京东城区。
sources: []
recalled:
  - 《明史·袁崇焕传》
  - 《清太宗实录》
  - 计六奇《明季北略》
