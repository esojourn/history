name: 挪亚
aliases: []
role: 造方舟的义人
summary: 拉麦之子，奉神的吩咐造方舟，一家八口在大洪水中存活。
body: |-
  挪亚是拉麦的儿子、玛土撒拉的孙子，属塞特一支。据《创世记》5:28–29，拉麦一百八十二岁生了他，给他起名叫挪亚，说这个儿子必为我们的操作和手中的劳苦安慰我们。又据 5:32，挪亚五百岁生了闪、含、雅弗。

  《创世记》第 6 章说，那时地上满了强暴，耶和华见人在地上罪恶很大，就后悔造人在地上；惟有挪亚在耶和华眼前蒙恩。经文称他是个义人，在当时的世代是个完全人，与神同行（6:5–9）。神吩咐他用歌斐木造一只方舟，长三百肘，宽五十肘，高三十肘，分上、中、下三层，并要他带着全家和各样活物进入方舟（6:14–21）。挪亚都照样行了。

  据《创世记》7:6，洪水泛滥在地上的时候，挪亚整六百岁。他和妻子、三个儿子、三个儿妇进入方舟；新约《彼得前书》3:20 说，藉着水得救的共有八个人。水退以后方舟停在亚拉腊山上。挪亚出方舟后筑了一座坛，献上燔祭（8:20）。神赐福给他和他的儿子，许他们吃肉，只是不可吃带血的肉，又与他们并一切活物立约，不再有洪水毁坏全地，以云中的虹为立约的记号（9:1–17）。

  此后挪亚作起农夫来，栽了一个葡萄园。有一次他喝酒醉了，在帐棚里赤着身子，含看见了，去告诉两个弟兄；闪和雅弗拿衣服倒退着进去给父亲盖上。挪亚醒了酒，就咒诅含的儿子迦南，为闪和雅弗祝福（9:20–27）。据 9:28–29，洪水以后挪亚又活了三百五十年，共活了九百五十岁。他死在何处，圣经没有记载。

  《以西结书》14:14 把挪亚与但以理、约伯并提。新约里，耶稣用挪亚的日子比方人子降临的时候（《马太福音》24:37–39），《希伯来书》11:7 说他因着信预备了方舟，《彼得后书》2:5 称他是传义道的。
sources: []
