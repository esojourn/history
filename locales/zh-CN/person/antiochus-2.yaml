name: 安条克二世
aliases: [ 安条克二世·提奥斯, 神 ]
role: 塞琉古国王
summary: 塞琉古国王，与埃及议和并娶托勒密二世之女；东部行省的脱离约始于其在位末年。
body: |-
  安条克二世是安条克一世与斯特拉托尼丝之子，公元前 286 年生，前 261 年继位。在位初年他与马其顿的安提柯二世联手，同埃及打了第二次叙利亚战争，在小亚细亚沿岸夺得米利都、以弗所等地。阿庇安说，米利都人因为他除掉了当地的僭主而尊他为“神”（提奥斯）。

  约前 253 年他与托勒密二世议和，按约休弃原配劳狄丝，改娶托勒密二世之女贝勒尼基。前 246 年他回到小亚细亚的劳狄丝身边，不久去世；优西比乌《编年史》说他病死于以弗所，阿庇安等人则说是劳狄丝下的毒。两位王后各拥其子争位，埃及出兵干预，引发第三次叙利亚战争。

  巴克特里亚总督狄奥多图斯和帕提亚总督安德拉戈拉斯脱离塞琉古王国，通常系于他在位末年或其子塞琉古二世初年，具体年份史料不足，没有定论。
sources:
  - 阿庇安《叙利亚战争》第 65 章 https://www.livius.org/sources/content/appian/appian-the-syrian-wars/appian-the-syrian-wars-13/
  - 英文维基百科“Antiochus II Theos”条（生卒与在位年份） https://en.wikipedia.org/wiki/Antiochus_II_Theos
recalled:
  - 优西比乌《编年史》（引波菲利，安条克二世卒于以弗所）
  - 查士丁《腓力史摘要》第 27 卷第 1 章、第 41 卷第 4 章
