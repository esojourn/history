name: 苏颂
aliases: [苏子容, 苏魏公]
role: 北宋宰相、科学家
summary: 北宋宰相、科学家，主持制造天文仪器水运仪象台，主编《本草图经》。
body: |-
  苏颂是泉州同安人，生于天禧四年（公元 1020 年），庆历二年（1042 年）考中进士，此后长期在馆阁和地方任职。他学识广博，嘉祐年间参与校订医书，主持编写了《本草图经》，书中收录各地进献的药物图样和说明，是一部附有大量插图的药物学著作。

  元祐元年（1086 年）他奉命检验新旧浑仪，推荐吏部令史韩公廉等人，开始设计制造一座大型的天文仪器，元祐七年（1092 年）前后完成，称为“水运仪象台”（另见“水运仪象台建成”条）。他把仪器的结构和图样写成《新仪象法要》一书。同年他升任宰相，次年罢相。此后他以太子少师致仕，晚年居住在润州，建中靖国元年（1101 年）去世。
sources: []
recalled:
  - 《宋史·苏颂传》
  - 苏颂《新仪象法要》
  - 曾肇《苏魏公神道碑》
