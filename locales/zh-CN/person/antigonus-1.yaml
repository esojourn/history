name: 安提柯一世
aliases: [独眼安提柯, 安提柯]
role: 继业者、亚洲之王
summary: 亚历山大的部将，人称“独眼”，一度据有亚洲大部，最先称王，在伊普苏斯战死。
body: |-
  马其顿贵族，腓力之子，约生于公元前 382 年，与腓力二世同辈。他在作战中失去一只眼睛，绰号“独眼”。前 333 年亚历山大东进，留他在小亚细亚腹地做大弗里吉亚总督，驻克莱奈。伊苏斯之战后波斯残部反攻小亚细亚，被他三次击败。此后十年他一直守在这里，没有随军东征。

  前 323 年亚历山大去世，他保有原辖区。因不肯听命于摄政佩尔狄卡斯，他逃往马其顿，促成安提帕特等人联合反对佩尔狄卡斯。前 321 年前后的特里帕拉狄索斯分封中，他受命统领王室在亚洲的军队，讨伐欧迈尼斯。经过几年战事，前 316 年初他在伽比埃奈之战后擒杀欧迈尼斯，随后处置东方各总督，处死培松，逼走巴比伦总督塞琉古，取得苏萨等地金库中的巨额财富，成为继业者中最强的一个。

  托勒密、卡山德、利西马科斯和逃到埃及的塞琉古联合起来，要求他分出土地和金钱，战争自前 315 年打到前 311 年。他在推罗发表宣言，声讨卡山德，并宣布希腊人应当自由、自治、不受驻军，其他几家随后也作同样的表示。前 312 年他的儿子德米特里在迦萨败于托勒密，塞琉古趁机回到巴比伦，此后安提柯东征数年也未能把他赶走。

  前 307 年德米特里渡海到雅典，赶走卡山德的驻军，雅典人把父子二人奉为“救主神”。前 306 年德米特里在塞浦路斯的萨拉米斯大败托勒密的舰队，安提柯接到捷报后戴上王冠，并给儿子也送去一顶。亚历山大四世这时已死，其他几位继业者在一两年内相继称王。同年他进攻埃及，因风浪和尼罗河防线受阻而退；前 305 年至前 304 年德米特里围攻罗得岛也没有成功。他在叙利亚的奥龙特斯河畔营建新都安提柯尼亚。

  前 302 年卡山德、利西马科斯、塞琉古、托勒密再次联合。前 301 年两军在弗里吉亚的伊普苏斯决战。德米特里率骑兵击溃当面之敌后追得太远，被塞琉古的象队隔断，回不来。安提柯的步兵阵线被包围，他中了标枪而死。据希罗尼穆斯，他这时八十一岁。他的领土被胜利者瓜分。
sources: []
recalled:
  - 狄奥多罗斯《历史丛书》卷十八至卷二十
  - 普鲁塔克《德米特里传》《欧迈尼斯传》
