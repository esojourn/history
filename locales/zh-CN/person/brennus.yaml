name: 布伦努斯（攻入罗马）
aliases: [布伦努斯, 布伦努, 塞农人布伦努斯]
role: 高卢塞农人首领
summary: 高卢塞农人首领，在阿利亚河击溃罗马军队，攻入并洗劫罗马城。
body: |-
  高卢塞农人的首领，生卒年不详。“布伦努斯”可能是称号而非人名；公元前 279 年入侵希腊的高卢首领也叫这个名字，是另一个人。

  前 4 世纪初，高卢人翻越阿尔卑斯山进入波河流域，塞农人一支南下围攻伊特鲁里亚城市克鲁西乌姆。据李维，罗马派去调解的费边家三兄弟违反使节的规矩，加入克鲁西乌姆一方作战并杀死一名高卢首领；高卢人要求交出三人，罗马人反而选他们做了军事保民官。高卢人于是直扑罗马。传统年代是前 390 年，按波利比乌斯的纪年折合前 387 年。

  7 月 18 日，两军在罗马城北的阿利亚河相遇，罗马军队一触即溃，这一天后来被定为凶日。高卢人进入几乎不设防的罗马城。据李维，年老的元老们身穿礼服坐在家中的象牙椅上等死，一个高卢人伸手去摸其中一位的胡须，被他用象牙杖打了头，屠杀由此开始。高卢人焚掠全城，围攻卡皮托利山；传说他们夜间偷袭时，朱诺神庙的圣鹅惊叫，唤醒了马尔库斯·曼利乌斯，偷袭被击退。

  围困七个月后，双方议定罗马人以一千磅黄金赎城。据李维，称量时罗马人抱怨高卢人的砝码不公，布伦努斯把自己的剑扔到秤上，说了一句“战败者活该倒霉”。李维说卡米卢斯随即赶到，把高卢人全歼；波利比乌斯则说高卢人拿了赎金，因家乡受维内蒂人进攻而安然撤回。布伦努斯后来的下落没有可靠记载。这次劫难给罗马人留下了长久的恐惧，也被认为是罗马早期档案大多无存的原因。
sources: []
recalled:
