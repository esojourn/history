name: 比加
aliases: []
role: 北国以色列王
summary: 利玛利的儿子，弑比加辖篡位，联合亚兰攻犹大，招致亚述大举掳掠北国。
body: |-
  利玛利的儿子，原是以色列王比加辖的将军。据《列王纪下》15:25，他带着五十个基列人，在撒玛利亚王宫的卫所里杀了比加辖，篡夺王位。15:27 说他在犹大王亚撒利雅五十二年登基，在撒玛利亚作王二十年。

  比加与大马士革的亚兰王利汛联合攻打犹大，要围困耶路撒冷，另立他比勒的儿子作犹大王（《列王纪下》15:37、16:5；《以赛亚书》7:1–6），后世称为“叙利亚—以法莲战争”。《历代志下》28:6 说比加一日之间杀了犹大勇士十二万。犹大王亚哈斯向亚述王提革拉毗列色求救；亚述王攻取了以云、亚伯伯玛迦、亚挪、基低斯、夏琐、基列、加利利和拿弗他利全地，把居民掳到亚述（《列王纪下》15:29、16:7–9）。以赛亚在这时预言，利汛和“利玛利的儿子”都不足为惧（《以赛亚书》7:4–9）。

  以拉的儿子何细亚背叛比加，把他杀了，篡位作王（15:30）。从比加辖之后到何细亚之前，实际时间容不下二十年，学界的通行解释是比加早在米拿现即位时（约公元前 752 年）就已在约旦河东的基列一带自立，二十年从那时算起，与米拿现、比加辖并立；也有其他说法。这里的在位年份只画他在撒玛利亚作王的时期。
sources: []
recalled:
  - 《列王纪下》15:25–31、15:37、16:5–9
  - 《历代志下》28:5–8
  - 《以赛亚书》7:1–9
