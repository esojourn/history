name: 李元吉
aliases: [齐王, 三胡]
role: 齐王
summary: 唐高祖的第四子，封齐王，与太子李建成联手对付李世民，在玄武门之变中被杀。
body: |-
  李元吉是唐高祖李渊的第四子，小名三胡，封齐王。李渊起兵入关时，他留守太原。武德二年（公元 619 年）刘武周南下进攻并州，他弃城逃回长安，太原失守，此事由李世民次年收复河东才得以挽回。

  此后他随李世民围攻洛阳，在李世民率军东拒窦建德时，与屈突通等人留下继续围城。在李世民与太子李建成的争斗中，他站在李建成一边，据唐代史书，他多次劝李建成除掉李世民，还曾想借出征突厥之机调走秦王府的精兵猛将。

  武德九年（626 年）六月初四，他与李建成一同入朝，在玄武门遭到伏击。据《资治通鉴》，他张弓想射李世民，慌乱中三次都没能把弓拉满，随后被尉迟恭射杀，年二十四。他的五个儿子也都被杀。贞观年间追封他为巢王，谥号剌。
sources: []
recalled:
  - 《旧唐书·巢王元吉传》
  - 《资治通鉴》卷一百八十七至一百九十一
