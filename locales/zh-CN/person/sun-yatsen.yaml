name: 孙中山
aliases: [孙文, 孙逸仙, 中山樵]
role: 革命家，中华民国临时大总统
summary: 创立兴中会、同盟会，提出三民主义，领导推翻清朝的革命，1912 年任临时大总统。
body: |-
  孙中山名文，字逸仙，在日本时化名中山樵，广东香山县翠亨村人，出身农家。十三岁时他随母亲到檀香山投奔哥哥孙眉，在当地的教会学校读书，后来回到香港，在香港西医书院学医，光绪十八年（1892 年）毕业，在澳门、广州行医。

  光绪二十年（1894 年）孙中山上书李鸿章，提出改革的建议，没有得到回应。同年十一月他在檀香山创立兴中会，提出“驱除鞑虏，恢复中华，创立合众政府”。次年他在广州策划起义，事泄失败，他流亡海外。光绪二十二年（1896 年）他在伦敦被清朝驻英公使馆诱捕，经他的老师康德黎营救获释，这件事使他在国际上出名。此后他往来于日本、欧美、东南亚，宣传革命，筹集经费，与保皇派展开论战。

  光绪三十一年（1905 年）孙中山在东京联合兴中会、华兴会、光复会等团体，成立中国同盟会，被推为总理，以“驱除鞑虏，恢复中华，创立民国，平均地权”为纲领，后来概括为民族、民权、民生“三民主义”（另见“中国同盟会成立”条）。此后同盟会在华南等地发动了多次起义，都失败了。

  宣统三年（1911 年）十月武昌起义爆发时，孙中山正在美国，他先到欧洲进行外交活动，十二月回到上海，随即被各省代表推选为临时大总统。1912 年 1 月 1 日他在南京就职，宣告中华民国成立（另见“中华民国成立”条）。清帝退位后，他按照与袁世凯的约定辞去临时大总统之职。此后他领导了“二次革命”和护法运动，1924 年改组国民党，实行联俄、联共政策，1925 年 3 月在北京病逝。他被尊为“国父”。本站以 1912 年为清朝的终点，此后的事迹只在这里简述。
sources: []
recalled:
  - 孙中山《建国方略·有志竟成》
  - 《孙中山全集》
  - 陈锡祺主编《孙中山年谱长编》
