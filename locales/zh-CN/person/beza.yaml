name: "贝扎"
aliases: ["泰奥多尔·德·贝扎", "伯撒", "德贝兹"]
role: "日内瓦学院院长、加尔文的继任者"
summary: "法国人，日内瓦学院首任院长，加尔文死后领导日内瓦教会四十年。"
body: |-
  贝扎 1519 年 6 月生于法国勃艮第的韦兹莱，出身小贵族。他九岁被送到奥尔良，住在德意志学者沃尔马家里读书，后来随老师到布尔日。《历史的轨迹》第二十四章说，加尔文在布尔日读书时在沃尔马门下结识了这个十二岁的男孩。1539 年他在奥尔良得了法学学位，到巴黎靠教会的俸禄生活，写拉丁文诗，1548 年出了诗集。

  同年他得了一场重病，病愈后放弃俸禄，带着秘密订婚的妻子去了日内瓦。1549 年起他在洛桑教了九年希腊文。1558 年加尔文请他回日内瓦，次年日内瓦学院开办，他任第一任院长。

  1561 年法国太后凯瑟琳在普瓦西召集两派会谈，他代表胡格诺派在王室和主教们面前陈述信仰；讲到圣餐时说基督的身体离饼和酒有天地之遥，会场哗然，会谈没有结果。宗教战争初起时他在胡格诺军中任随军牧师。

  1564 年加尔文去世，他接任日内瓦牧师团的主席，直到 1580 年，此后仍是各国改革宗教会请教的对象。该书说他担任日内瓦教会牧师达四十年之久。圣巴多罗买大屠杀之后，他写《论官长的权利》，主张下级官长可以抵抗暴君。他几次校印希腊文新约，这些本子后来被英文钦定本的译者采用；他得到的一部古抄本，1581 年送给了剑桥大学，今称“贝扎抄本”。1605 年 10 月他在日内瓦去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十四章“瑞士的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter27.html"
recalled:
  - "贝扎《加尔文传》（1564 年）"
  - "贝扎希腊文《新约》各版（1565—1598 年）"
  - "贝扎《论官长的权利》（1574 年）"
  - "1561 年普瓦西会谈记录"
