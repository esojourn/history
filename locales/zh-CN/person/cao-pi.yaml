name: 魏文帝
aliases: [曹丕, 曹子桓]
role: 皇帝
summary: 曹操之子，公元 220 年代汉称帝，建立魏朝；也是文学家，著有《典论》。
body: |-
  据《三国志·魏书·文帝纪》，曹丕字子桓，是曹操与卞氏所生的长子，中平四年（公元 187 年）冬生于谯县。他自幼随军，自述五岁学射、八岁能骑马。建安十六年（211 年）任五官中郎将，为丞相之副。曹操在他与弟弟曹植之间长期犹豫，建安二十二年才立曹丕为魏王太子。

  建安二十五年（220 年）正月曹操去世，曹丕继任丞相、魏王。同年十月，汉献帝让位，曹丕即皇帝位，国号魏，改元黄初，定都雒阳。即位前后，他采纳陈群的建议实行九品官人法，由各郡的中正评定士人等第，作为选官的依据，这一制度沿用到隋代才废除。他下诏规定宦官任职不得超过诸署令，群臣不得向太后奏事，外戚不得辅政；对同姓诸王则严加监视，不让他们掌握实权。

  黄初二年（221 年）孙权遣使称臣，受封吴王；次年双方破裂，曹丕先后三次南征，都没有取得战果。

  曹丕爱好文学。他的《燕歌行》是现存最早的完整七言诗之一；所著《典论》大部分已佚，其中《论文》一篇保存下来，是中国较早的文学批评专论，文中称“文章经国之大业，不朽之盛事”。他还命人编纂《皇览》，被认为是类书的开端。黄初七年（226 年）五月他在雒阳去世，终年四十，太子曹叡继位。
sources: []
recalled:
  - 《三国志·魏书·文帝纪》及裴松之注
  - 曹丕《典论·论文》《典论·自叙》
