name: 赵武灵王
aliases: [赵雍, 主父]
role: 赵国国君
summary: 赵国国君，推行“胡服骑射”，组建骑兵，攻灭中山；传位后自称主父，死于沙丘宫变。
body: |-
  赵武灵王名雍，是赵肃侯之子，公元前 325 年即位，生年不详。赵国北邻林胡、楼烦等游牧部落，东北有中山国嵌在国境之间，西面又受秦国压迫。

  公元前 307 年，武灵王决定改穿胡人的短衣窄袖，学习骑马射箭，组建骑兵部队，史称“胡服骑射”。据《史记·赵世家》和《战国策·赵策二》，叔父公子成等宗室大臣强烈反对，认为中国是礼仪之邦，不应仿效蛮夷；武灵王亲自登门说服，认为“法度制令各顺其宜，衣服器械各便其用”。改革后赵国军力大增，向北击败林胡、楼烦，开辟云中、雁门、代郡，并于公元前 296 年最终灭了中山国。

  公元前 299 年，武灵王把王位传给少子何（赵惠文王），自称“主父”，专心治军，他曾化装成使者到秦国观察地形和秦王的为人。他又封长子章于代，号安阳君。公元前 295 年，公子章作乱，被公子成、李兑击败，逃入主父所居的沙丘宫，公子成等人围宫杀死公子章后，怕主父追究，继续包围沙丘宫，宫中人都逃散了。主父出不去，又没有食物，只能掏鸟窝里的雏鸟吃，三个多月后饿死。

  据《史记·匈奴列传》，他“北破林胡、楼烦，筑长城，自代并阴山下，至高阙为塞”，设置云中、雁门、代郡。
sources: []
recalled:
  - 《史记·赵世家》
  - 《战国策·赵策二》
