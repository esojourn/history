name: "克伦威尔"
aliases: ["奥利弗·克伦威尔", "护国公"]
role: "英格兰共和国护国公"
summary: "国会军将领，内战中击败查理一世，1653 年起任护国公，倾向公理派。"
body: |-
  克伦威尔 1599 年生于亨廷登一个中等乡绅家庭，在剑桥读过一年书。他三十岁前后有过一段深刻的信仰经历，此后是坚定的清教徒。1628 年和 1640 年他两次当选下议院议员。《历史的轨迹》第三十一章称他是国会军中的“一位农夫”；他家确以经营田产为生，但属于乡绅，本身也是议员。

  该书说，内战初期王军占优，克伦威尔看出症结，对清教徒议员汉普登说，一批穷酒保和学徒绝打不倒贵族。他任骑兵团长，团员都有宗教信仰，不起誓、不喝酒，唱着诗上战场，人称“铁骑军”。书中说照这个样子组织起一支二万一千人的军队（即 1645 年的“新模范军”），闲时一起读经、祷告、唱诗。1645 年内斯比一役，王军溃散。

  1649 年查理一世被处死，英格兰改为共和国。同年起他率军征服爱尔兰，攻下德罗赫达等城时大肆屠杀，这在爱尔兰至今是痛史；1650—1651 年又击败拥立查理二世的苏格兰人。该书说 1649 至 1653 年间英国是共和政体，克伦威尔被任命为“摄政”，实际上是军人专制。一般的说法是：他在 1653 年 4 月驱散残余国会，同年 12 月才就任护国公。

  他自己不属任何教会，但很倾向公理派。第三十二章说他提拔公理派神学家欧文做牛津大学副校长，许多公理派信徒被擢升高位。在他治下各宗教团体有相当的自由，连受人厌恶的贵格派他也友善相待；但安立甘派的公祷书被禁用，天主教徒仍受限制。

  1658 年 9 月 3 日他在伦敦病逝，儿子理查继任，不到一年就下台。1660 年王政复辟后，他的遗体被掘出示众。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
