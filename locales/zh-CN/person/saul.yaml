name: 扫罗
aliases: []
role: 以色列第一位王
summary: 便雅悯人，由撒母耳膏立为以色列第一位王，后在基利波山兵败身亡。
body: |-
  扫罗是便雅悯支派基士的儿子，家在基比亚。《撒母耳记上》9:2 说他又健壮又俊美，身体比众民高过一头。圣经没有记载他的生年；13:1 关于他登基年岁和在位年数的希伯来原文有残缺，《使徒行传》13:21 说他作王四十年。本条所标的约公元前 1050 年立为王、约前 1010 年去世，是通行的约数。

  据《撒母耳记上》第 9—11 章，扫罗出门寻找父亲丢失的几头驴，在苏弗地遇见撒母耳，撒母耳把膏油倒在他头上。后来众人聚集在米斯巴掣签，掣出扫罗；人们找他的时候，他藏在器具中间。亚扪人拿辖围困基列雅比，扫罗招聚以色列人前去解围，大败亚扪人，众百姓就在吉甲立他为王。

  扫罗作王的日子常与非利士人争战。第 13 章记载，他在吉甲等候撒母耳，见百姓离散，就自己献上燔祭，撒母耳说他的王位必不长久。第 15 章记载，他奉命攻打亚玛力人，却怜惜亚玛力王亚甲和上好的牛羊，没有灭尽；撒母耳告诉他，耶和华已经厌弃他作以色列的王。

  此后耶和华的灵离开扫罗，有恶魔扰乱他，臣仆找来耶西的儿子大卫为他弹琴（16:14–23）。大卫击杀歌利亚以后声望日高，扫罗就怒视大卫，两次向他抡枪，又屡次设法害他，并带兵在旷野追索他。祭司亚希米勒曾接济大卫，扫罗下令杀了挪伯的祭司，据 22:18 共八十五人。大卫在隐基底的洞里和西弗的旷野两次有机会下手，都没有害他（第 24、26 章）。

  第 28、31 章记载，非利士人聚集来攻，扫罗求问耶和华得不到回答，就去隐多珥找一个交鬼的妇人。次日以色列人在基利波山战败，扫罗的三个儿子被杀，他自己被弓箭手射伤，伏在刀上死了。基列雅比人把他和他儿子的尸身从伯珊的城墙上取下来安葬。
sources: []
recalled:
