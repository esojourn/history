name: 蔡襄
aliases: [蔡君谟, 蔡忠惠]
role: 北宋大臣、书法家
summary: 北宋书法家、大臣，“宋四家”之一，主持修建泉州洛阳桥，著有《茶录》。
body: |-
  蔡襄是兴化军仙游人，生于大中祥符五年（公元 1012 年），天圣八年（1030 年）考中进士。庆历年间他任谏官，支持范仲淹等人推行新政，敢于直言。此后他多次在家乡福建任职，任福州、泉州知州。在泉州时，他主持在洛阳江入海口修建万安桥（又称洛阳桥），这是一座跨海的石桥，至今尚存，桥头有他撰写的《万安桥记》碑。

  他晚年在朝中任三司使、翰林学士，英宗时出知杭州，治平四年（1067 年）去世。蔡襄精于品茶，著有《茶录》，又写了介绍福建荔枝品种的《荔枝谱》。他的书法端庄淳厚，在当时评价很高，与苏轼、黄庭坚、米芾并称“宋四家”，传世作品有《万安桥记》《谢赐御书诗表》等。
sources: []
recalled:
  - 《宋史·蔡襄传》
  - 欧阳修《端明殿学士蔡公墓志铭》
  - 蔡襄《茶录》
