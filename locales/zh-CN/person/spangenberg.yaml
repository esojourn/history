name: "施庞根贝格"
aliases: ["奥古斯特·戈特利布·施庞根贝格", "施旁恩伯"]
role: "莫拉维弟兄会的主教"
summary: "亲岑多夫的同工，主持莫拉维派在北美的宣教，曾问约翰·卫斯理是否确知得救。"
body: |-
  施庞根贝格 1704 年生于图林根，在耶拿读书，曾在哈雷大学任教，因与莫拉维派来往被免职，1733 年加入赫恩胡特，成为亲岑多夫的得力同工。

  《历史的轨迹》第三十六章说，约翰·卫斯理到达佐治亚后不久遇见他，当时他负责莫拉维教会在该殖民地的宣教。他问卫斯理：“你认识耶稣基督吗？”卫斯理答：“我知道他是世人的救主。”他说：“对的，但你自己是否确知他已经拯救了你呢？”该书说这个问题使卫斯理苦恼了整整三年。

  据一般记载，他后来多年主持莫拉维派在宾夕法尼亚伯利恒一带的工作，1744 年受立为主教。亲岑多夫死后他回到赫恩胡特，成为弟兄会的主要领袖，写了亲岑多夫的传记，整理了弟兄会的教义。1792 年死于贝特尔斯多夫。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十六章“循道派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter40.html"
