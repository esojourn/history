name: 吕库古（雅典）
aliases: [莱库古, 吕库尔戈斯]
role: 雅典理财官、演说家
summary: 雅典政治家，喀罗尼亚战败后主持城邦财政十二年，大兴公共建筑。
body: |-
  雅典人，约生于公元前 390 年，出身于世袭雅典娜和波塞冬祭司职位的埃特奥布塔代家族。相传他是柏拉图和伊索克拉底的学生。与斯巴达那位传说中的立法者同名，并无关系。

  前 338 年雅典在喀罗尼亚战败之后，他主管城邦财政，前后十二年，其间有几届是由亲友出面任职、实际仍由他掌管。据托名普鲁塔克的《十大演说家传》，他使雅典的岁入增加到一千二百塔兰特。这笔钱用于重整军备和公共工程：增造战舰，修建船坞和建筑师菲隆设计的军械库；把卫城南坡的狄奥尼索斯剧场改建成石砌的；修建泛雅典娜节的运动场和吕克昂的体育场。青年公民两年的军事训练制度在这一时期得到整顿，一般认为与他有关。

  他提议为埃斯库罗斯、索福克勒斯、欧里庇得斯三位悲剧诗人立铜像，并由城邦保存他们剧作的定本，演员不得擅改。在政治上他属于反马其顿的一派，前 335 年亚历山大要求雅典交出的人里有他，经交涉得免。

  他以严厉著称，常控告他认为失职或不忠的人。他只有一篇演说完整传世，即前 330 年的《诉列奥克拉特斯》，控告一个在喀罗尼亚战败后逃离雅典的公民。他约在前 324 年去世。相传他临终前要求把自己抬到议事会交代账目。前 307 年雅典为他颁布了表彰的法令，文字有一部分保存在碑铭和《十大演说家传》里。
sources: []
recalled:
  - 托名普鲁塔克《十大演说家传·吕库古》
  - 吕库古《诉列奥克拉特斯》
