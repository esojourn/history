name: "厄斯金"
aliases: ["以便以谢·厄斯金", "尔斯金"]
role: "苏格兰分离会的创始人"
summary: "苏格兰长老会牧师，反对平信徒委派牧师，1733 年另立分离会。"
body: |-
  厄斯金 1680 年生于苏格兰边区，父亲是被逐的长老会牧师。他做过波特莫克和斯特灵的牧师。

  《历史的轨迹》第三十九章说，威廉和玛丽当政时长老会是苏格兰的国家教会，到安妮女王时国会恢复了“平信徒委派权”（1712 年），即由地主等庇护人指定牧师，所派的往往是会众不喜欢的人。该书说，1740 年厄斯金和几位牧师因大胆反对这一制度被革职，引起教会第一次分裂。

  据一般记载，他 1732 年在总会讲道抨击此事，次年被停职，1733 年与另三位牧师在盖尔尼桥另组“联合会”，即分离会；1740 年总会正式革除他们的职分。书中把分裂定在 1740 年，是以革职为准。他 1754 年死于斯特灵。该书说，后来几批脱离国家教会的信徒在 1847 年合成了联合长老会。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
