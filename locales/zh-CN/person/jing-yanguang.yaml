name: 景延广
aliases: [景航川]
role: 后晋侍卫亲军都指挥使
summary: 后晋大将，石重贵即位后主张对契丹称孙不称臣，导致两国开战，后晋亡后自尽。
body: |-
  景延广是陕州人，字航川，善射，早年在后梁、后唐军中任职，后来追随石敬瑭，后晋建立后任侍卫亲军都指挥使，执掌禁军。天福七年（公元 942 年）石敬瑭死，他拥立石重贵即位，从此掌握朝政。

  他主张不再对契丹称臣，后晋给契丹的国书只称孙、不称臣。据《资治通鉴》，他还对契丹使者说，晋朝有十万口横磨的大剑，契丹若来便与之一战。契丹皇帝耶律德光因此决意南侵。战争开始后，景延广指挥失当，不久被调离朝廷，出任地方官。开运三年十二月（947 年初）契丹攻入开封，他被契丹拘捕，押往北方，途中到了陈桥，夜里自杀而死。他的生年史书没有明确记载。
sources: []
recalled:
  - 《旧五代史·晋书·景延广传》
  - 《新五代史·晋臣传·景延广》
  - 《资治通鉴》卷二百八十三至二百八十六
