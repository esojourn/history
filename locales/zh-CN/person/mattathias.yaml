name: 玛他提亚
aliases: []
role: 祭司
summary: 祭司，在莫顶拒绝按王命献祭，带领五个儿子起兵。
body: |-
  据《马加比一书》2:1–5，玛他提亚是约翰之子、西缅之孙，属约雅立班的祭司，原居耶路撒冷，后住在莫顶。他有五个儿子，依次是约翰、西门、犹大、以利亚撒、约拿单。他的生年没有记载。

  安条克四世禁止犹太人守律法之后，王的官员来到莫顶，要居民向异教献祭，并请玛他提亚带头。他当众拒绝，杀死一个上前献祭的犹太人和监督献祭的官员，拆毁祭坛，带着儿子们逃入山中（2:15–28）。一批在安息日不肯抵抗的人被杀后，他和同伴决定遇到攻击时安息日也应战，哈西典人也来加入（2:29–44）。他死于塞琉古纪元 146 年，即公元前 166 年前后，临终嘱咐以西门为谋主、犹大为统帅，葬在莫顶的祖坟（2:49–70）。
sources:
  - 《马加比一书》2:1–70
  - 约瑟夫斯《犹太古史》卷 12 第 6 章第 1—4 节 https://penelope.uchicago.edu/josephus/ant-12.html
  - Wikipedia, "Mattathias" https://en.wikipedia.org/wiki/Mattathias
