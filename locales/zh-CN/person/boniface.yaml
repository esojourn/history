name: 波尼法修
aliases:
  - 温弗里德
  - 博尼法斯
  - 日耳曼人的使徒
role: 美因茨大主教、宣教士
summary: 英格兰修士，在黑森、图林根传道，整顿法兰克教会，公元 754 年在弗里斯兰被杀。
body: |-
  波尼法修原名温弗里德，约在公元 675 年生于英格兰西南的威塞克斯，按后来的传统说法是在克雷迪顿。他自幼进修道院，后来在温切斯特附近的纳斯林修道院教书，三十岁左右被立为长老，在本国已经很有名望。他的生平见于他死后不久维利巴尔德写的传记，他本人的书信也保存下来一百多封。

  公元 716 年他第一次到弗里斯兰，正赶上弗里斯兰王拉德博德与法兰克人交战，无功而返。718 年他再度离开英格兰，从此没有回去。他到罗马，教皇贵格利二世在 719 年委派他向莱茵河以东的民族传道，并给他改名波尼法修。他先在弗里斯兰跟随卫利勃罗三年，然后进入黑森和图林根。722 年他在罗马被立为主教，起誓效忠罗马主教。

  维利巴尔德记载，他在黑森的盖斯马尔当着众人砍倒了一棵献给雷神的大橡树，围观的人见他安然无事，就归信了，他用这棵树的木料盖了一座小礼拜堂。《历史的轨迹》第七章讲了这件事。他从英格兰请来许多修士和修女，建了一批修道院，744 年由学生创立的富尔达后来最为著名。732 年他成为大主教，739 年以后在巴伐利亚、黑森和图林根划定了主教区。

  法兰克教会当时纪律废弛，教产多被贵族占去。从 742 年起，他在宫相卡洛曼和丕平支持下主持了几次会议，整顿神职人员，并使法兰克的主教们承认罗马的权威。约 746 年他以美因茨为驻地。

  他年老时辞去职务，回到早年没有做成的弗里斯兰。公元 754 年 6 月 5 日，他在多克姆附近的河边准备为新信徒行坚振礼，一伙人袭来，把他和同伴全部杀死。《历史的轨迹》说他当时七十三岁，同时遇难的有五十三人；维利巴尔德的传记没有给出年龄，后来的记载说同伴是五十二人。也有学者把这一年定为 755 年。他葬在富尔达。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 维利巴尔德《波尼法修传》第 4—8 章
  - 波尼法修《书信集》第 12、16、50 封
  - 比德《英吉利教会史》卷 5 第 11 章
