name: 阖闾
aliases: [公子光, 阖庐, 姬光]
role: 吴王
summary: 吴王，派专诸刺杀吴王僚而即位，任用伍子胥、孙武，攻破楚都郢；后伐越受伤而死。
body: |-
  阖闾名光，是吴王诸樊之子，即位前称公子光，生年不详。吴国自称是周太王长子太伯的后代，春秋后期在长江下游崛起。按照兄终弟及的约定，吴王之位本应传到公子光的叔父季札，季札推辞，王位落到王僚手中，公子光心中不服。

  伍子胥奔吴后，看出公子光的心思，推荐了勇士专诸。公元前 515 年，公子光趁吴军主力在外，宴请吴王僚，专诸把匕首藏在鱼腹中进献，刺死王僚，专诸也当场被杀。公子光即位，就是阖闾。

  阖闾任用伍子胥、伯嚭和孙武，修筑都城（即今苏州的前身），整顿军队。公元前 506 年，他与唐、蔡两国联合伐楚，在柏举大败楚军，攻入郢都，楚昭王出逃。后来秦国出兵救楚，阖闾的弟弟夫概又趁机回国自立为王，阖闾只得撤军，回国击败夫概。

  公元前 496 年，越王允常去世，阖闾趁机伐越，在檇李被勾践打败，越大夫灵姑浮用戈击伤他的脚趾。据《左传》定公十四年，阖闾退兵途中死于陉，距檇李七里。临终前他问儿子夫差会不会忘记越王杀父之仇，夫差回答不敢忘。

  阖闾在位期间吴国国力大增，《荀子·王霸》把他与齐桓公、晋文公、楚庄王、越王勾践并列为“五霸”。
sources: []
