name: 心利
aliases: []
role: 北国以色列王
summary: 以拉的战车长，弑君篡位，在得撒只作王七日，被暗利围城后自焚。
body: |-
  以色列王以拉的臣子，管理一半战车，出身圣经没有记载。据《列王纪上》16:9–13，他趁以拉在得撒醉酒时杀了他，篡夺王位，并杀尽巴沙的全家。

  据 16:15–18，心利在得撒只作王七日。那时以色列民正安营围攻属非利士的基比顿，听说心利背叛杀了王，就在营中立元帅暗利作以色列王。暗利率领以色列众人从基比顿上去，围困得撒。心利见城被攻破，就进了王宫的卫所，放火焚烧宫殿，自焚而死。经文说这是因为他行耶罗波安的道（16:19）。

  后来耶户杀了以色列王约兰进入耶斯列时，耶洗别在窗口对他说“杀主人的心利啊，平安吗”（《列王纪下》9:31），用心利来比耶户。史料所载仅此。
sources: []
recalled:
  - 《列王纪上》16:9–20
  - 《列王纪下》9:31
