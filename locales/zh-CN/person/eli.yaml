name: 以利
aliases: []
role: 示罗的祭司、士师
summary: 示罗的祭司，抚养幼年的撒母耳；约柜被掳、二子阵亡之日跌倒而死。
body: |-
  以利是示罗耶和华殿中的祭司，事迹见于《撒母耳记上》第 1—4 章。圣经没有记载他的生年，也没有给出他去世的年份，只说他死的时候九十八岁，作以色列的士师四十年（4:15、4:18）。

  据第 1 章，以利加拿的妻子哈拿在示罗默默祷告，以利见她只动嘴唇不出声音，以为她喝醉了，听她说明以后就祝福了她。哈拿生了撒母耳，孩子断奶之后被送到示罗，在以利面前事奉耶和华。以利的两个儿子何弗尼和非尼哈也作祭司，第 2 章说他们是恶人，藐视耶和华的祭物；以利责备他们，他们不听。有神人来见以利，预告他家将要遭遇的事（2:27–36）。第 3 章记载，耶和华夜间呼唤童子撒母耳，以利教他怎样回答；次日撒母耳把所听见的话都告诉以利，以利说这是出于耶和华，愿他凭自己的意旨而行。

  第 4 章记载，以色列人与非利士人交战失利，就把约柜从示罗抬到营中。再战时以色列人大败，据 4:10 步兵仆倒了三万，约柜被掳去，何弗尼和非尼哈都被杀。报信的人来到示罗，以利一听见神的约柜被掳，就从位上往后跌倒，在门旁折断颈项而死。
sources: []
recalled:
  - 《撒母耳记上》第 1—4 章
