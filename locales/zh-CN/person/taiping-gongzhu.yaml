name: 太平公主
aliases: [镇国太平公主]
role: 公主
summary: 唐高宗和武则天的幼女，参与神龙、唐隆两次政变，睿宗时权倾朝野，后被唐玄宗赐死。
body: |-
  太平公主是唐高宗和武则天的小女儿，生年不详。据《资治通鉴》，吐蕃曾派人求娶她，武则天不愿让她远嫁，就让她出家为女道士，以“太平”为道号，借此推辞。开耀元年（公元 681 年）她嫁给薛绍；垂拱四年（688 年）薛绍的哥哥卷入琅邪王李冲起兵一案，薛绍被下狱饿死。天授元年（690 年）她又嫁给武则天的侄子武攸暨。

  她长得像母亲，多谋略，武则天常与她商议政事。神龙元年（705 年）她参与了诛杀张易之兄弟的政变，中宗复位后号为镇国太平公主。景龙四年（710 年）中宗去世，韦后专权，她与侄子李隆基联合起兵，诛杀韦后和安乐公主，拥立她的哥哥睿宗复位。睿宗在位时，她参与朝政，宰相七人中有五人出自她的门下。她与太子李隆基之间的矛盾越来越深，曾想废掉太子。

  延和元年（712 年）睿宗传位给李隆基，次年七月，玄宗得知她的党羽要起事，抢先发兵捕杀了她的党羽，她逃入山寺，三天后出来，被赐死在家中（另见“先天政变”条）。
sources: []
recalled:
  - 《旧唐书·太平公主传》
  - 《新唐书·诸帝公主传》
  - 《资治通鉴》卷二百二至二百一十
