name: 弘治帝
aliases: [朱祐樘, 明孝宗]
role: 明朝第九代皇帝
summary: 幼年在宫中被秘密抚养，即位后勤于政事、任用贤臣，其统治被称为“弘治中兴”。
body: |-
  朱祐樘是成化帝朱见深的儿子，母亲纪氏原是宫中女官。据《明史》记载，当时宠妃万贵妃专宠，宫中其他妃嫔的孩子难以保全，纪氏生下他后，在宦官和废后吴氏等人的保护下秘密抚养，直到五六岁时才与父亲相认，不久纪氏就去世了。这段经历的细节后世有不同看法。

  成化二十三年（1487 年）朱见深去世，朱祐樘即位，次年改元弘治。他即位后清除成化年间靠方术、献媚得官的“传奉官”和僧道，罢免了被讥为“纸糊三阁老、泥塑六尚书”的一批大臣，任用王恕、马文升、刘大夏、刘健、谢迁、李东阳等人，经常召见大臣商议政事，开放言路。他一生只有张皇后一个妻子，这在历代皇帝中很少见。

  弘治年间社会比较安定，史称“弘治中兴”。但他后期也宠信宦官李广，崇信佛道，并非没有缺失。弘治十八年（1505 年）他在北京病逝，年三十六岁，儿子朱厚照即位，即正德帝。
sources: []
recalled:
  - 《明史·孝宗本纪》
  - 《明史·后妃传》
