name: 李雄
aliases: [李仲俊, 成武帝]
role: 成汉开国君主
summary: 巴氐流民首领李特之子，攻占成都后称帝，建立成汉，治蜀三十年，境内较为安定。
body: |-
  李雄字仲俊，是李特的第三子。他的祖先是巴西宕渠的賨人，东汉末年迁到略阳，与氐人杂居，被称为巴氐。晋惠帝元康末年关中连年饥荒，又有氐人齐万年起事，略阳、天水等郡的流民数万家南下进入汉中和蜀地谋食，李特兄弟是其中的首领。

  永宁元年（公元 301 年），益州刺史罗尚限期遣送流民回乡，流民推李特为主起兵反抗。太安二年（303 年）李特攻入成都少城后被罗尚袭杀，叔父李流接任，不久病死，部众由他统领。同年底他攻下成都，罗尚出逃。永兴元年（304 年）十月他自称成都王，光熙元年（306 年）称皇帝，国号大成；后来李寿改国号为汉，史称成汉。

  据《晋书·载记》，他在位时赋税较轻，刑罚从简，又兴办学校，当时中原大乱而蜀地无事，从外地来归附的人很多。他没有立自己的儿子，而立侄子李班为太子。咸和九年（334 年）他去世，时年六十一。此后他的儿子杀李班夺位，成汉内乱不止，永和三年（347 年）被东晋的桓温所灭。
sources: []
recalled:
  - 《晋书·李雄载记》
  - 《华阳国志》卷八、卷九
