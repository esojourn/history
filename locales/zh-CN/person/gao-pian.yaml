name: 高骈
aliases: [高千里]
role: 淮南节度使、诸道行营都统
summary: 唐末名将，收复被南诏攻占的安南，讨黄巢时按兵不动，晚年被部将所杀。
body: |-
  高骈字千里，幽州人，长庆元年（公元 821 年）生，是南平郡王高崇文的孙子，出身禁军世家，能文能武。咸通年间南诏攻陷安南，咸通五年（864 年）起他被派往安南，经过两年苦战，七年（866 年）收复交趾，击败南诏军，朝廷在当地设静海军，以他为节度使。他还组织开凿了从安南通往广州的海路险段。

  乾符二年（875 年）他调任西川节度使，修筑了成都的罗城。乾符六年（879 年）起任淮南节度使，镇守扬州，次年被任命为诸道行营都统，负责围剿黄巢。广明元年（880 年）黄巢军北渡长江和淮河时，他拥兵自保，按兵不动，致使黄巢顺利北上攻入长安，朝野对他非常失望，不久解除了他的都统职务。此后他不再听从朝廷调遣，迷信方士吕用之、张守一等人，政事交给吕用之处理。光启三年（887 年），部将毕师铎起兵攻入扬州，把他囚禁，同年九月他被杀，年六十七。
sources: []
recalled:
