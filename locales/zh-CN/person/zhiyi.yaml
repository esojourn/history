name: 智顗
aliases: [智者大师, 天台大师]
role: 高僧
summary: 天台宗的实际创立者，以《法华经》为宗，入天台山修禅说法。
body: |-
  智顗俗姓陈，祖籍颍川，生于荆州华容，父亲在梁朝任官。梁承圣三年（公元 554 年）西魏攻破江陵，他的家族离散，次年他十八岁时出家。陈天嘉元年（560 年）前后，他到光州大苏山拜慧思为师，修习法华三昧，得到慧思的印可。

  陈光大元年（567 年），他到建康瓦官寺讲《法华经》《大智度论》等，前后八年，名声很大。太建七年（575 年），他入天台山隐居修禅，在山中建寺说法十年。至德三年（585 年），陈后主屡次相请，他回到建康讲经。陈亡后，他到庐山等地。隋开皇十一年（591 年），他在扬州为晋王杨广授菩萨戒，杨广赐他“智者”的称号。此后他回到故乡荆州，在当阳玉泉山建寺，讲说《法华玄义》《摩诃止观》，由弟子灌顶记录成书。

  他以《法华经》为根本，把佛陀一生的说法分判为“五时八教”，主张止（禅定）与观（智慧）并重，提出“一心三观”“一念三千”等学说，形成了一套完整的教理体系，后世称为天台宗，因他长住天台山得名。天台宗通常被看作中国佛教最早形成的宗派之一。

  开皇十七年（597 年），杨广召他前往扬州，他从天台山下山，途中在剡县石城寺病逝，年六十。弟子灌顶整理了他的大量讲述，被奉为天台宗的根本典籍。
sources: []
recalled:
  - 灌顶《隋天台智者大师别传》
  - 道宣《续高僧传·智顗传》
