name: 石重贵
aliases: [后晋出帝, 后晋少帝]
role: 后晋皇帝
summary: 石敬瑭的侄子，942 年即位，对契丹称孙不称臣，引发战争，947 年后晋亡。
body: |-
  石重贵是石敬瑭的侄子，自幼被石敬瑭收养。天福七年（公元 942 年）石敬瑭病死，他在大臣景延广等人的拥立下即位。即位后，他接受景延广的主张，在给契丹的国书里只称孙、不称臣，契丹皇帝耶律德光大怒，两国关系破裂。

  开运元年（944 年）起，契丹连年南侵，后晋军队几次击退了契丹，其中开运二年（945 年）的阳城之战，契丹军大败，耶律德光乘骆驼才得以逃脱。但石重贵此后骄傲自满，宠信佞臣，赋税繁重。开运三年（946 年）他派杜重威领兵北伐，杜重威在中渡桥被契丹包围后率全军投降。同年十二月（已是公历 947 年初），契丹军攻入开封，石重贵出降，后晋灭亡（另见“契丹灭后晋”条）。

  此后他和家人被押往契丹，先后被安置在黄龙府和建州，过着困苦的生活，在契丹境内度过了二十多年，最后死在建州。
sources: []
recalled:
