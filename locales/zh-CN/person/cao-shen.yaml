name: 曹参
aliases:
  - 平阳侯
  - 懿侯
role: 相国
summary: 汉初功臣，封平阳侯；继萧何为相国，沿用旧法，后世称“萧规曹随”。
body: |-
  沛县人，生年不详。据《史记·曹相国世家》，他在秦时任沛县狱掾，与萧何同为县中吏员。刘邦起兵后他一直随军作战，曾跟随韩信攻魏、赵、齐。高祖封长子刘肥为齐王，以他为齐相国，同年封平阳侯。他在齐国请来胶西的盖公，采用黄老之术，主张清静而民自定，相齐九年，齐国安定。

  惠帝二年（公元前 193 年）萧何去世，他继任汉相国，“举事无所变更，一遵萧何约束”，自己日夜饮酒。他任相国前后三年，据《汉书·惠帝纪》死于惠帝五年（前 190 年）八月，谥懿侯。百姓有歌谣说：“萧何为法，顜若画一；曹参代之，守而勿失。”“萧规曹随”的说法即由此而来。
sources:
  - 《史记·曹相国世家》 https://ctext.org/shiji/cao-xiang-guo-shi-jia/zhs
  - 《汉书·惠帝纪》 https://ctext.org/han-shu/hui-di-ji/zhs
