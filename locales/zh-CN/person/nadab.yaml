name: 拿答
aliases: []
role: 北国以色列王
summary: 耶罗波安一世的儿子，在位二年，围攻基比顿时被巴沙所杀。
body: |-
  北国以色列第一位王耶罗波安的儿子，生年和母亲圣经没有记载。据《列王纪上》15:25–26，犹大王亚撒第二年，拿答登基作以色列王，共二年；他行耶和华眼中看为恶的事，走他父亲所行的道，使以色列人陷在罪里。

  据 15:27–28，以萨迦人亚希雅的儿子巴沙背叛他，在属非利士的基比顿杀了他，那时拿答和以色列众人正围困基比顿。这是亚撒第三年的事，巴沙随即接续作王。

  巴沙一作王，就杀了耶罗波安的全家，凡有气息的没有留下一个（15:29）。经文说这应验了耶和华藉示罗人先知亚希雅所说的话（参《列王纪上》14:10–11）。耶罗波安王朝传了两代就此断绝。史料所载仅此。
sources: []
recalled:
  - 《列王纪上》14:10–11、15:25–31
