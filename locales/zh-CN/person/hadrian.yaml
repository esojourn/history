name: 哈德良
aliases: [普布利乌斯·埃利乌斯·哈德里亚努斯, 哈德里安, 阿德里安]
role: 罗马皇帝
summary: 罗马皇帝，放弃图拉真在东方的新占地，巡行各省，修筑哈德良长城。
body: |-
  哈德良生于公元 76 年 1 月 24 日，家族出自西班牙的意大利卡，是图拉真的同乡和表亲。《罗马帝王纪》说他生在罗马，也有学者认为生在意大利卡。他十岁丧父，由图拉真等人监护，后来娶了图拉真的甥孙女萨比娜。117 年图拉真去世时，他是叙利亚总督，统领东征的大军。皇后宣布图拉真临终收养了他，军队随即拥立。即位之初，四位做过执政官的将领以谋反的罪名被处死，他声明并非出自他的命令，元老院始终为此对他心存芥蒂。

  他一即位就放弃美索不达米亚，让亚美尼亚恢复为附庸国，把帝国收回到守得住的边界上。在位二十一年，他有一半以上的时间在各省巡行，查看军队、城防和财政。在日耳曼，他让人沿边界立起连绵的木栅；122 年到不列颠，下令修筑横贯全岛的长城。他钟爱希腊文化，留希腊式的胡须，几次长住雅典，把动工了六百多年的奥林匹亚宙斯神庙修完。130 年他在埃及时，同行的少年安提诺乌斯溺死在尼罗河里，他在那里建了一座城纪念，各地为这个少年立像设祭。

  在罗马，他重建了万神殿，为自己修的陵墓就是后来的圣天使堡，又在提布尔建了一座规模极大的别墅。他命法学家尤利安努斯把历年裁判官的告示编成定本，此后不再增改。他把耶路撒冷改建为罗马殖民地“埃利亚·卡皮托利纳”，132 年犹太人在巴尔·科赫巴领导下起事，打了三年多才平定，卡西乌斯·狄奥说犹太人战死五十八万；事后行省改名为叙利亚-巴勒斯坦。

  他没有儿子，晚年多病，性情变得暴躁，处死了九十岁的姐夫塞尔维亚努斯。他先收养的继承人早死，138 年 2 月又收养安东尼·庇护，并要安东尼收养马可·奥勒留和卢基乌斯·维鲁斯。同年 7 月 10 日他死在巴亚。《罗马帝王纪》录有他临终写给自己灵魂的一首小诗。
sources: []
recalled:
  - 《罗马帝王纪·哈德良传》
  - 卡西乌斯·狄奥《罗马史》卷 69
  - 保萨尼亚斯《希腊志》卷 1 第 18 章
