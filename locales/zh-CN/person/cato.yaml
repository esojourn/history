name: 老加图
aliases: [ 马尔库斯·波尔基乌斯·加图, 监察官加图 ]
role: 罗马监察官
summary: 以守旧严厉著称，力主“迦太基必须毁灭”。
body: |-
  全名马尔库斯·波尔基乌斯·加图，公元前 234 年生于罗马东南的图斯库卢姆，家中此前无人在罗马做过高官。他年轻时参加第二次布匿战争，前 204 年任财务官，随西庇阿出征；据普鲁塔克，他指责西庇阿在军中挥霍，两人从此不和。前 195 年他任执政官，反对废除限制妇女奢侈品的《奥庇乌斯法》而未果，随后领兵到西班牙作战，回国举行凯旋式。前 191 年他在温泉关参加了击败安条克三世的战役。

  前 184 年他当选监察官，把多名元老逐出元老院，对奢侈品课以重税，整修下水道，并建造了罗马第一座会堂。他用拉丁文写了史书《起源》，今已散佚；所著《农业志》是现存最早的拉丁文散文著作。

  晚年他作为使节到过迦太基，见其重新富庶，回国后主张开战。据普鲁塔克，他此后在元老院无论就什么议题发言，末了都要加一句“依我之见，迦太基必须毁灭”；后世通行的拉丁文短句是后人概括的，不见于古代作家。前 149 年第三次布匿战争开始后不久他去世，西塞罗说他享年八十五岁，李维和普鲁塔克则说九十岁。
sources:
  - 普鲁塔克《老加图传》（第 26—27 章记出使迦太基与“迦太基必须毁灭”） https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Cato_Major*.html
  - 英文维基百科“Cato the Elder”（核对年份） https://en.wikipedia.org/wiki/Cato_the_Elder
recalled:
  - 李维《罗马史》卷三十四第 1—21 章；卷三十九第 40—44 章
  - 西塞罗《论老年》；奈波斯《加图传》
