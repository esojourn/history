name: 陆贾
aliases:
  - 陆生
role: 太中大夫
summary: 汉初辩士，两次出使南越，使赵佗称臣；著《新语》十二篇。
body: |-
  楚人，生卒年史书都没有记载。据《史记·郦生陆贾列传》，他以宾客身份跟随刘邦平定天下，以能言善辩著称，常出使诸侯。高祖派他出使南越，赐赵佗南越王印，《汉书·高帝纪》把此事记在高祖十一年（公元前 196 年）。赵佗接受封号，向汉称臣。他回朝后被任为太中大夫。

  他常在高祖面前称引《诗》《书》，高祖骂他，他反问：“居马上得之，宁可以马上治之乎？”高祖于是让他论述秦亡汉兴和古代国家成败的原因，他写成十二篇，称为《新语》。惠帝时吕太后掌权，他称病免官，住在好畤，后来劝丞相陈平与太尉周勃交好，为诛灭诸吕作准备。文帝即位后，他再度出使南越，使已经称帝的赵佗去掉帝号。《史记》说他“竟以寿终”。
sources:
  - 《史记·郦生陆贾列传》 https://ctext.org/shiji/li-sheng-lu-jia-lie-zhuan/zhs
  - 《史记·南越列传》 https://ctext.org/shiji/nan-yue-lie-zhuan/zhs
  - 《汉书·高帝纪》 https://ctext.org/han-shu/gao-di-ji/zhs
