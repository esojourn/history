name: "格列伯"
aliases: ["康拉德·格列伯", "格雷贝尔"]
role: "瑞士弟兄会的发起人"
summary: "苏黎世人，原随慈运理，1525 年施行第一次信徒洗礼，重洗派由此开始。"
body: |-
  格列伯约 1498 年生于苏黎世，父亲是市议会的议员。他先后在巴塞尔、维也纳、巴黎读书，都没有读完，1520 年回到家乡。他跟慈运理读希腊文古典，后来一起读圣经。《历史的轨迹》第二十五章说，他是苏黎世教会中杰出的会友，因慈运理的带领接受了福音的信仰，全力支持改革。

  1523 年秋天的辩论会上，慈运理把何时废除弥撒交给市议会决定，格列伯和几个朋友认为这是让官府来管神的话，从此与他分手。他们在各人家里查经，认为教会应当只由自愿相信的人组成，给不懂事的婴儿施洗没有圣经的根据。1525 年 1 月市议会判他们输，命令未受洗的婴儿八天内受洗，禁止他们聚会。

  该书记载，就在那个月的一次聚会中，原是司铎的布劳洛克请格列伯为他施洗，格列伯给他施了洗，布劳洛克又为在场的其他人施洗。这件事一般定在 1 月 21 日。他们自称弟兄，反对的人叫他们“重洗派”。

  此后格列伯在沙夫豪森、圣加仑等地讲道施洗，两次被捕，1526 年 3 月越狱。同年夏天他在迈恩费尔德死于鼠疫，还不到三十岁。他的同伴曼茨次年 1 月被苏黎世议会淹死在利马特河里。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十五章“重洗派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter28.html"
recalled:
  - "格列伯等 1524 年 9 月致闵采尔的信"
  - "《胡特尔派大纪事》（记 1525 年 1 月的洗礼）"
  - "苏黎世市议会 1525 年 1 月的决议"
