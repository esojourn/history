name: "福克斯"
aliases: ["乔治·福克斯", "弗克斯"]
role: "贵格会创始人"
summary: "织工之子，宣讲“内心之光”，创立公谊会（贵格会），屡次下狱。"
body: |-
  福克斯 1624 年生于莱斯特郡芬尼德雷顿。《历史的轨迹》第三十三章说他是织工的儿子，长大后做了鞋匠，他所知道的唯一一本书就是圣经。十九岁时，一位信徒邀他去酒会，他见这些基督徒如此世俗，非常伤痛，从此切切寻求真理。据他的《日记》，此后几年他离家四处寻访牧师，都得不到帮助，约 1647 年得到了内心的确据。

  他相信圣经，但认为若没有圣灵的光照，圣经对人永远是一本封闭的书，他称这光照为“内心之光”。该书说，最早跟从他的人叫“真理之子”，后来称“光明之子”，相信他们心中有“基督之光”，也叫“神的种子”。他不用任何教会的建制，不采用信条，也不赞成神学院和全职传道人。他们的聚会所里没有讲台、乐器，也不唱诗，大家安静等候，有人受感动就起来分享，男女都可以。他们不起誓、不参战。

  “贵格”（战栗者）这个名字的来由不确定。该书举了两说：一是福克斯曾叫一位官长要“因主的话而战栗”（据他的《日记》，是 1650 年在德比受审时说的）；一是他们聚会祷告时激动得发抖。他们自称“朋友”，组织称“公谊会”。

  该书说，1654 年贵格派只有六十人，四年后增至三万人；他们遭到残酷的逼迫，仍有强烈的宣教热诚，远赴欧洲、非洲、美洲。福克斯本人前后坐牢八次，1652 年起以英格兰西北部为中心，后来到过爱尔兰、西印度群岛、北美和荷兰。第三十一章说克伦威尔对贵格派也友善；两人确曾见面交谈。他 1691 年死于伦敦。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十三章“亚米纽斯主义 贵格派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter37.html"
recalled:
  - "福克斯《日记》"
