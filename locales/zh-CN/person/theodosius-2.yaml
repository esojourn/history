name: 狄奥多西二世
aliases: [小狄奥多西, 提奥多西二世]
role: 东罗马皇帝
summary: 东罗马皇帝，在位四十二年，修筑君士坦丁堡城墙，颁行《狄奥多西法典》。
body: |-
  狄奥多西二世于公元 401 年 4 月 10 日生在君士坦丁堡，是阿卡狄乌斯的独子，408 年七岁继位。起初由大臣安特米乌斯主政，君士坦丁堡西面那道三重的陆上城墙就是这时修成的，以他的名字命名，此后一千年里只被攻破过一次。414 年起姐姐普尔喀丽娅以“奥古斯塔”的名义主持宫廷；421 年他娶了雅典哲学家的女儿欧多基娅。

  425 年他在都城设立有三十一个教席的高等学校，同年派兵送姑母加拉·普拉西提阿和表弟瓦伦提尼安三世回西部即位。429 年他命人把君士坦丁以来历代皇帝的法令汇编成书，438 年颁行，即《狄奥多西法典》。教会方面，431 年的以弗所会议是他召集的，449 年他又支持了另一次以弗所会议，后者不久被推翻。

  匈人连年进犯巴尔干。他几次用黄金买和，447 年以后每年要付给阿提拉二千一百磅。450 年 7 月他打猎时坠马受伤，28 日去世，没有儿子，普尔喀丽娅选中老将马尔西安继位。
sources: []
recalled:
  - 苏格拉底《教会史》卷 7
  - 普里斯库斯《历史》残篇
  - 《狄奥多西法典》卷首诏令
  - 约翰·马拉拉斯《编年史》卷 14
