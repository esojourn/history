name: 琉善
aliases: [卢奇安, 萨莫萨塔的琉善, 路吉阿诺斯]
role: 讽刺作家
summary: 用希腊文写作的叙利亚人，以对话体讽刺文和《真实的故事》著称。
body: |-
  琉善约在公元 125 年前后生于幼发拉底河边的萨莫萨塔，自称叙利亚人，希腊语是后来学的。关于他的生平，只有他自己文章里的零星说法：少年时家里送他跟做石匠的舅舅学手艺，他打坏一块石板挨了打，改去学修辞；此后在小亚细亚、希腊、意大利和高卢各地巡回演说，挣了名声和钱。四十岁左右他定居雅典，改写对话体的讽刺文。晚年他在埃及总督手下任职。文中称马可·奥勒留为已故的神，可见他活到了 180 年以后。

  归在他名下的作品有八十来篇。《诸神对话》《死人对话》拿神话和哲学家开玩笑；《真实的故事》开头就声明通篇是谎话，讲一船人被风卷上月球、又在鲸鱼肚里住了许久；《爱说谎的人》里有巫师学徒叫扫帚挑水而止不住的故事。《亚历山大或假先知》揭露一个靠蛇神骗人的术士。《佩雷格里努斯之死》写一个曾混入基督徒中间的犬儒派在 165 年奥林匹亚竞技会上自焚，其中有几句关于基督徒的话，是教外人士较早的描述。
sources: []
recalled:
  - 琉善《梦》《双重起诉》《辩解》
  - 琉善《真实的故事》
  - 琉善《佩雷格里努斯之死》第 11—13 章
  - 琉善《亚历山大或假先知》
