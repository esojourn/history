name: 皇甫嵩
aliases: [皇甫义真, 槐里侯]
role: 左车骑将军、太尉
summary: 东汉末年将领，镇压黄巾起义的主要统帅。
body: |-
  据《后汉书·皇甫嵩传》，皇甫嵩字义真，安定朝那人，是名将皇甫规的侄子，生年不详。灵帝时任北地太守。中平元年（公元 184 年）黄巾起事，他在朝议上建议解除党禁，拿出宫中藏钱和西园的马匹分给军士，灵帝采纳。

  他随即被任为左中郎将，与朱儁一同进攻颍川的黄巾军。汉军起初被围在长社，皇甫嵩乘夜大风纵火突击，击破对方。此后他转战各地，十月在广宗击败张梁，十一月在下曲阳击杀张宝，黄巾军的主力至此瓦解。他因功拜左车骑将军，领冀州牧，封槐里侯。本传记载，有人劝他乘机起兵自立，他没有接受。

  中平五年他与董卓一同领兵救援陈仓，两人意见不合，由此结怨。董卓掌权后把他召回朝廷，一度下狱，后得免。董卓死后他历任车骑将军、太尉等职，兴平二年（195 年）病死。
sources: []
recalled:
  - 《后汉书·皇甫嵩朱儁列传》
