name: 孙膑
aliases: []
role: 齐国军师
summary: 孙武的后代，受膑刑后逃到齐国任军师，桂陵、马陵两败魏军。
body: |-
  孙膑是孙武的后代，生于齐国阿、鄄之间，生卒年不详，本名已失传，“膑”是因受膑刑而得的称呼。据《史记·孙子吴起列传》，他曾与庞涓一起学习兵法。庞涓在魏国做了将军，嫉妒孙膑的才能，把他骗到魏国，以法刑断其两足并黥面。齐国使者到大梁，孙膑暗中求见，使者把他藏在车里带回齐国。

  齐将田忌把他当作宾客。田忌常与齐国诸公子赛马，孙膑建议用下等马对对方的上等马，上等马对对方的中等马，中等马对对方的下等马，结果一负两胜，赢得千金，这就是“田忌赛马”。田忌把孙膑推荐给齐威王，威王向他请教兵法，以他为师。

  公元前 354 年魏围邯郸，齐威王想以孙膑为将，孙膑以受过刑辞谢，于是以田忌为将、孙膑为军师，坐在有篷的车中出谋划策。孙膑主张不去邯郸，而直攻魏都大梁，迫使魏军回救，在桂陵击败魏军，这就是“围魏救赵”。公元前 342 年马陵之战，孙膑用逐日减灶之计诱庞涓轻进，在马陵设伏，大败魏军。孙膑由此名扬天下，《史记》说“世传其兵法”。

  《孙膑兵法》在东汉以后失传，1972 年在山东临沂银雀山汉墓中重新出土，与《孙子兵法》同时出现，解决了历史上关于孙武、孙膑是否同一人的争论。孙膑的结局史书没有记载。
sources: []
recalled:
  - 《史记·孙子吴起列传》
  - 银雀山汉墓竹简《孙膑兵法》
