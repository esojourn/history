name: 以诺
aliases: []
role: 与神同行的人
summary: 塞特的后裔、玛土撒拉的父亲，圣经说他与神同行，被神取去。
body: |-
  这里说的以诺是塞特的后裔、雅列的儿子，不是《创世记》4:17 所记该隐的那个同名的儿子。据《创世记》5:18–24，雅列一百六十二岁生以诺；以诺六十五岁生玛土撒拉，此后与神同行三百年，并且生儿养女，共活了三百六十五岁。第 5 章的家谱里，各人的记载都以“就死了”收尾，唯独以诺一条写的是：他与神同行，神将他取去，他就不在世了（5:24）。

  《创世记》关于以诺的记载仅此数节，没有说他住在何处，也没有记他的言行。新约有两处提到他：《希伯来书》11:5 说，以诺因着信被接去，不至于见死；《犹大书》第 14—15 节称他是亚当的七世孙，并引了一段他论审判的预言。《路加福音》第 3 章的家谱里也有他的名字。

  《犹大书》所引的那段话，也见于一部题为《以诺书》的古代著作。这部书成书于两约之间，托名以诺，不在犹太教和大多数基督教会的正典之内；据教会传统，只有埃塞俄比亚的教会把它列入圣经。
sources: []
recalled:
  - 《创世记》5:18–24
  - 《希伯来书》11:5
  - 《犹大书》第 14—15 节
  - 《路加福音》第 3 章
