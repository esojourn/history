name: 杨国忠
aliases: [杨钊]
role: 宰相
summary: 杨贵妃的堂兄，李林甫死后任宰相，与安禄山交恶，在马嵬驿被随行将士杀死。
body: |-
  杨国忠本名杨钊，是杨贵妃的堂兄。他年轻时嗜酒好赌，不为宗族所重，后来在蜀中从军。杨玉环得宠后，他借助这层关系进入朝廷，善于计算钱谷，掌管度支等财政事务，得到玄宗的赏识，天宝九载（公元 750 年）玄宗为他赐名“国忠”。

  天宝十一载（752 年）李林甫去世，他继任右相，同时兼领四十多个使职，独揽大权。他对南诏用兵，天宝十载（751 年）剑南节度使鲜于仲通大败于西洱河，天宝十三载（754 年）李宓率领的唐军又全军覆没，据《资治通鉴》，前后死者近二十万人，他却向玄宗隐瞒败绩。

  他与安禄山争宠，互不相容，多次在玄宗面前说安禄山必反，又不断采取措施逼迫安禄山。天宝十四载（755 年）安禄山以讨伐杨国忠为名起兵。次年哥舒翰据守潼关，他担心哥舒翰对自己不利，力劝玄宗催促哥舒翰出战，结果唐军大败，潼关失守。他随玄宗西逃，到马嵬驿时，随行将士以他谋反为名把他杀死，他的儿子和韩国夫人、虢国夫人也相继被杀（另见“马嵬驿之变”条）。
sources: []
recalled:
  - 《旧唐书·杨国忠传》
  - 《新唐书·杨国忠传》
  - 《资治通鉴》卷二百一十六至二百一十八
