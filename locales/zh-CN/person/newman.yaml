name: "纽曼"
aliases: ["约翰·亨利·纽曼"]
role: "牛津运动领袖，后为天主教枢机"
summary: "牛津运动主将，撰写多篇《时代书册》，1845 年改宗天主教，晚年任枢机。"
body: |-
  纽曼 1801 年生于伦敦，少年时有过福音派的归信经历，在牛津读书，任奥瑞尔学院研究员和牛津大学圣玛利亚堂的牧师，讲道影响了一代学生。

  《历史的轨迹》第三十八章说，循道派和低派教会使许多人离开或远离传统的安立甘教会，一些安立甘领袖惊慌，组成“高派教会”。十九世纪前叶高派代表恢复天主教形态的运动，领袖有基布尔、纽曼和普西，因都出身牛津，称“牛津运动”。1833 年基布尔在牛津讲“民族的背道”，同月开始印发一系列小册子，共九十种，大部分出于纽曼之手，因此又叫“书册运动”。

  该书说，在纽曼看来，英国国家教会是介于天主教和复原教之间的中庸之道；但小册子越印越带天主教色彩，牛津主教出面命令停止。据一般记载，触发停印的是 1841 年的第九十篇，主张三十九信条可以按天主教的意思解释。1845 年 10 月 9 日纽曼加入天主教会，该书说有上千人跟从他。

  此后他在伯明翰创办祈祷会，写了自传《为己辩护》，1879 年被教皇立为枢机。他 1890 年死于伯明翰，2019 年被天主教封为圣人。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十八章“德国与英国的宗教生活” https://wellsofgrace.com/books/spiritual/2000years/html/chapter42.html"
recalled:
  - "纽曼《为己辩护》（1864 年）"
  - "《时代书册》第九十篇（1841 年）"
