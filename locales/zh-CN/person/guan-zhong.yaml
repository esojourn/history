name: 管仲
aliases: [管夷吾, 管敬仲]
role: 齐国国相
summary: 齐桓公的相，推行改革使齐国富强，辅佐桓公成为春秋第一位霸主。
body: |-
  管仲名夷吾，字仲，颍上人，生年不详。据《史记·管晏列传》，他年轻时与鲍叔牙交好，二人一起经商，分利时管仲多拿，鲍叔牙不认为他贪婪，知道他家贫；管仲几次做官被罢免、几次作战逃跑，鲍叔牙也不认为他无能或胆怯。管仲说：“生我者父母，知我者鲍子也。”后世称为“管鲍之交”。

  齐襄公时，管仲辅佐公子纠，鲍叔牙辅佐公子小白。襄公被杀后两位公子争位，管仲曾射中小白的衣带钩。小白即位为齐桓公，公子纠被杀，管仲被囚送回齐国。鲍叔牙向桓公力荐管仲，桓公于是任用他为相。

  管仲在齐国推行了一系列改革。据《国语·齐语》，他把国都和郊野分区编组，使士、农、工、商四民分业定居；把行政组织与军事编制结合起来，“作内政而寄军令”；按土地的好坏征收赋税；管理山林川泽的出产，发展渔盐之利和商业。齐国由此富强。对外，他辅佐桓公以“尊王攘夷”为号召，九合诸侯，一匡天下。孔子评价说：“微管仲，吾其被发左衽矣。”（《论语·宪问》）

  管仲死于公元前 645 年。传世的《管子》一书托名管仲，内容庞杂，一般认为是战国至汉代齐国学者的汇编，并非管仲亲作，但保存了不少齐国的思想和制度。
sources: []
recalled:
  - 《史记·管晏列传》
  - 《国语·齐语》
  - 《论语·宪问》
  - 《左传》庄公九年
