name: 苏辙
aliases: [苏子由, 颍滨遗老, 苏文定]
role: 北宋文学家、门下侍郎
summary: 苏轼的弟弟，与父兄合称“三苏”，元祐年间官至门下侍郎。
body: |-
  苏辙是苏洵的次子、苏轼的弟弟，宝元二年（公元 1039 年）生于眉州眉山。嘉祐二年（1057 年）他与苏轼同榜考中进士，此后又同中制科。他与苏轼感情深厚，两人一生诗文往来不断，苏轼的《水调歌头·明月几时有》就是在中秋夜怀念他而作。

  熙宁初年他在制置三司条例司任职，因反对青苗法离开，此后在地方任职。元丰二年（1079 年）苏轼因乌台诗案下狱，他上书请求以自己的官职为兄赎罪，结果被贬为监筠州盐酒税。元祐年间旧党执政，他被召回朝廷，历任翰林学士、尚书右丞、门下侍郎，是元祐后期的执政大臣之一，在政见上比较稳健，主张对新法有所保留。他也反对把熙宁以来取得的西夏边地轻易交还，又在元祐四年（1089 年）出使辽朝，回国后上书谈论辽朝的情况。

  绍圣元年（1094 年）哲宗亲政，他被贬出朝廷，后来又贬到雷州、循州等地。徽宗即位后他获准北归，此后定居颍昌府（今河南许昌），闭门读书写作，自号颍滨遗老，与外界很少往来，十多年后去世。他的散文汪洋澹泊，与父兄同列“唐宋八大家”，著有《栾城集》，还写了《诗集传》《春秋集解》《古史》等经史著作。
sources: []
recalled:
  - 《宋史·苏辙传》
  - 苏辙《颍滨遗老传》
  - 《栾城集》
