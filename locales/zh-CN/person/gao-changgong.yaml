name: 兰陵王
aliases: [高长恭, 高孝瓘]
role: 将领
summary: 北齐宗室名将，邙山之战中率五百骑解洛阳之围，后被后主赐死。
body: |-
  高长恭，一名孝瓘，是高欢的长子高澄的第四子，生母的姓氏和他的生年，史书都没有记载。他封兰陵王。据《北齐书》本传，他相貌柔美而性情勇猛。

  河清三年（公元 564 年），北周出兵围攻洛阳，他率五百骑兵冲入周军阵中，一直杀到金墉城下。城上守军认不出他，他摘下头盔露出面容，城上才派弩手下城救应，齐军于是大胜。齐军士卒为此作歌颂扬他，这就是《兰陵王入阵曲》。本传没有提到面具。唐代的《教坊记》说他相貌像妇人，自嫌不足以威慑敌人，于是刻木为假面，临阵戴上；《通典》和《旧唐书·音乐志》也说他“常著假面以对敌”，称“大面”这种歌舞戏由此而来。

  后主曾对他说，你冲入敌阵太深，万一失利后悔也来不及。他回答说“家事亲切，不觉遂然”。后主对“家事”二字很忌讳，从此猜忌他。他自知处境危险，有意收受财物以自污。部下尉相愿劝他称病在家、不再参与政事，他认为说得对，却没能退下来；后来他有病也不肯医治。武平四年（573 年），后主派徐之范送来毒药，他饮药而死。据本传，他死前把别人欠他的债券全部烧掉了。
sources:
  - 《北齐书》卷十一《文襄六王传·兰陵武王长恭》 https://zh.wikisource.org/wiki/北齊書/卷11
  - 《北齐书》卷七《武成纪》 https://zh.wikisource.org/wiki/北齊書/卷7
  - 《北齐书》卷八《后主纪》 https://zh.wikisource.org/wiki/北齊書/卷8
  - 《教坊记》 https://zh.wikisource.org/wiki/教坊記
