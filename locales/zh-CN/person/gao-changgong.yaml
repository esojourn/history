name: 兰陵王
aliases: [高长恭, 高孝瓘]
role: 将领
summary: 北齐宗室名将，邙山之战中率五百骑解洛阳之围，后被后主赐死。
body: |-
  高长恭，一名孝瓘，是高欢的长子高澄的第四子，生母的姓氏史书没有记载，生年也不确切。他封兰陵王。据《北齐书》本传，他相貌柔美而性情勇猛。

  河清三年（公元 564 年），北周与突厥联军围攻洛阳的金墉城，他率五百骑兵冲入周军阵中，一直杀到金墉城下。城上守军认不出他，他摘下头盔露出面容，城上才放下弓弩，派人出城接应，周军随即溃退。齐军士卒为此作歌颂扬他，这就是《兰陵王入阵曲》。唐代的一些记载说他因为相貌柔美，作战时常戴面具以威慑敌人，后世的“代面”乐舞由此而来。

  后主曾对他说，你冲入敌阵太深，万一失利后悔也来不及。他回答说“家事亲切，不觉遂然”。后主对“家事”二字很忌讳，从此猜忌他。他自知处境危险，有意收受财物以自污，又称病不出。武平四年（573 年），后主派人赐他毒酒，他饮酒而死。据本传，他死前把别人欠他的债券全部烧掉了。
sources: []
recalled:
  - 《北齐书·文襄六王传·兰陵武王长恭》
  - 《旧唐书·音乐志》
