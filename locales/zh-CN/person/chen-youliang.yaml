name: 陈友谅
aliases: [汉王]
role: 元末群雄之一
summary: 元末割据者，杀徐寿辉称帝，国号汉，据有长江中游，鄱阳湖之战中被朱元璋击败身死。
body: |-
  陈友谅是沔阳（今湖北仙桃）人，生于延祐七年（公元 1320 年），出身渔家，读过书，做过县里的贴书小吏。至正十一年（1351 年）徐寿辉在蕲州起义，建立天完政权，陈友谅投奔徐寿辉的部将倪文俊，因能征善战逐渐升为领兵元帅。

  至正十七年（1357 年）倪文俊谋杀徐寿辉未成，逃到陈友谅处，陈友谅把他杀死，吞并了他的部众，从此掌握天完的兵权。至正十九年（1359 年）他挟持徐寿辉到江州（今江西九江），次年在采石杀死徐寿辉，自立为帝，国号汉。他据有江西、湖广等地，兵力强盛，与东面的朱元璋争夺长江下游。至正二十年（1360 年）他率舟师东下进攻应天，中了朱元璋诱敌之计，在龙湾大败。

  至正二十三年（1363 年）陈友谅造巨舰，率大军围攻朱元璋控制的洪都（今江西南昌），久攻不下。朱元璋亲率舟师救援，双方在鄱阳湖展开决战，朱元璋利用火攻焚毁了汉军的大批战船（另见“鄱阳湖之战”条）。相持一个多月后，陈友谅在突围时被流矢射中而死，他的部众大部投降，次年他的儿子陈理在武昌出降，汉政权灭亡。陈友谅死后，长江中游尽归朱元璋，朱元璋随即称吴王。
sources: []
recalled:
  - 《明史·陈友谅传》
  - 《明太祖实录》
