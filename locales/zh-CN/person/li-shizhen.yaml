name: 李时珍
aliases: [东璧, 濒湖]
role: 医药学家
summary: 湖北蕲州人，行医之余用近三十年编成《本草纲目》，收录药物一千八百多种。
body: |-
  李时珍是湖广蕲州（今湖北蕲春）人，出身医学世家，父亲李言闻是当地名医。他十四岁考中秀才，此后三次参加乡试都没有考中，于是放弃科举，随父亲学医。他行医多年，医术高明，据说曾被楚王府聘为奉祠正，掌管良医所，后来又被推荐到北京的太医院任职，时间不长就辞官回乡。

  李时珍在行医和阅读中发现，历代的本草书籍有不少错误、重复和遗漏，于是决心重新编修。他从嘉靖三十一年（1552 年）开始，参考了八百多种书籍，又到湖广、江西、南直隶等地采集药物标本，向农民、渔民、樵夫、药农请教，经过近三十年的努力，在万历六年（1578 年）完成了《本草纲目》（另见“《本草纲目》编成”条）。

  《本草纲目》共五十二卷，收录药物一千八百九十二种，附药方一万一千多个，插图一千一百多幅。书中按照“从微至巨”“从贱至贵”的原则，把药物分为十六部、六十类，突破了以前本草书按上、中、下三品分类的方法。书稿完成后多年没有找到出版者，他曾到南京请文坛领袖王世贞作序。万历二十一年（1593 年）李时珍去世，三年后《本草纲目》才在南京刊行。此后这部书多次重刻，并在十七世纪以后传到日本、朝鲜和欧洲。他还著有《濒湖脉学》《奇经八脉考》等书。
sources: []
recalled:
