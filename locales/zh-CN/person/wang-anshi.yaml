name: 王安石
aliases: [王荆公, 王介甫, 半山, 王文公]
role: 北宋宰相、文学家
summary: 北宋宰相，宋神宗时主持变法，也是唐宋八大家之一。
body: |-
  王安石，祖籍抚州临川，天禧五年（公元 1021 年）生于临江军，他父亲当时在那里做官。庆历二年（1042 年）他考中进士，此后长期在地方任职，任鄞县知县时兴修水利，在青黄不接时把官仓的粮食借贷给农民，秋后收回，这是后来青苗法的雏形。嘉祐三年（1058 年）他向宋仁宗上了一封很长的奏书（后人称为“万言书”），主张改革法度、培养人才，没有得到采纳。

  宋神宗即位后，治平四年（1067 年）任命他为江宁知府，次年召他入京。熙宁二年（1069 年）他出任参知政事，次年拜相，主持变法。新法包括青苗法、均输法、市易法、免役法、农田水利法、方田均税法、保甲法、将兵法等，目的是增加国家收入、减轻豪强兼并、加强军备（另见“王安石变法”条）。他又改革科举，以经义取士，主持编写《三经新义》作为官定的经书注释。

  新法遭到韩琦、富弼、司马光、苏轼等人的强烈反对，司马光写信责备他“侵官、生事、征利、拒谏”，王安石回信逐条反驳，这就是《答司马谏议书》。新法在推行中也出现了地方官强行摊派等弊病。熙宁七年（1074 年）他第一次罢相，次年复相，熙宁九年（1076 年）在儿子王雱去世后再次罢相，从此退居江宁，在城东的半山筑园居住，封荆国公。元祐元年（1086 年）高太后和司马光尽废新法，据说他听说免役法也被废除，愕然失声，同年四月去世，谥“文”。

  王安石的散文简洁峻峭，列入“唐宋八大家”；他晚年的诗写得精巧，如《泊船瓜洲》。据洪迈《容斋续笔》，他写“春风又绿江南岸”时，先后改过“到”“过”“入”“满”等十几个字才定下“绿”字。对他和他的变法，从宋代起就有截然不同的评价，至今仍有争论。
sources: []
