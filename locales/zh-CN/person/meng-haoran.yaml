name: 孟浩然
aliases: [孟襄阳]
role: 诗人
summary: 盛唐诗人，长期隐居襄阳，一生未仕，以山水田园诗著称，与王维并称“王孟”。
body: |-
  孟浩然是襄州襄阳人，早年隐居在家乡的鹿门山，读书作诗。四十岁左右他到长安应进士试，没有考中。据王士源的《孟浩然集序》，他在长安太学赋诗，满座叹服，与王维、张九龄等人结为好友。《新唐书》记载，王维私下邀他进入内署，恰逢玄宗驾到，他躲到床下，被玄宗召出后诵读自作的诗，诗中有“不才明主弃”之句，玄宗不悦，让他回乡，这个故事是否属实，学界有怀疑。此后他漫游吴越等地。

  开元二十五年（公元 737 年）张九龄被贬为荆州长史，召他入幕府任从事，不久他又回到襄阳。开元二十八年（740 年）诗人王昌龄路过襄阳，与他相聚宴饮，据王士源的序，当时他背上生的毒疮快要痊愈，因饮食不慎发作而死，年五十二。

  他的诗多写山水田园和隐居生活，风格清淡自然，代表作有《春晓》《过故人庄》《宿建德江》《望洞庭湖赠张丞相》等。李白很敬重他，写有《赠孟浩然》，其中有“吾爱孟夫子，风流天下闻”之句，又有送别之作《黄鹤楼送孟浩然之广陵》。
sources: []
recalled:
  - 王士源《孟浩然集序》
  - 《旧唐书·文苑传·孟浩然》
  - 《新唐书·文艺传·孟浩然》
