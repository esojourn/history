name: 李维乌斯·德鲁苏斯
aliases: [马尔库斯·李维乌斯·德鲁苏斯, 小德鲁苏斯]
role: 罗马保民官
summary: 罗马保民官，提议给意大利同盟者公民权，遇刺身亡，同盟者战争随即爆发。
body: |-
  马尔库斯·李维乌斯·德鲁苏斯，罗马平民贵族，生年不详，一般估计在公元前 124 年前后。父亲同名，就是前 122 年代表元老院与盖乌斯·格拉古争夺民心的那位保民官。他是小加图的舅父，小加图幼年在他家长大。

  前 91 年他任保民官，在演说家克拉苏、元老首席斯考鲁斯等人支持下提出一揽子方案。此前骑士把持的法庭判处正直的总督鲁提利乌斯·鲁弗斯有罪，震动元老院。德鲁苏斯提议把陪审权交还元老，同时从骑士中选三百人补入元老院；为争取平民，又提出分配土地、建立殖民地和降低粮价的法案。最后一项是给意大利同盟者罗马公民权。

  他把各方都得罪了：骑士不愿失去法庭，许多元老不愿元老院掺入新人，执政官菲利普斯带头反对。元老院随后以程序违反规定为由宣布他已通过的法律无效。公民权法案尚未表决，意大利人领袖波派迪乌斯·西洛等人在他家出入，流言说同盟者已向他个人宣誓效忠。这年秋天的一个傍晚，他在自家门厅被人用刀刺中，几小时后死去，凶手没有查出。同盟者见和平取得公民权的希望断绝，几个月内起兵，是为同盟者战争。
sources: []
