name: 谢灵运
aliases: [谢康乐, 客儿]
role: 诗人
summary: 谢玄之孙，袭封康乐公，开山水诗一派，后以谋反罪被杀于广州。
body: |-
  谢灵运出身陈郡谢氏，祖父是淝水之战的晋军统帅谢玄，他在东晋时袭封康乐公，世称谢康乐。据钟嵘《诗品》，他出生后被送到钱塘杜家寄养，所以小名客儿。他少年好学，博览群书，文章之美在江左罕有其比，又讲究衣着车服，引得世人仿效。

  东晋末年他先后在刘毅、刘裕手下任职。刘裕代晋后，他由公爵降为康乐县侯。他自认为才能应当参与机要，却只被当作文士看待，心中不平，与庐陵王刘义真交好。宋少帝时他被排挤出京任永嘉太守，在任上肆意游览山水，不理政事，一年后称病辞官，回到始宁祖上的庄园，开辟园林，与隐士往来，写下许多山水诗。《登池上楼》中“池塘生春草，园柳变鸣禽”等句，一直为人传诵。后世以他为山水诗的开创者。

  宋文帝即位后召他为秘书监，让他撰写晋史，他没有写成；后任侍中，文帝只在宴会上与他谈论文义，他常称病不朝，出游不归，被免官回到会稽。他在会稽凿山开路、求湖造田，与太守孟顗等人结怨，被告发有异志，亲赴建康申辩，文帝没有追究，改任临川内史。在临川他仍不理政事，被有司纠劾，他起兵拒捕，事败被擒，免死流放广州。元嘉十年（433 年），又有人告发他谋划劫救，诏令在广州处斩，年四十九。

  他信奉佛教，与慧远有往来，曾参与改订《大般涅槃经》的译文，又著《辨宗论》阐发竺道生的顿悟之说。
sources: []
recalled:
