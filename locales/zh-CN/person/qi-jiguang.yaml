name: 戚继光
aliases: [南塘, 孟诸, 武毅]
role: 抗倭名将
summary: 抗倭名将，编练“戚家军”屡败倭寇，后镇守蓟州，著《纪效新书》。
body: |-
  戚继光是山东登州（今蓬莱）人，世袭登州卫指挥佥事。他少年时写过“封侯非我意，但愿海波平”的诗句。嘉靖三十四年（1555 年）他被调到浙江抗击倭寇，看到卫所军战斗力很差，便在义乌招募矿工和农民，严加训练，编成一支新军，人称“戚家军”。他根据江南多沼泽、道路狭窄的地形，创造了“鸳鸯阵”，以长短兵器配合作战。

  嘉靖四十年（1561 年）倭寇大举侵犯浙江台州，戚继光率军在龙山、雁门岭、花街、上峰岭等处接连获胜，史称“台州大捷”，浙江的倭患基本平息。次年他奉命入闽，攻破横屿、牛田、林墩等倭寇据点。嘉靖四十二年（1563 年）他与俞大猷、刘显合兵收复兴化府城，此后福建、广东沿海的倭寇逐渐被肃清（另见“嘉靖抗倭”条）。

  隆庆二年（1568 年）戚继光被调到北方，总理蓟州、昌平、保定练兵事务，后任蓟州总兵官。他在张居正、谭纶的支持下，沿长城修筑了一千多座空心敌台，又组建车营，训练步、骑、车配合作战，此后十多年蒙古部落不敢大举进犯蓟州一带。他把练兵经验写成《纪效新书》和《练兵实纪》，对后世影响很大。

  万历十年（1582 年）张居正去世后，戚继光被视为张居正的亲信，先被调到广东，不久遭到弹劾罢官，回到登州家乡。据说他晚年贫病交加，妻子离去，万历十五年十二月（公历已是 1588 年 1 月）去世。后来追谥“武毅”。
sources: []
recalled:
  - 《明史·戚继光传》
  - 戚继光《纪效新书》
  - 戚祚国等《戚少保年谱耆编》
