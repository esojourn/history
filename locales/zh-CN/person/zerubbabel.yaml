name: 所罗巴伯
aliases: []
role: 犹大省长
summary: 大卫的后裔，率首批被掳的人归回，主持重建圣殿。
body: |-
  犹大王约雅斤的孙子，大卫的后裔。《以斯拉记》《哈该书》和《马太福音》1:12 都称他为撒拉铁的儿子，《历代志上》3:19 则记他是撒拉铁的兄弟毗大雅的儿子，两处记载有出入。圣经没有记载他的生年和出生地。

  《以斯拉记》第 2 章和《尼希米记》第 7 章的归回者名单把他列在首位。据《以斯拉记》第 3 章，他和大祭司耶书亚回到耶路撒冷后，在七月先筑起祭坛，恢复早晚的燔祭，守住棚节；次年二月立定圣殿的根基。奠基时百姓大声欢呼，许多见过旧殿的老年人却放声大哭（3:10–13）。

  《以斯拉记》第 4 章记，那地的居民要求一同建造，所罗巴伯等人不答应，对方于是多方阻挠，工程停到波斯王大流士第二年。那一年先知哈该、撒迦利亚劝勉百姓，所罗巴伯和耶书亚就起来动工（拉 5:1–2；该 1:12–15）。河西总督达乃来查问，上奏大流士；王在亚马他城的宫中查到古列的诏令，下令准许建造，并由王库拨给经费（拉 5—6 章）。殿在大流士第六年亚达月完工（6:15）。

  《哈该书》称他为犹大省长；2:20–23 记耶和华说要以他为印。《撒迦利亚书》4:6–10 说他的手立了这殿的根基，他的手也必完成这工。《以斯拉记》第 6 章叙述圣殿落成时没有再提他的名字，圣经也没有交代他的结局和卒年。《以斯拉记》1:8、5:14–16 提到的犹大首领设巴萨与他是什么关系，学者看法不一。《马太福音》第 1 章和《路加福音》第 3 章的耶稣家谱里都有他的名字。
sources: []
recalled:
  - 《以斯拉记》第 2—6 章
  - 《哈该书》第 1—2 章
  - 《撒迦利亚书》第 4 章
  - 《历代志上》3:17–19
  - 《马太福音》1:12–13
  - 《路加福音》3:27
