name: 天祚帝
aliases: [耶律延禧, 辽天祚帝, 海滨王]
role: 辽朝末代皇帝
summary: 辽朝末代皇帝，在位时女真起兵反辽，1125 年被金军俘虏，辽朝灭亡。
body: |-
  天祚帝耶律延禧是辽道宗的孙子，生于大康元年（公元 1075 年）。他的父亲耶律濬被权臣耶律乙辛诬陷害死，他由祖父抚养。乾统元年（1101 年）道宗去世，他即位。据《辽史》，他喜好打猎，不理政事，朝中权臣用事，对东北各部族的需索又很苛刻。

  天庆二年（1112 年）他到春州巡游，召集附近的女真首领赴“头鱼宴”，让他们依次起舞，只有完颜阿骨打不肯。天庆四年（1114 年）阿骨打起兵反辽，辽军接连失败。次年阿骨打称帝，天祚帝亲率大军征讨，在护步答冈大败而回（另见“金建国”条）。此后金军攻下辽朝的东京、上京、中京，天祚帝一路西逃，躲进夹山。留在南京的大臣拥立耶律淳为帝，史称北辽。

  保大五年（1125 年）二月，天祚帝在应州一带被金将完颜娄室俘虏，辽朝灭亡（另见“金灭辽”条）。金朝封他为海滨王。据《辽史》，他在天会六年（1128 年）去世。
sources: []
recalled:
