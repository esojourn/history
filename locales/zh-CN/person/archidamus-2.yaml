name: 阿希达穆斯二世
aliases: [阿基达摩斯二世]
role: 斯巴达国王
summary: 斯巴达欧里庞提德家族的国王，伯罗奔尼撒战争头十年因他而称“阿希达穆斯战争”。
body: |-
  斯巴达欧里庞提德王室的国王，约公元前 469 年继祖父列奥提基达斯之位，在位四十多年。据狄奥多罗斯和普鲁塔克，前 464 年斯巴达发生大地震，房屋倒塌，死者极多，他立刻吹号集合幸存的公民，列阵戒备，使趁乱而起的希洛人不敢进攻城区。

  前 432 年，科林斯等盟邦到斯巴达控诉雅典。修昔底德记下了他在公民大会上的发言：他说自己经历过许多战争，深知这场战争不会很快结束，雅典有海军、有钱、有盟邦的贡赋，斯巴达在这些方面都没有准备，应当先交涉并用两三年备战。监察官斯特涅莱达斯用几句话驳回了他，大会表决认定雅典已破坏和约。修昔底德说他为人明智而稳重。

  他与伯里克利有宾主之谊。伯里克利担心他入侵时故意不毁自己的田产而使雅典人生疑，事先声明把这些田产交给城邦。前 431 年、前 430 年和前 428 年，他三次率伯罗奔尼撒联军侵入阿提卡，毁坏庄稼；前 429 年他围攻雅典的盟邦普拉提亚。他约在前 427 年去世，其子阿基斯二世继位。战争的头十年（前 431 年至前 421 年）后世以他的名字称为“阿希达穆斯战争”。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷一第 79—85 章；卷二第 10—23、71—78 章
  - 狄奥多罗斯《历史丛书》卷十一第 63 章
  - 普鲁塔克《客蒙传》第 16 章
