name: “高傲者”塔克文
aliases: [塔克文·苏佩布, 小塔克文, 高傲者塔克文]
role: 传说中的罗马末代国王
summary: 传说中的罗马第七位、也是末代国王，因暴虐和卢克蕾提亚事件被逐。
body: |-
  相传为罗马第七位、也是最后一位国王，传统上定在公元前 535 年至前 509 年在位。他是老塔克文的儿子（一说孙子），娶塞尔维乌斯·图利乌斯之女图利娅，在她鼓动下杀死岳父夺位。李维说他既未经人民选举，也未得元老院认可，靠卫队统治，不经咨询就处死、流放元老，没收财产，因而得了“高傲者”的绰号。

  对外他颇有作为。据李维，他以诡计除掉拉丁人中的反对者图尔努斯·赫多尼乌斯，使拉丁各城承认罗马的领导；攻下沃尔斯基人的苏埃萨·波梅提亚，用战利品建造卡皮托利山上的朱庇特神庙；又让儿子塞克斯图斯假装叛逃，骗取加比伊城。传说他从库迈的女先知那里买下三卷预言书，此后由专人保管，遇大事查阅。他还征发平民修大下水道和竞技场的座位。

  前 509 年他率军围攻阿尔代亚时，儿子塞克斯图斯强暴了贵族科拉提努斯的妻子卢克蕾提亚，她自尽而死。卢基乌斯·尤尼乌斯·布鲁图在罗马鼓动人民，决议放逐国王一家；军队倒向起事者，塔克文被关在城门之外。他先后求助于维爱、塔尔奎尼和克鲁西乌姆的国王波尔塞纳，都未能复位；又鼓动女婿、图斯库卢姆的马米利乌斯联合拉丁各城，在雷吉鲁斯湖战败。

  据李维，他最后投奔库迈的僭主阿里斯托德莫斯，前 495 年死在那里。王政结束的经过带有很多戏剧成分，与雅典驱逐僭主的故事也有相似之处；但罗马在前 6 世纪末由国王统治转为每年选举长官，学者一般认为是可信的。
sources: []
recalled:
  - 李维《建城以来史》卷一、卷二
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷四至卷六
