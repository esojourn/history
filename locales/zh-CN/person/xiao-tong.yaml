name: 萧统
aliases: [昭明太子, 萧德施]
role: 太子、文学家
summary: 梁武帝长子，三十一岁早逝，主持编成现存最早的诗文总集《文选》。
body: |-
  萧统字德施，梁武帝萧衍的长子，母亲是丁贵嫔。齐和帝中兴元年（公元 501 年），萧衍在襄阳起兵时，他生于襄阳。次年梁朝建立，他被立为太子，年仅两岁。

  据《梁书》本传，他三岁读《孝经》《论语》，五岁遍读五经，读书数行并下，过目不忘。他性情宽和，喜爱文学，东宫藏书近三万卷，常与刘孝绰、王筠、殷芸、陆倕、到洽等文士讨论典籍，商榷古今。在他的主持下，东宫文士编成《文选》三十卷，选录先秦至梁代的诗文七百余篇，是现存最早的一部诗文总集，后世称为《昭明文选》（另见“《文选》编成”条）。他也信佛，曾在宫内另立慧义殿，招集名僧讲论。

  普通七年（526 年），丁贵嫔去世。《南史》记载，有道士说墓地不利于长子，他听从建议，在墓旁埋下蜡鹅等厌祷之物，后来被宫监告发，武帝大为不满，虽没有深究，但他从此惭愧不安。这件事只见于《南史》，《梁书》没有记载，真伪有不同看法。

  中大通三年（531 年），他在后池泛舟采摘芙蓉，落水伤了大腿，不久病死，年三十一，谥昭明。武帝没有立他的儿子，而立他的同母弟萧纲为太子，他的儿子们心怀不满，其中岳阳王萧詧后来投靠西魏，在江陵建立了附属西魏、北周的后梁。
sources: []
recalled:
  - 《梁书·昭明太子传》
  - 《南史·梁武帝诸子传》
