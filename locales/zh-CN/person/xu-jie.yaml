name: 徐阶
aliases: [文贞]
role: 嘉靖末、隆庆初的内阁首辅
summary: 隐忍多年，扳倒严嵩后任内阁首辅，以嘉靖帝遗诏的名义革除弊政、平反冤案。
body: |-
  徐阶是松江府华亭（今上海市松江区）人，嘉靖二年（1523 年）考中进士，早年因反对嘉靖帝改动孔子祀典而被贬为延平府推官，后来逐渐升迁，嘉靖三十一年（1552 年）入阁。当时严嵩任首辅，徐阶小心应对，也撰写青词，以取得嘉靖帝的信任，同时暗中积蓄力量。

  嘉靖四十一年（1562 年）徐阶借道士蓝道行扶乩之事影响嘉靖帝，又支持御史邹应龙弹劾严世蕃，严嵩被罢官，徐阶继任首辅。他在内阁中提出“以威福还主上，以政务还诸司，以用舍刑赏还公论”，被时人称道。嘉靖四十五年（1566 年）海瑞上疏触怒嘉靖帝，徐阶设法保全了海瑞。同年嘉靖帝去世，徐阶与弟子张居正起草遗诏，以先帝的名义停止斋醮、释放因言获罪的官员、平反“大礼议”以来的冤案，朝野称快。

  隆庆初年，徐阶与同在内阁的高拱不和，隆庆二年（1568 年）辞官回乡。他家在松江占有大量田地，后来海瑞巡抚应天时要求他退还侵占的民田，高拱复出后也追究他家子弟的罪责，在张居正的调护下才得以化解。万历十一年（1583 年）他在家乡去世，追谥“文贞”。
sources: []
recalled:
  - 《明史·徐阶传》
