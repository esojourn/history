name: 路加
aliases: []
role: 医生、保罗的同工
summary: 保罗称为“所亲爱的医生”，传统上认为是《路加福音》和《使徒行传》的作者。
body: |-
  新约提到路加名字的地方只有三处：《歌罗西书》4:14 称他为所亲爱的医生，《腓利门书》第 24 节把他列在保罗的同工里，《提摩太后书》4:11 说只有路加还在保罗身边。《歌罗西书》4:10–14 先列举“奉割礼的人”，路加不在其内，所以一般认为他是外邦人。他的出身、生卒年份，新约都没有记载。

  《路加福音》和《使徒行传》都是写给提阿非罗的（路 1:3；徒 1:1），后一卷自称接续前书，两卷书本身都没有署作者的名字。自二世纪起，教会传统认为这两卷书出自路加之手。《使徒行传》里有几段叙述改用“我们”，通常被看作作者本人与保罗同行的记录：从特罗亚到腓立比（16:10–17），从腓立比回耶路撒冷（20:5—21:18），以及从该撒利亚航海到罗马（27:1—28:16）。

  新约所载仅此。相传他是叙利亚的安提阿人，终身未娶，八十四岁时死在希腊；这些说法出自后世的教会文献，不见于新约。
sources: []
recalled:
  - 《歌罗西书》4:10–14
  - 《腓利门书》第 24 节
  - 《提摩太后书》4:11
  - 《路加福音》1:1–4；《使徒行传》1:1，16:10–17，20:5—21:18，27:1—28:16
  - 优西比乌《教会史》卷 3 第 4 章
