name: 魏明帝
aliases: [曹叡, 曹元仲]
role: 皇帝
summary: 魏朝第二位皇帝，在位时抵御蜀、吴的进攻，平定辽东，晚年大修宫殿。
body: |-
  据《三国志·魏书·明帝纪》，曹叡字元仲，是曹丕的长子，生母甄氏在黄初二年被曹丕赐死。黄初七年（公元 226 年）他即皇帝位。本纪说他死时三十六岁，据此生于 204 年；裴松之在注中认为这个岁数有误，应是三十四岁，则生于 206 年。

  他在位期间，诸葛亮多次北伐。太和二年（228 年）蜀军出祁山，他亲自到长安坐镇，派张郃在街亭击败马谡。青龙二年（234 年）诸葛亮进驻五丈原，孙权同时进攻合肥新城，他命司马懿在西线坚守不战，自己率军东征，孙权退兵。景初二年（238 年）他派司马懿出兵辽东，消灭了割据当地的公孙渊。他还命陈群等人参照汉律修订法令，制成《魏律》十八篇。

  青龙三年起，他在雒阳大规模营建宫殿，征发的劳役很重，大臣屡次进谏。他没有活下来的儿子，收养了曹芳。景初三年（239 年）正月他病重，把八岁的曹芳托付给曹爽和司马懿，当天去世。
sources: []
recalled:
  - 《三国志·魏书·明帝纪》及裴松之注
