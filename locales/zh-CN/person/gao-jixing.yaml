name: 高季兴
aliases: [高季昌, 南平武信王]
role: 荆南节度使、南平王
summary: 荆南（南平）的建立者，907 年起镇守江陵，地小兵弱，向四方称臣以图自存。
body: |-
  高季兴原名高季昌，陕州硖石人，早年在汴州富人李让家做僮仆，后来进入朱温军中，逐渐升为将领。开平元年（公元 907 年），朱温任命他为荆南节度使，镇守江陵。当时荆南屡经战乱，城邑残破，他招集流散的百姓，修缮城池，逐渐站稳脚跟。

  后梁灭亡后，他为避后唐庄宗祖父李国昌的名讳，改名季兴。同光元年（923 年）他入朝洛阳，据《资治通鉴》，庄宗本想把他扣留下来，经郭崇韬劝说才放他回去，他回到江陵后对人说庄宗骄纵自满，不足为惧。次年后唐封他为南平王。后唐灭前蜀后，他请求得到夔、忠、万三州，后来又与后唐交恶，后唐派兵讨伐，没能攻下江陵。

  荆南是十国中最小的一国，只有江陵附近几州之地，夹在后唐、吴（南唐）、楚、蜀之间，只能向各方称臣，求取赏赐。天成三年（928 年）高季兴去世，儿子高从诲继位，延续了这种做法，据史书，各国因此称高从诲为“高无赖”。荆南到 963 年才被北宋所灭。
sources: []
recalled:
  - 《旧五代史·世袭列传·高季兴》
  - 《新五代史·南平世家》
  - 《资治通鉴》卷二百六十六至二百七十六
