name: 中行说
aliases: []
role: 匈奴谋臣
summary: 汉文帝时的宦者，燕人，随和亲公主入匈奴后投降，为单于谋划。
body: |-
  中行说是燕地人，汉文帝时的宦者，生卒年不详，事迹见《史记·匈奴列传》。老上单于初立（约公元前 174 年），文帝送宗室女去和亲，命中行说随行辅导公主。他不愿去，被强行派遣，行前说“必我行也，为汉患者”，到匈奴后便投降单于，很受亲信。

  他劝单于不要贪恋汉朝的缯絮食物，以免依赖汉朝；教单于左右分条记事，用来统计人口和牲畜；又让单于致汉的书牍用比汉廷更大的尺寸，改用更倨傲的称号。汉使批评匈奴习俗时，他逐一辩驳。老上死后，他继续事奉军臣单于，结局史书没有记载。
sources:
  - 《史记·匈奴列传》 https://zh.wikisource.org/wiki/史記/卷110
  - 《汉书·匈奴传上》 https://zh.wikisource.org/wiki/漢書/卷094上
