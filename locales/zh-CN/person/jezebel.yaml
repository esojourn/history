name: 耶洗别
aliases: []
role: 北国以色列王后
summary: 西顿王之女，亚哈的王后，推行巴力崇拜，后在耶斯列被耶户所杀。
body: |-
  西顿王谒巴力的女儿，嫁给以色列王亚哈（《列王纪上》16:31）。圣经没有记载她的生年。亚哈娶她以后，在撒玛利亚为巴力建庙筑坛。据 18:4，她杀害耶和华的众先知，亚哈的家宰俄巴底把一百个先知藏在洞里才得保全；18:19 说，有四百五十个巴力的先知和四百个亚舍拉的先知在她的席上吃饭。迦密山的事过后，她差人告诉以利亚，要取他的性命，以利亚因此逃往别是巴，又走到何烈山（19:1–8）。

  第 21 章记载，耶斯列人拿伯不肯出让葡萄园，耶洗别托亚哈的名写信，用王的印封上，叫拿伯本城的长老贵胄找人诬告他谤渎神和王，把他用石头打死，然后叫亚哈去得那葡萄园。以利亚为此预言，狗要在耶斯列的外郭吃耶洗别的肉（21:23）。

  亚哈死后，他的儿子亚哈谢、约兰相继作王。据《列王纪下》9:30–37，耶户杀了约兰，来到耶斯列；耶洗别擦粉梳头，从窗户里往外看，把耶户比作杀主人的心利。耶户叫窗内的两三个太监把她扔下来，她的血溅在墙上和马上，身体被践踏。耶户吃喝之后吩咐人去葬埋她，去的人只找到头骨、脚和手掌。《启示录》2:20 用“耶洗别”这个名字指推雅推喇教会中一个自称是先知的妇人。
sources: []
recalled:
  - 《列王纪上》16:31、第 18—19 章、第 21 章
  - 《列王纪下》9:30–37
  - 《启示录》2:20
