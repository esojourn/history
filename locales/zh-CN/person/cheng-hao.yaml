name: 程颢
aliases: [程明道, 明道先生, 程伯淳]
role: 北宋理学家
summary: 北宋理学家，与弟弟程颐并称“二程”，提出“天理”之说，主张“识仁”。
body: |-
  程颢是河南洛阳人，明道元年（公元 1032 年）生于黄州黄陂县，他父亲程珦当时任黄陂县尉。少年时他和弟弟程颐一起跟随周敦颐学习。嘉祐二年（1057 年）他考中进士，此后在鄠县、上元、晋城等地任职，政绩很好。

  熙宁二年（1069 年）王安石推荐他任监察御史里行。他起初参与变法的讨论，后来对新法的推行方式提出批评，屡次上书神宗，劝他不要急于求利，结果被调离朝廷。此后他长期在洛阳居住，与弟弟程颐一同讲学，学生很多。元丰八年（1085 年）哲宗即位，朝廷召他任宗正寺丞，他还没有动身就病逝了，文彦博为他题墓碑，称他为“明道先生”。

  程颢与程颐的学说合称“洛学”。据《二程外书》，程颢说过：“吾学虽有所受，‘天理’二字却是自家体贴出来。”他认为天理就在人心之中，学者首先要“识仁”，“仁者以天地万物为一体”，体认了这个道理，再以诚敬存养即可，不必刻意防检穷索。他待人温和，教学循循善诱，学生朱光庭说与他相处一个月，如同坐在春风之中。后世认为他的学说偏重内心体认，对南宋陆九渊、明代王守仁一系的心学有所启发；程颐的学说则为朱熹所继承和发展。
sources: []
recalled:
  - 《宋史·道学传·程颢》
  - 程颐《明道先生行状》
  - 《二程遗书》《二程外书》
