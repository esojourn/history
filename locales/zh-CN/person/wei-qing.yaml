name: 卫青
aliases: [卫仲卿, 长平侯, 大将军]
role: 大将军
summary: 汉武帝时的大将军，七次出击匈奴，收复河南地，在漠北击败单于本部。
body: |-
  据《史记·卫将军骠骑列传》，卫青字仲卿，河东平阳人。他的父亲郑季是平阳县的小吏，在平阳侯家当差时与侯家的婢女卫媪生下了他。卫青少年时回到父亲家牧羊，受郑家兄弟轻贱，长大后回平阳侯家做骑奴，改从母姓。建元二年（公元前 139 年），他的同母姐姐卫子夫入宫受到武帝宠爱，他也被召到宫中任职。

  元光六年（前 129 年），汉分四路出击匈奴，卫青任车骑将军出上谷，是四路中唯一有斩获的一路。元朔二年（前 127 年），他出云中，西至陇西，赶走匈奴的白羊王、楼烦王，收复秦末失去的河南地，汉在那里设朔方郡，他被封为长平侯。元朔五年，他率军夜袭匈奴右贤王的驻地，武帝派使者在军中拜他为大将军。次年他两次出定襄作战。

  元狩四年（前 119 年），武帝命卫青、霍去病各率五万骑兵分道深入漠北。卫青出定襄，与伊稚斜单于的本部相遇，以武刚车环绕结营，随后纵兵合围。单于乘夜率数百骑突围而去，卫青追到寘颜山赵信城，烧掉匈奴的积粮而还。此战之后，他与霍去病同被任命为大司马。

  本传说他为人谦让，不招揽宾客。漠北之战以后他不再出征。他后来娶了旧主平阳公主。元封五年（前 106 年）去世，陪葬茂陵。
sources: []
recalled:
  - 《史记·卫将军骠骑列传》
  - 《汉书·卫青霍去病传》
