name: 刘安
aliases: [淮南王]
role: 淮南王
summary: 汉高祖之孙，封淮南王，召集宾客编成《淮南子》，后以谋反罪自杀。
body: |-
  刘安是汉高祖的孙子，淮南厉王刘长的长子。刘长在文帝时因谋反被废，死于流放途中。文帝十六年（公元前 164 年），刘安受封为淮南王，都寿春。

  据《汉书·淮南衡山济北王传》，他喜好读书弹琴，不爱打猎驰骋，招集了数千名宾客和方术之士，一同著书。其中《内书》二十一篇流传至今，称为《淮南子》，又名《淮南鸿烈》，以道家学说为主，兼采阴阳、儒、法各家，内容涉及天文、地理、养生和治国。建元二年（前 139 年）他入朝，把这部新写成的书献给刚即位的武帝，武帝很珍视。武帝还让他为《离骚》作传，本传说他清晨受命，早饭时就交了稿。

  本传说他因父亲的死而长期心怀怨望，暗中制作兵器、结交各郡国，与宾客伍被等人谋划起事。后来他的孙子刘建和伍被先后向朝廷告发。元狩元年（前 122 年），朝廷派人前往查办，刘安自杀，王后、太子和参与谋划的人都被处死，淮南国被废为九江郡。此案与同时的衡山王案牵连被杀的人，《史记》说有数万。后世有他服药成仙、“鸡犬升天”以及发明豆腐的传说，都不见于《史记》《汉书》。
sources: []
recalled:
  - 《史记·淮南衡山列传》
  - 《汉书·淮南衡山济北王传》
