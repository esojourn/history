name: 苏威
aliases: [苏无畏]
role: 纳言
summary: 苏绰之子，隋文帝时与高颎共掌朝政，主张减轻赋役，参与修订律令。
body: |-
  苏威字无畏，京兆武功人，是西魏名臣苏绰的儿子。北周时宇文护专权，把女儿嫁给了他，他担心日后受到牵连，避居山中的寺院。杨坚辅政时，高颎推荐了他。

  隋朝建立后，他历任纳言、民部尚书等职，与高颎同心协力，参与制定律令和各项制度。据《隋书·苏威传》，他记得父亲生前说过当时的赋役好比张满的弓，希望后人能够放松，所以奏请减轻赋役，文帝采纳了他的建议。他兼任的职务很多，有人批评他揽权。开皇十年（公元 590 年）前后江南豪强起兵反隋，据《资治通鉴》，起因之一是苏威作《五教》，要江南百姓诵读，又传言要把他们迁入关中，引起不安。

  炀帝时他仍任纳言，与宇文述、裴矩等人并称“五贵”。他劝谏炀帝不要再征高句丽，又暗示民变严重，炀帝不悦，把他除名为民。大业十四年（618 年）江都之变后，他先后依附宇文化及、李密和王世充。唐朝平定洛阳后，他回到长安，没有再被任用，武德六年（623 年）去世，年八十二。
sources: []
recalled:
  - 《隋书·苏威传》
  - 《资治通鉴》卷一百七十五至一百八十九
