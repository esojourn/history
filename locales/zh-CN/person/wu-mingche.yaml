name: 吴明彻
aliases: [吴通昭]
role: 名将
summary: 陈朝名将，太建北伐攻克寿阳、收复淮南，后在吕梁兵败被北周俘虏。
body: |-
  吴明彻字通昭，秦郡人，幼年丧父。侯景之乱时，江南饥荒，据《陈书》本传，他家中有粟麦三千余斛，拿出来分给乡里，因而得到乡人拥戴。他投奔陈霸先，此后屡立战功。

  太建五年（公元 573 年），陈宣帝以他为都督，北伐北齐。他率军渡江，攻占秦郡、历阳，进围寿阳，筑堰拦截肥水灌城，攻克寿阳，擒杀北齐将领王琳，淮南之地全部收复，他因功被封为南平郡公。

  太建九年（577 年）北周灭北齐后，他又奉命北攻彭城，筑堰拦截泗水灌城。北周派王轨率军在清水入淮之处用铁锁连接车轮，截断陈军的退路。次年他决堰撤退，船队行至清口受阻，全军溃败，他被北周俘虏，押送长安。北周封他为怀德郡公，大象二年（580 年），他忧愤成病去世。
sources: []
recalled:
  - 《陈书·吴明彻传》
  - 《资治通鉴》卷一百七十一至一百七十三
