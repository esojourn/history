name: 约翰王
aliases:
  - 无地王约翰
  - 英王约翰
role: 英格兰国王
summary: 英格兰国王，与英诺森三世相争失败，1213 年向教廷称臣，后被迫签署《大宪章》。
body: |-
  约翰 1166 年 12 月生于牛津，是英王亨利二世最小的儿子。因为父亲早年分封时没有给他土地，得了“无地”的绰号。1199 年兄长理查一世去世，他继位为王。1204 年法王腓力二世夺走了他在法国的诺曼底、安茹等领地。

  1205 年坎特伯雷大主教去世，修士们和国王各有人选。教皇英诺森三世两个都不承认，让修士们另选了在罗马的英格兰学者斯蒂芬·兰顿。约翰拒绝兰顿入境，并没收坎特伯雷教会的产业。《历史的轨迹》第十八章记载：1208 年教皇对英格兰下了禁令，全国不准举行教会礼仪；次年约翰被革除教籍，臣民不必再服从他。该书说他“也失去了王位”；教皇是否正式下过废黜令，史家看法不一，他实际上一直在位，只是法王已准备渡海进攻。

  1213 年 5 月约翰在多佛附近向教皇的使节屈服，写下文书，把英格兰和爱尔兰献给神和罗马教会，再作为封地领回，除彼得捐以外，每年为英格兰纳贡七百马克、为爱尔兰纳贡三百马克。《历史的轨迹》引了这份文书，并说约翰把王冠和权杖交给使节，使节保管五天后交还。书中把使节的名字写作“鲁道夫”，这位使节名叫潘道夫。

  成了教皇的封臣，反而使他在国内得到教皇的支持。1214 年他的盟军在布汶被法王打败，贵族起来反抗；1215 年 6 月他在兰尼米德被迫签署《大宪章》，两个月后英诺森三世以约翰是他的封臣为理由宣布《大宪章》无效。内战再起，1216 年 10 月约翰在纽瓦克病逝。他许诺的贡金，英格兰议会在 1366 年宣布不再缴纳。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十九章“教会权势衰微” https://wellsofgrace.com/books/spiritual/2000years/html/chapter21.html"
recalled:
  - 温多弗的罗杰《历史之花》
  - 1213 年约翰王献国文书
  - 1215 年《大宪章》
  - 英诺森三世 1215 年 8 月废止《大宪章》的诏书
