name: 克吕尼的于格
aliases:
  - 大于格
  - 雨果
  - 笋哥
role: 克吕尼修道院院长
summary: 任克吕尼院长六十年，克吕尼修会在他手下达到极盛，曾在卡诺莎为亨利四世说情。
body: |-
  于格 1024 年生于勃艮第瑟米尔的贵族家庭，少年时进克吕尼修道院，1049 年二十五岁当选院长，在任六十年。

  克吕尼修道院是 910 年创立的，直属教皇，不受当地主教和领主管辖。它的分院不另设院长，都归克吕尼的院长统管。《历史的轨迹》第十三章说，克吕尼在最兴盛的时期统管两千多所修道院，这正是于格在任的时候。第十四章说，教皇利奥九世到各地开会推动革新，得到克吕尼院长于格的合作。

  他是皇帝亨利四世的教父，在教皇与皇帝的争执中两边都说得上话。1077 年 1 月亨利到卡诺莎求赦时，于格在场，与城堡的女主人玛蒂尔达一同替他向贵格利七世求情。发动十字军的乌尔班二世早年是他手下的修士。1088 年他动工重建克吕尼的大教堂，建成后是当时西欧最大的教堂。他于 1109 年 4 月在克吕尼去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十三章“修道主义与克吕尼革新运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter15.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十四章“教会为自由奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter16.html"
recalled:
  - 吉洛《克吕尼院长于格传》
  - 赫斯菲尔德的兰伯特《年代记》1077 年条
