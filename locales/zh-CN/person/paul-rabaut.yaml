name: "拉博"
aliases: ["保罗·拉博", "拉波"]
role: "“旷野教会的使徒”"
summary: "胡格诺派牧师，在逼迫中秘密牧养法国改革宗五十余年，恐怖时期被囚，获释后去世。"
body: |-
  拉博 1718 年生于朗格多克的贝达里约。《历史的轨迹》第三十九章说他比库尔小二十三岁，二十岁时献身于法国改革宗教会，在库尔的洛桑神学院进修过一段时间。他充满热诚，是一位有恩赐的讲员，有天生的吸引力。

  该书说，库尔把“旷野”教会的精神描写为一种苦修、内省、殉道的精神，教导信徒天天向自己死，在神呼召时勇往直前，面对酷刑与绞架，拉博就是这种精神的具体表现。他在法国改革宗工作了五十六年，以尼姆为中心，时常冒着生命危险，靠“蛇的灵巧”躲过官府的追捕，不愧为“旷野教会的使徒”。

  该书说，1787 年容忍诏谕之后，两年后法国大革命爆发；到 1793 年政府被无神论者操纵，天主教和复原教都受逼迫，年老体弱的拉博被投进监狱。他在恐怖时期结束后获释，1794 年在尼姆去世。他的儿子拉博·圣艾蒂安是国民议会议员，1793 年被送上断头台。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
