name: 司马懿
aliases: [司马仲达, 晋宣帝]
role: 太傅
summary: 曹魏重臣，多次领兵抵御诸葛亮，晚年发动高平陵之变夺取大权，为西晋奠基。
body: |-
  据《晋书·宣帝纪》，司马懿字仲达，河内温县人，出身世代为官的大族。建安六年（公元 201 年）曹操征召他，他借口有风痹病推辞；建安十三年曹操任丞相后再次征召，他才出任文学掾。此后他在太子曹丕身边任职，很受信任。建安二十四年关羽围攻樊城，曹操考虑迁都避其锋芒，司马懿劝阻，建议联合孙权从背后袭击关羽。

  曹丕称帝后，司马懿升至抚军大将军、录尚书事，曹丕临终时命他与曹真、陈群等共同辅佐明帝。太和元年（227 年）驻守新城的孟达暗中联络蜀、吴，司马懿不等朝廷批复就率军急行，八天赶到城下，次年初攻破新城，斩孟达。曹真死后，他到关中主持对蜀的防务，太和五年和青龙二年（234 年）两次与诸葛亮对峙，采取坚守不战的办法，蜀军最终退兵。景初二年（238 年）他率军远征辽东，消灭公孙渊。

  景初三年明帝去世，司马懿与大将军曹爽同受遗诏，辅佐八岁的曹芳。不久曹爽把他升为太傅，实际上夺去他的权力。正始八年（247 年）起司马懿称病不问政事。嘉平元年（249 年）正月，曹爽兄弟陪皇帝出城去高平陵祭扫，司马懿在雒阳发动政变，控制都城，随后诛灭曹爽及其党羽。

  嘉平三年（251 年），太尉王凌在淮南谋划另立皇帝，司马懿率军东下，王凌被迫投降后自杀。同年八月司马懿在雒阳去世，终年七十三。他的儿子司马师、司马昭相继执政，孙子司马炎代魏建晋，追尊他为宣皇帝。
sources: []
recalled:
  - 《晋书·宣帝纪》
  - 《三国志·魏书·明帝纪》《三少帝纪》《曹爽传》
