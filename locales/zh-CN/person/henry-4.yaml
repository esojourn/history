name: 亨利四世
aliases:
  - 海因里希四世
role: 德意志国王、皇帝
summary: 萨利安王朝的皇帝，为主教任命权与贵格利七世相争，1077 年到卡诺莎悔罪求赦。
body: |-
  亨利 1050 年 11 月生于戈斯拉尔，1056 年父亲亨利三世去世时不满六岁，由母后阿格尼丝摄政。1062 年科隆大主教安诺在莱茵河上把他劫走，夺了摄政的权。他 1065 年亲政，次年娶萨伏依的贝尔塔。

  《历史的轨迹》第十六章解释他为什么不能放弃任命主教的权：德意志分属许多公侯，联合起来比皇帝还强；主教和修道院院长也是封臣，皇帝靠他们才压得住贵族。1073 年萨克森人起兵，他对新教皇贵格利七世表面上很恭顺；1075 年 6 月打败萨克森人以后，他照旧给米兰等地的主教授职。

  1076 年 1 月他在沃尔姆斯召集主教，宣布不再承认贵格利，去信称他为“伪修士希尔得布兰”。教皇革除了他的教籍。10 月诸侯在特里布尔开会，限他一年之内得到赦免，否则另立新王，并定于次年 2 月在奥格斯堡由教皇主持会议。亨利住在施派尔，冬天带着王后、幼子和少数随从翻越阿尔卑斯山，1077 年 1 月 25 日到卡诺莎城堡外，穿着悔罪者的衣服赤足站了三天，得到赦免。《历史的轨迹》说，教皇作为司铎不能拒绝悔罪的人，亨利等于逼出了这道赦令，是“以屈尊取胜”。

  诸侯仍在 1077 年 3 月另立士瓦本公爵鲁道夫为王，德意志打了三年内战。1080 年亨利再次被革除教籍，他让主教们另立教皇；同年 10 月鲁道夫战伤而死。1084 年亨利攻入罗马，由对立教皇克莱门特三世加冕为皇帝，诺曼人赶来时退走。

  他晚年两个儿子先后反叛。1105 年底幼子亨利五世把他囚禁起来，逼他退位。他逃到列日，1106 年 8 月在那里去世。因为教籍没有恢复，遗体在施派尔一座未祝圣的小堂里停放了五年才下葬。
