name: 樊崇
aliases: []
role: 赤眉军首领
summary: 琅邪人，王莽末年在莒起兵，所部称赤眉军，攻入长安，后在宜阳向刘秀投降，不久被杀。
body: |-
  据《后汉书·刘玄刘盆子列传》，樊崇是琅邪人。天凤五年（公元 18 年）他带着一百多人在莒县起事，后来转入泰山一带，自称“三老”。当时青州、徐州连年饥荒，前来投奔的人很多，一年间就有一万余人；同郡的逄安和东海的徐宣、谢禄等人也各率部众与他会合。列传说他们起初没有文书、旗帜和号令，只口头相约“杀人者死，伤人者偿创”，首领之间以三老、从事、卒史相称。

  地皇三年（22 年），王莽派太师王匡、更始将军廉丹率十余万人来镇压。樊崇让部下把眉毛染红，以便与莽军区别，“赤眉”的名号由此而来。赤眉军在成昌大败莽军，廉丹战死，此后转战于今山东、江苏、河南交界一带。更始帝在雒阳即位后，樊崇等二十余名首领前去归附，被封为列侯，却没有封地，留在原地的部众又开始离散，他们便逃回军中。

  更始二年冬，赤眉军分两路向西进入关中。次年六月，他们在军中找到三名汉朝宗室的后代，用抽签的办法立十五岁的放牛少年刘盆子为皇帝，樊崇任御史大夫。九月赤眉军攻入长安，更始帝投降。关中连年战乱，粮食匮乏，赤眉军在长安一带抢掠，后来只得东归。建武三年（27 年）初，他们在宜阳被刘秀的大军拦住去路，全军投降。刘秀把樊崇等人安置在雒阳，赐给田宅。当年夏天，樊崇与逄安图谋再次起事，被处死。
sources: []
recalled:
  - 《后汉书·刘玄刘盆子列传》
  - 《资治通鉴》卷三十八至四十一
