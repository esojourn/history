name: 宣德帝
aliases: [朱瞻基, 明宣宗]
role: 明朝第五代皇帝
summary: 永乐帝之孙，与父亲洪熙帝的统治合称“仁宣之治”，平定汉王之乱，停止对交趾用兵。
body: |-
  朱瞻基是洪熙帝朱高炽的长子，生于建文元年（1399 年），据说深得祖父朱棣的喜爱，永乐九年（1411 年）被立为皇太孙，多次随朱棣出塞北征。洪熙元年（1425 年）朱高炽即位不到一年就去世，朱瞻基即位，次年改元宣德。

  宣德元年（1426 年），他的叔父汉王朱高煦在乐安起兵，朱瞻基接受大臣杨荣等人的建议亲征，朱高煦很快出降，后来被处死。宣德年间，朝政由杨士奇、杨荣、杨溥等内阁大学士辅佐（史称“三杨”），蹇义、夏原吉等老臣也继续任职，朝廷减免赋役、整顿吏治，社会比较安定，史家把洪熙、宣德两朝合称为“仁宣之治”。

  宣德二年（1427 年）明军在交趾屡战屡败，朱瞻基决定放弃交趾，撤回官吏和军队，承认黎利政权。宣德五年（1430 年）他派郑和率船队第七次下西洋，这也是最后一次。在内政上，他设内书堂教宦官读书，又让宦官以“批红”参与处理奏章，为日后宦官干政埋下了隐患。

  朱瞻基喜爱书画，擅长绘画，宫廷画院在他的时期颇为兴盛；他也喜欢斗蟋蟀，民间有“促织瞿瞿叫，宣德皇帝要”的说法，宣德年间烧造的铜器、瓷器后世很受推崇。宣德十年（1435 年）正月他在北京病逝，年仅三十七岁，九岁的长子朱祁镇即位。
sources: []
recalled:
