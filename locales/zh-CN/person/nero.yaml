name: 尼禄
aliases:
  - 尼禄·克劳狄乌斯·恺撒
role: 罗马皇帝
summary: 罗马皇帝，公元 64 年罗马大火后把罪名加给基督徒，是第一个逼迫基督徒的皇帝。
body: |-
  尼禄于公元 37 年生在安提乌姆，母亲小阿格里皮娜后来嫁给克劳狄皇帝，让克劳狄收他为养子。公元 54 年克劳狄死后，十六岁的尼禄继位，起初由哲学家塞涅卡和禁卫军长官布鲁斯辅佐。据塔西佗和苏维托尼乌斯记载，他在 59 年派人杀死了母亲。

  他在位的头几年政事平稳。在东方，将领科尔布洛为亚美尼亚与帕提亚相持多年，最后议定由帕提亚王的弟弟提里达特斯做亚美尼亚王，公元 66 年到罗马由尼禄加冕；不列颠在 60 年前后有布狄卡起事。62 年布鲁斯去世、塞涅卡引退之后，他与妻子、克劳狄的女儿屋大维娅离婚并将她处死，改娶波佩娅。他热衷于弹唱、演戏和赛车，亲自登台，元老们认为有失体统。65 年皮索等人谋刺他的计划败露，塞涅卡、诗人卢坎等奉命自尽。66 至 67 年他到希腊巡游，参加各处的竞技会，宣布免除希腊的贡赋。

  公元 64 年 7 月，罗马城发生大火。塔西佗《编年史》卷 15 说，火烧了六天，后来又复燃，全城十四个区只有四个完好。当时就有传言说火是皇帝叫人放的，塔西佗本人对此不下断语。他接着写道，尼禄为了平息传言，把罪名加给“民众称为基督徒的那些人”，用极残忍的办法处死他们：有的披上兽皮被狗咬死，有的钉十字架，有的在入夜后被点燃当作火把，地点就在尼禄自己的花园里。《历史的轨迹》第二章所述与此相合，并指出这次杀害只限于罗马城，没有扩展到全国。

  据教会传统，使徒彼得和保罗都在尼禄年间死于罗马，彼得被倒钉十字架，保罗被斩首。这些说法出自二世纪以后的记载，新约没有记两人的结局。

  公元 66 年犹太人起事，尼禄派韦斯巴芗前往平定。68 年高卢和西班牙的将领起兵，元老院宣布他为公敌，他逃到罗马城外的一处别墅自杀，终年三十岁。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
recalled:
  - 塔西佗《编年史》卷 15 第 38—44 章
  - 苏维托尼乌斯《罗马十二帝王传·尼禄传》第 16、38、49 章
  - 优西比乌《教会史》卷 2 第 25 章
  - 塔西佗《编年史》卷 13—16
  - 卡西乌斯·狄奥《罗马史》卷 61—63
