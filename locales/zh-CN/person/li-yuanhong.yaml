name: 黎元洪
aliases: [宋卿, 黎菩萨]
role: 湖北军政府都督，民国副总统、大总统
summary: 清朝湖北新军协统，武昌起义后被推为湖北军政府都督，后任民国副总统、大总统。
body: |-
  黎元洪是湖北黄陂人，毕业于天津北洋水师学堂，甲午战争中在北洋海军的“广甲”舰上服役，舰毁后落水获救。战后他投奔张之洞，帮助编练湖北新军，升至第二十一混成协协统（相当于旅长）。他为人宽厚，在新军中有一定的威望，有“黎菩萨”之称。

  宣统三年（1911 年）十月十日武昌起义爆发，起义的新军攻占了武昌，但革命党的主要领导人有的受伤，有的不在武汉。起义者为了号召各方，找到躲在部下家中的黎元洪，推举他为湖北军政府都督。据记载他起初不愿接受，后来才同意，以他的名义发布了檄文和告示（另见“辛亥革命”条）。他的出任对争取各省响应和外国的中立起了一定作用。

  中华民国成立后，黎元洪被选为副总统，后来依附袁世凯。袁世凯死后，他继任大总统，1917 年在“府院之争”中被迫下台，1922 年再次出任大总统，次年又被逐。1928 年他在天津去世。黎元洪本不是同盟会会员，本站因他在武昌起义中的角色把他归入革命一方。
sources: []
recalled:
  - 《黎元洪集》
  - 张国淦《辛亥革命史料》
