name: 阿卡狄乌斯
aliases: [阿卡迪乌斯, 亚迦丢, 阿尔卡狄乌斯]
role: 东罗马皇帝
summary: 狄奥多西一世长子，公元 395 年起治帝国东部，朝政操于大臣和皇后之手。
body: |-
  阿卡狄乌斯约在公元 377 年生于西班牙，是狄奥多西一世的长子，383 年被立为皇帝。395 年父亲去世，他在君士坦丁堡继承帝国东部，弟弟霍诺里乌斯继承西部；此后东西两部再没有合于一人。

  他性情软弱，朝政先后操在几个人手里：大臣鲁菲努斯在 395 年年底被军队杀死；接着是宦官欧特罗庇乌斯，399 年出任执政官，同年倒台；然后是皇后欧多克西娅，她是法兰克将领的女儿；皇后 404 年去世后，由大臣安特米乌斯主政。东部朝廷与西部的统帅斯提利科长期不和。399 年哥特将领盖纳斯起兵，一度控制都城，次年城中居民起而屠杀哥特士兵，盖纳斯败逃。

  398 年约翰·屈梭多模被请来做君士坦丁堡主教，因讲道指责宫廷的奢华，得罪了皇后，403 年和 404 年两次被放逐。阿卡狄乌斯于 408 年 5 月 1 日去世，七岁的儿子狄奥多西二世继位。
sources: []
recalled:
