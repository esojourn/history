name: 约雅斤
aliases:
  - 耶哥尼雅
  - 哥尼雅
role: 犹大王
summary: 犹大王，在位三个月即被尼布甲尼撒掳往巴比伦。
body: |-
  约雅敬的儿子，母亲是耶路撒冷人以利拿单的女儿尼护施他。据《列王纪下》24:8，他登基时十八岁，在耶路撒冷作王三个月；《历代志下》36:9 作八岁，作王三个月零十天，两处所记年龄不同。《耶利米书》等处又称他耶哥尼雅、哥尼雅。

  他在位时，巴比伦王尼布甲尼撒的军队围困耶路撒冷。约雅斤和他母亲、臣仆、首领、太监一同出城投降，巴比伦王便拿住他，时在巴比伦王第八年（24:12）。王把圣殿和王宫的宝物、首领、勇士、木匠、铁匠连同约雅斤一并掳到巴比伦，另立他的叔叔玛探雅为王，改名西底家（24:13–17）。巴比伦编年史记载尼布甲尼撒第七年亚达月初二日攻取犹大城、擒获其王、另立一王，学界据此把这件事定在公元前 597 年 3 月。两边纪年相差一年，一般解释为计算在位年的方法不同。

  据《列王纪下》25:27–30，他被掳后第三十七年，巴比伦王以未米罗达元年十二月二十七日使他出监，使他的位高过与他一同在巴比伦的众王，终身在王面前吃饭（《耶利米书》52:31 作二十五日）。巴比伦出土的配给泥板上也有发给犹大王约雅斤和他儿子们油粮的记录。他的卒年圣经没有记载。《历代志上》3:17–18 列有他的儿子，《马太福音》1:11–12 的家谱中有他的名字。
sources: []
recalled:
  - 《列王纪下》24:6–17、25:27–30
  - 《历代志下》36:8–10
  - 《耶利米书》22:24–30、52:31–34
  - 《历代志上》3:16–18
  - 巴比伦编年史（尼布甲尼撒第七年条）
  - 巴比伦王宫配给泥板（提到犹大王约雅斤）
