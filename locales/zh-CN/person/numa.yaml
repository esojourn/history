name: 努马·庞皮利乌斯
aliases: [努马]
role: 传说中的罗马第二位国王
summary: 传说中的罗马第二位国王，萨宾人，相传创立了罗马的宗教制度和历法。
body: |-
  相传为萨宾人，生于库雷斯；据普鲁塔克，他恰好生在罗马建城的那一天。他娶了萨宾王提图斯·塔提乌斯的女儿，妻子死后隐居乡间。罗慕路斯去世后，罗马经过一年的空位期，由元老轮流执政；罗马人和萨宾人相持不下，最后商定由罗马人从萨宾人中推选国王，选中了以虔敬著称的努马。传统上说他在公元前 715 年至前 673 年在位，共四十三年。

  传说把罗马的宗教制度大多归到他名下：设立朱庇特、马尔斯、奎里努斯三位神的专职祭司，从阿尔巴隆加引入维斯塔贞女看守圣火，设立舞蹈祭司团“萨利”和主管宗教事务的大祭司；修建雅努斯神庙，庙门战时打开、平时关闭，据说在他一朝始终关着。他还把一年从十个月改为十二个月，增设一月和二月，并规定哪些日子可以办理公务。李维说，他为了让人信服，自称夜里得到仙女埃格里亚的指点。

  古代有一种流行的说法，说他是毕达哥拉斯的学生。李维和普鲁塔克都指出两人年代不合，毕达哥拉斯到意大利是一百多年以后的事。据李维，他在位期间没有打过仗，死后葬在雅尼库鲁姆山下。

  现代学者多认为，这些制度是长期形成的，后人把它们集中归到一位“立法之王”身上，与好战的罗慕路斯恰成一对；努马本人是否实有其人无从确证。
sources: []
recalled:
  - 李维《建城以来史》卷一
  - 普鲁塔克《努马传》
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷二
