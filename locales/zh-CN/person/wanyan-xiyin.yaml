name: 完颜希尹
aliases: [谷神, 兀室]
role: 金朝大臣，女真文字创制者
summary: 金朝开国功臣，奉命创制女真文字，参与灭辽、攻宋。
body: |-
  完颜希尹本名谷神，宋人记作兀室，是女真完颜部人，生年不详。他跟随完颜阿骨打起兵，是金朝建国时的重要谋臣。据《金史》本传，阿骨打命他创制本国文字，他参照汉字的楷书，按照女真语创制了女真文字，天辅三年（1119 年）颁行，后世称为“女真大字”；金熙宗时又另创“女真小字”。

  他参与了灭辽和伐宋的战争，长期在完颜宗翰手下任职，靖康之变中也随军南下。金熙宗时他任尚书左丞相，参与推行汉式官制。天眷三年（1140 年）他被人诬告，与几个儿子一同被熙宗处死，后来得到昭雪。
sources: []
recalled:
