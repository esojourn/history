name: 伯里克利
aliases: [伯利克里, 培里克利斯]
role: 雅典政治家、将军
summary: 领导雅典三十余年，主持修建帕特农神庙，死于伯罗奔尼撒战争初年的瘟疫。
body: |-
  雅典人。父亲克桑提波斯是公元前 479 年米卡勒之战的雅典统帅，母亲阿伽里斯特出自阿尔克迈翁家族，是改革家克里斯提尼的侄女。前 472 年他出资为埃斯库罗斯的《波斯人》组织歌队，这是他最早见于记载的活动。前 463 年他参与控告客蒙。他支持厄菲阿尔特削减战神山议事会的权力，厄菲阿尔特遇刺后成为民主派的首领。

  他提议向陪审员发放津贴，使贫穷的公民也能参与审判；前 451 年他提出法律，规定父母双方都是雅典人的才算公民。前 454 年同盟金库从提洛岛迁到雅典。前 446 年至前 445 年，雅典与斯巴达订立三十年和约。从前 447 年起，他主持在卫城上重建被波斯人焚毁的神庙，帕特农神庙、卫城山门相继动工，总其事的是他的朋友、雕塑家菲迪亚斯。反对者指责他挪用盟邦的贡金来装点雅典；他们的首领、麦勒西亚斯之子修昔底德约在前 443 年被陶片放逐。此后直到去世，他几乎年年当选十将军之一。前 440 年萨摩斯反叛，他率舰队围攻九个月，迫其投降。

  他与来自米利都的阿斯帕西娅同居，与哲学家阿那克萨戈拉、普罗泰戈拉交往。战争临近时，菲迪亚斯、阿那克萨戈拉、阿斯帕西娅先后受到控告，普鲁塔克认为这些都是冲着他来的。

  前 431 年伯罗奔尼撒战争爆发。他的方略是把乡村居民撤入城内，不与斯巴达陆军决战，凭舰队和帝国的财力持久取胜。当年冬天，他为阵亡将士发表葬礼演说，修昔底德记下了讲辞，其中说雅典的制度之所以称为民主，是因为政权在多数人而不在少数人手中。前 430 年瘟疫在拥挤的城内爆发，民众迁怒于他，罢免并处以罚款，不久又重新选他为将军。他的两个婚生儿子死于瘟疫，他本人也在前 429 年秋病逝。修昔底德评论说，他在世时雅典名义上是民主政治，实际上是第一公民的统治。
