name: 底波拉
aliases: []
role: 女先知、士师
summary: 女先知，作以色列的士师，与巴拉一同击败迦南王耶宾的将军西西拉。
body: |-
  底波拉是一位女先知，拉比多的妻子。《士师记》4:4–5 说，当时是她作以色列的士师，她住在以法莲山地拉玛和伯特利中间，在“底波拉的棕树”下，以色列人都上她那里去听判断。圣经没有记载她的出身、生年和卒年。

  据《士师记》第 4 章，那时在夏琐作王的迦南王耶宾欺压以色列人二十年，他的将军西西拉住在外邦人的夏罗设，有铁车九百辆。底波拉打发人把亚比挪庵的儿子巴拉从拿弗他利的基低斯召来，向他传达耶和华的吩咐：率领一万拿弗他利人和西布伦人上他泊山，耶和华要把西西拉和他的车辆、全军引到基顺河，交在巴拉手中。巴拉说，底波拉若同去他就去，若不同去他就不去。底波拉答应同去，并告诉他，他在这条路上得不着荣耀，因为耶和华要把西西拉交在一个妇人手里。

  两人到了基低斯，巴拉招聚了一万人上他泊山。西西拉率铁车和全军来到基顺河，底波拉吩咐巴拉下山迎战，西西拉全军溃败。西西拉下车步行逃跑，进了基尼人希百的妻子雅亿的帐棚；他疲乏沉睡的时候，雅亿取帐棚的橛子钉进他的鬓边，他就死了。此后以色列人的手越发有力，直到灭了迦南王耶宾。

  《士师记》第 5 章是底波拉和巴拉在那日所唱的歌，歌中称底波拉为“以色列的母”，提到参战的各支派，也提到没有前来的支派。这首诗歌通常被学者看作希伯来圣经中年代很早的诗篇之一。5:31 记载，这次战事之后国中太平四十年。另外，《约书亚记》第 11 章也记有一位被约书亚击败的夏琐王耶宾，两处记载的关系历来有不同的解释。
sources: []
recalled:
  - 《士师记》第 4—5 章
  - 《约书亚记》第 11 章
