name: 海瑞
aliases: [海青天, 刚峰, 忠介]
role: 以清廉刚直著称的官员
summary: 上《治安疏》批评嘉靖帝而下狱；为官清廉，打击豪强，人称“海青天”。
body: |-
  海瑞是广东琼山（今海南海口）人，回族，自号刚峰。他只考中举人，嘉靖年间从福建南平县的教谕做起，后来任浙江淳安知县、江西兴国知县。他在淳安推行清丈田亩、均平赋役，生活十分节俭，据说他为母亲祝寿买了二斤肉，这件事成了官场的新闻。总督胡宗宪的儿子路过淳安时作威作福，海瑞把他拿下，没收了他带的金银，又写信给胡宗宪，说此人一定是冒充的。

  嘉靖四十五年（1566 年）海瑞任户部主事，上《治安疏》，批评嘉靖帝迷信道教、不理朝政，说“天下之人不直陛下久矣”，又说“嘉靖者，言家家皆净而无财用也”。据记载，他事先买好棺材，与妻子诀别，遣散仆人，然后上疏。嘉靖帝大怒，把他关进诏狱，同年嘉靖帝去世，隆庆帝即位后海瑞获释。

  隆庆三年（1569 年）海瑞以右佥都御史巡抚应天十府，在苏州、松江一带疏浚吴淞江和白茆河，又严厉打击豪强兼并，命令他们退还侵占的民田，前首辅徐阶家也在其中。这些做法引起官绅的强烈反对，次年他被弹劾去职，回乡闲居十余年。张居正当政时也没有起用他。

  万历十三年（1585 年）他以七十多岁的高龄被重新起用，任南京右佥都御史、南京吏部右侍郎，后改南京右都御史，仍然主张严惩贪官。万历十五年（1587 年）他在南京任上去世，据说同僚检点他的遗物，只有俸银十几两和几件旧衣服，连丧葬费用都是同僚凑的。他的灵柩运回家乡时，南京百姓沿江送行。谥“忠介”。后世小说戏曲中有很多关于他的故事，多出于演绎。
sources: []
recalled:
