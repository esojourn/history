name: 塞涅卡
aliases: [小塞涅卡, 卢基乌斯·安奈乌斯·塞涅卡, 塞内加, 塞内卡]
role: 哲学家、悲剧作家、尼禄的老师
summary: 斯多亚派哲学家、悲剧作家，尼禄的老师和辅臣，后奉命自尽。
body: |-
  塞涅卡约在公元前 4 年生于西班牙的科尔杜巴，父亲老塞涅卡是有名的修辞学家。他幼年被带到罗马，学修辞和斯多亚派哲学，卡利古拉在位时已是知名的演说家。41 年克劳狄即位不久，他被控与卡利古拉的妹妹尤利娅·莉维拉通奸，流放科西嘉岛八年。

  49 年小阿格里皮娜把他召回，让他教她的儿子尼禄。54 年尼禄即位，他与禁卫军长官布鲁斯一同辅政，开头的几年后世称为善政。59 年尼禄杀母，事后向元老院解释的信是他起草的。62 年布鲁斯去世，他请求退休并交还财产，此后很少露面。65 年皮索谋刺尼禄的计划败露，他被指为同谋，尼禄命他自尽。塔西佗《编年史》卷 15 记他割开血管，血流不畅，又服毒，最后被抬进热气浴室才死去。

  他留下的散文有写给友人卢基利乌斯的一百二十四封《道德书简》，《论愤怒》《论生命之短暂》《论幸福生活》等十来篇论说，以及《论仁慈》《论恩惠》和谈自然现象的《自然问题》。他主张顺应自然和理性而生活，不为财富、流放和死亡所动。另有《美狄亚》《费德拉》《提厄斯忒斯》等九部悲剧，对文艺复兴时期的欧洲戏剧影响很大；讽刺克劳狄死后封神的《变瓜记》一般也归在他名下。

  他一面倡言淡泊，一面家财巨万，当时就有人指责。塔西佗记有人在元老院质问他凭什么四年之间攒下三亿塞斯特斯；卡西乌斯·狄奥说他在不列颠放债又突然催讨，是布狄卡起事的原因之一，这一说只见于狄奥。诗人卢坎是他的侄子，也死于皮索一案。
sources: []
recalled:
  - 塔西佗《编年史》卷 13 第 42 章、卷 14 第 52—56 章、卷 15 第 60—64 章
  - 卡西乌斯·狄奥《罗马史》卷 61—62
  - 塞涅卡《道德书简》
  - 塞涅卡《致母亲赫尔维娅的告慰书》
