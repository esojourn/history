name: 赵佗
aliases: [尉佗, 南越武王, 南越武帝]
role: 南越武王
summary: 真定人，秦南海龙川令，秦亡后据岭南自立为南越武王。
body: |-
  赵佗是真定（今河北石家庄）人，生年史无记载。据《史记·南越列传》，秦平定岭南、设桂林、南海、象郡后，他任南海郡龙川县令。秦二世时，南海尉任嚣病重，把郡事托付给他。任嚣死后，赵佗传檄横浦、阳山、湟谿三关断绝道路，聚兵自守，又陆续除去秦朝所置官吏，换上自己的人。秦亡后，他攻并桂林、象郡，自立为南越武王，立国之年一般推定在公元前 204 年或前 203 年。

  汉高祖十一年（前 196 年），陆贾出使，立赵佗为南越王。吕后时汉朝禁止向南越输出铁器，赵佗于是自称南越武帝（《汉书·高后纪》系于前 183 年），发兵攻长沙国边邑；汉军南下，因暑湿疾疫未能越过南岭，吕后死后罢兵。赵佗趁势以兵威和财物使闽越、西瓯、骆归附，《史记》称其地“东西万余里”。

  文帝元年（前 179 年），汉朝为赵佗修治真定的祖坟，再派陆贾出使。赵佗上书谢罪，去掉帝号，重新称臣，但在国内仍沿用旧号。《汉书》所录上书中，他自称“老夫处粤四十九年，于今抱孙焉”。据《史记》，赵佗卒于建元四年（前 137 年），孙赵胡继位。
sources:
  - 《史记·南越列传》 https://zh.wikisource.org/wiki/史記/卷113
  - 《汉书·西南夷两粤朝鲜传》 https://zh.wikisource.org/wiki/漢書/卷095
  - 《汉书·高后纪》 https://zh.wikisource.org/wiki/漢書/卷003
  - 维基百科“赵佗”条（立国年份诸说） https://zh.wikipedia.org/wiki/赵佗
