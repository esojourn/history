name: 周德威
aliases: [周镇远, 周阳五]
role: 晋国大将
summary: 晋王李克用、李存勖的大将，柏乡之战的主要谋划者，918 年战死于胡柳陂。
body: |-
  周德威是朔州马邑人，字镇远，小字阳五，早年在李克用军中任骑将，以勇敢和熟悉边事著称。天祐五年（公元 908 年），他参与了李存勖解潞州之围的夹寨之战。

  乾化元年（911 年）柏乡之战，后梁军兵力强盛，李存勖想立即决战。周德威认为梁军步兵多、晋军骑兵多，应当退到开阔之地，以骑兵骚扰、拖垮敌人，再寻机出击。李存勖采纳了他的建议，晋军大胜（另见“柏乡之战”条）。此后他率军攻打幽州，乾化三年（913 年）灭了刘守光，留任幽州的卢龙节度使，多年防御契丹。

  贞明四年（918 年）冬，晋军在胡柳陂与梁军遭遇。周德威主张先扎营休整，等梁军疲惫再战，李存勖没有采纳，亲自率军冲击。晋军的辎重部队被打乱，周德威和儿子都在混战中阵亡。此战晋军最终也击退了梁军，但损失惨重。据史书，李存勖事后痛哭，后悔没有听他的话。
sources: []
recalled:
  - 《旧五代史·唐书·周德威传》
  - 《新五代史·唐臣传·周德威》
  - 《资治通鉴》卷二百六十七、二百七十
