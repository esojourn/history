name: 韩琦
aliases: [韩魏公, 韩忠献]
role: 北宋宰相
summary: 北宋宰相，与范仲淹并称“韩范”，历仕仁宗、英宗、神宗三朝。
body: |-
  韩琦是相州安阳人，景德五年（公元 1008 年）生于泉州，他父亲韩国华当时任泉州知州。天圣五年（1027 年）他考中进士，名列第二。宝元年间西夏李元昊反宋，他与范仲淹一同经略陕西，两人主张不同：韩琦主张集中兵力进攻，范仲淹主张以守为主。庆历元年（1041 年）韩琦派任福出击，宋军在好水川中伏大败（另见“宋夏战争”条），他因此被降职。尽管如此，两人在西北的名声都很高，并称“韩范”。

  庆历三年（1043 年）他与范仲淹、富弼一同被召入朝，任枢密副使，参与庆历新政，新政失败后出任地方官。嘉祐三年（1058 年）他拜相。仁宗晚年无子，他与欧阳修等人力劝仁宗确立继承人，英宗由此即位；英宗病中曹太后垂帘，两宫一度不和，他居中调停，英宗病愈后又请太后撤帘归政。英宗去世时，他主持拥立神宗。濮议中他是主张称濮王为“皇考”的一方。

  神宗即位后，他离开朝廷出任地方官。熙宁三年（1070 年）他上书指出青苗法的弊端，成为反对新法的重要人物。熙宁八年（1075 年）他死在相州，追封魏郡王，谥“忠献”。他前后为相十年，辅佐了三位皇帝，后人把他看作北宋前期最有代表性的宰相之一。
sources: []
