name: 地米斯托克利
aliases: [泰米斯托克利, 特米斯托克利]
role: 雅典政治家、将军
summary: 主张建设海军，在萨拉米斯海战中击败波斯；后被放逐，死于波斯治下。
body: |-
  雅典人，父亲尼奥克勒斯出身不显。公元前 493 年至前 492 年他任执政官，开始在比雷埃夫斯修筑港口。前 483 年前后，劳里昂的银矿发现了富矿脉，有人提议把收入分给公民，他说服公民大会用这笔钱建造了两百艘三列桨战船；据希罗多德，他当时提出的理由是对付邻邦埃吉那。他的政敌阿里斯提德在前 482 年被陶片放逐。

  前 480 年薛西斯入侵，德尔斐的神谕说只有“木墙”能保全雅典人，他解释木墙就是战船，主张弃城登船。雅典的妇孺被撤往特洛曾等地。希腊联军舰队名义上由斯巴达人欧里比亚德斯指挥，他在其中起主导作用。舰队先在阿提密西安与波斯海军交战，温泉关失守后撤到萨拉米斯。伯罗奔尼撒各邦想退守科林斯地峡，据希罗多德，他暗中派家仆西琴诺斯去告诉薛西斯，说希腊人正要逃走，引波斯舰队连夜封锁海峡，联军只能就地迎战。波斯战船在狭窄的水道里施展不开，大败。

  战后他到斯巴达受到隆重礼遇。雅典人回城后重筑城墙，斯巴达人反对，他亲自出使斯巴达，一再拖延，直到城墙筑到足以防守的高度才说出实情。此后他的影响下降，约前 471 年被陶片放逐，住在阿尔戈斯。斯巴达人指控他与保萨尼阿斯一起勾结波斯，雅典派人捉拿，他经克基拉、伊庇鲁斯、彼得那辗转逃到小亚细亚。据修昔底德，他到达时在位的已是阿尔塔薛西斯一世，他学了一年波斯语后觐见国王，被任命为迈安德河畔马格尼西亚的长官，约前 459 年病死在那里；修昔底德也提到有人说他是服毒自尽。修昔底德称赞他凭天生的智力，最能在仓促间作出正确的判断。
sources: []
recalled:
  - 希罗多德《历史》卷七第 143—144 章；卷八第 56—125 章
  - 修昔底德《伯罗奔尼撒战争史》卷一第 89—93、135—138 章
  - 普鲁塔克《地米斯托克利传》
