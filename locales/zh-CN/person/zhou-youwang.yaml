name: 周幽王
aliases: [姬宫湦]
role: 周王，西周末代君主
summary: 西周末代君王，宠褒姒、废太子，前 771 年被申侯与犬戎杀于骊山下。
body: |-
  周幽王姓姬名宫湦，是周宣王之子，公元前 781 年即位。据《史记·周本纪》，他即位第二年，泾、渭、洛三川一带发生地震，伯阳甫认为这是周将灭亡的征兆。

  据《史记》，幽王宠爱褒国进献的女子褒姒，褒姒生子伯服后，幽王废黜了申后和太子宜臼，改立褒姒为后、伯服为太子。《史记》又说褒姒不爱笑，幽王想尽办法逗她，点燃烽火、击鼓召集诸侯，诸侯赶到却没有敌寇，褒姒于是大笑；幽王多次这样做，诸侯便不再相信烽火。“烽火戏诸侯”的故事流传很广，但战国以前的文献中没有这一记载，学者多有怀疑；清华大学所藏战国竹简《系年》的记述中也没有烽火之事，而说幽王先出兵攻打申国。

  幽王还任用好利的虢石父为卿，国人怨恨。申后的父亲申侯联合缯国和西方的犬戎进攻幽王，公元前 771 年，幽王被杀于骊山之下，褒姒被掳，西周灭亡。申侯等人拥立原太子宜臼为王，就是周平王。

  《诗经·小雅》中的《十月之交》《正月》等诗，一般认为作于幽王前后，诗中描写了日食、地震和朝政的混乱。幽王与厉王后来常被并称为“幽厉”，成为昏君的代称。

  他在位十一年，死后西周灭亡，周室东迁洛邑。
sources: []
recalled:
  - 《史记·周本纪》
  - 《国语·郑语》
  - 清华简《系年》
