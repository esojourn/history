name: 孟昶
aliases: [孟仁赞, 后蜀后主]
role: 后蜀皇帝
summary: 孟知祥之子，934 年即位，在位三十余年，965 年降宋，到开封后不久去世。
body: |-
  孟昶是孟知祥的儿子，原名孟仁赞，天祐十六年（公元 919 年）生于太原。明德元年（934 年）孟知祥去世，他在成都继位，史称后蜀后主，当时只有十六岁。即位之初，孟知祥留下的一些大将骄横跋扈，他处死了其中最专横的李仁罕，逐渐掌握了政权。

  孟昶在位前期勤于政事，重视农业，后蜀境内多年没有大的战乱，成都一带经济繁荣。他颁布过一篇告诫地方官的《官箴》，宋太宗后来从中摘出“尔俸尔禄，民膏民脂，下民易虐，上天难欺”四句，颁行天下，刻石立在各州县衙署，称为“戒石铭”。后蜀的宰相毋昭裔出资刻印儒家经典，还主持刊刻了石经（另见“雕版印刷九经”条）。这一时期赵崇祚编成了词集《花间集》（另见“《花间集》编成”条），宫廷画院也很兴盛，黄筌等画家都在后蜀宫中任职。据宋人记载，他曾在宫门桃符上题写“新年纳余庆，嘉节号长春”，这被认为是有记载的最早的春联之一。

  后期他耽于享乐，朝政渐坏。显德二年（955 年），后周攻取了后蜀的秦、凤、阶、成四州。北宋乾德二年（964 年）底，宋太祖派兵分两路伐蜀，后蜀军队望风而溃，次年正月孟昶出降，后蜀灭亡。他被送到开封，封为秦国公，据史书，到开封后仅七天便去世了，年四十七。后世流传他的妃子花蕊夫人所作的《述国亡诗》，其中有“十四万人齐解甲，更无一个是男儿”之句，但花蕊夫人的身份和这首诗的作者都有争议。
sources: []
recalled:
  - 《宋史·西蜀孟氏世家》
  - 《新五代史·后蜀世家》
  - 《资治通鉴》卷二百七十九至二百九十二
