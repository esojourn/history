name: 鳌拜
aliases: [瓜尔佳氏]
role: 康熙初年的辅政大臣
summary: 顺治帝遗命的四辅政大臣之一，专横跋扈，1669 年被康熙帝擒拿。
body: |-
  鳌拜姓瓜尔佳氏，满洲镶黄旗人，生年不详，是开国功臣费英东的侄子。他早年随皇太极征战，以勇猛著称，在攻打皮岛、松锦之战等战役中立有战功，被赐号“巴图鲁”（勇士）。清军入关后，他随军镇压大顺军和张献忠部。皇太极死后，他坚定支持立皇太极的儿子，因此在顺治初年受到多尔衮的打压，顺治帝亲政后得到重用。

  顺治十八年（1661 年）顺治帝去世，遗诏命索尼、苏克萨哈、遏必隆、鳌拜四人辅佐八岁的康熙帝。鳌拜排名最后，但他与遏必隆同属镶黄旗，逐渐专擅朝政。康熙五年（1666 年）他坚持把多尔衮时期圈给正白旗的土地换给镶黄旗，户部尚书苏纳海等人反对，被他矫旨处死。康熙六年（1667 年）康熙帝亲政，苏克萨哈请求辞去辅政，鳌拜罗织罪名，不顾康熙帝的反对，将苏克萨哈处死。

  康熙八年（1669 年）五月，十六岁的康熙帝事先挑选了一批少年侍卫练习摔跤，趁鳌拜入宫时将他擒拿（另见“康熙擒鳌拜”条）。朝臣议定他三十条罪状，请求处死，康熙帝念他资历和战功，将他革职拘禁，不久他死于禁所。康熙晚年和雍正年间，鳌拜的部分功劳得到追认。
sources: []
recalled:
