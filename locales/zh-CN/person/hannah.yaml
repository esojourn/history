name: 哈拿
aliases: []
role: 撒母耳的母亲
summary: 以利加拿之妻，在示罗许愿求子，生撒母耳并把他献在耶和华殿中。
body: |-
  哈拿是以法莲山地拉玛琐非人以利加拿的妻子，事迹见于《撒母耳记上》第 1—2 章。圣经没有记载她的家世、生年和卒年。以利加拿有两个妻子，另一个名叫毗尼拿；毗尼拿有儿女，哈拿没有。

  以利加拿每年上示罗敬拜献祭。据第 1 章，毗尼拿因哈拿不生育就激动她，使她生气，哈拿哭泣不吃饭。有一年在示罗，她在耶和华面前祷告并且许愿：耶和华若赐她一个儿子，她必使他终身归与耶和华，不用剃头刀剃他的头。祭司以利见她只动嘴唇，以为她喝醉了，听她说明以后就祝福了她。一家人回到拉玛，哈拿后来怀孕生子，给他起名叫撒母耳。

  孩子断了奶，哈拿把他带到示罗耶和华的殿，交给以利，说明这孩子就是她当年祈求所得的，如今将他归与耶和华。第 2 章开头记有哈拿的祷告（2:1–10）。此后她每年同丈夫上来献年祭，都为撒母耳做一件小外袍带来。以利为以利加拿夫妇祝福，哈拿后来又生了三个儿子、两个女儿（2:19–21）。
sources: []
recalled:
  - 《撒母耳记上》第 1—2 章
