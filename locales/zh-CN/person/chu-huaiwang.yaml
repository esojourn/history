name: 楚怀王
aliases: [熊槐]
role: 楚国国君
summary: 楚国国君，受张仪欺骗大败于秦，后被诱至武关扣留，死于秦国。
body: |-
  楚怀王名槐，是楚威王之子，公元前 328 年即位，生年不详。他即位时楚国疆域广大，是战国最大的国家之一。公元前 318 年，楚、赵、魏、韩、燕五国合纵攻秦，怀王为纵约长，联军在函谷关被秦军击退。

  怀王前期任用屈原，后来听信谗言疏远了他。公元前 313 年，秦相张仪到楚国，许诺楚若与齐绝交，秦愿献商於之地六百里。怀王与齐断交后，张仪却只认“六里”。怀王大怒，于公元前 312 年发兵攻秦，在丹阳大败，大将屈匄被俘，汉中郡被秦夺去；又倾全国之兵再攻，在蓝田再败。

  此后楚国在秦、齐之间摇摆，屡遭各国攻伐。公元前 299 年，秦昭王写信约怀王在武关会盟，屈原、昭雎劝阻，子兰劝他前往。怀王到了武关，被秦军扣留，押到咸阳，秦要求楚国割让巫郡和黔中郡，怀王拒绝。楚人另立太子横为王，就是顷襄王。怀王曾逃到赵国边境，赵国不敢收留，又被秦人追回，公元前 296 年死于秦国。据《史记·楚世家》，秦国送回他的灵柩，“楚人皆怜之，如悲亲戚”。

  楚人对怀王客死于秦深为哀痛。秦末项梁起兵时，找到怀王的孙子熊心，仍立为“楚怀王”以号召楚人，《史记·项羽本纪》说这是“从民所望也”。
sources: []
recalled:
  - 《史记·楚世家》
  - 《史记·屈原贾生列传》
  - 《史记·张仪列传》
