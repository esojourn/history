name: 帝喾
aliases: [高辛氏]
role: 传说中的五帝之一
summary: 《史记》所记五帝之三，号高辛氏，相传是尧的父亲，也是商、周始祖的父亲。
body: |-
  帝喾是传说时代的人物。据《史记·五帝本纪》，他是黄帝的曾孙，父亲蟜极，祖父玄嚣，号高辛，继颛顼而立。司马迁称他“仁而威，惠而信”，这一类话多是后人的颂辞，具体事迹古书所载很少。

  帝喾的重要性在于世系。《史记》说他娶陈锋氏之女生放勋，就是尧；娶娵訾氏之女生挚。帝喾死后挚先继位，“不善”，后由弟弟放勋继立。《史记·殷本纪》又说，商人的始祖契是帝喾次妃简狄吞玄鸟之卵所生；《史记·周本纪》说周人的始祖后稷是帝喾元妃姜原踩了巨人的足迹而生。这样，尧和商、周两代的祖先都被归为帝喾之后。

  这种把各族祖先串联成一个家族的世系，是战国秦汉时期整理古史的结果。商、周始祖感生的故事，在《诗经》的《商颂·玄鸟》和《大雅·生民》里已经出现，但那里并没有提到帝喾。
sources: []
recalled:
