name: 李自成
aliases: [闯王, 大顺皇帝]
role: 明末农民军领袖，大顺政权的建立者
summary: 明末农民军领袖，1644 年建立大顺，攻入北京灭明，旋即败于清军。
body: |-
  李自成是陕西米脂人，早年家贫，曾在银川驿当驿卒。崇祯初年朝廷裁减驿站，他失去差事，又因欠债杀人，投入军中，后来参加了农民起义军，成为闯王高迎祥部下的一员，号称“闯将”。崇祯九年（1636 年）高迎祥被俘牺牲，李自成继称“闯王”。

  此后几年李自成的部队屡遭明军打击，崇祯十一年（1638 年）在潼关南原大败，只剩下十几个人隐入商洛山中。崇祯十三年（1640 年）河南大旱，饥民遍野，他率部进入河南，部众迅速扩大到数十万。李岩、牛金星等读书人投奔他，提出“均田免赋”等口号，民间流传“迎闯王，不纳粮”的歌谣。崇祯十四年（1641 年）他攻破洛阳，杀福王朱常洵；此后三次围攻开封，又在河南多次击败明军主力（另见“明末农民起义”条）。

  崇祯十六年（1643 年）他占据襄阳，称新顺王，随后攻入陕西，占领西安。崇祯十七年（1644 年）正月他在西安建国，国号大顺，年号永昌，随即东征，三月十九日攻破北京，崇祯帝自缢（另见“甲申之变”条）。大顺军进京后，向明朝的官员勋戚“追赃助饷”，拷打索取钱财，军纪也逐渐松弛。镇守山海关的吴三桂起初准备归降，后来改变主意，与清军联合。四月李自成亲率大军东征山海关，在一片石被吴三桂和清军击败（另见“清军入关”条），退回北京后匆忙称帝，随即撤出北京，向西退走。

  清军随后追击，大顺军在陕西潼关失利，李自成放弃西安，经河南进入湖北。顺治二年（1645 年）他在湖北通山县九宫山一带遭到当地地主武装的袭击而死，这是比较通行的说法；另有他在湖南石门夹山寺出家为僧等说法，史学界有过长期争论。他死后，大顺军余部与南明联合继续抗清。
