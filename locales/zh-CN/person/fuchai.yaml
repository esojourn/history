name: 夫差
aliases: [吴王夫差]
role: 吴王
summary: 吴王阖闾之子，打败越国后许其求和，北上与齐晋争霸；最终被越王勾践所灭，自杀而死。
body: |-
  夫差是吴王阖闾之子，公元前 495 年即位，生年不详。据《左传》定公十四年，阖闾伐越受伤而死后，夫差派人站在庭中，每当他出入，就对他说：“夫差！而忘越王之杀而父乎？”他回答：“唯，不敢忘！”

  公元前 494 年，夫差在夫椒大败越军，越王勾践带着五千甲士退守会稽山，派大夫文种通过太宰伯嚭求和。伍子胥力主灭越，夫差不听，与越讲和。此后夫差把目光转向北方：公元前 486 年在邗筑城，开凿沟通长江和淮河的运河（《左传》哀公九年“吴城邗，沟通江、淮”），这是后来大运河的一段；公元前 484 年在艾陵大败齐军。同年，他听信伯嚭的谗言，赐死伍子胥。

  公元前 482 年，夫差率精兵北上，在黄池与晋定公等诸侯会盟，争夺盟主地位。勾践趁吴国空虚，袭入吴都，俘虏了吴太子友。夫差匆匆与越讲和。此后越国屡次进攻，公元前 478 年吴军在笠泽大败。公元前 475 年越军围困吴都，三年后城破。夫差求和不成，自杀而死，死前蒙住脸说：“吾无面以见子胥也。”（《史记·吴太伯世家》）

  后世常以夫差作为骄傲轻敌、拒谏亡国的典型，与勾践的卧薪尝胆对举。

  夫差死后，勾践以礼安葬了他，并诛杀了太宰伯嚭。
sources: []
recalled:
