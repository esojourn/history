name: 宋应星
aliases: [长庚]
role: 科学家
summary: 江西奉新人，著《天工开物》，系统记录了明代农业和手工业的生产技术。
body: |-
  宋应星是江西奉新人，万历四十三年（1615 年）与哥哥宋应升一同考中举人，此后五次参加会试都没有考中。他在往返京城的途中留心各地的农业和手工业生产，积累了大量见闻。崇祯七年（1634 年）他任江西分宜县学教谕，在这期间写成了《天工开物》，后来又任福建汀州推官、南直隶亳州知州。

  《天工开物》在崇祯十年（1637 年）刊行，全书分上、中、下三卷，十八篇，记述了谷物种植、养蚕织布、染色、制盐、制糖、陶瓷、冶铸、舟车、锤锻、烧石灰和煤炭、榨油、造纸、五金开采冶炼、兵器、朱墨、制曲、珠玉等方面的生产技术，配有一百多幅插图，记载了许多生产过程中的具体数据。书名取自《尚书》的“天工人其代之”和《周易》的“开物成务”。

  明朝灭亡后，宋应星隐居家乡，不再出仕，大约在康熙初年去世，卒年不详。《天工开物》在清代流传不广，后来在日本被翻刻，影响较大。二十世纪初丁文江等人重新发现并推崇这部书，此后宋应星的其他著作如《野议》《论气》《谈天》等也陆续被发现。
sources: []
recalled:
  - 宋应星《天工开物》序
  - 丁文江《重印天工开物卷跋》
