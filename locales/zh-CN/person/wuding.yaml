name: 武丁
aliases: [商高宗]
role: 商王
summary: 商王，在位五十九年，任用傅说，对外征伐，殷墟甲骨卜辞大量出自他的时代。
body: |-
  武丁是商王小乙之子，庙号高宗。《尚书·无逸》说他“享国五十有九年”，夏商周断代工程把他的在位年代定为约公元前 1250 年至前 1192 年。他是有大量同时代文字材料可以印证的第一位商王：安阳殷墟出土的甲骨卜辞，有很大一部分属于武丁时期。

  据《史记·殷本纪》，武丁即位后想复兴商朝，但没有找到贤人辅佐，三年不发言，政事由冢宰决定。后来他说梦见一位圣人名叫“说”，令人按梦中的样子到处寻找，在傅险找到一个正在筑墙的刑徒，与他交谈，果然是圣人，就任用为相，称为傅说，“殷国大治”。《史记》还记载祭祀成汤时有野鸡飞到鼎耳上鸣叫，大臣祖己借此劝武丁修德。

  甲骨卜辞记录了武丁时期频繁的征伐，对象有土方、𢀛方、鬼方、羌方、巴方等。《周易》说“高宗伐鬼方，三年克之”。卜辞中还有大量关于祭祀、农业、天象、疾病、生育的占卜，武丁的配偶妇好就常在卜辞中出现，曾领兵出征。

  后世称武丁的时代为“武丁中兴”。《史记》说他死后“殷复衰”，由儿子祖庚继位。

  武丁死后被尊为“高宗”，《诗经·商颂》中的《玄鸟》《殷武》等篇都追述了他的功业。
sources: []
recalled:
  - 《史记·殷本纪》
  - 《尚书·无逸》
  - 《周易·既济》
  - 《夏商周断代工程 1996—2000 年阶段成果报告》
