name: 冯子材
aliases: [南干, 勇毅]
role: 广西提督，镇南关大捷的主将
summary: 中法战争中以近七十岁高龄率军在镇南关大败法军。
body: |-
  冯子材是广东钦州（今属广西）人，早年参加过天地会的起事，后来接受清朝招安，参加了镇压太平军的作战，逐渐升任广西提督、贵州提督。光绪八年（1882 年）他以年老告病回乡。

  光绪十年（1884 年）中法战争爆发，清军在越南北部节节败退，次年初法军攻占谅山，进而攻入镇南关，焚毁关门后退回。两广总督张之洞起用已经六十多岁的冯子材，让他率军赴广西前线。冯子材在镇南关内的关前隘修筑长墙，构筑工事。光绪十一年（1885 年）三月法军再次来攻，冯子材率军坚守，据说他亲自持矛冲入敌阵，各路清军配合作战，大败法军，随后乘胜追击，收复了谅山等地，史称“镇南关大捷”（另见“中法战争”条）。

  镇南关大捷后不久，清朝与法国议和，签订了《中法新约》，冯子材等将领对此十分不满。此后他驻守钦州、廉州一带，光绪二十九年（1903 年）去世，谥“勇毅”。
sources: []
recalled:
  - 《清史稿·冯子材传》
  - 《中法战争》资料丛刊
