name: 金哀宗
aliases: [完颜守绪, 宁甲速]
role: 金朝末代皇帝
summary: 金宣宗之子，在蒙古进攻下竭力支撑；汴京被围后出奔蔡州，城破前自缢，金朝灭亡。
body: |-
  完颜守绪是金宣宗的第三子，生于承安三年（公元 1198 年）。元光二年十二月（公历已是 1224 年初）宣宗去世，他随即即位，改元正大，这时金朝已迁都汴京将近十年，河北、山东大部分被蒙古占领。

  哀宗即位后停止与西夏、南宋的战争，整顿军队，起用完颜陈和尚等将领，一度在大昌原等地击败蒙古军。正大八年（1231 年）起蒙古大举攻金，拖雷借道宋境绕到金军背后，天兴元年（1232 年）在三峰山歼灭金军主力，随即围攻汴京（另见“蒙古灭金”条）。天兴元年年底哀宗出城，先到归德，次年又逃往蔡州，汴京守将崔立献城投降。

  天兴二年（1233 年）秋，蒙古军和孟珙率领的宋军合围蔡州。天兴三年正月（1234 年 2 月），城将破时，哀宗把帝位传给宗室完颜承麟，自己在幽兰轩自缢身死。不久城破，完颜承麟死于乱军之中，金朝灭亡。
sources: []
recalled:
  - 《金史·哀宗本纪》
