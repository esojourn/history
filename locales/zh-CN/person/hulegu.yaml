name: 旭烈兀
aliases: [伊利汗]
role: 伊利汗国的建立者
summary: 拖雷之子，奉蒙哥之命西征，1258 年攻陷巴格达，灭阿拔斯王朝，建立伊利汗国。
body: |-
  旭烈兀是拖雷和唆鲁禾帖尼的儿子，蒙哥、忽必烈的弟弟，生年约在 1217 年前后。1253 年蒙哥派他率军西征，目标是波斯西北山区的木剌夷（伊斯玛仪派的阿萨辛）和巴格达的阿拔斯哈里发。

  1256 年旭烈兀攻破木剌夷的众多山堡，迫使其首领投降。1258 年初他率军包围巴格达，二月城破，哈里发穆斯台绥木投降后被处死，城中居民遭到大规模屠杀，延续五百年的阿拔斯王朝就此灭亡（另见“巴格达陷落”条）。1260 年他又攻入叙利亚，占领阿勒颇、大马士革。这时传来蒙哥去世的消息，旭烈兀率主力东撤，留下的部队当年在巴勒斯坦的艾因·贾鲁特被埃及马木留克王朝的军队击败，蒙古军的西进从此停止。

  此后旭烈兀留在波斯，以马拉盖、大不里士一带为中心，统治从阿姆河到小亚细亚的广大地区，史称伊利汗国。他在汗位之争中支持忽必烈，与支持阿里不哥、信奉伊斯兰教的金帐汗别儿哥发生战争。他命纳西尔丁·图西在马拉盖修建天文台。他的妻子脱古思可敦信奉聂斯脱里派基督教，伊利汗国初期对境内的基督徒较为宽容。1265 年旭烈兀去世，由儿子阿八哈继位，伊利汗国此后延续到十四世纪中叶。
sources: []
