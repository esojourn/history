name: 吕蒙
aliases: [吕子明]
role: 南郡太守
summary: 孙吴将领，由行伍出身而发愤读书，公元 219 年率军偷袭荆州，擒杀关羽。
body: |-
  据《三国志·吴书·吕蒙传》，吕蒙字子明，汝南富陂人，少年时南渡长江，投靠在孙策军中做将领的姐夫，十五六岁就偷偷跟着队伍去打仗。姐夫死后他接领其部众，孙权继位后检阅各营，看到他的队伍操练整齐，给他增加了兵力。此后他参加了征讨黄祖、赤壁和围攻江陵等战事，屡立战功。

  裴松之注引《江表传》记载，孙权劝他多读书，他以军务繁忙推辞，孙权举自己的读书经历相劝，他才开始用功。后来鲁肃路过他的驻地，与他交谈后大为惊讶，说他已不再是当年的“吴下阿蒙”，吕蒙答道“士别三日，即更刮目相待”。两个成语都出于此。

  建安二十年（公元 215 年）孙权与刘备争夺荆州，吕蒙率军夺取长沙、零陵、桂阳三郡。鲁肃死后，他接替驻守陆口。与鲁肃不同，他认为关羽占据上游终究是威胁，主张夺取荆州。建安二十四年关羽北攻樊城，在后方留有重兵防备。吕蒙称病回建业，由名声不显的陆逊接任，关羽于是放松戒备，把留守的部队陆续调往前线。吕蒙随即率军出发，本传说他把精兵藏在船舱里，让摇橹的人穿上白衣扮作商人，昼夜兼程，沿江的哨所都被悄悄拿下，江陵、公安的守将先后投降。

  他进城后严禁士兵侵扰百姓，优待关羽将士的家属。关羽军中得知家中平安，无心再战，纷纷离散，关羽不久被擒杀。孙权任吕蒙为南郡太守，封孱陵侯。封爵的仪式还没有举行，吕蒙旧病发作，孙权把他接到自己的住处医治，多方求医，没有救活，终年四十二。
sources: []
recalled:
  - 《三国志·吴书·周瑜鲁肃吕蒙传》及裴松之注引《江表传》
