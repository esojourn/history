name: 寇谦之
aliases: [寇辅真]
role: 道士
summary: 北魏道士，改革天师道，得崔浩引荐被太武帝尊奉，北魏皇帝由此受箓。
body: |-
  寇谦之字辅真，上谷昌平人，早年喜好仙道，在华山、嵩山修道多年。据《魏书·释老志》，他自称神瑞二年（公元 415 年）太上老君降临嵩山，授他“天师”之位和《云中音诵新科之诫》，命他清整道教，革除东汉张陵以来征收租米钱税和男女合气之术等“三张伪法”，专以礼度为首，辅以服食闭练。泰常八年（423 年），他又自称老君的玄孙李谱文授给他《录图真经》，命他辅佐北方的“太平真君”。

  始光初年（424 年前后），他到平城向太武帝献上道书，得到崔浩的支持，太武帝于是尊奉他，在平城东南建立天师道场。太平真君元年（440 年），太武帝改用“太平真君”的年号；后来又亲自到道坛受箓，此后北魏的皇帝即位都要受箓。后世称他改革后的道派为北天师道或新天师道。

  《魏书·释老志》说，崔浩劝太武帝灭佛时，寇谦之曾与崔浩争辩，劝他不要这样做。太平真君九年（448 年），他在平城去世，年八十余。
sources: []
recalled:
  - 《魏书·释老志》
