name: 郭熙
aliases: [郭淳夫]
role: 北宋宫廷山水画家
summary: 北宋宫廷山水画家，深受宋神宗赏识，代表作《早春图》，画论有《林泉高致》。
body: |-
  郭熙是河阳温县人，生卒年都不确切，一般认为约生于 1000 年，卒于 1090 年前后。他起初并不以画为业，后来学习李成的山水画法，自成一家。宋神宗时他进入翰林图画院，从艺学升为待诏，深受神宗赏识，宫中的许多屏风和墙壁都由他作画。

  他的代表作《早春图》现藏台北故宫博物院，画上有“早春，壬子年郭熙画”的款识，壬子年即熙宁五年（1072 年）。画中山石的轮廓弯曲如云，被称为“卷云皴”，树枝如蟹爪。他的画论由儿子郭思整理成《林泉高致》，书中提出山水画有高远、深远、平远“三远”的观察方法，又说山水要画得“可行、可望、可游、可居”，对后世的山水画理论影响很大。据宋人记载，神宗去世后，宫中把他的画撤换下来，甚至被用来擦拭桌子。
sources: []
recalled:
  - 郭思编《林泉高致》
  - 郭若虚《图画见闻志》卷四
  - 邓椿《画继》卷十
