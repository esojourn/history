name: 阿尔达希尔一世
aliases: [阿尔达希尔, 阿达希尔一世, 阿尔塔薛西斯]
role: 萨珊波斯开国君主
summary: 萨珊王朝的建立者，公元 224 年推翻帕提亚，自称“众王之王”。
body: |-
  阿尔达希尔出自波斯故地波西斯的一个地方王族，生年不详。王朝因祖先萨珊得名；萨珊是他的祖父还是更远的先人，各种记载说法不一，九世纪的塔巴里说萨珊是伊什塔克尔一座女神庙的主持。父亲帕帕克夺得当地的王位，阿尔达希尔在三世纪初继承，随后逐一吞并波西斯和邻近各地的小王，修建了一座圆形的新城，遗址在今伊朗的菲鲁扎巴德。

  他的扩张招来宗主帕提亚的讨伐。224 年 4 月，他在霍尔木兹甘平原击败并杀死帕提亚王阿尔达班四世，立国四百七十多年的帕提亚从此结束。传统上说他 226 年在泰西封加冕，称“众王之王”。此后他继续向东、向北用兵，各地的帕提亚贵族大多归附，保住了原有的地位。帕提亚就是中国史书里的安息；他建立的萨珊王朝延续到 651 年，为阿拉伯人所灭。

  新王朝比帕提亚集权，也更有进取心。罗马一方的卡西乌斯·狄奥和赫罗狄安都说，他宣称要收回古代波斯帝国直到爱琴海的全部疆土。230 年他攻入罗马的美索不达米亚，与亚历山大·塞维鲁打了一场不分胜负的战争；罗马陷入内乱之后，他在 237 年前后夺取尼西比斯和卡莱，240 年前后攻下久攻不克的哈特拉。

  他晚年立儿子沙普尔同为国王，约在 242 年去世。纳克什·鲁斯塔姆的崖壁上刻着他骑在马上从神阿胡拉·马兹达手里接过王权之环，马蹄下踩着阿尔达班。后来的波斯传统说他扶持琐罗亚斯德教、整理经典，这些说法见于几百年后的文献，其中多少属实并不清楚。
