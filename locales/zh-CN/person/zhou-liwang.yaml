name: 周厉王
aliases: [姬胡]
role: 周王
summary: 西周君王，专利弭谤，前 841 年国人暴动后出奔彘地，引出“共和”。
body: |-
  周厉王姓姬名胡，是周夷王之子，生年不详。夏商周断代工程把他即位的年份定为约公元前 877 年；他出奔的公元前 841 年和死去的前 828 年，属于有确切纪年的时代。

  据《国语·周语上》和《史记·周本纪》，厉王好利，宠信荣夷公，把山林川泽的出产收归王室专有，大夫芮良夫劝谏无效。国人议论纷纷，厉王找来卫国的巫者监视，听到告发就杀人，于是国人不敢说话，“道路以目”。厉王很得意，对召公（召穆公虎）说自己能制止诽谤。召公说：“防民之口，甚于防川。”厉王不听。

  三年后，国人起来反抗，袭击厉王，厉王出奔到彘（今山西霍州）。太子静藏在召公家里，国人包围召公家，召公以自己的儿子顶替，太子才得以活下来。此后由大臣执政，号为“共和”，从这一年（公元前 841 年）开始，中国历史有了连续的确切纪年。

  厉王在彘地住了十四年，于共和十四年（公元前 828 年）死去，太子静继位，就是周宣王。

  厉王的事迹也见于青铜器。厉王名胡，传世的宗周钟和 1978 年陕西扶风出土的㝬簋，铭文中的作器者“㝬”一般认为就是厉王本人，㝬簋是目前所知最大的西周铜簋。

  这件事史称“厉王奔彘”。
sources: []
recalled:
  - 《国语·周语上》
  - 《史记·周本纪》
  - 《史记·十二诸侯年表》
