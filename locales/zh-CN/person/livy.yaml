name: 李维
aliases: [提图斯·李维乌斯, 提图斯·李维]
role: 历史学家
summary: 罗马历史学家，著《建城以来史》一百四十二卷，今存三十五卷。
body: |-
  李维生在意大利北部的帕塔维乌姆。生卒年出自哲罗姆的《编年史》，作公元前 59 年生、公元 17 年卒；有学者认为生年应提前到前 64 年。关于他的生平，知道的很少：没有他从军或担任公职的记载，他大半生在罗马写作，晚年回到家乡。

  他的《建城以来史》从埃涅阿斯到意大利的传说写起，逐年记到公元前 9 年大德鲁苏斯去世，共一百四十二卷，大约从前 27 年前后动笔，写了四十多年。流传到今天的只有三十五卷：第 1 至 10 卷记到前 293 年，第 21 至 45 卷记前 218 年至前 167 年，包括第二次布匿战争和东方诸战。其余各卷只有后人编的内容提要和零星残篇。

  李维不是从档案里查考的人，主要依据前人的史书，后半部分大量采用波利比乌斯。他在序言里说，写史是为了让读者看到祖先凭什么品行建立了国家，又怎样渐渐败坏；对早期的传说，他说自己既不肯定也不否定。罗慕路斯、卢克蕾提娅、霍拉提乌斯守桥、辛辛纳图斯这些故事，后世所知的样子大多出自他的笔下。

  他与奥古斯都有交往。据塔西佗《编年史》卷 4，他在书中盛赞庞培，奥古斯都戏称他为“庞培派”，交情并不因此受损。苏维托尼乌斯说，后来的皇帝克劳狄年轻时受他鼓励开始写史。昆体良记波利奥讥笑他的文字带“帕塔维乌姆腔”，具体所指已不清楚。
sources: []
recalled:
  - 李维《建城以来史》序言
  - 塔西佗《编年史》卷 4 第 34 章
  - 苏维托尼乌斯《罗马十二帝王传·克劳狄传》第 41 章
  - 昆体良《雄辩术原理》卷 1 第 5 章
  - 哲罗姆《编年史》
