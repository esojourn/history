name: 李斯
aliases: []
role: 丞相
summary: 楚上蔡人，秦丞相，辅佐始皇定郡县、同文字；后被赵高构陷处死。
body: |-
  李斯是楚国上蔡人，生年史无记载。据《史记·李斯列传》，他年轻时做过郡中小吏，后来跟随荀卿学“帝王之术”，学成后西入秦国，先为吕不韦舍人，得以游说秦王，被拜为客卿。秦王一度下令驱逐各国来客，李斯也在被逐之列，他上书劝谏（即后世所称《谏逐客书》），秦王于是撤销逐客令，恢复他的官职。

  此后他官至廷尉。秦并天下后，丞相王绾等请分封诸子为王，李斯反对，主张行郡县，始皇从之。他后来升任丞相。始皇三十四年（公元前 213 年），博士淳于越主张师古分封，李斯上书请烧《诗》《书》、百家语，禁止以古非今，焚书之令由此而下。《李斯列传》把“同文书”列为他辅政时的事；小篆出自李斯之手，是东汉许慎《说文解字·叙》的说法。

  前 210 年始皇死于沙丘，李斯随行。赵高劝他改立胡亥，他起初不从，最终同意，一同伪造诏书，赐死扶苏。二世即位后赵高得势，诬告李斯与其子三川守李由谋反。据《李斯列传》，二世二年（前 208 年）七月李斯被具五刑，腰斩于咸阳市，夷三族；《秦始皇本纪》则把他的死记在二世三年冬。
sources:
  - 《史记·李斯列传》 https://zh.wikisource.org/wiki/史記/卷087
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
  - 许慎《说文解字·叙》
