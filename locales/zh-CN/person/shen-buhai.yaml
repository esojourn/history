name: 申不害
aliases: [申子]
role: 韩国相，法家代表人物
summary: 韩昭侯的相，主张以“术”驭臣，相韩十五年，国治兵强。
body: |-
  申不害约生于公元前 385 年，原是郑国京邑人，地位低贱。韩国灭郑后，他以刑名法术之学求见韩昭侯，被任为相。据《史记·老子韩非列传》，他“内修政教，外应诸侯，十五年，终申子之身，国治兵强，无侵韩者”。他死于公元前 337 年。

  申不害的学说以“术”为中心，即君主任用、考核、驾驭臣下的方法：按照官职考察实际的作为（“循名责实”），君主深藏不露、不让臣下窥测自己的好恶。韩非后来把商鞅的“法”、申不害的“术”和慎到的“势”结合起来，构成法家的完整体系，同时也批评申不害只重术而不统一法令，导致韩国新旧法令并存、奸臣得以钻空子。

  《史记》说申不害著书二篇，号《申子》，已经失传，今天只能见到其他书中引用的片段。
sources: []
recalled:
  - 《史记·老子韩非列传》
  - 《韩非子·定法》
