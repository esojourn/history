name: 吴承恩
aliases: [射阳山人]
role: 文学家
summary: 淮安人，诗文作家，一般认为是《西游记》的作者，但这一说法有争议。
body: |-
  吴承恩号射阳山人，南直隶淮安府山阳县（今江苏淮安）人，生卒年不详，一般推定在 1500 年至 1582 年前后。他出身商人家庭，自幼爱读野史杂记，长期困于科场，到中年才补为岁贡生，曾任长兴县丞，不久辞官，晚年回乡以卖文为生。他的诗文后来被编为《射阳先生存稿》。

  《西游记》是明代的长篇小说，以唐僧玄奘赴印度取经的史实为本，吸收了宋元以来的取经故事、平话和杂剧，写孙悟空、猪八戒、沙僧保护唐僧西行，经历九九八十一难到达西天取回真经。现存最早的刊本是万历二十年（1592 年）南京世德堂的刻本，书上没有署作者的姓名。

  把《西游记》归于吴承恩，主要根据是天启年间的《淮安府志》中“吴承恩”名下列有“《西游记》”一书。二十世纪二十年代，胡适、鲁迅等人据此考证，吴承恩是《西游记》作者的说法从此通行。但也有学者指出，地方志中所列的《西游记》未必就是这部小说，可能是一部游记，而清代《千顷堂书目》把它列入地理类，因此作者问题至今仍有争议。
sources: []
recalled:
  - 天启《淮安府志》
  - 鲁迅《中国小说史略》
  - 胡适《西游记考证》
