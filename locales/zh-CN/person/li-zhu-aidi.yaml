name: 唐哀帝
aliases: [李柷, 昭宣帝, 济阴王]
role: 皇帝
summary: 唐朝末代皇帝，唐昭宗之子，被朱温拥立，907 年禅位于朱温，次年被毒死。
body: |-
  李柷是唐昭宗的第九子，景福元年（公元 892 年）生，封辉王。天祐元年（904 年）八月朱温派人在洛阳杀害昭宗后，以皇后的名义立他为帝，年仅十三岁，朝政完全由朱温控制。

  天祐二年（905 年）二月，朱温派人在洛阳宴请昭宗的九个儿子，把他们全部杀死。同年六月，朱温又在亲信李振、宰相柳璨的怂恿下，把被贬的宰相裴枢等三十多位朝官集中到滑州白马驿杀害，尸体投入黄河，史称“白马驿之祸”（另见该条）。到天祐四年（907 年）四月，他被迫把帝位“禅让”给朱温，朱温建立后梁，唐朝灭亡（另见“朱温篡唐”条）。

  退位后他被封为济阴王，迁到曹州居住，由朱温的部下看守。开平二年（908 年）二月，他被朱温派人毒死，年十七。后梁给他的谥号是哀帝；后唐建立后，明宗追谥他为昭宣光烈孝皇帝，所以也称昭宣帝。
sources: []
recalled:
