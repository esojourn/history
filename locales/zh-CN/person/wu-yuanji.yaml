name: 吴元济
aliases: []
role: 淮西割据者
summary: 淮西节度使吴少阳之子，割据抗命三年，817 年被李愬擒获，斩于长安。
body: |-
  吴元济是淮西节度使吴少阳的长子。淮西自李希烈以来就不听朝廷号令，节度使之位在将领之间传袭。元和九年（公元 814 年）吴少阳病死，吴元济隐瞒死讯，自领军务，请求朝廷任命，被唐宪宗拒绝，他便纵兵四出，侵掠附近州县。

  次年朝廷发兵讨伐，成德的王承宗、淄青的李师道暗中援助他，李师道还派刺客到长安刺杀宰相武元衡。淮西兵力不多，但地势险要，唐军十几万人围攻三年，进展缓慢。元和十二年（817 年）宰相裴度亲赴前线督战，同年十月李愬雪夜袭破蔡州，吴元济被擒（另见“平淮西”条）。十一月他被押到长安，在献俘仪式后被斩，年三十五。淮西平定后，其他藩镇大为震动，相继归顺朝廷。
sources: []
recalled:
  - 《旧唐书·吴元济传》
  - 《新唐书·藩镇宣武彰义泽潞传》
  - 《资治通鉴》卷二百三十九至二百四十
