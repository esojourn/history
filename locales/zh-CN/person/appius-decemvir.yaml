name: 阿庇乌斯·克劳狄乌斯（十人委员）
aliases: [阿庇乌斯·克劳狄乌斯·克拉苏斯, 十人委员阿庇乌斯]
role: 罗马执政官、十人委员会首脑
summary: 罗马贵族，主持十人委员会编订十二表法，相传因维吉尼娅一案垮台。
body: |-
  阿庇乌斯·克劳狄乌斯·克拉苏斯，罗马贵族，克劳狄乌斯家族早期的代表人物，公元前 451 年任执政官。他的家族据说是在共和国初年从萨宾地区迁来的。

  平民多年要求把法律写成明文。据李维，罗马曾派使团去希腊考察梭伦的法律；前 451 年停选执政官和保民官，改设十人委员会全权执政并编订法律，阿庇乌斯是其中的主导人物。第一年委员会拟出十表法律，交百人队大会通过。次年选出第二届十人委员会，他设法连任，并使几名平民入选；这一届增补了两表，其中有禁止贵族与平民通婚的条款，合称“十二表法”。

  李维说第二届委员会任满不肯下台，施政专横。传说阿庇乌斯看上了平民百夫长维吉尼乌斯的女儿维吉尼娅，指使门客谎称她是自己家的女奴，由他本人审判，判归门客；维吉尼乌斯在广场上夺过屠夫的刀杀死女儿，以保全她的自由。军队和平民因此第二次撤离，十人委员会被迫辞职。阿庇乌斯被保民官控告，前 449 年死在狱中，李维说是自杀。

  维吉尼娅的故事与卢克蕾提亚的故事结构相似，学者多认为经过文学加工；十人委员会编订十二表法一事则一般认为可信。
sources: []
recalled:
  - 李维《建城以来史》卷三第 32—58 章
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷十、卷十一
  - 西塞罗《论共和国》卷二
