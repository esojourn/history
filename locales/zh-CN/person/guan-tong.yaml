name: 关仝
aliases: [关穜, 关同]
role: 山水画家
summary: 五代后梁的山水画家，师法荆浩而有所发展，与荆浩并称“荆关”。
body: |-
  关仝又写作关穜、关同，长安人，活动于后梁时期，生卒年都不详。据宋人记载，他早年师从荆浩，学习非常刻苦，到晚年画艺超过了老师，当时有“青出于蓝”的说法。

  关仝擅长画关陕一带的山水，喜欢描绘秋山寒林、村居野渡、幽人逸士，笔法简练而气势雄伟。据郭若虚《图画见闻志》，他的画“石体坚凝，杂木丰茂”，能使观者如身临其境。宋人把他与李成、范宽并称为山水画的三家，认为他们“三家鼎峙，百代标程”，影响了此后的北方山水画。他画人物不太擅长，据说画中的人物有时请别人代笔。

  传为关仝的作品有《关山行旅图》《秋山晚翠图》（均藏台北故宫博物院）等，真伪尚有争议。
sources: []
recalled:
  - 郭若虚《图画见闻志》卷一、卷二
  - 《宣和画谱》卷十
  - 刘道醇《五代名画补遗》
