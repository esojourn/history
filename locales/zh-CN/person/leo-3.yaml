name: 利奥三世
aliases:
  - 良三世
role: 罗马主教（教皇）
summary: 795—816 年在位的教皇，800 年圣诞节在罗马为查理曼加冕。
body: |-
  利奥是罗马人，出身不高，生年不详，公元 795 年 12 月当选教皇。他一上任就把圣彼得墓的钥匙和罗马城的旗帜送给查理，表示承认他是罗马的保护者。

  799 年 4 月，前任教皇哈德良一世的亲属在一次游行中袭击他，想弄瞎他的眼睛、割掉他的舌头，没有得逞。他逃出罗马，到帕德博恩去见查理，随后由法兰克人护送回城。800 年底查理来到罗马，利奥在 12 月 23 日当众起誓，表明对手指控他的罪名都不属实。

  两天后的圣诞节，他在圣彼得教堂把皇冠戴在查理头上。《历史的轨迹》第九章说教皇是“突然”这样做的，并说教皇借此恢复了西方的帝国，也开始了日后教皇与皇帝之间的摩擦；书中没有提这位教皇的名字。

  法兰克教会要求在信经里加上圣灵“和子”而出的字样，利奥同意这个教义，却不肯改动信经的文字。他于 816 年 6 月去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第九章“教会组成联盟” https://wellsofgrace.com/books/spiritual/2000years/html/chapter11.html"
recalled:
  - 《教皇列传》利奥三世传
  - 《法兰克王国年代记》799—801 年
  - 艾因哈德《查理大帝传》第 28 章
