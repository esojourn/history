name: 慕容皝
aliases: [慕容元真, 前燕文明帝]
role: 前燕开国君主
summary: 鲜卑慕容部首领，自称燕王，击退石虎，东破高句丽、宇文部，奠定前燕的基业。
body: |-
  慕容皝字元真，是鲜卑慕容部首领慕容廆的儿子。慕容部在西晋时迁到辽西的棘城一带，慕容廆接受晋朝的官爵，招纳中原避乱的士人和流民，势力渐强。咸和八年（公元 333 年）慕容廆去世，他继位，仍称东晋所封的辽东公。他的弟弟慕容仁占据辽东反叛，咸康二年（336 年）他率军踏着海冰突袭，把慕容仁消灭。

  咸康三年（337 年）他自称燕王，史称前燕。第二年他与后赵的石虎相约夹击辽西的鲜卑段部，石虎灭段部后责怪他不来会师，转而大举进攻棘城，周围许多城邑投降了后赵。他坚守不退，石虎撤军时，他派儿子慕容恪追击取胜。此后他一面遣使到建康，取得东晋对燕王称号的承认，一面向东扩张。咸康八年（342 年）他把都城迁到新筑的龙城，同年攻入高句丽的都城丸都；建元二年（344 年）又灭了宇文部。

  《晋书·载记》说他通晓经学，在国内设立学校，亲自讲授，又把园囿分给没有土地的流民耕种。永和四年（348 年）他去世，时年五十二。他的儿子慕容儁在后赵崩溃后南下，占领河北并称帝。
sources: []
recalled:
  - 《晋书·慕容皝载记》
  - 《资治通鉴》卷九十五至九十八
