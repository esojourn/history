name: 大希律
aliases: [希律王, 希律一世, 希律大帝]
role: 犹太王
summary: 以土买人安提帕特之子，罗马扶立的犹太王，大规模重修耶路撒冷圣殿。
body: |-
  以土买人安提帕特的次子，母亲居普洛斯是拿巴提人；生年约在公元前 73 年。以土买人在约翰·许尔堪时归入犹太教。安提帕特辅佐许尔堪二世，得尤利乌斯·凯撒信任，前 47 年派希律管理加利利。希律在那里处死了匪首希西家一伙，被传到耶路撒冷的公会受审，后来脱身。

  前 40 年帕提亚人入侵，立哈斯蒙尼家的安提柯为王，希律的哥哥法撒勒被俘后自尽。希律把家人安顿在马萨大，自己辗转到罗马；在安东尼和屋大维支持下，元老院宣布他为犹太人的王。他回国作战三年，前 37 年在罗马将领索西乌斯协助下攻下耶路撒冷，安提柯被押到安提阿处死。围城前后他娶了许尔堪二世的外孙女米利暗。

  前 31 年亚克兴之战后，他到罗得岛见屋大维，保住了王位，领土又有扩增。他在位期间大兴土木：建造港口城市凯撒利亚，把撒玛利亚重建为塞巴斯特，修筑希律堡、马萨大等要塞和耶利哥的宫殿，约从前 20 年起重修耶路撒冷圣殿。这些事主要见于约瑟夫斯《犹太古史》卷 14—17 和《犹太战记》卷 1。

  他对家人猜忌极重。据约瑟夫斯，他先后除掉妻弟、年轻的大祭司阿里斯托布鲁斯三世，年迈的许尔堪二世，妻子米利暗和岳母亚历山德拉；后来处死米利暗所生的两个儿子亚历山大和阿里斯托布鲁斯，临死前几天又处死长子安提帕特。

  《马太福音》第 2 章记，耶稣生在希律王的时候，有几个博士从东方来，问那生下来作犹太人之王的在哪里；希律后来下令杀尽伯利恒城里并四境所有两岁以内的男孩，约瑟带着孩子和马利亚逃往埃及，到希律死后才回来。此事不见于约瑟夫斯。希律晚年患重病，在耶利哥去世，葬于希律堡。约瑟夫斯说他死在一次月食之后、逾越节之前，通常据此定在公元前 4 年，也有学者主张前 1 年。他的国分给三个儿子亚基老、希律安提帕和腓力。
sources: []
recalled:
  - 约瑟夫斯《犹太古史》卷 14—17
  - 约瑟夫斯《犹太战记》卷 1
  - 《马太福音》第 2 章
  - 《路加福音》1:5
