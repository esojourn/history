name: 汉献帝
aliases: [刘协, 山阳公]
role: 皇帝
summary: 东汉最后一位皇帝，先后受制于董卓、李傕和曹操，公元 220 年让位于曹丕。
body: |-
  据《后汉书·献帝纪》，献帝名协，是灵帝的次子。生母王美人被何皇后毒死，他由祖母董太后抚养。中平六年（公元 189 年）灵帝死，兄长刘辩即位，刘协封陈留王。同年九月董卓废刘辩，立九岁的刘协为帝。

  初平元年（190 年）他被董卓带往长安。董卓死后，李傕、郭汜等凉州将领控制朝廷，互相攻杀。兴平二年（195 年）献帝在杨奉、董承等人护卫下东归，一路屡遭追击，次年七月才回到雒阳。《后汉书》说当时雒阳宫室烧尽，百官在荆棘之间搭靠墙壁栖身，有官员饿死。八月，曹操到雒阳朝见，随后把献帝迁到许县。

  此后二十多年献帝一直住在许都，朝政由曹操主持。建安五年（200 年），车骑将军董承等人密谋除掉曹操，自称受有献帝的密诏，事情泄露，参与者都被杀。建安十九年，伏皇后因早年给父亲写信请他设法除掉曹操一事被发觉而遭废杀；次年曹操的女儿被立为皇后。

  建安二十五年（220 年）正月曹操去世，十月献帝让位给曹丕，汉朝终结。他被封为山阳公，食邑一万户，在封国内仍可使用汉朝的历法和天子礼乐。魏明帝青龙二年（234 年）三月他在山阳去世，本纪记其终年五十四，魏以汉天子的礼仪安葬，谥为孝献皇帝。
sources: []
recalled:
  - 《后汉书·孝献帝纪》
  - 《三国志·魏书·武帝纪》
  - 《三国志·魏书·文帝纪》
