name: 盖乌斯·格拉古
aliases: [盖乌斯·塞姆普罗尼乌斯·格拉古, 小格拉古, 盖约·格拉古]
role: 罗马保民官
summary: 提比略之弟，两任保民官，推行粮食、殖民、法庭等一整套改革，兵败自尽。
body: |-
  盖乌斯·塞姆普罗尼乌斯·格拉古，提比略·格拉古的弟弟，比哥哥小九岁，约生于公元前 154 年。前 133 年他二十岁出头，在小西庇阿军中围攻努曼提亚，同时被选入哥哥设立的土地委员会。前 126 年他任财务官，随执政官去撒丁岛。古人公认他是当时最好的演说家。

  前 123 年和前 122 年他连任保民官，推出一整套法案，先后次序已难确知。主要内容有：由国家按固定的低价每月向罗马公民供应粮食；继续分配土地，并在意大利和海外建立殖民地，其中一处在迦太基旧址；士兵的衣装由国家供给，不满十七岁不得征召；修筑道路；亚细亚行省的税收在罗马公开招标承包；审理总督勒索案的法庭，陪审员改由骑士等级担任，不再由元老充当；未经人民许可不得判处公民死刑。这些办法把骑士、城市平民和农民都拉到他一边，削减了元老院的权力。

  前 122 年他与同僚孚尔维乌斯·弗拉库斯提出，给拉丁人以完全的公民权，给意大利同盟者以拉丁权。这项提议在罗马平民中不受欢迎。元老院支持另一位保民官李维乌斯·德鲁苏斯提出更慷慨的许诺，同他争夺民心；他又有七十天在阿非利加筹建殖民地，不在罗马。他竞选第三任保民官失败。

  前 121 年有人提议废除迦太基殖民地。集会时执政官奥皮米乌斯的一名随从被格拉古的支持者杀死，元老院通过决议，要执政官设法使国家不受损害，这是后世所称“元老院最终决议”的第一次使用。奥皮米乌斯带着武装的元老、骑士和克里特弓箭手进攻据守阿文提诺山的格拉古一派。弗拉库斯被杀，盖乌斯逃过台伯河，在一处圣林里让奴隶把自己杀死。据普鲁塔克，事后未经审判被处死的有三千人。他的许多法律，特别是粮食供应和骑士陪审，在他死后保留了下来。
