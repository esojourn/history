name: 卡米卢斯
aliases: [马尔库斯·孚里乌斯·卡米卢斯, 卡米路斯]
role: 罗马独裁官
summary: 罗马共和国早期将领，攻下维爱，相传在高卢人破城后挽救罗马。
body: |-
  马尔库斯·孚里乌斯·卡米卢斯，罗马贵族，约生于公元前 446 年。他多次出任握有执政官权力的军事保民官，据传统说法五次任独裁官、四次举行凯旋式，被后人称为罗马的“第二位建城者”。他的事迹主要见于李维和普鲁塔克，其中不少情节经过后人渲染。

  罗马与北面十几公里外的伊特鲁里亚城市维爱长期交战，传说最后一次围城持续了十年。前 396 年他任独裁官，据李维，他命人挖地道通入城内的卫城，里应外合攻下维爱，罗马的领土因此大为扩张。几年后他围攻法莱里伊，当地一名教师把贵族学生带出城来献给他，他让学生把教师押回城去，法莱里伊人因此归降。后来他被控分配维爱战利品不公，自行流亡到阿尔代亚。

  前 390 年（一说前 387 年）高卢人在阿利亚河击溃罗马军队并占领罗马城，只有卡皮托利山未陷。据李维，罗马人召回卡米卢斯并任命他为独裁官，就在守军称量黄金赎城的时候，他带兵赶到，宣布交易无效，把高卢人逐出并歼灭。希腊史家波利比乌斯只说高卢人收了赎金、因本土受到攻击而自行撤走。现代学者多认为李维笔下的反败为胜是后人为挽回颜面所加。

  城破之后，有人主张举城迁往维爱，据李维，卡米卢斯发表长篇演说加以反对，罗马得以在原地重建。此后二十多年他继续带兵对付沃尔斯基人、埃奎人和伊特鲁里亚人。前 367 年高卢人再度南下，他以高龄出任独裁官将其击退；同年平民与贵族围绕李锡尼—塞克斯提乌斯法案的争执达到顶点，据说他出面调停，许愿建造和谐女神庙。前 365 年他死于瘟疫。
sources: []
recalled:
  - 李维《建城以来史》卷五、卷六
  - 普鲁塔克《卡米卢斯传》
  - 波利比乌斯《历史》卷二第 18 章
