name: 陈汤
aliases: [陈子公, 破胡壮侯]
role: 西域副校尉
summary: 汉元帝时的西域副校尉，与甘延寿假托诏令发兵远征康居，攻杀匈奴郅支单于。
body: |-
  据《汉书·傅常郑甘陈段传》，陈汤字子公，山阳瑕丘人，年轻时好读书，善写文章，家贫而不拘小节。他到长安求官，曾因父亲去世不回家奔丧而下狱。后来他多次请求出使外国，建昭三年（公元前 36 年）以西域副校尉的身份随都护甘延寿赴任。

  当时匈奴郅支单于杀了汉使，西迁到康居，在都赖水边筑城，侵扰乌孙、大宛。陈汤认为应当趁其立足未稳发兵攻取。甘延寿想先奏请朝廷，陈汤认为朝中议论必定不许；适逢甘延寿生病，他便假托诏令，调集西域各国的兵和屯田的吏士共四万余人，甘延寿只得同行。汉军分两路越过葱岭，抵达郅支城下，围攻至次日破城，郅支单于被杀。两人上疏报捷，其中有“明犯强汉者，虽远必诛”一句。

  回朝后，石显和丞相匡衡认为他们擅自假托诏令，不应封赏；宗室刘向上书为他们申辩，元帝最终封甘延寿为义成侯，陈汤为关内侯。成帝时陈汤被人告发私吞在康居缴获的财物，免官；后来又因上书言事不实、参与修建昌陵时的受贿等事屡次获罪，被流放到敦煌，后改徙安定。晚年有人为他上书鸣冤，他得以回到长安，死在那里，卒年不详。
sources: []
recalled:
  - 《汉书·傅常郑甘陈段传》
  - 《汉书·匈奴传下》
