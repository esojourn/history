name: 曹操
aliases: [曹孟德, 魏武帝, 魏王, 阿瞒]
role: 丞相、魏王
summary: 汉末政治家、军事家、诗人，统一北方，奠定曹魏的基础，死后被追尊为魏武帝。
body: |-
  据《三国志·魏书·武帝纪》，曹操字孟德，沛国谯县人。父亲曹嵩是宦官曹腾的养子。他二十岁举孝廉，任雒阳北部尉，后来做过顿丘令、议郎。中平元年（公元 184 年）以骑都尉参加镇压颍川黄巾，升任济南相。董卓入京后，他逃出雒阳，到陈留一带招兵，参加了关东讨董的联军。

  初平三年（192 年），青州黄巾大举进入兖州，曹操被迎为兖州牧，收降黄巾军中的精壮，编为“青州兵”。此后他两次进攻徐州的陶谦，史载所过之处杀戮很多；后方的兖州一度被吕布夺去大半，经一年多的苦战才收复。建安元年（196 年）他把从长安东归的献帝迎到许县，从此以朝廷的名义发号施令；同年开始在许下招募流民屯田，军粮有了保障。

  此后他先后消灭吕布、袁术，建安五年（200 年）在官渡击败袁绍，用七年时间平定河北，建安十二年又北征乌桓，北方基本统一。建安十三年他任丞相，率军南下，荆州不战而降，但随后在赤壁被孙权、刘备的联军击败，退回北方。建安十六年他在潼关击败马超、韩遂，取得关中；建安二十年收降汉中的张鲁，四年后汉中被刘备夺去。

  建安十八年曹操受封魏公，建安二十一年进爵魏王，以邺为都，但始终没有称帝。他几次下令求贤，提出“唯才是举”，不拘品行出身。他也是当时最重要的诗人之一，有《蒿里行》《短歌行》《观沧海》等诗传世，并为《孙子兵法》作注。

  建安二十五年（220 年）正月，曹操在雒阳去世，本纪记其终年六十六，遗令丧葬从简。同年其子曹丕代汉称帝，追尊他为武皇帝。2009 年，河南安阳西高穴村的一座东汉大墓经考古部门认定为曹操的高陵。
sources: []
recalled:
  - 《三国志·魏书·武帝纪》及裴松之注
  - 《后汉书·孝献帝纪》
