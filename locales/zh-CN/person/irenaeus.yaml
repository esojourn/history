name: 爱任纽
aliases:
  - 里昂的爱任纽
  - 伊里奈乌
role: 里昂主教，《驳异端》作者
summary: 里昂主教，少年时听过坡旅甲讲道，著《驳异端》驳斥诺斯底派。
body: |-
  爱任纽在小亚细亚长大，少年时在士每拿见过坡旅甲，听过他讲道。他后来回忆，坡旅甲常讲起自己和约翰以及其他见过主的人的交往。他的生年没有记载，《历史的轨迹》说约在公元 115 至 142 年之间，学者多估在 130 年前后。

  他后来到高卢的里昂，在当地教会作长老。公元 177 年，里昂和维也纳的教会遭受大逼迫，当时他受托带信到罗马，因而没有遇难。主教波提努在这次逼迫中死在狱中，爱任纽回到里昂后接任主教。

  他的主要著作是五卷《驳异端》，约写于公元 180 年前后，详细介绍并驳斥了当时诺斯底派各家的学说。他主张，要辨别真道，就看各地由使徒设立、主教相承不断的教会所教导的；他特别举出罗马教会，列出其主教的承继名单，并说各地教会都应当与罗马教会一致。他也是最早明确把四部福音并列为权威的作者之一。《历史的轨迹》说他在这部书里立下了"基督论"教义的典范。

  复活节日期之争中，罗马主教维克多要与守尼散月十四日的亚西亚教会断绝相交，爱任纽写信劝他不要因此分裂教会。

  他去世的年份和情形没有当时的记载。《历史的轨迹》说他约在公元 200 年殉道，这是一个较晚的传统，最早见于六世纪图尔的格列高利的记述；一般只说他约卒于 202 年前后。
