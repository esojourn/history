name: 普罗提诺
aliases: [柏罗丁, 普洛丁, 普罗提努斯]
role: 哲学家
summary: 新柏拉图主义的创始人，讲学于罗马，著作由弟子波菲利编为《九章集》。
body: |-
  普罗提诺的生平出自弟子波菲利为他写的传记。波菲利说，老师不肯讲自己的出身、父母和生日，也不让人画像，好像以身在肉体之中为耻；据他去世时六十六岁推算，约生于公元 204 年。四世纪的欧纳皮乌斯说他是埃及吕科波利斯人。

  他二十八岁在亚历山大城起意学哲学，听遍名家都不满意，最后跟了阿莫尼乌斯·萨卡斯十一年。243 年他随罗马皇帝戈尔迪安三世的军队东征，想见识波斯和印度人的学问；皇帝死在军中，他逃到安条克，244 年到罗马，时年四十，此后讲学二十六年。听讲的有元老、医生，也有妇女，不少人临终把子女托付给他。皇帝伽利埃努斯和皇后敬重他，他曾请求在坎帕尼亚重建一座废城，按柏拉图的法律治理，取名“柏拉图城”，因朝中有人阻挠没有办成。

  他五十岁左右才开始动笔，不重读、不修改。波菲利在他死后把五十四篇文章按题目分为六组，每组九篇，称《九章集》。他认为一切存在都出自“太一”，也就是至善，它超乎存在与思想之上；从太一流溢出理智，从理智流溢出灵魂，灵魂再赋予物质世界以形式；物质处在最低一层，本身没有任何规定。人的灵魂可以凭德行和沉思逐级回转，最终与太一合一。波菲利说，他跟随老师的六年里，老师四次达到这种境界。书中另有一篇专门驳斥诺斯替派贬低可见世界的说法。

  晚年他患了重病，离开罗马，270 年死在坎帕尼亚一位已故友人的庄园里。“新柏拉图主义”是近代学者起的名字，他自己只认为是在解释柏拉图。奥古斯丁在《忏悔录》里说，读了“柏拉图派的书”才学会设想非物质的实在，这些书主要就是他和波菲利著作的拉丁文译本。
sources: []
recalled:
  - 波菲利《普罗提诺生平和著作编次》
  - 普罗提诺《九章集》第 1 集第 6 篇、第 2 集第 9 篇、第 6 集第 9 篇
  - 欧纳皮乌斯《哲学家与智者传》
  - 奥古斯丁《忏悔录》卷 7 第 9 章
