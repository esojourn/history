name: 八思巴
aliases: [洛追坚赞, 帝师]
role: 藏传佛教萨迦派领袖、元朝帝师
summary: 藏传佛教萨迦派领袖，元朝第一位帝师，奉命创制蒙古新字，掌管全国佛教和吐蕃事务。
body: |-
  八思巴本名洛追坚赞，“八思巴”是藏语“圣者”的意思，生于 1235 年，出身萨迦款氏家族，是萨迦派第四祖萨迦班智达的侄子。1244 年他随伯父前往凉州会见窝阔台之子阔端，此后吐蕃各地归附蒙古。萨迦班智达去世后，他成为萨迦派的领袖。

  1253 年八思巴在六盘山一带会见忽必烈，忽必烈和王妃察必从他受戒。中统元年（1260 年）忽必烈即位，尊他为国师，授以玉印，让他掌管全国佛教事务；后来又设立总制院（后改宣政院），由他统领，管理佛教和吐蕃地区的事务。

  至元六年（1269 年）八思巴奉命创制的蒙古新字颁行全国，这种文字以藏文字母为基础，可以拼写蒙古语、汉语等多种语言，称为“蒙古新字”或“八思巴字”，元朝的诏书、印章、牌符多用这种文字，但它在民间没有通行，元亡后逐渐废弃。忽必烈因此尊他为帝师，加号“大宝法王”。

  至元十三年（1276 年）前后八思巴回到萨迦，至元十七年（1280 年）在萨迦去世。此后元朝的帝师大多出自萨迦款氏家族。八思巴的事迹在藏文史籍和汉文史籍中都有记载，生平细节有些出入。他用藏文写下的著作很多，后人编为文集。
sources: []
recalled:
  - 《元史·释老传》
  - 《萨迦世系史》
