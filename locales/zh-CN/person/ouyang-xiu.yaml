name: 欧阳修
aliases: [欧阳文忠, 醉翁, 六一居士]
role: 北宋文学家、史学家、参知政事
summary: 北宋文坛领袖，倡导诗文革新，主持编写《新唐书》，私撰《新五代史》。
body: |-
  欧阳修是吉州庐陵人，景德四年（公元 1007 年）生于绵州，他父亲当时在那里做推官。他四岁丧父，家境贫寒，据宋人记载，母亲郑氏用荻秆在地上画字教他读书。天圣八年（1030 年）他考中进士，到西京洛阳任推官，与梅尧臣、尹洙等人诗文唱和，开始倡导平易流畅的古文。

  景祐三年（1036 年）范仲淹因批评宰相吕夷简被贬，欧阳修写信斥责不肯为范仲淹说话的谏官高若讷，因此被贬为夷陵县令。庆历年间他任谏官，支持范仲淹等人推行新政，写了《朋党论》，说君子以同道为朋，小人以同利为朋。新政失败后，他被政敌以私德问题攻击，庆历五年（1045 年）被贬到滁州，在那里写了《醉翁亭记》。

  嘉祐二年（1057 年）他主持礼部考试，力排当时流行的险怪艰涩的“太学体”，录取了苏轼、苏辙、曾巩、程颢、张载等人，文风由此转变。他与宋祁合撰《新唐书》，又独自编写《五代史记》（后世称《新五代史》）；他收集历代金石文字，编成《集古录》，开创了宋代的金石学；所著《六一诗话》是第一部以“诗话”为名的著作。嘉祐六年（1061 年）他升任参知政事，濮议时站在韩琦一边。

  神宗即位后，他反对青苗法，屡次请求退休。熙宁四年（1071 年）他以太子少师致仕，退居颍州，自号六一居士，意思是藏书一万卷、金石遗文一千卷、琴一张、棋一局、酒一壶，加上自己这一老翁。次年他在颍州去世，谥“文忠”。他是北宋诗文革新的领袖，后世列入“唐宋八大家”。
sources: []
recalled:
  - 《宋史·欧阳修传》
  - 欧阳修《六一居士传》
  - 吴充《欧阳公行状》
