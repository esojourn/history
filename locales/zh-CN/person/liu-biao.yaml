name: 刘表
aliases: [刘景升]
role: 荆州牧
summary: 汉末荆州的割据者，据守荆州近二十年，死后其子刘琮降于曹操。
body: |-
  据《后汉书·刘表传》和《三国志·魏书·刘表传》，刘表字景升，山阳高平人，是西汉鲁恭王的后代。他年轻时是太学生中的名士，名列“八俊”，党锢时受到牵连。

  初平元年（公元 190 年）他被任命为荆州刺史。当时荆州各地被宗族武装占据，道路不通，他只身到宜城，与当地大族蒯良、蒯越、蔡瑁等商议，诱杀了一批武装首领，收编其部众，随后把治所设在襄阳，后来升任荆州牧。初平年间孙坚奉袁术之命来攻，被他的部将黄祖的军队射死。

  刘表据有荆州近二十年，《后汉书》说他辖地数千里，有兵十余万。中原战乱时荆州比较安定，他设立学校，从关中和兖州、豫州来投奔的学者数以千计。袁绍与曹操在官渡相持，双方都来求援，他答应袁绍而不出兵，也不帮助曹操。建安六年（201 年）刘备来投，他让刘备驻在新野。建安十三年（208 年）八月刘表病死，本传记其终年六十七，幼子刘琮继位。九月曹操大军到达，刘琮举州投降。
sources: []
recalled:
  - 《后汉书·袁绍刘表列传》
  - 《三国志·魏书·董二袁刘传》
