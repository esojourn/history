name: 李牧
aliases: [武安君]
role: 赵国大将
summary: 赵国名将，镇守雁门大破匈奴，又两败秦军；赵王中秦反间计将他杀害，三个月后赵亡。
body: |-
  李牧是赵国北部边境的良将，生年不详。据《史记·廉颇蔺相如列传》所附的李牧传，他长期驻守代郡、雁门郡防备匈奴，有权按需设置官吏，市场的租税都送进军营作为士卒的费用。他每天杀几头牛犒劳士兵，训练骑射，严守烽火，但约定匈奴来犯时立即收拢人畜退入营垒，有敢出战捕敌的斩首。这样过了几年，匈奴以为李牧胆怯，赵国的边兵也以为主将怯战。赵王责备他，他照旧不变，赵王改派别人代替，新将屡次出战，损失很大，边境不能耕牧，赵王只得再请李牧出任。

  据《史记》，李牧复职后照原样防守，士卒天天受赏却无仗可打，人人求战。于是他挑选战车一千三百乘、骑兵一万三千、步兵和射手十几万（《史记》数字），先放出牲畜和百姓引诱匈奴，佯装败退，等单于率大军入侵，再布奇阵左右夹击，大破匈奴，据称杀敌十余万骑，又灭了襜褴、破东胡、降林胡。此后十几年匈奴不敢接近赵国边境。

  长平之战后赵国精锐丧尽，李牧成为抵御秦国的主要将领。公元前 233 年秦将桓齮攻赵，李牧在宜安、肥一带大败秦军，被封为武安君；公元前 232 年秦军再攻番吾，又被他击退。公元前 229 年秦将王翦大举攻赵，李牧与司马尚率军抵御。秦国用重金收买赵王迁的宠臣郭开，散布李牧、司马尚要谋反的流言。赵王派赵葱、颜聚代替李牧，李牧不受命，赵王派人暗中捕获并杀害了他（《战国策》说是逼其自杀），司马尚被罢免。三个月后王翦大破赵军，攻下邯郸，俘虏赵王迁。司马迁把李牧与廉颇并列作传，后世常以二人为赵国的柱石。
sources: []
recalled:
  - 《史记·廉颇蔺相如列传》
  - 《史记·赵世家》
  - 《战国策·秦策五》
