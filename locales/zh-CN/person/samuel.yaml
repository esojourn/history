name: 撒母耳
aliases: []
role: 先知、士师
summary: 先知，也是最后一位士师，先后膏立扫罗和大卫为王。
body: |-
  撒母耳是以法莲山地拉玛人以利加拿和哈拿的儿子；《历代志上》第 6 章把他的家系列在利未人哥辖的后裔之中。哈拿曾许愿，若得儿子就使他终身归与耶和华，所以他断奶以后就被送到示罗，在祭司以利面前事奉。圣经没有记载他的生年、卒年和寿数。

  据《撒母耳记上》第 3 章，他还是童子的时候，耶和华夜间呼唤他，把将要临到以利家的事告诉他。他渐渐长大，从但到别是巴，以色列众人都知道耶和华立他为先知（3:20）。约柜被非利士人掳去又送回以后，撒母耳招聚以色列众人到米斯巴，禁食认罪。非利士人上来攻击，耶和华大发雷声惊乱他们，他们就败在以色列人面前；撒母耳立了一块石头，起名叫以便以谢（第 7 章）。他平生作以色列的士师，每年巡行到伯特利、吉甲、米斯巴审判以色列人，随后回到拉玛，他的家在那里（7:15–17）。

  撒母耳年老的时候立两个儿子约珥、亚比亚作士师，他们却贪图财利，收受贿赂。以色列的长老到拉玛来，求他立一个王治理他们。撒母耳不喜悦这事，祷告之后把王将怎样管辖百姓的话告诉众人，众人仍然要立王（第 8 章）。他照耶和华的指示膏了便雅悯人扫罗，在米斯巴当众掣签，又在吉甲立扫罗为王；第 12 章是他向众人所作的陈述和劝诫。

  后来扫罗在吉甲不等撒母耳来到就自己献上燔祭，攻打亚玛力人时又留下亚玛力王亚甲和上好的牛羊，撒母耳两次责备他，告诉他耶和华已经厌弃他作王。撒母耳在吉甲杀了亚甲，回到拉玛，直到死的日子再没有去见扫罗（15:35）。他又奉命往伯利恒去，在耶西的众子中膏了最小的儿子大卫（第 16 章）。大卫逃避扫罗的时候，曾到拉玛投奔他（19:18）。

  《撒母耳记上》25:1 记载，撒母耳死了，以色列众人聚集为他哀哭，把他葬在拉玛。第 28 章记载，扫罗在基利波之战前夜到隐多珥，求一个交鬼的妇人为他招撒母耳上来。
sources: []
recalled:
  - 《撒母耳记上》第 1—3 章、第 7—13 章、第 15—16 章、第 19 章、第 25 章、第 28 章
  - 《历代志上》第 6 章
