name: 约兰
aliases: []
role: 北国以色列王
summary: 亚哈的儿子，暗利王朝末代君王，伐摩押无功，后被耶户射死在耶斯列。
body: |-
  亚哈的儿子，接替无子的兄长亚哈谢作王，与同时代的犹大王约兰同名。《列王纪下》3:1 说他在犹大王约沙法十八年于撒玛利亚登基，作王十二年；1:17 又说是在约沙法的儿子约兰第二年，一般认为这反映了犹大父子共同执政的时期。经文说他行恶，但不像他父母，因为他除掉了他父亲所造的巴力柱像（3:2）。

  摩押王米沙原本每年向以色列进贡，亚哈死后背叛。约兰联合犹大王约沙法和以东王去攻打摩押，绕行旷野七日，军中没有水；先知以利沙叫人在谷中挖沟，沟里就满了水。联军打败摩押，围攻吉珥哈列设，摩押王在城墙上把长子献为燔祭，以色列人就撤兵回国（3:4–27）。《列王纪下》第 5—8 章所记以利沙年间亚兰来犯、撒玛利亚被围的饥荒等事，经文多只称“以色列王”，一般认为是约兰在位时。

  后来约兰与外甥犹大王亚哈谢同去基列的拉末与亚兰王哈薛争战，受了伤，回耶斯列养伤（8:28–29）。军长耶户受膏起兵，赶到耶斯列，开弓射中约兰，把他的尸首抛在耶斯列人拿伯的田里（9:21–26）。暗利王朝至此结束。
sources: []
recalled:
  - 《列王纪下》1:17、第 3 章、8:28–29、9:14–26
