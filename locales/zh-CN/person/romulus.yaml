name: 罗慕路斯
aliases: [罗穆卢斯, 罗慕洛]
role: 传说中的罗马建城者、第一位国王
summary: 传说中的罗马建城者和第一位国王，相传由母狼哺育长大。
body: |-
  相传为阿尔巴隆加国王努米托尔的外孙。据李维和普鲁塔克，努米托尔被弟弟阿穆利乌斯夺位，女儿雷亚·西尔维亚被迫做维斯塔贞女，却生下孪生子罗慕路斯和雷穆斯，自称孩子的父亲是战神马尔斯。阿穆利乌斯下令把婴儿扔进台伯河，装孩子的篮子搁浅在岸边，一只母狼给他们哺乳，后来牧人法乌斯图卢斯把他们抚养成人。兄弟二人长大后杀死阿穆利乌斯，让外祖父复位。

  二人决定在获救的地方另建新城，为由谁建城、以谁命名起了争执，用观察飞鸟的办法占卜也没有结果。李维记了两种说法：一说雷穆斯在争吵中被杀；较通行的一说是他跳过哥哥新筑的城墙加以嘲笑，被罗慕路斯杀死。新城以罗慕路斯命名，建城的日子后来定在 4 月 21 日；年份古人说法不一，共和国末年的学者瓦罗推算为公元前 753 年，成为通行的说法。

  据传说，他为增加人口开设庇护所，收容各地的逃亡者；因缺少妇女，借举办节庆之机抢走前来观礼的萨宾人的女儿。萨宾人在国王提图斯·塔提乌斯率领下攻入罗马，被抢的妇女冲进两军之间劝和，两族合并，两王共治，直到塔提乌斯死去。传说还把元老院（最初一百人）、三个部落和三十个库里亚的设立归于他。

  李维说他在位三十七年，在战神广场检阅军队时突起风暴，他从此不见；有人说他升天成了奎里努斯神，李维也提到另一种说法，即他被元老们杀死。现代学者一般认为他是传说人物，名字是由“罗马”一名反推出来的；考古发现表明，帕拉蒂尼山上在前 8 世纪确有聚落。
sources: []
recalled:
  - 李维《建城以来史》卷一
  - 普鲁塔克《罗慕路斯传》
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷一、卷二
