name: 卢库卢斯
aliases: [卢基乌斯·李锡尼·卢库卢斯, 卢库鲁斯]
role: 罗马统帅、执政官
summary: 罗马统帅，连败米特里达梯和提格兰，因士兵哗变被庞培取代，晚年以豪奢闻名。
body: |-
  卢基乌斯·李锡尼·卢库卢斯，罗马平民贵族，约生于公元前 118 年，母亲出自梅特卢斯家族。同盟者战争中他在苏拉麾下。前 88 年苏拉进军罗马，据阿庇安，军官中只有一名财务官跟随，一般认为就是他。第一次米特里达梯战争期间他为苏拉在埃及、叙利亚、罗得岛等地筹集舰队，战后留在亚细亚行省征收罚款。苏拉把回忆录题献给他，并指定他为儿子的监护人。

  前 74 年他任执政官，取得对米特里达梯六世的指挥权。本都大军围攻基齐库斯，他不正面交战，切断对方的粮道，使其因饥饿和疾病溃散。此后他攻入本都，前 71 年前后米特里达梯逃往亚美尼亚。在亚细亚行省，各城因苏拉的罚款向罗马包税人和放债人借贷，据普鲁塔克，本息已滚到原数的六倍；他规定利率上限，禁止利滚利，债主所得不得超过债务人收入的四分之一。罗马的骑士金融家从此与他为敌。

  亚美尼亚国王提格兰拒绝交出米特里达梯。前 69 年他未经元老院授权渡过幼发拉底河，在提格兰诺塞塔城外击溃人数多得多的亚美尼亚军队。前 68 年他向亚美尼亚腹地推进，士兵因天寒路远拒绝前进；他的妻舅克洛狄乌斯在军中煽动不满。前 67 年米特里达梯夺回本都，他的部下在泽拉大败。前 66 年马尼利乌斯法把整个指挥权交给庞培。

  他回罗马后，凯旋式被政敌拖到前 63 年才举行。此后他渐渐退出政治，以豪奢闻名：在罗马城边建花园，在那不勒斯湾的别墅里开凿水道养海鱼；据普鲁塔克，有一天他独自用餐，责备管家准备得简单，说：“今天卢库卢斯请卢库卢斯吃饭。”他的藏书向学者开放。老普林尼说樱桃树是他从本都带到意大利的。晚年他神志失常，由弟弟照管，前 57 年或前 56 年去世。
sources: []
recalled:
  - 普鲁塔克《卢库卢斯传》
  - 阿庇安《米特里达梯战争》
  - 西塞罗《学园派》卷二
  - 老普林尼《自然史》卷十五
