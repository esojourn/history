name: 撒拉
aliases: [撒莱]
role: 亚伯拉罕之妻
summary: 亚伯拉罕的妻子，年老时生以撒。
body: |-
  原名撒莱，亚伯兰的妻子。圣经没有记她的出生地；创 20:12 记亚伯拉罕说，她是他同父异母的妹妹。《创世记》11:30 说她不生育。据创 17:17，她比亚伯拉罕小十岁。她随丈夫从吾珥到哈兰，又从哈兰进入迦南（11:31、12:5）。

  因饥荒下埃及时，亚伯兰怕因她容貌俊美而被杀，叫她自称是他的妹妹；她被带进法老的宫，耶和华降灾给法老全家，法老便把她送还（12:10—20）。在基拉耳，类似的事又发生一次，基拉耳王亚比米勒在梦中受了警戒，把她归还（第 20 章）。

  她因自己不生育，把埃及使女夏甲给丈夫为妾；夏甲怀孕后小看她，她苦待夏甲，夏甲一度逃走（第 16 章）。亚伯拉罕九十九岁时，神给她改名撒拉，应许她要生一个儿子（17:15—16）。后来三位客人来到幔利，说明年这时候她必生一个儿子，她在帐棚门口听见，心里暗笑（18:10—15）。

  据创 21:1—7，她在亚伯拉罕一百岁时生了以撒；按 17:17，那时她约九十岁。以撒断奶后，她见夏甲的儿子戏笑，要亚伯拉罕把夏甲母子赶出去（21:8—10）。据创 23:1—2，撒拉享寿一百二十七岁，死在基列亚巴，就是希伯仑。亚伯拉罕向赫人以弗仑买下麦比拉洞安葬她（23:3—20）。新约《希伯来书》11:11 和《彼得前书》3:6 提到她。
sources: []
recalled:
  - 《创世记》第 11—23 章
  - 《希伯来书》11:11
  - 《彼得前书》3:6
