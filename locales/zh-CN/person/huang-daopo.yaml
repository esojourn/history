name: 黄道婆
aliases: [黄婆]
role: 纺织技术革新者
summary: 宋末元初松江乌泥泾人，把海南黎族的棉纺织技术带回家乡，推动了江南棉纺织业的发展。
body: |-
  黄道婆是松江府乌泥泾（今上海市徐汇区华泾镇）人，生卒年和本名都不详，事迹见于元末陶宗仪的《南村辍耕录》和王逢的诗序。据记载，她年轻时流落到崖州（今海南岛南部），在那里生活了很长时间，向当地黎族妇女学会了棉纺织技术。元成宗元贞年间（1295—1297 年）她乘船回到家乡。

  当时乌泥泾一带已经种植棉花，但加工方法很简陋。黄道婆教乡人制作和使用去棉籽的搅车、弹棉花的椎弓、纺纱的车和织布的机，并传授错纱、配色、综线、挈花等织造方法，织出的被、褥、带、帨上有折枝、团凤、棋局、字样等花纹，鲜艳如画。此后乌泥泾的棉布远近闻名，松江一带逐渐成为全国棉纺织业的中心，明代有“衣被天下”之称。她去世后，乡人为她立祠祭祀。关于她早年流落海南的原因、所改良工具的具体形制，后世有不少传说和推测，史料记载并不详细。
sources: []
recalled:
  - 陶宗仪《南村辍耕录·黄道婆》
  - 王逢《梧溪集·黄道婆祠》
