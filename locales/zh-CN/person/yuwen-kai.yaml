name: 宇文恺
aliases: [宇文安乐]
role: 将作大匠
summary: 隋朝的建筑家，规划大兴城和东都洛阳，主持开凿广通渠。
body: |-
  宇文恺字安乐，出身北周的将门，父亲宇文贵是北周大将。他与兄长们以弓马见长不同，自幼好学，尤其精通建筑和工程。

  开皇二年（公元 582 年），隋文帝决定在汉长安城东南的龙首原营建新都，高颎总领其事，宇文恺任营新都副监，城池宫室的规划主要出自他手，这就是大兴城，即后来唐朝的长安城（另见“营建大兴城”条）。开皇四年（584 年），他又率领水工开凿广通渠，从大兴城引渭水向东通到潼关，以便漕运。

  炀帝即位后，他任将作大匠，与杨素一同营建东都洛阳（另见“营建东都”条）。他还为炀帝设计了可以拆卸移动的观风行殿和可坐数千人的大帐，炀帝北巡时用来接见突厥启民可汗。他写过《明堂议》，考证历代明堂的形制。大业八年（612 年）他去世，年五十八。
sources: []
recalled:
