name: 米利暗
aliases: []
role: 女先知
summary: 摩西和亚伦的姐姐，过红海后领妇女击鼓歌唱，死在加低斯。
body: |-
  米利暗是暗兰和约基别的女儿，亚伦和摩西的姐姐（《民数记》26:59）。她的生年圣经没有记载。《出埃及记》第 2 章说，摩西出生三个月后被放在河边的蒲草箱里，他的姐姐远远站着看，后来又去对法老的女儿说，可以找一个希伯来妇人来奶这孩子，于是把孩子的母亲叫了来（2:4–8）。这里没有写出姐姐的名字，传统上认为就是米利暗。

  以色列人过了红海以后，《出埃及记》15:20–21 称她为“女先知”，说她手里拿着鼓，众妇女也跟着她出去拿鼓跳舞，她应声唱歌，歌颂耶和华把马和骑马的投在海中。

  据《民数记》第 12 章，在哈洗录，米利暗和亚伦因摩西娶了古实女子就毁谤他，说耶和华难道只与摩西说话，不也与我们说话吗。耶和华在会幕门口责备他们，云彩离开以后，米利暗长了大麻风，有雪那样白。亚伦向摩西求情，摩西为她祷告；她被关在营外七天，百姓等她回来才起行。

  《民数记》20:1 记载，正月间以色列全会众到了寻的旷野，住在加低斯，米利暗死在那里，就葬在那里。经文只写了月份，没有写是哪一年，一般认为是出埃及后第四十年，与亚伦之死同年；她死时多少岁，圣经也没有记载。《弥迦书》6:4 把她与摩西、亚伦并列，说神曾差遣他们三人在以色列人前面行。
sources: []
recalled:
  - 《出埃及记》2:1–10、15:20–21
  - 《民数记》第 12 章、20:1、26:59
  - 《弥迦书》6:4
