name: 苏拉
aliases: [卢基乌斯·科尔内利乌斯·苏拉, 幸运者苏拉]
role: 罗马统帅、独裁官
summary: 罗马统帅，首次率军攻入罗马，击败米特里达梯后任独裁官，以公敌名单清洗政敌。
body: |-
  卢基乌斯·科尔内利乌斯·苏拉，公元前 138 年生，出身贵族科尔内利乌斯氏族中一个久已衰落的支系，年轻时并不富裕。前 107 年他任马略的财务官，在努米底亚说动毛里塔尼亚国王博库斯交出朱古达；他把这一幕刻在印章上，马略为此不快。此后他参加了对辛布里人的战争，前 97 年前后任大法官，随后出任奇里乞亚总督，在幼发拉底河畔会见帕提亚使节，这是罗马与帕提亚的第一次官方接触。

  同盟者战争中他在南线屡胜。前 88 年他任执政官，奉派对付本都王米特里达梯六世。保民官苏尔皮基乌斯让人民大会把指挥权改授马略，苏拉赶到坎帕尼亚的军中，带领六个军团开进罗马。这是罗马军队第一次攻入本城。他宣布马略等十二人为公敌，随后东征。前 86 年他攻陷并洗劫雅典，在喀罗尼亚和奥尔科墨诺斯两败本都军队；前 85 年与米特里达梯在达尔达诺斯议和，条件相当宽松，因为政敌秦纳一派已控制罗马并宣布他为公敌。

  前 83 年他在布伦迪西乌姆登陆，庞培、克拉苏等人来投。次年 11 月他在罗马科林门外击败萨莫奈人和马略派的联军，随后公布“公敌名单”：名列其上的人可以任意杀死，告发者有赏，财产没收，子孙不得任官。据阿庇安，头一批名单上有元老四十人、骑士约一千六百人，以后还有增补。

  前 82 年底他被任命为“制定法律和整顿国家”的独裁官，没有期限。他把元老院扩充到约六百人，陪审法庭交还元老；保民官不得再任其他官职，提案须经元老院同意；规定任职的年龄和次序，设立常设刑事法庭。大批老兵被安置在没收的土地上。前 79 年他出人意料地辞去职务，退居坎帕尼亚写回忆录，次年在普特奥利病死，罗马为他举行国葬。他对保民官的限制在前 70 年被取消。
sources: []
recalled:
