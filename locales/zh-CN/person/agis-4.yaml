name: 阿吉斯四世
aliases: [亚基斯四世]
role: 斯巴达国王
summary: 斯巴达国王，试图取消债务、重分土地以恢复旧制，失败后被监察官处死。
body: |-
  斯巴达欧里庞提德王室的国王，约生于公元前 265 年，约前 244 年即位时不满二十岁。据普鲁塔克，这时的斯巴达土地和财富集中在少数人手里，享有全权的公民只剩约七百人，其中有地产的不过一百人左右，其余的人负债累累。阿吉斯出身于最富有的家族之一，却立志恢复相传由吕库古订立的旧制，自己先按旧俗穿着和饮食。

  他通过监察官吕山德提出法案：取消一切债务；把土地重新分成四千五百份给斯巴达公民，另分一万五千份给周边的边民，公民名额不足，就从边民和外邦人中补充；恢复公共食堂和传统训练。他和母亲、外祖母带头献出田产和钱财。另一位国王列奥尼达二世领头反对，法案在长老会议上以一票之差被否决。吕山德随即设法废黜列奥尼达，改立其女婿。

  阿吉斯的舅舅阿格西劳斯地多而债重，劝他先销债、后分地。债契在市场上当众烧掉了，分地却一再拖延。前 241 年阿吉斯应盟友亚该亚同盟的阿拉托斯之请，率军到科林斯地峡防备埃托利亚人；等他回来，民众已经失望，列奥尼达被迎回复位。

  他逃入神庙避难，后来在外出沐浴的路上被抓进监狱。监察官们匆匆审问后判他死刑，立即把他绞死；他的母亲和外祖母前来探视，也被绞死。普鲁塔克说，他是斯巴达第一位被监察官处死的国王。十几年后，列奥尼达之子克列奥美涅斯三世娶了他的遗孀，重新推行他的方案。
sources: []
recalled:
  - 普鲁塔克《阿吉斯传》
