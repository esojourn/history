name: 欧迈尼斯（卡狄亚）
aliases: [攸美尼斯, 卡狄亚的欧迈尼斯]
role: 亚历山大的书记长、将领
summary: 希腊人，腓力和亚历山大的书记长，亚历山大死后为王室统兵，被部下出卖给安提柯而死。
body: |-
  色雷斯半岛上的希腊城市卡狄亚人，约生于公元前 362 年。据奈波斯，他做了七年腓力二世的书记，又做了十三年亚历山大的书记长，掌管文书和记录国王日常起居的《王家日志》。东征后期他也带兵，在印度领过骑兵；前 324 年苏萨的集体婚礼上，他娶了波斯贵族阿尔塔巴佐斯的一个女儿。他不是马其顿人，这一点在后来始终是他的弱点。

  前 323 年分封诸将，他得到卡帕多西亚和帕夫拉戈尼亚，这两处尚未征服，次年由摄政佩尔狄卡斯出兵为他打下。佩尔狄卡斯进攻埃及时，留他在小亚细亚抵挡安提帕特和克拉特鲁斯。他先击败倒戈的涅俄普托勒摩斯，随后在与克拉特鲁斯的会战中获胜；据普鲁塔克，他在阵中与涅俄普托勒摩斯单独格斗，将其杀死，克拉特鲁斯也伤重而亡。但佩尔狄卡斯已在埃及被杀，马其顿军的集会因克拉特鲁斯之死判了欧迈尼斯死刑，由安提柯负责讨伐。

  前 319 年他战败，退入卡帕多西亚的山寨诺拉，被围将近一年。安提帕特死后局势变化，他脱身而出。新摄政波利伯孔和太后奥林匹亚斯以两位国王的名义任命他为亚洲的统帅，让他动用王家金库，并指挥亚历山大的老兵“银盾兵”。这些马其顿老兵不甘听命于一个希腊人，据狄奥多罗斯和普鲁塔克，他便设了一座帐幕，里面放着亚历山大的宝座和权杖，诸将在宝座前议事，好像仍由亚历山大主持。

  他率军东进，联合东方各总督，与安提柯在伊朗高原周旋。前 317 年帕莱塔凯涅之战不分胜负。前 317 年至前 316 年冬的伽比埃奈之战，他的步兵占了上风，安提柯的骑兵却绕到后方夺走了银盾兵的行李和家眷。银盾兵为换回家当，把欧迈尼斯绑交安提柯。安提柯犹豫了几天，把他处死。

  他的同乡、史家卡狄亚的希罗尼穆斯当时在他军中，后来写了一部继业者时代的历史，原书已佚，是狄奥多罗斯和普鲁塔克有关记载的主要依据，所以史书对他多有同情。
sources: []
recalled:
  - 普鲁塔克《欧迈尼斯传》
  - 奈波斯《欧迈尼斯传》
  - 狄奥多罗斯《历史丛书》卷十八、卷十九
