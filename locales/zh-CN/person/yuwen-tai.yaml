name: 宇文泰
aliases: [黑獭, 北周文帝, 周太祖]
role: 西魏大丞相
summary: 出身武川镇的将领，据关中建立西魏，创府兵制，为北周和隋唐奠定基础。
body: |-
  宇文泰字黑獭，代郡武川人，出身鲜卑宇文部（一说其先祖是归附鲜卑的匈奴人）。六镇之乱时，他随父亲宇文肱加入鲜于修礼的起事军，后归葛荣；葛荣失败后归附尔朱荣，跟随贺拔岳进入关中，镇压万俟丑奴等起事。

  永熙三年（公元 534 年），关中的统帅贺拔岳被侯莫陈悦杀害，部下推举宇文泰统领其众，他随即击灭侯莫陈悦，控制了关中。同年，北魏孝武帝与高欢决裂，西奔长安投靠他；年底，孝武帝被他毒死，他另立元宝炬为帝，即西魏文帝，北魏由此分裂为东西魏（另见“北魏分裂”条）。

  西魏立国之初，地狭兵少，远不如东魏。大统三年（537 年），高欢率大军渡河西进，宇文泰在沙苑设伏，以少胜多，大败东魏军。此后双方在河东、河南一带反复争夺，大统九年（543 年）他在邙山战败，大统十二年（546 年）部将韦孝宽守住了玉壁。晚年他乘南朝内乱向南扩张，废帝二年（553 年）取得蜀地，次年攻陷江陵。

  在内政上，他任用苏绰推行“六条诏书”，整顿吏治和户籍；又仿照《周礼》改定官制，设立六官。他把各族将领和关中豪强组织起来，设八柱国、十二大将军，统领府兵（另见“府兵制建立”条），这一集团后来被史家称为“关陇集团”，北周、隋、唐三朝的皇室都出自其中。他还让一些汉族将领改用鲜卑姓氏，如杨忠改姓普六茹、李虎改姓大野。

  恭帝三年（556 年），他北巡途中病重，回到云阳时去世，年五十。他临终把后事托付给侄子宇文护。次年宇文护拥立他的儿子宇文觉代西魏建立北周，追尊他为文王，后改称文帝。
sources: []
recalled:
  - 《周书·文帝纪》
  - 《资治通鉴》卷一百五十六至一百六十六
