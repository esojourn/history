name: 约翰·屈梭多模
aliases:
  - 金口约翰
  - 屈梭多模
  - 约翰一世
role: 君士坦丁堡主教
summary: 安提阿出身的讲道家，任君士坦丁堡主教，因直言得罪宫廷，死于流放途中。
body: |-
  约翰约在公元 347 至 349 年间生于叙利亚的安提阿。父亲是军官，在他幼年时去世，母亲安图莎守寡把他养大。他师从当时最有名的修辞学家利巴尼乌，本可以走律师和官员的路，却在二十岁前后受洗，跟安提阿的教师学习圣经。他到城外山里跟修士苦修了几年，其中两年独居山洞，把身体弄坏了，只得回城。

  公元 381 年他被立为执事，386 年立为长老，此后十二年在安提阿讲道。387 年安提阿民众因加税闹事，推倒了皇帝的塑像，全城等候惩处，他在这期间讲了二十一篇《论塑像》。他的讲道大多是逐卷讲解圣经，按字面和上下文解释，不好寓意，并且处处落到听众的日常生活上，传下来的有几百篇。“屈梭多模”意思是“金口”，是他死后人们给他的称号，《历史的轨迹》第六章称他是初期教会最有口才的讲道者。

  公元 398 年，他被朝廷选中，带到君士坦丁堡立为主教。他裁减主教府的开销，拿钱办医院，整顿神职人员，在讲台上批评富人和宫廷的奢华，得罪了皇后优多克西娅。亚历山大主教提阿非罗与他有旧怨，又因他收留了被提阿非罗赶出埃及的几位修士而不满。403 年提阿非罗在君士坦丁堡对岸召开“橡树会议”，罢免了他。他被放逐后几天，城里民众骚动，宫廷又把他召回。

  几个月后他再次触怒皇后。公元 404 年 6 月他被放逐到亚美尼亚边境的小城库库苏斯，在那里住了三年，仍与各地通信。407 年朝廷下令把他迁到黑海东岸更远的皮提乌斯，押送的士兵逼他在烈日和雨中赶路，9 月 14 日他死在本都的科马纳附近。据记载，他最后的话是“凡事荣耀归于神”。三十多年后，他的遗骨被迎回君士坦丁堡。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第六章“教会渐趋腐化” https://wellsofgrace.com/books/spiritual/2000years/html/chapter07.html"
recalled:
  - 帕拉迪乌《屈梭多模生平对话录》
  - 苏格拉底《教会史》卷 6 第 2—21 章
  - 屈梭多模《论塑像》讲章、《致奥林匹亚书信》
