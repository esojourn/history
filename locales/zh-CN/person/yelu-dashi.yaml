name: 耶律大石
aliases: [辽德宗, 葛儿罕, 菊儿汗]
role: 西辽建立者
summary: 辽朝宗室，辽亡前率部西走，在中亚建立西辽，称葛儿罕。
body: |-
  耶律大石是辽太祖耶律阿保机的八世孙，生于大安三年（公元 1087 年）。他通晓契丹文和汉文，天庆五年（1115 年）考中进士，在辽朝做过翰林承旨等官，契丹语称翰林为“林牙”，所以宋人称他为“大石林牙”。

  保大二年（1122 年）天祚帝逃入夹山，耶律大石与南京的大臣拥立耶律淳为帝。这年宋朝童贯率军两次进攻燕京，他率辽军击败宋军（另见“宋赎燕京”条）。不久金军攻下燕京，他投奔天祚帝，因为劝阻天祚帝贸然出兵与金军交战，两人意见不合。保大四年（1124 年）他率领部众离开天祚帝，北上到漠北的可敦城，召集当地七州十八部的首领，聚集兵马。

  此后他率军西行，进入中亚。一般认为他在 1132 年前后称帝，号“葛儿罕”（意为众汗之汗），又用汉式年号延庆，后来以虎思斡耳朵为都城，史称西辽，西方和穆斯林的文献称之为“哈喇契丹”（另见“耶律大石西行与西辽建立”条）。称帝的具体年份有不同说法。他先后使东、西喀喇汗王朝和花剌子模臣服，1141 年在撒马尔罕附近的卡特万草原大败塞尔柱苏丹桑贾尔的军队，西辽成为中亚的强国。

  康国十年（1143 年）耶律大石去世，庙号德宗。西辽此后又延续了七十多年，到 1218 年被蒙古灭亡。
