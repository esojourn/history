name: 呼韩邪单于
aliases: [稽侯狦]
role: 匈奴单于
summary: 匈奴内乱中自立的单于，为对抗兄长郅支而归附汉朝，三次入朝，娶王昭君。
body: |-
  据《汉书·匈奴传》，呼韩邪单于名稽侯狦，是虚闾权渠单于的儿子。公元前 60 年父亲去世，贵族另立了握衍朐鞮单于，他逃到妻子的父亲乌禅幕那里。握衍朐鞮单于残暴好杀，不得人心。前 58 年，匈奴东部的贵族拥立稽侯狦为呼韩邪单于，发兵西进，握衍朐鞮单于兵败自杀。

  但匈奴并没有就此统一。各部贵族纷纷自立，前 57 年同时出现了五位单于。呼韩邪逐一击败或收服对手，他的哥哥呼屠吾斯却又在东部自立为郅支单于。前 54 年郅支打败呼韩邪，占领了单于庭。呼韩邪的大臣左伊秩訾王建议向汉朝称臣求助，多数贵族认为这有辱匈奴的传统，呼韩邪最终采纳了这个建议，率部南下靠近汉塞，先派儿子到长安入侍。

  甘露三年（前 51 年）正月，他到甘泉宫朝见汉宣帝。汉朝以高于诸侯王的礼节接待他，朝见时称臣而不必自报名字，并赐给冠带、黄金印玺、刀剑、车马和大量丝帛粮食。他请求留居在汉朝的光禄塞下，遇有危急可以退入汉的受降城。此后汉朝多次供给他粮食。郅支见他得到汉的支持，率部西迁。前 43 年，呼韩邪的部众逐渐恢复，他北归单于庭，行前与汉朝的使者盟誓，约定汉与匈奴合为一家，世世不相欺诈攻伐。

  前 36 年郅支在康居被汉军攻杀。呼韩邪又喜又惧，于竟宁元年（前 33 年）第三次入朝，表示愿做汉家的女婿，元帝把宫女王嫱赐给他，号为宁胡阏氏。他还上书提出由匈奴为汉朝守卫上谷以西的边塞，请汉撤回戍卒，汉廷经过讨论，婉言拒绝。前 31 年他去世，在位二十八年，临终约定诸子以兄弟相传。在他以后的几十年里，汉匈边境没有大的战事。
sources: []
recalled:
