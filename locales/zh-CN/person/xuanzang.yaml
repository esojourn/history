name: 玄奘
aliases: [陈祎, 三藏法师, 唐三藏]
role: 高僧、翻译家
summary: 唐初高僧，西行天竺求法十七年，带回经论六百余部，主持翻译，口述《大唐西域记》。
body: |-
  玄奘俗姓陈，名祎，洛州缑氏人，生年有 600 年、602 年等说法。他幼年随出家的二哥长捷法师在洛阳净土寺学习佛经，十三岁时在洛阳剃度出家。隋末战乱，他与兄长辗转到成都，后又游学荆州、相州、长安等地，遍访名师。他发现各家对经义的解释分歧很多，决心到天竺去寻求原典，特别是《瑜伽师地论》。

  贞观三年（公元 629 年，一说元年），他在朝廷不准出关的情况下私自西行，经凉州、瓜州，偷渡玉门关，穿过沙漠到达伊吾，被高昌王麹文泰请到高昌。麹文泰与他结为兄弟，为他准备了衣物、马匹和随从，又写信给西突厥的叶护可汗，请沿途各国护送。他越过天山，经西突厥，进入今中亚和阿富汗一带，最后到达天竺。

  他在摩揭陀国的那烂陀寺跟随戒贤法师学习瑜伽唯识之学多年，又游历天竺各地。据《大慈恩寺三藏法师传》，戒日王在曲女城为他召开大会，他立论十八日无人能够驳倒，在天竺享有盛名。贞观十九年（645 年）正月，他回到长安，据同书，带回经论六百五十七部。

  太宗在洛阳召见他，劝他还俗从政，他婉言谢绝，请求专心译经。此后近二十年，他在长安的弘福寺、大慈恩寺和玉华宫等处主持译场。据《开元释教录》，他共译出经论七十五部，一千三百三十五卷。他口述、弟子辩机笔录，于贞观二十年（646 年）写成《大唐西域记》十二卷，记载了所经历和听闻的一百多个国家和地区的情况，是研究中古中亚和南亚历史地理的重要资料。永徽三年（652 年），他在大慈恩寺建塔保存经像，即大雁塔。

  麟德元年（664 年）二月，他在玉华寺去世。他和弟子窥基所传的唯识学派称为法相宗。他西行求法的故事后来在民间不断演化，到明代成为小说《西游记》的底本，但小说情节与史实相去甚远（另见“玄奘西行”条）。
sources: []
recalled:
