name: "布鲁松"
aliases: ["克洛德·布鲁松", "布若孙"]
role: "“旷野教会”的传道人"
summary: "胡格诺派律师出身的传道人，南特诏谕废除后多次潜回法国讲道，1698 年被处死。"
body: |-
  布鲁松 1647 年生于尼姆，原是图卢兹高等法院的律师，为胡格诺派的权益出庭辩护。据一般记载，1683 年他参与组织胡格诺派在被禁的教堂废址上照常聚会的抗议行动，遭到镇压，逃往瑞士。

  《历史的轨迹》第三十九章说，1685 年南特诏谕废除后，留在国内的牧师几乎全被杀尽，逃到国外的牧者有时偷偷越境回来看望分散的羊群。其中最勇敢的一位就是布鲁松，他来回边界好几次，几次惊险地逃脱，最后被捕，在一万人面前被处死；群众痛哭，许多天主教徒因他的英勇坚毅而归信了复原教。他是 1689 年在洛桑被按立为传道人的，1698 年 11 月在蒙彼利埃被处轮刑（据一般记载，临刑前被改为先绞死）。书中所说的万人围观、天主教徒因此归信，是该书的说法。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
