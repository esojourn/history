name: 宋璟
aliases: [广平公]
role: 宰相
summary: 开元年间继姚崇之后的宰相，以守法持正、敢于直谏著称，与姚崇并称“姚宋”。
body: |-
  宋璟是邢州南和人，进士出身。武则天时他任御史中丞，以刚正闻名，曾不顾武则天的袒护，坚持审理张易之、张昌宗兄弟的不法行为。睿宗复位后，他任宰相，与姚崇一同革除中宗时的“斜封官”；又因请求让太平公主迁居东都，被太平公主排挤出朝。

  开元四年（公元 716 年）底姚崇罢相，推荐他接任，开元五年（717 年）起他正式执政。他用人唯才，不徇私情，即使是亲戚也不轻易授官；遇事敢于当面谏争，据记载玄宗对他敬畏，有时虽不情愿也听从他的意见。开元八年（720 年），他因严厉禁止私铸的恶钱、处置过严引起怨言而罢相，此后改任闲职。开元二十五年（737 年）他去世，年七十五。
sources: []
recalled:
