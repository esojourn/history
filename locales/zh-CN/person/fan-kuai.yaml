name: 樊哙
aliases: [舞阳侯, 武侯]
role: 将军
summary: 沛人，早年以屠狗为业，随刘邦起兵，鸿门宴上闯帐护主，封舞阳侯。
body: |-
  樊哙是沛人，生年史无记载。据《史记·樊郦滕灌列传》，他早年以屠狗为业，曾与刘邦一同隐匿，刘邦为沛公后他以舍人身份跟随，攻城野战屡次先登。鸿门宴上项庄舞剑，意在沛公，张良出来告急，樊哙带剑持盾闯入帐中，当面责备项羽；随后沛公借口如厕离席，樊哙等人护送他从小路回营。

  此后他随刘邦征战，封舞阳侯。他娶吕后之妹吕须为妻。高祖病重时不见群臣，樊哙推门直入劝谏。后来他以相国身份领兵击燕王卢绾，有人进谗，高祖命陈平到军中斩他；陈平只把他押回长安，到时高祖已死，吕后将他释放，恢复爵邑。孝惠六年（公元前 189 年）去世，谥武侯，去世的地点史书未载。
sources:
  - 《史记·樊郦滕灌列传》 https://zh.wikisource.org/wiki/史記/卷095
  - 《史记·项羽本纪》 https://zh.wikisource.org/wiki/史記/卷007
  - 《史记·高祖本纪》 https://zh.wikisource.org/wiki/史記/卷008
