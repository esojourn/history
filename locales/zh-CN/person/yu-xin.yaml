name: 庾信
aliases: [庾子山, 庾开府]
role: 文学家
summary: 由梁入北的文学家，与徐陵并称“徐庾”，晚年作《哀江南赋》。
body: |-
  庾信字子山，南阳新野人。父亲庾肩吾是梁朝太子萧纲东宫的文士。他少年时就进入东宫，与徐陵同为萧纲的抄撰学士，诗文绮丽，二人并称“徐庾”。

  太清二年（公元 548 年）侯景进攻建康，据《资治通鉴》，庾信奉命率宫中文武千余人守卫秦淮河上的朱雀航，侯景军到时，他下令拆除浮桥，中箭后弃军逃走。台城陷落后，他辗转逃到江陵，在梁元帝手下任御史中丞等职。承圣三年（554 年），他奉命出使西魏，正值西魏出兵攻打江陵，他被扣留在长安，不久江陵陷落，梁元帝被杀。

  此后他留在北方，历仕西魏、北周，官至骠骑大将军、开府仪同三司，世称“庾开府”。北周与陈朝通好后，陈朝请求放回流寓北方的南方人士，北周放还了一些人，却把庾信和王褒留下不放。他身居高位，却常常怀念故国，写下《哀江南赋》《拟咏怀》《枯树赋》等作品，叙述梁朝的覆亡和自己的身世，文风由早年的绮艳转为苍凉沉郁。后人常以他为南北朝文学的集大成者，认为他把南朝的辞采与北方的刚健结合在了一起。

  隋开皇元年（581 年），他在北方去世，年六十九。唐代杜甫很推崇他，写过“庾信文章老更成，凌云健笔意纵横”和“庾信平生最萧瑟，暮年诗赋动江关”等诗句。
sources: []
recalled:
