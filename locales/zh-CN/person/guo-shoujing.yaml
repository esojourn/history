name: 郭守敬
aliases: [郭若思]
role: 天文学家、水利学家
summary: 元代天文学家、水利学家，主持编制《授时历》，开凿大都的通惠河。
body: |-
  郭守敬字若思，邢州邢台（今河北邢台）人，生于 1231 年。祖父郭荣精通算学和水利，他在祖父的教导下长大，少年时曾仿制计时的莲花漏，后来在邢台西南的紫金山跟随刘秉忠学习。

  中统三年（1262 年）张文谦把他推荐给忽必烈，他当面陈述了六条兴修水利的建议，忽必烈很满意，任他为提举诸路河渠。此后他修复西夏故地的唐来渠、汉延渠等古渠，溉田很多，又任都水少监。

  至元十三年（1276 年）忽必烈下令修订新历，以王恂主持，郭守敬负责制造仪器、进行观测，许衡参与其事。他创制和改进了简仪、高表、仰仪等多种仪器，在全国设立了许多观测点进行“四海测验”。至元十七年（1280 年）新历编成，忽必烈取《尚书》“敬授人时”之意，命名为《授时历》，次年颁行。据《元史·历志》，此历以 365.2425 日为一年，与现行公历的平均年长相同。王恂去世后，郭守敬整理了历法的计算方法和数据。

  至元二十八年（1291 年）郭守敬又任都水监，主持开凿从大都到通州的运河，引昌平白浮泉等水源入城，至元三十年（1293 年）完工，忽必烈命名为通惠河，南来的漕船可以直接驶入大都城内的积水潭。他晚年任太史令、昭文馆大学士，延祐三年（1316 年）去世。现代的小行星和月球上的一座环形山以他的名字命名。
sources: []
recalled:
  - 《元史·郭守敬传》
  - 《元史·历志》
