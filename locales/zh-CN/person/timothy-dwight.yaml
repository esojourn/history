name: "蒂莫西·德怀特"
aliases: ["德怀特", "德威特"]
role: "耶鲁学院院长，东部第二次大觉醒的推动者"
summary: "爱德华兹的外孙，任耶鲁院长时反驳自然神论，1802 年起耶鲁出现复兴。"
body: |-
  《历史的轨迹》第四十四章说，大觉醒之后灵性急速下降，部分原因是英国自然神论和法国怀疑主义的影响；许多美国领导人物是自然神论者，最有影响的可能是潘恩，他在《理性时代》中大胆地铲除基督教信仰。书中说，十八世纪末到十九世纪初，是美国基督教史上教会最软弱的时期。

  该书说，就在这时，东部默默出现了复兴。1795 年起爱德华兹的外孙德怀特任耶鲁校长，在一系列演讲和讲道中指出自然神论、唯物主义和背信之罪的危险；1802 年起耶鲁开始复兴，全校三分之一学生归向基督，达特茅斯、阿默斯特、威廉斯和新泽西学院也都经历了复兴。书中说，东部这次大觉醒没有布道家，也没有感情冲动。

  据一般记载，德怀特 1752 年生于马萨诸塞的北安普敦，母亲是爱德华兹的女儿；他十三岁入耶鲁，独立战争中做过随军牧师，后在康涅狄格格林菲尔德山牧会办学，也是当时有名的诗人。他任耶鲁院长二十二年，1817 年在纽黑文去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十四章“十九世纪初期的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter49.html"
