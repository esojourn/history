name: 以拉
aliases: []
role: 北国以色列王
summary: 巴沙的儿子，在得撒作王二年，醉酒时被臣子心利所杀。
body: |-
  巴沙的儿子。据《列王纪上》16:8，犹大王亚撒二十六年，以拉在得撒登基作以色列王，共二年。

  据 16:9–10，管理他一半战车的臣子心利背叛他。那时以拉在得撒家宰亚杂的家里喝醉了，心利就进去杀了他，自己篡位，这是亚撒二十七年的事。心利一坐上王位，就杀了巴沙的全家，连他的亲属朋友也没有留下一个男丁（16:11）。经文说这应验了先知耶户指着巴沙所说的话，是因为巴沙和他儿子以拉拜偶像、使以色列人陷在罪里（16:12–13）。史料所载仅此。
sources: []
recalled:
  - 《列王纪上》16:6–14
