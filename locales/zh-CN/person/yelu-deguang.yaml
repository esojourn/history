name: 耶律德光
aliases: [耶律尧骨, 辽太宗]
role: 契丹（辽）皇帝
summary: 阿保机次子，扶立石敬瑭、取得燕云十六州，947 年灭后晋，改国号辽。
body: |-
  耶律德光是耶律阿保机的次子，天复二年（公元 902 年）生，小字尧骨。他年轻时任天下兵马大元帅，随父亲征讨各部，在灭渤海的战争中立有战功。天显元年（926 年）阿保机去世，次年在母亲述律平的主持下，他取代哥哥耶律倍即位，即辽太宗。

  清泰三年（936 年），后唐河东节度使石敬瑭被朝廷围攻，向契丹求援，许以称臣、割地。耶律德光亲率五万骑兵（据《资治通鉴》）南下，击败太原城下的后唐军，在太原册立石敬瑭为大晋皇帝（另见“后晋灭后唐”条）。后晋把燕云十六州割让给契丹（另见“石敬瑭割燕云十六州”条）。契丹以幽州为南京，此后在燕云汉地沿用中原的制度，形成了以北面官治契丹、以南面官治汉人的双轨体制。

  石敬瑭死后，后晋出帝石重贵对契丹称孙不称臣，耶律德光自会同七年（944 年）起连年南征，几次失利，开运三年（946 年）终于迫使后晋主力投降，十二月（已是公历 947 年初）攻入开封，后晋灭亡（另见“契丹灭后晋”条）。会同十年（947 年）二月，他在开封以中原皇帝的仪式接受朝贺，改国号为大辽，改元大同。

  但契丹军在中原四处劫掠，称为“打草谷”，又向百姓搜刮钱财，各地纷纷起兵反抗，刘知远也在太原称帝。耶律德光被迫北撤。据《资治通鉴》，他在路上对左右说，此次南来有三处过失：纵兵掠夺、搜刮民财、没有及早让各地节度使回镇。同年四月，他走到栾城的杀胡林时病死，年四十六。
sources: []
recalled:
  - 《辽史·太宗本纪》
  - 《新五代史·四夷附录·契丹》
