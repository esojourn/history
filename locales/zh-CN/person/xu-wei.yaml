name: 徐渭
aliases: [文长, 青藤, 天池]
role: 文学家、书画家
summary: 绍兴人，曾入胡宗宪幕府，一生坎坷，诗文书画戏曲兼擅，开创大写意花鸟画的风格。
body: |-
  徐渭字文长，号青藤、天池等，浙江山阴（今绍兴）人，自幼聪慧，二十岁考中秀才，此后八次参加乡试都落榜。嘉靖三十六年（1557 年）前后他进入总督胡宗宪的幕府，为胡宗宪起草文书，其中为胡宗宪进献白鹿所写的表文受到嘉靖帝赞赏，他也参与了抗倭的谋划。

  嘉靖四十四年（1565 年）胡宗宪被逮捕后死于狱中，徐渭害怕受到牵连，精神失常，多次自杀未遂。后来他在发病时杀死了继妻，被关进监狱，经朋友营救，七年后才获释。晚年他贫病交加，靠卖书画度日，万历二十一年（1593 年）去世。

  徐渭在诗文、书法、绘画、戏曲方面都有很高的成就，他的杂剧集《四声猿》在当时很有名，戏曲理论著作《南词叙录》专门论述南戏。他的花鸟画笔墨奔放，被认为开创了大写意的画风，清代的郑燮曾自刻一方“青藤门下走狗”的印章，表示对他的推崇。他死后，袁宏道读到他的诗文，大为惊叹，写了《徐文长传》，他的名声才逐渐传开。
sources: []
recalled:
  - 袁宏道《徐文长传》
  - 徐渭《畸谱》
  - 《明史·文苑传·徐渭》
