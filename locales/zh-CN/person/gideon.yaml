name: 基甸
aliases:
  - 耶路巴力
role: 士师
summary: 玛拿西支派人，率三百人夜袭米甸营，使以色列脱离米甸人的侵扰。
body: |-
  基甸是玛拿西支派亚比以谢族人约阿施的儿子，家在俄弗拉。他的事迹见于《士师记》第 6—8 章，圣经没有记载他的生年和卒年。

  据《士师记》第 6 章，以色列人被交在米甸人手里七年；每逢撒种之后，米甸人、亚玛力人和东方人就上来毁坏土产，以色列人极其穷乏。基甸正在酒榨那里打麦子，为要躲避米甸人，耶和华的使者向他显现，差他去拯救以色列。当夜他照吩咐拆毁父亲为巴力所筑的坛，砍下坛旁的木偶。城里的人要治死他，约阿施说，巴力若是神，让他为自己争论吧，基甸因此又得名耶路巴力。米甸人等过河在耶斯列平原安营，基甸吹角招聚各支派，又两次用一团羊毛向神求证据。

  第 7 章记载，跟随基甸的有三万二千人。耶和华说人太多，于是惧怕的二万二千人回去，剩下一万；又在水旁试验，只留下用手捧着舔水的三百人。夜里基甸把三百人分作三队，各人拿着角和藏有火把的空瓶，在三更之初来到营旁，一同吹角、打破瓶子、呼喊，米甸全营惊乱，自相击杀而逃。以法莲人把守渡口，杀了米甸的两个首领俄立和西伊伯；基甸渡过约旦河继续追赶，擒获米甸二王西巴和撒慕拿，回程惩罚了曾拒绝供给饼的疏割人和毗努伊勒人（第 8 章）。

  以色列人请基甸和他的子孙管理他们，基甸回答说，他和他的儿子都不管理他们，惟有耶和华管理他们（8:22–23）。他向众人要了夺来的金耳环，据 8:26 重一千七百舍客勒，用来制造一个以弗得，设在俄弗拉；《士师记》说这成了基甸和他全家的网罗。基甸在世的日子国中太平四十年。他有七十个亲生的儿子，在示剑的妾又给他生了亚比米勒；他年纪老迈而死，葬在俄弗拉他父亲约阿施的坟墓里（8:28–32）。他死后，亚比米勒杀了自己的众弟兄，在示剑称王（第 9 章）。
sources: []
recalled:
  - 《士师记》第 6—9 章
  - 《希伯来书》第 11 章
