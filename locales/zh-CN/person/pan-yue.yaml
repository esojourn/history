name: 潘岳
aliases: [潘安仁, 潘安]
role: 黄门侍郎
summary: 西晋文学家，与陆机并称“潘陆”，以《悼亡诗》知名，依附贾谧，被孙秀所杀。
body: |-
  潘岳字安仁，荥阳中牟人，后世习称潘安。他少年时就以才思敏捷被乡里称为奇童，容貌俊美也很有名。早年因作《藉田赋》称颂晋武帝亲耕而遭人忌妒，十年不得升迁，后来出任河阳县令、怀县令。

  杨骏辅政时他任太傅主簿，元康元年（公元 291 年）杨骏被杀，僚属多受牵连，他因有人为他说情而免死。此后他任长安县令，写了记述沿途见闻的《西征赋》。《晋书》本传说他性情轻躁，热衷于仕进，与石崇等人一同奉承贾谧，贾谧出门，他们望着车尘下拜；贾谧门下的“二十四友”以他为首。他的母亲多次责备他不知满足。他在《闲居赋》里自述仕途不顺，妻子去世后所作的《悼亡诗》三首，后人把“悼亡”专用来指悼念亡妻。

  他早年在琅邪做官时曾鞭打过小吏孙秀。永康元年（300 年）赵王伦掌权，孙秀得势，诬告他与石崇等人谋反，把他处死，夷三族。
sources: []
recalled:
  - 《晋书·潘岳传》
  - 《文选》
  - 《世说新语》
