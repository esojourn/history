name: 韦斯巴芗
aliases: [提图斯·弗拉维乌斯·韦斯巴西亚努斯, 维斯帕先, 苇斯巴芗]
role: 罗马皇帝
summary: 弗拉维王朝的开创者，结束公元 69 年的内战，动工修建斗兽场。
body: |-
  韦斯巴芗于公元 9 年 11 月 17 日生在萨宾地区雷阿特附近的村子里，出身骑士之家，父亲做过包税人。43 年罗马征服不列颠时，他是第二军团的指挥官，苏维托尼乌斯说他打了三十仗，夺下怀特岛。51 年任执政官，63 年前后任阿非利加总督。66 年他随尼禄巡游希腊，在皇帝演唱时打瞌睡，一度失宠。

  67 年初，尼禄派他带三个军团去平定犹太人的起事。他先收复加利利，被俘的犹太将领约瑟夫斯预言他将做皇帝。69 年各地军团相继拥立皇帝，7 月 1 日埃及总督在亚历山大城率军团向他宣誓，犹太、叙利亚和多瑙河的军团随即响应。年底维特利乌斯被杀，元老院授给他全部权力，这道法令有一块铜版存世。他把犹太的战事交给长子提图斯，70 年回到罗马。

  内战之后国库空虚，他增设各种捐税，连公共厕所收集的尿也要抽税。据苏维托尼乌斯，提图斯嫌这钱来路不雅，他把一枚钱币递到儿子鼻子底下，问有没有臭味。他重建烧毁的卡皮托山神庙，修和平神庙，在尼禄金宫的人工湖旧址上动工修建大竞技场，就是后来的斗兽场。他把意大利和行省的显贵补进元老院，给西班牙各城拉丁权，第一次用国库的钱给修辞学教师发薪俸。莱茵河口巴达维人的起事也在 70 年平定。

  他出身不高，不讳言自己的家世，言谈诙谐。79 年 6 月 23 日他在雷阿特附近的温泉别墅去世，苏维托尼乌斯记他病中说：“哎呀，我想我要变成神了。”提图斯继位，这是罗马第一次由亲生儿子继承皇位。
sources: []
