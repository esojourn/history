name: 冯道
aliases: [冯可道, 长乐老]
role: 历仕四朝的宰相
summary: 先后在后唐、后晋、后汉、后周任宰相，主持雕印九经；后世评价分歧很大。
body: |-
  冯道是瀛州景城人，字可道，中和二年（公元 882 年）生，家世务农，好学能文。唐末他在幽州刘守光手下任参军，因劝阻刘守光出兵被下狱，后来逃到太原，投奔晋王李存勖，任掌书记，掌管文书。

  后唐明宗即位后，冯道任宰相。长兴三年（932 年），他与另一位宰相李愚奏请由国子监校定《九经》，雕版印行，这项工程历经后唐、后晋、后汉，到后周广顺三年（953 年）才完成，是儒家经典第一次由官方大规模刻印（另见“雕版印刷九经”条）。

  此后朝代屡次更替，他都继续出任高官：后晋时任宰相，曾奉命出使契丹；开运四年（947 年）契丹灭后晋，他在开封朝见契丹皇帝耶律德光。据《新五代史》，耶律德光问他天下百姓如何才能救得，他回答说如今只有皇帝能够救得，后人认为他借此劝契丹少杀戮。契丹北撤后，他回到中原，在后汉、后周都位列宰相或太师。显德元年（954 年），周世宗柴荣要亲征北汉，他极力劝阻，周世宗不听。同年四月他在开封去世，年七十三。

  冯道晚年自号“长乐老”，写了一篇《长乐老自叙》，历数自己在各朝所任的官职和所受的封赠，以此为荣。他生活俭朴，待人宽厚，在当时名声很好。但宋代以后，欧阳修在《新五代史》、司马光在《资治通鉴》里都严厉批评他不忠于一朝一姓，欧阳修更称他不知廉耻。明代李贽等人则认为他在乱世中保全百姓，有可取之处。如何评价冯道，至今仍有争论。
sources: []
recalled:
  - 《旧五代史·周书·冯道传》
  - 《新五代史·杂传·冯道》
  - 《资治通鉴》卷二百九十一
