name: 道明
aliases:
  - 多明我
  - 多米尼克
  - 古斯曼的道明
role: 道明会创立者
summary: 西班牙人，在法国南部向迦他利派讲道，创立以讲道和学问为宗旨的道明会。
body: |-
  道明约在 1170 年生于西班牙卡斯蒂利亚的卡莱鲁埃加，在帕伦西亚读书，后来在奥斯马的主教座堂任司铎。

  1203 年以后他随奥斯马主教出使，路过法国南部，见到迦他利派（亚尔比根派）在那里十分兴盛。教皇派去的使节排场很大，百姓不听他们的；迦他利派的传道人却过着清苦的生活。道明和主教劝使节们也徒步出行、不带钱粮地去讲道，自己留下来这样做。《历史的轨迹》第十八章说他要把冷淡退后和传播异端的人带回教会，并为归回的女子设立了一所女修道院，这就是 1206 年前后在普鲁耶建立的修院。1209 年以后讨伐亚尔比根派的战争打了多年，他一直留在当地讲道。

  1215 年他在图卢兹聚集了一批同伴，得到当地主教认可，同年到罗马参加第四次拉特兰会议。《历史的轨迹》说，他在会议期间请求英诺森三世认可他的修会，当时只有十六个人，教皇给了认可。按修会早期的记载，英诺森要他们先选用一种已有的会规，他们选了奥古斯丁会规；正式的批准是继任的何诺略三世在 1216 年 12 月给的。

  1217 年他把这十六个人分派到巴黎、博洛尼亚、西班牙和罗马，专往有大学的城市去。修会称为“讲道兄弟会”，会士不住在与世隔绝的修道院里，靠人施舍生活，以研读和讲道为本分。《历史的轨迹》说，他在派人出去后四年去世，那时修会已在八个省有组织，设立了六十所会院。

  他于 1221 年 8 月 6 日在博洛尼亚去世。后来大学里的名师如大阿尔伯特、多马·阿奎那都是道明会士。宗教裁判所交给道明会士主持，是他去世十多年以后的事。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 萨克森的约尔丹《讲道兄弟会的开端》
  - 1216 年 12 月何诺略三世批准修会的诏书
  - 道明会 1220、1221 年总会章程
