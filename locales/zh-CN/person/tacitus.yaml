name: 塔西佗
aliases: [科尔涅利乌斯·塔西佗, 塔西陀, 塔西图斯]
role: 历史学家、元老
summary: 罗马历史学家，著《编年史》《历史》《日耳曼尼亚志》《阿古利可拉传》。
body: |-
  塔西佗约生于公元 56 年，出生地不详，有人推测在高卢南部或意大利北部。他年轻时在罗马学演说，77 年娶了阿古利可拉的女儿。他自己在《历史》开头说，他的仕途始于韦斯巴芗，经提图斯提拔，在图密善手下走得更远。88 年他任裁判官，97 年任补任执政官，100 年与小普林尼一同在元老院控告贪赃的阿非利加总督，112 年前后出任亚细亚总督，这一任有小亚细亚出土的铭文为证。卒年不详，从《编年史》里提到的事推断，他活到了图拉真末年以后。

  98 年他发表两种短篇：《阿古利可拉传》为岳父立传，兼写不列颠；《日耳曼尼亚志》记莱茵河以东各部族的风俗和分布，是关于早期日耳曼人最重要的文献。稍后有《关于演说家的对话》，讨论演说术为何衰落。

  他的两部大书，先写的《历史》记公元 69 年到 96 年，现存前四卷和第五卷的开头，只到 70 年；后写的《编年史》从奥古斯都去世记到尼禄之死，现存提比略一朝的大半、克劳狄后期和尼禄朝到 66 年为止。两书原来合计三十卷。前六卷《编年史》靠九世纪的一部抄本才传下来。

  他在《编年史》开篇说自己写史“不怀愤恨，也不偏袒”。他的文字简短冷峻，善于写人物心里的盘算，对皇帝治下元老的屈从和告密之风尤其痛切，对提比略、图密善的描绘明显带着成见。《编年史》卷 15 第 44 章讲尼禄嫁祸基督徒时提到，“基督”在提比略年间被总督本丢·彼拉多处死，这是教会以外最早提到耶稣受死的记载之一。
sources: []
recalled:
  - 塔西佗《历史》卷 1 第 1 章
  - 塔西佗《编年史》卷 1 第 1 章、卷 15 第 44 章
  - 小普林尼《书信集》卷 2 第 1、11 封
  - 米拉萨出土铭文（亚细亚总督任）
