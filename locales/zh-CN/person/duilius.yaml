name: 杜伊利乌斯
aliases: [盖乌斯·杜伊利乌斯, 杜伊留斯]
role: 罗马执政官
summary: 罗马执政官，在米莱海战中用“乌鸦”吊桥击败迦太基，赢得罗马首次海战胜利。
body: |-
  盖乌斯·杜伊利乌斯，罗马平民出身的将领，生卒年不详，公元前 260 年任执政官，是罗马第一个取得海战胜利的人。

  第一次布匿战争开始时，罗马没有像样的舰队。据波利比乌斯，罗马人以一艘搁浅的迦太基五列桨战船为样板，在两个月内造出一百艘五列桨船和二十艘三列桨船，桨手先在岸上的架子上练习。前 260 年，同僚执政官格奈乌斯·科尔内利乌斯·西庇阿率先遣船只在利帕里被俘，原本指挥陆军的杜伊利乌斯接管舰队。

  罗马船笨重，水手生疏。为了扬长避短，罗马人在船头装了一种带铁钉的吊桥，士兵叫它“乌鸦”：靠近敌船时放下，铁钉扎进对方甲板，步兵即可冲过去，把海战变成陆战。在西西里北岸的米莱，迦太基舰队有一百三十艘船，轻敌直进，结果被“乌鸦”钩住；据波利比乌斯，迦太基损失了五十艘船，包括旗舰。

  他举行了罗马第一次海战凯旋式，广场上立起一根装饰着敌船撞角的石柱，柱上的铭文有帝国时期的重刻本留存。据说他此后终身享有一项荣誉：晚宴归来时有火炬手和吹笛人引路。前 258 年他任监察官，前 231 年任主持选举的独裁官，此后不见记载。
sources: []
recalled:
  - 波利比乌斯《历史》卷一第 20—24 章
  - 西塞罗《论老年》第 44 节
  - 杜伊利乌斯纪功柱铭文
