name: 沈括
aliases: [沈存中, 梦溪丈人]
role: 北宋科学家、官员
summary: 北宋科学家、官员，参与变法，晚年著《梦溪笔谈》，记载了活字印刷、磁偏角等发现。
body: |-
  沈括是杭州钱塘人，生于天圣九年（公元 1031 年），少年时随父亲到各地任所，见闻很广。嘉祐八年（1063 年）他考中进士，此后在朝中编校昭文馆书籍，开始研究天文历算。

  熙宁年间他支持王安石变法，参与察访两浙农田水利、整顿盐法等事务，又提举司天监，改进浑仪、浮漏等天文仪器，主持编制《奉元历》。熙宁八年（1075 年）辽朝派使者来争河东边界，他查阅档案，找出原来议定的边界文书，随后出使辽朝，据理力争，维护了宋朝的立场。他后来任三司使，主管全国财政。元丰三年（1080 年）他出任延州知州兼鄜延路经略安抚使，在西北抵御西夏。元丰五年（1082 年）徐禧主持修筑的永乐城被西夏攻破，沈括因救援不力被贬（另见“宋伐西夏与永乐城之战”条）。

  元祐年间他移居润州，在城东的梦溪园中度过晚年，写成《梦溪笔谈》。这部笔记内容涉及天文、历法、数学、地理、地质、物理、医药、工艺和文史掌故等方面。书中记录了布衣毕昇发明的泥活字印刷术（另见“毕昇发明活字印刷”条）；记载了用磁石磨针制作指南针的方法，并指出磁针“常微偏东，不全南也”，这是关于地磁偏角的较早记录；他把延州一带出产的“脂水”命名为“石油”；又根据太行山崖间的螺蚌壳化石，推断那里古代曾是海滨。他还首创“隙积术”“会圆术”等数学方法，主张以节气定月的“十二气历”。绍圣二年（1095 年）他在润州去世。
sources: []
recalled:
  - 《宋史·沈括传》
  - 沈括《梦溪笔谈》
  - 《续资治通鉴长编》卷二百六十二
