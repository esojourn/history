name: 小西庇阿
aliases: [ 西庇阿·埃米利安努斯, 小阿非利加努斯 ]
role: 罗马统帅
summary: 大西庇阿过继之孙。公元前 146 年攻毁迦太基。
body: |-
  全名普布利乌斯·科尔内利乌斯·西庇阿·埃米利安努斯，公元前 185 或前 184 年生，是埃米利乌斯·保卢斯的次子，过继给大西庇阿的儿子，因而成为大西庇阿的孙辈。前 168 年他约十七岁，随生父参加彼得那战役。此后被带到罗马的希腊人波利比乌斯与他结交，波利比乌斯在《历史》里记下了两人订交的经过。

  前 151 年他自请到西班牙任军团长官。第三次布匿战争开始后，他在迦太基城下的军中任职，因战功被选为前 147 年的执政官，当时他还不到法定年龄。前 146 年春他攻破迦太基。据阿庇安转述波利比乌斯的记载，他望着燃烧的城市落泪，念了荷马史诗中预言特洛伊终将陷落的诗句。

  前 142 年他任监察官。前 134 年再任执政官，受命结束西班牙的努曼提亚战争，次年围困迫降该城并将其夷平。回到罗马后，他反对提比略·格拉古一派的土地委员会。前 129 年的一个早晨，他被发现死在家中床上，死因当时就有猜疑，阿庇安和普鲁塔克都说没有定论。
sources:
  - 波利比乌斯《历史》卷三十一第 23—30 章（与波利比乌斯订交）；卷三十五第 4 章；卷三十八第 19—22 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/31*.html
  - 普鲁塔克《埃米利乌斯传》第 22 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Aemilius*.html
  - 英文维基百科“Scipio Aemilianus”（核对年份） https://en.wikipedia.org/wiki/Scipio_Aemilianus
recalled:
  - 阿庇安《罗马史·布匿战争》第 98—135 章；《西班牙战争》第 84—98 章；《内战史》卷一第 19—20 章
