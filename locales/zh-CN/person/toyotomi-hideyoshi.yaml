name: 丰臣秀吉
aliases: [羽柴秀吉, 太阁]
role: 日本战国时代的统一者
summary: 出身微贱，继织田信长之后统一日本，任关白、太阁，两度出兵侵略朝鲜，与明朝交战。
body: |-
  丰臣秀吉出生于尾张国中村（今日本名古屋市），出身低微，生年一般认为是 1537 年，另有 1536 年之说。他早年投奔织田信长，从杂役做起，因机敏能干逐渐升为大将，改名羽柴秀吉。1582 年织田信长在本能寺之变中被部将明智光秀所杀，秀吉迅速回师击败明智光秀，此后在织田家诸将的争斗中胜出，以大阪城为根据地。

  1585 年他就任关白，次年获赐“丰臣”姓。此后他相继平定四国、九州，1590 年攻灭关东的北条氏，奥州诸大名也纷纷归附，日本结束了百余年的战国割据局面。他在国内推行“太阁检地”，丈量全国土地，又颁布“刀狩令”，收缴农民的武器，确立了兵农分离的制度。1591 年他把关白之位让给外甥丰臣秀次，自称太阁。

  统一日本后，秀吉企图征服明朝，要求朝鲜为日军让路，遭到拒绝。1592 年（明万历二十年，朝鲜称壬辰年）他派十余万大军渡海进攻朝鲜，日军很快攻占汉城、平壤。朝鲜向明朝求救，明朝派兵入朝，次年收复平壤，日军退守朝鲜南部，双方开始议和。1596 年明朝使者到日本册封秀吉为“日本国王”，秀吉不满明朝的条件，和议破裂，1597 年再次出兵朝鲜（另见“万历三大征”条）。1598 年秀吉在伏见城病逝，日军随即撤出朝鲜。他死后，德川家康在 1600 年的关原之战中取得胜利，1615 年丰臣家在大阪之役中灭亡。
sources: []
recalled:
  - 《明史·日本传》
  - 《明神宗实录》
  - 小濑甫庵《太阁记》
