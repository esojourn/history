name: "库尔"
aliases: ["安托万·库尔"]
role: "法国改革宗教会的恢复者"
summary: "“旷野教会”的组织者，1715 年召开地下会议重建教会，在洛桑办学培养传道人。"
body: |-
  库尔 1695 年生于法国维瓦莱地区的新堡贝格（一说 1696 年）。《历史的轨迹》第三十九章说，他五岁丧父，坚毅的母亲按先夫的信仰教养他，很小就带他去参加胡格诺派的秘密聚会，他青年时就立志传福音。

  该书说，路易十四 1715 年去世后，逼迫一度停止，1724 年又以新的气势爆发。“旷野”教会在逼迫中仍在成长，但毫无组织。库尔走访各地分散的信徒，1715 年 8 月召集了一次会议（地点在塞文山区的莫诺布莱附近），他当时才二十岁，没进过大学，靠自修学成，他立刻成为胡格诺派的领袖，被誉为“法国改革宗教会的恢复者”。

  该书说，逼迫夺走了所有牧师，而改革宗的传统不许平信徒讲道，只能暂时让读过神学的学生讲道。会众通过库尔和科尔德兹两人有资格作讲员；年长的科尔德兹被送到瑞士受按立，回来后再按立库尔。为培养传道人，库尔在瑞士洛桑办了一间神学院，那里是法国官府鞭长莫及之处；该书说是 1730 年，一般记载为 1726 年前后开办。学校只有一间二楼的课室，因为毕业回国的人迟早会殉道，被称为“死亡学校”。

  他晚年定居洛桑，1760 年在那里去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
recalled:
  - "库尔《塞文战争史》"
