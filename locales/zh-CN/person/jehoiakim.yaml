name: 约雅敬
aliases:
  - 以利亚敬
role: 南国犹大王
summary: 约西亚之子，由埃及法老所立，后臣服巴比伦又背叛，曾焚烧耶利米的书卷。
body: |-
  犹大王约西亚的儿子，原名以利亚敬，母亲名叫西布大。约西亚死后，国民先立了他的兄弟约哈斯；三个月后法老尼哥废了约哈斯，立以利亚敬作王，给他改名叫约雅敬（《列王纪下》23:31–34）。据 23:36，他登基时二十五岁，在耶路撒冷作王十一年。他照法老的命令向国民征取金银，交给法老（23:35）。

  据 24:1–2，巴比伦王尼布甲尼撒上来，约雅敬服事他三年，然后背叛；迦勒底、亚兰、摩押和亚扪人的军队于是来攻击犹大。《耶利米书》多处提到他：22:13–19 责备他建造宫殿而不给工价；26:20–23 记他派人把逃到埃及的先知乌利亚带回来杀掉；第 36 章记载，文士巴录把耶利米口述的话写成书卷，在圣殿里宣读，书卷后来被拿到王面前念，王坐在过冬的房屋里，每听三四篇就用刀割下，扔进火盆烧掉，又下令捉拿巴录和耶利米。

  关于他的结局，各处记载不一。《列王纪下》24:6 只说他与列祖同睡；《历代志下》36:6 说尼布甲尼撒用铜链锁着他，要把他带到巴比伦去；《耶利米书》22:19 则预言他被埋葬好像埋驴一样。他的卒地因此不能确定。他的儿子约雅斤接续作王，三个月后耶路撒冷向尼布甲尼撒投降，巴比伦的编年史把这事记在公元前 597 年。
sources: []
recalled:
  - 《列王纪下》23:34—24:7
  - 《历代志下》36:4–8
  - 《耶利米书》第 22、26、36 章
  - 巴比伦编年史（尼布甲尼撒二世早年部分）
