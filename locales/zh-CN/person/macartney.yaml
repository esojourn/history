name: 马戛尔尼
aliases: [乔治·马戛尔尼]
role: 英国外交官，访华使团正使
summary: 英国外交官，1793 年率使团来华，在热河觐见乾隆帝，提出通商要求被拒。
body: |-
  马戛尔尼出生于爱尔兰阿尔斯特地区安特里姆郡的一个苏格兰裔家庭，早年在都柏林三一学院读书。1764 年他出使俄国，谈判通商条约，此后任英国驻爱尔兰的官员、加勒比海格林纳达总督，1780 年至 1785 年任印度马德拉斯总督。

  十八世纪后期，英国对华贸易发展很快，但清朝只允许西方商人在广州一地通商，由行商垄断，英国商人对种种限制十分不满。1792 年英国政府派马戛尔尼为正使，以给乾隆帝祝寿为名出使中国。使团有七百多人（各书说法不一），携带天文仪器、钟表、枪炮、马车等礼品，乘船经天津到达北京，1793 年九月到热河避暑山庄觐见乾隆帝。

  使团在觐见礼节上与清朝发生了争执，清朝要求行三跪九叩礼，马戛尔尼坚持只行单膝下跪礼，最后的结果中英双方的记载不一致。马戛尔尼提出的要求包括：准许英国商人在宁波、舟山、天津等地贸易，在北京设立商馆，在舟山附近给予一个小岛供英国商人居住，减免关税等。乾隆帝在给英王乔治三世的敕谕中一一拒绝，称“天朝物产丰盈，无所不有，原不藉外夷货物以通有无”（另见“马戛尔尼使团”条）。

  使团从北京沿运河南下，经杭州到广州，1794 年回到英国。马戛尔尼在日记中记下了他对清朝的观察，认为清朝像一艘“破旧的头等战舰”。此后他又出使意大利，任好望角殖民地总督，1806 年在伦敦附近去世。
sources: []
