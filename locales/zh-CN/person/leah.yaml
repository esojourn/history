name: 利亚
aliases: []
role: 雅各之妻
summary: 拉班的大女儿，雅各的妻子，流便、西缅、利未、犹大等人的母亲。
body: |-
  拉班的大女儿，拉结的姐姐。圣经没有记她的生年和卒年。《创世记》29:17 提到她的眼睛，原文那个词的意思，各译本的理解有出入。雅各为娶拉结服事拉班七年，到成亲的晚上，拉班把利亚送去；早晨雅各才发觉，拉班说当地没有大女儿还没有给人、先把小女儿给人的规矩。拉班把婢女悉帕给她作使女（29:21—26）。

  创 29:31 记耶和华见她失宠，就使她生育。她先后生了流便、西缅、利未、犹大，后来又生以萨迦、西布伦和女儿底拿；她的使女悉帕给雅各生了迦得、亚设（29:32—35、30:9—21）。雅各要离开拉班时，她和拉结都赞成同去（31:14—16）。

  圣经没有记她去世的时间和地点。雅各在埃及临终时说，他已把利亚葬在麦比拉洞，就是亚伯拉罕、撒拉、以撒、利百加所葬之处（49:31），按此她死在雅各下埃及之前。《路得记》4:11 把她和拉结并提，说她们二人建立了以色列家。
sources: []
recalled:
  - 《创世记》第 29—31 章、49:31
  - 《路得记》4:11
