name: 孙武
aliases: [孙子, 孙武子, 兵圣]
role: 军事家
summary: 春秋末年齐国人，以兵法求见吴王阖闾，被任为将；相传是《孙子兵法》的作者。
body: |-
  孙武是春秋末年的军事家，生卒年不详。据《史记·孙子吴起列传》，孙武是齐国人，带着他所著的兵法十三篇求见吴王阖闾。阖闾想试试他的本领，让他操练宫中的美女。孙武把一百八十名宫女分为两队，以吴王的两名宠姬为队长，三令五申之后宫女仍然嬉笑，孙武说“约束不明，申令不熟，将之罪也；既已明而不如法者，吏士之罪也”，坚持斩了两名队长。此后宫女都依令而行。阖闾由此知道他善于用兵，任他为将。

  《史记》说吴国“西破强楚，入郢，北威齐晋，显名诸侯，孙子与有力焉”。不过，《左传》详细记载了吴楚之战，却没有提到孙武，因此宋代以来有学者怀疑孙武其人，或认为《孙子兵法》是战国时的作品。1972 年山东临沂银雀山汉墓同时出土了竹简本的《孙子兵法》和《孙膑兵法》，证明两者是不同的书，《史记》所说的孙武和孙膑各有兵法，是可信的。

  《孙子兵法》十三篇论述了战争的基本规律，强调“知彼知己，百战不殆”“不战而屈人之兵”“兵者，诡道也”，重视谋略、地形和后勤，是中国现存最早、影响最大的兵书，在世界上也广为流传。孙武的结局史书没有记载。

  后世尊称他为“孙子”，又称“兵圣”。
sources: []
recalled:
  - 《史记·孙子吴起列传》
  - 《孙子兵法》
  - 银雀山汉墓竹简
