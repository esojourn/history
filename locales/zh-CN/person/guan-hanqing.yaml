name: 关汉卿
aliases: [已斋叟]
role: 杂剧作家
summary: 元代杂剧作家，“元曲四大家”之首，代表作有《窦娥冤》《救风尘》《单刀会》等。
body: |-
  关汉卿号已斋叟，生卒年都不详，一般认为生于金末，主要活动在元朝前期。据元人钟嗣成《录鬼簿》，他是大都人，曾任太医院尹，此外还有祁州、解州人等说法，太医院尹一事也有学者怀疑。他晚年到过南方的杭州等地。

  关汉卿长期生活在大都，与杂剧演员、作家来往密切，相传他“躬践排场，面敷粉墨”，亲自登台演出。他是元代最多产的杂剧作家，据《录鬼簿》著录有六十多种，今存十几种，其中有几种的作者归属有争议。

  他的作品题材广泛，多写社会下层，尤其是妇女的遭遇。《窦娥冤》写孝顺的寡妇窦娥被无赖诬陷、被贪官屈斩，临刑前发下血溅白练、六月飞雪、亢旱三年的誓愿，后来一一应验，是中国古代悲剧的代表作。《救风尘》写妓女赵盼儿设计救出受骗的姐妹，《望江亭》写谭记儿智斗权贵，《单刀会》写关羽单刀赴会的故事。他的散曲《南吕·一枝花·不伏老》自称“我是个蒸不烂、煮不熟、捶不匾、炒不爆、响珰珰一粒铜豌豆”，常被用来说明他的性格。

  关汉卿与马致远、郑光祖、白朴并称“元曲四大家”，排在首位。他的作品语言本色自然，结构紧凑，对后世戏曲影响很大。明代臧懋循编的《元曲选》收录了他的多种作品。
sources: []
recalled:
  - 钟嗣成《录鬼簿》
  - 熊自得《析津志》
  - 臧懋循《元曲选》
