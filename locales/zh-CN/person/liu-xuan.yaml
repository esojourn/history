name: 更始帝
aliases: [刘玄, 刘圣公]
role: 更始政权皇帝
summary: 汉朝宗室，被绿林军诸将立为皇帝，年号更始，灭王莽后入主长安，两年后败于赤眉被杀。
body: |-
  据《后汉书·刘玄刘盆子列传》，刘玄字圣公，南阳蔡阳人，是刘秀的族兄。他的弟弟被人杀害，他结交宾客想要报仇，宾客犯了法，他为躲避官府逃到平林。地皇三年（公元 22 年）平林人陈牧等聚众响应绿林军，他前去投奔，后来被称为更始将军。

  次年二月，绿林诸将商议拥立一位刘氏宗室。将领们不愿立声望高而治军严的刘縯，选中了没有自己兵力的刘玄，在淯水边设坛，立他为皇帝，年号更始。列传说他面对群臣羞愧流汗，举着手说不出话。昆阳之战后，他借故杀了刘縯。同年，他的军队分别攻下雒阳和长安，王莽被杀。他先迁到雒阳，更始二年（24 年）又迁都长安。

  到长安后，他把将领们都封为王，自己纳了赵萌的女儿，把政事交给赵萌，日夜在后宫饮酒。列传说他滥授官爵，长安人编了“灶下养，中郎将；烂羊胃，骑都尉”的歌谣来讥讽。派往河北的刘秀此时已经自立，赤眉军也从东方向关中进发，他手下的将领则互相攻杀。

  更始三年（25 年）九月赤眉军攻入长安，他只身出逃，不久投降，交出玺绶，被封为长沙王。赤眉将领担心有人再拥立他，不久派人把他勒死。
sources: []
recalled:
  - 《后汉书·刘玄刘盆子列传》
  - 《资治通鉴》卷三十九、四十
