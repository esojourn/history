name: 韦皋
aliases: [韦城武, 南康郡王]
role: 西川节度使
summary: 唐德宗时镇守西川二十一年，招抚南诏，联合南诏屡次击败吐蕃。
body: |-
  韦皋字城武，京兆万年人，天宝四载（公元 745 年）生。建中四年（783 年）泾原兵变时，他在陇州拒绝了朱泚的招诱，因功受到唐德宗的赏识。贞元元年（785 年）他被任命为剑南西川节度使，镇守成都，前后二十一年。

  当时南诏依附吐蕃，与吐蕃联兵侵扰西川。他采取招抚南诏、孤立吐蕃的方针，多次写信给南诏王异牟寻。贞元十年（794 年），他派崔佐时到南诏，与异牟寻在点苍山会盟，南诏重新归附唐朝（另见“南诏归唐”条）。此后他联合南诏，多次出兵进攻吐蕃，贞元十七年（801 年）大破吐蕃军，俘获吐蕃大将论莽热，因功封南康郡王。

  他在西川期间重赋厚敛，用来犒赏军队和进奉朝廷，也受到一些批评。永贞元年（805 年）王叔文主政，他派人求兼领三川，被王叔文拒绝，于是上表请太子监国，参与了迫使顺宗让位的行动。同年八月他在成都去世，年六十一。
sources: []
recalled:
