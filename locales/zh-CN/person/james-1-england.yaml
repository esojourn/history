name: "詹姆士一世"
aliases: ["詹姆士六世", "雅各一世"]
role: "英格兰与苏格兰国王"
summary: "玛丽·斯图亚特之子，1603 年继伊丽莎白为英格兰王，敕令翻译英王钦定本圣经。"
body: |-
  詹姆士是苏格兰女王玛丽·斯图亚特之子，1566 年生于爱丁堡城堡，次年母亲被迫退位，他一岁即位为苏格兰王詹姆士六世，由长老派的摄政抚养长大。1603 年伊丽莎白去世无嗣，他以外孙辈的血统继承英格兰王位，称詹姆士一世，两国从此共一个君主。

  《历史的轨迹》第三十二章说，他上任时清教徒立刻联名请愿，提出各项要求，于是在国王面前召开了主教与清教徒的会议。这次会议（1604 年的汉普顿宫会议）没有通过清教徒的要求，却决定出版一本新译圣经，即 1611 年的英王钦定本。该书说，这次会议是安立甘派大获全胜，规定清教徒和分离派一律服从。据一般记载，他在会上说过“没有主教，就没有国王”。

  他在位期间分离派信徒多逃往荷兰，1620 年其中一部分乘五月花号去了北美。1625 年他在西奥博尔兹宫去世，子查理一世继位。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
recalled:
  - "英王钦定本圣经卷首译者献辞（1611 年）"
