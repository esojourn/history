name: 李林甫
aliases: [哥奴, 晋国公]
role: 宰相
summary: 唐玄宗后期的宰相，执政十九年，排斥异己，阻塞言路，建议多用胡人将领镇守边疆。
body: |-
  李林甫是唐朝宗室，小字哥奴，曾祖父是唐高祖的堂弟长平王李叔良。他精通音律，善于揣摩上意，与宦官和后宫交结，据说得到玄宗宠妃武惠妃的支持。开元二十二年（公元 734 年）他任宰相，开元二十四年（736 年）张九龄罢相后，他任中书令，此后独掌朝政，直到去世，前后十九年。

  他为相期间，凡是才能和声望在他之上、受到玄宗信任的大臣，都设法排挤。《资治通鉴》说他对人表面上甜言蜜语，暗中却加以陷害，世人说他“口有蜜，腹有剑”，这就是成语“口蜜腹剑”的由来。据《资治通鉴》，他曾告诫谏官们说，你们看见宫中仪仗用的马吗，整天不出声便能吃到上等草料，一旦嘶鸣就会被赶出去。天宝六载（747 年）玄宗下诏广求人才，他让考官一个人也不录取，然后上表祝贺“野无遗贤”，杜甫、元结都在这次考试中落选。他多次兴起大狱，太子李亨的妃族和亲信多受牵连。

  据《资治通鉴》，他为了防止边将入朝为相，向玄宗建议多用胡人将领，理由是胡人勇猛善战，又不通文字，不会威胁到宰相的地位。此后安禄山、哥舒翰、高仙芝等人都担任了节度使。史家常把这一建议视为安史之乱的远因之一。他主持修成的《唐六典》记载了唐代的官制。

  天宝十一载（752 年）十一月他去世，年七十。杨国忠继任宰相后，与安禄山一起诬告他曾与叛将阿布思谋反，玄宗下令削去他的官爵，剖开棺材取出陪葬的珠玉，改用小棺以庶人之礼安葬，子孙也被流放。
sources: []
recalled:
  - 《旧唐书·李林甫传》
  - 《新唐书·李林甫传》
  - 《资治通鉴》卷二百一十四至二百一十六
