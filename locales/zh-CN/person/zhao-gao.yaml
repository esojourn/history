name: 赵高
aliases: []
role: 中车府令、丞相
summary: 秦中车府令，沙丘改立胡亥，二世时专权，杀二世后被子婴所杀。
body: |-
  赵高的生年和籍贯史无明文。《史记·蒙恬列传》说他是赵国宗室的远支，兄弟数人“皆生隐宫”，母亲受过刑罚，世代卑贱。秦王听说他办事得力、通晓狱法，提拔为中车府令；他又私下侍奉公子胡亥，教他断狱。赵高曾犯大罪，蒙毅依法判他死刑，始皇赦免了他，恢复官爵。

  始皇三十七年（公元前 210 年）出巡，赵高以中车府令兼行符玺令事随行。始皇在沙丘去世，给扶苏的玺书还在赵高手里没有发出。据《李斯列传》，赵高先说动胡亥，再说服丞相李斯，伪造诏书立胡亥为太子，赐扶苏、蒙恬死。二世即位后他任郎中令，劝二世诛杀大臣和诸公子，蒙恬、蒙毅兄弟都死于此时。此后他诬告李斯谋反，李斯被腰斩，他接任中丞相，“事无大小辄决于高”。

  据《秦始皇本纪》，二世三年（前 207 年）八月，赵高向二世献鹿而称之为马，借此试探群臣，“指鹿为马”即出于此。不久他让女婿咸阳令阎乐带兵进入望夷宫，逼二世自杀，改立二世兄子子婴为秦王。子婴称病不去宗庙，赵高亲自来请，被子婴刺杀于斋宫，并夷三族。
sources:
  - 《史记·蒙恬列传》 https://zh.wikisource.org/wiki/史記/卷088
  - 《史记·李斯列传》 https://zh.wikisource.org/wiki/史記/卷087
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
