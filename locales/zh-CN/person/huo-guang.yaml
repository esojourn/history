name: 霍光
aliases: [霍子孟, 博陆侯, 大司马大将军]
role: 大司马大将军
summary: 霍去病的异母弟，受武帝遗诏辅佐昭帝，废昌邑王、立宣帝，执掌朝政近二十年。
body: |-
  据《汉书·霍光金日磾传》，霍光字子孟，河东平阳人，是霍去病同父异母的弟弟。霍去病出征途中经过平阳，与父亲霍仲孺相认，回师时把十几岁的霍光带到长安。霍光先任郎官，后来做到奉车都尉、光禄大夫，在武帝身边二十余年，本传说他出入宫禁小心谨慎，没有出过差错。

  武帝晚年决定立幼子刘弗陵，让人画了一幅周公背负成王接受诸侯朝见的图赐给霍光。后元二年（公元前 87 年）武帝临终，任命他为大司马大将军，与金日磾、上官桀、桑弘羊同受遗诏辅政。昭帝即位时只有八岁，政事都由霍光决定。上官桀的孙女同时是霍光的外孙女，被立为皇后；但两家后来争权，上官桀父子与桑弘羊、鄂邑长公主和燕王刘旦联合，先是上书诬告霍光，后又图谋设宴伏杀他、废昭帝。元凤元年（前 80 年）事情泄露，上官桀等人都被处死。

  元平元年（前 74 年）昭帝去世，没有儿子。霍光迎立武帝的孙子昌邑王刘贺，二十七天后又以行为淫乱为由，率群臣奏请太后把他废黜，改立流落民间的武帝曾孙刘病已，即宣帝。宣帝即位后霍光表示归政，宣帝不接受，一切事务仍先报告霍光。本传说宣帝初次谒见高庙时由霍光陪乘，感到“若有芒刺在背”。

  他执政期间延续武帝末年的方针，减轻赋役，对匈奴以防守和分化为主。地节二年（前 68 年）他病逝，葬礼规格极高。他的妻子霍显此前曾指使女医毒杀宣帝的许皇后，使自己的女儿当上皇后。霍光死后，宣帝逐步收回霍氏子弟的兵权。地节四年（前 66 年），霍家图谋废立的计划败露，被灭族，霍皇后也被废。
sources: []
recalled:
  - 《汉书·霍光金日磾传》
  - 《汉书·外戚传上》
  - 《资治通鉴》卷二十三至二十五
