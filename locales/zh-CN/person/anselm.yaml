name: 安瑟伦
aliases:
  - 坎特伯雷的安瑟伦
  - 安瑟莫
role: 坎特伯雷大主教、神学家
summary: 贝克修道院院长、坎特伯雷大主教，以“信仰寻求理解”著称，著《神何以成为人》。
body: |-
  安瑟伦 1033 年生于意大利西北阿尔卑斯山下的奥斯塔。他年轻时与父亲不和，离家北上，1060 年进了诺曼底的贝克修道院，跟院长兰弗朗克学习，后来接任副院长，1078 年任院长。

  在贝克的三十多年里，他写了《独白》和《宣讲》。他把自己的做法称为“信仰寻求理解”：不是为了信才去理解，而是因为信，所以想要理解所信的。《宣讲》里提出一个著名的论证：神是“无法设想比他更大的”那一位，这样的一位不能只存在于思想里，否则就可以设想一位更大的。当时就有修士写文章反驳，后世的哲学家对这个论证一直争论不休。

  1093 年他被立为坎特伯雷大主教。英王威廉二世占着教会的产业，又不让他承认教皇乌尔班二世，1097 年他离开英格兰。流亡期间他写成《神何以成为人》，说人的罪亏欠了神的荣耀，这笔亏欠人当还而还不起，只有神能还，所以必须有一位又是神又是人的来代人补偿。这个讲法成为西方教会解释基督之死的主要思路。

  1100 年新王亨利一世请他回国，他根据罗马会议的决定，拒绝向国王行臣服礼，也不肯祝圣由国王授职的主教，再度流亡。1107 年双方在伦敦和解：国王不再用戒指和权杖授职，主教为所领的土地向国王效忠。十五年后的《沃尔姆斯协定》用的是同样的办法。

  他于 1109 年 4 月 21 日在坎特伯雷去世。《历史的轨迹》第十八章把他列在十二世纪以后大学里讲授经院哲学的名师之首；他本人是修道院里的教师，去世在大学兴起之前，后人称他为经院哲学的先驱。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
recalled:
  - 安瑟伦《独白》《宣讲》《神何以成为人》
  - 爱德玛《安瑟伦传》《英格兰近事史》
