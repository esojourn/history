name: 王审知
aliases: [王信通, 闽太祖, 开闽王]
role: 闽王
summary: 光州固始人，随兄入闽，据有福建，909 年受封闽王，治闽近三十年，境内安定。
body: |-
  王审知是光州固始人，咸通三年（公元 862 年）生，字信通。唐末寿州人王绪聚众起事，攻占光州，王审知和哥哥王潮、王审邽都在军中。光启元年（885 年），王绪率众南下进入福建，后来猜忌部下，被王潮等人废黜，众人推王潮为首领。景福二年（893 年），王潮攻下福州，据有福建全境，唐朝任命他为福建观察使。

  乾宁四年（897 年）王潮去世，王审知继任，后来任威武军节度使。开平三年（909 年），后梁封他为闽王。他终身没有称帝，始终向中原王朝称臣纳贡。据宋人记载，有人劝他称帝，他说宁可做个开门的节度使，也不做闭门的天子。

  王审知治闽近三十年，在境内轻徭薄赋，保境息民。中原战乱，不少士人南下避难，他加以招纳任用，又设立学校教育当地子弟。他还开辟福州的甘棠港，发展海上贸易，招来外国商船。福建的经济和文化在这一时期有了较大的发展（另见“王审知治闽”条）。后世福建民间尊称他为“开闽王”，福州至今有纪念他的祠庙。

  同光三年（925 年），王审知在福州去世。此后他的儿子们互相残杀，长子王延翰、次子王延钧先后为王，王延钧于 933 年称帝。闽国政局从此长期混乱，后晋开运二年（945 年）被南唐所灭。
sources: []
