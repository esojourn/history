name: 刘晏
aliases: [刘士安]
role: 理财大臣
summary: 唐代宗时主管财政，整顿漕运、改革盐法，恢复了战乱后的朝廷财源，后被杨炎陷害而死。
body: |-
  刘晏字士安，曹州南华人，生年一般作开元四年（公元 716 年），另有 718 年之说。开元十三年（725 年）唐玄宗封禅泰山，他年纪幼小就献上颂文，被授予太子正字，以神童闻名，后世的《三字经》也提到这件事。此后他在地方任职，以精明干练著称。

  安史之乱后，北方残破，朝廷的粮食和钱财主要靠江淮供给，但汴河淤塞，漕运中断。广德二年（764 年）前后，唐代宗命他主持漕运和财政。他疏浚汴河，改为分段转运：江船不入汴河，汴船不入黄河，河船不入渭水，在各河交接处建仓储粮，再用雇来的船工运送，减少了损耗和民间的徭役，关中的粮食供应由此恢复。

  他又改革盐法，在产盐区设官收购亭户所产的盐，加价卖给商人，任其运销，只在产地征收一次专卖收入，并在偏远地区设常平盐，防止盐商哄抬价格。据《新唐书·食货志》，他刚接手时盐利每年只有四十万缗，到大历末年增加到六百余万缗，占天下赋税的一半。他在各地设巡院，用驿马快速传递各地的物价和年成，以便调剂粮价。

  唐德宗即位后，宰相杨炎是元载的同党，而刘晏曾经参与审理元载一案，杨炎便罢去他的职务。建中元年（780 年），他被贬为忠州刺史，随即又被诬告谋反，同年七月被赐死，家中只有书籍两车、米麦几斛（据《旧唐书》）。当时人多认为他冤枉，后来朝廷为他平反。
sources: []
recalled:
  - 《旧唐书·刘晏传》
  - 《新唐书·刘晏传》
  - 《新唐书·食货志》
  - 《资治通鉴》卷二百二十三至二百二十六
