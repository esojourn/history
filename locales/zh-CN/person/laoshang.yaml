name: 老上单于
aliases: [稽粥, 老上稽粥单于]
role: 匈奴单于
summary: 冒顿之子，名稽粥。在位时杀月氏王，并大举攻入汉朝北地。
body: |-
  老上单于名稽粥，冒顿单于之子，生年不详。汉文帝前元六年（公元前 174 年）后不久冒顿去世，稽粥继立。文帝送宗室女为单于阏氏，随行的宦者中行说降于匈奴，受老上亲信。《史记·大宛列传》载，老上杀月氏王，“以其头为饮器”，月氏由此远徙。

  据《史记·匈奴列传》，文帝十四年（前 166 年）老上率十四万骑攻入朝那、萧关，杀北地都尉，候骑到达雍、甘泉，月余才退去。文帝后元二年（前 162 年）双方重订和亲。其卒年，《史记》说在约和亲“后四岁”，《汉书》作“后四年”，今人或推为前 161 年，或推为前 160 年。子军臣继立。
sources:
  - 《史记·匈奴列传》 https://zh.wikisource.org/wiki/史記/卷110
  - 《史记·大宛列传》 https://zh.wikisource.org/wiki/史記/卷123
  - 《汉书·匈奴传上》 https://zh.wikisource.org/wiki/漢書/卷094上
