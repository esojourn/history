name: 毗伽可汗
aliases: [阿史那默棘连]
role: 后突厥可汗
summary: 后突厥汗国的可汗，与唐玄宗和好互市，他和弟弟阙特勤的碑铭至今尚存。
body: |-
  毗伽可汗名阿史那默棘连，是后突厥汗国建立者骨咄禄的儿子。开元四年（公元 716 年）叔父默啜可汗被杀，他的弟弟阙特勤率兵杀死默啜的儿子和亲信，拥立他为可汗。他任用岳父暾欲谷为谋主，收拢离散的部众。

  开元八年（720 年）前后突厥与唐朝仍有交战，此后他多次遣使请和，请求以子礼事奉唐玄宗。唐朝允许在朔方的西受降城与突厥互市，每年用缣帛交换突厥的马匹。开元十九年（731 年）阙特勤去世，玄宗派使者前往吊祭，为他立碑，碑文由玄宗亲自撰写。开元二十二年（734 年）他被大臣梅录啜下毒，临死前诛杀了梅录啜的族人，随后去世。唐朝又派使者为他立碑。

  十九世纪末，这两块碑在今蒙古国鄂尔浑河流域被发现，碑上刻有汉文和古突厥文。突厥文部分以毗伽可汗、阙特勤的口吻叙述突厥的历史，是现存最早的突厥文献之一，常被称为“鄂尔浑碑铭”。
sources: []
recalled:
  - 《旧唐书·突厥传》
  - 《新唐书·突厥传》
  - 阙特勤碑、毗伽可汗碑
