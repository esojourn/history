name: 尤维纳利斯
aliases: [尤文纳尔, 德基穆斯·尤尼乌斯·尤维纳利斯, 朱文纳尔]
role: 讽刺诗人
summary: 罗马讽刺诗人，“面包和马戏”一语出自他的诗。
body: |-
  尤维纳利斯的生平几乎无从查考。他在诗里提到阿奎努姆，一般据此认为那是他的家乡。同时代只有诗人马提亚尔在三首短诗里提到他。他的诗里说到公元 100 年的一桩审判，又把 127 年的事称作“不久以前”，可知这些诗发表在图拉真和哈德良两朝。古代流传的几种小传说他因为讥刺一个得宠的演员被放逐到埃及，这些传记成书很晚，彼此矛盾，不足为据。

  他留下十六首讽刺诗，分为五卷，最后一首不全。第一首说，眼看罗马的种种怪现状，“不写讽刺诗才难”。第三首借一个朋友之口讲穷人在罗马活不下去，第六首攻击妇女，第十首讲人所祈求的财富、权势、长寿无不招祸。他只指名抨击已死的人。

  几句常被引用的话出自他的诗：民众从前授人以权柄，如今只盼着两样东西，“面包和马戏”；“谁来看守那些看守的人”；应当祈求的是“健全的心智寓于健全的身体”。
sources: []
recalled:
  - 尤维纳利斯《讽刺诗》第 1、3、6、10、15 首
  - 马提亚尔《铭辞》卷 7 第 24、91 首，卷 12 第 18 首
