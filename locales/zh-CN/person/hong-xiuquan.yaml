name: 洪秀全
aliases: [洪仁坤, 天王]
role: 太平天国的创建者
summary: 落第书生，创立拜上帝会，1851 年金田起事，建立太平天国，定都天京。
body: |-
  洪秀全是广东花县官禄㘵村人，原名仁坤，出身农家。他自幼读书，四次到广州参加科举考试都没有考中。道光十六年（1836 年）他在广州得到一本基督教的布道小册子《劝世良言》，作者是中国最早的基督教新教传教士之一梁发。道光十七年（1837 年）他第三次落第后大病一场，据他后来的说法，病中梦见被接到天上，一位老人授给他宝剑，命他斩妖除魔。

  道光二十三年（1843 年）他第四次落第后，重读《劝世良言》，认为梦中的老人就是“天父”上帝，自己是上帝的次子、耶稣的弟弟，于是与冯云山、族弟洪仁玕等人创立拜上帝会，捣毁孔子的牌位。道光二十七年（1847 年）他到广州跟美国传教士罗孝全学习了几个月的《圣经》，此后到广西桂平紫荆山区与冯云山会合，写了《原道救世歌》《原道醒世训》《原道觉世训》等，宣传人人平等、反对偶像崇拜。

  咸丰元年（1851 年）初，拜上帝会在桂平金田起事，建号太平天国，洪秀全称天王。同年在永安封杨秀清、萧朝贵、冯云山、韦昌辉、石达开为东、西、南、北、翼五王。咸丰三年（1853 年）太平军攻占南京，改称天京，定为都城（另见“太平天国”条）。此后颁布《天朝田亩制度》，分兵北伐、西征。

  定都天京后，洪秀全深居宫中，很少过问具体政务，朝政由东王杨秀清主持。咸丰六年（1856 年）发生“天京事变”，杨秀清、韦昌辉相继被杀，石达开出走，太平天国元气大伤。此后他重用自己的兄弟和族弟洪仁玕，提拔陈玉成、李秀成等青年将领。同治三年（1864 年）湘军围困天京，城中缺粮，洪秀全号召吃“甜露”（野草），六月病死，年五十岁，一说服毒自尽。一个多月后天京被湘军攻破。
sources: []
