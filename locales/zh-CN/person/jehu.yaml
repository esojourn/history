name: 耶户
aliases: []
role: 北国以色列王
summary: 以色列军长，受膏后起兵除灭亚哈全家和巴力崇拜，另立王朝。
body: |-
  约沙法的儿子、宁示的孙子（《列王纪下》9:2；这个约沙法不是犹大王约沙法），生年圣经没有记载。他原是以色列王约兰手下的军长，驻在基列的拉末。据 9:1–13，先知以利沙差一个先知门徒到那里，把膏油倒在他头上，说耶和华膏他作以色列王，要他击杀亚哈的全家；同僚的军长们就吹角拥立他。

  耶户赶车到耶斯列，开弓射死在那里养伤的约兰，叫人把尸首抛在拿伯的田里；前来探望约兰的犹大王亚哈谢逃跑时受伤，死在米吉多（9:14–29）。耶洗别也在耶斯列被扔下窗户而死。他又写信给撒玛利亚的首领和长老，他们便杀了亚哈的七十个儿子，把首级装在筐里送到耶斯列（10:1–11）。到了撒玛利亚，他假意要向巴力献大祭，把拜巴力的人都召进巴力庙，尽数杀死，拆毁了巴力的柱像和庙（10:18–28）。

  《列王纪下》10:29–31 说，耶户除灭了巴力，却没有离开耶罗波安在伯特利和但所设的金牛犊；耶和华应许他的子孙坐以色列的国位直到四代。他在位时，亚兰王哈薛攻占了约旦河以东的基列等地（10:32–33）。他在撒玛利亚作王二十八年，葬在撒玛利亚（10:35–36），儿子约哈斯接续作王。

  亚述王撒缦以色三世的黑色方尖碑上刻有“暗利之子耶户”进贡的场面，一般把这次进贡定在公元前 841 年。圣经没有记载这件事。
sources: []
recalled:
  - 《列王纪下》第 9—10 章
  - 亚述王撒缦以色三世黑色方尖碑铭文
