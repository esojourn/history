name: 马塞卢斯
aliases: [ 马尔库斯·克劳狄乌斯·马塞卢斯 ]
role: 罗马执政官
summary: 五任执政官，攻陷叙拉古；后中汉尼拔伏击阵亡。
body: |-
  全名马尔库斯·克劳狄乌斯·马塞卢斯，五次出任罗马执政官，生年与出生地史料未载。公元前 222 年他第一次任执政官，在克拉斯提狄乌姆亲手杀死高卢人的首领，把缴获的铠甲献给朱庇特，这在罗马称为“至尊战利品”。坎尼战败后，他在诺拉几次击退汉尼拔。普鲁塔克引波西多尼乌斯的话说，罗马人称费边为盾，称马塞卢斯为剑。

  前 214 年起他在西西里作战，围攻倒向迦太基的叙拉古，约在前 212 年破城，把城中的大量雕像、绘画运回罗马。前 208 年他第五次任执政官，在韦努西亚与班提亚之间带少数骑兵出营察看地形，中了汉尼拔的埋伏，当场战死。据普鲁塔克，汉尼拔下令依礼火化了他的遗体。
sources:
  - 普鲁塔克《马塞卢斯传》 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Plutarch/Lives/Marcellus*.html
  - 英文维基百科“Marcus Claudius Marcellus”（核对年份） https://en.wikipedia.org/wiki/Marcus_Claudius_Marcellus
recalled:
  - 李维《罗马史》卷二十三第 16 章；卷二十五第 23—31、40 章；卷二十七第 26—28 章
  - 波利比乌斯《历史》卷十第 32 章
