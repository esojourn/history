name: "凯波尔"
aliases: ["亚伯拉罕·凯波尔", "该伯尔"]
role: "荷兰改革宗神学家、首相"
summary: "荷兰改革宗神学家，创办自由大学，领导教会再次分离，后任首相。"
body: |-
  凯波尔 1837 年 10 月 29 日生于马斯劳斯，父亲是国家教会的牧师。《历史的轨迹》第三十九章说，他在莱顿大学读书时以一部拉丁文论著得了全国竞赛首奖，在大学里也吸收了现代主义思想。

  该书说，他毕业后到乡村贝斯德做牧师，许多会友持守传统的改革宗信仰，当面反对他的讲道，尤其一位老太太的话给他很深的印象。他于是转而认真研读加尔文的拉丁文原著，从现代主义转到加尔文主义，一生成为它的战士。此后他从贝斯德到乌得勒支，再到阿姆斯特丹的大教会；组织基督徒政党（反革命党），进入国会；1880 年按改革宗原则在阿姆斯特丹创办“自由大学”，因不受政府和教会控制而得名，自己是最出名的教授。

  该书说，1886 年他带领许多信徒脱离国家教会，这是规模第二大的一次；1892 年促成 1834 年分离出来的基督徒改革宗教会与新脱离的团体联合，组成“荷兰改革宗教会”，有七百间教会、三十万信徒。1901 至 1905 年他任荷兰首相。他还编辑周刊和日报，著作极多；1898 年到美国巡回演讲（即普林斯顿的“加尔文主义讲座”）。

  作者说他的改革方法与浸礼派、贵格派、敬虔派、循道派不同：回到原初的复原教信仰，正面反对现代主义；在教会里面做工改革教会，被排挤时才出去；极重视教义；接受政教分离，但不把政治与信仰分开，而是组织基督徒政党，把基督教原则带进教育、政治、劳工和社会各层面，而不让教会去控制政治。贝文克是他的同工。该书说他的影响远及南非、东印度、加拿大和美国。他 1920 年在海牙去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
recalled:
  - "凯波尔《加尔文主义讲座》（1898 年普林斯顿讲座）"
