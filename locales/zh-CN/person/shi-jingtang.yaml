name: 石敬瑭
aliases: [后晋高祖, 儿皇帝]
role: 后晋皇帝
summary: 后唐明宗的女婿，936 年借契丹兵灭后唐，建立后晋，割燕云十六州给契丹。
body: |-
  石敬瑭是沙陀人，景福元年（公元 892 年）生于太原。他早年在李嗣源军中，作战勇敢，深得器重，李嗣源把女儿嫁给了他。后唐明宗即位后，他官运亨通，后来出任河东节度使，镇守太原。

  明宗死后，养子李从珂夺位，与石敬瑭互相猜忌。清泰三年（936 年），李从珂调他离开太原，他拒不奉命，朝廷派大军包围太原。石敬瑭采纳桑维翰的计策，向契丹皇帝耶律德光求援，表示愿意称臣，以对待父亲的礼节侍奉契丹，并许诺事成之后割让卢龙一道和雁门关以北诸州（另见“石敬瑭割燕云十六州”条）。同年九月，耶律德光亲率骑兵南下，击败太原城下的后唐军。十一月，耶律德光在太原册立石敬瑭为大晋皇帝，史称后晋。两人随即南下，次年初李从珂自焚，后唐灭亡（另见“后晋灭后唐”条）。

  据《资治通鉴》，石敬瑭比耶律德光年长十岁，却在书信中自称儿子，每年还要向契丹输送帛三十万匹，后世因此称他为“儿皇帝”。他即位后迁都开封，对契丹始终卑辞厚礼，契丹使者到来时，他亲自在别殿拜受诏书。国内各地节度使对此多有不满，范延光、安从进、安重荣等人先后叛乱，都被镇压下去。

  天福七年（942 年），石敬瑭在邺都（魏州）病逝，侄子石重贵继位。燕云十六州的割让使中原王朝失去了长城一线的屏障，此后北宋几次想收回都没有成功，这件事对此后数百年的南北形势影响很大。
sources: []
recalled:
