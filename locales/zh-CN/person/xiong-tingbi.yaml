name: 熊廷弼
aliases: [飞白, 襄愍]
role: 辽东经略
summary: 萨尔浒之战后经略辽东，稳定了局势；后因广宁失守被处死，传首九边。
body: |-
  熊廷弼是湖广江夏（今湖北武汉江夏区）人，万历二十六年（1598 年）考中进士。万历三十六年（1608 年）他以御史的身份巡按辽东，主张修筑边墙、屯田练兵，与当时镇守辽东的李成梁意见不合。

  万历四十七年（1619 年）明军在萨尔浒大败，开原、铁岭相继失陷，熊廷弼被任命为辽东经略。他到辽阳后整顿军纪，斩杀逃将，修筑城堡，集结兵力，采取坚守的策略，辽东局势一度稳定。但他性格刚直，与朝中官员多有冲突，次年被弹劾去职，由袁应泰接任。天启元年（1621 年）后金攻陷沈阳、辽阳，袁应泰自杀，熊廷弼再次被起用为经略。

  这一次他提出“三方布置策”，主张以广宁为正面，以天津、登莱的水师牵制，但巡抚王化贞手握重兵，轻视后金，主张进攻，两人不和，朝廷又偏向王化贞。天启二年（1622 年）努尔哈赤进攻广宁，王化贞的部将叛变，广宁失守，熊廷弼与王化贞一起退入山海关。两人都被下狱论死。天启五年（1625 年）熊廷弼被处死，首级被传示九边。他的死与魏忠贤打击东林党有关。崇祯初年得到平反。
sources: []
recalled:
  - 《明史·熊廷弼传》
