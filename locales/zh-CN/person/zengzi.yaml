name: 曾子
aliases: [曾参, 子舆, 宗圣]
role: 孔子弟子
summary: 孔子晚年的弟子，以孝著称，相传传授孔子之道于子思，后世尊为“宗圣”。
body: |-
  曾子名参，字子舆，南武城人。据《史记·仲尼弟子列传》，他比孔子小四十六岁，即约生于公元前 505 年，传统说法他活了七十岁左右。他的父亲曾点（曾皙）也是孔子的弟子。

  曾子以孝闻名。《论语·学而》记他说：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”又说孔子之道“忠恕而已矣”。《论语》中记录曾子的言论较多，并尊称为“曾子”，有学者据此推测《论语》的编纂与曾子的门人有关。

  《史记》说孔子认为曾子能通孝道，“故授之业，作《孝经》”；宋代朱熹认为《大学》的经文出于孔子、传文出于曾子。这些说法都不能确证。传统上认为曾子把孔子之学传给孔子之孙子思，子思的门人又传给孟子。后世尊他为“宗圣”。
sources: []
recalled:
  - 《史记·仲尼弟子列传》
  - 《论语·学而》
  - 《论语·里仁》
