name: 刘豫
aliases: [刘彦游, 伪齐皇帝, 齐帝]
role: 金朝所立的“大齐”皇帝
summary: 北宋济南知府，降金后被立为“大齐”皇帝，屡次配合金军攻宋，八年后被金朝废黜。
body: |-
  刘豫字彦游，景州阜城（今河北阜城）人，生于熙宁六年（公元 1073 年），北宋元符年间进士，曾任殿中侍御史等职。建炎二年（1128 年）他任济南知府，金军来攻时投降。

  金朝为了在黄河以南建立缓冲，建炎四年（1130 年）立刘豫为皇帝，国号大齐，史称“伪齐”，先以大名府为都，绍兴二年（1132 年）迁都汴京。伪齐统治河南、陕西等地，赋税繁重，又多次与金军联合南侵，绍兴四年（1134 年）岳飞北伐，从伪齐手中收复了襄阳六郡；绍兴六年（1136 年）伪齐军在藕塘等地被宋军击败。金朝认为刘豫无用，绍兴七年（1137 年）将他废黜，降封蜀王，后来迁居临潢府，绍兴十六年（1146 年）去世。
sources: []
recalled:
  - 《宋史·叛臣传·刘豫》
  - 《金史·刘豫传》
