name: 汉宣帝
aliases: [刘询, 刘病已, 孝宣皇帝, 中宗]
role: 皇帝
summary: 汉武帝曾孙，幼年因巫蛊之祸入狱，长于民间，即位后整饬吏治，设西域都护，匈奴称臣。
body: |-
  刘询原名病已，是戾太子刘据的孙子。征和二年（公元前 91 年）他出生才几个月，就遇上巫蛊之祸，祖父母和父母都死于此事，他也被关进郡邸狱。负责治狱的丙吉同情这个婴儿，挑选女囚轮流哺乳，他才活下来。后来遇赦，他被送到祖母的娘家抚养，再由掖庭收养。掖庭令张贺曾是戾太子的属下，出钱供他读书，并为他聘了小吏许广汉的女儿许平君为妻。据《汉书·宣帝纪》，他年轻时喜欢游侠、斗鸡走马，常在长安附近各县走动，熟悉民间的情形和吏治的好坏。

  元平元年（前 74 年）昌邑王被废，霍光采纳丙吉等人的建议迎立他，这一年他十八岁。即位之初政事都由霍光裁决。群臣想立霍光的女儿为皇后，他下诏寻找微贱时用过的旧剑，大臣会意，立许平君为后；三年后许后被霍光之妻派人毒死。地节二年（前 68 年）霍光去世，他开始亲理政事，两年后诛灭图谋废立的霍氏。

  他重视地方官的选任，刺史、郡守、国相上任前都亲自召见询问，政绩好的增加俸禄、赐爵而不轻易调动，《汉书·循吏传》所记的黄霸、龚遂等人多出在这一朝。他又设常平仓调节粮价，多次减免赋税。本纪记太子劝他多用儒生，他回答说汉家自有制度，本来就是霸道与王道并用，不能只靠德教。

  对外，本始年间汉与乌孙合击匈奴；神爵年间赵充国平定羌人，郑吉出任第一任西域都护。匈奴内乱分裂后，呼韩邪单于于甘露三年（前 51 年）到甘泉宫朝见，自称臣属。同年他命人在麒麟阁画霍光等十一位功臣的像，又召集儒生在石渠阁讨论五经的异同。黄龙元年（前 49 年）十二月他去世，葬于杜陵。
sources: []
