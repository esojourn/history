name: 刘知远
aliases: [刘暠, 后汉高祖]
role: 后汉皇帝
summary: 沙陀人，后晋河东节度使，947 年契丹灭晋后在太原称帝，进入开封，建立后汉。
body: |-
  刘知远是沙陀人，乾宁二年（公元 895 年）生于太原。他早年在李嗣源军中，与石敬瑭同为部将。据史书，他曾在战场上把自己的马让给马匹受伤的石敬瑭，救了石敬瑭一命，从此为石敬瑭所倚重。清泰三年（936 年）石敬瑭在太原起兵，刘知远是主要的助手之一，但据《资治通鉴》，他认为向契丹称臣即可，不必许以割地和父子之礼，以免日后成为中原的祸患。

  后晋建立后，他掌管禁军，后来出任河东节度使，镇守太原，招兵买马，积蓄实力。石重贵与契丹交战期间，他按兵观望，没有全力支援。在太原期间，郭威、杨邠等人是他最倚重的助手。开运三年十二月（947 年初）契丹灭了后晋，他一面派部将王峻带着表章到开封向耶律德光称贺，一面在太原观察形势。次年二月，他在太原称帝，没有另立年号，继续使用后晋高祖的天福年号，称天福十二年。

  契丹军在中原纵兵抢掠，各地纷纷起兵反抗，耶律德光被迫北撤，途中病死。刘知远趁机率军南下，六月进入开封，改国号为汉，史称后汉（另见“后汉建立”条）。次年正月他改名刘暠，不久病重，临终把儿子刘承祐托付给苏逢吉、杨邠、史弘肇、郭威等大臣，随即去世。后汉是五代中最短的一个朝代，只有四年。
sources: []
recalled:
  - 《旧五代史·汉书·高祖纪》
  - 《新五代史·汉本纪·高祖》
  - 《资治通鉴》卷二百八十六至二百八十七
