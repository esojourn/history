name: 菩提达摩
aliases: [达摩, 达磨]
role: 禅师
summary: 从天竺来华的僧人，在北魏传授禅法，后世禅宗尊为东土初祖。
body: |-
  菩提达摩简称达摩，关于他的早期记载很少。东魏杨衒之的《洛阳伽蓝记》提到，有一位西域沙门菩提达摩，是波斯国人，自称一百五十岁，见到洛阳永宁寺的佛塔，赞叹不已，合掌多日。唐代道宣的《续高僧传》则说他是南天竺婆罗门种，从海路到达刘宋境内的南越，后来北上到了北魏，随处传授禅法，弟子有道育、慧可等人。他的教法见于弟子昙林记录的《二入四行论》，主张通过“理入”体悟众生本有的真性，通过报冤行、随缘行、无所求行、称法行四种“行入”在生活中修行。

  后世流传的许多故事，如他与梁武帝见面问答说造寺度僧“并无功德”、折一根芦苇渡过长江、在嵩山少林寺面壁九年、传衣钵给断臂求法的慧可等，大多出自唐宋时期禅宗的灯录，早期的史料中没有，学者一般把它们看作后起的传说。他的生卒年和去世的情形也有不同说法。禅宗尊他为在中国的初祖。
sources: []
recalled:
  - 杨衒之《洛阳伽蓝记》卷一
  - 道宣《续高僧传·菩提达摩传》
