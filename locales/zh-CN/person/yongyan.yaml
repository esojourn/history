name: 嘉庆帝
aliases: [颙琰, 清仁宗]
role: 清朝第七位皇帝
summary: 乾隆帝之子，亲政后诛和珅，镇压白莲教、天理教起义，力图整顿而难挽清朝的衰势。
body: |-
  颙琰是乾隆帝的第十五个儿子，乾隆三十八年（1773 年）乾隆帝秘密立他为储君，乾隆六十年（1795 年）公开册立为皇太子。次年正月乾隆帝禅位，颙琰即位，改元嘉庆，但乾隆帝以太上皇的身份继续掌权，和珅仍然把持朝政，颙琰处处谨慎。

  嘉庆四年（1799 年）正月乾隆帝去世，颙琰随即逮捕和珅，赐其自尽，开始亲政（另见“和珅之死”条）。他下诏广开言路，整顿吏治，但对和珅的党羽没有深究。当时湖北、四川、陕西一带的白莲教起义已经持续了三年，他调整部署，任用勒保、额勒登保等人，推行坚壁清野、团练乡勇的办法，到嘉庆九年（1804 年）才最终平定（另见“川楚白莲教起义”条）。这场战争耗费了大量军费，清朝的财政由此陷入困难，八旗、绿营的腐朽也暴露无遗。

  嘉庆年间，东南沿海有蔡牵等海盗活动。嘉庆十八年（1813 年）天理教首领林清派教徒攻入紫禁城，皇次子旻宁（即后来的道光帝）在宫中用鸟枪击退了教徒，嘉庆帝为此下“罪己诏”，称这是“汉唐宋明未有之事”。嘉庆二十一年（1816 年）英国派阿美士德使团来华，因觐见礼节发生争执，嘉庆帝下令将使团遣返。嘉庆二十五年（1820 年）七月他在热河避暑山庄去世，年六十一岁，皇次子旻宁继位。
sources: []
recalled:
  - 《清仁宗实录》
  - 《清史稿·仁宗本纪》
