name: 金章宗
aliases: [完颜璟, 麻达葛]
role: 金朝皇帝
summary: 金世宗之孙，在位期间文化鼎盛，击退宋朝开禧北伐，但北方蒙古开始兴起。
body: |-
  完颜璟女真名麻达葛，是金世宗的孙子，生于大定八年（公元 1168 年）。父亲完颜允恭早死，他被立为皇太孙，大定二十九年（1189 年）即位，是为金章宗，次年改元明昌。

  章宗喜好汉文化，擅长诗词书法，据说他学宋徽宗的瘦金体，几可乱真。他在位期间完善典章制度，修订律令，《泰和律义》颁行于泰和元年（1201 年），学术文化兴盛，史称“明昌之治”。但这一时期也出现了不少问题：明昌五年（1194 年）黄河在阳武决口，河道南移；北方边境的蒙古各部逐渐强大，金朝不断征发兵力修筑界壕，财政日益困难；后期外戚、宠妃李氏一族干政。泰和六年（1206 年）南宋韩侂胄发动开禧北伐，金军击退宋军并转入反攻，两国于泰和八年（1208 年）订立嘉定和议。同年十一月章宗去世，他的儿子都早夭，由叔父卫绍王完颜永济即位。
sources: []
recalled:
  - 《金史·章宗本纪》
