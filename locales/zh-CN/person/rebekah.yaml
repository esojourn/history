name: 利百加
aliases: []
role: 以撒之妻
summary: 以撒的妻子，以扫和雅各的母亲。
body: |-
  彼土利的女儿，拉班的妹妹；彼土利是亚伯拉罕的兄弟拿鹤的儿子（《创世记》22:20—23、24:29）。圣经没有记她的生年和卒年。亚伯拉罕的老仆人来到拿鹤的城，在井旁祷告求一个凭据；她出来打水，给他水喝，又为他的骆驼打水。仆人说明来意后，家里人问她，她答应同去，就到了迦南，作了以撒的妻子（第 24 章）。

  她婚后不生育，以撒为她祈求，她就怀了双胎。孩子在腹中相争，她去求问耶和华，得到的回答是两国在她腹内，将来大的要服事小的（25:21—23）。她生了以扫和雅各，偏爱雅各（25:28）。在基拉耳，以撒曾称她为妹妹（26:6—11）。

  以撒年老要给以扫祝福时，她叫雅各穿上以扫的衣服，用山羊羔皮包住手和颈项，把预备好的美味送去，使雅各得了长子的福。她听说以扫想杀雅各，就叫雅各逃到哈兰她哥哥拉班那里，又对以撒说不愿雅各娶赫人的女子（第 27 章）。此后圣经没有再记她的事，也没有记她去世；只在创 49:31 提到她葬在麦比拉洞。
sources: []
recalled:
  - 《创世记》22:20—23、第 24—27 章、49:31
