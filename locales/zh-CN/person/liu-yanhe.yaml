name: 刘勰
aliases: [刘彦和, 慧地]
role: 文学理论家
summary: 《文心雕龙》的作者，早年依僧祐居定林寺，晚年出家。
body: |-
  刘勰字彦和，祖籍东莞莒县，世居京口。他的生卒年史书没有明确记载，一般推定生于约公元 465 年，卒年则有约 520 年、约 532 年等不同说法。据《梁书》本传，他早年丧父，家境贫寒，笃志好学，终身没有娶妻。他投靠建康定林寺的高僧僧祐，与僧祐同住十余年，博通佛教经论，帮助僧祐整理寺中所藏的佛经并编定目录，今存的《出三藏记集》等书据认为有他参与的成分。

  齐末，他写成《文心雕龙》五十篇。书成之后不为时人所重，他想请当时的文坛领袖沈约品评，又无由进见，便背着书守候在沈约车前，装作卖书的人。沈约取来一读，非常看重，认为深得文理，常把它放在案头。

  入梁后，他起家任奉朝请，历任临川王萧宏的记室、太末县令、东宫通事舍人等职，很受昭明太子萧统的亲近。他曾上表建议郊祀改用蔬果，与宗庙祭祀一致，得到采纳。晚年，梁武帝命他与僧人慧震在定林寺整理佛经，完成后他请求出家，获准后烧掉须发，改名慧地，不到一年就去世了。

  《文心雕龙》前二十五篇论述文学的根本原则和各种文体，后二十五篇论述创作、风格和批评，包括《神思》《体性》《风骨》《通变》《情采》《知音》等篇，是中国古代体系最完整的文学理论著作（另见“《文心雕龙》成书”条）。
sources: []
recalled:
  - 《梁书·文学传·刘勰》
  - 刘勰《文心雕龙·序志》
