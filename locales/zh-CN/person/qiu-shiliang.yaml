name: 仇士良
aliases: []
role: 宦官、左神策军中尉
summary: 唐文宗、武宗时专权的宦官，甘露之变中带兵屠杀朝官，先后拥立武宗等君主。
body: |-
  仇士良是循州兴宁人，贞元年间入宫做宦官，唐宪宗做太子时就在东宫侍奉。文宗时他任左神策军中尉，统领禁军。大和九年（公元 835 年）十一月，李训以观看甘露为名，想伏兵诛杀宦官，仇士良在左金吾仗院发现埋伏，挟持文宗退入内宫，随即派神策军关闭宫门、四处搜捕，宰相王涯、贾餗、舒元舆和李训、郑注等人都被杀死，受牵连被杀的有一千多人（据《资治通鉴》），史称“甘露之变”（另见该条）。此后他把持朝政，文宗也受制于他。

  开成五年（840 年）文宗病危，他与鱼弘志废掉文宗所立的太子，拥立唐武宗，随后又逼杀了与武宗争位的两位亲王和杨贤妃。武宗信任李德裕，逐渐削弱他的权势。会昌三年（843 年）他告老退休，同年去世。据《新唐书》，他退休时告诫宦官们说，不能让天子闲着，要常常用奢靡的玩乐使他沉迷，不要让他读书、亲近儒生。他死后第二年，因家中被搜出大量兵器，被追削官爵，家产被没收。
sources: []
recalled:
  - 《旧唐书·宦官传》
  - 《新唐书·宦者传·仇士良》
  - 《资治通鉴》卷二百四十五至二百四十七
