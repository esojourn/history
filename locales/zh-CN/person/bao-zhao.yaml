name: 鲍照
aliases: [鲍明远, 鲍参军]
role: 诗人
summary: 出身寒微的诗人，以七言乐府《拟行路难》著称，死于宋末宗室内战。
body: |-
  鲍照字明远，东海人，出身寒微。生年有约 414 年、约 405 年等说法。据《南史》，他年轻时向临川王刘义庆献诗，被任为国侍郎，此后历任太学博士、中书舍人、秣陵令等低级官职。他常在诗文中感叹门第卑微、仕途不顺。《南史》又说，宋孝武帝自负文才，以为没人比得上他，鲍照明白这一点，写文章故意多用鄙俗累赘的句子，当时人以为他才尽了，其实并非如此。

  晚年他在临海王刘子顼手下任前军参军，随之镇守荆州，所以世称鲍参军。泰始二年（466 年），刘子顼响应晋安王刘子勋，起兵反对宋明帝，兵败后，鲍照在江陵被乱兵所杀。

  鲍照的诗以乐府见长，《拟行路难》十八首多抒发寒士的不平，在七言诗的发展上很有分量；赋以《芜城赋》最有名。他与谢灵运、颜延之并称“元嘉三大家”。唐代杜甫有“俊逸鲍参军”的诗句。他的妹妹鲍令晖也能诗。
sources: []
recalled:
  - 《宋书·刘义庆传》附鲍照传
  - 《南史·鲍照传》
