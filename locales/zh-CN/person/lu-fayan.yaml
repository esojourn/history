name: 陆法言
aliases: [陆词]
role: 音韵学家
summary: 隋朝学者，在颜之推等人讨论的基础上编成韵书《切韵》，为后世《唐韵》《广韵》所本。
body: |-
  陆法言名词，以字行，是隋朝官员陆爽的儿子。他的生卒年不详。据《切韵》序，隋朝开皇初年，刘臻、颜之推、卢思道、薛道衡、魏彦渊、李若、萧该、辛德源八人在他家中夜谈，讨论各地字音的分合与古今声韵的异同，当时年轻的陆法言记下了讨论的纲要。

  据同一篇序，此后十余年他做官又被免职，闲居时整理旧稿，参考前人的韵书，在仁寿元年（公元 601 年）编成《切韵》五卷，序中说八人里已有人去世。他被除名一事，据《隋书·陆爽传》，起因是陆爽曾在东宫任职、为太子杨勇的儿子起名，杨勇被废后文帝追究，牵连到陆法言。

  《切韵》原书已经失传，但唐代的《唐韵》、宋代的《广韵》都是在它的基础上增订而成，后世研究中古汉语语音主要依靠这一系统。近代在敦煌等地发现了《切韵》的一些唐代写本残卷。
sources: []
recalled:
  - 陆法言《切韵序》
  - 《隋书·陆爽传》
