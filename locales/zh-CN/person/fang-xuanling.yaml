name: 房玄龄
aliases: [房乔, 梁国公]
role: 尚书左仆射
summary: 唐太宗的宰相，任职十余年，与杜如晦并称“房杜”，监修《晋书》。
body: |-
  房玄龄名乔，以字行，齐州临淄人。据《旧唐书》本传，他十八岁时被本州举为进士，在隋朝任县尉。大业十三年（公元 617 年）李渊起兵入关，他在渭北投奔李世民，从此在秦王府任记室，掌管文书。每平定一地，别人争着搜求珍宝，他却先为秦王府罗致人才，杜如晦就是他推荐的。

  李世民与太子李建成矛盾激化时，房玄龄与杜如晦一度被调离秦王府。玄武门之变前夕，两人扮成道士潜回秦王府参与谋划。太宗即位后，他任中书令，贞观三年（629 年）起任尚书左仆射，此后执掌朝政十余年。他与杜如晦共同选拔人才、制定典章，《旧唐书》说太宗与房玄龄商议政事时，房玄龄能提出谋略却难以决断，杜如晦来后才能定下来，所以后世有“房谋杜断”的说法。

  他为人谨慎，被太宗责备时常叩头谢罪，不敢辩解。他封梁国公，名列凌烟阁二十四功臣，贞观十六年（642 年）进位司空，仍总理朝政。他参与修订贞观律令，又监修《晋书》，这部书于贞观二十二年（648 年）修成。同年他病重，据记载他上表劝太宗停止征伐高句丽。七月他去世，年七十。他的次子房遗爱娶太宗的女儿高阳公主，在他死后卷入谋反案，于永徽四年（653 年）被杀。
