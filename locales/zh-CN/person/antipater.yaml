name: 安提帕特
aliases: [安提帕特洛斯]
role: 马其顿摄政
summary: 马其顿老臣，亚历山大东征期间留守欧洲，平定拉米亚战争，晚年成为帝国的摄政。
body: |-
  马其顿人，约生于公元前 397 年，腓力二世时已是重臣。前 346 年和前 338 年他两次作为使节到雅典议和。前 336 年腓力遇刺，他率先拥立亚历山大。前 334 年亚历山大东征，留他为“欧洲统帅”，带一部分兵力看守马其顿和希腊。

  前 331 年斯巴达国王阿吉斯三世得到波斯的资助起兵，伯罗奔尼撒不少城邦响应。安提帕特先平定色雷斯的变乱，再率大军南下，在麦加洛波利斯城下击败斯巴达人，阿吉斯战死。亚历山大听到这一战，据普鲁塔克，称之为“老鼠之战”。留守期间他与太后奥林匹亚斯不和，双方的信不断送到亚历山大那里。前 324 年亚历山大命克拉特鲁斯带老兵回国接替他，并召他率新兵去巴比伦。他没有动身，派儿子卡山德去见亚历山大。次年亚历山大去世，古代流传过他一家下毒的说法，多数学者不采信。

  消息传来，雅典、埃托利亚等邦起兵，是为拉米亚战争。他兵力不足，被围在色萨利的拉米亚城中过冬。前 322 年列昂纳托斯和克拉特鲁斯先后率军来援，同年 8 月他在克兰农取胜。他对各邦分别议和，在雅典驻军，改民主政体为按财产限定公民资格的政体，并追捕德摩斯梯尼、许佩里德斯等人。

  此后他与克拉特鲁斯、托勒密等联合对抗摄政佩尔狄卡斯。佩尔狄卡斯在埃及被部下所杀后，诸将在叙利亚的特里帕拉狄索斯集会，推安提帕特为两位国王的摄政，重新分配各总督辖区。他把腓力三世和年幼的亚历山大四世带回马其顿。前 319 年他病逝，年近八十，临终时把摄政之位交给老将波利伯孔，而不是自己的儿子卡山德，两人随即开战。

  他的几个女儿分别嫁给克拉特鲁斯（后改嫁德米特里）、佩尔狄卡斯（后改嫁利西马科斯）和托勒密，继业者之间的许多联盟由此而来。
sources: []
recalled:
  - 狄奥多罗斯《历史丛书》卷十七、卷十八
  - 阿里安《亚历山大远征记》卷七第 12 章；《亚历山大死后之事》残篇
  - 普鲁塔克《福基翁传》《德摩斯梯尼传》
