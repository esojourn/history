name: 耶律休哥
aliases: [耶律逊宁, 于越休哥]
role: 辽朝名将
summary: 辽朝名将，在高梁河、岐沟关两次大败宋军，长期镇守南京。
body: |-
  耶律休哥字逊宁，是辽朝皇族，生年不详。乾亨元年（979 年）宋太宗灭北汉后乘胜攻打南京（今北京），辽将耶律沙在高梁河抵挡不住，耶律休哥率援军赶到，与耶律斜轸分左右两翼夹击，宋军大败，宋太宗中箭，乘驴车逃走（另见“高梁河之战”条）。他因功被任命为北院大王。

  统和四年（986 年）宋军三路北伐，耶律休哥在南京一带用轻骑袭扰宋东路军的粮道，迫使曹彬撤退，又在岐沟关追上宋军，大败宋军（另见“雍熙北伐”条）。战后他被封为宋国王，任南京留守。据《辽史》本传，他镇守南京期间，均戍兵、立更休法，劝农桑、修武备，边境安定，宋人也很敬畏他。辽朝把最高的荣誉称号“于越”授予他。统和十六年（998 年）他去世。
sources: []
recalled:
  - 《辽史·耶律休哥传》
  - 《辽史·圣宗本纪》
