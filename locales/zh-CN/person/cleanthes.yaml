name: 克里安提斯
aliases: [克莱安西斯, 克林西斯]
role: 哲学家
summary: 斯多亚派第二任掌门，芝诺的弟子、克律西波斯的老师，所作《宙斯颂》传世。
body: |-
  小亚细亚特洛阿德地方阿索斯人，约生于公元前 330 年。据第欧根尼·拉尔修，他原是拳击手，到雅典时身上只有四个德拉克马。他跟芝诺学哲学，为了糊口，夜里替人从井里打水浇园子、磨面，因此得了个绰号“打水人”。同学笑他迟钝，他说自己像一块硬的写字板，难刻上去，刻上了却不易磨掉。他在芝诺门下十九年，约前 262 年芝诺去世后接掌学派，主持了三十多年。

  他大体谨守芝诺的学说，在自然学说和神学方面有所发挥：把贯穿宇宙的理性看作一种有张力的火，认为太阳是宇宙的主宰部分。普鲁塔克说，他认为提出地球绕日的阿里斯塔克斯应当被控不敬神。

  他的著作只存残篇，最完整的是斯托拜乌斯保存的一首三十多行的《宙斯颂》，把宙斯称作依法则统御万物的自然主宰，说人类是他的后裔，祈求他把人从无知中解救出来。《使徒行传》第 17 章第 28 节保罗在雅典所引“我们也是他所生的”，字句出自诗人阿拉托斯的《现象》，克里安提斯这首颂诗里有意思相同的一行。

  据说他晚年牙龈溃烂，遵医嘱禁食两天，之后索性不再进食而死，年纪有八十、九十九等不同说法。他的弟子克律西波斯接掌学派，把斯多亚的学说组织成完整的体系。
sources: []
recalled:
  - 第欧根尼·拉尔修《名哲言行录》卷七第 168—176 节
  - 斯托拜乌斯《文选》卷一（《宙斯颂》）
  - 《使徒行传》第 17 章第 28 节
