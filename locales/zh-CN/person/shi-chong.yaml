name: 石崇
aliases: [石季伦]
role: 卫尉
summary: 西晋官僚、富豪，以与王恺斗富和金谷园闻名，被孙秀诬陷处死。
body: |-
  石崇字季伦，祖籍渤海南皮，是晋初大司马石苞的幼子，生在父亲任职的青州。他年轻时任修武令、城阳太守，因参与伐吴封安阳乡侯。后来出任荆州刺史，《晋书》本传说他在任上劫掠过往的使者和商人，由此成为巨富。

  本传和《世说新语·汰侈》记载了他与武帝的舅父王恺比赛奢侈的事：王恺用糖水洗锅，他就用蜡烛当柴；王恺做了四十里的紫丝步障，他就做五十里的锦步障；王恺拿出武帝所赐的珊瑚树，他用铁如意把它敲碎，叫人搬出自己收藏的更高大的几株来赔。他在洛阳城外的金谷涧建有别墅，元康六年（公元 296 年）在那里宴集宾客赋诗，自己写了《金谷诗序》。

  他依附贾后的外甥贾谧，是“二十四友”之一。永康元年（300 年）贾谧被杀，他被免官。赵王伦的亲信孙秀向他索要歌伎绿珠，他不肯给，绿珠坠楼而死。孙秀诬告他参与淮南王允的密谋，把他和潘岳等人一同处死，时年五十二。
sources: []
recalled:
  - 《晋书·石苞传附石崇传》
  - 《世说新语·汰侈》
