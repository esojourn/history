name: 乙支文德
aliases: []
role: 高句丽大臣、将领
summary: 高句丽大臣，612 年诱敌深入，在萨水大败隋军，是隋朝第一次东征失败的关键。
body: |-
  乙支文德是高句丽婴阳王时的大臣，生卒年和出身都不详，主要事迹只见于大业八年（公元 612 年）隋炀帝第一次东征高句丽一事。

  这一年隋将宇文述、于仲文等率九军渡过鸭绿江，直逼平壤。据《隋书·于仲文传》和《宇文述传》，乙支文德奉命到隋营诈降，借机察看虚实，随即逃回。隋军追击，他一面且战且退，一日之中七战七败，引诱隋军深入；一面写诗给于仲文，诗中说“战胜功既高，知足愿云止”。隋军渡过萨水，在离平壤三十里处扎营，因粮尽兵疲，见平壤城坚固难下，只好撤退。高句丽军在后追击，在萨水乘隋军半渡时发动攻击，隋军大溃。据《隋书》，九军渡辽时共三十万五千人，退回辽东城时只剩二千七百人。

  朝鲜的《三国史记》专门为他立传，资料大多录自中国史书。他后来被朝鲜半岛视为抵御外敌的名将。
sources: []
recalled:
  - 《隋书·于仲文传》
  - 《隋书·宇文述传》
  - 金富轼《三国史记·乙支文德传》
