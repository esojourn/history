name: "亨利·米伦伯"
aliases: ["米伦伯", "米伦伯格", "亨利·梅尔希奥·米伦伯格"]
role: "北美信义宗的奠基人"
summary: "哈雷派来的敬虔派牧师，1742 年到费城，组织北美第一个信义宗议会。"
body: |-
  《历史的轨迹》第四十一章说，信义宗在美洲开始于哈得孙河边的荷兰人和特拉华河边的瑞典人，但历史地位都不如德国信义宗重要。1727 至 1745 年间大批德国人移居美洲，其中信义宗信徒最多；他们都很穷，没有牧师也没有教师，必须等信义宗牧师来到才能组织教会。

  该书说，信义宗信徒舒尔茨回欧洲筹款并延揽牧师，他的呼吁打动了哈雷的弗兰克，弗兰克为此找到了米伦伯。据一般记载，米伦伯 1711 年生于汉诺威选侯国的艾因贝克，在哥廷根和哈雷读书，受敬虔主义影响；书中称他是哈雷孤儿院的教师，学识渊博，经验丰富。据一般记载，此时出面的是弗兰克的儿子哥特希夫·弗兰克，老弗兰克已于 1727 年去世。

  书中说，米伦伯 1742 年动身前往美洲，他的到来为美洲信义宗历史开了新纪元。他 11 月抵达费城，发现那里的教会混乱，多数赞成钦岑多夫联合所有德国宗教团体的计划，有些牧师程度很差；他不到一个月就掌握了整个地区，年底前已是费城附近三间德国信义宗教会的牧师。除了这三间，他也照顾没有牧师的教会，常把工作报告寄回哈雷，使德国教会看到美洲的实际情况，于是人力财力源源而来；1745 年三位牧师带着捐款从哈雷到达，建造新教堂，开办教区学校。

  该书说，1748 年六位牧师和十个教会的二十四位代表在费城聚会，举行了第一届美洲信义宗会议，当时全美洲约有七十间信义宗教会；独立战争爆发时，单是宾夕法尼亚的德国信义宗信徒就有七万五千人。据一般记载，这个会议就是宾夕法尼亚信义宗牧师会，米伦伯被尊为北美信义宗之父；他的儿子中有人做了大陆军将领和第一届美国众议院议长。他 1787 年在宾夕法尼亚特拉普去世。书中第四十六章还提到，他的曾孙威廉·米伦伯是美国“制度化教会”的创始人。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十一章“教会进入新大陆” https://wellsofgrace.com/books/spiritual/2000years/html/chapter46.html"
