name: 梅尧臣
aliases: [梅圣俞, 宛陵先生]
role: 北宋诗人
summary: 北宋诗人，倡导平淡朴实的诗风，与欧阳修并称“欧梅”，被看作宋诗的开创者之一。
body: |-
  梅尧臣是宣州宣城人，宣城古称宛陵，所以人称宛陵先生，生于咸平五年（公元 1002 年）。他几次应考不中，靠叔父梅询的恩荫做了地方小官。天圣年间他在洛阳任职，与欧阳修、尹洙等人结交，诗文唱和，倡导革除西昆体雕琢华丽的风气。

  他的诗主张“平淡”，多写日常生活和民间疾苦，语言朴素，题材比前人宽广，欧阳修把他推为诗坛领袖，两人并称“欧梅”，后人把他看作宋诗的开创者之一。皇祐三年（1051 年）他获赐同进士出身，后来任国子监直讲，参与编修《新唐书》。嘉祐二年（1057 年）欧阳修主持礼部考试，他任参详官，据宋人记载，苏轼的试卷就是由他首先发现并推荐给欧阳修的。嘉祐五年（1060 年）开封发生疫病，他染病去世。他还为《孙子兵法》作过注，著有《宛陵集》。
sources: []
recalled:
  - 《宋史·文苑传·梅尧臣》
  - 欧阳修《梅圣俞墓志铭》
  - 《宛陵集》
