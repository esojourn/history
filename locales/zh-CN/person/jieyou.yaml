name: 解忧公主
aliases: [刘解忧, 乌孙公主]
role: 和亲公主
summary: 楚王刘戊的孙女，嫁到乌孙五十年，促成汉与乌孙合击匈奴，年近七十归汉。
body: |-
  据《汉书·西域传》，汉武帝为联合乌孙对付匈奴，先把江都王的女儿细君嫁给乌孙王。细君去世后，武帝又把楚王刘戊的孙女解忧作为公主嫁给乌孙王岑陬，时间约在太初年间。岑陬死后，她按乌孙的习俗改嫁继位的翁归靡，生了三男二女：长子元贵靡，次子万年后来做了莎车王，长女嫁给龟兹王。

  昭帝末年，匈奴联合车师进攻乌孙，索要公主。解忧和翁归靡上书求援。宣帝本始年间，汉朝派五位将军分道出塞，同时派校尉常惠持节协助乌孙出兵。乌孙军攻入匈奴右部，俘获甚多，匈奴从此更加衰弱。

  翁归靡死后，乌孙贵人没有立元贵靡，而是立了岑陬与匈奴妻子所生的泥靡，号称狂王。解忧又嫁给狂王，两人不和，她与汉使合谋在宴席上刺杀狂王，没有成功，乌孙发生内乱。她的侍女冯嫽通晓文书和西域事务，被称为冯夫人，在各方之间奔走调停。最后汉朝把乌孙分立为大、小两位昆弥，元贵靡为大昆弥。

  元贵靡死后，解忧上书说自己年老思念故土，希望把骸骨葬在汉地。甘露三年（公元前 51 年）她带着三个孙辈回到长安，这时已年近七十，两年后去世。
sources: []
recalled:
  - 《汉书·西域传下》
