name: 康茂德
aliases: [卢基乌斯·奥勒留·康茂德, 科莫德斯, 康莫杜斯]
role: 罗马皇帝
summary: 马可·奥勒留之子，喜欢下场做角斗士，在位十二年后被刺杀。
body: |-
  康茂德于公元 161 年 8 月 31 日生在拉努维乌姆，是马可·奥勒留的儿子。177 年父亲让他同为皇帝，随后带他到多瑙河前线。180 年 3 月马可去世，十八岁的康茂德与马科曼尼人、夸迪人议和，当年秋天回到罗马。此前四位皇帝都把皇位传给养子，他是八十多年里第一个继位的亲生儿子。

  182 年他的姐姐露基拉谋刺他没有成功，此后他处死了许多元老，把政事交给宠臣，先是禁卫军长官佩伦尼斯，后是获释奴隶克莱安德，两人先后被杀。他自比赫拉克勒斯，披狮皮、执木棒让人塑像，还亲自下场与角斗士和野兽搏斗，当时的元老、历史学家卡西乌斯·狄奥就坐在看台上。他甚至把罗马城改用自己的名字。

  192 年 12 月 31 日，他的情妇玛尔奇娅、内侍和禁卫军长官合谋，先下毒不成，再叫一名摔跤手把他勒死在浴室里。狄奥说，从他继位起，罗马就从黄金的时代落到了铁和锈的时代。
sources: []
recalled:
  - 卡西乌斯·狄奥《罗马史》卷 72—73
  - 赫罗狄安《马可以后的帝国史》卷 1
  - 《罗马帝王纪·康茂德传》
