name: 罗慕路斯·奥古斯都路斯
aliases: [罗慕路斯·奥古斯都, 小奥古斯都, 罗慕卢斯·奥古斯图卢斯]
role: 西罗马皇帝
summary: 西罗马最后一位皇帝，由父亲奥瑞斯特斯拥立，在位十个月被奥多亚克废黜。
body: |-
  罗慕路斯是统帅奥瑞斯特斯的儿子，生年不详，被立为皇帝时还是少年。他的名字取自外祖父。公元 475 年 10 月 31 日，赶走了皇帝尼波斯的父亲在拉文纳把他立为“奥古斯都”，实权仍在父亲手里。因为年幼，时人叫他“奥古斯都路斯”，意思是小奥古斯都。东部朝廷认定尼波斯才是合法的皇帝，从未承认他。

  476 年 8 月，蛮族士兵拥立奥多亚克，杀了奥瑞斯特斯。9 月 4 日前后，奥多亚克进入拉文纳，把他废黜。据《无名氏瓦莱西亚努斯》，奥多亚克怜他年幼貌美，饶了他的命，每年给六千金币，让他和亲属住到那不勒斯海边、从前卢库卢斯的庄园里。

  此后他的事迹没有确实的记载。东哥特王狄奥多里克的大臣卡西奥多鲁斯在 507 至 511 年间代拟过一封信，向一位“罗慕路斯”确认一笔赏赐，有学者认为收信人就是他。他的名字恰好合了罗马的建城者和第一位皇帝，后人常以此感慨。
sources: []
recalled:
  - 《无名氏瓦莱西亚努斯》第二部第 8 章
  - 约达尼斯《哥特史》第 45—46 章
  - 马尔切利努斯伯爵《编年史》476 年条
  - 卡西奥多鲁斯《杂录》卷 3 第 35 封
