name: 刘福通
aliases: []
role: 红巾军首领
summary: 元末红巾军首领，在颍州起义，拥立韩林儿为“小明王”，分兵三路北伐。
body: |-
  刘福通是颍州（今安徽阜阳）人，生年不详。他与韩山童一起以白莲教聚众，至正十一年（1351 年）五月，两人谋划起事时消息泄露，韩山童被捕杀，刘福通率众攻占颍州，起义军头裹红巾，称为红巾军，又因烧香拜佛被称为“香军”（另见“红巾军起义”条）。此后各地纷纷响应，江淮、河南一带的徐寿辉、芝麻李、郭子兴等人先后起兵。

  至正十五年（1355 年）刘福通把韩山童的儿子韩林儿迎到亳州，立为皇帝，号“小明王”，国号宋，建元龙凤，自任丞相，掌握实权。至正十七年（1357 年）他派兵分三路北伐：东路毛贵攻下山东，一度逼近大都；中路关先生、破头潘越过太行，攻破上都，后来转入辽东和高丽；西路进入陕西、甘肃。次年刘福通攻下汴梁，迎韩林儿定都于此。北伐军虽然声势浩大，但各路之间缺乏配合，又没有稳固的后方，最终先后失败。

  至正十九年（1359 年）元将察罕帖木儿攻破汴梁，刘福通护送韩林儿退到安丰（今安徽寿县）。至正二十三年（1363 年）张士诚的部将吕珍围攻安丰，朱元璋发兵救援。据《明史》等记载，刘福通在这次战事中战死，另有说法认为他后来随韩林儿到了滁州，至正二十六年（1366 年）与韩林儿一同在瓜步渡江时溺死。红巾军虽然没有推翻元朝，但牵制了元军主力，为朱元璋等人的崛起创造了条件。
sources: []
recalled:
  - 《元史·顺帝本纪》
  - 《明史·韩林儿传》
  - 《庚申外史》
