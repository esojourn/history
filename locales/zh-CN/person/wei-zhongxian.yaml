name: 魏忠贤
aliases: [李进忠, 九千岁]
role: 天启年间专权的宦官
summary: 天启年间专权的宦官，结成“阉党”迫害东林党人，崇祯初年自缢。
body: |-
  魏忠贤是北直隶肃宁（今属河北）人，早年是市井无赖，因赌博欠债而自宫入宫，改名李进忠，后来又恢复本姓，天启帝赐名忠贤。他在宫中结交了皇长孙朱由校的乳母客氏，朱由校即位后，客氏被封为奉圣夫人，魏忠贤升为司礼监秉笔太监，又提督东厂。

  天启帝不喜欢处理政务，魏忠贤常在他忙于木工时奏事，天启帝随口让他看着办，大权逐渐落入他手中。朝中反对东林党的官员纷纷投靠他，被称为“阉党”，其中有所谓“五虎”“五彪”“十狗”等名号。天启四年（1624 年）左副都御史杨涟上疏弹劾他二十四条大罪，魏忠贤在天启帝面前哭诉，反而得到庇护。

  此后魏忠贤开始报复。天启五年（1625 年）他制造冤案，把杨涟、左光斗、魏大中等六人逮捕，在诏狱中拷打致死，次年又逮捕周顺昌、高攀龙等人，高攀龙投水自尽（另见“东林党争”条）。阉党编了《东林点将录》《三朝要典》，罗列东林人士。各地官员争相为魏忠贤建造生祠，有人称他“九千岁”，甚至有人提议把他与孔子并祀。

  天启七年（1627 年）天启帝去世，崇祯帝即位。崇祯帝起初对他不动声色，随后在大臣弹劾下把他贬到凤阳守陵。魏忠贤在途中得知朝廷要逮捕他，在阜城县的旅店中自缢身亡。崇祯二年（1629 年）朝廷公布“逆案”，惩处阉党二百多人。
sources: []
