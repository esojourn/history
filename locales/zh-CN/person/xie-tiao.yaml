name: 谢朓
aliases: [谢玄晖, 小谢, 谢宣城]
role: 诗人
summary: 南齐诗人，“竟陵八友”之一，曾任宣城太守，永明体的代表作家。
body: |-
  谢朓字玄晖，出身陈郡谢氏，与谢灵运同族，后世称谢灵运为“大谢”，称他为“小谢”。他少年好学，文章清丽，是竟陵王萧子良西邸“竟陵八友”之一，与沈约、王融等人讲求四声，写作讲究声律的“永明体”诗歌。

  他曾在随王萧子隆手下任文学，随之到荆州，很受赏识，被人进谗言召回建康。齐明帝建武二年（公元 495 年），他出任宣城太守，世称谢宣城。《晚登三山还望京邑》中的“余霞散成绮，澄江静如练”，是他最有名的诗句。唐代李白很推崇他，诗中屡次提到他。

  他的岳父是大将王敬则。永泰元年（498 年）王敬则起兵，事先曾派人联络谢朓，谢朓告发了这件事，王敬则兵败被杀。次年，东昏侯在位时，江祏等人谋划拥立始安王萧遥光，想拉谢朓入伙，他不肯，并把消息泄露出去，结果被诬陷下狱而死，年三十六。
sources: []
recalled:
  - 《南齐书·谢朓传》
