name: 李继迁
aliases: [夏太祖, 赵保吉]
role: 党项首领
summary: 党项首领，反抗宋朝收回夏州，依附辽朝，攻占灵州，奠定西夏立国的基础。
body: |-
  李继迁是党项拓跋部人，生于建隆四年（公元 963 年）。党项拓跋氏在唐末因镇压黄巢有功被赐姓李，世代据有夏、银、绥、宥等州。太平兴国七年（982 年），他的族兄、定难军节度使李继捧到开封朝见宋太宗，献出了四州之地。李继迁不愿归附，率部众逃到地斤泽，起兵反宋。

  此后他时战时降，雍熙三年（986 年）向辽朝称臣，辽朝把宗室女嫁给他，后来又封他为夏国王。宋朝一度赐他姓赵，名保吉，但他始终没有真正归附。咸平五年（1002 年）他攻下宋朝的西北重镇灵州，改名西平府，作为根据地。景德元年（1004 年）他进攻吐蕃六谷部首领潘罗支，中箭受伤，不久去世。他的儿子李德明继位，后来西夏追尊他为太祖。
sources: []
recalled:
  - 《宋史·夏国传上》
  - 《辽史·西夏外纪》
