name: 王充
aliases: [王仲任]
role: 思想家
summary: 东汉思想家，著《论衡》，批评当时流行的谶纬与天人感应之说。
body: |-
  据《后汉书·王充传》和《论衡·自纪篇》，王充字仲任，会稽上虞人，祖上原籍魏郡元城。他生于建武三年（公元 27 年），自幼丧父。后来到京师雒阳，在太学学习，以班彪为师。本传说他家贫买不起书，常到雒阳的书肆里阅读店中所卖的书，过目便能记诵，由此通晓各家学说。

  他回乡后以教书为业，先后在县、郡和州里做过功曹、从事一类属官，因为屡次进谏、意见不合而离职。此后他闭门著述，写成《论衡》八十五篇，二十余万字，今本缺一篇。

  《论衡》自称宗旨是“疾虚妄”。当时的儒生多讲天人感应，认为灾异是上天对君主的警告，又盛行图谶之学。王充认为天地万物由元气自然生成，天没有意志，灾异与政事无关；人死后精气消散，不能变成鬼。书中有《问孔》《刺孟》等篇，对孔子、孟子的言论也提出质疑。

  章帝时，同郡人谢夷吾上书推荐他，朝廷征召，他因病没有成行。本传说他在和帝永元年间病死于家中，确切年份不详，一般认为在公元 97 年前后。《论衡》在他生前流传不广，据说到汉末才由蔡邕、王朗等人带到中原。
sources: []
recalled:
  - 《后汉书·王充王符仲长统列传》
  - 《论衡·自纪篇》
