name: 张俊
aliases: [张伯英, 清河郡王]
role: 南宋将领
summary: 南宋“中兴四将”之一，后附和秦桧主和，率先交出兵权，参与构陷岳飞。
body: |-
  张俊字伯英，凤翔府成纪人，生于元祐元年（公元 1086 年）。他少年从军，北宋末年参与对西夏、金的战事，是宋高宗在河北时的部将之一，与岳飞、韩世忠、刘光世并称“中兴四将”。建炎年间他护卫高宗南撤，建炎三年（1129 年）参与平定苗刘兵变；同年冬金军渡江，他在明州一度击退金军前锋。绍兴十一年（1141 年）他在柘皋击败金军。

  同年朝廷收回三大将兵权，张俊揣摩高宗和秦桧的意图，率先请求交出兵权，被任为枢密使。随后他与秦桧合谋，逼迫岳飞的部将王俊诬告张宪，进而把岳飞牵连下狱，事后受到后人的唾骂。他后来被封为清河郡王，以聚敛财富著称。绍兴二十四年（1154 年）去世。明代以后，杭州岳飞墓前铸有秦桧、王氏、万俟卨、张俊四人的跪像。
sources: []
recalled:
  - 《宋史·张俊传》
