name: 拔都
aliases: [萨因汗]
role: 金帐汗国的建立者
summary: 成吉思汗之孙，第二次西征的统帅，攻入罗斯和东欧，在伏尔加河下游建立金帐汗国。
body: |-
  拔都是成吉思汗长子术赤的儿子，生年约在 1205 至 1209 年之间。术赤早死，他继承了父亲在额尔齐斯河以西的封地。

  1235 年窝阔台决定西征，以拔都为统帅，各支宗室的长子随行，名将速不台辅佐。1236 年起蒙古军先后征服伏尔加保加尔、钦察诸部，1237 年至 1240 年攻破罗斯的梁赞、弗拉基米尔等城，1240 年攻陷基辅。1241 年蒙古军分兵进入波兰、匈牙利，在莱格尼察和赛约河畔大败当地联军，前锋一直到达亚得里亚海沿岸（另见“蒙古第二次西征”条）。这时传来窝阔台去世的消息，拔都于 1242 年撤军东返。

  拔都没有回到蒙古参加推选大汗的大会，而是留在伏尔加河下游，建都萨莱，统治钦察草原和罗斯诸公国，史称钦察汗国或金帐汗国。他与贵由不和，1246 年贵由即大汗位时他托病没有赴会；贵由去世后，他支持拖雷的长子蒙哥在 1251 年即大汗位。拔都约在 1255 年去世，罗斯史书称他为“萨因汗”（意为好汗）。金帐汗国对罗斯的统治延续了两百多年。拔都死后，汗位几经更替，传到他的弟弟别儿哥，别儿哥皈依伊斯兰教，因支持阿里不哥而与伊利汗旭烈兀交战。
sources: []
recalled:
  - 拉施特《史集》
  - 《元史·速不台传》
  - 《诺夫哥罗德编年史》
