name: 伊藤博文
aliases: []
role: 日本首任内阁总理大臣
summary: 明治维新的主要政治家，主持制定明治宪法，甲午战争时任首相，签订《马关条约》。
body: |-
  伊藤博文出生于周防国（今山口县）的一个农民家庭，后来随父亲成为长州藩一位下级武士的养子，改姓伊藤。他在吉田松阴的松下村塾学习，参加了长州藩的尊王攘夷运动。1863 年他与井上馨等人秘密到英国留学，看到英国的强大后，转而主张开国。

  明治维新后，伊藤博文在新政府中历任要职，1871 年随岩仓具视使团出访欧美。1882 年他到欧洲考察宪法，回国后主持起草宪法。1885 年日本建立内阁制度，他出任第一任内阁总理大臣。1889 年《大日本帝国宪法》颁布，此后他又多次出任首相，并创立了政友会。

  1894 年中日甲午战争爆发时，伊藤博文是首相。战后他作为日本的全权代表，在马关与李鸿章谈判，迫使清朝签订了《马关条约》，割让台湾、澎湖和辽东半岛（后来在俄、德、法三国干涉下归还辽东），赔款二亿两白银（另见“甲午战争”“《马关条约》”条）。

  1905 年日俄战争后，日本迫使朝鲜（当时国号大韩帝国）签订《乙巳条约》，把朝鲜变为日本的保护国，伊藤博文任第一任韩国统监。1909 年他辞去统监之职，同年十月在哈尔滨火车站被朝鲜独立运动人士安重根刺杀身亡。次年日本吞并朝鲜。伊藤博文在日本被视为近代国家的奠基人之一，在中国、韩国则被视为侵略政策的代表人物。
sources: []
recalled:
  - 春亩公追颂会编《伊藤博文传》
