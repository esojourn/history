name: 阿拉里克
aliases:
  - 亚拉里克
  - 阿拉利
  - 阿拉里克一世
role: 西哥特人的王
summary: 西哥特人的王，公元 410 年攻破并劫掠罗马城。
body: |-
  阿拉里克约在公元 370 年出生，诗人克劳狄安说他生在多瑙河口的一座岛上。他属于西哥特人的贵族，像当时多数哥特人一样，信的是亚流派的基督教。公元 394 年，他率领哥特辅助部队随狄奥多西皇帝在冷河作战，损失很重，却没有得到他想要的罗马军职。

  公元 395 年狄奥多西去世，西哥特人推他为王。他先南下劫掠希腊，东部朝廷给了他伊利里库姆的军事长官一职。401 年他转攻意大利，402 年在波伦提亚被西部的统帅斯提利科击退。408 年斯提利科被皇帝霍诺里乌斯处死，意大利再没有能挡住他的人。

  他三次围困罗马。第一次在 408 年，罗马人交了大笔赎金。他的要求其实是土地、粮食和正式的官职，躲在拉文纳的霍诺里乌斯始终不肯答应。409 年他在罗马另立了一个皇帝，不久又废掉。410 年 8 月 24 日夜间，有人打开城门，西哥特人进城劫掠了三天。这是八百年来罗马城第一次落入外敌之手。

  《历史的轨迹》第七章说劫掠持续了六天六夜，街道成为血河。当时人奥罗修和奥古斯丁的记述是三天，并且都说阿拉里克下令不得侵犯教堂，躲进圣彼得和圣保罗教堂的人得以保全；城中仍有不少人被杀、被掳，财物被抢。消息传到各地，震动极大，耶柔米在伯利恒为之停笔，奥古斯丁因此动笔写《上帝之城》。

  离开罗马后，他带兵南下，打算渡海去产粮的北非，船只在海峡被风暴打散。这年年底他病死在康森提亚。据六世纪的约达尼斯说，部下让河水改道，把他葬在河床下面。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 奥罗修《反异教史》卷 7 第 37—39 章
  - 奥古斯丁《上帝之城》卷 1 第 1—7 章
  - 佐西莫斯《新历史》卷 5—6
  - 约达尼斯《哥特史》第 29—30 章
