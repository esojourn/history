name: 陈宣帝
aliases: [陈顼, 陈高宗]
role: 皇帝
summary: 陈文帝之弟，在位时北伐夺回淮南，后在吕梁全军覆没，淮南复失。
body: |-
  陈顼是陈文帝陈蒨的弟弟。梁末他在江陵任职，承圣三年（公元 554 年）江陵陷落，被掳往长安，天嘉三年（562 年）才被北周放回。文帝去世后他辅佐侄子陈伯宗，光大二年（568 年）废陈伯宗，次年即位。

  太建五年（573 年），他派吴明彻率军北伐北齐，攻克寿阳，收复了淮南之地。太建九年（577 年）北周灭北齐，他又命吴明彻北攻彭城，次年在吕梁被北周军截断退路，全军覆没，吴明彻被俘。北周随即南下，到太建十一年（579 年），淮南之地又全部丧失，陈朝退守长江。

  太建十四年（582 年）正月，他去世，年五十三。太子陈叔宝即位时，弟弟始兴王陈叔陵在丧礼上用刀砍伤了他，随即起兵，很快被平定。
sources: []
recalled:
  - 《陈书·宣帝纪》
  - 《资治通鉴》卷一百七十至一百七十五
