name: 吉利普斯
aliases: [古利普斯]
role: 斯巴达将领
summary: 受命援救叙拉古，扭转战局，全歼雅典远征军。
body: |-
  斯巴达人，父亲克勒安德里达斯曾任国王的顾问，公元前 446 年因被控受雅典贿赂而流亡，后来定居图里伊。前 414 年，斯巴达采纳亚西比德的建议，派吉利普斯去援救被围的叙拉古。他只带了四艘船，到达意大利南部时一度以为叙拉古已被完全封锁，后来得知北面还有缺口，便在西西里北岸的希梅拉登陆，从当地各城募集约三千人，翻山进入叙拉古。当时叙拉古人正准备开会讨论投降。

  他到达后立即出击，夺取了雅典人设在高地上的据点，随后抢筑一道横墙，截断了雅典人即将合拢的封锁墙，使叙拉古不再有被围死的危险。前 413 年他攻占大港入口处的普勒米里翁，夺得雅典人的物资。他又到西西里各城求得援兵，并督促叙拉古人改造战船、在港内与雅典舰队交战。雅典人从陆路撤退时，他率军追击，接受了德摩斯梯尼和尼西阿斯的投降。据修昔底德，他想把这两位将军活着带回斯巴达，叙拉古人不听，把他们处死。

  他的结局并不光彩。据普鲁塔克，前 404 年吕山德托他把一大批银钱押送回斯巴达，他拆开袋底各取出一部分再缝好，却不知道每只袋子里都放有清单。事情败露后他逃亡国外，下落不明。
sources: []
recalled:
