name: 波利比乌斯
aliases: [ 波里比阿 ]
role: 历史学家
summary: 作为人质到罗马，与小西庇阿交好，著《历史》记述罗马的崛起。
body: |-
  伯罗奔尼撒的麦加洛波利斯人，生于公元前 200 年前后，父亲吕科塔斯做过亚该亚同盟的将军。前 182 年同盟名将菲洛波门下葬时，由他捧骨灰瓮。第三次马其顿战争期间，他当选同盟的骑兵长官，这是同盟里仅次于将军的职位。

  前 168 年罗马在彼得那获胜后，清查希腊各邦中不够亲罗马的人，次年约一千名亚该亚人被送往意大利看管，他是其中之一。他得以留在罗马城，与埃米利乌斯·保卢斯的儿子小西庇阿结为师友。前 150 年幸存的亚该亚人获准回乡。前 146 年迦太基城破时他在小西庇阿身边；同年科林斯被毁后，他受罗马委托协助安排希腊各城的善后。

  他所著《历史》共四十卷，叙述公元前 264 年至前 146 年间罗马如何成为地中海的主宰，今存前五卷全文和其余各卷的摘录。书中第六卷讨论罗马的政体与军制。他强调史家应亲历政事、亲往实地，自己也曾沿汉尼拔的路线走过阿尔卑斯山。卒年不详，托名琉善的《长寿者》说他八十二岁时坠马，因伤病去世。
sources:
  - 波利比乌斯《历史》卷三第 48 章；卷二十八第 6 章；卷三十一第 23—25 章；卷三十八第 21—22 章；卷三十九第 5 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/31*.html
  - 英文维基百科“Polybius”（核对年份） https://en.wikipedia.org/wiki/Polybius
recalled:
  - 普鲁塔克《菲洛波门传》第 21 章；《老加图传》第 9 章
  - 保萨尼阿斯《希腊志》卷七第 10 章；卷八第 30 章
  - 托名琉善《长寿者》第 22 节
