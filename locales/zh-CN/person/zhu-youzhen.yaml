name: 朱友贞
aliases: [朱瑱, 梁末帝]
role: 后梁皇帝
summary: 朱温之子，913 年推翻朱友珪即位，923 年后唐军攻入开封时自尽，后梁亡。
body: |-
  朱友贞是朱温的儿子，生母是朱温的正妻张氏。乾化二年（公元 912 年），朱温被儿子朱友珪杀死，朱友珪在洛阳即位。次年，朱友贞联合魏博节度使杨师厚和禁军将领袁象先起兵，攻入洛阳，朱友珪自杀。朱友贞在东京开封即位，此后一直留在开封，没有迁回洛阳。

  他在位期间重用外戚赵岩、张汉杰等人，朱温时期的老臣敬翔、李振逐渐被冷落。贞明元年（915 年）杨师厚去世，朱友贞想削弱魏博的势力，把魏博分为两镇，引起魏博军哗变，乱军投降了晋王李存勖，后梁从此失去河北，与晋军在黄河两岸对峙多年。

  龙德三年（923 年），李存勖在魏州称帝，随即派李嗣源袭取郓州。后梁主力在段凝率领下屯驻黄河边，开封空虚。十月，后唐军从郓州直趋开封，朱友贞自知无法抵挡，命部将皇甫麟杀死自己，后梁灭亡（另见“后唐灭梁”条）。
sources: []
