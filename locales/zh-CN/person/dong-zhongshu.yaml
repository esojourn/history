name: 董仲舒
aliases: [董子]
role: 经学家
summary: 西汉经学家，治《春秋》公羊学，对策中建议专尊儒术、兴办太学，倡天人感应之说。
body: |-
  据《史记·儒林列传》和《汉书·董仲舒传》，董仲舒是广川人，年轻时研习《春秋》，景帝时任博士。他放下帷幕讲学，弟子按入门先后转相传授，有人始终没有见过他的面；本传说他专心学业，三年不到园中观看。他的生卒年没有确切记载。

  武帝即位后下诏征举贤良文学之士，亲自策问。董仲舒先后三次对答，后人称为“天人三策”。他认为上天与人事相互感应，君主为政有失，上天就会降下灾异来警告；又建议设立太学培养士人，让郡国每年举荐人才。在第三策中他提出，凡不属于六艺的科目、不合孔子学说的，都应断绝其进用之路，使之不能与儒学并进。这次对策的年代，有建元元年（公元前 140 年）和元光元年（前 134 年）两种说法。

  对策之后他出任江都国相，辅佐武帝的哥哥易王刘非。后来他被降为中大夫，在家推演辽东高庙和长陵高园殿两次火灾的含义，草稿被主父偃看到并上奏。武帝召集儒生评议，他的弟子吕步舒不知是老师所写，说它十分荒谬，董仲舒因此被判死罪，得诏赦免，从此不敢再谈灾异。丞相公孙弘与他不合，推荐他去做胶西王的国相。胶西王素来骄横，他恐怕日久获罪，托病辞官。

  晚年他居家著书，朝廷遇有大事，常派使者和廷尉张汤到他家中询问。他的著作后来汇编为《春秋繁露》，今本是否全出自他本人，学者有不同看法。
sources: []
recalled:
  - 《史记·儒林列传》
  - 《汉书·董仲舒传》
