name: 阿里斯提德
aliases: [亚里斯泰德, 公正者阿里斯提德]
role: 雅典政治家、将军
summary: 人称“公正者”，为提洛同盟核定了最初的贡金。
body: |-
  雅典人，吕西马科斯之子。据普鲁塔克，他是马拉松之战的十位将军之一，次年（公元前 489 年至前 488 年）任执政官。他与地米斯托克利长期对立，前 482 年被陶片放逐。普鲁塔克讲了一个故事：投票那天，一个不识字的农夫把陶片递给他，请他代写“阿里斯提德”这个名字，他问此人阿里斯提德做过什么对不起他的事，农夫说：“什么也没有，我连他是谁都不认识，只是到处听人叫他‘公正者’，听烦了。”他照写了。

  前 480 年波斯入侵前夕，雅典召回被放逐的人。希罗多德说，萨拉米斯海战的前夜，他从埃吉那渡海穿过波斯人的封锁，把希腊舰队已被包围的消息告诉地米斯托克利，表示两人此时应当比谁对城邦更有用；战斗中他率重装步兵登上海峡中的普叙塔勒亚小岛，消灭了岛上的波斯守军。次年他统率雅典的八千重装步兵参加普拉提亚战役。

  前 478 年，希腊联军舰队的统帅、斯巴达人保萨尼阿斯专横跋扈，爱奥尼亚各邦转而请雅典人领导，当时率领雅典船队的正是阿里斯提德。提洛同盟成立后，各邦出钱或出船，由他核定各邦应缴的数额，据修昔底德，最初的总额是四百六十塔兰特。这次核定被认为公平，后来《尼西阿斯和约》还规定某些城邦按“阿里斯提德时的数额”纳贡。

  他约在前 468 年去世，地点说法不一。普鲁塔克说他死时家境贫寒，丧葬和女儿的嫁妆都由城邦出资。
sources: []
recalled:
  - 希罗多德《历史》卷八第 79—81、95 章；卷九第 28 章
  - 修昔底德《伯罗奔尼撒战争史》卷一第 96 章；卷五第 18 章
  - 普鲁塔克《阿里斯提德传》
