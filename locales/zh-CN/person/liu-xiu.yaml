name: 汉光武帝
aliases: [刘秀, 刘文叔, 世祖]
role: 皇帝
summary: 汉高祖九世孙，起兵反王莽，重建汉朝，定都雒阳，史称东汉。
body: |-
  据《后汉书·光武帝纪》，刘秀字文叔，南阳蔡阳人，是汉高祖的九世孙，出自景帝之子长沙定王刘发一支。他生于汉哀帝建平元年十二月（约当公元前 5 年初），父亲刘钦时任济阳县令。九岁丧父，由叔父刘良抚养。王莽天凤年间他到长安求学，学习《尚书》。

  王莽末年各地起事。地皇三年（公元 22 年），刘秀与兄长刘縯在南阳起兵，与绿林军联合。次年绿林诸将立刘玄为帝，年号更始。同年六月，王莽派大军围昆阳，刘秀突围求援后回师，击溃莽军。此后刘縯被更始帝所杀，刘秀隐忍不发，受命以破虏将军行大司马事，持节北渡黄河，安抚河北。他在河北击灭在邯郸称帝的王郎，收编铜马等部，势力渐大。

  建武元年（公元 25 年）六月，刘秀在鄗即皇帝位，仍用汉的国号，十月定都雒阳。此后十余年间，他先后迫降赤眉，平定关东的割据势力，击破陇右的隗嚣；建武十二年（36 年）攻灭在蜀称帝的公孙述，全国重归统一。

  在位期间，他多次下诏释放奴婢，恢复三十税一的田租，裁并郡县、减省官吏。建武十五年下令“度田”，核查各地垦田与户口，引发地方豪强的反抗。对功臣，他多给以封邑而不让参与政事；政务则逐渐集中到尚书。他本人通经学，在京师兴建太学，同时也信用图谶。中元二年（57 年）二月死于雒阳南宫前殿，《后汉书》记其终年六十二，太子刘庄继位。
sources: []
recalled:
