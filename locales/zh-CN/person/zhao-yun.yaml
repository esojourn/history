name: 赵云
aliases: [赵子龙, 顺平侯]
role: 镇军将军
summary: 蜀汉将领，长坂之战中保护刘备的家眷，晚年随诸葛亮北伐。
body: |-
  据《三国志·蜀书·赵云传》，赵云字子龙，常山真定人，生年不详。他起初在公孙瓒部下，刘备当时也依附公孙瓒，赵云由此跟随刘备，为他统领骑兵。建安十三年（公元 208 年）刘备在当阳长坂被曹军击溃，抛下妻儿南逃，赵云怀抱刘备的幼子刘禅，并保护刘禅的生母甘夫人，使母子二人都得以脱险。

  刘备入蜀后，赵云随诸葛亮西上，分兵平定沿途各县，成都平定后任翊军将军。刘禅即位，他升任中护军、征南将军，后为镇东将军。建兴六年（228 年）诸葛亮出祁山，让赵云与邓芝从斜谷方向出兵以吸引魏军主力。两人在箕谷被曹真击败，但收拢部队坚守，没有重大损失，事后赵云被降为镇军将军。次年他去世，后主时追谥为顺平侯。

  本传篇幅很短。裴松之注引《赵云别传》记载了更多事迹，如汉中之战时他大开营门吓退曹军、刘备称赞他“一身都是胆”，以及他劝阻刘备伐吴等，这些都不见于陈寿的正文。
sources: []
recalled:
  - 《三国志·蜀书·关张马黄赵传》及裴松之注引《赵云别传》
