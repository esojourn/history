name: 魏孝文帝
aliases: [拓跋宏, 元宏, 魏高祖]
role: 皇帝
summary: 北魏皇帝，迁都洛阳，改鲜卑姓氏与服饰语言，全面推行汉化。
body: |-
  拓跋宏是魏献文帝拓跋弘的长子，皇兴元年（公元 467 年）生于平城。他两岁被立为太子，依照“子贵母死”的旧制，生母李氏被赐死。延兴元年（471 年），献文帝把皇位传给五岁的他。承明元年（476 年）献文帝死后，祖母冯太后临朝，直到太和十四年（490 年）。他由冯太后抚养长大，熟读汉文经史。冯太后执政期间推行的俸禄制、均田制和三长制，他都参与其事。

  冯太后去世后，他开始亲政。太和十七年（493 年），他以南伐齐朝为名率大军南下（据《资治通鉴》，步骑三十余万），到洛阳时秋雨连绵，群臣请求停止南伐，他借机提出迁都洛阳，次年正式迁都（另见“孝文帝迁都洛阳”条）。

  迁都之后，他推行了一系列汉化措施：禁止穿鲜卑服装，改穿汉服；规定三十岁以下的官员在朝廷上必须说汉语，不得说鲜卑语；迁到洛阳的鲜卑人以洛阳为籍贯，死后葬在河南，不得归葬北方；太和二十年（496 年）把皇族的拓跋氏改为元氏，其他鲜卑复姓也改为汉姓。他又仿照汉族门第排定姓族，把鲜卑的穆、陆、贺、刘、楼、于、嵇、尉八姓与汉族的崔、卢、郑、王等高门并列，鼓励鲜卑贵族与汉族士族通婚，并改定官制、礼乐和律令（另见“孝文帝汉化”条）。

  改革遭到一部分鲜卑贵族的反对。太子元恂不喜洛阳炎热，想逃回平城，被废后赐死；穆泰、陆叡等人在平城谋反，也被平定。

  他几次亲征南齐，夺取了南阳等地。太和二十三年（499 年），他在南征途中病重，死于谷塘原的行宫，年三十三，葬于洛阳北面的长陵。
sources: []
recalled:
  - 《魏书·高祖纪》
  - 《资治通鉴》卷一百三十二至一百四十二
