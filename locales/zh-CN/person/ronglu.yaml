name: 荣禄
aliases: [仲华, 文忠]
role: 晚清军机大臣、直隶总督
summary: 慈禧太后的亲信，戊戌政变中执掌北洋军务，后任军机大臣，统辖武卫军。
body: |-
  荣禄姓瓜尔佳氏，满洲正白旗人，出身武职世家，以荫生入仕，同治年间任内务府大臣、步军统领等职，深得慈禧太后的信任。光绪初年他曾受排挤离开中枢，光绪二十年（1894 年）慈禧六十寿辰时被召回北京，任步军统领，后来升任兵部尚书。

  光绪二十四年（1898 年）戊戌变法期间，荣禄被任命为直隶总督、北洋大臣，统领北洋各军。据说维新派曾想借助袁世凯的兵力除掉荣禄，袁世凯回到天津后向荣禄告密，荣禄连夜进京报告，这一说法流传很广，但袁世凯告密与政变发动的先后关系，学者有不同看法（另见“戊戌变法”条）。政变后，荣禄任军机大臣，节制北洋各军，把各部编为武卫军，由聂士成、董福祥、宋庆、袁世凯等人分统。

  光绪二十六年（1900 年）义和团运动兴起，荣禄对利用义和团一事态度暧昧，据说他在围攻使馆期间暗中让人送去食物，以留后路。八国联军入京后，他随慈禧到西安，后来参与新政的筹划。光绪二十九年（1903 年）他在北京去世。
sources: []
recalled:
  - 《清史稿·荣禄传》
  - 袁世凯《戊戌日记》
