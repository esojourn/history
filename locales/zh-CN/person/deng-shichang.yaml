name: 邓世昌
aliases: [正卿, 壮节]
role: 北洋海军“致远”舰管带
summary: 福州船政学堂第一届学生，黄海海战中驾“致远”舰冲向敌舰，舰沉殉国。
body: |-
  邓世昌是广东番禺人，出身于商人家庭，少年时在上海、香港等地学习英文和算学。同治六年（1867 年）他考入福州船政学堂，是驾驶班的第一届学生，毕业后在福建水师任职，后来被李鸿章调到北洋。光绪六年（1880 年）和光绪十三年（1887 年）他两次到英国接收军舰，后者就是在英国建造的巡洋舰“致远”，他任“致远”舰管带。

  光绪二十年（1894 年）九月十七日，北洋舰队与日本联合舰队在黄海大东沟附近海面激战。据中国方面的记载，“致远”舰在战斗中多处中弹，船身倾斜，邓世昌下令开足马力冲向日本的“吉野”舰，准备与它同归于尽，途中“致远”舰被击沉（一说被鱼雷击中，也有学者认为是锅炉爆炸）。邓世昌落水后，拒绝部下救援，与爱犬一同沉入海中，全舰二百多名官兵大部分殉难（另见“甲午战争”条）。

  邓世昌牺牲时年四十五岁。光绪帝为他题写挽联，追赠太子少保，谥“壮节”。他的事迹在后来广为传颂，成为甲午战争中最著名的人物之一。关于“致远”舰冲撞敌舰的具体经过，中日双方的记载有所不同。
sources: []
recalled:
  - 《清史稿·邓世昌传》
  - 池仲祐《海军实纪·述战篇》
  - 《中日战争》资料丛刊
