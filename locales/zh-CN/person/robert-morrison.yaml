name: 马礼逊
aliases: [罗伯特·马礼逊]
role: 第一位来华的基督教新教传教士
summary: 英国伦敦会传教士，1807 年到广州，把《圣经》全部译成中文，编纂《华英字典》。
body: |-
  马礼逊出生于英格兰北部的莫佩斯，父亲是苏格兰人，他少年时在纽卡斯尔做鞋楦工人，后来加入伦敦传道会，在伦敦学习神学、医学、天文，并跟随一位在伦敦的中国人学习中文。1807 年他被派往中国，因为英国东印度公司不愿运送传教士，他取道美国到达广州。

  当时清朝禁止外国人传教，也禁止中国人教外国人中文。马礼逊在广州、澳门之间居住，1809 年起受聘为东印度公司的翻译，借此取得居留的身份。他秘密学习中文，翻译《圣经》，1813 年译完《新约》，此后与米怜合作，1819 年译完《旧约》，1823 年在马六甲以《神天圣书》的名称出版，这是第一部完整的中文《圣经》。他又编纂了六卷本的《华英字典》（1815—1823 年出版），这是第一部汉英、英汉对照的大型字典。

  马礼逊在华二十七年，受洗的中国信徒很少，其中最著名的是印刷工人梁发。梁发后来写的《劝世良言》对洪秀全产生了影响（另见“太平天国”条）。他与米怜在马六甲创办了英华书院，又参与创办了第一份中文期刊《察世俗每月统记传》。1834 年东印度公司对华贸易的垄断权结束后，他改任英国驻华商务监督律劳卑的翻译，同年在广州去世。
sources: []
recalled:
  - 马礼逊夫人编《马礼逊回忆录》
  - 海恩波《马礼逊：中国开门的使者》
