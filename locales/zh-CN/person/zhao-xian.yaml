name: 宋恭帝
aliases: [赵㬎, 瀛国公, 合尊]
role: 南宋皇帝
summary: 宋度宗之子，四岁即位，德祐二年元军兵临临安时奉表投降，后被送往吐蕃学佛。
body: |-
  赵㬎是宋度宗的儿子，生于咸淳七年（公元 1271 年）。咸淳十年（1274 年）度宗去世，他四岁即位，次年改元德祐，由祖母太皇太后谢氏（谢道清）临朝。这时元军已攻下襄阳，伯颜率大军沿长江东下，贾似道在丁家洲兵败，被贬后在漳州被杀。

  德祐二年（1276 年）正月，元军进抵临安城外，谢太后派人奉传国玺和降表出降，二月元军入城，恭帝和谢太后等人被押往北方，在上都见了忽必烈，被封为瀛国公（另见“临安投降”条）。他的两个兄弟赵昰、赵昺被陆秀夫、张世杰等人护送南逃，在福州、广东先后被立为帝。

  至元二十五年（1288 年）忽必烈让他前往吐蕃萨迦寺学习佛法，他出家为僧，法名合尊，据说曾把佛经译成汉文。据元代的佛教史籍记载，他在至治三年（1323 年）被元英宗赐死于河西，此事的经过和原因，后世说法不一。
sources: []
recalled:
  - 《宋史·瀛国公本纪》
  - 《佛祖历代通载》
