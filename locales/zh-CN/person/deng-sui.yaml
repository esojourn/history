name: 邓绥
aliases: [和熹邓皇后, 邓太后]
role: 皇后、临朝太后
summary: 汉和帝的皇后，和帝死后以太后身份临朝执政约十六年。
body: |-
  据《后汉书·皇后纪》，邓绥是南阳新野人，开国功臣邓禹的孙女，护羌校尉邓训的女儿。本纪说她自幼喜好读书，家里人称她为“诸生”。永元七年（公元 95 年）她被选入宫，次年成为贵人。永元十四年（102 年）阴皇后因巫蛊之事被废，邓绥被立为皇后。

  元兴元年（105 年）和帝去世，邓后迎立出生才一百多天的皇子刘隆，自己以皇太后临朝，这就是殇帝。殇帝不到一年夭折，她又与兄长邓骘商定，立清河王之子、十三岁的刘祜为帝，即安帝，自己继续临朝。安帝成年后她仍未归政，直到去世，前后执政约十六年。

  她执政的时期灾害频繁，本纪说“水旱十载”，西边又有羌人的大规模反叛，战事持续十余年，耗费巨大。邓太后削减宫中的用度和贡献，多次开仓赈济，亲自审理冤狱。她自己入宫后曾跟随班昭学习经书以及天文、算数；临朝时让刘珍等人在东观校订典籍，又为皇族和邓氏的子弟开设学校。她对自家兄弟有所约束，但朝臣中有人上书请她归政，受到严厉惩处。

  建光元年（121 年）三月邓太后去世，本纪记其终年四十一。安帝亲政后，有人诬告邓氏曾图谋废立，邓骘等人被免官夺爵，被迫自杀。
sources: []
recalled:
  - 《后汉书·皇后纪》（和熹邓皇后）
  - 《后汉书·邓寇列传》（邓骘）
