name: "达秘"
aliases: ["约翰·纳尔逊·达秘", "达尔比"]
role: "弟兄会的领袖"
summary: "爱尔兰圣公会牧师出身，弟兄会的主要领袖，在欧美各地建立聚会，倡时代论。"
body: |-
  达秘 1800 年生于伦敦一个爱尔兰裔家庭，在都柏林三一学院读书，学过法律，后受立为爱尔兰圣公会的牧师，在威克洛郡的山区牧会。他对国家教会日渐失望，约 1827 年起与都柏林一些信徒聚会擘饼，不分宗派。

  《历史的轨迹》第三十八章说，针对安立甘教会灵性冷淡的光景，许多“弟兄会”在爱尔兰和英国西部兴起，以信心和基督的爱作为合一的力量；达秘在他们中间工作后人数激增。该书说他是“普利茅斯附近的一位牧师”，所以弟兄会又称达秘派或普利茅斯弟兄会。据一般记载，他做牧师是在爱尔兰，普利茅斯是 1831 年起最大的一处弟兄会聚会所在，“普利茅斯弟兄会”的名称由此而来。

  该书说，他努力传布自己的观点，在瑞士、法国、德国、加拿大、美国各地成立弟兄会。弟兄会教导信徒皆祭司，不接受按立的牧师，反对信经，拒绝宗派主义，但不得不采用某些惩治规条，后来分裂成六个团体（1848 年起分为“开放”与“闭关”两大支）。他还倡导时代论的末世观，影响很广。他 1882 年死于伯恩茅斯。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十八章“德国与英国的宗教生活” https://wellsofgrace.com/books/spiritual/2000years/html/chapter42.html"
