name: "约翰·卫斯理"
aliases: ["卫斯理约翰"]
role: "循道派创始人"
summary: "英国圣公会牧师，1738 年归正，此后露天布道五十年，组织循道会社，开创循道派。"
body: |-
  约翰·卫斯理 1703 年生于林肯郡爱普沃斯，父亲撒母耳是英国国教的教区牧师，母亲苏撒拿是极坚毅的女人。《历史的轨迹》第三十六章说他们生了十九个孩子，八个夭折，约翰是第十五个；一般记载夭折的是九个。1709 年牧师住宅失火，六岁的约翰几乎烧死，他常自称是“从火中抽出来的一根柴”。

  1720 年他进牛津，后任林肯学院研究员，1728 年受立为牧师。该书说，弟弟查理和两位同学组织了一个互相切磋的小团体，1729 年约翰回到牛津做了领袖，他们探访监狱、有规律地禁食，被同学讥为“圣洁会”“循道派”。1735 年他和查理应奥格尔索普的号召去佐治亚宣教。船上二十六位莫拉维宣教士在风浪中安详唱诗，使他深受震动；到了殖民地，莫拉维派的施庞根贝格问他是否确知基督已经救了他，他答不上来。作者说这次宣教一败涂地，他于 1738 年 2 月 1 日回到英国。

  回国后他结识莫拉维派的贝勒尔，加入费特巷会社。1738 年 5 月 24 日晚，他勉强去参加阿尔德斯门街的一个聚会，听人读路德的《罗马书注释》序言，“我感到心中异常的温暖”，确知基督已除去他的罪。

  1739 年怀特菲尔德请他到布里斯托尔，4 月 2 日他第一次露天讲道，此后骑马走遍英格兰、苏格兰、爱尔兰，前后五十年。他把听道信主的人组成会社，分班，每班十二人，由班长看顾；1742 年起用平信徒讲道，1744 年召开第一次年会，两年后划分联区，推行巡回讲道。他说：“全世界都是我的教区。”

  该书说他始终无意脱离英国国教。他请主教为平信徒讲员按立圣职不成，认为初期教会长老与监督本是同一职分，1784 年 9 月 1 日在布里斯托尔自行按立了两位牧师，这实际上使循道派与英国教会决裂。神学上他相信婴儿洗礼，采亚米念主义，公开反对加尔文的预定论，认为它会拦阻人悔改。1791 年 3 月 2 日他在伦敦去世，享年八十七岁。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十三章“亚米纽斯主义 贵格派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter37.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十六章“循道派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter40.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十八章“德国与英国的宗教生活” https://wellsofgrace.com/books/spiritual/2000years/html/chapter42.html"
