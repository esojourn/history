name: 庄子
aliases: [庄周]
role: 思想家，道家代表人物
summary: 战国中期道家代表人物，曾拒楚王聘相，其著作汇为《庄子》。
body: |-
  庄子名周，宋国蒙人，生卒年不详，一般认为约在公元前 369 年至前 286 年，与梁惠王、齐宣王同时。据《史记·老子韩非列传》，他曾任蒙地的漆园吏，学问无所不窥，而以老子之学为根本，著书十余万言，“大抵率寓言也”。

  《史记》记载，楚威王听说庄周贤能，派使者带着厚礼请他做相。庄周笑着对使者说，千金是重利，卿相是尊位，但你没见过郊祭用的牛吗？养了几年，披上锦绣送进太庙，那时想做一头孤零零的小猪也不可能了，“我宁游戏污渎之中自快，无为有国者所羁”。《庄子·秋水》中则用宁可拖着尾巴在泥里爬的乌龟作比喻。

  庄子继承和发展了老子的思想，追求精神上的绝对自由（“逍遥”），认为万物齐一、是非相对（“齐物”），主张顺应自然、超脱生死。《庄子》中有许多著名的寓言，如庄周梦蝶、庖丁解牛、鲲鹏、井底之蛙、濠梁之辩等。他与名家的惠施是好友，二人常相辩论，惠施死后，庄子说自己再也没有可以交谈的人了。妻子死时他“鼓盆而歌”，认为死亡只是回归自然。

  今本《庄子》三十三篇是西晋郭象整理的，分内篇七、外篇十五、杂篇十一，一般认为内篇大体出自庄子本人，外篇、杂篇多为其后学所作。庄子与老子并称“老庄”，对后世的哲学、文学和艺术影响极大，唐代尊他为“南华真人”，《庄子》也称《南华经》。
sources: []
recalled:
  - 《史记·老子韩非列传》
  - 《庄子》
