name: 李元昊
aliases: [夏景宗, 嵬名曩霄, 赵元昊]
role: 西夏开国皇帝
summary: 西夏开国皇帝，1038 年称帝，创制西夏文字，与宋三战三胜后议和。
body: |-
  李元昊是李德明的儿子、李继迁的孙子，生于咸平六年（公元 1003 年）。据《宋史·夏国传》，他性格雄毅，通晓汉文和佛经，精通兵法，年轻时就不满父亲向宋朝称臣，说英雄应当称王称霸，何必穿锦绮。明道元年（1032 年）李德明去世，他继位。

  继位以后，他抛弃唐、宋赐给的李、赵姓氏，改姓嵬名；下令推行秃发，规定党项人的发式；命野利仁荣等人创制西夏文字，用来翻译汉文典籍和佛经；建立官制和兵制，把兴州升为兴庆府作为都城。宋宝元元年（1038 年）他正式称帝，国号大夏，宋人称为西夏（另见“元昊称帝建夏”条）。

  宋朝拒绝承认，双方开战。康定元年（1040 年）至庆历二年（1042 年），西夏军先后在三川口、好水川、定川寨大败宋军（另见“宋夏战争”条）。但西夏人口少，连年战争使国内物资匮乏，宋朝也停止了边境贸易。庆历四年（1044 年）双方议和，元昊向宋称臣，宋册封他为夏国主，每年“赐”给西夏银、绢、茶。同年辽兴宗亲率大军攻打西夏，在河曲被元昊击败。

  元昊晚年猜忌杀戮，又夺走太子宁令哥的未婚妻。庆历八年（1048 年）正月，宁令哥闯入宫中刺杀元昊，元昊被削去鼻子，次日死去，宁令哥随后也被处死。年幼的儿子李谅祚继位。
sources: []
recalled:
  - 《宋史·夏国传上》
  - 《辽史·西夏外纪》
  - 《续资治通鉴长编》卷一百二十二至一百六十二
