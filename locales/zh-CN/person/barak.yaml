name: 巴拉
aliases: []
role: 以色列军的统领
summary: 拿弗他利人，受底波拉之召，率一万人在基顺河击败西西拉。
body: |-
  巴拉是亚比挪庵的儿子，拿弗他利的基低斯人。他的事迹见于《士师记》第 4—5 章，圣经没有记载他的生年和卒年，也没有记载他后来的经历。

  据《士师记》第 4 章，迦南王耶宾欺压以色列人二十年，女先知底波拉把巴拉召来，传达耶和华的吩咐，要他率领一万拿弗他利人和西布伦人上他泊山。巴拉要求底波拉同去，底波拉答应了，同时告诉他，西西拉将被交在一个妇人手里，荣耀不归于他。巴拉在基低斯招聚西布伦人和拿弗他利人，共一万人，上了他泊山。

  耶宾的将军西西拉带着九百辆铁车来到基顺河。巴拉照底波拉的话下山迎战，西西拉全军溃败，巴拉追赶车辆和军队直到外邦人的夏罗设。西西拉步行逃走，被基尼人希百的妻子雅亿杀死在帐棚里；巴拉追到的时候，雅亿出来迎接他，把死了的西西拉指给他看。第 5 章的诗歌题为底波拉和巴拉同唱。新约《希伯来书》11:32 把巴拉与基甸、参孙、耶弗他等人并列。
sources: []
recalled:
  - 《士师记》第 4—5 章
  - 《希伯来书》第 11 章
