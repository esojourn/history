name: 秦始皇
aliases: [嬴政, 赵政, 秦王政, 始皇帝]
role: 皇帝
summary: 秦王政，十年间灭六国，统一天下，自号“始皇帝”。
body: |-
  据《史记·秦始皇本纪》，他是秦庄襄王之子，秦昭王四十八年（公元前 259 年）正月生于赵都邯郸，名政。十三岁时庄襄王去世，他继立为秦王（前 247 年），国事由相国吕不韦等大臣主持。秦王政九年（前 238 年）行冠礼，同年平定长信侯嫪毐之乱，次年免去吕不韦的相位。

  自秦王政十七年（前 230 年）起，秦先后灭韩、赵、魏、楚、燕、齐，二十六年（前 221 年）并有天下。他改称“皇帝”，自号始皇帝；采纳廷尉李斯的意见，不封子弟为王，分天下为三十六郡，郡置守、尉、监；又统一法度和度量衡，“车同轨，书同文字”。此后修治驰道，命蒙恬率军北击匈奴、修筑长城，南取陆梁地，设桂林、象、南海三郡。三十四年（前 213 年）下令焚书，次年在咸阳坑杀诸生四百六十余人。

  称帝后他五次出巡，又派徐巿（徐福）、卢生等入海求仙人和不死之药。三十七年（前 210 年）出巡途中在平原津得病，七月丙寅死于沙丘平台，九月葬郦山。少子胡亥继位，是为二世皇帝。汉元年十月秦王子婴出降，秦亡，距始皇去世三年有余。
sources:
  - 《史记·秦始皇本纪》 https://zh.wikisource.org/wiki/史記/卷006
  - 《史记·李斯列传》 https://zh.wikisource.org/wiki/史記/卷087
  - 《史记·蒙恬列传》 https://zh.wikisource.org/wiki/史記/卷088
