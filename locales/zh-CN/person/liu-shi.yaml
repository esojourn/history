name: 汉元帝
aliases: [刘奭, 孝元皇帝]
role: 皇帝
summary: 汉宣帝之子，喜好儒术，在位时宦官石显专权；陈汤斩郅支、昭君出塞都在他这一朝。
body: |-
  刘奭是汉宣帝与许平君所生的儿子，出生时父亲还在民间。宣帝即位后不久，他的母亲被人毒死；八岁时他被立为太子。据《汉书·元帝纪》，他性情柔和，喜好儒学，曾劝父亲少用刑罚、多用儒生，宣帝感叹说败坏汉家制度的将是太子，但因为他是许后所生，终究没有改立。黄龙元年（公元前 49 年）末宣帝去世，他继位。

  即位之初，辅政的萧望之、周堪与中书令弘恭、石显相争，萧望之被逼自杀，周堪等人后来也被排挤。元帝身体多病，把政事交给石显，石显专权直到这一朝结束。他多次下诏裁减宫中用度、乐府人员和各地的离宫；初元三年（前 46 年）采纳贾捐之的建议，放弃了屡次反叛的海南珠崖郡。贡禹、韦玄成、匡衡等儒生相继任丞相、御史大夫，朝廷还依照儒家礼制裁撤了设在各郡国的祖宗庙。

  建昭三年（前 36 年），西域的陈汤、甘延寿自行发兵，攻杀了匈奴郅支单于。竟宁元年（前 33 年）呼韩邪单于来朝请求和亲，元帝把宫女王嫱赐给他。同年五月元帝去世。本纪的赞语说他多才艺，擅长书法和音律，但处事拘泥于文义而优柔寡断，宣帝的事业到他手中衰落下去。
sources: []
recalled:
  - 《汉书·元帝纪》
  - 《汉书·佞幸传》
  - 《资治通鉴》卷二十八、二十九
