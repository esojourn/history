name: 波阿斯
aliases: []
role: 伯利恒的财主
summary: 伯利恒人，以至近亲属的身份赎产业、娶路得，是大卫的曾祖父。
body: |-
  波阿斯是伯利恒人，《路得记》2:1 说他是拿俄米的丈夫以利米勒的亲族，是个大财主。《路得记》末尾的家谱记撒门生波阿斯；《马太福音》1:5 说他的母亲是喇合。圣经没有记载他的生年和卒年。

  据《路得记》第 2 章，摩押女子路得随婆婆拿俄米回到伯利恒，到田间拾取麦穗，恰巧到了波阿斯的田里。波阿斯听说了她怎样待婆婆，就嘱咐她不要往别人田里去，吩咐仆人不可欺负她，还让仆人从捆里抽出些来留在地下任她拾取。第 3 章记载，路得照拿俄米的指示夜间到禾场，请波阿斯尽至近亲属的本分；波阿斯答应了，同时说明还有一个人比他更近。

  第 4 章记载，波阿斯到城门，请那位至近的亲属和本城的十个长老坐下，说明以利米勒的那块地要赎，赎地的人也要娶死人的妻子路得，使死人在产业上存留他的名。那人不肯赎，照当时的风俗脱下鞋来为证。波阿斯于是当众置买了以利米勒和他两个儿子的产业，娶路得为妻。路得生了俄备得；俄备得生耶西，耶西生大卫。
sources: []
recalled:
  - 《路得记》第 2—4 章
  - 《马太福音》第 1 章
  - 《历代志上》第 2 章
