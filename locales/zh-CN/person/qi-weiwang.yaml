name: 齐威王
aliases: [田因齐, 田婴齐]
role: 齐国国君
summary: 田齐国君，整顿吏治、广开言路，两败魏军，稷下学宫由此兴盛。
body: |-
  齐威王名因齐，是田齐桓公田午之子，公元前 356 年即位，前 320 年去世，生年不详。《史记·田敬仲完世家》所记的年代有误，今人据《竹书纪年》订正。这时的齐国国君已经是田氏，田氏代齐后，原来的姜姓齐国就此终结。

  据《史记》，威王即位初年不理政事，“委政卿大夫”，诸侯纷纷来犯。九年后他召见即墨大夫，说自从你到即墨，每天都有人说你的坏话，可我派人去看，田野开辟，百姓富足，官府无事，这是因为你不讨好我的左右，于是封他万家；又召见阿大夫，说每天都有人称赞你，可阿地田野荒芜，百姓贫苦，这是因为你厚赂我的左右，当天就把阿大夫和曾经称赞他的左右一起烹杀。齐国由此大治。《史记·滑稽列传》说淳于髡用“一鸣惊人”的隐语劝谏威王，与楚庄王的故事相近。

  《战国策·齐策一》记邹忌以自己与城北徐公比美的事讽谏威王，威王下令能当面指出他过失的受上赏，一时“门庭若市”。威王任用田忌、孙膑，在桂陵、马陵两次大败魏国，公元前 334 年与魏惠王在徐州相互承认为王。稷下学宫在威王、宣王时期最为兴盛，各国学者云集临淄。

  他是田齐最有作为的君主之一。
sources: []
recalled:
  - 《史记·田敬仲完世家》
  - 《史记·滑稽列传》
  - 《战国策·齐策一》
