name: 海陵王
aliases: [完颜亮, 迪古乃, 海陵炀王]
role: 金朝皇帝
summary: 金太祖之孙，弑金熙宗自立，迁都燕京；1161 年大举南侵，采石失利后被部下所杀。
body: |-
  完颜亮女真名迪古乃，是金太祖的庶长子完颜宗干的儿子，生于天辅六年（公元 1122 年）。他喜好汉文化，能诗文。熙宗时他升任右丞相，皇统九年十二月（公历 1150 年 1 月）与近臣合谋杀死熙宗，自立为帝。他在位期间大规模诛杀太宗一系和其他宗室，以巩固帝位。

  完颜亮致力于加强集权、推行汉制。天德年间他改革官制，废除中书、门下两省，只留尚书省；贞元元年（1153 年）把都城从上京会宁府迁到燕京，改称中都，后来又下令拆毁上京的宫殿（另见“海陵王迁都燕京”条）。这次迁都使金朝的统治中心转到华北，女真人大批南迁。

  完颜亮一心要灭宋统一天下。据南宋罗大经《鹤林玉露》，他读到柳永描写杭州的词句“三秋桂子，十里荷花”，便起了南侵之心，此说出自宋人记载，未必可信。正隆六年（1161 年）他迁都汴京，征调大军分路南侵，嫡母徒单太后劝阻，被他杀死。十一月，金军在采石渡江被宋军击退（另见“采石之战”条），他转往扬州，想从瓜洲渡江。这时东京留守完颜雍已在辽阳称帝，前线将士不愿再战，完颜元宜等人在瓜洲军营中把他杀死。

  完颜亮死后被废为海陵郡王，谥炀，后来又降为庶人，史称海陵王。《金史》对他的记载多有贬斥，其中不少出自世宗朝的有意丑化，现代学者对此有讨论。
sources: []
recalled:
  - 《金史·海陵本纪》
  - 罗大经《鹤林玉露》
