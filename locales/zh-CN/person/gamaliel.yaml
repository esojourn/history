name: 迦玛列
aliases:
  - 拉班迦玛列长老
role: 法利赛人教法师
summary: 公会中受敬重的教法师，劝公会不要杀害使徒；保罗曾在他门下受教。
body: |-
  新约提到迦玛列的地方只有两处。《使徒行传》5:34–39 记公会审问彼得和众使徒，有人想要杀他们，一个法利赛人、众百姓所敬重的教法师迦玛列在公会中站起来，吩咐把使徒暂且带到外面，然后举丢大和加利利的犹大为例，说这两人死后，跟从的人都散了；他劝公会任凭这些人，若所行的是出于人，必要败坏，若是出于神，就不能败坏他们。公会听从了他，把使徒打了以后释放。另一处是 22:3，保罗自述在迦玛列门下，按着祖宗严紧的律法受教。新约所载仅此，生卒年份都没有记载。

  犹太传统称他为“拉班迦玛列长老”，相传是希列的孙子；《密西拿》记有以他名义作出的几项规定，并说他去世以后，律法的荣耀就止息了。另外，约瑟夫斯《犹太古史》卷 20 把一个名叫丢大的人起事放在公元 44 年以后，晚于迦玛列发言的时候，与《使徒行传》所记的先后不合，学者对此有不同的解释。
sources: []
recalled:
  - 《使徒行传》5:33–40，22:3
  - 《密西拿·疑妻篇》第 9 章
  - 约瑟夫斯《犹太古史》卷 20 第 5 章
