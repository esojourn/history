name: 狄奥尼修斯一世
aliases: [老狄奥尼修斯]
role: 叙拉古僭主
summary: 叙拉古僭主，统治三十八年，屡与迦太基交战，把势力扩展到意大利南部。
body: |-
  叙拉古人，约生于公元前 432 年，早年在官署中做书记。前 406 年迦太基军攻陷阿克拉伽斯，叙拉古人心惶惶，他在公民大会上指控将军们通敌，自己被选入新的将军团，不久取得全权将军的名义，又借口遇刺得到一支卫队，从此成为僭主。前 405 年他与迦太基议和，承认对方占有西西里西部和南岸诸城。

  他把叙拉古的奥尔提吉亚岛筑成自己的堡垒，又用几年时间修起环绕埃皮波莱高地的长墙。据狄奥多罗斯，前 399 年他为备战招集各地工匠，弩炮就是这时在叙拉古造出来的，船坞里还造了比三列桨战舰更大的四列桨、五列桨战舰。前 397 年他进攻西西里西端的迦太基城市莫提亚，筑堤攻城，将其攻陷。次年迦太基将领希米尔科反攻，围困叙拉古，军中发生瘟疫，溃败而去。此后他与迦太基又打过两次战争，互有胜负，边界大体稳定在哈吕科斯河一线。

  在意大利，他与洛克里结盟，前 389 年在埃勒波罗斯河击败意大利希腊人的联军，前 386 年经长期围困攻下瑞吉昂。他还在亚得里亚海沿岸建立据点，劫掠过伊特鲁里亚的皮尔吉神庙。斯巴达是他的盟友，他派出的船只帮助斯巴达封锁赫勒斯滂，促成了“大王和约”。前 388 年奥林匹亚竞技会上，演说家吕西亚斯号召希腊人推翻他，他的代表团的帐篷遭到围攻。

  他喜欢写悲剧，常被人嘲笑。柏拉图约前 388 年到过他的宫廷，不欢而散。前 367 年他的《赫克托尔的赎还》在雅典勒奈亚节上得了头奖，他不久即去世，相传是庆祝时饮酒过度所致。其子狄奥尼修斯二世继位。
sources: []
recalled:
  - 狄奥多罗斯《历史丛书》卷十三至卷十五
  - 普鲁塔克《狄翁传》
