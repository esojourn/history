name: 伊菲克拉特斯
aliases: []
role: 雅典将军
summary: 雅典将军，善用轻盾兵，公元前 390 年在科林斯附近歼灭一支斯巴达重装步兵队。
body: |-
  雅典人，相传出身低微，父亲是鞋匠。科林斯战争期间他统领驻在科林斯的一支轻盾兵雇佣军。公元前 390 年，一队斯巴达重装步兵护送友军后返回莱凯翁，他率轻盾兵反复投掷标枪、又在对方追击时退开，据色诺芬，这队约六百人的斯巴达兵死了约二百五十人。重装步兵败给轻装兵，当时震动很大。

  狄奥多罗斯和奈波斯说他改革了装备：盾牌改小，矛和剑加长，并用一种轻便的靴子，后来称为“伊菲克拉特斯靴”。这些改革的具体内容和时间，现代学者看法不一。

  此后他在色雷斯一带活动多年，娶了色雷斯国王科提斯的女儿（一说是妹妹）。前 374 年前后他受雇于波斯，随总督法那巴佐斯远征埃及，两人意见不合，战事失利后他回到雅典。前 372 年他率舰队到克基拉；前 369 年奉命在地峡一带阻截自伯罗奔尼撒回师的伊巴密浓达，没有成功。

  同盟战争中，前 356 年他与提摩透斯等人在恩巴塔因风浪拒绝出战，被同僚卡瑞斯控告。他被判无罪，此后不再担任将军，约前 353 年去世。
sources: []
recalled:
  - 色诺芬《希腊史》卷四第 5 章、卷六第 2 章
  - 狄奥多罗斯《历史丛书》卷十五第 44 章
  - 奈波斯《伊菲克拉特斯传》
