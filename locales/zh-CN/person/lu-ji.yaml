name: 陆机
aliases: [陆士衡, 陆平原]
role: 平原内史
summary: 西晋文学家，吴国名将陆逊之孙，著有《文赋》，为成都王颖领兵战败被杀。
body: |-
  陆机字士衡，吴郡吴县人，祖父陆逊是吴国丞相，父亲陆抗是吴国大司马。陆抗去世时他十四岁，与兄弟分领父亲的部曲，任牙门将。太康元年（公元 280 年）吴国灭亡，他的两个哥哥战死，他退居故里，闭门读书近十年，写了《辨亡论》两篇，追述孙权得国和孙皓亡国的缘由。

  太康末年，他与弟弟陆云一起到洛阳，拜访张华。张华十分看重他们，据《晋书》本传，张华说“伐吴之役，利获二俊”。兄弟二人由此在洛阳知名，时称“二陆”。他先后任太子洗马、著作郎等职，也是贾谧门下“二十四友”之一。

  赵王伦执政时他任中书郎，赵王败后，有人怀疑为赵王起草禅让诏书的人里有他，他被捕下狱，靠成都王颖等人援救才免死。他认为成都王能够安定天下，就留在其幕下，任平原内史，后人因此称他“陆平原”。太安二年（303 年）成都王颖进攻洛阳的长沙王乂，任他为后将军、河北大都督，统率各军。他出身吴地而位居北方将领之上，部下多不服从。晋军在洛阳建春门外大败，宦官孟玖等人乘机诬告他怀有二心，成都王派人到军中把他处死，时年四十三，陆云等也一同遇害。本传记载他临刑时叹息：“华亭鹤唳，岂可复闻乎！”

  他的诗赋在当时最负盛名，与潘岳并称“潘陆”。《文赋》专论作文的构思与利弊，是中国早期的文学理论名篇。相传为他手书的《平复帖》留存至今。
sources: []
recalled:
  - 《晋书·陆机传》
  - 《文选》
  - 《世说新语》
