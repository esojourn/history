name: 布伦努斯
aliases: [布伦努斯（入侵希腊者）]
role: 高卢人首领
summary: 高卢人首领，公元前 279 年率军侵入希腊，进攻德尔斐受挫，负伤后自尽。
body: |-
  公元前 3 世纪初南下巴尔干的高卢人（希腊人称“加拉太人”）的首领之一，出身和生年都不详。“布伦努斯”可能是称号而不是人名；约一个世纪前攻入罗马的高卢首领也叫这个名字，两人没有关系。

  前 280 年前后，高卢人分几路侵入色雷斯、马其顿和伊利里亚。其中一路由波尔吉乌斯率领，击杀了刚夺得马其顿王位的托勒密·克劳诺斯。据保萨尼亚斯，布伦努斯见有利可图，鼓动族人再次大举出兵，前 279 年与阿基科里乌斯一同南下。保萨尼亚斯说这支军队有步兵十五万二千人、骑兵二万余，数字显然夸大。

  雅典、彼奥提亚、福基斯、埃托利亚等邦的联军守在温泉关。高卢人正面进攻不下，布伦努斯分兵去劫掠埃托利亚，引走埃托利亚人，随后由当地人带路，走当年波斯人包抄的山道绕到关后，希腊联军乘船撤离。他不等后队，径自率一部扑向德尔斐。

  德尔斐的守军是福基斯人和埃托利亚人等，人数不多。据希腊人的记载，时值冬季，高卢人遇上地震、雷电、落石和大雪，夜里又自相惊扰，被守军击退；希腊人把这归功于阿波罗显灵。布伦努斯身负数伤，退兵途中自尽，有的说是饮烈酒而死，有的说是用匕首。神庙的财宝是否被抢，古代就有两种说法：希腊作家说神庙保全了，罗马作家则有高卢人把德尔斐的黄金带回图卢兹的传说。

  残部北撤时沿途遭到袭击。德尔斐此后设立“救主节”纪念此事。另一些高卢人渡海进入小亚细亚，后来定居下来，那里因此称为加拉太。
sources: []
recalled:
  - 保萨尼亚斯《希腊志》卷十第 19—23 章
  - 尤斯丁《腓力史纲要》卷二十四第 4—8 章
  - 狄奥多罗斯《历史丛书》卷二十二残篇
