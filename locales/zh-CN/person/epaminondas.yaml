name: 伊巴密浓达
aliases: [埃帕米农达斯]
role: 底比斯将军、政治家
summary: 底比斯统帅，在留克特拉击败斯巴达，解放美塞尼亚，使底比斯一度称霸希腊。
body: |-
  底比斯人，波吕姆尼斯之子，家世古老而清贫。生年不详，一般推测在公元前 420 年至前 410 年之间。他受过很好的教育，老师是流亡到底比斯的毕达哥拉斯派学者、塔兰托人吕西斯。前 382 年斯巴达人占据底比斯卫城时，他留在城内未受注意；前 379 年佩洛皮达斯等人起事成功，他才参与政事。

  前 371 年夏，他作为彼奥提亚长官出席在斯巴达举行的和会，坚持以底比斯代表全彼奥提亚签约，并反问斯巴达是否也让拉科尼亚各城自治。阿格西劳斯将底比斯从和约中除名，斯巴达国王克列翁布洛托斯随即率军进入彼奥提亚。两军在留克特拉相遇。希腊人列阵通常把精锐放在右翼，他却把底比斯人集中在左翼，据色诺芬纵深达五十列，正对斯巴达人，较弱的右翼则斜向后撤、避免接战。斯巴达一翼被冲垮，克列翁布洛托斯战死。据色诺芬，在场的七百名斯巴达全权公民死了约四百人。

  前 370 年冬，他应阿卡迪亚人之请率联军进入伯罗奔尼撒，随后攻入拉科尼亚，一直推进到欧罗塔斯河边，斯巴达城未被攻下，但几百年来头一次有敌军出现在城外。他接着进入美塞尼亚，使那里被斯巴达奴役了数百年的居民恢复自由，在伊托美山下建起美塞尼城；阿卡迪亚人也在这一时期建立麦加洛波利斯。斯巴达失去了一半土地和大部分黑劳士。回国后他因超过任期统兵受审，被判无罪。

  此后他又三次进军伯罗奔尼撒；前 364 年率新建的舰队航行到拜占庭，试图动摇雅典的海上同盟，没有后续。前 362 年阿卡迪亚同盟分裂，他第四次南下，在曼提尼亚与斯巴达、雅典、曼提尼亚等邦的联军决战，仍用加厚左翼的战法击破对方，自己却在追击时被长矛刺中。相传他得知底比斯获胜之后才让人拔出矛头，并劝同胞议和。色诺芬以这一战结束《希腊史》，说战后希腊比以前更加混乱。

  普鲁塔克为他写的传记已经失传。奈波斯等人记载，有人惋惜他没有子嗣，他回答说留克特拉就是他留下的女儿；这句话是否真是他说的，无从查考。
sources: []
recalled:
  - 色诺芬《希腊史》卷六第 3—4 章、卷七第 5 章
  - 狄奥多罗斯《历史丛书》卷十五
  - 奈波斯《伊巴密浓达传》
  - 普鲁塔克《佩洛皮达斯传》《阿格西劳斯传》
