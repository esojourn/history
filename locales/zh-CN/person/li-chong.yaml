name: 李冲
aliases: [李思顺]
role: 大臣
summary: 冯太后、孝文帝的重臣，建议设立三长制，主持营建洛阳新都。
body: |-
  李冲字思顺，陇西狄道人，西凉建立者李暠的曾孙。他少年丧父，由兄长抚养长大。献文帝末年入仕，任中书学生，后来受到冯太后的宠信，参与机要。

  太和十年（公元 486 年），他上书建议设立三长：五家立一邻长，五邻立一里长，五里立一党长，由三长负责检查户口、征收租调、征发徭役，取代此前由地方豪强包庇大量荫户的宗主督护制。朝中有人反对，冯太后支持他的意见，三长制随即推行，与前一年颁行的均田制相配合，国家掌握的户口大为增加（另见“太和改制”条）。

  孝文帝亲政后同样倚重他。迁都洛阳时，他主持规划营建新都的宫殿官署，官至尚书仆射。太和二十二年（498 年），他与御史中尉李彪不和，弹劾李彪时怒极，以致发病，不久去世，年四十九。孝文帝在前线听到消息，十分悲痛。
sources: []
recalled:
  - 《魏书·李冲传》
  - 《魏书·食货志》
