name: 俄陀聂
aliases: []
role: 士师
summary: 基纳斯之子，攻取底璧，胜古珊利萨田，是《士师记》所记第一位士师。
body: |-
  俄陀聂是基纳斯的儿子。《士师记》3:9 称他为迦勒兄弟基纳斯的儿子，这句话既可以理解为他是迦勒的侄子，也可以理解为他是迦勒的弟弟。圣经没有记载他的生年和卒年。

  据《约书亚记》15:13–19 和《士师记》1:11–15，迦勒得了希伯仑为业，又去攻打底璧（原名基列西弗），并许诺谁攻取那城，就把女儿押撒给他为妻。俄陀聂夺取了那城，娶了押撒。押撒过门的时候向父亲求水泉，迦勒就把上泉、下泉赐给她。

  《士师记》3:7–11 记载，以色列人事奉诸巴力和亚舍拉，被交在米所波大米王古珊利萨田手中，服事他八年。以色列人呼求耶和华，耶和华就兴起俄陀聂作拯救者；耶和华的灵降在他身上，他作了以色列的士师，出去争战，胜了古珊利萨田。此后国中太平四十年，俄陀聂去世。他是《士师记》所记的第一位士师。
sources: []
recalled:
  - 《士师记》第 1 章、第 3 章
  - 《约书亚记》第 15 章
  - 《历代志上》第 4 章
