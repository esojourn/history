name: 司马乂
aliases: [长沙王乂, 司马士度]
role: 长沙王
summary: 晋武帝第六子，杀齐王冏后执政，固守洛阳抗击成都王、河间王，被出卖而死。
body: |-
  司马乂字士度，是晋武帝的第六子，封长沙王。他是楚王司马玮的同母弟，元康元年（公元 291 年）楚王玮被杀时，他受牵连贬为常山王，后来随成都王颖讨赵王伦，恢复原封，留在洛阳。

  太安元年（302 年）底，河间王颙讨齐王冏，他在城内与齐王冏交战三天，擒杀齐王，此后由他在洛阳主持朝政，大事仍向在邺城的成都王颖请示。次年八月，成都王颖、河间王颙联兵进攻洛阳。他奉惠帝出战，在建春门外大败陆机率领的成都王军，又多次击退河间王的部将张方。

  战事相持到永兴元年（304 年）正月，城中粮食将尽。东海王司马越担心不能持久，与殿中将领把他捉住，送到金墉城。城外的张方把他带到军营中烧死，时年二十八。《晋书》本传说他死时三军莫不为之落泪。
sources: []
recalled:
  - 《晋书·长沙王乂传》
  - 《资治通鉴》卷八十四、八十五
