name: 唐中宗
aliases: [李显, 李哲, 庐陵王]
role: 皇帝
summary: 唐高宗与武则天之子，即位不久被废，幽居房州十四年，705 年复位。
body: |-
  李显是唐高宗的第七子、武则天的第三子，显庆元年（公元 656 年）生于长安，一度改名李哲。调露二年（680 年）他的哥哥太子李贤被废，他被立为太子。弘道元年（683 年）高宗去世，他即位。次年正月，他想任命皇后韦氏的父亲韦玄贞为侍中，宰相裴炎反对，据《资治通鉴》，他发怒说，我就是把天下给韦玄贞又有何不可，何况一个侍中。裴炎报告武则天，二月武则天将他废为庐陵王，他在位只有五十多天。

  此后他被迁到房州幽禁，前后十四年。据《资治通鉴》，他每次听说朝廷派使者来，都惊恐得想自杀，韦氏劝他说，祸福无常，最坏不过一死，何必急着去死。他因此对韦氏许诺，日后如果能重见天日，任凭她做什么都不加禁止。圣历元年（698 年），武则天听从狄仁杰等人的意见，召他回洛阳，再立为太子。

  神龙元年（705 年）正月，张柬之等人发动政变，他复位，恢复唐的国号，次年迁回长安。复位后，韦后和女儿安乐公主干预朝政，武三思得到信任，张柬之等五位功臣先后被贬逐而死。景龙元年（707 年）太子李重俊起兵杀死武三思，随后兵败被杀。他大量设置“斜封官”，又让上官婉儿主持修文馆，宫中宴游唱和不断。

  景龙四年（710 年）六月，他在长安神龙殿突然去世，年五十五。旧史说是韦后和安乐公主下毒所致，安乐公主想当皇太女，韦后想效法武则天临朝；也有学者认为证据不足。同月李隆基起兵诛杀韦后（另见“唐隆政变”条）。
sources: []
recalled:
  - 《旧唐书·中宗纪》
  - 《新唐书·中宗纪》
  - 《资治通鉴》卷二百三至二百九
