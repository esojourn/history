name: 王猛
aliases: [王景略, 清河郡侯]
role: 前秦丞相
summary: 前秦丞相，出身贫寒，辅佐苻坚整饬法纪、发展农桑，率军灭前燕。
body: |-
  王猛字景略，北海剧县人，幼年随家迁到魏郡。他家境贫穷，以贩卖畚箕为生，而博学，喜读兵书。据《晋书·载记》，他年轻时到后赵的都城邺城游历，没有人看重他，后来隐居在华阴的山中。

  永和十年（公元 354 年）东晋的桓温北伐进入关中，他穿着粗布衣服去军营求见，一边谈论天下大事，一边伸手在衣服里捉虱子，旁若无人，这就是“扪虱而谈”的出处。桓温问他，关中的豪杰为什么不来归附。他回答说，您不远千里深入敌境，离长安近在咫尺却不渡灞水，百姓还看不出您的打算。桓温退兵时请他同往南方，他没有去。

  不久，前秦的宗室苻坚经人介绍与他相见，谈得十分投合，苻坚把这比作刘备遇到诸葛亮。升平元年（357 年）苻坚即位，他先任中书侍郎，出任始平县令时依法鞭死了一名横暴的官吏，被人告发，苻坚亲自审问后赦免了他，更加信任。此后他一年之中五次升迁，兼管京城的司法。载记说，他与同僚几十天内处决了二十多个不法的贵戚豪强，朝中风气为之一变，苻坚感叹说，现在才知道天下是有法度的。有功的氐族老臣当众辱骂他，被苻坚处死。

  太和五年（370 年）他统兵伐前燕，攻下壶关、晋阳，在潞川以少胜多击溃慕容评的大军，随后攻克邺城，俘虏燕主慕容暐。他留在邺城治理新得的关东六州，两年后回朝任丞相，军政事务不分大小都由他裁决。载记称他执政公平，罢黜庸碌无能的官员，提拔被埋没的人才，督促农耕，整顿军备，兴办学校。

  宁康三年（375 年）他病重，苻坚亲自为他祈祷。据载记，他临终时说：东晋虽然偏处江南，却是正统所在，上下安和，希望在他死后不要图谋晋朝；鲜卑和羌人才是心腹之患，应当逐步除去。同年七月他去世，时年五十一。八年后苻坚南征，兵败国亡。
sources: []
recalled:
  - 《晋书·苻坚载记附王猛》
  - 《资治通鉴》卷九十九至一百零三
