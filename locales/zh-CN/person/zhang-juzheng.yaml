name: 张居正
aliases: [张江陵, 太岳, 文忠]
role: 万历初年的内阁首辅、改革家
summary: 万历初年任内阁首辅十年，推行考成法、清丈田亩和一条鞭法，死后被抄家。
body: |-
  张居正是湖广江陵（今湖北荆州）人，少年时就以才学闻名，嘉靖二十六年（1547 年）考中进士，进入翰林院，受到徐阶的器重。隆庆元年（1567 年）他以吏部侍郎入阁，参与起草嘉靖帝的遗诏。隆庆年间他与高拱一起促成了“俺答封贡”。

  隆庆六年（1572 年）隆庆帝去世，十岁的万历帝即位。张居正联合宦官冯保，借李太后的支持驱逐首辅高拱，自任首辅，此后主持朝政十年。他兼任万历帝的老师，对小皇帝要求极严，李太后也全力支持他。

  张居正的改革从整顿吏治入手，推行“考成法”，给各部门的事务规定期限，按期考核，内阁借此控制六部和地方官员。他清理积欠的赋税，裁减冗员，压缩宫廷开支。万历六年（1578 年）起他下令在全国清丈土地，查出大量隐瞒的田亩，随后在全国推行“一条鞭法”，把各种赋役合并，按田亩征收银两（另见“张居正改革”条）。在边防上，他任用戚继光镇守蓟州，李成梁镇守辽东，与俺答汗的和议也得以维持。到万历初年，国库积存有了较大增加。

  张居正大权独揽，作风专断，很多人对他不满。万历五年（1577 年）他的父亲去世，按制度应回乡守丧三年，他接受万历帝的“夺情”挽留，留任不归，翰林院和御史等官员上疏反对，有几人被廷杖。他生活奢侈，据说回乡葬父时乘坐三十二人抬的大轿。

  万历十年（1582 年）张居正在任上病逝，追赠上柱国，谥“文忠”。不久他就遭到清算，冯保被贬，张居正被追夺官爵和谥号，家产被查抄，长子张敬修自杀，家属有人饿死。他推行的许多措施被废止，但一条鞭法延续下来。天启年间他得到平反，崇祯年间恢复了官爵。
sources: []
recalled:
  - 《明史·张居正传》
  - 《张太岳集》
  - 黄仁宇《万历十五年》
