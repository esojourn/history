name: 克劳狄
aliases: [克劳狄乌斯, 克劳狄一世, 提比略·克劳狄乌斯·恺撒, 革老丢]
role: 罗马皇帝
summary: 罗马第四位皇帝，由禁卫军拥立，在位时征服不列颠南部。
body: |-
  克劳狄于公元前 10 年 8 月 1 日生在高卢的卢格杜努姆，是大德鲁苏斯的小儿子、日耳曼尼库斯的弟弟。他自幼多病，走路不稳，说话口吃，家里人觉得他上不了台面，奥古斯都和提比略都没有让他担任要职。他把时间用在读书上，受李维鼓励写史，著有伊特鲁里亚史和迦太基史，都没有传下来。

  41 年 1 月卡利古拉遇刺，元老院还在商议要不要恢复共和，禁卫军已经在宫里找到他，带回营地拥立为帝。据苏维托尼乌斯，他许给每个士兵一万五千塞斯特斯，是第一个用赏金换取禁卫军效忠的皇帝。

  他在位十三年。43 年派四个军团渡海征服不列颠南部，自己到前线住了十六天；毛里塔尼亚、吕基亚、色雷斯和犹太也在他手里成为行省。他在奥斯蒂亚修建新港，修成两条引水道。48 年他在元老院演说，主张让高卢的显贵进元老院，讲稿刻在里昂出土的铜版上，塔西佗也有转述。文书、财务等事务交给他家的获释奴隶那喀索斯、帕拉斯等人掌管，元老们对此十分不满。《使徒行传》18:2 记他命犹太人离开罗马，和合本译作“革老丢”。

  他的第三个妻子梅萨利娜在 48 年因与情人公然举行婚礼被处死。次年他娶了侄女小阿格里皮娜，又收养她的儿子尼禄，排在亲生儿子不列塔尼库斯之前。54 年 10 月 13 日他去世，古代作家几乎都说是阿格里皮娜用毒蘑菇毒死的。
sources: []
recalled:
