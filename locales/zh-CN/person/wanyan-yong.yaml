name: 金世宗
aliases: [完颜雍, 乌禄]
role: 金朝皇帝
summary: 金太祖之孙，海陵王南侵时在辽阳称帝；与宋订立隆兴和议，在位期间号称“大定之治”。
body: |-
  完颜雍女真名乌禄，是金太祖之子完颜宗辅的儿子，生于天辅七年（公元 1123 年）。他的母亲是渤海人李氏，受过汉文化的熏陶。海陵王在位时猜忌宗室，他屡次以献宝物等方式自保，海陵王还逼死了他的妻子乌林答氏。

  正隆六年（1161 年）海陵王大举南侵，国内怨声载道，东京留守完颜雍在辽阳被拥立为帝，改元大定。不久海陵王在瓜洲被部下杀死，世宗进入中都，稳定了局势。他一面平定契丹人的起义，一面与南宋作战，隆兴元年（1163 年）在宿州、符离击败宋军，次年与宋订立隆兴和议，宋金改为叔侄之国，岁币有所减少（另见“隆兴北伐”条）。此后宋金之间维持了四十多年的和平。

  世宗在位二十九年，勤于政事，生活节俭，注重选用廉能的官吏，减免赋税，鼓励垦荒，金朝的经济和社会在这一时期达到稳定繁荣，史称“大定之治”，他本人被称为“小尧舜”。他担心女真人汉化后丧失尚武的传统，提倡女真语言、文字和旧俗，设立女真进士科，把儒家经典译成女真文，又曾于大定二十四年（1184 年）回到上京会宁府巡幸一年多。

  大定二十九年正月（1189 年），世宗在中都去世。太子完颜允恭早死，由皇太孙完颜璟即位，即金章宗。
sources: []
recalled:
  - 《金史·世宗本纪》
