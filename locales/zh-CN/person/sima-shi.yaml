name: 司马师
aliases: [司马子元, 晋景帝]
role: 大将军
summary: 司马懿长子，继父执掌魏政，废魏帝曹芳，平定淮南毌丘俭之乱后病死。
body: |-
  据《晋书·景帝纪》，司马师字子元，是司马懿的长子，原籍河内温县。嘉平元年（公元 249 年）他参与谋划高平陵之变，事先暗中蓄养了三千名死士，事发当天集合起来控制了雒阳的要地。司马懿去世后，他以抚军大将军辅政，次年升为大将军。

  嘉平六年（254 年），中书令李丰等人密谋用夏侯玄取代司马师，事情败露，李丰、夏侯玄等都被处死。同年司马师以皇帝曹芳荒淫无度为由，请太后下令将他废黜，另立十四岁的高贵乡公曹髦。

  正元二年（255 年）正月，镇东将军毌丘俭与扬州刺史文钦在寿春起兵，声讨司马师。司马师当时刚做过割除眼部肿瘤的手术，仍带病亲征，击溃了对方。本纪说，文钦之子文鸯夜袭军营时他受到惊吓，眼疾加重。同年他死在许昌，终年四十八，由弟弟司马昭接掌大权。
sources: []
recalled:
  - 《晋书·景帝纪》
  - 《三国志·魏书·三少帝纪》
