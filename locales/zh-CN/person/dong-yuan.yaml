name: 董源
aliases: [董元, 董叔达, 董北苑]
role: 南唐画家
summary: 南唐画家，开创了以平淡天真为特色的江南山水画风格，后世尊为南派山水之祖。
body: |-
  董源又作董元，字叔达，钟陵人，在南唐中主李璟时任北苑副使，所以后人称他为“董北苑”。他的生年不详，一般认为他卒于宋太祖建隆三年（公元 962 年）前后。史书关于他生平的记载很少，主要见于宋人的画史著作。

  董源擅长山水画，也画人物和龙、牛等。据宋代郭若虚《图画见闻志》，他的山水有两种风格，一种用水墨，类似王维；一种着色，类似李思训。他最有影响的是描绘江南景色的水墨山水：画中多是平缓的山峦、草木丰茂的丘陵、开阔的江湖水面，用长而柔和的线条（后世称为“披麻皴”）表现土质山坡，用点子表现草木，近看似乎粗略，远看则景物清晰。

  董源在北宋时并不特别受重视，北宋后期的米芾在《画史》中给予他很高的评价，称赞他的画平淡天真，唐代没有这样的作品。元代的黄公望、倪瓒、王蒙、吴镇等画家都学习他的画法。明代董其昌把山水画分为南北二宗，把董源和他的学生巨然推为南宗的代表，二人合称“董巨”。

  传为董源的作品有《潇湘图》（北京故宫博物院藏）、《夏景山口待渡图》（辽宁省博物馆藏）、《夏山图》（上海博物馆藏）、《龙宿郊民图》（台北故宫博物院藏）等，但哪些是他的真迹，学界意见并不一致。
sources: []
recalled:
  - 郭若虚《图画见闻志》卷三
  - 米芾《画史》
  - 《宣和画谱》卷十一
