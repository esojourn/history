name: 马可
aliases:
  - 约翰·马可
  - 称呼马可的约翰
role: 使徒的同工
summary: 巴拿巴的表弟，随保罗、巴拿巴布道，传统上认为是《马可福音》的作者。
body: |-
  《使徒行传》称他为“称呼马可的约翰”。他的母亲马利亚在耶路撒冷有住宅，彼得从监里出来，就是到这家去，当时有好些人聚集在那里祷告（12:12）。他的生年没有记载。《歌罗西书》4:10 说他是巴拿巴的表弟。

  巴拿巴和扫罗从耶路撒冷回安提阿时带他同去（徒 12:25）；两人受差遣出行，他在居比路作帮手，到了旁非利亚的别加，他就离开他们回耶路撒冷去了（13:5、13:13）。第二次出行前，巴拿巴有意再带他去，保罗不同意，两人因此分开，巴拿巴带着马可往居比路去（15:37–39）。后来的书信里，保罗把他列在同工当中（《歌罗西书》4:10；《腓利门书》第 24 节），又嘱咐提摩太把马可带来，说他在传道的事上有益处（《提摩太后书》4:11）。《彼得前书》5:13 称他为“我儿子马可”。

  《马可福音》本身没有署名。据优西比乌《教会史》所引二世纪帕皮亚的说法，马可作过彼得的传译，把彼得所讲的记了下来，教会传统据此认为这卷福音书是他写的。他的结局新约没有记载；相传他在埃及的亚历山大建立教会，并在那里殉道。
sources: []
recalled:
  - 《使徒行传》12:12、12:25，13:5、13:13，15:36–39
  - 《歌罗西书》4:10；《腓利门书》第 24 节；《提摩太后书》4:11
  - 《彼得前书》5:13
  - 优西比乌《教会史》卷 2 第 16 章、卷 3 第 39 章
