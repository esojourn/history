name: 陶侃
aliases: [陶士行, 长沙郡公]
role: 太尉、荆州刺史
summary: 东晋名将，出身寒微，平定杜弢和苏峻之乱，晚年都督八州，以勤于职事著称。
body: |-
  陶侃字士行，本是鄱阳人，吴国灭亡后全家迁到庐江郡的寻阳。他的父亲做过吴国的将军，去世很早，家境贫寒。他年轻时在县里做小吏。《晋书》本传记载，有一次孝廉范逵路过他家，家中无物待客，他的母亲湛氏剪下头发换来酒菜；范逵回去后向庐江太守称扬他，他才得以被举为孝廉，到洛阳谋职。在讲究门第的洛阳，他这样出身的南方人很难立足。

  西晋末年，他受荆州刺史刘弘赏识，领兵击败了起事的张昌，后来又抵御陈敏。司马睿经营江东时他归其指挥，建兴年间打败流民首领杜弢，升任荆州刺史。王敦忌惮他的战功，把他调到偏远的广州。本传说他在广州无事，每天早晨把一百块砖搬到屋外，傍晚再搬回屋里，别人问起，他说自己还要致力于中原，过于安逸恐怕日后不堪任事。

  王敦之乱平定后，太宁三年（公元 325 年）他被调回，任征西大将军、荆州刺史。咸和三年（328 年）苏峻攻陷建康，温峤、庾亮推他为盟主。他起初对自己没有列名顾命大臣有怨言，经温峤劝说才率军东下，次年与各路军队一起平定了叛乱。此后他升任太尉，都督荆、江等八州军事，封长沙郡公，又派部将收复了襄阳。

  本传说他处理公务终日不倦，远近来信都亲手作答，常对人说：大禹是圣人，尚且珍惜每一寸光阴，普通人更该珍惜每一分光阴。造船剩下的木屑和竹头他都叫人收存起来，后来分别用来铺雪后的地面和做船钉。咸和九年（334 年）他因病上表辞职，乘船返回长沙的封地，途中在樊溪去世，时年七十六。诗人陶渊明是他的曾孙。
sources: []
recalled:
