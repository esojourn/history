name: 郭璞
aliases: [郭景纯]
role: 学者、文学家
summary: 两晋之际的学者、文学家，注《尔雅》《山海经》，作《游仙诗》，因劝阻王敦起兵被杀。
body: |-
  郭璞字景纯，河东闻喜人。《晋书》本传说他博学多才，喜好古文奇字，不善言谈而辞赋为当时之冠，又精通阴阳历算和占卜。西晋末年河东将乱，他带着亲友几十家向东南避地，渡江后在王导幕府任参军。

  晋元帝时，他因献《江赋》《南郊赋》受到赏识，任著作佐郎，后来升为尚书郎，多次借灾异上书劝谏。母亲去世后他离职守丧，没有期满就被王敦起用为记室参军。太宁二年（公元 324 年）王敦准备再次起兵，让他占卜。据本传，他说举事不会成功，又说王敦如果起兵，很快有祸，留在武昌则寿命不可限量。王敦大怒，把他斩首，时年四十九。王敦之乱平定后，朝廷追赠他为弘农太守。

  他为《尔雅》《方言》《山海经》《穆天子传》《楚辞》等古书作注，其中《尔雅注》和《山海经注》流传至今，是阅读这些书的基本依据。他的《游仙诗》借咏神仙抒发怀抱，在东晋诗歌中很有名。后世的术数家把他奉为祖师，《葬书》等书托名于他。
sources: []
recalled:
  - 《晋书·郭璞传》
  - 《文选》
