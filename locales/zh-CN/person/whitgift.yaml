name: "惠特吉夫"
aliases: ["约翰·惠特吉夫"]
role: "坎特伯雷大主教"
summary: "剑桥三一学院院长，后任坎特伯雷大主教，压制清教徒，力维主教制。"
body: |-
  惠特吉夫约 1530 年生于林肯郡格里姆斯比，在剑桥读书，1567 年任三一学院院长。他在剑桥与卡特赖特正面交锋，以院长和副校长的身份使卡特赖特失去教席，此后又写书与他辩论教会制度。

  《历史的轨迹》第三十一章称他为早期反清教徒的首脑人物，说卡特赖特是在他的“阴谋”下被撤职的。这是作者站在清教徒一边的说法；一般史书只说他借职权把卡特赖特排挤出剑桥。

  1583 年伊丽莎白任命他为坎特伯雷大主教。他要求所有牧师签字承认女王的最高治权、公祷书和三十九信条，拒签的停职，长老派的秘密集会被一一查办。他一直做到 1604 年，在伦敦去世，詹姆士一世初年的汉普顿宫会议他也参加了。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
recalled:
  - "惠特吉夫 1583 年的《条款》"
