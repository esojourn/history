name: 司提反
aliases: []
role: 耶路撒冷教会七执事之首
summary: 耶路撒冷教会选出的七人之一，在公会申辩后被石头打死。
body: |-
  司提反的出身和生年，圣经没有记载。据《使徒行传》第 6 章，耶路撒冷的门徒增多，说希腊话的犹太人埋怨他们的寡妇在天天的供给上被忽略，十二使徒就叫众人选出七个人管理这事，司提反列在第一位（6:1–6）。经上说他满得恩惠、能力，在民间行了大奇事和神迹（6:8）。

  利百地拿会堂等几处会堂的人起来和他辩论，敌不过他，就买出人来告他说谤讟摩西和神的话，把他拿到公会（6:9–14）。司提反在公会上从亚伯拉罕蒙召讲起，历述约瑟、摩西和旷野中的会幕，直到所罗门建殿，末了责备听的人常时抗拒圣灵（第 7 章）。众人把他推到城外，用石头打他；他临死时求主不要将这罪归于他们（7:58–60）。作见证的人把衣裳放在一个名叫扫罗的少年人脚前，这人就是后来的保罗。

  从那一天起，耶路撒冷的教会大遭逼迫，除了使徒以外，门徒都分散在犹太和撒玛利亚各处（8:1），也有人走到腓尼基、居比路和安提阿（11:19）。教会传统称司提反为第一位殉道者。圣经没有给出他遇害的年份，通行的约数是由保罗归信的年代推算出来的。
sources: []
recalled:
  - 《使徒行传》第 6—7 章，8:1–4，11:19，22:20
