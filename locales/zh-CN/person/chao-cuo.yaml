name: 晁错
aliases:
  - 鼂错
role: 御史大夫
summary: 景帝时的御史大夫，力主削减诸侯王封地；七国起兵后被景帝处死。
body: |-
  颍川人，生年不详。据《史记·袁盎晁错列传》，他早年在轵县张恢那里学申不害、商鞅的刑名之学，后任太常掌故。文帝时朝廷派他到济南向年过九十的伏生学习《尚书》。回来后他任太子家令，因善辩受到太子刘启信任，太子家中称他为“智囊”。他多次上书，主张削弱诸侯、更定法令。

  景帝即位后，他任内史，不久升为御史大夫，请求追究诸侯王的罪过，削去他们的封地。他的父亲从颍川赶来劝阻，说“刘氏安矣，而晁氏危矣”，不久服毒自尽。公元前 154 年，吴、楚等七国以诛晁错为名起兵。袁盎等人劝景帝杀晁错以换取七国罢兵，景帝便下令将他在长安东市处斩。七国并未因此退兵。
sources:
  - 《史记·袁盎晁错列传》 https://ctext.org/shiji/yuan-ang-chao-cuo-lie-zhuan/zhs
  - 《汉书·爰盎晁错传》
  - 《史记·吴王濞列传》 https://ctext.org/shiji/wu-wang-bi-lie-zhuan/zhs
