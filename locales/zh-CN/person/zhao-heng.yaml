name: 宋真宗
aliases: [赵恒, 赵元侃]
role: 北宋皇帝
summary: 宋太宗之子，997 年继位，与辽订立澶渊之盟，晚年举行天书封禅。
body: |-
  宋真宗赵恒是宋太宗的第三子，开宝元年（公元 968 年）生于开封，原名元侃，至道元年（995 年）被立为太子，改名恒。至道三年（997 年）太宗去世，他在宰相吕端等人的维护下即位。

  即位之初，他任用李沆、吕端等人，政事比较安定。景德元年（1004 年）秋，辽圣宗和承天太后萧绰率大军南下，深入到黄河边的澶州。朝中有人主张迁都金陵或成都避敌，宰相寇准力主亲征，真宗勉强到达澶州，登上北城城楼，宋军士气大振。双方随即议和，订立盟约：宋每年给辽绢、银，两国约为兄弟，各守边界，史称“澶渊之盟”（另见该条）。此后宋辽之间一百多年没有大的战争。

  澶渊之盟以后，王钦若对真宗说，城下之盟是耻辱，只有封禅才能镇服四海、夸示外国。大中祥符元年（1008 年），宫中和泰山先后出现“天书”，真宗随即东封泰山，此后又西祀汾阴，大建玉清昭应宫，各地争献祥瑞（另见“天书封禅”条）。这些活动耗费很大，后世多有批评。这一时期王钦若、丁谓等人得到重用，寇准则被排挤出朝。

  真宗晚年多病，政事逐渐由刘皇后处理。乾兴元年（1022 年）二月他去世，年仅十三岁的太子赵祯继位，即宋仁宗，刘太后临朝听政。
sources: []
recalled:
  - 《宋史·真宗本纪》
  - 《续资治通鉴长编》卷四十一至九十八
