name: 司马相如
aliases: [司马长卿]
role: 辞赋家
summary: 西汉辞赋家，以《子虚赋》《上林赋》受知于汉武帝，曾奉命出使西南夷。
body: |-
  据《史记·司马相如列传》，司马相如字长卿，蜀郡成都人，年轻时喜好读书、学习击剑，因仰慕战国时的蔺相如而改名相如。他的生年没有记载，约在文帝初年。景帝时他出钱捐得郎官，任武骑常侍，但景帝不喜欢辞赋。梁孝王入朝时带来邹阳、枚乘等文士，他便托病辞官，到梁国与这些人同游，在那里写了《子虚赋》。

  梁孝王死后他回到蜀地，家贫无以为生，投靠临邛县令。临邛富人卓王孙宴请他，卓王孙新寡的女儿卓文君听了他的琴声，当夜与他私奔到成都。后来两人回到临邛开酒铺，文君当垆卖酒，相如与佣工一起洗涤器具。卓王孙深以为耻，不得已分给他们奴仆和钱财。

  武帝读到《子虚赋》大为赞赏，以为是古人所作。同乡杨得意在宫中管理猎犬，告知作者尚在，武帝于是召见相如。他又写了描写天子游猎的《上林赋》，被任为郎。赋中铺陈苑囿和田猎的盛况，篇末归结到节俭。这种篇幅宏大、辞藻繁富的写法成为汉代大赋的范式。

  唐蒙开通夜郎时在巴蜀征发过急，武帝派相如前去安抚，他写了《喻巴蜀檄》。此后他以中郎将的身份持节出使，招抚邛、筰等西南夷部族，并作《难蜀父老》为朝廷辩护。后来有人告他出使时受贿，他被免官，一年多后复任郎官，又任孝文园令。他患有消渴病，晚年辞官住在茂陵，元狩五年（公元前 118 年）去世。武帝派人到他家取遗稿，只得到一篇谈封禅的文章。
sources: []
recalled:
  - 《史记·司马相如列传》
  - 《汉书·司马相如传》
