name: 郭崇韬
aliases: [郭安时]
role: 后唐枢密使
summary: 后唐庄宗的枢密使，力主奇袭开封灭梁，925 年领兵灭前蜀，次年在成都被杀。
body: |-
  郭崇韬是代州雁门人，字安时，早年在李克用手下处理事务，以精明干练著称。李存勖继位后用他为中门使，后来升任枢密使，执掌军政机要。

  同光元年（公元 923 年），后唐与后梁在黄河两岸对峙，形势胶着，不少将领主张议和。郭崇韬与李嗣源力主乘后梁主力在外、开封空虚之机直取开封，庄宗采纳了这一建议，一举灭梁。同光三年（925 年），庄宗以长子李继岌为都统、郭崇韬为招讨使，率军伐蜀。据《资治通鉴》，大军出发后七十天，前蜀后主王衍便投降了（另见“后唐灭前蜀”条）。

  郭崇韬为人刚直，曾多次劝庄宗节制伶人、宦官，因而结怨甚多。灭蜀之后，宦官向庄宗和刘皇后进谗，说他想在蜀地自立。刘皇后亲自写下命令，让李继岌除掉他。同光四年（926 年）正月，郭崇韬在成都被杀，几个儿子也同时遇害。这件事使得朝中将士人人自危，不久便爆发了推翻庄宗的兵变。他的生年史书没有明确记载。
sources: []
recalled:
  - 《旧五代史·唐书·郭崇韬传》
  - 《新五代史·唐臣传·郭崇韬》
  - 《资治通鉴》卷二百七十三至二百七十四
