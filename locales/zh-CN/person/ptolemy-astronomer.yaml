name: 托勒密（天文学家）
aliases: [克劳狄乌斯·托勒密, 托勒玫, 多禄某]
role: 天文学家、地理学家
summary: 亚历山大城的天文学家，《天文学大成》的地心体系通行一千四百年。
body: |-
  天文学家托勒密全名克劳狄乌斯·托勒密，生平几乎没有记载。《天文学大成》里他本人在亚历山大城所做观测的年份，从公元 127 年排到 141 年；146 或 147 年他在城郊立过一块刻有天文参数的碑。由此推断他约生于 100 年，卒于 170 年前后。“克劳狄乌斯”表明他有罗马公民权。他与托勒密王朝的国王没有关系，中世纪的人把二者混为一谈，画像里常给他戴上王冠。

  《天文学大成》十三卷，原名《数学汇编》，今天西方通用的书名来自阿拉伯文译本的标题。书中以地球居于宇宙中心不动，日、月、五星各沿本轮、均轮运行，又引入“偏心匀速点”，使算出的行星位置与观测相符；书里有一份弦表，以及一千零二十多颗恒星的星表，分属四十八个星座，是在前人喜帕恰斯的基础上编成的。这套体系被阿拉伯和欧洲的天文学家沿用，直到 1543 年哥白尼提出日心说以后才逐渐被取代。

  《地理学》八卷讲怎样把球面画到平面上，并给出约八千个地点的经纬度，范围西起大西洋上的岛屿，东到“赛里斯”和“秦奈”，也就是中国一带。书里的数据多得自商旅的行程推算，误差不小；他采用了偏小的地球周长，又把亚洲向东画得过长，十五世纪这部书译成拉丁文后，哥伦布正是据此认为向西航行不远就能到亚洲。

  他还著有讲占星的《四书》、讲反射和折射的《光学》、讲乐律的《谐和论》，以及供推算用的《实用天文表》和《行星假说》。本站把在亚历山大城工作的学者一律放在埃及泳道，他也在其中。
sources: []
recalled:
  - 托勒密《天文学大成》卷 1、卷 3、卷 7—8
  - 托勒密《地理学》卷 1、卷 7
  - 卡诺珀斯碑文
