name: 大流士一世
aliases: [大利乌, 大流士大帝]
role: 波斯国王
summary: 波斯阿契美尼德王朝第三位国王，整顿帝国行省，两次出兵希腊。
body: |-
  阿契美尼德家族旁支，父亲叙司塔斯佩斯。他原是冈比西斯二世的侍卫。公元前 522 年冈比西斯死于从埃及回国途中，王位由自称是冈比西斯之弟巴尔迪亚的人占据。大流士与六名波斯贵族合谋将此人杀死，自立为王。他在贝希斯敦的山崖上用古波斯文、埃兰文、巴比伦文刻下长篇铭文，说被杀的是冒名的祭司高墨达，并记述他在一年多的时间里平定巴比伦、米底、埃兰等地的叛乱。铭文是胜利者的一面之词，被杀者是否真是冒名，现代学者有怀疑。

  他把帝国划为若干行省，各设总督，规定贡赋的数额（希罗多德说是二十个行省，并逐一列出税额），铸造金币，修筑从苏萨到萨迪斯的“御道”并设驿站，开通尼罗河与红海之间的运河。苏萨的宫殿和波斯波利斯的营建都始于他。帝国的疆域在他治下最广，东到印度河流域。

  约前 513 年，他渡过博斯普鲁斯海峡和多瑙河进攻斯基泰人，没有取得战果，但控制了色雷斯。前 499 年小亚细亚的希腊城邦起义，雅典和厄瑞特里亚派船相助，萨迪斯被焚；起义在前 493 年被平定。前 492 年马铎尼斯西征，舰队在阿索斯海角遇风暴损失惨重。前 490 年达提斯和阿尔塔斐尔涅斯渡海，毁掉厄瑞特里亚，在马拉松被雅典人击败。他准备再次出征，埃及又发生叛乱，前 486 年他在备战中去世，葬于波斯波利斯附近的纳克什·鲁斯塔姆，王位传给薛西斯。

  圣经和合本称他“大利乌”。据《以斯拉记》，他查出居鲁士准许重建圣殿的诏令，命令地方官不得阻拦，圣殿在他在位第六年完工；《哈该书》《撒迦利亚书》里的日期都按他的在位年份记载。
sources: []
