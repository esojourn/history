name: 慧远
aliases: [释慧远, 远公]
role: 僧人
summary: 东晋高僧，道安的弟子，居庐山东林寺三十余年，倡念佛往生，后世尊为净土宗初祖。
body: |-
  慧远俗姓贾，雁门楼烦人。他十三岁随舅父到许昌、洛阳一带求学，通读儒家经典，尤其熟悉《老子》《庄子》。二十一岁时他本想渡江去追随隐士范宣，因道路不通未能成行，听说道安在太行山讲经，就去听讲。据《高僧传》，他听了《般若经》后感叹说，儒家、道家各派的学说都不过是糠秕，于是与弟弟慧持一同出家，成为道安最得力的弟子，后来随道安南下襄阳。

  太元三年（公元 378 年）前秦进攻襄阳，道安遣散徒众，他带着几十人东下，原想去罗浮山，太元六年路过寻阳，见庐山清静，就住了下来。江州刺史桓伊为他修建了东林寺。此后三十多年他没有离开过庐山，《高僧传》说他送客散步只到虎溪为止。

  他在庐山聚徒讲学，派弟子西行求取经本，请来到南方的西域、天竺僧人翻译经论，又与长安的鸠摩罗什通信讨论教义。元兴元年（402 年），他与刘遗民、雷次宗、宗炳等僧俗一百二十三人在阿弥陀佛像前立誓，共同期望往生西方净土。后世的净土宗把这次结社看作本宗的起点，尊他为初祖；“白莲社”的名称则是后来才有的。

  他与当时的权要多有往来而保持距离。桓玄执政时下令淘汰僧尼，又主张僧人应当向君主行跪拜之礼，他写信力争，并作《沙门不敬王者论》五篇，说明出家人不受世俗礼法约束，桓玄最终没有强行。他还写有《明报应论》《三报论》等，用中国士人熟悉的语言解释因果报应和形尽神不灭的道理。义熙十二年（416 年）他在东林寺去世，时年八十三。
sources: []
