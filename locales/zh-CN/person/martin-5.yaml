name: 马丁五世
aliases:
  - 奥多·科隆纳
  - 玛尔定五世
role: 罗马主教（教皇）
summary: 1417 年在康斯坦茨会议上当选的教皇，他的当选结束了近四十年的西方教会大分裂。
body: |-
  马丁原名奥多·科隆纳，1369 年生于罗马东面的杰纳扎诺，出自罗马最有势力的贵族之一。1405 年他任枢机。大分裂中他起初属罗马一系，1408 年离开贵格利十二世，参加了比萨会议，此后追随比萨选出的教皇。

  1414 年起在康斯坦茨举行的大公会议先解决了三位教皇并立的局面，然后在 1417 年 11 月选举新教皇。这次参加选举的除了枢机，还有会议五个“民族”各派的六名代表。11 月 11 日科隆纳当选，那天是圣马丁节，他取名马丁。《历史的轨迹》第十九章说，其他三位教皇为免引起更大的难处，一致支持马丁五世。实际的经过是：罗马一系的贵格利十二世在 1415 年自己辞职；比萨一系的约翰二十三世同年被会议废黜，后来向马丁表示服从；阿维农一系的本笃十三世在 1417 年被废黜，但始终不肯承认，退守西班牙的一座海边城堡，直到 1423 年去世。

  会议原想在选出教皇之前先定下改革的办法。马丁当选后只同各国分别订了协议，1418 年 4 月宣布会议结束，并禁止人越过教皇向大公会议上诉。他在佛罗伦萨住了一年多，1420 年 9 月才进入罗马。城市经过多年战乱已经残破，他修复教堂和城墙，收回教皇国的土地，同时大量任用自己家族的人。

  他多次号召十字军讨伐波希米亚的胡斯派，都失败了。康斯坦茨会议下令掘出威克里夫的遗骨焚毁，这道命令是 1428 年在他催促之下执行的。按会议定期开会的规定，他召集的一次会议草草收场；下一次定在巴塞尔，开幕之前他于 1431 年 2 月去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十九章“教会权势衰微” https://wellsofgrace.com/books/spiritual/2000years/html/chapter21.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 里亨塔尔的乌尔里希《康斯坦茨会议纪事》
  - 康斯坦茨会议第 41 次会议记录与教令《经常》
  - 《教皇列传》续编马丁五世传
