name: "布塞"
aliases: ["马丁·布塞", "布塞珥", "布策尔"]
role: "斯特拉斯堡的改教家"
summary: "斯特拉斯堡教会的领袖，致力调和路德与慈运理两派，接待过加尔文，晚年在剑桥任教。"
body: |-
  布塞 1491 年生于阿尔萨斯的塞莱斯塔，十五岁进多明我会，后来被送到海德堡读书，喜欢伊拉斯谟的著作。《历史的轨迹》第二十二章说，他是路德在莱比锡辩论中赢得的跟从者。按他自己的信，他是 1518 年 4 月在海德堡听了路德在奥古斯丁会年会上的辩论而倾心的，比莱比锡辩论早一年多。1521 年他获准脱离修会，次年与一位离开修道院的修女结婚。

  1523 年他到帝国自由城市斯特拉斯堡，此后二十五年是那里教会的领袖。他与同工拟定礼拜的次序和教会的规章，重视长老对信徒的督责。路德与慈运理为圣餐相争，他极力调解，1529 年出席马尔堡会谈，1530 年替南德意志四座城市起草《四城信条》，1536 年终于与路德达成《维滕贝格协同书》。

  1538 年加尔文被逐出日内瓦，该书第二十四章说是布塞邀他到斯特拉斯堡。加尔文在那里牧养法语难民教会三年，后来在日内瓦设立的长老、教会惩戒和礼拜的做法，许多得自布塞。该书称布塞帮助加尔文建立了他的观点。他还代表新教一方出席皇帝安排的几次会谈。

  1548 年皇帝战胜后颁布《奥格斯堡临时敕令》，布塞不肯接受，被迫离开斯特拉斯堡。该书第二十八章说，克兰麦请他到英格兰，在剑桥任教。他在那里对英文公祷书提了修改意见，并为爱德华六世写了《论基督的国》。1551 年 2 月底他在剑桥去世。玛丽女王在位时，他的遗骨被掘出焚烧，伊丽莎白即位后又为他恢复名誉。
sources:
