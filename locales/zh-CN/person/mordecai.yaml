name: 末底改
aliases: []
role: 波斯朝臣
summary: 便雅悯人，以斯帖的堂兄和养父，后任亚哈随鲁王的宰相。
body: |-
  便雅悯人，睚珥的儿子，住在书珊城，在朝门供职（《以斯帖记》2:5、2:19）。2:6 提到随犹大王耶哥尼雅一同被掳的事，这句话说的是他本人还是他的曾祖基士，读法不一；若指他本人，到亚哈随鲁年间他已一百多岁，所以多数解释认为指他的先祖。他收养了叔叔的女儿以斯帖。生卒年圣经没有记载。

  以斯帖入宫后，他得知两个守门的太监想要下手害王，就通过以斯帖报告，此事记在历史上（2:21–23）。哈曼得势后，朝门的臣仆都向他跪拜，唯独末底改不拜，哈曼因此图谋灭绝所有犹太人（第 3 章）。末底改披麻蒙灰，并传话劝以斯帖进宫求王（第 4 章）。

  一夜王睡不着觉，叫人念历史，才知道末底改救驾未得赏赐，就命哈曼给他穿上朝服，牵马引他走遍城里的街市（第 6 章）。哈曼被处死后，王把从哈曼追回的戒指给了末底改，他奉王的名写谕旨准许犹太人自卫（第 8 章）。《以斯帖记》10:3 说他作亚哈随鲁王的宰相，在犹大人中为大。此外圣经没有别的记载。
sources: []
recalled:
  - 《以斯帖记》第 2—10 章
