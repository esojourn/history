name: 白兰地娜
aliases:
  - 布兰迪娜
role: 里昂殉道者
summary: 公元 177 年里昂逼迫中殉道的女奴，是那次逼迫中最后受死的人之一。
body: |-
  白兰地娜是高卢里昂教会的一名女奴，生平只见于里昂和维也纳教会写给亚西亚、弗吕家众教会的信。这封信由优西比乌收在《教会史》卷 5 第 1 章，《历史的轨迹》第二章所述即出于这一记载。

  据这封信，公元 177 年，马可·奥勒留在位时，里昂和维也纳的基督徒被捕下狱，受了多日酷刑。有罗马公民身份的被斩首，其余的被投给竞技场的野兽。白兰地娜身体瘦弱，却在刑讯中一再说"我是基督徒，我们中间没有做恶事的"。她被绑在柱上示众，多次带回场上，最后被网罩住，被野牛抛起至死，是这次逼迫中最后受死的人之一。殉道者的尸体被焚烧，灰烬撒进罗讷河。史料所载仅此。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
recalled:
  - 里昂和维也纳教会的信，见优西比乌《教会史》卷 5 第 1 章
