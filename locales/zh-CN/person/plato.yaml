name: 柏拉图
aliases: [阿里斯托克勒斯]
role: 哲学家
summary: 雅典哲学家，苏格拉底的弟子，创办学园，以对话体著作传世。
body: |-
  雅典人，出身世家。父亲阿里斯通，母亲珀里克提娥涅；三十僭主中的克里提亚斯是他母亲的堂兄弟，卡尔米德是他的舅舅。生年通常定在公元前 428 年或前 427 年，出生地有雅典和埃伊纳岛两说。据第欧根尼·拉尔修，他本名阿里斯托克勒斯，“柏拉图”是后来的称呼，这一说法是否可靠有争议。他年轻时跟随苏格拉底。前 399 年苏格拉底受审时他在场，行刑那天据《斐多篇》所说因病不在。

  苏格拉底死后，他离开雅典，相传先到麦加拉，其后的游历各书所说不一。约前 388 年他到意大利南部和西西里，结识塔兰托的毕达哥拉斯派学者阿尔库塔斯，并在叙拉古见到僭主狄奥尼修斯一世和他的妻弟狄翁。后世有他被狄奥尼修斯交给斯巴达人、在埃伊纳岛被卖为奴又被赎回的说法，出自较晚的传记。

  约前 387 年他回到雅典，在城外名为阿卡德摩斯的园林旁设立学园，讲授哲学和数学。亚里士多德十七岁入学园，在那里约二十年；数学家欧多克索斯也曾在学园。前 367 年狄奥尼修斯一世去世，柏拉图应狄翁之请再到叙拉古教导狄奥尼修斯二世，不久狄翁被逐，他也无功而返；约前 361 年第三次前往，同样没有结果。归在他名下的《第七封信》讲述了这几次经历，这封信是否他本人所写，学者意见不一。

  他的著作是三十多篇对话和若干书信，对话里他自己从不出场，主要的发言人多是苏格拉底。通常分为早、中、晚三期：早期的《申辩篇》《克里同篇》等较接近苏格拉底的问答；中期的《斐多篇》《会饮篇》《理想国》提出“理念”（又译“相”“型”）说，认为可感的事物之外另有不变的理念，是知识的对象，《理想国》里的洞穴比喻和由哲学家治理城邦的主张即出于此；晚期有《巴门尼德篇》《智者篇》《蒂迈欧篇》和篇幅最长的《法律篇》。

  他约在前 348 年或前 347 年去世，享年约八十岁。学园由外甥斯彪西波接掌，此后延续数百年。
sources: []
recalled:
  - 柏拉图《第七封信》；《斐多篇》59b
  - 第欧根尼·拉尔修《名哲言行录》卷三
  - 普鲁塔克《狄翁传》
