name: 田单
aliases: [安平君]
role: 齐国将领
summary: 齐国将领，坚守即墨，以反间计和火牛阵大破燕军，收复齐国。
body: |-
  田单是齐国王族田氏的远支，生卒年不详。燕将乐毅破齐时，他在临淄做市场的小吏。据《史记·田单列传》，他逃难时让族人把车轴的末端锯短并用铁皮包住，别人的车在争道中撞断车轴被俘，他的族人得以逃到即墨。即墨守将战死后，众人推举田单为将。

  田单坚守即墨数年。公元前 279 年燕昭王死，田单派人到燕国散布流言，说乐毅故意拖延不攻，想在齐地称王，燕惠王于是以骑劫代替乐毅。田单又故意放出风声，说最怕燕军割下齐国降卒的鼻子、挖掘城外的齐人坟墓，燕军照做，即墨军民愤怒，人人求战。

  田单收集了一千多头牛，给牛披上画着五彩龙纹的红绸，牛角上绑上利刃，牛尾上绑着浸了油的芦苇，夜里点燃牛尾，从城墙凿开的几十个洞口放出，五千壮士跟在后面冲杀，城中老弱击打铜器助威，燕军大乱，骑劫被杀。齐军乘胜追击，收复了七十余城，迎齐襄王从莒回到临淄。田单被封为安平君。

  《战国策》记载他后来在齐国执政，与鲁仲连等人有交往；据《史记·赵世家》，他晚年曾到赵国任相。他的结局史书没有明确记载。

  “火牛阵”成为后世兵家常提的奇计。

  田单的事迹在《史记》中有专传，即《田单列传》。
sources: []
recalled:
  - 《史记·田单列传》
  - 《战国策·齐策六》
  - 《史记·赵世家》
