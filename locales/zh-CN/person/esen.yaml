name: 也先
aliases: [也先太师, 大元田盛大可汗]
role: 瓦剌首领
summary: 瓦剌首领，在土木堡俘虏明英宗，攻北京失败，后自称可汗，被部下所杀。
body: |-
  也先是瓦剌部首领脱欢的儿子，生年不详。明初蒙古分裂为东部的鞑靼和西部的瓦剌，两部长期争斗。脱欢控制了蒙古大汗脱脱不花，自任太师，掌握实权。正统四年（1439 年）脱欢去世，也先继任太师，向西攻打哈密，向东控制兀良哈三卫，一度威胁女真和朝鲜，势力东到辽东、西到新疆一带。

  当时瓦剌以朝贡的名义与明朝贸易，使团人数越来越多。正统十四年（1449 年）明朝宦官王振削减对瓦剌使团的赏赐，也先以此为借口分兵大举进攻明朝，在土木堡大败明军，俘虏了明英宗（另见“土木之变”条）。同年十月他挟持英宗进攻北京，被于谦击退（另见“北京保卫战”条）。此后他挟持英宗勒索未成，又想恢复与明朝的贸易，景泰元年（1450 年）无条件放回了英宗。

  景泰二年（1451 年）也先攻杀脱脱不花汗，景泰四年（1453 年）自立为可汗，号“大元田盛大可汗”，这是成吉思汗家族以外的人第一次称蒙古大汗。他的统治并不稳固，次年被部下阿剌知院攻杀，瓦剌随即衰落，鞑靼重新兴起。

  也先的兴衰反映了明代前期蒙古草原的格局：瓦剌和鞑靼此消彼长，谁控制了大汗，谁就能号令诸部。明朝对蒙古各部的朝贡贸易时开时闭，赏赐的多少常常成为双方冲突的导火索，土木之变就是一个例子。
sources: []
recalled:
  - 《明史·瓦剌传》
  - 《明英宗实录》
