name: "华兹"
aliases: ["以撒·华兹", "华滋"]
role: "公理派牧师、圣诗作家"
summary: "不从国教的公理派牧师，1707 年出版圣诗集，被称为英国近代圣诗之父。"
body: |-
  华兹 1674 年生于南安普敦，父亲是不从国教者，曾为信仰坐牢。他因不肯入国教，不能进牛津、剑桥，在伦敦近郊斯托克纽因顿的不从国教学院读书。1702 年起他做伦敦马克巷一个公理派会众的牧师，后来身体多病，长年住在朋友家中写作。

  《历史的轨迹》第三十六章说，直到那时说英语的信徒仍反对在崇拜中唱诗篇以外的诗歌；1707 年华兹的圣诗集出版后，大家的态度才改变。1719 年他又出了一本按大卫诗篇改写的诗集。作者说他的诗歌充满对神深度敬虔的表达，无愧是“英国近代圣诗的鼻祖”。他一生写了约七百五十首诗歌，如《奇妙十架》《普天同庆》（后者改写自诗篇第九十八篇）。他也写过逻辑学和儿童教育的书。1748 年他在伦敦去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十六章“循道派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter40.html"
recalled:
  - "华兹《圣诗与灵歌》（1707 年）"
  - "华兹《仿大卫诗篇》（1719 年）"
