name: 苏武
aliases: [苏子卿]
role: 中郎将、典属国
summary: 汉武帝时出使匈奴的使节，被扣留十九年，在北海牧羊，持节不降，昭帝时归汉。
body: |-
  据《汉书·李广苏建传》，苏武字子卿，杜陵人，父亲苏建曾随卫青出征，封平陵侯。他凭父亲的官职任郎，后升为栘中厩监。天汉元年（公元前 100 年），新立的且鞮侯单于送还以往扣留的汉使，武帝派苏武以中郎将的身份持节护送被扣的匈奴使者回去，副使是张胜。

  使团将要返回时，匈奴内部有人谋划劫持单于的母亲归汉，张胜私下参与了此事。事情败露后，单于派降将卫律审讯。苏武认为受审有辱使命，拔刀自刺，经抢救才活过来。卫律用威逼和利诱劝他投降，都被他拒绝。本传说单于把他关在大窖里，断绝饮食，他嚼雪和毡毛，几天不死；匈奴人又把他迁到北海无人的地方放牧公羊，说等公羊产了奶才放他回去。他在那里掘野鼠洞里的草籽充饥，起卧都拿着汉节，节上的旄毛全都脱落了。

  几年后，已经投降匈奴的李陵奉单于之命来劝他，告诉他母亲已死、妻子改嫁、两个兄弟都因事自杀，他仍不肯降。昭帝即位后，汉与匈奴和亲，汉使索要苏武，匈奴谎称他已死。随行被扣的常惠设法见到汉使，教使者对单于说，天子在上林苑射得一只雁，雁足上系着帛书，写着苏武在某处大泽中。单于只得承认。始元六年（前 81 年）苏武回到长安，本传说他出使时正当壮年，回来时须发尽白，在匈奴共十九年。

  他回朝后任典属国。次年他的儿子因上官桀一案被杀，他也被免官。宣帝即位后他受赐关内侯，神爵二年（前 60 年）去世，本传说终年八十余岁。甘露三年宣帝在麒麟阁图画功臣十一人，他名列其中。
sources: []
recalled:
  - 《汉书·李广苏建传》
