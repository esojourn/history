name: 多马·阿奎那
aliases:
  - 托马斯·阿奎那
  - 多玛斯
  - 圣多默
role: 道明会士、神学家
summary: 道明会士，巴黎大学教师，著《神学大全》，是经院哲学最重要的神学家。
body: |-
  多马约在 1225 年生于意大利罗马与那不勒斯之间的罗卡塞卡城堡，父亲是阿奎诺的伯爵。他五岁被送进附近的卡西诺山修道院，1239 年到那不勒斯大学读书，在那里读到刚译成拉丁文不久的亚里士多德著作，也认识了道明会士。1244 年他加入道明会，家里人反对，把他截回去关了一年多，终于拗不过他。

  他到巴黎和科隆跟道明会的学者大阿尔伯特学习。同学见他身躯高大、沉默寡言，叫他“哑牛”。1256 年他成为巴黎大学的神学教师，此后在巴黎和意大利各地轮流任教，其间有几年在教廷所在的地方和罗马的道明会院里。

  十二世纪以后，亚里士多德的著作连同阿拉伯学者的注释传入西欧，有人认为它与基督教信仰不能相容。多马认为理性与信仰出于同一位神，不会真正抵触：有些真理靠理性可以认识，如神的存在；另一些如三位一体、道成肉身，要靠启示才能知道。他为不信的人写了《驳异大全》，约从 1265 年起写《神学大全》，用提问、列举反对意见、再作解答的方式，把神、创造、人的行为、基督和圣礼依次讨论一遍。《历史的轨迹》第十八章把他和安瑟伦、亚伯拉德等人同列为大学里讲授经院哲学的教师，说经院哲学是神学与哲学的结合，《神学大全》是古典学问与基督教思想的综合，至今仍是天主教教育的基本教材。

  1273 年 12 月的一天，他在做弥撒时有所经历，此后停了笔，《神学大全》第三部分没有写完。据他的同伴说，他表示与自己所见的相比，写过的一切都像草秆。次年初他奉召去参加里昂会议，途中病倒，1274 年 3 月 7 日在福萨诺瓦修道院去世。

  他死后三年，巴黎主教谴责的一批命题里有几条涉及他的主张。1323 年他被列为圣徒，1879 年教皇利奥十三世发通谕，要天主教学校以他的学说为本。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
recalled:
  - 多马·阿奎那《神学大全》《驳异大全》
  - 托科的威廉《圣多马·阿奎那传》
  - 1323 年封圣案卷
