name: 窦宪
aliases: [窦伯度]
role: 大将军
summary: 东汉外戚，章帝窦皇后之兄，率军大破北匈奴，后被和帝逼令自杀。
body: |-
  据《后汉书·窦宪传》，窦宪字伯度，扶风平陵人，是东汉初年功臣窦融的曾孙，生年不详。他的妹妹被章帝立为皇后，他因此得到任用。章和二年（公元 88 年）和帝年幼即位，窦太后临朝，窦宪以侍中掌机密。不久他派人刺杀得太后宠信的都乡侯刘畅，事情败露，便自请出击匈奴以赎死罪。

  永元元年（89 年），窦宪以车骑将军与耿秉出塞，会合南匈奴的军队，在稽落山大破北匈奴，登燕然山刻石记功而还，回朝后拜大将军。永元三年他再派耿夔出居延塞，在金微山击败北单于，北单于向西远逃。《后汉书》说北匈奴从此不知去向。

  窦氏兄弟此后把持朝政。永元四年（92 年），和帝与宦官郑众等定计，收缴窦宪的大将军印绶，改封冠军侯，遣回封国，随即逼令他自杀。这也是东汉皇帝依靠宦官清除外戚的开端。
sources: []
recalled:
  - 《后汉书·窦融列传》（附窦宪）
  - 《后汉书·南匈奴列传》
