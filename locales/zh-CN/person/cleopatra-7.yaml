name: 克娄巴特拉七世
aliases: [克利奥帕特拉, 埃及艳后, 克莱奥帕特拉七世]
role: 埃及女王
summary: 托勒密王朝末代女王，先后与恺撒、安东尼结盟，亚克兴战败后自尽，埃及归罗马。
body: |-
  托勒密十二世之女，公元前 69 年生于亚历山大城，是马其顿人托勒密王朝的最后一位统治者。普鲁塔克说她通晓多种语言，是王室中第一个学会埃及语的人；又说她的容貌并非无与伦比，动人之处在于谈吐和声音。

  前 51 年父亲去世，十八岁的她与年幼的弟弟托勒密十三世共同即位。不久她被弟弟身边的廷臣逐出亚历山大城。前 48 年恺撒追庞培到埃及，据普鲁塔克，她让人把自己裹在铺盖卷里抬进王宫见恺撒。恺撒支持她，被托勒密十三世的军队围困数月；前 47 年援军赶到，托勒密十三世溺死在尼罗河中，她与另一个弟弟托勒密十四世共治。这年她生下一子，俗称恺撒里昂，她说是恺撒的儿子。前 46 年她到罗马，住在恺撒在台伯河对岸的园子里，恺撒遇刺后回国；托勒密十四世不久死去，她立儿子为共治者。

  前 41 年安东尼把她召到塔尔苏斯，问她为何资助过卡西乌斯。普鲁塔克描写她乘着紫帆的船溯基德诺斯河而上。安东尼随她到亚历山大城过冬，她后来生下一对双胞胎。前 37 年两人在安条克重聚，安东尼把腓尼基沿海、塞浦路斯等地给了她；据约瑟夫斯，她还想要犹太，只得到耶利哥附近的香脂园，租回给希律。前 34 年的亚历山大城庆典上，她被称为“众王之女王”，子女各有封地。

  屋大维把这场内战说成对埃及女王的战争。前 31 年亚克兴海战，她的六十艘船趁风突围，安东尼随后跟去。前 30 年 8 月屋大维进入亚历山大城，安东尼自杀。她在陵墓里被俘，得知将被带到罗马游街后自尽，时年三十九岁。普鲁塔克说，据说一条小毒蛇藏在无花果篮里被带进去，但真相无人知道。恺撒里昂被屋大维处死，埃及成为罗马行省；她与安东尼所生的三个孩子由屋大维娅抚养。关于她的记载大多出自敌对的罗马一方，带有屋大维宣传的痕迹。
sources: []
recalled:
  - 普鲁塔克《安东尼传》《恺撒传》第 48—49 章
  - 卡西乌斯·狄奥《罗马史》卷四十二、卷四十九至卷五十一
  - 约瑟夫斯《犹太古史》卷十五第 4 章
  - 恺撒《内战记》卷三、《亚历山大里亚战记》
