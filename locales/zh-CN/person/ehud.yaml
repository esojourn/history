name: 以笏
aliases: []
role: 士师
summary: 便雅悯人，左手便利，刺杀摩押王伊矶伦，使以色列脱离摩押的辖制。
body: |-
  以笏是便雅悯人基拉的儿子，《士师记》3:15 说他是左手便利的。他的事迹只见于《士师记》3:12–30，圣经没有记载他的生年和卒年。

  据这段记载，摩押王伊矶伦招聚亚扪人和亚玛力人攻打以色列，占据了棕树城（一般认为就是耶利哥），以色列人服事伊矶伦十八年。以色列人呼求耶和华，耶和华为他们兴起以笏。以笏打了一把两刃的剑，长一肘，绑在右腿上的衣服里面，然后代表以色列人去向伊矶伦献礼物。献完礼物，他打发抬礼物的人离开，自己从靠近吉甲的凿石之地回来，说有一件机密的事要奏告王。伊矶伦命左右退下，独自坐在凉楼上；以笏用左手从右腿上拔出剑来，刺入王的肚腹，随后关锁楼门逃走。

  以笏逃到西伊拉，在以法莲山地吹角，招聚以色列人下山，把守约旦河的渡口，不容摩押人过去。据《士师记》3:29，那时击杀的摩押人约有一万。摩押就这样被以色列人制伏，国中太平八十年。
sources: []
recalled:
  - 《士师记》第 3 章
