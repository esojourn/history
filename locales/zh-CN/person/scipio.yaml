name: 大西庇阿
aliases: [ 普布利乌斯·科尔内利乌斯·西庇阿, 阿非利加努斯 ]
role: 罗马统帅
summary: 夺取西班牙，渡海进攻非洲，在扎马击败汉尼拔。
body: |-
  全名普布利乌斯·科尔内利乌斯·西庇阿，公元前 236 年前后生于罗马的贵族家庭。前 218 年他随任执政官的父亲出征；据波利比乌斯，他在提基努斯河的骑兵战中救了负伤的父亲。前 216 年他经历了坎尼的败仗。他的父亲和叔父前 211 年在西班牙战死，次年他二十多岁，没有做过执政官，被公民大会选派去接掌西班牙的军队。

  前 209 年他攻下迦太基人在西班牙的基地新迦太基，前 206 年在伊利帕取胜，迦太基势力退出西班牙。前 205 年他当选执政官，不顾费边等人反对，于次年渡海在非洲登陆，迫使迦太基召回汉尼拔。前 202 年他在扎马击败汉尼拔，凯旋后得到“阿非利加努斯”的称号。

  前 190 年他作为副将随弟弟卢基乌斯出征安条克三世。回国后兄弟二人被指控侵吞战利品和受贿，他同老加图一派长期不和；这几场审判的经过，李维自己也说各家记载互相矛盾。他退居坎帕尼亚的利特努姆并死在那里。卒年据波利比乌斯和鲁提利乌斯为前 183 年，与汉尼拔同年；李维另记有前 187 年等说法。
sources:
  - 波利比乌斯《历史》卷十第 2—20 章；卷十四；卷十五第 1—19 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/15*.html
  - 英文维基百科“Scipio Africanus”（核对年份） https://en.wikipedia.org/wiki/Scipio_Africanus
recalled:
  - 李维《罗马史》卷二十六第 18—19、41—51 章；卷二十八至三十；卷三十八第 50—60 章（审判）；卷三十九第 52 章（卒年诸说）
