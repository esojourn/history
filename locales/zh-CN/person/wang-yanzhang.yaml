name: 王彦章
aliases: [王铁枪, 王子明]
role: 后梁将领
summary: 后梁名将，善使铁枪，人称王铁枪；923 年兵败被俘，不肯投降而死。
body: |-
  王彦章是郓州寿张人，字子明，年轻时投入朱温军中，以勇力著称。据史书，他作战时手持一杆铁枪，冲锋陷阵，军中称他为“王铁枪”。后梁与晋军在黄河两岸长期对峙，他屡次参战。

  龙德三年（公元 923 年），后唐占据了郓州，后梁形势危急。梁末帝采纳敬翔的建议，以王彦章为北面招讨使。他率军袭破黄河上的德胜南城，一度扭转战局。但他与掌权的赵岩、段凝不和，不久被撤换，由段凝统领主力。同年九月，他率领少量兵马防守郓州的中都，兵败被俘。后唐庄宗李存勖爱惜他的勇武，想让他投降，他拒绝了，随即被杀。据《新五代史》，他常对人说“豹死留皮，人死留名”。欧阳修在《新五代史》里把他列入《死节传》。
sources: []
recalled:
  - 《旧五代史·梁书·王彦章传》
  - 《新五代史·死节传·王彦章》
