name: 乌尔班二世
aliases:
  - 沙蒂永的奥多
  - 伍朋二世
role: 罗马主教（教皇）
summary: 1088—1099 年在位的教皇，1095 年在克莱蒙号召夺回耶路撒冷，发起十字军。
body: |-
  乌尔班原名奥多，约在 1035 年生于法国香槟地区的贵族家庭，在兰斯读书，作到兰斯教会的总执事，后来进克吕尼修道院，在院长于格手下任副院长。贵格利七世把他召到罗马，1080 年立他为奥斯提亚的枢机主教，又派他到德意志作使节。

  1088 年 3 月他当选教皇。那时罗马在皇帝亨利四世所立的对立教皇手里，他在城外的泰拉奇纳即位，过了几年才逐步收回罗马。他继续推行贵格利七世的主张，手段比较灵活。

  1095 年 3 月他在皮亚琴察开会，东罗马皇帝阿历克塞一世的使者到会求援，请西方出兵抵挡塞尔柱突厥人。同年 11 月他在法国克莱蒙召开会议，重申禁止买卖圣职和俗人授职。11 月 27 日他向聚集的人群讲道，号召他们去东方援救基督徒、夺回耶路撒冷。《历史的轨迹》第十七章说他出身贵族，高大英俊，善于演讲，描绘了他怎样从耶稣生平讲到圣地被亵渎、朝圣者受虐待，听众高呼“愿神旨成全”，教皇把红布剪成十字，缝在愿意去的人衣袖上。这篇讲道没有当场的记录，现存几种文本都是数年后所写，内容互有出入。

  《历史的轨迹》说他应许参加的人可以减少在炼狱中受苦的时间，战死的人得永生。克莱蒙会议的教规写的是：凡纯为虔诚、不为名利去解救耶路撒冷教会的人，这趟行程可以抵作全部补赎。

  会后他在法国各地巡行宣讲，指派勒皮主教阿德马尔作他的代表随军。1099 年 7 月 15 日十字军攻下耶路撒冷，两周后的 7 月 29 日乌尔班在罗马去世，没有来得及听到消息。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十七章“教会发起十字军运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter19.html"
recalled:
  - 沙特尔的富尔彻《耶路撒冷史》卷 1
  - 修士罗贝尔《耶路撒冷史》
  - 1095 年克莱蒙会议教规
  - 乌尔班二世致佛兰德人的信（1095 年）
