name: 萨拉丁
aliases:
  - 撒拉丁
  - 萨拉赫丁·优素福
role: 埃及与叙利亚的苏丹
summary: 阿尤布王朝的创立者，统一埃及与叙利亚，1187 年在哈丁获胜并收复耶路撒冷。
body: |-
  萨拉丁约在 1137 年生于底格里斯河畔的提克里特，是库尔德人，父亲当时是那里的守将。他在叙利亚长大，在阿勒颇、大马士革的统治者努尔丁手下任职。

  1164 年起他随叔父三次出征埃及。1169 年叔父去世，他接任埃及法蒂玛王朝的宰相；1171 年他废掉这个什叶派的王朝，让埃及重新尊奉巴格达的哈里发。1174 年努尔丁去世，萨拉丁进入大马士革，此后十多年陆续取得阿勒颇等地，把埃及和叙利亚合在一起，从南北两面围住了十字军建立的耶路撒冷王国。

  1187 年 7 月 4 日，他在加利利的哈丁歼灭了耶路撒冷王国的军队，俘虏国王居伊，随后连下沿海各城。同年 10 月 2 日耶路撒冷开城投降，城中居民交纳赎金后可以离开。《历史的轨迹》第十七章只记“公元 1187 年耶路撒冷落入埃及与叙利亚苏丹撒拉丁手中”，西欧因此组织了第三次十字军。

  德意志皇帝腓特烈一世在途中溺水而死，法王腓力二世中途回国，剩下英王理查一世与他对峙。1191 年 7 月十字军夺回阿卡，9 月在阿尔苏夫打败他，却没有能进攻耶路撒冷。1192 年 9 月双方议和：从提尔到雅法的沿海归基督徒，耶路撒冷仍归穆斯林，基督徒可以去朝拜圣墓。两人始终没有见过面。

  1193 年 3 月萨拉丁在大马士革病逝。他的秘书巴哈丁说，他身后留下的钱不够办丧事。他在哈丁战后处死了被俘的圣殿、医院两个骑士团的成员，对耶路撒冷的居民则没有屠杀，与 1099 年十字军破城时的情形不同，在西欧也得到宽厚的名声。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十七章“教会发起十字军运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter19.html"
recalled:
  - 巴哈丁·伊本·沙达德《萨拉丁传》
  - 伊本·艾西尔《历史大全》
  - 提尔的威廉《海外史》及其续编
