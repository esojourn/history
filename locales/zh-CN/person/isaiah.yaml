name: 以赛亚
aliases: []
role: 先知
summary: 犹大国的先知，历乌西雅至希西家四王，《以赛亚书》系于他的名下。
body: |-
  亚摩斯的儿子。《以赛亚书》1:1 说他在犹大王乌西雅、约坦、亚哈斯、希西家在位的时候得默示，论到犹大和耶路撒冷。第 6 章记载，乌西雅王崩的那年，他见主坐在高高的宝座上，撒拉弗彼此呼喊；有一撒拉弗用炭沾他的口，他听见主问可以差遣谁，就回答愿意去。他的妻子被称为女先知，两个儿子名叫施亚雅述和玛黑珥沙拉勒哈施罢斯（7:3、8:3）。他的生卒年圣经没有记载。

  亚哈斯年间，亚兰王利汛和以色列王比加联合上来攻打耶路撒冷。以赛亚奉命去见亚哈斯，叫他不要害怕，并说出以马内利的兆头（第 7 章）。亚哈斯却向亚述王提革拉毗列色求援（《列王纪下》16:7–9）。据第 20 章，亚述的他珥探攻取亚实突那年，以赛亚奉命露身赤脚行走三年，作为埃及和古实将被亚述掳去的预兆。

  希西家十四年，亚述王西拿基立攻取犹大的坚固城，差拉伯沙基到耶路撒冷城下劝降。希西家差人去见以赛亚，以赛亚回话说亚述王必不得来到这城，要从原路回去（第 36—37 章；《列王纪下》第 18—19 章）。希西家病重时，以赛亚先告诉他必死，随后又传话说他的寿数加增十五年，并以日影后退十度为兆头（第 38 章）。巴比伦王米罗达巴拉但遣使来访，希西家把府库的宝物都给使者看，以赛亚便预言这一切日后都要被掳到巴比伦去（第 39 章）。

  《以赛亚书》共六十六章。第 40 章以后论到被掳之民的归回，提到古列的名字（44:28、45:1），又有论耶和华仆人的几段诗（如 52:13—53:12）；新约多次引用这卷书。传统的看法认为全书都出于以赛亚；学界多数意见认为第 40—66 章成于被掳时期及以后，出自后来的作者。《历代志下》26:22、32:32 说他记录过乌西雅和希西家的事迹。圣经没有记载他的去世。相传他在玛拿西年间被锯锯死，这一说法出自后世的犹太传统和《以赛亚升天记》一类著作，不是圣经的记载。
sources: []
recalled:
  - 《以赛亚书》1:1、第 6—8 章、第 20 章、第 36—39 章、第 40—66 章
  - 《列王纪下》16:7–9、第 18—20 章
  - 《历代志下》26:22、32:32
  - 《以赛亚升天记》（殉道的传说）
