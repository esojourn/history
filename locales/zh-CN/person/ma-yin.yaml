name: 马殷
aliases: [马霸图, 楚武穆王]
role: 楚王
summary: 楚国的建立者，木匠出身，唐末据有湖南，907 年受封楚王，鼓励茶叶贸易。
body: |-
  马殷是许州鄢陵人，字霸图，据史书，他少年时做过木匠。唐末他投入秦宗权部将孙儒的军中，孙儒在淮南被杨行密击败后，余部由刘建锋、马殷率领，辗转进入湖南。乾宁三年（公元 896 年）刘建锋被部下杀死，众人推马殷为首领，他逐步平定了湖南各州。

  开平元年（907 年），后梁封他为楚王；后唐天成二年（927 年）又封他为楚国王。他对中原王朝称臣纳贡，与周边各国大体相安。据《资治通鉴》，他采纳谋士高郁的建议，允许百姓自己采茶，卖给北方来的商人，官府收取税金，又在中原各地设立邸务贩卖茶叶，楚国因此富足；他还铸造铅、铁钱在境内使用，使外地商人购得的钱币只能在楚境内换成货物。

  长兴元年（930 年），马殷在长沙去世。此后他的儿子们相继为王，互相争夺，政局混乱，后周广顺元年（951 年）楚国被南唐所灭（另见“南唐灭闽楚”条）。
sources: []
recalled:
  - 《旧五代史·世袭列传·马殷》
  - 《新五代史·楚世家》
  - 《资治通鉴》卷二百六十至二百七十七
