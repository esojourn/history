name: 施琅
aliases: [靖海侯, 襄壮]
role: 清朝福建水师提督
summary: 原为郑成功部将，结仇降清，1683 年攻克澎湖，统一台湾。
body: |-
  施琅是福建晋江人，早年在郑芝龙的部下当兵。顺治三年（1646 年）郑芝龙降清，施琅也随之降清，不久又投奔郑成功，成为郑成功的得力部将。后来他与郑成功发生冲突，他擅杀了一名投奔郑成功的部将曾德，郑成功大怒，逮捕了他和他的家人。施琅设法逃脱，他的父亲和弟弟被郑成功处死。施琅于是再次投降清朝。

  此后施琅在清朝任同安副将、福建水师提督等职，多次主张进攻台湾。康熙七年（1668 年）他上疏请求出兵，朝廷认为时机不成熟，把他调到北京，任内大臣，闲置了十三年。三藩之乱平定后，郑经去世，台湾郑氏内部发生争斗。康熙二十年（1681 年）在大学士李光地等人的推荐下，康熙帝再次任命施琅为福建水师提督，准备攻台。

  康熙二十二年（1683 年）六月，施琅率领水师进攻澎湖，与郑军大将刘国轩激战七天，攻克澎湖，郑军主力覆没。随后施琅对台湾郑氏采取招抚的方针，郑克塽、刘国轩等人投降（另见“清统一台湾”条）。施琅进入台湾后，到郑成功庙祭奠，表示与郑氏的旧怨已经了结。

  台湾归附后，清廷中有人主张放弃台湾，只守澎湖。施琅上《恭陈台湾弃留疏》，从海防的角度论述了保留台湾的必要性，康熙帝采纳了他的意见，次年在台湾设立台湾府。施琅被封为靖海侯，此后继续任福建水师提督，康熙三十五年（1696 年）去世，谥“襄壮”。
sources: []
recalled:
  - 《清史稿·施琅传》
  - 施琅《靖海纪事》
