name: "保罗三世"
aliases: ["亚历山德罗·法尔内塞", "保禄三世"]
role: "罗马教皇"
summary: "法尔内塞家的教皇，批准耶稣会，设立罗马宗教裁判所，1545 年召开特兰托公会议。"
body: |-
  保罗三世本名亚历山德罗·法尔内塞，1468 年生，一般说生在罗马以北的卡尼诺。他受过人文学者的教育。1493 年教皇亚历山大六世立他为枢机，当时人说这是因为他的妹妹朱莉娅得教皇宠爱。他年轻时生活与那一代的枢机无异，有几个子女；五十岁前后受立为司铎，行事有了改变。1534 年 10 月他六十六岁当选教皇。

  他一面照旧提拔自家人，立两个十几岁的孙子为枢机，替儿子谋得帕尔马公国；一面把一批主张改革的人立为枢机，其中有孔塔里尼、波尔、萨多雷托和卡拉法。1537 年这些人向他呈上《关于整顿教会的建议书》，直言弊端的根源在教廷滥用权力、买卖圣职。1540 年他批准罗耀拉的耶稣会。1542 年他在罗马设立由枢机组成的宗教裁判所，统管各地查办异端的事。

  《历史的轨迹》第二十九章说，皇帝查理急于使两教合一，安排了几次会谈都没有结果，最后教皇保罗三世在意大利北部山区的小城特兰托召集了公会议。会议几经拖延，1545 年 12 月开幕，头两年议定了圣经与传统、原罪、称义等教令，针对的都是路德的论点。1547 年他与皇帝失和，把会议迁到博洛尼亚，会议随即停顿，到他死后才复会。

  该书第三十章把宗教裁判所称为“西班牙异教裁判所”，又叫“最高宗教法庭”，说它很快扑灭了新教在意大利和西班牙的火花。这里把两个机构合在一起说了：西班牙的宗教裁判所设于 1478 年，听命于国王；保罗三世设的是罗马的宗教裁判所，后来称圣职部。

  他还在 1538 年开除英王亨利八世的教籍，1537 年下诏申明美洲的印第安人是真正的人，不得奴役；又请米开朗琪罗画了西斯廷礼拜堂的《最后的审判》。1549 年 11 月 10 日他在罗马去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十九章“罗马教会从事改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter32.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
recalled:
