name: 庞涓
aliases: []
role: 魏国将军
summary: 魏国将军，因嫉妒同学孙膑的才能而陷害他，后在马陵之战中中孙膑之计，兵败自杀。
body: |-
  庞涓是魏惠王时的将军，生年不详。据《史记·孙子吴起列传》，他曾与孙膑一起学习兵法，后来在魏国做了将军，自知才能不如孙膑，就暗中把孙膑召到魏国，以法刑断其两足并在脸上刺字，想让他终身不能出头。孙膑后来设法逃到齐国。

  公元前 354 年魏国围攻赵都邯郸，齐国派田忌、孙膑救赵，直接进攻魏都大梁，庞涓回救，在桂陵被齐军打败。公元前 342 年魏攻韩，齐军再次直趋大梁，庞涓回师追击。孙膑令齐军每天减少行军灶的数量，庞涓以为齐军逃亡过半，便丢下步兵，只带轻锐日夜追赶，到了马陵道中，看到一棵大树上写着“庞涓死于此树之下”，点火照看时，埋伏的齐军万弩齐发，魏军大乱。《史记》说庞涓“自知智穷兵败，乃自刭，曰：遂成竖子之名！”

  1972 年山东临沂银雀山出土的竹简《孙膑兵法》中有《擒庞涓》一篇，记载庞涓在桂陵之战中被擒，与《史记》不同，学界对此有不同解释。
sources: []
recalled:
  - 《史记·孙子吴起列传》
  - 银雀山汉墓竹简《孙膑兵法》
