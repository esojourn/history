name: "瓦尔特"
aliases: ["窝特尔", "卡尔·费迪南·威廉·瓦尔特"]
role: "密苏里信义宗议会的领袖"
summary: "萨克森移民牧师，在圣路易斯办德文刊物，主导密苏里议会坚守传统路德派信仰。"
body: |-
  《历史的轨迹》第四十五章说，美国的德国信义宗为两个问题起冲突：一派主张信义宗美国化，对《奥格斯堡信条》作较自由的解释；另一派主张保持德文，坚守传统路德派信仰。若不是移民潮，前者很可能得胜。1830 至 1870 年间一百多万德国人移入美国，绝大部分是信义宗信徒，大大加强了保守派的力量，他们当时的领袖就是瓦尔特。

  书中说，瓦尔特是密苏里州圣路易斯的信义宗牧师，在他的德文杂志中恳切地教导读者坚守传统路德派信仰，也主张设立教会学校教育儿童；密苏里议会的青年组织也以他命名为“瓦尔特联盟”。第四十八章说，信义宗在现代主义潮流中忠于信条，尤以密苏里议会为著，1980 年有会员二百五十万人。

  据一般记载，瓦尔特 1811 年生于萨克森，1838—1839 年随一批不满萨克森国家教会理性主义的信义宗信徒移民密苏里，先到佩里县，1841 年起在圣路易斯牧会；1847 年密苏里议会的前身成立，他任首任会长，并长期主持协和神学院。他 1887 年在圣路易斯去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十八章“教会努力保守信仰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter53.html"
