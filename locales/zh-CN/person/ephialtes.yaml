name: 厄菲阿尔特
aliases: [埃菲阿尔特斯]
role: 雅典政治家
summary: 公元前 462 年削减战神山议事会的权力，次年遇刺。
body: |-
  雅典人，索福尼德斯之子。关于他的记载很少。《雅典政制》说他以廉洁和忠于城邦著称；普鲁塔克提到他当过将军，曾率三十艘战船出航。他是民主派的领袖，年轻的伯里克利是他的同道。在温泉关为波斯人带路的那个人与他同名，不是一人。

  战神山议事会由卸任的执政官终身组成，在希波战争后的十几年里权势很大，负有“守护法律”之责。厄菲阿尔特先是控告其中一些成员贪赃。公元前 462 年，客蒙率军去帮助斯巴达镇压希洛人，他反对出兵，没有成功；趁客蒙不在，他提出法案，把战神山议事会除审理杀人案和若干宗教事务以外的权力，分别移交给五百人议事会、公民大会和陪审法庭。客蒙回国后想推翻这些法案，反而被放逐。

  前 461 年，厄菲阿尔特在夜间被人刺杀。《雅典政制》说凶手是塔那格拉人阿里斯托狄科斯；演说家安提丰在几十年后说，凶手始终没有查明。此后雅典民主派的领导权转到伯里克利手中。
sources: []
recalled:
  - 《雅典政制》第 25—26 章
  - 普鲁塔克《客蒙传》第 13—15 章；《伯里克利传》第 9—10 章
  - 安提丰《论谋杀希罗底斯》第 68 节
