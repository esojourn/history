name: 蔡邕
aliases: [蔡伯喈, 蔡中郎]
role: 学者、左中郎将
summary: 东汉末年学者、书法家，主持刊刻熹平石经，因董卓案牵连死于狱中。
body: |-
  据《后汉书·蔡邕传》，蔡邕字伯喈，陈留圉县人，师从太傅胡广，通晓经史、天文、音律，擅长辞章和书法。灵帝时任郎中、议郎，在东观校书。熹平四年（公元 175 年），他与杨赐等人奏请校正六经文字，获准后亲自用朱笔把经文写在石碑上，交工匠镌刻，立在太学门外，供人抄录校对，这就是熹平石经。

  光和元年（178 年）他应诏上书议论朝政，触怒宦官，被判流放朔方。次年遇赦，又因得罪权贵的亲属而不敢回乡，在吴郡、会稽一带避居了十二年。

  中平六年（189 年）董卓掌权，强召蔡邕入朝，对他十分敬重，屡次升迁，官至左中郎将，随献帝迁到长安。初平三年（192 年）董卓被杀，本传记载蔡邕在司徒王允座上谈及此事而叹息，王允大怒，将他交廷尉治罪。蔡邕请求受刑而留下性命以续写汉史，许多大臣为他求情，王允不许，蔡邕死于狱中，本传记其终年六十一。他的女儿蔡琰也以文才知名。
sources: []
recalled:
  - 《后汉书·蔡邕列传》
