name: 阿育王
aliases:
  - 阿输迦
  - 无忧王
  - 天爱喜见王
role: 孔雀王朝君主
summary: 孔雀王朝第三代君主，征服羯陵伽后悔悟，推行正法，在各地刻石立诏。
body: |-
  孔雀王朝第三代君主，旃陀罗笈多之孙、频头娑罗之子。他的生年和即位年都没有直接记载，约前 304 年出生、约前 268 年灌顶即位是学者推算的约数，出生地不详。据锡兰的《大史》，他即位前曾受父命出镇优禅尼；北传的《阿育王传》则说他曾被派往呾叉始罗平乱。这些佛教文献还说他早年残暴、杀害众多兄弟，属于后世传说。

  他在第 13 号摩崖诏令中自述，灌顶第八年征服羯陵伽，十五万人被掳走，十万人被杀，死去的人又数倍于此，他为此悔恨。此后他提倡“正法”：诏令要求善待父母、师长、仆役，尊重各教派，限制宰杀牲畜；第 2 号摩崖诏令记他为人和牲畜设置医疗，沿路植树掘井；又设“正法大官”巡察各地。小摩崖诏令说他成为佛教在家信徒，蓝毗尼石柱记他灌顶二十年后亲往佛陀诞生地礼拜。锡兰传统说，第三次结集在华氏城举行，他的儿子摩哂陀前往锡兰传法。

  诏令里他自称“天爱喜见王”，“阿育”之名只见于少数几处铭文。这些摩崖和石柱诏令是印度现存最早可以释读的成篇铭文，19 世纪由普林塞普释读。他约在前 232 年去世，此后孔雀王朝逐渐衰落。
sources:
  - 阿育王摩崖诏令第 1、2、5、12、13 号，小摩崖诏令第 1 号，蓝毗尼石柱铭文（诏令内容据英文维基条目的译文与概述）
  - 《大史》第 5、12、13 章 https://lakdiva.org/mahavamsa/chapters.html
  - 《岛史》（据英文维基条目转引）
  - 《阿育王传》（Ashokavadana）（据英文维基条目转引）
  - Wikipedia, "Ashoka" https://en.wikipedia.org/wiki/Ashoka
  - Wikipedia, "Major Rock Edicts" https://en.wikipedia.org/wiki/Major_Rock_Edicts
