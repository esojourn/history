name: 徐霞客
aliases: [徐弘祖, 振之]
role: 旅行家、地理学家
summary: 明代旅行家，三十多年游历大半个中国，留下《徐霞客游记》。
body: |-
  徐霞客名弘祖，霞客是他的号，南直隶江阴人，出身富裕的读书人家庭。他少年时就喜欢读地理、历史和游记类书籍，无意于科举。他的母亲支持他出游，鼓励他“志在四方”。从二十二岁起，他开始游历各地，起初多在家乡附近，母亲去世后行程越来越远。

  此后三十多年间，他的足迹遍及今天的江苏、浙江、安徽、福建、江西、湖南、广东、广西、贵州、云南、山东、河北、山西、陕西、河南等地，登过泰山、黄山、庐山、嵩山、华山、五台山、恒山、雁荡山等名山。他出游多是徒步，有时只带一个仆人，经常露宿野外，几次遇到强盗，几乎丧命。

  崇祯九年（1636 年）他开始最后一次、也是历时最长的一次旅行，经浙江、江西、湖南进入广西、贵州、云南，直到滇西的腾冲一带。在这次旅行中，他详细考察和记录了广西、贵州、云南的石灰岩地貌，描述了大量溶洞、峰林的形态和成因，是世界上较早对岩溶地貌进行系统考察的记载之一。他还根据实地考察，在《溯江纪源》中提出金沙江是长江的正源，纠正了《禹贡》“岷山导江”的旧说。

  崇祯十三年（1640 年）他在云南患病，双脚不能行走，被丽江土司派人送回家乡，次年正月去世。他每天都写日记，记录所见所闻，死后由友人季会明等整理成书，即《徐霞客游记》。原稿在战乱中散失了一部分，现存约六十万字，既是重要的地理文献，文笔也很生动。
sources: []
recalled:
  - 《徐霞客游记》
  - 钱谦益《徐霞客传》
  - 陈函辉《霞客徐先生墓志铭》
