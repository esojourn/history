name: 张世杰
aliases: [越国公]
role: 南宋末年将领
summary: 南宋末年将领，临安投降后护送二王南下，崖山海战的宋军主帅，兵败后溺死海上。
body: |-
  张世杰是涿州范阳（今河北涿州）人，生年不详。他早年在北方张柔的军中，后来南下投宋，从小校逐渐升为将领。德祐元年（1275 年）元军东下，他率兵入卫临安，在焦山与元军水战失利。

  德祐二年（1276 年）临安投降，张世杰不肯降，率部南下，与陈宜中、陆秀夫等人在福州拥立益王赵昰为帝，主持军事。此后宋军被元军追击，转战于福建、广东沿海。赵昰死后，他与陆秀夫又立赵昺为帝，把行朝迁到崖山。

  祥兴二年（1279 年）元将张弘范进攻崖山，张世杰把战船用绳索连在一起，结成水寨固守，却被元军断绝了淡水和柴薪。二月元军总攻，宋军大败，陆秀夫背负赵昺投海。张世杰率十余艘船突围，想奉杨太后另立宋室后人，杨太后闻帝死也投海自尽。不久他在海陵山（今广东阳江海陵岛）附近遇飓风，船翻溺死。
sources: []
recalled:
  - 《宋史·张世杰传》
