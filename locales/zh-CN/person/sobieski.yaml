name: "约翰三世·索别斯基"
aliases: ["索比斯基", "扬·索别斯基"]
role: "波兰国王"
summary: "波兰—立陶宛国王，1683 年率援军在维也纳城下击败奥斯曼大军。"
body: |-
  索别斯基 1629 年生于奥列斯科（今属乌克兰），出身波兰大贵族，在与哥萨克、瑞典、奥斯曼的历次战争中成名，1668 年任王国大统帅，1673 年在霍京大败土耳其军，次年被选为波兰—立陶宛联邦国王，称约翰三世。

  1683 年奥斯曼大军围攻维也纳，他率波兰军队与神圣罗马帝国各邦援军会合，9 月 12 日在卡伦山下发动冲锋，以重骑兵一举击溃围城的土耳其军。《历史的轨迹》第四十章说，土耳其回教徒向西欧的侵犯，1683 年被波兰英雄索别斯基的军队遏阻在维也纳；不久匈牙利和巴尔干各国也从回教徒手中夺回，归入基督教世界。巴尔干的大部分其实要到十九世纪才陆续脱离奥斯曼，书中说的“不久”指的是匈牙利一带。他 1696 年死于华沙附近的维拉诺夫宫。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十章“教会再度增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter44.html"
