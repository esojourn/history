name: 晋武帝
aliases: [司马炎, 司马安世]
role: 皇帝
summary: 司马昭之子，代魏建立晋朝，公元 280 年灭吴，结束三国分立的局面。
body: |-
  据《晋书·武帝纪》，司马炎字安世，是司马昭的长子。咸熙二年（公元 265 年）八月他继任相国、晋王。同年十二月，魏帝曹奂让位，司马炎即皇帝位，国号晋，改元泰始，仍都雒阳。这一天按公历已是 266 年 2 月。

  他认为曹魏不给宗室实权，以致皇帝孤立无援，于是即位后大封同姓，一次封了二十七人为王，后来又让诸王出镇要地、掌握军队。泰始四年（268 年）颁行由贾充等人修订的新律，后世称为《泰始律》。

  咸宁五年（279 年）十一月，他采纳羊祜生前的谋划和杜预、张华等人的主张，发兵二十余万，分六路进攻吴国。次年三月，王濬的水军从长江上游顺流而下，抵达建业，吴主孙皓投降。自汉末以来近百年的分裂至此结束。统一后他下令裁撤州郡的军队，并颁行占田、课田和户调的制度，规定各级官员和百姓占有田地的限额以及应纳的租调。

  《晋书》记载他平吴以后怠于政事，后宫人数近万。太子司马衷智力低下，朝臣多次暗示应当另选继承人，他没有更换。太熙元年（290 年）四月司马炎去世，终年五十五。他死后不久，外戚与宗室诸王相继争权，酿成“八王之乱”，西晋在他死后二十多年即告灭亡。
sources: []
recalled:
  - 《晋书·武帝纪》
  - 《晋书·食货志》
