name: 龚自珍
aliases: [定盦, 龚巩祚]
role: 思想家、诗人
summary: 道光年间的思想家和诗人，抨击时弊，呼吁变革，著有《己亥杂诗》。
body: |-
  龚自珍是浙江仁和（今杭州）人，外祖父是著名的文字学家段玉裁。他早年跟随外祖父学习文字训诂，后来又学习今文经学，借经学讨论现实问题。他多次参加会试都没有考中，道光九年（1829 年）才考中进士，此后在内阁、礼部做了多年的小官。

  龚自珍关心现实，敢于抨击时弊。他在《乙丙之际箸议》等文章中指出清朝已经进入“衰世”，官场腐败，人才凋零，主张变法改革；他在《西域置行省议》中主张在新疆设立行省，移民屯垦。道光十八年（1838 年）林则徐南下禁烟，他写了《送钦差大臣侯官林公序》，提出禁烟的具体建议，表示愿意随行。

  道光十九年（1839 年，己亥年）他辞官南归，途中写了三百一十五首绝句，合称《己亥杂诗》，其中“九州生气恃风雷，万马齐喑究可哀。我劝天公重抖擞，不拘一格降人才”和“落红不是无情物，化作春泥更护花”等句子流传很广。道光二十一年（1841 年）他在江苏丹阳云阳书院突然去世，年五十岁。他的思想对后来的维新派有很大影响，梁启超说晚清思想界几乎人人都经历过崇拜龚自珍的阶段。
sources: []
recalled:
