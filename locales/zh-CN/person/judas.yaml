name: 犹大·马加比
aliases:
  - 马加比
role: 起义领袖
summary: 玛他提亚第三子，屡败塞琉古军队，收复并洁净圣殿。
body: |-
  祭司玛他提亚的第三子，生年没有记载。《马加比一书》2:4 说他“称为马加比”，这个称号的含义没有定论，较通行的解释是“锤子”。公元前 166 年前后父亲去世，他按遗命统领起义的队伍（2:66、3:1）。

  据《马加比一书》第 3—4 章，他先后击败阿波罗尼、在伯和仑击败塞龙、在以马忤斯击败戈尔吉亚，又在伯夙击退摄政吕西亚。随后他率众登上锡安山，清理被亵渎的圣所，另筑祭坛，于塞琉古纪元 148 年基斯流月二十五日（公元前 164 年冬）重新献祭，并定每年守节八日（4:36–59），这就是修殿节（光明节）的由来。

  此后他出兵救援基列、加利利等地的犹太人（第 5 章）；在伯撒迦利亚败于塞琉古大军，兄弟以利亚撒死于此役（6:32–47）；又在阿达萨击杀敌将尼迦挪（7:39–50），并遣使与罗马立约（第 8 章）。塞琉古纪元 152 年（约公元前 160 年），巴基德率军来攻，犹大在以拉撒迎战，据《马加比一书》9:5–6，他的部众多数离去，只剩八百人。他战死后，由兄弟约拿单和西门葬在莫顶的祖坟（9:18–19）。
sources:
  - 《马加比一书》2:1–5、2:66、第 3—9 章（收复圣殿见 4:36–59，战死见 9:1–22）
  - 《马加比二书》第 8—15 章（洁净圣殿见 10:1–8）
  - 约瑟夫斯《犹太古史》卷 12 第 6—11 章（战死见第 11 章第 1—2 节） https://penelope.uchicago.edu/josephus/ant-12.html
  - Wikipedia, "Judas Maccabeus" https://en.wikipedia.org/wiki/Judas_Maccabeus
