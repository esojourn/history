name: 撒罗米·亚历山德拉
aliases: [亚历山德拉, 撒罗米]
role: 犹太女王
summary: 亚历山大·雅纳的王后，继夫为王九年，倚重法利赛人。
body: |-
  哈斯蒙尼王朝唯一执政的女王。她的家世约瑟夫斯没有交代；按他所记她死时七十三岁推算，约生于公元前 140 年。一般认为她先嫁阿里斯托布鲁斯一世，前 103 年丈夫死后释放了被囚的亚历山大·雅纳并嫁给他，但约瑟夫斯没有明说这两位王后是同一人。

  据《犹太古史》卷 13，雅纳在前 76 年临终时嘱咐她与法利赛人和好，把权柄分给他们。她继位后照此而行：因女子不能任大祭司，她立长子许尔堪二世为大祭司，自己掌管国政；法利赛人恢复了先前被约翰·许尔堪废止的规条，并追究当年怂恿雅纳处死八百人的人。约瑟夫斯说，她有王的名号，实权却在法利赛人手里。亚美尼亚王提格兰进兵叙利亚时，她遣使送礼；提格兰不久因罗马人攻入本国而撤兵。

  她的次子阿里斯托布鲁斯二世不满法利赛人得势。她病重时，阿里斯托布鲁斯离开耶路撒冷，接连占据多处要塞。她在位九年，公元前 67 年去世，两个儿子随即争夺王位。后世拉比文献对她在位的年月评价很高，并说她是法利赛人领袖西门·本·示他的姐妹，这一说法不见于约瑟夫斯。
sources: []
recalled:
  - 约瑟夫斯《犹太古史》卷 13 第 16 章
  - 约瑟夫斯《犹太战记》卷 1 第 5 章
