name: 小加图
aliases: [乌提卡的加图, 马尔库斯·波尔基乌斯·加图, 小伽图]
role: 罗马元老、斯多亚派人物
summary: 老加图的曾孙，元老院保守派领袖，始终反对恺撒，兵败后在乌提卡自尽。
body: |-
  马尔库斯·波尔基乌斯·加图，监察官老加图的曾孙，公元前 95 年生，后人称“小加图”或“乌提卡的加图”。他幼年父母双亡，在舅父李维乌斯·德鲁苏斯家长大。他信奉斯多亚派哲学，生活刻意俭朴。前 72 年他自愿参加对斯巴达克斯的战争，后来在马其顿任军事保民官。任财务官时，他认真核查国库账目，追缴苏拉时代杀人领赏者所得的赏金。

  前 63 年他当选保民官。12 月 5 日元老院讨论如何处置喀提林的同党，恺撒主张监禁，他的发言使元老院转而决定处死；萨卢斯特把两人的演说并列写出。此后他成为元老院保守一派的核心，善用拖延战术，可以一直讲到日落散会。他阻挠批准庞培在东方的安排，拒绝骑士包税人减免承包额的请求，反对恺撒的土地法；许多学者认为正是这些做法把三人推到了一起。西塞罗在信里说，加图发言时仿佛身在柏拉图的理想国，而不是在罗慕路斯的渣滓堆里。

  前 58 年克洛狄乌斯设法把他派去接收塞浦路斯，据普鲁塔克，他带回近七千塔兰特，账目分文不差。前 54 年任大法官。前 52 年罗马陷入骚乱，他转而支持庞培单独出任执政官。

  内战爆发后他随庞培一方。法萨卢斯战时他留守迪拉基乌姆，战后率残部渡海，据普鲁塔克，步行穿过利比亚沙漠到达阿非利加行省。他把指挥权让给曾任执政官的梅特卢斯·西庇阿，自己镇守乌提卡。前 46 年 4 月塔普苏斯战败的消息传来，他安排城中的人乘船撤离。当晚他读了柏拉图论灵魂不朽的《斐多篇》，然后用剑自刺；医生缝合伤口，他醒来后又把伤口撕开而死。据普鲁塔克，恺撒说他嫉妒加图这一死，因为加图不肯让他有饶恕的机会。在帝国时期，他成为斯多亚派和共和理想的象征。
sources: []
recalled:
  - 普鲁塔克《小加图传》
  - 萨卢斯特《喀提林阴谋》第 50—54 章
  - 西塞罗《致阿提库斯书》卷二第 1 封
  - 卢坎《法萨卢斯》卷九
