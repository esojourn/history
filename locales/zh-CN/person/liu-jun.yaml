name: 宋孝武帝
aliases: [刘骏, 宋世祖]
role: 皇帝
summary: 宋文帝第三子，起兵讨平弑父的刘劭而即位，任用寒人加强皇权。
body: |-
  刘骏是宋文帝刘义隆的第三子，封武陵王。元嘉三十年（公元 453 年）太子刘劭弑父自立，他当时任江州刺史，正在讨伐西阳蛮，随即在寻阳起兵，与沈庆之、柳元景等东下，攻入建康，杀刘劭及其同谋始兴王刘濬，即位为帝，年号孝建、大明。

  他在位期间着力加强皇权，压制宗室和地方重镇。孝建元年（454 年），叔父南郡王刘义宣与臧质起兵反对他，兵败被杀，此后他把荆州分出一部分设立郢州，削弱上游的力量。大明三年（459 年），竟陵王刘诞据广陵反，平定后他下令屠城。他任用出身寒微的戴法兴、巢尚之等人为中书通事舍人，掌管机要，史家常以此为南朝“寒人掌机要”的开端。祖冲之的《大明历》就是在他在位时上呈的。

  《宋书》说他奢侈，喜好营造宫室，晚年嗜酒。大明八年（464 年）去世，年三十五，长子刘子业继位，即前废帝。
sources: []
recalled:
  - 《宋书·孝武帝纪》
  - 《资治通鉴》卷一百二十七至一百二十九
