name: 贺知章
aliases: [贺季真, 四明狂客, 贺监]
role: 诗人、秘书监
summary: 盛唐诗人和书法家，晚年请为道士还乡，作《回乡偶书》，曾称李白为“谪仙人”。
body: |-
  贺知章字季真，越州永兴人，武则天证圣元年（公元 695 年）考中进士，此后在长安做官近五十年，历任礼部侍郎、太子宾客、秘书监等职，人称“贺监”。他性情旷达，喜好饮酒，晚年更加放纵，自号“四明狂客”。他擅长草书和隶书，与张旭、李白等人都以嗜酒著称，杜甫在《饮中八仙歌》里把他列在第一位。

  据李白《对酒忆贺监》诗序，李白初到长安时，贺知章在紫极宫见到他，读了他的诗后称他为“谪仙人”，还解下佩戴的金龟换酒同饮。

  天宝三载（744 年）正月，他因病请求做道士回乡，玄宗答应了，赐诗送行，太子和百官在长乐坡为他饯别。他回到家乡后不久去世，年八十六。他的诗作留存不多，《回乡偶书》中“少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来”，以及《咏柳》，都广为传诵。
sources: []
recalled:
  - 《旧唐书·文苑传·贺知章》
  - 《新唐书·隐逸传·贺知章》
  - 李白《对酒忆贺监》序
