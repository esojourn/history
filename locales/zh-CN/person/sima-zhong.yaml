name: 晋惠帝
aliases: [司马衷, 孝惠皇帝]
role: 皇帝
summary: 西晋第二位皇帝，不能亲理朝政，在位期间发生贾后专权与八王之乱。
body: |-
  司马衷是晋武帝司马炎的次子，母亲是皇后杨艳。泰始三年（公元 267 年）立为皇太子。朝中不少大臣认为他不能胜任，武帝终究没有更换。太熙元年（290 年）武帝去世，他即位，由外戚杨骏辅政。《晋书·惠帝纪》记有他听说百姓饿死而问“何不食肉糜”的话。

  即位第二年，皇后贾南风杀杨骏，此后十年朝政出于贾后。永康元年（300 年）赵王司马伦废杀贾后，次年正月自立为帝，把他迁到金墉城，四月诸王起兵，他才复位。此后齐王冏、长沙王乂、成都王颖、河间王颙、东海王越相继掌权，他先后被带到邺城和长安，光熙元年（306 年）才由东海王越迎回洛阳。

  同年十一月（已入公元 307 年），他在洛阳吃饼中毒而死，年四十八。《晋书》说“或云司马越之鸩”，没有定论。
sources: []
recalled:
  - 《晋书·惠帝纪》
  - 《资治通鉴》卷八十二至八十六
