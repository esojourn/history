name: 陈武帝
aliases: [陈霸先, 陈兴国, 陈高祖]
role: 皇帝
summary: 出身寒微的将领，从岭南起兵讨伐侯景，557 年代梁建立陈朝。
body: |-
  陈霸先字兴国，吴兴长城人，出身寒微。他年轻时当过乡里的里司，后来到建康任油库吏，又跟随梁朝的新喻侯萧映到广州，在其手下任中直兵参军。大同年间，交州人李贲起兵称帝，他随军南征，平定了这场叛乱，因功任高要太守，在岭南有了自己的兵力。

  侯景之乱爆发后，他于太清三年（公元 549 年）冬在广州起兵，翻越大庾岭北上，一路击败侯景的部将和割据岭南、江西的势力。承圣元年（552 年），他与王僧辩在白茅湾会师，合兵攻克建康，侯景败死。此后他镇守京口。

  承圣三年（554 年）江陵陷落后，他与王僧辩拥立萧方智。次年王僧辩迎立北齐送来的萧渊明，他起兵从京口突袭建康，杀王僧辩，改立萧方智为帝，即梁敬帝。此后北齐两次出兵渡江南下，太平元年（556 年）他在建康城外大败齐军，稳住了局势。

  太平二年（557 年）十月，他接受梁敬帝禅让，建立陈朝，年号永定。陈朝建立时，长江以北和巴蜀已被北齐、西魏占去，长江中游又有王琳割据，疆域在南朝中最小。他在位不到三年，生活节俭，永定三年（559 年）病逝，年五十七。他的儿子陈昌被西魏掳在长安，章皇后与大臣迎立他的侄子陈蒨即位，即陈文帝。
sources: []
recalled:
  - 《陈书·高祖纪》
  - 《资治通鉴》卷一百六十二至一百六十七
