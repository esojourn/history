name: 商鞅
aliases: [卫鞅, 公孙鞅, 商君]
role: 秦国大良造，法家代表人物
summary: 战国中期改革家，助秦孝公两次变法，使秦富强；孝公死后被车裂。
body: |-
  商鞅是卫国国君的远支后裔，姓公孙，名鞅，又称卫鞅，约生于公元前 390 年。据《史记·商君列传》，他年轻时喜好刑名之学，在魏国相国公叔痤门下任中庶子。公叔痤临终前向魏惠王推荐他，又说若不用就杀掉他，惠王都没有听从。秦孝公发布求贤令后，商鞅来到秦国，经景监引见，几次面见孝公，最后以“强国之术”说动孝公。

  公元前 356 年，商鞅推行第一次变法。为了取信于民，他在都城南门立了一根三丈高的木头，宣布能把它搬到北门的赏十金，无人敢搬，又加到五十金，有人搬了，当即兑现，然后颁布新法。新法规定百姓编为什伍，相互纠告，连坐；奖励耕织，生产粟帛多的可以免除徭役，弃本逐末及怠惰而贫的没为官奴；按军功授爵，宗室没有军功的不得列入宗籍；禁止私斗。太子犯法，商鞅处罚了太子的师傅公子虔，在另一位师傅公孙贾脸上刺字。

  公元前 350 年，秦国迁都咸阳，商鞅推行第二次变法：把小的乡邑合并为县，设县令、县丞，共三十一县（《史记》数字）；废井田，开阡陌，承认土地私有，按田亩征税；统一度量衡；禁止父子兄弟同室居住。今存的“商鞅方升”就是他统一量器的实物。公元前 340 年，他率军攻魏，用计俘虏了魏将公子卬，大败魏军，受封于商、於十五邑，号为商君。

  公元前 338 年秦孝公去世，太子即位为惠文王，公子虔等人告发商鞅谋反。商鞅出逃，到关下投宿，客店主人不知他是谁，说按商君之法，收留没有凭证的人要连坐，商鞅叹道：“嗟乎，为法之敝一至此哉！”他逃回封邑商，发兵攻郑，被秦军杀于郑国黾池，尸体被车裂示众，全家被杀。商鞅虽死，新法未废。他的学派著作汇编为《商君书》。
sources: []
recalled:
  - 《史记·商君列传》
  - 《史记·秦本纪》
  - 《商君书》
  - 《战国策·秦策一》
