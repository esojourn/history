name: 成吉思汗
aliases: [铁木真, 元太祖]
role: 大蒙古国的建立者
summary: 统一蒙古高原各部，1206 年建立大蒙古国；随后攻金、攻西夏，并西征花剌子模。
body: |-
  铁木真是蒙古乞颜部首领也速该的儿子，生年有 1155 年、1162 年、1167 年等说法，通行的说法是 1162 年，出生在斡难河上游。他九岁时父亲被塔塔儿人毒死，部众离散，母亲诃额仑带着几个孩子艰难度日。成年后他依附克烈部首领王汗，与札答阑部的札木合结为安答（义兄弟），逐步收聚部众，被推为乞颜部的首领。

  此后十几年间，铁木真先后与札木合、塔塔儿、克烈、乃蛮等部作战。1196 年他配合金军攻打塔塔儿；1203 年击败王汗，吞并克烈部；1204 年消灭乃蛮部，蒙古高原各部基本统一。1206 年各部首领在斡难河源召开大会（忽里勒台），推举他为大汗，号成吉思汗，建立大蒙古国（另见“大蒙古国建立”条）。他把全体牧民编为千户、百户、十户，设立怯薛（护卫军），颁布札撒（法令），又命人用畏兀儿字母拼写蒙古语，形成蒙古文。

  建国以后，成吉思汗几次进攻西夏，迫使西夏纳女请和。1211 年他亲自率军攻金，在野狐岭大败金军（另见“野狐岭之战”条），1215 年攻下金中都。1218 年他派往花剌子模的商队在讹答剌被杀，次年亲率大军西征，攻破讹答剌、布哈拉、撒马尔罕等城，追击花剌子模国王，部将哲别、速不台一直打到高加索以北（另见“蒙古第一次西征”条）。

  1225 年成吉思汗回到蒙古，次年以西夏不肯出兵从征等理由再次进攻西夏。1227 年西夏投降前夕，成吉思汗去世，地点有六盘山、清水县、萨里川等不同记载，死因也说法不一。他的葬地至今没有找到。元朝建立后，忽必烈追尊他为元太祖。
sources: []
recalled:
  - 《元朝秘史》
  - 《元史·太祖本纪》
  - 《圣武亲征录》
  - 拉施特《史集》
