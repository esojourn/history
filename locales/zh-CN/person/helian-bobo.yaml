name: 赫连勃勃
aliases: [刘勃勃, 赫连屈孑, 夏武烈帝]
role: 夏国开国君主
summary: 匈奴铁弗部人，叛后秦建立夏国，筑统万城，乘刘裕东归夺取长安，以残暴著称。
body: |-
  赫连勃勃字屈孑，本姓刘，出自匈奴铁弗部，父亲刘卫辰是活动在朔方一带的部落首领。登国六年（公元 391 年）北魏的拓跋珪击灭铁弗部，刘卫辰被杀，他当时十一岁，逃出后辗转投靠后秦的边将没弈干，没弈干把女儿嫁给了他。后秦主姚兴很赏识他，不顾大臣劝阻，交给他部众，让他镇守朔方。

  后秦弘始九年（407 年），他袭杀岳父没弈干，吞并其部众，自称大夏天王、大单于，声称匈奴是夏后氏的后裔，所以定国号为夏。他起初不建都城，专以骑兵流动袭击后秦的北部各郡。凤翔元年（413 年）他改姓赫连，并征发十万人修筑都城统万。据《晋书·载记》，监工的叱干阿利用蒸过的土筑城，用锥子刺得进一寸，就把筑那一段的人杀掉。

  东晋义熙十三年（417 年）刘裕灭后秦，随即东归，留守关中的将领发生内讧。次年他派兵南下夺取长安，在灞上称皇帝，然后回到统万。载记说他性情凶暴，常在城上放着弓剑，对谁不满就亲手杀掉，臣下进谏的被割舌处死。真兴七年（425 年）他去世，时年四十五。六年后夏国灭亡。
sources: []
recalled:
  - 《晋书·赫连勃勃载记》
  - 《魏书·铁弗刘虎传》
  - 《资治通鉴》卷一百一十四至一百二十
