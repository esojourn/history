name: 秦庄襄王
aliases: [嬴异人, 子楚, 嬴子楚]
role: 秦王
summary: 秦始皇的父亲，早年在赵国做人质，靠吕不韦扶立为嗣，在位三年。
body: |-
  秦庄襄王原名异人，是秦孝文王（安国君）之子，生于公元前 281 年。他的母亲夏姬不受宠，安国君有二十多个儿子，异人排行居中，被送到赵国做人质。当时秦赵屡次交战，赵国对他很冷淡，据《史记·吕不韦列传》，他“车乘进用不饶，居处困，不得意”。

  阳翟大商人吕不韦在邯郸见到他，说“此奇货可居”，出钱让他结交宾客，又带着珍宝到秦国，游说安国君宠爱而没有儿子的华阳夫人。华阳夫人是楚国人，异人此后改名子楚，以示亲近。安国君于是立子楚为嫡嗣。据《史记》，子楚在邯郸娶了吕不韦献上的赵姬，公元前 259 年生下儿子政。秦军围攻邯郸时，赵国想杀子楚，吕不韦用六百斤金买通守城的官吏，子楚得以逃回秦军营中，赵姬母子藏匿在赵国，后来才被送回秦国。

  公元前 251 年秦昭襄王去世，安国君即位为孝文王，守丧一年后正式即位仅三天就去世，子楚即位，就是庄襄王。他尊华阳夫人为华阳太后，生母夏姬为夏太后，任吕不韦为丞相，封文信侯。在位期间，秦国于公元前 249 年灭了东周，又派蒙骜等人攻取韩、赵、魏的城邑，设置三川郡、太原郡。公元前 247 年魏信陵君率五国联军在河外打败蒙骜，同年庄襄王去世，十三岁的嬴政即位。
sources: []
recalled:
  - 《史记·吕不韦列传》
  - 《史记·秦本纪》
  - 《战国策·秦策五》
