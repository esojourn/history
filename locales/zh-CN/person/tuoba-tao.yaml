name: 魏太武帝
aliases: [拓跋焘, 佛狸, 魏世祖]
role: 皇帝
summary: 北魏第三位皇帝，先后灭夏、北燕、北凉，439 年统一北方，又下诏灭佛。
body: |-
  拓跋焘小字佛狸，魏明元帝拓跋嗣的长子。泰常八年（公元 423 年）即位，年十六。

  他在位二十九年，几乎年年用兵。对北方的柔然，他多次亲征，神䴥二年（429 年）大举北伐，深入漠北，柔然可汗大檀败走，不久病死。对西面的夏国，始光四年（427 年）他攻克夏都统万城，神䴥四年（431 年）夏国灭亡。太延二年（436 年）灭北燕，太延五年（439 年）攻克姑臧，灭北凉。至此，十六国以来北方分裂的局面结束，北魏统一了黄河流域（另见“北魏统一北方”条）。

  他信用崔浩，又在崔浩引荐下信奉道士寇谦之的天师道，太平真君元年（440 年）改年号为“太平真君”，后来亲到道坛受箓。太平真君七年（446 年），他在长安镇压盖吴起事时，在佛寺中发现兵器，在崔浩的鼓动下下诏灭佛，焚毁佛像经卷，坑杀僧人（另见“太武帝灭佛”条）。四年后，他又因国史一事诛杀崔浩，株连甚广。

  太平真君十一年（450 年），宋文帝北伐，他亲率大军反击，一直打到长江北岸的瓜步，扬言要渡江，宋朝京城戒严。次年正月他北还，途中攻盱眙不下，沿途杀掠甚重，江淮之间残破（另见“元嘉北伐”条）。

  晚年他性情猜忌，用刑严酷。正平元年（451 年），太子拓跋晃受宦官宗爱构陷，忧惧而死。次年，宗爱担心获罪，杀死了太武帝，他死时四十五岁。宗爱又杀了刚立的南安王拓跋余，后被大臣诛杀，拓跋晃之子拓跋濬即位，即文成帝。
sources: []
recalled:
  - 《魏书·世祖纪》
  - 《资治通鉴》卷一百一十九至一百二十六
