name: 鉴真
aliases: [淳于氏, 过海大师, 唐大和上]
role: 律宗高僧
summary: 唐代律宗高僧，五次东渡失败、双目失明，754 年终于到达日本传授戒律。
body: |-
  鉴真俗姓淳于，扬州江阳人。据淡海三船的《唐大和上东征传》，他十四岁时在扬州大云寺出家，后来到洛阳、长安游学，在长安实际寺受具足戒，专研律学，兼习天台教义和医药、建筑等知识。回到扬州后，他在大明寺等处讲授戒律，成为江淮一带的律学宗师，据同书，他前后为人授戒四万余人。

  当时日本佛教缺少按戒律为僧人授戒的高僧。天宝元年（公元 742 年），随遣唐使来唐的日本僧人荣睿、普照到扬州恳请他东渡传戒，他问弟子中谁愿意前往，众人默然，他便决定亲自前往。此后几年间，他五次东渡都没有成功：有的被官府阻止，有的遇风船坏。第五次东渡时船遇大风，漂流到海南岛的振州，他们在返回扬州的途中，荣睿病死，鉴真也因长途劳顿、暑热侵袭而双目失明。

  天宝十二载（753 年），日本遣唐使藤原清河等人回国，鉴真搭乘遣唐使的船只第六次东渡，于这一年年底到达日本九州，次年二月进入首都平城京（另见“鉴真东渡”条）。他在东大寺设立戒坛，为圣武太上皇、光明皇太后和孝谦天皇等人授菩萨戒，又为数百名僧人授戒，日本从此有了正规的授戒制度。天平宝字三年（759 年），他在平城京建立唐招提寺。

  天平宝字七年（763 年）五月，他在唐招提寺圆寂，年七十六。他的弟子为他制作的干漆夹纻坐像至今保存在唐招提寺。他和随行弟子还带去了佛经、佛像、书法作品和医药知识，对日本的佛教、建筑、雕塑和医药都有影响。日本称他为律宗之祖。
sources: []
recalled:
  - 淡海三船《唐大和上东征传》
  - 赞宁《宋高僧传·鉴真传》
