name: 道光帝
aliases: [旻宁, 清宣宗]
role: 清朝第八位皇帝
summary: 嘉庆帝之子，以节俭著称，在位期间发生鸦片战争，签订《南京条约》。
body: |-
  旻宁是嘉庆帝的第二个儿子，嘉庆十八年（1813 年）天理教徒攻入紫禁城时，他在宫中用鸟枪击毙了两名教徒，因此被封为智亲王。嘉庆二十五年（1820 年）嘉庆帝在热河去世，旻宁即位，次年改元道光。

  道光帝以节俭著称，据说他穿打补丁的衣服，宫中的膳食也很简省，但这并没有改变官场的奢靡之风。他在位期间进行了一些改革，如在两淮推行票盐法、试行漕粮海运，又平定了新疆张格尔的叛乱。

  道光年间，鸦片走私日益严重，白银大量外流，银贵钱贱，财政困难。朝中对于如何应对有“弛禁”和“严禁”两种意见。道光十八年（1838 年）他采纳黄爵滋、林则徐等人的严禁主张，任命林则徐为钦差大臣，到广东查禁鸦片（另见“虎门销烟”条）。道光二十年（1840 年）英国发动鸦片战争，道光帝在战和之间反复摇摆，先罢免林则徐，任用琦善议和，又转而主战，最后被迫在道光二十二年（1842 年）签订《南京条约》，割让香港岛，开放五口通商，赔款二千一百万银元（另见“鸦片战争”条）。

  战后道光帝没有进行多少改变。道光三十年（1850 年）正月他在圆明园去世，年六十九岁，第四子奕詝继位。他是清朝唯一以嫡长子身份即位的皇帝。
sources: []
recalled:
  - 《清宣宗实录》
  - 《清史稿·宣宗本纪》
