name: 唐寅
aliases: [唐伯虎, 六如居士]
role: 画家、文学家
summary: 苏州人，与沈周、文徵明、仇英合称“明四家”，因科场案断送仕途，以卖画为生。
body: |-
  唐寅字伯虎，号六如居士，苏州吴县人，出身商人家庭，少年时就以才华知名，与祝允明、文徵明、徐祯卿交往，被称为“吴中四才子”。弘治十一年（1498 年）他在南京应天府乡试中考中第一名解元。

  弘治十二年（1499 年）他到北京参加会试，因与江阴人徐经同行，徐经被指控贿赂考官、预先得知考题，唐寅也受到牵连，被关进监狱，后来被罢黜为小吏，他以此为耻，没有赴任，从此断绝了仕途。这次科场案的真相，史书记载不一。此后他游历名山大川，回到苏州后在桃花坞建屋居住，以卖画卖文为生。正德年间他曾被宁王朱宸濠聘请，察觉宁王有反心后装疯离开。

  唐寅擅长山水、人物和花鸟，山水画学习宋代的李唐、刘松年等人，人物画中仕女尤其有名，与沈周、文徵明、仇英合称“明四家”。他的诗文平易洒脱，《桃花庵歌》流传很广。他晚年生活困顿，嘉靖二年十二月（公历 1524 年 1 月）去世。后世“唐伯虎点秋香”等故事出自小说戏曲，与史实无关。
sources: []
recalled:
  - 《明史·文苑传·唐寅》
  - 祝允明《唐子畏墓志并铭》
