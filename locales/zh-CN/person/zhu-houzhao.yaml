name: 正德帝
aliases: [朱厚照, 明武宗]
role: 明朝第十代皇帝
summary: 好游乐与兵事，宠信刘瑾、江彬，自封“威武大将军”，死后无子。
body: |-
  朱厚照是弘治帝的独子，弘治十八年（1505 年）即位，次年改元正德。他喜欢骑射、游乐，宠信以刘瑾为首的八个宦官（时称“八虎”），刘瑾专权数年，排斥刘健、谢迁等顾命大臣，直到正德五年（1510 年）才因被告发谋反而被处死。

  此后朱厚照又宠信边将江彬和宦官钱宁等人，在皇城西边修建“豹房”，常住其中。他多次巡游宣府、大同一带，自封“总督军务威武大将军总兵官朱寿”。正德十二年（1517 年）蒙古小王子部入侵，他亲临前线，在应州一带作战，明军击退了蒙古军。正德十四年（1519 年）宁王朱宸濠在南昌起兵叛乱，王守仁很快将其平定，朱厚照仍以亲征为名南下，到南京一带游玩（另见“宁王之乱”条）。

  正德十五年（1520 年）他在返京途中于清江浦泛舟落水，受了惊吓，次年三月在豹房去世，年三十一岁。他没有儿子，内阁首辅杨廷和与张太后商定，迎立他的堂弟兴献王之子朱厚熜为帝，并诛杀江彬。正德帝的荒嬉在史书中多有记载，但民间流传的许多游幸故事出自后世小说戏曲，不尽可信。
sources: []
recalled:
  - 《明史·武宗本纪》
  - 《明史·刘瑾传》
  - 《明史·江彬传》
