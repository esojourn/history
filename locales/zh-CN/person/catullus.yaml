name: 卡图卢斯
aliases: [盖乌斯·瓦勒里乌斯·卡图卢斯, 卡图鲁斯]
role: 罗马诗人
summary: 罗马抒情诗人，“新派诗人”的代表，以写给“莱斯比娅”的情诗著称。
body: |-
  盖乌斯·瓦勒里乌斯·卡图卢斯，罗马诗人，生于山南高卢的维罗纳。哲罗姆说他生于公元前 87 年，三十岁时死于罗马；但他的诗里提到前 55 年恺撒远征不列颠等事，所以一般把他的生卒推定为前 84 年前后至前 54 年前后。他家境富裕，在加尔达湖的西尔米奥半岛有别墅；据苏维托尼乌斯，他的父亲常接待恺撒。

  他年轻时到罗马，属于一群被西塞罗称为“新派诗人”的青年，朋友有诗人卡尔武斯、秦纳和传记作家奈波斯。这些人以亚历山大城的希腊诗人卡利马科斯为榜样，不写长篇史诗，追求短小、精致、有学问的诗。前 57 年至前 56 年他随总督梅米乌斯去比提尼亚，途中到特洛阿斯祭扫哥哥的坟墓，写了那首以“永别了”结尾的悼诗。

  他的诗集今存一百一十多首，以一首献给奈波斯的小诗开头。前面是各种格律的短诗，中间是几首较长的作品，包括两首婚歌、写少年阿提斯自阉的《阿提斯》和四百多行的小史诗《佩琉斯与忒提斯的婚礼》，后面是哀歌体的短诗。

  最有名的是写给“莱斯比娅”的二十多首情诗，从热恋写到怨恨，其中一首只有两行，以“我恨，我也爱”开头。据阿普列乌斯，莱斯比娅的真名是克洛狄娅；一般认为是保民官克洛狄乌斯的姐姐、执政官梅特卢斯·凯莱尔的妻子，也有人主张是她的姐妹，无法确证。他还写了许多挖苦人的诗，对象包括恺撒和他的亲信马穆拉；据苏维托尼乌斯，他后来道歉，恺撒当天就请他吃饭。

  他的诗在中世纪几乎失传，十四世纪初在维罗纳发现了一部抄本，后来的本子都出自它。
sources: []
recalled:
  - 卡图卢斯《诗集》
  - 哲罗姆《编年史》
  - 苏维托尼乌斯《神圣的尤利乌斯传》第 73 章
  - 阿普列乌斯《辩护辞》第 10 章
