name: 汤显祖
aliases: [义仍, 若士, 玉茗堂]
role: 戏曲家、文学家
summary: 江西临川人，著有《牡丹亭》等“临川四梦”，是明代成就最高的戏曲作家之一。
body: |-
  汤显祖是江西临川人，少年时就有文名。据说因为拒绝首辅张居正的拉拢，他几次会试都没有考中，直到万历十一年（1583 年）张居正死后才考中进士。此后他在南京任太常寺博士、礼部主事等闲职。

  万历十九年（1591 年）他上《论辅臣科臣疏》，批评首辅申时行等人，被贬为广东徐闻县典史，后来改任浙江遂昌知县。他在遂昌兴办书院，减轻刑罚，据说除夕时曾放囚犯回家过年。万历二十六年（1598 年）他弃官回乡，在临川的玉茗堂中专心写作，此后再也没有出仕。

  汤显祖的代表作是《牡丹亭》（全名《牡丹亭还魂记》），写杜丽娘在梦中与柳梦梅相爱，醒后相思而死，三年后又因情复生，最终与柳梦梅结为夫妻。他在题词中写道“情不知所起，一往而深，生者可以死，死可以生”，表达了“情”的力量。这部戏一问世就引起轰动，据说“家传户诵，几令《西厢》减价”。他的另外三部戏《紫钗记》《南柯记》《邯郸记》与《牡丹亭》合称“临川四梦”或“玉茗堂四梦”。

  汤显祖在戏曲创作上重视文辞和意趣，与讲究格律的沈璟一派发生过争论。他的诗文也很有成就，著有《玉茗堂集》。万历四十四年（1616 年）他在临川去世。这一年英国的莎士比亚也去世了，后人常把两人相提并论。
sources: []
recalled:
