name: 完颜宗翰
aliases: [粘罕, 粘没喝]
role: 金朝大将
summary: 金朝开国功臣，灭辽、攻宋时统率西路军，靖康之变的主要主持者之一。
body: |-
  完颜宗翰本名粘没喝，宋人称他为粘罕，是金朝国相撒改的长子、完颜阿骨打的堂侄，生于辽大康六年（公元 1080 年）。他很早就跟随阿骨打起兵，是金朝建国的主要谋划者之一，在攻灭辽朝的战争中屡立战功，攻下辽朝的中京、西京。

  天会三年（1125 年）金军分两路伐宋，他统率西路军从西京大同南下，围攻太原。太原军民坚守了八个多月，次年九月城才被攻破。这年冬天，他率军与完颜宗望的东路军在开封城下会师，攻破开封，主持了废黜徽宗、钦宗，另立张邦昌，以及押送宋朝宗室北迁等事（另见“靖康之变”条）。此后他坐镇西京一带，主持对南宋的战争，又扶植刘豫建立齐国。

  金熙宗即位后，加强皇权，宗翰被任命为太保、领三省事，名位尊崇，但兵权被夺。天会十五年（1137 年）他的亲信高庆裔被杀，宗翰不久也去世。有的史书说他是忧愤而死。
sources: []
recalled:
  - 《金史·宗翰传》
  - 《三朝北盟会编》
  - 《大金国志》
