name: "詹姆士二世"
aliases: ["詹姆士二世", "约克公爵"]
role: "英格兰、苏格兰与爱尔兰国王"
summary: "信天主教的国王，1688 年被女婿威廉逐出，1690 年在博因河战败，终老法国。"
body: |-
  詹姆士二世是查理一世的次子，1633 年生于伦敦，复辟时期称约克公爵，曾任海军大臣。他约在 1668 年后改信天主教。1685 年兄长查理二世去世，他继位。

  《历史的轨迹》第三十一章说他是热诚的天主教徒，一心要在英国恢复天主教，与废除南特诏谕的法王路易十四合谋，宗教和政治自由都面临危机。英国人民于是向他的女婿、荷兰的威廉求救。1688 年威廉渡海而来，把他逐出英国；他逃到法国。

  该书说，第二年他在法军援助下登陆爱尔兰，南爱尔兰的天主教徒站在他一边。1690 年在博因河决战，他在远处观战，一见自己的军队失败，立刻逃往法国。此后他在路易十四给他的圣日耳曼昂莱宫中度日，1701 年去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
