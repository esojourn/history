name: 亚哈谢
aliases: [约哈斯]
role: 南国犹大王
summary: 约兰与亚他利雅的儿子，作王一年，探望以色列王约兰时被耶户所杀。
body: |-
  犹大王约兰的小儿子，母亲是亚哈的女儿亚他利雅，与此前的以色列王亚哈谢同名。《历代志下》21:17 称他为约哈斯。据《列王纪下》8:25–27，以色列王约兰十二年，他登基作犹大王，年二十二岁，在耶路撒冷作王一年；他行亚哈家的道，与亚哈家一样。《历代志下》22:2 作他登基时四十二岁，与他父亲的岁数不合，一般认为是传抄之误。22:3 说他母亲给他出主意，使他行恶。

  他与舅舅以色列王约兰同去基列的拉末，与亚兰王哈薛争战；约兰受伤回耶斯列养伤，亚哈谢下到耶斯列去探望（《列王纪下》8:28–29）。正在这时耶户受膏起兵，射死了约兰。亚哈谢从园亭的路逃跑，耶户追赶，在靠近以伯莲的姑珥坡上射伤了他，他逃到米吉多就死了；臣仆用车把他载到耶路撒冷，葬在大卫城（9:27–28）。《历代志下》22:8–9 的记载略有不同，说他藏在撒玛利亚，被搜出来带到耶户那里杀了。

  亚哈谢死后，他母亲亚他利雅起来剿灭王室，自己作了犹大的女王（《列王纪下》11:1）。
sources: []
recalled:
  - 《列王纪下》8:24–29、9:16–29、11:1
  - 《历代志下》21:17、22:1–10
