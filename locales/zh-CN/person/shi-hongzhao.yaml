name: 史弘肇
aliases: [史化元]
role: 后汉侍卫亲军都指挥使
summary: 后汉大将，执掌禁军，以严刑峻法著称，950 年与杨邠、王章一同被汉隐帝诛杀。
body: |-
  史弘肇是郑州荥泽人，字化元，早年从军，以勇力著称，后来成为刘知远的部将。刘知远在太原称帝后，他率先锋南下，为后汉夺取中原立下大功，此后任侍卫亲军都指挥使，执掌禁军。

  刘知远临终时，他与杨邠、王章、郭威等人一同受命辅佐刘承祐。他负责开封的治安，用刑极为严酷，据史书记载，犯法者往往不问轻重就被处死，京城因此盗贼绝迹，但冤死者也很多。他看不起文臣，与宰相苏逢吉等人矛盾很深，对年轻的皇帝也不够恭敬。乾祐三年（公元 950 年）十一月，刘承祐在宫中埋伏甲士，将他与杨邠、王章一同杀死，并诛灭其家族。这件事直接引发了郭威起兵。他的生年史书没有记载。
sources: []
recalled:
  - 《旧五代史·汉书·史弘肇传》
  - 《新五代史·汉臣传·史弘肇》
  - 《资治通鉴》卷二百八十九
