name: 以实玛利
aliases: []
role: 亚伯拉罕长子
summary: 亚伯拉罕与使女夏甲所生的长子，生十二个族长。
body: |-
  亚伯兰的长子，母亲是撒莱的埃及使女夏甲。夏甲怀孕后逃到旷野，耶和华的使者在水泉旁叫她回去，并吩咐给孩子起名叫以实玛利（《创世记》16:7—12）。据创 16:16，他出生时亚伯兰八十六岁；圣经没有明说他生在何处。十三岁那年，他与父亲同日受割礼（17:25）。

  以撒断奶的日子，撒拉看见他戏笑，要亚伯拉罕把夏甲母子赶走。亚伯拉罕清早给了饼和一皮袋水，打发他们离开；他们在别是巴的旷野走迷了路，水用尽了，神的使者呼叫夏甲，她就看见一口水井（21:8—19）。他长大后住在巴兰的旷野，成了弓箭手，母亲从埃及地给他娶了妻子（21:20—21）。

  亚伯拉罕死后，他和以撒一同把父亲葬在麦比拉洞（25:9）。创 25:12—18 列出他十二个儿子的名字，称他们为十二个族长。据 25:17，他享寿一百三十七岁。以扫娶了他的女儿玛哈拉（28:9）。伊斯兰教传统尊他为先知，并视他为阿拉伯人的祖先。
sources: []
recalled:
  - 《创世记》第 16—17 章、第 21 章、第 25 章、28:9
