name: 慈禧太后
aliases: [叶赫那拉氏, 孝钦显皇后, 西太后, 老佛爷]
role: 同治、光绪两朝实际掌权者
summary: 咸丰帝的妃子，同治帝生母，通过辛酉政变垂帘听政，掌握清朝最高权力近半个世纪。
body: |-
  慈禧太后姓叶赫那拉氏，满洲镶蓝旗人（后抬入镶黄旗），父亲惠征是一名中级官员。她的出生地有北京、山西长治、内蒙古等多种说法，学界一般认为生于北京。咸丰二年（1852 年）她被选入宫，封为兰贵人，咸丰六年（1856 年）生下咸丰帝唯一的儿子载淳，地位迅速上升，封为懿贵妃。

  咸丰十一年（1861 年）咸丰帝在热河去世，六岁的载淳即位。她与咸丰帝的皇后（慈安太后）被尊为两宫太后，她称慈禧太后。同年她联合慈安太后和恭亲王奕訢发动政变，除掉肃顺等八位顾命大臣，两宫太后开始“垂帘听政”（另见“辛酉政变”条）。此后，她倚靠曾国藩、李鸿章等人镇压了太平天国和捻军，支持兴办洋务，史称“同治中兴”。

  同治十三年（1874 年）同治帝去世，没有儿子，慈禧立她妹妹的儿子、四岁的载湉为帝，即光绪帝，继续垂帘听政。光绪七年（1881 年）慈安太后去世，慈禧独揽大权。光绪十五年（1889 年）光绪帝亲政，但大权仍在她手中。她挪用海军经费修建颐和园的说法流传很广，具体挪用的数额学者有不同的估计。

  光绪二十四年（1898 年）光绪帝推行变法，九月慈禧发动政变，囚禁光绪帝于瀛台，再次训政，杀谭嗣同等六人（另见“戊戌变法”条）。光绪二十六年（1900 年）她利用义和团对抗列强，向各国宣战，八国联军攻入北京，她带着光绪帝逃往西安，次年签订《辛丑条约》（另见“义和团运动与八国联军”条）。回京后她推行“新政”，废除科举，宣布“预备立宪”（另见“清末新政”条）。

  光绪三十四年（1908 年）十月二十一日光绪帝去世，次日慈禧也在中南海仪鸾殿去世，年七十四岁。她临终前立光绪帝的侄子、三岁的溥仪为帝。2008 年的检测报告显示光绪帝死于砒霜中毒，是否与慈禧有关，至今没有定论。慈禧统治清朝近半个世纪，后世对她的评价多是负面的，近年也有学者主张更全面地看待她。
sources: []
recalled:
  - 《清史稿·后妃传》
  - 《清德宗实录》
  - 徐彻《慈禧大传》
