name: 蔡京
aliases: [蔡元长, 蔡太师]
role: 北宋宰相
summary: 宋徽宗时的宰相，四次执政，打击元祐党人，钦宗即位后被列为“六贼”之首。
body: |-
  蔡京是兴化军仙游人，生于庆历七年（公元 1047 年），熙宁三年（1070 年）与弟弟蔡卞同时考中进士。蔡卞是王安石的女婿。元祐元年（1086 年）司马光下令五天内恢复差役法，各地官员多认为期限太紧，当时任开封知府的蔡京如期办完，受到司马光的称赞。绍圣年间章惇主政，他又转而支持恢复免役法。宋徽宗即位初，他被贬到杭州。

  据《宋史》本传，宦官童贯到杭州为宫中搜罗书画，蔡京与他结交，通过他把自己的书画送进宫中，又有人在徽宗面前推荐他。崇宁元年（1102 年）他被召回朝廷，不久拜相。他打着恢复神宗新法的旗号，把司马光、苏轼等三百多人列为“元祐奸党”，刻碑公布（另见“元祐党籍碑”条）；又改革茶法、盐法，铸造当十大钱，增加朝廷收入，同时鼓动徽宗兴建宫观园林、大办祭祀典礼。此后他四度为相，前后执政近二十年，他的子孙亲信多居要职。

  宣和七年（1125 年）金军南下，徽宗退位。太学生陈东上书，把蔡京、王黼、童贯、梁师成、李彦、朱勔称为“六贼”，请求处死。宋钦宗即位后，蔡京被一贬再贬，靖康元年（1126 年）在流放岭南的途中死于潭州。蔡京擅长书法，宋代书家“苏黄米蔡”中的“蔡”，通常指蔡襄，也有人认为原本指的是蔡京，因为他名声不好才被换成蔡襄，这一说法缺乏可靠的依据。
sources: []
recalled:
  - 《宋史·奸臣传·蔡京》
  - 《三朝北盟会编》
  - 《续资治通鉴长编拾补》
