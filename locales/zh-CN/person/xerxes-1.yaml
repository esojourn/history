name: 薛西斯一世
aliases: [亚哈随鲁, 泽尔士]
role: 波斯国王
summary: 大流士之子，公元前 480 年亲率大军入侵希腊，在萨拉米斯战败。
body: |-
  大流士一世之子，母亲阿托撒是居鲁士的女儿。他不是长子，据希罗多德，大流士因为他是自己即位以后所生、又是居鲁士的外孙而立他为继承人。公元前 486 年即位后，他先平定了埃及的叛乱，其后巴比伦也发生过反叛。

  他用几年时间准备远征希腊：在阿索斯半岛的地峡上开凿运河，避开曾使舰队覆没的海角；在赫勒斯滂海峡上用船只连成两座浮桥。希罗多德说第一次架的桥被风暴冲毁，他下令鞭打海水三百下。前 480 年春大军渡海。希罗多德给出的兵力超过一百七十万，连随从在内有五百多万，这个数字不可信，现代学者的估计相差很大，多在十万至三十万之间。

  陆军在温泉关被阻三天，消灭了列奥尼达的守军后南下，占领并焚烧了已经撤空的雅典。九月，波斯舰队在萨拉米斯海峡被希腊联军击败，据希罗多德，他坐在对岸山脚下的座位上观战。战后他率一部分军队退回小亚细亚，留马铎尼斯在希腊。次年马铎尼斯在普拉提亚战死，同一时期波斯舰队在米卡勒被毁，波斯从此没有再入侵希腊本土。

  此后他的事迹希腊史料记载很少。波斯波利斯的“万国门”和许多宫殿是他在位时建成的。前 465 年他在宫中被杀，主谋是侍卫长阿尔塔巴诺斯，细节各书不一；继位的是他的儿子阿尔塔薛西斯一世。《以斯帖记》和《以斯拉记》4:6 中的“亚哈随鲁”，一般认为就是他。
sources: []
recalled:
  - 希罗多德《历史》卷七至卷九
  - 埃斯库罗斯《波斯人》
  - 狄奥多罗斯《历史丛书》卷十一第 69 章
  - 《以斯帖记》；《以斯拉记》4:6
