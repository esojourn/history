name: 乐毅
aliases: [望诸君]
role: 燕国上将军
summary: 燕国名将，率五国之师破齐，下七十余城；遭猜忌后出奔赵国。
body: |-
  乐毅是魏国名将乐羊的后代，生卒年不详。乐羊在魏文侯时攻灭中山后受封于灵寿，子孙定居在那里，乐毅即中山灵寿一带人。中山被赵国所灭后，乐毅在赵、魏之间辗转，后来以魏国使者的身份到燕国，燕昭王以客礼相待，他便留在燕国，被任为亚卿。

  据《史记·乐毅列传》，昭王一心报复齐国，乐毅建议联合赵、楚、魏等国共同伐齐。公元前 284 年，乐毅任上将军，统率燕、秦、赵、韩、魏五国军队伐齐，在济西大败齐军。各国军队撤回后，乐毅独率燕军长驱直入，攻占齐都临淄，把齐国的珍宝运回燕国。他在齐国五年，攻下七十余城，都设为燕国的郡县，只有莒和即墨坚守不下。

  公元前 279 年燕昭王去世，惠王即位。惠王做太子时就与乐毅不和，齐将田单又派人散布流言，说乐毅想在齐地称王。惠王于是派骑劫代替乐毅，乐毅怕被诛杀，投奔赵国，赵王封他为望诸君。骑劫随后被田单打败，齐国收复了全部失地。惠王后悔，又怕乐毅率赵军攻燕，写信责备他，乐毅回了一封信，即著名的《报燕王书》，申述自己的心迹，其中说“古之君子交绝不出恶声，忠臣去国不洁其名”。乐毅最后死于赵国。
sources: []
recalled:
  - 《史记·乐毅列传》
  - 《战国策·燕策二》
