name: 杨衒之
aliases: [阳衒之]
role: 文学家
summary: 东魏官员，重游残破的洛阳后写成《洛阳伽蓝记》。
body: |-
  杨衒之的姓氏在古书中有杨、阳、羊等不同写法，生平史料很少，生卒年不详。他在北魏末年任奉朝请，东魏时任抚军府司马，后来做过期城太守。

  东魏武定五年（公元 547 年），他因公事重到洛阳，这时距北魏分裂、迁都邺城已经十多年，洛阳城郭崩毁，宫室倾覆，寺院大多化为灰烬。他感慨今昔，写成《洛阳伽蓝记》五卷。据他在序中所说，北魏洛阳鼎盛时有佛寺一千三百多所。全书按城内、城东、城南、城西、城北的顺序记述主要的寺院，同时记载与之相关的政治事件、人物故事、风俗和传闻，对永宁寺和寺中九层木塔的描写最为详细。这部书文笔秀丽，保存了大量北魏后期洛阳的史料，常与郦道元的《水经注》并提。
sources: []
recalled:
  - 杨衒之《洛阳伽蓝记·序》
