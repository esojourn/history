name: 马略
aliases: [盖乌斯·马略, 马略斯]
role: 罗马统帅、七任执政官
summary: 罗马统帅，七任执政官，击败朱古达和辛布里人、条顿人，晚年与苏拉内战。
body: |-
  盖乌斯·马略，约公元前 157 年生于拉丁姆东南的阿尔皮努姆附近，家族属于当地的骑士等级，在罗马没有人任过官职。他早年在小西庇阿麾下参加努曼提亚之围。前 119 年他任保民官，前 115 年任大法官，随后治理远西班牙；其间娶了贵族尤利乌斯家的女儿尤利娅，即后来恺撒的姑母。

  前 109 年他作为副将随执政官梅特卢斯去努米底亚与朱古达作战。次年他不顾梅特卢斯的阻挠回罗马竞选，当选前 107 年的执政官，人民大会把努米底亚的指挥权转交给他。征兵时他不再理会财产资格，招收没有财产的志愿者入伍；这种做法后来成为常例，士兵退役后的土地要靠统帅去争取。前 105 年，他的财务官苏拉说动毛里塔尼亚国王博库斯交出朱古达，战争结束。

  这时日耳曼的辛布里人和条顿人已在高卢连败罗马军队，前 105 年在阿劳西奥歼灭两支大军。罗马人接连选马略为执政官，从前 104 年到前 100 年连任五次，没有先例。他利用敌人转往西班牙的间隙整训军队，让士兵自己背负行装，人称“马略的骡子”。前 102 年他在阿奎埃·塞克斯提埃歼灭条顿人，次年与卡图卢斯在韦尔切莱歼灭辛布里人。

  前 100 年第六任执政官期间，他与保民官萨图尔尼努斯合作，为老兵争取土地；后来萨图尔尼努斯一派在选举中杀人，元老院授命镇压，马略转而围捕旧日的盟友。前 88 年保民官苏尔皮基乌斯提案把对米特里达梯的指挥权从执政官苏拉手中转给他，苏拉率军进入罗马，他被宣布为公敌，辗转逃到阿非利加；普鲁塔克记了他躲在明图尔奈的沼泽里、又坐在迦太基废墟上的故事。

  前 87 年他乘苏拉东征回到意大利，与秦纳合兵攻入罗马，纵容部下杀戮政敌五天。前 86 年 1 月他第七次就任执政官，十几天后病死。
sources: []
recalled:
  - 普鲁塔克《马略传》
  - 萨卢斯特《朱古达战争》
  - 阿庇安《内战史》卷一第 29—75 章
