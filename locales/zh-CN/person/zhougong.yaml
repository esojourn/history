name: 周公
aliases: [周公旦, 姬旦, 叔旦]
role: 西周初年的摄政
summary: 武王之弟，摄政平定三监之乱、营建洛邑，相传制礼作乐，后还政成王。
body: |-
  周公姓姬名旦，是周文王之子、武王之弟，因采邑在周，称周公。他的生卒年不详。武王伐纣时，周公辅佐武王，克商后受封于鲁，但他没有就封，留在朝中辅政，由儿子伯禽到鲁国就封。

  据《史记·周本纪》和《鲁周公世家》，武王死后，成王年幼，周公担心天下听说武王去世会叛乱，于是摄行政事。管叔、蔡叔等人在国中散布流言，说周公将不利于成王，又与商纣之子武庚以及东方的淮夷等联合叛乱，史称“三监之乱”。周公向召公、太公说明心迹，亲率大军东征，三年平定叛乱，诛杀武庚和管叔，流放蔡叔，又把商的遗民迁到洛邑一带，封微子于宋、封康叔于卫。

  周公主持营建了东都洛邑（成周），作为控制东方的中心。《尚书》中的《大诰》《康诰》《多士》《无逸》《立政》等篇，传统上认为是周公的诰辞。古书又说他“制礼作乐”，建立了周代的礼乐制度，这一说法有后世的理想化成分，但西周礼制在这一时期奠定基础大致可信。摄政七年后，他把政权交还给成年的成王，自己仍以臣子身份辅政。

  《史记》说周公病死于丰，临终要求葬在成周，成王把他葬在毕，与文王同葬。孔子极为推崇周公，《论语·述而》记孔子说：“甚矣吾衰也！久矣吾不复梦见周公。”
sources: []
recalled:
