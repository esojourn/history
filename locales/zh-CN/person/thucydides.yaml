name: 修昔底德
aliases: [修西得底斯]
role: 历史学家、将军
summary: 雅典人，作《伯罗奔尼撒战争史》，以亲历者的身份记述这场战争。
body: |-
  雅典人，父亲名奥洛罗斯，与色雷斯王奥洛罗斯同名，一般认为他与米太亚德、客蒙一家是亲戚。他与伯里克利的政敌、麦勒西亚斯之子修昔底德不是一人。生年没有记载，由他在公元前 424 年任将军（须年满三十）推算，约在前 460 年或稍早。关于他的生平，可靠的只有他在书中自己说的几处。

  他说自己在战争一开始就着手记述，预料这将是一场大战。前 430 年瘟疫流行时他染过病，后来详细写下了症状。他在色雷斯沿海有开采金矿的权利，在当地有影响。前 424 年他当选将军，率七艘战船驻在塔索斯岛。那年冬天斯巴达将领伯拉西达突袭安菲波利斯，他赶去救援，城已投降，只保住了河口的埃翁。他因此被放逐二十年，自己说这使他得以到双方、尤其是伯罗奔尼撒一方去了解情况。前 404 年战争结束后他回过雅典。他死于何时、怎样死的，都不清楚，古人有他被人杀害的说法；他的书在叙述前 411 年的事件时中断，句子没有写完。

  《伯罗奔尼撒战争史》后来分为八卷。他按夏季和冬季逐年叙事。在说明方法的一段里，他说对于事件，他不依据偶然听来的消息，也不凭自己的印象，而是对亲见的和从别人那里得知的都尽量核实；对于演说，他难以记住原话，所以让发言者说出他认为在那种场合应当说的话，同时尽量贴近实际讲话的大意。他说自己的书没有奇闻逸事，也许不够动听，但它是写来做永久的财富的，不是为了赢得一时的喝彩。

  他把战争的原因分为公开的争端和“最真实的原因”，后者是雅典势力的增长引起斯巴达的恐惧。书中伯里克利的葬礼演说、对瘟疫和克基拉内乱的描写、雅典使者与米洛斯人的对话、西西里远征的两卷，都是后世反复研读的篇章。色诺芬的《希腊史》从他中断的地方接着写。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷一第 1、20—23 章；卷二第 48 章；卷四第 104—107 章；卷五第 26 章
  - 马尔凯利努斯《修昔底德传》
