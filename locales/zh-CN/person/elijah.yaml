name: 以利亚
aliases:
  - 提斯比人以利亚
role: 先知
summary: 北国以色列的先知，在亚哈年间力抗巴力崇拜，后被接升天。
body: |-
  《列王纪上》17:1 称他是基列寄居的提斯比人，没有记载他的父亲、生年和早年经历。他在北国以色列王亚哈年间出现，向亚哈宣告这几年必不降露、不下雨。此后他先住在约旦河东的基立溪旁，由乌鸦叼来饼和肉；溪水干了，又到西顿的撒勒法，住在一个寡妇家里。旱灾期间寡妇坛里的面、瓶里的油没有用尽，寡妇的儿子死去后经他求告而活过来（第 17 章）。

  第三年，以利亚去见亚哈，在迦密山上与巴力的先知对峙。据 18:19–22，事奉巴力的先知有四百五十人，另有事奉亚舍拉的先知四百人，耶和华的先知只剩他一人。巴力的先知从早晨求告到午后，没有回应；以利亚用十二块石头重修耶和华的坛，在祭物和柴上浇了水，祷告之后有火降下，烧尽燔祭。众民俯伏在地，以利亚吩咐把巴力的先知带到基顺河边杀了，随后天降大雨（第 18 章）。

  王后耶洗别扬言要杀他，他逃到犹大的别是巴，又走了四十昼夜到何烈山（19:8）。在那里，烈风、地震和火过后，他听见微小的声音；耶和华吩咐他膏哈薛作亚兰王、膏耶户作以色列王，并膏沙法的儿子以利沙接续他作先知（第 19 章）。亚哈夺取耶斯列人拿伯的葡萄园、拿伯被诬告处死之后，以利亚当面向亚哈宣告他一家和耶洗别的结局（第 21 章）。亚哈的儿子亚哈谢即位后从楼上掉下来受伤，差人去求问以革伦的神巴力西卜，以利亚宣告他必不能下床，亚哈谢果然死了（《列王纪下》第 1 章）。

  关于他的结局，《列王纪下》第 2 章记载：他与以利沙从吉甲出发，经伯特利、耶利哥到约旦河，用外衣击打河水，水左右分开，二人走干地过去；正走着说话，忽有火车火马把二人隔开，以利亚乘旋风升天，外衣落下，由以利沙拾起。圣经没有记他去世，也没有给出这件事的年份；按《列王纪》的叙述次序，它排在亚哈谢死后、以色列王约兰的事迹之前。《历代志下》21:12–15 另记有他写给犹大王约兰的一封信。《玛拉基书》4:5 说耶和华的日子未到以前要差遣先知以利亚来；福音书记载耶稣登山变像时，他与摩西一同显现（《马太福音》第 17 章）。
sources: []
recalled:
  - 《列王纪上》第 17—19 章、第 21 章
  - 《列王纪下》第 1—2 章
  - 《历代志下》21:12–15
  - 《玛拉基书》4:5
  - 《马太福音》第 17 章
