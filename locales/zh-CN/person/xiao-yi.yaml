name: 梁元帝
aliases: [萧绎, 萧世诚, 湘东王, 梁世祖]
role: 皇帝
summary: 梁武帝第七子，平定侯景后在江陵称帝，江陵被西魏攻破时焚书出降，被杀。
body: |-
  萧绎字世诚，梁武帝萧衍的第七子，封湘东王。他幼年患眼疾，一目失明。他好学博览，藏书极多，著述也很多，今存的有《金楼子》等。他长期担任荆州刺史，镇守江陵。

  侯景围攻建康时，他坐拥上游重兵，却迟迟不全力援救，而是先出兵攻打侄子河东王萧誉和岳阳王萧詧，萧誉兵败被杀，萧詧因此投靠西魏。台城陷落、武帝死后，他以江陵为根据地，派王僧辩东下。大宝二年（公元 551 年）王僧辩在巴陵挡住侯景的攻势，次年与陈霸先合兵攻克建康，侯景败死。承圣元年（552 年）十一月，萧绎在江陵即位。

  次年，他的弟弟武陵王萧纪在益州称帝，率军东下，他一面派兵抵御，一面请西魏出兵袭击萧纪的后方，萧纪兵败被杀，西魏乘机占领了益州。他没有迁回建康，仍以江陵为都。

  承圣三年（554 年），西魏派于谨等人率军南下，联合萧詧攻打江陵。城破前，他下令焚烧所藏的古今图书，据《资治通鉴》有十四万卷，并说“读书万卷，犹有今日，故焚之”。他出城投降，同年十二月（已入公元 555 年）被萧詧派人用土袋压死，年四十七。江陵城中的官民数万人被掳往关中为奴（另见“江陵陷落”条）。
sources: []
recalled:
  - 《梁书·元帝纪》
  - 《资治通鉴》卷一百六十二至一百六十五
