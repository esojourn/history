name: 秦昭襄王
aliases: [嬴稷, 嬴则, 秦昭王]
role: 秦王
summary: 秦王，在位五十六年，任用范雎、白起，长平破赵，统一之势遂成。
body: |-
  秦昭襄王名稷（一说名则），是秦惠文王之子、秦武王的异母弟，生于公元前 325 年。他年轻时在燕国做人质。公元前 307 年秦武王举鼎绝膑而死，没有儿子，诸弟争立，昭王的母亲宣太后（芈八子）和舅舅魏冉在赵武灵王等支持下把他迎回秦国即位。

  昭王在位五十六年（前 306 年至前 251 年）。前期国政主要由宣太后和穰侯魏冉主持，秦国东进不止：公元前 293 年白起在伊阙大败韩魏联军；前 288 年昭王一度与齐湣王并称东西二帝，不久取消；前 279 年至前 278 年白起攻破楚国的鄢、郢，楚国被迫东迁。公元前 299 年他还诱骗楚怀王到武关会面，将其扣留。

  公元前 266 年前后，昭王听从魏人范雎的建议，推行“远交近攻”，并废黜宣太后、驱逐魏冉等“四贵”，加强王权，以范雎为相。公元前 262 年起秦赵争夺上党，前 260 年白起在长平大破赵军。此后秦军围攻邯郸失利，白起被赐死。公元前 256 年秦灭西周，周赧王死去。

  昭王死于公元前 251 年，儿子孝文王即位仅三天就死去，孙子子楚（庄襄王）继立，庄襄王的儿子就是秦始皇嬴政。

  他是战国时期在位最久的君主之一，秦始皇是他的曾孙。
sources: []
