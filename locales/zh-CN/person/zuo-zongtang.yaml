name: 左宗棠
aliases: [季高, 文襄]
role: 湘军将领、陕甘总督
summary: 镇压太平天国，创办福州船政局，抬棺西征收复新疆，力主新疆建省。
body: |-
  左宗棠是湖南湘阴人，道光十二年（1832 年）考中举人，此后三次会试都没有考中，于是留心舆地、兵法和农学，自称“今亮”（当今的诸葛亮）。太平军进入湖南后，他先后在湖南巡抚张亮基、骆秉章的幕府中主持军务，长达八年，被人称为“湖南不可一日无左宗棠”。

  咸丰十年（1860 年）他在曾国藩的推荐下自募一军，即“楚军”，进入江西、浙江与太平军作战，同治二年（1863 年）任闽浙总督，次年攻克杭州。同治五年（1866 年）他在福州马尾创办福州船政局，附设船政学堂，培养了严复、邓世昌等一批海军人才。同年他调任陕甘总督，此后镇压了捻军和陕甘回民起义。

  同治三年（1864 年）新疆发生动乱，中亚浩罕汗国的阿古柏乘机入侵，建立政权，俄国也占领了伊犁。光绪元年（1875 年）朝廷中发生“海防”与“塞防”之争，李鸿章主张放弃新疆、专顾海防，左宗棠坚持收复新疆，得到朝廷的支持，被任命为钦差大臣，督办新疆军务。光绪二年（1876 年）起，他采取“先北后南、缓进速战”的方针，指挥刘锦棠等将领出兵，到光绪四年（1878 年）初收复了除伊犁以外的新疆全境（另见“收复新疆”条）。光绪六年（1880 年）他从肃州进驻哈密，据说抬着棺材出关，表示与俄国决战的决心，这一举动对曾纪泽在彼得堡谈判收回伊犁起了支持作用。他多次奏请新疆建省，光绪十年（1884 年）新疆正式建省。

  此后左宗棠入京任军机大臣，后又任两江总督。中法战争期间，他以钦差大臣的身份督办福建军务，光绪十一年（1885 年）在福州病逝，年七十四岁，谥“文襄”。
