name: 亚哈谢
aliases: []
role: 北国以色列王
summary: 亚哈的儿子，在撒玛利亚作王二年，坠楼受伤后求问巴力西卜，被以利亚责备而死。
body: |-
  亚哈的儿子，与同时代的犹大王亚哈谢同名，不是一人。据《列王纪上》22:51–53，犹大王约沙法十七年，他在撒玛利亚登基作以色列王，共二年；他行他父母所行的道，事奉敬拜巴力。亚哈死后，摩押背叛以色列（《列王纪下》1:1）。

  《历代志下》20:35–37 说犹大王约沙法与他交好，两人合伙在以旬迦别造船，要往他施去，后来船只破坏了；《列王纪上》22:48–49 则说船在以旬迦别破坏后，亚哈谢提议让自己的仆人与约沙法的仆人同去，约沙法不肯。两处记载详略不同。

  据《列王纪下》第 1 章，亚哈谢在撒玛利亚从楼上的栏杆里掉下来，就病了，差人去问以革伦的神巴力西卜，这病能不能好。先知以利亚在路上迎着使者，说王必定要死。王两次派五十夫长带五十人去拿以利亚，都被天上降下的火烧灭；第三次以利亚随五十夫长下来，当面对王说了同样的话。亚哈谢果然死了，他没有儿子，由兄弟约兰接续作王（1:17）。
sources: []
recalled:
  - 《列王纪上》22:40、22:48–53
  - 《列王纪下》第 1 章
  - 《历代志下》20:35–37
