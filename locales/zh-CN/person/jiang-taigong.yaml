name: 姜太公
aliases: [吕尚, 太公望, 师尚父, 姜子牙]
role: 周初重臣，齐国始封君
summary: 周文王、武王的谋臣，号太公望、师尚父，佐武王灭商，受封于齐，是齐国的始封君。
body: |-
  姜太公姓姜，吕氏，名尚，后世通称姜子牙、姜太公，生卒年不详。据《史记·齐太公世家》，他是东海人，祖先曾佐禹治水，受封于吕，所以以吕为氏。

  关于他如何归周，司马迁列举了三种说法：一说他年老穷困，在渭水边钓鱼，周西伯出猎时遇见他，与他交谈后大喜，说“吾太公望子久矣”，于是号为“太公望”，载他一同回去，立为师；一说他曾事奉纣王，因纣无道而离开，游说诸侯无所遇，最后归周；一说他是隐居海滨的处士，西伯被囚时由散宜生、闳夭请他出山，一同营救西伯。后世流传最广的是渭水垂钓的说法。

  据《史记》，西伯获释后，与吕尚暗中谋划修德以倾商政，“其事多兵权与奇计”，所以后世言兵法和周朝的权谋都推崇太公。武王即位后尊他为“师尚父”。牧野之战时，他率先冲击商军。克商后，武王封他于齐，都营丘（即后来的临淄）。他到齐国后“因其俗，简其礼，通商工之业，便鱼盐之利”，齐国由此成为大国。成王时管蔡作乱，周王室授予齐国征伐之权。

  《史记》说太公去世时已一百多岁，此说难以确证。兵书《六韬》托名太公所作，一般认为成书于战国。明代小说《封神演义》中的姜子牙是文学形象，与史书记载相去甚远。
sources: []
recalled:
  - 《史记·齐太公世家》
  - 《史记·周本纪》
  - 《孟子·离娄上》
