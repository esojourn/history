name: 欧阳炯
aliases: []
role: 后蜀宰相、词人
summary: 后蜀宰相和词人，940 年为《花间集》作序，入宋后任翰林学士。
body: |-
  欧阳炯是益州华阳人，乾宁三年（公元 896 年）生，前蜀时任中书舍人。前蜀灭亡后，他随王衍到洛阳，后唐时在秦州任职；孟知祥据蜀后他又回到成都，在后蜀历任翰林学士、门下侍郎兼户部尚书、同平章事等职。

  广政三年（940 年），赵崇祚把晚唐五代十八家词人的五百首词编成《花间集》，欧阳炯为它写了序言（另见“《花间集》编成”条）。这篇序是现存最早的论词文章之一，描述了词在宴会上配乐演唱的情形。他本人也是花间派词人，有十余首词收入《花间集》。

  乾德三年（965 年）后蜀亡，他随孟昶入宋，任翰林学士等职。据宋人记载，他擅长吹长笛，宋太祖曾召他在偏殿吹奏。开宝四年（971 年）他去世。
sources: []
recalled:
