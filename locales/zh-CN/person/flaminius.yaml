name: 弗拉米尼乌斯
aliases: [盖乌斯·弗拉米尼乌斯]
role: 罗马执政官、监察官
summary: 罗马平民派政治家，修弗拉米尼乌斯大道，在特拉西梅诺湖中汉尼拔埋伏阵亡。
body: |-
  盖乌斯·弗拉米尼乌斯，罗马平民出身的政治家，家族此前无人任过高官，约生于公元前 275 年。他与后来战胜马其顿的弗拉米尼努斯不是一家。

  前 232 年他任保民官，不顾元老院反对，提出法案把从高卢塞农人那里夺来的皮凯努姆一带的土地逐户分给罗马平民；波利比乌斯把这看作罗马民众风气变坏的开端。前 227 年他任大法官，是第一位常驻西西里的总督。前 223 年任执政官，越过波河击败高卢因苏布里人。前 220 年任监察官，修筑从罗马通往亚得里亚海岸阿里米努姆的弗拉米尼乌斯大道，并在战神广场建弗拉米尼乌斯竞技场。

  前 217 年他再度当选执政官。李维说他怕元老院借口征兆把他留住，没有在罗马举行就职仪式就去了军中。汉尼拔一路烧掠，诱他追击。6 月的一个雾天清晨，罗马军队沿特拉西梅诺湖北岸的狭路行进，遭到埋伏在山坡上的迦太基军队突袭。据波利比乌斯，约一万五千名罗马人战死，他本人被高卢骑兵杀死。传世的史书多出自元老贵族一系，对他的评价偏于苛刻。
sources: []
recalled:
