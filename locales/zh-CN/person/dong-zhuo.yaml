name: 董卓
aliases: [董仲颖]
role: 相国、太师
summary: 汉末凉州军阀，率军入雒阳，废少帝、立献帝，挟朝廷西迁长安，后被吕布所杀。
body: |-
  据《三国志·魏书·董卓传》和《后汉书·董卓传》，董卓字仲颖，陇西临洮人，生年不详。他年轻时在羌人地区游历，与羌人豪帅结交，以勇力知名，桓帝末年被选为羽林郎，随军征讨羌人立功。此后历任并州刺史、河东太守等职。中平元年（公元 184 年）他接替卢植进攻张角，无功被免；后来又参加征讨凉州叛军的战事，手下聚集了一支以凉州人为主的军队。灵帝末年朝廷调他任并州牧，要他交出部队，他不肯从命，驻兵河东观望。

  中平六年（189 年）灵帝死，大将军何进与袁绍谋诛宦官，召董卓带兵入京。董卓未到，何进已被宦官所杀，袁绍等攻入宫中尽杀宦官，少帝与陈留王被挟持出城。董卓在城北迎回少帝，随即收编何进兄弟的部众，又引诱吕布杀死执金吾丁原、吞并其军，由此控制了雒阳。九月，他废少帝为弘农王，立九岁的陈留王刘协为帝，自任太尉，不久改称相国。何太后和弘农王先后被他害死。

  初平元年（190 年）关东各州郡起兵讨董卓，推袁绍为盟主。董卓挟献帝西迁长安，强迫雒阳一带的百姓随行，放火焚烧雒阳的宫殿、官府和民居。两部史书都说他的军队纵兵抢掠，又发掘帝陵和公卿的坟墓取宝。他废五铢钱，改铸小钱，以致物价飞涨。

  到长安后董卓自称太师，在郿县筑坞堡，储存大量粮食财物。初平三年（192 年）四月，司徒王允与吕布合谋，趁董卓入朝时将他刺杀，并灭其全族。不久董卓的部将李傕、郭汜等攻入长安，杀王允，朝廷再次陷入混乱。
sources: []
recalled:
  - 《三国志·魏书·董二袁刘传》
  - 《后汉书·董卓列传》
