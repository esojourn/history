name: 昙曜
aliases: []
role: 高僧
summary: 北魏高僧，主持开凿云冈石窟最早的五座大窟，即“昙曜五窟”。
body: |-
  昙曜是北魏的高僧，籍贯和生卒年都不清楚。据《魏书·释老志》和《续高僧传》，他早年在北凉修习禅业，北凉灭亡后来到平城。太平真君七年（公元 446 年）太武帝灭佛时，他坚守信仰，没有还俗。文成帝即位后恢复佛法，他受到礼遇。

  和平初年（460 年前后），他继师贤任沙门统，掌管全国僧务。他奏请在平城西面的武州塞开凿石窟五所，每窟雕刻一尊大佛，据《释老志》，最高的七十尺，其次六十尺。这就是今天云冈石窟第十六至二十窟，后世称为“昙曜五窟”（另见“云冈石窟开凿”条）。

  他又奏请设立“僧祇户”和“佛图户”：百姓每年向僧曹缴纳六十斛粟的，称为僧祇户，所缴的粟称为僧祇粟，荒年用来赈济；犯重罪的人和官奴则作为佛图户，供寺院洒扫耕作。这一制度使北魏的寺院经济迅速壮大。他还与西域僧人吉迦夜等合译了《杂宝藏经》《付法藏因缘传》等佛经。
sources: []
recalled:
  - 《魏书·释老志》
  - 道宣《续高僧传·昙曜传》
