name: 齐高帝
aliases: [萧道成, 萧绍伯, 齐太祖]
role: 皇帝
summary: 刘宋末年掌握朝政的将领，479 年代宋建立南齐。
body: |-
  萧道成字绍伯，南兰陵人，自称西汉相国萧何的后代。父亲萧承之是刘宋的将领。他少年时曾随儒者雷次宗读书，后来从军，在宋明帝时屡立战功，出镇淮阴，掌握一支兵力，明帝对他颇为猜疑。

  宋明帝死后，十岁的太子刘昱即位，即后废帝。元徽二年（公元 474 年），桂阳王刘休范从寻阳起兵东下，直逼建康，萧道成坚守新亭，派人诈降刺杀了刘休范，叛乱平息，他由此进入朝廷中枢。刘昱性情暴虐，常带人在街市上随意杀人。《南史》记载，刘昱曾闯进萧道成的府第，见他袒腹而睡，便在他肚子上画了靶心要射，左右劝阻才改用无镞的箭。元徽五年（477 年），刘昱被左右杨玉夫等人杀死，萧道成迎立刘准为帝，即宋顺帝，自己掌握朝政。

  荆州刺史沈攸之随即起兵反对他，朝中的袁粲、刘秉也谋划除掉他，都被他先后平定。昇明三年（479 年），他接受宋顺帝禅让，建立齐朝，年号建元，宋朝至此共历六十年。

  他在位时提倡节俭，《南齐书》记他说过“使我临天下十年，当使黄金与土同价”。他下令清查户籍，纠正虚报士族身份、逃避赋役的弊端，这件事在他儿子齐武帝时引起了民间的反抗。建元四年（482 年），他在建康去世，年五十六，长子萧赜继位。
sources: []
