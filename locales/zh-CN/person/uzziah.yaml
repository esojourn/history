name: 乌西雅
aliases:
  - 亚撒利雅
role: 南国犹大王
summary: 犹大王，在位五十二年，国势强盛，晚年因擅入圣殿烧香而长大麻风。
body: |-
  犹大王亚玛谢的儿子，母亲名叫耶可利雅，是耶路撒冷人。《列王纪下》称他为亚撒利雅，《历代志》和先知书多称他为乌西雅。据《列王纪下》15:1–2 和《历代志下》26:1–3，犹大众民立他接续父亲作王，那时他十六岁，在耶路撒冷作王五十二年。出生地圣经没有记载。

  《列王纪》对他的记载很简略，他的事迹主要见于《历代志下》第 26 章。他修筑以禄，使它仍归犹大；出兵攻打非利士人，拆毁迦特、雅比尼和亚实突的城墙；亚扪人向他进贡。他在耶路撒冷的角门、谷门和城墙转弯处建筑城楼，在旷野建望楼、挖许多井，又喜爱农事。26:13 说他的军兵有三十万七千五百人；26:15 说他在耶路撒冷叫巧匠做机器，安在城楼和角楼上，用来射箭发石。

  据 26:16–21，他强盛以后心里高傲，进了耶和华的殿，要在香坛上烧香。祭司亚撒利雅率领八十个祭司阻挡他，说烧香是亚伦子孙的事。乌西雅发怒，这时额上忽然长出大麻风，他被赶出殿去，此后住在别的宫里直到死日，由儿子约坦管理家事、治理国民。他死后葬在王陵的田间（26:23）。

  《以赛亚书》6:1 把以赛亚见异象的事系于乌西雅王去世的那年；《阿摩司书》1:1 和《撒迦利亚书》14:5 都提到乌西雅年间的一次大地震。
sources: []
recalled:
  - 《列王纪下》14:21–22、15:1–7
  - 《历代志下》第 26 章
  - 《以赛亚书》6:1
  - 《阿摩司书》1:1
  - 《撒迦利亚书》14:5
