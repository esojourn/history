name: 雷必达
aliases: [马尔库斯·埃米利乌斯·雷必达, 李必达, 雷比达]
role: 后三头之一、大祭司长
summary: 恺撒的骑兵长官，后三头之一，前 36 年被屋大维夺去兵权，幽居至死。
body: |-
  马尔库斯·埃米利乌斯·雷必达，罗马贵族，约生于公元前 89 年。父亲同名，前 78 年任执政官，苏拉死后起兵反对苏拉的体制，兵败死于撒丁岛。他娶塞尔维利娅的女儿尤尼娅，与布鲁图、卡西乌斯是姻亲。

  内战开始时他任大法官，留在罗马主持，提议任命恺撒为独裁官。此后他治理近西班牙，前 46 年与恺撒同任执政官，随后任恺撒的骑兵长官，是独裁官的副手。前 44 年 3 月 15 日恺撒遇刺，他把驻在城外的军队调进广场，主张立即报复，被安东尼劝住。安东尼安排他接任大祭司长，他随后去了自己的行省纳尔榜高卢和近西班牙。

  前 43 年安东尼在穆提纳战败后翻山来投，两军士兵联欢，他顺势与安东尼合兵，被元老院宣布为公敌。11 月他与安东尼、屋大维在博诺尼亚附近会面，结成有法律依据的“整顿国家三人团”，为期五年。据阿庇安，公敌名单上有他的亲兄弟保卢斯，后者得以逃脱。前 42 年他任执政官留守意大利，没有参加腓立比之战；战后因被怀疑与塞克斯图斯·庞培勾结，行省被另外两人分走，后来只得到阿非利加。

  前 36 年屋大维进攻占据西西里的塞克斯图斯·庞培，他从阿非利加带兵登岛。战事结束后，他接受墨萨拿守军的投降，要求把西西里归他。屋大维走进他的营地向士兵喊话，军队成批倒戈。他向屋大维求饶，被剥夺三头的权力，保住了性命和大祭司长的头衔，迁到基尔凯伊居住，此后二十多年受人监视。前 13 年或前 12 年他去世，奥古斯都这才接任大祭司长。
sources: []
recalled:
