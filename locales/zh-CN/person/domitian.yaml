name: 图密善
aliases: [提图斯·弗拉维乌斯·多米提安努斯, 多米提安, 多米田]
role: 罗马皇帝
summary: 韦斯巴芗的次子，弗拉维王朝末代皇帝，在位十五年后遇刺。
body: |-
  图密善于公元 51 年 10 月 24 日生在罗马，是韦斯巴芗的次子。81 年哥哥提图斯去世，他继位。他管束官吏很严，把士兵的年饷提高了三分之一。83 年他亲征莱茵河对岸的卡蒂人，在莱茵河与多瑙河上游之间修筑边防线。多瑙河下游的达契亚人两次击败罗马军，89 年他与达契亚王德凯巴鲁斯议和，每年付给对方一笔钱。

  89 年上日耳曼总督萨图尔尼努斯起兵，很快失败。此后他对元老日益猜忌，处死和流放了不少人，哲学家被逐出罗马。苏维托尼乌斯和狄奥说他要人称他“主人和神”。95 年他处死堂兄弟弗拉维乌斯·克莱门斯，狄奥说罪名是“不敬神”和沾染犹太人的习俗。教会传统把他列为逼迫基督徒的皇帝，说使徒约翰就是在这时被放逐到拔摩岛，同时代的佐证很少。

  96 年 9 月 18 日，他在宫中被近侍刺死，元老院下令毁掉他的名号和雕像。塔西佗、小普林尼的记述都带着强烈的敌意。
sources: []
recalled:
  - 苏维托尼乌斯《罗马十二帝王传·图密善传》
  - 卡西乌斯·狄奥《罗马史》卷 67
  - 塔西佗《阿古利可拉传》第 39—45 章
  - 优西比乌《教会史》卷 3 第 17—20 章
