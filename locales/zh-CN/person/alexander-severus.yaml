name: 亚历山大·塞维鲁
aliases: [塞维鲁·亚历山大, 亚历山大·塞维鲁斯]
role: 罗马皇帝
summary: 塞维鲁王朝末代皇帝，十三岁即位，公元 235 年被哗变的士兵杀死。
body: |-
  亚历山大·塞维鲁于公元 208 年 10 月 1 日生在腓尼基的阿尔卡，母亲尤利娅·玛麦娅是尤利娅·多姆娜的外甥女。221 年，他的表兄、皇帝埃拉伽巴卢斯收他为养子；次年 3 月禁卫军杀死埃拉伽巴卢斯，拥立了他。这时他十三岁，朝政由外祖母和母亲主持，法学家乌尔比安任禁卫军长官，历史学家卡西乌斯·狄奥在 229 年与他同任执政官。

  224 年萨珊家族的阿尔达希尔推翻帕提亚，随后进犯罗马的美索不达米亚。231 年他到安条克，次年分三路进兵，互有胜负，边界大体恢复原状。234 年阿勒曼尼人越过莱茵河，他赶到美因茨，想用钱买得和平。士兵本来就嫌他事事听母亲的，又嫌赏赐少，235 年 3 月拥立军官马克西米努斯，把他和母亲杀死在营帐里。

  此后五十年皇帝更换频繁，后世称为三世纪危机。《罗马帝王纪》把他写成理想的君主，说他的私人神龛里供着亚伯拉罕和基督的像，这部书的这一类记载多不可靠。
sources: []
recalled:
  - 赫罗狄安《马可以后的帝国史》卷 5—6
  - 卡西乌斯·狄奥《罗马史》卷 80
  - 《罗马帝王纪·亚历山大·塞维鲁传》
