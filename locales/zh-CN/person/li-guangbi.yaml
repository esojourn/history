name: 李光弼
aliases: [临淮王]
role: 天下兵马副元帅
summary: 契丹族名将，与郭子仪齐名，安史之乱中坚守太原、河阳，封临淮王。
body: |-
  李光弼是营州柳城人，契丹族，景龙二年（公元 708 年）生，父亲李楷洛是唐朝的将领。他少年从军，在河西、朔方节度使王忠嗣部下任职，以治军严整著称。

  天宝十五载（756 年）初，经郭子仪推荐，他被任命为河东节度副使，率朔方兵出井陉，进入河北，收复常山，此后与郭子仪合兵在嘉山大败史思明。潼关失守后，他撤回太原。至德二载（757 年），史思明等人率大军围攻太原，据《资治通鉴》，叛军号称十万，他手下的精兵不满一万；他挖掘地道、制造抛石器，坚守一个多月，最后出城击败叛军，保住了河东。

  乾元二年（759 年）邺城之败后，他代替郭子仪任朔方节度使、天下兵马副元帅。同年秋史思明再次南下，他认为洛阳难守，主动撤出，退守河阳，多次击败叛军，使史思明不敢西进。上元二年（761 年），宦官鱼朝恩和仆固怀恩催促他进攻洛阳，他不得已出战，在邙山大败。此后他镇守徐州，平定了江淮一带的袁晁起事等变乱，进封临淮郡王。

  广德元年（763 年）吐蕃攻入长安，代宗征召各地兵马，他因为害怕宦官程元振、鱼朝恩的谗害，迟迟不肯入朝。据《旧唐书》，他因此愧恨成疾，广德二年（764 年）七月在徐州去世，年五十七。史书把他与郭子仪并称“郭李”。
sources: []
recalled:
  - 《旧唐书·李光弼传》
  - 《新唐书·李光弼传》
