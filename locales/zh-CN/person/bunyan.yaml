name: "本仁约翰"
aliases: ["约翰·班扬", "班扬"]
role: "浸礼派传道人、《天路历程》作者"
summary: "补锅匠出身的传道人，复辟后坐牢十二年，写成《天路历程》。"
body: |-
  本仁约翰 1628 年生于贝德福德郡埃尔斯托一个补锅匠家庭，只上过很少的学，后来也以补锅为业。内战时他十六岁，在国会军中当过兵。成家后，他从妻子带来的两本敬虔书籍开始读，经过几年剧烈的内心挣扎，加入贝德福德一个独立派会众，牧师是吉福德。他在自传《罪魁蒙恩记》里详细写了这段经历。

  1655 年前后他开始在乡间讲道。1660 年王政复辟，次年起法律禁止不从国教者聚会，他因无照讲道被捕，拒绝承诺不再讲道，在贝德福德监狱一关就是十二年，靠编织鞋带养活家人，在狱中写书。1672 年查理二世颁布信仰宽容令，他获释，做了贝德福德那个会众的牧师；1675 年前后他又短期入狱。

  《天路历程》第一部 1678 年出版，写“基督徒”背着重担离开“将亡城”，经过灰心潭、名利场、怀疑寨等地到达天城，用寓言写出得救和走天路的经历，很快风行，被译成上百种语言，至今仍是英语世界读者最多的书之一。他一生写了约六十种书。1688 年他骑马冒雨到伦敦调解一对父子的纠纷，染病去世。

  《历史的轨迹》第三十一章在讲复辟后的逼迫时提到他，称他是在英国为信仰受苦的大批圣徒中的“一位可怜的思想家”；线上版本这一段在他的英文名字处中断，后文缺失，所以书中对他的具体叙述无从核对，以上生平是凭记忆写的。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
recalled:
  - "本仁约翰《罪魁蒙恩记》（1666 年）"
  - "本仁约翰《天路历程》（第一部 1678 年）"
