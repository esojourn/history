name: 刘渊
aliases: [刘元海, 汉光文帝]
role: 汉国（前赵）开国君主
summary: 匈奴贵族，八王之乱中在并州自立为汉王，建立十六国中最早的政权之一。
body: |-
  刘渊字元海，新兴匈奴人，是南匈奴左部帅刘豹之子，生年不详。《晋书·载记》说，汉高祖曾以宗室女嫁给冒顿单于，约为兄弟，所以冒顿的后人以刘为姓。曹操把入居并州的匈奴分为五部，各立部帅，派汉人监督，刘氏世代是其中的贵族。

  他自幼好学，拜上党人崔游为师，学习《毛诗》《易》《尚书》，尤其喜欢《春秋左氏传》和孙吴兵法，又兼习武艺。曹魏末年他作为人质住在洛阳，受到司马昭的优待。晋武帝时，有大臣推荐他领兵平吴或出镇西北，也有人说他才干太高、“非我族类”，不可重用，他始终未得任用。父亲死后他继任左部帅，后来升为匈奴五部大都督。成都王颖镇守邺城，把他留在身边任职。

  永兴元年（公元 304 年）诸王混战，匈奴贵族刘宣等人暗中推他为大单于。他借口回并州调发匈奴兵援助成都王，离开邺城，到左国城即大单于位，据载记，二十天内聚众五万。同年十月他自称汉王，建年号，追尊蜀汉后主刘禅为孝怀皇帝，祭祀汉朝的历代皇帝，表示继承汉统。羯人石勒、东莱人王弥等各路武装先后归附，声势扩展到冀州和青州。

  永嘉二年（308 年）他称皇帝，次年迁都平阳，两次派儿子刘聪等进攻洛阳，都没有攻下。永嘉四年（310 年）他病逝。次年，他的继承人攻陷了洛阳。他的国号是汉，后来刘曜改称赵，史家合称“汉赵”或“前赵”。
sources: []
recalled:
  - 《晋书·刘元海载记》
  - 《资治通鉴》卷八十五至八十七
