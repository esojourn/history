name: 妇好
aliases: [后母辛]
role: 武丁的配偶，商军统帅
summary: 商王武丁的配偶，卜辞记她领兵征伐；1976 年发掘的妇好墓未被盗掘。
body: |-
  妇好是商王武丁的配偶之一，生卒年不详，她的事迹不见于传世古书，而是来自甲骨卜辞和考古发现。在武丁时期的卜辞中，“妇好”这个名字出现了一二百次（具体统计数字各家不同），内容涉及她的生育、疾病，以及她领兵征伐、主持祭祀等事。

  卜辞记载妇好曾率军征伐土方、巴方、夷方和羌方。有一条常被引用的卜辞，占问征集“妇好三千”“旅万”去攻伐羌方，学者据此认为她是商代地位很高的女性将领。她还拥有自己的封地，向王室进贡。卜辞中有武丁为她的分娩、疾病占卜的记录，可见武丁对她的关切。

  1976 年，考古工作者在河南安阳殷墟发掘了一座未被盗掘的商代墓葬，即殷墟五号墓。墓中出土随葬品一千九百多件，包括大量青铜器、玉器，不少铜器上铸有“妇好”二字，因此被认定为妇好墓。一些铜器上铸有“司母辛”等字，学者认为“辛”是她死后的庙号，即后世祭祀中的“后母辛”。

  从墓葬看，妇好死在武丁之前。妇好墓是殷墟唯一一座能与甲骨卜辞中的人物对应、又保存完整的商王室墓葬，对研究商代历史意义很大。

  妇好墓出土的两件大型铜钺上铸有她的名字，钺是军事统帅权力的象征。
sources: []
recalled:
  - 《殷墟妇好墓》（考古发掘报告）
