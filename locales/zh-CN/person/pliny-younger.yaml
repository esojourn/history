name: 小普林尼
aliases: [盖乌斯·普林尼乌斯·凯基利乌斯·塞孔都斯, 普林尼]
role: 律师、作家、比提尼亚总督
summary: 罗马元老、书信作家，记下维苏威火山爆发，并就基督徒问题请示图拉真。
body: |-
  小普林尼于公元 61 或 62 年生在科穆姆，父亲早死，由舅舅老普林尼照看，舅舅在遗嘱里收他为养子。他在罗马跟修辞学家昆体良学习。79 年维苏威火山爆发时他十七岁，与母亲住在米塞努姆；二十多年后，他应塔西佗的请求写了两封信，一封讲舅舅怎样遇难，一封讲自己和母亲怎样在黑暗与落灰中逃离，这是关于这次灾难唯一的目击记述。

  他十八岁起出庭办案，后来以审理遗产案件的百人法庭为主要舞台。图密善在位时他一路做到裁判官，其后主管军人金库和国库。公元 100 年他任补任执政官，就职时向图拉真致谢的演说经他扩充后流传下来，即《图拉真颂》。同一年他与塔西佗一同在元老院控告贪赃的阿非利加总督。

  他把自己的书信编成九卷陆续发表，共二百多封，写给塔西佗、苏维托尼乌斯等一百多人，内容有官场、诉讼、庄园、读书和朋友的生死，是了解当时元老阶层生活的主要材料。他给家乡捐建图书馆，出钱请教师，资助贫家子女，这些事有科莫出土的铭文为证。

  110 年前后，图拉真派他以特使身份去整顿比提尼亚和本都行省的财政。第十卷是他在任上与皇帝的往来公文，事无大小都请示。其中第 96 封讲他怎样审讯被人告发的基督徒：不肯悔改的处死，是罗马公民的押送罗马；肯向神像和皇帝像献祭并咒骂基督的就释放。他说查问所得，不过是这些人在固定的日子天亮前聚会，向基督唱诗如同向神，并起誓不作恶。这是罗马官方文书里最早讲到基督徒聚会的一份。通信到 112 或 113 年中断，一般认为他死在任上。
sources: []
recalled:
  - 小普林尼《书信集》卷 6 第 16、20 封，卷 10 第 96—97 封
  - 小普林尼《图拉真颂》
  - 科莫出土小普林尼生平铭文
