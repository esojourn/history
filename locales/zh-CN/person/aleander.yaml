name: "亚良德"
aliases: ["吉罗拉莫·阿莱安德罗", "阿莱安德"]
role: "教皇使节、人文学者"
summary: "意大利人文学者，1521 年任教皇使节出席沃尔姆斯帝国议会，起草处置路德的敕令。"
body: |-
  亚良德 1480 年生于威尼斯共和国境内的莫塔，通希腊文、希伯来文，年轻时在威尼斯与伊拉斯谟同住过一段时间。1508 年他到巴黎教希腊文，做过巴黎大学的校长，后来为列日主教办事，1519 年任梵蒂冈图书馆馆长。

  1520 年教皇派他把谴责路德的诏书带到尼德兰和莱茵地区，他在鲁汶、科隆等地当众焚烧路德的著作。次年他作为教皇使节出席沃尔姆斯帝国议会。《历史的轨迹》第二十二章说，教皇一方的人在他带领下日夜奔走，要阻止路德在议会上得到听审的机会，因为教皇既已定罪，世俗的议会只该执行；议会仍然让路德到场，这是他的失败。该书又说路德失踪后城里群情激愤，有人警告他，即使躲进皇帝怀中也难免被杀。他写给教廷的报告留存至今，其中说德意志十之八九的人喊着“路德”，其余的喊“罗马教廷去死”。

  议会散后，皇帝在 5 月签署的《沃尔姆斯敕令》是他起草的。该书第二十九章说，查理五世从此决定与教皇的代表亚良德联手。此后他任布林迪西大主教，出使过法国和德意志，1538 年被保罗三世立为枢机，参与筹备公会议。伊拉斯谟疑心他在背后中伤自己，两人交恶。1542 年他在罗马去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十二章“教会大大骚动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter25.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十九章“罗马教会从事改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter32.html"
recalled:
  - "亚良德自沃尔姆斯致教廷的报告（1520—1521 年）"
  - "《沃尔姆斯敕令》（1521 年 5 月）"
  - "伊拉斯谟《书信集》"
