name: 约坦
aliases: []
role: 南国犹大王
summary: 乌西雅的儿子，父亲患麻风后代理国政，作王十六年，修建圣殿上门。
body: |-
  犹大王乌西雅（亚撒利雅）的儿子，母亲耶路沙是撒督的女儿。乌西雅长了大麻风，住在别的宫里，由约坦管理家事、治理国民（《列王纪下》15:5）。据 15:32–34，以色列王比加第二年，约坦登基作犹大王，年二十五岁，在耶路撒冷作王十六年；经文说他行耶和华看为正的事，只是邱坛还没有废去。他建造了耶和华殿的上门（15:35）。

  《历代志下》第 27 章说他在俄斐勒的城墙上多有建造，又在犹大山地建筑城邑，在树林中建筑营寨和高楼。他与亚扪人争战得胜，据 27:5，亚扪人那一年进贡银子一百他连得、小麦一万歌珥、大麦一万歌珥，第二年、第三年也是这样。

  《列王纪下》15:37 说，在他的年间，耶和华才使亚兰王利汛和利玛利的儿子比加去攻击犹大。他死后葬在大卫城，儿子亚哈斯接续作王（15:38）。《列王纪下》15:30 提到“约坦二十年”，超出他作王的十六年，一般认为他与父亲乌西雅、儿子亚哈斯都有共同执政或退位的时期，年代的排法各家不一。《以赛亚书》《何西阿书》《弥迦书》的开头都提到约坦的年间。
sources: []
recalled:
  - 《列王纪下》15:5–7、15:30–38
  - 《历代志下》第 27 章
  - 《以赛亚书》1:1；《何西阿书》1:1；《弥迦书》1:1
