name: 伽利埃努斯
aliases: [加里恩努斯, 加列努斯, 伽里恩努斯]
role: 罗马皇帝
summary: 瓦勒良之子，在帝国三分的危局中独力支撑，停止了对基督徒的逼迫。
body: |-
  伽利埃努斯约生于公元 218 年。253 年父亲瓦勒良称帝，立他同为皇帝，父亲管东方，他守莱茵河和多瑙河。260 年瓦勒良被波斯人俘虏，各地将领纷纷自立：波斯图穆斯占据高卢、不列颠和西班牙，另立朝廷；东方靠帕尔米拉的奥登纳图斯抵挡波斯，名义上听命，实则自主。伽利埃努斯手里只剩意大利、巴尔干和北非。

  他在米兰附近击败侵入意大利的阿勒曼尼人，把骑兵集中成一支机动部队驻在米兰。据奥勒留·维克多，他不再让元老统领军团，改用行伍出身的军官，日后几位皇帝都出自这批人。267 年前后哥特人和赫鲁利人从海上南下，一直抢到雅典。

  据优西比乌，他在 260 年下令停止父亲对基督徒的逼迫，发还教堂和墓地，教会此后有四十多年的安宁。他也敬重哲学家普罗提诺。268 年他在米兰围攻叛将时被手下军官合谋杀死。拉丁文史书把他写成耽于享乐的昏君，这多半出于元老阶层的怨恨。
sources: []
recalled:
  - 奥勒留·维克多《诸恺撒传》第 33 章
  - 《罗马帝王纪·两位伽利埃努斯传》
  - 优西比乌《教会史》卷 7 第 13 章
  - 佐西莫斯《新历史》卷 1 第 30—41 章
