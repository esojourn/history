name: 约翰十二世
aliases:
  - 屋大维
  - 若望十二世
role: 罗马主教（教皇）
summary: 955—964 年在位的教皇，罗马贵族之子，少年即位，为奥托一世加冕后被他废黜。
body: |-
  约翰原名屋大维，约生于公元 937 年，父亲阿尔贝里克是当时罗马城的实际统治者，临终前要罗马人发誓选他的儿子作教皇。955 年 12 月屋大维即位，年约十八岁，改名约翰。

  《历史的轨迹》第十一章说，十世纪是教皇地位最低落的时期：谁控制了罗马，谁就能指派教皇；从 891 年到 955 年约翰十二世即位，其间教皇不下二十位。约翰本人的品行，据克雷莫纳主教利乌特普兰德的记载十分不堪；这位作者是奥托的人，所说未必公允。

  约翰受意大利王贝伦加尔威胁，向德意志国王奥托一世求援，962 年 2 月 2 日在罗马为他加冕为皇帝。奥托一走，他又去联络贝伦加尔的儿子。963 年底奥托回到罗马，召开会议把他废掉，另立利奥八世。奥托离开后约翰回城报复，964 年 5 月去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十一章“教会被政府控制” https://wellsofgrace.com/books/spiritual/2000years/html/chapter13.html"
recalled:
  - 克雷莫纳的利乌特普兰德《奥托史》
  - 《教皇列传》约翰十二世传
