name: 赵普
aliases: [赵则平]
role: 赵匡胤的谋士、北宋宰相
summary: 赵匡胤的幕僚，参与策划陈桥兵变，宋初长期任宰相，提出削夺藩镇兵权的方略。
body: |-
  赵普是幽州蓟县人，字则平，后唐时随家迁居洛阳。后周显德三年（公元 956 年），赵匡胤攻下滁州，赵普在那里结识了他，此后长期担任他的幕僚，任掌书记。

  显德七年（960 年）正月陈桥兵变时，赵普与赵匡胤的弟弟赵匡义一同在军中联络将士，筹划拥立之事，是兵变的主要参与者之一（另见“陈桥兵变”条）。北宋建立后，他任枢密使，后来长期任宰相。据宋代史书，他向宋太祖提出削夺藩镇之权、控制其钱粮、收其精兵的办法，以防止五代那样的武将割据重演。

  此后他几次罢相、复相，淳化三年（992 年）去世。后世流传他说过“半部《论语》治天下”，这句话最早见于南宋人的记载，未必出自他本人。
sources: []
recalled:
  - 《宋史·赵普传》
  - 《续资治通鉴长编》卷一至卷二
