name: 刘縯
aliases: [刘伯升, 齐武王]
role: 大司徒
summary: 刘秀的长兄，率南阳宗室起兵反王莽，与绿林军联合，攻下宛城后被更始帝所杀。
body: |-
  据《后汉书·宗室四王三侯列传》，刘縯字伯升，南阳蔡阳人，是汉景帝之子长沙定王的后代，刘秀的长兄。列传说他性情刚毅，自王莽篡汉后常怀不平，不经营家业，倾尽家财结交各地的豪杰。

  地皇三年（公元 22 年），他与刘秀等人召集宗族子弟和宾客七八千人，在家乡起兵，自称柱天都部，并与新市、平林两支绿林军联合，向宛城进发。起初他们在小长安被王莽的军队打得大败，他的几位亲属战死。次年正月，他联合下江兵再战，斩杀了王莽的南阳太守甄阜等人，随后又击败前来增援的莽军，包围宛城。

  这时联军已有十余万人，将领们商议拥立一位刘氏宗室为帝。南阳的豪杰多主张立刘縯，新市、平林的将领担心他威严难制，抢先立了刘玄。刘縯被任为大司徒。五月他攻下宛城，几天后刘秀在昆阳大捷，兄弟二人声望更高，更始帝君臣因此不安。刘縯的部将刘稷不服更始帝，被逮捕问罪，刘縯出面力争，更始帝的将领李轶、朱鲔趁机劝更始帝把他一并处死。刘秀闻讯从前线赶回宛城谢罪，不为兄长服丧，言谈饮食如常。刘秀称帝后，于建武十五年追谥他为齐武王。
sources: []
recalled:
  - 《后汉书·宗室四王三侯列传》
  - 《后汉书·光武帝纪上》
