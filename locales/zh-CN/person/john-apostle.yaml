  - 《路加福音》22:8
  - 《约翰福音》13:23、19:26–27、20:2–8、21:20–24
  - 《使徒行传》第 3—4 章、8:14
  - 《加拉太书》2:9
  - 《启示录》1:9
  - 爱任纽《驳异端》卷 2、卷 3（约翰晚年在以弗所）
  - 优西比乌《教会史》卷 3、卷 7（引狄奥尼修论《启示录》的作者）
