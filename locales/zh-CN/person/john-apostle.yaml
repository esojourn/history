name: 使徒约翰
aliases:
  - 西庇太的儿子约翰
  - 约翰
role: 十二使徒之一
summary: 西庇太的儿子，雅各的兄弟，十二使徒之一，教会传统以他为《约翰福音》的作者。
body: |-
  约翰是西庇太的儿子、雅各的兄弟，和父兄一同在加利利海打鱼，生年没有记载。耶稣在海边呼召他们兄弟二人，他们就离开父亲和船跟从了他（可 1:19–20）。耶稣给兄弟二人起名叫半尼其，就是雷子的意思（可 3:17）。他和彼得、雅各三人常被耶稣带在身边，睚鲁的女儿复活、山上改变形像、客西马尼祷告时都在场。《马可福音》9:38 记他曾禁止一个不跟从他们的人奉耶稣的名赶鬼；《路加福音》22:8 记耶稣打发他和彼得去预备逾越节的筵席。

  《约翰福音》没有提到约翰的名字，书中却几次出现一位耶稣所爱的门徒：最后的晚餐时他侧身挨近耶稣的怀里；他站在十字架旁边，耶稣把母亲托付给他；七日的第一日清早，他和彼得一同跑到坟墓那里（约 13:23；19:26–27；20:2–8）。这卷书的末尾说，为这些事作见证并且记载这些事的就是这门徒（约 21:24）。教会传统认为这位门徒就是使徒约翰，书中没有明说。

  在《使徒行传》里，约翰常与彼得同行：两人在圣殿门口医好瘸腿的人，在公会前受审（第 3—4 章），后来又一同被差往撒玛利亚（8:14）。保罗在《加拉太书》2:9 把雅各、矶法、约翰并称为教会的柱石。此后新约的叙事部分不再提到他。

  教会传统把《约翰福音》、三封约翰书信和《启示录》都归在他名下。《启示录》1:9 的作者自称约翰，说自己在名叫拔摩的海岛上。据爱任纽等早期教父的说法，约翰晚年住在以弗所，活到罗马皇帝图拉真在位的年间（图拉真于公元 98 年即位），在那里去世。这五卷书是否出自同一人之手，从古代起就有不同看法，例如三世纪亚历山大的主教狄奥尼修就曾认为《启示录》的作者另有其人，现代学界对此也没有一致的意见。他的卒年和去世的地点，新约本身没有记载。
sources: []
