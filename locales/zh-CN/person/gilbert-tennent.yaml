name: "吉尔伯特·滕能特"
aliases: ["基伯·滕能特"]
role: "大觉醒中的长老会奋兴讲员"
summary: "木屋学院创办人的长子，在新泽西用英语讲道，把复兴带进中部殖民地的长老会。"
body: |-
  《历史的轨迹》第四十二章说，吉尔伯特是威廉·滕能特的长子，从小在父亲教导下长大。父亲创办木屋学院那年，他已在弗瑞林海森附近的一间长老会做牧师，弗瑞林海森尽力帮助他，准许他在荷兰改革宗教会讲道。他用英语讲道，虽然引起一些会友反对，但他的讲道加上木屋学院其他毕业生的努力，使复兴之火在长老会中从长岛一直烧到弗吉尼亚。第四十三章说，在华盛顿和富兰克林成为全民的政治象征之前，怀特菲尔德、爱德华兹、滕能特等人的名字早已为所有殖民者关注。

  据一般记载，他 1703 年生于爱尔兰，随父移居北美，1726 年起在新泽西新不伦瑞克牧会。1740 年他发表讲章《未悔改牧者的危险》，攻击不支持复兴的牧师，成为次年长老会分裂为新派、旧派的导火线之一。他曾陪同怀特菲尔德巡回讲道，并在新英格兰带领奋兴聚会。后来他语气转趋缓和，1743 年起在费城牧养由复兴中归信者组成的教会，晚年致力于 1758 年新旧两派的重新合一。他 1764 年在费城去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十二章“教会经历大觉醒” https://wellsofgrace.com/books/spiritual/2000years/html/chapter47.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十三章“新兴国家的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter48.html"
