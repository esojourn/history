name: 曹雪芹
aliases: [曹霑, 梦阮, 芹圃]
role: 小说家
summary: 江宁织造曹家的后代，家族被抄后迁居北京，在贫困中写成《红楼梦》前八十回。
body: |-
  曹雪芹名霑，雪芹是他的号，生卒年都不能确定，一般认为生于康熙五十四年（1715 年）前后。他的曾祖曹玺、祖父曹寅、伯父曹颙和父辈曹頫相继任江宁织造近六十年，曹寅深受康熙帝信任，康熙帝六次南巡，有四次住在曹家主持的江宁织造署。

  雍正五年（1727 年）末，曹頫因亏空、骚扰驿站等罪名被革职抄家，次年曹家迁回北京，此后家道日益衰落，曹雪芹的少年时代就在这样的变故中度过。关于他在北京的生活，只有他的朋友敦敏、敦诚、张宜泉等人的诗文留下了零星的记载，大致可以知道他晚年住在北京西郊，生活贫困，“举家食粥酒常赊”，善于诗画，性格狂放。

  曹雪芹用十年左右的时间创作《红楼梦》（原名《石头记》），书中描写贾、史、王、薛四大家族的兴衰，以贾宝玉、林黛玉、薛宝钗的爱情婚姻悲剧为中心，刻画了大量性格鲜明的人物，被公认为中国古典小说的最高成就之一。小说在他生前以“脂砚斋”等人评点的抄本流传，只有前八十回。乾隆五十六年（1791 年）程伟元、高鹗整理出版了一百二十回本，后四十回的作者是谁，学界至今仍有争论。

  曹雪芹的卒年有乾隆二十七年除夕（公历 1763 年 2 月）和乾隆二十八年除夕（公历 1764 年 2 月）两种主要说法，据说他在幼子夭折后悲伤成疾而死。二十世纪二十年代胡适等人考证曹雪芹的家世和生平，开创了“新红学”。
sources: []
recalled:
  - 脂砚斋《石头记》评语
  - 敦诚《四松堂集》
  - 胡适《红楼梦考证》
  - 周汝昌《红楼梦新证》
