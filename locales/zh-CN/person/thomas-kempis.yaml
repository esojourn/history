name: 多马·肯培
aliases:
  - 金碧士
  - 托马斯·厄·肯培
  - 耿稗思
role: 修士、灵修作家
summary: 兹沃勒城外圣阿格尼丝山修道院的修士，《效法基督》一书通常归于他名下。
body: |-
  多马本姓海默肯，约在 1380 年生于莱茵河下游的肯彭，“肯培”是从家乡的地名来的。他父亲是工匠，母亲教小孩子读书。1392 年前后，他十二三岁，跟着哥哥的脚步到荷兰的代芬特尔上学，在那里认识了革若特的继承人拉德韦因斯，住在共同生活弟兄会照管学生的地方。

  1399 年他到兹沃勒城外的圣阿格尼丝山修道院，他的哥哥是那里的院长。这所修道院属于温德斯海姆一系，与弟兄会同出一源。他在那里过了七十多年，1413 年前后受立为司铎，两度任副院长，还管过一阵庶务，据说并不擅长。他的日常工作是抄书，把整部圣经抄过不止一遍，又写了革若特等人的传记和本院的纪事。

  《效法基督》约在 1418 至 1427 年间写成，分四卷：前两卷讲内心生活的操练，第三卷是基督与门徒的对话，第四卷讲领圣餐。这部书最初不署名流传，后来有人把它归给巴黎大学的校长热尔松等人，争论了几百年；现存一部 1441 年的抄本是多马亲笔所写，今天多数学者认为作者就是他。它用短句写成，大量化用圣经的话，劝人谦卑、舍己、少求学问上的虚名、专心爱基督。

  《历史的轨迹》第二十章把他列为深受共同生活弟兄派影响的人，说他住在荷兰，写了这部至今仍在属灵著作中名列前茅的书，教导人研读圣经、逃避世界的虚浮。此书抄本和印本极多，被译成许多种语言。

  他于 1471 年 7 月在圣阿格尼丝山去世，年九十出头。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 多马·肯培《效法基督》《圣阿格尼丝山修道院纪事》《革若特传》
  - 《效法基督》1441 年亲笔抄本（今藏布鲁塞尔）
