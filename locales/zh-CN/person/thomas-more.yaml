name: "托马斯·莫尔"
aliases: ["莫尔", "摩耳多马", "圣托马斯·莫尔"]
role: "英格兰大法官、人文学者"
summary: "《乌托邦》的作者，伊拉斯谟的朋友，任大法官时查禁新教，因不认国王为教会元首被斩。"
body: |-
  莫尔 1478 年 2 月生于伦敦，父亲是法官。他在牛津读过两年书，回伦敦学法律，一度住在加尔都西会修道院旁考虑出家，后来成了家，做律师和伦敦的副司法官。1499 年他结识伊拉斯谟，两人成为终身的朋友，《愚人颂》就是在他家里写成的。1516 年他出版《乌托邦》，借一个虚构的岛国批评当时的欧洲。

  他进了亨利八世的枢密院，1523 年任下院议长。《历史的轨迹》第二十八章说，伊拉斯谟把路德的著作寄给他。他帮国王整理过驳路德的《七圣礼辩》，后来受伦敦主教委托用英文写书驳斥异端，与丁道尔往复论战，写了几十万字。1529 年他接替沃尔西任大法官。该书说他是非常热心的天主教徒，曾把许多路德派信徒送上火刑柱；他任内被烧死的异端有六人，他自己承认主张对异端严办。

  国王要离婚，他不赞成，又不便公开反对。1532 年 5 月教士会议向国王屈服的次日，他辞了职。1534 年议会要臣民宣誓承认国王与安妮·博林所生子女的继承权，誓词里带着否认教皇权柄的话，他和罗切斯特主教费舍尔都拒绝宣誓，被关进伦敦塔。他始终不说拒绝的理由，想靠沉默保全性命。

  1535 年教皇把狱中的费舍尔立为枢机，国王大怒，6 月 22 日费舍尔被斩首。该书说这位老主教七十六岁；按他 1469 年的生年是六十五岁上下。7 月 1 日莫尔受审，有人作证说他在狱中谈话时否认过议会有权立国王为教会元首，他被定为叛国。7 月 6 日他在塔山被斩首。据当时的记述，他在刑台上说自己至死是国王的忠仆，但首先是神的仆人。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十八章“英国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter31.html"
recalled:
  - "莫尔《乌托邦》（1516 年）"
  - "莫尔《关于异端的对话》（1529 年）"
  - "罗珀《托马斯·莫尔爵士传》"
  - "1535 年《巴黎通讯》（记莫尔受刑）"
