name: 法布里基乌斯
aliases: [盖乌斯·法布里基乌斯·卢斯基努斯, 法布里修斯]
role: 罗马执政官、监察官
summary: 罗马执政官，奉派与皮洛士交涉，以拒绝贿赂、清贫廉洁著称。
body: |-
  盖乌斯·法布里基乌斯·卢斯基努斯，罗马平民出身的将领，生卒年不详。公元前 282 年他任执政官，解救被卢卡尼亚人和布鲁提人围攻的希腊城市图里伊，并在那里留下驻军；这件事是罗马与塔兰托冲突、进而招来皮洛士的起因之一。

  前 280 年罗马军队在赫拉克利亚败于皮洛士，他奉派去交涉赎回战俘。据普鲁塔克，皮洛士知道他清贫而有威望，先拿黄金相赠，被他拒绝；第二天又让人把一头大象藏在帷幕后面，突然在他头顶吼叫，他不为所动。皮洛士允许战俘回罗马过节，条件是和议不成就回来，后来这些人如数返回。前 278 年他再任执政官，据说皮洛士的医生写信给他，表示愿意收钱毒死国王；他把信转给皮洛士，皮洛士无偿释放了罗马战俘。这些故事的细节各家说法不同，带有道德训诫的色彩。

  前 275 年他任监察官，把做过两任执政官的科尔内利乌斯·鲁菲努斯逐出元老院，理由是此人家里有十磅银器。据说他死时没有留下财产，女儿的嫁妆由元老院置办。后世的罗马作家常把他与库里乌斯·登塔图斯并举，作为俭朴廉洁的典型；但丁在《神曲·炼狱篇》里也提到他。
sources: []
