name: 许尔堪二世
aliases: []
role: 大祭司
summary: 亚历山大·雅纳的长子，与弟争位引来罗马介入，后被希律处死。
body: |-
  亚历山大·雅纳和撒罗米·亚历山德拉的长子，生年没有可靠记载。母亲在位时（公元前 76—前 67 年）他任大祭司。母亲死后他继位，不久在耶利哥附近败给弟弟阿里斯托布鲁斯二世，让出王位和大祭司之职。约瑟夫斯说他性情安静，不好争竞。

  以土买人安提帕特劝他投奔拿巴提王亚哩达，借兵回来把阿里斯托布鲁斯围在圣殿。前 63 年庞培支持许尔堪，攻下圣殿后恢复他的大祭司职位，但不给他王号。此后实权逐渐落到安提帕特和他的儿子法撒勒、希律手里；尤利乌斯·恺撒在前 47 年确认许尔堪为大祭司和“族长”。

  前 40 年帕提亚人入侵，立阿里斯托布鲁斯的儿子安提柯为王。许尔堪被俘，耳朵被弄残，因为按律法身体有残疾的人不能作大祭司；约瑟夫斯两部书对此说法不同，一说割去，一说咬掉。他被带到帕提亚，住在巴比伦的犹太人中间，受到敬重。希律作王以后请他回耶路撒冷；前 30 年，希律以他私通拿巴提王的罪名把他处死。约瑟夫斯说他当时已年过八十，这个数字与他父母的年岁不易相合。
sources: []
recalled:
  - 约瑟夫斯《犹太古史》卷 14、卷 15 第 2 章与第 6 章
  - 约瑟夫斯《犹太战记》卷 1
