name: 安条克三世
aliases: [ 安条克大帝 ]
role: 塞琉古国王
summary: 塞琉古国王，东征恢复对东部的宗主权，号称“大王”；后在马格尼西亚败于罗马。
body: |-
  安条克三世是塞琉古二世之子，约生于公元前 242 年。前 223 年兄长塞琉古三世在小亚细亚遇害，他继位时不到二十岁。即位之初，米底总督摩隆叛乱，小亚细亚由堂兄阿凯奥斯割据。他在前 220 年平定摩隆，随即发动第四次叙利亚战争，前 217 年在拉菲亚败于托勒密四世；此后转攻阿凯奥斯，前 213 年攻下萨第斯将其处死。

  前 212 年起他向东用兵。据波利比乌斯，他攻入帕提亚，占领百门城，越山进入希尔卡尼亚，迫使安息王订约；又在阿里乌斯河击败巴克特里亚国王欧西德莫斯，围攻巴克特拉后与之议和，承认其王号；再越过兴都库什山，与印度王公索法伽塞努斯重申旧好，得到战象后经阿拉霍西亚、卡尔马尼亚西返。前 205 年前后回到两河流域，此后他采用“大王”称号。托勒密四世死后，他再攻南叙利亚，在帕尼翁获胜（约前 200 年，一说前 198 年），终于取得该地，后把女儿克娄巴特拉嫁给托勒密五世。

  他进入色雷斯，又收留流亡的汉尼拔，与罗马的关系日趋紧张。前 192 年他应埃托利亚同盟之邀渡海进入希腊，次年在温泉关战败，退回亚洲；前 190 年冬在马格尼西亚再败。前 188 年订立阿帕米亚和约，放弃托罗斯山以西的领土，交出战象和舰队，分期支付巨额赔款。前 187 年他在埃利迈斯劫取一座神庙的财物时被当地人杀死，子塞琉古四世继位。
sources:
  - 波利比乌斯《历史》第 5 卷第 40—87 章，第 7 卷第 15—18 章、第 8 卷第 15—21 章，第 10 卷第 27—31、49 章，第 11 卷第 34 章，第 21 卷第 42—43 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/home.html
  - 阿庇安《叙利亚战争》第 1—39 章 https://www.livius.org/sources/content/appian/appian-the-syrian-wars/
  - 英文维基百科“Antiochus III the Great”条（生卒与在位年月） https://en.wikipedia.org/wiki/Antiochus_III_the_Great
recalled:
  - 李维《罗马史》第 35—38 卷
  - 狄奥多罗斯《历史丛书》第 28 卷第 3 章、第 29 卷第 15 章；查士丁《腓力史摘要》第 32 卷第 2 章（去世）
