name: 咸丰帝
aliases: [奕詝, 清文宗]
role: 清朝第九位皇帝
summary: 道光帝之子，在位期间太平天国起义爆发，英法联军攻入北京，他逃往热河病死。
body: |-
  奕詝是道光帝的第四个儿子，母亲是孝全成皇后。据说道光帝在他与六弟奕訢之间犹豫很久，最后选择了他。道光三十年（1850 年）道光帝去世，奕詝即位，次年改元咸丰。

  咸丰帝即位时二十岁，起初也想有所作为，罢免了道光朝的权臣穆彰阿，起用林则徐等人。但即位不久，咸丰元年（1851 年）洪秀全在广西金田起事，太平军迅速发展，咸丰三年（1853 年）攻占南京，定为天京（另见“太平天国”条）。清朝的八旗、绿营屡战屡败，咸丰帝被迫允许曾国藩等汉族官员在地方兴办团练，湘军由此兴起。为了筹措军费，朝廷开征厘金，铸造大钱，发行官票。

  咸丰六年（1856 年）英法借口“亚罗号事件”和“马神甫事件”发动第二次鸦片战争。咸丰十年（1860 年）英法联军攻陷天津、进逼北京，咸丰帝以“北狩”为名逃往热河，留下弟弟恭亲王奕訢与英法议和。英法联军攻入北京，劫掠并焚毁了圆明园，清朝被迫签订《北京条约》（另见“第二次鸦片战争”条）。同年俄国借调停之名，迫使清朝签订中俄《北京条约》，割去乌苏里江以东的大片土地。

  咸丰帝在热河没有回京，咸丰十一年（1861 年）七月在避暑山庄病逝，年三十一岁。临终前他立唯一的儿子、六岁的载淳为皇太子，任命肃顺等八人为“赞襄政务王大臣”辅政。不久慈禧太后、慈安太后与恭亲王发动政变，除掉了八大臣（另见“辛酉政变”条）。
sources: []
recalled:
  - 《清文宗实录》
  - 《清史稿·文宗本纪》
