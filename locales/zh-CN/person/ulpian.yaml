name: 乌尔比安
aliases: [多米提乌斯·乌尔比安努斯, 乌尔庇安]
role: 法学家、禁卫军长官
summary: 罗马法学家，《学说汇纂》约三分之一摘自他的著作。
body: |-
  乌尔比安是腓尼基的推罗人，这是他自己在著作里说的，生年不详。塞普提米乌斯·塞维鲁在位时，他在法学家帕皮尼安手下做助手。他的著作大多写于卡拉卡拉一朝，主要有注释裁判官告示的八十一卷和注释萨宾《市民法》的五十一卷，把此前几百年的法学见解整理得条理分明。

  222 年亚历山大·塞维鲁即位，皇帝年幼，由母亲尤利娅·玛麦娅主政。乌尔比安先管粮食供应，同年升任禁卫军长官，是朝中最有权的大臣。不久禁卫军哗变，他逃进宫里，当着皇帝母子的面被杀。卡西乌斯·狄奥的叙述过去被理解为事在 228 年，埃及出土的纸草文书显示继任者 224 年已经在任，现在一般定在 223 年。

  六世纪查士丁尼编《学说汇纂》，摘自他的文字约占全书三分之一，比任何一位法学家都多。“正义是使每个人各得其所应得的恒久不变的意愿”，以及公法、私法的区分，都出自书中所引他的话。
sources: []
recalled:
  - 查士丁尼《学说汇纂》卷 1 第 1 章、卷 50 第 15 章
  - 卡西乌斯·狄奥《罗马史》卷 80 第 1—2 章
  - 奥克西林库斯纸草第 2565 号
