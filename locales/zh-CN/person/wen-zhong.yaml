name: 文种
aliases: [大夫种, 文子禽]
role: 越国大夫
summary: 越国大夫，在会稽之败后为勾践向吴求和，辅佐勾践灭吴，事成后被勾践赐剑自杀。
body: |-
  文种是越国的大夫，《史记》称他为“大夫种”，生卒年不详，汉代以后的书说他是楚国郢人，字子禽。

  公元前 494 年越军在夫椒大败，勾践退守会稽山。据《史记·越王勾践世家》和《国语·越语》，文种奉命到吴国求和，先用美女财宝买通太宰伯嚭，再由伯嚭向夫差进言，夫差不顾伍子胥的反对，接受了越国的求和。此后勾践把国政交给文种，自己与范蠡等人谋划复仇。

  越灭吴后，范蠡离开越国，写信劝文种也及早离开。文种看信后称病不再上朝。有人进谗言说文种将要作乱，勾践于是赐给他一把剑，说：“子教寡人伐吴七术，寡人用其三而败吴，其四在子，子为我从先王试之。”文种于是自杀。
sources: []
recalled:
  - 《史记·越王勾践世家》
  - 《国语·越语上》
