name: 普拉克西特列斯
aliases: [普拉克西特利斯]
role: 雕塑家
summary: 雅典雕塑家，所作《克尼多斯的阿佛洛狄忒》是最早的大型女性裸像。
body: |-
  雅典人，生卒年不详。老普林尼把他的盛年放在第 104 届奥林匹亚纪（公元前 364 年至前 361 年），现代学者一般认为他活跃于约前 370 年至前 330 年。他可能是雕塑家老刻菲索多托斯之子，后者作有《和平女神抱着财神》；他自己的两个儿子小刻菲索多托斯和提马科斯也是雕塑家。他主要用大理石，也作青铜像。据老普林尼，他说自己最满意的作品是经画家尼基阿斯上色的那些。

  他最有名的作品是《克尼多斯的阿佛洛狄忒》，表现女神入浴前放下衣服的一刻，是希腊雕塑里第一尊真人大小的全裸女神像。老普林尼说，他同时作了着衣和裸体的两尊，科斯人先挑，选了着衣的，克尼多斯人买下另一尊，结果许多人专为看它而航海前去；比提尼亚国王尼科美德斯愿意替克尼多斯还清全部公债来交换，被拒绝了。原作已失，有大量罗马时代的仿制品存世。

  其他见于记载并有仿制品可以对照的作品有《杀蜥蜴的阿波罗》《休息的萨提尔》《斟酒的萨提尔》，以及放在彼奥提亚小城塞斯皮埃的《厄洛斯》。1877 年，奥林匹亚的赫拉神庙遗址出土了一尊《赫尔墨斯抱着幼年的狄奥尼索斯》，位置与公元 2 世纪保萨尼亚斯所记“普拉克西特列斯的作品”相合。它是他的原作，还是希腊化时代或罗马时代的作品，至今有争议。

  他的人物姿态松弛，身体重心偏向一侧而成曲线，神祇显得年轻而近人，与前一个世纪菲迪亚斯的庄严风格不同。古代作家说名妓芙丽涅是他的情人和模特，属于轶事。
sources: []
recalled:
  - 老普林尼《博物志》卷三十四第 69—70 节、卷三十六第 20—23 节
  - 保萨尼亚斯《希腊志》卷一第 20 章、卷五第 17 章
