name: 刘琨
aliases: [刘越石]
role: 并州刺史、司空
summary: 西晋末年的并州刺史，在晋阳孤军抗击刘渊、石勒近十年，后为段匹磾所杀。
body: |-
  刘琨字越石，中山魏昌人。他年轻时与兄长刘舆都以文才知名，同在贾谧的“二十四友”之列。他曾与祖逖同任司州主簿，二人同床而卧，半夜听到鸡叫就起身舞剑，“闻鸡起舞”的典故出自《晋书·祖逖传》。八王之乱中，他先后在几位藩王手下任职。

  光熙元年（公元 306 年），他被任命为并州刺史。这时并州大部已被刘渊占据，他招募了千余人，一路转战，次年到达晋阳。据《晋书》本传，城中官署焚毁，遍地荆棘，他招抚流亡，才重新聚集起人口。此后他以晋阳为据点，与刘渊、刘聪、石勒相持，并与鲜卑拓跋部的首领拓跋猗卢结为兄弟，借他的兵力作战，又为他向朝廷请得代公、代王的封号。

  建兴四年（316 年）拓跋猗卢死，部落内乱，他失去外援，同年被石勒打败，丢了并州，投奔幽州刺史、鲜卑人段匹磾，二人结盟共同拥戴在江南的司马睿。后来段氏内讧，段匹磾怀疑他会做内应，把他拘禁。太兴元年（318 年）五月他被缢杀，时年四十八。他留下的诗不多，《扶风歌》《重赠卢谌》等篇慷慨悲凉。
sources: []
recalled:
  - 《晋书·刘琨传》
  - 《晋书·祖逖传》
  - 《资治通鉴》卷八十六至九十
