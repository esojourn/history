name: 包拯
aliases: [包公, 包青天, 包孝肃, 包龙图]
role: 北宋大臣，权知开封府
summary: 北宋大臣，以清廉、刚直著称，曾任开封知府，后世尊称“包公”“包青天”。
body: |-
  包拯是庐州合肥人，生于咸平二年（公元 999 年）。天圣五年（1027 年）他考中进士，因为父母年老，辞去官职回家奉养，直到父母去世、守丧期满，才出来做官。他任端州知州时，端州出产名砚，按惯例要向朝廷进贡，以前的知州往往多征数十倍，用来结交权贵。据《宋史》本传，包拯只按贡数征收，任满离开时，没有带走一块砚台。

  此后他历任监察御史、知谏院等职，多次上书弹劾权贵，其中包括宋仁宗宠妃张贵妃的伯父张尧佐，迫使仁宗收回对张尧佐的任命。嘉祐元年（1056 年）他权知开封府，在任一年多。据《宋史》本传，过去打官司的人不能直接到府衙大堂递交状纸，他打开正门，让告状的人直接到堂前陈述；他执法严厉，不徇私情，京城里有“关节不到，有阎罗包老”的说法。他担任过龙图阁直学士，因此又被称为“包龙图”。

  嘉祐六年（1061 年）他升任枢密副使，次年在任上去世，谥“孝肃”。他留下家训，后代子孙做官有贪赃枉法的，不许回老家，死后不许葬入家族墓地。包拯在世时已有清廉刚正的名声；元明以后的戏曲、小说中，包公成为审案如神、铡杀权贵的“包青天”，这些故事多是后人的创作，与史实相去甚远。
sources: []
recalled:
  - 《宋史·包拯传》
  - 吴奎《宋故枢密副使孝肃包公墓志铭》
  - 《包拯集》
