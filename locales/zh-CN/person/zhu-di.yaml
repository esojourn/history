name: 永乐帝
aliases: [朱棣, 明成祖, 明太宗, 燕王]
role: 明朝第三代皇帝
summary: 朱元璋第四子，以“靖难”夺取帝位，迁都北京，派郑和下西洋，五次亲征漠北。
body: |-
  朱棣是朱元璋的第四个儿子，生于元至正二十年（1360 年），当时朱元璋正在应天（今南京）与群雄争战。洪武三年（1370 年）他被封为燕王，洪武十三年（1380 年）就藩北平，也就是元朝的大都。此后他多次率军出塞征讨北元残部，在北方军中建立了威望。

  建文帝即位后推行削藩，朱棣于建文元年（1399 年）起兵，经过三年的战争，于建文四年（1402 年）攻入南京，即皇帝位，次年改元永乐（另见“靖难之役”条）。他即位后杀戮建文帝的旧臣，方孝孺被灭族，牵连者众多；又恢复锦衣卫的权力，设立东厂，任用宦官刺探臣民，此后宦官的权力逐渐扩大。他也继续削减藩王的兵权，此后明朝的藩王只能享受俸禄，不再掌握军队。

  永乐年间是明朝国力最强盛的时期之一。他派郑和率领船队出使西洋（另见“郑和下西洋”条）；派兵进入安南，在那里设置交趾布政使司；在东北设奴儿干都司，招抚女真各部；命解缙等人编纂《永乐大典》。他疏浚会通河，恢复了大运河的南北漕运，为迁都创造条件，永乐十九年（1421 年）正式以北京为京师（另见“迁都北京”条）。

  为了解除北方蒙古鞑靼、瓦剌的威胁，朱棣先后五次亲率大军出塞征讨。永乐二十二年（1424 年）第五次北征回师途中，他在榆木川（今内蒙古多伦一带）病逝，终年六十五岁，葬在北京昌平的长陵。朱棣的庙号原为太宗，嘉靖十七年（1538 年）改为成祖。
sources: []
recalled:
  - 《明史·成祖本纪》
  - 《明太宗实录》
