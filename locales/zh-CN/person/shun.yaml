name: 舜
aliases: [重华, 有虞氏, 虞舜, 帝舜]
role: 传说中的五帝之五
summary: 传说中的五帝之五，号有虞氏，以孝闻名，受尧禅让为天子，后又禅位于禹。
body: |-
  舜是传说时代的人物，事迹主要见于《尚书·尧典》（今本分出的《舜典》）和《史记·五帝本纪》。据《史记》，舜名重华，父亲瞽叟，母亲早死，后母生弟象。瞽叟偏爱后妻之子，屡次想杀舜，舜仍然孝顺父母、友爱弟弟。他曾在历山耕种、雷泽捕鱼、河滨制陶，所到之处人们都愿意追随，“一年而所居成聚，二年成邑，三年成都”。

  舜二十岁时以孝闻名，三十岁时被四岳推举给尧。尧把女儿娥皇、女英嫁给他，又让他总领百官、接待四方宾客，历试三年后命他摄政。据《尚书》和《史记》，舜摄政期间巡行四方，统一律度量衡；流放共工于幽陵、放驩兜于崇山、迁三苗于三危、殛鲧于羽山，称为“四罪”，又举用禹、皋陶、契、后稷、伯益等人分掌各项职事。

  尧死后，舜让位给尧的儿子丹朱，避居南河之南，但诸侯朝觐、诉讼的人都去找舜，于是舜即天子位。后世以蒲坂（今山西永济）为舜都。舜因禹治水有功，事先向上天推荐禹为继承人。《史记》说舜南巡，死于苍梧之野，葬于江南九疑。

  与尧的情况一样，古书对舜即位另有记载：《竹书纪年》佚文说舜曾囚禁尧，《韩非子》说“舜逼尧”。儒家把舜奉为孝道和德治的典范，《孟子》中有许多讨论舜的篇章。
sources: []
recalled:
  - 《尚书·尧典》（含《舜典》）
  - 《史记·五帝本纪》
  - 《孟子·万章上》
  - 《竹书纪年》（佚文）
