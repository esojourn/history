name: 魏文侯
aliases: [魏斯]
role: 魏国国君
summary: 战国初年魏国国君，任用李悝、吴起、西门豹，使魏国称强一时。
body: |-
  魏文侯名斯，是晋国卿族魏氏的首领，生年不详。他的在位年代，《史记·魏世家》的记载有误，今人据《竹书纪年》订正为公元前 445 年至前 396 年。公元前 403 年，周威烈王正式承认魏、赵、韩三家为诸侯，魏斯由此成为魏国的第一代国君。

  文侯以礼贤下士著称。据《史记》，他拜孔子的弟子子夏为师，以田子方为友，每次经过隐士段干木的住处，都要扶着车前横木致敬，秦国因此一度不敢攻魏。《资治通鉴》卷一还记载他与群臣饮酒正欢，因与虞人约好打猎，冒雨前往践约的故事。

  文侯任用了一批能人：李悝主持变法，推行“尽地力之教”和平籴法；吴起为将，攻取秦国的河西之地，并任西河守；西门豹治理邺地，破除“河伯娶妇”的迷信，兴修水利；乐羊率军攻灭了中山国。魏国由此成为战国初期最强大的国家。文侯死于公元前 396 年，儿子武侯继位。

  据《史记·魏世家》，文侯问李克立谁为相，李克提出“居视其所亲，富视其所与，达视其所举，穷视其所不为，贫视其所不取”五条标准，文侯据此以魏成子为相。这段问答常被后世引用。

  魏文侯也是《资治通鉴》记述的第一位君主，司马光记下了他的多件言行。
sources: []
recalled:
  - 《史记·魏世家》
  - 《资治通鉴》卷一
  - 《竹书纪年》（佚文）
