name: 埃米利乌斯·保卢斯
aliases: [卢基乌斯·埃米利乌斯·保卢斯, 保卢斯, 马其顿征服者保卢斯]
role: 罗马执政官
summary: 罗马统帅，在彼得那击败珀尔修斯，终结马其顿王国；小西庇阿的生父。
body: |-
  卢基乌斯·埃米利乌斯·保卢斯，罗马贵族，约生于公元前 229 年。父亲同名，是前 216 年在坎尼阵亡的执政官。他的姐妹埃米利娅嫁给大西庇阿。

  前 191 年他任大法官，管辖远西班牙，与卢西塔尼亚人作战，先败后胜。前 182 年他第一次任执政官，次年征服利古里亚的因高尼人。此后十多年他没有再当选，专心教养儿子，据普鲁塔克，他为孩子们请了希腊的文法、哲学、修辞教师。他与第一任妻子所生的两个儿子都过继给别家：长子入费边家族，次子由大西庇阿的儿子收养，即后来毁灭迦太基的小西庇阿。

  第三次马其顿战争打了三年没有进展。前 168 年他年约六十，再次当选执政官，受命对付马其顿国王珀尔修斯。他整顿军纪，派人翻山绕过奥林匹斯山的隘口，迫使珀尔修斯后撤到彼得那。战前一夜发生月食，据李维，军官苏尔皮基乌斯·加卢斯事先向士兵作了解释。会战中马其顿方阵起初推进凌厉，进入不平的地面后出现缺口，罗马人分成小队插入，约一个小时决出胜负。珀尔修斯逃到萨莫色雷斯岛后投降。

  战后马其顿王国被废，分为四个共和国。他巡游希腊各地，在德尔斐把珀尔修斯预备的纪念柱改立自己的像。奉元老院之命，他让军队在同一天洗劫了曾支持珀尔修斯的伊庇鲁斯七十座城镇，据波利比乌斯，十五万人被卖为奴隶。运回的战利品极多，罗马公民此后一百多年不再缴纳直接税；他自己只留下了马其顿王室的藏书。凯旋式持续三天，而他与第二任妻子所生的两个幼子，一个死在凯旋式前五天，一个死在其后三天。前 164 年他任监察官，前 160 年去世。
