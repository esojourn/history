name: 王振
aliases: []
role: 明英宗时的司礼监太监
summary: 明英宗宠信的宦官，专擅朝政，怂恿英宗亲征瓦剌，在土木之变中被杀。
body: |-
  王振是蔚州（今河北蔚县）人，生年不详。据说他原是教书先生，后来自宫入宫，在内书堂教小宦官读书，又侍奉太子朱祁镇，深得信任。宣德十年（1435 年）朱祁镇即位，王振掌管司礼监。太皇太后张氏在世时对他多有约束，张氏和“三杨”相继去世后，他逐渐专擅朝政，朝臣多依附于他，不肯依附的人常遭陷害。据《明史》，他还把朱元璋立在宫门、禁止宦官干政的铁牌撤去。

  正统十四年（1449 年）瓦剌也先大举入侵，王振怂恿英宗亲征，大臣们极力劝阻无效。大军行至大同，得知前线失利，王振又主张回师；据说他起初想让英宗经过他的家乡蔚州，后来又怕大军踩坏庄稼而改道，延误了时间。八月明军在土木堡被瓦剌追及，全军溃败，王振在乱军中被杀，一说是护卫将军樊忠用铁锤将他击杀（另见“土木之变”条）。事后朝臣在朝堂上要求追究他的罪责，他的党羽马顺被群臣当场打死，王振的家族被抄没。英宗复位后却为他招魂安葬，立祠祭祀。
sources: []
recalled:
  - 《明史·王振传》
  - 《明英宗实录》
