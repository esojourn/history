name: 徐光启
aliases: [保禄, 玄扈, 文定]
role: 科学家、礼部尚书兼内阁大学士
summary: 明末科学家、天主教徒，合译《几何原本》，主持编撰历书，著《农政全书》。
body: |-
  徐光启是松江府上海县人，早年在家乡教书，多次参加科举不中。万历二十八年（1600 年）他在南京见到利玛窦，对西方的天文、数学很感兴趣，万历三十一年（1603 年）受洗加入天主教，教名保禄。次年他考中进士，入翰林院，此后在北京与利玛窦合作，由利玛窦口述、他笔录润色，翻译了欧几里得《几何原本》的前六卷，万历三十五年（1607 年）刊行。“几何”“点”“线”“面”“平行线”等数学名词就是在这次翻译中确定的。

  徐光启关心农业和民生，曾在天津开垦屯田，试种水稻，又在家乡试种从海外传入的甘薯，写了《甘薯疏》。他广泛搜集历代农书和自己的试验经验，编成《农政全书》六十卷，在他去世后由陈子龙等人整理刊行。

  萨尔浒之战后，他主张训练新军、学习和引进西洋火炮，曾奉命在通州练兵，但因经费不足、受人掣肘而成效有限。崇祯二年（1629 年）他以礼部侍郎主持修订历法，设立历局，召用龙华民、邓玉函、汤若望等传教士，编撰《崇祯历书》，到他去世时已大体完成，这部历书后来经汤若望删改，成为清朝的《时宪历》。

  崇祯五年（1632 年）徐光启以礼部尚书兼东阁大学士入阁，次年在北京去世，谥“文定”。他的墓在上海徐家汇，徐家汇一带因徐氏后人聚居而得名。
sources: []
recalled:
  - 《明史·徐光启传》
  - 徐光启《农政全书》
  - 《几何原本》徐光启序
