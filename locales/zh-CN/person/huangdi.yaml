name: 黄帝
aliases: [轩辕, 公孙轩辕, 有熊氏]
role: 传说中的五帝之首
summary: 《史记》所记五帝之首，相传战胜炎帝与蚩尤，被诸侯尊为天子，后世奉为华夏始祖。
body: |-
  黄帝是传说时代的人物，下面的事迹主要据《史记·五帝本纪》。司马迁本人也说，百家言黄帝，“其文不雅驯”，他只是选取其中比较可信的写进书里。据此篇，黄帝是少典之子，姓公孙，名轩辕。

  相传轩辕的时候神农氏衰微，诸侯相互侵伐，轩辕于是练兵征讨不来朝贡的诸侯。他先与炎帝战于阪泉之野，三战而胜；蚩尤作乱，他又征调诸侯的军队，与蚩尤战于涿鹿之野，擒杀蚩尤。此后诸侯尊轩辕为天子，代神农氏，号为黄帝。《史记》说他“迁徙往来无常处，以师兵为营卫”，曾邑于涿鹿之阿，又东至于海，西至于空桐，南至于江，北逐荤粥。

  《史记》说黄帝有二十五子，其中得姓的有十四人；正妃是西陵氏之女嫘祖。黄帝死后葬于桥山，由孙子高阳继位，就是颛顼。按《史记》的世系，此后的帝喾、尧、舜以及夏、商、周三代的始祖都是黄帝的后代。这一排列反映的是战国秦汉人构建的统一古史体系，并非同时代的记录。

  战国以后，许多技艺、制度被归到黄帝名下，医书《黄帝内经》等也托名于他；汉初流行的“黄老之学”，把他与老子并称。他在后世被奉为华夏的始祖，今陕西黄陵县有黄帝陵，历代在此祭祀。
sources: []
recalled:
  - 《史记·五帝本纪》
  - 《国语·晋语四》
  - 《大戴礼记·五帝德》
