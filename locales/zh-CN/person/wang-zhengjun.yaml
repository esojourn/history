name: 王政君
aliases: [孝元皇后, 元后, 新室文母太皇太后]
role: 皇后、太皇太后
summary: 汉元帝的皇后、成帝之母，历四朝居后位六十余年，王氏外戚和侄子王莽由她而起。
body: |-
  据《汉书·元后传》，王政君是魏郡元城人，父亲王禁做过廷尉史。她十八岁入宫为宫女。当时太子刘奭宠爱的姬妾去世，太子悲伤成疾，皇后挑选了五名宫女供他选择，政君在其中，被送入太子宫。甘露三年（公元前 51 年）她生下刘骜。元帝即位后她被立为皇后，但并不受宠。

  竟宁元年（前 33 年）成帝即位，她成为皇太后，她的兄弟王凤等人相继担任大司马，执掌朝政。成帝死后，哀帝的祖母和母亲两家外戚得势，她让王莽辞官避让。元寿二年（前 1 年）哀帝去世，没有儿子，她当天赶到未央宫收取皇帝的玺印，召回王莽主持丧事，立九岁的平帝，自己临朝，把政事交给王莽。

  此后王莽一步步由安汉公、摄皇帝而称帝。本传说，王莽派王舜来索要传国玺，她怒骂王氏兄弟世受汉恩却乘机夺国，最后把玺扔在地上交给王舜。王莽建立新朝后，把她的称号改为“新室文母太皇太后”，并拆毁元帝的庙。她在始建国五年（公元 13 年）去世，本传说终年八十四岁，与元帝合葬渭陵。传末引班彪的话说，她历经汉朝四代，做了六十余年的国母，王氏兄弟相继掌权，终于导致王莽篡位。
sources: []
recalled:
  - 《汉书·元后传》
  - 《汉书·王莽传》
