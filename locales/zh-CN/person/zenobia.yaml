name: 泽诺比娅
aliases: [芝诺比娅, 季诺碧亚, 塞普提米娅·泽诺比娅]
role: 帕尔米拉女王
summary: 帕尔米拉的女王，一度占有叙利亚、埃及和小亚细亚，被奥勒良击败。
body: |-
  泽诺比娅约生于公元 240 年，是叙利亚沙漠商城帕尔米拉的贵族女子，本地语名字叫巴特扎拜。她嫁给帕尔米拉的首领奥登纳图斯，是他的第二个妻子。奥登纳图斯在罗马皇帝瓦勒良被俘后击退波斯人，罗马委他总管东方。267 年他和长子在一次宴会上被亲族刺杀，泽诺比娅立自己年幼的儿子瓦巴拉图斯继位，由她摄政。《罗马帝王纪》暗示她参与了谋杀，没有别的佐证。

  270 年罗马正忙于应付多瑙河的入侵，她的将军扎布达斯出兵占领阿拉伯行省，又攻下埃及，另一路推进到小亚细亚中部。起初帕尔米拉的钱币还把罗马皇帝奥勒良与瓦巴拉图斯并列；272 年母子二人径自用了“奥古斯都”和“奥古斯塔”的称号。她的宫廷里有希腊哲学家、修辞学家朗吉努斯做顾问。《罗马帝王纪》说她自称是克娄巴特拉的后裔，通晓多种语言，常骑马随军。

  272 年奥勒良东征，在安条克附近和埃梅萨两次击败帕尔米拉的重装骑兵，随后围城。泽诺比娅骑骆驼出城，想到波斯求援，在幼发拉底河边被追上擒获。受审时她把责任推给身边的谋臣，朗吉努斯等人被处死。帕尔米拉投降后不久又反，273 年被奥勒良洗劫，从此一蹶不振。

  她的结局有两种说法。佐西莫斯说她在押往罗马的途中死去；《罗马帝王纪》等拉丁文史书说，274 年奥勒良举行凯旋式，她戴着金锁链走在车前，以后得到提布尔附近的一处庄园，在那里终老。因为罗马以东的叙利亚历来归“两河与波斯”泳道，她也放在这里。
sources: []
recalled:
  - 《罗马帝王纪·三十僭主传》第 30 章、《奥勒良传》第 22—34 章
  - 佐西莫斯《新历史》卷 1 第 39—59 章
  - 帕尔米拉出土泽诺比娅与瓦巴拉图斯铭文、钱币
