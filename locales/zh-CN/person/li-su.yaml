name: 李愬
aliases: [李元直, 凉国公]
role: 唐邓节度使
summary: 李晟之子，讨伐淮西时雪夜奇袭蔡州，生擒吴元济。
body: |-
  李愬字元直，是西平郡王李晟的儿子，大历八年（公元 773 年）生，以门荫入仕。元和十一年（816 年）讨伐淮西的唐军屡次失利，他主动请缨，被任命为唐、随、邓节度使。他到任后故意示弱，表示自己只负责安抚，使淮西守军放松戒备，同时厚待俘虏和降将，收用了李祐、丁士良、吴秀琳等淮西将领，从他们口中了解到蔡州的虚实。

  元和十二年（817 年）十月，趁淮西主力被裴度督率的各路唐军牵制在洄曲一带，他在风雪之夜率九千人（据《资治通鉴》）从文城栅出发，冒雪连夜行军，夜半到达蔡州城下，攀城而入，次日擒获吴元济（另见“平淮西”条）。他因功封凉国公，此后历任山南东道、武宁、魏博等镇节度使。长庆元年（821 年）成德、幽州再次叛乱，他在魏博病重，同年去世，年四十九。
sources: []
recalled:
  - 《旧唐书·李愬传》
  - 《新唐书·李愬传》
  - 《资治通鉴》卷二百三十九至二百四十
