name: 李广利
aliases: [贰师将军, 海西侯]
role: 贰师将军
summary: 汉武帝宠姬李夫人之兄，两次远征大宛取得良马，后兵败投降匈奴被杀。
body: |-
  李广利是中山人，妹妹李夫人受武帝宠爱，兄长李延年以音乐得幸。据《史记·大宛列传》，武帝听说大宛的贰师城有良马，派使者带着金币去换，大宛不给，还杀了汉使。太初元年（公元前 104 年），武帝任命李广利为贰师将军，率属国骑兵和各郡国征发的数万人西征。沿途小国闭城不给粮食，军队到达大宛东境时只剩几千人，攻城不下，退回敦煌。

  武帝大怒，派人拦在玉门关，不许败军入关，随后增调六万人和大量牛马粮草再次出征。汉军围攻大宛都城四十余日，断绝其水源，大宛贵族杀死国王求和，献出马匹。汉军挑选良马数十匹、中等以下的马三千余匹，立亲汉的贵族为王后撤回。太初四年李广利回到长安，受封海西侯。

  此后他多次领兵出击匈奴。征和三年（前 90 年）他率七万人出五原。出征期间，他与丞相刘屈氂商议拥立妹妹所生的昌邑王为太子一事被人告发，刘屈氂被腰斩，他的妻儿也被收捕。他得到消息后想立功赎罪，冒险深入，结果兵败，投降匈奴。据《汉书·匈奴传》，单于把女儿嫁给他，一年多后他因受卫律忌恨进谗而被杀。
sources: []
recalled:
  - 《史记·大宛列传》
  - 《汉书·张骞李广利传》
  - 《汉书·匈奴传上》
