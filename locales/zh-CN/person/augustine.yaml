name: 奥古斯丁
aliases:
  - 希坡的奥古斯丁
  - 奥斯定
role: 希坡主教
summary: 北非希坡的主教，著《忏悔录》《上帝之城》，其恩典、教会的教义影响西方教会千余年。
body: |-
  奥古斯丁于公元 354 年 11 月 13 日生在北非努米底亚的小城塔迦斯特。父亲帕特里修是小地主，不是基督徒；母亲摩尼加是虔诚的信徒。父母节衣缩食供他读书，他十六七岁到迦太基学修辞。据他在《忏悔录》里的自述，他在迦太基与一个女子同居，372 年生了儿子阿德奥达图；十九岁读了西塞罗的《荷尔顿西乌斯》，开始追求智慧，却嫌圣经文笔粗陋，转而加入摩尼教，作了九年听众。他自己说小时候厌恶希腊文，始终没有学好。

  他先后在塔迦斯特和迦太基教书，383 年去罗马，第二年得到米兰的修辞学教席。在米兰他去听主教安波罗修讲道，起初只为欣赏口才，后来渐渐被内容打动；又读了新柏拉图派的书，摆脱了摩尼教。《忏悔录》卷 8 记载，386 年夏天，一位同乡官员向他讲起埃及修士安东尼的事，他深感羞愧，独自到花园里痛哭，听见邻家孩子反复唱“拿起来读”，就翻开保罗书信，读到《罗马书》13:13–14，心里的疑云顿时消散。《历史的轨迹》第五章详细讲了这一段。387 年复活节前夜，他由安波罗修施洗。这年母亲在归途中死于奥斯提亚。

  公元 388 年他回到非洲，在塔迦斯特与朋友过修道生活。391 年他到希坡，被会众强留下来立为长老，395 年前后成为希坡主教，直到去世。他让神职人员同住，过共同生活。

  他的许多著作是在争论中写成的。多纳徒派认为逼迫中交出圣经的主教所行的圣礼无效，在北非另立教会，人数很多；奥古斯丁主张圣礼的效力出于基督，不在于施行者是否圣洁，大公教会只有一个。411 年迦太基会议判多纳徒派败诉，他起初反对用强制手段，后来引《路加福音》14:23“勉强人进来”为官府的压制辩护，《历史的轨迹》第六章指出这种看法给后世带来的恶果。从 412 年起，他又写了十几种书反驳伯拉纠，主张人自亚当以来都生在罪中，得救全出于神的恩典。

  公元 410 年罗马城被西哥特人攻破，异教徒归咎于基督教，他为此用十三年写成二十二卷《上帝之城》。他另有《论三位一体》十五卷，以及大量讲章和书信。430 年 8 月 28 日，汪达尔人围攻希坡期间，他在城中病逝。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第六章“教会渐趋腐化” https://wellsofgrace.com/books/spiritual/2000years/html/chapter07.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
