name: 杜佑
aliases: [杜君卿]
role: 宰相、史学家
summary: 唐德宗至宪宗时的宰相，编成典章制度通史《通典》二百卷，杜牧的祖父。
body: |-
  杜佑字君卿，京兆万年人，开元二十三年（公元 735 年）生，以门荫入仕，长期在地方任职，熟悉财政事务。贞元六年（790 年）起他任淮南节度使十余年，治所在扬州，兴修水利，开垦田地。贞元十九年（803 年）入朝任宰相，历经德宗、顺宗、宪宗三朝。

  他从大历年间开始编撰《通典》，用了三十多年，贞元十七年（801 年）在淮南任上献给朝廷。全书二百卷，分食货、选举、职官、礼、乐、兵、刑、州郡、边防九门，记述上古到唐天宝年间的典章制度沿革，把食货放在第一，可见他对经济的重视。这是中国第一部专门记述典章制度的通史，后来与宋代郑樵的《通志》、元代马端临的《文献通考》合称“三通”。

  元和七年（812 年）他以太保致仕，同年去世，年七十八。他的孙子就是诗人杜牧。
sources: []
recalled:
  - 《旧唐书·杜佑传》
  - 《新唐书·杜佑传》
  - 杜佑《通典》自序
