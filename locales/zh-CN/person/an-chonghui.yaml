name: 安重诲
aliases: []
role: 后唐枢密使
summary: 后唐明宗的心腹和枢密使，专权多年，激起两川叛乱，931 年被杀。
body: |-
  安重诲是应州人，早年跟随李嗣源，深得信任。天成元年（公元 926 年）李嗣源即位，即后唐明宗，以他为枢密使。明宗不识字，四方的奏章都由他读给明宗听，军政大事多由他决定，权势极重。

  据史书，他为人忠心勤勉，但刚愎自用，与许多人结怨，其中包括明宗的养子、潞王李从珂。他猜忌据有两川的西川节度使孟知祥和东川节度使董璋，在两川派驻亲信、分割其辖地，两人于是联合起兵反叛。长兴元年（930 年）朝廷出兵讨伐，次年他亲自前往督战，未能取胜，粮运又极为困难，朝廷只好收兵。明宗由此对他不满，罢去他的枢密使，调任河中节度使。长兴二年（931 年），他与妻子在河中被杀。两川此后实际上由孟知祥割据，为后蜀的建立埋下伏笔。他的生年史书没有记载。
sources: []
recalled:
