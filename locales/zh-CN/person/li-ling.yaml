name: 李陵
aliases: [李少卿]
role: 骑都尉
summary: 李广之孙，率五千步兵深入匈奴，力战后投降，全家被诛，终老匈奴。
body: |-
  据《汉书·李广苏建传》，李陵字少卿，是李广的孙子。他年轻时任侍中、建章监，善骑射，武帝认为他有李广的风范，任为骑都尉，让他在酒泉、张掖训练士兵，防备匈奴。

  天汉二年（公元前 99 年），贰师将军李广利出击匈奴右贤王，武帝想让李陵为他押运辎重。李陵请求自领一军分散单于的兵力，说愿以五千步兵直捣单于庭。他从居延出发，北行三十日，在浚稽山与单于的主力相遇。本传说匈奴先后调集了八万余骑，李陵且战且退，连战多日，杀伤甚多，最后箭矢用尽，被困在山谷中，距边塞只有百余里。他下令部下分散突围，自己被俘投降，逃回边塞的只有四百余人。

  武帝起初盼他战死，听说他投降后大怒。司马迁为他辩解，被下狱处刑。一年多后，有传言说李陵在为匈奴练兵，武帝于是诛杀了他的母亲和妻儿；后来才知道练兵的是另一名降将李绪。单于把女儿嫁给李陵，立他为右校王。他曾受命到北海劝降苏武。昭帝即位后，辅政的霍光、上官桀都是他的旧友，派人到匈奴招他回来，他以不能再次受辱为由拒绝。元平元年（前 74 年）他在匈奴病逝。
sources: []
recalled:
  - 《汉书·李广苏建传》
  - 《史记·李将军列传》
