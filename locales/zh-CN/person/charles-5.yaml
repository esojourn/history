name: "查理五世"
aliases: ["卡洛斯一世", "查理第五"]
role: "神圣罗马帝国皇帝、西班牙国王"
summary: "哈布斯堡家的皇帝兼西班牙国王，在沃尔姆斯审问路德，一生想恢复教会统一而未成。"
body: |-
  查理 1500 年生于尼德兰的根特，父亲是哈布斯堡家的“美男子”腓力，母亲是西班牙的胡安娜。他从祖父母、外祖父母四方继承了尼德兰、西班牙及其在意大利和美洲的属地、奥地利。《历史的轨迹》第二十九章说他自幼在祖母严谨的天主教环境中长大；他其实长在尼德兰，由姑母玛格丽特抚养，老师是乌得勒支的阿德里安，即后来的教皇阿德里安六世。1516 年他成为西班牙国王，1519 年 6 月当选神圣罗马帝国皇帝。

  1521 年他在沃尔姆斯召开第一次帝国议会，传路德到场。该书说他当时二十一岁，路德坚持公会议会错，他就挥手结束了会议，并起誓要以王位和生命为注铲除异端。这出自他次日亲笔写的声明。5 月他颁布《沃尔姆斯敕令》，宣布路德不受法律保护。

  该书第三十章说，此后二十多年他忙于同法国打仗、抵御土耳其人，腾不出手来。他与法王弗朗索瓦一世打了四次仗，1527 年他的军队洗劫了罗马；1529 年土耳其人围攻维也纳。每逢要钱要兵，他都得对信路德的诸侯让步。1530 年他亲自到奥格斯堡听取路德派的信条，没有接受；1540 至 1541 年又安排两派神学家会谈，也没有结果。他一再催教皇召开公会议，1545 年会议才在特兰托开幕。

  1546 年路德去世，他同年对路德派诸侯的施马尔卡尔登同盟开战，次年在米尔贝格获胜，占领维滕贝格。相传有人劝他掘路德的墓，他不肯。1552 年曾帮过他的萨克森公爵莫里茨倒戈，他仓皇逃出因斯布鲁克。1555 年他的弟弟斐迪南代他签订《奥格斯堡和约》，承认路德派诸侯的合法地位。

  1555 至 1556 年他把尼德兰和西班牙交给儿子腓力二世，把帝位让给斐迪南，退居西班牙尤斯特修道院旁的住所，1558 年 9 月 21 日在那里去世。
