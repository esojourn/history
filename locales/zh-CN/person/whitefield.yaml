name: "怀特菲尔德"
aliases: ["乔治·怀特菲尔德", "怀特腓德"]
role: "英国国教牧师、大觉醒的布道家"
summary: "牛津圣洁会成员，首开露天布道，往返英美布道，是加尔文派的福音派领袖。"
body: |-
  怀特菲尔德 1714 年生于格洛斯特，父母开客栈，家境寒微。他在牛津做工读生，加入卫斯理兄弟的圣洁会，1735 年经历了归正，次年受立为执事。他很快以讲道出名，1738 年第一次去佐治亚，以后为当地的孤儿院四处募款。

  《历史的轨迹》第三十六章说，1739 年他开始在布里斯托尔附近向矿工露天布道（金斯伍德的煤矿工人），不久邀请卫斯理兄弟加入。露天讲道在当时是崭新的尝试，约翰起初很犹豫。作者说卫斯理没有怀特菲尔德那种戏剧性的讲道能力。

  第三十八章把两人对比：都是牛津人，都是安立甘教会的牧师，都不局限于一个教区，关心不进教堂的人，都露天讲道，但怀特菲尔德更具吸引力；卫斯理是亚米念派，他是加尔文派；卫斯理是组织天才，他毫无组织能力，所以卫斯理留下一个强大的循道派教会，他影响了数千人，却从未组织过一个教会。作者说他和跟随的人留在安立甘教会中，成了“低派教会”即福音派；若他也有组织才干，加尔文主义在英国的影响会大得多。据一般记载，威尔士的加尔文派循道会和亨廷登伯爵夫人的联会都与他有渊源。

  他七次横渡大西洋，在北美各殖民地巡回布道，是“大觉醒”的主要人物。1770 年他在马萨诸塞的纽伯里波特去世。第三十六章说，他死后卫斯理才在年会中公开表明亚米念派的立场。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十六章“循道派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter40.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十八章“德国与英国的宗教生活” https://wellsofgrace.com/books/spiritual/2000years/html/chapter42.html"
recalled:
  - "怀特菲尔德《日记》"
