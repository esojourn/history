name: 韩侂胄
aliases: [韩节夫, 平原郡王]
role: 南宋权臣
summary: 南宋权臣，韩琦曾孙；兴庆元党禁，发动开禧北伐，失败后被杀，首级送往金朝。
body: |-
  韩侂胄字节夫，祖籍相州安阳（今河南安阳），生于绍兴二十二年（公元 1152 年），是北宋名相韩琦的曾孙。他的母亲是宋高宗吴皇后的妹妹，他本人又娶了吴皇后的侄女，以外戚子弟的身份恩荫入仕，任知閤门事。

  绍熙五年（1194 年）宋孝宗去世，宋光宗不肯执丧，韩侂胄奉赵汝愚之命，通过宪圣太后（即高宗吴皇后）促成宋宁宗即位，史称绍熙内禅。事后他与赵汝愚争权，次年赵汝愚被罢相，贬死途中。韩侂胄掌握朝政后，把赵汝愚一派以及朱熹的学说斥为“伪学”，开列“伪学逆党籍”，禁止相关人员任官和应举，史称庆元党禁（另见“庆元党禁”条）。嘉泰二年（1202 年）党禁逐渐松弛。

  韩侂胄想以恢复中原建立功业，嘉泰年间追封岳飞为鄂王，开禧二年（1206 年）追夺秦桧王爵，同年五月下诏北伐（另见“开禧北伐”条）。宋军在各路相继失利，四川的吴曦又叛降金朝，金军反攻到淮河、长江之间。金朝议和时要求宋交出主谋者的首级。

  开禧三年（1207 年）十一月，礼部侍郎史弥远与杨皇后等人密谋，派兵在韩侂胄上朝途中把他截到玉津园杀死。次年宋金订立嘉定和议，宋朝把韩侂胄的首级用匣子送往金朝。《宋史》把他列入《奸臣传》，后世也有人认为他力图恢复，只是准备不足、用人不当。
sources: []
recalled:
  - 《宋史·奸臣传·韩侂胄》
  - 《四朝闻见录》
