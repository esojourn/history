name: 杨秀清
aliases: [东王]
role: 太平天国东王，正军师
summary: 太平天国东王，以“天父下凡”取得权威，总揽军政，在天京事变中被杀。
body: |-
  杨秀清是广西桂平紫荆山区的烧炭工人，父母早亡，没有读过书。他加入拜上帝会后，在冯云山被捕期间，以“天父”上帝下凡附体的名义发布命令，稳定了会众，从此在拜上帝会中取得了极高的地位。洪秀全承认了他的“代天父传言”的身份。

  咸丰元年（1851 年）在永安，杨秀清被封为东王，任“正军师”，节制其他各王，太平天国的军政大事实际上由他主持。定都天京后，洪秀全深居宫中，杨秀清总揽朝政，指挥北伐、西征，咸丰六年（1856 年）上半年太平军攻破清军的江南大营和江北大营，达到了军事上的全盛。他有出色的组织和指挥能力，但也专横跋扈，借“天父下凡”的名义责打洪秀全，与其他诸王矛盾很深。

  据《李秀成自述》等记载，咸丰六年（1856 年）杨秀清逼洪秀全封他为“万岁”，洪秀全表面答应，暗中密召北王韦昌辉、翼王石达开回京。九月韦昌辉率兵进入天京，杀死杨秀清及其家属、部众数千人（另见“天京事变”条）。杨秀清是否真的逼封“万岁”，学者有不同看法。

  杨秀清死后，洪秀全一度宣布杀杨是韦昌辉的罪过，后来又把杨秀清被杀的日子定为“东王升天节”。太平天国后期的文献中，杨秀清仍然被尊为“劝慰师圣神风禾乃师赎病主”，地位仅次于天王。
sources: []
recalled:
  - 《李秀成自述》
  - 张德坚《贼情汇纂》
  - 罗尔纲《太平天国史》
