name: 刘义庆
aliases: [临川王]
role: 宗室、文学家
summary: 宋武帝的侄子，袭封临川王，主持编撰《世说新语》。
body: |-
  刘义庆是宋武帝刘裕的侄子，生父是长沙王刘道怜，后过继给叔父临川王刘道规，袭封临川王。宋文帝元嘉九年（公元 432 年）起出任荆州刺史，在任八年，后来又任江州、南兖州刺史。《宋书》本传说他性情简素，寡嗜欲，爱好文学，招聚了袁淑、陆展、何长瑜、鲍照等文士。晚年信奉佛教。元嘉二十一年（444 年）在建康去世，年四十二。

  署他名下的《世说新语》，记录东汉末年到东晋士人的言行轶事一千多则，按德行、言语、政事、文学等分为三十六门，文字简洁，是了解魏晋风度最常被引用的书，“魏晋风流”的许多故事都出自这里。一般认为此书由他主持、门下文士共同编成。南朝梁刘孝标为之作注，引书四百余种，也很受重视。他名下还有志怪小说集《幽明录》，原书已散佚，有后人的辑本。
sources: []
recalled:
