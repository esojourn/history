name: 毕达哥拉斯
aliases: []
role: 哲学家、宗教团体创始人
summary: 萨摩斯人，在意大利南部的克罗顿创立团体，主张灵魂轮回。
body: |-
  生于爱琴海东部的萨摩斯岛，生卒年都是约数。他本人没有留下著作，详细的传记出自七八百年后的第欧根尼·拉尔修、波菲利和扬布利柯，其中掺有大量传说；同时代和稍后的人提到他的只有零星几句。后世说他游历过埃及和巴比伦，无法证实。

  约公元前 530 年，据说因为不满僭主波吕克拉底的统治，他离开萨摩斯，迁到意大利南部的希腊城邦克罗顿，在那里聚集了一批追随者，组成一个有共同生活规则的团体。成员遵守饮食等方面的禁忌，对内部的教导保持沉默。可以确定属于他本人的教义是灵魂不死和轮回：与他同时代的诗人克塞诺芬尼讥讽说，毕达哥拉斯看见有人打一只小狗，便上前劝阻，说从叫声里认出了一位朋友的灵魂。赫拉克利特则批评他博学而没有见识。

  他的团体一度在克罗顿和邻近城邦有很大的政治影响，后来引起反对。古人说反对者烧毁了团体聚会的房屋，毕达哥拉斯迁到梅塔蓬图姆，在那里去世；这场变故发生在他生前还是身后，记载并不一致。

  直角三角形三边的关系，巴比伦人早已知道，把它的证明归于毕达哥拉斯是后世的说法。弦长的简单数比对应和谐的音程，“万物皆数”，这些学说属于毕达哥拉斯学派；其中哪些出自他本人，哪些是公元前 5 世纪菲洛劳斯等后学的发展，已难以分辨。这一学派对柏拉图有很深的影响。
sources: []
recalled:
  - 克塞诺芬尼残篇第 7 首；赫拉克利特残篇第 40 条
  - 希罗多德《历史》卷四第 95 章
  - 第欧根尼·拉尔修《名哲言行录》卷八
  - 波菲利《毕达哥拉斯传》；扬布利柯《毕达哥拉斯生平》
