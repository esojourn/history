name: 老塔克文
aliases: [塔克文·普里斯库斯, 卢库莫]
role: 传说中的罗马第五位国王
summary: 传说中的罗马第五位国王，来自伊特鲁里亚，相传兴建大下水道和竞技场。
body: |-
  相传为罗马第五位国王，传统上定在公元前 616 年至前 579 年在位。据李维，他原名卢库莫，父亲德马拉图斯是从科林斯流亡到伊特鲁里亚的希腊人，在塔尔奎尼定居。他因是外来人之子，在当地难有前途，在妻子塔娜奎尔的鼓动下迁到罗马，改名卢基乌斯·塔克文·普里斯库斯。传说途中一只鹰叼走又放回他的帽子，塔娜奎尔解释为吉兆。

  他在罗马广结人缘，成为国王安库斯的亲信和王子的监护人。安库斯死后，他支开两位王子，自己出面竞选，当选为王。据说他把元老增加一百人，与拉丁人、萨宾人作战，带回伊特鲁里亚式的凯旋仪式和权标。传说归于他的工程有：排干广场低地的大下水道，大竞技场的雏形，以及卡皮托利山上朱庇特神庙的奠基。

  李维记载，他在位三十八年后，安库斯的两个儿子雇了两个牧人，假装争讼求见，用斧头砍中了他。塔娜奎尔封锁消息，让女婿塞尔维乌斯·图利乌斯代行王权，后者由此继位。考古证明前 6 世纪罗马确有伊特鲁里亚风格的大型工程；至于他与“高傲者”塔克文是父子还是祖孙，古人已有不同说法。
sources: []
recalled:
  - 李维《建城以来史》卷一
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷三、卷四
