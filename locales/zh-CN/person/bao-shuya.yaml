name: 鲍叔牙
aliases: [鲍叔]
role: 齐国大夫
summary: 齐国大夫，辅佐齐桓公即位，又举荐曾是政敌的管仲，即“管鲍之交”。
body: |-
  鲍叔牙是齐国大夫，生卒年不详。据《史记·管晏列传》，他与管仲是少年时的朋友，二人合伙经商，管仲分利时多拿，鲍叔牙知道他家贫，并不计较；管仲屡次失意，鲍叔牙也始终理解他。管仲说：“生我者父母，知我者鲍子也。”

  齐襄公时政局混乱，鲍叔牙辅佐公子小白出奔莒国。襄公被杀后，小白抢先回国即位，就是齐桓公。桓公本想任用鲍叔牙为相，鲍叔牙却极力推荐曾经辅佐公子纠、射中过桓公的管仲，自愿位居其下。《史记》说：“天下不多管仲之贤而多鲍叔能知人也。”

  据《庄子·徐无鬼》等书，管仲临终时桓公问能否让鲍叔牙接任，管仲认为鲍叔牙为人清廉正直，但对不如自己的人不肯亲近，听到别人的过错终身不忘，不宜为政。这一说法未必可信，但常被后人引用。
sources: []
recalled:
  - 《史记·管晏列传》
  - 《庄子·徐无鬼》
  - 《左传》庄公八年至九年
