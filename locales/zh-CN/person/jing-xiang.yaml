name: 敬翔
aliases: [敬子振]
role: 后梁崇政院使
summary: 朱温的首席谋士，追随朱温三十余年，后梁亡时自缢而死。
body: |-
  敬翔是同州冯翊人，字子振，读书能文，唐末到汴州投奔宣武军节度使朱温，掌管文书，从此成为朱温最信任的谋士。据史书，朱温用兵和处理政务多与他商议，他常常昼夜不休，只在马上才得以休息。朱温建立后梁后，设崇政院掌管机要，以敬翔为崇政院使，参与一切军国大事。

  朱温死后，梁末帝朱友贞重用外戚赵岩等人，敬翔虽然仍有宰相的名位，意见却多不被采纳。龙德三年（公元 923 年），后唐军步步进逼，他劝朱友贞起用王彦章，王彦章不久又被撤换。同年十月后唐军攻入开封，朱友贞已死。据《新五代史》，敬翔听说同僚李振打算入朝拜见后唐皇帝，叹息说自己无颜去见新君，当夜自缢而死。他的生年史书没有记载。
sources: []
recalled:
  - 《旧五代史·梁书·敬翔传》
  - 《新五代史·梁臣传·敬翔》
