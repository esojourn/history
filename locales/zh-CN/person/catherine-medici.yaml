name: "凯瑟琳·德·美第奇"
aliases: ["卡特琳·德·美第奇", "凯瑟琳太后", "迦他林"]
role: "法国王后、摄政太后"
summary: "美第奇家出身的法国太后，在两教之间周旋，卷入圣巴多罗买大屠杀。"
body: |-
  凯瑟琳 1519 年 4 月生于佛罗伦萨，出生不到一个月父母双亡，由美第奇家的教皇照管。1533 年教皇克莱门特七世把她嫁给法王弗朗索瓦一世的次子亨利，时年十四岁。丈夫后来即位为亨利二世，宠爱的是别人，她婚后十年才生育，一共生了十个孩子。

  1559 年亨利二世在比武中受伤而死。长子弗朗索瓦二世在位一年多去世，1560 年十岁的次子查理九世即位，她以太后身份摄政。《历史的轨迹》第三十章说，天主教徒与新教徒都想控制政府，年轻的国王和摄政的母亲有时亲天主教，有时亲新教。她关心的是保住儿子们的王位，不让吉斯家或波旁家任何一方独大。1561 年她在普瓦西召集两派神学家会谈，次年初颁布《一月敕令》，准许胡格诺派在城外聚会。两个月后吉斯公爵的部下在瓦西杀了一批做礼拜的新教徒，战争开始。此后十年打打停停，她一次次议和。

  1572 年 8 月她把女儿玛格丽特嫁给胡格诺派的纳瓦拉国王亨利。该书说，天主教极端派警告她胡格诺派阴谋夺位，她便说服年幼无知的国王策动了集体屠杀。查理九世那年二十二岁。按通行的说法，她忌惮科利尼对国王的影响，先与吉斯家安排行刺；行刺未成，胡格诺贵族要求追查，她和国王在 8 月 23 日夜间的会议上决定先发制人，除掉聚在巴黎的胡格诺派首领。屠杀是否早有预谋、她在其中担了多大的责任，史家至今意见不一。

  1574 年三子亨利三世即位，她仍然替他奔走调停。1589 年 1 月 5 日她在布卢瓦去世，半年多以后亨利三世遇刺，瓦卢瓦王朝断绝。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
recalled:
  - "《凯瑟琳·德·美第奇书信集》"
  - "1562 年《一月敕令》"
  - "布朗托姆《名媛传》"
  - "德图《当代史》"
