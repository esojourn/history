name: 张浚
aliases: [张德远, 紫岩先生, 魏国公]
role: 南宋宰相，主战派
summary: 南宋初年主战派宰相，经营川陕，两度主持北伐，富平、符离两战都失利。
body: |-
  张浚字德远，汉州绵竹（今四川绵竹）人，生于绍圣四年（公元 1097 年），政和八年（1118 年）进士。南宋初年他任御史、礼部侍郎。建炎三年（1129 年）苗傅、刘正彦在杭州发动兵变，逼高宗退位，张浚在平江联络吕颐浩、韩世忠、张俊、刘光世等人起兵勤王，平定兵变，因此深得高宗信任。

  同年他出任川陕宣抚处置使，主张以川陕为根本经营恢复。建炎四年（1130 年）为了牵制江南的金军，他集结西北各路宋军在富平与金军会战，大败，陕西大部失陷（另见“富平之战”条）。此后他起用吴玠等人扼守蜀口，保住了四川。

  绍兴五年（1135 年）张浚拜相，都督诸路军马，次年击退伪齐的南侵。绍兴七年（1137 年）他处置刘光世的部队不当，部将郦琼率部投降伪齐，史称淮西兵变，张浚因此罢相。秦桧当政期间，他因反对议和被贬谪在外将近二十年，曾长期居住永州。

  宋孝宗即位后，张浚以老臣被重新起用，封魏国公，主持江淮军务。隆兴元年（1163 年）他派李显忠、邵宏渊北伐，在符离溃败（另见“隆兴北伐”条）。隆兴二年（1164 年）朝廷决定议和，张浚被罢，在回乡途中于余干去世。他的儿子张栻是南宋著名的理学家，与朱熹交往密切。
sources: []
recalled:
  - 《宋史·张浚传》
  - 朱熹《少师保信军节度使魏国公致仕赠太保张公行状》
