name: 君士坦提乌斯二世
aliases: [君士坦提乌斯, 康士坦丢二世, 君士坦丢二世]
role: 罗马皇帝
summary: 君士坦丁大帝之子，先治东方，后独掌全国，偏向阿里乌派。
body: |-
  君士坦提乌斯二世于公元 317 年 8 月 7 日生在西尔米乌姆，是君士坦丁的第三个儿子。337 年父亲去世，军队在君士坦丁堡杀掉了皇族的旁支，只留下年幼的伽卢斯和尤利安；后来尤利安认定这是他的主使。他与两个兄弟三分帝国，自己得东方，多年与波斯的沙普尔二世交战，尼西比斯三次被围都守住了。

  350 年将领马格嫩提乌斯在西部杀死他的弟弟自立。351 年他在潘诺尼亚的穆尔萨打败对方，双方死伤极重，353 年成为唯一的皇帝。他先后立堂弟伽卢斯和尤利安为“恺撒”，伽卢斯在 354 年被他处死。357 年他巡幸罗马，阿米阿努斯详细写了入城的场面。

  在教会事务上，他倾向折中的阿里乌派，几次放逐亚他那修和不肯让步的西方主教，召集一连串会议另订信条。他还下令禁止异教献祭。360 年高卢的军队拥立尤利安，他挥师西进，361 年 11 月 3 日病死在奇里乞亚，临终受洗，指定尤利安继位。
sources: []
recalled:
