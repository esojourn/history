name: 波尔塞纳
aliases: [拉尔斯·波尔塞纳, 波森纳]
role: 克鲁西乌姆国王
summary: 伊特鲁里亚城市克鲁西乌姆的国王，相传为帮塔克文复位而围攻罗马。
body: |-
  伊特鲁里亚城市克鲁西乌姆的国王，生卒年不详，罗马传说把他的活动定在公元前 508 年前后。

  据李维，被逐的国王塔克文向他求援，他率军进攻罗马，占领台伯河西岸的雅尼库鲁姆山。罗马人关于这场战争留下了几个著名的故事：荷拉提乌斯·科克勒斯独自守住木桥桥头，等同伴把桥拆毁后跳河游回；青年穆基乌斯潜入敌营行刺，误杀了书记，被捕后把右手伸进火里以示不惧，从此得名“斯凯沃拉”（左撇子）；作为人质的少女克洛伊利娅带着同伴游过台伯河逃回。李维说波尔塞纳佩服罗马人的勇气，撤围议和，没有让塔克文复位。

  另一种说法对罗马不那么体面。塔西佗提到罗马曾向波尔塞纳“献城”，老普林尼说他在和约中禁止罗马人使用铁器，只准用于农耕。不少现代学者据此认为他实际上占领过罗马，王政的结束可能与他有关。据李维和狄奥尼修斯，他的儿子阿伦斯随后进攻拉丁城市阿里基亚，被拉丁人和库迈的阿里斯托德莫斯击败，伊特鲁里亚人在拉丁地区的势力从此衰落。老普林尼转述瓦罗，说他在克鲁西乌姆有一座带迷宫的巨大陵墓。
sources: []
recalled:
  - 李维《建城以来史》卷二第 9—15 章
  - 塔西佗《历史》卷三第 72 章
  - 老普林尼《自然史》卷三十四、卷三十六
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷五
