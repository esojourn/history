name: 百里奚
aliases: [五羖大夫]
role: 秦国大夫
summary: 原为虞国大夫，虞亡后流落到秦，秦穆公用五张羊皮赎回他，任为大夫，号“五羖大夫”。
body: |-
  百里奚原是虞国大夫，生卒年不详。公元前 655 年晋国向虞国借道伐虢，回师时顺便灭了虞国，百里奚被俘。据《史记·秦本纪》，晋献公把女儿嫁给秦穆公，百里奚作为陪嫁的臣仆被送往秦国，他在途中逃到宛地，被楚国边境的人捉住。

  穆公听说他贤能，怕重金赎买会引起楚人的警觉，就以五张黑公羊皮的价格把他赎回。百里奚当时已七十多岁（《史记》说法），穆公与他谈论国事三日，大为高兴，把国政托付给他，号为“五羖大夫”。百里奚又推荐了朋友蹇叔，穆公迎蹇叔为上大夫。

  关于百里奚的经历，古书说法不一。《孟子·万章上》说他是自卖为人养牛，以此求见穆公，孟子认为这是好事者编造的。百里奚在秦国的具体政绩，史书记载不多。
sources: []
recalled:
  - 《史记·秦本纪》
  - 《孟子·万章上》
  - 《左传》僖公五年
