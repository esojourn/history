name: 宋钦宗
aliases: [赵桓]
role: 北宋末代皇帝
summary: 宋徽宗长子，金军南下时受禅即位，靖康之变中被俘北去，死于金国。
body: |-
  宋钦宗赵桓是宋徽宗的长子，元符三年（公元 1100 年）生于开封，政和五年（1115 年）立为太子。宣和七年（1125 年）冬金军南下，徽宗在这年十二月传位给他，他即位时已是公历 1126 年初，次年改元靖康。

  靖康元年（1126 年）正月，金朝东路军在完颜宗望率领下渡过黄河，包围开封。钦宗起用李纲主持守城，打退了金军的进攻；同时又派人求和，答应割让太原、中山、河间三镇，并交纳巨额金银（另见“开封保卫战”条）。各地援军赶到后，金军撤走。此后朝廷在和战之间反复摇摆，李纲被排挤出京，割让三镇的承诺也没有兑现。

  这年秋天金军以宋朝背约为由再次南下，东西两路会师开封城下。闰十一月开封外城失守（已是公历 1127 年初），钦宗亲自到金营求和，答应金朝搜刮金银的要求。靖康二年（1127 年）二月，金朝废黜徽宗、钦宗，另立张邦昌为帝；四月，金军押着二帝和宗室、后妃、大臣北撤，北宋灭亡（另见“靖康之变”条）。

  钦宗在金国被封为“重昏侯”，与徽宗一起被关押，后来迁到五国城。徽宗死后，他又被转移到燕京等地。南宋与金议和时，没有把他接回。据《金史》等记载，他死于金正隆元年（1156 年）；南宋朝廷直到绍兴三十一年（1161 年）才得知他的死讯。关于他的死因，宋人野史有被马践踏而死的说法，不足为信。
sources: []
recalled:
  - 《宋史·钦宗本纪》
  - 《金史·海陵本纪》
  - 《三朝北盟会编》
  - 《靖康要录》
