name: 汉高祖
aliases: [刘邦, 刘季, 沛公, 汉王, 高帝]
role: 皇帝
summary: 姓刘字季，沛县丰邑人，起兵反秦，击败项羽后建立汉朝。
body: |-
  据《史记·高祖本纪》，高祖姓刘，字季，沛县丰邑中阳里人，壮年时做过泗水亭长。“邦”这个名字不见于《史记》正文，出自后人注引。他的生年《史记》《汉书》都没有写：《史记集解》引皇甫谧说他终年六十二，据此生于公元前 256 年；《汉书》注引臣瓒说终年五十三，则生于前 247 年。秦二世元年（前 209 年）九月，沛县父老杀县令，立他为沛公。此后他归属项梁和楚怀王，受命西进，汉元年十月先于诸侯抵达霸上，秦王子婴出降。他还军霸上，与关中父老“约法三章”。

  项羽入关后，两人在鸿门相会，刘邦得以脱身，被封为汉王，统巴、蜀、汉中，都南郑。同年八月他用韩信之计从故道北出，还定三秦，继而东进，与项羽相持四年有余。其间他在彭城大败，又屡次被困于荥阳、成皋；韩信在北方攻取魏、赵、齐之后，局势才逐渐扭转。汉五年（前 202 年）击灭项羽于垓下，同年二月甲午即皇帝位，先都雒阳，后听从娄敬、张良的建议入都关中。

  在位期间，异姓诸侯王韩信、彭越、英布等相继被废被杀，改封刘氏子弟为王。高祖七年（前 200 年）他亲征匈奴，被围于平城七日（《匈奴列传》说被围在白登），其后采用刘敬之策与匈奴和亲。十二年击英布时中箭，同年四月甲辰（前 195 年）死于长乐宫，太子刘盈继位。
sources:
  - 《史记·高祖本纪》 https://zh.wikisource.org/wiki/史記/卷008
  - 《汉书·高帝纪》 https://zh.wikisource.org/wiki/漢書/卷001
  - 《史记·匈奴列传》 https://zh.wikisource.org/wiki/史記/卷110
  - 《史记三家注·高祖本纪》（集解引皇甫谧说年寿） https://zh.wikisource.org/wiki/史記三家註/卷008
