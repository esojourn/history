name: 路得
aliases: []
role: 大卫的曾祖母
summary: 摩押女子，丧夫后随婆婆拿俄米到伯利恒，嫁波阿斯，是大卫的曾祖母。
body: |-
  路得是摩押女子，她的事迹记在《路得记》里。这卷书开头说，当士师秉政的时候，国中遭遇饥荒，犹大伯利恒人以利米勒带着妻子拿俄米和两个儿子玛伦、基连到摩押地寄居。以利米勒死在那里；两个儿子娶了摩押女子，一个名叫俄珥巴，一个名叫路得。据 1:4，他们在那里住了约有十年，玛伦和基连也死了。路得的丈夫是玛伦（4:10）。圣经没有记载路得的家世、生年和卒年。

  拿俄米听说耶和华眷顾自己的百姓、赐粮食给他们，就起身要回犹大，并劝两个儿妇各回娘家。俄珥巴与婆婆亲嘴告别，路得却舍不得离开。她对拿俄米说，婆婆往哪里去，她也往哪里去；婆婆的国就是她的国，婆婆的神就是她的神（1:16–17）。两人回到伯利恒，正是动手割大麦的时候。

  据第 2 章，路得到田间拾取麦穗供养婆婆，恰巧到了以利米勒的亲族波阿斯的田里，波阿斯厚待她。她一直拾到大麦和小麦都收割完了。第 3 章记载，拿俄米为路得的归宿打算，叫她沐浴抹膏，夜间到波阿斯簸大麦的禾场去。路得照着做了，请波阿斯以至近亲属的身份用衣襟遮盖她。波阿斯称赞她没有去跟从少年人，答应为她办这件事，天亮前量了六簸箕大麦让她带回去。

  第 4 章记载，波阿斯在城门口当着长老的面办妥了赎产业的事，娶路得为妻。路得生了一个儿子，邻舍的妇人对拿俄米说，这儿妇比七个儿子还好；她们给孩子起名叫俄备得。俄备得是耶西的父亲，耶西是大卫的父亲。新约《马太福音》1:5 的家谱里也记有路得的名字。
sources: []
recalled:
  - 《路得记》第 1—4 章
  - 《马太福音》第 1 章
