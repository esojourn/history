name: 科农
aliases: []
role: 雅典将军
summary: 雅典海军将领，羊河之败后投奔塞浦路斯，率波斯舰队在克尼多斯击败斯巴达，重建长墙。
body: |-
  雅典人，提摩透斯之子，伯罗奔尼撒战争后期多次出任将军。公元前 406 年他的舰队被斯巴达人围在米提利尼，雅典为解围赢得了阿吉纽西海战；战后几位将军被处死，他因当时被围而未受牵连。前 405 年羊河之战，吕山德趁雅典水兵上岸时突袭，雅典舰队几乎全部被俘。据色诺芬，科农带着八艘船逃脱，国家快船“帕拉洛斯”号回雅典报信，他自己不敢回去，投奔了塞浦路斯萨拉米斯的国王欧阿戈拉斯。

  他在塞浦路斯住了数年。斯巴达与波斯开战后，波斯总督法那巴佐斯起用他，与他一同统领由腓尼基、塞浦路斯等地船只组成的舰队。前 394 年 8 月，这支舰队在小亚细亚西南角的克尼多斯外海击败斯巴达舰队，斯巴达统帅佩桑德洛斯战死。此后两人沿爱琴海东岸巡行，驱逐各城的斯巴达驻军长官，斯巴达在羊河之战后建立的海上霸权至此结束。

  前 393 年他率舰队回到雅典，用波斯提供的钱和船上的人力，协助修复了前 404 年被拆毁的长墙和比雷埃夫斯的城防。雅典人为他立了铜像。

  前 392 年斯巴达派安塔尔基达斯去见波斯在萨迪斯的总督提里巴佐斯，指科农是在用国王的钱为雅典谋利。科农随雅典使团到萨迪斯，被提里巴佐斯拘禁。他此后不久去世，多数记载说他脱身到了塞浦路斯并死在那里。他的儿子提摩透斯后来也是雅典的名将。
sources: []
recalled:
  - 色诺芬《希腊史》卷二第 1 章、卷四第 3 章、第 8 章
  - 狄奥多罗斯《历史丛书》卷十四
  - 奈波斯《科农传》
