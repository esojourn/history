name: 贵格利七世
aliases:
  - 希尔得布兰
  - 希尔德布兰德
  - 格列高利七世
  - 额我略七世
role: 罗马主教（教皇）
summary: 原名希尔得布兰的教皇，禁止俗人授职，与皇帝亨利四世相争，死于流亡。
body: |-
  希尔得布兰约在 1020 年生于意大利托斯卡纳的索瓦纳，家境贫寒，在罗马的圣玛利亚修道院受教育，他的一位叔父是那里的院长。他为教皇贵格利六世做事，1046 年贵格利六世被皇帝废黜，他随同流亡到德意志；1049 年利奥九世把他带回罗马，让他管理教廷的财务。此后二十多年，他先后辅佐几位教皇，是 1059 年教皇选举法和革新运动背后的主持人。《历史的轨迹》第十六章说他身材矮小，声音微弱，生活简朴，一心要照奥古斯丁《上帝之城》的理想在地上建立神的国，相信教皇是基督的代表，高于一切君王，只向神负责。

  1073 年 4 月，罗马民众在亚历山大二世的葬礼上高呼他为教皇，枢机们随后追认。他取名贵格利，以纪念贵格利六世。1075 年他重申禁止俗人授职，同年写下二十七条《教皇训令》，其中说教皇可以废黜皇帝。

  皇帝亨利四世照旧任命主教。1075 年 12 月贵格利去信严厉责备；1076 年 1 月亨利在沃尔姆斯召集主教，宣布不再承认他是教皇；2 月贵格利在罗马的会议上革除亨利的教籍，解除臣民对他的效忠。德意志诸侯乘机逼迫亨利。1077 年 1 月亨利越过阿尔卑斯山到卡诺莎，在城堡外悔罪三天，贵格利赦免了他。

  争斗没有结束。1080 年贵格利再次革除亨利的教籍，亨利一方的主教另立拉文纳大主教为教皇。1084 年亨利攻入罗马，由对立教皇加冕；贵格利困在圣天使堡，向南方的诺曼人求救。诺曼人赶走了亨利，却在城中烧杀抢掠，罗马人迁怒于教皇，他只得随诺曼人南去。《历史的轨迹》说他死于南行途中；他在萨莱诺住了将近一年，1085 年 5 月 25 日在那里去世。相传他临终说：“我爱正义，恨恶不义，所以死在流亡中。”

  他还是第一个打算出兵东方的教皇：1074 年他计划亲自带兵援助东罗马，因与亨利相争而作罢。
