name: "路德·赖斯"
aliases: ["赖斯", "莱司"]
role: "美国浸信会差会的组织者"
summary: "与耶德逊同赴印度并改信浸礼，回国奔走各地，组成美国浸信会第一个全国性差会。"
body: |-
  《历史的轨迹》第四十四章说，赖斯和耶德逊本是公理派差往印度的宣教士，在赴印途中接受了浸礼派原则，抵达加尔各答后重新受洗；耶德逊留在缅甸，赖斯回到美国，组织了浸礼派差会。书中把这件事称为当时差会成立中最戏剧化的一幕。

  据一般记载，赖斯 1783 年生于马萨诸塞诺斯伯勒，与耶德逊同在安多弗神学院读书，1812 年另乘一船赴印度，同年在加尔各答受浸。改宗后他们失去了公理会的支持，1813 年赖斯回国，为在缅甸的耶德逊募集经费，走遍各州联络分散的浸信会。1814 年各地浸信会代表在费城成立“美国浸信会海外宣教总会”（因每三年开会一次，通称“三年会”），这是美国浸信会第一个全国性组织。此后他把大量精力放在创办华盛顿的哥伦比亚学院（今乔治·华盛顿大学）上，学院负债累累，他也因此受到批评。他 1836 年在南卡罗来纳埃奇菲尔德去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十四章“十九世纪初期的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter49.html"
