name: "卡特赖特"
aliases: ["托马斯·卡特赖特"]
role: "长老派清教徒的领袖"
summary: "剑桥神学教授，主张以长老制取代主教制，被撤职后长期流亡受压。"
body: |-
  卡特赖特 1535 年生于赫特福德郡，在剑桥读书。玛丽一世在位时他离开学校，伊丽莎白即位后回到剑桥。1569 年他任剑桥的玛格丽特夫人神学讲座教授，次年讲《使徒行传》，主张教会应当照新约的样式，由长老治理，各牧师地位平等，主教制应当废除。

  《历史的轨迹》第三十一章称他为清教徒运动的领导人物，说早期反清教徒的首脑惠特吉夫设法使他被撤职，此后他过着流浪与受逼迫的日子，但仍为长老派清教徒主义不遗余力地工作。据一般记载，他 1570 年失去教席，后来在日内瓦、安特卫普、米德尔堡等地住过，与惠特吉夫打了多年笔墨官司。

  1585 年前后他回到英国，在沃里克主持一所济贫院。1590 年他因参与长老派的秘密集会被捕，在狱中两年左右，后获释。他 1603 年死于沃里克。该书说，清教徒虽反对主教制和许多仪式，却不脱离英国教会，而要从内部照日内瓦的模式改革它；卡特赖特正是这一路的代表。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
recalled:
  - "卡特赖特与惠特吉夫的论战文字（《答辩》等）"
