name: 汉景帝
aliases:
  - 刘启
  - 孝景皇帝
role: 皇帝
summary: 名刘启，文帝之子。在位时削藩引发七国之乱，平定后抑损诸侯王。
body: |-
  汉文帝之子，母亲是窦太后。据《史记·孝景本纪》，文帝在代国时先有三个儿子，后来都死了，所以他得以立为太子。本纪没有记他的生年，通常据享年推算为公元前 188 年左右。前 157 年文帝去世，他即位为帝。

  即位之初他下令田租减半，《汉书·食货志》说自此“三十而税一”。他信用晁错，采纳其削减诸侯王封地的主张。前 154 年正月，吴王刘濞联合楚、赵、胶西、胶东、菑川、济南六国起兵。他听从袁盎的建议处死晁错，七国并未罢兵；太尉周亚夫率军东出，三个月平定叛乱。《汉书·诸侯王表》说他此后“抑损诸侯，减黜其官”。

  他先立长子刘荣为太子，后来废为临江王，改立胶东王刘彻，即后来的汉武帝；丞相周亚夫因反对废太子等事与他不合，后下狱而死。他在位时继续与匈奴和亲，又下诏减轻笞刑。前 141 年正月他在未央宫去世。《汉书·景帝纪》的赞语说“周云成康，汉言文景”。
sources:
  - 《史记·孝景本纪》 https://ctext.org/shiji/xiao-jing-ben-ji/zhs
  - 《汉书·景帝纪》 https://ctext.org/han-shu/jing-di-ji/zhs
  - 《汉书·食货志》 https://ctext.org/han-shu/shi-huo-zhi/zhs
  - 《史记·吴王濞列传》 https://ctext.org/shiji/wu-wang-bi-lie-zhuan/zhs
  - 《汉书·诸侯王表》
