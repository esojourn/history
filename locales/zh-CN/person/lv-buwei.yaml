name: 吕不韦
aliases: [文信侯]
role: 秦国相国
summary: 大商人，扶立秦庄襄王，任秦相国，主编《吕氏春秋》，后被迫自杀。
body: |-
  吕不韦是阳翟的大商人（《战国策》说他是濮阳人），生年不详。据《史记·吕不韦列传》，他往来各地贩贱卖贵，家累千金。在赵都邯郸，他见到了在赵国做人质、处境窘迫的秦国公子子楚（原名异人），说“此奇货可居”。他出钱资助子楚结交宾客，又带着珍宝到秦国，通过华阳夫人的姐姐游说没有儿子的华阳夫人，使安国君（后来的秦孝文王）立子楚为嫡嗣。

  《史记》说吕不韦把一位已怀孕的赵姬献给子楚，后来生下嬴政，暗示秦始皇是吕不韦之子。这一说法自古就有人怀疑，许多学者认为是秦亡后六国旧人编造的。公元前 251 年秦昭襄王去世，孝文王即位三天就死了，子楚即位，就是庄襄王，任吕不韦为丞相，封文信侯，食河南洛阳十万户。公元前 247 年庄襄王去世，十三岁的嬴政即位，吕不韦任相国，号称“仲父”，执掌秦国大权，继续东进攻取三晋之地。

  吕不韦招致门下宾客三千人，让他们各自写下所见所闻，编成《吕氏春秋》，共二十多万字，“以为备天地万物古今之事”。书成后公布在咸阳城门，宣称能增减一字的赏千金，“一字千金”的成语由此而来。这部书兼采儒、道、墨、法、阴阳各家，是战国末年的重要著作。

  后来太后与嫪毐私通事发，公元前 238 年嫪毐作乱被诛，吕不韦因曾推荐嫪毐受到牵连，次年被免去相国之职，回到河南封地。各国宾客使者络绎不绝地去拜访他，秦王担心他作乱，写信责问他“君何功于秦”，命他全家迁往蜀地。吕不韦自知难逃一死，于公元前 235 年饮鸩自杀。
sources: []
recalled:
  - 《史记·吕不韦列传》
  - 《战国策·秦策五》
  - 《吕氏春秋》
