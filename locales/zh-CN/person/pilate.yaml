name: 本丢·彼拉多
aliases:
  - 彼拉多
  - 巡抚彼拉多
role: 罗马驻犹太总督
summary: 约公元 26—36 年任罗马驻犹太总督，审问耶稣并把他交去钉十字架。
body: |-
  彼拉多的出身、生年和早年经历都没有记载。他约在公元 26 年、皇帝提比略在位时出任罗马驻犹太的总督，和合本圣经称他为“巡抚”。总督平时驻在海边的该撒利亚，逢犹太人的节期上耶路撒冷。1961 年该撒利亚出土一块石刻，上面有他的名字和“犹太长官”的头衔。

  约瑟夫斯《犹太古史》卷 18 和《犹太战记》卷 2 记了他与犹太人的几次冲突：他让军队带着有皇帝像的军旗进入耶路撒冷，引起民众连日请愿，最后把军旗撤走；他动用圣殿的库银修筑引水道，并派兵打散抗议的人群。斐洛《觐见盖乌斯》另记他在耶路撒冷的希律王宫里悬挂献给皇帝的镀金盾牌，后来奉提比略之命移走。《路加福音》13:1 提到他使加利利人的血搀杂在他们的祭物中，这件事不见于别的记载。

  四卷福音书都记耶稣受审的经过。祭司长把耶稣解到彼拉多那里，告他自称是犹太人的王。彼拉多审问以后，说查不出他有什么该死的罪；《路加福音》记他曾把耶稣送到希律那里。他按节期释放一个囚犯的常例，问众人要释放哪一个，众人要巴拉巴。《马太福音》27:19 记他的妻子打发人来，说自己在梦中为这义人受了许多的苦；27:24 记他拿水在众人面前洗手。《约翰福音》19:12 记犹太人喊着说，他若释放这个人，就不是该撒的忠臣。他最后把耶稣鞭打了，交给人钉十字架。十字架上的牌子写着“犹太人的王”，祭司长请他改写，他没有答应（约 19:19–22）。事后他准许亚利马太人约瑟领去耶稣的身体。

  据约瑟夫斯，约公元 36 年，彼拉多派兵击杀了聚集在基利心山下的一批撒玛利亚人，撒玛利亚人告到叙利亚总督维特里乌斯那里，他奉命回罗马向皇帝申辩，到达时提比略已经去世（公元 37 年）。此后他的下落不明。四世纪的优西比乌在《教会史》里说他在卡利古拉在位时自杀，后世另有多种传说，彼此不一致。
