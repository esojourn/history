name: 述律平
aliases: [月理朵, 应天皇后, 淳钦皇后, 地皇后]
role: 契丹皇后
summary: 耶律阿保机的皇后，阿保机死后临朝称制，立次子耶律德光为帝；相传曾断腕殉葬。
body: |-
  述律平是耶律阿保机的妻子，小字月理朵。据《辽史》，她的祖先是回鹘人，后来世代与耶律氏通婚，述律氏后来又称萧氏。她很有谋略，阿保机在位时常参与军国大事，《辽史》记载她曾在阿保机出征期间亲自领兵，击退了来袭的黑车子室韦。阿保机平定诸弟之乱，她也出了力。

  天显元年（公元 926 年）阿保机死于扶余府，述律平临朝称制，掌握大权。据《资治通鉴》和《辽史》，她以“为先帝殉葬”为名杀了不少不服从她的大臣和将领；有人反问她为什么自己不殉葬，她说儿子年幼、国家无主，不能殉葬，于是砍下自己的一只手腕放进阿保机的棺中。这个故事见于宋代和辽代的记载，细节各有出入。

  她偏爱次子耶律德光，不喜欢长于汉文化的长子耶律倍。天显二年（927 年），在她的主持下，耶律德光即位，耶律倍被迫让位，后来渡海投奔后唐。会同十年（947 年），耶律德光死在南征回师途中，军中将领拥立耶律倍的儿子耶律阮为帝。述律平不承认，派小儿子耶律李胡领兵抵抗，被击败。双方在潢水边对峙，经大臣耶律屋质居中调停，她才承认耶律阮为帝。此后她被耶律阮软禁，应历三年（953 年）去世。
sources: []
recalled:
  - 《辽史·后妃传》
  - 《资治通鉴》卷二百七十五、二百八十七
  - 《新五代史·四夷附录·契丹》
