name: 韩非
aliases: [韩非子]
role: 思想家，法家集大成者
summary: 韩国公子，法家集大成者；出使秦国时遭李斯陷害，死于狱中。
body: |-
  韩非是韩国的公子，约生于公元前 280 年。据《史记·老子韩非列传》，他喜好刑名法术之学，其学说归本于黄老；他口吃，不善言谈，但擅长著书。他与李斯一同师从荀子，李斯自认为不如韩非。

  韩非看到韩国日渐削弱，多次上书劝谏韩王，韩王都不采用。他痛恨国君不致力于修明法制、任用贤能，反而任用浮夸淫蠹之人，于是写了《孤愤》《五蠹》《内储说》《外储说》《说林》《说难》等文章，共十余万言。他把商鞅的“法”、申不害的“术”和慎到的“势”结合起来，主张君主以法治国、以术驭臣、以势服众；又认为时代在变，“世异则事异，事异则备变”，反对一味效法古代。“守株待兔”“自相矛盾”“郑人买履”“滥竽充数”等寓言都出自《韩非子》。

  据《史记》，秦王嬴政读了《孤愤》《五蠹》，感叹说：“嗟乎，寡人得见此人与之游，死不恨矣！”李斯告诉他这是韩非的著作。秦国于是加紧攻韩，韩王派韩非出使秦国。秦王很喜欢他，但还没有信用。李斯、姚贾嫉妒韩非，进谗言说韩非是韩国公子，终究会为韩国打算，不如找个罪名杀掉。秦王把韩非交给司法官员治罪，李斯派人送去毒药让他自杀。韩非想向秦王当面陈述，却没有机会。秦王后来后悔，派人赦免他，韩非已经死了。他死于公元前 233 年，地点在云阳。

  韩非的学说为秦国统一和此后历代的集权政治提供了理论基础。《韩非子》今存五十五篇。
sources: []
recalled:
  - 《史记·老子韩非列传》
  - 《韩非子》
  - 《战国策·秦策五》
