name: 福基翁
aliases: [佛基昂]
role: 雅典将军、政治家
summary: 雅典将军，据说四十五次当选，主张与马其顿妥协，晚年被复辟的民主政府处死。
body: |-
  雅典人，约生于公元前 402 年。普鲁塔克说他年轻时听过柏拉图讲学，后来又从学于色诺克拉底，生活简朴，言辞简短尖刻，人称“好人福基翁”。他早年在将军卡布里亚斯手下，前 376 年纳克索斯海战时指挥左翼。据普鲁塔克，他一生当选将军四十五次，却从不为此奔走。

  前 348 年他在优卑亚的塔米奈取胜。前 340 年腓力二世围攻拜占庭，他率舰队前去解围，因为名声好，拜占庭人肯放他的部队进城。在对马其顿的政策上，他认为雅典的实力不足以一战，屡次反对德摩斯梯尼的主张。前 338 年喀罗尼亚战败后，以及前 335 年亚历山大毁灭底比斯、要求交出反马其顿的演说家时，他都参与了交涉。据普鲁塔克，亚历山大送他一百塔兰特，他没有收。

  前 323 年亚历山大去世，雅典起兵，他不赞成，但在马其顿人米基翁登陆阿提卡时仍率军将其击退。次年希腊联军战败，他与德马德斯等人去见安提帕特议和，条件是在比雷埃夫斯的穆尼基亚驻扎马其顿军，交出德摩斯梯尼等人，并把公民权限制在财产满两千德拉克马的人之内，据说有一万多人因此失去公民权。此后几年，他是这个寡头政府里最有分量的人。

  前 319 年安提帕特去世，继任摄政波利伯孔为争取希腊人，宣布恢复各邦原来的政制。安提帕特之子卡山德的部将尼卡诺尔趁机占据了比雷埃夫斯，福基翁被指未加防备、有意纵容。前 318 年民主派回到雅典，他被免职，去向波利伯孔申诉，反被押回。公民大会在一片喧哗中判他和几位同僚死刑，他饮毒芹汁而死，年过八十。遗体被抛出阿提卡境外。普鲁塔克说，不久雅典人后悔，为他立了铜像，处死了控告者。
sources: []
recalled:
  - 普鲁塔克《福基翁传》
  - 狄奥多罗斯《历史丛书》卷十八
  - 奈波斯《福基翁传》
