name: 宇文化及
aliases: [许帝]
role: 将军
summary: 隋将宇文述之子，618 年在江都发动兵变，杀死隋炀帝，后称帝，被窦建德擒杀。
body: |-
  宇文化及是隋炀帝宠臣宇文述的长子，因父亲的关系得到炀帝亲近，任右屯卫将军。史书说他性情凶险，不守法度，曾因与突厥私下交易被罢官，后来又被起用。

  大业十二年（公元 616 年）炀帝南下江都后不再北返，随驾的骁果军多是关中人，思念家乡，纷纷逃亡。大业十四年（618 年）三月，虎贲郎将司马德戡等人谋划叛归，推宇文化及为首，率兵入宫，缢杀炀帝，又杀了隋朝宗室和不少大臣（另见“江都之变”条）。宇文化及立秦王杨浩为帝，自任大丞相，率十余万人北归。

  北上途中，他在黎阳一带被李密击败，部众离散。武德二年（619 年），他毒死杨浩，在魏县自称皇帝，国号许。同年窦建德攻破聊城，将他擒获，以弑君之罪处斩。
sources: []
recalled:
  - 《隋书·宇文化及传》
  - 《资治通鉴》卷一百八十五至一百八十七
