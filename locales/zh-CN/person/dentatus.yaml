name: 库里乌斯·登塔图斯
aliases: [马尼乌斯·库里乌斯·登塔图斯, 登塔图斯]
role: 罗马执政官
summary: 罗马平民出身的统帅，结束萨莫奈战争，在贝内文图姆击退皮洛士。
body: |-
  马尼乌斯·库里乌斯·登塔图斯，罗马平民出身的将领，家族此前没有人做过高官，生年不详。“登塔图斯”意为“有牙的”，老普林尼说他生下来就长着牙。

  公元前 290 年他第一次任执政官，结束了延续半个世纪的萨莫奈战争，萨莫奈人接受和约，成为罗马的同盟者；同年他又征服萨宾人，把罗马的疆土推到亚得里亚海，萨宾人得到没有投票权的公民权。大片新得的土地分给了罗马公民。传说他只给自己留了和普通士兵一样的一份，说嫌七尤格拉不够的人是危险的公民。他还主持开凿水道，把韦利努斯湖的水排入纳尔河，形成今天的马尔莫雷瀑布。前 283 年他又击败高卢塞农人。

  前 275 年他再任执政官，对付从西西里回到意大利的皮洛士。征兵时有人不应召，他下令拍卖此人的财产。两军在贝内文图姆（当时叫马尔文图姆）附近交战。据普鲁塔克和狄奥尼修斯，皮洛士企图夜间翻山偷袭罗马营地，因道路难行天亮才到，被击退；随后的会战中，罗马人惊退战象，战象回冲本阵。皮洛士不久撤回伊庇鲁斯。登塔图斯举行凯旋式，罗马人第一次在游行中见到大象。次年他三任执政官。

  前 272 年他任监察官，用战利品开工修建罗马第二条引水渠（旧阿尼奥水渠），未完工而于前 270 年去世。西塞罗和普鲁塔克都讲过一个故事：萨莫奈使者带着黄金去见他，见他坐在灶边烤芜菁；他回答说，自己宁愿统治有黄金的人，而不是自己拥有黄金。老加图的庄园与他的旧居相邻，把他当作效法的榜样。
sources: []
recalled:
  - 普鲁塔克《皮洛士传》第 25 章、《老加图传》第 2 章
  - 西塞罗《论老年》第 16 章
  - 李维《建城以来史》卷十一至卷十四摘要
  - 弗朗提努斯《论罗马城的供水》卷一
