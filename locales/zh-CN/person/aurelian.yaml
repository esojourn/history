name: 奥勒良
aliases: [卢基乌斯·多米提乌斯·奥勒利安努斯, 奥勒利安, 奥雷良]
role: 罗马皇帝
summary: 罗马皇帝，五年之内收复帕尔米拉和高卢，重新统一帝国，修筑罗马城墙。
body: |-
  奥勒良约生于公元 214 年，出身多瑙河中游的农家，出生地有西尔米乌姆和河南岸的默西亚两说。他从士兵做到骑兵统帅，268 年参与了除掉伽利埃努斯的密谋。270 年皇帝克劳狄二世死于瘟疫，多瑙河的军团在西尔米乌姆拥立了他。

  他即位时，高卢、不列颠另有皇帝，东方在帕尔米拉手里，多瑙河对岸的部族连年入侵。270 至 271 年尤通吉人攻入意大利，他先在普拉肯提亚吃了败仗，随后在法诺和帕维亚取胜。罗马城几百年没有设防，他下令修一道周长约十九公里的砖石城墙，这道奥勒良城墙至今大半还在。他镇压了罗马铸币工人的暴动，据奥勒留·维克多，平乱中死了七千士兵。图拉真征服的达契亚孤悬在多瑙河以北，他把驻军和居民撤到南岸，另设一个同名的行省。

  272 年他东征，击败泽诺比娅，次年平定帕尔米拉和埃及的再次反叛。274 年他转向西方，高卢的皇帝泰特里库斯在马恩河畔沙隆阵前归降，古代史书说两人事先已有约定。分裂十四年的帝国重新统一，他举行凯旋式，得到“世界的恢复者”称号。同年他改革币制，在罗马为“不可战胜的太阳神”建庙，设专门的祭司团。

  教会史家优西比乌记，安条克的教会为主教撒摩撒他的保罗的去留相争，告到他那里，他裁定教堂归与意大利和罗马主教通信往来的一方。拉克坦提乌斯说他临死前已打算逼迫基督徒。275 年秋，他率军东进准备与波斯开战，在色雷斯的路上被几名军官杀死；据说是一个怕受罚的秘书伪造了一份处决名单，使这些人以为自己难逃一死。
sources: []
