name: 宋哲宗
aliases: [赵煦, 赵傭]
role: 北宋皇帝
summary: 宋神宗之子，九岁即位，亲政后改元绍圣，恢复新法、贬逐元祐大臣。
body: |-
  宋哲宗赵煦是宋神宗的第六子，熙宁九年（1077 年初）生于开封。元丰八年（1085 年）神宗去世，他九岁即位，祖母高太后以太皇太后身份垂帘听政，起用司马光、吕公著等人，废除新法，史称“元祐更化”（另见该条）。据宋人记载，哲宗后来抱怨，听政期间大臣们只向太后奏事，他只能看到他们的背和臀。

  元祐八年（1093 年）高太后去世，哲宗亲政，次年改元绍圣，意思是继承神宗的事业。他起用章惇为宰相，恢复免役、保甲等新法，把元祐年间的大臣大批贬逐到岭南，苏轼被贬到惠州、儋州，苏辙、秦观、黄庭坚等人也被远贬。对西夏，宋军在西北修筑平夏城等城寨，步步推进，迫使西夏求和。元符三年（1100 年）正月哲宗去世，年仅二十四岁，没有儿子，由神宗的向太后做主，立他的弟弟端王赵佶，即宋徽宗。
sources: []
recalled:
  - 《宋史·哲宗本纪》
  - 《续资治通鉴长编》卷三百五十三至五百二十
