name: 秦惠文王
aliases: [嬴驷, 秦惠王]
role: 秦国国君，秦国第一位称王者
summary: 秦孝公之子，即位后车裂商鞅但保留新法，称王，任用张仪连横，攻取巴蜀和楚国汉中。
body: |-
  秦惠文王名驷，是秦孝公之子，生于公元前 356 年。他做太子时触犯新法，商鞅处罚了他的两位师傅。公元前 338 年孝公去世，他即位后，公子虔等人告发商鞅谋反，商鞅被车裂。但惠文王并没有废除新法，秦国继续沿着变法的道路发展。

  公元前 325 年，惠文王正式称王，次年改元，成为秦国第一位称王的君主。他任用魏人张仪为相，推行连横，分化东方诸国；同时不断东进，迫使魏国献出河西和上郡之地。公元前 318 年，楚、赵、魏、韩、燕五国合纵攻秦，在函谷关被秦军击退。

  公元前 316 年，惠文王采纳司马错的建议，出兵灭了蜀国和巴国，秦国获得了富饶的四川盆地。公元前 313 年他派张仪到楚国破坏齐楚联盟，次年在丹阳、蓝田大败楚军，夺取了楚国的汉中郡。惠文王死于公元前 311 年，儿子武王继位。

  惠文王时期，秦国在新占领的地区陆续设郡，如上郡、巴郡、蜀郡、汉中郡，郡县制逐步推广。他也重用来自各国的人才，除张仪外，还先后任用了魏人公孙衍、楚人陈轸，以及本国的樗里疾、司马错等人。秦国在他的时代已成为东方各国共同的威胁。

  他在位二十七年，儿子武王继位后不久，在洛阳举鼎绝膑而死。
sources: []
recalled:
  - 《史记·秦本纪》
  - 《史记·张仪列传》
  - 《战国策·秦策一》
