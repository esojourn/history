name: 罗得岛的门农
aliases: [门农]
role: 波斯军中的希腊将领
summary: 罗得岛人，为波斯统领雇佣军和舰队，是亚历山大东征初期最难对付的对手。
body: |-
  罗得岛人，约生于公元前 380 年。他和兄长门托耳都是雇佣军将领，为波斯总督阿尔塔巴佐斯效力，兄弟俩的姐妹嫁给了阿尔塔巴佐斯，门托耳又娶了阿尔塔巴佐斯的女儿巴尔西涅。阿尔塔巴佐斯反叛波斯国王失败后，门农随他流亡到马其顿腓力二世的宫廷，住了若干年。后来门托耳在收复埃及的战事中立功，为他们求得赦免，门农回到小亚细亚，在特洛阿德有封地。门托耳死后，他接掌兄长的职位，并娶了巴尔西涅。

  前 336 年腓力派帕曼纽率先头部队进入小亚细亚，门农带雇佣军与之周旋，把对方逼回海峡附近。前 334 年亚历山大渡海。据阿里安和狄奥多罗斯，战前的会议上门农主张不要决战，而应后撤并烧掉庄稼和村镇，使马其顿人无粮可就，同时把战争引到希腊去。当地的波斯总督们不肯毁坏自己的辖地，决定在格拉尼库斯河迎战，结果大败，门农脱身。

  此后大流士三世任命他统领小亚细亚沿海的军队和整个舰队。他先守哈利卡纳苏斯，城破前纵火撤走。前 333 年他率舰队在爱琴海反攻，夺取希俄斯岛和莱斯博斯岛的大部分，围攻米提利尼；希腊本土一些反马其顿的人正盼着他渡海而来。围城期间他病死。继任的将领一度攻下米提利尼等地，但大流士把雇佣军调往内地，这场海上反攻逐渐瓦解。

  巴尔西涅后来在大马士革被俘。据普鲁塔克等人，她成为亚历山大的情妇，生子赫拉克勒斯；这个孩子的身世在古代就有人怀疑。
sources: []
