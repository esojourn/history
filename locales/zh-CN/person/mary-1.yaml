name: "玛丽一世"
aliases: ["玛丽·都铎", "血腥玛丽", "玛利"]
role: "英格兰女王"
summary: "亨利八世的长女，即位后使英格兰重归罗马教会，在位时约三百名新教徒被烧死。"
body: |-
  玛丽 1516 年 2 月 18 日生于格林尼治，是亨利八世与阿拉贡的凯瑟琳唯一长大的孩子。父亲与母亲离异后，她被宣布为私生女，不准见母亲，一度被逼着签字承认父亲是教会元首。弟弟爱德华在位时，她不顾禁令照旧在家里做弥撒。

  1553 年 7 月爱德华去世，她在东部集合支持者，九天之内推翻了简·格雷。《历史的轨迹》第二十八章说，她是坚定的天主教徒，前王任内通过的法案都被撤销，赞成改教的主教和教士被革职，许多改教领袖逃到欧洲大陆。1554 年 7 月她不顾议会反对，嫁给皇帝查理五世的儿子、西班牙的腓力。同年 11 月流亡多年的枢机波尔回国，代表教皇赦免全国，议会恢复了教皇的权柄和惩治异端的法律；该书指出只有一项例外，修道院的产业仍留在新主人手里。

  1555 年 2 月起开始处决异端。该书说这一年英格兰各地有七十五人被烧死，她在位期间总共约三百人，最有名的是主教拉蒂默、里德利和大主教克兰麦。按福克斯等人的记载，被烧死的在二百八十人上下，多数是伦敦和东南部的工匠、农夫，其中有五十多名妇女。该书引拉蒂默在火中对同伴说的话：我们今天要在英格兰点起一支永不熄灭的蜡烛；这句话出自福克斯《殉道史》后来的版本。

  她两次以为自己怀孕，都落了空。腓力很少住在英格兰，却把英格兰拖进对法战争，1558 年 1 月英格兰丢了在大陆的最后一块领地加来。同年 11 月 17 日她在伦敦去世；该书作 11 月 7 日。波尔在同一天死去。继位的是她的异母妹妹伊丽莎白。“血腥玛丽”是后来新教徒给她的称呼。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十八章“英国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter31.html"
recalled:
  - "福克斯《殉道史》"
  - "1554 年议会废止改教立法的法案"
  - "威尼斯使节米基耶尔的报告（1557 年）"
  - "梅钦《日记》"
