name: 隋炀帝
aliases: [杨广, 杨英, 阿摩, 隋世祖]
role: 皇帝
summary: 隋朝第二位皇帝，开凿大运河、营建东都、三征高句丽，在江都兵变中被杀。
body: |-
  杨广是隋文帝杨坚和独孤皇后的次子，北周天和四年（公元 569 年）生于长安，小字阿摩。隋朝建立后他被封为晋王。开皇八年（588 年）隋发兵伐陈，他名义上任行军元帅，实际军务由高颎主持；陈亡后他进入建康，以杀陈朝的几名佞臣博得名声。此后他长期坐镇江都，任扬州总管，与江南的士人、僧人往来，曾请天台宗的智顗为他授菩萨戒。

  他在父母面前以节俭、不近声色示人，又结交杨素，在独孤皇后的支持下逐步取得父亲的信任。开皇二十年（600 年），隋文帝废太子杨勇，立杨广为太子。仁寿四年（604 年）文帝在仁寿宫去世，杨广即位。关于文帝之死，后世有杨广弑父的说法，正史记载含糊，没有定论（另见“隋文帝”条）。

  即位后，他大兴土木：大业元年（605 年）营建东都洛阳，同年开通济渠，此后又开永济渠、江南河，把各段运河连成以洛阳为中心、北至涿郡、南到余杭的水道（另见“大运河开凿”条）。他频繁出巡，三次南下江都，北巡突厥启民可汗的牙帐，大业五年（609 年）西巡张掖，击败吐谷浑。进士科一般认为始于他在位期间（另见“科举创立”条）。

  大业八年至十年（612—614 年），他三次征伐高句丽，第一次在萨水大败，第二次因杨玄感在后方起兵而撤回，第三次高句丽遣使请降，他才收兵（另见“三征高句丽”条）。连年的兵役和徭役使民变四起。大业十一年（615 年）他北巡时被东突厥始毕可汗围困在雁门，解围后不久，于大业十二年（616 年）第三次南下江都，此后不再北返。

  大业十四年（618 年）三月，随驾的骁果军将士思归，宇文化及等人发动兵变，将他缢杀，年五十（另见“江都之变”条）。唐朝给他上的谥号是“炀”，按谥法是好内远礼、逆天虐民的意思；在洛阳的越王杨侗给他上的谥号则是明帝，庙号世祖。
sources: []
recalled:
