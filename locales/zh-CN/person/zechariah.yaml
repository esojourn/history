name: 撒迦利亚
aliases: []
role: 先知
summary: 归回后的先知，易多的孙子，与哈该同时劝勉百姓重建圣殿。
body: |-
  《撒迦利亚书》1:1 称他为易多的孙子、比利家的儿子，《以斯拉记》5:1 则简称易多的孙子。《尼希米记》12:4、12:16 的祭司名单里有易多一族，族长名叫撒迦利亚，一般认为就是这位先知，如此他也是祭司。生卒年圣经没有记载。

  他在大流士第二年八月开始传讲，比哈该晚两个月（1:1）。同年十一月二十四日夜间他见到一连串异象（1:7—6:8），其中有番石榴树中间骑马的人、四角与四个匠人、拿准绳的人、大祭司约书亚更换衣服、金灯台与两棵橄榄树、飞行的书卷、量器中的妇人和四辆车。4:6 说，成事不是倚靠势力和才能，乃是倚靠耶和华的灵。大流士第四年，有人来问被掳以来的禁食是否还要继续，他的回答记在第 7—8 章。

  第 9—14 章没有标日期，文体也与前八章不同，不少学者认为出自较晚的作者，传统看法则认为全书出于他一人。新约多次引用这几章，例如《马太福音》21:5 引 9:9 所说王骑着驴来到。圣经没有交代他的结局。
sources: []
recalled:
  - 《撒迦利亚书》第 1—14 章
  - 《以斯拉记》5:1、6:14
  - 《尼希米记》12:4、12:16
  - 《马太福音》21:5
