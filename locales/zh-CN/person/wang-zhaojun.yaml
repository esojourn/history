name: 王昭君
aliases: [王嫱, 宁胡阏氏, 明妃]
role: 宁胡阏氏
summary: 汉元帝的宫女，竟宁元年嫁给匈奴呼韩邪单于为阏氏，此后汉匈边境数十年无战事。
body: |-
  王昭君名嫱，昭君是她的字。正史中关于她的记载很少。《汉书·元帝纪》只记竟宁元年（公元前 33 年）春呼韩邪单于来朝，元帝下诏把待诏掖庭的王嫱赐给单于为阏氏。《汉书·匈奴传》说，这次来朝时单于自己提出愿做汉家的女婿，元帝便把后宫的良家女子王嫱赐给他；她到匈奴后号称“宁胡阏氏”，生了一个儿子伊屠智牙师，后来做了右日逐王。她的籍贯，《后汉书·南匈奴传》说是南郡，后世多说是南郡秭归。她的生卒年都没有记载。

  两年后（前 31 年）呼韩邪单于去世，他与另一位阏氏所生的长子继位，即复株累若鞮单于。按照匈奴的习俗，新单于娶了王昭君，两人生了两个女儿。《后汉书》说她曾上书请求回汉，成帝命她依从匈奴的习俗。她的长女后来嫁给匈奴的贵族须卜当，称须卜居次；王莽执政时，这位女儿曾被请到长安侍奉太皇太后。

  《后汉书》还说，她入宫几年见不到皇帝，心怀怨愤，自己请求出行；临行时元帝才见到她的容貌，大为惊讶，想留下又怕失信。画工毛延寿因收不到贿赂而把她画丑的故事，出自后来的《西京杂记》，不见于正史。

  她出塞以后的几十年，汉与匈奴没有发生大的战事。她的故事在后世不断被写进诗文和戏曲，如石崇的《王明君辞》、杜甫的《咏怀古迹》和元代马致远的《汉宫秋》，其中许多情节是后人添加的。今内蒙古呼和浩特市南郊有相传是她坟墓的“青冢”。
sources: []
recalled:
  - 《汉书·元帝纪》
  - 《汉书·匈奴传下》
  - 《后汉书·南匈奴列传》
  - 《西京杂记》（毛延寿故事的出处，属小说家言）
