name: "智者腓特烈"
aliases: ["腓特烈三世", "萨克森选侯", "腓勒德力"]
role: "萨克森选侯"
summary: "萨克森选侯，维滕贝格大学的创办人，始终保护路德，使他免于被押往罗马。"
body: |-
  腓特烈三世 1463 年生于托尔高，1486 年继位为萨克森选侯，是帝国七位选侯之一，后人称他“智者”。1502 年他在维滕贝格创办大学，又在城堡教堂里收藏圣物。《历史的轨迹》第二十一章说他是非常敬虔的天主教徒，收集的圣物不下五千件；按 1509 年的图录是五千多件，到 1520 年已增至一万九千件左右。每年万圣节圣物公开陈列，路德的论纲就是在万圣节前一天公布的。

  他不许台彻尔进入自己的领地卖赎罪券，免得钱财外流。1518 年教皇传路德去罗马，他出面交涉，使审问改在德意志境内的奥格斯堡进行，又为路德讨得安全保证。该书第二十二章说，1519 年皇帝死后教皇希望他当选，他自己不愿承担，转而支持查理，条件之一是帝国臣民不经审讯不得定罪。1520 年他在科隆问伊拉斯谟对路德的看法，伊拉斯谟答，路德的过错是碰了教皇的冠冕和修士的肚子。

  1521 年沃尔姆斯帝国议会之后，他派人在半路把路德“劫”到瓦特堡藏起来，自己故意不问藏在哪里。次年路德不顾他的劝阻回到维滕贝格。该书第二十三章说，两人始终没有见过面，往来都靠他的秘书施帕拉丁；按通行的说法，他只在沃尔姆斯的会场上见过路德，没有交谈过。

  他一生没有公开宣布改信。1525 年 5 月 5 日他在洛豪的猎宫去世，临终时兼领了饼和杯。继位的弟弟约翰公开支持改教。
