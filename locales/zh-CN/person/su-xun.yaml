name: 苏洵
aliases: [苏老泉, 苏明允]
role: 北宋文学家
summary: 苏轼、苏辙的父亲，以策论文章知名，与二子合称“三苏”。
body: |-
  苏洵是眉州眉山人，生于大中祥符二年（公元 1009 年）。据欧阳修为他写的墓志，他年轻时不喜读书，二十七岁才发愤用功，几次应试都没有考中，于是烧掉旧作，闭门苦读多年，精通六经和诸子百家之书。后来启蒙读物《三字经》里“苏老泉，二十七，始发愤，读书籍”说的就是他。

  嘉祐元年（1056 年）他带着两个儿子苏轼、苏辙进京，把所写的《权书》《衡论》等文章送给欧阳修。欧阳修非常赏识，向朝廷推荐，他的文章很快在京城流传。次年两个儿子同榜考中进士，“三苏”之名由此传开。他的《六国论》认为六国灭亡的原因在于割地贿赂秦国，议论犀利。后来他被任命为秘书省校书郎、霸州文安县主簿，参与编修礼书《太常因革礼》。治平三年（1066 年）书成不久，他在京城去世。他和两个儿子都被列入“唐宋八大家”。
sources: []
recalled:
  - 《宋史·文苑传·苏洵》
  - 欧阳修《故霸州文安县主簿苏君墓志铭》
  - 《嘉祐集》
