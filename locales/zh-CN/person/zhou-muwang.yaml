name: 周穆王
aliases: [姬满]
role: 周王
summary: 西周君王，在位时征伐犬戎，命作《吕刑》；晋代出土的《穆天子传》记他西游的故事。
body: |-
  周穆王姓姬名满，是周昭王之子。昭王南征楚地，死于汉水，穆王继位。《史记·周本纪》说他即位时已五十岁，在位五十五年，这些数字难以确证。夏商周断代工程把他的在位年代定为约公元前 976 年至前 922 年。

  据《国语·周语上》和《史记》，穆王要征伐犬戎，大臣祭公谋父劝谏，认为先王“耀德不观兵”，穆王不听，出兵后只得到四匹白狼、四只白鹿而回，此后荒服之地的部族不再来朝。《史记》又说穆王命甫侯（吕侯）修订刑法，就是《尚书》中的《吕刑》（又称《甫刑》），其中有赎刑的规定。

  西晋太康年间，汲郡的战国古墓中出土了竹书《穆天子传》，记述穆王驾八骏西行、在昆仑之丘会见西王母等事。此书带有很强的传说和文学色彩，不能当作史实，但它在后世流传很广，“穆王八骏”“瑶池会”成为诗文中常用的典故。
sources: []
recalled:
  - 《史记·周本纪》
  - 《国语·周语上》
  - 《尚书·吕刑》
  - 《穆天子传》
