name: 安提柯三世
aliases: [安提柯·多宋]
role: 马其顿国王
summary: 马其顿国王，以监护人身份登位，组建希腊同盟，在塞拉西亚击败斯巴达。
body: |-
  安提柯二世的侄子，父亲是有“美男子”之称的德米特里，约生于公元前 263 年。前 229 年他的堂兄弟、国王德米特里二世去世，留下八九岁的儿子腓力。这时北方的达尔达尼人入侵，色萨利大部分倒向埃托利亚人，雅典也买通驻军恢复了自由。马其顿贵族推安提柯为幼主的监护人和统帅，他娶了腓力的母亲，不久被拥立为王，但始终把腓力当作继承人。绰号“多宋”意为“将要给的人”，古人的解释是说他只许诺而不兑现。

  他先击退达尔达尼人，收复色萨利大部，前 227 年前后还率舰队远征过小亚细亚的卡里亚，原因不详。

  前 225 年斯巴达国王克列奥美涅斯三世连败亚该亚同盟。同盟的领袖阿拉托斯半生都在同马其顿为敌，这时转而求援，答应交还他亲手夺去的科林斯卫城。前 224 年安提柯率军南下，次年组织了一个包括亚该亚、彼奥提亚、色萨利、伊庇鲁斯等同盟在内的“希腊同盟”，由他任统帅，各成员保持自治。前 222 年他在塞拉西亚击败克列奥美涅斯，进入斯巴达。这是斯巴达城第一次被外敌占领。他没有破坏城市，只废除了克列奥美涅斯的新制，据波利比乌斯说是恢复了“祖传的政体”，几天后就离开了。

  他匆忙北返，是因为伊利里亚人侵入马其顿。他在会战中击败了他们，据普鲁塔克，他在阵前大声呼喊时血管破裂，此后一病不起，前 221 年去世。十七岁的腓力五世继位，接手的是一个比八年前稳固得多的王国。
sources: []
recalled:
  - 波利比乌斯《历史》卷二第 45—70 章
  - 普鲁塔克《克列奥美涅斯传》《阿拉托斯传》
