name: 塞拉门尼斯
aliases: [特拉墨涅斯]
role: 雅典政治家
summary: 两度参与寡头政权又两度与之决裂，被克里提亚斯处死。
body: |-
  雅典人，哈格农之子；哈格农是安菲波利斯的建城者。公元前 411 年他是四百人寡头政权的发起者之一。几个月后，他带头反对其中想向斯巴达出卖城邦的极端派，促成四百人垮台，改由五千名能自备武装的公民执政。修昔底德说，这是他有生以来雅典治理得最好的时期。此后他率战船在赫勒斯滂一带作战。前 406 年阿吉纽西海战后，他和色拉西布洛斯受命救援落水者而没有做到；据色诺芬，回到雅典后他反过来带头指控将军们失职，促成了那次判决。狄奥多罗斯的说法对他较为有利。

  前 405 年雅典被围，他自请出使，在吕山德那里一去三个多月，回来时城中已饿死多人。随后他作为全权使者到斯巴达，带回了拆毁长墙、交出舰队的条件。他被选入三十人之列。当克里提亚斯等人大肆杀人夺产时，他提出反对，认为应当让更多的人参与政权。克里提亚斯在议事会上指控他是叛徒，把他从名单上除名。他跳上祭坛，仍被拖走。据色诺芬，他饮下毒芹汁后，把杯中剩下的几滴泼出，像酒宴上的游戏那样说：“敬高贵的克里提亚斯。”

  他因几次转向而得了一个绰号“厚底靴”，这种靴子左右两只脚都能穿。对他的评价自古不一：吕西阿斯说他一再出卖同伴，《雅典政制》则说他是不肯附和任何违法行为的好公民。
sources: []
recalled:
