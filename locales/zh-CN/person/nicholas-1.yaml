name: 尼古拉一世
aliases:
  - 大尼古拉
  - 尼各老一世
role: 罗马主教（教皇）
summary: 858—867 年在位的教皇，主张教皇统管全教会、高于世俗君主，与佛提乌争执。
body: |-
  尼古拉约在公元 820 年生于罗马的官宦人家，在前几任教皇手下任职，858 年 4 月当选教皇，在位九年半。

  《历史的轨迹》第十章说，奥古斯丁的《上帝之城》给了他很深的印象，他决心把书中的理想实行出来；他相信所有主教都是教皇的代理人，教皇是全教会的统治者，教会高于一切世俗权势。该书认为，没有一位教皇对教皇权势作过比他更大的宣告，后来的贵格利七世和英诺森三世不过是把他宣告的付诸实行。

  他在位时有三件事最能说明这种主张。洛林国王洛泰尔二世要休掉王后另娶，863 年梅斯的主教会议迎合国王，尼古拉宣布会议无效，罢免了科隆和特里尔两位大主教，皇帝路易二世带兵到罗马施压，他也没有让步。兰斯大主教辛克马尔罢免了苏瓦松主教，尼古拉让被罢免的人向罗马上诉，并在 865 年恢复了他的职位。这时“伪伊西多尔教令集”刚在法兰克出现，其中说主教可以直接向教皇上诉；尼古拉是否知道并引用过它，学者看法不一。

  第三件事在东方。皇帝米海尔三世在 858 年撤换君士坦丁堡主教长伊格纳修，换上平信徒出身的学者佛提乌。尼古拉在 863 年的罗马会议上宣布不承认佛提乌；867 年佛提乌在君士坦丁堡开会，反过来宣布罢免尼古拉。两地又因保加利亚人归属哪一方而相争，尼古拉在 866 年写了长信答复保加利亚王的提问。这场争执是 1054 年东西教会分裂的前奏。

  尼古拉在 867 年 11 月去世，没有等到君士坦丁堡的消息传来。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十章“教皇权势的发展” https://wellsofgrace.com/books/spiritual/2000years/html/chapter12.html"
recalled:
  - 《教皇列传》尼古拉一世传
  - 尼古拉一世《书信集》（含 866 年《答保加利亚人问》）
  - 《圣贝尔坦年代记》
