name: 赵襄子
aliases: [赵无恤, 赵毋恤]
role: 晋国正卿，赵氏宗主
summary: 晋国赵氏的宗主，在晋阳之战中联合韩、魏灭掉智氏，三家分晋的格局由此形成。
body: |-
  赵襄子名无恤，是晋国正卿赵简子（赵鞅）的儿子，生年不详。据《史记·赵世家》，他的母亲是翟族的婢女，地位低下。赵简子考察诸子，告诉他们把宝符藏在常山上，谁先找到就有赏；诸子都没找到，只有无恤说，从常山上可以俯临代国，代国可以夺取。赵简子认为他贤能，废掉太子伯鲁，立无恤为继承人。

  公元前 475 年赵简子去世，无恤继位。他在服丧期间设宴请代王，派厨师用铜斗击杀了代王，随即出兵吞并代国；他的姐姐是代王夫人，得知后磨笄自杀。

  公元前 455 年，晋国执政智伯率韩、魏两家攻打赵氏，赵襄子退守晋阳。晋阳被围两年多，又被引水灌城，城中“悬釜而炊，易子而食”。赵襄子派家臣张孟谈出城游说韩康子、魏桓子，三家于公元前 453 年联手灭了智氏，瓜分其地。此后晋国国君名存实亡，韩、赵、魏三家实际上已成为独立的国家。

  智伯的家臣豫让为主报仇，两次行刺赵襄子未成，最后请求刺击赵襄子的衣服，然后伏剑自杀，留下“士为知己者死”的话（《史记·刺客列传》）。赵襄子死于公元前 425 年，他让伯鲁的孙子继承赵氏宗主之位。

  他是赵国实际上的奠基人之一。
sources: []
recalled:
  - 《史记·赵世家》
  - 《史记·刺客列传》
  - 《战国策·赵策一》
  - 《资治通鉴》卷一
