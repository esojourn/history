name: 荷马
aliases: []
role: 史诗诗人
summary: 相传为《伊利亚特》《奥德赛》的作者，生平没有可靠记载。
body: |-
  古希腊人把《伊利亚特》和《奥德赛》两部史诗归在荷马名下。关于他本人，没有同时代的记载。古代流传的几种《荷马传》都是后人所作，说他是盲人、出生在爱奥尼亚一带；士麦那、希俄斯等多座城市都自称是他的故乡。希俄斯岛上后来有一个以吟诵荷马史诗为业的家族，自称“荷马后人”。

  他的年代古人就说法不一。公元前 5 世纪的希罗多德认为，荷马和赫西俄德生活的时代比他自己早四百年，不会更早，照此推算约在前 9 世纪。现代学者多从语言和诗中反映的器物、风俗判断，两部史诗大致在前 8 世纪到前 7 世纪成形；所写的特洛伊战争，则是诗人心目中数百年前的事。

  《伊利亚特》写特洛伊战争第十年里几十天的事，以阿喀琉斯的愤怒为主线；《奥德赛》写奥德修斯战后十年漂泊、返回伊塔卡。两部诗都用六音步长短短格写成，各分二十四卷，分卷出自后来亚历山大的学者。据西塞罗等较晚的作家，雅典在庇西特拉图时代整理过史诗的文本，这一说法是否可信有争议。

  1795 年德国学者沃尔夫提出，史诗不是一人一时之作，由此引出持续两百年的“荷马问题”。20 世纪帕里和洛德研究了诗中大量重复的固定短语，指出史诗出自口头创作的传统。两部诗是否出自同一位诗人、“荷马”是否确有其人，至今没有定论。在古代希腊，荷马史诗是教育的基础，人们直接称他为“诗人”。
sources: []
recalled:
  - 希罗多德《历史》卷二第 53 章
  - 西塞罗《论演说家》卷三第 137 节
  - 沃尔夫《荷马绪论》（1795）
  - 洛德《故事的歌手》（1960）
