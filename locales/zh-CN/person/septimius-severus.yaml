name: 塞普提米乌斯·塞维鲁
aliases:
  - 塞维鲁
  - 瑟维如斯
role: 罗马皇帝
summary: 出身北非的罗马皇帝，塞维鲁王朝的建立者；在位时亚历山大等地有逼迫。
body: |-
  塞普提米乌斯·塞维鲁于公元 145 年生在北非的大莱普提斯，在今天的利比亚。公元 192 年底康茂德被杀，第二年罗马接连换了几个皇帝，当时任上潘诺尼亚总督的塞维鲁被多瑙河军团拥立，进军罗马。此后几年，他先后击败东方的尼格尔和西方的阿尔比努斯，到 197 年成为唯一的皇帝。

  他倚重军队，提高了士兵的军饷，解散了旧的禁卫军，改从各军团选人。197 至 198 年他东征帕提亚，攻下都城泰西封，在两河流域北部设了一个新行省。

  他是第一位出身北非的皇帝，妻子尤利娅·多姆娜来自叙利亚的埃梅萨。击败阿尔比努斯后，他处死了一批支持过对手的元老。他准许士兵与妻子同住，在罗马附近驻扎了一个新军团；法学家帕皮尼安、乌尔比安都在他手下任职。禁卫军长官普劳提亚努斯一度权倾朝野，205 年被杀。他大事扩建家乡大莱普提斯，罗马广场上的塞维鲁凯旋门是 203 年为纪念帕提亚之役所建。卡西乌斯·狄奥记他临终对两个儿子说：你们要和睦，让士兵发财，别的人都不必理会。

  《历史的轨迹》第二章说，马可·奥勒留死后教会平静了约七十年，其间只有塞维鲁在位时有过短期逼迫。据优西比乌《教会史》卷 6，公元 202 年前后亚历山大的逼迫很厉害，俄利根的父亲利奥尼德就在这时被杀；同一时期，迦太基有佩尔培图阿和斐丽西塔等人殉道。四世纪成书的《罗马帝王纪》说塞维鲁下过禁止人改信犹太教和基督教的诏令，这条记载是否可信，学者有争议。

  公元 208 年他带着两个儿子卡拉卡拉和盖塔到不列颠，征讨北部的部落。211 年 2 月，他病逝于埃博拉库姆，即今天的约克。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
recalled:
  - 优西比乌《教会史》卷 6 第 1—2 章
  - 《罗马帝王纪·塞维鲁传》第 17 章
  - 卡西乌斯·狄奥《罗马史》卷 75—77
  - 《佩尔培图阿与斐丽西塔殉道记》
  - 赫罗狄安《马可以后的帝国史》卷 2—3
