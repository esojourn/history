name: "丁道尔"
aliases: ["威廉·丁道尔", "廷代尔", "丁达尔"]
role: "圣经译者"
summary: "英格兰学者，第一个从希腊文、希伯来文把圣经译成英文并印行，1536 年殉道。"
body: |-
  丁道尔约 1494 年生于英格兰西部的格洛斯特郡。他在牛津得了硕士学位，《历史的轨迹》第二十八章说他先后在牛津、剑桥受教育，先接触伊拉斯谟的思想，然后是路德的。他回乡做家庭教师时，常与来访的教士争论。据福克斯的《殉道史》，他对一位教士说过：神若容我多活几年，我要使扶犁的孩子比你更懂圣经。

  英格兰自 1408 年起禁止未经主教许可翻译圣经。1523 年他到伦敦求主教滕斯托尔支持，被拒绝，次年去了德意志。1525 年他的英文新约在科隆开印，印到一半被人告发，他带着印张逃到沃尔姆斯，1526 年在那里印成。该书说译本 1525 年在德国出版，第一版印六千册；印数有三千、六千两种说法。这是第一部直接从希腊文译出的英文新约，书被夹在货物里运进英格兰，主教们收缴焚烧，滕斯托尔还出钱整批买来烧，丁道尔正好用这笔钱出修订本。

  此后他住在安特卫普，学了希伯来文，1530 年印出摩西五经，又译了约拿书和旧约的历史书。他写《基督徒的顺服》，与托马斯·莫尔笔战多年；他反对亨利八世离婚，因此也得罪了国王。

  1535 年 5 月一个叫菲利普斯的英格兰人把他骗出住所，交给皇帝的官吏，他被关在布鲁塞尔附近的菲尔福尔德城堡一年多。该书说他 1536 年 6 月殉道；他是 8 月被定为异端，10 月初被绞死后焚尸的。据福克斯，他最后的话是：主啊，求你开英格兰国王的眼睛。

  第二年亨利八世就批准了一部英文圣经在国内发行，其中新约和旧约的前半大体是丁道尔的译文。1611 年钦定本的新约，大部分字句沿用了他的。
