name: 顺治帝
aliases: [福临, 清世祖]
role: 清朝入关后的第一位皇帝
summary: 皇太极之子，六岁即位，入关后在北京即位；亲政后重用汉官，崇信佛教，二十四岁去世。
body: |-
  福临是皇太极的第九个儿子，母亲是蒙古科尔沁部出身的庄妃博尔济吉特氏，也就是后来的孝庄太后。崇德八年（1643 年）皇太极去世，诸王争位，最后由六岁的福临即位，次年改元顺治，由多尔衮和济尔哈朗辅政。顺治元年（1644 年）清军入关，多尔衮把他从盛京接到北京，十月在北京再次举行即位典礼，宣告清朝统治全国。

  顺治七年（1650 年）多尔衮去世，次年福临亲政，随即追究多尔衮的罪行，剥夺他的封号，打击他的党羽。亲政后的福临努力学习汉文和儒家经典，重用范文程、洪承畴等汉官，整顿吏治，减免部分赋税，宽缓多尔衮时期的圈地和逃人法等政策，但仍然严厉惩治江南士绅抗粮等事件。他采纳汤若望编订的《时宪历》，与汤若望关系亲密，尊称他为“玛法”（满语，意为爷爷）。

  顺治年间，南明永历政权和郑成功仍在西南、东南抗清，顺治十六年（1659 年）郑成功一度率军围攻南京，京城震动，据说福临一度想亲征。他晚年崇信佛教，与玉林通琇、木陈道忞等僧人交往。顺治十七年（1660 年）他宠爱的董鄂妃病死，他十分悲痛，据说想出家为僧。

  顺治十八年（1661 年）正月，福临患天花在北京去世，年二十四岁，遗诏立八岁的第三子玄烨为帝，由索尼、苏克萨哈、遏必隆、鳌拜四大臣辅政。民间长期流传他没有死，而是到五台山出家，学者一般不采信。他死后发布的遗诏中有罪己的内容，一般认为是孝庄太后等人借他的名义拟定的。
sources: []
recalled:
  - 《清世祖实录》
  - 《清史稿·世祖本纪》
  - 陈垣《汤若望与木陈忞》
