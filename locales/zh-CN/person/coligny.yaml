name: "科利尼"
aliases: ["加斯帕尔·德·科利尼", "科利尼海军上将"]
role: "法国海军上将、胡格诺派领袖"
summary: "法国海军上将，胡格诺派的军事领袖，1572 年圣巴多罗买大屠杀中第一个遇害。"
body: |-
  科利尼 1519 年 2 月生于卢万河畔的沙蒂永，出身大贵族，舅父是法国元帅蒙莫朗西。他年轻时在意大利和北方边境作战，1552 年受封为法国海军上将，这是个统领沿海防务的高位，并不一定出海。1557 年他守圣康坦，城破被西班牙人俘虏，关了两年。他在囚中读圣经，与加尔文通信，回国后公开加入改革宗。他还两次派人到巴西和佛罗里达，想为法国的新教徒找一块落脚的地方。

  1562 年宗教战争爆发，胡格诺派以孔代亲王为首，科利尼是他的副手。1569 年孔代在雅纳克战死，科利尼成了胡格诺军的统帅，虽然又败了一仗，仍带着残部绕行法国南部，逼近巴黎。1570 年《圣日耳曼敕令》给了胡格诺派信仰自由和四座设防的城市。《历史的轨迹》第三十章说，政府给胡格诺派几座城，使他们可以自卫。

  和约之后他回到宫廷，很得年轻的国王查理九世信任。该书说他曾担任查理和太后的总理；他没有这个职位，是御前会议的成员。他劝国王出兵尼德兰，帮助那里起事的新教徒打西班牙，太后凯瑟琳反对这场战争，也不愿儿子听他的。

  1572 年 8 月，胡格诺派的贵族齐集巴黎，参加纳瓦拉国王亨利与国王妹妹的婚礼。22 日科利尼从卢浮宫回住处的路上遭人枪击，伤了手和臂。24 日凌晨，吉斯公爵亨利带人闯进他的住处，把他刺死，尸体从窗口扔到街上。该书说，第一个遇害的就是科利尼。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
recalled:
  - "多比涅《世界史》"
  - "德图《当代史》"
  - "1570 年《圣日耳曼敕令》"
