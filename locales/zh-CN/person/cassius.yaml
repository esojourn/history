name: 卡西乌斯
aliases: [盖乌斯·卡西乌斯·隆吉努斯, 卡修斯, 加西阿斯]
role: 罗马将领、刺杀恺撒者
summary: 罗马将领，卡莱兵败后保住叙利亚，发起刺杀恺撒的密谋，腓立比战败自尽。
body: |-
  盖乌斯·卡西乌斯·隆吉努斯，罗马平民贵族，生年不详，约在公元前 86 年前后。他在罗得岛学过哲学，后来信奉伊壁鸠鲁学派。他娶塞尔维利娅的女儿尤尼娅·特尔提亚，是马尔库斯·布鲁图的妹夫。

  前 53 年他任克拉苏的财务官，随军远征帕提亚。据普鲁塔克，他劝克拉苏沿幼发拉底河行军，未被采纳。卡莱兵败后他退回叙利亚，收拢残兵，以代理总督的身份守住行省；前 51 年帕提亚人攻到安条克城下，他设伏击退。约瑟夫斯记载，他在此期间攻下加利利的塔里凯埃，把三万犹太人卖为奴隶。

  前 49 年他任保民官，内战中为庞培指挥一支舰队。法萨卢斯战后他向恺撒投降，得到宽赦，做了恺撒的副将。前 44 年他任外事大法官，职位在布鲁图之下，据说为此不满。古代作家都说刺杀恺撒的密谋由他发起，是他说动了布鲁图；他主张连安东尼一并除掉，被布鲁图否决。

  行刺之后他离开意大利前往叙利亚，那里的军团记得他当年的功劳，纷纷归附；前 43 年他在劳狄凯亚困死恺撒派的多拉贝拉。他向各地索取重税，前 42 年攻取罗得岛，夺走岛上的金银。同年他与布鲁图在萨迪斯会合，西进马其顿。

  前 42 年 10 月腓立比第一战，他的一翼被安东尼击溃，营地失守。他退到高处，看不清战场另一边布鲁图已经获胜，以为全军皆败，命被释奴隶品达罗斯杀死自己；据普鲁塔克，这一天恰是他的生日。布鲁图称他为“最后的罗马人”，把他葬在塔索斯岛。
sources: []
