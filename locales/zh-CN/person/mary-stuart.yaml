name: "玛丽·斯图亚特"
aliases: ["苏格兰女王玛丽", "玛丽一世（苏格兰）", "玛利亚"]
role: "苏格兰女王"
summary: "信天主教的苏格兰女王，1567 年被迫退位，逃到英格兰被囚十九年后处死。"
body: |-
  玛丽 1542 年 12 月 8 日生于林利思戈宫，出生六天父亲詹姆斯五世去世，她就成了女王。母亲是法国吉斯家的玛丽。1548 年她被送到法国宫廷抚养，1558 年嫁给法国王太子，次年丈夫即位为弗朗索瓦二世，她做了一年多法国王后。1560 年丈夫和母亲相继去世，苏格兰议会在她不在时改行新教。

  1561 年 8 月她回到苏格兰，时年十八岁。她承认已经改变的教会现状，只要求自己在宫里望弥撒。《历史的轨迹》第二十七章说她是个顽强的天主教徒，又美貌又能干，在位的头三年为罗马教会收复了相当多失地，后来犯了许多错误，才挽回了改教运动的命运。诺克斯在讲台上反对她的弥撒，她先后几次召见他。

  1565 年她嫁给表弟达恩利，两人不和。次年达恩利带人当着她的面杀了她的秘书里奇奥。同年她生下儿子詹姆斯。1567 年 2 月达恩利的住处被炸，他死在园中；三个月后她嫁给了被公认为主谋的博思韦尔伯爵。贵族起兵把她关在利文湖的城堡里，7 月逼她让位给一岁的儿子。她是否预知谋杀达恩利的事，凭据是几封来历可疑的“匣中信”，至今没有定论。

  1568 年她逃出来，战败后越境投奔英格兰的伊丽莎白。她有英格兰王位的继承权，英格兰的天主教徒几次密谋拥立她，伊丽莎白把她囚禁了十九年。1586 年她被查出与谋刺伊丽莎白的巴宾顿通信，受审定罪，1587 年 2 月 8 日在福瑟林盖城堡被斩首。1603 年她的儿子继承了英格兰王位。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十七章“苏格兰教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter30.html"
recalled:
  - "诺克斯《苏格兰宗教改革史》第四卷（记与女王的几次会见）"
  - "布坎南《苏格兰史》"
  - "“匣中信”（真伪有争议）"
  - "1586 年福瑟林盖审判记录"
