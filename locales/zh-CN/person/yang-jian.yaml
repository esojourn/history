name: 隋文帝
aliases: [杨坚, 那罗延, 隋高祖]
role: 皇帝
summary: 北周外戚，581 年代周建立隋朝，589 年灭陈，结束了近三百年的分裂。
body: |-
  杨坚自称弘农华阴人，是东汉太尉杨震的后代。父亲杨忠是西魏、北周的大将，位列十二大将军，曾被赐鲜卑姓普六茹。西魏大统七年（公元 541 年），杨坚生于冯翊的般若寺，由尼姑智仙抚养到十三岁，小名那罗延。他承袭父亲的爵位为隋国公，长女杨丽华是周宣帝的皇后。

  大象二年（580 年）周宣帝去世，八岁的周静帝即位，宣帝的近臣刘昉、郑译假传诏命，让杨坚辅政。相州总管尉迟迥、郧州总管司马消难、益州总管王谦先后起兵反对他，都在半年内被平定。次年二月，他接受周静帝禅位，建立隋朝，年号开皇，随即诛杀北周宗室。开皇二年（582 年）起，他在汉长安城东南营建新都大兴城。

  开皇三年（583 年），隋军大败突厥，他又采用长孙晟的计策离间突厥诸部，突厥从此分裂为东西两部。开皇七年（587 年）他废除了江陵的后梁；开皇八年（588 年）冬发兵伐陈，次年正月攻入建康，陈朝灭亡，自西晋末年以来近三百年的分裂局面结束（另见“隋灭陈”条）。

  他在制度上做了许多改革：中央设立尚书、内史、门下三省和吏、礼、兵、刑、民、工六部；地方把州、郡、县三级改为州、县两级，精简官员；制定《开皇律》；通过“大索貌阅”和“输籍法”清查户口，国家掌握的人口大增；废除九品中正制，地方官的僚属改由中央任免。科举制度的起源一般追溯到隋朝，但具体从哪一年开始，史家看法不一。

  他生活节俭，与独孤皇后感情深厚。晚年他猜忌功臣，开皇二十年（600 年）废太子杨勇，改立次子杨广。仁寿四年（604 年）七月，他在仁寿宫去世，年六十四。关于他的死，后世有杨广弑父的说法，正史记载含糊，没有定论。
sources: []
recalled:
