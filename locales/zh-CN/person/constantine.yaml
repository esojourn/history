name: 君士坦丁
aliases:
  - 君士坦丁一世
  - 君士坦丁大帝
role: 罗马皇帝
summary: 第一位信奉基督教的罗马皇帝，颁布米兰敕令，召开尼西亚会议，建君士坦丁堡。
body: |-
  君士坦丁约在公元 272 年生于奈苏斯，即今天塞尔维亚的尼什。父亲君士坦提乌斯是军官，后来成为四帝之一；母亲海伦娜出身低微。父亲升任“恺撒”后，他留在东方戴克里先和伽列里乌斯的宫廷里，实际上是人质。公元 305 年他赶到西方与父亲会合。306 年 7 月父亲死在不列颠的埃博拉库姆，军队当场拥立他为帝，他由此控制了不列颠、高卢和西班牙。

  公元 312 年，他率军越过阿尔卑斯山进入意大利，攻打占据罗马的马克森提乌斯。10 月 28 日两军在罗马城北的米尔维安桥决战，马克森提乌斯兵败，淹死在台伯河里。关于战前的异象，当时有两种记载。拉克坦提乌斯说，君士坦丁在梦中受指示，把基督的记号画在士兵的盾牌上。优西比乌在《君士坦丁传》里说，皇帝亲口告诉他，自己和全军在午后看见太阳上方有光的十字架，旁边有字“靠此得胜”，夜里又梦见基督。《历史的轨迹》第四章讲的是后一种说法，书中把那句话的拉丁文说成希腊文，是一处小误。

  公元 313 年初，他在米兰与东方的皇帝李锡尼会面，约定给基督徒和所有人以信仰自由，归还教会被没收的产业，后世称为米兰敕令。此后他免除神职人员的公役，拨款兴建教堂，321 年下令星期日城里停工。324 年他击败李锡尼，成为全帝国唯一的皇帝。

  为了平息亚流引起的争论，他在 325 年召集各地主教到尼西亚开会，亲自到场。会议定了亚流的罪，但他后来又召回亚流，放逐了亚他那修。《历史的轨迹》指出，皇帝给教会自由和好处，同时也要干预教会的事务，政教关系的种种问题由此开始；又说成千上万的人为了好处涌进教会，教会在数量上的所得成了质量上的所失。

  公元 326 年，他处死了长子克里斯普，不久皇后法乌斯塔也死了，原因史料说法不一。330 年，他把在拜占庭旧城上扩建的新都落成，定名君士坦丁堡。他一直到临终才受洗，施洗的是尼科米底亚主教优西比乌。337 年 5 月 22 日，他死在尼科米底亚附近。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四章“教会全面得胜” https://wellsofgrace.com/books/spiritual/2000years/html/chapter05.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第五章“教会日形稳固” https://wellsofgrace.com/books/spiritual/2000years/html/chapter06.html"
recalled:
  - 拉克坦提乌斯《论迫害者之死》第 44、48 章
  - 优西比乌《君士坦丁传》卷 1 第 27—32 章、卷 3 第 6—14 章、卷 4 第 61—64 章
  - 优西比乌《教会史》卷 10 第 5 章
  - 佐西莫斯《新历史》卷 2
