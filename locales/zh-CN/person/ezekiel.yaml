name: 以西结
aliases: []
role: 先知、祭司
summary: 祭司出身的先知，随约雅斤被掳，在巴比伦迦巴鲁河边见异象。
body: |-
  布西的儿子，祭司（《以西结书》1:3）。他在约雅斤王被掳的那批人中，住在迦勒底人之地迦巴鲁河边被掳的人中间，地名提勒亚毕（3:15）。书的开头记着第三十年四月初五日，又说那是约雅斤王被掳去第五年（1:1–2），约当公元前 593 年；第三十年从何算起，书中没有说明，有人认为指他的年龄，没有定论。那一天他见天开了，看见四个活物、轮子和宝座的异象，受差遣向以色列家说话。他的生卒年圣经没有记载。

  第 4—24 章是耶路撒冷陷落之前的预言。他奉命以种种举动作预兆：在砖上画耶路撒冷城并摆出围困的阵势，向左侧卧三百九十日、向右侧卧四十日，剃下须发分成三份处置，挖通墙把被掳时用的物件带出去。第 8—11 章记他在异象中被带到耶路撒冷，看见殿中拜偶像的事和耶和华的荣耀离开圣殿。据 24:1–2，第九年十月初十日巴比伦王围困耶路撒冷那天，他受命记下这日子；同一章记他的妻子忽然死去，他奉命不可悲哀哭泣，以此作百姓的预兆（24:15–24）。

  第 25—32 章是论亚扪、摩押、以东、推罗、埃及等国的预言。被掳之后十二年十月初五日，有人从耶路撒冷逃到他那里，说城已攻破（33:21）。此后的预言转向复兴：以色列的牧人和羊群（第 34 章）、平原上的枯骨复生（第 37 章）、歌革来犯而败亡（第 38—39 章）。第 40—48 章记被掳第二十五年他在异象中所见的圣殿、祭礼和各支派分地的情形。

  书中标明的最晚日期是第二十七年正月初一日（29:17），约当公元前 571 年。他此后的经历和去世，圣经没有记载。
sources: []
recalled:
  - 《以西结书》第 1—48 章（纪年见 1:1–3、24:1、29:17、33:21、40:1）
