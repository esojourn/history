name: 光绪帝
aliases: [载湉, 清德宗]
role: 清朝第十一位皇帝
summary: 慈禧太后的外甥，四岁即位，1898 年推行戊戌变法，失败后被囚禁于瀛台。
body: |-
  载湉是醇亲王奕譞的儿子，母亲是慈禧太后的妹妹。同治帝去世后，慈禧太后立四岁的载湉为帝，次年改元光绪，两宫太后继续垂帘听政。他自幼由翁同龢等人教授读书。光绪十五年（1889 年）他大婚后亲政，但朝政大权仍在慈禧太后手中。

  光绪二十年（1894 年）中日甲午战争爆发，光绪帝主战，清朝战败，被迫签订《马关条约》（另见“甲午战争”条）。战败后，他受到康有为等人维新主张的影响，认为必须变法图强。光绪二十四年（1898 年）六月，他颁布“明定国是诏”，开始变法，此后一百零三天里发布了一系列诏令，涉及教育、经济、军事、官制等方面，史称“百日维新”。九月，慈禧太后发动政变，光绪帝被囚禁在中南海的瀛台，变法失败（另见“戊戌变法”条）。

  此后慈禧一度打算废掉他，另立大阿哥溥儁，因各国公使不支持等原因作罢。光绪二十六年（1900 年）八国联军攻入北京，他随慈禧逃往西安，次年回京，仍处在被软禁的状态。据说他的宠妃珍妃在逃离北京前被慈禧下令投井而死。

  光绪三十四年（1908 年）十月二十一日，光绪帝在瀛台涵元殿去世，年三十八岁，次日慈禧太后也去世。他的死因长期存在争议，2008 年有关机构对他的遗发等进行检测，报告认为他死于急性砷（砒霜）中毒。至于是谁下的毒，有慈禧、袁世凯、李莲英等不同推测，没有定论。
sources: []
recalled:
  - 《清德宗实录》
  - 《清史稿·德宗本纪》
  - 《翁同龢日记》
