name: 金日磾
aliases: [金翁叔, 秺侯]
role: 车骑将军
summary: 匈奴休屠王太子，降汉后为武帝近侍数十年，受遗诏与霍光等共同辅佐昭帝。
body: |-
  据《汉书·霍光金日磾传》，金日磾字翁叔，本是匈奴休屠王的太子。元狩二年（公元前 121 年）霍去病两次攻入河西，浑邪王与休屠王谋划降汉，休屠王中途反悔，被浑邪王所杀。日磾和母亲、弟弟一同被没入官府，分派到黄门养马，这一年他十四岁。

  后来武帝在宴游时检阅马匹，见他相貌庄重，所养的马又肥壮，问明身世后当日就任命他为马监，以后升为侍中、驸马都尉、光禄大夫，常在左右。本传说因为休屠王曾制作金人祭天，武帝赐他姓金。他的长子自幼受武帝喜爱，长大后在殿下与宫人嬉戏，他认为不合礼法，亲手把儿子杀了。

  征和年间，侍中莽何罗图谋行刺，清晨持刀闯入武帝的卧室，日磾察觉后抱住他大声呼喊，把他摔到殿下，武帝得以脱险。后元二年（前 87 年）武帝临终，他与霍光、上官桀、桑弘羊同受遗诏辅佐幼主，任车骑将军。始元元年（前 86 年）他病重时才接受秺侯的封爵，次日去世，陪葬茂陵。他的子孙在西汉后期世代任宫中近臣。
sources: []
recalled:
  - 《汉书·霍光金日磾传》
