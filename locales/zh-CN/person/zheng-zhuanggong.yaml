name: 郑庄公
aliases: [姬寤生]
role: 郑国国君
summary: 春秋初年郑国国君，平定共叔段之乱，在繻葛之战中射伤周桓王。
body: |-
  郑庄公名寤生，是郑武公之子，生于公元前 757 年，前 743 年即位。郑国是西周末年才受封的姬姓诸侯，郑武公在平王东迁时有功，并把国都迁到今河南新郑一带。

  据《左传》隐公元年，庄公出生时难产，母亲武姜因此厌恶他，偏爱小儿子共叔段，屡次请求立段为太子。庄公即位后，武姜为段请求封在京邑，段在京邑扩大城池、聚集兵力，准备袭击国都，武姜打算做内应。庄公一直隐忍，等到段起兵，才派兵讨伐，段逃到鄢，又出奔共国。这就是《春秋》所记的“郑伯克段于鄢”。庄公把母亲安置到城颍，发誓“不及黄泉，无相见也”，后来经颍考叔劝说，掘地见泉，在隧道中与母亲相见。

  庄公同时担任周王室的卿士。周平王想分他的权，双方互相猜疑，交换人质，即“周郑交质”。周桓王即位后夺去庄公的卿士之职，庄公不再朝见。公元前 707 年，桓王率陈、蔡、卫等国军队伐郑，庄公在繻葛迎战，大败王师，郑将祝聃射中桓王的肩膀。庄公当晚派人去慰问桓王。此战之后，周天子的权威一落千丈。

  庄公在位四十三年，与齐、鲁结盟，屡次征伐宋、卫、许等国，后人称他为春秋初年的“小霸”。他死于公元前 701 年，此后郑国因公子争立而陷入内乱。
sources: []
recalled:
  - 《左传》隐公元年
  - 《左传》桓公五年
  - 《史记·郑世家》
