name: 亚们
aliases: []
role: 南国犹大王
summary: 玛拿西的儿子，在耶路撒冷作王二年，被臣仆杀于宫中，子约西亚继位。
body: |-
  犹大王玛拿西的儿子，母亲米舒利密是约提巴人哈鲁斯的女儿。据《列王纪下》21:19–22，他登基时二十二岁，在耶路撒冷作王二年；经文说他行耶和华眼中看为恶的事，与他父亲玛拿西所行的一样，事奉他父亲所事奉的偶像，离弃耶和华。《历代志下》33:23 说他不像他父亲那样在耶和华面前自卑，反倒越发犯罪。

  据《列王纪下》21:23–24，亚们的臣仆背叛他，在宫里把他杀了；国民又杀了所有背叛亚们王的人，立他八岁的儿子约西亚接续作王。他葬在乌撒的园内自己的坟墓里（21:26）。史料所载仅此。
sources: []
recalled:
  - 《列王纪下》21:18–26
  - 《历代志下》33:20–25
