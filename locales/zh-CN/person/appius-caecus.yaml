name: 阿庇乌斯·克劳狄乌斯·凯库斯
aliases: [阿庇乌斯·克劳狄乌斯, 失明者阿庇乌斯, 盲人阿庇乌斯]
role: 罗马监察官、执政官
summary: 罗马监察官，修阿庇亚大道和第一条引水渠，晚年失明，力拒与皮洛士议和。
body: |-
  阿庇乌斯·克劳狄乌斯·凯库斯，罗马贵族，约生于公元前 340 年，是早期罗马史上第一个生平大体可考的人物。“凯库斯”意为“盲人”，是他晚年失明后得的绰号。

  前 312 年他任监察官，这是他最著名的任职。他修建了罗马第一条引水渠（阿庇亚水渠），把城东的泉水经地下渠道引入城内；又主持修筑从罗马通往卡普亚的大道，即阿庇亚大道，使罗马军队在萨莫奈战争期间可以快速进入坎帕尼亚。据李维，他修订元老名单时把被释奴隶的儿子列入元老院，又允许没有土地的城市居民登记到任何一个部落，改变了部落大会里的力量对比；同僚任满辞职，他却拒绝按十八个月的期限卸任。这些做法在贵族中非议很多，后来的监察官把无地的人重新归入城内的四个部落。前 304 年，他的书记、被释奴隶之子格奈乌斯·弗拉维乌斯公布了诉讼程式和可以开庭的日历，这些原先只有祭司掌握。

  他在前 307 年和前 296 年两任执政官，在萨莫奈和伊特鲁里亚作战，又任过大法官和独裁官。前 280 年皮洛士在赫拉克利亚取胜后派基涅阿斯到罗马议和，元老院有意接受。据普鲁塔克，年老失明的阿庇乌斯让儿子们把他抬进元老院，发言反对：只要皮洛士还留在意大利，就不同他谈判。元老院因此拒绝了和议。西塞罗说这篇演说在他的时代还有文本流传。

  他也是已知最早的拉丁文作者之一，写过一部格言集，只存零星几句，其中有“人人都是自己命运的工匠”。
sources: []
recalled:
  - 李维《建城以来史》卷九第 29、46 章，卷十
  - 普鲁塔克《皮洛士传》第 18—19 章
  - 西塞罗《论老年》《布鲁图斯》
  - 弗朗提努斯《论罗马城的供水》卷一
