name: 晋安帝
aliases: [司马德宗]
role: 皇帝
summary: 晋孝武帝长子，不能言语理事，在位二十余年间权臣迭起，最后被刘裕派人缢杀。
body: |-
  司马德宗是晋孝武帝的长子。《晋书·安帝纪》说他从小到大不会说话，连冷热饥饱也分辨不清，饮食起居都要别人照料，弟弟琅邪王司马德文常在身边服侍。太元二十一年（公元 396 年）孝武帝死，他即位，朝政先后由叔父司马道子和堂弟司马元显掌握。

  他在位期间，王恭、殷仲堪等方镇两次起兵，孙恩在三吴起事，朝廷号令所及越来越小。元兴元年（402 年）桓玄攻入建康，次年十二月篡位，把他降为平固王，迁到寻阳。元兴三年刘裕等人起兵讨伐桓玄，桓玄带着他西逃江陵；桓玄败死后，他在义熙元年（405 年）被迎回建康。

  此后大权归于刘裕。义熙十四年十二月（已入公元 419 年），刘裕派人把他缢死在宫中，时年三十七，改立司马德文，即晋恭帝。《晋书》说刘裕这样做是因为当时流传“昌明之后有二帝”的谶语，要凑足两位皇帝之数再行禅代。
sources: []
recalled:
  - 《晋书·安帝纪》
  - 《资治通鉴》卷一百零八至一百一十八
