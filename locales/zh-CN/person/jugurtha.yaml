name: 朱古达
aliases: [尤古尔塔, 朱古尔塔]
role: 努米底亚国王
summary: 努米底亚国王，杀堂兄弟夺位，靠贿赂和游击与罗马周旋七年，终被出卖。
body: |-
  努米底亚王马西尼萨之孙，马斯塔纳巴尔与妾所生，约生于公元前 160 年。伯父米基普萨国王把他养在宫中。前 134 年米基普萨派他率努米底亚骑兵去西班牙，在小西庇阿麾下参加努曼提亚之围；他在那里结识了不少罗马贵族青年，据萨卢斯特，他从他们那里听说“在罗马什么都可以买到”。小西庇阿写信向米基普萨称赞他，米基普萨把他收为养子。

  前 118 年米基普萨去世，王国由朱古达和两个亲生儿子希延普萨尔、阿德赫巴尔共同继承。朱古达当年派人杀死希延普萨尔，又击败阿德赫巴尔，后者逃到罗马申诉。元老院派使团把王国一分为二。前 112 年朱古达再度进攻，把阿德赫巴尔围困在基尔塔；城破后他杀死阿德赫巴尔，城中帮助守城的意大利商人也被杀。罗马舆论哗然，次年出兵。

  前 111 年执政官贝斯提亚与他草草议和，罗马人怀疑其中有贿赂。保民官梅米乌斯把他传到罗马作证，另一名保民官否决了讯问；他在罗马期间派人刺杀了一个有资格争位的堂兄弟，被勒令离境。萨卢斯特说他出城时回头说道：“一座待售的城市，只要找到买主就注定灭亡。”前 110 年他迫使一支罗马军队投降，从轭下走过。前 109 年起梅特卢斯整顿军纪，在穆图尔河击败他，逐城攻取；他转入游击，联合岳父、毛里塔尼亚国王博库斯。前 107 年马略接任，战事又拖了两年。

  前 105 年，马略的财务官苏拉前往博库斯处交涉，博库斯设计把朱古达交给罗马人。前 104 年 1 月 1 日，他身披王服走在马略的凯旋式队伍中，随后被投入图利亚努姆地牢，几天后死在牢中，一说饿死，一说被绞死。萨卢斯特的《朱古达战争》是这场战争的主要史料，他写这本书意在揭露贵族的腐败，对贿赂的作用可能有所夸大。
sources: []
recalled:
  - 萨卢斯特《朱古达战争》
  - 普鲁塔克《马略传》第 7—12 章、《苏拉传》第 3 章
  - 李维《建城以来史》卷六十二至卷六十七摘要
