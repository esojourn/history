name: 晋愍帝
aliases: [司马邺, 孝愍皇帝]
role: 皇帝
summary: 西晋末代皇帝，在残破的长安即位，被刘曜围困后出降，西晋灭亡。
body: |-
  司马邺是晋武帝的孙子、吴王司马晏之子，过继给伯父秦王司马柬，袭封秦王。永嘉五年（公元 311 年）洛阳陷落，他才十二岁，逃出后被荀藩、阎鼎等大臣拥护着辗转西行，次年进入晋军刚刚收复的长安，被立为皇太子。永嘉七年（313 年）怀帝遇害的消息传来，他即皇帝位，改元建兴。

  当时的长安久经战乱。《晋书·愍帝纪》说城中住户不满一百，杂草丛生，朝廷的车只有四辆，百官没有官服和印绶。朝政由索綝、麹允主持，各地方镇的援兵多不能到。建兴四年（316 年）八月，汉国的刘曜包围长安，城中粮尽，人相食。十一月，他乘羊车出城投降，被送到平阳。

  刘聪封他为怀平侯，出猎时让他穿着戎服执戟在前开路，宴会上让他斟酒、洗杯。建武元年十二月（已入公元 318 年），他被刘聪杀害，时年十八。因为避他的名讳，建业从他即位那年起改称建康。
sources: []
recalled:
  - 《晋书·愍帝纪》
  - 《资治通鉴》卷八十八至九十
