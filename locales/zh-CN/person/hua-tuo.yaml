name: 华佗
aliases: [华元化, 华旉]
role: 医学家
summary: 汉末名医，精于方药、针灸，史载他用麻沸散施行外科手术，后被曹操所杀。
body: |-
  据《三国志·魏书·方技传》，华佗字元化，一名旉，沛国谯县人。他到徐州一带游学，通晓几部经书。沛相陈珪举他为孝廉，太尉黄琬征召，他都没有应召。他的生年史书没有记载。

  本传记录了他的十几则医案。他用药不过数种，针灸也只取一两处；遇到针药不能及的病，就让病人用酒服下“麻沸散”，等病人失去知觉，再剖开腹背、切除病处，缝合后敷上药膏，四五天伤口愈合，一个月内平复。麻沸散的配方没有流传下来。他还教弟子吴普做“五禽之戏”，模仿虎、鹿、熊、猿、鸟的动作活动身体；另一位弟子樊阿擅长针术。

  曹操患头风病，发作时华佗施针即止，于是把他留在身边。华佗离家日久想要回去，借口取药方回乡，又推说妻子有病，多次逾期不返。曹操派人查看，发现其妻是装病，便把华佗逮捕，押到许都的监狱。荀彧为他求情，曹操不听，华佗死于狱中。本传说他临死前拿出一卷书交给狱吏，说这可以救人，狱吏怕受牵连不敢接受，华佗便要来火把书烧了。

  华佗被杀的确切年份不详。本传说后来曹操的爱子曹冲病重，曹操后悔杀了华佗；曹冲死于建安十三年（公元 208 年），华佗之死应在此前不久。
sources: []
recalled:
  - 《三国志·魏书·方技传》（华佗）
  - 《后汉书·方术列传》（华佗）
