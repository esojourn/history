name: 楚庄王
aliases: [熊侣, 熊旅]
role: 楚国国君，春秋霸主
summary: 楚国国君，“一鸣惊人”，曾问周鼎轻重，在邲之战中大败晋军而称霸。
body: |-
  楚庄王名侣（一作旅），是楚穆王之子，公元前 613 年即位，生年不详。据《史记·楚世家》，他即位三年不出号令，日夜作乐，并下令有敢进谏者死。大夫伍举以隐语进谏：有一只鸟在山上，三年不飞不鸣，这是什么鸟？庄王回答：“三年不蜚，蜚将冲天；三年不鸣，鸣将惊人。”此后他亲理政事，诛杀数百人，提拔数百人，任用伍举、苏从，国人大悦。成语“一鸣惊人”由此而来；《韩非子》把进谏者记为右司马，细节略有不同。

  公元前 606 年，庄王伐陆浑之戎，陈兵于周的边境，周定王派王孙满去慰劳，庄王问周鼎的大小轻重。王孙满回答“在德不在鼎”，又说“周德虽衰，天命未改，鼎之轻重，未可问也”（《左传》宣公三年）。“问鼎”一词由此而来。次年他平定了若敖氏的叛乱。

  庄王任用孙叔敖为令尹，国力大增。公元前 597 年，楚围郑，晋军来救，两军战于邲，晋军大败。有人建议收晋军尸体筑成“京观”炫耀武功，庄王说“夫文，止戈为武”，拒绝了（《左传》宣公十二年）。前 595 年至前 594 年，楚军围宋九个月，宋人“易子而食，析骸以爨”，最后两国讲和。此时中原诸侯多服从楚国，庄王被后世列为“春秋五霸”之一。

  庄王死于公元前 591 年，儿子共王继位。
sources: []
recalled:
  - 《史记·楚世家》
  - 《左传》宣公三年
  - 《左传》宣公十二年
  - 《左传》宣公十五年
  - 《韩非子·喻老》
