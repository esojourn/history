name: "爱德华六世"
aliases: ["爱德华第六"]
role: "英格兰国王"
summary: "亨利八世之子，九岁即位，在位六年间英格兰教会在教义和礼仪上改行新教。"
body: |-
  爱德华 1537 年 10 月 12 日生于汉普顿宫，是亨利八世与第三个妻子简·西摩的儿子，母亲产后十几天去世。他由倾向新教的学者教读，学了拉丁文、希腊文和法文。1547 年 1 月父亲去世，他九岁即位。

  《历史的轨迹》第二十八章说，他由舅父萨默塞特公爵摄政，摄政与新政府都倾向改教，在他短暂的在位时期，教会的管理制度变动不大，教义和礼拜却有不少变革：1547 年议会准许信徒兼领饼和杯，次年初下令挪走教堂里的图像，再过一年准许教士结婚。1549 年颁行克兰麦主编的第一部英文《公祷书》；该书说这一版谁也不满意，守旧的嫌改了，赞成改教的嫌改得不够。同年西南部为此起事。萨默塞特失势，诺森伯兰公爵当权，1552 年颁行修订的《公祷书》，1553 年公布《四十二信条》。各地为亡者做弥撒的小堂被撤销，产业充公。

  他从小认真，自己记日记，听讲道时做笔记。1553 年初他病倒，自知不起，不愿信天主教的姐姐玛丽继位，在诺森伯兰主持下立文书把王位传给表亲简·格雷。7 月 6 日他在格林尼治去世。该书说他死时十六岁，实为十五岁。简·格雷只做了九天女王，玛丽就在民众拥护下进了伦敦。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十八章“英国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter31.html"
recalled:
  - "爱德华六世《日记》"
  - "1549、1552 年《信仰划一法》"
  - "爱德华六世《王位继承安排》（1553 年）"
