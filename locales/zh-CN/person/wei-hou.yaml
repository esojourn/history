name: 韦后
aliases: [韦皇后, 顺天皇后]
role: 皇后
summary: 唐中宗的皇后，随中宗幽居房州，中宗复位后干预朝政，710 年在唐隆政变中被杀。
body: |-
  韦后是京兆万年人，父亲韦玄贞。李显为太子时她是太子妃，李显即位后立为皇后。嗣圣元年（公元 684 年）李显因要提拔韦玄贞而被武则天废黜，她随李显迁往房州，在幽居的十余年中与李显相依为命，李显因此对她感激而依从。

  神龙元年（705 年）中宗复位，她再次成为皇后，效法武则天在帘后参与朝政，与武三思结交，女儿安乐公主也恃宠卖官。景龙元年（707 年）太子李重俊起兵杀武三思后，曾攻到宫门要捉拿她和安乐公主，兵败被杀。此后她的权势更大，朝中多有她的亲信。

  景龙四年（710 年）六月中宗暴卒，旧史说是她与安乐公主下毒所致，但有学者认为证据不足。她立中宗的幼子李重茂为帝，自己临朝摄政，以韦氏子弟统领禁军。不到二十天，临淄王李隆基与太平公主联合起兵，攻入宫中，她逃入飞骑营，被士兵斩首，安乐公主也被杀。事后她被追贬为庶人（另见“唐隆政变”条）。
sources: []
recalled:
  - 《旧唐书·后妃传》
  - 《新唐书·后妃传》
  - 《资治通鉴》卷二百八至二百九
