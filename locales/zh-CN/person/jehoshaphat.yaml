name: 约沙法
aliases: []
role: 南国犹大王
summary: 亚撒之子，派人在各城教导律法、设立审判官，与北国亚哈家结亲。
body: |-
  犹大王亚撒的儿子，母亲名叫阿苏巴。据《列王纪上》22:41–42，他登基时三十五岁，在耶路撒冷作王二十五年；出生地圣经没有记载。《列王纪》说他行他父亲亚撒所行的道，只是丘坛还没有废去（22:43）。据《历代志下》17:7–9，他在位第三年差遣臣子、利未人和祭司带着耶和华的律法书，走遍犹大各城教训百姓；19:5–11 又记他在各坚固城设立审判官，在耶路撒冷另设处理争讼的人。

  他与以色列王和好（《列王纪上》22:44），并与亚哈结亲（《历代志下》18:1），他的儿子约兰娶了亚哈的女儿（《列王纪下》8:18）。他应亚哈之邀同去攻打基列的拉末，在阵上被亚兰的车兵长误认作以色列王，呼喊起来才得脱身（《列王纪上》22:29–33）；回来后，先见耶户责备他帮助恶人（《历代志下》19:2）。《列王纪下》第 3 章还记载他与以色列王约兰、以东王一同出兵攻打摩押。

  《历代志下》第 20 章记载，摩押人、亚扪人和西珥山的人来攻犹大，约沙法宣告全国禁食，在圣殿里祷告；次日他派歌唱的人走在军前，敌军自相击杀，犹大人后来在比拉迦谷称颂耶和华。他晚年与以色列王亚哈谢合伙造船，船在以旬迦别破坏，没有成行（《列王纪上》22:48–49；《历代志下》20:35–37）。他死后葬在大卫城，儿子约兰接续作王。
sources: []
recalled:
  - 《列王纪上》第 22 章
  - 《列王纪下》第 3 章、8:18
  - 《历代志下》第 17—20 章
