name: 梁启超
aliases: [卓如, 任公, 饮冰室主人]
role: 维新派代表人物、思想家、学者
summary: 康有为的弟子，参与戊戌变法，流亡日本后办报宣传新思想，影响了一代人。
body: |-
  梁启超是广东新会人，十七岁考中举人，次年拜康有为为师，在万木草堂学习。光绪二十一年（1895 年）他随康有为参加“公车上书”。次年他在上海主编《时务报》，发表《变法通议》等文章，文笔流畅，感情充沛，被称为“时务文体”，名声大振。光绪二十三年（1897 年）他到湖南时务学堂任中文总教习，与谭嗣同等人一起宣传变法。

  光绪二十四年（1898 年）戊戌变法期间，他被光绪帝召见，赏六品衔，负责办理译书局事务。政变发生后，他在日本公使馆的帮助下逃往日本（另见“戊戌变法”条）。此后他在日本先后创办《清议报》《新民丛报》，介绍西方的政治学说、历史和思想，提出“新民说”，倡导“史界革命”“诗界革命”“小说界革命”。他的文章被称为“新民体”，在知识界影响极大。在政治上他主张君主立宪，与革命派展开了激烈的论战。

  辛亥革命后，梁启超回国，组织进步党，一度在袁世凯政府中任司法总长。1915 年袁世凯称帝，他发表《异哉所谓国体问题者》予以反对，并与他的学生蔡锷策划护国战争。此后他任段祺瑞政府的财政总长，不久退出政界，专心著述和讲学，在清华学校研究院任导师。他一生著述极多，后人编为《饮冰室合集》。1929 年他在北京去世。
