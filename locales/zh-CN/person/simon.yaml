name: 西门
aliases:
  - 西门·塔西
role: 大祭司、统治者
summary: 玛他提亚次子，使犹太免于向塞琉古纳贡，开创哈斯蒙尼王朝。
body: |-
  玛他提亚的次子，犹大和约拿单的兄长，《马加比一书》2:3 说他“称为塔西”，生年没有记载。父亲临终时嘱咐众子听从他的谋略（2:65）。

  约拿单被特黎丰扣押后，西门被推为首领（13:1–9）。他转而支持德米特里二世，换得免除贡赋。《马加比一书》13:41–42 记塞琉古纪元 170 年（公元前 142 年）“外邦人的轭从以色列除去”；次年他攻下耶路撒冷的塞琉古卫城（13:49–52）。塞琉古纪元 172 年，民众大会立他为领袖和大祭司，“直到有可靠的先知兴起”（14:27–47）。塞琉古纪元 177 年细罢特月，他在耶利哥附近的多克堡赴宴，与两个儿子一同被女婿多利买杀害（16:11–17），换算为公元前 134 年初，一说前 135 年。其子约翰·许尔堪继位。
sources:
  - 《马加比一书》2:3、2:65、第 13—16 章
  - 约瑟夫斯《犹太古史》卷 13 第 6 章第 7 节至第 7 章第 4 节 https://penelope.uchicago.edu/josephus/ant-13.html
  - Wikipedia, "Simon Thassi" https://en.wikipedia.org/wiki/Simon_Thassi
