name: 德摩斯梯尼
aliases: [狄摩西尼]
role: 演说家、政治家
summary: 雅典演说家，毕生主张抵抗马其顿，代表作有《反腓力辞》和《金冠辞》。
body: |-
  雅典人，属派阿尼亚村社，生于公元前 384 年。父亲与他同名，经营造剑和制床的作坊，在他七岁时去世，留下相当多的财产。几位监护人把遗产挥霍侵吞殆尽。他成年后跟专长继承案件的演说家伊赛奥斯学习，约二十岁时起诉监护人阿佛玻斯等并胜诉，但追回的很少。普鲁塔克说他天生口齿不清、气息短，于是口含石子练习，对着海浪朗诵，还在地下室里闭门苦练；这些故事出自几百年后的传记。此后他以代写法庭讲稿为业，并逐渐参与政事。

  前 351 年他发表第一篇《反腓力辞》，提醒雅典人注意马其顿国王腓力二世的扩张，要求公民亲自服役而不是依赖雇佣军。前 349 年腓力进攻奥林托斯，他连作三篇《奥林托斯辞》呼吁救援，雅典出兵迟缓，奥林托斯于次年陷落。前 346 年他与埃斯基涅斯等十人出使马其顿，订立《菲洛克拉底和约》；回来后他指责同僚受贿误国，前 343 年正式控告埃斯基涅斯，后者以微弱票数获判无罪。前 341 年的第三篇《反腓力辞》说腓力早已在事实上开战。前 340 年两国再度交兵。前 339 年腓力南下占据埃拉提亚，雅典震恐，他提议并亲自出使，说服世仇底比斯与雅典结盟。前 338 年联军在喀罗尼亚战败，他作为重装步兵在阵中，随众人败退。雅典人仍推他为阵亡者致悼词。

  前 336 年克特西丰提议为他加金冠以表彰其功，埃斯基涅斯控告此议违法。案子拖到前 330 年才开审，他为克特西丰辩护的《金冠辞》回顾了自己的全部政策，说雅典即使预知结局也应当这样做。埃斯基涅斯得票不到五分之一，离开了雅典。

  前 324 年，亚历山大的司库哈帕洛斯携巨款逃到雅典，款项在保管期间少了一半，战神山议事会调查后指德摩斯梯尼收了二十塔兰特。他被判罚款五十塔兰特，无力缴纳而入狱，随后逃亡。次年亚历山大去世，雅典联合各邦起兵，把他迎回。前 322 年希腊联军在克兰农战败，马其顿摄政安提帕特要求交出反马其顿的演说家，雅典公民大会依德马德斯的提议判他们死刑。他逃到卡劳里亚岛的波塞冬神庙，追捕者阿基亚斯赶到时，他服毒自尽，相传毒药藏在笔管里。

  归在他名下的演说有六十篇左右，其中一部分并非他所作。古代修辞学家把他列为阿提卡演说家之首，西塞罗抨击安东尼的演说即取名《反腓力辞》。
sources: []
recalled:
  - 德摩斯梯尼《反腓力辞》《奥林托斯辞》《论使团》《金冠辞》
  - 普鲁塔克《德摩斯梯尼传》
  - 埃斯基涅斯《诉克特西丰》
  - 托名普鲁塔克《十大演说家传》
