name: 提比尼
aliases: []
role: 与暗利争位者
summary: 基纳的儿子，心利死后有一半以色列民要立他为王，与暗利相争而败死。
body: |-
  基纳的儿子。据《列王纪上》16:21–22，心利自焚以后，以色列民分为两半：一半随从提比尼，要立他作王；一半随从暗利。随从暗利的胜过了随从提比尼的，提比尼死了，暗利就作了王。他怎样死的，经文没有说。

  《列王纪上》16:15 说心利在亚撒二十七年作王七日，16:23 又说暗利在亚撒三十一年登基作以色列王。一般认为中间这四五年就是提比尼与暗利两派对峙的时期，这里的在位年份据此估算，并不确切。他是否算作以色列王，各家说法不一。史料所载仅此。
sources: []
recalled:
  - 《列王纪上》16:15–23
