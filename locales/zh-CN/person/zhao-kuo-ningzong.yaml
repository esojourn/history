name: 宋宁宗
aliases: [赵扩]
role: 南宋皇帝
summary: 宋光宗之子，经绍熙内禅即位；在位三十年，先后由韩侂胄、史弥远掌握朝政。
body: |-
  赵扩是宋光宗的儿子，生于乾道四年（公元 1168 年）。绍熙五年（1194 年）赵汝愚、韩侂胄借宪圣太后之命让光宗退位，扶他即位，是为宋宁宗。

  宁宗在位三十年，自己很少主断朝政。前期韩侂胄排挤赵汝愚，兴“庆元党禁”，把朱熹等人的学说斥为“伪学”；开禧二年（1206 年）韩侂胄发动北伐，失利后在开禧三年被史弥远等人设计杀死，首级送往金朝，宋金于嘉定元年（1208 年）订立嘉定和议（另见“庆元党禁”“开禧北伐”条）。此后史弥远任相十七年。嘉定年间蒙古兴起，金朝南迁汴京，宋停止向金输送岁币，宋金之间再起战事。宁宗的几个儿子都早夭，他立宗室赵竑为皇子；嘉定十七年（1224 年）宁宗去世，史弥远假传遗诏，改立赵昀，即宋理宗。
sources: []
recalled:
  - 《宋史·宁宗本纪》
