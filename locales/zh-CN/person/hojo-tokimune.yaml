name: 北条时宗
aliases: []
role: 镰仓幕府执权
summary: 镰仓幕府第八代执权，拒绝蒙古的国书，领导日本抵御元朝的两次进攻。
body: |-
  北条时宗是镰仓幕府第五代执权北条时赖的儿子，生于建长三年（公元 1251 年）。镰仓幕府的实权由北条氏以“执权”的身份世代掌握。文永五年（1268 年）他十八岁出任第八代执权，这一年忽必烈派人送来国书，要求日本通好，言辞中带有以武力相威胁的意思。

  时宗决定不予回复，此后元朝使者几次到来，都没有得到答复，有的使者被他下令处斩。他命令九州的御家人加强防备。文永十一年（1274 年）元朝和高丽联军进攻对马、壹岐，在博多湾登陆，日军苦战，元军不久撤退，日本称为“文永之役”。此后时宗下令在博多湾沿岸修筑石墙（石筑地），并处死了再次前来的元使。弘安四年（1281 年）元朝派东路军和江南军大举进攻，被阻于石墙之外，在海上相持多日后遭遇台风，损失惨重，日本称为“弘安之役”（另见“元军征日本”条）。

  时宗信奉禅宗，礼请南宋僧人兰溪道隆、无学祖元，弘安五年（1282 年）在镰仓创建圆觉寺。两次战事后幕府无力充分赏赐参战的武士，引起不满，成为镰仓幕府衰落的原因之一。弘安七年（1284 年）时宗去世，年仅三十四岁，由年幼的儿子北条贞时继任执权。
sources: []
recalled:
  - 《元史·日本传》
  - 《八幡愚童训》
  - 《镰仓年代记》
