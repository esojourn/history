name: 子产
aliases: [公孙侨, 国侨, 公孙成子]
role: 郑国执政
summary: 郑国执政二十余年，整顿田制、铸刑书，不毁乡校，使夹在晋楚之间的郑国得以安定。
body: |-
  子产名侨，字子产，是郑穆公之孙、公子发（子国）之子，所以称公孙侨，生年不详。郑国地处晋、楚两个大国之间，屡遭兵祸，内部又有贵族之间的争斗。公元前 543 年，子产开始执掌郑国国政，直到前 522 年去世。

  子产在郑国推行了一系列改革。据《左传》，他“使都鄙有章，上下有服，田有封洫，庐井有伍”，整顿田界和户籍；起初百姓不满，编歌说要杀他，三年后又唱歌赞美他。公元前 538 年他“作丘赋”，按田亩征收军赋；前 536 年他把刑法铸在鼎上公布，称为“铸刑书”。晋国的叔向写信批评他，认为公布刑法会使百姓争讼，子产回信说“吾以救世也”。

  郑国人常在乡校聚会议论执政的得失，有人建议毁掉乡校，子产不同意，说百姓议论的，好的我就推行，不好的我就改正，“是吾师也”（《左传》襄公三十一年）。在外交上，他以礼和辞令应对晋、楚，维护了郑国的尊严。公元前 524 年郑国发生大火，有人主张祭祀禳灾，子产说“天道远，人道迩”，不予采纳。

  子产死于公元前 522 年。孔子听说后流泪说：“古之遗爱也。”（《左传》昭公二十年）

  后世把子产看作春秋时期最杰出的政治家之一。
