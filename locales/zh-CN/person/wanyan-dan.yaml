name: 金熙宗
aliases: [完颜亶, 合剌]
role: 金朝皇帝
summary: 金太祖的嫡长孙，推行汉制改革；晚年酗酒滥杀，被堂兄完颜亮所弑。
body: |-
  完颜亶女真名合剌，是金太祖完颜阿骨打的嫡长孙，生于天辅三年（公元 1119 年），幼年时曾随汉人学者学习儒家经典和诗文。天会十三年（1135 年）金太宗去世，他以谙班勃极烈（皇储）的身份即位，是为金熙宗。

  熙宗在位期间，仿照宋、辽的制度改革官制，天眷元年（1138 年）颁行新官制，确立三省六部，废除女真旧有的勃极烈制度，史称“天眷新制”；又以会宁府为上京，修建宫殿，制定礼仪。天会十五年（1137 年）他废掉伪齐，随后一度把河南、陕西归还宋朝，又在完颜宗弼主持下撕毁和约，绍兴十一年（1141 年）与宋订立绍兴和议。

  熙宗晚年因皇子夭折、受皇后裴满氏挟制等原因，终日酗酒，喜怒无常，滥杀宗室和大臣，连皇后也被他杀死。皇统九年十二月（公历 1150 年 1 月），他的堂兄、右丞相完颜亮与近臣合谋，夜入寝宫把他杀死。
sources: []
recalled:
  - 《金史·熙宗本纪》
