name: 马可·波罗
aliases: []
role: 威尼斯商人、旅行家
summary: 威尼斯商人，自称在元朝居住十七年，他口述的游记使欧洲人对中国有了较具体的认识。
body: |-
  马可·波罗生于 1254 年，出身威尼斯的商人家庭。他的父亲尼科洛和叔父马费奥曾经到东方经商，到过忽必烈的宫廷，忽必烈托他们带信给罗马教宗。1271 年两人再次东行，带上了十七岁的马可。据他的游记，一行人经过西亚、中亚，越过帕米尔高原，1275 年到达上都，见到了忽必烈。

  据游记所述，马可·波罗此后在元朝居住了十七年，得到忽必烈的信任，多次奉命出使各地，到过江南的杭州（书中称为“行在”）、扬州等城市，对元朝的都城、驿站、纸币、运河和南方城市的繁华有详细描写。1291 年前后，波罗一家受命护送蒙古公主阔阔真远嫁伊利汗国，从泉州出海，经南海、印度洋到达波斯，1295 年回到威尼斯。

  1298 年前后，马可·波罗在威尼斯与热那亚的战争中被俘，在狱中把自己的经历口述给同狱的作家鲁斯蒂谦，由后者写成一书，通称《马可·波罗游记》，又称《寰宇记》。这本书在欧洲广为流传，对后来欧洲人向往东方、探索海路有很大影响。他获释后回到威尼斯经商，1324 年去世。

  由于书中没有提到长城、茶叶、汉字、缠足等，中文史料中也没有找到可以确定是他的记载，曾有学者怀疑他是否真的到过中国。多数学者根据书中许多可以与中国史料印证的细节，认为他确实到过中国，只是书中有夸大和传闻的成分。
sources: []
recalled:
  - 《马可·波罗游记》
  - 杨志玖《马可·波罗在中国》
