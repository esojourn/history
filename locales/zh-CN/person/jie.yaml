name: 桀
aliases: [夏桀, 履癸, 帝履癸]
role: 夏朝末代君主
summary: 夏朝最后一位君主，相传暴虐失民心，被商汤打败于鸣条，流放而死。
body: |-
  桀是夏朝的末代君主，名履癸，按传统说法在公元前十七世纪末，确切年份不详。古书中的桀主要是作为亡国暴君的典型出现，许多细节出于后人的渲染，需要谨慎看待。

  据《史记·夏本纪》，自孔甲以来诸侯多背叛夏，到桀时“不务德而武伤百姓，百姓弗堪”。桀曾召商汤，把他囚禁在夏台，后来又放了他。汤修德，诸侯纷纷归附，于是率兵伐桀。《尚书·汤誓》记汤誓师时引用民间的话：“时日曷丧，予及汝皆亡。”把桀比作太阳，表达百姓的怨恨。

  据《史记》，桀战败后逃到鸣条，被流放而死；《尚书》的书序说汤“放桀于南巢”。《国语·晋语一》说桀伐有施氏，有施氏献上妹喜，后世的古书由此生出妹喜祸国的故事。按古书的说法，桀居于斟鄩，有人认为即今河南偃师的二里头遗址一带，但二里头是否夏都，学界尚无定论。

  夏商周断代工程把商汤灭夏定在约公元前 1600 年，这也是夏朝在时间长河上的终点。

  “桀纣”后来成为暴君的代称，《荀子》《韩非子》等书常以桀纣与尧舜对举。齐宣王问孟子，汤放桀、武王伐纣是不是臣弑其君，孟子回答：“闻诛一夫纣矣，未闻弑君也。”（《孟子·梁惠王下》）
sources: []
recalled:
  - 《史记·夏本纪》
  - 《尚书·汤誓》
  - 《国语·晋语一》
