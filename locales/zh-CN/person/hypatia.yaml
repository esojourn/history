name: 希帕提娅
aliases: [海巴夏, 希帕蒂娅, 许帕提娅]
role: 数学家、哲学家
summary: 亚历山大城的女数学家、新柏拉图派哲学家，公元 415 年被基督徒暴民杀害。
body: |-
  希帕提娅是亚历山大城数学家塞翁的女儿，生年有公元 355 年前后和 370 年前后两种推算。塞翁校订过欧几里得的《几何原本》，注释过托勒密的《天文学大成》；《苏达辞书》说她为丢番图的《算术》和阿波罗尼奥斯的《圆锥曲线论》作过注，这些书没有署她名字的本子传下来。

  她在城里公开讲授哲学和数学，听讲的人不分信仰。学生许涅修斯后来做了昔兰尼加的基督教主教，他写给她的几封信保存至今，信里称她为老师，向她请教仪器的做法。城里的官员也常向她请教，埃及总督奥瑞斯特斯是她的朋友。

  当时总督与亚历山大主教西里尔不和（教会史书里译作区利罗）。据同时代的教会史家苏格拉底，有人传说是她从中作梗，使两人不能和解。415 年 3 月，一群基督徒由一个名叫彼得的读经员带领，把她从车上拖下来，拉进一座教堂，用瓦片把她杀死，尸体拖到别处烧掉。苏格拉底说，这件事使西里尔和亚历山大教会大受指责。西里尔本人是否指使，史料说法不一。
sources: []
recalled:
  - 苏格拉底《教会史》卷 7 第 15 章
  - 许涅修斯《书信》第 10、15、16、81、124、154 封
  - 达马斯基乌斯《伊西多尔传》残篇
  - 《苏达辞书》“希帕提娅”条
  - 尼基乌的约翰《编年史》第 84 章
