name: 伊格那丢
aliases:
  - 安提阿的伊格那丢
  - 依格那丢
  - 提阿非罗斯
  - 伊格纳修
role: 安提阿主教、殉道者
summary: 安提阿主教，押解往罗马途中写下七封书信，后在罗马殉道。
body: |-
  伊格那丢是叙利亚安提阿教会的主教。安提阿是差派保罗和巴拿巴出去宣道的教会，门徒称为基督徒也是从这里起头。他的出身和生年没有可靠记载，祁伯尔《历史的轨迹》写他生卒为公元 67—110 年，生年一项其他材料也没有确切的说法。教会传统把他列为使徒后时期的教父，即曾直接受使徒教导的一代人。

  据优西比乌《教会史》，他在图拉真皇帝在位时被捕，判处押往罗马投给野兽。押解途中，他在士每拿和特罗亚给几处教会写信，传下来公认可靠的有七封：致以弗所、马格尼西亚、特拉勒斯、罗马、非拉铁非、士每拿各教会，以及致士每拿主教坡旅甲。这些信是使徒以后最早的一批教会文献。

  信中有两个反复出现的主题。一是劝各教会顺服主教，以主教为合一的中心，他写给非拉铁非教会说："你们都要跟随主教，如同基督跟随天父。"这是现存文献里最早清楚提到一城一位主教、其下有长老和执事的记载。二是驳斥当时有人说基督只是"看起来"有身体的说法，强调基督真实地出生、受难、复活。

  致罗马人书里，他恳求罗马的信徒不要设法营救他，愿意被野兽撕碎以得着基督，《历史的轨迹》第二章引了其中一段。他殉道的年份没有确切记载，通常定在公元 110 年前后，各家说法在 107 至 117 年之间。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三章“教会内部的成长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter04.html"
recalled:
  - 伊格那丢书信七封（尤其《致罗马人书》《致非拉铁非人书》《致士每拿人书》）
  - 优西比乌《教会史》卷 3 第 22、36 章
