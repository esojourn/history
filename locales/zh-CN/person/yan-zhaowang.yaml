name: 燕昭王
aliases: [姬职]
role: 燕国国君
summary: 燕国国君，在齐国破燕之后即位，筑台招贤，任用乐毅率五国之师破齐，洗雪国耻。
body: |-
  燕昭王名职（一说名平），是燕王哙之子，生年不详。燕王哙仿效尧舜禅让，把王位让给相国子之，引起燕国大乱，太子平与将军市被起兵攻子之失败。公元前 314 年，齐宣王趁乱出兵攻燕，五十天就攻下燕都，燕王哙和子之都被杀死。在赵国等的支持下，公子职回国即位，就是燕昭王。

  据《战国策·燕策一》和《史记·燕召公世家》，昭王即位后卑身厚币招揽贤士，向郭隗请教。郭隗讲了古代君王用五百金买千里马之骨，结果一年之内得到三匹千里马的故事，说：“今王诚欲致士，先从隗始。”昭王于是为郭隗修建宫室，以师礼待之。乐毅从魏国、邹衍从齐国、剧辛从赵国纷纷来到燕国。后世所说的“黄金台”就是由此附会而来。

  昭王与百姓同甘共苦二十八年，燕国殷富。公元前 284 年，他以乐毅为上将军，联合秦、赵、韩、魏伐齐，在济西大败齐军，乐毅率燕军攻入临淄，齐湣王出逃被杀，齐国七十余城都被燕军攻下，只剩莒和即墨。昭王死于公元前 279 年，儿子惠王继位后中了田单的反间计，以骑劫代替乐毅，齐国得以复国。

  昭王招贤的故事后来成为诗文中的常见典故，唐代陈子昂的《蓟丘览古》等诗就是感怀燕昭王的作品。
sources: []
recalled:
  - 《战国策·燕策一》
  - 《史记·燕召公世家》
  - 《史记·乐毅列传》
