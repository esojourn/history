name: 陈亮
aliases: [陈同甫, 龙川先生]
role: 思想家、词人
summary: 南宋思想家、词人，力主抗金，与朱熹进行“王霸义利之辩”，晚年考中状元。
body: |-
  陈亮字同甫，号龙川，婺州永康（今属浙江）人，生于绍兴十三年（公元 1143 年）。他才气超迈，喜谈兵事，乾道五年（1169 年）上《中兴五论》，淳熙五年（1178 年）又多次上书宋孝宗，力陈恢复中原之策，指斥朝中苟安的风气，都没有被采纳。他因性格豪放，几次被人诬陷下狱。

  陈亮主张“事功”，认为义与利、王道与霸道不能截然分开，治国要讲求实际功效。淳熙十一年（1184 年）起他与朱熹书信往来，就汉唐君主是否行王道等问题反复辩论，史称“王霸义利之辩”。淳熙十五年（1188 年）他到铅山拜访辛弃疾，两人相聚十日，互相唱和，留下多首慷慨的词作。

  绍熙四年（1193 年）陈亮考中进士，宋光宗亲擢为第一名（状元），授签书建康府判官，次年还没有到任就去世了。他与叶适等人代表的浙东学派重视事功，与朱熹的理学、陆九渊的心学鼎足而立。
sources: []
recalled:
  - 《宋史·儒林传·陈亮》
  - 《龙川文集》
