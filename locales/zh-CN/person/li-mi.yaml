name: 李密
aliases: [李玄邃, 魏公]
role: 瓦岗军首领
summary: 隋末瓦岗军的首领，夺取洛口仓称魏公，一度最强，被王世充击败后降唐，又叛唐被杀。
body: |-
  李密字玄邃，一字法主，出身关陇贵族，曾祖李弼是西魏八柱国之一。他年轻时在宫中任侍卫，后辞职专心读书。《新唐书》本传记载他骑牛读书、把《汉书》挂在牛角上的故事，后来成为“牛角挂书”的典故。

  大业九年（公元 613 年）杨玄感趁炀帝征高句丽，在黎阳起兵反隋，李密是他的谋主，献上中下三策，杨玄感没有采纳上策，很快兵败。李密被捕后途中逃脱，流亡数年。大业十二年（616 年）他投奔瓦岗军首领翟让，为翟让出谋划策，次年攻取洛阳附近的兴洛仓，开仓放粮，任人取用，归附的人大增。翟让推他为主，号魏公。不久他设宴杀死翟让，瓦岗军内部由此产生裂痕。

  瓦岗军围攻东都洛阳，与守城的王世充反复交战。大业十四年（618 年）宇文化及杀炀帝后率军北上，李密接受了洛阳隋朝小朝廷的官爵，与宇文化及在童山一带大战，虽然取胜，自己的精锐也损失很大。同年九月，王世充乘机出击，李密在邙山大败，率残部西入关中投降唐朝。

  他在唐朝不受重用，心中不满，不久请求出关招抚旧部，途中叛唐，被唐将盛彦师在熊耳山伏兵截杀，年三十七。这时是唐武德元年十二月，按公历已是公元 619 年初。
sources: []
recalled:
  - 《隋书·李密传》
  - 《旧唐书·李密传》
  - 《新唐书·李密传》
  - 《资治通鉴》卷一百八十二至一百八十六
