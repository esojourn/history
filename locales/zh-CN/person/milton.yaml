name: "弥尔顿"
aliases: ["约翰·弥尔顿"]
role: "清教徒诗人"
summary: "清教徒诗人、共和国政府的拉丁文秘书，失明后写成史诗《失乐园》。"
body: |-
  弥尔顿 1608 年生于伦敦，父亲是公证文书商兼作曲者，家境富裕；他在剑桥读书七年。《历史的轨迹》第三十一章说他“出生贵族世家”，其实他家是殷实的市民，并非贵族。

  内战前后他写了大量政论小册子，反对主教制，主张离婚自由和出版自由（1644 年的《论出版自由》）。查理一世被处死后，他写文章为处死国王辩护，被共和国政府聘为拉丁文秘书。约 1652 年他双目完全失明，仍靠口授继续工作。

  复辟后他一度被捕，不久获释，此后隐居。该书说他在失明、孤单、贫苦中写下了伟大的基督教史诗《失乐园》。这部史诗 1667 年出版，以人类始祖堕落为题材；1671 年又出版《复乐园》和《力士参孙》。他 1674 年在伦敦去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
recalled:
  - "弥尔顿《论出版自由》（1644 年）"
  - "弥尔顿《失乐园》（1667 年）"
