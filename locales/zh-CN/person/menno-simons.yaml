name: "门诺·西门"
aliases: ["门诺", "门诺·西蒙斯"]
role: "荷兰重洗派的领袖"
summary: "弗里斯兰的司铎，1536 年加入重洗派，聚集和平的信徒，门诺派因他得名。"
body: |-
  门诺 1496 年生于荷兰弗里斯兰的维特马瑟姆，是农家子弟。《历史的轨迹》第二十五章说，他 1524 年在家乡弗里斯兰被立为天主教司铎，事奉的第一年就开始怀疑化质说。据他自述，那时他从没读过圣经，为这个疑问才去翻新约，又读了路德等人的书。1531 年他听说邻近有一个人因为重受洗礼被斩首，再去查考，找不到婴儿洗礼的根据。那年他调回维特马瑟姆任本堂司铎，心里已不信所行的礼，仍照旧做了几年。

  1535 年春，一批受明斯特影响的重洗派占据了附近的一座修道院，被官兵攻破，死了三百来人，据说其中有他的兄弟。他写文章驳斥莱顿的约翰用刀剑建立国度，自己又为安逸留在职位上而不安。该书说他直到 1536 年才脱离罗马教会；他是那年 1 月离开的，随后受洗，次年被和平的一派立为长老。

  此后二十五年他在荷兰、德意志北部和波罗的海沿岸奔走，给信徒施洗，把他们组成教会，一面写书。1542 年皇帝悬赏一百金盾捉拿他，收留过他的人有被处死的。他的《基督教义的根基》讲悔改、信徒的洗礼、与世俗分别，主张基督徒不拿刀剑、不起誓。他在道成肉身的解释和开除教籍的宽严上，与同道也有过争论。

  该书说，在他带领下，十六世纪后半期兴起了一支温和的重洗派，不久就被称为门诺派，他们是和平勤勉的公民，最大的贡献是强调政教分开。他晚年腿有残疾，1554 年起住在荷尔斯泰因一位贵族的庄园维斯滕费尔德，办了一个印刷所，1561 年 1 月死在那里。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十五章“重洗派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter28.html"
recalled:
  - "门诺《基督教义的根基》（1539—1540 年）"
  - "门诺《答盖利乌斯·法贝尔》（1554 年，自述离开罗马教会的经过）"
  - "门诺《驳莱顿的约翰的亵渎》"
