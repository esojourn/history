name: 西拿基立
aliases:
  - 辛那赫里布
role: 亚述王
summary: 亚述王，公元前 701 年进攻犹大，后毁巴比伦城，被儿子所杀。
body: |-
  亚述王萨尔贡二世的儿子，公元前 705 年父亲在战场上阵亡后继位，前 681 年去世；生年没有记载。他把都城定在尼尼微，据他的建筑铭文，他在那里兴建新宫（铭文称之为无可匹敌的宫殿）、扩建城墙并修渠引水。

  他在位期间用兵最多的地方是巴比伦。迦勒底首领米罗达巴拉但（就是圣经中遣使见希西家的那一位）在他即位后再度占据巴比伦，被他赶走。此后他先后立贝勒伊卜尼和自己的儿子亚述纳丁舒米为巴比伦王；后者被埃兰人掳走。据他的铭文，前 689 年他攻下巴比伦，拆毁城墙和神庙，引水淹没城址。

  前 701 年的西征在他的年代记里是第三次出征，记在泰勒棱柱、芝加哥东方研究所棱柱等几件内容大体相同的铭文上。铭文说他征服腓尼基和非利士诸城，在伊利提基击败埃及援军，攻取犹大四十六座坚固城，掳走二十万零一百五十人，把希西家像笼中之鸟一样困在耶路撒冷，并列出希西家随后送到尼尼微的贡物，其中有金三十他连得、银八百他连得。尼尼微王宫的浮雕刻画了攻取拉吉的场面。《列王纪下》18:13–16 也记希西家向他纳贡，数目是金子三十他连得、银子三百他连得；第 18—19 章接着记他差拉伯沙基到耶路撒冷劝降，以及一夜之间耶和华的使者在亚述营中杀了十八万五千人，他就拔营回尼尼微。亚述铭文没有提到这样的损失，也没有说攻下了耶路撒冷。

  关于他的死，《列王纪下》19:37 说他在他的神尼斯洛庙里叩拜时，被儿子亚得米勒和沙利色用刀杀了，二人逃到亚拉腊地，他另一个儿子以撒哈顿接续作王。巴比伦编年史也记载他在一次叛乱中被自己的儿子所杀；继位的以撒哈顿在铭文中讲述了自己与兄长们争位的经过。
sources: []
recalled:
  - 《列王纪下》18:13—19:37
  - 《以赛亚书》第 36—37 章
  - 《历代志下》第 32 章
  - 西拿基立棱柱铭文（泰勒棱柱、芝加哥东方研究所棱柱）第三次出征部分
  - 西拿基立巴维安铭文（毁巴比伦）
  - 巴比伦编年史（西拿基立之死）
  - 以撒哈顿尼尼微棱柱铭文
