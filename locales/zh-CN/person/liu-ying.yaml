name: 汉惠帝
aliases:
  - 刘盈
  - 孝惠皇帝
role: 皇帝
summary: 名刘盈，汉高祖与吕后之子，西汉第二位皇帝，在位七年。
body: |-
  汉高祖刘邦与吕后之子。《汉书·惠帝纪》说高祖初为汉王时他五岁，据此推算生于公元前 210 年；高祖二年立为太子。高祖晚年宠爱戚夫人，屡次想改立其子赵王如意，因大臣力争而作罢。前 195 年高祖去世，他即位为帝。

  即位后，吕后召赵王如意入长安。据《史记·吕太后本纪》，惠帝亲自把如意接入宫中同起居，吕后仍趁他清晨外出时将如意毒死，又残害戚夫人并让惠帝去看。惠帝因此病了一年多，此后“日饮为淫乐，不听政”。在位期间曹参继萧何为相国，沿用旧法；朝廷征发民夫修筑长安城，惠帝四年废除了秦以来禁止民间藏书的挟书律。惠帝七年（前 188 年）八月，他在未央宫去世。
sources:
  - 《汉书·惠帝纪》 https://ctext.org/han-shu/hui-di-ji/zhs
  - 《史记·吕太后本纪》 https://ctext.org/shiji/lv-tai-hou-ben-ji/zhs
