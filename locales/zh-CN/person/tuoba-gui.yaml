name: 拓跋珪
aliases: [魏道武帝, 太祖, 涉珪]
role: 北魏开国皇帝
summary: 鲜卑拓跋部首领，重建代国并改称魏，击败后燕占有河北，迁都平城称帝。
body: |-
  拓跋珪是鲜卑拓跋部首领、代王什翼犍的孙子，据《魏书·太祖纪》，他生在参合陂以北，是遗腹子。他与什翼犍的关系，南朝的史书另有他是什翼犍之子的说法。前秦建元十二年（公元 376 年）苻坚灭代国，他才六岁，随母亲贺氏先后寄居在匈奴独孤部和舅家贺兰部。

  淝水之战后前秦瓦解。登国元年（386 年）正月，他在各部首领推戴下即代王位，四月改称魏王，以盛乐为都城。他立国之初四面受敌，靠后燕慕容垂出兵相助才击败了争位的叔父和独孤部，随后几年连续征讨高车、柔然等部，登国六年消灭了黄河以西的匈奴铁弗部，掳获大量牲畜和人口。

  实力增强后，他与后燕反目。登国十年（395 年）后燕太子慕容宝率大军来攻，他先退到黄河以西避其锋芒，等燕军撤退时率骑兵昼夜追击，在参合陂大破燕军，把俘获的数万人活埋。次年慕容垂去世，他亲率大军南下，先取并州，再出井陉进入河北，经过一年多的战事攻下中山，占有了黄河以北的中原地区。

  天兴元年（398 年）他议定国号为魏，把都城迁到平城，营建宫殿、宗庙和社稷，同年十二月即皇帝位。他把河北的官吏、百姓和工匠几十万人迁到平城周围，按人口分给耕地；又下令解散一批部落，让部民分地定居、不得随意迁徙，由朝廷直接管理。他任用崔宏等汉族士人制定官制、礼仪和律令，设立太学。

  《魏书》说他晚年服用寒食散，药性发作时喜怒无常，猜忌多疑，许多大臣被杀。天赐六年（409 年）十月，他被次子清河王拓跋绍刺杀，时年三十九。长子拓跋嗣平乱继位，即明元帝。他死后先谥宣武皇帝，后改谥道武，北魏由此延续近一百五十年。
sources: []
recalled:
  - 《魏书·太祖纪》
  - 《北史·魏本纪》
  - 《资治通鉴》卷一百零六至一百一十五
