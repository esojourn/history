name: 南怀仁
aliases: [费迪南·维尔比斯特]
role: 耶稣会来华传教士，钦天监监正
summary: 比利时耶稣会士，以实测胜过杨光先，主持钦天监，为康熙帝讲授西学。
body: |-
  南怀仁出生于佛兰德（今比利时西部）的皮滕，1641 年加入耶稣会，1659 年来到中国，先在陕西传教，次年被召到北京协助汤若望工作。康熙三年（1664 年）杨光先发起历狱，南怀仁与汤若望等人一同被捕下狱，次年获释。

  康熙七年（1668 年）亲政不久的康熙帝命南怀仁与钦天监的杨光先、吴明烜当众测验日影和天象，南怀仁的预测与实测相符，杨光先等人的则多有偏差。次年康熙帝罢免杨光先，任命南怀仁为钦天监监副（实际主持监务），恢复使用西法历书（另见“康熙历狱”条）。此后南怀仁主持制造了天体仪、赤道经纬仪、黄道经纬仪、地平经仪、地平纬仪、纪限仪六件大型天文仪器，安放在北京观象台，至今仍保存在那里。

  南怀仁常给康熙帝讲授几何、天文等知识。三藩之乱期间，他奉命为清军设计铸造了大量轻便的火炮。他也参与了清朝与俄国的交涉，担任翻译。康熙二十七年（1688 年）他在北京去世，康熙帝赐谥“勤敏”。他著有《灵台仪象志》《康熙永年历法》等书，他在 1678 年写给欧洲耶稣会的信中呼吁派更多懂科学的传教士来华，此后法国派出了白晋、张诚等人。
sources: []
recalled:
