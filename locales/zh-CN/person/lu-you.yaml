name: 陆游
aliases: [陆务观, 放翁]
role: 诗人
summary: 南宋诗人，一生力主收复中原，作品以爱国诗篇著称，现存诗九千余首。
body: |-
  陆游字务观，号放翁，越州山阴（今浙江绍兴）人，生于宣和七年（公元 1125 年）。据他自己的诗文，他出生在父亲赴任途中淮河的船上。第二年金军南下，北宋灭亡，他在战乱中度过童年，家中常有士大夫谈论国事，痛哭流涕，这对他影响很深。

  绍兴二十三年（1153 年）陆游参加锁厅试，名列第一，排在秦桧的孙子秦埙之前，次年礼部考试时被秦桧黜落。秦桧死后他才入仕，宋孝宗即位后赐进士出身。他力主抗金，屡因“鼓唱是非，力说张浚用兵”等罪名被罢官。乾道六年（1170 年）他入蜀任夔州通判，沿途写成《入蜀记》。乾道八年（1172 年）他在四川宣抚使王炎幕中，到过南郑前线，这段短暂的军旅生活是他一生最向往的经历。此后他在成都范成大的幕府任职，有人讥他“燕饮颓放”，他就自号“放翁”。

  淳熙五年（1178 年）陆游东归，此后在福建、江西、严州等地任官，又几次被劾罢官。从绍熙元年（1190 年）起，他大部分时间退居山阴乡间，过了二十年的农村生活，但始终关心北伐。开禧二年（1206 年）韩侂胄北伐，他曾表示支持。嘉定二年十二月（公历已是 1210 年初），陆游去世，临终作《示儿》诗，有“王师北定中原日，家祭无忘告乃翁”之句。

  陆游的诗收在《剑南诗稿》里，现存九千余首，是存诗最多的宋代诗人之一，风格雄放，也有不少描写农村生活的闲淡之作。他也工词，另有《渭南文集》《老学庵笔记》等。据南宋笔记，他早年与妻子唐琬感情很好，被母亲逼迫离异，后来在沈园重逢，题下《钗头凤》词；这个故事出自陈鹄、周密等人的笔记，细节有不少疑点，学界看法不一。
sources: []
recalled:
  - 《宋史·陆游传》
  - 《剑南诗稿》
  - 周密《齐东野语》
