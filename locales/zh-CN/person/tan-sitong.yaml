name: 谭嗣同
aliases: [复生, 壮飞]
role: 维新派人物，“戊戌六君子”之一
summary: 湖南浏阳人，著《仁学》，戊戌变法时任军机章京，政变后拒绝出逃，被杀于菜市口。
body: |-
  谭嗣同是湖南浏阳人，生于北京，父亲谭继洵官至湖北巡抚。他少年时母亲去世，与父亲的妾关系不和，童年并不愉快。他喜欢习武，与侠士王五（大刀王五）交往，游历过直隶、新疆、甘肃、台湾等许多地方。

  甲午战争失败后，谭嗣同深受刺激，在浏阳创办算学馆，开始积极宣传变法。光绪二十二年（1896 年）他写成《仁学》，猛烈批判封建纲常，主张“冲决网罗”。光绪二十三年（1897 年）他回到湖南，协助湖南巡抚陈宝箴推行新政，与梁启超等人创办时务学堂、南学会和《湘报》。

  光绪二十四年（1898 年）他被推荐到北京，光绪帝任命他与杨锐、林旭、刘光第为军机章京，参与新政（另见“戊戌变法”条）。九月，变法面临危机，据袁世凯《戊戌日记》等记载，谭嗣同深夜到法华寺拜访袁世凯，请他起兵保护光绪帝、包围颐和园，袁世凯没有答应。政变发生后，梁启超劝他一起出逃，他拒绝了，据梁启超的记载，他说“各国变法，无不从流血而成，今中国未闻有因变法而流血者，此国之所以不昌也。有之，请自嗣同始”。他被捕后，在狱中墙壁上题诗，“我自横刀向天笑，去留肝胆两昆仑”之句流传很广（诗的原文有不同版本）。九月二十八日，他与林旭、杨锐、刘光第、杨深秀、康广仁一起在北京菜市口被处死，史称“戊戌六君子”，年三十三岁。
sources: []
recalled:
  - 梁启超《戊戌政变记·谭嗣同传》
  - 谭嗣同《仁学》
  - 袁世凯《戊戌日记》
