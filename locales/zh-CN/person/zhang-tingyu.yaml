name: 张廷玉
aliases: [文和]
role: 雍正、乾隆两朝的大学士
summary: 历仕康雍乾三朝的大学士，参与设立军机处，主持修成《明史》。
body: |-
  张廷玉是安徽桐城人，父亲张英是康熙年间的大学士。康熙三十九年（1700 年）他考中进士，在翰林院、南书房任职。雍正帝即位后十分信任他，先后让他任礼部、户部尚书，雍正四年（1726 年）起任大学士。雍正年间设立军机处，他与怡亲王允祥、蒋廷锡等人是最早的军机大臣，据说军机处的许多规章出自他手。雍正帝的谕旨多由他起草。

  张廷玉做事谨慎，据说“万言万当，不如一默”是他的座右铭。他参与主持编修了《明史》《大清会典》《康熙字典》等书，其中《明史》在乾隆四年（1739 年）完成，以他的名义进呈。雍正帝在遗诏中特许他死后配享太庙。

  乾隆帝即位后，张廷玉仍任大学士、军机大臣，但他与满洲大学士鄂尔泰两派的门生互相攻击，乾隆帝逐渐对他不满。乾隆十四年（1749 年）前后他以年老请求退休，又担心死后配享太庙的承诺不能兑现，请乾隆帝写下保证，乾隆帝大怒，后来削去了他的伯爵。乾隆二十年（1755 年）他在家乡去世，乾隆帝仍按雍正帝的遗命让他配享太庙，他是清朝唯一享有此殊荣的汉族大臣。
sources: []
recalled:
  - 《清史稿·张廷玉传》
