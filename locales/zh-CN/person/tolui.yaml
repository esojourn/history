name: 拖雷
aliases: [元睿宗]
role: 成吉思汗幼子
summary: 成吉思汗幼子，父死后监国；借道宋境攻金，在三峰山歼灭金军主力；蒙哥、忽必烈之父。
body: |-
  拖雷是成吉思汗与孛儿帖所生的第四子，即幼子，生年有几种说法，约在 1191 至 1193 年之间。按照蒙古“幼子守灶”的习俗，他继承了父亲的大部分军队和原有的营地。他从少年时就随父出征，西征花剌子模时率军攻掠呼罗珊，攻破马鲁、你沙不儿等城，据波斯史家记载，这些城市遭到了严重的屠杀。

  1227 年成吉思汗去世，拖雷监国两年。他手中掌握着蒙古军队的大部分，但仍遵照父亲的遗命，在 1229 年的大会上推举三哥窝阔台为大汗。1231 年蒙古大举攻金，拖雷率右路军从陕西借道南宋的汉中、四川边境，绕到金军背后，次年正月在钧州三峰山趁大雪天寒、金军饥疲之际发动进攻，歼灭金军主力（另见“蒙古灭金”条）。

  同年拖雷随窝阔台北返，九月前后在途中去世。据《元朝秘史》，窝阔台染病，巫师说要亲人代为承受，拖雷饮下巫师的咒水，不久死去。他的妻子唆鲁禾帖尼是克烈部王汗之弟的女儿，信奉聂斯脱里派基督教，以贤明著称，拖雷死后由她抚养四个儿子，即后来的大汗蒙哥、元世祖忽必烈、伊利汗国的建立者旭烈兀和阿里不哥，忽必烈即位后追尊他为元睿宗。此后蒙古大汗之位一直在拖雷的后裔中传承。
sources: []
recalled:
  - 《元史·睿宗传》
  - 《元朝秘史》
  - 拉施特《史集》
