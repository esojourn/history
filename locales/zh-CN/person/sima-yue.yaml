name: 司马越
aliases: [东海王越, 司马元超]
role: 东海王
summary: 八王之乱最后的胜出者，晋怀帝时专制朝政，出讨石勒途中病死于项县。
body: |-
  司马越字元超，是司马懿之弟司马馗的孙子、高密王司马泰的长子，封东海王，生年不详。永兴元年（公元 304 年）正月，他在洛阳城内捉住长沙王乂交给张方；七月奉惠帝北征成都王颖，在荡阴大败，逃回封国。

  次年他在关东起兵，联合范阳王司马虓、幽州的王浚等西攻河间王颙，光熙元年（306 年）把惠帝迎回洛阳，以太傅录尚书事。惠帝去世、怀帝即位后，他长期带兵驻在许昌等地，仍遥控朝政。永嘉三年（309 年）他带兵入洛阳，杀了怀帝亲信的几位大臣，与怀帝的关系从此破裂。

  这时刘渊、石勒的军队已经逼近洛阳。永嘉四年（310 年）冬，他以讨石勒为名，带着朝中大批官员和军队离开洛阳，驻在项县。次年三月，怀帝密令苟晞讨伐他，他忧惧发病而死。太尉王衍等人护送他的灵柩东归，在宁平城被石勒追上，随行的军民十余万人被杀，西晋朝廷的主力就此丧尽。
sources: []
recalled:
  - 《晋书·东海王越传》
  - 《资治通鉴》卷八十五至八十七
