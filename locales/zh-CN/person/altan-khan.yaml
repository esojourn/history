name: 俺答汗
aliases: [阿勒坦汗, 顺义王]
role: 蒙古土默特部首领
summary: 蒙古土默特部首领，曾兵临北京；1571 年与明议和，受封顺义王。
body: |-
  俺答汗是蒙古达延汗的孙子，统领土默特部，驻牧于丰州滩（今内蒙古呼和浩特一带）。他的势力在十六世纪中期成为蒙古右翼最强的一支，向西征服了青海一带的蒙古部落。

  俺答汗多次向明朝请求通贡互市，都被拒绝，于是年年率军入侵明朝北边。嘉靖二十九年（1550 年）他率军攻破古北口，直抵北京城下，在京郊大肆劫掠后退去，史称“庚戌之变”（另见该条）。此后明朝一度在大同、宣府开设马市，不久又关闭，双方的战争又持续了二十年。

  隆庆四年（1570 年）俺答汗的孙子把汉那吉因家庭纠纷投奔明朝，明朝宣大总督王崇古、内阁大学士高拱和张居正借此与俺答汗谈判。次年双方达成和议，明朝封俺答汗为顺义王，开放大同、宣府等地的互市，史称“俺答封贡”（另见该条）。此后明朝北边数十年间战事大为减少。

  俺答汗在丰州滩招纳了许多汉人，他们开垦农田、建造房屋，汉文史料称这些聚居点为“板升”。他又修建城池，明朝赐名“归化”，就是今天的呼和浩特。晚年他皈依藏传佛教格鲁派，万历六年（1578 年）在青海仰华寺会见索南嘉措，赠给他“达赖喇嘛”的称号，“达赖喇嘛”这一称号由此开始。万历十年（1582 年）俺答汗去世。他的妻子三娘子此后长期主持与明朝的互市事务。
sources: []
recalled:
