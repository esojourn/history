name: 王肃
aliases: [王恭懿]
role: 大臣
summary: 南齐王奂之子，父亲被杀后投奔北魏，助孝文帝制定典章制度。
body: |-
  王肃字恭懿，出身琅邪王氏，是东晋丞相王导的后代。父亲王奂是南齐的雍州刺史，永明十一年（公元 493 年）被齐武帝所杀，王肃逃奔北魏。他在邺城见到正在南巡的魏孝文帝，与之谈论治国之道，孝文帝非常器重他。他熟悉南朝的典章制度，孝文帝改定官制礼仪时，多采用他的意见。后来他领兵镇守寿春，屡次与南齐作战，景明二年（501 年）在寿春去世，年三十八。

  据《洛阳伽蓝记》，他初到北方时不吃羊肉和奶酪，常吃鲫鱼羹、喝茶，京城的人笑他饮茶一喝就是一斗，称他为“漏卮”。几年后，他在宴会上吃了很多羊肉和酪粥，孝文帝问他与鱼、茶相比如何，他说羊肉好比齐、鲁大国，鱼好比邾、莒小国，只有茶不行，只配给奶酪做奴仆。此后北方有人把茶称为“酪奴”。
sources: []
recalled:
  - 《魏书·王肃传》
  - 杨衒之《洛阳伽蓝记》卷三
