name: 恺撒
aliases: [凯撒, 尤利乌斯·恺撒, 盖乌斯·尤利乌斯·恺撒, 儒略·凯撒, 该撒]
role: 罗马统帅、独裁官
summary: 罗马统帅和独裁官，征服高卢，渡卢比孔河赢得内战，改订历法，遇刺身亡。
body: |-
  盖乌斯·尤利乌斯·恺撒，公元前 100 年 7 月生于罗马，出身古老而久不显赫的贵族尤利乌斯氏族；姑母尤利娅是马略的妻子，他自己娶秦纳之女科尔内利娅。苏拉得势后命他离婚，他拒绝了，一度逃亡，后经亲友说情获免。前 75 年前后他赴罗得岛求学途中被海盗劫持，据普鲁塔克，他交了赎金获释，随即雇船把这些海盗抓住钉死。

  他历任财务官、营造官，靠举债办赛会争取民心。前 63 年他当选大祭司长，同年在元老院反对不经审判处死喀提林的同党。前 60 年他撮合庞培与克拉苏，三人结盟，把女儿尤利娅嫁给庞培；前 59 年任执政官，绕过元老院通过土地法，并得到山南高卢、伊利里库姆和山北高卢三个行省，为期五年，后又续五年。

  前 58 年至前 50 年他征服高卢全境：阻止赫尔维提人迁徙，逐走日耳曼首领阿里奥维斯图斯，两次渡海到不列颠，前 52 年在阿莱西亚迫使维钦托利投降。他把战事逐年写成《高卢战记》。

  尤利娅和克拉苏相继去世后，庞培倒向元老院。元老院要他解除兵权，前 49 年 1 月通过最终决议。他带一个军团渡过作为行省边界的卢比孔河，据苏维托尼乌斯，说了一句“骰子已经掷出”。六十天内他占领意大利，前 48 年在法萨卢斯击败庞培。他追到埃及，卷入托勒密王室之争，扶立克娄巴特拉七世；前 47 年在泽拉速胜本都王法尔纳凯斯，报捷只写“我来，我见，我胜”；此后在塔普苏斯和蒙达消灭庞培派残部。

  内战期间他多次任独裁官和执政官，前 44 年 2 月成为终身独裁官。他宽赦政敌，安置老兵和城市贫民到海外殖民地，扩充元老院，并请亚历山大城的天文学家索西琴尼改订历法，即儒略历。他是否想称王，当时就有争论。前 44 年 3 月 15 日，他在庞培剧场的元老院会场被布鲁图、卡西乌斯等人刺死，据苏维托尼乌斯，身中二十三刀。遗嘱指定甥孙屋大维为养子和继承人。
sources: []
recalled:
  - 恺撒《高卢战记》《内战记》
  - 苏维托尼乌斯《神圣的尤利乌斯传》
  - 普鲁塔克《恺撒传》
  - 阿庇安《内战史》卷二
  - 卡西乌斯·狄奥《罗马史》卷三十七至卷四十四
