name: 撒迦利雅
aliases: []
role: 北国以色列王
summary: 耶罗波安二世的儿子，作王六个月被沙龙所杀，耶户王朝至此终结。
body: |-
  耶罗波安二世的儿子，与先知撒迦利亚不是一人。据《列王纪下》15:8–9，犹大王亚撒利雅（即乌西雅）三十八年，他在撒玛利亚作以色列王六个月；经文说他行恶，与他列祖一样。

  据 15:10，雅比的儿子沙龙背叛他，在百姓面前击杀了他，篡了他的位。经文接着说，这应验了耶和华曾对耶户说的话：“你的子孙必坐以色列的国位，直到四代。”（15:12，参 10:30）耶户、约哈斯、约阿施、耶罗波安二世到撒迦利雅，耶户王朝传了五代而终。此后北国二十余年间连换数王，直至亡国。史料所载仅此。
sources: []
recalled:
  - 《列王纪下》10:30、14:29、15:8–12
