name: 韩延徽
aliases: [韩藏明]
role: 契丹大臣
summary: 幽州人，出使契丹被扣留，后得阿保机重用，帮助契丹建城郭、安置汉人。
body: |-
  韩延徽是幽州安次人，字藏明，早年在幽州刘守光手下任职。据《辽史》，刘守光派他出使契丹，他见了阿保机不肯下拜，被扣留下来，罚去放马。述律平对阿保机说此人有节操，应当重用，阿保机召他交谈，十分满意，从此让他参与谋划。

  据《辽史》，他建议阿保机修筑城郭、划分街市，安置投降和被俘的汉人，为他们配婚、教他们耕种，使逃亡的汉人能安居下来。契丹因此国力渐强。他一度思念家乡，逃回中原投奔晋王李存勖，后来因与晋的将领不和，又回到契丹，阿保机仍然信任他。此后他历仕辽太祖、太宗、世宗、穆宗四朝，官至政事令，应历九年（959 年）去世。他是契丹早期“以汉法治汉人”的重要推动者。
sources: []
recalled:
  - 《辽史·韩延徽传》
  - 《资治通鉴》卷二百六十九
