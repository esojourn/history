name: 巴拿巴
aliases:
  - 约瑟
role: 使徒、保罗的同工
summary: 生在居比路的利未人，引荐保罗，并与他同受差遣往外邦布道。
body: |-
  本名约瑟，是生在居比路（塞浦路斯）的利未人，使徒称他为巴拿巴，《使徒行传》4:36 解释这名字的意思是劝慰子。他卖了自己的田地，把价银拿来放在使徒脚前（4:37）。他的生年圣经没有记载。

  扫罗归信后到耶路撒冷，门徒都怕他，巴拿巴接待他，领他去见使徒（9:26–27）。安提阿有许多希腊人信了主，耶路撒冷的教会就打发巴拿巴前往；他又到大数找着扫罗，带到安提阿，两人同在那里教训人足有一年（11:22–26）。后来安提阿教会差遣他们二人出去，经居比路到彼西底的安提阿、以哥念、路司得和特庇（第 13—14 章）；在路司得，众人见保罗治好瘸腿的人，把巴拿巴称作丢斯（14:12）。两人又同上耶路撒冷，参加关于外邦信徒是否要受割礼的会议（第 15 章）。

  第二次出行之前，巴拿巴要带称呼马可的约翰同去，保罗因马可曾在旁非利亚离开他们而不肯，两人争论后分开，巴拿巴带着马可坐船往居比路去（15:36–39）。《使徒行传》此后不再记他的事。《歌罗西书》4:10 称马可是他的表弟。他的结局新约没有记载；相传他在居比路的撒拉米殉道。
sources: []
recalled:
  - 《使徒行传》4:36–37，9:26–27，11:22–30，第 13—15 章
  - 《加拉太书》第 2 章
  - 《哥林多前书》9:6
  - 《歌罗西书》4:10
