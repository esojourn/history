name: 晏婴
aliases: [晏子, 晏平仲]
role: 齐国卿相
summary: 齐国名相，历事灵公、庄公、景公，以节俭、善辩、直谏著称。
body: |-
  晏婴字仲，谥平，所以称晏平仲，是齐国夷维（今山东高密）人，生年不详，死于公元前 500 年。父亲晏弱也是齐国大夫。他历事齐灵公、庄公、景公三位国君。

  据《史记·管晏列传》，晏婴做了齐相，吃饭不用两样肉菜，妾不穿丝绸。《礼记·檀弓》说他一件狐裘穿了三十年。公元前 548 年，大夫崔杼杀死齐庄公，晏婴不顾危险，到崔家伏在庄公尸体上痛哭，礼毕而出，崔杼的手下想杀他，崔杼说他是百姓所仰望的人，放了他（《左传》襄公二十五年）。

  晏婴在景公时长期执政，屡次劝谏景公减轻赋税、省刑罚。他也善于辞令，在外交场合维护齐国的体面。《左传》昭公三年记他出使晋国时与叔向的对话，预言齐国的政权将归于施惠于民的陈氏（即田氏），后来果然应验。

  传世的《晏子春秋》记录了许多晏婴的言行和故事，如“晏子使楚”“二桃杀三士”等，一般认为是战国时人编成，其中不少故事带有寓言色彩，不能全当作史实。

  晏婴身材矮小，《史记》说他“长不满六尺”。司马迁在《管晏列传》的评论中说，假如晏子还活着，“余虽为之执鞭，所忻慕焉”，表达了对他的敬仰。

  孔子也称赞晏婴“善与人交，久而敬之”（《论语·公冶长》）。
sources: []
recalled:
  - 《史记·管晏列传》
  - 《左传》襄公二十五年
  - 《左传》昭公三年
  - 《礼记·檀弓下》
  - 《晏子春秋》
