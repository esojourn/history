name: 高尔吉亚
aliases: [乔吉亚斯]
role: 智者、修辞家
summary: 西西里伦蒂尼人，公元前 427 年出使雅典，以华丽的演说风靡一时。
body: |-
  西西里岛东部伦蒂尼人。古人都说他活了一百多岁，具体从一百零五到一百零九不等，生卒年只能是约数。据说他是恩培多克勒的学生。公元前 427 年，伦蒂尼受到叙拉古的攻击，派他率使团到雅典求援。狄奥多罗斯说，他在公民大会上的演说以新奇的文体使雅典人倾倒。此后他在希腊各地讲演、授徒，收费很高，在奥林匹亚和德尔斐的集会上发表过演说，晚年住在色萨利一带。雅典演说家伊索克拉底是他的学生。

  他的演说讲究对偶、押韵和匀称的短句，后人称为“高尔吉亚式的辞格”。完整传世的有《海伦颂》和《帕拉墨得斯辩护辞》。《海伦颂》为海伦随帕里斯出走辩护，说她或是受神意驱使，或是被暴力劫走，或是被言辞说服，或是为爱欲所制，无论哪一种都不该受责；其中说言辞是强大的主宰，对灵魂的作用如同药物对身体。

  他还有一篇《论不存在》，原文已佚，塞克斯都·恩披里柯等人作了概述。其论点分三层：没有什么东西存在；即使存在，也无法认识；即使能认识，也无法告诉别人。这是认真的哲学论证，还是对埃利亚学派的戏仿，学者看法不一。柏拉图以他的名字命名了一篇对话，其中让他说修辞术是关于说服的技艺。
sources: []
recalled:
