name: 芝诺（埃利亚）
aliases: [埃利亚的芝诺, 齐诺]
role: 哲学家
summary: 巴门尼德的弟子，以“阿喀琉斯追不上乌龟”等悖论为其师辩护。
body: |-
  意大利南部埃利亚人，巴门尼德的弟子。他与一百多年后创立斯多亚学派的基提翁人芝诺不是一人。柏拉图在《巴门尼德篇》里说，他约四十岁时随老师到过雅典；生卒年是据此推出的约数。柏拉图让他自己说明，他年轻时写过一部书，用意是替巴门尼德回击那些嘲笑“存在是一”的人：如果承认事物是多，得出的结论比承认是一更加荒谬。

  他的书已佚。辛普里丘保留了几段反对“多”的论证的原话，例如：如果事物是多，它们就必定既小到没有大小，又大到无限。反对运动的四个论证由亚里士多德在《物理学》里转述并反驳。“二分法”说，要走完一段路，先得走完一半，而一半又有一半，如此无穷，所以运动无法开始。“阿喀琉斯”说，跑得最快的人永远追不上跑得最慢的，因为追赶者每次到达对方刚才所在的地方时，对方又已向前移动了一段。“飞矢不动”说，箭在每一个瞬间都占据与自身相等的位置，因而是静止的。还有一个关于运动场上几列物体相对运动的论证。

  据第欧根尼·拉尔修，亚里士多德称他为辩证法的发明者。古人说他参与推翻埃利亚僭主的密谋，被捕后受刑不屈，各书所记的僭主名字和细节互不相同。
sources: []
