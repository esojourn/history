name: 顾炎武
aliases: [亭林, 顾绛]
role: 思想家、学者
summary: 抗清失败后北游各地，主张经世致用，著《日知录》，开考据学风气。
body: |-
  顾炎武是南直隶昆山人，原名绛，明亡后改名炎武，因家乡有亭林湖，学者称他为亭林先生。他少年时加入复社，屡次参加科举不中，转而研究经世实用之学，开始搜集各地的地方志和文献资料。

  顺治二年（1645 年）清军南下，顾炎武参加了昆山的抗清斗争，城破后他的两个弟弟被杀，嗣母王氏绝食而死，临终嘱咐他不要做清朝的官。此后他继续参与抗清活动。顺治十四年（1657 年）他离开家乡北上，此后二十多年游历山东、河北、山西、陕西等地，考察山川形势和风土民情，在各地垦荒置产，结交志同道合的人。康熙年间清廷征召博学鸿儒和修《明史》，他坚决拒绝，说如果逼迫，“则以身殉之矣”。

  顾炎武的代表作《日知录》是他一生读书的札记，内容涉及经义、史学、政治、制度、风俗、地理等许多方面。他在书中区分“亡国”与“亡天下”，认为改朝换代是亡国，仁义充塞、人相食是亡天下，“保天下者，匹夫之贱与有责焉”，后人把这一思想概括为“天下兴亡，匹夫有责”。他还著有《天下郡国利病书》《肇域志》《音学五书》等。

  顾炎武批评明末学者空谈心性，主张“经学即理学”，提倡从文字、音韵入手研究经书，注重证据和实地考察，对清代的考据学影响很大。康熙二十一年（1682 年）他在山西曲沃上马时失足坠地，不久去世，年七十岁。
sources: []
recalled:
  - 顾炎武《日知录》
  - 全祖望《亭林先生神道表》
  - 《清史稿·儒林传》
