name: 圣帕提克
aliases:
  - 圣圣帕提克
  - 爱尔兰的使徒
  - 帕特里克
  - 圣帕特里克
role: 爱尔兰主教
summary: 生在不列颠，少年时被掳到爱尔兰为奴，后来回去传道，被称为“爱尔兰的使徒”。
body: |-
  关于圣帕提克，可靠的材料只有他自己用拉丁文写的两篇短文：《忏悔录》和《致科罗提库斯士兵书》。他生在罗马治下的不列颠，自述家在一个叫班纳文·塔布尼埃的地方，确切位置不详。父亲卡尔普尼乌是教会的执事，也是地方上的议员，祖父是长老。他的生卒年都不确定，只知道他活动在五世纪。

  据《忏悔录》，他将近十六岁时被爱尔兰来的劫掠者掳走，在爱尔兰放了六年牲口。他说自己原先并不认识神，在牧放牲口的日子里才学会祷告。后来他在梦中听见有声音说船已经备好，就逃了出去，走了很远的路找到船，辗转回到家乡。

  回家以后，他又梦见有人从爱尔兰带来书信，信的开头写着“爱尔兰人的声音”，求他回去和他们同行。他受了圣职，后来以主教的身份回到爱尔兰。传统的说法把这一年定在公元 432 年。他在《忏悔录》里说，自己给成千的人施洗，到处设立神职人员，许多首领的儿女作了修士和守贞女；又说自己学识浅陋，多次遇险，还被人拘禁过。《致科罗提库斯士兵书》是斥责一位不列颠首领的部下掳杀他刚施洗的信徒。

  《历史的轨迹》第七章称他为不列颠的修道士，说他在公元 461 年去世时，教会已在爱尔兰立稳。他的卒年在爱尔兰的年代记里另有 493 年前后一说。用三叶草讲解三位一体、把蛇赶出爱尔兰之类的故事，都出自几百年以后的传说。此后爱尔兰的教会以修道院为中心发展起来，成为学问和宣教的据点。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 圣帕提克《忏悔录》第 1、16—23、41—42、50 节
  - 圣帕提克《致科罗提库斯士兵书》
  - 《阿尔斯特年代记》
