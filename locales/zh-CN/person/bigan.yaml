name: 比干
aliases: [王子比干]
role: 商朝王族、大臣
summary: 商纣王的叔父，屡次强谏，相传被纣剖心而死；孔子称“殷有三仁”。
body: |-
  比干是商朝王族，一般认为是纣王的叔父（《史记·宋微子世家》只说他是“纣之亲戚”）。他的生卒年不详。

  据《史记·殷本纪》，纣王淫乱不止，微子屡谏不听而出走，比干说“为人臣者，不得不以死争”，于是强谏纣王。纣王发怒说：“吾闻圣人心有七窍。”就剖开比干的胸膛看他的心。这一记载流传极广，但细节是否真实，已难以考证。

  《论语·微子》说：“微子去之，箕子为之奴，比干谏而死。孔子曰：殷有三仁焉。”比干由此成为后世忠臣的典范。据《史记·周本纪》，武王克商后命人修整比干的墓，以示表彰。
sources: []
recalled:
  - 《史记·殷本纪》
  - 《史记·宋微子世家》
  - 《论语·微子》
