name: 巴门尼德
aliases: []
role: 哲学家
summary: 埃利亚人。论证“存在”不生不灭、唯一不动，开创埃利亚学派。
body: |-
  意大利南部希腊城邦埃利亚人。他的年代有两种推法。柏拉图在《巴门尼德》中说，他约六十五岁时与弟子芝诺到雅典参加泛雅典娜大节，与当时还很年轻的苏格拉底交谈；如果这次会面确有其事，他约生于公元前 515 年。古代年代学家则把他的盛年定在前 500 年前后，那样他要早生二三十年。这里取前一种。据普鲁塔克和第欧根尼·拉尔修转引的说法，他为埃利亚制定过法律。卒年不详。

  他用六音步诗体写了一部作品，今存约一百六十行，主要靠塞克斯都·恩披里柯和辛普里丘的引用而保留。序诗写诗人乘马车被引到一位女神面前，女神向他指出两条路。第一部分“真理之路”论证：只有“存在”存在，“不存在”既不能被思想也不能被言说；因此存在不生不灭，完整而唯一，不动，没有过去和将来。生成、毁灭、运动、多样，都只是凡人的意见。第二部分“意见之路”仍然给出了一套关于天地的解说，以光明与黑夜两种形式为基础；他为什么在否定了感官所见之后还这样写，古今学者解释不一。

  他是希腊哲学中第一个用连续的推论来证明结论的人。弟子芝诺提出一系列悖论为他辩护，萨摩斯的麦里梭继续发挥他的学说，后世合称埃利亚学派。此后恩培多克勒、阿那克萨戈拉和原子论者的学说，都是在承认“无中不能生有”的前提下，设法重新解释变化。柏拉图称他“可敬而又可畏”。
sources: []
