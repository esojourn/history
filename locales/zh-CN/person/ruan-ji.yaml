name: 阮籍
aliases: [阮嗣宗, 阮步兵]
role: 诗人
summary: 魏末诗人，“竹林七贤”之一，以饮酒放达避祸，著有《咏怀诗》八十余首。
body: |-
  据《晋书·阮籍传》，阮籍字嗣宗，陈留尉氏人，父亲阮瑀是“建安七子”之一。本传说他本有济世之志，但身处魏晋之际，名士多遭杀身之祸，于是不问世事，以饮酒为常。他先后在司马懿、司马师、司马昭手下任从事中郎，后来听说步兵校尉的官署里藏有好酒，便求为步兵校尉，世称“阮步兵”。

  本传记载了他不少逸事：司马昭想为儿子司马炎向他家求婚，他连醉六十天，使对方无从开口；他能作“青白眼”，对拘守礼法的人以白眼相看；他言谈玄远，从不评论人物的好坏，司马昭称他“至慎”。他曾登上楚汉相争的广武战场，感叹“时无英雄，使竖子成名”。

  景元四年（公元 263 年）司马昭受封晋公，按惯例先行推让，公卿请阮籍起草劝进的文书，他酒醒后一挥而就。这年冬天他去世，终年五十四。他的八十二首五言《咏怀诗》含意隐晦，后人历来认为寄托了对时事的忧惧。
sources: []
recalled:
  - 《晋书·阮籍传》
  - 《三国志·魏书·王卫二刘傅传》
