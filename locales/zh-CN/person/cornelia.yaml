name: 科尔内利娅
aliases: [格拉古兄弟之母, 科涅莉亚, 科尔涅利娅]
role: 格拉古兄弟之母
summary: 大西庇阿之女，格拉古兄弟的母亲，寡居教子，被罗马人奉为母亲的典范。
body: |-
  大西庇阿与埃米利娅的小女儿，约生于公元前 190 年。她嫁给比自己年长许多的提比略·塞姆普罗尼乌斯·格拉古。据普鲁塔克和老普林尼，她生了十二个孩子，长大成人的只有三个：女儿塞姆普罗尼娅（嫁给小西庇阿）和儿子提比略、盖乌斯。

  丈夫在前 150 年代去世后，她没有再嫁；普鲁塔克说，埃及国王托勒密曾向她求婚，被她拒绝。她亲自管教子女，为他们延请希腊教师。瓦勒里乌斯·马克西穆斯记了一个著名的故事：一位坎帕尼亚的贵妇向她炫耀首饰，她等两个儿子放学回来，说：“这就是我的珠宝。”

  她对两个儿子的改革起过多大作用，古人说法不一。普鲁塔克记载，有人说她责备儿子，说罗马人只知道她是西庇阿的岳母，还不知道她是格拉古兄弟的母亲。奈波斯的抄本里保存着两段据称是她写给盖乌斯的信，劝他不要搅乱国家，真伪有争议。

  两个儿子先后被杀之后，她移居那不勒斯湾的米塞努姆，照旧接待宾客和学者。据普鲁塔克，她谈起父亲和儿子们的事迹时不落泪，像在讲古人的事。罗马人为她立了一尊青铜坐像，石座至今尚存。她去世的年份不详，一般估计在前 115 年前后。
sources: []
recalled:
  - 普鲁塔克《提比略·格拉古传》第 1 章、《盖乌斯·格拉古传》第 19 章
  - 瓦勒里乌斯·马克西穆斯《善言懿行录》卷四第 4 章
  - 老普林尼《自然史》卷七、卷三十四
  - 奈波斯残篇
