name: 斯巴达克斯
aliases: [斯巴达克, 斯巴达克思]
role: 角斗士、奴隶起义领袖
summary: 色雷斯出身的角斗士，率奴隶起义转战意大利两年，屡败罗马军队，战死。
body: |-
  色雷斯人，生年不详。阿庇安说他曾在罗马军中服役，后来被俘，卖作角斗士，关在卡普亚伦图卢斯·巴提亚图斯的角斗士学校里。有关他的记载都出自罗马和希腊作家，主要是普鲁塔克的《克拉苏传》、阿庇安的《内战史》和萨卢斯特《历史》的残篇，起义者自己没有留下文字。

  公元前 73 年，学校里约二百名角斗士密谋逃跑，事泄后有七十多人用厨房的刀和铁叉冲了出去，占据维苏威火山。他们推举三人为首领：斯巴达克斯，以及高卢人克里克苏斯和奥诺马乌斯。大法官格拉贝尔带三千人封锁了唯一的山路，起义者用野葡萄藤编成绳梯从悬崖下去，绕到背后夺了营地。此后他们又击败大法官瓦里尼乌斯，牧人和农庄奴隶大批来投，据阿庇安，人数达到七万。

  前 72 年两名执政官出兵。克里克苏斯带一部分人分开行动，在加尔加努斯山被歼。斯巴达克斯先后击败两名执政官；据阿庇安，他让三百名罗马战俘为克里克苏斯举行角斗葬礼。普鲁塔克说他的打算是翻过阿尔卑斯山，让众人各回色雷斯和高卢的家乡；队伍到了意大利北部，又折回南方，原因史料没有说清。

  这年秋天元老院把指挥权交给克拉苏。斯巴达克斯退到意大利半岛的最南端，与奇里乞亚海盗谈妥渡往西西里，海盗收了钱却没有来。克拉苏在地峡上挖壕筑墙，把他困住；冬天的一个雪夜，他带部分人马冲了出去。前 71 年最后一战在卢卡尼亚的西拉鲁斯河附近。据普鲁塔克，战前他杀了自己的马，说胜了有的是好马，败了也用不着；他直奔克拉苏而去，杀死两名百夫长，被围后战死。阿庇安说他的尸体没有找到。克拉苏把六千名俘虏钉死在从卡普亚到罗马的阿庇亚大道两旁。
sources: []
recalled:
  - 普鲁塔克《克拉苏传》第 8—11 章
  - 阿庇安《内战史》卷一第 116—120 章
  - 萨卢斯特《历史》卷三、卷四残篇
  - 弗洛鲁斯《罗马史纲要》卷二第 8 章
