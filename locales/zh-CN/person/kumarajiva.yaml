name: 鸠摩罗什
aliases: [罗什, 童寿]
role: 僧人、译经家
summary: 龟兹高僧，后秦时在长安主持译场，译出《法华经》《金刚经》《维摩诘经》等大量佛典。
body: |-
  鸠摩罗什生在西域的龟兹，名字意译为“童寿”。据《高僧传》和《出三藏记集》，他的父亲鸠摩罗炎是天竺人，放弃相位出家，东越葱岭来到龟兹，龟兹王把妹妹嫁给了他。罗什七岁随母亲出家，九岁到罽宾学习小乘经论，十二岁返回途中在疏勒改学大乘，回到龟兹后名声传遍西域各国。他的生卒年有两种主要说法：弟子僧肇所作的诔文说他卒于后秦弘始十五年（公元 413 年），年七十；《高僧传》则记为弘始十一年（409 年）。

  前秦建元十八年（382 年），苻坚派吕光西征，两年后攻破龟兹，罗什被俘。两书说吕光见他年轻，对他多方戏弄，强迫他娶了龟兹王的女儿。吕光东归途中得知苻坚已死，便占据凉州自立。罗什在姑臧滞留了十六七年，没有机会传教，在此期间学会了汉语。

  后秦弘始三年（401 年），姚兴击败后凉，把他迎到长安，以国师之礼相待，请他在逍遥园和长安大寺翻译佛经，僧肇、僧叡、道生、道融等数百名僧人参与其事。十余年间，他主持译出《大品般若经》《妙法莲华经》《维摩诘所说经》《阿弥陀经》《金刚般若经》等经，《大智度论》《中论》《百论》《十二门论》《成实论》等论，以及《十诵律》。据《出三藏记集》，共三十五部、二百九十四卷。

  以前的汉译佛经大多文句生硬。他通晓梵、汉两种语言，翻译时先讲明原意，再与众人反复斟酌汉文，译文明白流畅，许多经典的通行本至今仍是他的译本。他自己也说过，把梵文改成汉文，原有的辞藻就失去了，好比把饭嚼过再喂给别人。姚兴认为他这样的人不该没有后代，逼他接受了十名女子，另住在寺外，他为此常感惭愧。《高僧传》说他临终发誓，如果所译没有谬误，火化后舌头不会焦烂。他介绍的龙树一系的学说和所译经论，是后来三论、天台等宗派立说的依据。
sources: []
recalled:
  - 《高僧传·鸠摩罗什传》
  - 《出三藏记集》卷十四
  - 僧肇《鸠摩罗什法师诔》
  - 《晋书·艺术传·鸠摩罗什》
