name: 溥仪
aliases: [宣统帝, 爱新觉罗·溥仪]
role: 清朝最后一位皇帝
summary: 三岁即位，1912 年退位，后来做了伪满洲国的皇帝，晚年在北京生活。
body: |-
  溥仪是醇亲王载沣的长子，生于光绪三十二年（1906 年）。光绪三十四年（1908 年）光绪帝去世，慈禧太后临终前命三岁的溥仪入宫继位，次年改元宣统，由他的父亲载沣任监国摄政王。

  宣统三年（1911 年）武昌起义爆发，各省纷纷独立。经过袁世凯与南方的谈判，宣统三年十二月二十五日（公历 1912 年 2 月 12 日），隆裕太后以溥仪的名义颁布退位诏书，清朝结束（另见“清帝退位”条）。根据《清室优待条件》，溥仪保留皇帝的尊号，暂居紫禁城，民国政府每年拨给四百万元的费用。1917 年张勋拥他复辟，十二天后失败。1924 年冯玉祥发动北京政变，把他赶出紫禁城，次年他住进天津的日本租界。

  1931 年九一八事变后，溥仪被日本人秘密带到东北，次年成为日本扶植的伪满洲国“执政”，1934 年改称“皇帝”，年号康德，实际上受日本关东军的控制。1945 年日本投降，溥仪在沈阳机场被苏联军队俘虏，在苏联关押了五年，1950 年被移交给中国，在抚顺战犯管理所接受改造。

  1959 年溥仪获得特赦，此后在北京植物园工作，后来任全国政协文史资料研究委员会专员，写了自传《我的前半生》。1967 年他在北京病逝。本站以 1912 年为清朝的终点，溥仪退位以后的经历只在这里简述。
sources: []
recalled:
  - 溥仪《我的前半生》
  - 《清史稿·宣统皇帝本纪》
