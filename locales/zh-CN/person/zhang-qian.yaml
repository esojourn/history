name: 张骞
aliases: [博望侯]
role: 使者
summary: 汉武帝时两次出使西域的使者，到过大宛、大月氏、乌孙等国，带回了西域的第一手见闻。
body: |-
  据《史记·大宛列传》，张骞是汉中成固人，建元年间在朝中做郎官。当时武帝从匈奴降人那里听说，月氏被匈奴击败后西迁，怨恨匈奴，便想联络月氏一同夹击匈奴，招募使者。张骞应募，带着百余人和匈奴人堂邑父从陇西出发，途中被匈奴扣留。他在匈奴住了十余年，娶妻生子，始终保留着汉朝的使节。

  后来他趁看守松懈逃走，向西到了大宛，经康居抵达大月氏。这时月氏已在妫水以北定居，又臣服了大夏，不想再向匈奴报仇。张骞在那里住了一年多，没有得到明确答复。归途中他改走南山以避开匈奴，仍被捉住，又被扣留一年多。元朔三年（公元前 126 年）匈奴单于去世，国内争位，他才带着匈奴妻子和堂邑父逃回长安。列传说，出发时的百余人中只有这两人归来。

  他向武帝详细报告了大宛、大月氏、大夏、康居等国的位置、物产和兵力，还提到在大夏见过从身毒贩运来的蜀地布匹和邛竹杖，武帝因此派人从西南寻找通往身毒的道路。元朔六年他随卫青出征，因熟知水草所在而有功，封博望侯。元狩二年（前 121 年）他与李广同出右北平，因延误军期，按律当斩，赎为平民。

  此后他建议联络乌孙，以断匈奴右臂。武帝派他率三百人，带着大批牛羊和金帛再度西行。乌孙没有答应东迁，但派使者随他回访；他另派副使分赴大宛、康居、大月氏、安息等国。元鼎二年（前 115 年）他回到长安，任大行，一年多后去世。此后汉朝派往西域的使者多自称博望侯以取信于各国。司马迁称他的出使为“凿空”。
sources: []
recalled:
  - 《史记·大宛列传》
  - 《汉书·张骞李广利传》
