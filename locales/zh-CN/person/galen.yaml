name: 盖伦
aliases: [帕加马的盖伦, 加伦, 克劳狄乌斯·盖伦]
role: 医学家
summary: 希腊医学家，马可·奥勒留的御医，其学说支配西方医学一千三百多年。
body: |-
  盖伦于公元 129 年生在小亚细亚的帕加马，父亲尼孔是富有的建筑师。他先学哲学；据他自己说，十六岁那年父亲梦见医神阿斯克勒庇俄斯，便让他改学医。父亲死后他到士每拿、科林斯和亚历山大城游学十来年，157 年回帕加马，给大祭司养的角斗士做医生，从处理伤口中得到许多解剖上的见识。

  162 年他到罗马，当众做动物解剖，治好了几位显贵，名声大起，也同别的医生结了怨。166 年他离开罗马回乡，这一年瘟疫正传到都城。168 年马可·奥勒留和卢基乌斯·维鲁斯召他到阿奎莱亚的军中；后来皇帝北征，留他在罗马照看康茂德。他记下了这场瘟疫病人的症状，后人据此推测是哪种病。192 年罗马和平神庙一带失火，他存放在那里的许多书稿和药物被烧掉，为此写的《论免于忧伤》2005 年才在希腊一座修道院里重新发现。

  当时不许解剖人体，他用的是猕猴、猪和牛。他证明动脉里流的是血而不是气；切断猪的喉返神经，猪就叫不出声，由此说明声音受脑和神经支配；结扎输尿管，证明尿出自肾脏。他把人体解剖的结论从动物推到人身上，其中的错误要到十六世纪维萨里才被纠正。在医理上，他继承希波克拉底一派的四体液说，认为血液、黏液、黄胆汁、黑胆汁失调致病，并据此配药、放血。

  他著述极多，流传下来的希腊文原著加上叙利亚文、阿拉伯文译本有一百多种。卒年有两说：《苏达辞书》说他活了七十岁，阿拉伯文的传记说八十七岁，现在多取后一说，约在 216 年。他的学说经阿拉伯学者传到中世纪的欧洲，直到 1628 年哈维论证血液循环，才整体上被取代。
