name: 唐顺宗
aliases: [李诵]
role: 皇帝
summary: 唐德宗长子，即位时已中风失语，任用王叔文推行永贞革新，半年后被迫让位。
body: |-
  李诵是唐德宗的长子，上元二年（公元 761 年）生。大历十四年（779 年）德宗即位，次年立他为太子，此后做了二十多年太子。泾原兵变时他随德宗逃到奉天，亲自登城督战。做太子期间，他与东宫的侍读王叔文、王伾关系密切，对宫市等弊政有所不满。

  贞元二十年（804 年）九月他突然中风，不能说话。次年正月德宗去世，他在病中即位。朝政由王叔文、王伾主持，联合韦执谊、刘禹锡、柳宗元等人，罢宫市，停止各地额外进奉，贬斥贪暴的京兆尹李实，并试图从宦官手中收回神策军的兵权，史称“永贞革新”（另见该条）。

  宦官俱文珍等人与一些藩镇联合反对，迫使他在三月立长子李纯为太子，八月让位，自称太上皇，改元永贞。王叔文等人随即被贬。元和元年（806 年）正月，他在兴庆宫去世，年四十六。他的死讯来得突然，后世有学者怀疑他是被宦官害死的，但缺乏确证。
sources: []
recalled:
