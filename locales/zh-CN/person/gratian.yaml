name: 格拉提安
aliases: [格拉蒂安, 革拉先, 格拉提亚努斯]
role: 罗马皇帝
summary: 瓦伦提尼安一世长子，西部的罗马皇帝，立狄奥多西治东方。
body: |-
  格拉提安于公元 359 年 4 月 18 日生在西尔米乌姆，八岁时被父亲瓦伦提尼安一世立为皇帝，老师是高卢诗人奥索尼乌斯。375 年父亲去世，多瑙河的军队又拥立他四岁的异母弟瓦伦提尼安二世，他接受了，西部实际上仍由他主持。

  378 年他在莱茵河上游打败阿勒曼尼人，随后东进，去支援与哥特人对峙的叔父瓦伦斯。瓦伦斯没有等他到，就在阿德里安堡出战，兵败身死。379 年 1 月，他在西尔米乌姆立将军狄奥多西为皇帝，把东方和哥特战事交给他。

  他受米兰主教安波罗修影响很深。他不再接受历代皇帝兼任的“大祭司”袍服；382 年下令把胜利女神祭坛搬出元老院，停发维斯塔贞女和各祭司团的公款，元老们派人请愿，没有见到他。383 年，不列颠的军队拥立马格努斯·马克西穆斯并渡海到高卢，格拉提安的部队在巴黎附近倒戈；他逃到卢格杜努姆，8 月 25 日被追兵杀死。
sources: []
