name: 克里提亚斯
aliases: [克里底亚]
role: 雅典寡头首领、作家
summary: 三十僭主的首领，公元前 403 年在比雷埃夫斯战死。
body: |-
  雅典人，出身古老的贵族家庭，祖上与梭伦有亲。柏拉图的母亲是他的堂妹。他年轻时与苏格拉底交往，也向智者学习；柏拉图的《卡尔米德篇》《普罗泰戈拉篇》里都有他出场。他写过哀歌体的诗、论各邦政制的散文和悲剧，今存残篇。一段出自剧本《西绪福斯》的台词说，神是某个聪明人为了让人在暗处也不敢作恶而发明的，这段话归他还是归欧里庇得斯，学者有争议。

  公元前 415 年赫耳墨斯石像被毁一案中他一度被捕，后获释。前 411 年前后他提议召回亚西比德。约前 406 年他被放逐，住在色萨利。前 404 年雅典投降后他回国，成为吕山德扶植的三十人政权中最强硬的一个。三十人原定的任务是起草新法，实际上不经审判就杀人、没收财产，并请来斯巴达驻军。《雅典政制》说他们杀了不下一千五百人。同僚塞拉门尼斯主张扩大参政者的范围，克里提亚斯把他的名字从享有权利的三千人名单上划去，当场处死。

  色诺芬说，三十人曾下令禁止“教授言谈的技艺”，这是冲着苏格拉底来的；苏格拉底后来受审，克里提亚斯做过他的同伴一事是人们没有忘记的。前 403 年，流亡者在色拉西布洛斯率领下占据比雷埃夫斯，三十人率军进攻，在穆尼基亚的山坡上战败，克里提亚斯阵亡。
sources: []
recalled:
  - 色诺芬《希腊史》卷二第 3—4 章；《回忆苏格拉底》卷一第 2 章
  - 《雅典政制》第 34—38 章
  - 克里提亚斯残篇（第尔斯—克兰茨编号第 25 条）
