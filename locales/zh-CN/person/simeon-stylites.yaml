name: 坐柱者西门
aliases:
  - 柱顶圣徒西门
  - 老西默盎
role: 叙利亚苦修者
summary: 叙利亚的苦修者，在柱顶上住了三十多年，是“柱顶修士”的第一人。
body: |-
  西门约在公元 390 年生于叙利亚与基利家交界处的西桑村，少年时放羊。他的事迹主要见于居比路主教狄奥多勒的《敬虔史》，狄奥多勒认识他本人，书写成时他还在世。

  他先进了一所修道院，因苦修过于严厉，约十年后被请了出去。约公元 412 年，他到安提阿东北的特拉尼索斯，在山上独居。来看他、求他祷告的人越来越多，据狄奥多勒说，他为了避开人群的拥挤，约在 423 年站到一根柱子上，后来几次换成更高的柱子，最后一根约高四十肘。《历史的轨迹》第六章说他最后的柱子高六十尺，柱顶四尺见方，他在柱上住了三十年；按狄奥多勒和后来传记的年数推算，前后约三十六七年。

  他在柱上每天向来人讲道两次，为人调解争讼，皇帝和主教也来信向他请教。公元 459 年 9 月，他死在柱上，遗体被迎到安提阿。此后几个世纪，叙利亚等地有不少人效法他，称为柱顶修士。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第六章“教会渐趋腐化” https://wellsofgrace.com/books/spiritual/2000years/html/chapter07.html"
recalled:
  - 狄奥多勒《敬虔史》第 26 章
  - 安东尼《西门传》
  - 叙利亚文《西门传》
