name: 周成王
aliases: [姬诵]
role: 周王
summary: 周武王之子，年幼即位，由周公摄政；亲政后与康王时期并称“成康之治”。
body: |-
  周成王姓姬名诵，是周武王之子，生年不详。武王死时他年幼，由叔父周公旦摄政。夏商周断代工程把他的在位年代定为约公元前 1042 年至前 1021 年。

  据《史记·周本纪》，成王初年管叔、蔡叔散布流言、勾结武庚叛乱，成王一度对周公有所怀疑；后来打开金縢之匮，看到周公当年愿以身代武王的祷辞，才消除疑虑（见《尚书·金縢》）。周公东征平定叛乱后，主持营建东都洛邑。1963 年陕西宝鸡出土的何尊，铭文记载成王在成周营建都邑，并说“宅兹中国”，这是“中国”一词目前所知最早的出处。

  周公摄政七年后还政，成王亲政。据《史记》，成王在召公、毕公等人辅佐下，又东伐淮夷、践奄，迁殷遗民。成王临终前命召公、毕公辅佐太子钊，就是康王，事见《尚书·顾命》。《史记》说成王、康王之际“天下安宁，刑错四十余年不用”，后世称为“成康之治”。

  成王时期的青铜器流传下来不少，如记载周王伐商邑、命康侯封于卫的康侯簋。成王去世后太子钊即位，就是康王，《尚书》的《顾命》《康王之诰》记载了成王临终托付和康王即位的仪式，是研究周代礼制的重要资料。

  按断代工程的年表，他在位二十二年。
sources: []
recalled:
  - 《史记·周本纪》
  - 《尚书·金縢》
  - 《尚书·顾命》
  - 何尊铭文
