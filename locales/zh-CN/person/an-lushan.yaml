name: 安禄山
aliases: [轧荦山, 大燕雄武皇帝]
role: 平卢、范阳、河东节度使，大燕皇帝
summary: 唐玄宗时身兼三镇的节度使，755 年起兵叛唐，次年在洛阳称帝，后被儿子所杀。
body: |-
  安禄山是营州柳城的胡人，据记载父亲姓康，母亲阿史德氏是突厥人，本名轧荦山。他幼年丧父，母亲改嫁突厥人安延偃，他便改姓安，名禄山。他通晓多种民族的语言，起初在边境互市中担任中介。后来投到幽州节度使张守珪部下，因骁勇善战被张守珪收为养子。

  开元二十四年（公元 736 年）他讨伐契丹战败，张守珪奏请处斩，宰相张九龄主张依法处死，玄宗却赦免了他。此后他善于结交来往的朝廷使者，屡受称赞。天宝元年（742 年）他任平卢节度使，天宝三载（744 年）兼任范阳节度使，天宝十载（751 年）又兼河东节度使，统领了北方边境的大量兵马。他身躯肥胖，在玄宗面前却能跳胡旋舞；他请求做杨贵妃的养子，入宫时先拜贵妃，说胡人先母后父。玄宗对他深信不疑，在长安为他修建豪华的宅第。

  李林甫在世时，他对李林甫颇为畏惧。杨国忠任宰相后，两人不和，杨国忠多次说他必反。天宝十四载（755 年）十一月，他以讨伐杨国忠为名在范阳起兵，河北州县望风瓦解，十二月攻陷东都洛阳（另见“安史之乱”条）。次年正月他在洛阳自称大燕皇帝，六月叛军攻入长安。

  起兵后他的视力逐渐丧失，又生了毒疮，性情越来越暴躁，左右常遭鞭打。他宠爱段氏所生的儿子，想废掉长子安庆绪。至德二载（757 年）正月，安庆绪与谋臣严庄、宦官李猪儿合谋，在夜里把他杀死，年五十五。安庆绪自立后，叛乱仍在继续，直到广德元年（763 年）才最终平定。
sources: []
