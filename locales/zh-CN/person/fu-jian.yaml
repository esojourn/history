name: 苻坚
aliases: [苻永固, 文玉, 前秦宣昭帝]
role: 前秦君主
summary: 氐族人，前秦君主，任用王猛整顿政治，统一北方，南征东晋时在淝水大败，国家瓦解。
body: |-
  苻坚字永固，一名文玉，氐族人，祖籍略阳临渭。他的祖父苻洪是氐人首领，伯父苻健在后赵崩溃后率众西入关中，于永和七年（公元 351 年）建立前秦。

  苻健死后，继位的苻生嗜杀成性。升平元年（357 年），苻坚在一批大臣支持下发动政变，杀苻生而自立，称大秦天王。他重用汉族寒士王猛，让他整顿吏治、打击横行不法的氐族权贵和旧臣，自己则劝课农桑，兴修关中水利，设立学校，每月亲自到太学考查学生。

  国力充实以后，他开始向外用兵：太和五年（370 年）王猛率军灭前燕；此后几年他取仇池，夺东晋的梁、益二州；太元元年（376 年）灭凉州的前凉和塞北的代国。至此黄河流域自西晋灭亡以来第一次统一于一个政权之下。对被征服各族的首领，他一概宽待，把大批鲜卑、羌人迁到关中，慕容垂、姚苌等人都被授予要职。王猛临终时劝他不要图谋东晋，要提防鲜卑和羌人，他没有照办。

  太元七年（382 年）他提出南征，说以自己的兵力，把马鞭投进长江就足以让江水断流，“投鞭断流”即出于此。弟弟苻融、太子、高僧道安等多数人反对，他不为所动。次年八月他倾国而出，载记称步兵六十余万、骑兵二十七万。苻融率前锋攻下寿阳。十一月晋军在洛涧取胜后进逼淝水，他登上寿阳城，望见晋军阵容严整，又把八公山上的草木都看成了人影。决战时秦军应晋方的要求后撤，阵脚大乱，苻融战死，他中箭后逃回淮北。溃兵听到风声和鹤鸣都以为是追兵，“草木皆兵”“风声鹤唳”两个成语都出自这一战。

  他回到长安后，慕容垂在河北、慕容泓兄弟在关中、姚苌在渭北相继反叛。太元十年（385 年）长安被鲜卑人慕容冲围困，城中断粮。他出奔五将山，被姚苌的部队俘获。姚苌向他索要传国玺，他痛骂不与，八月在新平的佛寺中被缢杀，时年四十八。前秦余部又支撑了近十年。
sources: []
recalled:
  - 《晋书·苻坚载记》
  - 《资治通鉴》卷一百至一百零六
