name: 牛僧孺
aliases: [牛思黯]
role: 宰相
summary: 唐穆宗、文宗时的宰相，牛李党争中“牛党”的首领，著有传奇集《玄怪录》。
body: |-
  牛僧孺字思黯，安定鹑觚人，大历十四年（公元 779 年）生，贞元二十一年（805 年）考中进士。元和三年（808 年）他与李宗闵等人参加制科考试，在策文中尖锐批评时政，主考官把他们列为上等，宰相李吉甫向唐宪宗哭诉，考官被贬，牛僧孺等人也久不得升迁，后世多把这件事看作牛李党争的起因之一（另见“牛李党争”条）。

  唐穆宗长庆三年（823 年）他任宰相，唐文宗时再次任相。大和五年（831 年），吐蕃的维州守将悉怛谋向西川节度使李德裕投降，李德裕主张接受，牛僧孺认为唐蕃已经会盟，接受降将会失信于吐蕃，文宗听从他的意见，下令归还维州和悉怛谋等人，悉怛谋等人被吐蕃全部杀害。后来朝中舆论多认为此事处置失当，他因此罢相，出任淮南节度使，杜牧当时在他的幕府中。唐武宗时李德裕执政，他被一贬再贬。唐宣宗即位后被召回，大中二年（848 年）去世，年七十。

  他喜爱奇石，白居易为他写过《太湖石记》。他写的传奇小说集《玄怪录》，是唐代志怪传奇的代表作之一。
sources: []
recalled:
  - 《旧唐书·牛僧孺传》
  - 《新唐书·牛僧孺传》
  - 《资治通鉴》卷二百三十七至二百四十八
