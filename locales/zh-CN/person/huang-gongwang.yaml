name: 黄公望
aliases: [黄子久, 大痴道人, 一峰]
role: 画家
summary: 元代画家，“元四家”之首，晚年所作《富春山居图》被视为中国山水画的代表作。
body: |-
  黄公望字子久，号大痴道人，平江常熟（今江苏常熟）人，生于咸淳五年（公元 1269 年）。他本姓陆，自幼过继给永嘉黄氏，据说养父年老得子，说“黄公望子久矣”，于是给他取名公望、字子久。

  他早年做过浙西廉访司的书吏，延祐年间受上司张闾贪污案的牵连入狱。出狱后他不再做官，加入全真教，在杭州、松江、常熟等地卖卜、教书，往来于江浙山水之间，五十岁左右才专心学画，据说曾向赵孟頫请教。

  黄公望的山水画以浅绛设色、笔墨简远著称，他著有《写山水诀》，总结作画的心得。他与吴镇、倪瓒、王蒙并称“元四家”，居首位。代表作《富春山居图》是他晚年在富春江一带为师弟无用师所画，前后用了几年时间才完成，描绘富春江两岸的景色。此图明末传到吴洪裕手中，吴临终时命家人焚画殉葬，被侄子从火中抢出，已烧成两段，前段称《剩山图》，现藏浙江省博物馆，后段称《无用师卷》，现藏台北故宫博物院。黄公望至正十四年（1354 年）去世。
sources: []
recalled:
  - 钟嗣成《录鬼簿》
  - 黄公望《富春山居图》题跋
