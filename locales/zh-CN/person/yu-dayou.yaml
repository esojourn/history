name: 俞大猷
aliases: [虚江, 武襄]
role: 抗倭名将
summary: 福建晋江人，与戚继光并称“俞龙戚虎”，在浙江、福建、广东多次击败倭寇。
body: |-
  俞大猷是福建晋江人，世袭泉州卫百户，好读书，又跟人学习剑术和兵法，嘉靖十四年（1535 年）考中武举。他先后在广东、海南、安南边境等地作战，屡立战功，但多次因得罪上司或受人牵连而被罢官、下狱。

  嘉靖三十年代倭寇大举侵扰江浙，俞大猷被调到浙江，任参将、总兵官，多次与倭寇交战，有胜有败。他重视水军，主张在海上截击倭寇，所部被称为“俞家军”。嘉靖四十二年（1563 年）他与戚继光、刘显一起收复福建兴化府城，在平海卫大败倭寇。此后他又到广东平定倭寇和海盗吴平等人（另见“嘉靖抗倭”条）。时人把他和戚继光并称“俞龙戚虎”。

  俞大猷著有《正气堂集》《剑经》等，《剑经》讲棍法，戚继光的《纪效新书》曾加以收录。万历年间他在后军都督府任职，万历七年（1579 年）去世，追谥“武襄”。
sources: []
recalled:
