name: 晋明帝
aliases: [司马绍, 司马道畿, 肃宗]
role: 皇帝
summary: 东晋第二位皇帝，在位三年，平定王敦之乱，二十七岁去世。
body: |-
  司马绍字道畿，是晋元帝的长子。《晋书·明帝纪》和《世说新语·夙惠》都记有他幼年的一件事：父亲问他长安和太阳哪个远，他说太阳远，因为只听说有人从长安来，没听说有人从太阳那里来；第二天当着群臣再问，他却说太阳近，因为抬头看得见太阳，看不见长安。

  元帝即位后他被立为太子，喜好文辞，善待士人，王导、庾亮、温峤等都与他亲近。王敦第一次入京时曾想废掉他，因大臣反对而作罢。永昌元年闰十一月（已入公元 323 年）元帝去世，他继位。

  太宁二年（324 年）王敦病重，他下诏公布王敦的罪状，以王导为大都督，调苏峻、祖约等带兵入援，击败了王敦派来的军队。王敦死后，他只追究王敦本人及其党羽，没有株连王氏一族。太宁三年（325 年）闰八月他去世，时年二十七，遗诏命王导、庾亮等人辅佐年仅五岁的太子司马衍。
sources: []
recalled:
  - 《晋书·明帝纪》
  - 《世说新语·夙惠》
  - 《资治通鉴》卷九十二、九十三
