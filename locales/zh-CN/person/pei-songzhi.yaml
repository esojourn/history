name: 裴松之
aliases: [裴世期]
role: 史学家
summary: 奉宋文帝之命为陈寿《三国志》作注，广引群书，注文与正文篇幅相当。
body: |-
  裴松之字世期，河东闻喜人，出身河东裴氏。据《宋书》本传，他八岁通晓《论语》《毛诗》，博览坟籍。东晋末年入仕，曾上表请求禁止私自立碑，主张立碑须经朝廷许可，以免虚美失实。入宋后，历任国子博士、中书侍郎等职。

  宋文帝嫌陈寿的《三国志》过于简略，命他作注。他广泛搜集三国时期的史书、家传、文集，元嘉六年（429 年）完成上奏，文帝看后称赞说这是不朽之作。他在《上三国志注表》里说明了作注的办法：陈寿没有记的补上，同一件事说法不同的一并收录，明显错误的加以辨正，并对史事和陈寿的看法有所评论。注中引用的书多达一二百种（各家统计不一），其中大半后来亡佚，靠他的注才保存下片段，所以这部注本身也成了研究三国史的重要史料。

  他死于元嘉二十八年（451 年），年八十。儿子裴骃作《史记集解》，曾孙裴子野著《宋略》，都是史学名家。
sources: []
recalled:
