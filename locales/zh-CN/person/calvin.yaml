name: "加尔文"
aliases: ["约翰·加尔文", "让·加尔文", "喀尔文"]
role: "日内瓦的改教家、神学家"
summary: "法国人，著《基督教要义》，在日内瓦建立长老治会的教会，影响遍及法、荷、苏格兰。"
body: |-
  加尔文 1509 年 7 月 10 日生于法国北部皮卡第的努瓦永，父亲替当地主教办理文书。《历史的轨迹》第二十四章说，他十一岁就得了一份教会的俸禄，母亲早逝，在贵族人家受教养，十二岁到巴黎读书；同章又说他 1523 年到巴黎，那时他十四岁，后一个说法是通行的。他在巴黎读完文科，奉父命到奥尔良、布尔日学法律，跟沃尔马学了希腊文。1531 年父亲去世，他回巴黎研究古典，次年出版了塞涅卡《论仁慈》的注释。

  他什么时候接受改教的信仰，没有确切记载；该书引他晚年的话，说神以一次突然的归正征服了他的心。1533 年万圣节，他的朋友、巴黎大学校长科普发表带有改教思想的演讲，他受牵连出逃。1535 年初他到了巴塞尔，1536 年 3 月出版《基督教要义》，卷首是致法王弗朗索瓦一世的信，为受逼迫的法国信徒申辩。那年他二十六岁。

  同年夏天他要去斯特拉斯堡，因战事绕道日内瓦，打算只住一夜。该书详记法雷尔到旅店挽留他，见他推辞，便说：教会急需的时候你若不肯援手，愿神咒诅你的学问。他留了下来。1538 年 4 月两人因教会惩戒和礼仪由谁作主的事与市议会冲突，被逐出城。他应布塞之邀到斯特拉斯堡牧养法语难民教会，在那里结了婚。该书说他的妻子是荷兰来的；她是列日一带的人，原是一位重洗派信徒的遗孀。

  1541 年 9 月 13 日他被请回日内瓦，随即拟定《教会宪章》，设牧师、教师、长老、执事四职，由牧师和长老组成的教会法庭管束信徒的信仰和生活。反对他的人很多。1553 年否认三位一体的塞尔维特在日内瓦被烧死；1555 年以后反对派失势。1559 年他创办日内瓦学院，由贝扎主持，同年出了《要义》拉丁文的定本。该书说这是第三次修订版，篇幅是初版的五倍；按版次算是拉丁文第五版。该书又说他把圣经译成法文；法文圣经是他的亲戚奥利维坦译的，他只作过序言和修订。

  他身体一向多病，1564 年 5 月 27 日在日内瓦去世，按他的意思葬处不立碑。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十四章“瑞士的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter27.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十六章“西欧的改教运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter29.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十七章“苏格兰教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter30.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
