name: 杨炎
aliases: [杨公南]
role: 宰相
summary: 唐德宗时的宰相，建议推行两税法，改变了唐朝的税收制度；后因报复刘晏等事被赐死。
body: |-
  杨炎字公南，凤翔天兴人，开元十五年（公元 727 年）生，以文辞出众著称，曾任中书舍人，为朝廷起草诏书，受到宰相元载的器重。大历十二年（777 年）元载被诛，他作为元载的同党被贬为道州司马。

  大历十四年（779 年）唐德宗即位，召他回京任宰相。当时均田制早已瓦解，户籍混乱，按丁征收的租庸调法已经难以实行，各地又有名目繁多的临时摊派。他向德宗建议实行两税法，不论主户客户，都按现居住地登记户籍，按资产和田亩的多少征税，每年分夏、秋两次征收，朝廷先定总额再分配到各地。建中元年（780 年）两税法开始施行，此后成为唐后期到明代中叶的基本税制（另见“两税法”条）。两税法简化了税目，把客户也纳入征税范围；但税额以钱计算，后来钱重物轻，百姓的实际负担加重，陆贽等人曾上疏批评。他还恢复了天下财赋输入国库左藏的旧制，不再存入皇帝的私库大盈库。

  但他执政期间好报私怨，刘晏曾参与审理元载一案，他便罢去刘晏的职务，又诬陷刘晏谋反，致其被赐死，朝野多为刘晏不平。他与另一位宰相卢杞不和，建中二年（781 年）被卢杞排挤罢相，随即被贬为崖州司马，在离崖州一百里的地方被赐死，年五十五。
sources: []
