name: 于谦
aliases: [于少保, 忠肃]
role: 兵部尚书
summary: 土木之变后力主坚守北京，拥立景泰帝，指挥北京保卫战击退瓦剌；夺门之变后被冤杀。
body: |-
  于谦是钱塘（今浙江杭州）人，永乐十九年（1421 年）考中进士。宣德年间他任御史，随宣德帝平定汉王朱高煦之乱，因数落朱高煦的罪状声色俱厉而受到赏识。此后他以兵部侍郎的身份巡抚河南、山西长达十余年，赈济灾民，兴修水利，深得百姓爱戴。据说他每次进京，不像别人那样给权贵送礼，有人劝他带些土产，他举起两袖说只有清风，“两袖清风”一语即与此事有关。正统年间他曾因得罪王振被下狱，后来获释复职。

  正统十四年（1449 年）他在北京任兵部左侍郎。土木之变后，英宗被俘，京城精兵大多覆没，侍讲徐珵（即徐有贞）等人主张南迁，于谦厉声反对，说主张南迁的人应当斩首，京师是天下的根本，一动大事就去了，并以宋朝南渡为戒。他升任兵部尚书，与大臣们一起拥立郕王朱祁钰为帝，调集各地军队入卫京师，整顿兵器粮草。当年十月也先挟英宗进犯北京，于谦亲自督战，在德胜门外等处击败瓦剌军，也先退走（另见“北京保卫战”条）。

  此后于谦整顿京营，创立团营制度，加强北方边防，也先被迫送回英宗。景泰八年（1457 年）正月石亨、徐有贞等人发动“夺门之变”，英宗复位，于谦被诬以“意欲”迎立外藩的罪名处死，年六十岁。据记载，抄家时他家中除了皇帝赏赐的物品外别无余财。

  成化初年于谦得到平反，弘治年间追谥“肃愍”，万历年间改谥“忠肃”。他的墓在杭州西湖畔，与岳飞墓相近，后人把岳飞、于谦和明末的张煌言合称“西湖三杰”。他的诗《石灰吟》（“粉身碎骨浑不怕，要留清白在人间”）流传很广，但这首诗是否为他所作，学者有不同看法。
sources: []
recalled:
  - 《明史·于谦传》
  - 《明英宗实录》
