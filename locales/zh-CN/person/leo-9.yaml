name: 利奥九世
aliases:
  - 图勒的布鲁诺
  - 良九世
role: 罗马主教（教皇）
summary: 1049—1054 年在位的教皇，把克吕尼的革新带进教廷；东西教会在他任内决裂。
body: |-
  利奥原名布鲁诺，1002 年生于阿尔萨斯的伯爵家庭，是皇室的亲属。1026 年他任图勒主教，一做二十多年，在自己的教区里整顿修道院。1048 年底皇帝亨利三世指派他为教皇。据他的传记，他表示要得到罗马教士和民众的选举才肯就任，穿着朝圣者的衣服走进罗马，1049 年 2 月即位。

  《历史的轨迹》第十四章说，他因为有改革的热诚才被皇帝选中。他即位后首先改组枢机团（该书译作“红衣主教会议”）：原来的枢机都出自罗马贵族，他换上赞同克吕尼革新的人，并从各地挑选，其中有洛林人洪贝尔和后来的教皇司提反九世。跟随贵格利六世流亡在德意志的希尔得布兰也由他带回罗马，管理教廷的财务。他亲自到法国、德意志各地开会，1049 年在兰斯要到会的主教逐一申明自己的职位不是花钱买来的。该书归纳他强调的三件事：教士不得娶妻，不得买卖圣职，不经教士和会众选举不得担任教会职务。

  意大利南部的诺曼人侵占教皇的土地，1053 年利奥亲自带兵去打，在奇维塔泰战败被俘，被扣留了约九个月。

  1054 年初他派洪贝尔等人去君士坦丁堡，原想与皇帝联合对付诺曼人，并解决与主教长瑟如拉留的争执。使团在 7 月 16 日把革除瑟如拉留教籍的文书放在圣索菲亚教堂的祭坛上。《历史的轨迹》说这是利奥的代表拿着教皇的诏谕去做的；利奥已在同年 4 月 19 日于罗马去世，文书出自洪贝尔之手，使团这时是否还有权这样做，历来有争议。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十四章“教会为自由奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter16.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十五章“教会继续为自由奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter17.html"
recalled:
  - 《利奥九世传》（旧题维贝尔撰）
  - 圣雷米的安塞尔姆《兰斯圣雷米教堂祝圣记》
  - 阿普利亚的威廉《罗贝尔·吉斯卡尔行传》卷 2
