name: 泰勒斯
aliases: [泰利斯]
role: 哲学家
summary: 米利都人。认为万物本原是水，被亚里士多德称为最早的哲学家。
body: |-
  小亚细亚爱奥尼亚地区的米利都人。他没有著作传世，古人对此已不能确定，关于他的记述都出自后人。生卒年据古代年代学家阿波罗多洛斯的推算，是约数。

  希罗多德说，吕底亚人与米底人交战的第六年，战斗中白昼突然变成黑夜，双方因此罢兵议和，而泰勒斯事先向爱奥尼亚人预言过这次日食会在那一年发生。天文学家推算这次日食在公元前 585 年 5 月 28 日。他凭什么作出预言，是否真能预言，学者有不同看法。希罗多德还记有两件事：希腊人传说他为克洛伊索斯的军队开渠分流哈吕斯河，使军队得以渡河，希罗多德本人不信；波斯兵临爱奥尼亚以前，他建议各城在忒俄斯设一个共同的议事会，结成一体。

  亚里士多德在《形而上学》里说，最早探究万物本原的人当中，泰勒斯是创始者，他认为本原是水，大地浮在水上；亚里士多德推测，他可能是看到万物的滋养都靠湿润才这样想。据《论灵魂》，他还说磁石能吸铁，所以有灵魂。公元 5 世纪的普罗克洛斯转引更早的数学史，把几条几何定理归于泰勒斯；古人又说他根据影子的长度量出了金字塔的高度。这些归属都难以核实。

  关于他的轶事有两则流传很广。柏拉图说他仰观星象时掉进井里，被一个色雷斯女仆取笑；亚里士多德说他预见橄榄将丰收，提前租下榨油作坊而获利，以此证明哲学家要赚钱并不难。后世把他列为“七贤”之首。
sources: []
