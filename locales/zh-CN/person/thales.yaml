  - 亚里士多德《形而上学》卷一第 3 章；《政治学》卷一第 11 章；《论灵魂》卷一第 2 章
  - 柏拉图《泰阿泰德》174a
  - 第欧根尼·拉尔修《名哲言行录》卷一
