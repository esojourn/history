name: 哈米尔卡
aliases: [ 哈米尔卡·巴卡 ]
role: 迦太基将领
summary: 汉尼拔之父。第一次布匿战争末期据守西西里，战后经营西班牙。
body: |-
  迦太基将领，汉尼拔、哈斯德鲁巴和马戈的父亲，出生地与生年史料未载。公元前 247 年他出任西西里的迦太基军统帅，先据守赫尔克特山，后转据厄律克斯，数年间不断袭扰罗马军队。前 241 年迦太基舰队在埃加特斯群岛战败，他受命与罗马议和，随后撤出西西里。

  回到非洲后，迦太基的雇佣兵因欠饷哗变，他受命领兵平叛；据波利比乌斯，这场战争打了三年零四个月。前 237 年他率军前往西班牙，在那里经营近九年，扩大迦太基的领地。约前 229 或前 228 年他在西班牙作战时身亡：波利比乌斯只说他战死，狄奥多罗斯说他是撤退渡河时溺死的。
sources:
  - 波利比乌斯《历史》卷一第 56—66、75—88 章，卷二第 1 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/1*.html
  - 英文维基百科“Hamilcar Barca”（核对年份） https://en.wikipedia.org/wiki/Hamilcar_Barca
recalled:
  - 狄奥多罗斯《历史丛书》卷二十五第 10 章
