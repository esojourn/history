name: 怀素
aliases: [钱藏真]
role: 僧人、书法家
summary: 唐代僧人书法家，擅长狂草，与张旭并称“颠张醉素”，传世有《自叙帖》。
body: |-
  怀素俗姓钱，字藏真，永州零陵人，幼年出家为僧。他的生卒年说法不一，一般作 737—799 年，另有 725—785 年等说法。他从小喜爱书法，据唐人的记载，他因为贫穷买不起纸，在寺院附近种了一万多株芭蕉，用芭蕉叶练字，又用漆盘、木板反复书写，写坏的笔堆起来埋在山下，称为“笔冢”，这些说法出自唐人笔记和传记，带有传闻的成分。

  后来他游历长安等地，向书法家邬彤学习，又拜见颜真卿请教笔法，颜真卿为他写过《怀素上人草书歌序》。他嗜酒，常在酒醉后挥毫，在墙壁、屏风、衣服上纵笔疾书，当时的诗人李白、钱起等都写诗赞美过他的草书。他的狂草笔势连绵、圆转飞动，与早于他的张旭并称“颠张醉素”。传世的《自叙帖》（现藏台北故宫博物院）写于大历十二年（777 年），叙述自己学书的经历，抄录了诸家赞美他的诗句；另有《苦笋帖》《食鱼帖》等。
sources: []
recalled:
  - 怀素《自叙帖》
  - 颜真卿《怀素上人草书歌序》
  - 陆羽《僧怀素传》
