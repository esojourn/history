name: 唐僖宗
aliases: [李儇, 李俨]
role: 皇帝
summary: 唐懿宗之子，十二岁即位，宠信宦官田令孜，黄巢入长安时逃往成都，在位期间唐朝崩坏。
body: |-
  李儇原名李俨，是唐懿宗的第五子，咸通三年（公元 862 年）生。咸通十四年（873 年）懿宗病危，宦官刘行深、韩文约立他为太子，随即即位，年仅十二岁。

  他年少好玩，喜欢斗鸡、赌鹅、骑射、击球，据《资治通鉴》，他曾对优伶说，自己如果去考击球进士，一定能中状元。朝政交给从小照顾他的宦官田令孜，他称田令孜为“阿父”。他即位的次年，即乾符元年（874 年）前后，王仙芝在濮州起兵，次年黄巢在冤句响应，起义军转战大半个中国（另见“王仙芝黄巢起义”条）。广明元年（880 年）十二月黄巢攻入长安，他在田令孜和神策军的护卫下逃往成都，黄巢在长安称帝（另见“黄巢入长安”条）。中和三年（883 年）李克用等人收复长安，光启元年（885 年）他回到京城。

  回京后，田令孜为了争夺河中的盐池，与河中节度使王重荣交战，王重荣联合李克用进逼长安，田令孜又带他逃往凤翔、兴元。邠宁节度使朱玫拥立襄王李煴为帝，不久朱玫被部下所杀，李煴也被王重荣所杀。经过这几番变乱，各地藩镇自行其是，朝廷能直接控制的地方已所剩无几。文德元年（888 年）二月他回到长安，三月病逝，年二十七。宦官杨复恭等人拥立他的弟弟寿王李杰，是为唐昭宗。
sources: []
recalled:
  - 《旧唐书·僖宗纪》
  - 《新唐书·僖宗纪》
  - 《资治通鉴》卷二百五十二至二百五十七
