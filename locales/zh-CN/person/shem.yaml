name: 闪
aliases: []
role: 挪亚之子
summary: 挪亚的儿子，洪水中同在方舟里；亚伯拉罕出自他的后裔。
body: |-
  闪是挪亚的三个儿子之一，圣经列名时总是写作闪、含、雅弗（《创世记》5:32、6:10）。洪水来到的时候，他和妻子随父母进入方舟（7:13），水退以后与父亲、兄弟一同出来，并一同领受了神所立的约（9:8–9）。

  《创世记》9:20–27 记载，挪亚醉酒，在帐棚里赤着身子，闪和雅弗拿一件衣服搭在肩上，倒退着进去给父亲盖上，背着脸没有看父亲的赤身。挪亚醒后说，耶和华闪的神是应当称颂的，又愿神使雅弗扩张，住在闪的帐棚里。

  据《创世记》第 10 章的列国表，闪的儿子是以拦、亚述、亚法撒、路德、亚兰（10:22），他又被称为希伯子孙之祖（10:21）。第 11 章另有一份家谱说，洪水以后二年，闪一百岁生了亚法撒，此后又活了五百年，并且生儿养女（11:10–11）；这份家谱从亚法撒一直记到他拉和亚伯兰，也就是后来的亚伯拉罕（11:12–26）。闪死在何处，圣经没有记载。“闪族”“闪米特语”这些近代学术用语就是从他的名字来的。
sources: []
recalled:
  - 《创世记》5:32、第 6—11 章
  - 《路加福音》3:36
