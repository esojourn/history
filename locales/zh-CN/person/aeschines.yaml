name: 埃斯基涅斯
aliases: [埃斯基尼斯]
role: 演说家
summary: 雅典演说家，主张与马其顿议和，是德摩斯梯尼的主要政敌，败诉后离开雅典。
body: |-
  雅典人，生年有约公元前 397 年和约前 389 年两说。他的出身，自己说父亲阿特罗墨托斯是有身份的人，因战争而破产，以教书为生；德摩斯梯尼则说他父母卑贱，这是法庭上互相攻击的话。他做过议事会的书记，当过悲剧演员，据德摩斯梯尼说只演第三号角色；也多次出征，在优卑亚的塔米奈之战中受过嘉奖。

  前 346 年他与德摩斯梯尼等同为使节，两次到马其顿见腓力二世，促成《菲洛克拉底和约》。和约的后果令雅典人不满，德摩斯梯尼和提马科斯准备控告他出使渎职。他抢先以“行为不检者不得在公民大会发言”的法律控告提马科斯并胜诉，即现存的《诉提马科斯》。前 343 年德摩斯梯尼正式起诉，他以《论使团》自辩，据后世记载以三十票之差获判无罪。

  前 339 年他代表雅典出席德尔斐的近邻同盟会议，指控安菲萨人耕种神庙的圣地。会议决定讨伐安菲萨，后来请腓力领兵，腓力因此得以率军进入希腊中部。德摩斯梯尼说他是受了腓力的收买，他自己说是为雅典辩护。

  前 336 年克特西丰提议授予德摩斯梯尼金冠，他控告此议违法。案件在前 330 年审理，他的《诉克特西丰》逐条批评对方的政策，德摩斯梯尼以《金冠辞》作答。他得票不到五分之一，按法律要受罚，于是离开雅典。相传他在罗得岛教授演说，后来死在萨摩斯岛，年七十五岁；这些说法出自后世的传记。他只有上述三篇演说传世。
sources: []
recalled:
  - 埃斯基涅斯《诉提马科斯》《论使团》《诉克特西丰》
  - 德摩斯梯尼《论使团》《金冠辞》
