name: 明英宗
aliases: [朱祁镇, 正统帝, 天顺帝]
role: 明朝第六、第八代皇帝
summary: 宠信宦官王振，亲征瓦剌在土木堡被俘；回京后被软禁七年，经“夺门之变”复位。
body: |-
  朱祁镇是宣德帝的长子，宣德十年（1435 年）即位时只有九岁，改元正统。即位之初，太皇太后张氏主持大政，“三杨”等老臣辅政，朝政尚称平稳。张太皇太后和“三杨”先后去世后，朱祁镇宠信从小服侍他的宦官王振，王振掌管司礼监，专擅朝政，打击异己，宦官干政的局面由此形成。

  正统十四年（1449 年），瓦剌首领也先率军大举南下。在王振的怂恿下，朱祁镇不顾大臣劝阻，亲率大军出征，行至大同后又仓促回师，八月在土木堡被瓦剌军追及包围，明军大败，随行的大臣多人战死，王振被乱军所杀，朱祁镇被俘（另见“土木之变”条）。消息传到北京，于谦等人拥立他的弟弟朱祁钰为帝，尊他为太上皇，并击退了也先对北京的进攻。

  景泰元年（1450 年），也先见挟持朱祁镇已无利可图，把他送回北京。朱祁钰把他软禁在南宫，长达七年。景泰八年（1457 年）正月，朱祁钰病重，武将石亨、宦官曹吉祥和徐有贞等人发动政变，拥朱祁镇复位，改元天顺，史称“夺门之变”（另见“夺门之变”条）。复位后，于谦等人被冤杀，石亨、曹吉祥一度专权，后来先后被除掉。

  朱祁镇临终前下令废除帝王死后宫妃殉葬的制度，这一做法后世多有称道。天顺八年（1464 年）他在北京去世，葬在昌平的裕陵。
sources: []
recalled:
