name: 第欧根尼
aliases: [锡诺普的第欧根尼, 狄奥根尼]
role: 哲学家
summary: 犬儒派哲学家，生于锡诺普，在雅典、科林斯过极简的生活，以言行讥刺世俗。
body: |-
  黑海南岸锡诺普人，父亲希克西亚斯经管城邦的钱币。关于他的记载几乎全是轶事，主要保存在五百多年后第欧根尼·拉尔修的书里，真伪难以一一分辨；生年也有约公元前 412 年和约前 404 年等说。相传他或他父亲“改铸钱币”获罪，他因此离开锡诺普。锡诺普这一时期确有被凿损的钱币出土，有学者认为此事有所本。后来他把“改铸钱币”当作自己哲学的口号，意思是重估通行的习俗。

  他到雅典后，据说追随苏格拉底的弟子安提斯泰尼，这层师承在年代上受到一些学者怀疑。他主张德行在于顺应自然、自足和不动心，财富、名誉、门第都无关紧要，并且身体力行：穿一件粗布外衣，带一根手杖和一个行囊，住在市场边母神庙旁的一口大陶瓮里。人们叫他“狗”，“犬儒”一名即由此来。流传最广的故事是他白天提着灯在市场上走，说是在找一个“人”。有人问他是哪里人，他说自己是“世界公民”。

  另一组故事说他航海时被海盗掳走，在克里特被卖为奴，买主科林斯人克塞尼亚德斯让他教导儿子，他从此住在科林斯。亚历山大在科林斯见到他、问他有什么要求，他回答“别挡住我的阳光”，这个故事见于普鲁塔克等多位作者，是否实有其事无法证实。

  他约在前 323 年死于科林斯，年纪很大，后人相传与亚历山大同日去世。古代书目列有他的对话和悲剧，全都失传。他的弟子底比斯人克拉特斯是斯多亚派创始人芝诺的老师。
sources: []
recalled:
  - 第欧根尼·拉尔修《名哲言行录》卷六
  - 普鲁塔克《亚历山大传》第 14 章
