name: 齐武帝
aliases: [萧赜, 齐世祖]
role: 皇帝
summary: 齐高帝长子，在位十一年，年号永明，史称“永明之治”。
body: |-
  萧赜是齐高帝萧道成的长子。宋末他随父征战，沈攸之起兵时，他镇守湓口，阻挡沈军东下。建元四年（公元 482 年）高帝去世，他即位，次年改元永明。

  永明年间，齐与北魏互派使节，边境较为安定，江南没有大的战事，史称“永明之治”。这一时期文学兴盛，他的次子竟陵王萧子良在建康鸡笼山的西邸招集文士，“永明体”诗歌就产生在这里。他继续推行高帝的清查户籍，强令被查出伪冒身份的人家戍边，引起不满。永明三年（485 年）冬，富阳人唐寓之聚众起事，攻下钱塘等地，自称皇帝，次年被平定。此后朝廷放宽了检籍的做法。

  永明十一年（493 年）正月，太子萧长懋先他而死。他立萧长懋之子萧昭业为皇太孙，同年七月去世，年五十四，遗诏由萧子良与他的堂弟西昌侯萧鸾共同辅政。一年之内，萧鸾先后废杀萧昭业和萧昭文，自立为帝，即齐明帝，大杀高帝、武帝的子孙。
sources: []
recalled:
  - 《南齐书·武帝纪》
  - 《资治通鉴》卷一百三十五至一百三十八
