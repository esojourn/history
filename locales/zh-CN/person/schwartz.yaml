name: "史瓦茨"
aliases: ["克里斯蒂安·弗里德里希·史瓦茨"]
role: "丹麦—哈雷差会在印度的宣教士"
summary: "哈雷培养的路德派宣教士，1750 年起在南印度宣教近五十年，死于坦焦尔。"
body: |-
  史瓦茨 1726 年生于勃兰登堡的索嫩堡，在哈雷大学读书，受弗兰克的敬虔派传统熏陶，学过泰米尔语。《历史的轨迹》第三十四章说，十八世纪哈雷大学至少有六十位学生出国宣教，其中最出名的就是史瓦茨，他从 1750 年开始在印度传教，直到 1798 年去世。第四十章也说他是早期复原教最伟大的宣教士。

  据一般记载，他属丹麦—哈雷差会，先在特兰奎巴，后来在特里奇诺波利、坦焦尔工作，深得当地土邦主的信任，曾受托在英国人与迈索尔的海德尔·阿里之间传话，土邦主临终把养子托他教养。他终身未娶，1798 年死于坦焦尔。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十四章“敬虔主义 莫拉维弟兄会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter38.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十章“教会再度增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter44.html"
