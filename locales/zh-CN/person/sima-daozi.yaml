name: 司马道子
aliases: [会稽王]
role: 太傅
summary: 晋孝武帝之弟，谢安死后执政十余年，任用亲信、纵子专权，被桓玄流放后毒死。
body: |-
  司马道子是晋简文帝的儿子、孝武帝的同母弟，初封琅邪王，后改封会稽王。谢安在世的最后几年，他已参与朝政并排挤谢安。太元十年（公元 385 年）谢安去世，他以录尚书事、都督中外诸军事总揽大权。《晋书》本传说他终日饮酒，宠信王国宝等人，官职可以用钱买到，亲近的僧尼、乳母也能干预政事。

  太元二十一年（396 年）孝武帝死，安帝不能理事，他以太傅的身份摄政。第二年，镇守京口的王恭以诛王国宝为名起兵，他杀了王国宝求和。隆安二年（398 年）王恭又联合荆州的殷仲堪、桓玄再次起兵，他的儿子司马元显收买了王恭手下的北府将领刘牢之，王恭兵败被杀。此后他多病，又常在醉中，朝政转到十几岁的司马元显手里。

  司马元显征发三吴地区已放免为客的奴隶到建康当兵，激起孙恩起事；元兴元年（402 年）又下令讨伐据有荆州的桓玄。桓玄顺江东下，刘牢之倒戈，建康不战而失，司马元显被杀。他被流放到安成郡，同年底被桓玄派人毒死，时年三十九。
sources: []
recalled:
  - 《晋书·会稽王道子传》
  - 《资治通鉴》卷一百零六至一百一十二
