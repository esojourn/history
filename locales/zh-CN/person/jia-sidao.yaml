name: 贾似道
aliases: [贾师宪, 秋壑]
role: 南宋末年权臣
summary: 南宋末年权臣，鄂州私下议和而谎报大捷，专权十五年，丁家洲兵败后被贬，途中被杀。
body: |-
  贾似道字师宪，台州天台（今浙江天台）人，生于嘉定六年（公元 1213 年）。他的姐姐是宋理宗宠爱的贾贵妃，他因此受到提拔，淳祐年间接替孟珙主持京湖防务，后来又任两淮制置使。

  开庆元年（1259 年）蒙哥攻四川，忽必烈率军围攻鄂州，贾似道以右丞相的身份领兵救援。据《宋史》等记载，他暗中派人向忽必烈求和，答应称臣纳币；这时蒙哥已死于钓鱼城下，忽必烈急于北归争夺汗位，于是撤军。贾似道隐瞒议和的事，向朝廷报告大捷，从此深得理宗信任，入朝主政。

  此后十五年间贾似道独揽朝政，宋度宗对他尤为倚重，称他为“师臣”。他推行公田法，以低价强买江南民田充作官田，又用“打算法”清查将领的军费，排挤了不少武将，刘整因此投降蒙古。元军围困襄阳将近六年，他对朝廷隐瞒军情，不发重兵救援。宋人笔记说他在西湖葛岭的私宅里与姬妾斗蟋蟀，相传《促织经》是他所作。

  咸淳九年（1273 年）襄阳失守，元军沿长江东下。德祐元年（1275 年）贾似道被迫亲自督师，在丁家洲大败，南宋主力尽失。朝野要求严惩，他被贬往循州，途中在漳州木棉庵被押送官郑虎臣杀死。《宋史》把他列入《奸臣传》。
sources: []
recalled:
  - 《宋史·奸臣传·贾似道》
  - 周密《齐东野语》
  - 《癸辛杂识》
