name: "史密斯"
aliases: ["约翰·史密斯", "斯弥特"]
role: "英国浸礼派的开端人物"
summary: "原为英国教会牧师，在盖恩斯伯勒建分离派教会，流亡阿姆斯特丹后改行信徒洗礼。"
body: |-
  史密斯约 1570 年生于英格兰中部，剑桥出身，做过英国教会的牧师和林肯城的讲道人。《历史的轨迹》第三十二章说，1602 年前后兴起了一次分离派运动，起初很小、很谨慎，影响却很深远：史密斯接受了分离派原则，在盖恩斯伯勒成立一间教会，邻近乡村的人都来加入，于是又在斯克鲁比的布鲁斯特家里成立了第二间教会。

  该书说，因逼迫临到，盖恩斯伯勒教会在 1607 年迁到阿姆斯特丹。史密斯和会众在那里接触到门诺派信徒，受其影响采纳了浸礼派原则。据一般记载，他 1609 年先给自己施洗，再给会众施洗，后来又觉得不妥，申请加入门诺派，未及正式加入就在 1612 年病逝。

  书中说，有一部分会友在 1611 或 1612 年回到英国，在伦敦建立了第一间浸礼派教会（带头的是赫尔维斯，书中没有提名字）。荷兰的这一支又受到亚米纽斯主义的影响，不接受预定论，后来称为“普通浸礼派”。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
recalled:
  - "史密斯《兽的印记》（1609 年）"
