name: 米南德（剧作家）
aliases: [米南德, 米南德罗斯]
role: 喜剧诗人
summary: 雅典“新喜剧”的代表诗人，写家庭与爱情的世态喜剧，经罗马人改编流传后世。
body: |-
  雅典人，属刻菲西亚村社，父亲狄奥佩特斯，约生于公元前 342 年。相传喜剧诗人阿莱克西斯是他的叔伯，他又是提奥弗拉斯托斯的学生，与伊壁鸠鲁同年服青年兵役，同治理雅典的法勒隆的德米特里有交情。他的第一部戏《愤怒》约在前 321 年上演。古人说他写了一百多部喜剧，在戏剧比赛中只得过八次头奖，同时代的观众更喜欢他的对手菲勒蒙。相传他约在前 290 年在比雷埃夫斯游泳时溺死，年五十出头。与印度的希腊人国王米南德一世并非一人。

  阿里斯托芬时代的“旧喜剧”嘲骂政要、议论时事；他所代表的“新喜剧”不再涉及政治，合唱队只在幕间出场，剧情是市民家庭里的事：年轻人相恋受阻，弃婴被认回，父子、主仆、邻里之间的误会最后解开。人物是些类型，如吝啬的老人、机灵的奴隶、吹牛的军人、妓女和食客，但写得各有性情，语言接近日常口语。

  他的剧本在古代流传很广，中世纪却全部失传，长期只有后人摘引的格言式单句，例如使徒保罗在《哥林多前书》第 15 章第 33 节所引的“滥交是败坏善行”，古人说出自他的《泰伊丝》。二十世纪从埃及出土的纸草改变了这种情况：1907 年发表的开罗抄本含有《公断》《萨摩斯女子》《割发》等剧的大段；1950 年代面世的博德默纸草里有一部基本完整的《恨世者》（一译《古怪人》），此剧曾在前 316 年的勒奈亚节得头奖。

  罗马喜剧诗人普劳图斯和泰伦提乌斯的作品大多改编自他和同时代人的剧本，文艺复兴以后的欧洲喜剧，从莎士比亚到莫里哀，又是从这两位罗马诗人那里学来的。
sources: []
recalled:
  - 《苏达辞书》“米南德”条
  - 昆体良《演说术原理》卷十第 1 章第 69—72 节
  - 《哥林多前书》第 15 章第 33 节
