name: 阿那克西曼德
aliases: []
role: 哲学家
summary: 米利都人。提出“无定”为万物本原，相传绘制了最早的世界地图。
body: |-
  米利都人，古人说他是泰勒斯的同乡和后继者。生卒年出自古代年代学家的推算，是约数。他写过一部论自然的散文著作，是希腊最早的散文作品之一，今只存一句，由公元 6 世纪的辛普里丘转引而保留下来，大意是万物从哪里产生，毁灭后又按必然回到哪里，它们按时间的安排为彼此的不义互相补偿。

  他认为万物的本原不是水或任何一种具体的东西，而是“无定”，即没有界限、没有规定的东西，冷热、干湿等对立物从中分离出来。据后人转述，他认为大地形如圆柱，悬在中央，因为与各方距离相等而不落向任何一方；生物最初产生于湿润之中，人是从类似鱼的生物变来的。

  古代地理学家说他第一个把人居住的世界画成了地图。第欧根尼·拉尔修说他发明了日晷的指针，并在斯巴达设置过一具；希罗多德则说希腊人是从巴比伦人那里学到日晷的。
sources: []
recalled:
  - 辛普里丘《亚里士多德〈物理学〉注》所引残篇
  - 第欧根尼·拉尔修《名哲言行录》卷二第 1—2 节
  - 斯特拉波《地理学》卷一第 1 章
