name: 宋理宗
aliases: [赵昀, 赵与莒, 赵贵诚]
role: 南宋皇帝
summary: 宋太祖十世孙，由史弥远拥立，在位四十年；联蒙灭金，尊崇理学，晚年朝政委于贾似道。
body: |-
  赵昀原名赵与莒，是宋太祖的十世孙，生于开禧元年（公元 1205 年），家在绍兴府山阴，一支宗室早已疏远，家境平常。嘉定十四年（1221 年）宰相史弥远因与皇子赵竑不和，物色宗室子弟，把他接到临安，立为沂王的后嗣，赐名贵诚。嘉定十七年（1224 年）宋宁宗去世，史弥远矫诏废赵竑，立他为帝，改名赵昀，是为宋理宗。次年湖州有人拥立赵竑起事，事败后赵竑被逼自尽。

  理宗在位前九年，朝政完全由史弥远主持。绍定六年（1233 年）史弥远去世，理宗亲政，改元端平，起用真德秀、魏了翁等人，号称“端平更化”。端平元年（1234 年）宋与蒙古联合攻破蔡州，金朝灭亡；随即宋军北上收复汴京、洛阳，因粮草不继被蒙古军击退，史称“端平入洛”，宋蒙战争由此开始（另见“蒙古灭金”“端平入洛”条）。

  理宗推崇朱熹的学说，淳祐元年（1241 年）下诏以周敦颐、张载、程颢、程颐、朱熹从祀孔庙，程朱理学从此成为官方正统，他死后的庙号“理宗”即由此而来。他在位后期怠于政事，先后宠信丁大全、贾似道，宦官、外戚也多干政。开庆元年（1259 年）蒙哥攻四川死于钓鱼城下，忽必烈围鄂州，贾似道私下许和，忽必烈北返，贾似道却以大捷上报，从此独揽朝政。

  理宗没有儿子，立侄子赵禥为皇子。景定五年（1264 年）理宗去世，赵禥即位，即宋度宗。理宗在位四十年，是南宋在位时间最长的皇帝。
sources: []
recalled:
  - 《宋史·理宗本纪》
  - 《宋史·奸臣传·史弥远》
