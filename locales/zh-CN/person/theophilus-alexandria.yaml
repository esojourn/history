name: 提阿非罗
aliases:
  - 亚历山大的提阿非罗
  - 狄奥斐卢斯
role: 亚历山大主教
summary: 亚历山大主教，主持拆毁塞拉皮斯神庙，后设“橡树会议”罢免屈梭多模。
body: |-
  提阿非罗从公元 385 年起任亚历山大主教，直到 412 年去世。他的出身和生年没有可靠的早期记载。

  公元 391 年前后，狄奥多西皇帝下令关闭神庙，他带领信徒拆毁了亚历山大著名的塞拉皮斯神庙，在原址上建了教堂。他起初推崇俄利根的著作，399 年以后转而严厉反对，把埃及尼特利亚旷野里几位读俄利根著作的修士赶了出去，其中为首的四人身材高大，人称“高个子兄弟”。

  这几位修士逃到君士坦丁堡，主教屈梭多模收留了他们。提阿非罗应召到京城受质询，反而联合不满屈梭多模的主教，于 403 年在迦克墩附近一处叫“橡树”的庄园开会，以一批罪名把屈梭多模罢免。《历史的轨迹》第六章把这件事作为基督徒彼此迫害的例子。他死后，外甥区利罗继任亚历山大主教。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第六章“教会渐趋腐化” https://wellsofgrace.com/books/spiritual/2000years/html/chapter07.html"
recalled:
  - 苏格拉底《教会史》卷 5 第 16 章、卷 6 第 7—17 章
  - 帕拉迪乌《屈梭多模生平对话录》
  - 耶柔米《书信》第 86—100 封（所译提阿非罗节期书信）
