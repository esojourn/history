name: 西尔维斯特二世
aliases:
  - 热尔贝
  - 欧里亚克的热尔贝
  - 加贝
  - 思维二世
role: 罗马主教（教皇）、学者
summary: 原名热尔贝，当时西欧最有学问的人，奥托三世的老师，第一位法兰西籍教皇。
body: |-
  热尔贝约在公元 946 年生于法国中部奥弗涅的平民人家，幼年进欧里亚克的修道院。967 年他随巴塞罗那伯爵去加泰罗尼亚，在那里学了几年数学和天文；当地与阿拉伯人治下的西班牙相邻，他由此接触到阿拉伯人保存和发展的学问。

  972 年前后他到兰斯，在主教座堂的学校里教书，名声很大。他的学生里歇尔记载，他用算盘教算术，自己制作天球仪讲解天文，还用单弦琴讲音律。他一度担任意大利博比奥修道院的院长。987 年法兰西王位更替时，他站在于格·卡佩一边；991 年被立为兰斯大主教，因为前任是被会议罢免的，教皇不予承认，他只得离开。

  997 年他到年轻的皇帝奥托三世宫中作老师，次年任拉文纳大主教。999 年奥托三世让他当了教皇，称西尔维斯特二世，取君士坦丁时代那位罗马主教的名字。《历史的轨迹》第十一章说，此前的教皇都是意大利人，奥托三世打破了这个传统：他的前任贵格利五世是第一位日耳曼籍教皇，他是第一位法兰西籍教皇，也是当时最富学识的人。

  他在位四年，反对买卖圣职和教士娶妻，与奥托三世一起在波兰和匈牙利设立大主教区。1001 年罗马人起来反对皇帝，两人被迫离城；次年奥托三世去世。西尔维斯特回到罗马，1003 年 5 月去世。后世有他靠巫术得来学问的传说，没有根据。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十一章“教会被政府控制” https://wellsofgrace.com/books/spiritual/2000years/html/chapter13.html"
recalled:
  - 里歇尔《历史》卷 3 第 43—65 章
  - 热尔贝《书信集》
