name: 伊索克拉底
aliases: []
role: 演说家、教育家
summary: 雅典演说家，开办修辞学校，长期呼吁希腊各邦联合起来东征波斯。
body: |-
  雅典人，生于公元前 436 年。父亲提奥多罗斯经营制笛作坊，家境富裕，他因此受过良好的教育，相传听过高尔吉亚等智者讲学。伯罗奔尼撒战争末期家产荡尽，他先以替人撰写法庭讲稿为业，约前 392 年在雅典开设学校，教授演说和他所说的“哲学”，即从事公共事务所需的见识与表达。他的学校与柏拉图的学园同时，路数不同；学生中有将军提摩透斯，相传还有史家提奥庞波斯、埃福罗斯和演说家许佩里德斯等。

  他自己说嗓音弱、胆子小，从不在公民大会上发言。他的“演说”是写出来供人阅读的文章，文句工整，对后来的希腊、拉丁散文影响很大。前 380 年发表的《泛希腊集会辞》用了多年写成，主张希腊人停止内战，由雅典和斯巴达共同领导，去征讨波斯。此后他把这个希望先后寄托在不同的人身上；前 346 年《致腓力》劝马其顿国王腓力二世调解希腊各邦，带领他们东征。

  其他主要作品有：《战神山议事会辞》，主张恢复早先较为节制的政制；《论和平》，写于同盟战争期间，批评雅典的海上霸权；《论财产交换》，是为自己一生的教学所作的辩护；《泛雅典娜节辞》，据他自己说完成时已九十七岁。

  他死于前 338 年，享年九十八岁，时在喀罗尼亚战役之后不久。古代有他闻败讯后绝食而死的说法，但他存世的一封致腓力的信若是真作，则写于战后，语气并不悲愤，所以这一说法受到怀疑。
sources: []
recalled:
  - 伊索克拉底《泛希腊集会辞》《致腓力》《论财产交换》《泛雅典娜节辞》
  - 托名普鲁塔克《十大演说家传》
