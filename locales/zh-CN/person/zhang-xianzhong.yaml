name: 张献忠
aliases: [八大王, 大西皇帝]
role: 明末农民军领袖，大西政权的建立者
summary: 明末农民军领袖，号“八大王”，1644 年在成都建立大西政权。
body: |-
  张献忠是陕西延安卫柳树涧人，早年当过延绥镇的士兵。崇祯三年（1630 年）他在米脂起兵响应农民起义，自号“八大王”，因为面色发黄，又被称为“黄虎”。此后他与高迎祥、李自成等部时分时合，转战陕西、山西、河南、湖广、四川等地。崇祯八年（1635 年）农民军攻破凤阳，焚烧了明朝的皇陵。

  崇祯十一年（1638 年）张献忠在湖北谷城接受明朝的招安，但保留了自己的部队。次年他再次起兵，在四川、湖广一带与明军周旋，崇祯十四年（1641 年）攻破襄阳，杀襄王朱翊铭，督师杨嗣昌随后在沙市死去。崇祯十六年（1643 年）他攻占武昌，自称“大西王”。

  崇祯十七年（1644 年）他率军入川，攻破重庆、成都，在成都称帝，国号大西，年号大顺，改成都为西京。大西政权在四川的统治十分残酷，史书记载他大肆杀戮士民。关于四川人口在明末清初大量减少的原因，清朝官修史书多归咎于张献忠，现代学者认为，除了张献忠的屠杀，明军、清军、地方武装的战争以及饥荒、瘟疫也都造成了大量死亡，具体的比例很难确定。所谓的“七杀碑”文字，学者多认为出于后世伪托。

  顺治三年（1646 年）清军入川，张献忠放弃成都北上，年底在西充凤凰山与清军遭遇，中箭身亡，时在顺治三年十一月，公历已是 1647 年初。他的养子孙可望、李定国等率领余部转入云南、贵州，后来与南明永历政权联合抗清。
sources: []
recalled:
  - 《明史·张献忠传》
  - 彭遵泗《蜀碧》
  - 顾山贞《客滇述》
