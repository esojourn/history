name: 爱比克泰德
aliases: [埃皮克提图, 爱比克泰图斯]
role: 斯多亚派哲学家
summary: 奴隶出身的斯多亚派哲学家，讲学内容由弟子阿里安记成《论说集》。
body: |-
  爱比克泰德约在公元 50 年生于小亚细亚弗里吉亚的希拉波利斯，生来是奴隶；这个名字的意思就是“买来的”。他被带到罗马，主人是尼禄的获释奴隶、掌管文书的埃帕弗洛狄图斯。他一条腿是瘸的，有的古代作家说是主人打折的，也有的说是风湿所致。还是奴隶的时候，他就去听斯多亚派哲学家穆索尼乌斯·鲁弗斯讲课，后来获得自由，自己在罗马讲学。

  图密善把哲学家逐出罗马，他迁到希腊西北的尼科波利斯开馆授徒，直到去世，卒年约在 135 年。他一个字也没有写。弟子阿里安把听讲的笔记整理成《论说集》，原有八卷，现存四卷，又摘出要点编成一册《手册》。

  他教人分清两类事：自己的判断、欲求和取舍是我们能做主的，身体、财产、名声和职位不是；人的烦恼来自对事情的看法，而不是事情本身。马可·奥勒留在《沉思录》里感谢老师借给他爱比克泰德的讲录。
sources: []
recalled:
  - 阿里安《爱比克泰德论说集》
  - 爱比克泰德《手册》第 1、5 章
  - 马可·奥勒留《沉思录》卷 1 第 7 章
  - 奥卢斯·格利乌斯《阿提卡之夜》卷 15 第 11 章
