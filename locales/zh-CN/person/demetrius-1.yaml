name: 德米特里一世
aliases: [围城者德米特里, 德米特里·波利奥克特斯]
role: 马其顿国王
summary: 安提柯一世之子，人称“围城者”，一度为马其顿国王，终被塞琉古囚禁至死。
body: |-
  安提柯一世之子，约生于公元前 337 年或前 336 年。他年轻时奉父命娶了安提帕特之女、克拉特鲁斯的遗孀菲拉，她比他大不少。他随父亲与欧迈尼斯作战。前 312 年他第一次独立统兵，在迦萨被托勒密和塞琉古击败。

  前 307 年他率舰队突然驶入比雷埃夫斯，赶走替卡山德治理雅典十年的法勒隆的德米特里，宣布恢复雅典的自由。雅典人给他们父子“救主神”的称号，增设以两人命名的部落。前 306 年他在塞浦路斯的萨拉米斯外海大败托勒密的舰队，夺取全岛，父子随即称王。前 305 年至前 304 年他围攻罗得岛约一年，造了一座叫“攻城塔”的多层带轮巨塔和各种器械，仍未破城，最后议和撤走。“围城者”的绰号由此而来。据老普林尼，罗得岛人变卖他留下的器械，用所得建造了太阳神巨像。此后他回到希腊，把卡山德的势力逐出中部和伯罗奔尼撒，重建希腊各邦的同盟。普鲁塔克说他在雅典时住在帕特农神庙的后殿，行为放纵。

  前 301 年伊普苏斯之战，他率骑兵击溃对面的敌人后追得太远，回头时被象队挡住，父亲战死。他带着残部逃走，仍握有一支强大的舰队和沿海的若干城市。不久塞琉古与他结好，娶了他的女儿斯特拉托尼刻。前 295 年他围困并重新占领了一度背离他的雅典。前 294 年卡山德的两个儿子争位，其中的亚历山大五世请他相助，他到后将其杀死，被军队拥立为马其顿国王。他在色萨利海边建了新城德米特里阿斯。

  他在马其顿大造战舰，准备夺回亚洲。前 288 年利西马科斯和伊庇鲁斯的皮洛士东西夹攻，他的军队倒向皮洛士，王位丢失，菲拉自尽。次年他带着雇佣军渡海进入小亚细亚，一路损兵折将，前 285 年在奇里乞亚一带向塞琉古投降。塞琉古把他软禁在叙利亚奥龙特斯河畔，待遇优厚。他以打猎、饮酒度日，前 283 年病死，年五十四岁。骨灰送还给留在希腊的儿子安提柯二世，葬于德米特里阿斯。安提柯二世后来重登马其顿王位，建立了延续到前 168 年的王朝。
sources: []
recalled:
  - 普鲁塔克《德米特里传》
  - 狄奥多罗斯《历史丛书》卷十九、卷二十
  - 老普林尼《博物志》卷三十四第 41 节
