name: 杨涟
aliases: [大洪, 忠烈]
role: 东林党人、左副都御史
summary: 在“移宫案”中护持天启帝即位；上疏弹劾魏忠贤二十四大罪，被阉党迫害，死于诏狱。
body: |-
  杨涟是湖广应山（今湖北广水）人，万历三十五年（1607 年）考中进士，先任常熟知县，以廉洁著称，后来任兵科给事中。万历四十八年（1620 年）泰昌帝即位一个月就去世，泰昌帝的宠妃李选侍占据乾清宫，控制着皇长子朱由校。杨涟与左光斗等人力争，把朱由校接出，护送他即位，并迫使李选侍迁出乾清宫，史称“移宫案”。

  天启年间杨涟升任左副都御史。天启四年（1624 年）他上疏弹劾魏忠贤，列举其二十四条大罪，在朝野引起很大震动，许多官员随后也上疏弹劾，但天启帝没有追究。次年魏忠贤借熊廷弼一案，诬陷杨涟等人收受熊廷弼的贿赂，把他和左光斗、魏大中等人逮捕入诏狱。据记载，他在狱中受尽酷刑，临死前写下血书，表示无愧于心。天启五年（1625 年）他死于狱中，年五十四岁。崇祯初年得到平反，谥“忠烈”。
sources: []
recalled:
  - 《明史·杨涟传》
  - 杨涟《杨大洪先生文集》
