name: 约阿施
aliases: []
role: 南国犹大王
summary: 亚哈谢的儿子，幼时藏于圣殿躲过亚他利雅的屠杀，七岁被拥立，作王四十年。
body: |-
  犹大王亚哈谢的儿子，母亲是别是巴人西比亚（《列王纪下》12:1），与后来的以色列王约阿施同名。亚哈谢死后，亚他利雅剿灭王室，约兰王的女儿、亚哈谢的妹妹约示巴把还是婴孩的约阿施从被杀的王子中偷出来，和他的乳母藏在卧房里，后来藏在耶和华的殿里六年（11:1–3）。《历代志下》22:11 说约示巴是祭司耶何耶大的妻子。

  第七年，祭司耶何耶大召集百夫长和护卫兵，在殿里给他们看王子，部署好守卫，领出约阿施，给他戴上冠冕，把律法书交给他，膏他作王；众人拍掌说“愿王万岁”。亚他利雅闻声进殿，被带出殿外杀了（11:4–16）。约阿施登基时七岁，在耶路撒冷作王四十年（11:21–12:1）。经文说他在耶何耶大教训他的时候行耶和华看为正的事，只是邱坛还没有废去。他吩咐祭司收取奉献的银子修理圣殿，到二十三年仍未修好，就由耶何耶大在祭坛旁放一个柜子，在盖上钻孔收银，交给督工的人雇匠修殿（12:4–16）。

  亚兰王哈薛攻取迦特，又要上来攻打耶路撒冷，约阿施把列祖和自己分别为圣的物与殿中、王宫府库里的金子都送给哈薛，哈薛才离开（12:17–18）。《历代志下》24:17–22 说，耶何耶大死后王听从犹大首领的话，离弃耶和华的殿，事奉木偶；耶何耶大的儿子撒迦利亚责备众人，王竟吩咐在殿院里用石头打死他。后来约阿施的臣仆约撒甲、约萨拔背叛，在下悉拉的米罗宫里杀了他（《列王纪下》12:20–21）；《历代志下》24:25 说这是因为他杀了耶何耶大的儿子，并说他没有葬在列王的坟墓里。儿子亚玛谢接续作王。
sources: []
recalled:
  - 《列王纪下》11:1–12:21
  - 《历代志下》22:10–24:27
