name: 姜维
aliases: [姜伯约]
role: 大将军
summary: 蜀汉后期的统帅，原为魏将，归蜀后继承诸葛亮的北伐，蜀亡后图谋复国，死于成都之乱。
body: |-
  据《三国志·蜀书·姜维传》，姜维字伯约，天水冀县人，幼年丧父，在本郡任参军。建兴六年（公元 228 年）诸葛亮出祁山，天水太守怀疑属下有二心，自己逃走，姜维等人回不了城，于是投降蜀军，当时二十七岁。诸葛亮很器重他，写信给留守成都的官员称他是“凉州上士”。

  诸葛亮死后，姜维逐步升迁，延熙十九年（256 年）任大将军。他熟悉陇西的风土，认为联合羌人、胡人可以夺取陇西，多次请求大举出兵；主政的费祎不同意，给他的兵力每次不超过一万人。费祎死后他才得以放手行动，连年北伐。延熙十八年他在洮西大败魏雍州刺史王经，次年在段谷被邓艾击败，损失惨重。朝中对连年用兵多有不满，谯周曾写《仇国论》加以批评。

  景耀五年（262 年）姜维再次出兵失利，又因厌恶宦官黄皓专权，不敢回成都，带兵留在沓中屯田。次年魏军伐蜀，他摆脱邓艾的牵制，退守剑阁，挡住了钟会的大军；邓艾却绕道攻下成都。姜维接到后主的命令，向钟会投降，本传说“将士咸怒，拔刀砍石”。

  姜维看出钟会有异心，便怂恿他占据蜀地起兵。据裴松之注所引《华阳国志》等书，他的打算是等钟会杀尽魏军将领后再杀钟会，恢复蜀汉，并曾密报后主，请他忍耐数日。咸熙元年（264 年）正月，钟会的图谋被魏军将士察觉，军队哗变，姜维与钟会一同被杀，他的家属也遇害。
sources: []
recalled:
  - 《三国志·蜀书·蒋琬费祎姜维传》及裴松之注
