name: "亚米念"
aliases: ["雅各布斯·亚米念", "亚米纽斯", "阿明尼乌"]
role: "荷兰神学家"
summary: "莱顿大学神学教授，主张神的拣选基于预知人的信心，引发全国神学争论。"
body: |-
  亚米念 1560 年生于荷兰奥德瓦特（也有说 1559 年）。《历史的轨迹》第三十三章说，他还小的时候西班牙人来，毁了他的家乡，杀害了他的父母和亲友，他被有爱心的荷兰人领养。一般记载是：他父亲在他幼年时已去世，1575 年西班牙军屠城时遇害的是他的母亲和兄弟姊妹，当时他在外地求学。

  他进莱顿大学，成绩优异，阿姆斯特丹市政府资助他出国深造。该书说他在日内瓦得到加尔文的继承人贝扎的好评，也到意大利进修。1588 年他成为阿姆斯特丹改革宗教会的牧师，讲道清晰流利，听众很多。1603 年他任莱顿大学神学教授。

  该书说，他渐渐不能完全赞同改革宗的教义。他仍然相信三位一体、基督的神性和十架代赎，但教导神的预定是根据祂预见哪些人会相信；基督是为全人类而死；人可能从恩典中失落；圣灵的工作并非不可抗拒。作者认为他表面上持守拣选的教义，实际上使拣选基于人的行动，并把他与否认人类完全败坏的伯拉纠相比。这是作者从改革宗立场所下的判断，亚米念本人坚持人若没有神的恩典不能行善，并不承认自己是伯拉纠派。

  他在莱顿与同事戈马鲁斯激烈争论，学生们把他的主张带进各地教会，全国争论不休。1609 年他在莱顿病逝。次年他的支持者向荷兰议会递交《抗辩书》，称“抗辩派”；1618—1619 年的多特会议定了他们的罪。

  第三十三章说，亚米念主义在荷兰只剩一小群人，在英国的影响却很大，渗入安立甘教会和多数不从国教的教会；约翰·卫斯理采纳了它，成为循道派的信条。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十三章“亚米纽斯主义 贵格派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter37.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十五章“苏西尼主义，神体一位论，现代主义” https://wellsofgrace.com/books/spiritual/2000years/html/chapter39.html"
recalled:
  - "亚米念《意见陈述》（1608 年）"
  - "抗辩派《抗辩书》（1610 年）"
