name: 耶稣
aliases:
  - 拿撒勒人耶稣
  - 耶稣基督
role: 福音书所记的基督
summary: 生于伯利恒，长于拿撒勒，传道后在耶路撒冷被钉十字架，福音书记他复活。
body: |-
  据《马太福音》和《路加福音》，耶稣由童女马利亚所生，生在犹太的伯利恒，在加利利的拿撒勒长大；马利亚的丈夫约瑟是大卫的后裔。马太记希律王在位时东方的博士来拜，约瑟带着母子逃往埃及（太 2 章）；路加记天使向牧羊人报信，婴孩卧在马槽里（路 2 章）。两书所载的家谱不同（太 1:1–17；路 3:23–38）。他降生在大希律去世（公元前 4 年）之前，通常推定为约公元前 6—前 4 年。

  《路加福音》3:23 说耶稣开头传道时年纪约有三十岁。他在约旦河受约翰的洗，在旷野受试探，随后在加利利各处传道，常住迦百农。他宣讲神的国，用比喻教训人，医病赶鬼，并选立十二个使徒。《马太福音》第 5—7 章集中记载了他在山上的教训。四卷福音书都记了他用五个饼、两条鱼使五千人吃饱一事；《约翰福音》第 11 章记他使死了四天的拉撒路复活。在该撒利亚腓立比境内，彼得认他是基督（太 16:13–16），此后他几次向门徒预言自己要受害、第三日复活。

  最后一次逾越节前，耶稣骑驴进入耶路撒冷，赶出殿里作买卖的人（符类福音把此事记在这时，《约翰福音》2:13–22 则记在传道初期）。他与门徒吃了最后的晚餐，在客西马尼被捕，先在大祭司和公会面前、后在罗马总督彼拉多面前受审，被判钉十字架，在各各他被钉死，当天葬在亚利马太人约瑟的坟墓里。受难之年有公元 30 年、33 年两说，本条取 30 年。

  四卷福音书都记载，七日的第一日清早坟墓已经空了，耶稣复活，向门徒显现；显现的地点和次序，各书所记不尽相同。《路加福音》24:50–51 和《使徒行传》1:3–9 记他复活后四十天之久向使徒显现，然后被接升天。圣经以外，约瑟夫斯《犹太古史》卷 18 和塔西佗《编年史》卷 15 都提到他在彼拉多任内被处死；约瑟夫斯那段文字是否经后人改动，学界有争论。
sources: []
recalled:
  - 《马太福音》（降生见第 1—2 章，山上的教训见第 5—7 章，受难与复活见第 26—28 章）
  - 《马可福音》（受难与复活见第 14—16 章）
  - 《路加福音》（降生与童年见第 1—2 章，家谱见 3:23–38，受难、复活与升天见第 22—24 章）
  - 《约翰福音》（洁净圣殿见 2:13–22，拉撒路见第 11 章，受难与复活见第 18—21 章）
  - 《使徒行传》1:1–11
  - 约瑟夫斯《犹太古史》卷 18
  - 塔西佗《编年史》卷 15
