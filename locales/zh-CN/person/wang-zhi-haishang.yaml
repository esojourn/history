name: 汪直
aliases: [王直, 五峰船主, 徽王]
role: 嘉靖年间的海商首领
summary: 徽州海商，以日本平户为基地从事走私贸易，被称为倭寇首领，后被胡宗宪诱降处死。
body: |-
  汪直是徽州歙县人，史书中常写作王直，生年不详。明朝实行海禁，民间不许出海贸易，但东南沿海的走私贸易十分兴盛。汪直早年经营盐业，后来到广东造船，与东南亚和日本进行贸易，又加入许栋等人在浙江双屿的走私集团。嘉靖二十七年（1548 年）浙江巡抚朱纨派兵捣毁双屿，汪直收拾余众，逐渐成为最大的海商首领，以日本平户、五岛一带为基地，自称“徽王”，部众很多。

  嘉靖三十一年（1552 年）以后，东南沿海的倭寇侵扰大规模爆发，其中有不少是汪直的部众或与他有关的海盗。总督胡宗宪派人到日本与汪直联络，答应开放海上贸易，嘉靖三十六年（1557 年）汪直回到浙江，被扣押。朝中官员反对赦免他，嘉靖三十八年十二月（公历 1560 年 1 月）他在杭州被处死。汪直死后，他的部下在浙江、福建一带继续劫掠了好几年。

  汪直究竟是“倭寇”首领还是被海禁逼迫的海商，后世有不同的评价。他与日本的关系也引起关注，日本文献记载，1543 年把火绳枪带到种子岛的葡萄牙人所乘的船上，有一位名叫“五峰”的明朝人，一般认为就是汪直。
sources: []
recalled:
  - 《明史·日本传》
  - 郑若曾《筹海图编》
  - 《明世宗实录》
