name: 多尔衮
aliases: [睿亲王, 摄政王, 皇父摄政王]
role: 清初摄政王
summary: 努尔哈赤之子，以摄政王身份率清军入关、定都北京，主持清初政局，死后被追夺封号。
body: |-
  多尔衮是努尔哈赤的第十四个儿子，母亲是大妃阿巴亥。天命十一年（1626 年）努尔哈赤去世，阿巴亥被迫殉葬，皇太极继承汗位。多尔衮此后随皇太极征战，因战功封为和硕睿亲王，掌管吏部，在征服察哈尔、攻打朝鲜和松锦之战中都立有大功。

  崇德八年（1643 年）皇太极突然去世，多尔衮和皇太极的长子豪格争夺帝位，双方相持不下，最后达成妥协，由皇太极六岁的第九子福临即位，多尔衮与郑亲王济尔哈朗共同辅政。不久多尔衮掌握了实权。

  顺治元年（1644 年）李自成攻破北京，多尔衮率清军南下，吴三桂请清军入关，多尔衮与吴三桂联合在山海关一片石击败大顺军，随后进入北京（另见“清军入关”条）。同年他决定迁都北京，把顺治帝从盛京迎来，在北京举行即位典礼。此后他派兵追击大顺军，攻灭南明弘光政权，基本控制了华北和江南。他继承明朝的制度，优待明朝的降官，但也下达剃发令、圈地令、投充法和严厉的逃人法，引起汉人的强烈反抗（另见“剃发令”条）。

  多尔衮的权势越来越大，先后称“叔父摄政王”“皇父摄政王”，朝廷的诏令都以他的名义发出。关于“皇父”这一称号是否意味着他娶了顺治帝的母亲孝庄太后（即民间所传的“太后下嫁”），史学界有不同看法，没有确证。顺治七年（1650 年）十二月他在喀喇河屯出猎时去世，年三十九岁。顺治帝起初追尊他为“成宗义皇帝”，两个月后他的政敌告发他图谋篡位，顺治帝下令追夺他的封号，撤出宗庙，籍没家产。乾隆四十三年（1778 年）乾隆帝为他平反，恢复了睿亲王的封号。
sources: []
recalled:
  - 《清世祖实录》
  - 《清史稿·诸王传·睿忠亲王多尔衮》
