name: 慧能
aliases: [惠能, 六祖, 大鉴禅师]
role: 禅宗六祖
summary: 禅宗南宗的创始人，后世尊为禅宗六祖，主张“顿悟”，其言行由弟子编成《坛经》。
body: |-
  慧能也写作惠能，俗姓卢，祖籍范阳，父亲被贬官到岭南新州，他便生于新州。他幼年丧父，家境贫寒，靠打柴奉养母亲，没有读过书。据《坛经》，一次他在集市上听人诵读《金刚经》，心有所悟，打听到这部经是从黄梅东山的五祖弘忍那里传来的，便北上求法。

  据《坛经》，弘忍让他在寺中做杂役，在碓房舂米。八个多月后，弘忍让弟子们各作一首偈来表达自己的见解，上座神秀写了“身是菩提树，心如明镜台”的偈；慧能请人代写了一首偈，后世流传的版本中有“菩提本无树”“本来无一物”等句。弘忍认为他已经开悟，半夜为他讲解《金刚经》，把衣钵传给他，让他连夜南归。《坛经》各本的文字不尽相同，敦煌发现的早期写本与后来的通行本出入较大，这些故事的细节，学界认为有后人加工的成分。

  他回到岭南后隐居了多年，后来在广州法性寺听印宗法师讲经，据记载，当时风吹幡动，有两位僧人争论是风动还是幡动，慧能说不是风动，也不是幡动，是你们的心在动。印宗得知他就是得到弘忍衣钵的人，为他剃度。此后他在韶州曹溪的宝林寺弘法三十多年，主张人人都有佛性，不必拘泥于读经坐禅，只要明心见性便可顿然成佛。他的弟子法海把他的说法记录下来，编成《坛经》，这是中国僧人著述中唯一被尊称为“经”的。

  先天二年（713 年）八月，他在新州国恩寺去世，年七十六。他的肉身像至今供奉在韶关的南华寺。他去世后，弟子神会在开元年间北上，在滑台等地与神秀一系的北宗争论正统，慧能一系的南宗逐渐成为禅宗的主流。唐宪宗追谥他为大鉴禅师。
sources: []
recalled:
  - 法海集《六祖坛经》（敦煌本与宗宝本）
  - 王维《六祖能禅师碑铭》
  - 赞宁《宋高僧传·慧能传》
