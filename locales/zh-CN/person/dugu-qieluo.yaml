name: 独孤皇后
aliases: [独孤伽罗, 文献皇后]
role: 皇后
summary: 隋文帝的皇后，独孤信之女，与文帝并称“二圣”，参与政事，支持改立杨广为太子。
body: |-
  独孤伽罗是西魏、北周大将独孤信的女儿。据《隋书·后妃传》，独孤信看重杨坚，把她嫁给杨坚，当时她十四岁。她的长姐是北周明帝的皇后，另一位姐姐嫁给了唐高祖李渊的父亲李昞，所以她是李渊的姨母。她的生年史书推算不一，一般作公元 544 年前后。

  据《隋书》，她与杨坚成婚时，杨坚曾发誓不与其他女子生育子女。杨坚代周建隋时，她派人对杨坚说，大事已成，如骑猛兽，必不得下，勉励他走下去。她被立为皇后后，每次文帝上朝，她都与文帝同车到朝堂附近，派宦官探听政事，有不妥的地方便加以规劝，等文帝退朝后一起回宫。宫中把他们并称为“二圣”。她生活节俭，对外戚管束很严，表兄弟犯法当死，她也不为求情。

  她性情妒忌，据《资治通鉴》，文帝曾宠幸尉迟迥的孙女，她趁文帝上朝把这名女子杀死，文帝一怒之下单骑出宫，跑进山谷二十余里，被高颎、杨素追回。她厌恶太子杨勇宠爱姬妾、冷落太子妃元氏，元妃暴死后，她更怀疑是杨勇所为；而次子杨广在她面前表现得只与正妃萧氏相守，她因此屡次在文帝面前称赞杨广。开皇二十年（600 年）杨勇被废、杨广被立为太子，与她的态度有很大关系。高颎因为反对废立，又曾称她为“一妇人”，也失去了她的信任而被罢官。

  仁寿二年（602 年）八月她去世，谥号文献皇后，葬于太陵。两年后文帝去世，与她合葬。
sources: []
recalled:
  - 《隋书·后妃传》
  - 《北史·后妃传》
  - 《资治通鉴》卷一百七十八至一百七十九
