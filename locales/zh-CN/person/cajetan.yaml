name: "迦耶坦"
aliases: ["托马斯·德·维奥", "卡耶坦", "迦耶坦枢机"]
role: "枢机、多明我会神学家"
summary: "多明我会总会长、枢机，1518 年以教皇代表身份在奥格斯堡审问路德。"
body: |-
  迦耶坦本名托马斯·德·维奥，1469 年生于意大利的加埃塔，人们按他的家乡叫他“迦耶坦”。他十几岁进多明我会，在帕多瓦等地讲授神学，为托马斯·阿奎那的《神学大全》作了详细的注释，是当时最有名的托马斯派学者。1508 年他任多明我会总会长，1517 年被利奥十世立为枢机。

  1518 年他作为教皇的代表到奥格斯堡出席帝国议会，本来的使命是劝德意志诸侯出钱打土耳其人。《历史的轨迹》第二十二章说，教皇授权他传路德到奥格斯堡，要路德公开收回言论，不肯就解送罗马。10 月 12 日至 14 日两人见了三次。迦耶坦事先读过路德的著作，写了十几篇短论，他抓住两点：赎罪券所凭的“功德库”有教皇诏书为据；领圣礼的人不能确知自己蒙赦。路德要求用圣经来证明，不肯说“我收回”。该书说讨论几度十分激烈，路德最后在夜间离开了奥格斯堡。

  迦耶坦随即请教皇对争论之点作正式裁定，11 月教皇发出一道不点名的诏书申明赎罪券的教义。此后他参与起草谴责路德的诏书，1523 年出使匈牙利。晚年他专心注释圣经，主张按字面的本义解经，对一些经卷的作者和武加大译本的译法提出疑问，为此受到巴黎神学家的指责。1534 年他在罗马去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十二章“教会大大骚动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter25.html"
recalled:
  - "路德《奥格斯堡会见纪实》（1518 年）"
  - "迦耶坦《奥格斯堡论文集》（1518 年）"
  - "利奥十世诏书《当你以后》（1518 年 11 月 9 日）"
  - "迦耶坦《神学大全注》"
