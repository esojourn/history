name: 埃斯库罗斯
aliases: [艾斯奇勒斯]
role: 悲剧诗人
summary: 雅典三大悲剧诗人中最早的一位，作《波斯人》《俄瑞斯忒亚》。
body: |-
  雅典人，生于阿提卡的厄琉息斯，父亲欧福里翁。生年据古代的推算约在公元前 525 年。他参加过前 490 年的马拉松之战，兄弟库涅革洛斯在追击波斯人时战死；古人说他也参加了萨拉米斯海战，他的《波斯人》对这场海战的描写被认为出自亲历者。

  他约在前 499 年开始参加悲剧比赛，前 484 年第一次获胜，据古代的记载一生获胜十三次。亚里士多德在《诗学》里说，他把演员从一个增加到两个，削减了歌队的分量，使对话成为主要部分。他写了七十到九十部剧，今存七部：《波斯人》（前 472 年上演，出资组织歌队的是伯里克利），是现存唯一以当时史事为题材的希腊悲剧，从战败一方的宫廷写萨拉米斯的消息传来；《七将攻忒拜》（前 467 年）；《乞援人》；《俄瑞斯忒亚》三联剧（前 458 年），包括《阿伽门农》《奠酒人》《报仇神》，是唯一完整保存的三联剧，写阿伽门农一家几代的仇杀最后由雅典的法庭裁断而终结；还有《被缚的普罗米修斯》，这一部是否出自他本人，现代学者有争议。

  他不止一次去西西里，受到叙拉古僭主希耶隆的款待，在那里上演过剧作。前 456 年或前 455 年他死在西西里的革拉。古人传说一只鹰把乌龟摔在他的秃头上把他砸死，那是无稽之谈。据保萨尼阿斯等人，他的墓志铭只字不提戏剧，只说马拉松的丛林和长发的米底人可以为他的勇武作证。

  他死后，雅典人特许他的剧作继续参加比赛。阿里斯托芬在《蛙》里让他与欧里庇得斯在冥府比试高下，最后是他胜出。
sources: []
recalled:
  - 亚里士多德《诗学》第 4 章
  - 《帕罗斯碑》
  - 古代《埃斯库罗斯传》
  - 阿里斯托芬《蛙》
