name: 韦塞尔·甘斯福特
aliases:
  - 约翰·韦塞尔
  - 韦索的约翰
  - 世界之光
role: 神学家
summary: 格罗宁根人，在共同生活弟兄会的学校受教，批评赎罪券，路德称其见解与自己相合。
body: |-
  韦塞尔 1419 年前后生于荷兰北部的格罗宁根，少年时到兹沃勒，在共同生活弟兄会的学校里读书、教书，在那里认识了年长的多马·肯培。此后他在科隆、海德堡、巴黎等地的大学求学、讲学多年，学过希腊文和希伯来文，到过罗马。时人称他为“世界之光”。

  他认为赦罪出于神，教皇和司铎不能凭自己的权柄赦免或定罪；他批评赎罪券，对圣餐也着重信徒凭信心领受。晚年他回到家乡，在格罗宁根一带的修道院里安静度日，1489 年 10 月去世，没有受过审判。他的文章在他死后由友人保存，1522 年前后刊印，路德在序言里说，如果自己早读过他的书，仇敌就会以为路德的一切都是从他那里拿来的。

  《历史的轨迹》第二十章有一段“韦索的约翰”：在爱尔福特大学任教，受审后被迫撤回主张、死在狱中，又被称为“世界之光”，路德说过上面那句话，死于 1489 年 10 月。这是把两个名字相近的人合成了一个：称号、路德的话和卒年属于韦塞尔·甘斯福特，爱尔福特任教和受审入狱是韦瑟尔的约翰的事，后者死于 1481 年。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 韦塞尔《杂篇》（1522 年刊本，路德作序）
  - 哈登贝格《韦塞尔传》
