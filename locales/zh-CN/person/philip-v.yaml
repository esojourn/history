name: 腓力五世
aliases: []
role: 马其顿国王
summary: 与汉尼拔结盟对抗罗马，在库诺斯克法莱战败。
body: |-
  马其顿安提柯王朝的国王，德米特里二世之子，公元前 238 年生，出生地史料未载。父亲去世时他年幼，由叔祖安提柯三世摄政并继位。据波利比乌斯，前 221 年安提柯三世去世，他十七岁即位。即位之初他率希腊同盟与埃托利亚同盟作战，前 217 年在瑙帕克托斯议和。

  前 215 年，即坎尼会战的次年，他与汉尼拔订立盟约，条文保存在波利比乌斯的书里。罗马于是联合埃托利亚人与他作战，前 205 年双方在腓尼基城议和。前 200 年罗马再度宣战，前 197 年他在色萨利的库诺斯克法莱败于罗马将领弗拉米尼努斯。次年的和约规定他撤出希腊各地的驻军，交出舰队，赔款一千塔兰特，并送次子德米特里到罗马作人质。

  此后他协助罗马对付安条克三世，同时在国内整顿财政、充实人口。晚年长子珀尔修斯与亲罗马的德米特里争位，前 180 年他听信指控处死了德米特里。据李维，他事后悔恨，次年在安菲波利斯病逝，珀尔修斯继位。
sources:
  - 波利比乌斯《历史》卷四第 2、5 章；卷五；卷七第 9 章（与汉尼拔的盟约）；卷十八第 18—27、44 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/18*.html
  - 英文维基百科“Philip V of Macedon”（核对年份） https://en.wikipedia.org/wiki/Philip_V_of_Macedon
recalled:
  - 李维《罗马史》卷二十三第 33—34 章；卷二十九第 12 章；卷三十三第 6—13、30 章；卷四十第 5—24、54—56 章
