name: 屋大维娅
aliases: [小屋大维娅, 奥克塔维娅]
role: 奥古斯都之姐、安东尼之妻
summary: 奥古斯都的姐姐，为维系后三头同盟嫁给安东尼，后被休弃，抚养安东尼的子女。
body: |-
  屋大维乌斯与阿提娅之女，约生于公元前 69 年，奥古斯都的同胞姐姐。她先嫁给盖乌斯·克劳狄乌斯·马塞卢斯，此人是前 50 年的执政官，恺撒的政敌；两人生有一子二女。

  前 40 年马塞卢斯去世，同年屋大维与安东尼在布伦迪西乌姆和解，约定以她嫁给安东尼作为保证。她当时服丧未满，元老院特许她立即再婚。此后两年多她随安东尼住在雅典，生下两个女儿。前 37 年两位三头再起猜疑，据普鲁塔克，是她在塔兰托居间调停，促成双方互换军团和战船。

  此后安东尼回到东方与克娄巴特拉相聚。前 35 年她带着军队和物资去支援安东尼，走到雅典，安东尼来信让她不必再往前。她回到罗马，仍住在安东尼的宅邸，照料他与前妻所生的孩子。普鲁塔克说，她越是这样，罗马人越憎恶安东尼。前 32 年安东尼派人送来休书。

  安东尼死后，她把他与克娄巴特拉所生的孩子接来，同自己的子女一起抚养。她的儿子马塞卢斯娶奥古斯都的女儿尤利娅，被看作继承人，前 23 年病故。她在前 11 年去世，奥古斯都亲致悼词。她两个女儿的后代中出了卡利古拉、克劳狄和尼禄三位皇帝。
sources: []
recalled:
  - 普鲁塔克《安东尼传》第 31、35、53—57、87 章
  - 卡西乌斯·狄奥《罗马史》卷四十八至卷五十四
  - 苏维托尼乌斯《神圣的奥古斯都传》第 61 章
