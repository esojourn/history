name: 吴起
aliases: [吴子]
role: 军事家、改革家
summary: 战国初年的军事家，在魏任西河守，后入楚变法，楚悼王死后被杀。
body: |-
  吴起是卫国左氏人，生年不详，一般认为约在公元前 440 年前后。据《史记·孙子吴起列传》，他家境富裕，为求仕散尽家财，被乡里嘲笑，他杀了嘲笑他的三十多人，向母亲发誓“不为卿相，不复入卫”，然后离家求学。《史记》说他曾学于曾子，母亲死了他也不回去奔丧，曾子因此与他断绝关系（一般认为这里的“曾子”指曾参之子曾申）。

  吴起在鲁国为将时，因妻子是齐国人而受到怀疑，《史记》说他杀妻以求将，率鲁军大败齐军，但随后遭到鲁人的排斥。他投奔魏文侯，率军攻秦，夺取五座城，被任为西河守，抵御秦、韩。他与士卒同衣食，卧不设席，行不骑乘，亲自为士兵吮吸脓疮。魏武侯时，他受到相国公叔的排挤，离开魏国到了楚国。

  楚悼王任吴起为令尹，主持变法。据《史记》，他“明法审令，捐不急之官，废公族疏远者，以抚养战斗之士”，又迁移贵族去开垦荒地。楚国由此强盛，南平百越，北并陈、蔡，击退三晋，西伐秦国。公元前 381 年楚悼王去世，宗室大臣起兵攻杀吴起，吴起逃到悼王的尸体旁伏在尸上，追杀者射死吴起，箭也射中了悼王的尸体。肃王即位后，以射中王尸之罪诛灭了七十多家贵族。

  吴起与孙武并称“孙吴”，兵书《吴子》传为他所作，今本可能经过后人整理。
sources: []
recalled:
  - 《史记·孙子吴起列传》
  - 《战国策·秦策三》
  - 《吴子》
