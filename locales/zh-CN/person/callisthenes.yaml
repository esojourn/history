name: 卡利斯提尼
aliases: [卡利斯忒涅斯]
role: 历史学家
summary: 亚里士多德的亲戚，随亚历山大东征并为他修史，因反对跪拜礼失宠，死于囚禁之中。
body: |-
  卡尔基狄刻半岛奥林托斯人，约生于公元前 360 年，是亚里士多德的外甥女之子（一说外甥），在亚里士多德身边长大。他写过一部十卷的《希腊史》，记前 387 年至前 357 年间的事；又与亚里士多德一起编订德尔斐皮提亚竞技会历届优胜者的名录，德尔斐人为此立碑表彰两人，碑文残片尚存。

  前 334 年他随亚历山大东征，职责是记述远征。他的《亚历山大功业》已失传，从后人的引述看，文字多有颂扬，例如说亚历山大沿潘菲利亚海岸行军时海水后退，像是在向他行礼；又把锡瓦神谕写成承认亚历山大是宙斯之子。

  前 327 年在巴克特里亚，亚历山大想让马其顿人和希腊人也像波斯人那样向他行跪拜礼。据阿里安和普鲁塔克所记的几种说法，卡利斯提尼或在席间发言反对，或在轮到他时没有行礼。此事作罢，他从此被疏远。不久，一批贵族出身的少年侍从密谋趁国王熟睡时行刺，事泄被处死。主谋赫尔摩拉奥斯常听卡利斯提尼讲课，他因此被指为教唆者。

  他的结局，亲历者的说法就不一致：据阿里安，托勒密说他受刑后被绞死，阿里斯托布洛斯说他戴着镣铐随军而行，后来病死。提奥弗拉斯托斯为悼念他写了一篇《卡利斯提尼，或论哀伤》。古代晚期流传很广的小说《亚历山大传奇》被误题为他所作，与他无关。
sources: []
recalled:
  - 阿里安《亚历山大远征记》卷四第 10—14 章
  - 普鲁塔克《亚历山大传》第 52—55 章
