name: 启
aliases: [夏启, 夏后启]
role: 夏后（夏朝君主）
summary: 禹的儿子，相传继禹为君，从此王位父子相传，古书称“家天下”自此开始。
body: |-
  启是禹的儿子，母亲是涂山氏之女。夏代没有同时代的文字材料可以印证，下面所说都出自后世古书，年代不详。据《史记·夏本纪》，禹死前把天下授给伯益，三年丧毕，伯益让位于启，自己避居箕山之阳；因为启贤明，诸侯都去朝见启，启于是即天子之位。古书据此把夏启看作王位世袭的开始，后人称为“家天下”。《竹书纪年》佚文的说法不同，说是伯益想夺启的王位，被启杀死。

  据《史记》和《尚书·甘誓》，启即位后，有扈氏不服，启出兵讨伐，大战于甘，战前作《甘誓》誓师，最终灭了有扈氏。《左传》昭公四年说“夏启有钧台之享”，后世认为钧台在阳翟（今河南禹州）。《山海经》《楚辞·天问》中还有启上天得到《九辩》《九歌》的神话。

  据《史记》，启死后由儿子太康继位。太康以后夏朝一度失国，到少康时才恢复。

  据《史记·夏本纪》，从禹到桀，夏朝共传十四世、十七王，启以后王位基本父子相承，偶有兄终弟及。夏的君主称“后”，所以夏朝又称“夏后氏”。启的生卒年不详，时间长河上他的生卒条只是按断代工程年表画出的大致位置。

  启在古书中又称“夏后启”，《山海经》等书作“夏后开”，是汉代为避汉景帝刘启之讳而改。
sources: []
recalled:
  - 《史记·夏本纪》
  - 《尚书·甘誓》
  - 《左传》昭公四年
  - 《竹书纪年》（佚文）
