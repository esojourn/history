name: 韩愈
aliases: [韩退之, 韩昌黎, 韩文公]
role: 文学家、吏部侍郎
summary: 唐代文学家、思想家，倡导古文运动，排斥佛老，因谏迎佛骨被贬潮州，唐宋八大家之首。
body: |-
  韩愈字退之，河南河阳人，大历三年（公元 768 年）生。他常自称郡望昌黎，所以后人称他韩昌黎。他三岁丧父，由兄嫂抚养，兄长去世后随嫂子郑氏辗转各地，刻苦读书。贞元八年（792 年），他第四次参加进士考试才考中，此后又三次参加吏部的考试都没有通过，只好到宣武、武宁节度使的幕府中任职。

  贞元十九年（803 年）他任监察御史，因上疏说关中旱灾、请求减免赋税，被贬为阳山县令。唐宪宗时他回到朝中。元和十二年（817 年）他以行军司马的身份随宰相裴度讨伐淮西，战后奉命撰写《平淮西碑》，因为文中以裴度为首功，李愬的妻子向朝廷诉说不公，宪宗下令磨去碑文，改由段文昌重写。元和十四年（819 年），宪宗派人迎凤翔法门寺的佛骨入宫供奉，他上《论佛骨表》极力谏阻，宪宗大怒，要处死他，经裴度等人求情，贬为潮州刺史（另见“韩愈谏迎佛骨”条）。他在途中写下“一封朝奏九重天，夕贬潮州路八千”的诗句。

  次年宪宗去世，他被召回，任国子祭酒。长庆二年（822 年）镇州兵变，他奉命前往宣慰，说服了叛将王廷凑。此后他任吏部侍郎等职，长庆四年（824 年）在长安去世，年五十七，谥号文。

  韩愈主张写作先秦两汉那样内容充实、文句自由的散文，反对六朝以来讲究对偶、辞藻的骈文，主张文章要阐明儒家之道（后人概括为“文以明道”，宋代周敦颐又提出“文以载道”），与柳宗元一起推动了古文运动（另见该条）。他在《原道》中推崇儒家的道统，排斥佛教和道教，对宋代理学有影响。他的《师说》《进学解》《祭十二郎文》等文章流传很广。孟郊、张籍、贾岛、李贺等人都受过他的提携。宋代苏轼称他“文起八代之衰”，后世把他列为唐宋八大家之首。
sources: []
