name: 孟尝君
aliases: [田文]
role: 齐国相，“战国四公子”之一
summary: 齐国贵族，门下食客数千，“鸡鸣狗盗”的主角，战国四公子之一。
body: |-
  孟尝君名田文，是齐威王之子靖郭君田婴的儿子，生年不详。据《史记·孟尝君列传》，他生于五月五日，田婴认为这一天生的孩子不吉利，让母亲不要抚养，母亲偷偷把他养大。田婴死后，田文继承了薛（今山东滕州南）的封地，号孟尝君。他招揽各国宾客及亡命之徒，门下食客据说有数千人，无论贵贱都与自己吃同样的饭食。

  公元前 299 年前后，秦昭王请孟尝君入秦为相，后来又听人说他是齐国人，必定先为齐国打算，于是把他扣留，想要杀他。孟尝君托人求秦王的宠姬说情，宠姬要一件白狐裘，而唯一的白狐裘已献给秦王。门客中有个会学狗叫的，夜里扮作狗溜进秦宫的库房偷出了狐裘，宠姬于是为他说情，秦王放了他。孟尝君连夜逃到函谷关，关法规定鸡叫才开关，门客中有人学鸡叫，引得群鸡齐鸣，才得以出关。这就是“鸡鸣狗盗”的故事。

  孟尝君回齐后任相，后来被齐湣王猜忌，离开齐国到魏国任相，并联合秦、赵、燕等国伐齐。齐襄王复国后，他保持中立，不隶属于任何一国。他大约死于公元前 279 年前后，儿子们争立，齐、魏联合灭了薛。《战国策·齐策四》所记的门客冯谖为他在薛地“焚券市义”、营造“狡兔三窟”的故事流传很广。
sources: []
recalled:
  - 《史记·孟尝君列传》
  - 《战国策·齐策四》
