name: 苏格拉底
aliases: []
role: 哲学家
summary: 雅典哲学家，以问答的方式探究德行，公元前 399 年被判死刑。
body: |-
  雅典人，属阿洛佩刻村社。父亲索佛洛尼斯科斯是石匠，母亲斐娜瑞忒是接生妇。他在公元前 399 年受审时说自己七十岁，由此推知约生于前 470 年或前 469 年。他没有写过任何著作。关于他的材料主要有四种：阿里斯托芬的喜剧《云》，他在世时上演；弟子柏拉图的对话；弟子色诺芬的《回忆苏格拉底》等；以及亚里士多德的简短评述。这几种材料里的苏格拉底并不一致，哪些是他本人的思想，哪些是柏拉图借他之口所说，是学术上的老问题。

  他作为重装步兵三次出征：战争初年在波提代亚，据柏拉图的《会饮篇》，他在战斗中救了负伤的亚西比德；前 424 年在德利翁；前 422 年在安菲波利斯。除此之外他几乎没有离开过雅典。他不参与政事，终日在市场和体育场与人交谈，不收学费，生活清贫。他有妻子克桑提佩和三个儿子。

  据柏拉图的《申辩篇》，他的朋友凯瑞丰到德尔斐求问，神谕说没有人比苏格拉底更有智慧。他自觉一无所知，便去盘问以智慧著称的政治家、诗人和工匠，发现他们自以为知道其实并不知道，而他至少知道自己无知。他追问的多是“什么是勇敢”“什么是虔敬”这类问题，从对方的回答里逐步引出矛盾。他说常有一种“神灵的声音”在他要做错事时阻止他。亚里士多德说，归纳的论证和普遍的定义这两件事可以公正地归于苏格拉底。

  前 406 年，雅典公民大会要把阿吉纽西海战的几位将军合并在一起一次表决定罪，他正轮值担任议事会主席团成员，是唯一坚持这样做违法的人。前 404 年三十僭主当政时，命他和另外四人去逮捕萨拉米斯人勒翁，他径自回了家。

  前 399 年，墨勒托斯、安尼托斯和吕孔控告他不敬城邦所敬的神、引进新的神灵、败坏青年。亚西比德和三十僭主的首领克里提亚斯都曾在他身边，这被认为是控告背后的原因之一。陪审员五百人或五百零一人，据柏拉图，只要有三十票改投，他就会被判无罪。议定刑罚时，他先说自己应当在市政厅享受公餐，后来提出罚款三十米那；法庭判处死刑。因为派往提洛岛祭神的船尚未返回，行刑推迟了约一个月。朋友克里同劝他越狱，他拒绝了。柏拉图的《斐多篇》写他在狱中与朋友讨论灵魂不朽，然后饮下毒芹汁。
sources: []
recalled:
  - 柏拉图《申辩篇》《克里同篇》《斐多篇》；《会饮篇》219e—221b
  - 色诺芬《回忆苏格拉底》；《希腊史》卷一第 7 章
  - 亚里士多德《形而上学》卷十三第 4 章
  - 阿里斯托芬《云》
