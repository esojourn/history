name: 欧几里得
aliases: [欧几里德]
role: 数学家
summary: 活动于亚历山大城的数学家，所著《几何原本》把希腊数学整理成从公理出发的演绎体系。
body: |-
  生平几乎一无所知，生卒年和出生地都没有记载。七百多年后的普罗克洛斯说，他比柏拉图的弟子们晚，比埃拉托色尼和阿基米德早，活动于托勒密一世在位时，即公元前 300 年前后；帕普斯提到他的学生在亚历山大城教学。普罗克洛斯还记了一个故事：托勒密问有没有比读《原本》更快的学几何的路，他回答说，几何学里没有专为国王铺的路。同样的话在别的书里被安在另一位数学家和亚历山大身上。中世纪的人常把他同苏格拉底的弟子、麦加拉的欧几里得混为一人。

  《几何原本》共十三卷。开头列出定义、五条公设和几条公理，以后的四百六十多个命题都由它们一步步推出。第一至四卷讲平面图形，第一卷末尾是毕达哥拉斯定理及其逆定理；第五卷是适用于一切量的比例论，一般认为出自欧多克索斯；第六卷讲相似形；第七至九卷讲整数，包括求最大公约数的辗转相除法和素数有无穷多个的证明；第十卷讨论不可公度的量；第十一至十三卷讲立体几何，用穷竭法证明棱锥、圆锥的体积，最后作出五种正多面体并证明只有这五种。书中的大部分结果是前人的，他的功绩在于选择、编排和补全证明。第五公设（相当于过直线外一点只能作一条平行线）自古就有人想从其他公设推出来，到十九世纪才明白这做不到，由此产生了非欧几何。

  他另有《已知数》《图形的分割》《光学》《现象》等著作存世，《圆锥曲线》《衍论》等已失传。

  《几何原本》是古代流传最广的数学书。它在九世纪译成阿拉伯文，十二世纪由阿拉伯文转译成拉丁文，1482 年在威尼斯首次印行。1607 年利玛窦与徐光启合译了前六卷，“几何”这个中文名称和“点”“线”“平行线”“直角”等术语由此而来；后九卷到 1857 年才由伟烈亚力和李善兰译出。
