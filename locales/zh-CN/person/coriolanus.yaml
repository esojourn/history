name: 科里奥拉努斯
aliases: [科利奥兰纳斯, 马尔基乌斯·科里奥拉努斯]
role: 传说中的罗马将领
summary: 传说中的罗马贵族将领，遭流放后引沃尔斯基人进攻罗马，被母亲劝退。
body: |-
  相传为公元前 5 世纪初的罗马贵族，本名格奈乌斯（一作盖乌斯）·马尔基乌斯。他的事迹见于李维、狄奥尼修斯和普鲁塔克，没有同时代的记载，他的名字也不见于执政官名录，现代学者多认为出于传说。

  据传说，前 493 年罗马军队围攻沃尔斯基人的城市科里奥利，他带人冲进城门并放火，城由此攻陷，他因而得名“科里奥拉努斯”。当时平民刚刚通过撤离争得保民官一职。两年后罗马闹饥荒，从西西里运来粮食，他在元老院主张，平民须放弃保民官才可以低价得粮。保民官要传他受审，他不肯到场，被判流放。

  他投奔沃尔斯基人的首领阿提乌斯·图利乌斯，带领沃尔斯基军队连下拉丁各城，在离罗马五里处扎营。元老院派出的使节和祭司都被他回绝。最后他的母亲维图里娅、妻子沃伦尼娅（普鲁塔克把母亲叫沃伦尼娅，妻子叫维吉利娅）带着两个孩子和一群妇女来到营中，他被母亲的责问打动，下令撤军。

  他的结局说法不一。李维引最早的罗马史家费边·皮克托说，他在流亡中活到老年；另一说是沃尔斯基人因他撤军而把他杀死。莎士比亚的悲剧《科利奥兰纳斯》取材于普鲁塔克的传记。
sources: []
recalled:
  - 李维《建城以来史》卷二第 33—40 章
  - 普鲁塔克《科里奥拉努斯传》
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷六至卷八
