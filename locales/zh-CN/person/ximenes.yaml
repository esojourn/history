name: "西曼乃斯"
aliases: ["希梅内斯", "西斯内罗斯", "弗朗西斯科·希梅内斯·德·西斯内罗斯"]
role: "托莱多大主教、枢机"
summary: "托莱多大主教，整顿西班牙的修会与教士，创办阿尔卡拉大学，印行多语圣经。"
body: |-
  西曼乃斯 1436 年生于卡斯蒂利亚的托雷拉古纳，家境清寒。他在萨拉曼卡学法律，去过罗马，回国后因为一个教职与托莱多大主教相争，坐了几年牢。1484 年他已近五十岁，放弃了教区里的职位，进了方济各会最严格的一支，在山间隐修。

  1492 年女王伊莎贝拉选他做告解神父，1495 年又让他出任西班牙首席主教托莱多大主教，相传他是奉了教皇的命令才接受的。《历史的轨迹》第二十九章说，女王发起改革西班牙教会，西曼乃斯是真正策划并办成这件事的人：他为修道院订立严格的规条，强迫教士过端正的生活，把无知无能的革职，其余的送进他设立的学校学神学；女王保护他不受教皇干涉。据记载，他整顿方济各会时，有上千名不肯守规矩的修士宁可渡海去北非。

  1499 年他到刚收复的格拉纳达，嫌前任劝化摩尔人太慢，下令成批施洗、焚烧阿拉伯文的宗教书籍，激起叛乱；事后国王以此为由，要当地的穆斯林在受洗和离境之间选择。1507 年他任枢机和卡斯蒂利亚的宗教裁判所总裁判长，1509 年自己出钱并随军渡海攻下奥兰。

  1508 年他创办的阿尔卡拉大学开学，设希腊文、希伯来文讲席。他聘学者编印《康普鲁顿多语对照圣经》，把希伯来文、希腊文、拉丁文并排印出，其中的希腊文新约 1514 年就印成了，比伊拉斯谟的本子早两年，只是等教皇批准，1520 年以后才发行。

  该书说，他在路德之前已完成西班牙的改革，教义、圣礼和教皇的地位一概未动，所以是“改革”而不是“改教”。国王斐迪南死后他以八十高龄摄政，1517 年 11 月 8 日在去迎接新王查理的路上死于罗阿，离路德公布论纲只有八天。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十九章“罗马教会从事改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter32.html"
recalled:
  - "《康普鲁顿多语对照圣经》（1514—1517 年印，1520 年后发行）"
  - "戈麦斯·德·卡斯特罗《西斯内罗斯行述》（1569 年）"
