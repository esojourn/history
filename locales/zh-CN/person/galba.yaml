name: 加尔巴
aliases: [塞尔维乌斯·苏尔皮基乌斯·加尔巴, 伽尔巴]
role: 罗马皇帝
summary: 尼禄死后被元老院承认的皇帝，在位七个月，被禁卫军杀死。
body: |-
  加尔巴于公元前 3 年 12 月 24 日生在塔拉基纳附近，出身共和时代的显贵世家。公元 33 年任执政官，先后主持上日耳曼和阿非利加的军政，60 年起做了八年近西班牙总督。

  68 年春，高卢总督文德克斯起兵反对尼禄，推他出面。他自称“元老院和罗马人民的代表”。6 月尼禄自杀，元老院承认他为皇帝，这时他已七十出头。他带兵进罗马，一路杀了不少人；禁卫军长官曾以他的名义许下赏金，他拒不兑付，苏维托尼乌斯记他说：“我的兵是征来的，不是买来的。”

  69 年 1 月 1 日，上日耳曼的军团拒绝向他宣誓，随后拥立维特利乌斯。他收养年轻的贵族皮索为继承人，一直指望这个位置的奥托便买通禁卫军。1 月 15 日，加尔巴在罗马广场被杀。塔西佗评论说，人人都以为他能做皇帝，假如他没有做过的话。
sources: []
recalled:
