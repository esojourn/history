name: 郑吉
aliases: [安远侯]
role: 西域都护
summary: 汉宣帝时在西域屯田的将领，迎降匈奴日逐王，成为第一任西域都护。
body: |-
  据《汉书·傅常郑甘陈段传》，郑吉是会稽人，以士卒的身份多次随军到西域，因此任郎官。本传说他为人坚强有志，熟悉外国事务。宣帝时他以侍郎的身份在渠犁屯田积谷，地节二年（公元前 68 年）调发西域各国的兵和屯田的士卒攻破车师，升为卫司马，负责保护鄯善以西的南道各国。

  神爵年间，匈奴内乱，统领西域的日逐王先贤掸与新立的单于不合，派人向郑吉表示愿意降汉。郑吉调集渠犁、龟兹等国的五万人前去迎接，把日逐王及其部众护送到长安。匈奴设在西域的僮仆都尉从此撤销。朝廷命郑吉兼护车师以西的北道，因为南北两道都由他统管，所以称为“都护”。他被封为安远侯，在西域中部的乌垒城建立都护府。

  本传说，汉朝的号令通行于西域，是从张骞开始而在郑吉手中完成的。他在黄龙元年（前 49 年）去世。
sources: []
recalled:
  - 《汉书·傅常郑甘陈段传》
  - 《汉书·西域传》
