name: 巨然
aliases: []
role: 画僧
summary: 南唐僧人画家，学董源的画法，南唐亡后到开封，与董源并称“董巨”。
body: |-
  巨然是南唐的僧人，据郭若虚《图画见闻志》，他是钟陵人，在金陵开元寺出家。他的生卒年都不详。开宝八年（公元 975 年）南唐灭亡，他随后主李煜来到开封，住在开宝寺，在开封的学士院画过壁画，受到当时人的称赏。

  巨然的山水画学董源，善画江南的烟岚山色，山头多用矾头（圆形的小石块），林木间常点缀蒲草，笔墨秀润。据宋人评论，他早年的作品还有些刻意，晚年更为平淡。后人把他与董源并称“董巨”，元明画家多以他们为师法对象，明代董其昌把他列为南宗的代表人物之一。

  传为巨然的作品有《秋山问道图》《层岩丛树图》《万壑松风图》（以上均藏台北故宫博物院）等，真伪问题与董源的作品一样，学界尚有不同意见。
sources: []
recalled:
  - 郭若虚《图画见闻志》卷四
  - 米芾《画史》
  - 《宣和画谱》卷十二
