name: 阿斯帕西娅
aliases: [阿斯帕齐娅]
role: 伯里克利的伴侣
summary: 米利都人，长期与伯里克利同居，在雅典的文化圈中颇有声名。
body: |-
  小亚细亚的米利都人，父亲名阿克西奥科斯。她何时、为何来到雅典，没有记载。作为外邦人，她在雅典没有公民身份。约公元前 445 年，伯里克利与妻子离异后与她同居，直到去世。按伯里克利自己提出的公民法，两人所生的儿子小伯里克利不算雅典公民；伯里克利的两个婚生儿子死于瘟疫后，公民大会特准小伯里克利取得公民身份。此人后来当选将军，前 406 年阿吉纽西海战后与其他几位将军一同被处死。

  关于她的材料大多出自喜剧和几百年后的普鲁塔克。喜剧诗人拿她攻击伯里克利，把她比作赫拉和翁法勒；阿里斯托芬在《阿卡奈人》里戏称战争是因为她的两个妓女被麦加拉人抢走而起。普鲁塔克说，萨摩斯战争被认为是她为了家乡米利都而怂恿的，又说喜剧诗人赫尔米波斯控告她不敬神，伯里克利在法庭上流泪求情，她才获释；这场审判是否真有其事，现代学者多有怀疑，有人认为是从喜剧情节里演变出来的。

  苏格拉底的圈子里常提到她。柏拉图的《美涅克塞努篇》让苏格拉底说自己的一篇葬礼演说是从她那里学来的，语带戏谑；色诺芬和埃斯基涅斯也写到她善于言谈。普鲁塔克说伯里克利死后她与一个名叫吕西克勒斯的羊商同居，此人在前 428 年阵亡。她的卒年不详。
sources: []
recalled:
  - 普鲁塔克《伯里克利传》第 24—25、32、37 章
  - 柏拉图《美涅克塞努篇》235e—236c
  - 阿里斯托芬《阿卡奈人》第 524—529 行
