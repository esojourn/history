name: 罗波安
aliases: []
role: 南国犹大第一位王
summary: 所罗门之子，在示剑拒绝减轻劳役，十个支派离去，只余犹大一国。
body: |-
  所罗门的儿子，母亲是亚扪人拿玛。据《列王纪上》14:21，他登基时四十一岁，在耶路撒冷作王十七年；出生地圣经没有记载。

  所罗门死后，他到示剑去，以色列人要在那里立他作王。耶罗波安和以色列会众请求他减轻所罗门加给他们的苦工和重轭。罗波安先问侍立在所罗门面前的老年人，他们劝他用好话回答；他又问与自己一同长大的少年人，便照少年人的主意答复百姓，说他要加重他们的轭，父亲用鞭子责打，他要用蝎子鞭责打（12:1–15）。以色列人于是离去。罗波安派掌管服苦之人的亚多兰去见他们，亚多兰被石头打死，罗波安急忙上车逃回耶路撒冷（12:18）。他召集犹大家和便雅悯支派十八万人，要与以色列家争战，神人示玛雅传耶和华的话加以阻止，众人就回去了（12:21–24）。

  《历代志下》第 11 章记载，他在犹大和便雅悯修筑了伯利恒、提哥亚、拉吉、希伯仑等坚固城，罗波安王第五年，埃及王示撒上来攻打耶路撒冷，夺了圣殿和王宫里的宝物，连所罗门制造的金盾牌也都夺去，罗波安制造铜盾牌代替（《列王纪上》14:25–28；《历代志下》第 12 章）。一般认为示撒就是埃及第二十二王朝的舍顺克一世，卡纳克神庙的浮雕上留有他这次出征所到城邑的名单。罗波安死后葬在大卫城，儿子亚比央（《历代志》作亚比雅）接续作王。
sources: []
recalled:
  - 《列王纪上》第 12 章、14:21–31
  - 《历代志下》第 10—12 章
  - 埃及卡纳克神庙舍顺克一世浮雕铭文
