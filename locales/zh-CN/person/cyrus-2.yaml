  - 《历代志下》36:22–23
  - 《以赛亚书》44:28、45:1
  - 《但以理书》1:21、6:28、10:1
  - 希罗多德《历史》卷 1
  - 《拿波尼度编年记》
  - 居鲁士圆柱铭文
  - 色诺芬《居鲁士的教育》
