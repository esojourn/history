name: 居鲁士二世
aliases: [古列, 居鲁士大帝]
role: 波斯国王
summary: 波斯帝国的建立者，攻取巴比伦后准许被掳的犹太人归回重建圣殿。
body: |-
  波斯阿契美尼德王朝的君主，和合本圣经译作“古列”。据希罗多德《历史》卷一，他的父亲是波斯人冈比西斯，母亲是玛代王阿斯提阿格斯的女儿；希罗多德也说关于他的出身有几种不同的传说，他只取了其中一种。生年没有可靠记载。约公元前 559 年他继位，当时波斯人臣属于玛代。

  据巴比伦的《拿波尼度编年记》，阿斯提阿格斯出兵攻打居鲁士，军队却倒戈，把国王交给了居鲁士，玛代都城埃克巴坦那随之陷落，通常定在公元前 550 年。此后他西征吕底亚，攻下都城撒狄，俘获国王克罗伊斯，事见希罗多德，确切年份尚有讨论。公元前 539 年，他的军队在俄庇斯击败巴比伦军，随后不经战斗进入巴比伦城，国王拿波尼度被俘，新巴比伦王国灭亡，事见《拿波尼度编年记》。

  居鲁士圆柱是在巴比伦出土的一件泥制圆柱铭文，现藏大英博物馆。铭文以居鲁士的口吻说，巴比伦的神马尔杜克拣选了他，他和平进入巴比伦，把若干地方的神像送回原来的庙宇，并让那里的居民返回故地。铭文没有提到犹太人或耶路撒冷。

  圣经方面，《以赛亚书》44:28、45:1 提到古列的名字，称他为耶和华所膏的。《历代志下》36:22–23 和《以斯拉记》1:1–4 记载，古列元年他下诏准许犹太人回耶路撒冷重建耶和华的殿；《以斯拉记》1:7–11 又记他把尼布甲尼撒从圣殿掠去的器皿交还给犹大的首领设巴萨。《但以理书》也提到古列在位的年间（1:21、6:28、10:1）。

  关于他的死，古代记载不一。希罗多德说他在征讨马萨革泰人时战死，并说明这只是他听到的几种说法之一；色诺芬《居鲁士的教育》则写他寿终于宫中，该书一般不被当作严格的史书。通常认为他死于公元前 530 年。他葬在帕萨尔加德，陵墓至今尚存。其子冈比西斯二世继位。
sources: []
recalled:
