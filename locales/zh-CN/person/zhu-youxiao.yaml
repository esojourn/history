name: 天启帝
aliases: [朱由校, 明熹宗]
role: 明朝第十五代皇帝
summary: 少年即位，喜好木工，把朝政交给宦官魏忠贤，在位期间阉党大肆迫害东林党人。
body: |-
  朱由校是泰昌帝朱常洛的长子。万历四十八年（1620 年）万历帝去世，朱常洛即位不到一个月就因服用“红丸”猝死；朱由校在大臣杨涟等人的护持下，从泰昌帝宠妃李选侍的控制中被接出，即皇帝位，次年改元天启。“梃击”“红丸”“移宫”三案此后成为朝中党争的焦点。

  朱由校即位时十六岁，据史书记载，他没有受过多少教育，喜欢做木工，亲手制作器物。他宠信乳母客氏和宦官魏忠贤，魏忠贤掌管司礼监和东厂，权势日盛，朝中依附他的官员被称为“阉党”。天启四年（1624 年）杨涟上疏弹劾魏忠贤二十四条大罪，朱由校不予理睬；此后阉党大兴冤狱，杨涟、左光斗等东林党人先后惨死狱中，各地还为魏忠贤建造生祠（另见“东林党争”条）。

  天启年间东北局势继续恶化，后金先后攻占沈阳、辽阳、广宁，天启六年（1626 年）袁崇焕在宁远击退努尔哈赤（另见“宁远之战”条）。天启七年（1627 年）朱由校因落水受惊后患病去世，年二十三岁，没有存活的儿子，由弟弟朱由检即位，即崇祯帝。
sources: []
recalled:
  - 《明史·熹宗本纪》
  - 《明史·魏忠贤传》
