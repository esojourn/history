name: "伊丽莎白一世"
aliases: ["伊莉沙白", "伊丽莎白女王"]
role: "英格兰女王"
summary: "英格兰女王，确立国教会的折中体制，援助荷兰新教徒，击退无敌舰队。"
body: |-
  伊丽莎白 1533 年 9 月 7 日生于格林尼治，是亨利八世与安妮·博林的女儿。她不到三岁母亲被处死，自己被宣布为私生女。她跟剑桥来的学者读书，通拉丁文、希腊文、法文和意大利文。姐姐玛丽在位时，她被疑与新教徒的叛乱有关，在伦敦塔里关了两个月。《历史的轨迹》第二十八章说她受教于克兰麦，表面遵行天主教礼仪，心中归属新教；克兰麦是她的教父，她的老师是阿斯卡姆等人。

  1558 年 11 月她即位，时年二十五岁。次年议会通过新的《至尊法案》，再次废除教皇在英格兰的权柄，她的称号由“最高元首”改为“最高管理者”；又通过《信仰划一法》，恢复 1552 年的《公祷书》而略作修改，删去咒诅教皇的祷文，施饼酒时的话把新旧两种讲法并在一起。玛丽时代的主教除一人外都不肯宣誓，被免职。1563 年教士会议把《四十二信条》改定为《三十九信条》。该书称这些安排为“伊丽莎白决议”，说这些妥协在当时看来明智，却成了后来许多不满与冲突的根源。从日内瓦回来的流亡者嫌改得不彻底，清教徒由此而起。

  1570 年教皇庇护五世下诏开除她的教籍，解除臣民对她的效忠。此后对天主教徒的法律转严，潜入国内的司铎有一百多人被处死。逃到英格兰的苏格兰女王玛丽被她囚禁十九年，1587 年因涉入行刺密谋被处死。

  该书第三十章说，她对新教徒友善，给起来反抗西班牙的荷兰人提供军援，天主教徒多次策划暗杀她。1585 年她正式派兵去尼德兰。1588 年西班牙国王腓力二世派无敌舰队来攻，被英格兰舰队和风暴击溃。

  她终身未婚。1603 年 3 月 24 日她在里士满宫去世，苏格兰国王詹姆斯继位。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十八章“英国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter31.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
recalled:
