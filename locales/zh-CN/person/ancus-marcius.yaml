name: 安库斯·马尔基乌斯
aliases: [安库斯·马尔西乌斯]
role: 传说中的罗马第四位国王
summary: 传说中的罗马第四位国王，努马的外孙，相传建立了奥斯提亚港。
body: |-
  相传为罗马第四位国王，努马的外孙，传统上定在公元前 642 年至前 617 年在位。李维说他的性情介于努马和图卢斯之间：即位后先恢复努马定下的宗教仪式，把它们写在板上公之于众；又订立由专门祭司（“费提阿莱斯”）向敌人提出要求、限期不答复再宣战的仪式。

  他与拉丁人作战，攻取了几座城，把居民迁到罗马的阿文提诺山。传说他在台伯河上建了第一座木桥（苏布利基乌斯桥），在河对岸的雅尼库鲁姆山设防，在台伯河口建立奥斯提亚，并开辟盐场；罗马的第一座监狱也归在他名下。奥斯提亚现存最早的遗迹属于前 4 世纪，比传说的年代晚得多。

  据李维，他在位二十四年后去世。他的两个儿子尚未成年，由他信任的外来人卢库莫（即后来的老塔克文）做监护人，后者设法当选为王。多年以后，安库斯的儿子们雇人刺杀了老塔克文。
sources: []
recalled:
  - 李维《建城以来史》卷一
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷三
