name: 惠施
aliases: [惠子]
role: 魏国相，名家代表人物
summary: 名家的代表人物，长期任魏惠王的相，善于辩论，提出“历物十事”；与庄子是好友。
body: |-
  惠施是宋国人，生卒年不详，大致与庄子同时。他长期在魏国任相，辅佐魏惠王。据《战国策》等书，马陵之战后，惠施建议魏国尊齐为王以缓和局势，促成了公元前 334 年的“徐州相王”。后来张仪到魏国推行连横，与惠施的主张相反，惠施被逐出魏国，先到楚国，又回到宋国，张仪离魏后他才回来。

  惠施是名家的代表人物，喜好辩论。《庄子·天下》说“惠施多方，其书五车”，并列举了他的十个论题，称为“历物十事”，如“至大无外，谓之大一；至小无内，谓之小一”“天与地卑，山与泽平”“日方中方睨，物方生方死”“泛爱万物，天地一体也”等，涉及空间、时间和事物同异的相对性。

  惠施与庄子是好友，《庄子》中记载了二人的许多辩论，最著名的是在濠水桥上关于“子非鱼，安知鱼之乐”的对话。惠施的著作已经失传。
sources: []
recalled:
  - 《庄子·天下》
  - 《庄子·秋水》
  - 《战国策·魏策》
