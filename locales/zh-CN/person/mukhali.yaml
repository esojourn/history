name: 木华黎
aliases: [太师国王]
role: 蒙古帝国将领
summary: 成吉思汗“四杰”之一，受封太师国王，全权主持对金朝华北地区的战事。
body: |-
  木华黎是札剌亦儿部人，生于 1170 年。他的父亲是铁木真家族的世仆，他年轻时就追随铁木真，以沉毅多智谋著称，与博尔术、博尔忽、赤老温并称“四杰”。在统一蒙古各部的战争中他屡立战功，1206 年大蒙古国建立时被任为左手万户。

  1211 年起他随成吉思汗攻金，参加了野狐岭之战。1217 年成吉思汗准备西征，封木华黎为太师、国王，把汉地事务全权交给他，让他率领蒙古军和投降的汉军继续攻金。此后几年他攻取了河北、山东、山西、陕西的许多州县，注意招降汉人地方武装，任用他们为将，史天倪、张柔、严实等汉人世侯在这一时期纷纷归附。1223 年他在攻金的军中病死，没有看到金朝灭亡。
sources: []
recalled:
  - 《元史·木华黎传》
  - 《蒙鞑备录》
