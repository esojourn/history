name: "慕迪"
aliases: ["德怀特·慕迪", "穆迪"]
role: "美国布道家，慕迪圣经学院创办人"
summary: "鞋店店员出身的平信徒布道家，与桑基在英美各地主领奋兴会，创办慕迪圣经学院。"
body: |-
  《历史的轨迹》第四十五章说，内战时期到军中传福音的是年轻的慕迪，他此前已在芝加哥做过不少福音工作。他生于马萨诸塞的诺斯菲尔德，四岁丧父，母亲千辛万苦把孩子们养大，所以他受的教育很少。他十八岁接受耶稣基督，第二年到芝加哥经商；他在普利茅斯教会租了一些座位，专门邀请年轻人与他一同去崇拜，又在贫民区开办主日学，把街上的孩子召集起来教他们圣经。

  书中说，后来他放下职业，全时间投入基督教工作，1865 至 1869 年任芝加哥青年会会长，在任内筹款建起青年会在美国的第一座会所。据一般记载，他 1837 年出生，是在波士顿做鞋店店员时由主日学老师带领归信的；内战中他通过基督教委员会到北军营中工作。

  书中说，1871 年以后他在全美各地主持奋兴会，又几次到英格兰和苏格兰巡回布道；他的同工桑基是杰出的歌唱家，带会众唱诗，也介绍新的诗歌。慕迪讲道强调靠耶稣基督得救，言语简单、灵里火热、态度诚恳，吸引无数人来听，他和桑基成了全美家喻户晓的人物。据一般记载，1871 年芝加哥大火烧毁了他的教会和住所，他在英国的大型布道是 1873—1875 年，回美后在各大城市举行布道会，他与桑基合编的诗歌集流传很广。

  书中说，慕迪很有组织才干，在马萨诸塞办了基督教寄宿学校，又在芝加哥办了慕迪圣经学校，晚年大部分时间用在这些学校上，1899 年在诺斯菲尔德去世。据一般记载，诺斯菲尔德的学校 1879 年起开办，芝加哥的学校 1886 年开办，他去世后改名为慕迪圣经学院；他在诺斯菲尔德召开的学生夏令会，正是 1886 年“学生志愿海外宣教运动”的起点。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
recalled:
  - "《桑基诗歌》（与桑基合编）"
