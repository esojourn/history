name: 阿提拉
aliases:
  - 阿提拉王
role: 匈人的王
summary: 匈人的王，451 年在高卢战败，452 年入侵意大利，会见教皇利奥一世后撤兵。
body: |-
  阿提拉的生年和出生地都没有记载。公元 434 年前后，他与哥哥布列达一同继承叔父，统领匈人，445 年前后杀死布列达，独自为王。他的大营设在多瑙河以北的平原上，449 年随东罗马使团到过那里的普里斯库斯留下了亲眼所见的记述。他多次攻入巴尔干，迫使东罗马年年纳贡。

  441 至 447 年他两度大举攻入巴尔干，攻破奈苏斯、塞尔迪卡等城，一直打到温泉关；东罗马每年的贡金从七百磅黄金加到二千一百磅。他治下除匈人外，还有格皮德人、东哥特人等许多附属部族。449 年东罗马的大臣收买他的近臣行刺，事情败露，他只向皇帝索要了更多的赔偿。据普里斯库斯，宴席上宾客用金银器皿，他自己只用木杯木盘，衣着朴素；约达尼斯转述普里斯库斯的话说，他身材矮小，胸宽头大，眼睛细小，胡须稀疏。

  公元 451 年他率匈人和附属的各日耳曼部族西进高卢。罗马统帅埃提乌斯联合西哥特人，在卡塔隆尼亚平原迎战，《历史的轨迹》第七章称为迦隆之战。西哥特王战死，阿提拉则退回了莱茵河东。

  第二年他转攻意大利，毁了阿奎莱亚，攻下米兰等城。皇帝派出使团，成员中有罗马主教利奥一世，在明乔河边与他会面，此后他撤兵北还。《历史的轨迹》说他转攻罗马城，教皇出面求情，保全了罗马；当时的记载很简略，只说他接见了使团后下令撤退。同时代人还提到，那年意大利闹饥荒，匈人军中有疫病，东罗马的军队也在袭击他的后方。

  公元 453 年，他在迎娶一位新妇的当夜暴死。他的儿子们争位，附属各族起来反叛，匈人的势力几年之内就瓦解了。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 普里斯库斯《历史》残篇
  - 约达尼斯《哥特史》第 34—49 章
  - 阿奎丹的普罗斯佩《编年史》452 年条
  - 约达尼斯《哥特史》第 35 章
