name: 威克里夫
aliases:
  - 约翰·威克里夫
  - 威克理夫
  - 宗教改革的晨星
role: 牛津大学教师、改教先驱
summary: 牛津神学家，主张圣经是信仰的唯一根据，批评教皇制与化质说，推动把圣经译成英文。
body: |-
  威克里夫生于英格兰北部的约克郡。《历史的轨迹》第二十章说他生于 1320 年；他的生年没有记载，学者推定在 1320 年代，多取 1328 年前后。他在牛津大学读书、任教，1372 年得神学博士学位，是当时牛津最有名的教师。1374 年他随王室使团到布鲁日与教皇的代表谈判英格兰向教廷纳款的事，同年得到拉特沃思教区的职位。

  该书说他从 1376 年开始批评圣职人员。那年前后他写了《论世俗统治权》，主张统治和占有的权利以蒙恩为前提，教士若行为不义，世俗政府可以收回教会的产业。国王的儿子冈特的约翰因此支持他。1377 年伦敦主教传他受审，冈特的约翰陪同出庭，不欢而散；同年教皇贵格利十一世发出几道诏书谴责他的论点。次年主教们再审，王太后传话干预，伦敦市民冲进会场，审讯又没有结果。

  1378 年教会大分裂开始，他的言论更加激烈。他说教会是全体蒙拣选的人，头是基督而不是教皇，称教皇为敌基督；又说只有圣经是信仰的根据。1379 年以后他否定化质说，认为饼和酒在祝圣后仍是饼和酒。这使他失去贵族的支持，牛津的一个委员会谴责了他的讲法。1382 年坎特伯雷大主教在伦敦开会，定他的二十四条论点为异端或谬误，他的追随者被逐出牛津。

  他退居拉特沃思继续写作。《历史的轨迹》说他把圣经译成英文；现存的两种“威克里夫圣经”都从拉丁文武加大译本译出，主要出自他的同道之手，他本人译了多少已难确定。他的跟随者带着译本四处讲道，被称为罗拉德派。1384 年 12 月 28 日他在做弥撒时中风，31 日去世。

  1401 年英格兰议会应主教们的要求立法，规定可以烧死异端分子，罗拉德派有不少人殉道。1415 年康斯坦茨会议谴责他的著作，下令掘出遗骨；1428 年他的遗骨被焚，骨灰撒进河里。他的书传到波希米亚，影响了胡斯。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 威克里夫《论世俗统治权》《论圣经的真理》《论教会》《论圣餐》
  - 托马斯·沃尔辛厄姆《英格兰史》
  - 亨利·奈顿《编年史》
  - 1415 年康斯坦茨会议第 8 次会议谴责威克里夫的决议
