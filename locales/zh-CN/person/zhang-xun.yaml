name: 张巡
aliases: [张中丞]
role: 真源县令、河南节度副使
summary: 安史之乱中坚守雍丘、睢阳，阻挡叛军南下江淮，城破后被杀。
body: |-
  张巡的籍贯，《旧唐书》说是蒲州河东，《新唐书》说是邓州南阳，两书不同。他在开元末年考中进士，曾任清河县令，天宝末年任真源县令。

  天宝十五载（公元 756 年）安禄山的叛军进入河南，谯郡太守投降，张巡在真源起兵，与单父尉贾贲合兵进入雍丘。贾贲战死后，他独自率领一千多人坚守雍丘，叛将令狐潮等人多次围攻，他用草人借箭、夜间出城偷袭等办法，坚持了一年多。

  至德二载（757 年）正月，安庆绪派尹子奇率大军进攻睢阳，睢阳太守许远向他求援，他率部进入睢阳，两人合兵约六千八百人（据《资治通鉴》）。许远自认才能不如张巡，把指挥权交给他，自己负责筹集粮草和器械。他们坚守了十个月，前后与叛军交战四百余次。城中粮尽后，将士先吃茶纸、树皮，再捕食雀鼠，据《新唐书》，张巡杀了自己的爱妾给士兵吃。部将南霁云突围向临淮的贺兰进明求救，贺兰进明拥兵不救（另见“睢阳之战”条）。

  同年十月城破，张巡、许远被俘，张巡与南霁云、雷万春等三十六人被杀，许远被押往洛阳，途中遇害。几天后唐军收复洛阳。他死后，朝中对他死守睢阳以至于食人的做法有过争议，李翰为他作传辩护；后来韩愈作《张中丞传后叙》，记述了他和许远、南霁云的事迹。睢阳一战拖住了叛军南下江淮，后世多认为保全了唐朝的财赋来源。
sources: []
recalled:
  - 《旧唐书·忠义传·张巡》
  - 《新唐书·忠义传·张巡》
