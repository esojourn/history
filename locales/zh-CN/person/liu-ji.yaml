name: 刘基
aliases: [刘伯温, 诚意伯]
role: 朱元璋的谋臣
summary: 元末进士，辅佐朱元璋谋划灭陈友谅、张士诚，封诚意伯，民间称“刘伯温”。
body: |-
  刘基字伯温，处州青田（今浙江文成一带）人，生于至大四年（公元 1311 年）。他博通经史，元统元年（1333 年）考中进士，此后在元朝做过县丞、江浙儒学副提举等官，因为人刚直、议论时政，屡受排挤，几次弃官归隐。元末方国珍在浙东起兵，他主张剿灭，与当权者意见不合，再次辞官回乡，在家中写成寓言体的著作《郁离子》。

  至正二十年（1360 年）朱元璋攻取处州后派人礼聘，刘基与宋濂、章溢、叶琛一同到应天，他向朱元璋陈述《时务十八策》。当时朱元璋面对陈友谅、张士诚两大势力，刘基主张先集中力量对付陈友谅，认为张士诚只求自保，不足为虑；陈友谅进攻应天时，他又力主迎战。此后他随军参与了鄱阳湖之战的谋划。他还劝朱元璋摆脱韩林儿的名义，自立名号。

  明朝建立后，刘基任御史中丞兼太史令，参与制定律令、历法和礼制，洪武三年（1370 年）封诚意伯。他为人刚正，与丞相李善长、胡惟庸等人不和，洪武四年（1371 年）告老还乡。后来他受到胡惟庸的诬陷，入京谢罪，忧愤成疾，洪武八年（1375 年）回乡后去世。《明史》记载，他病时胡惟庸曾派医生送药，服后病情加重，此事后来成为胡惟庸的罪状之一，真相如何，学者看法不一。民间把他附会成能预知未来的神人，《烧饼歌》等预言书都是后人托名之作。
sources: []
recalled:
  - 《明史·刘基传》
  - 黄伯生《故诚意伯刘公行状》
