name: 王叔文
aliases: []
role: 翰林学士、户部侍郎
summary: 唐顺宗做太子时的侍读，顺宗即位后主持永贞革新，失败后被贬，次年被赐死。
body: |-
  王叔文是越州山阴人，天宝十二载（公元 753 年）生，因为擅长下棋而入翰林院做棋待诏，后来被派到东宫，做太子李诵的侍读。他常与太子议论朝政，暗中结交韦执谊、刘禹锡、柳宗元、陆质等一批年轻官员。

  贞元二十一年（805 年）正月，太子在中风失语中即位，是为唐顺宗。王叔文任翰林学士，兼任度支、盐铁副使，与王伾在宫中通过宦官李忠言和顺宗的宠妃牛昭容传达旨意，由宰相韦执谊在外施行。他们罢除宫市和五坊小儿，停止各地额外进奉，贬斥京兆尹李实，又派老将范希朝统领神策军，想从宦官手中收回兵权，但神策军诸将拒绝交出兵权（另见“永贞革新”条）。

  同年五六月间他因母丧离职，宦官俱文珍等人与韦皋等藩镇联合，迫使顺宗让位给太子李纯。八月他被贬为渝州司户，次年被赐死。
sources: []
recalled:
  - 《旧唐书·王叔文传》
  - 《新唐书·王叔文传》
  - 韩愈《顺宗实录》
