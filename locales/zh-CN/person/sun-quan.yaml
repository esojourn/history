name: 孙权
aliases: [孙仲谋, 吴大帝, 吴王]
role: 皇帝
summary: 孙吴的建立者，继承父兄基业据有江东，赤壁、夷陵两战后称帝，在位至七十一岁。
body: |-
  据《三国志·吴书·吴主传》，孙权字仲谋，是孙坚的次子、孙策的弟弟。建安五年（公元 200 年）孙策遇刺身亡，十九岁的孙权接掌江东。当时只有几个郡在控制之下，边远山区尚未归附，他依靠张昭、周瑜等人稳住了局面。

  建安十三年（208 年）曹操南下，取得荆州后顺江东进。孙权的部下多主张归降，他采纳周瑜、鲁肃的意见，与刘备联合，在赤壁击败曹军。此后他把治所迁到秣陵，改名建业，并在濡须口筑坞防备曹军。他与刘备为荆州的归属屡起争执，建安二十四年（219 年）乘关羽北攻樊城，派吕蒙袭取荆州，杀关羽。为防刘备报复，他向曹丕称臣，受封吴王；黄武元年（222 年）陆逊在夷陵击败刘备后，他便自立年号，不再奉魏正朔，次年与蜀汉恢复同盟。

  黄龙元年（229 年）孙权在武昌称帝，国号吴，同年迁都建业。次年他派卫温、诸葛直率兵一万人渡海寻找夷洲和亶洲，船队到达夷洲，带回数千人；学者多认为夷洲就是台湾。在内地，他多次派兵进入丹杨等地的山区，把被称作“山越”的居民迁出，补充兵源和户口。

  孙权晚年猜忌日重。他任用吕壹等人监察百官，引起群臣不安。赤乌年间，太子孙和与鲁王孙霸各有朝臣支持，争斗多年，史称“二宫之争”，丞相陆逊因此事受到责备，忧愤而死。赤乌十三年（250 年）孙权废孙和、赐死孙霸，改立幼子孙亮。神凤元年（252 年）四月他去世，终年七十一。
sources: []
recalled:
  - 《三国志·吴书·吴主传》及裴松之注
