name: 萨卢斯特
aliases: [盖乌斯·萨卢斯提乌斯·克里斯普斯, 撒路斯提乌斯, 萨鲁斯特]
role: 罗马史学家
summary: 罗马史学家，恺撒部下，著《喀提林阴谋》《朱古达战争》，痛陈共和国的道德败坏。
body: |-
  盖乌斯·萨卢斯提乌斯·克里斯普斯，公元前 86 年生于萨宾地区的阿米特努姆，出身当地的富裕家庭，是家族中第一个进入元老院的人。前 52 年他任保民官，在克洛狄乌斯被杀后的骚乱中鼓动民众反对米洛和西塞罗。前 50 年监察官以品行不端为由把他逐出元老院，这多半与派系之争有关。

  内战中他投靠恺撒，重回元老院。前 46 年他随恺撒征战阿非利加，为军队运送粮食；战后恺撒把努米底亚王国的大部分设为新行省，任命他为首任总督。他回罗马后被控搜刮行省，据卡西乌斯·狄奥，靠恺撒包庇才没有定罪。他在罗马修建了著名的“萨卢斯特花园”，后来归皇帝所有。

  恺撒遇刺后他退出政治，专心写史。他在序言里说，自己年轻时卷入政治，在那里见到的是无耻、贿赂和贪婪，于是决定把余生用来记述罗马人的事迹。《喀提林阴谋》记前 63 年的事件；《朱古达战争》记前 2 世纪末的努米底亚战争，他说选这个题目，是因为人们在这场战争中第一次起来对抗贵族的傲慢。最后一部《历史》五卷，从前 78 年苏拉去世写起，没有写完，只有几篇演说、书信和一些残篇留存。

  他认为罗马的道德在前 146 年迦太基毁灭之后败坏，原因是外敌的威胁消失，贪欲和野心滋长。他以修昔底德为榜样，文句简短，爱用古词，喜欢为人物编写演说，其中恺撒和小加图在元老院的对比最有名。他在年代和细节上常有疏误，对贵族的指责也带有党派色彩。昆体良把他与修昔底德相比，塔西佗受他影响很深。归在他名下的两封致恺撒的书信和一篇攻击西塞罗的檄文，真伪有争议。他约在前 35 年去世。
sources: []
recalled:
  - 萨卢斯特《喀提林阴谋》《朱古达战争》《历史》残篇
  - 卡西乌斯·狄奥《罗马史》卷四十、卷四十三
  - 昆体良《演说术原理》卷十
  - 哲罗姆《编年史》
