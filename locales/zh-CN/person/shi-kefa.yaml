name: 史可法
aliases: [宪之, 道邻, 忠正]
role: 南明弘光朝的督师大学士
summary: 明末南京兵部尚书，弘光朝以大学士督师扬州，1645 年扬州城破，不屈而死。
body: |-
  史可法是河南祥符（今开封）人，祖籍顺天府大兴，生年一般作 1601 年，另有 1602 年之说。他是东林党人左光斗的学生，据说左光斗在诏狱中临死前，史可法化装进狱探望，这件事见于方苞的《左忠毅公逸事》。崇祯元年（1628 年）他考中进士，此后在安徽、湖广一带镇压农民起义，崇祯十六年（1643 年）任南京兵部尚书。

  崇祯十七年（1644 年）北京失陷，崇祯帝自缢，南京的大臣商议拥立新君。史可法等人倾向于立潞王朱常淓，凤阳总督马士英联合江北的将领拥立福王朱由崧，福王在南京即位，次年改元弘光。史可法以东阁大学士兼兵部尚书的身份督师扬州，节制江北四镇。但四镇将领高杰、刘泽清、刘良佐、黄得功互相争斗，朝中马士英、阮大铖专权，排挤东林、复社人士，弘光朝廷没有能够组织起有效的防御。史可法曾与多尔衮通信，拒绝了多尔衮的劝降。

  顺治二年（1645 年）四月，清军在多铎的率领下南下，围攻扬州。史可法率军民坚守，城中兵力薄弱，援军不至。四月二十五日扬州城被攻破，史可法被俘，拒绝投降，被杀。清军随后在扬州屠城十日（另见“扬州之役”条）。史可法的遗体没有找到，后人在扬州梅花岭为他建了衣冠冢。乾隆年间清朝追谥他为“忠正”。他的《复多尔衮书》流传很广。
sources: []
recalled:
  - 《明史·史可法传》
  - 王秀楚《扬州十日记》
  - 方苞《左忠毅公逸事》
  - 全祖望《梅花岭记》
