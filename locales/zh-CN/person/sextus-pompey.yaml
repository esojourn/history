name: 塞克斯图斯·庞培
aliases: [小庞培, 绥克斯都·庞培]
role: 罗马将领
summary: 庞培的幼子，占据西西里，以舰队封锁意大利的粮道，被阿格里帕击败后遭处死。
body: |-
  庞培的小儿子，约生于公元前 67 年。前 48 年法萨卢斯战后，他随父亲乘船到埃及，在船上目睹父亲登岸时被杀。他随后去了阿非利加，塔普苏斯战败后到西班牙投奔哥哥格奈乌斯。前 45 年蒙达之战哥哥兵败被杀，他躲进山区，靠游击重新聚起一支军队。

  恺撒遇刺后，元老院在前 43 年任命他为舰队和海岸的长官。同年后三头把他列入公敌名单，他带舰队占领西西里，继而控制撒丁岛和科西嘉岛。他收容公敌名单上的逃亡者和逃跑的奴隶，截断运往罗马的粮船，造成饥荒。他自称海神尼普顿之子，标榜为父报仇。

  前 39 年罗马民众因缺粮骚动，屋大维和安东尼在米塞努姆与他订约，承认他据有西西里、撒丁、科西嘉；他解除封锁，逃亡者可以回乡。普鲁塔克记载，三人在他的旗舰上宴饮时，部将梅纳斯悄悄问他要不要砍断缆绳、做全世界的主人，他回答说：你应该不告诉我就动手，现在我不能背誓。

  和约不久破裂。前 36 年阿格里帕在米莱和瑙洛库斯两次击败他，他带少数船只逃往小亚细亚，前 35 年被安东尼的部将提提乌斯俘获，在米利都处死；是否出自安东尼本人的命令，古人说法不一。
sources: []
recalled:
  - 阿庇安《内战史》卷四、卷五
  - 卡西乌斯·狄奥《罗马史》卷四十八、卷四十九
  - 普鲁塔克《安东尼传》第 32 章
