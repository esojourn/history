name: 斐赖的伊阿宋
aliases: [伊阿宋]
role: 色萨利统领
summary: 色萨利斐赖城的僭主，统一色萨利并拥有强大的雇佣军，公元前 370 年遇刺。
body: |-
  色萨利城市斐赖的僭主，生年和早年经历不详，一般认为他继承了前任僭主吕科弗隆的地位，可能是其子。他靠一支训练有素的雇佣军逐步控制了色萨利各城。据色诺芬，法萨卢斯的波吕达马斯曾到斯巴达求援，转述了伊阿宋的实力和打算，斯巴达无力出兵，波吕达马斯只得与他和解。约公元前 374 年，伊阿宋被推为全色萨利的统领（“塔戈斯”），可以调动色萨利的骑兵、重装步兵和周边部族的轻装兵。

  他与底比斯结盟，也同雅典保持友好。前 371 年留克特拉之战后，底比斯人请他来一同攻击败退的斯巴达军，他迅速率军赶到，却劝双方停战，促成斯巴达残部撤走。归途中他拆毁了扼守温泉关一带的赫拉克利亚的城墙。

  前 370 年他下令色萨利各城为德尔斐的皮提亚竞技会准备大批祭牲，并集结军队，外间猜测他想主持赛会甚至控制神庙的财富。赛会之前，他在检阅骑兵后接见来人时被几名青年刺死，原因说法不一。伊索克拉底说他曾谈到要渡海进攻波斯国王。

  他死后，兄弟波吕多罗斯、波吕弗隆相继掌权，不久权位落到亚历山大手中；色萨利的统一随之瓦解，十几年后为马其顿的腓力二世所控制。
sources: []
recalled:
  - 色诺芬《希腊史》卷六第 1 章、第 4 章
  - 狄奥多罗斯《历史丛书》卷十五
  - 伊索克拉底《致腓力》119—120
