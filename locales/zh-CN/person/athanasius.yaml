name: 亚他那修
aliases:
  - 亚大纳西
  - 阿塔纳修
role: 亚历山大主教
summary: 亚历山大主教，一生为尼西亚信经“圣子与圣父同质”辩护，五次被放逐。
body: |-
  亚他那修约在公元 296 至 298 年间生于埃及的亚历山大。他年轻时作了主教亚历山大的执事和书记，公元 325 年随主教出席尼西亚会议。《历史的轨迹》第五章说，在与亚流的争辩最激烈的时候，他还只是个年轻人。328 年亚历山大去世，他被选为亚历山大的主教，当时约三十岁。

  他主张圣子与圣父同质，圣子就是神。《历史的轨迹》说明他为什么把这一点看得这样重：救赎的价值全在于基督是谁，人无法自救，只有神能拯救；基督若不是神，就不能作人类的救主。他早年写的《论道成肉身》讲的就是这个道理。

  尼西亚会议以后，亚流一派得到皇帝和宫廷的支持，亚他那修先后五次被赶出亚历山大，在外的时间加起来约十七年。公元 335 年推罗会议罢免了他，君士坦丁把他放逐到高卢的特里尔。339 年他再次被逐，到罗马住了七年，得到罗马主教犹利乌和西方教会的支持。356 年军队夜间包围他正在主持聚会的教堂，他脱身逃入埃及的旷野，在修士中间躲藏了六年，这期间写了《驳亚流派》和《安东尼传》。362 年尤利安皇帝又下令驱逐他，他称这是“一片很快就过去的云”。最后一次是 365 年，在瓦伦斯皇帝手下，只有几个月。后人用“亚他那修对抗世界”一语概括他的处境。

  他把埃及修士的生活介绍给西方教会。公元 367 年他照例写信通知各教会当年复活节的日期，在这第 39 封节期书信里列出了新约二十七卷的书目，这是现存最早与今天的新约完全一致的书目。

  他最后七年安然留在亚历山大，公元 373 年 5 月 2 日去世。八年后的君士坦丁堡会议重申了尼西亚的信仰。
