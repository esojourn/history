name: 寇准
aliases: [寇莱公, 寇忠愍]
role: 北宋宰相
summary: 北宋宰相，1004 年力主真宗亲征澶州，促成澶渊之盟，晚年被丁谓排挤，死于雷州。
body: |-
  寇准是华州下邽人，生于北宋建隆二年（公元 961 年）。太平兴国五年（980 年）他考中进士，当时还不到二十岁。他在太宗朝以敢于直言著称。据《宋史》本传，有一次他在殿上奏事，太宗听得生气，起身要走，寇准拉住太宗的衣服，请他坐下把事情议完，太宗事后称赞他，把他比作唐太宗的魏征。淳化五年（994 年）他升任参知政事，后来因与同僚不和一度被贬出京城。

  景德元年（1004 年）寇准与毕士安一同拜相。这年秋天，辽圣宗与承天太后萧绰率大军南下，一直打到澶州城下。朝中参知政事王钦若主张南迁金陵，签书枢密院事陈尧叟主张迁往成都，寇准力主皇帝亲征，说提出迁都的人可以斩首。宋真宗勉强北上，在寇准的坚持下渡过黄河，登上澶州北城，城下宋军望见御盖，士气大振。此前辽军大将萧挞览已被宋军用床弩射死，辽方于是同意议和。据宋人记载，真宗曾允许使臣曹利用以每年一百万为限，寇准私下警告曹利用，超过三十万就要杀他，最后议定每年给辽绢二十万匹、银十万两（另见“澶渊之盟”条）。

  盟约订立后，寇准一时声望很高。王钦若对真宗说，澶渊之盟是城下之盟，寇准是把皇帝当作赌博的“孤注”。真宗从此对寇准冷淡，景德三年（1006 年）罢免了他的相位。天禧三年（1019 年）他再次拜相，次年因主张由太子监国、反对刘皇后干政，被丁谓等人排挤罢相，此后一贬再贬。乾兴元年（1022 年）他被贬为雷州司户参军，天圣元年（1023 年）死在雷州。寇准一生有直言、刚强的名声，也有人批评他性情骄纵、生活奢侈。后来朝廷为他恢复名誉，赐谥“忠愍”。
sources: []
recalled:
  - 《宋史·寇准传》
  - 《续资治通鉴长编》卷五十七至一百一
  - 司马光《涑水记闻》
