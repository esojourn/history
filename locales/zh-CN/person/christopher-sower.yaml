name: "克里斯托弗·索尔"
aliases: ["索尔", "绍尔"]
role: "顿克派印刷商，《索尔圣经》出版人"
summary: "在北美最早印行德文报纸，1743 年出版美洲第一本欧洲语言的圣经。"
body: |-
  《历史的轨迹》第四十一章在讲来到美洲的德国团体时说，1719 年抵达宾夕法尼亚的德国浸礼派被人称为顿克派，名称来自德文“浸”字；他们先定居在日耳曼敦，1723 年才成立教会。顿克派在教义上与贵格派、门诺派一致，穿着朴实，奉圣父、圣子、圣灵的名行“三重浸礼”，只给成人施浸，教会行政与公理派相同。

  该书说，殖民地时期最重要的一位顿克派信徒是索尔，他是第一位到美洲的德国印刷者，也是第一位编辑印行德文报纸的人；他去世后，儿子继承父业。1743 年出版的《索尔圣经》是在美洲出版的第一本欧洲语言的圣经，对早期德国移民的灵性帮助极大。据一般记载，他 1695 年生于德国拉斯费，1724 年移居日耳曼敦，1738 年起办印刷所，他本人是否正式加入顿克派说法不一，他的同名儿子则是顿克派的长老。这本德文圣经采用路德译本，比第一本英文圣经在美洲出版早约四十年；在它之前，美洲只印过艾略特译的印第安语圣经。他 1758 年在日耳曼敦去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十一章“教会进入新大陆” https://wellsofgrace.com/books/spiritual/2000years/html/chapter46.html"
