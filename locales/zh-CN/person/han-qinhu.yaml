name: 韩擒虎
aliases: [韩擒, 韩子通, 韩擒豹]
role: 大将
summary: 隋朝伐陈的主将之一，夜渡采石，率先攻入建康，俘获陈后主。
body: |-
  韩擒虎字子通，河南东垣人，本名擒豹，后世多称擒虎（唐人避讳“虎”字，史书中常写作韩擒）。他在北周时以武勇知名，参与过灭北齐的战争。隋朝建立后，他任庐州总管，负责筹划伐陈的江北防务。

  开皇九年（公元 589 年）正月，他率五百人从横江夜渡长江，袭取采石，陈朝守军正醉酒，没有察觉。随后他进军姑孰，陈朝不少将领望风归降。随后他率精骑从朱雀门攻入建康，在景阳殿的井中找到陈后主，将其俘获。因为贺若弼在钟山苦战，而他先入京城，两人在文帝面前争功。

  他回朝后被封为上柱国，后任凉州总管。开皇十二年（592 年）去世，年五十五。据《隋书》本传，他死前邻居传言看见他门前仪仗森严，说是迎接“王”的，他听后说“生为上柱国，死作阎罗王，斯亦足矣”，这是史书所载的一则传闻。
sources: []
recalled:
  - 《隋书·韩擒虎传》
  - 《资治通鉴》卷一百七十七
