name: 司提反二世
aliases:
  - 斯德望二世
  - 司提反三世
role: 罗马主教（教皇）
summary: 752—757 年在位的教皇，越过阿尔卑斯山向丕平求援，得到丕平所献的土地。
body: |-
  司提反是罗马人，公元 752 年 3 月当选教皇。在他之前当选的另一位司提反几天后就去世，没有来得及祝圣，所以他的序数有“二世”“三世”两种算法。

  伦巴第王艾斯图尔夫已在 751 年占领拉文纳，接着向罗马索要贡金。司提反向君士坦丁堡的皇帝求援没有结果，753 年 10 月离开罗马，先到帕维亚与艾斯图尔夫交涉不成，随后越过阿尔卑斯山，是第一位到法兰克去的教皇。754 年 1 月他在蓬蒂翁见到丕平，同年 7 月在圣但尼膏立丕平和他的两个儿子，授给他们“罗马人的贵族”的称号。

  丕平两次出兵意大利。756 年艾斯图尔夫围攻罗马时，司提反以使徒彼得的名义写信催促法兰克人。伦巴第人战败后交出的拉文纳等城，由丕平献给教皇，教皇从此成为一片领土的统治者。《历史的轨迹》第九章叙述了这些事，但没有提司提反的名字，把它们记在前任撒迦利亚名下。司提反于 757 年 4 月去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第九章“教会组成联盟” https://wellsofgrace.com/books/spiritual/2000years/html/chapter11.html"
recalled:
  - 《教皇列传》司提反二世传
  - 《法兰克王国年代记》753—756 年
  - 《加洛林书信集》
