name: 君士坦提乌斯一世
aliases: [君士坦提乌斯·克洛鲁斯, 君士坦丢, 苍白者君士坦提乌斯]
role: 罗马皇帝
summary: 四帝共治时西部的“恺撒”，收复不列颠，君士坦丁大帝的父亲。
body: |-
  君士坦提乌斯一世约生于公元 250 年，是巴尔干伊利里亚一带的人，行伍出身。后世称他“克洛鲁斯”，意思是面色苍白，这个绰号要到拜占庭时代才见于记载；说他是皇帝克劳狄二世后裔，则是他儿子在位时才有的说法。272 年前后，海伦娜在奈苏斯为他生下君士坦丁，两人是否正式成婚，史料说法不一。后来他娶了马克西米安的继女狄奥多拉。

  293 年 3 月 1 日，戴克里先建立四帝共治，他被立为西部的“恺撒”，驻特里尔，管高卢和不列颠。当年他攻下卡劳修斯在高卢海岸的据点；296 年分两路渡海，部将击杀继卡劳修斯自立的阿莱克图斯，他本人进入伦敦，不列颠在脱离十年后重归帝国。此后他在高卢东部两次击败阿勒曼尼人。

  303 年大逼迫开始。拉克坦提乌斯说他只拆了教堂，没有伤人；优西比乌说他连教堂也没有拆。305 年他升为“奥古斯都”。君士坦丁从东方赶来会合，父子同到不列颠北部征讨皮克特人。306 年 7 月 25 日他在约克去世，军队当场拥立君士坦丁。
sources: []
recalled:
  - 拉克坦提乌斯《论迫害者之死》第 15、24 章
  - 优西比乌《君士坦丁传》卷 1 第 13—21 章
  - 《拉丁颂词集》第 8 篇
  - 《无名氏瓦莱西亚努斯》第一部
