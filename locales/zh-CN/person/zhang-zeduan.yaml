name: 张择端
aliases: [张正道]
role: 北宋画家
summary: 北宋末年画家，《清明上河图》的作者，生平只见于金代张著的题跋。
body: |-
  张择端的生平，宋代文献几乎没有记载。今天所知的情况主要来自《清明上河图》卷后金朝大定二十六年（1186 年）张著的题跋：张择端字正道，东武人，幼年读书，游学于京师，后来学习绘画，本来擅长界画，尤其喜欢画船只、车辆、市场、桥梁和城郭街道，自成一家。张著还提到，据《向氏评论图画记》，《西湖争标图》和《清明上河图》都被评为“神品”。他的生卒年都不详，一般认为他活动在北宋末年，宋徽宗时可能在翰林图画院任职，这一点也缺乏直接的证据。

  《清明上河图》现藏北京故宫博物院，是绢本淡设色的长卷，长五米多，描绘北宋都城开封郊外到城内的景象：田野、汴河上的漕船、虹桥两岸的店铺和人群、城门内外的街市。据研究者统计，画中有八百多个人物，各行各业都有，还有大量的牲畜、车船和房屋，是研究北宋城市生活、建筑、交通的重要形象资料。

  关于这幅画，学界还有许多争论：画名中的“清明”是指清明节、清明坊，还是“政治清明”的意思；画是作于北宋末年还是南渡以后；卷尾是否有残缺。画上没有作者的署名，把它归于张择端，依据的就是张著的题跋。此画历代辗转流传，明清时期出现了许多仿本，其中以清代宫廷画家合作的“清院本”最为有名。
sources: []
recalled:
  - 《清明上河图》卷后张著跋
  - 郭若虚、邓椿等宋人画史中有关界画的记载
