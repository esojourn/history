name: 李德裕
aliases: [李文饶, 卫国公]
role: 宰相
summary: 唐武宗时的宰相，主持击败回鹘、平定泽潞，牛李党争中“李党”的首领，贬死崖州。
body: |-
  李德裕字文饶，赵郡赞皇人，贞元三年（公元 787 年）生，是宰相李吉甫的儿子。他不愿参加科举，以门荫入仕。唐穆宗时他任翰林学士，以文才受到器重；此后长期出任浙西观察使，在润州整顿风俗，禁止当地滥造祠庙。唐文宗大和四年（830 年）他出任西川节度使，修筑城防，次年接受吐蕃维州守将悉怛谋的投降，但宰相牛僧孺主张归还，文宗听从了牛僧孺，两人从此结怨更深（另见“牛李党争”条）。大和七年（833 年）他第一次任宰相，不久被排挤出朝。

  开成五年（840 年）唐武宗即位，召他回朝任宰相，此后执政将近六年，深得武宗信任。会昌年间，他主持应对回鹘汗国瓦解后南下的乌介可汗部，会昌三年（843 年）唐军击败乌介可汗（另见“回鹘汗国瓦解”条）；同年昭义节度使刘从谏的侄子刘稹自立，朝中多主张姑息，他力主讨伐，次年平定泽潞。他还限制宦官干预军政，支持武宗废佛（另见“会昌灭佛”条）。

  会昌六年（846 年）唐宣宗即位，他立即被罢相，此后被一再贬谪，从荆南节度使贬到潮州司马，再贬为崖州司户。大中三年十二月（按公历已是 850 年初），他在崖州去世，年六十三。他的诗文编为《会昌一品集》。他在洛阳城外建有平泉山庄，收集各地的奇石花木，写过《平泉山居草木记》。后人对他的评价分歧很大，宋代以后不少学者认为他是唐后期有作为的宰相。
sources: []
recalled:
  - 《旧唐书·李德裕传》
  - 《新唐书·李德裕传》
  - 李德裕《会昌一品集》
  - 《资治通鉴》卷二百四十至二百四十八
