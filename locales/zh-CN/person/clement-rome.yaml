name: 罗马的革利免
aliases:
  - 革利免一世
  - 克莱门
role: 罗马教会领袖
summary: 一世纪末罗马教会的领袖，写有《致哥林多人前书》。
body: |-
  革利免是一世纪末罗马教会的领袖。据爱任纽所列的罗马主教名单，他排在彼得、保罗之后的第三位（另有名单把他排在第一位）。《历史的轨迹》把他列为使徒后时期的教父之一，并提醒读者不要把他和一百年后亚历山大的革利免混淆。他的出身、生年和结局都没有可靠记载，后世关于他被流放克里米亚、殉道的故事出现得很晚，一般认为不足为据。

  他留下一封以罗马教会名义写给哥林多教会的信，通称《革利免致哥林多人前书》，约写于公元 96 年前后。当时哥林多教会有几个年轻人把原有的长老赶下台，这封信劝他们悔改，恢复秩序。信中第 5 章提到彼得和保罗因嫉妒而受苦、殉道，是关于两位使徒结局的最早文献之一。这封信在一些古代教会里曾和新约书信一同在聚会中宣读。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三章“教会内部的成长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter04.html"
recalled:
  - 《革利免致哥林多人前书》第 5、44 章
  - 爱任纽《驳异端》卷 3 第 3 章第 3 节
  - 优西比乌《教会史》卷 3 第 15—16 章
