name: 卢基乌斯·尤尼乌斯·布鲁图
aliases: [老布鲁图, 布鲁图斯, 卢修斯·布鲁图斯]
role: 传说中的罗马共和国创立者、首任执政官
summary: 传说中驱逐国王塔克文、创立罗马共和国的人，首任执政官之一。
body: |-
  相传为罗马共和国的创立者和第一任执政官。据李维，他的母亲是国王“高傲者”塔克文的姐妹；塔克文处死了他的兄长，他为自保装作迟钝，“布鲁图”这个名字就是“愚钝”的意思。传说他曾陪两位王子去德尔斐求问神谕，神谕说最先亲吻母亲的人将得到罗马的最高权力，他假装跌倒，亲吻了大地。

  公元前 509 年（传统年代），卢克蕾提亚受王子塞克斯图斯之辱后自尽，布鲁图当时在场，拔出刀来发誓驱逐国王一家。他当时任骑兵长官，有权召集人民；他在广场上陈说国王的暴行，人民决议放逐塔克文，围攻阿尔代亚的军队也倒向他。王政废除后，百人队大会选出两名每年一任的执政官，他和卢克蕾提亚的丈夫科拉提努斯当选。据李维，他让人民起誓永不容许任何人在罗马称王，并把元老补足到三百人；不久又以科拉提努斯出自塔克文家族为由劝他离任，由瓦勒里乌斯接替。

  同年一些贵族青年密谋迎回国王，其中有布鲁图的两个儿子。阴谋被一个奴隶告发，布鲁图以执政官的身份判处他们死刑，并亲自到场看着他们受鞭笞、斩首。这件事在罗马人那里成了公义先于私情的例证。

  不久塔克文借维爱和塔尔奎尼的兵力来攻，两军在阿尔西亚森林相遇。据李维，布鲁图与王子阿伦斯策马对冲，互相刺中，双双落马而死，罗马的妇女为他服丧一年。这些记载形成于几百年之后，细节不可尽信；希腊史家波利比乌斯说他是首任执政官之一，并把罗马与迦太基的第一份条约系在他任内。刺杀恺撒的马尔库斯·布鲁图自称是他的后代。
sources: []
recalled:
  - 李维《建城以来史》卷一、卷二
  - 普鲁塔克《普布利科拉传》
  - 波利比乌斯《历史》卷三第 22 章
