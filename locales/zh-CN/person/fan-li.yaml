name: 范蠡
aliases: [少伯, 鸱夷子皮, 陶朱公]
role: 越国大夫，商人
summary: 越国大夫，辅佐勾践灭吴后急流勇退，泛舟而去，后在陶经商致富，号陶朱公。
body: |-
  范蠡字少伯，一般认为是楚国宛（今河南南阳）人，生卒年不详。他到越国事奉勾践，与文种一起成为勾践最重要的谋臣。据《国语·越语》，勾践即位不久想攻吴，范蠡劝阻，勾践不听，在夫椒大败。此后范蠡辅佐勾践忍辱求和、发展生产、训练军队，前后二十多年，终于在公元前 473 年灭吴。

  灭吴之后，勾践被尊为霸主，范蠡被任为上将军。据《史记·越王勾践世家》，他认为盛名之下难以久居，而且勾践的为人“可与同患，难与处安”，于是带着家人和财物乘船离开越国。他写信给文种说：“蜚鸟尽，良弓藏；狡兔死，走狗烹。”劝文种也离开。

  范蠡到了齐国，改名为鸱夷子皮，在海边耕作，积累了数十万的家产，齐人请他做相。他认为久受尊名不祥，于是交还相印，散尽家财，来到被视为“天下之中”的陶（今山东定陶），自称陶朱公，经商致富。《史记·货殖列传》说他“十九年之中三致千金”，又多次把财富分给贫穷的朋友和远房亲族。后世商人奉他为祖师。

  关于范蠡与西施泛舟五湖的故事，出自汉代以后的《越绝书》《吴越春秋》等书，《左传》《国语》《史记》都没有记载。

  《史记》称他“三迁皆有荣名”。
sources: []
recalled:
  - 《史记·越王勾践世家》
  - 《史记·货殖列传》
  - 《国语·越语下》
