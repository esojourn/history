name: 卢循
aliases: [卢于先]
role: 广州刺史、五斗米道首领
summary: 孙恩的妹夫和继任者，占据广州数年，乘刘裕北伐时北上进逼建康，败退后死于交州。
body: |-
  卢循字于先，祖籍范阳涿县，出身北方士族范阳卢氏，是西晋末年名士卢谌的曾孙，生年不详。他娶了孙恩的妹妹，参与孙恩的起事。元兴元年（公元 402 年）孙恩投海后，余众推他为首领。

  掌权的桓玄想安抚他，任他为永嘉太守，他仍然四出攻掠，被刘裕接连击败。元兴三年（404 年）他率众渡海南下，攻占番禺，赶走广州刺史。当时刘裕刚刚打败桓玄，无力远征，朝廷便在义熙元年（405 年）任他为广州刺史，任他的姐夫徐道覆为始兴相。

  义熙六年（410 年），刘裕北伐南燕，徐道覆劝他乘虚北上。两人分兵沿湘水、赣水而下，在豫章击杀江州刺史何无忌，又在桑落洲击败刘毅，船队直逼建康。徐道覆主张立即决战，他犹豫不肯，刘裕已从北方赶回，布置防守。他相持不下，退回寻阳，年底在大雷、左里接连战败。这时刘裕派出的一支水军已从海道袭取了番禺。义熙七年（411 年）他回攻番禺不克，转往交州，被交州刺史杜慧度击败，投水而死。
sources: []
recalled:
  - 《晋书·卢循传》
  - 《宋书·武帝纪》
  - 《资治通鉴》卷一百一十二至一百一十六
