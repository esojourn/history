name: 秦桧
aliases: [秦会之]
role: 南宋宰相
summary: 南宋宰相，主持与金订立绍兴和议，构陷岳飞，独掌朝政十八年。
body: |-
  秦桧字会之，江宁（今江苏南京）人，生于元祐五年（公元 1090 年）前后。政和五年（1115 年）进士及第，靖康年间任御史中丞。靖康二年（1127 年）金人要废宋另立张邦昌，秦桧上书反对，随后与徽宗、钦宗一同被押往北方，在金朝将领完颜昌（挞懒）的军中任事。

  建炎四年（1130 年）秦桧带着妻子王氏和家人从金军中回到南宋，自称是杀了看守逃回的。当时就有人怀疑他是被金人有意放回的，此事至今说法不一。他向高宗提出与金议和、“南人归南，北人归北”的主张，绍兴元年（1131 年）拜相，次年被罢。

  绍兴八年（1138 年）秦桧再次拜相，主持与金议和。绍兴十年金朝撕毁和约，宋军在各路获胜之后，他与高宗决意再和，召回岳飞等将领；次年收回三大将的兵权，与金订立绍兴和议，宋向金称臣（另见“绍兴和议”条）。岳飞被诬下狱，秦桧主持了审讯，岳飞在绍兴十一年年底被害（另见“岳飞之死”条）。

  此后秦桧独揽朝政，直到去世，前后任相十八年。他排斥异己，赵鼎、李光、胡铨等主战派大臣多被贬到岭南、海南，又禁止私人撰写史书，以文字罗织罪名。绍兴二十五年（1155 年）秦桧去世，高宗随即罢免了他的党羽。宋宁宗开禧二年（1206 年）北伐前夕，朝廷追夺他的王爵，改谥“缪丑”。明代以后杭州岳飞墓前铸有秦桧夫妇等人的跪像，他成为后世公认的奸臣典型。也有学者认为，主和的主要决策者是宋高宗本人。
sources: []
recalled:
  - 《宋史·奸臣传·秦桧》
  - 《建炎以来系年要录》
