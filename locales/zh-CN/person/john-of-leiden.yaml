name: "莱顿的约翰"
aliases: ["扬·伯克尔松", "雷登约翰", "莱顿的扬"]
role: "明斯特重洗派“国王”"
summary: "荷兰裁缝，1534 年在被围的明斯特自立为王，实行多妻，城破后被处死。"
body: |-
  莱顿的约翰本名扬·伯克尔松，1509 年生在荷兰莱顿附近，是私生子，学过裁缝，开过酒店，喜欢演戏。1533 年他受了哈勒姆面包师马提斯的洗。马提斯自称是先知，接续被关在斯特拉斯堡的霍夫曼，说基督即将再来。

  1534 年初约翰到了威斯特法伦的明斯特。那里的牧师罗特曼已倾向重洗派，2 月重洗派在市议会选举中得势，马提斯随即赶来，宣布明斯特是新耶路撒冷，不肯重洗的人都被赶出城。《历史的轨迹》第二十五章把占领明斯特记在 1533 年，应是 1534 年。明斯特的主教带兵围城，天主教和路德派的诸侯都出兵相助。

  该书说，马提斯 1534 年 4 月战死，由莱顿的约翰继任；他实行多妻制，同年秋自立为“王”。马提斯是复活节那天带着少数人冲出城去被杀的。约翰废了市议会，设十二长老，7 月下令准许多妻，自己娶了十几个妻子，9 月称“锡安的王”，在集市上设宝座听讼，对不服的人亲手处决。城里凡物公用，后来粮食断绝。

  围城持续了一年多。1535 年 6 月 24 日夜里有人引围城的军队进城，守城的人大多被杀。约翰被俘，1536 年 1 月与另外两人在明斯特的集市上被烧红的铁钳折磨后处死，尸体装进铁笼挂在圣兰伯特教堂的塔上，笼子至今还在。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十五章“重洗派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter28.html"
recalled:
  - "克森布罗克《明斯特重洗派的疯狂》"
  - "格雷斯贝克《明斯特围城亲历记》"
  - "罗特曼《复原》（1534 年）"
