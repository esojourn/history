name: 伊尹
aliases: [阿衡, 伊挚]
role: 商汤的辅臣
summary: 商初大臣，相传辅佐商汤灭夏，又曾放逐无道的太甲，三年后还政。
body: |-
  伊尹是商初的大臣，《史记·殷本纪》说他“名阿衡”，一说名挚。他的出身古书说法不一：一说他想求见汤而没有门路，就做了有莘氏陪嫁的媵臣，背着鼎俎，借谈论烹调来劝说汤推行王道；一说他本是隐居的处士，汤派人五次聘请才出山。司马迁把两说并存。

  据《史记》，伊尹辅佐汤讨伐夏桀，商朝建立后执掌国政。汤死后，经外丙、中壬，太甲即位。太甲在位三年，“暴虐，不遵汤法”，伊尹把他放逐到汤的墓地所在的桐宫，自己摄政当国。三年后太甲悔过，伊尹迎回太甲，把政权交还给他。伊尹死于太甲之子沃丁的时候。

  《竹书纪年》佚文的说法完全不同：伊尹放逐太甲后自立为王，七年后太甲从桐宫潜出，杀了伊尹。两种说法孰是孰非，至今无法断定。伊尹在甲骨卜辞中多次作为受祭的对象出现，说明商人后代对他非常尊崇。

  伊尹在后世被奉为贤相的典范，常与周公并称“伊周”。《孟子·万章上》说伊尹本来“耕于有莘之野”，汤三次派人去聘请他才出山。“伊尹放太甲”也被后人引为大臣可以废立昏君的先例，西汉霍光废昌邑王刘贺时，就以伊尹之事为依据。

  据《史记·殷本纪》，伊尹死后葬于亳，大臣咎单追述伊尹的事迹，作《沃丁》。
sources: []
recalled:
  - 《史记·殷本纪》
  - 《孟子·万章上》
  - 《竹书纪年》（佚文）
