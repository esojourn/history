name: 希波克拉底
aliases: [科斯的希波克拉底]
role: 医生
summary: 科斯岛的医生，后世尊为西方医学之父，名下有《希波克拉底文集》。
body: |-
  爱琴海东南部科斯岛人，出身世代行医、自称是医神阿斯克勒庇俄斯后裔的家族。关于他本人，同时代的记载只有寥寥几处。柏拉图在《普罗泰戈拉篇》里提到“科斯的希波克拉底，阿斯克勒庇俄斯的后人”，说向他交学费就能学成医生；在《斐德罗篇》里又说，他认为不了解整体的本性就不能了解身体。亚里士多德称他为“伟大的希波克拉底”。生卒年是古人推算的约数。公元 2 世纪索拉努斯名下的一篇传记说他周游各地行医，死在色萨利的拉里萨，享年有八十五岁到一百多岁几种说法。

  传记和托名的书信里的许多故事是后人编造的，例如他拒绝波斯王阿尔塔薛西斯的重金聘请，用点火的办法扑灭了雅典的瘟疫；修昔底德详细记述了那场瘟疫，没有提到他。

  归在他名下的《希波克拉底文集》有六十篇左右，用爱奥尼亚方言写成，大多作于公元前 5 世纪后期到前 4 世纪，出自不同的作者，观点也不一致。其中哪些是他本人写的，从古代起就没有定论，现代学者多认为无法确定。文集中，《论圣病》说癫痫并不比别的病更神圣，它有自然的原因，说它神圣的人只是掩饰自己的无知；《流行病》记录了一个个病人逐日的病情，包括许多不治而死的；《预后》教医生根据症状预言病程；《气候水土论》讨论风向、水质、季节对健康的影响。《论人的本性》提出人体内有血液、黏液、黄胆汁、黑胆汁四种体液，平衡则健康，这一篇亚里士多德归于他的女婿波吕玻斯。四体液说经盖伦发挥，支配西方医学直到近代。

  文集里的《誓言》要求医者尽力帮助病人，不加伤害，不泄露在行医中的所见所闻。它的写作年代和出处都不清楚，后世的医生誓词由它演变而来。
sources: []
recalled:
  - 柏拉图《普罗泰戈拉篇》311b—c；《斐德罗篇》270c
  - 亚里士多德《政治学》卷七第 4 章；《动物志》卷三第 3 章
  - 《希波克拉底文集》中《论圣病》《流行病》《誓言》等篇
  - 索拉努斯《希波克拉底传》
