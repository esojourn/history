name: 扩廓帖木儿
aliases: [王保保]
role: 元末将领
summary: 元末将领，汉名王保保，元朝北走后继续与明朝对抗，朱元璋称他为“奇男子”。
body: |-
  扩廓帖木儿本名王保保，生年不详，是元末镇压红巾军的将领察罕帖木儿的外甥和养子，元顺帝赐他蒙古名扩廓帖木儿。至正二十二年（1362 年）察罕帖木儿在山东被降将刺杀，他继统其军，攻下益都，平定山东。

  此后他卷入元朝内部的争斗，与孛罗帖木儿长期交战，又与皇太子、朝中权臣时而联合、时而对立，元朝最后的兵力消耗在这些内战之中。至正二十八年（1368 年）明军北伐，攻下大都，他在山西的太原被徐达击败，退往甘肃。

  元顺帝北走后，扩廓帖木儿辅佐北元继续对抗明朝。洪武五年（1372 年）徐达率明军深入漠北，在岭北被他击败，这是明初对北元作战中的一次重大失利。朱元璋多次招降，他始终不从，据说朱元璋称他为天下奇男子。洪武八年（1375 年）他在漠北去世。
sources: []
