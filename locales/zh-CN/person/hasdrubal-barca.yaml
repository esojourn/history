name: 哈斯德鲁巴·巴卡
aliases: [哈斯德鲁巴, 哈斯朱拔]
role: 迦太基将领
summary: 汉尼拔之弟，镇守西班牙十年，率军翻越阿尔卑斯山增援，在梅陶罗河战死。
body: |-
  迦太基将领，哈米尔卡·巴卡的次子，汉尼拔的弟弟，约生于公元前 245 年。前 218 年汉尼拔出征意大利，留他镇守西班牙。

  罗马派格奈乌斯·西庇阿和普布利乌斯·西庇阿兄弟到西班牙牵制他。前 215 年他奉命率军去意大利增援，在埃布罗河口附近的德尔托萨被西庇阿兄弟击败，未能成行。前 211 年，他与弟弟马戈等人分路行动，买通罗马军中的凯尔特伊比利亚雇佣兵，先后击溃西庇阿兄弟，两人都阵亡。前 210 年普布利乌斯之子、后来的大西庇阿来到西班牙，次年袭取新迦太基。前 208 年两人在拜库拉交战，哈斯德鲁巴失利，但保全了主力，随后取道比利牛斯山西端进入高卢。

  前 207 年春他翻越阿尔卑斯山进入意大利北部，派骑手送信给南方的汉尼拔，信使被罗马人截获。执政官克劳狄乌斯·尼禄留下大部分军队监视汉尼拔，自己带精兵秘密北上，与另一名执政官李维乌斯·萨利那托尔会合。哈斯德鲁巴察觉对面增了兵，连夜撤退，在梅陶罗河边被向导抛弃，天亮后被迫应战。据李维，他见败局已定，策马冲入罗马阵中战死；尼禄赶回南方，把他的头颅扔进了汉尼拔的营地。
sources: []
recalled:
