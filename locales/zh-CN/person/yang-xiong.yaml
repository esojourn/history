name: 扬雄
aliases: [扬子云, 杨雄]
role: 辞赋家、学者
summary: 西汉末年的辞赋家和思想家，早年以大赋知名，后来著《太玄》《法言》《方言》。
body: |-
  据《汉书·扬雄传》，扬雄字子云，蜀郡成都人，家境不富，口吃，不善言谈，喜欢沉思。本传的大部分内容采自他的自述。他年轻时仰慕同乡司马相如的赋，常加以模仿；又读屈原的作品，写了《反离骚》。

  四十多岁时他来到长安，因文章受人推荐，在成帝身边待诏。成帝到甘泉宫祭祀、到河东祭后土、在上林苑狩猎，他先后献上《甘泉赋》《河东赋》《羽猎赋》《长杨赋》，赋中寄托着劝谏的意思。他因此任郎官、给事黄门，此后历成帝、哀帝、平帝三朝没有升迁，与他同任黄门郎的王莽、刘歆后来都位居高官。

  中年以后，他认为赋虽然意在讽谏，读者却只欣赏华丽的文辞，劝而不止，因此不再作赋，并在《法言》中把它比作童子学写的雕虫篆刻，说壮年人不应去做。他模仿《周易》写了《太玄》，模仿《论语》写了《法言》，前者用一套自创的符号推演天地万物的变化，后者用问答的形式评论历代的学说和人物。有人嘲笑他官位低微，他写了《解嘲》作答。他还搜集各地的方言词汇，编成《方言》，是中国最早的方言著作。

  王莽称帝后，他因任职年久升为大夫，在天禄阁校书。刘歆的儿子刘棻曾向他学过古文奇字，后来因伪造符命获罪，牵连到他。使者来捕时，他从阁上跳下，几乎摔死；王莽得知他与案情无关，下令不再追究。本传说他家贫嗜酒，很少有人登门，只有少数人带着酒菜来向他求学。天凤五年（公元 18 年）他去世，终年七十一岁。
sources: []
recalled:
  - 《汉书·扬雄传》
  - 扬雄《法言·吾子》
