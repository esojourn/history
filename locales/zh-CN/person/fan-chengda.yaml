name: 范成大
aliases: [范至能, 石湖居士]
role: 诗人、大臣
summary: 南宋诗人、大臣，出使金朝不辱使命，晚年所作田园诗最为著名。
body: |-
  范成大字至能，号石湖居士，平江吴县（今江苏苏州）人，生于靖康元年（公元 1126 年），绍兴二十四年（1154 年）与杨万里同年考中进士。

  乾道六年（1170 年）他奉宋孝宗之命出使金朝，要求改变宋帝起立接受金国国书的礼节。据《宋史》，他在金廷递交私拟的国书，金人大怒，几乎遭到杀害，他坚持不屈，最终全节而归。往返途中他写了日记《揽辔录》，并作了一组绝句，记述中原遗民的情况和故都的景象。

  此后他在广西、四川等地任帅臣，在成都时陆游是他的幕僚，两人以诗文往来。淳熙五年（1178 年）他任参知政事，两个月后被罢。晚年退居苏州石湖，所作《四时田园杂兴》描写农村四季生活，被认为是古代田园诗的集大成之作。他与杨万里、陆游、尤袤并称“中兴四大诗人”。绍熙四年（1193 年）去世。
sources: []
recalled:
  - 《宋史·范成大传》
  - 《石湖居士诗集》
  - 《揽辔录》
