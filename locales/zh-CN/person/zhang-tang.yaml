name: 张汤
aliases: []
role: 御史大夫
summary: 汉武帝时的廷尉、御史大夫，参与制定律令，主办多起大案，后遭构陷自杀。
body: |-
  据《史记·酷吏列传》，张汤是杜县人，父亲任长安丞。列传记他幼时因家中的肉被老鼠偷走而受父亲责打，便掘开鼠洞捉住老鼠，找到剩肉，像审案一样写下文书、拷问定罪，父亲看了文辞大为吃惊，从此让他学习断狱。他由长安县吏起家，后来与赵禹一同修订律令。

  元光五年（公元前 130 年）他查办陈皇后的巫蛊案，穷究同党，武帝认为他能干。元朔三年（前 126 年）他任廷尉，此后主办淮南王、衡山王等谋反案，牵连甚广。他断案时留意武帝的意向，并请研习《尚书》《春秋》的博士弟子到廷尉府任职，用经义为判决作依据。元狩年间他升任御史大夫，协助推行盐铁官营、改铸钱币和告缗，列传说当时国家大事都由他决断，丞相只是备位。

  他树敌很多。丞相府的朱买臣等三位长史向武帝告发，说他事先把朝廷的决策泄露给商人以分取利益。武帝派人责问，他上书辩白后自杀，时在元鼎二年冬（前 116 年末）。列传说他死后家产不过五百金，都来自俸禄和赏赐；兄弟想厚葬，他的母亲不许，用牛车载着薄棺下葬。武帝得知后，诛杀了三位长史。他的儿子张安世后来在昭帝、宣帝两朝位至大司马。
sources: []
recalled:
  - 《史记·酷吏列传》
  - 《汉书·张汤传》
