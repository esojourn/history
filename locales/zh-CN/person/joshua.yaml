name: 约书亚
aliases:
  - 何西阿
role: 摩西的继任者
summary: 嫩的儿子，摩西的帮手，摩西死后率以色列人过约旦河进迦南。
body: |-
  约书亚是嫩的儿子，属以法莲支派，原名何西阿，摩西给他改名叫约书亚（《民数记》13:8、13:16）。他的生年圣经没有记载。他头一次出现是在利非订：亚玛力人来与以色列人争战，摩西叫他选出人来出战，他杀败了亚玛力人（《出埃及记》17:8–13）。此后他作摩西的帮手，摩西上西奈山时他随同前往（24:13），平日不离开会幕（33:11）。

  在加低斯，约书亚是被派去窥探迦南的十二个探子之一。十个探子说那地的居民强壮，不能上去；只有他和迦勒劝百姓不要背叛耶和华，不要怕那地的居民（《民数记》14:6–9）。因此那一代被数点的人当中，只有他们二人得以进入迦南（14:30）。摩西临终前按神的吩咐按手在他头上，立他接续自己（27:18–23；《申命记》34:9）。

  摩西死后，约书亚率众过约旦河，在吉甲安营，行了割礼，守了逾越节（《约书亚记》第 3—5 章）。他先取耶利哥，再取艾城；与基遍人立约以后，在基遍击败亚摩利五王，经文记他那日祷告，日头在基遍停住（10:12–14）；又在米伦水边击败夏琐王耶宾所联合的北方诸王（第 11 章）。《约书亚记》第 12 章列出他所击败的王共三十一个。随后他在吉甲和示罗为各支派拈阄分地，会幕立在示罗（18:1）；他自己得了以法莲山地的亭拿西拉为业（19:49–50）。

  年老的时候，约书亚召集众支派到示剑，历述神的作为，要百姓选定所要事奉的，并说他和他的家必定事奉耶和华；百姓答应事奉耶和华，他就在示剑与百姓立约（第 24 章）。据《约书亚记》24:29–30，他死时一百一十岁，葬在亭拿西拉他自己的地业里。圣经记了他的岁数，却没有可据以推定他生卒确切年份的数字，分地以后到他去世之间隔了多久也没有说明。
sources: []
recalled:
