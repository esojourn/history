name: 祖冲之
aliases: [祖文远]
role: 数学家、天文学家
summary: 编制《大明历》，推算圆周率在 3.1415926 与 3.1415927 之间。
body: |-
  祖冲之字文远，祖籍范阳遒县，祖上在西晋末年南迁。祖父祖昌在宋朝任大匠卿，家里世代研究历法。他年轻时进入华林学省，专心钻研天文和数学，后来任南徐州从事、娄县令等职，入齐后官至长水校尉。

  宋孝武帝大明六年（公元 462 年），他上呈自己编制的《大明历》。这部历法第一次把岁差引入历法计算，又改用三百九十一年中置一百四十四个闰月的闰周，比旧法更精确。孝武帝的宠臣戴法兴上书反对，认为改动古法是离经叛道，祖冲之写了《驳议》逐条反驳。孝武帝本打算施行，但不久去世，此事搁置。直到梁武帝天监九年（510 年），经他的儿子祖暅再三上书，《大明历》才正式颁行。

  据《隋书·律历志》，他推算出圆周率在 3.1415926 与 3.1415927 之间，又给出两个分数近似值：约率二十二分之七，密率一百一十三分之三百五十五。这样的精度在世界上保持了大约一千年。他的数学著作《缀术》，唐代列入国子监算学的教材，后来失传，具体的推算方法已不可知。

  他还擅长制造机械。据《南齐书》本传，萧道成辅政时，命他修复从后秦缴获的指南车，他改用铜制机件，转动自如；他还造过水碓磨和一种一天能行百余里的“千里船”。他注过《九章算术》，又著有《安边论》，主张开垦荒地、发展农业。齐永元二年（500 年）去世，年七十二。
sources: []
recalled:
  - 《南齐书·祖冲之传》
  - 《宋书·律历志》
