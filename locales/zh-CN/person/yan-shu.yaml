name: 晏殊
aliases: [晏同叔, 晏元献]
role: 北宋宰相、词人
summary: 北宋宰相、词人，自幼以神童著称，提携了范仲淹、欧阳修等人。
body: |-
  晏殊是抚州临川人，生于淳化二年（公元 991 年），自幼以神童闻名。景德二年（1005 年）他十五岁，被推荐到朝廷，与一千多名举子一同应试，神色自若，宋真宗赐他同进士出身。此后他长期在朝中任职，仁宗时历任枢密使，庆历二年（1042 年）起以宰相兼枢密使。

  他喜欢奖掖后进，范仲淹、孔道辅、欧阳修等人都得到过他的提拔，富弼是他的女婿。庆历四年（1044 年）他罢相，此后出知外州，晚年回到京城，至和二年（1055 年）去世，谥“元献”。晏殊是北宋前期重要的词人，词风闲雅含蓄，著有《珠玉词》，《浣溪沙》中“无可奈何花落去，似曾相识燕归来”一联流传很广。他的儿子晏几道也是著名词人，父子并称“二晏”。
sources: []
recalled:
  - 《宋史·晏殊传》
  - 欧阳修《晏公神道碑铭》
  - 《珠玉词》
