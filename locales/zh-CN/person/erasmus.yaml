name: 伊拉斯谟
aliases:
  - 伊拉斯姆
  - 鹿特丹的伊拉斯谟
  - 德西德里乌斯·伊拉斯谟
role: 人文学者
summary: 荷兰人文学者，著《愚人颂》，1516 年刊印希腊文新约，未加入路德的改教。
body: |-
  伊拉斯谟生于荷兰的鹿特丹，生年有 1466、1467、1469 年几种说法。他是一位司铎的私生子，约九岁起在代芬特尔上学，那所学校与共同生活弟兄会关系很深；父母死后，监护人把他送进修道院。1492 年他受立为司铎，不久离开修道院，到巴黎读神学，对那里的经院学风十分厌烦。《历史的轨迹》第二十章说，他是共同生活弟兄派的学生中最出名的一位，与马丁·路德同时代。

  1499 年他第一次到英格兰，结识了科利特和托马斯·莫尔，决心把学问用在圣经和教父的著作上，为此下功夫学希腊文。此后他往来于英格兰、法国、意大利和莱茵河沿岸各城，靠著述和友人资助生活。1503 年的《基督精兵手册》讲平信徒的敬虔在于内心而不在仪式。1509 年他在莫尔家中写成《愚人颂》，借“愚人”之口嘲笑神学家的空谈、修士的无知和教皇的好战。该书说他以广博的学识和尖锐的笔锋讪笑当时修士的无知及教会的弊端。

  1516 年他在巴塞尔刊印了希腊文新约，附上自己重译的拉丁文和注释，这是第一部印行于世的希腊文新约。他在序言里说，愿农夫扶犁时、织工在梭边都能吟诵圣经。路德把新约译成德文，用的就是这个本子的第二版。同时他主持校印耶柔米等教父的全集。

  1517 年以后，他起初为路德说话，认为他指出的弊端是实情，但不赞成决裂，也不愿卷入。1524 年他写《论自由意志》与路德辩论，路德以《论意志的捆绑》作答，两人从此分手。《历史的轨迹》说，他在改教运动中一直没有和路德站在一起，但一般人都认为“是伊拉斯姆下了蛋，马丁路德将它孵出来”。

  1529 年巴塞尔改行新教，他迁到弗赖堡。1535 年他回巴塞尔看着自己的书付印，1536 年 7 月在那里去世。他 1517 年以后的经历与宗教改革相关，留待写到那一部分时再补充。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 伊拉斯谟《愚人颂》《基督精兵手册》《论自由意志》
  - 伊拉斯谟 1516 年希腊文拉丁文对照《新约》及序言
  - 伊拉斯谟《书信集》（艾伦编本）
