name: 洪承畴
aliases: [亨九, 文襄]
role: 明朝蓟辽总督，降清后经略西南
summary: 明朝蓟辽总督，松锦之战被俘降清，后为清朝招抚江南、经略西南。
body: |-
  洪承畴是福建南安人，万历四十四年（1616 年）考中进士。崇祯初年他在陕西任职，镇压农民起义有功，逐渐升任三边总督，多次击败高迎祥、李自成等部。崇祯十二年（1639 年）他被调到辽东任蓟辽总督，抵御清军。

  崇祯十四年（1641 年）他率军救援锦州，在松山被清军击败，退入松山城坚守，次年城破被俘（另见“松锦之战”条）。据说他起初绝食不降，后来投降了清朝，崇祯帝起初以为他已殉国，为他设坛祭奠。洪承畴投降后被编入汉军镶黄旗，受到皇太极的厚待。

  顺治元年（1644 年）他随清军入关，向多尔衮献策，建议严明军纪、安抚百姓。顺治二年（1645 年）他以招抚江南各省总督军务大学士的身份到南京，主持江南的军政，镇压各地的抗清力量。顺治十年（1653 年）起他又经略湖广、广东、广西、云南、贵州五省，坐镇长沙，与南明的李定国、孙可望对峙，顺治十六年（1659 年）清军攻入云南，永历帝逃往缅甸。同年他因眼疾回到北京，后来致仕，康熙四年（1665 年）去世，谥“文襄”。

  洪承畴为清朝统一中国立下了很大的功劳，但他以明朝重臣投降清朝，在明遗民和后世的评价中声名很差。乾隆年间清朝编修《贰臣传》，把他列入其中。
sources: []
recalled:
  - 《清史稿·洪承畴传》
  - 《明史·庄烈帝本纪》
  - 《清史列传·贰臣传》
