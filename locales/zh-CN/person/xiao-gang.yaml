name: 梁简文帝
aliases: [萧纲, 萧世缵, 梁太宗]
role: 皇帝
summary: 梁武帝第三子，宫体诗的倡导者，侯景之乱中被立为傀儡皇帝，后被杀。
body: |-
  萧纲字世缵，梁武帝萧衍的第三子，与昭明太子萧统同母。中大通三年（公元 531 年）萧统去世，他被立为太子。

  他自幼爱好文学，七岁就喜欢作诗。在东宫时，他与徐摛、徐陵、庾肩吾、庾信等文士唱和，多写宫廷生活和女子情态，辞藻艳丽，当时称为“宫体”。他在给儿子的信里说，立身要谨慎持重，写文章却不妨放纵，这句话常被用来说明宫体诗的取向。

  太清三年（549 年）侯景攻陷台城，梁武帝死后，侯景立他为帝，实权全在侯景手中。大宝二年（551 年），侯景把他废黜幽禁，不久派人用装满土的袋子把他压死，年四十九。他被幽禁时在墙壁上写了不少诗文，留下自序说自己“有梁正士兰陵萧世缵”。
sources: []
recalled:
  - 《梁书·简文帝纪》
  - 《南史·梁本纪》
