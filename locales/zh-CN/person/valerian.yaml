name: 瓦勒良
aliases:
  - 瓦勒里安
role: 罗马皇帝
summary: 罗马皇帝，257、258 年两次下令惩办教会领袖，后被波斯王沙普尔一世俘虏。
body: |-
  瓦勒良出身元老家族，生年约在公元 200 年前后，出生地没有记载。公元 253 年他被军队拥立为帝，随即让儿子伽利埃努斯同为皇帝，分管西方，自己去东方对付波斯。

  据优西比乌所引亚历山大主教狄奥尼修的信，他起初对基督徒很宽和。公元 257 年他下令：主教、长老必须向诸神献祭，否则流放；基督徒不准聚会，不准进入墓地。258 年又下第二道诏令，居普良在一封信里转述了它的内容：主教、长老、执事立即处死；信基督的元老和骑士革去身份、没收财产，仍不悔改的处死；贵妇没收财产并流放。迦太基主教居普良、罗马主教西斯笃二世和执事劳伦斯都死在 258 年。《历史的轨迹》第二章只用一句话提到这次逼迫，说它发生在德基乌斯之后的七年喘息过后。

  公元 260 年，他在埃德萨附近与波斯王沙普尔一世交战，被俘。罗马皇帝被外敌生擒，这是头一次。他此后死在波斯，时间和情形都不清楚；拉克坦提乌斯说他被沙普尔当作上马的脚凳，死后被剥皮，这出自一部专讲逼迫者下场的书，未必可靠。他被俘之后，伽利埃努斯下令停止逼迫，归还教会的聚会处所和墓地，教会由此有了约四十年的平静。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
recalled:
  - 居普良《书信》第 80 篇
  - 优西比乌《教会史》卷 7 第 10—13 章
  - 拉克坦提乌斯《论迫害者之死》第 5 章
  - 沙普尔一世的纳克什·鲁斯塔姆铭文
