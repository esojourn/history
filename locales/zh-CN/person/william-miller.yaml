name: "威廉·米勒"
aliases: ["米勒尔"]
role: "浸信会平信徒传道人，复临运动的发起人"
summary: "推算基督将在 1843—1844 年复临，预言落空后，追随者中分出复临安息日会。"
body: |-
  《历史的轨迹》第四十五章说，这时代的福音派都传讲基督复临。米勒是新英格兰的农夫兼浸礼派平信徒传道人，他根据《但以理书》和《启示录》，把基督复临的日子定在 1843 年 3 月 21 日，许多人相信并跟从他。他 1831 年开始传道，起先在附近乡村，后来被请到大城市，最后全国各地都请他去讲，他的著作大为流行。

  书中说，1843 年 3 月 21 日过去了，他解释说基督在这一年中随时会来；1844 年 3 月 21 日又过去了，日期再度修订；1844 年 10 月 24 日也过去了。据一般记载，最后定的日期是 1844 年 10 月 22 日，这个日期是追随者斯诺推算的，米勒本人到最后才接受；预言落空在复临派史上称为“大失望”。书中说，他们 1845 年成立了一个很弱的组织，1846 年基督复临安息日会因守犹太安息日和对《但以理书》第八章的解释问题而分出，早期领袖是怀特夫人。

  据一般记载，米勒 1782 年生于马萨诸塞皮茨菲尔德，在纽约州洛汉普顿长大务农，1812 年战争中当过上尉，早年是自然神论者，1816 年前后归信。他 1849 年在洛汉普顿去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
