name: 阿古利可拉
aliases: [格奈乌斯·尤利乌斯·阿古利可拉, 阿格里科拉]
role: 罗马将领、不列颠总督
summary: 罗马的不列颠总督，把罗马的统治推进到苏格兰，塔西佗的岳父。
body: |-
  阿古利可拉于公元 40 年 6 月 13 日生在高卢南部的尤利乌斯广场镇。他的生平几乎全靠女婿塔西佗为他写的传记。他年轻时在不列颠做军官，正赶上布狄卡起事；后来又到那里指挥第二十军团，接着做阿奎塔尼亚总督，77 年任执政官，同年把女儿嫁给塔西佗。

  此后他做了七年不列颠总督，起讫年份有 77 至 84 年、78 至 85 年两说。他先征服威尔士北部和莫纳岛，然后一年年向北推进，在福斯湾与克莱德湾之间筑起一线堡垒。最后一年，他在格劳皮乌斯山打败卡尔加库斯率领的喀里多尼亚各部，战场的位置今天不能确定；他派出的舰队绕行北端，证实不列颠是一座岛。塔西佗说，他还鼓励不列颠人的首领修神庙、广场，让子弟学拉丁语。

  图密善随后把他召回，此后他没有再担任职务。93 年 8 月 23 日他去世，塔西佗提到有人传说是被毒死的，自己不敢断定。
sources: []
recalled:
  - 塔西佗《阿古利可拉传》
  - 卡西乌斯·狄奥《罗马史》卷 66 第 20 章
