name: 米芾
aliases: [米襄阳, 米南宫, 米颠, 米元章]
role: 北宋书画家
summary: 北宋书画家、鉴藏家，“宋四家”之一，行为癫狂，人称“米颠”。
body: |-
  米芾，祖籍太原，后来迁居襄阳，晚年定居润州，生于皇祐三年（公元 1051 年）。他的母亲曾侍奉宋英宗的高皇后，他因此得以恩荫入仕，长期在地方上做小官。崇宁年间宋徽宗设立书画学，任命他为书画学博士，后来又任礼部员外郎，礼部又称南宫，所以人称“米南宫”。

  他性格狂放，衣着举止常仿效唐人，又有洁癖，据宋人记载，他见到一块奇石，就穿戴整齐向它下拜，称它为“兄”，人们因此称他为“米颠”。他精于鉴赏，收藏了大量古代书画，著有《书史》《画史》《砚史》等，评论直率。他临摹古人法书几可乱真，宋人笔记中有他借来古帖，临摹后把摹本还给主人、自己留下真迹的故事。今天传世的王献之《中秋帖》等作品，有学者认为就是米芾的临本。

  米芾的书法初学唐人，后来专力学习王羲之、王献之，用笔变化多端，自称“刷字”，传世作品有《蜀素帖》《苕溪诗帖》等，与苏轼、黄庭坚、蔡襄并称“宋四家”。他的山水画用横点堆积表现江南烟雨中的山峦，与儿子米友仁的画风合称“米家山水”或“米点山水”，但米芾本人可靠的画迹没有流传下来。大观元年（1107 年）他在淮阳军知军任上去世。
sources: []
recalled:
