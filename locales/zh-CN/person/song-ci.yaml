name: 宋慈
aliases: [宋惠父]
role: 法医学家
summary: 南宋官员，多年主持各地刑狱，著《洗冤集录》，是现存最早的系统的法医学著作。
body: |-
  宋慈字惠父，建宁府建阳（今福建南平建阳区）人，生于淳熙十三年（公元 1186 年）。他年轻时曾向朱熹的弟子吴稚问学，嘉定十年（1217 年）考中进士。此后他在江西、福建等地任官，参与过平定地方动乱。

  嘉熙、淳祐年间，宋慈先后在广东、江西、湖南等地任提点刑狱，负责审理案件、复核死刑。他认为刑狱之事最重要的是查明事实，而查明事实最关键的是检验尸体和伤情，于是总结前人的著作和自己的经验，在淳祐七年（1247 年）写成《洗冤集录》，内容包括验尸的程序、各种死因的鉴别、急救方法等。此书后来成为历代官员检验命案的必备参考，又被译成朝鲜文、日文以及多种西方文字。淳祐九年（1249 年）宋慈在广东经略安抚使任上去世。
sources: []
recalled:
  - 刘克庄《宋经略墓志铭》
  - 《洗冤集录》序
