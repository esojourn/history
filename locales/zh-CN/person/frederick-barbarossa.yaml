name: 腓特烈一世
aliases:
  - 红胡子腓特烈
  - 巴巴罗萨
  - 腓得利巴巴若沙
role: 德意志国王、皇帝
summary: 霍亨斯陶芬王朝的皇帝，与教皇亚历山大三世相争十八年后屈服，死于十字军途中。
body: |-
  腓特烈 1122 年生于士瓦本公爵家，属霍亨斯陶芬家族，母亲出自与之对立的韦尔夫家族。1152 年他被选为德意志国王，1155 年在罗马由教皇哈德良四世加冕为皇帝。“巴巴罗萨”是意大利人给他起的绰号，意为红胡子。《历史的轨迹》第十八章说他是亨利四世的曾孙：他的祖母是亨利四世的女儿。

  他要恢复皇帝在意大利的权力，前后六次南下。1158 年他在龙卡利亚宣布铸币、征税、任命官员等权利属于皇帝，北意大利各城不服，1162 年他攻下米兰，把城拆毁。1159 年教皇选举出现分裂，多数枢机选出亚历山大三世，腓特烈支持少数派选出的人，此后十八年接连扶立三位对立教皇。各城结成伦巴第同盟，站在亚历山大一边。1176 年 5 月腓特烈在莱尼亚诺被同盟的步兵打败。

  1177 年 7 月他到威尼斯与亚历山大三世讲和。《历史的轨迹》记载，他在圣马可教堂前把皇袍铺在地上，跪下亲吻教皇的脚，教皇扶起他，给他平安之吻；教皇上马时他为教皇牵马。该书又说 8 月 7 日两人在阿纳尼相遇，皇帝宣告对立教皇无效，因此是“一次在威尼斯，一次在阿南宜”两度屈服。按其他史料，双方的使者 1176 年 11 月在阿纳尼议定了条款，两人见面讲和是在威尼斯，没有在阿纳尼相会的记载。

  1183 年他与伦巴第各城订立《康斯坦茨和约》，承认它们自治。1187 年耶路撒冷失守，他以近七十岁的年纪领十字军出发，1189 年走陆路经匈牙利、巴尔干进入小亚细亚。1190 年 6 月 10 日他在奇里乞亚的萨列夫河中溺死，大军随即溃散，只有少数人到了阿卡。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十七章“教会发起十字军运动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter19.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十九章“教会权势衰微” https://wellsofgrace.com/books/spiritual/2000years/html/chapter21.html"
