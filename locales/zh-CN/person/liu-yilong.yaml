name: 宋文帝
aliases: [刘义隆, 车儿, 宋太祖]
role: 皇帝
summary: 刘宋第三位皇帝，在位三十年，史称“元嘉之治”，两次北伐失利。
body: |-
  刘义隆是宋武帝刘裕的第三子，晋安帝义熙三年（公元 407 年）生于京口。刘裕在世时，他年少出镇荆州，驻江陵。永初三年（422 年）刘裕去世，长子刘义符即位，即宋少帝。两年后，受遗诏辅政的徐羡之、傅亮、谢晦以少帝失德为由将他废黜并杀害，又杀了次子庐陵王刘义真，于景平二年（424 年）迎立刘义隆。

  他即位后逐步收回权力。元嘉三年（426 年）诛徐羡之、傅亮，又出兵讨平据荆州抗命的谢晦，此后倚重檀道济、王弘、王华等人。他在位三十年，年号元嘉，史称这一时期政局安定，劝课农桑，整顿吏治，又设立儒、玄、史、文四馆，后世称为“元嘉之治”。

  对北魏，他几次出兵，想收复黄河以南之地。元嘉七年（430 年）的北伐先得后失；元嘉二十七年（450 年）再次大举北伐，被魏太武帝反击，魏军一直打到长江北岸的瓜步，江淮之间残破。史家多认为他远在建康遥控前线、事事预先指授，是失败的原因之一。元嘉十三年（436 年），他在病中听信疑忌，杀名将檀道济；后来又与弟弟彭城王刘义康反目，先将其废黜，元嘉二十八年（451 年）赐死。

  元嘉三十年（453 年）二月，太子刘劭因行巫蛊之事败露，担心被废，带兵入宫把他杀死。不久，他的第三子武陵王刘骏起兵讨平刘劭，即位为孝武帝。他死时四十七岁，庙号太祖，谥文帝。
sources: []
recalled:
  - 《宋书·文帝纪》
  - 《资治通鉴》卷一百二十至一百二十七
