name: "罗宾逊"
aliases: ["约翰·罗宾逊", "罗宾孙"]
role: "莱顿分离派教会的牧师"
summary: "斯克鲁比分离派教会的牧师，率会众迁居莱顿，其会友后来乘五月花号往北美。"
body: |-
  罗宾逊约 1576 年生于诺丁汉郡，剑桥出身，原是英国教会的牧师。《历史的轨迹》第三十二章称他学问渊博、和蔼可亲，后来接受分离派原则，约在 1604 年做了斯克鲁比布鲁斯特家中那间分离派教会的牧师（一般记载他加入那里是 1606 年前后）。

  该书说，大逼迫临到，斯克鲁比教会在 1609 年迁到荷兰莱顿，这间莱顿的公理派教会后来在新大陆教会史上扮演了重要角色。据一般记载，他们先在 1608 年到阿姆斯特丹，次年才定居莱顿。他在莱顿牧会十六年，与当地大学的神学家有往来，也参与过亚米纽斯派与反对派的辩论。

  1620 年会众中的一部分乘五月花号前往北美，在普利茅斯建立殖民地，就是第三十一章所说的“天路客”。罗宾逊留在莱顿照顾其余的人，原打算随后前往，1625 年病逝于莱顿，没有去成。第三十二章还说，他教会里的雅各后来回英国，在南华克成立了一间公理派教会，特别浸礼派就从那里分出来。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
recalled:
  - "布拉德福德《普利茅斯开拓史》"
