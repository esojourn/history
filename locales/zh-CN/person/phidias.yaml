name: 菲迪亚斯
aliases: [斐狄亚斯, 菲狄亚斯]
role: 雕塑家
summary: 雅典雕塑家，作帕特农神庙的雅典娜像和奥林匹亚的宙斯像。
body: |-
  雅典人，卡尔米德斯之子。生卒年没有记载，只能从作品的年代推测。他的原作没有一件确定地留存下来，后人靠古代作家的描述、钱币图案和罗马时代缩小的仿制品来了解它们。

  他较早的作品有立在雅典卫城露天的青铜雅典娜像，据保萨尼阿斯，是用马拉松之战的战利品造的，航行到苏尼翁海角的人就能望见枪尖和盔顶。普鲁塔克说，伯里克利重建卫城时，全部工程由菲迪亚斯总管。他亲手做的是帕特农神庙里的雅典娜像：木胎，肌肤部分贴象牙，衣饰用黄金，高约十二米，公元前 438 年落成。据修昔底德记伯里克利的话，像上的黄金重四十塔兰特，可以取下。神庙的山墙、排档间饰和饰带雕刻出自许多工匠之手，他参与到什么程度，没有直接的证据。

  雅典娜像完成后，他被人控告。普鲁塔克说，罪名一是侵吞造像的黄金，因为黄金可以取下称量，没有成立；二是在女神盾牌的战斗场面里刻了自己和伯里克利的像，他因此入狱，死在狱中。但公元前 3 世纪的史家菲洛科罗斯说，他离开雅典去了厄利斯，在那里造了奥林匹亚的宙斯像。20 世纪在奥林匹亚发掘出他的作坊，出土了制作衣褶的陶范、象牙碎料和一只底部刻着“我属于菲迪亚斯”的杯子，年代在前 430 年代以后，可见宙斯像作于雅典娜像之后。

  宙斯像也是黄金象牙像，神坐在宝座上，高约十二三米，古人把它列为世界七大奇观之一。他的结局，除上述两种说法外别无记载。
sources: []
recalled:
  - 普鲁塔克《伯里克利传》第 13、31 章
  - 保萨尼阿斯《希腊志》卷一第 24、28 章；卷五第 10—11、15 章
  - 修昔底德《伯罗奔尼撒战争史》卷二第 13 章
