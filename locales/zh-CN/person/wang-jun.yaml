name: 王濬
aliases: [王士治, 襄阳侯]
role: 抚军大将军
summary: 西晋将领，在益州造船练兵，率水军顺江而下直抵建业，接受孙皓投降。
body: |-
  王濬字士治，弘农湖县人。他早年在征南将军羊祜的幕府中任职，受到羊祜赏识，后来出任巴郡太守，泰始八年（公元 272 年）升为益州刺史。晋武帝密令他修造战船，准备伐吴。据《晋书》本传，他造的大船长宽各一百二十步，可载二千余人，船上建有木城和望楼。造船的木屑顺江漂下，吴国的建平太守吾彦曾以此提醒孙皓，孙皓没有理会。

  他多次上表请求出兵。咸宁五年（279 年）冬，他率水军从成都出发。吴人在长江险要处横拉铁锁，又在水中暗置铁锥。他先放大木筏带走铁锥，再用火炬烧断铁锁，接连攻克西陵、夏口、武昌。太康元年（280 年）三月，他的船队到达建业城下的石头城，吴主孙皓出降。

  按照诏令，他到建业附近应受安东将军王浑节制，而他没有停船就直取建业。王浑因此屡次上表弹劾，他也上书自辩，武帝没有追究。他受封襄阳县侯，后来升任抚军大将军。太康六年去世，时年八十。
sources: []
recalled:
  - 《晋书·王濬传》
  - 《资治通鉴》卷八十、八十一
