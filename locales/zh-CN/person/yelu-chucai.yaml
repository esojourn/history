name: 耶律楚材
aliases: [耶律晋卿, 湛然居士, 吾图撒合里]
role: 蒙古帝国中书令
summary: 契丹人，辽东丹王耶律倍的后代，在成吉思汗、窝阔台朝任职，主张以汉法治理汉地。
body: |-
  耶律楚材字晋卿，号湛然居士，是契丹皇族的后代，辽东丹王耶律倍的八世孙，生于明昌元年（公元 1190 年），父亲耶律履是金朝的尚书右丞。他博览群书，通晓天文、历算、医卜，又从禅师学佛，在金朝任左右司员外郎。1215 年蒙古攻下中都，他留在城中。

  1218 年成吉思汗召他到漠北，因他身材高大、须髯很长，称他为“吾图撒合里”（意为长髯人）。次年他随成吉思汗西征，以占卜、天文备咨询，著有《西游录》记述沿途见闻。

  窝阔台即位后，有大臣主张汉人对国家没有用处，不如杀光他们，把土地改成牧场，耶律楚材力加反对，提出在汉地按户征收赋税，每年可得银、绢、粮食若干，窝阔台同意试行，在燕京等地设立十路课税所，次年果然收到赋税，于是任命他为中书令。他主张以儒家的办法治理汉地，1238 年主持考试儒士，让中选者免除奴役；他还劝阻了攻破汴京后的屠城。

  窝阔台晚年任用回回商人奥都剌合蛮包揽汉地赋税，耶律楚材力争无效，逐渐失去信任。窝阔台死后，乃马真皇后称制，他受到排挤，1244 年在和林去世。据说他死后家中只有琴阮和书籍字画。他的诗文收在《湛然居士文集》里。
sources: []
recalled:
  - 《元史·耶律楚材传》
  - 宋子贞《中书令耶律公神道碑》
  - 《湛然居士文集》
