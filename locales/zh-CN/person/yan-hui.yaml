name: 颜回
aliases: [颜渊, 子渊, 复圣]
role: 孔子弟子
summary: 孔子最赏识的弟子，安贫乐道，不迁怒、不贰过，早于孔子去世，后世尊为“复圣”。
body: |-
  颜回字子渊，鲁国人。据《史记·仲尼弟子列传》，他比孔子小三十岁，即约生于公元前 521 年。他的父亲颜路也是孔子的弟子。

  孔子极为称赞颜回的德行。《论语·雍也》记孔子说：“贤哉回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。”又说他“不迁怒，不贰过”。颜回听孔子讲学，从不提出异议，孔子起初以为他愚笨，后来发现他私下能够发挥所学。在孔门四科中，颜回列于“德行”之首。他随孔子周游列国，在匡地被围时一度失散，孔子以为他死了，他说：“子在，回何敢死！”

  颜回早逝，卒年一般认为在公元前 481 年前后，具体说法不一。他去世时孔子悲痛地说：“噫！天丧予！天丧予！”并哭得非常伤心。后世儒家尊颜回为“复圣”，配享孔庙。
sources: []
recalled:
  - 《史记·仲尼弟子列传》
  - 《论语·雍也》
  - 《论语·先进》
