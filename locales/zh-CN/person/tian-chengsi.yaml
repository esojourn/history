name: 田承嗣
aliases: [雁门郡王]
role: 魏博节度使
summary: 安禄山的部将，降唐后任魏博节度使，扩充军队，开河北藩镇割据之先。
body: |-
  田承嗣是平州卢龙人，世代在边军中任职。他是安禄山的部将，安史之乱中常为前锋，后来跟随史朝义。广德元年（公元 763 年）史朝义败亡前夕，他在莫州投降唐朝，被任命为魏博节度使，统领魏、博等州（另见“河朔三镇”条）。

  据《旧唐书》，他到任后清点户口，凡是强壮的男子都编入军队，几年之间有兵十万，又从中挑选勇武的一万人作为亲兵，称为牙兵。赋税不上交朝廷，官吏自行任命。据《资治通鉴》，他还为安禄山、史思明父子修建祠堂，称为“四圣”，后来经朝廷劝说才拆除。大历十年（775 年），他趁邻镇昭义内乱，攻占相、卫等州，朝廷命各镇讨伐，他上表请罪，最后不了了之。大历十四年（779 年）他去世，年七十五，把节度使之位传给侄子田悦，开了河北藩镇自行传袭的先例。
sources: []
recalled:
  - 《旧唐书·田承嗣传》
  - 《新唐书·藩镇魏博传》
  - 《资治通鉴》卷二百二十二至二百二十五
