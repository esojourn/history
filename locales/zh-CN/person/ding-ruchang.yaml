name: 丁汝昌
aliases: [禹廷]
role: 北洋海军提督
summary: 淮军出身的北洋海军提督，甲午战争中率舰队作战，威海卫失陷前服毒自尽。
body: |-
  丁汝昌是安徽庐江人，早年参加过太平军，后来投降清军，加入淮军刘铭传的部队，以骑兵将领的身份参加了镇压捻军的作战。光绪初年他被李鸿章调去负责海军事务，曾到英国接收军舰。光绪十四年（1888 年）北洋海军正式成军，丁汝昌被任命为北洋海军提督（另见“北洋海军成军”条）。他不是海军科班出身，舰队的实际训练多依靠刘步蟾等留学英国的将领和外国顾问。

  光绪二十年（1894 年）中日甲午战争爆发，九月北洋舰队在鸭绿江口大东沟附近的黄海海面与日本联合舰队激战，丁汝昌在旗舰“定远”上指挥，开战不久就被炮火震伤。这次海战北洋舰队损失五艘军舰，此后退守威海卫，奉李鸿章之命“保船制敌”，不再出海作战（另见“甲午战争”条）。

  光绪二十一年（1895 年）初，日军从山东荣成登陆，攻占威海卫南北两岸的炮台，从海陆两面包围了停泊在刘公岛的北洋舰队。丁汝昌拒绝了日本海军司令伊东祐亨的劝降，多次组织突围不成，援军也没有到来。二月，在部分将领和外国顾问主张投降的情况下，丁汝昌服毒自尽，随后北洋舰队向日军投降，北洋海军全军覆没。战后清廷追究责任，他的家产被抄没，直到宣统年间才得到昭雪。
sources: []
recalled:
