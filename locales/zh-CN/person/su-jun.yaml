name: 苏峻
aliases: [苏子高]
role: 历阳内史
summary: 北方南下的流民帅，因平王敦有功而拥兵历阳，被征入朝时起兵攻陷建康，兵败被杀。
body: |-
  苏峻字子高，长广郡掖县人，生年不详。他年轻时是读书人，在郡里做过主簿。永嘉之乱中，他在本县聚集了几千家百姓筑垒自守，成为当地最强的一支武装。后来他担心受青州的曹嶷攻击，率领部下几百家渡海南下，到达广陵，被东晋朝廷任为地方长官。

  太宁二年（公元 324 年）王敦再次起兵，他奉诏带兵入援，击败了王敦的部将，因功升任历阳内史。历阳与建康隔江相对，他手下有精兵万人，又收纳逃亡的人，《晋书》本传说他渐渐轻视朝廷。

  咸和二年（327 年），执政的庾亮下诏召他入朝任大司农，实际是要解除他的兵权。他上表请求改任边远的郡，没有得到允许，于是联合豫州刺史祖约，以讨伐庾亮为名起兵。次年二月他渡江攻入建康，纵兵抢掠，据本传，官员和士女被剥去衣服，百官被驱使服劳役。他控制了年幼的成帝，后来把成帝迁到石头城。陶侃、温峤的联军东下后，双方相持数月。同年九月，他在石头城外酒后带着几名骑兵冲阵，坐骑绊倒，被晋军杀死。余部在第二年初被肃清。
sources: []
recalled:
  - 《晋书·苏峻传》
  - 《资治通鉴》卷九十三、九十四
