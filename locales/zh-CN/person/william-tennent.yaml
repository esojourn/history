name: "威廉·滕能特"
aliases: ["滕能特", "老滕能特"]
role: "长老会牧师，“木屋学院”创办人"
summary: "在宾夕法尼亚家中办“木屋学院”，培养出一批大觉醒中的长老会传道人。"
body: |-
  《历史的轨迹》第四十二章说，滕能特是宾夕法尼亚一间长老会的牧师，有四个儿子：吉尔伯特、小威廉、约翰和查理。他在自家院子的一角盖了一间木屋做学校，所以叫“木屋学院”，在这里教他三个较小的儿子和另外十五个年轻人拉丁文、希腊文、希伯来文、逻辑学和神学，也把传福音的热诚挑旺起来，结果四个儿子都做了长老会牧师。书中说，木屋学院的毕业生与吉尔伯特一同努力，使复兴之火像野火一样在长老会中烧起，从长岛一直烧到弗吉尼亚。

  据一般记载，他 1673 年生于爱尔兰，原是爱尔兰圣公会的牧师，1718 年移居北美后转入长老会，1726 年起在宾夕法尼亚巴克斯县的内沙米尼牧会，木屋学院约在 1727 年开办，到他 1746 年去世为止。大觉醒中长老会分裂为“新派”和“旧派”，木屋学院出身的人多属支持复兴的新派；后来新派人士创办新泽西学院（今普林斯顿大学），常被看作木屋学院精神的延续。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十二章“教会经历大觉醒” https://wellsofgrace.com/books/spiritual/2000years/html/chapter47.html"
