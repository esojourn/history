name: 张仪
aliases: [武信君]
role: 秦国相，纵横家
summary: 秦国相，以连横分化六国，曾以“六百里”之地欺骗楚怀王。
body: |-
  张仪是魏国人，生年不详。据《史记·张仪列传》，他曾与苏秦一同师从鬼谷先生。他在楚国游说时，楚相丢了玉璧，门客怀疑是张仪偷的，把他打了几百下。回家后妻子埋怨他，他问：“视吾舌尚在不？”妻子笑说舌头还在，他说：“足矣。”

  张仪入秦后得到秦惠文王的信任，于公元前 328 年任相。他推行“连横”，即游说各国分别与秦国结交，以拆散东方诸国的合纵。他曾一度离秦到魏国任相，劝魏国事秦，后来又回到秦国。公元前 316 年，秦国就伐韩还是伐蜀展开讨论，张仪主张伐韩、挟持周天子以令天下，司马错主张伐蜀，惠文王采纳了司马错的意见。

  张仪最著名的事是欺楚。当时齐、楚结盟，公元前 313 年，张仪到楚国对楚怀王说，如果楚国与齐国绝交，秦国愿献出商於之地六百里。怀王大喜，与齐绝交，派人去秦国接收土地，张仪却说：“仪与王约六里，不闻六百里。”怀王大怒，发兵攻秦，次年在丹阳、蓝田两次大败，丧失了汉中。

  公元前 311 年秦惠文王死，秦武王即位，武王做太子时就不喜欢张仪，群臣也纷纷进谗。张仪于是离开秦国到魏国任相，一年后即公元前 309 年死于魏国。
sources: []
recalled:
  - 《史记·张仪列传》
  - 《战国策·秦策一》
  - 《战国策·楚策一》
