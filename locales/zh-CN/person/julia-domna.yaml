name: 尤利娅·多姆娜
aliases: [朱莉娅·多姆娜, 尤莉亚·多姆娜]
role: 塞普提米乌斯·塞维鲁之妻、卡拉卡拉之母
summary: 叙利亚埃梅萨祭司之女，塞维鲁的皇后，卡拉卡拉和盖塔的母亲。
body: |-
  尤利娅·多姆娜约在公元 160 年生于叙利亚的埃梅萨，父亲是当地太阳神庙的世袭大祭司。187 年她嫁给当时任高卢总督的塞普提米乌斯·塞维鲁，次年生卡拉卡拉，再次年生盖塔。193 年塞维鲁称帝，她随军各处，得到“军营之母”的称号。

  卡西乌斯·狄奥说，禁卫军长官普劳提亚努斯得势的那些年，她受排挤，转而与哲学家、文人交往。斐洛斯特拉图斯说，他那部《提亚纳的阿波罗尼乌斯传》就是奉她之命写的。208 年她随丈夫和两个儿子去不列颠。211 年塞维鲁死在约克，兄弟二人共同继位，彼此势同水火；这年年底，卡拉卡拉以和解为名约盖塔到母亲房里，让军官把他杀死在她怀中。

  此后卡拉卡拉出征，她留在安条克替他处理文书和请愿。217 年卡拉卡拉遇刺，不久她也在安条克去世；狄奥说她本已患病，又绝食而死。她的姐姐尤利娅·梅萨后来把两个外孙先后扶上皇位。
sources: []
recalled:
  - 卡西乌斯·狄奥《罗马史》卷 75—78
  - 赫罗狄安《马可以后的帝国史》卷 3—4
  - 斐洛斯特拉图斯《提亚纳的阿波罗尼乌斯传》卷 1 第 3 章
