name: 庇西特拉图
aliases: [皮西特拉图]
role: 雅典僭主
summary: 三次夺取雅典政权，自公元前 546 年起统治到去世。
body: |-
  雅典贵族，在对麦加拉的战争中立过战功。梭伦改革以后，雅典的贵族分成“平原”“海岸”几派相争，庇西特拉图另组一派，以山地的贫苦居民为基础。

  据希罗多德，约公元前 561 年，他弄伤自己和骡子，驾车冲进市场，自称遭政敌袭击，公民大会准他配备一队持棍棒的卫士，他便带着这些人占领了卫城。不久他被两派联手赶走。后来他与“海岸派”首领麦加克勒斯结盟，让一个身材高大的女子扮成雅典娜女神，站在车上送他回城；两人失和后他再度流亡。此后十年他在色雷斯一带经营矿山，积聚钱财，招募佣兵，约前 546 年在马拉松登陆，在帕勒涅击败雅典军队，第三次掌权，直到前 527 年去世。

  希罗多德、修昔底德和《雅典政制》都说他的统治温和，没有改动原有的官制和梭伦的法律，只是让自己人担任要职。他向农民放贷，派法官下乡巡回断案，对收成征税，税率修昔底德说是二十分之一，《雅典政制》说是十分之一。他在雅典兴建神庙和水泉，泛雅典娜节和酒神节的规模在这一时期扩大。

  他死后，儿子希庇亚斯继位。前 514 年希庇亚斯的弟弟希帕科斯被哈摩狄奥斯和阿里斯托革顿刺杀，此后统治转为严酷。前 510 年斯巴达王克里昂米尼出兵把希庇亚斯赶出雅典，他后来投奔了波斯。
sources: []
recalled:
  - 希罗多德《历史》卷一第 59—64 章
  - 修昔底德《伯罗奔尼撒战争史》卷六第 54—59 章
  - 《雅典政制》第 13—19 章
