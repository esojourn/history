name: 萧子良
aliases: [竟陵王, 竟陵文宣王]
role: 宗室、文坛领袖
summary: 齐武帝次子，在西邸招集“竟陵八友”等文士，崇信佛教。
body: |-
  萧子良字云英，齐武帝萧赜的次子，封竟陵王，官至司徒。永明五年（公元 487 年），他移居建康鸡笼山的西邸，招集天下文学之士，其中萧衍、沈约、谢朓、王融、萧琛、范云、任昉、陆倕八人最有名，号称“竟陵八友”。他命人抄录五经百家，依照《皇览》的体例编成《四部要略》一千卷。沈约、谢朓、王融等人在这里讲求声律，形成了讲究四声、回避“八病”的“永明体”诗歌。

  他笃信佛教，常在西邸召集名僧讲论佛法，又亲自为僧人设斋、赋食。范缜不信因果报应，与他当面辩论，并写了《神灭论》，他召集僧人反驳，没能使范缜屈服。

  永明十一年（493 年），武帝病危，王融打算拥立萧子良，没有成功，萧鸾拥立皇太孙萧昭业即位，王融被杀。萧子良虽受遗诏辅政，实际已无权力，次年忧惧而死，年三十五。
sources: []
recalled:
  - 《南齐书·竟陵文宣王子良传》
  - 《梁书·武帝纪》
