name: 蔺相如
aliases: []
role: 赵国上卿
summary: 赵国上卿，完璧归赵、渑池之会两次在秦王面前维护赵国尊严，又以国事为重与廉颇和好。
body: |-
  蔺相如是赵国人，生卒年不详，原是宦者令缪贤的门客。据《史记·廉颇蔺相如列传》，赵惠文王得到楚国的和氏璧，秦昭王写信表示愿以十五城交换。赵国怕给了璧得不到城，不给又怕秦国来攻。缪贤推荐蔺相如出使秦国。蔺相如在秦廷上看出秦王无意给城，便以璧上有瑕疵为由取回玉璧，靠着柱子说，大王若要强取，我的头和璧一起撞碎在柱子上；随后暗中派随从把璧送回赵国，自己留下来面对秦王。秦王最后以礼送他回国。这就是“完璧归赵”。

  公元前 279 年，秦王约赵王在渑池相会。宴会上秦王请赵王鼓瑟，命史官记下；蔺相如上前请秦王击缻，秦王不肯，蔺相如说“五步之内，相如请得以颈血溅大王矣”，秦王只得击了一下缻，蔺相如也让赵国史官记下。秦国群臣要赵国献十五城为秦王祝寿，蔺相如回敬要秦国献咸阳为赵王祝寿。直到会盟结束，秦国始终未能占到上风。

  回国后蔺相如被拜为上卿，位在廉颇之上。廉颇不服，蔺相如以国家安危为重处处退让，廉颇终于负荆请罪，二人成为刎颈之交。公元前 260 年赵王要以赵括代替廉颇，蔺相如已病重，仍劝谏说赵括“徒能读其父书传，不知合变也”，赵王不听。此后的事迹史书没有记载。
sources: []
recalled:
  - 《史记·廉颇蔺相如列传》
