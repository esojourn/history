name: 范增
aliases: [亚父, 历阳侯]
role: 谋士
summary: 居鄛人，项梁、项羽的谋士，被项羽尊为“亚父”，后遭离间而去。
body: |-
  范增是居鄛人。据《史记·项羽本纪》，他平素居家，好出奇计，项梁起兵渡江后（公元前 208 年）前去游说，当时“年七十”，生年即据此推算，约在前 277 年。他认为陈胜失败是因为不立楚国之后而自立为王，劝项梁顺从楚人的心愿。项梁于是找到在民间为人牧羊的楚怀王之孙心，立为楚怀王。怀王派兵救赵时，以宋义为上将军、项羽为次将、范增为末将。

  入关以后，范增劝项羽尽快进攻刘邦，说刘邦入关后不取财物、不近妇女，“其志不在小”。鸿门宴上他几次举起所佩玉玦示意项羽动手，项羽没有回应；他又叫项庄入席舞剑，意在刺杀刘邦，也被项伯挡住。刘邦脱身后，范增把张良代献的玉斗摔在地上拔剑击碎，说：“竖子不足与谋。夺项王天下者，必沛公也。”《项羽本纪》说项羽尊称他为“亚父”。

  汉三年（前 204 年）项羽在荥阳围困刘邦，范增主张急攻。刘邦用陈平之计离间，项羽怀疑范增与汉私通，逐渐削夺他的权力。范增大怒，请求告老还乡，还没走到彭城，背上毒疮发作而死，去世的具体地点史书未载。
sources:
  - 《史记·项羽本纪》 https://zh.wikisource.org/wiki/史記/卷007
  - 《史记·陈丞相世家》 https://zh.wikisource.org/wiki/史記/卷056
