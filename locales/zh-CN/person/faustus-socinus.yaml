name: "浮士妥·苏西尼"
aliases: ["福斯托·索齐尼", "苏西尼"]
role: "苏西尼派的奠基人"
summary: "意大利人，承其叔勒略之说否认三位一体与基督神性，在波兰传播，苏西尼主义由此得名。"
body: |-
  浮士妥·苏西尼 1539 年生于意大利锡耶纳的一个法学世家。《历史的轨迹》第三十五章说，苏西尼主义得名于两位意大利人：勒略·苏西尼和他的侄子浮士妥。勒略原学法律，后改修神学，1550 至 1551 年住在维滕贝格，与墨兰顿做了朋友。塞尔维特被烧死后，勒略开始思考三位一体的教义，把与传统不同的看法写下来，却不敢出版，只用一些巧妙的问题暗中引人走向他的看法。

  该书说，浮士妥在巴塞尔研读圣经时，勒略把未付印的手稿寄给他，大大影响了他的思想（勒略 1562 年已去世，手稿是浮士妥在他身后得到的）。1579 年浮士妥前往波兰，在那里出版自己不合传统的三位一体观点，引起很大的争论。

  他 1604 年在克拉科夫附近去世。该书说，他死后一年即 1605 年，在波兰拉库夫出版了《拉库夫问答书》，大部分出自他的手笔，奠定了苏西尼主义的信仰：基督只是一个人，虽然是有史以来最好的人；否认十架代赎；否认人类全然堕落。他的门徒在墓碑上刻着：“大巴比伦倾倒了，路德毁其根，加尔文破其墙，苏西尼坏其基。”他的著作在荷兰、英国、美国影响很大。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十五章“苏西尼主义，神体一位论，现代主义” https://wellsofgrace.com/books/spiritual/2000years/html/chapter39.html"
recalled:
  - "《拉库夫教理问答》（1605 年）"
