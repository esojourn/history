name: 塞特
aliases: []
role: 亚当之子
summary: 亚当和夏娃在亚伯死后所生的儿子，挪亚一系的先祖。
body: |-
  据《创世记》4:25，亚伯被该隐杀死以后，夏娃又生了一个儿子，起名叫塞特，说这是神另给她立的一个儿子，代替亚伯。《创世记》5:3 说，亚当一百三十岁的时候生了一个儿子，形像样式和自己相似，就给他起名叫塞特。

  塞特生了以挪士。经文在这里加了一句：那时候，人才求告耶和华的名（4:26）。据《创世记》5:6–8，塞特一百零五岁生以挪士，此后又活了八百零七年，并且生儿养女，共活了九百一十二岁。

  圣经关于塞特本人的记载仅此数节，没有提到他住在哪里、做过什么事。《创世记》第 5 章从亚当到挪亚的家谱是沿着塞特这一支记下来的，《历代志上》第 1 章开头和《路加福音》第 3 章的家谱（3:38）也都列有他的名字。
sources: []
recalled:
  - 《创世记》4:25–26、5:3–8
  - 《历代志上》第 1 章
  - 《路加福音》3:38
