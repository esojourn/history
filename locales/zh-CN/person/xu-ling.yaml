name: 徐陵
aliases: [徐孝穆]
role: 文学家
summary: 与庾信并称“徐庾”的骈文名家，编《玉台新咏》，陈朝的一代文宗。
body: |-
  徐陵字孝穆，东海郯人。他的父亲徐摛是萧纲的侍读，宫体诗的倡导者之一。徐陵少年时就以文才知名，与庾信一同在萧纲的东宫任职，二人的文风相近，并称“徐庾”，他们的骈体文被称为“徐庾体”。一般认为他在梁时编成《玉台新咏》十卷，收录汉代至梁代以男女之情为主题的诗歌，其中保存了《孔雀东南飞》等名篇；编者和成书时间也有不同看法。

  太清二年（公元 548 年），他奉命出使东魏，恰逢侯景之乱，被扣留在北方七年，屡次写信请求南归都未获准，直到 555 年才随北齐送回的萧渊明回到江南。

  入陈后，他历任尚书左仆射、中书监等要职，陈朝的重要诏令文书多出自他手，被称为一代文宗。至德元年（583 年）去世，年七十七。
sources: []
recalled:
  - 《陈书·徐陵传》
