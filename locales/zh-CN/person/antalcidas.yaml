name: 安塔尔基达斯
aliases: [安塔基达斯]
role: 斯巴达海军统帅、使节
summary: 斯巴达人，与波斯议定公元前 387/386 年的“大王和约”。
body: |-
  斯巴达人，列昂之子，生年不详。科林斯战争中，雅典将军科农借波斯的舰队和金钱重振雅典，斯巴达转而谋求与波斯讲和。公元前 392 年安塔尔基达斯被派到萨迪斯见总督提里巴佐斯，提出把小亚细亚的希腊城邦让给波斯国王，其余各邦一律自治。提里巴佐斯赞成，但国王阿尔塔薛西斯二世当时没有接受，谈判没有结果。

  前 388 年他出任海军统帅，随提里巴佐斯到苏萨觐见国王，这一次得到了支持。回来后他用斯巴达、波斯和叙拉古的船只封锁赫勒斯滂海峡，截断了雅典从黑海运粮的航路。雅典被迫接受条件。前 387 年至前 386 年间，提里巴佐斯在萨迪斯向各邦使节宣读国王的敕令：亚洲的城邦以及克拉佐美奈、塞浦路斯归国王所有，其余希腊城邦不论大小一律自治，只有利姆诺斯、因布罗斯、斯基罗斯三岛仍属雅典；不接受的，国王将与愿意的各方一起向其开战。这就是“大王和约”，也称“安塔尔基达斯和约”。

  据普鲁塔克，前 367 年前后他再度出使波斯，这时斯巴达已在留克特拉战败，国王转而礼遇底比斯使节佩洛皮达斯，他空手而回，受到国人嘲笑，绝食而死。这一结局只见于普鲁塔克。
sources: []
recalled:
  - 色诺芬《希腊史》卷四第 8 章、卷五第 1 章
  - 普鲁塔克《阿尔塔薛西斯传》第 21—22 章
