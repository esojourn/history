name: 郑成功
aliases: [郑森, 国姓爷, 延平郡王]
role: 南明抗清将领，收复台湾者
summary: 受赐国姓，以厦门为基地抗清；1661 年进军台湾，迫使荷兰人投降。
body: |-
  郑成功原名郑森，1624 年生于日本平户，父亲是海商郑芝龙，母亲是日本人田川氏。七岁时他被接回福建，后来在南京国子监读书，师从钱谦益。顺治二年（1645 年）郑芝龙拥立隆武帝，隆武帝很赏识郑森，赐他姓朱，改名成功，所以人称“国姓爷”。

  顺治三年（1646 年）郑芝龙降清，郑成功苦劝不听，他的母亲在清军攻入安平时死去（一说自杀）。郑成功在孔庙焚烧儒服，表示与父亲决裂，在南澳一带招募兵力，起兵抗清。此后他以厦门、金门为根据地，奉南明永历帝为正朔，被封为延平郡王，通过海上贸易筹措军费，部队发展到数万人。顺治十六年（1659 年）他与张煌言率大军沿长江北上，攻克镇江，包围南京，江南震动。但他在南京城下顿兵不进，被清军击败，退回厦门。

  顺治十八年（1661 年）郑成功为了寻找更稳固的根据地，率军从金门出发，经澎湖进入台湾，在鹿耳门登陆，包围了荷兰东印度公司的热兰遮城。经过九个月的围困，荷兰台湾长官揆一于康熙元年（1662 年）初投降，撤出台湾（另见“郑成功收复台湾”条）。郑成功在台湾设承天府和天兴、万年二县，推行屯田。

  同年五月郑成功在台湾病逝，年三十九岁。这一年，他的父亲郑芝龙在北京被处死，永历帝在昆明被吴三桂处死，他的儿子郑经又在厦门与乳母私通生子，这些消息据说使他忧愤交加。郑经继位后，郑氏在台湾又统治了二十多年，直到康熙二十二年（1683 年）郑克塽降清。郑成功在中国大陆、台湾和日本都受到纪念，清朝后来也追谥他为“忠节”。
sources: []
recalled:
  - 杨英《先王实录》
  - 江日昇《台湾外记》
  - 揆一《被忽视的福摩萨》
  - 《清史稿·郑成功传》
