name: 亚伯
aliases: []
role: 亚当的次子
summary: 亚当和夏娃的次子，牧羊为业，被哥哥该隐所杀。
body: |-
  据《创世记》第 4 章，亚伯是亚当和夏娃的第二个儿子，该隐的弟弟。他是牧羊的，该隐是种地的（4:2）。有一日，兄弟二人各自向耶和华献供物：该隐献的是地里的出产，亚伯献的是羊群中头生的和羊的脂油。耶和华看中了亚伯和他的供物，没有看中该隐和他的供物（4:3–5）。经文没有说明其中的缘故；新约《希伯来书》11:4 说，亚伯因着信献祭与神，比该隐所献的更美。

  该隐因此发怒。后来二人在田间，该隐起来打亚伯，把他杀了。耶和华对该隐说，他兄弟的血有声音从地里向神哀告（4:8–10）。亚伯是圣经所记第一个死去的人。他有没有妻子儿女，经文没有提；他死后，夏娃生了塞特，说这是神另立的一个儿子，代替亚伯（4:25）。

  圣经关于亚伯生平的记载仅此一章。新约里，耶稣在《马太福音》23:35 提到义人亚伯的血，把他列在被杀害的义人之首；《希伯来书》12:24 又拿亚伯的血与耶稣所洒的血相比。
sources: []
recalled:
  - 《创世记》第 4 章
  - 《马太福音》23:35
  - 《希伯来书》11:4、12:24
