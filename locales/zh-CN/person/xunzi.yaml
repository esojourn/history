name: 荀子
aliases: [荀况, 荀卿, 孙卿]
role: 思想家，儒家代表人物
summary: 战国末年儒家代表人物，主张性恶、隆礼重法，韩非、李斯是他的学生。
body: |-
  荀子名况，时人尊称为荀卿，汉代因避宣帝刘询的讳又称孙卿，赵国人，生卒年说法不一，一般认为约在公元前 313 年至前 238 年。据《史记·孟子荀卿列传》，他五十岁时才到齐国游学（一说十五岁），当时稷下的老一辈学者都已去世，荀卿“最为老师”，三次担任稷下学宫的祭酒。后来有人在齐王面前说他的坏话，他到了楚国，春申君任他为兰陵令。春申君死后他被罢官，便在兰陵定居，著书终老。他也曾到秦国，见过秦昭王和范雎，又曾在赵孝成王面前议论兵法。

  荀子主张人性本恶，认为人生来就有好利、嫉恶、好声色的欲望，顺着这些欲望发展就会产生争夺和混乱，所以需要“化性起伪”，依靠后天的教化和礼义来改造，“其善者伪也”，这里的“伪”是人为的意思。他重视礼，同时也重视法，主张“隆礼重法”。在天人关系上，他提出“天行有常，不为尧存，不为桀亡”，主张“制天命而用之”。

  《荀子》今存三十二篇，经西汉刘向整理，其中《劝学》篇的“青，取之于蓝，而青于蓝”“锲而不舍，金石可镂”等语流传很广。韩非和李斯都是荀子的学生，二人后来成为法家的代表人物，因此后世有人批评荀子的学说开了法家的先河。荀子在汉代经学的传承中地位重要，但宋代以后，理学家推崇孟子的性善论，荀子的地位相对下降。
sources: []
recalled:
  - 《史记·孟子荀卿列传》
  - 《荀子》
  - 刘向《孙卿书录》
