name: 托勒密五世
aliases: [ 托勒密五世·埃庇法涅斯, 神显者 ]
role: 埃及国王
summary: 五岁即位的托勒密国王，在位时失去南叙利亚；罗塞塔石碑所刻即祭司为他颁布的诏令。
body: |-
  托勒密五世是托勒密四世与阿尔西诺伊三世的独子，生于公元前 210 年。前 204 年父母相继死去，他五岁即位，由阿加托克利斯等人摄政。前 203 年阿加托克利斯在亚历山大的暴动中被杀，此后摄政者数度更换。

  安条克三世与马其顿的腓力五世趁机瓜分托勒密王朝的海外领地。第五次叙利亚战争中，埃及军队在帕尼翁战败（约前 200 年，一说前 198 年），南叙利亚和巴勒斯坦从此归塞琉古王国。前 196 年他在孟菲斯加冕，各地祭司集会颁布诏令，罗塞塔石碑就是这份诏令的一件刻本。议和后，他在前 194/前 193 年娶安条克三世之女克娄巴特拉一世。

  上埃及的叛乱自他父亲晚年开始，到前 186 年才平定，三角洲的叛乱次年平息。前 180 年他突然去世，不满三十岁；古代史家说他是被廷臣毒死的。长子托勒密六世继位。
sources:
  - 罗塞塔石碑铭文（孟菲斯诏令，前 196 年） https://www.britishmuseum.org/collection/object/Y_EA24
  - 英文维基百科“Ptolemy V Epiphanes”条 https://en.wikipedia.org/wiki/Ptolemy_V_Epiphanes
recalled:
  - 波利比乌斯《历史》第 15 卷第 25—33 章，第 16 卷第 18—19、39 章，第 18 卷第 55 章，第 22 卷第 17 章
  - 李维《罗马史》第 35 卷第 13 章（与克娄巴特拉成婚）
