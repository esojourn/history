name: 袁绍
aliases: [袁本初]
role: 大将军、冀州牧
summary: 汉末河北的割据者，出身“四世三公”之家，据有四州，官渡之战败于曹操。
body: |-
  据《三国志·魏书·袁绍传》和《后汉书·袁绍传》，袁绍字本初，汝南汝阳人，生年不详。从高祖袁安起，袁家四代有五人位至三公，门生故吏遍天下。袁绍年轻时在雒阳交结名士，灵帝末年任中军校尉、司隶校尉。

  中平六年（公元 189 年）灵帝死后，他劝大将军何进诛除宦官，并建议召外地将领带兵入京以胁迫太后。何进被宦官杀死后，袁绍等率兵入宫，把宦官全部杀死，两部史书都说死者有二千多人。董卓入京后要废少帝，袁绍与他争执不下，出奔冀州。次年关东州郡起兵讨董卓，推袁绍为盟主，但各路军队互相观望，不久解散。

  初平二年（191 年），袁绍逼迫冀州牧韩馥让出冀州，以邺为根据地。此后他与北方的公孙瓒连年交战，建安四年（199 年）攻破易京，公孙瓒自焚而死。至此袁绍据有冀、青、幽、并四州，是当时最强的势力。献帝东归时，谋士沮授曾劝他把皇帝迎到邺城，他没有采纳。

  建安五年（200 年），袁绍率大军南下，与曹操在官渡相持数月。十月曹操奇袭乌巢，烧毁袁军粮草，袁军溃散，袁绍只带八百骑渡河北逃。建安七年（202 年）五月他病死。他生前没有确定继承人，幼子袁尚被拥立，长子袁谭不服，兄弟相攻。曹操趁机北进，建安九年攻下邺城，到建安十二年平定河北。
sources: []
recalled:
  - 《三国志·魏书·董二袁刘传》
  - 《后汉书·袁绍刘表列传》
