name: 钱俶
aliases: [钱弘俶, 吴越忠懿王]
role: 吴越国王
summary: 钱镠之孙，吴越最后一位国王，978 年献出所辖十三州归宋，吴越国结束。
body: |-
  钱俶是钱镠的孙子，本名钱弘俶，后来为避宋太祖父亲赵弘殷的名讳去掉“弘”字。后汉天福十二年（公元 947 年）底，吴越的大将胡进思废黜了他的哥哥钱弘倧，拥立他为吴越国王。

  他继续奉行祖父尊奉中原王朝的方针，先后接受后汉、后周和北宋的封号。周世宗征淮南时，他出兵配合；北宋开宝八年（975 年）宋军攻南唐，他又出兵攻取常州，协助宋军围攻金陵。他崇信佛教，在杭州修建了不少寺塔，西湖边的雷峰塔就是他在位时修建的。

  南唐灭亡后，吴越已处在北宋的包围之中。太平兴国三年（978 年），钱俶入朝开封，献出所辖十三州一军归宋，史称“纳土归宋”，吴越国至此结束，两浙免于战火。此后他留居开封，被封为王，端拱元年（988 年）在南阳去世。有宋人记载说他是被毒死的，此说没有确证。
sources: []
recalled:
  - 《宋史·吴越钱氏世家》
  - 《新五代史·吴越世家》
