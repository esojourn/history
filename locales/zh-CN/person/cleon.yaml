name: 克里昂
aliases: [克勒翁]
role: 雅典政治家
summary: 伯里克利死后雅典最有影响的民众领袖，主张强硬作战，死于安菲波利斯。
body: |-
  雅典人，克勒埃涅托斯之子，家里经营制革作坊，是雅典第一个不出自旧贵族门第而成为政治领袖的人。他在伯里克利晚年已是其反对者。关于他的记述主要来自修昔底德和阿里斯托芬，两人都与他有过节，笔下很不客气：修昔底德称他是“公民中最暴烈的一个，当时最得民众信任”；阿里斯托芬在《骑士》里把他写成满口恐吓和奉承的奴隶管家。《雅典政制》说他是第一个在讲坛上大喊大叫、撩起衣服讲话的人。

  公元前 427 年，反叛的米提利尼投降，公民大会依他的提议决定处死全部成年男子，把妇孺卖为奴隶。第二天大会重新讨论，他坚持原议，说帝国就是僭主统治，不能对臣属心软；狄奥多托斯反驳，大会以微弱多数改变了决定，第二艘船赶在行刑前到达。被作为主谋送到雅典的一千多人仍依他的提议处死。

  前 425 年，一支斯巴达部队被困在皮洛斯港外的斯法克特里亚岛上，斯巴达遣使求和，他主张提出对方无法接受的条件，和谈破裂。围困久拖不决，他在公民大会上指责将军们无能，尼西阿斯便提出把指挥权让给他。他骑虎难下，声言二十天内解决，带着轻装兵前去，与在当地指挥的德摩斯梯尼合力攻岛，果然在期限内俘获二百九十二人，其中约一百二十人是斯巴达公民。这一胜利使他声望极高。陪审员的津贴提高到每天三个奥波尔，一般认为出于他的提议。

  前 422 年，他率军去收复色雷斯沿海被伯拉西达夺去的城市，先攻下托罗涅，随后在安菲波利斯城下侦察时遭伯拉西达突然出击，全军溃退，他在逃跑中被杀。伯拉西达也在此战中伤重而死。两个主战的人物同时去世，次年双方订立了和约。
sources: []
