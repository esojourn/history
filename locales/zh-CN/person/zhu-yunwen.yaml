name: 建文帝
aliases: [朱允炆, 明惠帝]
role: 明朝第二代皇帝
summary: 朱元璋的孙子，即位后推行削藩，燕王朱棣起兵“靖难”，南京城破后下落不明。
body: |-
  朱允炆是朱元璋的孙子，父亲是太子朱标，他的哥哥朱雄英早夭。洪武二十五年（1392 年）朱标病死，朱元璋立朱允炆为皇太孙。洪武三十一年（1398 年）朱元璋去世，朱允炆在南京即位，次年改元建文。

  他即位时，朱元璋分封在各地的叔父们多拥有护卫军队，北方的几位藩王还掌握边防兵权。建文帝信用齐泰、黄子澄和方孝孺，着手削藩，一年之内先后废黜周王、齐王、代王、岷王，湘王自焚而死。建文元年（1399 年）七月，实力最强的燕王朱棣以“清君侧”为名在北平起兵，称为“靖难”（另见“靖难之役”条）。建文帝起初派耿炳文、李景隆率大军北伐，屡次失利；双方在河北、山东一带反复争战，朝廷一方始终未能取胜。

  建文四年（1402 年）朱棣绕过山东南下，渡过长江，守卫金川门的谷王朱橞和李景隆开门迎降，南京失守，宫中起火。建文帝的下落从此成为一桩疑案：《明太宗实录》说他自焚而死，民间和后世的野史则流传他从地道出走、削发为僧、流落西南等多种说法，都没有确证。朱棣即位后革除建文年号，把建文四年改称洪武三十五年，直到万历年间才恢复建文年号；南明时追上庙号惠宗，清乾隆时追谥恭闵惠皇帝。建文年间政事宽和，减轻江南的重赋，后世对他多有同情。
sources: []
recalled:
  - 《明史·恭闵帝本纪》
  - 《明太宗实录》
  - 谷应泰《明史纪事本末·建文逊国》
