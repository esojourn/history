name: "托马斯·科克"
aliases: ["科克"]
role: "循道会监督、海外宣教的推动者"
summary: "卫斯理按立的美国循道会监督，1784 年与亚斯理一同组成美国循道会。"
body: |-
  《历史的轨迹》第四十三章说，独立以后，圣公宗、天主教、循道派和改革宗仍在欧洲的控制之下。这时期的循道派仍隶属于英国国教，除了正式按立的人，没有人可以讲道和主持圣礼。卫斯理认为自己以教会长老的身份也有权按立，便在两位牧师协助下按立了科克，使他成为美国循道派教会的监督。1784 年的一次大会上，科克和亚斯理都被选为监督，会中又按立了几个人，并通过统一的信条和礼拜仪式，信条是亚米念派的，主要由卫斯理拟定。

  据一般记载，科克 1747 年生于威尔士布雷肯，牛津毕业，原是英国国教的牧师，因同情循道派被解职，1777 年起成为卫斯理的得力助手。卫斯理给他的头衔是“总监督”，美国循道会后来改称“监督”，卫斯理对此并不赞成。他一生多次横渡大西洋，大力推动西印度群岛和非洲的宣教。1813 年他率领宣教士前往锡兰，次年 5 月在印度洋的船上去世，葬身海中。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十三章“新兴国家的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter48.html"
