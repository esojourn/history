name: 法显
aliases: [释法显]
role: 僧人、旅行家
summary: 东晋僧人，年近六十从长安西行求律，到印度、斯里兰卡，由海路回国，著《佛国记》。
body: |-
  法显俗姓龚，平阳郡人。据《高僧传》，他的三个哥哥都幼年夭折，父亲怕他也养不大，三岁就让他剃度做了沙弥，二十岁受大戒。他的生卒年没有确切记载，《高僧传》说他卒年八十六，《出三藏记集》作八十二，一般据此推定他生于公元 337 年前后，卒于 422 年前后。

  他在长安时，苦于传到汉地的戒律残缺不全。后秦弘始元年（399 年），他与慧景、道整等几位僧人结伴从长安出发，到天竺去寻求戒律，这时他已年近六十。一行人经河西走廊出敦煌，穿过沙漠到鄯善，再经于阗翻越葱岭。他在《佛国记》里写到，沙漠中上无飞鸟，下无走兽，只能以死人的枯骨作为路标。同伴有的中途折回，有的病死，慧景在翻越雪山时冻死。

  他到达北天竺后一路向东南，巡礼了佛陀生平的各处遗迹，在恒河边的巴连弗邑住了三年，学习梵语，抄写《摩诃僧祇律》等律本和经论，又在恒河口的多摩梨帝国住了两年。同行的道整留在了天竺，他独自乘商船到师子国，又住了两年，继续抄求经本。

  回程他搭乘商船，途中遇到风暴，漂到耶婆提，停留数月后换船北上，原定驶向广州，又被风吹离航线，义熙八年（412 年）在青州长广郡的牢山靠岸。从出发到归来前后十四年左右。第二年他到建康，与天竺僧人佛陀跋陀罗合作，译出《摩诃僧祇律》和六卷本《大般泥洹经》等。他把旅途见闻写成《佛国记》，又称《法显传》，记录了当时西域、印度和斯里兰卡的地理、风俗和佛教情况，是现存最早的中国人亲历印度的行记。他晚年到荆州，在江陵的辛寺去世。
sources: []
recalled:
  - 法显《佛国记》
  - 《高僧传·释法显传》
  - 《出三藏记集》卷十五
