name: 亚玛谢
aliases: []
role: 南国犹大王
summary: 约阿施的儿子，大败以东，后向以色列挑战于伯示麦被擒，最终在拉吉遇刺。
body: |-
  犹大王约阿施的儿子，母亲耶何阿丹是耶路撒冷人。据《列王纪下》14:1–4，以色列王约阿施第二年，他登基作犹大王，年二十五岁，在耶路撒冷作王二十九年；经文说他行耶和华看为正的事，只是不如大卫，邱坛还没有废去。国位坚定以后，他杀了杀害他父亲的臣仆，却没有杀他们的儿子，经文说这是照摩西律法“不可因子杀父，也不可因父杀子”（14:5–6）。

  他在盐谷杀了以东人一万，又攻取西拉，改名约帖（14:7）。《历代志下》25:5–16 记得较详：他出兵前用一百他连得银子雇了以色列兵十万，有神人劝阻，他就把这些兵遣回，他们怀怒回去，在路上抢掠犹大的城邑；他打败以东人以后，把以东的神像带回来供奉，有先知责备他，他不听。

  他得胜以后，差人向以色列王约阿施挑战。两军在伯示麦交战，犹大大败，亚玛谢被擒，约阿施拆毁耶路撒冷城墙四百肘，掠去殿中和王宫的财宝（《列王纪下》14:8–14）。约阿施死后，亚玛谢又活了十五年（14:17）。耶路撒冷有人背叛他，他逃到拉吉，被人追到那里杀了，用马把他驮回耶路撒冷，葬在大卫城（14:19–20）。犹大众民立他十六岁的儿子亚撒利雅（即乌西雅）接续作王。
sources: []
recalled:
  - 《列王纪下》14:1–22
  - 《历代志下》第 25 章
