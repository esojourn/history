name: "卡尔施塔特"
aliases: ["安德烈亚斯·博登施泰因", "迦勒斯大"]
role: "维滕贝格大学教授"
summary: "路德在维滕贝格的同事，参加莱比锡辩论，后推行激进改革，与路德决裂。"
body: |-
  卡尔施塔特本名安德烈亚斯·博登施泰因，约 1486 年生于美因河畔的卡尔施塔特，以家乡为名。他在爱尔福特、科隆读书，1505 年到维滕贝格大学，1510 年得神学博士学位，资历比路德深，1512 年路德得博士学位时就是由他主持授予的。起初他是托马斯派，受路德影响去读奥古斯丁，1517 年春先于路德发表了一百五十一条论纲，讲恩典和人的无能。

  《历史的轨迹》第二十二章说，他挺身而出写论文反驳艾克，由此引出 1519 年的莱比锡辩论。会上他先与艾克辩自由意志，靠翻书引证，不如艾克敏捷。

  1521 年路德藏在瓦特堡时，他在维滕贝格带头改革：圣诞节那天不穿祭服、用德语主持圣餐，让信徒自己拿饼和杯；不久他结了婚，又主张撤去教堂里的圣像。城里出现捣毁圣像的骚乱。该书第二十三章说，路德的跟从者在维滕贝格作激进的变革，造成混乱，路德因此回来讲道八天，恢复了秩序，说的就是这件事。

  此后他与路德越走越远，到奥拉明德做乡村牧师，否认基督的身体临在圣餐中。1524 年他被逐出萨克森，路德写《驳天上的先知》批评他。他辗转各地，1530 年到苏黎世，1534 年起在巴塞尔任教授和牧师，1541 年死于鼠疫。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十二章“教会大大骚动” https://wellsofgrace.com/books/spiritual/2000years/html/chapter25.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十三章“德国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter26.html"
