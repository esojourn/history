name: 安条克四世
aliases: [ 安条克四世·埃庇法涅斯, 神显者 ]
role: 塞琉古国王
summary: 塞琉古国王，两度入侵埃及，被罗马逼退；在耶路撒冷禁绝犹太礼俗，激起马加比起义。
body: |-
  安条克四世是安条克三世之子，约生于公元前 215 年。前 188 年阿帕米亚和约之后，他作为人质被送往罗马，后来由侄子德米特里替换，移居雅典。前 175 年兄长塞琉古四世被大臣赫利奥多鲁斯杀害，他在帕加马国王欧迈尼斯二世的帮助下回国夺得王位。他自称“神显者”（埃庇法涅斯）；波利比乌斯说，时人因他举止怪诞，把这个称号戏改为“疯子”（埃庇马涅斯）。

  第六次叙利亚战争中，他于前 169 年和前 168 年两度攻入埃及。第二次进军时，罗马使节波皮利乌斯·莱纳斯在亚历山大城郊的埃琉西斯向他递交元老院要求撤军的决议。据波利比乌斯，他说要同幕僚商议，莱纳斯便用手杖在他脚边画了一个圈，要他答复之后才能出圈；他只得同意撤兵。

  在犹太，他先后改任耶孙、墨涅拉俄斯为大祭司。据《马加比一书》《马加比二书》，他从埃及回师时洗劫耶路撒冷圣殿，前 167 年下令禁止割礼、守安息日等犹太礼俗，在圣殿设异教祭坛，由此激起玛他提亚和犹大·马加比领导的起义。前 165 年他东征，留吕西亚摄政；前 164 年底病死于波斯的塔拜。关于他的死，波利比乌斯与两卷《马加比书》的记述各不相同。
sources:
  - 波利比乌斯《历史》第 26 卷第 1 章，第 29 卷第 27 章，第 31 卷第 9 章 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Polybius/29*.html
  - 英文维基百科“Antiochus IV Epiphanes”条（生卒与在位年月） https://en.wikipedia.org/wiki/Antiochus_IV_Epiphanes
recalled:
  - 《马加比一书》第 1 章、第 3 章第 27—37 节、第 6 章第 1—16 节
  - 《马加比二书》第 4—6 章、第 9 章
  - 阿庇安《叙利亚战争》第 39、45、66 章
