name: 尼希米
aliases: []
role: 犹大省长
summary: 波斯王的酒政，奉准回耶路撒冷任省长，五十二天修完城墙。
body: |-
  哈迦利亚的儿子，在书珊城的宫中作亚达薛西王的酒政（《尼希米记》1:1、1:11）。圣经没有记载他的生卒年和支派。《尼希米记》大部分用第一人称写成。

  亚达薛西第二十年基斯流月，他的兄弟哈拿尼等人从犹大来，说归回的人遭大难、受凌辱，耶路撒冷的城墙拆毁，城门被火焚烧。尼希米听了，禁食祷告多日。到尼散月，他在王面前侍立时面带愁容，王问起缘故，他便求王差他回去修城；王答应了，给他通行的诏书和取用木料的文书，并派军长和马兵护送（第 1—2 章）。按亚达薛西一世计算，这是公元前 445 年。

  他到耶路撒冷三天后，夜间出去察看城墙，然后召集众人动工。第 3 章逐段记下各家各族修造的城门和墙段。和伦人参巴拉、亚扪人多比雅、亚拉伯人基善先是嗤笑，继而图谋攻击；尼希米让修造的人一半作工，一半拿兵器（第 4 章）。对方又几次约他到阿挪平原相见，他都没有去（第 6 章）。城墙在以禄月二十五日修完，共用五十二天（6:15）。

  修城期间，百姓中有人因饥荒和王税典押田地、叫儿女作仆婢，尼希米责备放债取利的贵胄和官长，叫他们归还田产。据 5:14，他从亚达薛西第二十年到第三十二年任犹大省长，共十二年，没有吃省长的俸禄。城墙完工后，以斯拉宣读律法，百姓认罪立约，又拈阄使十分之一的人迁入耶路撒冷居住（第 8—11 章）。

  亚达薛西三十二年他回到王那里，过了些日子又告假回耶路撒冷。这一次他把多比雅的家具从圣殿的屋子里抛出去，恢复利未人应得的份，禁止在安息日作买卖，并责备娶外邦女子的人（第 13 章）。圣经的记载到此为止，没有交代他的卒年。
sources: []
recalled:
  - 《尼希米记》第 1—13 章
