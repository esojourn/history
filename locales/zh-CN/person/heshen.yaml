name: 和珅
aliases: [致斋, 钮祜禄氏]
role: 乾隆后期的军机大臣
summary: 乾隆晚年最宠信的大臣，贪污受贿，乾隆帝死后即被嘉庆帝赐死。
body: |-
  和珅姓钮祜禄氏，满洲正红旗人，出身于普通的武官家庭，早年在咸安宫官学读书，通晓满、汉、蒙古、藏等语言。乾隆三十七年（1772 年）他任三等侍卫，后来在乾隆帝身边当差，因为机敏能干、善于揣摩乾隆帝的心意，升迁极快，乾隆四十一年（1776 年）就进入军机处，此后长期任军机大臣、户部尚书、大学士等职，兼领许多要职。他的儿子丰绅殷德娶了乾隆帝最宠爱的小女儿和孝公主。

  和珅掌权二十多年，在朝中结党营私，收受贿赂，据说地方官员向乾隆帝进贡，要先经过他的手。乾隆后期推行的“议罪银”制度，让犯错的官员交钱赎罪，也被认为助长了贪污之风。乾隆五十八年（1793 年）英国马戛尔尼使团来华，和珅是负责接待的主要大臣之一。

  嘉庆四年（1799 年）正月初三乾隆帝去世，嘉庆帝随即命和珅为乾隆帝守灵，不许他出入，几天后下令逮捕，宣布他二十条大罪。正月十八日嘉庆帝令和珅在狱中自尽，年五十岁。他的家产被查抄，民间流传“和珅跌倒，嘉庆吃饱”的说法（另见“和珅之死”条）。关于抄没财产的数额，流传的数字有八亿两白银等多种，多出于后世的野史和传说，缺乏可靠的档案依据。
sources: []
recalled:
  - 《清史稿·和珅传》
  - 《清仁宗实录》
  - 薛福成《庸庵笔记》
