name: 宇文护
aliases: [宇文萨保]
role: 北周权臣
summary: 宇文泰的侄子，拥立宇文觉建立北周，专权十五年，先后废杀两位皇帝。
body: |-
  宇文护字萨保，宇文泰的哥哥宇文颢之子。他少年时随叔父进入关中，多次参与征战，西魏攻陷江陵时任前锋。恭帝三年（公元 556 年），宇文泰临终把诸子托付给他。次年，他逼西魏恭帝禅位给宇文泰的儿子宇文觉，建立北周，自己掌握大权。

  宇文觉不满他专权，与亲信谋划除掉他，事情泄露，宇文觉被废，随后被杀。他改立宇文泰的长子宇文毓，即周明帝；武成二年（560 年），他又派人毒死明帝，改立宇文邕，即周武帝。此后他继续专权，朝政决于他手。

  他的母亲阎氏一直被扣在北齐。保定四年（564 年），北齐把她送还，以求和好；他得到母亲后，仍然履行与突厥的约定出兵伐齐，周军在洛阳城下大败。

  周武帝表面上对他十分恭敬。天和七年（572 年）三月，他入宫朝见太后，武帝请他为太后读《酒诰》，劝太后戒酒，趁他低头读书时用玉笏从背后击倒他，武帝的弟弟宇文直上前把他杀死，年六十。他的儿子和亲信也一并被诛。
sources: []
recalled:
  - 《周书·晋荡公护传》
  - 《资治通鉴》卷一百六十七至一百七十一
