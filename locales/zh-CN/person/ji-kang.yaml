name: 嵇康
aliases: [嵇叔夜, 嵇中散]
role: 思想家、文学家
summary: 魏末名士，“竹林七贤”的代表人物，不肯与司马氏合作，被司马昭所杀。
body: |-
  据《晋书·嵇康传》和《三国志·魏书·王粲传》所附的记载，嵇康字叔夜，谯国铚县人。他早年丧父，博览群书而尤其喜好老子、庄子。他娶了曹魏宗室的女儿，做过中散大夫，所以后人称他“嵇中散”。

  他长期住在河内山阳，与阮籍、山涛、向秀、刘伶、王戎、阮咸交游。东晋以后的记载说七人常在竹林下聚会饮酒，称为“竹林七贤”。嵇康讲究养生，喜欢打铁，著有《养生论》《声无哀乐论》等文章，主张“越名教而任自然”。

  当时司马氏掌权，标榜礼教。山涛由吏部郎升迁，举荐嵇康接替自己。嵇康写了《与山巨源绝交书》加以拒绝，信中列举自己不能做官的种种理由，并说自己“非汤武而薄周孔”。钟会曾去拜访他，嵇康正在打铁，没有理会。本传记钟会离开时，嵇康问他“何所闻而来？何所见而去？”钟会答“闻所闻而来，见所见而去”，由此怀恨。

  后来嵇康的朋友吕安被兄长诬告不孝，嵇康出面为他作证，一并被捕。钟会劝司马昭借机将他除掉。本传记载，行刑前有三千名太学生请求留他做老师，没有获准；嵇康在刑场上索琴弹了一曲《广陵散》，说这支曲子从此失传了。他死时四十岁。被杀的年份史书记载不一，有景元三年（公元 262 年）和景元四年两种说法。
sources: []
recalled:
  - 《晋书·嵇康传》
  - 《三国志·魏书·王卫二刘傅传》及裴松之注
  - 嵇康《与山巨源绝交书》
