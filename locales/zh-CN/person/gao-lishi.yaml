name: 高力士
aliases: [冯元一]
role: 宦官、骠骑大将军
summary: 唐玄宗最信任的宦官，参与诛杀韦后和太平公主，侍奉玄宗数十年。
body: |-
  高力士本名冯元一，潘州人，据记载是岭南豪族冯盎的后代。他幼年因家族获罪被阉割，送入宫中，宦官高延福收他为养子，于是改姓高。他在宫中结交临淄王李隆基，参与了唐隆政变和先天政变，诛杀韦后和太平公主，此后深受玄宗信任。

  玄宗时，四方送上的奏章先经他过目，小事由他自行决定。他官至骠骑大将军，封渤海郡公，是唐朝宦官中品级最高的。据《资治通鉴》，太子称他为二兄，诸王、公主称他为阿翁。他一般被认为较为谨慎，不像后来的宦官那样专横；但宦官势力在玄宗时开始上升，与他有很大关系。

  安史之乱时，他随玄宗逃往成都，后来又随玄宗回到长安。上元元年（公元 760 年），宦官李辅国强迫太上皇玄宗迁居太极宫，随后把他流放到巫州。宝应元年（762 年）他遇赦北归，走到朗州时得知玄宗已经去世，悲痛吐血而死，年七十九。唐代宗追赠他为扬州大都督，让他陪葬在玄宗的泰陵旁。后世流传的他为李白脱靴等故事，出自唐人笔记和小说。
sources: []
recalled:
  - 《旧唐书·宦官传·高力士》
  - 《新唐书·宦者传·高力士》
