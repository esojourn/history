name: 王导
aliases: [王茂弘, 始兴郡公, 王丞相]
role: 丞相
summary: 东晋开国的主要谋划者，历辅元帝、明帝、成帝，以宽和清静的方针稳定江左局面。
body: |-
  王导字茂弘，琅邪临沂人，出身当时最显赫的士族之一。他年轻时就与琅邪王司马睿交好，看到天下将乱，劝司马睿离开洛阳回到封国。司马睿镇守下邳时，他任司马。永嘉元年（公元 307 年），他建议司马睿移镇建邺，并随同渡江。

  司马睿初到江南，本地士族很冷淡。据《晋书》本传，他一面安排司马睿盛陈威仪出行，让江东人看到北方名士都恭敬相从，一面亲自登门延请顾荣、贺循等人出来做官，吴地人心由此归附。中原沦陷以后，南渡的士人常在建康城外的新亭聚会，有人感叹风景依旧而山河已变，众人相对流泪。他正色说，大家应当合力辅佐王室，收复中原，怎么能像囚徒一样相对哭泣。此事见本传和《世说新语·言语》。从北方来的温峤见过他以后，把他比作辅佐齐桓公的管仲。

  大兴元年（318 年）司马睿即帝位，朝会时要他同坐御床，他再三推辞才作罢。他在朝总揽政务，堂兄王敦都督上游军事。后来元帝任用刘隗等人疏远王氏。永昌元年（322 年）王敦起兵，他每天带着宗族子弟二十多人到宫门外待罪。大臣周顗在元帝面前极力为他辩白，却没有让他知道；王敦入京后问他如何处置周顗，他没有作声，周顗于是被杀。事后他从文书里看到周顗救自己的奏章，痛哭说：“吾虽不杀伯仁，伯仁由我而死。”此语见《晋书·周顗传》。

  元帝去世，他受遗诏辅佐明帝。太宁二年（324 年）王敦再次起兵，他站在朝廷一边，任大都督督军讨伐。明帝死后，他与庾亮等人同辅年幼的成帝，苏峻之乱中守护在成帝身边。他为政力求清静宽和，不苛察细事，又设立侨州郡县安置北来的流民。本传记他晚年说过，人家说我糊涂，后人会怀念这种糊涂。咸康五年（339 年）他去世，时年六十四。
sources: []
recalled:
  - 《晋书·王导传》
  - 《晋书·周顗传》
  - 《世说新语》
  - 《资治通鉴》卷八十六至九十六
