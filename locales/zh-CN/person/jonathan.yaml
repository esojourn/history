name: 约拿单
aliases:
  - 约拿单·亚腓斯
role: 起义领袖、大祭司
summary: 玛他提亚幼子，继犹大为领袖，后任大祭司，被特黎丰诱杀。
body: |-
  玛他提亚五子中最小的一个，《马加比一书》2:5 说他“称为亚腓斯”，生年没有记载。约公元前 160 年犹大战死后，余众推他继任首领（9:28–31）。他起初在旷野与巴基德周旋，后来双方议和，他住在密抹治理百姓（9:70–73）。

  此后塞琉古王位之争不断，各方都来拉拢他。据《马加比一书》10:18–21，亚历山大·巴拉斯立他为大祭司，他在塞琉古纪元 160 年（公元前 152 年）住棚节穿上圣衣。后来将军特黎丰图谋篡位，把他骗进多利买城扣押（12:39–48），不久在巴斯卡玛将他杀害（13:23），时间约在前 143 年冬。其兄西门取回遗骨，葬在莫顶（13:25）。
sources:
  - 《马加比一书》2:5、9:23–73、第 10—12 章、13:12–30
  - 约瑟夫斯《犹太古史》卷 13 第 1—6 章（居密抹见第 1 章第 6 节，遇害见第 6 章第 6 节） https://penelope.uchicago.edu/josephus/ant-13.html
  - Wikipedia, "Jonathan Apphus" https://en.wikipedia.org/wiki/Jonathan_Apphus
