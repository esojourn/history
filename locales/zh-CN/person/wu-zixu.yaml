name: 伍子胥
aliases: [伍员, 申胥]
role: 吴国大夫
summary: 楚人，父兄被楚平王所杀，奔吴助阖闾破郢；屡谏夫差，被赐死。
body: |-
  伍子胥名员，字子胥，楚国人，生年不详。他的父亲伍奢是楚平王太子建的太傅。公元前 522 年，平王听信费无极的谗言，杀了伍奢和伍子胥的哥哥伍尚，伍子胥出逃，先投奔在宋国的太子建，又辗转经过郑国，最后来到吴国。后世流传的“伍子胥过昭关，一夜白头”出自后来的演义，《史记》只说他逃亡途中险些被捉。

  在吴国，伍子胥看出公子光有夺位之心，便向他推荐了勇士专诸。公元前 515 年，专诸刺杀吴王僚，公子光即位，就是阖闾。阖闾任用伍子胥参与国政，又经他推荐任用了孙武。公元前 506 年，吴军与唐、蔡联合伐楚，在柏举大败楚军，五战五胜，攻入郢都。据《史记》，伍子胥掘开楚平王之墓，鞭尸三百；他的老朋友申包胥责备他太过分，他回答：“吾日莫途远，吾故倒行而逆施之。”申包胥到秦国求救，秦出兵救楚，吴军撤回。

  阖闾死后，夫差即位。公元前 494 年吴军在夫椒大败越军，越王勾践求和，伍子胥坚决主张灭越，夫差不听。此后夫差北上与齐国争霸，伍子胥又屡次劝谏，认为越国才是心腹之患。太宰伯嚭从中进谗，说伍子胥心怀怨望，并把儿子托付给齐国的鲍氏。公元前 484 年，夫差赐给他属镂之剑，命他自杀。据《史记》，伍子胥临死前说，要把他的眼睛挖出来挂在吴都东门，看越寇入城灭吴。他死后十一年，吴国被越国所灭。
sources: []
recalled:
