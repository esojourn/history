name: 克洛维
aliases:
  - 克洛维一世
role: 法兰克人的王
summary: 法兰克人的王，统一高卢大部，受洗归信尼西亚派的基督教。
body: |-
  克洛维约在公元 466 年出生，是萨利安法兰克人首领希尔德里克的儿子，481 年前后继位时约十五岁，驻在图尔奈。他的事迹主要见于六世纪末图尔主教格列高利的《法兰克人史》，成书在他死后七八十年。

  公元 486 年，他在苏瓦松打败了罗马将领西阿格里乌斯，占了高卢北部最后一块罗马人管辖的地方。此后他逐一兼并其他法兰克首领。约 493 年，他娶了勃艮第王族的克洛蒂尔德，她信的是尼西亚派的基督教，一再劝他归信。

  据格列高利，他与阿勒曼尼人交战，眼看要败，就向妻子所信的神呼求，许愿若得胜就受洗，结果敌军溃退。此后兰斯主教雷米吉乌在圣诞节为他施洗，同时受洗的有三千多名部下。《历史的轨迹》第七章把这件事定在公元 496 年，并说他在战场上看见十字架显在天空；格列高利的书里没有十字架的异象。受洗的年份有 496、498、508 年等几种说法。

  《历史的轨迹》指出这件事的意义：从前是一个个人归信，从此是国王信了，全族跟着信；别的日耳曼部族信的是亚流派，法兰克人一开始就接受了尼西亚信经，与罗马主教一致，这对后来教会的历史影响很大。高卢原有的罗马居民和主教们因此愿意支持他。

  公元 507 年，他在武耶击败西哥特人，杀了他们的王，把高卢西南部并入版图。他把都城设在巴黎，511 年在奥尔良召集高卢的主教开会，同年 11 月去世，王国由四个儿子分治。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 图尔的格列高利《法兰克人史》卷 2 第 27—43 章
  - 雷米吉乌致克洛维的信
  - 维埃纳主教阿维图斯致克洛维的信
