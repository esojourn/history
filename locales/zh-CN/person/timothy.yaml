name: 提摩太
aliases: []
role: 保罗的同工
summary: 路司得的门徒，自保罗第二次出行起随他布道，后受托照管以弗所的教会。
body: |-
  据《使徒行传》16:1–3，保罗第二次出行来到特庇、路司得，那里有一个门徒名叫提摩太，母亲是信主的犹太妇人，父亲是希腊人，路司得和以哥念的弟兄都称赞他。保罗要带他同去，因那些地方的犹太人都知道他父亲是希腊人，就给他行了割礼。《提摩太后书》记他的外祖母名叫罗以，母亲名叫友尼基（1:5），他从小明白圣经（3:15）。他的生年没有记载。

  此后他随保罗到马其顿，保罗离开庇哩亚时他和西拉留在那里，后来到哥林多与保罗会合（徒 17:14、18:5）。保罗多次打发他到各处教会去：帖撒罗尼迦（《帖撒罗尼迦前书》3:2）、哥林多（《哥林多前书》4:17）、马其顿（徒 19:22）。保罗的几封书信在卷首把他的名字和自己并列。

  《提摩太前书》1:3 记保罗嘱咐他留在以弗所，约束那里的教训；同一封信提到他年轻（4:12）、胃口不清、屡次患病（5:23）。《希伯来书》13:23 提到“兄弟提摩太”已经释放。他的结局新约没有记载。优西比乌《教会史》说他是以弗所的第一任监督；相传他在以弗所殉道。
sources: []
recalled:
  - 《使徒行传》16:1–3，17:14–15，18:5，19:22，20:4
  - 《提摩太前书》1:3，4:12，5:23；《提摩太后书》1:5，3:15
  - 《哥林多前书》4:17；《帖撒罗尼迦前书》3:2
  - 《希伯来书》13:23
  - 优西比乌《教会史》卷 3 第 4 章
