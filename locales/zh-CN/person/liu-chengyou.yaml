name: 刘承祐
aliases: [后汉隐帝]
role: 后汉皇帝
summary: 刘知远之子，十八岁即位，诛杀辅政大臣并屠郭威全家，引发郭威起兵，兵败被杀。
body: |-
  刘承祐是刘知远的儿子。乾祐元年（公元 948 年）刘知远去世，他即位，由杨邠、史弘肇、王章、郭威等大臣辅政。郭威出镇邺都，防御契丹；杨邠主持政务，史弘肇掌管禁军，王章掌管财政。

  刘承祐渐渐长大，不满大臣专权，身边的亲信也不断进言。乾祐三年（950 年）十一月，他命人在宫中杀死杨邠、史弘肇、王章，并灭其家族；又派人去邺都杀郭威，同时把郭威留在开封的家属全部杀害。郭威于是起兵南下，以清除皇帝身边奸臣为名，直逼开封。刘承祐亲自出城迎战，在刘子陂兵败，部众溃散，他在逃跑途中被身边的人杀死（另见“郭威代汉”条）。这时已是公历 951 年初。他死时年仅二十岁左右。
sources: []
recalled:
  - 《旧五代史·汉书·隐帝纪》
  - 《新五代史·汉本纪·隐帝》
