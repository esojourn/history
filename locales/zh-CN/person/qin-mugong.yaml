name: 秦穆公
aliases: [嬴任好, 秦缪公]
role: 秦国国君
summary: 秦国国君，任用百里奚，两助晋公子即位，崤之战后转而称霸西戎。
body: |-
  秦穆公名任好，是秦德公之子，公元前 659 年即位，生年不详。秦国在平王东迁时才被封为诸侯，到穆公时都城在雍（今陕西凤翔）。

  穆公重视人才。据《史记·秦本纪》，晋灭虞国后，虞国大夫百里奚作为陪嫁之臣被送到秦国，途中逃到宛地被楚人捉住，穆公用五张羊皮把他赎回，与他谈论国事，任为大夫，号“五羖大夫”；又经百里奚推荐，迎来蹇叔为上大夫。后来他还用计招来戎人的谋臣由余。

  穆公娶晋献公之女为夫人，秦、晋两国世代联姻，后世称“秦晋之好”。他先后送晋公子夷吾、重耳回国即位，就是晋惠公和晋文公。惠公背约，公元前 645 年两国战于韩原，秦军俘虏了惠公，后来又放他回国。

  晋文公死后，穆公不听蹇叔劝阻，派孟明视等人偷袭郑国，公元前 627 年秦军回师途中在崤山被晋军伏击，全军覆没。穆公身穿素服迎接败将，承认过错，《尚书·秦誓》传统上认为就是他此时的誓辞。此后秦军在前 624 年渡河伐晋，封埋了崤山的秦军尸骨。东进受阻后，穆公用由余之谋向西发展，据《史记》“益国十二，开地千里，遂霸西戎”。

  穆公死于公元前 621 年，据《史记》，从死者一百七十七人，其中有子车氏三兄弟，秦人作《黄鸟》之诗哀悼他们。
sources: []
recalled:
  - 《史记·秦本纪》
  - 《左传》僖公十五年
  - 《左传》僖公三十二年至三十三年
  - 《诗经·秦风·黄鸟》
