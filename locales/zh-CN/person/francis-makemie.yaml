name: "弗朗西斯·马克米"
aliases: ["马克米", "玛克米"]
role: "美洲长老会的奠基人"
summary: "苏格兰裔爱尔兰长老会牧师，1683 年到北美巡回讲道，被称为美洲长老会的奠基人。"
body: |-
  《历史的轨迹》第四十一章说，长老派在美洲真正大发展，是在大批苏格兰裔爱尔兰人移民北美之时，而为美洲长老派奠定基础的是马克米。据一般记载，他 1658 年前后生于爱尔兰多尼戈尔郡的拉梅尔顿，在苏格兰格拉斯哥受教育，被爱尔兰的长老会按立为宣教士。书中说他 1683 年抵达马里兰东部，在苏格兰裔爱尔兰人中设立讲道站，多年往来于马里兰、弗吉尼亚和卡罗来纳之间，在分散各处的人中讲道。

  该书说，靠着马克米和助手的努力，到 1706 年已经成立了数间教会，到 1716 年已有十七位长老派牧师在殖民地工作，同年举行了第一届长老派会议。据一般记载，1706 年马克米在费城召集成立了北美第一个长老区会，自任会长，1716—1717 年才扩成议会；书中把“第一届会议”放在 1716 年，与此不尽相同。1707 年他因在纽约未领执照讲道被总督逮捕，受审后被判无罪，此案常被看作殖民地争取宗教自由的一例。他 1708 年在弗吉尼亚阿科马克去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十一章“教会进入新大陆” https://wellsofgrace.com/books/spiritual/2000years/html/chapter46.html"
