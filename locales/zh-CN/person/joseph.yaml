name: 约瑟
aliases: [撒发那忒巴内亚]
role: 埃及宰相
summary: 雅各之子，被卖到埃及，后来治理埃及，使全家度过饥荒。
body: |-
  雅各的第十一个儿子，拉结所生，生在巴旦亚兰（《创世记》30:22—24、35:24—26）。雅各爱他过于爱众子，给他做了一件彩衣；他把禾捆下拜、日月和十一颗星下拜的两个梦说出来，哥哥们越发恨他。十七岁那年，他奉父命去看望放羊的哥哥们，在多坍被他们剥去彩衣，丢在坑里，后来以二十舍客勒银子卖给过路的商人，带到埃及（第 37 章）。

  在埃及，他被卖给法老的内臣、护卫长波提乏，管理他的家务。波提乏的妻子引诱他不成，反诬告他，他被下在监里（第 39 章）。在监里他为法老的酒政和膳长解梦，后来都应验了（第 40 章）。过了两年，法老梦见七只肥母牛和七只瘦母牛、七个饱满的穗子和七个枯干的穗子，酒政想起他来；他解释说埃及将有七个丰年，随后是七个荒年，并建议在丰年积存粮食。法老派他治理埃及全地，给他起名撒发那忒巴内亚，把安城祭司波提非拉的女儿亚西纳给他为妻；那时他三十岁（41:1—46）。他生了玛拿西和以法莲（41:50—52）。

  饥荒来到，他的哥哥们下埃及籴粮，向他下拜，却没有认出他。他几次试验他们，在犹大为便雅悯求情之后与弟兄们相认，说是神差他先来，为要保全生命（第 42—45 章）。他把父亲和全家接到埃及，安置在歌珊地（第 46—47 章）。

  雅各死后，哥哥们怕他报复，他安慰他们（50:15—21）。据创 50:22—26，约瑟活到一百一十岁，临终叫以色列人起誓，日后离开埃及时把他的骸骨带上去。后来摩西带走了他的骸骨（《出埃及记》13:19），以色列人把它葬在示剑（《约书亚记》24:32）。圣经没有提那位法老的名字，埃及文献里也没有找到可以确认与约瑟对应的人物。
sources: []
recalled:
  - 《创世记》第 30 章、第 37 章、第 39—50 章
  - 《出埃及记》13:19
  - 《约书亚记》24:32
  - 《诗篇》105:17—22
  - 《使徒行传》7:9—16
