name: 李膺
aliases: [李元礼]
role: 司隶校尉
summary: 东汉名士，任司隶校尉时严惩宦官亲党，是党人的领袖，死于第二次党锢。
body: |-
  据《后汉书·党锢列传》，李膺字元礼，颍川襄城人。他历任青州刺史、渔阳太守、度辽将军等职，在边境有威名。桓帝延熹年间任司隶校尉。宦官张让的弟弟张朔在野王县令任上贪残无道，畏罪逃回京师，藏在张让家的夹柱里；李膺带人破柱将他捕获，审讯后处死。本传说此后宦官们休假也不敢出宫。

  当时太学生有三万多人，推崇李膺、陈蕃等人，称“天下模楷李元礼”。士人能被李膺接待，就称为“登龙门”。延熹九年（公元 166 年），有人在宦官指使下上书，告李膺等人结交太学生、共为部党、诽谤朝廷。桓帝下令逮捕“党人”，李膺等二百多人下狱。次年他们被赦免回乡，终身禁锢。

  灵帝即位后，陈蕃、窦武辅政，重新起用李膺；二人被宦官杀害后，他又被免官。建宁二年（169 年）宦官再次大捕党人，有人劝李膺逃走，他不肯，自己到诏狱投案，被拷打致死，本传记其终年六十。
sources: []
recalled:
  - 《后汉书·党锢列传》（李膺）
