name: 弗沙密多罗
aliases:
  - 弗沙密多罗·巽伽
  - 补砂友
role: 巽伽王朝开国君主
summary: 孔雀王朝的将军，杀死末代君主自立，建立巽伽王朝。
body: |-
  孔雀王朝末代君主巨车王的统兵将领，出身和生年不详。《往世书》说他杀死巨车王后在位三十六年；波那《戒日王传》说他是借检阅军队之机下手的。他的在位年代一般推定为约公元前 185—前 149 年，学界说法不一。

  阿逾陀出土的达那提婆铭文称他举行过两次马祭。迦梨陀娑的剧本《摩罗维迦与火友王》说，他的儿子火友王镇守毗底沙，孙子在信度河边击败了一队耶槃那人（希腊人）的骑兵。佛教文献《阿育王传》称他毁坏寺塔、悬赏杀害僧人；这一说法只见于后出的佛教文献，其中的细节有与年代不合之处，许多学者对其可靠性表示怀疑。
sources:
  - 《往世书》所载王统（据英文维基条目转引）
  - 波那《戒日王传》（据英文维基条目转引）
  - 阿逾陀达那提婆铭文（据英文维基条目转引）
  - 迦梨陀娑《摩罗维迦与火友王》（据英文维基条目转引）
  - 《阿育王传》（Ashokavadana，收入《天譬喻经》）（据英文维基条目转引）
  - Wikipedia, "Pushyamitra Shunga" https://en.wikipedia.org/wiki/Pushyamitra_Shunga
  - Wikipedia, "Shunga Empire" https://en.wikipedia.org/wiki/Shunga_Empire
