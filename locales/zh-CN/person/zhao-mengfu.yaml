name: 赵孟頫
aliases: [赵子昂, 松雪道人, 赵文敏]
role: 书画家
summary: 宋太祖后裔，入元后官至翰林学士承旨，书法“赵体”影响深远，绘画开元代新风。
body: |-
  赵孟頫字子昂，号松雪道人，湖州（今浙江湖州）人，生于宝祐二年（公元 1254 年），是宋太祖之子赵德芳的后代。他少年时以父荫补官，南宋灭亡后闲居家中，潜心读书和书画。

  至元二十三年（1286 年）程钜夫奉忽必烈之命到江南访求人才，推荐了赵孟頫等二十多人（据《元史》），次年他到大都，受到忽必烈的召见和礼遇，此后在朝中和地方任官。元仁宗对他尤其赏识，曾把他比作唐代的李白、宋代的苏轼。他官至翰林学士承旨，延祐六年（1319 年）告老还乡，至治二年（1322 年）在湖州去世，谥文敏。他以宋室后裔的身份出仕元朝，在当时和后世都受到一些人的非议，他自己的诗中也流露出愧悔的心情。

  赵孟頫诸体书法都很精通，尤以楷书和行书著称，所创的书风圆润秀媚，世称“赵体”，与欧阳询、颜真卿、柳公权并称“楷书四大家”，元明两代学书的人多受他的影响。在绘画上，他提倡“古意”，反对南宋院体的纤巧，主张以书法的笔法作画，山水、人物、鞍马、竹石都很擅长，代表作有《鹊华秋色图》《秋郊饮马图》等，对“元四家”等后来的文人画影响很大。他的妻子管道升也擅长书画，儿子赵雍、外孙王蒙都是著名画家。
sources: []
recalled:
  - 《元史·赵孟頫传》
  - 杨载《赵公行状》
