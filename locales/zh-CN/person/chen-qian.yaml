name: 陈文帝
aliases: [陈蒨, 陈世祖]
role: 皇帝
summary: 陈霸先的侄子，继位后平定王琳和各地豪强，巩固了陈朝的统治。
body: |-
  陈蒨是陈霸先的哥哥陈道谭的长子，侯景之乱时曾被侯景拘押，后跟随陈霸先作战，镇守吴兴等地。永定三年（公元 559 年）陈霸先病逝，他的儿子陈昌还被扣在长安，章皇后与大臣迎立陈蒨即位。次年北周放陈昌回国，陈昌渡江时落水而死，史书说是陈文帝授意侯安都所为。

  他在位期间，大将侯瑱击败了拥立梁宗室萧庄、割据长江中游的王琳，王琳逃往北齐；又先后平定了东阳留异、晋安陈宝应、临川周迪等地方豪强，陈朝的统治由此稳定。据《陈书》，他出身民间，了解民间疾苦，留心政事，生活节俭。天康元年（566 年）去世，年四十五，太子陈伯宗即位，两年后被叔父陈顼废黜。
sources: []
recalled:
  - 《陈书·世祖纪》
