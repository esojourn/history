name: 克洛伊索斯
aliases: [克罗伊斯]
role: 吕底亚国王
summary: 吕底亚末代国王，以富有闻名，约公元前 546 年被居鲁士所灭。
body: |-
  吕底亚国王阿吕亚泰斯之子，都城在小亚细亚西部的萨迪斯。据希罗多德，他三十五岁即位，在位十四年，约当公元前 560 年至前 546 年。关于他的事迹，几乎全靠希罗多德《历史》第一卷，其中史实与传说混在一起。

  他征服了小亚细亚沿海的希腊城邦，使它们纳贡，这是希腊人第一次受外族统治；同时他又向希腊的神庙大量奉献，在德尔斐献上的金银器物，希罗多德逐一开列，有些在一百多年后还能见到。希罗多德说吕底亚人最早铸造金银钱币，考古发现的吕底亚金币、银币一般认为始于他在位时。他的财富成了希腊人的口头语。希罗多德记他曾问来访的梭伦谁是世上最幸福的人，梭伦答以不到生命终了不能称为幸福；这次会面在年代上难以成立。

  波斯王居鲁士灭米底后，克洛伊索斯准备与他开战，先向德尔斐求问，得到的答复是：如果他出兵，将毁灭一个大帝国。他渡过哈吕斯河东进，在普特里亚与居鲁士交战，不分胜负，退回萨迪斯并遣散了佣兵。居鲁士出其不意地追到城下，围城十四天后攻克。被毁灭的是他自己的帝国。

  他的结局说法不一。希罗多德说居鲁士把他放上柴堆，他三呼梭伦之名，居鲁士心生悔意，天降大雨灭火，此后他成为居鲁士的谋士。诗人巴库利德斯则说他自己登上柴堆，被阿波罗接走。巴比伦的编年史残文可能记有此事，但其中的国名读法有争议，他究竟是死是活无法确定。
sources: []
recalled:
  - 希罗多德《历史》卷一第 6—94 章
  - 巴库利德斯颂歌第 3 首
  - 《那波尼德编年史》第 2 栏
