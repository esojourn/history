name: 克里斯提尼
aliases: [克利斯提尼]
role: 雅典政治家
summary: 公元前 508 年起改组雅典的部落与议事会，奠定民主政制的基础。
body: |-
  出身雅典的阿尔克迈翁家族，父亲是麦加克勒斯，母亲是西库翁僭主克里斯提尼的女儿，他的名字取自外祖父。一块残存的执政官名表显示，他在庇西特拉图之子希庇亚斯统治期间担任过执政官（公元前 525 年至前 524 年）；这个家族后来流亡在外。

  前 510 年希庇亚斯被逐后，克里斯提尼与另一位贵族伊萨哥拉斯争权。伊萨哥拉斯当选前 508 年至前 507 年的执政官。据希罗多德，克里斯提尼在贵族派系的竞争中落了下风，便“把民众拉到自己一边”。伊萨哥拉斯请来斯巴达王克里昂米尼，克里斯提尼出走，七百户雅典人被驱逐。克里昂米尼又想解散议事会，遭到抵制，他和伊萨哥拉斯被民众围困在卫城上，两天后撤出雅典。克里斯提尼被召回。

  他的改革是把全体公民重新编组。原来按血缘划分的四个部落，改为十个按地域划分的部落；阿提卡分成城区、沿海、内陆三类地区，每个部落由三类地区各一部分组成，基层单位是村社，公民从此以所在村社登记身份。每个部落每年出五十人，组成五百人议事会，为公民大会准备议案；军队也按十个部落编制。这样一来，贵族家族凭借本地势力左右政治就困难得多。

  《雅典政制》把陶片放逐法也归于他，不过第一次实际使用是在前 487 年。改革以后他的事迹和去世的年代，史料没有记载。伯里克利的母亲是他的侄女。
sources: []
recalled:
  - 希罗多德《历史》卷五第 66—73 章；卷六第 131 章
  - 《雅典政制》第 20—22 章
