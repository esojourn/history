name: 杜如晦
aliases: [杜克明, 蔡国公]
role: 尚书右仆射
summary: 唐太宗的谋臣和宰相，以善于决断著称，与房玄龄并称“房杜”。
body: |-
  杜如晦字克明，京兆杜陵人。隋朝时他任滏阳县尉，弃官回家。李世民平定长安后，他被引入秦王府任兵曹参军。当时秦王府的不少人才被调往地方，杜如晦也在其中，房玄龄对李世民说，其他人走了不足惜，杜如晦有辅佐帝王的才能，李世民于是把他留下。此后他随李世民征战，参与军中机要。

  玄武门之变前夕，他与房玄龄已被调离秦王府，两人扮成道士潜回，参与谋划。太宗即位后，他历任兵部尚书、吏部尚书，贞观三年（公元 629 年）任尚书右仆射，与房玄龄共同执掌朝政。据《旧唐书》，太宗与房玄龄谋划政事时，总要等杜如晦来才能决定，后世因此有“房谋杜断”之说。

  贞观四年（630 年）他病重去世，年四十六。太宗为他罢朝三日，据《旧唐书》本传，太宗后来吃到新熟的瓜，觉得味美，想起杜如晦，分出一半派人供在他的灵座前。
sources: []
recalled:
  - 《旧唐书·杜如晦传》
  - 《新唐书·杜如晦传》
