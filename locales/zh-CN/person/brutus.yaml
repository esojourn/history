name: 布鲁图
aliases: [马尔库斯·尤尼乌斯·布鲁图, 布鲁图斯, 小布鲁图]
role: 罗马元老、刺杀恺撒者
summary: 罗马元老，小加图的外甥，刺杀恺撒的主谋之一，腓立比兵败自尽。
body: |-
  马尔库斯·尤尼乌斯·布鲁图，约公元前 85 年生。父亲同名，前 77 年参加雷必达的叛乱，投降后被庞培下令处死。母亲塞尔维利娅是小加图的同母异父姐姐，也是恺撒多年的情人。他的家族自称是驱逐国王的卢基乌斯·布鲁图的后代。

  他在舅父小加图身边长大，研习哲学，倾向柏拉图学园派，写过论德性、论义务的著作，都已失传。前 58 年他随加图去塞浦路斯。西塞罗任奇里乞亚总督时发现，他通过代理人以年息四分八厘借钱给塞浦路斯的萨拉米斯城，并用骑兵逼债，而法定上限是一分二厘。

  内战爆发，他不顾杀父之仇投向庞培。法萨卢斯战后恺撒赦免了他，据普鲁塔克，战前就下令不得伤害他。恺撒派他治理山南高卢，前 44 年又让他任首席大法官。前 45 年他改娶加图的女儿波尔基娅。西塞罗把好几部著作题献给他。

  恺撒成为终身独裁官后，有人在他祖先的雕像和他办公的座席上留字，责问他是否还是布鲁图。他的妹夫卡西乌斯劝他参加密谋，约六十人中以他声望最高。他坚持只杀恺撒一人，不动安东尼。前 44 年 3 月 15 日他参与行刺。莎士比亚剧中恺撒那句“还有你吗，布鲁图”不见于古代记载；苏维托尼乌斯只说，有人传恺撒用希腊语说了“还有你，孩子”，而他本人认为恺撒一声未出。

  行刺者没有得到民众拥护，他几个月后离开意大利，在雅典招募青年，接管马其顿行省，随后在小亚细亚与卡西乌斯会合，向各城征敛军费。前 42 年 10 月腓立比第一战，他攻入屋大维的营地，卡西乌斯却败于安东尼并自杀。约三周后的第二战他被安东尼击败，逃到山上伏剑而死。据普鲁塔克，安东尼用自己的紫袍覆盖他的遗体。
sources: []
recalled:
