name: 侯景
aliases: [侯万景, 宇宙大将军]
role: 东魏将领、叛乱者
summary: 东魏大将，降梁后起兵叛乱，攻陷建康，饿死梁武帝，自立为汉帝。
body: |-
  侯景字万景，北魏怀朔镇人，一说是羯人。他骁勇善骑射，六镇之乱后投奔尔朱荣，在击灭葛荣的战事中立功。尔朱氏败亡后，他归附高欢，东魏时拥兵十万，专制黄河以南十四年。据《资治通鉴》，他曾对人说，高王在，我不敢有异心，高王死了，我不能和鲜卑小儿共事，指的是高欢的儿子高澄。

  东魏武定五年（公元 547 年）正月高欢去世，侯景随即叛变，先投西魏，又以河南十三州降梁。梁武帝接纳了他，封他为河南王。东魏派慕容绍宗进攻，侯景大败，只带着八百余人逃到梁朝的寿阳。此后梁与东魏议和，侯景担心被梁朝出卖，太清二年（548 年）八月在寿阳起兵，暗中勾结梁武帝的侄子萧正德，十月从采石渡江，进围建康宫城台城。

  次年三月台城陷落，梁武帝被他控制，不久饿病而死。他立萧纲为帝，自任相国，自称“宇宙大将军、都督六合诸军事”。他的军队在江南烧杀抢掠，三吴一带残破不堪。大宝二年（551 年），他西攻巴陵失利，回到建康后废杀简文帝，立萧栋为帝，不久又废萧栋，自立为帝，国号汉。

  承圣元年（552 年），王僧辩、陈霸先攻克建康，侯景乘船向东逃往海上，被部下羊鹍杀死在胡豆洲附近，尸体被送往建康示众。侯景之乱前后四年，梁朝从此一蹶不振（另见“侯景之乱”条）。
sources: []
recalled:
  - 《梁书·侯景传》
  - 《南史·贼臣传·侯景》
  - 《资治通鉴》卷一百五十九至一百六十四
