name: 马铎尼斯
aliases: [马尔多尼乌斯]
role: 波斯将领
summary: 大流士的女婿，薛西斯退兵后留守希腊，在普拉提亚战死。
body: |-
  波斯贵族戈布里亚斯之子，戈布里亚斯是与大流士一同夺位的六人之一；他又娶了大流士的女儿。公元前 492 年，他受命统率陆海军西进。据希罗多德，他途经爱奥尼亚时废除了各城的僭主，建立民主政体；随后使色雷斯和马其顿重新臣服。但舰队在绕过阿索斯海角时遇上风暴，损失了约三百艘船，陆军又遭色雷斯部落夜袭，他本人负伤，只得撤回。

  希罗多德把他写成鼓动薛西斯远征希腊的主要人物。前 480 年萨拉米斯战败后，他劝薛西斯回国，自己挑选精兵留下，在色萨利过冬。次年他通过马其顿王亚历山大一世向雅典提出优厚的条件，劝其单独讲和，被拒绝后再度占领雅典。希腊联军北上，他退到彼奥提亚的平原，在普拉提亚附近与联军对峙多日。决战中他骑白马率亲兵作战，被一个斯巴达人击杀，波斯军随即溃败。
sources: []
recalled:
  - 希罗多德《历史》卷六第 43—45 章；卷七第 5—10 章；卷八第 100—144 章；卷九第 1—64 章
