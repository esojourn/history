name: 弥迦
aliases:
  - 摩利沙人弥迦
role: 先知
summary: 犹大国的先知，摩利沙人，预言撒玛利亚和耶路撒冷的结局。
body: |-
  《弥迦书》1:1 称他为摩利沙人，在犹大王约坦、亚哈斯、希西家在位的时候得耶和华的默示，论撒玛利亚和耶路撒冷。他与以赛亚同时，起始略晚。他的家世和生卒年圣经没有记载。

  书中预言撒玛利亚要变为田野的乱堆，又责备雅各家的首领为贿赂行审判、祭司为雇价施训诲、先知为银钱行占卜，宣告锡安必被耕种像一块田，耶路撒冷必变为乱堆（1:6、3:9–12）。一百多年后，耶利米因预言圣殿被毁而受审，有几位长老引弥迦在希西家年间说过的这段话为先例，说希西家并没有把他治死，反而敬畏耶和华（《耶利米书》26:17–19）。圣经在《弥迦书》以外提到他的只有这一处。

  书中另有几段常被引用的话：4:1–3 说末后的日子万民要流归耶和华殿的山，把刀打成犁头，这一段与《以赛亚书》2:2–4 几乎相同；5:2 说将来必有一位在以色列中作掌权的出自伯利恒以法他，《马太福音》2:5–6 引用了这句话；6:8 说耶和华向人所要的是行公义、好怜悯、存谦卑的心与神同行。他的结局圣经没有记载。
sources: []
recalled:
  - 《弥迦书》第 1—7 章
  - 《耶利米书》26:17–19
  - 《以赛亚书》2:2–4
  - 《马太福音》2:5–6
