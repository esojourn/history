name: 高仙芝
aliases: []
role: 安西节度使
summary: 高句丽人出身的唐将，远征小勃律，751 年败于怛罗斯，安史之乱中被冤杀。
body: |-
  高仙芝是高句丽人，随父亲高舍鸡入唐，在安西军中长大，以骁勇善骑射著称。天宝六载（公元 747 年），他率一万步骑远征小勃律，翻越葱岭和险峻的坦驹岭，攻破小勃律，俘获国王和吐蕃公主，使西域七十余国归附唐朝，因功升任安西四镇节度使。

  天宝九载（750 年），他以石国无礼为由出兵，先与石国约和，随后发兵袭击，俘获石国国王，掳掠财物，石国王被押到长安处死。石国王子逃到中亚诸国控诉，诸国联络大食准备进攻安西四镇。天宝十载（751 年），高仙芝率军先发制人，深入到怛罗斯城，与大食军相持，因葛逻禄部临阵倒戈，唐军大败（另见“怛罗斯之战”条）。

  天宝十四载（755 年）安禄山起兵，他被任为副元帅，率军驻守陕州。封常清在洛阳一带战败后退到陕州，两人认为陕州无险可守，决定退守潼关，途中被叛军追击，损失很多。监军宦官边令诚曾向他索取财物未果，便向玄宗诬告他们畏敌退兵，克扣军饷。玄宗派边令诚到军中，将他与封常清一同处斩。他临刑前当众申辩，据记载将士齐声为他喊冤。这时是天宝十四载十二月，按公历已是 756 年初。
