name: "布朗"
aliases: ["罗伯特·布朗", "布饶恩"]
role: "英国公理派的先驱"
summary: "1581 年在诺里奇组织独立教会，逃到米德尔堡著书，阐释公理派原则。"
body: |-
  布朗约 1550 年生于拉特兰郡的一个乡绅家庭，在剑桥读书，受过清教徒的影响。《历史的轨迹》第三十二章说他是第一个在英国传播公理派思想的人：1581 年伊丽莎白在位时，他在诺里奇组织了一个公理派教会，因此入狱；获释后他带着大部分会友逃到荷兰的米德尔堡，那里是当时欧洲难民的避风港。

  该书说他在米德尔堡出版了一本阐释公理派原则的书，书名译作“一本教导真基督徒生活言行的书”，其中的教会行政原则至今仍为公理派所用：各教会独立自主，自选牧师、教师、长老和执事；教会之间没有管辖权，却以弟兄之情互助，必要时派代表开会讨论，决议由各教会自行决定是否采纳。他同年还出了一本主张不待官府许可就动手改革教会的小书。

  书中没有说他后来的事。据一般记载，米德尔堡的会众不久分裂，他辗转到苏格兰，后回英国，1586 年前后与英国教会和解，接受了圣职，在北安普敦郡做了四十多年乡村教区牧师。晚年他因殴打官员被关进北安普敦监狱，约 1633 年死在狱中。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十二章“公理派 浸礼派” https://wellsofgrace.com/books/spiritual/2000years/html/chapter36.html"
recalled:
  - "布朗《论不待任何人便进行的改革》（1582 年）"
