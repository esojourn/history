name: 李贽
aliases: [卓吾, 温陵居士]
role: 思想家
summary: 明代思想家，批评假道学，提出“童心说”，晚年下狱自尽。
body: |-
  李贽号卓吾，福建泉州晋江人，祖上有经营海外贸易和信奉伊斯兰教的人。他嘉靖三十一年（1552 年）考中举人，没有再参加会试，此后在河南、南京、北京等地做了二十多年的小官，最后任云南姚安知府。他在南京时接触了王守仁一派的学者，深受泰州学派的影响。

  万历八年（1580 年）李贽辞官，先寄居湖北黄安的耿定理家，后来移居麻城，住在龙湖芝佛院中读书著述，削发而不受戒，许多人慕名来访，其中也有女性向他求学，这在当时引起很大非议。他的主要著作有《焚书》《藏书》《续焚书》等，书名的意思是这些书不合时宜，应当烧掉或藏起来。

  李贽批评当时的道学家言行不一，提出“童心说”，认为“童心者，真心也”，失去童心就失去了真心；他反对以孔子的是非为是非，主张“穿衣吃饭，即是人伦物理”，还在《藏书》中对历史人物作了与传统看法很不相同的评价。他称赞《水浒传》《西厢记》等通俗文学，据说他评点过《水浒传》，现存题为李卓吾评点的版本有些是书商托名的。

  他的思想和行为招致许多人的敌视。万历二十八年（1600 年）麻城的芝佛院被人烧毁，他逃到河南商城，后来被友人马经纶接到北京附近的通州居住。万历三十年（1602 年）礼科给事中张问达上疏弹劾他“敢倡乱道，惑世诬民”，万历帝下令逮捕，焚毁他的著作。李贽在狱中用剃刀自刎，年七十六岁。他的著作虽然被禁，但在明末仍广为流传。
sources: []
recalled:
  - 李贽《焚书》
  - 袁中道《李温陵传》
  - 《明神宗实录》
