name: 托勒密二世
aliases: [ 托勒密二世·费拉德尔福斯, 爱姊者 ]
role: 埃及国王
summary: 托勒密王朝第二位国王，资助亚历山大图书馆与博学园；相传七十士译本始译于其时。
body: |-
  托勒密二世是托勒密一世与贝勒尼基一世之子，约公元前 309 或前 308 年生于科斯岛。前 284 年（一说前 285 年）父亲立他为共治国王，前 282 年（一说前 283 年）托勒密一世去世后独自执政。他先娶色雷斯王利西马科斯之女阿尔西诺伊一世，后将她流放，改娶自己的同胞姐姐阿尔西诺伊二世，两人因此并称“爱姊弟者”（费拉德尔福斯）。

  对外，他与塞琉古王国打了两次叙利亚战争：第一次（约前 274—前 271 年）以恢复原状告终；第二次（约前 260—前 253 年）失去小亚细亚的不少领地，议和后把女儿贝勒尼基嫁给安条克二世。他支持雅典、斯巴达对抗马其顿的克瑞摩尼德斯战争，以雅典投降收场。他还出兵努比亚，疏浚尼罗河通往红海的运河，在红海沿岸设立港口。

  他出资扩充亚历山大图书馆，供养卡利马科斯、忒奥克里托斯等诗人和学者。《阿里斯提亚书信》说希伯来圣经的希腊文译本（七十士译本）是奉他之命翻译的，今人认为此书是托名之作，所述多不可信，他在位时译出的大概只有摩西五经。老普林尼记载他曾派使者狄奥尼修斯前往印度；阿育王的石刻诏令也提到他的名字。前 246 年 1 月他去世，子托勒密三世继位。
sources:
  - 英文维基百科“Ptolemy II Philadelphus”条（生卒、共治与独立执政年份、历次战争） https://en.wikipedia.org/wiki/Ptolemy_II_Philadelphus
  - Livius.org“Ptolemy II Philadelphus”条 https://www.livius.org/articles/person/ptolemy-ii-philadelphus/
recalled:
  - 《阿里斯提亚书信》（七十士译本的传说）
  - 老普林尼《博物志》第 6 卷第 58 节（遣狄奥尼修斯使印度）
  - 阿育王摩崖诏令第十三章（提及托勒密之名）
