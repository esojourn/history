name: 佩尔狄卡斯
aliases: [帕迪卡斯]
role: 马其顿将领、帝国摄政
summary: 亚历山大的近身护卫官，亚历山大死后任帝国摄政，进攻埃及失利，被部下所杀。
body: |-
  马其顿西部奥雷斯提斯地方的贵族，奥龙特斯之子，生年不详。公元前 336 年腓力二世遇刺时，他是追上并杀死凶手的几名侍卫之一。东征中他统领一个步兵方阵团，前 335 年攻底比斯和前 331 年高加米拉之战两次负伤，后来升为七名近身护卫官之一，改领骑兵。前 324 年赫费斯提翁死后，他接管了其骑兵部队，实际上是亚历山大身边地位最高的将领。

  前 323 年亚历山大在巴比伦病危。狄奥多罗斯、库尔提乌斯和尤斯丁都说，亚历山大把印戒交给了佩尔狄卡斯；依据托勒密回忆写成的阿里安的书里没有这件事。亚历山大死后，骑兵将领主张等罗克珊娜的遗腹子出生，步兵则拥立亚历山大的异母兄阿里达乌斯，几乎动武。妥协的结果是阿里达乌斯即位，称腓力三世，罗克珊娜若生男孩则并立为王，佩尔狄卡斯总揽王国事务，各将领分领总督辖区。他随即处死步兵一方的首领墨勒阿革洛斯。

  前 322 年他出兵卡帕多西亚，擒杀当地统治者阿里阿拉特斯，把这片从未征服的地方交给亲信欧迈尼斯。他原已聘娶安提帕特之女尼凯亚，这时太后奥林匹亚斯又提出把亚历山大的妹妹克列奥帕特拉嫁给他。他想兼得两头，引起安提帕特的疑忌；小亚细亚的总督安提柯逃到马其顿告发他有称王之心。安提帕特、克拉特鲁斯、安提柯与埃及的托勒密联合起来。托勒密还在叙利亚截下了运往马其顿的亚历山大灵柩，带回埃及。

  佩尔狄卡斯留欧迈尼斯在小亚细亚抵挡安提帕特，自己带着两位国王进攻埃及，年份有前 321 年和前 320 年两说。他在尼罗河边几次强渡都失败了，最后一次在孟菲斯附近，据狄奥多罗斯有两千多人被水冲走或被鳄鱼吞食。军中怨愤，培松、安提革涅斯、塞琉古等将领进入他的营帐将他杀死。两天后才传来欧迈尼斯在小亚细亚获胜、克拉特鲁斯阵亡的消息。
sources: []
recalled:
  - 狄奥多罗斯《历史丛书》卷十八
  - 阿里安《亚历山大死后之事》残篇
  - 库尔提乌斯《亚历山大史》卷十
  - 普鲁塔克《欧迈尼斯传》
