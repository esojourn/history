name: 永历帝
aliases: [朱由榔, 桂王]
role: 南明最后一位皇帝
summary: 南明最后一位皇帝，辗转西南，逃入缅甸，1662 年被吴三桂处死。
body: |-
  朱由榔是万历帝的孙子，桂王朱常瀛的儿子。顺治二年（1645 年）他的哥哥去世后，他袭封桂王。顺治三年（1646 年）隆武帝在福建被清军俘杀，两广的明朝官员丁魁楚、瞿式耜等人在广东肇庆拥立他为帝，次年改元永历。几乎同时，隆武帝的弟弟朱聿𨮁在广州称帝，年号绍武，两个政权互相攻伐，绍武政权很快被清军消灭。

  永历政权建立后不久，清军就攻入广东，朱由榔辗转逃到广西桂林、全州、南宁等地。顺治五年（1648 年）清朝的江西提督金声桓、广东提督李成栋先后反正，归附永历，永历政权一度控制了西南、华南的大部分地区。但永历朝廷内部党争激烈，将领互不相属，不久又节节败退。顺治九年（1652 年）他接受大西军余部孙可望的迎请，移驻贵州安龙，实际上受孙可望控制。李定国在湖南、广西一度大败清军，后来与孙可望发生内讧，李定国把他迎到昆明。

  顺治十六年（1659 年）清军三路攻入云南，朱由榔逃入缅甸，被缅甸国王安置在阿瓦附近，随从的官员和卫士在“咒水之难”中大多被杀。顺治十八年（1661 年）吴三桂率清军进入缅甸，次年缅甸把朱由榔交给清军。康熙元年（1662 年）四月，吴三桂在昆明篦子坡用弓弦将他和他的儿子绞死。他是南明最后一位皇帝，此后只有台湾的郑氏还奉永历年号。
sources: []
recalled:
  - 《明史·诸王传》
  - 王夫之《永历实录》
  - 钱澄之《所知录》
  - 顾诚《南明史》
