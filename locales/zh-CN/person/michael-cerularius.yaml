name: 米海尔·瑟如拉留
aliases:
  - 色路拉里乌
  - 赛鲁拉留
  - 米海尔一世
role: 君士坦丁堡主教长
summary: 1043—1058 年任君士坦丁堡主教长，1054 年与罗马使团互相革除教籍。
body: |-
  瑟如拉留约在公元 1000 年生于君士坦丁堡的官宦人家。1040 年他卷入反对皇帝的密谋，被流放，在流放中作了修士。1043 年皇帝君士坦丁九世让他当了君士坦丁堡主教长。

  东西两方教会在语言、礼仪和习惯上早有差别，罗马主教要求统管全教会，东方并不承认。《历史的轨迹》第十二章说，两种民族的性情、思想不同，帝国在行政上分成两半以后，两地各方面都越走越远，分裂是可以预料的。到瑟如拉留任内，诺曼人侵入意大利南部，那里原属君士坦丁堡管辖的希腊礼教会被迫改用拉丁礼。约在 1053 年，他支持的一封书信指责拉丁人在圣餐中用无酵饼、在星期六禁食等做法，据拉丁方面说，他还关闭了君士坦丁堡的拉丁礼教堂。

  1054 年教皇利奥九世的使团来到君士坦丁堡，为首的洪贝尔与他互不相让，他拒绝会见。7 月 16 日使团把革除他教籍的文书放在圣索菲亚教堂的祭坛上。几天后他召开会议，咒诅这份文书和写文书的人。《历史的轨迹》第十四章说他“一报还一报，也革除了教皇利奥九世的教籍”；会议的决议针对的是几位使节，利奥九世当时已经去世三个月。双方的处分直到 1965 年才由罗马和君士坦丁堡共同宣布撤销。

  瑟如拉留在政治上很有势力。1057 年他帮助伊萨克一世登上皇位，随后两人失和，相传他说过祭司的职分并不低于皇帝。1058 年他被捕流放，次年 1 月在受审之前去世，去世的地点记载不一。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十四章“教会为自由奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter16.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十二章“教会分裂” https://wellsofgrace.com/books/spiritual/2000years/html/chapter14.html"
recalled:
  - 1054 年洪贝尔的绝罚文书与君士坦丁堡会议的决议
  - 普塞洛斯《编年史》卷 7
  - 斯基利兹《历史概要》
