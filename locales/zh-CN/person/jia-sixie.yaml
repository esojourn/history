name: 贾思勰
aliases: []
role: 农学家
summary: 北魏高阳太守，《齐民要术》的作者，生平事迹几乎不见于史书。
body: |-
  贾思勰是北魏末年的农学家，正史中没有他的传记。关于他，确切知道的只有《齐民要术》书前的署名“后魏高阳太守贾思勰撰”，说明他做过高阳郡的太守。他的生卒年都不清楚，根据书中引用的资料和提到的事情推测，他生活在北魏后期到东魏，书约成于公元 533 年至 544 年之间。他的籍贯一般认为是齐郡益都（今山东寿光一带），但并没有直接的记载。

  从书中的叙述可以看出，他到过今山西、河南、河北、山东等许多地方，向老农请教，并亲自从事过农牧生产。他在书中提到，自己曾经养过两百只羊，因为准备的饲料不够，一年之中饿死了一大半，后来才懂得养羊必须先备足草料。

  《齐民要术》十卷九十二篇，“齐民”指平民百姓，“要术”指谋生的重要方法。书中系统总结了黄河中下游地区的农业生产经验，内容包括土地耕作、选种育种、各种谷物和蔬菜的栽培、果树和林木的种植与嫁接、家畜家禽的饲养和兽医、养鱼，以及酿酒、制醋、作酱、做饭食等农产品加工方法。书中讲到要根据季节和土壤情况安排耕作，提倡轮作和种植绿肥来恢复地力。他还大量引用了前代的农书和其他文献，其中《氾胜之书》《四民月令》等原书已经失传，靠这部书才保存下一部分内容。

  《齐民要术》是中国现存最早、最完整的一部农书，对后来的农学著作影响很大（另见“《齐民要术》成书”条）。
sources: []
recalled:
  - 贾思勰《齐民要术·序》
