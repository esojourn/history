name: 李昪
aliases: [徐知诰, 李彭奴, 南唐烈祖]
role: 南唐皇帝
summary: 徐温的养子，掌握吴国大权后于 937 年受禅称帝，两年后改国号唐，史称南唐。
body: |-
  李昪是徐州人，文德元年（公元 888 年）生，小名彭奴，自幼父母双亡，流落濠州一带。杨行密攻下濠州时见到他，收为养子，但杨家诸子容不下他，杨行密便把他交给部将徐温抚养，改名徐知诰。据史书，他侍奉徐温十分恭谨，深得徐温喜爱。

  天祐十五年（918 年），徐温的长子徐知训被杀，徐知诰入扬州辅政。他待人宽厚，减轻赋税，礼遇士人，很得人心。天成二年（927 年）徐温去世，他掌握了吴国的实权，后来出镇金陵，以儿子留在扬州辅政，仿照徐温当年的做法。

  天福二年（937 年），吴帝杨溥禅位给他，他在金陵称帝，国号齐。天福四年（939 年）他恢复李姓，改名李昪，改国号为唐，史称南唐，自称是唐宪宗的后代，这一说法后人多有怀疑。

  李昪在位期间注重保境安民，不轻易对外用兵。据史书，大臣们劝他乘中原混乱之机北伐，或者攻打吴越、闽国，他都没有答应。他鼓励农桑，减免赋役，兴办学校，招纳中原南下的士人，南唐因此成为十国中经济文化最发达的国家之一。他晚年服食丹药，昇元七年（943 年）去世，长子李璟继位。据马令《南唐书》，他临终嘱咐李璟要与邻国保持和睦，保全社稷。
sources: []
recalled:
