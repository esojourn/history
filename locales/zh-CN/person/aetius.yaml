name: 埃提乌斯
aliases: [弗拉维乌斯·埃提乌斯, 艾提乌斯, 阿埃提乌斯]
role: 西罗马统帅
summary: 西罗马末期的统帅，掌兵二十余年，公元 451 年联合西哥特人击退阿提拉。
body: |-
  埃提乌斯约在公元 391 年生于多瑙河下游的杜罗斯托鲁姆，父亲是罗马的骑兵统帅，母亲出身意大利的富家。他少年时先后被送到阿拉里克的哥特人和匈人那里做人质，在匈人中间住了几年，结下的交情后来一再派上用场。

  423 年霍诺里乌斯死后，拉文纳的文官约翰称帝，派他去匈人那里借兵。他带着大队匈人回来时，约翰已被东部的军队处死三天；他凭手里的兵与摄政的加拉·普拉西提阿讲价，换得高卢的兵权。此后几年他除掉了上司费利克斯。432 年他在里米尼附近败给博尼法斯，逃到匈人那里；博尼法斯伤重而死，次年他借匈人之力复出，从此独掌西部兵权二十年，三次出任执政官。

  他把心力放在高卢。法兰克人、勃艮第人和西哥特人一再向外扩张，他带着匈人雇佣兵逐一压服：436 至 437 年几乎灭掉沃尔姆斯一带的勃艮第王国，这件事后来化入日耳曼人的史诗；西哥特人围攻纳尔博，也被击退。北非在这期间落入汪达尔人之手，他无力顾及。六世纪的吉尔达斯记，不列颠人曾向“三任执政官埃提乌斯”呼救，没有得到回应。

  451 年阿提拉率匈人和附属各族侵入高卢。埃提乌斯说动西哥特王狄奥多里克一世出兵，会同法兰克人、勃艮第人、阿兰人，先解了奥尔良之围，6 月在卡塔隆尼亚平原与匈人会战。狄奥多里克阵亡，阿提拉退回莱茵河以东。约达尼斯说，埃提乌斯有意放走阿提拉，以免西哥特人独大。次年阿提拉转攻意大利，他手里没有足够的兵阻挡。

  他想让儿子娶皇帝的女儿。454 年 9 月 21 日，他进宫奏报财政，瓦伦提尼安三世突然拔剑，与宦官一起把他杀死。事发地点一般说是拉文纳，也有学者认为在罗马。普罗科匹厄斯记，有人对皇帝说：您是用左手砍掉了自己的右手。
sources: []
