name: 陶弘景
aliases: [陶通明, 华阳隐居, 山中宰相, 贞白先生]
role: 道士、医药学家
summary: 隐居茅山的道士，整理上清派经典，著《本草经集注》，人称“山中宰相”。
body: |-
  陶弘景字通明，丹阳秣陵人。据《梁书》本传，他十岁时读葛洪的《神仙传》，便有养生之志。在齐朝，他任诸王侍读、奉朝请等职。永明十年（公元 492 年），他上表辞官，把朝服挂在神武门上，隐居句容的茅山，自号华阳隐居。

  在茅山，他搜集整理东晋杨羲、许谧等人留下的上清派经书手迹，编成《真诰》《登真隐诀》等书，茅山从此成为上清派的中心，后世称这一派为茅山宗。他兼修佛教，据说曾到鄮县阿育王塔前受五大戒。

  萧衍起兵攻入建康时，他援引图谶，说多处显示应当以“梁”为国号，派弟子把这些献给萧衍。梁武帝即位后多次请他出山，他都不肯，但朝廷每有吉凶征讨的大事，武帝常派人去山中向他咨询，书信往来不断，所以时人称他为“山中宰相”。他答武帝问的诗“山中何所有，岭上多白云。只可自怡悦，不堪持寄君”，一直流传。

  他在医药上的成就也很大。他整理《神农本草经》，又补入魏晋以来名医所用的药物，编成《本草经集注》七卷，共收药物七百三十种，首创按玉石、草木、虫兽、果、菜、米食等分类的方法，是唐代官修《新修本草》的基础。他还通晓天文历算、地理和炼丹，造过浑天仪。大同二年（536 年）在茅山去世，年八十一，谥贞白先生。
sources: []
recalled:
  - 《梁书·处士传·陶弘景》
  - 《南史·隐逸传·陶弘景》
