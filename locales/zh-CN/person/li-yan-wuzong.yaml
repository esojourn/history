name: 唐武宗
aliases: [李炎, 李瀍]
role: 皇帝
summary: 唐穆宗之子，任用李德裕，击败回鹘、平定泽潞，并在会昌年间大规模废佛。
body: |-
  李炎原名李瀍，是唐穆宗的第五子，元和九年（公元 814 年）生。开成五年（840 年）正月唐文宗病危，宦官仇士良、鱼弘志等人假传诏书，废掉文宗所立的太子，立他为皇太弟，随即即位，次年改元会昌。

  他即位后召回李德裕任宰相，信任专一，政事多由李德裕决断。当时漠北的回鹘汗国被黠戛斯攻破，部众南下，其中乌介可汗一部进犯河东、振武一带。会昌三年（843 年）唐将刘沔、石雄夜袭回鹘营帐，迎回和亲的太和公主，乌介可汗败走（另见“回鹘汗国瓦解”条）。同年昭义节度使刘从谏死，其侄刘稹自称留后，他采纳李德裕的主张出兵讨伐，次年平定泽潞，这是元和以后朝廷对藩镇少有的胜利。他也逐渐削弱了仇士良的权势，仇士良不久告老而死。

  他崇信道教，在宫中召道士赵归真等人修炼。会昌五年（845 年），他下令大规模废除佛教，拆毁寺院、勒令僧尼还俗，没收寺院田产，佛教各宗都受到沉重打击，史称“会昌灭佛”（另见该条）。当时在唐朝求法的日本僧人圆仁亲历其事，记在《入唐求法巡礼行记》中。

  他服食道士炼的丹药，性情变得急躁，会昌六年（846 年）三月病逝于长安，年三十三。宦官拥立他的叔父李忱，是为唐宣宗。
sources: []
recalled:
