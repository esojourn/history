name: 阿里不哥
aliases: []
role: 蒙古宗王，与忽必烈争夺汗位
summary: 拖雷幼子，蒙哥死后在和林被推为大汗，与忽必烈争位四年，兵败投降。
body: |-
  阿里不哥是拖雷和唆鲁禾帖尼的幼子，蒙哥、忽必烈、旭烈兀的弟弟，生年不详。按照蒙古“幼子守灶”的习俗，他继承了拖雷家族在漠北的营地。1258 年蒙哥亲征南宋时，命他留守都城和林。

  1259 年蒙哥在钓鱼城下去世，阿里不哥在漠北得到许多蒙古宗王和大臣的支持。1260 年忽必烈在开平先行召集大会即大汗位，阿里不哥随即在和林也被推举为大汗，两人各自称汗，兵戎相见（另见“忽必烈与阿里不哥争位”条）。忽必烈掌握着汉地的粮食和人力，封锁了漠北的物资来源，阿里不哥的军队几次战败，又与察合台汗国的阿鲁忽反目，处境日益困难。1264 年他到上都向忽必烈投降，两年后病死。
sources: []
recalled:
  - 《元史·世祖本纪》
  - 拉施特《史集》
