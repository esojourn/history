name: 荆轲
aliases: [庆卿, 荆卿]
role: 刺客
summary: 战国末年卫国人，受燕太子丹之托刺杀秦王嬴政，在秦廷上功败垂成，被杀。
body: |-
  荆轲是卫国人，祖先是齐国人，卫人称他为庆卿，到燕国后燕人称他为荆卿，生年不详。据《史记·刺客列传》，他喜好读书击剑，曾以剑术游说卫元君，没有被任用。后来秦国攻魏，设置东郡，把卫元君的旁支迁到野王。荆轲漫游各地，曾在榆次与盖聂论剑、在邯郸与鲁句践博戏，都因对方发怒而默然离去。到燕国后，他与屠狗的人和善于击筑的高渐离交好，常在燕市上饮酒，酒酣后高渐离击筑、荆轲和着唱歌，相乐之后又相对哭泣，旁若无人。燕国处士田光知道他不是平常人。

  燕太子丹想刺杀秦王，经田光推荐结识了荆轲，尊为上卿。荆轲认为要接近秦王必须有取信之物，提出带上秦王悬赏千金、封邑万家的逃将樊於期的首级，以及燕国督亢的地图。太子丹不忍杀樊於期，荆轲私下去见他，樊於期得知计划后自刎。公元前 227 年，荆轲带着首级、地图和藏在图中的毒匕首，与副手秦舞阳出发。太子丹和宾客穿着白衣在易水边送行，高渐离击筑，荆轲和着唱道：“风萧萧兮易水寒，壮士一去兮不复还！”

  到了咸阳，荆轲用千金之礼买通秦王的宠臣蒙嘉，秦王在咸阳宫以隆重的礼仪接见燕使。秦舞阳走到殿阶下吓得脸色大变，荆轲笑着替他掩饰，自己捧图献上。图卷展开到尽头，匕首露出，荆轲左手抓住秦王的衣袖，右手持匕首刺去，没有刺中，秦王挣断衣袖逃开，绕着柱子奔走。按秦法，殿上群臣不得携带兵器，殿下的卫士没有命令不能上殿，侍医夏无且用药囊投向荆轲，左右提醒秦王把剑推到背后拔出，秦王拔剑砍断了荆轲的左腿。荆轲把匕首掷向秦王，击中铜柱。他倚柱而笑，箕踞而骂，说之所以没有成功，是想活捉秦王逼他订约以回报太子。随后被左右杀死。秦王大怒，加派军队攻燕，次年攻破蓟城。

  荆轲刺秦王成为中国历史上最著名的刺杀故事之一，后世诗文多有咏叹。他死后，高渐离也曾借击筑接近秦始皇，以灌了铅的筑击之，没有击中，被杀。
sources: []
recalled:
  - 《史记·刺客列传》
  - 《战国策·燕策三》
