name: 坡旅甲
aliases:
  - 士每拿的坡旅甲
  - 波利卡普
role: 士每拿主教、殉道者
summary: 士每拿主教，据说曾受教于使徒约翰，八十六岁时在士每拿被烧死。
body: |-
  坡旅甲是小亚细亚士每拿教会的主教。他的学生爱任纽说，坡旅甲曾受使徒教导，与见过主的人交往，并由使徒立为士每拿的主教；爱任纽又在一封信里回忆，少年时听坡旅甲讲述他与约翰交往的事。《历史的轨迹》称他是"经使徒亲自带领的最后一位信徒"。伊格那丢押往罗马途经士每拿时与他见面，后来又写信给他，这封信至今尚存。坡旅甲本人留下一封《致腓立比人书》。

  据爱任纽和优西比乌的记载，坡旅甲晚年到罗马访问主教安尼克托，商讨复活节在哪一天守的问题。两人各守自己的传统，没有达成一致，但彼此和睦，安尼克托还请他在罗马教会主持圣餐。爱任纽又记载，坡旅甲在罗马遇见马吉安，马吉安问他认不认得自己，他回答："我认得你，你是撒但的长子。"

  他殉道的经过见于士每拿教会写给非拉铁非附近非罗米利乌教会的信，后世称为《坡旅甲殉道记》，《历史的轨迹》第二章所述即出于此。据此记载，他在竞技场上被要求咒骂基督，回答说："八十六年来我事奉他，他未曾亏负我，我怎能亵渎那拯救我的王？"随后被火烧，又被刺死。

  他殉道的年份有争议。《历史的轨迹》作公元 156 年；不少学者据殉道记所载的日期和总督任期，推定为 155 年或 156 年，也有人主张晚到 167 年前后。若"八十六年"指他的年岁，他约生于公元 69 年。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第三章“教会内部的成长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter04.html"
recalled:
  - 《坡旅甲殉道记》
  - 爱任纽《驳异端》卷 3 第 3 章第 4 节
  - 优西比乌《教会史》卷 4 第 14—15 章、卷 5 第 20、24 章
  - 坡旅甲《致腓立比人书》
