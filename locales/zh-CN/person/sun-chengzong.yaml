name: 孙承宗
aliases: [恺阳, 文忠]
role: 天启帝的老师，督师辽东
summary: 天启初年督师山海关，修筑关宁锦防线；晚年守家乡高阳，城破殉难。
body: |-
  孙承宗是北直隶高阳（今河北高阳）人，万历三十二年（1604 年）考中榜眼，后来担任皇长孙朱由校的讲官。天启二年（1622 年）广宁失守后，他以兵部尚书兼东阁大学士的身份亲自到山海关督师。他整顿军队，修复宁远等城池和堡垒，安置辽东难民屯田，建立起以山海关、宁远、锦州为骨干的防线，后世称为“关宁锦防线”。袁崇焕、满桂、祖大寿等将领都在他手下得到重用。

  孙承宗是天启帝的老师，又在边关握有重兵，引起魏忠贤的猜忌。天启五年（1625 年）他被迫辞官回乡，接任的高第放弃关外诸城，只有袁崇焕坚守宁远。崇祯二年（1629 年）皇太极率军入关，兵临北京，孙承宗再次被起用，督师通州、山海关，收复了遵化、永平等四城。后来大凌河之战失利，他又被弹劾去职。

  崇祯十一年（1638 年）清军再次入关，攻打高阳。七十六岁的孙承宗率领家人和城中百姓守城，城破后被俘，自缢而死，他的子孙多人战死。南明时追谥“文忠”。
sources: []
recalled:
  - 《明史·孙承宗传》
