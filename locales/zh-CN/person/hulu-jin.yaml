name: 斛律金
aliases: [阿六敦]
role: 将领
summary: 敕勒族将领，高欢的心腹，以唱《敕勒歌》知名。
body: |-
  斛律金字阿六敦，朔州敕勒部人，出身高车斛律部的酋长之家。据《北齐书》本传，他善于骑射，用匈奴的方法行军，看到尘土就知道敌军马步多少，嗅一嗅地面就知道敌军的远近。六镇之乱后，他归附尔朱荣，后来跟随高欢，成为高欢最倚重的大将之一。

  武定四年（公元 546 年），高欢围攻玉壁失利，撤军时军中传言高欢中了弩箭，高欢勉强起身宴请诸将，让斛律金唱《敕勒歌》，自己在旁相和。这首“敕勒川，阴山下”的民歌由此流传下来。据宋代郭茂倩《乐府诗集》引《乐府广题》，这首歌原本用鲜卑语演唱，后来译成了汉语。

  北齐建立后，他官至左丞相，封咸阳王。他的儿子斛律光是北齐名将，孙女是皇后，一门贵盛。天统三年（567 年）去世，年八十。
sources: []
recalled:
  - 《北齐书·斛律金传》
  - 郭茂倩《乐府诗集》
