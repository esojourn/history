name: 利西马科斯
aliases: [吕西马库斯]
role: 色雷斯与马其顿国王
summary: 亚历山大的护卫官，继业者之一，据有色雷斯、小亚细亚和马其顿，在库鲁佩狄翁败死。
body: |-
  生于马其顿都城佩拉，父亲阿伽托克勒斯据说原是色萨利人。他的生年依去世时的年龄推算，而年龄有八十岁和七十四岁等不同记载，通常取约公元前 360 年。东征期间他是亚历山大的七名近身护卫官之一。后世流传他被关进狮笼而徒手杀狮的故事，是由他在叙利亚猎狮受伤一事敷演出来的。

  前 323 年分封时他得到色雷斯。这里并未真正臣服，他同色雷斯国王塞乌提斯三世和黑海西岸的希腊城市打了多年。前 309 年他在色雷斯半岛的地峡上建都，取名利西马基亚。约前 305 年他随其他继业者称王。前 302 年他率军渡海进入小亚细亚牵制安提柯，次年与塞琉古会师，在伊普苏斯取胜，战后分得托罗斯山以西的小亚细亚。

  他几次越过多瑙河与盖塔人作战。约前 292 年他兵败被盖塔王德罗米凯特斯俘虏，后者款待他之后将他释放。前 288 年他与伊庇鲁斯的皮洛士夹攻马其顿，赶走德米特里，两人平分其地；前 285 年前后他又把皮洛士挤走，独占马其顿和色萨利。这时他的国土从多瑙河直到托罗斯山。

  他晚年娶托勒密一世之女阿尔西诺伊。前 283 年前后，他听信谗言，处死了能干而得人心的长子阿伽托克勒斯；古代作家多说是阿尔西诺伊为自己的儿子谋位而进的谗言。阿伽托克勒斯的遗孀和党羽逃到塞琉古那里，小亚细亚的城市和将领纷纷离心，看守帕加马金库的菲勒泰罗斯也改投塞琉古。

  前 281 年塞琉古进入小亚细亚，两位年近八十的老人在萨迪斯以西的库鲁佩狄翁平原交战，利西马科斯阵亡。相传他的狗守着遗体多日。遗骸后来葬在利西马基亚。他的王国没有继承下来：塞琉古几个月后遇刺，马其顿落入托勒密·克劳诺斯之手，随即遭到高卢人入侵。
sources: []
recalled:
  - 狄奥多罗斯《历史丛书》卷十八至卷二十一
  - 普鲁塔克《德米特里传》《皮洛士传》
  - 保萨尼亚斯《希腊志》卷一第 9—10 章
  - 尤斯丁《腓力史纲要》卷十五、卷十七
