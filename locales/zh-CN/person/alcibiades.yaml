name: 亚西比德
aliases: [阿尔西比亚德斯, 阿尔基比亚德]
role: 雅典政治家、将军
summary: 鼓动西西里远征，先后投奔斯巴达与波斯，又回雅典统军，最后被刺杀。
body: |-
  雅典人，克利尼亚斯之子，母亲出自阿尔克迈翁家族。公元前 447 年父亲在科罗尼亚阵亡，他由亲戚伯里克利监护长大。他出身高贵、相貌出众、家财丰厚，年轻时常在苏格拉底身边；柏拉图在《会饮篇》里让他讲述苏格拉底在波提代亚救过他的命。前 416 年他派七辆赛车参加奥林匹亚竞技会，据修昔底德，包揽了第一、第二和第四名。

  前 420 年他当选将军，促成雅典与阿尔戈斯、曼提尼亚、厄利斯结盟，矛头指向斯巴达；前 418 年这一同盟在曼提尼亚被斯巴达击败。前 415 年他力主远征西西里，与尼西阿斯、拉马科斯同任统帅。舰队出发前夕，雅典城内的赫耳墨斯石像一夜之间被人毁坏面部，接着有人告发他在私宅里戏仿厄琉息斯秘仪。他要求先受审再出征，对手却等他出海以后才发出召回令。他在返航途中于图里伊脱身，逃到斯巴达，雅典缺席判处他死刑。

  在斯巴达，他建议派一位斯巴达将领去援助叙拉古，并在阿提卡的狄凯利亚筑垒长期驻军；两条都被采纳，都使雅典大受损害。前 412 年他到爱奥尼亚策动雅典的盟邦反叛。不久他与国王阿基斯二世交恶，普鲁塔克说是因为他与王后有私情。他转投波斯总督提萨斐尔涅斯，劝其不要让任何一方获胜。

  前 411 年雅典发生寡头政变，驻在萨摩斯的雅典舰队拥护民主，由色拉西布洛斯提议把他召来任将军。此后几年他率舰队在赫勒斯滂一带连胜，前 410 年在库济科斯全歼斯巴达舰队，前 408 年收复拜占庭。前 407 年他回到雅典，受到盛大欢迎，罪名撤销，被任命为全权统帅。次年他离开舰队期间，副手违令出战，在诺提翁被吕山德击败，他被免职，退居色雷斯沿海自己的堡垒。前 405 年雅典舰队停泊在羊河，他骑马前来，劝将军们移驻有港口和补给的地方，被赶走；几天后舰队覆灭。

  他逃到弗里吉亚，投奔波斯总督法尔那巴佐斯。前 404 年他在住处被围，房屋被纵火，他冲出来时中箭身亡。指使者是吕山德、雅典的三十僭主，还是别的仇家，古人说法不一。
sources: []
recalled:
  - 修昔底德《伯罗奔尼撒战争史》卷五第 43—47 章；卷六第 15—29、53、61、88—93 章；卷八
  - 色诺芬《希腊史》卷一；卷二第 1 章
  - 普鲁塔克《亚西比德传》
  - 柏拉图《会饮篇》212d—222b
