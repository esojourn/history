name: 蔡伦
aliases: [蔡敬仲, 龙亭侯]
role: 宦官、尚方令
summary: 东汉宦官，改进造纸方法，用树皮、麻头、破布、渔网造纸，世称“蔡侯纸”。
body: |-
  据《后汉书·宦者列传》，蔡伦字敬仲，桂阳人，生年不详。他在明帝永平末年入宫，章帝时任小黄门，和帝即位后升为中常侍，参与机密。本传说他有才学，办事尽心，多次直言进谏。后来兼任尚方令，监督制作宫中的刀剑器物，所造之物精工坚密，为后世所仿效。

  当时书写多用竹简和缣帛，本传说“缣贵而简重，并不便于人”。蔡伦想出用树皮、麻头、破布和渔网造纸的办法，元兴元年（公元 105 年）奏报和帝，受到称赞，此后各地普遍采用，人们称之为“蔡侯纸”。二十世纪以来，考古工作者在陕西、甘肃等地的西汉遗址中多次发现植物纤维纸的残片，可知纸在蔡伦之前已经出现；一般认为他的贡献在于扩大了原料、改进了工艺，使纸能够大量制造并用于书写。

  安帝元初元年（114 年），蔡伦被封为龙亭侯。他早年曾奉窦皇后之意，参与诬陷安帝的祖母宋贵人。邓太后去世、安帝亲政后追究此事，命他自己到廷尉受审。建光元年（121 年），蔡伦服毒自杀。
sources: []
recalled:
  - 《后汉书·宦者列传》（蔡伦）
