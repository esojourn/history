name: 梁武帝
aliases: [萧衍, 萧叔达, 梁高祖]
role: 皇帝
summary: 南梁的建立者，在位四十八年，崇信佛教，死于侯景之乱。
body: |-
  萧衍字叔达，南兰陵人，与齐高帝萧道成同族，宋大明八年（公元 464 年）生于秣陵。他博学多才，是竟陵王萧子良西邸“竟陵八友”之一。齐明帝时，他出任雍州刺史，镇守襄阳。

  东昏侯萧宝卷在位时滥杀大臣，永元二年（500 年）杀了萧衍的长兄萧懿。萧衍在襄阳起兵，拥立南康王萧宝融在江陵即位，即齐和帝，随即顺江东下，次年攻入建康，东昏侯被部下所杀。中兴二年（502 年），他接受和帝禅让，建立梁朝。

  他在位四十八年，是南朝在位最久的皇帝。前期他制定礼仪律令，设立五馆和国子学，改定官品为十八班，梁朝的文化学术在南朝最为兴盛。对北魏，天监四年（505 年）大举北伐，主帅临川王萧宏在洛口不战而溃；天监六年（507 年）韦叡、曹景宗在钟离大败魏军。天监十三年（514 年）起，他又在淮河上筑浮山堰，想淹寿阳，两年后堰坏，据《资治通鉴》，沿淮城戍村落十余万口被冲入海。

  他笃信佛教，断酒肉，亲自讲经，在建康大建佛寺，先后四次舍身同泰寺，由群臣出钱赎回（另见“梁武帝崇佛”条）。晚年他对宗室子弟过于宽纵，犯法者往往不加追究，政事日渐松弛。

  太清元年（547 年），东魏大将侯景来降，他不顾一些大臣的反对予以接纳。次年侯景起兵叛乱，渡江围攻建康宫城台城。太清三年（549 年）三月台城失陷，他被侯景控制，同年五月饿病交加，死于净居殿，年八十六。
sources: []
