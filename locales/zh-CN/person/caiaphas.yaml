name: 该亚法
aliases:
  - 约瑟·该亚法
role: 大祭司
summary: 耶稣受审时的犹太大祭司，亚那的女婿，约公元 18—36 年在任。
body: |-
  该亚法的生年和早年经历没有记载。约瑟夫斯《犹太古史》卷 18 说他本名约瑟，又叫该亚法，由罗马总督瓦勒留·革拉图立为大祭司，后来被叙利亚总督维特里乌斯免职；据此推算，他约在公元 18 年至 36 年间在任，任期与彼拉多作总督的年份大致重合。《约翰福音》18:13 说他是亚那的女婿。亚那从前作过大祭司，这时仍有影响，《路加福音》3:2 和《使徒行传》4:6 都把两人并提。

  《约翰福音》11:47–53 记拉撒路复活以后，祭司长和法利赛人聚集公会商议，担心众人都信耶稣，罗马人要来夺他们的地土和百姓。该亚法对他们说，一个人替百姓死，免得通国灭亡，这是他们的益处。从那日起他们就商议要杀耶稣。

  耶稣被捕以后，《约翰福音》记先带到亚那那里，亚那再把他解到该亚法那里（约 18:13、24）；《马太福音》26:57–68 记耶稣在该亚法那里受审，大祭司起誓问他是不是基督，听了他的回答就撕开衣服，说他说了僭妄的话，众人都说他是该死的。到了早晨，他们把耶稣解去交给彼拉多。他被免职以后的事没有记载。
sources: []
recalled:
  - 《马太福音》26:57–68
  - 《约翰福音》11:47–53、18:13–14、18:24、18:28
  - 《路加福音》3:2
  - 《使徒行传》4:6
  - 约瑟夫斯《犹太古史》卷 18（任免）
