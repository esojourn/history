name: 佩里安德
aliases: [伯里安德]
role: 科林斯僭主
summary: 继其父库普塞洛斯统治科林斯约四十年，科林斯在其治下达到鼎盛。
body: |-
  科林斯僭主库普塞洛斯之子，按传统的年代，约公元前 627 年继位，统治四十年左右，前 585 年前后去世。在他治下，科林斯是希腊最富强的城邦之一，陶器行销地中海各地，并在北方的波提代亚等地建立殖民地。雅典与米提利尼争夺西革昂时曾请他仲裁。横穿科林斯地峡、用来拖运船只的石道，后人也归在他名下。

  希罗多德记了不少关于他的故事：他派人向米利都僭主色拉西布洛斯请教统治之道，色拉西布洛斯一言不发，只是在麦田里把高出的麦穗一一打掉，他领会了意思，开始除掉城中出众的人；他杀了妻子墨利萨，儿子吕科佛戎因此与他决裂。诗人阿里翁被海豚驮回岸上的故事，也发生在他的宫廷。这些故事的真实成分难以判断。

  有的古代作家把他列入“七贤”，也有人因为他是僭主而把他除名。他死后由侄子继位，几年后僭主统治即被推翻。
sources: []
recalled:
  - 希罗多德《历史》卷一第 20—24 章；卷三第 48—53 章；卷五第 92、95 章
  - 亚里士多德《政治学》卷五第 10—12 章
