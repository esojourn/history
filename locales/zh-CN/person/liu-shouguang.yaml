name: 刘守光
aliases: [大燕皇帝]
role: 卢龙节度使、大燕皇帝
summary: 幽州刘仁恭之子，囚父夺位，911 年在幽州称帝，913 年被晋军攻灭，次年被杀。
body: |-
  刘守光是卢龙节度使刘仁恭的儿子。刘仁恭据有幽州，晚年骄奢，在大安山修建宫殿居住。天祐四年（公元 907 年），后梁军进攻幽州，刘守光率兵击退梁军，随后派兵攻破大安山，把父亲囚禁起来，自任卢龙节度使。

  他为人残暴骄横。乾化元年（911 年），他在幽州自称皇帝，国号大燕，史称桀燕。晋王李存勖派大将周德威进攻幽州，围城一年多，乾化三年（913 年）城破，刘守光出逃后被擒。次年，李存勖把刘仁恭、刘守光父子押回晋阳，处死刘守光，又把刘仁恭带到雁门李克用的墓前处死祭奠（另见“晋灭燕”条）。幽州从此归晋所有，晋军直接面对北方的契丹。他的生年史书没有记载。
sources: []
recalled:
