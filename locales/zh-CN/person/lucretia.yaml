name: 卢克蕾提亚
aliases: [鲁克丽丝, 卢克丽霞]
role: 传说中的罗马贵族妇女
summary: 传说中的罗马贵妇，受王子之辱后自尽，相传由此引发驱逐国王。
body: |-
  相传为罗马贵族斯普里乌斯·卢克蕾提乌斯之女，卢基乌斯·塔克文·科拉提努斯之妻。她的故事主要见于李维《建城以来史》卷一和狄奥尼修斯的记载，传统上定在公元前 510 年或前 509 年。

  据李维，罗马军队围攻阿尔代亚时，几位王室青年在酒席上争论谁的妻子最贤惠，连夜骑马回去察看：王子们的妻子在宴饮，只有卢克蕾提亚深夜还在灯下和女奴一起纺羊毛。国王的儿子塞克斯图斯·塔克文因此起了邪念，几天后独自来到科拉提亚，夜里持剑闯入她的卧室，威胁说若不顺从，就杀死她，再杀一个奴隶放在旁边，说是捉奸所杀。她被迫屈从。

  第二天她派人请来父亲和丈夫，同来的还有瓦勒里乌斯和布鲁图。她说明经过，要他们发誓报仇，随后用藏在衣服里的刀自尽。布鲁图拔出刀起誓驱逐国王一家，把她的遗体抬到广场示众，罗马由此起事，王政告终。

  这个故事是否属实无从查考，现代学者多视为传说。它在后世影响很大，奥古斯丁在《上帝之城》里讨论过她的自尽，文艺复兴以来成为绘画和戏剧的常见题材。
sources: []
recalled:
  - 李维《建城以来史》卷一第 57—60 章
  - 哈利卡纳苏斯的狄奥尼修斯《罗马古事记》卷四
  - 奥古斯丁《上帝之城》卷一
