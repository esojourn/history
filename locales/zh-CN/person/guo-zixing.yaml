name: 郭子兴
aliases: [滁阳王]
role: 元末红巾军将领
summary: 元末在濠州起兵的红巾军首领，收朱元璋为部下，并把养女马氏嫁给他。
body: |-
  郭子兴是濠州定远（今安徽定远）人，生年不详，据《明史》，他的父亲以占卜为业，娶了当地富家的瞎眼女儿，家境因此富裕。郭子兴为人任侠，喜欢结交宾客，暗中加入了白莲教。

  至正十二年（1352 年）刘福通起义后，郭子兴与孙德崖等人在濠州起兵响应，攻占濠州城，各自称元帅。同年朱元璋来投奔，郭子兴见他相貌奇特，收为亲兵，后来又把养女马氏（即后来的马皇后）嫁给他。郭子兴性格刚直而多疑，与孙德崖等人不和，一度被他们囚禁，朱元璋设法把他救出。

  此后朱元璋在外招兵，攻下滁州，郭子兴移驻滁州，又攻下和州。至正十五年（1355 年）郭子兴在和州病死，他的部众逐渐归于朱元璋。明朝建立后，朱元璋追封他为滁阳王，在滁州为他立庙。
sources: []
recalled:
  - 《明史·郭子兴传》
