name: 道安
aliases: [释道安, 弥天释道安]
role: 僧人
summary: 东晋高僧，佛图澄的弟子，在襄阳、长安整理经录、制定僧规，倡导僧人以“释”为姓。
body: |-
  道安俗姓卫，常山扶柳人，生年一般作永嘉六年（公元 312 年），另有 314 年之说。他幼年父母双亡，十二岁出家。据《高僧传》，他相貌丑陋，起初不受师父看重，被派去田里干活，后来显出过人的记忆力才得以受戒游学。他到邺城拜佛图澄为师。后赵灭亡前后北方大乱，他带着徒众在太行山一带辗转避难十余年。

  兴宁三年（365 年）他率弟子四百余人南下襄阳，途中让同学和一部分弟子分赴各地传教，并说：“不依国主，则法事难立。”他在襄阳住了十五年，每年讲解《放光般若经》，为汉代以来译出的佛经编了一部目录，辨别真伪、注明译者，又为僧团制定了讲经、饮食、忏悔等方面的规范，各地寺院纷纷仿行。此前僧人多随师父的国名取姓，他主张佛门弟子一律以“释”为姓，后来成为通例。

  太元四年（379 年）前秦攻下襄阳，他被送到长安，苻坚十分敬重他。他在长安主持译经，总结了翻译佛经的难处；又听说西域有高僧鸠摩罗什，劝苻坚迎请。苻坚要南征东晋，他曾进谏劝阻。太元十年（385 年）二月他在长安去世，同年苻坚败亡。
sources: []
recalled:
  - 《高僧传·释道安传》
  - 《出三藏记集》卷十五
