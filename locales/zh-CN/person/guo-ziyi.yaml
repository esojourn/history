name: 郭子仪
aliases: [汾阳王, 郭令公]
role: 朔方节度使、副元帅
summary: 唐朝平定安史之乱的主将，收复两京，后来又多次化解吐蕃、回纥的入侵，封汾阳王。
body: |-
  郭子仪是华州郑县人，武则天神功元年（公元 697 年）生，以武举出身，长期在北方边军中任职。天宝十四载（755 年）安禄山起兵，他被任命为朔方节度使，率军东进，收复云中、马邑等地。次年他与李光弼合兵出井陉，进入河北，在嘉山大败史思明，河北十余郡重新归附朝廷。

  潼关失守、唐肃宗在灵武即位后，据《资治通鉴》，他带五万朔方兵赶到灵武，成为朝廷最主要的军事力量。至德二载（757 年）他任副元帅，辅佐广平王李俶，与回纥援兵一起收复长安、洛阳，因功加司徒，封代国公（另见“收复两京”条）。乾元二年（759 年）九节度使围攻邺城失败，宦官鱼朝恩把罪责推到他身上，他被召回京城，解除兵权（另见“相州之战”条）。宝应元年（762 年）河东、绛州军队相继哗变，他奉命前往安抚，平定了变乱，进封汾阳郡王。

  广德元年（763 年）吐蕃攻入长安，唐代宗出逃陕州，他临危受命，召集散兵，虚张声势，吐蕃军撤出长安（另见“吐蕃攻入长安”条）。次年仆固怀恩反叛，他坐镇河中、奉天，叛军不战而退。永泰元年（765 年）仆固怀恩引回纥、吐蕃等数十万人入侵，据《资治通鉴》，郭子仪在泾阳只带数十骑出营去见回纥首领，回纥人认出他后下马拜见，双方重新结盟，合击吐蕃（另见“仆固怀恩之叛”条）。

  此后他长期镇守邠州、河中一带，防御吐蕃。大历十四年（779 年）唐德宗即位，尊他为尚父，解除了他的兵权。建中二年（781 年）他在长安去世，年八十五。他前后历事玄宗、肃宗、代宗、德宗四朝，几次被宦官、权臣排挤，都受命即行，罢官即归，史书称他功劳盖世而君主不疑。
sources: []
