name: 奥托
aliases: [马尔库斯·萨尔维乌斯·奥托, 鄂图]
role: 罗马皇帝
summary: 公元 69 年杀加尔巴自立的皇帝，在位三个月，兵败后自杀。
body: |-
  奥托于公元 32 年 4 月 28 日出生，家族出自伊特鲁里亚，到他祖父一代才进元老院。他年轻时是尼禄的玩伴。尼禄看上了他的妻子波佩娅·萨比娜，58 年把他打发到西班牙西部去做卢西塔尼亚总督，一去十年；古代作家说他在任上倒颇为清廉。

  68 年加尔巴起兵，他第一个响应，满以为会被立为继承人。69 年 1 月加尔巴收养了皮索，他便买通禁卫军，1 月 15 日杀死加尔巴和皮索，自立为帝。这时莱茵河的军团已拥立维特利乌斯，分两路南下。4 月 14 日，两军在克雷莫纳附近的贝德里亚库姆交战，奥托的军队战败。

  他手里还有兵，多瑙河的军团也正在赶来，部下劝他再战。他不肯让内战拖下去，4 月 16 日清晨在布里克塞卢姆自杀，在位三个月。塔西佗和苏维托尼乌斯都说，他死得比活着的时候体面。
sources: []
recalled:
  - 塔西佗《历史》卷 1—2
  - 苏维托尼乌斯《罗马十二帝王传·奥托传》
  - 普鲁塔克《奥托传》
