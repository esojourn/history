name: 彭越
aliases: [彭仲, 梁王]
role: 梁王
summary: 昌邑人，楚汉相争时在梁地袭扰楚军粮道，汉初封梁王，后被诛。
body: |-
  彭越字仲，昌邑人，生年史无记载。据《史记·魏豹彭越列传》，他原在巨野泽中打鱼，结伙为盗，陈胜、项梁起兵后被泽中少年推为首领。汉二年（公元前 205 年）春，他率三万余人在外黄归汉，被拜为魏相国。楚汉在荥阳相持期间，他在梁地往来游击，截断楚军粮道，迫使项羽回师东顾。汉五年刘邦采纳张良的建议，许诺把睢阳以北至谷城之地封给他，他于是率全军会于垓下。项羽死后，他被立为梁王，都定陶。

  高祖十年陈豨反，高祖向梁征兵，彭越称病，只派部将前往。次年（前 196 年）他的太仆告发他谋反，他被捕囚于雒阳，赦为平民，流放蜀地青衣。途中遇到吕后，他哭诉无罪；吕后把他带回雒阳，劝高祖不要留下后患，又让人告他再次谋反，于是彭越被杀，宗族被灭。《汉书·高帝纪》把此事记在高祖十一年三月。
sources:
  - 《史记·魏豹彭越列传》 https://zh.wikisource.org/wiki/史記/卷090
  - 《汉书·高帝纪》 https://zh.wikisource.org/wiki/漢書/卷001
