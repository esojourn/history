name: 张华
aliases: [张茂先, 壮武郡公]
role: 司空
summary: 西晋大臣、文学家，力主伐吴，贾后时主持朝政，著有《博物志》。
body: |-
  张华字茂先，范阳方城人。他幼年丧父，家境贫寒，曾以牧羊为生。早年作《鹪鹩赋》，阮籍读后称他有“王佐之才”，由此知名。曹魏末年任中书郎，入晋后官至中书令。晋武帝与羊祜谋划伐吴，朝臣多不赞成，只有他和杜预等少数人支持；出兵时他任度支尚书，负责调度粮运。吴亡后封广武县侯，后来受荀勖等人排挤，一度出镇幽州。

  惠帝即位后，贾后因他出身寒微、没有逼上之嫌而又有声望，让他主持朝政，元康六年（公元 296 年）任司空。《晋书》本传说他“尽忠匡辅，弥缝补阙”，贾后专政的几年朝局大体安定。永康元年（300 年）赵王伦废贾后，他因不肯依附被杀，夷三族，时年六十九。

  他以博学著称，家中藏书极多，著有记载异物、古事的《博物志》。他乐于奖掖后进，陈寿、左思和入洛的陆机、陆云兄弟都受过他的称赏。
sources: []
recalled:
  - 《晋书·张华传》
  - 《资治通鉴》卷八十至八十三
