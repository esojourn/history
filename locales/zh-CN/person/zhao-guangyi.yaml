name: 宋太宗
aliases: [赵光义, 赵匡义, 赵炅]
role: 北宋皇帝
summary: 赵匡胤之弟，976 年继位，统一南北，但两次攻辽都告失败。
body: |-
  宋太宗本名赵匡义，是赵匡胤的弟弟，后晋天福四年（公元 939 年）生于开封。陈桥兵变时他在军中参与其事。宋朝建立后，为避兄长的名讳改名光义，长期担任开封府尹，后来封晋王，地位在宰相之上。

  开宝九年（976 年）十月赵匡胤突然去世，赵光义随即继位，即位后又改名炅。这次兄终弟及没有事先公开的安排，宋人笔记中有“烛影斧声”的记载（另见“烛影斧声”条）；后来赵普又说出太后遗命传位于弟的“金匮之盟”，其真伪历来有争议。太宗即位后，赵匡胤的儿子赵德昭在太平兴国四年（979 年）自杀，弟弟赵廷美被贬到房州，不久死去，这些事也使后人对他的继位多有议论。

  太平兴国三年（978 年），吴越王钱俶和割据漳、泉二州的陈洪进先后献出土地。次年他亲征北汉，攻下太原，五代十国以来的分裂局面至此结束（另见“吴越纳土”“宋灭北汉”条）。他乘胜进攻辽朝的南京（今北京），在高梁河被辽军击败，本人中箭，乘驴车逃回（另见“高梁河之战”条）。雍熙三年（986 年）他再次分三路北伐，又告失败，名将杨业战死（另见“雍熙北伐”条）。此后宋朝对辽转为守势。

  在内政上，太宗大幅增加科举录取的人数，读书人做官的门路比以前宽了许多；又命李昉等人编纂《太平御览》《太平广记》《文苑英华》等大型类书和总集。他加强中央集权，地方的兵权、财权进一步收归朝廷。淳化四年（993 年）四川爆发王小波、李顺起义（另见该条）。至道三年（997 年）三月太宗去世，太子赵恒继位，即宋真宗。
sources: []
recalled:
  - 《宋史·太宗本纪》
  - 《续资治通鉴长编》卷十七至四十一
  - 司马光《涑水记闻》
  - 释文莹《湘山野录》
