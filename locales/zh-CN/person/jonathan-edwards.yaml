name: "乔纳森·爱德华兹"
aliases: ["爱德华兹", "约拿单·爱德华兹"]
role: "公理会牧师、神学家，新英格兰大觉醒的中心人物"
summary: "北安普敦公理会牧师，1734 年起带出新英格兰大觉醒，殖民地最杰出的神学家。"
body: |-
  《历史的轨迹》第四十二章说，爱德华兹的名字与新英格兰大觉醒分不开，他从各方面看都是美洲殖民地的杰出知识分子，是美洲本地出生的伟人之一。他 1703 年生在康涅狄格的东温莎，父亲是公理派牧师；他十七岁毕业于耶鲁，又经过几年进修、讲道和教学，1727 年成为马萨诸塞中部北安普敦一间公理派教会的牧师。据一般记载，他起初是做外祖父斯托达德的助理牧师，1729 年外祖父去世后接任。

  书中说，当时这间教会正处在灵性僵死之中。1734 年 12 月他讲了一系列因信称义的道理，直接针对当时在新英格兰滋长的亚米念主义；这位瘦长苍白的年轻牧师活生生地描述神的震怒，力劝罪人尽速逃避。教会很快有了起色，全城都改变了，第二年春夏几乎找不到一个不关心永生问题的人，复兴第一年有三百多人决志归主。接下来几年新英格兰各地都有复兴，到 1740 年已遍及全境，书中说三十万人口中有二万五千到五万人新加入教会。1741 年他在康涅狄格的恩菲尔德讲《落在愤怒之神手中的罪人》，全场痛哭，哭声盖过了讲道，他不得不停下来请大家安静。

  该书也说，这次复兴带着强烈的感情和身体表现，过了一段时期热情渐退；早在 1744 至 1748 年间，爱德华兹就描写北安普敦教会“火焰已经完全止息”，那几年没有带领一个人归主。书中第四十四章提到他的外孙德怀特后来任耶鲁校长；第四十五章则指出，包括他在内的许多有名的公理派牧师都拥有奴隶。

  书中没有讲他的晚年。据一般记载，他坚持领圣餐的人必须有归信的凭据，与会众冲突，1750 年被北安普敦教会解职；此后到边地斯托克布里奇牧养一个小会众，同时向印第安人宣教，写成《意志的自由》等著作。1757 年他受聘为新泽西学院（今普林斯顿大学）院长，到任不久因接种天花疫苗感染，1758 年 3 月在普林斯顿去世。他的《宗教情操》分析复兴中真假宗教经验之别。
