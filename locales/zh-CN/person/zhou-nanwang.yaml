name: 周赧王
aliases: [姬延]
role: 周王，周朝末代天子
summary: 周朝末代天子，在位五十九年，前 256 年秦灭西周，周朝终结。
body: |-
  周赧王名延，是周慎靓王之子，公元前 314 年为元年，生年不详。他在位五十九年，是周朝在位最久的天子之一，但这时的周王室早已名存实亡，直接控制的只有洛阳周围的几十座城邑，而且还分裂为“西周”和“东周”两个小国，各有国君，赧王寄居在西周。

  战国后期，各国诸侯早已称王，周天子只在名义上还是“天下共主”。秦、韩、魏、楚等国在周室周围反复争夺，周王室只能在大国之间周旋。后世有“债台高筑”的说法，说赧王借钱筹措军费，无力偿还，躲到高台上避债，这一故事出自较晚的注释，未必可信。

  公元前 256 年，秦国攻取韩国的阳城、负黍，西周君与各国合纵，率兵出伊阙攻秦。秦昭襄王派将军摎攻西周，西周君到秦国顿首请罪，献出三十六座城邑和三万人口。据《史记·周本纪》，这一年周赧王去世，周朝灭亡，周的百姓东逃。七年后秦又灭了东周。《史记》说秦取九鼎宝器，后世有九鼎沉没于泗水的传说。

  周亡之后，九鼎的去向成为一个谜。《史记·秦始皇本纪》记载秦始皇东巡时曾在泗水打捞周鼎而没有找到，汉代画像石上常见“泗水捞鼎”的图像。

  他死后，周朝不再立王。
sources: []
recalled:
  - 《史记·周本纪》
  - 《史记·秦本纪》
  - 《战国策·东周策》
