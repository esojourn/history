name: 加略人犹大
aliases:
  - 犹大
  - 卖主的犹大
role: 十二使徒之一，出卖耶稣的人
summary: 十二使徒之一，为三十块钱把耶稣交给祭司长，事后身亡。
body: |-
  犹大是十二使徒之一，《约翰福音》6:71 说他是加略人西门的儿子，生年没有记载。福音书的使徒名单都把他列在末位，并注明他是卖耶稣的人。《约翰福音》12:4–6 记他为门徒管钱囊，并说他常取其中所存的。

  逾越节前，犹大去见祭司长，商量怎样把耶稣交给他们；《马太福音》26:14–16 说他们给了他三十块钱。最后的晚餐上，耶稣说门徒中间有一个人要卖他。随后犹大领着祭司长差来的一队人到客西马尼，以亲嘴为暗号，指明哪一个是耶稣（可 14:43–46）。

  关于他的结局，新约有两处记载，细节不同。《马太福音》27:3–10 说，他看见耶稣已经定了罪就后悔，把那三十块钱拿回来给祭司长和长老，把银钱丢在殿里，出去吊死了；祭司长用这钱买了窑户的一块田，用来埋葬外乡人，那田叫作血田。《使徒行传》1:18–19 说，这人用他作恶的工价买了一块田，以后身子仆倒，肚腹崩裂，那田按当地的话叫作亚革大马，就是血田的意思。耶稣升天以后，门徒摇签选出马提亚，补上他在十二使徒中的位分（徒 1:15–26）。
sources: []
recalled:
  - 《马太福音》26:14–16、26:47–50、27:3–10
  - 《马可福音》14:10–11、14:43–46
  - 《路加福音》22:3–6、22:47–48
  - 《约翰福音》6:70–71、12:4–6、13:21–30、18:2–5
  - 《使徒行传》1:15–26
