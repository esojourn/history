name: 狄青
aliases: [狄武襄]
role: 北宋名将、枢密使
summary: 北宋名将，出身士兵，在宋夏战争中屡立战功，1053 年平定侬智高，官至枢密使。
body: |-
  狄青是汾州西河人，生于大中祥符元年（公元 1008 年），出身行伍，按照宋代的兵制，士兵脸上刺字，他也不例外。宝元年间宋夏开战，他在延州一带作战，据《宋史》本传，他每次临阵都披散头发、戴铜面具冲锋，敌人无不披靡，前后大小二十五战，中箭八次。范仲淹见到他，送给他《左氏春秋》，对他说将领不懂古今就只有匹夫之勇，狄青从此发愤读书，通晓历代将帅的兵法。

  皇祐四年（1052 年）他升任枢密副使。这时广源州的侬智高起兵，攻陷邕州，沿江东下围攻广州，宋军屡次失利（另见“侬智高之乱”条）。狄青主动请战，率军南下，次年正月上元节，他在军中大宴三夜，却在夜里率军冒风雨越过昆仑关，在归仁铺大败侬智高，收复邕州。

  回朝后他升任枢密使。他以士兵出身而掌管全国兵马，在宋朝是少有的例子。宋代重文轻武，文臣对他多有猜忌，京城里又流传各种关于他的谣言，欧阳修等人也上书主张把他调出京城。嘉祐元年（1056 年）他被罢去枢密使，出知陈州，次年在陈州病逝，谥“武襄”。据宋人记载，他到任后朝廷每月两次派使者来“抚问”，实际上是监视，他忧惧成疾。宋仁宗问他为什么不用药去掉脸上的刺字，他说要留着它劝勉军中的士兵。
sources: []
recalled:
  - 《宋史·狄青传》
  - 《续资治通鉴长编》卷一百七十二至一百八十四
  - 余靖《宋故狄令公墓铭》
