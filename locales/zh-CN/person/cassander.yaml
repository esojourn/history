name: 卡山德
aliases: [卡桑德]
role: 马其顿国王
summary: 安提帕特之子，夺取马其顿，处死奥林匹亚斯，杀害亚历山大的遗孀和儿子，自立为王。
body: |-
  安提帕特的长子，约生于公元前 355 年。他没有随亚历山大东征。前 324 年他代父亲到巴比伦去见亚历山大。据普鲁塔克，他见到波斯人行跪拜礼时笑了出来，亚历山大大怒，抓着他的头发把他的头往墙上撞；多年以后他在德尔斐看到亚历山大的雕像，仍然浑身发抖。次年亚历山大去世，古代有他带去毒药的传闻，没有证据。

  前 319 年安提帕特临终时把摄政之位交给波利伯孔，只让卡山德做副手。他不服，联络安提柯和托勒密，夺取了比雷埃夫斯。前 317 年雅典与他议和，他派漫步派哲学家法勒隆的德米特里治理该城。同年太后奥林匹亚斯回到马其顿，杀死腓力三世夫妇和卡山德的弟弟。他从伯罗奔尼撒回师，把奥林匹亚斯围在彼得那，前 316 年春迫降后将其处死，并把亚历山大的遗孀罗克珊娜和幼子亚历山大四世关在安菲波利斯。

  他娶了腓力二世的女儿、亚历山大的异母妹帖撒罗尼加，以此与旧王室联姻。他合并塞尔迈湾边的若干村镇建城，以妻子的名字命名，即帖撒罗尼迦；又在波提代亚旧址建卡山德里亚，并重建了被亚历山大毁掉的底比斯。

  前 315 年起他与托勒密、利西马科斯、塞琉古一起对抗安提柯。前 311 年的和约规定他统领欧洲直到亚历山大四世成年，此后不久，约前 310 年，他命人秘密杀死了罗克珊娜母子。前 309 年波利伯孔拥立据称是亚历山大私生子的赫拉克勒斯，卡山德说服波利伯孔把这个少年也杀了。约前 305 年他称王。前 304 年至前 302 年德米特里在希腊节节进逼，他求和不成，再次与其他几位国王联合，前 301 年安提柯在伊普苏斯败亡，他保住了马其顿。

  前 297 年他病死，据说是水肿。长子腓力四世继位数月即死，另外两个儿子安提帕特和亚历山大五世争位，前 294 年德米特里乘机夺取马其顿，他的家族就此断绝。
sources: []
recalled:
  - 狄奥多罗斯《历史丛书》卷十八至卷二十
  - 普鲁塔克《亚历山大传》第 74 章；《德米特里传》
  - 尤斯丁《腓力史纲要》卷十四至卷十六
