name: 韦庄
aliases: [韦端己]
role: 诗人、前蜀宰相
summary: 唐末诗人、词人，以长诗《秦妇吟》记述黄巢之乱，晚年任前蜀宰相。
body: |-
  韦庄字端己，京兆杜陵人，生年一般作 836 年前后，是诗人韦应物的后代。广明元年（公元 880 年）他到长安应考，正赶上黄巢攻入长安，困在城中。中和三年（883 年）他到洛阳，写下长诗《秦妇吟》，借一位从长安逃出的女子之口，叙述黄巢军进城后的情景和战乱中百姓的苦难，其中有“内库烧为锦绣灰，天街踏尽公卿骨”之句，当时传诵很广，人称他“秦妇吟秀才”。后来他自己避讳此诗，不收入文集，此诗因此失传，直到二十世纪初才在敦煌藏经洞中发现了多种抄本。

  乾宁元年（894 年）他考中进士。天复元年（901 年）他入蜀，任西川节度使王建的掌书记。天祐四年（907 年）朱温篡唐，他劝王建称帝，王建建立前蜀，任他为宰相，前蜀的典章制度多由他制定。武成三年（910 年）他在成都去世。他的词清丽疏朗，如《菩萨蛮》“人人尽说江南好”等，与温庭筠同为花间派的代表，并称“温韦”。
sources: []
recalled:
  - 《十国春秋·韦庄传》
  - 韦庄《浣花集》
  - 敦煌写本《秦妇吟》
