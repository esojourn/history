name: "克理"
aliases: ["威廉·克理", "威廉·凯里"]
role: "浸信会宣教士，“现代宣教之父”"
summary: "英国鞋匠出身的浸信会牧师，1792 年促成浸信会差会，次年赴印度译经。"
body: |-
  克理 1761 年生于北安普敦郡保勒斯珀里一个织工家庭，十四岁做鞋匠学徒。他在不从国教的信徒中归信，加入特别浸礼派，一面补鞋、教书，一面自学拉丁文、希腊文、希伯来文和其他语言，后做了牧师。他读库克船长的航海记，常在补鞋台边挂一张自绘的世界地图。

  1792 年他发表一本小书，用统计说明世界各地尚未听过福音的人数，论证基督徒有义务去传福音；同年在诺丁汉讲道，留下“向神期望大事，为神尝试大事”一语。《历史的轨迹》第四十章说，复原教全球性宣教工作的冲力来自克理，他被称为“现代宣教之父”；1792 年他组织了第一个浸信宣道会（10 月在凯特林成立），第二年带着全家去印度。

  该书说，家产的丧失、印度当局的反对都不能阻止他。据一般记载，他到印度后头几年在孟加拉乡间管理靛青作坊，妻子精神失常，长子夭折；因东印度公司不许宣教士在其辖区工作，1800 年他与马士曼、沃德迁到丹麦属地塞兰坡，三人合作办印刷所、学校，后来创办塞兰坡学院。他也在加尔各答的威廉堡学院教孟加拉语和梵文。

  该书说，他最伟大的工作是翻译圣经，把全本或部分圣经译成二十六种印度语言（各家统计数目不一，常见的说法是全本六种、部分二三十种）。他还推动废除寡妇殉夫的习俗。他 1834 年死于塞兰坡，在印度四十一年没有回过英国。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十章“教会再度增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter44.html"
recalled:
  - "克理《基督徒有义务用各种方法使异教徒归信之探讨》（1792 年）"
