name: 秦观
aliases: [秦少游, 淮海居士]
role: 北宋词人
summary: 北宋词人，“苏门四学士”之一，词风婉约，有《鹊桥仙》等名作。
body: |-
  秦观是扬州高邮人，生于皇祐元年（公元 1049 年）。他早年拜见苏轼，深受赏识，是“苏门四学士”之一。他几次应考不中，元丰八年（1085 年）才考中进士。元祐年间经苏轼推荐，他在朝中任太学博士、秘书省正字、国史院编修官等职。

  绍圣元年（1094 年）新党执政，他作为元祐党人被贬出京城，此后一贬再贬，先后到处州、郴州、横州、雷州。在郴州时他写了《踏莎行·郴州旅舍》（“雾失楼台”），苏轼非常喜爱其中“郴江幸自绕郴山，为谁流下潇湘去”两句。元符三年（1100 年）徽宗即位，他奉命北归，走到藤州时去世。秦观是北宋婉约词的代表作家之一，词作情韵兼胜，《鹊桥仙》中“两情若是久长时，又岂在朝朝暮暮”一句流传很广，著有《淮海集》。
sources: []
recalled:
  - 《宋史·文苑传·秦观》
  - 《淮海集》
