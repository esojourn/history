name: 尼西阿斯
aliases: [尼基阿斯]
role: 雅典将军、政治家
summary: 促成公元前 421 年的和约，后统率西西里远征军，兵败被杀。
body: |-
  雅典人，尼刻拉托斯之子，是城中最富有的人之一。色诺芬说他有一千名奴隶，租给人在劳里昂的银矿做工。他为人谨慎，笃信占卜，在宗教庆典上出手阔绰。伯里克利死后，他是较为温和的一派的首领，与克里昂对立。战争头十年他多次任将军，胜多败少，公元前 424 年夺取了拉科尼亚南面的库忒拉岛。

  前 425 年在皮洛斯问题上，他把指挥权让给克里昂，结果成全了对方的大功。克里昂和伯拉西达战死后，他主持与斯巴达谈判，前 421 年订立为期五十年的和约，后世称为《尼西阿斯和约》。和约的条款没有完全执行，亚西比德又促成雅典与阿尔戈斯等邦结盟，和平名存实亡。

  前 415 年公民大会决定远征西西里，任命他、亚西比德和拉马科斯为统帅。他本不赞成，在大会上极言所需兵力之大，想使人们知难而退，结果大会反而照他说的规模拨给了船只和军队。出征后亚西比德被召回，拉马科斯阵亡，指挥权落到他一人身上。围攻叙拉古的封锁墙差一点就要合拢，斯巴达人吉利普斯赶到，战局逆转。他患有肾病，前 414 年冬写信回国，请求撤军或增援，并请求解除自己的职务；雅典没有准他辞职，派德摩斯梯尼率第二支舰队前往。

  前 413 年德摩斯梯尼夜袭失败后主张立即撤退，他起初不同意，说宁可死在敌人手里也不愿回去被雅典人不公正地处死。等到他同意时，8 月 27 日夜发生月食，占卜者说要等三九二十七天，他坚持照办。叙拉古人利用这段时间封锁了港口，雅典舰队在港内决战失败。全军从陆路撤退，一路遭截击，他所率的一部在阿西纳洛斯河边被歼，他向吉利普斯投降，与德摩斯梯尼一同被叙拉古人处死。修昔底德说，在他那个时代的希腊人中，尼西阿斯最不该落到这样的下场，因为他一生都按通常所说的德行来立身行事。
