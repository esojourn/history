name: 鲁肃
aliases: [鲁子敬]
role: 横江将军
summary: 孙吴谋臣、将领，最早为孙权规划割据江东的方略，力主联合刘备抗曹。
body: |-
  据《三国志·吴书·鲁肃传》，鲁肃字子敬，临淮东城人，家境富裕，好施舍。周瑜任居巢长时带人路过，向他求粮；鲁肃家有两仓米，各三千斛，他指着其中一仓全数相赠，两人由此结交。后来他随周瑜渡江，周瑜把他推荐给刚刚继位的孙权。

  本传记载，孙权与他初次交谈后，单独留他合榻对饮，问以大计。鲁肃说，汉室已不可复兴，曹操一时也除不掉，最好的办法是立足江东，观察天下的变化，进而占据整个长江流域，然后称帝以图天下。当时孙权年方十九，这番话比诸葛亮的“隆中对”还早几年。

  建安十三年（公元 208 年）刘表病死，鲁肃自请以吊丧为名去荆州察看形势。他到达时刘琮已降曹，于是在当阳长坂迎上南逃的刘备，劝他与孙权联合，并与诸葛亮同回。孙权的部下多劝迎降，鲁肃私下对孙权说：别人都可以迎接曹操，唯独将军不可以——他们投降后仍可做官，将军投降后却无处安身。他建议召回周瑜商议，最后促成了抗曹的决定。

  周瑜死后，鲁肃接管他的部队，驻在陆口，与镇守荆州的关羽相邻。他主张维持与刘备的联盟。建安二十年（215 年）孙权向刘备索还荆州诸郡不成，双方出兵对峙。鲁肃邀关羽会面，约定兵马各驻百步之外，只有将领带刀赴会，当面责备对方失信。后来双方以湘水为界分割荆州。建安二十二年（217 年）鲁肃去世，终年四十六。
sources: []
recalled:
  - 《三国志·吴书·周瑜鲁肃吕蒙传》
