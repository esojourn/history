name: 纳兰性德
aliases: [容若, 楞伽山人, 纳兰成德]
role: 词人
summary: 大学士明珠之子，康熙帝的侍卫，清初最著名的词人之一，三十一岁去世。
body: |-
  纳兰性德原名成德，因避太子胤礽（小名保成）的讳改名性德，字容若，满洲正黄旗人，父亲是康熙年间的权臣、大学士明珠。他自幼学习汉文化，康熙十五年（1676 年）考中进士，此后任康熙帝的侍卫，随康熙帝出巡南北，据说曾奉命出使梭龙（今黑龙江上游一带）考察。

  纳兰性德喜欢结交汉族文人，与顾贞观、朱彝尊、严绳孙等人交往密切。顾贞观的好友吴兆骞因科场案被流放宁古塔，纳兰性德受顾贞观之托，设法把吴兆骞营救回来，这件事在当时传为佳话。他还主持刊刻了儒家经解丛书《通志堂经解》。

  他的词以小令见长，风格清新婉丽，多写离别、思念和悼亡，他的妻子卢氏早逝，他写了许多悼亡词。“人生若只如初见”等句子流传很广。他生前就编有词集《侧帽集》《饮水词》，后人合编为《纳兰词》。王国维在《人间词话》中称赞他“以自然之眼观物，以自然之舌言情”，“北宋以来，一人而已”。康熙二十四年（1685 年）他患寒疾去世，年仅三十一岁。
sources: []
recalled:
  - 徐乾学《纳兰君墓志铭》
  - 王国维《人间词话》
