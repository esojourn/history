name: 窝阔台
aliases: [元太宗, 窝阔台汗]
role: 大蒙古国第二代大汗
summary: 成吉思汗第三子，继位为大汗，灭金，修建哈拉和林，派拔都等人西征欧洲。
body: |-
  窝阔台是成吉思汗与正妻孛儿帖所生的第三子，生于 1186 年。他性格宽厚，随父亲攻金、西征，在西征中与兄长察合台一起攻下花剌子模都城玉龙杰赤。成吉思汗生前指定他为继承人。1227 年成吉思汗去世后，由幼子拖雷监国，1229 年各部首领召开大会，推举窝阔台为大汗。

  窝阔台即位后继续攻金。1231 年他兵分三路，派拖雷借道宋境，绕到金军背后，次年在三峰山歼灭金军主力，随后围攻汴京；1234 年蒙古与南宋联军攻破蔡州，金朝灭亡（另见“蒙古灭金”条）。灭金之后，宋军北上收复汴京、洛阳，蒙古军将其击退，宋蒙战争由此开始。

  1235 年窝阔台在鄂尔浑河畔修建都城哈拉和林，同年召开大会，决定派各支宗室的长子随拔都西征，攻打钦察、罗斯和东欧（另见“蒙古第二次西征”条）。他任用耶律楚材管理汉地，按户征税，设立课税所，1238 年考选儒士，又在帝国境内设立驿站，便利交通往来。

  窝阔台晚年嗜酒，1241 年十二月在一次狩猎后去世。他死后由皇后乃马真称制五年，长子贵由才继位。西征的蒙古军因他的死讯而停止在欧洲的进攻，陆续东归。元朝建立后，忽必烈追尊他为元太宗。
sources: []
recalled:
  - 《元史·太宗本纪》
  - 《元朝秘史》
  - 拉施特《史集》
