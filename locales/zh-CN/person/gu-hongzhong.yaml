name: 顾闳中
aliases: []
role: 南唐画院待诏
summary: 南唐画院的画家，相传受后主之命画成《韩熙载夜宴图》。
body: |-
  顾闳中是江南人，在南唐画院任待诏，擅长人物画。他的生平事迹史书记载很少，生卒年都不详。据北宋《宣和画谱》等记载，南唐后主李煜听说大臣韩熙载在家中通宵宴饮，想知道详情，便派顾闳中夜里到韩府，暗中观察宴会的情景，回来后凭记忆画出，这就是《韩熙载夜宴图》。

  这幅画是长卷，分为听乐、观舞、歇息、清吹、散宴五段，用屏风把各段隔开，画中韩熙载反复出现，神情郁郁，与周围的热闹形成对照。画中人物的衣冠、乐器、家具都描绘得十分细致，是研究五代时期社会生活的重要图像资料。现藏北京故宫博物院的《韩熙载夜宴图》，学界多认为是宋代的摹本，但基本保存了原作的面貌。史料所载他的事迹大致仅此。
sources: []
recalled:
  - 《宣和画谱》卷七
  - 郭若虚《图画见闻志》
