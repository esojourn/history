name: 孟子
aliases: [孟轲, 子舆（一说）, 亚圣]
role: 思想家，儒家代表人物
summary: 战国中期儒家代表人物，主张性善、仁政和“民为贵”，著《孟子》。
body: |-
  孟子名轲，邹国人，生卒年说法不一，一般认为约在公元前 372 年至前 289 年。据《史记·孟子荀卿列传》，他“受业子思之门人”，即孔子之孙子思的弟子，所以后世把子思、孟子之学合称“思孟学派”。后世关于孟母三迁、断机教子的故事，出自汉代的《列女传》等书。

  孟子学成之后周游列国，先后到过齐、宋、滕、魏、鲁等国。他见梁惠王，劝他“何必曰利”，讲仁义；在齐国做过客卿，与齐宣王多次讨论王道。当时各国正忙于合纵连横、以攻伐为贤，孟子讲的唐虞三代之德被认为“迂远而阔于事情”，始终没有被重用。晚年他与弟子万章等人“序《诗》《书》，述仲尼之意，作《孟子》七篇”。

  孟子主张人性本善，认为人生来就有恻隐、羞恶、辞让、是非四种“善端”，扩而充之就是仁、义、礼、智。在政治上，他主张“仁政”和“王道”，反对以力服人的“霸道”；提出“民为贵，社稷次之，君为轻”，认为暴虐的君主是“独夫”，诛杀商纣是“诛一夫”而不是弑君。他主张“制民之产”，让百姓有恒产，提倡“老吾老以及人之老，幼吾幼以及人之幼”。他还强调士人的独立人格，说要“养吾浩然之气”，“富贵不能淫，贫贱不能移，威武不能屈”。

  孟子的地位在宋代以后大为提高，《孟子》被朱熹列入“四书”，元代封孟子为“亚圣公”，后世以“孔孟”并称。
sources: []
recalled:
  - 《史记·孟子荀卿列传》
  - 《孟子》
