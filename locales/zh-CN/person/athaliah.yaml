name: 亚他利雅
aliases: []
role: 南国犹大的篡位女主
summary: 亚哈家的女儿、犹大王约兰之妻，儿子死后剿灭王室，自己掌权六年。
body: |-
  出自北国以色列的暗利王室。《列王纪下》8:18 说犹大王约兰娶了亚哈的女儿，8:26 称她为以色列王暗利的孙女；圣经没有说明她的母亲是谁，也没有记载她的生年。她嫁给约沙法的儿子约兰，生了亚哈谢。亚哈谢作犹大王一年，在耶户起事时被杀。

  据《列王纪下》11:1–3，亚他利雅见儿子死了，就起来剿灭王室。亚哈谢的妹子约示巴把亚哈谢的儿子约阿施从被杀的王子中偷出来，连同乳母藏在圣殿里六年，这期间亚他利雅治理国家。《历代志下》22:11 说约示巴是祭司耶何耶大的妻子。

  第七年，祭司耶何耶大召来百夫长，安排护卫，领约阿施出来，给他戴上冠冕，膏他作王。亚他利雅听见喧嚷的声音，进了圣殿，看见王站在柱旁，就撕裂衣服喊叫说反了。耶何耶大吩咐不可在殿里杀她，众人把她带到王宫的马门，在那里杀了她（《列王纪下》11:4–16）。国民随后拆毁巴力庙，杀了巴力的祭司玛坦（11:18）。《历代志下》24:7 提到她的儿子们曾拆毁神的殿，把殿中分别为圣的物供奉巴力。
sources: []
recalled:
  - 《列王纪下》8:18、8:26、第 11 章
  - 《历代志下》第 22—23 章、24:7
