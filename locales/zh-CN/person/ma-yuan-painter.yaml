name: 马远
aliases: [马遥父, 钦山]
role: 画家
summary: 南宋画院画家，与夏圭并称“马夏”，构图常取一角，人称“马一角”。
body: |-
  马远字遥父，号钦山，生卒年都不详，主要活动在宋光宗、宋宁宗两朝，曾任画院待诏。他祖籍河中（今山西永济），出身绘画世家，据记载从曾祖马贲起，家中五代人都在画院供职。

  马远擅长山水，也画人物、花鸟。他的山水画常把景物集中在画面的一角或一边，留出大片空白表现水天和远景，构图简洁，笔法刚劲，人称“马一角”。与他同时的夏圭画风相近，常取画面的半边，人称“夏半边”，二人合称“马夏”，与南宋初年的李唐、刘松年并称“南宋四家”。传世作品有《踏歌图》《水图》《寒江独钓图》等，其中一些作品的归属学界有不同意见。他的画风对明代浙派和日本室町时代的水墨画影响很大。
sources: []
recalled:
  - 夏文彦《图绘宝鉴》
