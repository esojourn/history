name: 康熙帝
aliases: [玄烨, 清圣祖]
role: 清朝第四位皇帝
summary: 八岁即位，擒鳌拜、平三藩、统一台湾、三征噶尔丹，在位六十一年。
body: |-
  玄烨是顺治帝的第三个儿子，母亲是佟佳氏。据说他幼年出过天花，所以被选为继承人。顺治十八年（1661 年）顺治帝去世，八岁的玄烨即位，次年改元康熙，由四大臣辅政。康熙六年（1667 年）他亲政，两年后设计擒拿了专权的鳌拜（另见“康熙擒鳌拜”条）。

  康熙十二年（1673 年）他决定撤除吴三桂、尚可喜、耿精忠三藩，吴三桂随即起兵，南方各省纷纷响应，清朝一度失去半壁江山。康熙帝坐镇北京指挥，经过八年战争，康熙二十年（1681 年）平定三藩（另见“三藩之乱”条）。康熙二十二年（1683 年）他派施琅攻占澎湖，郑克塽投降，次年在台湾设府，隶属福建（另见“清统一台湾”条）。在北方，他派兵两次围攻被俄国占据的雅克萨，康熙二十八年（1689 年）与俄国签订《尼布楚条约》，划定了中俄东段边界（另见“雅克萨之战与尼布楚条约”条）。此后他三次亲征漠北，击败准噶尔的噶尔丹（另见“康熙亲征噶尔丹”条），漠北喀尔喀蒙古归附清朝。

  康熙帝重视治理黄河和运河，六次南巡，多次亲自视察河工。他宣布“滋生人丁，永不加赋”，以康熙五十年（1711 年）的人丁数为准征收丁银，此后新增的人口不再加收丁税，为雍正年间的摊丁入亩打下了基础。他尊崇程朱理学，开博学鸿儒科笼络汉族士人，组织编纂《康熙字典》《古今图书集成》《全唐诗》等书。他对西方的天文、数学很感兴趣，跟随南怀仁、白晋等传教士学习，但在礼仪之争中最终下令禁止天主教传教（另见“礼仪之争”条）。同时，他也兴起过文字狱，如戴名世《南山集》案。

  康熙帝晚年，皇子们为了争夺储位明争暗斗，他两次废黜太子胤礽，此后没有公开立储。康熙六十一年（1722 年）十一月他在畅春园去世，年六十九岁，在位六十一年，在中国历代皇帝中在位最久。皇四子胤禛继位，即雍正帝，关于雍正帝继位是否合法，后世有很多传说和争论。
sources: []
recalled:
  - 《清圣祖实录》
  - 《清史稿·圣祖本纪》
  - 白晋《康熙帝传》
