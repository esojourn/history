name: 巴沙
aliases: []
role: 北国以色列王
summary: 以萨迦人，弑拿答篡位，灭耶罗波安全家，在得撒作王二十四年。
body: |-
  以萨迦支派亚希雅的儿子，出身圣经没有更多记载。据《列王纪上》15:27–29，他趁拿答围困基比顿时杀了拿答，在亚撒第三年接续作王，随即杀尽耶罗波安的全家。他在得撒作以色列王二十四年（15:33），经文说他仍行耶罗波安的道。

  《列王纪上》15:16 说亚撒和巴沙在世的日子常常争战。巴沙上来攻击犹大，修筑拉玛，不许人从亚撒那里出入。亚撒把耶和华殿和王宫府库里剩下的金银送给大马士革的亚兰王便哈达，请他废掉与巴沙所立的约；便哈达就派军长攻破以色列的以云、但、亚伯伯玛迦和拿弗他利全境。巴沙听见，便停工不修拉玛，仍住得撒（15:17–21）。《历代志下》16:1 把这件事系于亚撒第三十六年，与《列王纪》所记巴沙的在位年数难以相合，历来有不同的解释。

  据《列王纪上》16:1–4，耶和华的话临到哈拿尼的儿子先知耶户（不是后来作王的耶户），说巴沙的家必像耶罗波安的家一样被除灭。巴沙死后葬在得撒，儿子以拉接续作王（16:6）。
sources: []
recalled:
  - 《列王纪上》15:16–16:7
  - 《历代志下》16:1–6
