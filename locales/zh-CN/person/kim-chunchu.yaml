name: 金春秋
aliases: [新罗太宗武烈王]
role: 新罗国王
summary: 新罗国王，648 年入唐请兵，即位后与唐联合，660 年攻灭百济。
body: |-
  金春秋是新罗的王族，在即位前长期主持对外交涉。善德女王时，百济攻占新罗的大耶城，他的女儿和女婿死于城中。他先到高句丽请求援兵，被扣留，后来才得以脱身。

  贞观二十二年（公元 648 年），他带着儿子到长安朝见唐太宗，请求唐朝出兵攻打百济，并请求改用唐朝的服饰制度，留下儿子在长安宿卫，太宗答应出兵。回国后，新罗开始采用唐朝的年号和衣冠。永徽五年（654 年）真德女王去世，他被推举即位，是新罗第一位出身“真骨”而非“圣骨”的国王，后世称太宗武烈王。

  显庆五年（660 年），唐将苏定方率军渡海，他派大将金庾信率新罗军队配合，两军攻克百济都城，百济灭亡。次年他去世。他的儿子文武王继位后，在总章元年（668 年）与唐朝共同灭亡高句丽，此后又与唐朝争夺百济和高句丽故地，到 676 年前后据有大同江以南的地区。
sources: []
recalled:
  - 金富轼《三国史记·新罗本纪·太宗武烈王》
  - 《旧唐书·新罗传》
