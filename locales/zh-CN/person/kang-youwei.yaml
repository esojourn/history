name: 康有为
aliases: [康南海, 长素, 祖诒]
role: 维新派领袖
summary: 发动“公车上书”，著《新学伪经考》《孔子改制考》，推动戊戌变法，失败后流亡海外。
body: |-
  康有为是广东南海人，出身官宦之家，早年师从朱次琦学习理学和经世之学。光绪五年（1879 年）他游历香港，后来又到上海，看到西方人管理的城市秩序井然，开始大量阅读西学书籍。光绪十四年（1888 年）他第一次上书光绪帝，请求变法，没有送达。

  光绪十七年（1891 年）他在广州开办万木草堂讲学，梁启超、陈千秋等人拜他为师。此后他写了《新学伪经考》和《孔子改制考》，前者认为东汉以来被奉为正统的古文经是刘歆伪造的，后者把孔子说成托古改制的改革家，借此为变法提供理论依据。这两部书在当时引起很大震动，《新学伪经考》曾被清廷下令毁版。

  光绪二十一年（1895 年）他到北京参加会试，正值《马关条约》签订的消息传来，他联合各省举人上书，请求拒和、迁都、变法，史称“公车上书”（另见“公车上书”条）；同年他考中进士。此后他在北京、上海组织强学会，办报宣传变法。光绪二十四年（1898 年）他多次上书，得到光绪帝的召见，提出了一系列变法建议，光绪帝随即开始变法（另见“戊戌变法”条）。同年九月慈禧太后发动政变，康有为事先离开北京，经上海逃往香港，后来流亡日本。

  此后康有为在海外组织保皇会，主张君主立宪，反对革命，与孙中山等革命派论战。辛亥革命后他回国，仍然主张尊孔、保皇，1917 年参与张勋复辟。他还写了《大同书》，描绘了一个没有国家、家庭和阶级的理想社会。1927 年他在青岛去世。
sources: []
recalled:
  - 康有为《康南海自编年谱》
  - 梁启超《南海康先生传》
  - 汤志钧《戊戌变法史》
