name: "弗兰克"
aliases: ["奥古斯特·赫尔曼·弗兰克", "富朗开"]
role: "敬虔派教育家"
summary: "敬虔派领袖，在哈雷办贫童学校与孤儿院，学生成为基督教最早的一批差传宣教士。"
body: |-
  弗兰克 1663 年生于吕贝克。《历史的轨迹》第三十四章说，他在莱比锡大学任教时，1687 年经历了灵命的重生，那时他二十四岁（据他的自述，是在吕讷堡写讲章时的经历）。他到德累斯顿与施本尔同住两个月，加入了敬虔主义运动。

  该书说，1689 年他回到莱比锡，向学生和市民讲道，许多人跟从他，但学生荒废学业、批评教授和牧师，引起反感，他在莱比锡立不住脚；转往埃尔福特，同样惹出风波。施本尔把他请到新近创办的哈雷大学任教，他使哈雷大学成为敬虔主义的中心，一直工作到 1727 年去世。

  该书说他精力充沛，善于组织，1695 年开办贫童教育，又设孤儿院。他没有钱，相信神垂听祷告，后来德国各地果然寄来捐款；他也善用宣传，引起世人对这事工的兴趣。这些机构后来发展成一座有学校、孤儿院、药房、印书馆的大型基业，称“弗兰克基金会”。

  第三十四、四十章说复原教最早的宣教工作就是从他和敬虔派开始的。丹麦国王腓特烈四世要在印度殖民地设宣教据点，在哈雷大学找到了他的学生；十八世纪哈雷至少有六十位学生出国宣教，最有名的是史瓦茨。该书说他去世时是敬虔主义的顶峰，此后再没有出过施本尔、弗兰克那样的领袖。作者也指出敬虔主义的缺点：弗兰克的学校不给孩子多少玩耍的机会，运动后来流于苛刻，又轻看教义。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十四章“敬虔主义 莫拉维弟兄会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter38.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第四十章“教会再度增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter44.html"
recalled:
  - "弗兰克自述归信经过（1690 年前后）"
