name: 葛勒可汗
aliases: [磨延啜]
role: 回纥可汗
summary: 回纥汗国第二代可汗，安史之乱中派兵助唐收复两京，娶唐朝宁国公主。
body: |-
  葛勒可汗名磨延啜，是回纥汗国开创者骨力裴罗（怀仁可汗）的儿子，唐天宝六载（公元 747 年）继位。他在位期间征服了漠北的其他铁勒部落，在色楞格河畔修筑了城池。

  安史之乱爆发后，唐肃宗向回纥借兵。至德二载（757 年），他派太子叶护率精兵四千余人（据《旧唐书》）南下，与郭子仪的唐军会合，在长安城西的香积寺一带大败叛军，随后收复长安、洛阳（另见“收复两京”条）。唐朝封叶护为忠义王，每年赐绢二万匹。乾元元年（758 年），唐肃宗把幼女宁国公主嫁给他，这是唐朝第一次把皇帝的亲生女儿嫁到塞外。次年他去世，宁国公主后来回到唐朝。在今蒙古国发现的希内乌苏碑（又称磨延啜碑）记述了他的事迹。
sources: []
recalled:
  - 《旧唐书·回纥传》
  - 《新唐书·回鹘传》
  - 希内乌苏碑
