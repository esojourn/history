name: 德凯巴鲁斯
aliases: [德塞巴鲁斯, 德切巴尔]
role: 达契亚国王
summary: 达契亚末代国王，两度与罗马交战，公元 106 年兵败自杀。
body: |-
  德凯巴鲁斯是多瑙河以北达契亚人的王，都城在喀尔巴阡山中的萨尔米泽格图萨。他的出身和生年没有记载。据卡西乌斯·狄奥，前一位王杜拉斯因为他善于用兵，主动把王位让给了他，时间在公元 87 年前后。狄奥说他懂得何时进、何时退，胜了知道怎样用，败了知道怎样收拾。

  图密善在位时，达契亚人渡河攻入默西亚，罗马的禁卫军长官福斯库斯率军反击，兵败身死。88 年罗马军在塔佩获胜。次年双方议和：他名义上做罗马的附庸，罗马每年给他一笔钱，还派工匠帮他修筑工事。

  图拉真不肯照旧付钱。101 至 102 年的第一次战争后，他被迫交出武器和工匠、拆毁堡垒。105 年战事再起，次年王都陷落，他带少数随从出逃，被罗马骑兵追上，自刎而死，图拉真纪功柱上刻有这一幕。1965 年在希腊腓立比出土一块墓碑，墓主是骑兵军官提比略·克劳狄乌斯·马克西穆斯，碑文说是他把德凯巴鲁斯的头颅带给了图拉真。
sources: []
recalled:
  - 卡西乌斯·狄奥《罗马史》卷 67 第 6—7 章、卷 68 第 6—14 章
  - 图拉真纪功柱浮雕
  - 腓立比出土提比略·克劳狄乌斯·马克西穆斯墓碑
