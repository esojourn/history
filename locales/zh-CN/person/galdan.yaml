name: 噶尔丹
aliases: [博硕克图汗]
role: 准噶尔汗国的首领
summary: 准噶尔首领，统一卫拉特诸部，东攻喀尔喀，被康熙帝击败后死去。
body: |-
  噶尔丹是卫拉特蒙古准噶尔部首领巴图尔珲台吉的儿子。卫拉特就是明代的瓦剌。他少年时被送到西藏，在五世达赖喇嘛门下学习佛法。康熙十年（1671 年）他的哥哥僧格被异母兄弟杀害，噶尔丹从西藏返回，夺取了准噶尔部的统治权，此后统一了卫拉特各部，又向南控制了天山南路的叶尔羌汗国，五世达赖喇嘛授予他“博硕克图汗”的称号。

  康熙二十七年（1688 年）噶尔丹借口喀尔喀蒙古土谢图汗杀害他的弟弟，率军东进，大败喀尔喀，喀尔喀各部向南逃入漠南，请求清朝保护。康熙二十九年（1690 年）噶尔丹以追击喀尔喀为名，深入到距北京只有七百里的乌兰布通，清军在这里与他激战，他趁夜撤走。次年康熙帝在多伦诺尔会盟喀尔喀各部，喀尔喀从此正式归附清朝。

  康熙三十五年（1696 年）康熙帝分三路亲征噶尔丹，西路清军在昭莫多大败噶尔丹，他的妻子阿奴可敦战死，部众溃散。此时噶尔丹的侄子策妄阿拉布坦已经在伊犁一带夺取了准噶尔的大本营，噶尔丹无处可归。康熙三十六年（1697 年）康熙帝第三次亲征，噶尔丹在阿尔泰山以东一带去世，清朝的记载说他服毒自尽，另有记载说他病死（另见“康熙亲征噶尔丹”条）。此后准噶尔在策妄阿拉布坦和他的后代统治下继续与清朝对抗，直到乾隆年间被清朝平定。
sources: []
recalled:
  - 《清圣祖实录》
  - 《亲征平定朔漠方略》
  - 《清史稿·藩部传》
