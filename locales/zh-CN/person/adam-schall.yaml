name: 汤若望
aliases: [约翰·亚当·沙尔·冯·贝尔, 通玄教师]
role: 耶稣会来华传教士，钦天监监正
summary: 德国耶稣会士，清初任钦天监监正，受顺治帝礼遇，晚年遭历狱。
body: |-
  汤若望是德国科隆人，1611 年在罗马加入耶稣会，学习神学和天文、数学，1619 年到达澳门，1623 年进入北京。他先在西安传教，崇祯三年（1630 年）被召到北京，在徐光启主持的历局中参与编修《崇祯历书》，又奉命为明朝铸造火炮。

  清军入关后，汤若望留在北京，把根据西法修订的新历献给清廷，被采用为《时宪历》，他也被任命为钦天监监正，这是西方传教士第一次主持中国的天文机构。顺治帝对他十分尊重，常常召见他，称他为“玛法”，封他为“通玄教师”，赐给他很高的官衔。他借此在北京建造了宣武门内的天主教堂（即南堂）。

  顺治帝去世后，康熙三年（1664 年）钦天监官员杨光先上书攻击汤若望，指责他的历法错误、为顺治帝的皇子选择葬期不吉，又说天主教图谋不轨。辅政大臣鳌拜等人把汤若望和南怀仁等传教士逮捕下狱，汤若望被判处死刑，钦天监中信教的李祖白等五名中国官员被处死（另见“康熙历狱”条）。次年北京发生地震，加上孝庄太皇太后的干预，汤若望获释，但已中风瘫痪，康熙五年（1666 年）在北京去世。康熙帝亲政后为他平反。
