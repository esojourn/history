name: 伯颜
aliases: [淮安王]
role: 元朝丞相、统帅
summary: 元朝丞相、统帅，率元军沿长江东下，迫使南宋朝廷在临安投降。
body: |-
  伯颜是蒙古八邻部人，生于 1236 年，在伊利汗国旭烈兀的帐下长大。至元二年（1265 年）他作为伊利汗国的使臣，奉旭烈兀之命到元朝奏事，忽必烈见他有才干，把他留在身边，不久任为中书左丞相。

  至元十一年（1274 年）元军攻下襄阳的次年，忽必烈以伯颜为统帅大举伐宋。元军从襄阳顺汉水入长江，沿江东下，沿途宋将多因吕文焕的劝降而归附。至元十二年（1275 年）伯颜在丁家洲击败贾似道统率的宋军主力，随后攻下建康。次年正月元军兵临临安，南宋谢太后奉表投降，伯颜进入临安，把宋恭帝等人押送北方（另见“临安投降”条）。据《元史》，伯颜统兵二十万人而像指挥一个人一样，进入临安后约束部下，秋毫无犯。他派人封存南宋的府库，收取宫中的图书、礼器和档案，运往大都。

  此后伯颜回朝任职，至元二十六年（1289 年）起他镇守和林，防御窝阔台的后裔海都。至元三十一年（1294 年）忽必烈去世，伯颜在朝中主持大局，拥立元成宗即位，次年去世，后追封淮安王。他也能作诗，有几首作品流传下来。元朝后期另有一位权臣伯颜（蔑儿乞部人，元顺帝初年专权，后被侄子脱脱逐出朝廷），与他是两个人。
sources: []
recalled:
  - 《元史·伯颜传》
  - 刘敏中《敕赐淮安王庙碑》
