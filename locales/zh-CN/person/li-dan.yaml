name: 唐睿宗
aliases: [李旦, 相王]
role: 皇帝
summary: 唐高宗和武则天的幼子，两次即位，第一次由武则天临朝，第二次两年后让位给李隆基。
body: |-
  李旦是唐高宗的第八子、武则天的幼子，龙朔二年（公元 662 年）生于长安。嗣圣元年（684 年）武则天废中宗，立他为帝，但让他住在别殿，不能参与政事，朝政由武则天决断。天授元年（690 年）武则天称帝，他降为皇嗣，改姓武。圣历元年（698 年）庐陵王李显被召回立为太子，他改封相王。此后他行事谨慎，避免卷入宫廷争斗。

  景龙四年（710 年）中宗去世，他的第三子李隆基与太平公主起兵诛杀韦后，随后拥立他复位。他立功劳最大的李隆基为太子，而不是长子李成器。在位期间，太平公主与太子李隆基争权，他难以调和。延和元年（712 年）八月，他传位给李隆基，自称太上皇，但仍掌管三品以上官员的任免和重大政事。次年七月玄宗诛杀太平公主一党后，他把权力全部交出。开元四年（716 年）六月他去世，年五十五。
sources: []
recalled:
