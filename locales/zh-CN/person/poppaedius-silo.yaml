name: 波派迪乌斯·西洛
aliases: [昆图斯·波派迪乌斯·西洛, 庞培迪乌斯·西洛]
role: 马尔西人首领、同盟者一方的执政官
summary: 马尔西人首领，同盟者战争中意大利一方的两名执政官之一，战死。
body: |-
  昆图斯·波派迪乌斯·西洛，意大利中部马尔西人的首领，生年不详。马尔西人与罗马结盟已有两百年，要为罗马出兵，却没有公民权。他是保民官李维乌斯·德鲁苏斯的朋友。普鲁塔克讲过一个故事：他住在德鲁苏斯家里时，逗四岁的小加图为同盟者说情，孩子不肯，他把孩子拎到窗外作势要扔，孩子仍不松口。

  据狄奥多罗斯，公元前 91 年他曾带一万名暗藏武器的人前往罗马，打算胁迫元老院，途中被人劝回。同年秋德鲁苏斯被刺，各族秘密交换人质准备起事。年底皮凯努姆的阿斯库卢姆城居民杀死前来查问的罗马大法官，同盟者战争爆发，罗马人也称之为“马尔西战争”。

  起事各族在科尔菲尼乌姆建都，改名“意大利卡”，仿照罗马设元老院，选出两名执政官，铸造钱币。西洛是两名执政官之一，统领北线的马尔西人等族，另一人是萨莫奈人帕皮乌斯·穆提鲁斯。前 90 年他伏击杀死罗马将领凯皮奥。

  罗马从前 90 年底起陆续立法，把公民权给予没有叛离和放下武器的同盟者，起事各族逐渐瓦解。马尔西人投降后，西洛转到萨莫奈人那里继续作战；前 88 年他在与罗马将领梅特卢斯·庇乌斯所部交战时阵亡。
sources: []
recalled:
