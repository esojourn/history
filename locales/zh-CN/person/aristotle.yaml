name: 亚里士多德
aliases: []
role: 哲学家、科学家
summary: 柏拉图的学生、亚历山大的老师，创办吕克昂学园，著述遍及各门学问。
body: |-
  公元前 384 年生于希腊北部卡尔基狄刻半岛的斯塔基拉。父亲尼科马科斯是马其顿国王阿敏塔斯三世的御医。他早年丧父，由亲戚普罗克塞诺斯抚养。前 367 年他十七岁，到雅典进入柏拉图的学园，在那里学习和教书约二十年。

  前 347 年柏拉图去世，学园由斯彪西波接掌，他离开雅典，到小亚细亚阿索斯投奔同学出身的当地统治者赫尔米亚斯，娶了赫尔米亚斯的侄女（一说养女）皮提亚斯。约前 345 年他移居莱斯博斯岛的米提利尼，与当地人提奥弗拉斯托斯一起观察研究动植物，他的生物学著作里有许多材料出自这一带的海岸。前 343 年或前 342 年，马其顿国王腓力二世请他去教导十三岁的王子亚历山大，授课地点在米埃扎。

  前 335 年他回到雅典，在城东吕克昂的体育场一带租屋讲学。因为那里有供散步的廊道，他的学派后来被称作“漫步派”（逍遥派）。他在这里主持教学和研究十二年，并组织学生搜集资料，例如汇编了一百五十八个城邦的政制，其中只有《雅典政制》在 1890 年前后从埃及出土的纸草上重新发现。

  前 323 年亚历山大的死讯传来，雅典反马其顿的情绪高涨，有人以他多年前为赫尔米亚斯写的一首颂诗为据，控告他不敬神。他退到母亲家乡、优卑亚岛的卡尔基斯，相传他说不愿让雅典人再一次对哲学犯罪，指的是苏格拉底之死。前 322 年他在卡尔基斯病逝，享年六十二岁。第欧根尼·拉尔修抄录了他的遗嘱。吕克昂由提奥弗拉斯托斯接掌。

  他公开发表过的对话体作品已经失传，流传下来的是讲稿性质的论著，公元前 1 世纪经罗得岛的安德罗尼科斯整理编定。其中有后世合称《工具论》的逻辑著作，创立了三段论；有《物理学》《论天》《论生灭》《论灵魂》和《动物志》等自然著作；有《形而上学》，讨论“作为存在的存在”，提出质料与形式、潜能与现实以及四因的学说；有《尼各马可伦理学》《政治学》，还有《修辞学》和《诗学》。他不接受柏拉图那种与事物分离的理念，认为形式就在具体事物之中。他的学说经阿拉伯和拉丁世界的翻译与注释，在中世纪成为经院哲学的基础。
sources: []
recalled:
  - 第欧根尼·拉尔修《名哲言行录》卷五
  - 普鲁塔克《亚历山大传》第 7—8 章
  - 斯特拉波《地理志》卷十三第 1 章第 54 节
