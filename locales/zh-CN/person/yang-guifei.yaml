name: 杨贵妃
aliases: [杨玉环, 杨太真]
role: 贵妃
summary: 唐玄宗的贵妃，原为玄宗之子寿王的王妃，备受宠爱，756 年在马嵬驿被赐死。
body: |-
  杨贵妃名玉环，父亲杨玄琰曾任蜀州司户，她的出生地有蜀州、容州、弘农等不同说法。她幼年丧父，由在河南府任官的叔父杨玄璬抚养。开元二十三年（公元 735 年）她被册封为玄宗之子寿王李瑁的王妃。

  开元二十五年（737 年）玄宗宠爱的武惠妃去世，玄宗郁郁不乐，有人说寿王妃美貌出众。开元二十八年（740 年）前后，玄宗让她出家为女道士，号太真，住在宫中，借此脱离寿王妃的身份；另为寿王娶了韦氏为妃。天宝四载（745 年）她被册封为贵妃，宫中对她的礼遇等同皇后。她精通音律，擅长歌舞，据说能跳《霓裳羽衣舞》。

  她得宠后，三个姐姐分别被封为韩国夫人、虢国夫人、秦国夫人，堂兄杨国忠官至宰相，杨氏一门权势显赫。据《新唐书》，她喜欢吃荔枝，朝廷命人从南方驿马飞递，送到长安时颜色和味道都还没变。安禄山得宠时请求做她的养子，入宫时先拜她再拜玄宗。

  天宝十五载（756 年）六月，安禄山的叛军攻破潼关，她随玄宗出逃。到马嵬驿时，随行将士杀死杨国忠，又认为她是祸根，要求处死她。玄宗被迫同意，由高力士把她缢死在佛堂中，年三十八（另见“马嵬驿之变”条）。后来白居易的《长恨歌》、陈鸿的《长恨歌传》、清代洪昇的《长生殿》等作品都以她和玄宗的故事为题材，其中许多情节出于文学想象。
sources: []
recalled:
  - 《旧唐书·后妃传》
  - 《新唐书·后妃传》
  - 《资治通鉴》卷二百一十四至二百一十八
