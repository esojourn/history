name: "罗素"
aliases: ["如瑟立", "查尔斯·泰兹·罗素"]
role: "耶和华见证人会前身的创始人"
summary: "匹兹堡商人出身的圣经研究者，所创的“圣经学生”团体后来成为耶和华见证人会。"
body: |-
  《历史的轨迹》第四十五章说，耶和华见证人会到 1931 年才定这个名字，此前曾称“千禧年曙光派”“国际圣经学生会”和“罗素派”，最后一个名称来自创始人罗素。他以讲基督再来吸引了很多人，1872 年在匹兹堡第一次正式把跟随者组织起来，所著的书印行了一千三百万本。1909 年总部迁到布鲁克林，1939 年改名为“守望台圣经与单张协会”。1916 年罗素去世，拉瑟福法官继任领袖，1942 年诺尔再继任。

  书中说，该会信徒人人都是传道人，不收什一，但为见证和宣教的奉献非常慷慨，正式刊物《守望台》每期印三百七十万份；他们反对向国旗敬礼和服兵役。书中认为这一派的教义许多方面与传统基督教冲突：不信三位一体、基督的神性、基督身体复活和基督再来，对代赎、灵魂等也持不合圣经的看法。

  据一般记载，罗素 1852 年生于匹兹堡，经营服装生意，1870 年前后组织查经小组，1879 年创办《锡安守望台》，1884 年成立守望台协会。“耶和华见证人”的名称是拉瑟福时代才采用的。他 1916 年在得克萨斯潘帕附近的火车上去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
