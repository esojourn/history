name: 乾隆帝
aliases: [弘历, 清高宗, 十全老人]
role: 清朝第六位皇帝
summary: 在位六十年，平定准噶尔和回部，编纂《四库全书》，晚年宠信和珅。
body: |-
  弘历是雍正帝的第四个儿子，据说少年时就受到祖父康熙帝的喜爱。雍正帝按照秘密立储的制度，早就把他的名字藏在“正大光明”匾后。雍正十三年（1735 年）雍正帝去世，弘历即位，次年改元乾隆。

  乾隆帝即位之初，宣称施政要“宽严相济”，对雍正年间的一些严苛政策加以调整，释放了被囚禁的宗室，平反了部分冤案。他在位期间，清朝的人口和耕地大幅增加，社会经济繁荣，史家把康熙、雍正、乾隆三朝合称为“康乾盛世”。

  乾隆帝多次用兵，自称“十全武功”，其中最重要的是平定准噶尔和天山南路的大小和卓叛乱（另见“平定准噶尔”条），清朝在天山南北设立伊犁将军，统一了新疆，清朝的疆域达到最大。此外还有两次平定大小金川、进攻缅甸、出兵安南、两次反击廓尔喀等，其中有些战争耗费巨大而收效有限。他六次南巡，修建了大量园林宫殿，开支浩繁。

  在文化上，他组织编纂了《四库全书》（另见“《四库全书》编成”条），同时借修书之机大规模查禁、销毁和删改“违碍”书籍，文字狱也达到高峰（另见“清代文字狱”条）。乾隆五十八年（1793 年）英国派马戛尔尼使团来华，要求扩大通商，乾隆帝在给英王的敕谕中以“天朝物产丰盈，无所不有”为由拒绝（另见“马戛尔尼使团”条）。

  乾隆帝晚年宠信和珅，吏治腐败，各地民变增多。乾隆六十年（1795 年）他宣布传位给皇十五子颙琰，表示不敢超过祖父康熙帝在位六十一年，次年改元嘉庆，他自称太上皇，仍然掌握大权。嘉庆四年（1799 年）正月他在北京去世，年八十九岁，是中国历史上实际执政时间最长、寿命最长的皇帝。他一生写诗四万多首，书画收藏极为丰富。
