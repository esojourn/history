name: 张柬之
aliases: [张孟将, 汉阳王]
role: 宰相
summary: 狄仁杰推荐的宰相，八十岁时主持神龙政变，逼武则天传位于中宗，后被贬死。
body: |-
  张柬之字孟将，襄州襄阳人，进士出身，长期在地方任职，到晚年才得到重用。据《资治通鉴》，武则天让狄仁杰推荐人才，狄仁杰推荐了张柬之，说他虽然年老，却是宰相之才；武则天先任他为洛州司马，后来狄仁杰再次推荐，才升为秋官侍郎。长安四年（公元 704 年），姚崇在出镇灵武之前也推荐了他，他以八十岁的高龄任宰相。

  当时武则天病重，张易之、张昌宗兄弟侍候左右，朝臣担心他们作乱。神龙元年（705 年）正月，张柬之与崔玄暐、桓彦范、敬晖、袁恕己等人联络羽林军将领，拥太子李显率兵入宫，杀死张易之兄弟，逼武则天传位给太子（另见“神龙政变”条）。五人因功封王，张柬之封汉阳王。但中宗信任武三思，五王很快被夺去实权，相继外贬。神龙二年（706 年），张柬之被贬为新州司马，到任后忧愤而死，年八十二。
sources: []
recalled:
  - 《旧唐书·张柬之传》
  - 《新唐书·张柬之传》
  - 《资治通鉴》卷二百七至二百八
