name: 埃拉托色尼
aliases: [ 昔兰尼的埃拉托色尼 ]
role: 学者，亚历山大图书馆馆长
summary: 希腊化时代学者，主持亚历山大图书馆，用两地夏至日影推算出地球周长。
body: |-
  埃拉托色尼生于北非的希腊城市昔兰尼。《苏达辞书》说他生于第 126 届奥林匹亚纪（公元前 276—前 272 年），今人多取前 276 年前后。他年轻时到雅典求学，斯特拉波说他师从过斯多亚派的芝诺和基俄斯的阿里斯通等人。托勒密三世即位后召他到亚历山大，约前 245 年起主持亚历山大图书馆，并担任王子（后来的托勒密四世）的老师。

  他的著作都已散佚，只有后人的引述留存。最著名的工作是测算地球周长：据克莱奥迈德斯转述，他比较夏至正午赛伊尼和亚历山大的日影，推得周长为二十五万斯塔德；斯特拉波等人则记作二十五万二千斯塔德。他著有三卷《地理学》，用经纬线划分已知世界，内容主要靠斯特拉波的引述和批评流传下来。他还测定了黄赤交角，编订了从特洛伊战争起算的年表；数论中筛选素数的“埃拉托色尼筛法”因尼科马库斯的记载而归在他名下。阿基米德的《方法》就是写给他的。

  《苏达辞书》说，他因博学而被称作“五项全能者”，也有人称他“贝塔”（希腊字母第二个），意思是样样都只居第二；又说他晚年失明，绝食而死，享年八十。卒年一般定在前 194 年前后。
sources:
  - 斯特拉波《地理学》第 1 卷第 2 章第 2 节，第 2 卷第 5 章第 7 节 https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Strabo/home.html
  - 英文维基百科“Eratosthenes”条（生卒年诸说、任馆长年份） https://en.wikipedia.org/wiki/Eratosthenes
recalled:
  - 《苏达辞书》“埃拉托色尼”条（生年、绰号、去世）
  - 克莱奥迈德斯《论天体的圆周运动》第 1 卷第 10 章（一作第 1 卷第 7 章）
