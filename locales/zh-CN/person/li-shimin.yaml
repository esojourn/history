name: 唐太宗
aliases: [李世民, 秦王, 天可汗]
role: 皇帝
summary: 唐朝第二位皇帝，统一战争中的主帅，经玄武门之变即位，在位期间史称“贞观之治”。
body: |-
  李世民是唐高祖李渊和窦皇后的次子，生于武功。据《旧唐书》，他生于隋开皇十八年十二月，按公历已是公元 599 年初；但按史书所记他去世时的年岁推算，应生于 598 年，各书说法不一。隋末他随父亲在太原，参与了晋阳起兵；唐朝建立后封秦王。

  唐初统一战争中，他是最主要的统帅。武德元年（618 年）他在浅水原击败薛仁杲，平定陇右；武德三年（620 年）在柏壁击败宋金刚，收复河东，收降了尉迟恭；武德四年（621 年）围攻洛阳的王世充，在虎牢擒获前来救援的窦建德，王世充随即投降（另见“虎牢之战”条）。高祖为他特设“天策上将”之位。他在秦王府开文学馆，延揽房玄龄、杜如晦等十八学士，与太子李建成的冲突日益激烈。武德九年（626 年）六月，他在玄武门伏兵杀死李建成和齐王李元吉，随即被立为太子，八月即位，次年改元贞观（另见“玄武门之变”条）。

  在位期间，他任用房玄龄、杜如晦、魏征、长孙无忌等人，重视纳谏，修订律令，精简官员，与民休息，后世称为“贞观之治”（另见该条）。贞观四年（630 年）李靖等人攻灭东突厥，西北各族君长尊他为“天可汗”。此后唐朝又灭高昌、击败吐谷浑和薛延陀；贞观十五年（641 年）他把文成公主嫁给吐蕃赞普松赞干布。他的言论后来由吴兢编成《贞观政要》。

  晚年他营建宫室、用兵渐多。贞观十七年（643 年）太子李承乾谋反被废，他改立晋王李治为太子。贞观十九年（645 年）他亲征高句丽，攻安市城不下，冬季撤军。贞观二十三年（649 年）五月，他在终南山翠微宫的含风殿去世，葬于昭陵。
sources: []
recalled:
  - 《旧唐书·太宗纪》
  - 《新唐书·太宗纪》
  - 吴兢《贞观政要》
  - 《资治通鉴》卷一百八十三至一百九十九
