name: 董其昌
aliases: [思白, 香光居士, 文敏]
role: 书画家、书画理论家
summary: 书画家，官至南京礼部尚书，提出绘画“南北宗”论，影响清代画坛。
body: |-
  董其昌是松江府华亭（今上海市松江区）人，万历十七年（1589 年）考中进士，入翰林院，曾任皇长子朱常洛的讲官。此后他多次辞官家居，又多次被起用，天启年间官至南京礼部尚书，崇祯年间以礼部尚书掌詹事府事，后来告老还乡。

  董其昌的书法吸收了钟繇、王羲之、颜真卿、米芾等人的长处，风格秀逸疏朗，在明末清初影响很大，康熙帝尤其喜爱他的字。他的山水画学习董源、巨然和元四家，注重笔墨的趣味。他在画论中借用禅宗南北二宗的说法，把唐代以来的山水画家分为南北两宗，推崇以王维为首、讲究文人笔墨的“南宗”，贬抑以李思训为首的“北宗”，这一理论对清代的“四王”等正统画派影响深远，也受到后人的批评。

  董其昌家族在松江拥有大量田产，据记载他的家人和仆役横行乡里，万历四十四年（1616 年）当地百姓烧毁了他的住宅，史称“民抄董宦”。崇祯九年（1636 年）他在家乡去世，后来追谥“文敏”。
sources: []
recalled:
  - 《明史·文苑传·董其昌》
  - 董其昌《画禅室随笔》
  - 佚名《民抄董宦事实》
