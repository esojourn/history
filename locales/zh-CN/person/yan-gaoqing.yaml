name: 颜杲卿
aliases: []
role: 常山太守
summary: 颜真卿的堂兄，安史之乱时任常山太守，起兵抗燕，城破被俘，在洛阳骂贼而死。
body: |-
  颜杲卿是颜真卿的堂兄，以门荫入仕，天宝末年任常山太守，常山是安禄山的辖区。天宝十四载（公元 755 年）安禄山起兵南下，经过常山，他不得不出城迎接。随后他与长史袁履谦定计，诱杀了安禄山派来镇守土门的部将李钦凑，擒获高邈、何千年，打通了井陉要道。他派儿子颜季明与堂弟颜真卿联络，河北十七郡一度响应，归附朝廷。

  天宝十五载（756 年）正月，史思明、蔡希德率军围攻常山。城中守备未完，粮尽水绝，坚守六天后城破，颜杲卿与袁履谦被俘，送到洛阳。据《新唐书》，他见到安禄山后瞋目怒骂，被割去舌头，仍骂不绝口，最终与袁履谦一同遇害。他的儿子颜季明等家族中三十多人也在这场变乱中被杀。两年后颜真卿为颜季明写下的祭文，就是《祭侄文稿》。
sources: []
recalled:
