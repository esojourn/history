name: 德拉古
aliases: [德拉孔]
role: 雅典立法者
summary: 约公元前 621 年为雅典制定了最早的成文法，以严酷著称。
body: |-
  德拉古的生平几乎一无所知。古代年代学家把他的立法定在公元前 621 年或前 620 年。在此以前，雅典的法律是口头相传的习惯，由贵族出身的官员掌握和解释；德拉古把它写成了条文，这是雅典最早的成文法。

  他的法律以严酷闻名。据普鲁塔克，几乎所有罪行，包括偷窃蔬菜水果，都处以死刑；公元前 4 世纪的演说家德马德斯说，德拉古的法律不是用墨水而是用血写的。约三十年后梭伦改革，废除了他的全部法律，只保留关于杀人的部分。这一部分区分了故意杀人和非故意杀人，并规定由城邦而不是死者的家族来裁断。前 409 年至前 408 年雅典人把它重新刻在石碑上，残石留存至今，是了解他的立法最直接的材料。

  亚里士多德学派的《雅典政制》里还记有一套“德拉古的政制”，现代学者多认为是后人的伪托。关于他死在埃吉那岛剧场的故事出自很晚的辞书，不足为据。
sources: []
recalled:
  - 普鲁塔克《梭伦传》第 17 章
  - 《雅典政制》第 4、7 章
  - 重刻德拉古杀人法的铭文（IG I³ 104）
