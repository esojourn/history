name: 魏源
aliases: [默深]
role: 思想家、史学家
summary: 湖南邵阳人，受林则徐嘱托编成《海国图志》，提出“师夷长技以制夷”。
body: |-
  魏源是湖南邵阳人，早年在北京求学，与龚自珍交好，两人并称“龚魏”。他长期在江苏布政使贺长龄、两江总督陶澍等人的幕府中做事，协助编辑《皇朝经世文编》，参与筹划漕粮海运和两淮盐政改革，主张经世致用。

  鸦片战争期间，魏源曾在浙江参与审问英国俘虏。道光二十一年（1841 年）林则徐被遣戍伊犁，途经镇江时与魏源相会，把他主持编译的《四洲志》等资料交给魏源，嘱托他继续编写。魏源以此为基础，搜集各种资料，在道光二十二年（1842 年）编成《海国图志》五十卷，后来增补到一百卷，介绍世界各国的地理、历史、政治和军事技术。他在序言中提出“为以夷攻夷而作，为以夷款夷而作，为师夷长技以制夷而作”。

  魏源又著有《圣武记》，记述清朝的军事历史。道光二十五年（1845 年）他考中进士，后来任江苏兴化知县、高邮知州，咸丰三年（1853 年）因延误驿报被革职。晚年他潜心佛学，咸丰七年（1857 年）在杭州去世。《海国图志》在国内一度没有引起足够的重视，传到日本后被多次翻刻，对日本幕末的知识分子有一定影响。
sources: []
recalled:
  - 魏源《海国图志》叙
  - 《清史稿·魏源传》
  - 魏耆《邵阳魏府君事略》
