name: 孝庄文皇后
aliases: [布木布泰, 孝庄太后, 博尔济吉特氏]
role: 皇太极的妃子，顺治帝之母，康熙帝的祖母
summary: 顺治帝的生母、康熙帝的祖母，历经两朝辅佐幼主，在清初政局中影响很大。
body: |-
  孝庄文皇后名布木布泰，姓博尔济吉特，是蒙古科尔沁部贝勒寨桑的女儿。天命十年（1625 年）她十三岁时嫁给皇太极，她的姑姑哲哲是皇太极的正妻（后来的孝端文皇后），她的姐姐海兰珠后来也嫁给了皇太极。崇德元年（1636 年）她被封为永福宫庄妃，崇德三年（1638 年）生下福临。

  崇德八年（1643 年）皇太极去世，福临在诸王的妥协下即位，她被尊为皇太后。顺治年间，她在宫中维护儿子的地位，调和满洲贵族之间的关系。关于她与摄政王多尔衮的关系，民间有“太后下嫁”的说法，史学界争论很久，没有确证。顺治帝亲政后，母子在立后等问题上也有过分歧。

  顺治十八年（1661 年）顺治帝去世，八岁的孙子玄烨即位，她被尊为太皇太后。她亲自教养玄烨，在四大臣辅政期间维持朝局，支持玄烨亲政和铲除鳌拜，三藩之乱时也给予玄烨很大支持。康熙二十六年十二月（公历已是 1688 年 1 月）她在北京去世，年七十五岁。据记载，她生前嘱咐不要与皇太极合葬，康熙帝在清东陵附近为她修建了暂安奉殿，直到雍正年间才建成昭西陵。

  孝庄文皇后在清代被视为贤后的典范，后世小说、戏剧和影视作品中关于她的许多情节，如劝降洪承畴等，多出于传说或演绎，史料中缺乏可靠的记载。
sources: []
recalled:
  - 《清史稿·后妃传》
  - 《清圣祖实录》
