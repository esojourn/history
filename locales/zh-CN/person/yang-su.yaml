name: 杨素
aliases: [杨处道, 楚公]
role: 尚书令
summary: 隋朝名将和权臣，伐陈时率水军出三峡，平定江南叛乱和汉王杨谅，助杨广夺得太子之位。
body: |-
  杨素字处道，弘农华阴人，出身北周官宦之家，少年时落拓有大志。他在北周随武帝灭北齐，以战功升迁。杨坚辅政时，他投向杨坚，参与平定尉迟迥一方的叛乱。

  隋朝伐陈之前，杨素任信州总管，在永安建造大型战舰，最大的名为“五牙”，据《隋书》本传，上起五层楼，高百余尺，可容战士八百人。开皇八年（公元 588 年）伐陈，他率水军顺长江出三峡东下，击破陈军在狼尾滩、岐亭等处的防线，与荆州方面的隋军会合。陈朝灭亡后不久，江南各地豪强纷纷起兵反隋，杨素率军转战江南，在开皇十年（590 年）前后将其平定。

  开皇十三年（593 年），文帝命他监造仁寿宫，据记载工程严急，役夫死者以万计；宫成之后文帝起初嫌其奢华而不悦，独孤皇后却加以赞许，杨素反而得到赏赐。此后他多次领兵击败突厥。他与晋王杨广结交，在废立太子一事中出力很多。仁寿四年（604 年）炀帝即位，文帝的幼子汉王杨谅在并州起兵，杨素率军将其平定。

  他位至尚书令、司徒，封楚公，家中僮仆、姬妾、田宅极多，史书多记他的豪奢和骄横。炀帝表面尊崇他，内心猜忌。大业二年（606 年）他病重，据《隋书》本传，炀帝常派名医诊治，又暗中询问病情，唯恐他不死；杨素自知如此，不肯服药，不久去世。他的儿子杨玄感在大业九年（613 年）起兵反隋，兵败被杀，杨家也因此被族灭。
sources: []
recalled:
  - 《隋书·杨素传》
  - 《资治通鉴》卷一百七十六至一百八十
