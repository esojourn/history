name: 柳永
aliases: [柳三变, 柳七, 柳屯田]
role: 北宋词人
summary: 北宋词人，大量创作慢词，作品在市井间广为传唱，代表作有《雨霖铃》。
body: |-
  柳永原名三变，排行第七，所以又称柳七，是福建崇安人，出身官宦之家，生卒年都没有确切记载。他年轻时到开封应试，屡次落第，常常出入歌楼酒肆，为乐工歌妓填写歌词。据吴曾《能改斋漫录》，他曾写《鹤冲天》，其中有“忍把浮名，换了浅斟低唱”的句子，后来仁宗在放榜时说：“且去浅斟低唱，何要浮名？”把他黜落。这个故事是否属实，难以确定。

  景祐元年（1034 年）他终于考中进士，此后做过睦州推官、余杭县令等地方官，最后官至屯田员外郎，所以人称“柳屯田”。他的晚年情况和卒年都不清楚，一般认为他死于皇祐年间前后。宋人笔记中有他死后家无余财、由歌妓们凑钱安葬的说法，属于传闻。

  柳永是第一个大量创作慢词的词人，他吸收市井的口语和新兴的曲调，善于铺叙景物、描写羁旅行役和离别之情，代表作有《雨霖铃》（“寒蝉凄切”）、《八声甘州》、《望海潮》等。据叶梦得《避暑录话》，有一位从西夏回来的官员说，“凡有井水饮处，即能歌柳词”。他的作品在当时流传极广，但也常被士大夫批评为格调不高。他对宋词的发展影响很大，苏轼、周邦彦等人都受到他的影响。
sources: []
recalled:
  - 吴曾《能改斋漫录》卷十六
  - 叶梦得《避暑录话》卷下
  - 《乐章集》
