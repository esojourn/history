name: 刘曜
aliases: [刘永明]
role: 前赵皇帝
summary: 刘渊的族子，攻陷洛阳、长安的主将，后在长安称帝，改国号为赵，被石勒俘杀。
body: |-
  刘曜字永明，是刘渊的族子，幼年丧父，由刘渊抚养，生年不详。《晋书·载记》说他喜读书，善属文，又有武力。刘渊建国后，他是主要的将领。永嘉五年（公元 311 年）他与王弥等攻陷洛阳，建兴四年（316 年）又围攻长安，迫使晋愍帝出降。

  麟嘉三年（318 年）刘聪死后，靳准在平阳杀尽刘氏。他从长安起兵东进，途中即皇帝位，次年把都城定在长安，改国号为赵，史称前赵。他在长安设立太学，选拔百姓中的子弟入学，又先后平定关陇一带的氐、羌和割据陇上的陈安，迫使凉州的张茂称藩。

  石勒本是汉国的将领，这时在襄国自称赵王，与他决裂，两国以洛阳一带为界多次交战。光初十一年（328 年），他在高候击败石虎，进围洛阳的金墉城。年底石勒亲自率军来救，在洛阳城西决战。据载记，他战前饮酒过量，坐骑陷入石渠，负伤被俘。他被送到襄国，不肯写信劝儿子投降，后来被杀。次年他的儿子们弃长安西走，在上邽被石虎消灭，前赵灭亡。
sources: []
recalled:
  - 《晋书·刘曜载记》
  - 《资治通鉴》卷八十七至九十四
