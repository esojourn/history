name: 张载
aliases: [张横渠, 横渠先生, 张子厚]
role: 北宋理学家
summary: 北宋理学家，关学的创立者，著有《正蒙》《西铭》，提出“气”的学说。
body: |-
  张载生于天禧四年（公元 1020 年），祖籍大梁，生于长安。父亲在涪州知州任上去世后，家人无力返乡，侨居在凤翔郿县的横渠镇，所以人称横渠先生。据《宋史》本传，他少年时喜欢谈论兵法，二十一岁时上书范仲淹，想组织民兵收复洮西之地。范仲淹认为他可以成大器，劝他说儒者自有名教可乐，何必谈兵，让他读《中庸》。他由此转而钻研儒家经典，又遍读佛、道之书，最后回到六经。

  嘉祐元年（1056 年）他在京城开封坐虎皮讲《周易》，听讲的人很多。一天晚上他与年轻的表侄程颢、程颐讨论《周易》，自认为不及二程，第二天就撤去虎皮，对听讲的人说二程对《周易》的理解比自己深，可以向他们请教。次年他考中进士，此后做过几任地方官。熙宁初年他被召入朝，与王安石意见不合，辞官回到横渠，闭门著书讲学，学生多为关中人，后世称为“关学”。熙宁十年（1077 年）他再次被召入朝，不久因病辞归，途中死在临潼。

  张载的代表作是《正蒙》，他认为宇宙的本体是“太虚”，太虚是气的本来状态，气聚而为万物，散而复归太虚，以此反驳佛、道两家以世界为空、为无的看法。《正蒙》中的《西铭》一篇提出“民吾同胞，物吾与也”，把天地看作父母，把百姓看作同胞，受到程颢、程颐和朱熹的高度推崇。后世流传的“为天地立心，为生民立命，为往圣继绝学，为万世开太平”四句，出自他的语录，文字在流传中有所改动。
sources: []
recalled:
  - 《宋史·道学传·张载》
  - 吕大临《横渠先生行状》
  - 张载《正蒙》
  - 《张子语录》
