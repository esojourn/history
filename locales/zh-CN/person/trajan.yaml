name: 图拉真
aliases: [马尔库斯·乌尔皮乌斯·图拉亚努斯, 他雅努, 特拉扬]
role: 罗马皇帝
summary: 第一位生在行省的罗马皇帝，征服达契亚，在他手里帝国版图最大。
body: |-
  图拉真于公元 53 年 9 月 18 日生在西班牙南部的意大利卡，祖上是迁到那里的意大利移民。父亲靠军功进入元老院，做过执政官和叙利亚总督。他本人在军中多年，91 年任执政官，后来出任上日耳曼总督。97 年 10 月涅尔瓦收他为养子，次年 1 月涅尔瓦去世，他继位。他先在莱茵河和多瑙河巡视防务，99 年才进罗马。他是第一位生在意大利以外的皇帝。

  他两次出兵多瑙河以北的达契亚。101 至 102 年迫使德凯巴鲁斯求和；105 年战事再起，次年攻下王都，德凯巴鲁斯自杀，达契亚成为行省，那里的金矿归了国库。罗马城里的图拉真纪功柱用螺旋而上的浮雕记这两次战争，113 年落成。大马士革的建筑师阿波罗多洛斯为他在多瑙河上架了桥，在罗马修了图拉真广场和市场。106 年他还兼并了纳巴泰人的王国，设阿拉伯行省。

  在内政上，他与元老院相处融洽，扩大了资助意大利贫家子女的抚养金，扩建奥斯蒂亚的港口。小普林尼任比提尼亚总督时与他往来的书信保存至今，其中一封问怎样处置基督徒，他答复说：不必搜捕，匿名告发不予受理，被告发而不肯悔改的要惩办。

  113 年他东征帕提亚，次年把亚美尼亚设为行省，115 年进占美索不达米亚北部，116 年攻下帕提亚的都城泰西封，一直到了波斯湾边。这时新占的地方纷纷反叛，昔兰尼、埃及、塞浦路斯的犹太人也起事，他围攻哈特拉不克，自己又病倒。117 年 8 月初，他在回国途中死于奇里乞亚的塞利努斯。皇后普洛蒂娜随即宣布他临终收养了哈德良，这次收养的真假古人就有怀疑。

  元老院在 114 年授他“最好的元首”称号。据四世纪的欧特罗庇乌斯，后来元老院祝贺新皇帝时说的是：“愿你比奥古斯都更幸运，比图拉真更贤明。”
sources: []
