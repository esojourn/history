name: 颜之推
aliases: [颜介]
role: 学者、文学家
summary: 历仕梁、北齐、北周、隋的学者，自称“三为亡国之人”，著《颜氏家训》。
body: |-
  颜之推字介，祖籍琅邪临沂，祖上随晋室南渡。父亲颜协在湘东王萧绎府中任职，梁中大通三年（公元 531 年）他生于江陵。他自幼承袭家学，博览群书，十九岁就在萧绎手下任职。侯景之乱时，他在郢州被侯景的军队俘虏，几乎被杀。乱平后回到江陵，任散骑侍郎。

  承圣三年（554 年）西魏攻陷江陵，他被掳往关中。两年后，他带着家人冒险乘船顺黄河东下，经过砥柱的险滩逃到北齐，想借道回到江南，恰逢陈霸先代梁建陈，只好留在北齐。他在北齐很受重用，曾在文林馆主持编书，官至黄门侍郎。577 年北齐灭亡，他又入北周；隋朝建立后，被太子杨勇召为学士，不久病逝。他在《观我生赋》中感叹，自己经历梁、北齐、北周三朝的灭亡，“三为亡国之人”。

  他晚年写成的《颜氏家训》二十篇，是告诫子孙的家训，内容包括教子、兄弟、治家、勉学、文章、名实、涉务、养生、归心、书证、音辞等方面。书中记录了许多南北朝的社会风气、南北风俗的差异和他本人的见闻，是研究这一时期社会生活的重要资料，后世把它看作家训类著作的开端。

  他也精通音韵和文字之学。隋初陆法言编《切韵》，据《切韵序》，颜之推是参与讨论音韵的八人之一。他的孙子颜师古是唐初的经学家，五世孙颜真卿是唐代的名臣和书法家。
sources: []
recalled:
  - 《北齐书·文苑传·颜之推》
  - 颜之推《颜氏家训》
