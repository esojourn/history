name: 刘贺
aliases: [昌邑王, 海昏侯, 汉废帝]
role: 昌邑王、海昏侯
summary: 汉武帝之孙，继昭帝为帝仅二十七天即被霍光废黜，后封海昏侯，其墓于南昌出土。
body: |-
  刘贺是汉武帝的孙子，父亲昌邑哀王刘髆是李夫人所生。他幼年继承王位，都昌邑。元平元年（公元前 74 年）昭帝去世，没有儿子，霍光等人以太后的名义召他到长安主持丧事，随后立为皇帝。

  据《汉书·霍光传》所载群臣的奏章，他在赴京途中和即位以后有许多不合礼制的举动，如居丧期间饮酒食肉、与随从游戏无度；奏章说他接受玺印以来的二十七天里，派使者持节向各官署征调索取，共一千一百二十七件事。霍光与群臣联名奏请上官太后，把他废黜。他从昌邑带来的臣属二百余人被处死，罪名是没有尽到辅导的责任；只有屡次劝谏过他的王吉、龚遂等少数人免死。

  他被送回昌邑，原来的王国改为山阳郡。宣帝即位后对他仍有戒心，曾命山阳太守张敞前去察看，张敞回报说他举止迟钝，不足为虑。元康三年（前 63 年）宣帝封他为海昏侯，让他迁到豫章郡。几年后他因与人交谈时言语不当被削减封户，神爵三年（前 59 年）去世。

  2011 年起，考古人员在江西南昌发掘了一座西汉大墓，出土大量金器、铜钱、漆器和竹简，内棺中发现刻有“刘贺”二字的玉印，确认墓主就是他。
sources: []
recalled:
  - 《汉书·武五子传》
  - 《汉书·霍光金日磾传》
  - 南昌西汉海昏侯墓考古发掘的报道
