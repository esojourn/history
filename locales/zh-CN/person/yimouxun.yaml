name: 异牟寻
aliases: []
role: 南诏王
summary: 南诏国王，摆脱吐蕃控制，794 年与唐朝在点苍山会盟，重新归附唐朝。
body: |-
  异牟寻是南诏王阁罗凤的孙子。天宝年间唐朝两次出兵征讨南诏失败，阁罗凤转而依附吐蕃，受封为“赞普钟”（意为赞普之弟）。大历十四年（公元 779 年）阁罗凤去世，异牟寻继位。同年他与吐蕃联兵大举进攻西川，被唐将李晟等人击败，吐蕃因此迁怒南诏，加重对南诏的征调和赋税。

  南诏的清平官郑回原是唐朝的西泸县令，被南诏俘虏后受到重用，他劝异牟寻归附唐朝。唐朝的西川节度使韦皋也多次来信招抚。贞元十年（794 年），异牟寻与韦皋派来的崔佐时在点苍山会盟，随即出兵袭击吐蕃，攻下神川铁桥，唐朝册封他为南诏王（另见“南诏归唐”条）。此后南诏与唐朝联合抵御吐蕃，并派子弟到成都学习。他把都城从太和城迁到阳苴咩城，元和三年（808 年）去世。
sources: []
recalled:
