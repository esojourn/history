name: "查默斯"
aliases: ["托马斯·查默斯", "查麦士"]
role: "苏格兰自由教会的领袖"
summary: "苏格兰牧师、神学教授，1843 年率四百多位牧师退出国家教会，组成自由教会。"
body: |-
  查默斯 1780 年生于法夫郡安斯特拉瑟，在圣安德鲁斯读书，早年任基尔梅尼教区牧师时偏重数学与科学，约 1811 年经历了福音派的归正。1815 年起他在格拉斯哥牧会，组织教区探访与济贫，讲道名动一时；后任圣安德鲁斯和爱丁堡大学的教授。

  《历史的轨迹》第三十九章说，有热心信徒的几次脱离后，苏格兰国家教会灵性低落，加上自由主义渗透，兴起了“温和派”；在平信徒委派制度下，被派的往往是温和派或自由派牧师，而信徒们期望的是忠于传统信仰的牧师。1843 年，四百七十四位牧师在查默斯领导下退出国家教会，组成苏格兰自由教会，史称“大分裂”。

  作者称他不但是忠于传统信仰的真理斗士，也是杰出的讲员、社会改革家、神学教授和宗教领袖。他任自由教会第一任总会议长，1847 年死于爱丁堡。该书说，这时差不多有三分之一的信徒离开了国家教会，但国家教会并未一蹶不振；1874 年平信徒委派权终于废除，1900 年自由教会与联合长老会合并为联合自由教会。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十九章“改革宗教会大受逼迫” https://wellsofgrace.com/books/spiritual/2000years/html/chapter43.html"
recalled:
  - "查默斯《大城镇的基督教与公民经济》"
