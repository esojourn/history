name: 马克西米安
aliases: [马克西米亚努斯, 马克西米安·赫丘利]
role: 罗马皇帝
summary: 戴克里先的同僚，治理帝国西部，退位后复出，被君士坦丁逼死。
body: |-
  马克西米安约在公元 250 年生于西尔米乌姆附近的农家，从军后与戴克里先是同袍。285 年戴克里先立他为副手，派往高卢镇压称作“巴高达”的农民暴动；286 年升为与自己并列的“奥古斯都”，分管西部，常驻米兰。戴克里先以朱庇特自比，给他的称号是“赫丘利”。

  他在莱茵河一线与阿勒曼尼人、法兰克人作战。舰队将领卡劳修斯占据不列颠自立，他渡海征讨没有成功。293 年他的女婿君士坦提乌斯受命为“恺撒”，后来收复了不列颠；他自己在 297 至 298 年到北非平定山地部族。303 年开始的大逼迫，在他治下的意大利和北非执行得很严。

  305 年 5 月 1 日，他与戴克里先同日退位，本非情愿。次年儿子马克森提乌斯在罗马称帝，他复出相助，又把女儿嫁给君士坦丁；不久父子反目，308 年卡农图姆会议迫使他再度退位。310 年他趁君士坦丁在莱茵河用兵时起事，在马西利亚被擒，随后自缢，一般认为是被逼自尽。
sources: []
recalled:
