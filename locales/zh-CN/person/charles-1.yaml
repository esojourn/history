name: "查理一世"
aliases: ["查理一世"]
role: "英格兰、苏格兰与爱尔兰国王"
summary: "斯图亚特王朝国王，与国会开战，兵败受审，1649 年在伦敦被斩首。"
body: |-
  查理一世是詹姆士一世之子，1600 年生于苏格兰邓弗姆林，1625 年即位。他与国会屡次争执征税的权力，1629 年起十一年不召国会。他信任大主教劳德，推行重视礼仪的教会政策，清教徒视之为向天主教靠拢；1637 年起在苏格兰强推公祷书，引发战事，为筹军费不得不在 1640 年重开国会，这就是长期国会。

  《历史的轨迹》第三十一章说，国会处死了斯特拉福和劳德，国王很不高兴，要以叛国罪逮捕下议院五位反对派领袖，下议院拒绝交人；国王于是离开伦敦，到诺丁汉发动战争，英国陷入内战。站在国王一边的是贵族与士绅，称“骑士党”；国会一边多是店员、农夫和少数上层人士，因留短发被讥为“圆颅党”。他亲自去下议院拿人是 1642 年 1 月，8 月在诺丁汉竖起王旗。

  战争初期王军占上风。1645 年内斯比之役王军大败，次年国王投奔苏格兰军队，后来被交给英格兰国会。该书说他被审判后判为暴君、卖国贼、谋杀者及公敌，1649 年 1 月 30 日在伦敦的宫殿前被斩首，围观的群众极多。行刑地点是白厅的国宴厅前。

  他的死使英格兰改行共和，长子查理在 1660 年复辟，称查理二世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
recalled:
  - "审判查理一世的高等法院判决书（1649 年）"
  - "克拉伦登《英国叛乱与内战史》"
