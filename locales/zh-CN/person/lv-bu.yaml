name: 吕布
aliases: [吕奉先, 温侯]
role: 将领
summary: 汉末将领，以勇武著称，先后杀丁原、董卓，夺据徐州，在下邳被曹操擒杀。
body: |-
  据《三国志·魏书·吕布传》，吕布字奉先，五原郡九原人，生年不详。他因骁勇在并州任职，受到刺史丁原的信用。中平六年（公元 189 年）丁原带兵到雒阳，董卓引诱吕布杀死丁原，吞并其部众，任吕布为骑都尉，本传说两人“誓为父子”。

  初平三年（192 年），司徒王允谋诛董卓，联络吕布为内应，由吕布亲手刺杀了董卓。吕布因此被任为奋武将军，封温侯。不到两个月，董卓旧部李傕等攻入长安，吕布战败东逃，先后投奔袁术、袁绍、张杨，都未能久留。

  兴平元年（194 年）曹操东征徐州，留守的陈宫、张邈等人迎吕布为兖州牧，与曹操争夺兖州。相持一年多后吕布战败，投奔徐州的刘备。建安元年（196 年）他趁刘备与袁术交战，袭取下邳，自领徐州，刘备反过来依附于他。本传记载，袁术部将纪灵来攻刘备，吕布在营门立戟，一箭射中戟上小枝，使双方罢兵。

  建安三年（198 年）吕布再次与袁术联合，击破刘备。曹操亲自东征，把他围困在下邳，引水灌城。围城三个月后，吕布的部将捆缚陈宫出降，吕布也下城投降，被曹操缢杀。此事在建安三年十二月，按公历已是 199 年初；不少书籍按年号对应写作 198 年。
sources: []
recalled:
  - 《三国志·魏书·吕布臧洪传》
  - 《后汉书·刘焉袁术吕布列传》
