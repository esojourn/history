name: 顾恺之
aliases: [顾长康, 虎头]
role: 画家
summary: 东晋画家，以人物画和“传神”之论著称，传世有《女史箴图》《洛神赋图》的摹本。
body: |-
  顾恺之字长康，小字虎头，晋陵无锡人，父亲顾悦之做过尚书左丞。他的生卒年没有确切记载，《晋书》本传只说他在义熙初年任散骑常侍，六十二岁死在任上，据此推算，一般认为他生于公元 348 年前后，卒于 409 年前后，另有早几年的说法。

  他年轻时在大司马桓温的幕府任参军，很受桓温亲近。桓温死后，他到墓前凭吊并赋诗哀悼。后来他在荆州刺史殷仲堪手下任参军，又与桓玄交往。本传记载，他曾把一橱自己珍爱的画封好寄放在桓玄那里，桓玄从橱后取走了画，再照原样封好还给他，他见封条如旧而画已不在，只说好画通了灵，变化飞走了，就像人成仙一样。当时人说他有“三绝”：才绝、画绝、痴绝。本传还说他吃甘蔗总是从梢吃到根，说这样是“渐入佳境”。

  他最擅长画人物。《世说新语·巧艺》记载，他画人有时几年不点眼睛，别人问他，他说形体的美丑本来无关紧要，“传神写照，正在阿堵中”，意思是神情全靠眼睛表现。他画裴楷，在脸颊上添了三根毫毛，说这样才显出神采；画谢鲲，把他安排在山岩之间。据唐代张彦远《历代名画记》所引的记载，建康的瓦官寺初建时，他认捐了一大笔钱，然后在寺中闭门画了一壁维摩诘像，开门点睛之日，前来观看的人布施的钱很快超过了他认捐的数目。谢安称他的画是有人类以来所没有的。

  他写过《论画》《魏晋胜流画赞》《画云台山记》等文字，靠《历代名画记》的收录保存下来，是中国最早的一批画论。他的真迹没有流传下来。现存的《女史箴图》《洛神赋图》《列女仁智图》都是后人的摹本，其中《女史箴图》现藏英国伦敦的大英博物馆。
sources: []
recalled:
  - 《晋书·文苑传·顾恺之》
  - 《世说新语·巧艺》
  - 张彦远《历代名画记》卷五
