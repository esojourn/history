name: 耶律阿保机
aliases: [耶律亿, 辽太祖, 天皇帝]
role: 契丹可汗、皇帝
summary: 契丹迭剌部首领，907 年任可汗，916 年称帝建契丹国，926 年灭渤海。
body: |-
  耶律阿保机是契丹迭剌部人，咸通十三年（公元 872 年）生，汉名耶律亿。契丹各部原先由遥辇氏的可汗统领，迭剌部的耶律氏世代掌握军事。阿保机年轻时多次领兵征讨室韦、奚等部，又南下攻掠河东、幽州，俘获大批汉人，声势日盛。据《资治通鉴》《新五代史》，天祐二年（905 年）他与晋王李克用在云州结为兄弟，约定共讨朱温，后来又背约与后梁通好。

  天祐四年（907 年），阿保机取代遥辇氏成为契丹可汗。契丹旧俗，可汗三年一选，他任满后不肯交出权力，他的几个弟弟先后三次发动叛乱，都被他平定。神册元年（916 年），他仿照中原制度称帝，建年号，立长子耶律倍为皇太子，国号契丹，史称辽太祖（“辽”这个国号是后来才用的，见“契丹建国”条）。神册三年（918 年），他在潢水之北兴建皇都，即后来的上京临潢府。

  阿保机重用韩延徽、韩知古、康默记等汉人，在汉人聚居的地方修筑城郭，按中原的方式治理，而对契丹各部仍用部族的旧制，形成了后来“因俗而治”的格局。他还命人创制契丹大字（另见“契丹文字创制”条）。他多次向西、向北用兵，征服了奚、室韦、阻卜等部，天赞三年（924 年）西征到达回鹘故地。

  天赞四年底（926 年初），阿保机亲率大军东征渤海国，很快攻破渤海的都城忽汗城，渤海王大諲譔投降。他把渤海改为东丹国，由皇太子耶律倍统治（另见“契丹灭渤海”条）。同年七月，他在回师途中病死于扶余府，年五十五。皇后述律平随即临朝称制。
sources: []
recalled:
