name: 严复
aliases: [又陵, 几道]
role: 翻译家、思想家
summary: 留学英国的海军学生，翻译《天演论》等西方名著，提出“信、达、雅”。
body: |-
  严复是福建侯官（今福州）人，同治六年（1867 年）考入福州船政学堂，学习驾驶。光绪三年（1877 年）他被派到英国留学，在格林尼治皇家海军学院学习，同时广泛阅读西方的社会科学著作，与当时的驻英公使郭嵩焘结为忘年交。

  光绪五年（1879 年）严复回国，次年被李鸿章调到天津，在北洋水师学堂任教，后来任总办（校长），前后二十年。他几次参加科举，都没有考中。甲午战争中北洋海军覆没，他的许多同学和学生战死，他深受刺激，在天津的报纸上发表《论世变之亟》《原强》《辟韩》《救亡决论》等文章，主张学习西方的学术和制度，提出“鼓民力、开民智、新民德”。

  光绪二十四年（1898 年）严复翻译出版了英国学者赫胥黎的《进化论与伦理学》的部分内容，题名《天演论》，书中“物竞天择，适者生存”的观念在当时的中国引起了巨大的震动，影响了一代人。此后他又翻译了亚当·斯密的《原富》、斯宾塞的《群学肄言》、约翰·穆勒的《群己权界论》和《穆勒名学》、孟德斯鸠的《法意》等书。他在《天演论》的译例中提出翻译要做到“信、达、雅”。

  辛亥革命后，严复任北京大学的首任校长。1915 年他列名筹安会，支持袁世凯称帝，受到舆论的批评。晚年他思想趋于保守，1921 年在福州去世。
sources: []
recalled:
  - 严复《天演论》译例言
  - 王栻编《严复集》
  - 《清史稿·严复传》
