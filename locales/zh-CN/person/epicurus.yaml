name: 伊壁鸠鲁
aliases: [伊比鸠鲁]
role: 哲学家
summary: 雅典哲学家，在“花园”中讲学，主张原子论，认为心灵的安宁与身体的无痛即是快乐。
body: |-
  公元前 341 年生于萨摩斯岛。父亲涅奥克勒斯是迁到该岛的雅典移民，属伽尔格托斯村社，以教书为业，所以他是雅典公民。他自称十四岁开始接触哲学，曾在特奥斯跟德谟克利特一派的瑙西法涅斯学习，后来却说自己无师自通。前 323 年他到雅典服两年的青年兵役，其间雅典移民被逐出萨摩斯，家人迁到小亚细亚的科洛丰，他随后去那里与家人团聚。约前 311 年起他先后在米提利尼和兰普萨库斯设帐授徒，后来最亲近的弟子墨特罗多罗斯、赫尔马科斯等都是在这两地结识的。

  前 306 年他带着弟子回到雅典，买下一所房子和城外的一座园子，学派因此被称为“花园”。成员一同生活，其中有妇女和奴隶，这在当时的学校里少见。他平日饮食极简，据第欧根尼·拉尔修所引的信，他说有清水和面包就满足了。

  他的自然学说沿用德谟克利特的原子论：万物由虚空中不可分的原子组成，灵魂也是原子，人死则散。后来的卢克莱修说，他主张原子在下落中会有微小的偏斜，由此才有碰撞，也才有人的自由。他认为神是存在的，但神过着完满的生活，不干预世事，也不会赏罚人，因此不必畏惧；死亡是感觉的消失，“死与我们无关”，同样不必畏惧。在伦理上他以快乐为善，但他说的快乐主要是身体没有痛苦、心灵不受搅扰，所以应当节制欲望，重视友谊，远离政治，“隐居而活”。后世把“伊壁鸠鲁派”当作纵欲享乐的同义词，与他的本意不合。

  据说他写了约三百卷书，几乎全部失传。第欧根尼·拉尔修的书里保存了他的三封信（致希罗多德论自然、致皮托克勒斯论天象、致墨诺凯乌斯论伦理）和四十条《主要学说》；梵蒂冈的一份抄本里另有一组格言；赫库兰尼姆出土的烧焦纸草中有他《论自然》的残卷。罗马诗人卢克莱修的《物性论》是对他学说最完整的阐述。

  前 270 年他因肾结石去世，年七十二岁。临终当天他写信给朋友说，病痛已到极点，但回想从前的交谈，心里仍是快乐的。学园由赫尔马科斯接掌，一直延续到罗马帝国时期。《使徒行传》第 17 章记保罗在雅典与伊壁鸠鲁派和斯多亚派的哲学家辩论。
sources: []
recalled:
  - 第欧根尼·拉尔修《名哲言行录》卷十
  - 卢克莱修《物性论》卷二第 216—293 行
  - 《使徒行传》第 17 章第 18 节
