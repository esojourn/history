name: 韩信
aliases: [淮阴侯, 齐王信, 楚王信]
role: 大将军
summary: 淮阴人，汉大将军，定魏、赵、齐，会兵垓下击灭项羽；后被吕后处死。
body: |-
  韩信是淮阴人，生年史无记载。据《史记·淮阴侯列传》，他早年贫困，曾受过淮阴少年让他从胯下钻过的侮辱。项梁渡淮时他仗剑从军，后属项羽为郎中，屡次献策不被采用。刘邦入蜀，他改投汉军，任治粟都尉，仍不受重视，中途逃走。丞相萧何亲自把他追回，对汉王称他“国士无双”，汉王于是设坛场拜他为大将（公元前 206 年）。

  同年八月汉军东出陈仓，平定三秦。此后韩信领兵北上：汉二年用木罂缻从夏阳偷渡，俘魏王豹；随后破代，东下井陉，背水列阵，大破赵军，斩成安君陈余，擒赵王歇。汉四年他袭破齐国，在潍水击杀楚将龙且，被立为齐王。武涉、蒯通先后劝他背汉自立，三分天下，他没有听从。汉五年他率军会于垓下，项羽败亡。

  项羽死后，高祖夺其军，改封他为楚王，都下邳。汉六年有人告他谋反，高祖假称出游云梦，在陈将他逮捕，后赦免，降为淮阴侯。汉十年陈豨反于代地，高祖亲征，韩信称病没有随行。次年即高祖十一年（前 196 年）春，有人告发韩信与陈豨通谋，准备在都城起事。吕后与萧何商议，谎称陈豨已死，诱他入宫祝贺，将他斩于长乐宫钟室，并夷三族；《汉书·高帝纪》把此事记在这一年春正月。
sources:
  - 《史记·淮阴侯列传》 https://zh.wikisource.org/wiki/史記/淮陰侯列傳
  - 《史记·高祖本纪》 https://zh.wikisource.org/wiki/史記/卷008
  - 《汉书·高帝纪》 https://zh.wikisource.org/wiki/漢書/卷001
