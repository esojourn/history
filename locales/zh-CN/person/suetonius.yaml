name: 苏维托尼乌斯
aliases: [盖乌斯·苏维托尼乌斯·特兰奎鲁斯, 绥通纽斯, 苏埃托尼乌斯]
role: 传记作家、皇帝秘书
summary: 罗马传记作家，著《罗马十二帝王传》。
body: |-
  苏维托尼乌斯约生于公元 69 年，出身骑士之家，父亲是军团里的军官，这一年在贝德里亚库姆为奥托作战。北非希波出土过一块纪念他的铭文，有人据此推测那里是他的家乡。他是小普林尼的朋友，小普林尼的书信里几次提到他，替他向图拉真求过优待。

  他先后掌管皇帝的文教事务、罗马的图书馆，到哈德良时做了主管书信的秘书，因此能看到宫中的档案，书里引用过奥古斯都的亲笔信。据《罗马帝王纪》，122 年前后他与禁卫军长官一同被免职，理由是在皇后面前失礼。此后的事迹和卒年都不清楚。

  《罗马十二帝王传》写恺撒和从奥古斯都到图密善的十一位皇帝，除开头几章外完整传世。他不按年代叙事，而是分门别类地写家世、政绩、相貌、习惯和私生活，逸闻、传言一并收录。另一部《名人传》只存文法家、修辞家部分和几篇诗人小传。他在《克劳狄传》和《尼禄传》里各有一句提到基督徒。
sources: []
recalled:
  - 小普林尼《书信集》卷 1 第 18、24 封，卷 10 第 94 封
  - 《罗马帝王纪·哈德良传》第 11 章
  - 苏维托尼乌斯《罗马十二帝王传·奥托传》第 10 章
  - 希波出土苏维托尼乌斯铭文
