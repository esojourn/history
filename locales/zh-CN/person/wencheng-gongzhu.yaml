name: 文成公主
aliases: []
role: 公主、吐蕃王后
summary: 唐朝宗室女，641 年嫁给吐蕃赞普松赞干布，在吐蕃生活近四十年。
body: |-
  文成公主是唐朝宗室的女儿，她的父亲是谁、生年几何，史书都没有记载。贞观年间，吐蕃赞普松赞干布多次派使者请求与唐朝通婚，贞观十二年（公元 638 年）吐蕃进攻松州被唐军击败后，再次遣使谢罪请婚。贞观十四年（640 年），吐蕃大相禄东赞带着黄金和珍宝到长安下聘，太宗答应以宗室女文成公主相嫁。

  贞观十五年（641 年）正月，太宗命江夏王李道宗护送文成公主入吐蕃。据《旧唐书·吐蕃传》，松赞干布率兵到柏海（今青海玛多县一带）迎接，在李道宗面前执子婿之礼，见到唐朝的服饰礼仪很是赞叹。回到吐蕃后，他为公主专门修筑了一座城，以向后代夸耀。据同传，公主不喜欢吐蕃人以赭色涂面的风俗，松赞干布便下令禁止；他又派贵族子弟到长安国学学习诗书，请唐朝派人掌管文书。

  藏文史籍和民间传说中关于文成公主的故事很多，如说她带去了释迦牟尼佛像（今供奉在拉萨大昭寺）、医药、历算和农作技术，参与修建大昭寺、小昭寺等，这些记载出自后世，细节多有出入。

  永徽元年（650 年）松赞干布去世，文成公主此后又在吐蕃生活了三十年。这一时期唐朝与吐蕃因争夺吐谷浑故地多次交战。永隆元年（680 年）她在吐蕃去世，唐朝派使者前往吊祭。
sources: []
recalled:
  - 《旧唐书·吐蕃传》
  - 《新唐书·吐蕃传》
  - 《资治通鉴》卷一百九十五至二百二
