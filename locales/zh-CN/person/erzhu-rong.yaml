name: 尔朱荣
aliases: [尔朱天宝]
role: 权臣
summary: 北魏末年的契胡酋长，发动河阴之变，专擅朝政，后被孝庄帝刺杀。
body: |-
  尔朱荣字天宝，北秀容的契胡人，世代为部落酋长，据《魏书》本传，家中的牛羊驼马多到要按山谷来计算。六镇之乱爆发后，他散发家财，招募兵马，收容了六镇流民中的许多豪杰，高欢、贺拔岳、侯景等后来的名将都曾在他手下。他的势力不断扩大，控制了并州晋阳一带。

  武泰元年（公元 528 年），孝明帝暴死，胡太后立幼主元钊。尔朱荣以为孝明帝报仇为名起兵南下，拥立长乐王元子攸为帝，即孝庄帝。同年四月，他在河阴把胡太后和元钊沉入黄河，又把朝中百官召集到河阴的陶渚，纵兵屠杀，丞相高阳王元雍以下的王公大臣都被杀死，死者人数史书说法不一，有一千三百余人、两千余人等记载（另见“河阴之变”条）。此后他回到晋阳，遥控朝政。

  同年九月，他率数千精骑在滏口击败号称数十万的葛荣起义军，擒获葛荣，河北平定。次年，梁将陈庆之护送元颢攻入洛阳，孝庄帝出逃，尔朱荣率军反攻，收复洛阳。

  孝庄帝不甘心受他控制。永安三年（530 年）九月，孝庄帝设计召他入宫，在明光殿亲手把他刺死，年三十八。他的侄子尔朱兆等随即起兵攻入洛阳，俘杀了孝庄帝。不久，高欢起兵讨伐尔朱氏，尔朱家族很快覆灭。
sources: []
recalled:
  - 《魏书·尔朱荣传》
  - 《资治通鉴》卷一百五十至一百五十四
