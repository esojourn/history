name: 元载
aliases: []
role: 宰相
summary: 唐代宗时的宰相，协助诛杀鱼朝恩，此后专权贪纵，777 年被赐死。
body: |-
  元载是凤翔岐山人，出身寒微，好学，天宝初年以通晓道家经典应试入仕。安史之乱时他在江东任职，后来受到宦官李辅国的赏识，宝应元年（公元 762 年）任宰相，唐代宗即位后仍任宰相，此后执政长达十几年。

  宦官鱼朝恩统领禁军、骄横跋扈，代宗与元载暗中谋划，大历五年（770 年）寒食节在宫中把鱼朝恩缢杀。此后元载更加专权，排斥异己，大量安插亲信，他的妻子和儿子也广收贿赂。代宗对他逐渐不满，大历十二年（777 年）三月下令将他逮捕，赐他自尽，妻儿也被处死。据《旧唐书》，抄家时查出胡椒八百石，其他财物不计其数。
sources: []
recalled:
  - 《旧唐书·元载传》
  - 《新唐书·元载传》
  - 《资治通鉴》卷二百二十二至二百二十五
