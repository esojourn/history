name: 莉薇娅
aliases: [莉薇娅·德鲁西拉, 李维娅, 利维娅, 尤利娅·奥古斯塔]
role: 奥古斯都之妻、提比略之母
summary: 奥古斯都的妻子，提比略的母亲，罗马第一位“奥古斯塔”。
body: |-
  莉薇娅于公元前 58 年 1 月 30 日出生，父亲出自克劳狄乌斯家族，被李维乌斯·德鲁苏斯家收养，腓立比兵败后自杀。她先嫁给同族的提比略·克劳狄乌斯·尼禄，前 42 年生下长子提比略。丈夫在佩鲁西亚战争中站在屋大维的对立面，一家人逃到西西里和希腊，前 39 年大赦后才回罗马。

  前 38 年 1 月，屋大维与妻子斯克里波尼娅离婚，莉薇娅也与丈夫离婚，两人成婚；当时她怀着次子德鲁苏斯，几个月后出生。这段婚姻维持了五十二年，没有留下子女。前 35 年，她和屋大维娅得到与保民官相同的人身不可侵犯的地位，并可不经监护人自行处置财产。古代作家说奥古斯都遇事常同她商量。

  奥古斯都选定的继承人马尔凯卢斯、盖乌斯和卢基乌斯先后早死，最后继位的是她的儿子提比略。塔西佗和卡西乌斯·狄奥都记下了当时的传言，说这些人的死以至奥古斯都本人的死与她有关；塔西佗只说是传言，现代学者大多认为没有根据。

  公元 14 年，奥古斯都在遗嘱里把她收入尤利乌斯家族，授“奥古斯塔”称号。提比略在位时，母子关系紧张，他不许元老院给她过多的尊荣，26 年以后住在卡普里岛，很少见她。29 年她在罗马去世，据狄奥，享年八十六岁。提比略没有出席葬礼，也不准为她封神；她的孙子克劳狄在 42 年即位后才把她列为女神。
sources: []
recalled:
  - 塔西佗《编年史》卷 1 第 3—10 章、卷 5 第 1 章
  - 苏维托尼乌斯《罗马十二帝王传·奥古斯都传》《提比略传》
  - 卡西乌斯·狄奥《罗马史》卷 48、卷 58
