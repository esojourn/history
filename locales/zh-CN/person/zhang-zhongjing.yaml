name: 张仲景
aliases: [张机]
role: 医学家
summary: 汉末医学家，著《伤寒杂病论》，后世尊为“医圣”。
body: |-
  张仲景名机，仲景是他的字，南阳人。《后汉书》和《三国志》都没有为他立传，他的生卒年和生平几乎没有同时代的记载可依。现在常见的“约公元 150 年至 219 年”是后人的推测。后世相传他是南阳涅阳人，做过长沙太守；这一说法出自唐宋时期的医书，不见于汉晋史籍，学者对此有不同看法。

  关于他本人，最可靠的材料是《伤寒杂病论》的自序。序中说，他的宗族原有二百多人，建安纪年以来不到十年，死去三分之二，其中十分之七死于伤寒。他有感于此，“勤求古训，博采众方”，参考《素问》《九卷》《八十一难》等古医书，写成《伤寒杂病论》十六卷。建安年间疫病多次流行，在当时的其他文献里也有记载。

  这部书把外感热病的发展过程归纳为太阳、阳明、少阳、太阴、少阴、厥阴六个阶段，按不同的脉象和症状确定治法和方药，后世称为“六经辨证”。原书在战乱中散失，西晋太医令王叔和曾加以搜集整理。到北宋，朝廷校正医书，把它整理成《伤寒论》和《金匮要略》两部书刊行，前者讲伤寒，后者讲各种杂病。书中的许多方剂至今仍在使用，后世医家称之为“经方”。
sources: []
recalled:
  - 张仲景《伤寒杂病论·序》
