name: 西门豹
aliases: []
role: 魏国邺令
summary: 魏文侯时的邺令，破除“河伯娶妇”的陋俗，开渠引漳水灌溉邺地。
body: |-
  西门豹是魏文侯时的大臣，生卒年不详，曾任邺（今河北临漳西南）令。他最著名的事迹见于《史记·滑稽列传》中褚少孙的补记：邺地的三老、廷掾与巫婆勾结，每年借口为漳水之神“河伯”娶妻，向百姓搜刮钱财，并把挑中的少女投入河中，百姓纷纷逃亡。西门豹到任后，在送“新娘”的那天，以“新娘”不够美为由，先后让巫婆和她的弟子、三老“去向河伯通报”，把他们投入河中，从此再也没有人敢提河伯娶妇的事。

  西门豹随后征发百姓开凿十二条渠，引漳水灌溉农田，邺地因此富庶。关于引漳灌邺，《史记·河渠书》说是西门豹，《汉书·沟洫志》则说是魏襄王时的邺令史起，后人有的认为二人先后都曾修渠。
sources: []
recalled:
  - 《史记·滑稽列传》（褚少孙补）
  - 《史记·河渠书》
  - 《汉书·沟洫志》
