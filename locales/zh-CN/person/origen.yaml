name: 俄利根
aliases:
  - 奥利金
  - 俄利金
role: 亚历山大的圣经学者
summary: 亚历山大人，初期教会著述最多的学者，编有《六文本合参》，著《驳克理索》。
body: |-
  俄利根约在公元 185 年生于埃及的亚历山大，父母都是基督徒。他的生平主要见于优西比乌《教会史》卷 6。公元 202 年前后，塞维鲁皇帝在位时亚历山大发生逼迫，他的父亲利奥尼德被斩首。据优西比乌，当时十六七岁的俄利根也想去殉道，母亲把他的衣服藏起来，才把他留在家里。《历史的轨迹》第二章讲的就是这件事。

  父亲死后家产充公，他以教书养活母亲和六个弟弟。主教底米丢让他主持亚历山大的教理学校，那时他约十八岁。优西比乌说他生活极其刻苦，并且按字面理解《马太福音》19:12 而自阉；这件事是否属实，现代学者有人怀疑。他为了校勘旧约，学了希伯来文，把希伯来文本和几种希腊文译本分栏对照，编成《六文本合参》。他的《论首要原理》是最早系统陈述基督教教义的著作之一。

  约公元 230 年，他路过巴勒斯坦时，被该撒利亚和耶路撒冷的主教按立为长老。底米丢认为这是越权，召开会议把他逐出亚历山大。他从 231 年起定居该撒利亚，在那里讲学、讲道，继续注释圣经。约 248 年，他写成八卷《驳克理索》，逐条回应哲学家克理索七十年前攻击基督教的《真道》。《历史的轨迹》称这是对基督教非难者一部精彩的反驳。

  公元 250 年德修皇帝逼迫教会时，他被捕下狱，受了拉肢等酷刑，没有屈服。德修死后他获释，身体已经垮了，约在 253 或 254 年死于推罗，据优西比乌，终年六十九岁。《历史的轨迹》把他的死放在戴克里先逼迫一段里讲，按年代应属德修逼迫之后。

  他关于灵魂先存、万物最终复原的一些推测在身后引起长期争论，公元 553 年第二次君士坦丁堡会议定了“俄利根主义”的罪。
