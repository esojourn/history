name: 安条克一世
aliases: [救主安条克, 安条克·索特尔]
role: 塞琉古国王
summary: 塞琉古一世之子，在父亲遇刺后保住了王国，曾击败入侵小亚细亚的加拉太人。
body: |-
  塞琉古一世与索格底亚那贵族之女阿帕玛的儿子，约生于公元前 324 年，是继业者诸王的子嗣中唯一有一半伊朗血统的。前 301 年伊普苏斯之战，他指挥一翼的骑兵。约前 294 年，父亲立他为共治者，让他治理幼发拉底河以东各省，并把自己的妻子、德米特里之女斯特拉托尼刻嫁给他。普鲁塔克和阿庇安记载了一个著名的故事：他暗恋继母以致病倒，医生埃拉西斯特拉托斯从他见到她时的脉搏和神色看出了原因，告诉了塞琉古。

  前 281 年塞琉古在欧洲遇刺，他继位时叙利亚等地发生变乱，小亚细亚北部的若干城邦和王国也趁机自立。他放弃了父亲对马其顿的要求，约前 278 年与安提柯二世议和，把妹妹嫁给后者，两个王朝此后大体相安。

  前 278 年起，一批高卢人渡海进入小亚细亚四处劫掠，希腊人称他们“加拉太人”。安条克在一场会战中用战象把他们击败，史称“象之胜利”，年代有约前 275 年和前 260 年代两说；“救主”的称号据说由此而来。加拉太人后来定居在小亚细亚中部。

  约前 274 年至前 271 年，他与埃及的托勒密二世为叙利亚南部和小亚细亚沿海打了第一次叙利亚战争，没有改变大局。他延续父亲的做法，在各地建城，也尊崇巴比伦的神庙。1880 年在博尔西帕出土的一个泥圆筒记载他于前 268 年为埃萨吉拉和埃兹达两座神庙奠基，这是现存最晚的阿卡德语王室铭文。巴比伦祭司贝罗索斯用希腊文写的《巴比伦志》也是献给他的。

  他处死了被指谋反的长子塞琉古，改立次子，即安条克二世。约前 262 年，帕加马的欧迈尼斯一世在萨迪斯附近击败他，帕加马从此实际独立。前 261 年他去世。
sources: []
recalled:
