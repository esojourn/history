name: "詹姆斯·麦格雷迪"
aliases: ["麦格列第"]
role: "长老会牧师，西部大复兴的发起人"
summary: "在肯塔基洛根县牧会，1800 年带出西部大复兴，开了露天聚会的先河。"
body: |-
  《历史的轨迹》第四十四章说，西部的大复兴以与东部完全不同的方式发生。长老会早期领袖麦格雷迪外表笨拙，里面却充满感人的能力。1796 年他在肯塔基声名狼藉的洛根县做三间长老会的牧师，西部大复兴就是借他的讲道开始的，又称洛根县复兴或坎伯兰复兴。后来在几位牧师协助下，这次复兴在 1800 年达到高潮：红河边的聚会非常激动，无数人归主；消息传开，来的人越来越多，人们带着几天的生活用品来到聚会的空地，于是开始了露天聚会，后来成为美国流行的传福音方式。

  据一般记载，麦格雷迪约 1763 年生于宾夕法尼亚一个苏格兰裔爱尔兰家庭，在北卡罗来纳长大，在宾夕法尼亚受神学训练。书中说西部复兴主要由长老会引起，后来长老会分裂，浸礼派和循道派投入复兴，信徒大增；从长老会分出的坎伯兰长老会就是由提倡露天聚会和联区讲道的人组成的。他晚年在印第安纳等地拓荒宣教，1817 年在肯塔基去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十四章“十九世纪初期的教会” https://wellsofgrace.com/books/spiritual/2000years/html/chapter49.html"
