name: 李希烈
aliases: []
role: 淮西节度使、僭号皇帝
summary: 淮西节度使，德宗削藩时反叛，自称楚帝，扣押并杀害颜真卿，后被部将毒死。
body: |-
  李希烈是辽西人，早年在淮西节度使李忠臣部下任职。大历十四年（公元 779 年）他驱逐了李忠臣，被朝廷任命为淮西节度使，治所在蔡州。建中二年（781 年）唐德宗命他讨伐山南东道的梁崇义，他攻破襄阳，此后自恃有功，与河北的叛乱藩镇暗中勾结，次年自称天下都元帅、建兴王，起兵反叛。

  建中四年（783 年），宰相卢杞奏请派颜真卿前往宣慰，李希烈扣留了颜真卿，多次威胁利诱都无效。同年他攻陷汴州，兴元元年（784 年）正月称帝，国号大楚。同年八月他派人在蔡州缢杀了颜真卿。此后他在与唐军作战中屡屡失利，贞元二年（786 年）四月，他生病期间被部将陈仙奇派医生毒死，陈仙奇随即归降朝廷。他的生年史书没有记载。
sources: []
recalled:
  - 《旧唐书·李希烈传》
  - 《新唐书·叛臣传·李希烈》
