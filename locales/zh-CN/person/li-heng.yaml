name: 唐肃宗
aliases: [李亨, 李玙]
role: 皇帝
summary: 唐玄宗之子，安史之乱中在灵武即位，借回纥兵收复两京，晚年受制于宦官李辅国。
body: |-
  李亨是唐玄宗的第三子，景云二年（公元 711 年）生，先后用过嗣升、浚、玙、绍等名字，后来改名亨。开元二十六年（738 年）太子李瑛被废杀后，他被立为太子。此后十多年间，宰相李林甫几次借韦坚案、杜有邻案等牵连东宫，他先后与牵涉其中的韦妃、杜良娣断绝关系以求自保，处境艰难。

  天宝十五载（756 年）六月潼关失守，玄宗西逃，到马嵬驿发生兵变，杨国忠、杨贵妃被杀（另见“马嵬之变”条）。随后玄宗入蜀，李亨在当地父老和部下的挽留下北上，七月在灵武即皇帝位，改元至德，尊玄宗为太上皇（另见“灵武即位”条）。他以郭子仪、李光弼统兵，以李泌为谋主，又向回纥借兵。至德二载（757 年），长子广平王李俶为元帅，率唐军与回纥兵收复长安、洛阳，十二月玄宗回到长安（另见“收复两京”条）。

  两京收复后，他没有乘势平定河北。乾元元年（758 年）唐军九个节度使围攻邺城的安庆绪，他不设元帅，派宦官鱼朝恩为观军容使监军，次年三月唐军在史思明援军到来时溃败（另见“相州之战”条）。史思明随即称帝，再次攻占洛阳。

  他在位期间宠信宦官李辅国和张皇后，李辅国掌管禁军和朝政，宰相也要通过他奏事，开了唐后期宦官专权的先例。上元元年（760 年）李辅国把太上皇迁到西内太极宫，高力士等人被流放，他没有阻止。宝应元年（762 年）四月玄宗去世，他本已病重，张皇后想废掉太子李俶，李辅国与程元振带兵入宫，拘捕张皇后。十多天后他在长安病逝，年五十二。
sources: []
