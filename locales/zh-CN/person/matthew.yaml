name: 马太
aliases:
  - 利未
  - 税吏马太
role: 十二使徒之一
summary: 迦百农的税吏，蒙耶稣呼召成为十二使徒之一，教会传统以他为第一卷福音书的作者。
body: |-
  马太原是税吏，生年和籍贯都没有记载。《马太福音》9:9 记耶稣在迦百农经过税关，看见一个人名叫马太，坐在税关上，就叫他来跟从自己，他便起来跟从了耶稣。《马可福音》2:14 和《路加福音》5:27 记的是同一件事，却称这人为利未，马可还说他是亚勒腓的儿子。通常认为马太和利未是同一个人的两个名字，但福音书没有明说。

  据《路加福音》5:29–32，利未在自己家里为耶稣大摆筵席，有许多税吏和别人同席，法利赛人和文士为此向门徒发怨言。新约中的四份十二使徒名单（太 10:3；可 3:18；路 6:15；徒 1:13）都有马太的名字。《使徒行传》1:13 记耶稣升天以后他和其余的使徒同在耶路撒冷，此后新约不再提到他。

  教会传统以他为《马太福音》的作者。四世纪的优西比乌在《教会史》里引二世纪帕皮亚的话，说马太用希伯来人的语言编集了主的言论。现代学者对这卷福音书的作者和成书经过多有不同看法。他后来的经历和结局，新约没有记载；相传他曾到埃塞俄比亚、波斯等地传道并且殉道，各种说法互不一致，都出自较晚的传统。
sources: []
recalled:
  - 《马太福音》9:9–13、10:3
  - 《马可福音》2:14–17、3:18
  - 《路加福音》5:27–32、6:15
  - 《使徒行传》1:13
  - 优西比乌《教会史》卷 3（引帕皮亚）
