name: 马援
aliases: [马文渊, 伏波将军, 新息侯]
role: 伏波将军
summary: 东汉初年将领，平定陇西羌人与交趾二征起事，病死于征讨武陵的军中。
body: |-
  据《后汉书·马援传》，马援字文渊，扶风茂陵人，先祖是战国时赵国的将领赵奢。王莽末年他做过新成大尹（即汉中太守）。王莽败亡后，他投靠割据陇右的隗嚣，受其派遣先后去见在蜀称帝的公孙述和已在雒阳即位的刘秀，此后劝隗嚣归汉；隗嚣不从，马援便留在刘秀一方。

  建武八年（公元 32 年）光武帝亲征隗嚣，马援在御前用米堆成山谷的形状，指点进军路线。建武十一年起他任陇西太守，前后数年，平定了当地的羌人。建武十六年，交趾的征侧、征贰姐妹起兵，攻占岭南数十城。次年马援受命为伏波将军率军南征，建武十九年（43 年）擒斩二征，因功封新息侯。

  本传记他说过“男儿要当死于边野，以马革裹尸还葬耳”，又说“丈夫为志，穷当益坚，老当益壮”，成语“马革裹尸”“老当益壮”出于此。建武二十四年，他已六十二岁，仍请求出征武陵五溪的蛮人。次年春军至壶头，水急难进，又逢暑热，军中疫病流行，马援也病死在军中。

  他死后，驸马梁松等人上书构陷，光武帝大怒，追收他的新息侯印绶，家属不敢将他归葬祖茔。经其妻子和旧友朱勃等上书申诉，才得以安葬。他的女儿后来成为汉明帝的皇后。
sources: []
recalled:
  - 《后汉书·马援列传》
  - 《后汉书·南蛮西南夷列传》
