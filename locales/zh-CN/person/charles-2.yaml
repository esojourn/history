name: "查理二世"
aliases: ["查理二世"]
role: "英格兰、苏格兰与爱尔兰国王"
summary: "查理一世之子，1660 年复辟为王，复辟后国会严惩不从国教者，临终接受天主教。"
body: |-
  查理二世是查理一世的长子，1630 年生于伦敦。内战中他随王军，后流亡欧洲大陆；1651 年他在苏格兰加冕并南下，在伍斯特被克伦威尔击败，再度出逃。

  《历史的轨迹》第三十一章说，克伦威尔死后，英国人普遍不满严厉清教徒主义的重轭，便把查理一世的儿子从国外请回来，加冕为查理二世，史称 1660 年复辟。复辟后国会宽赦了内战中与查理一世交战的人，只把判处查理一世死刑的法官们除外。

  该书说，1662 年 5 月，已是安立甘派占绝对优势的国会通过新的统一法，把公祷书修改了六百处之多，规定只许用修订本举行崇拜，约二千名长老派教牧人员因拒绝接受而被免职。书中把这本公祷书写作“崇拜指南（或称公祷书）”；崇拜指南其实是威斯敏斯特会议所订、用来取代公祷书的另一本书，复辟后被废，这里改的是公祷书。被逐出的二千人也不全是长老派。苏格兰的立约派同样受到追捕。

  该书说他一生摇摆在不信与倾向天主教之间，1685 年临终前接受了天主教。他没有合法子嗣，弟弟詹姆士二世继位。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十一章“英国教会仍然动荡” https://wellsofgrace.com/books/spiritual/2000years/html/chapter35.html"
recalled:
  - "《布雷达宣言》（1660 年）"
  - "1662 年《统一法》"
