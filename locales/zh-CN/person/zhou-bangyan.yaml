name: 周邦彦
aliases: [周美成, 清真居士]
role: 北宋词人、大晟府提举
summary: 北宋末年词人，精通音律，曾提举大晟府，被后人看作格律派词人的代表。
body: |-
  周邦彦是钱塘人，生于嘉祐元年（公元 1056 年）。神宗元丰年间他在太学读书，向朝廷献上《汴都赋》，赞美新法，神宗很赏识，提拔他为太学正。此后他在地方上做了多年的小官。徽宗时他回到朝廷，政和年间一度提举大晟府，负责审定宫廷乐曲。宣和三年（1121 年）他在南京应天府去世。

  周邦彦精通音律，自己能谱写新曲，他的词格律严谨、用字精工，善于融化前人的诗句，被后人看作北宋婉约词的集大成者，南宋的姜夔、吴文英等人都受到他的影响，著有《清真集》（又名《片玉词》）。宋人笔记中有他与名妓李师师、宋徽宗之间的故事，南宋人已经指出这些说法与他的经历不合，不可凭信。
sources: []
recalled:
  - 《宋史·文苑传·周邦彦》
  - 楼钥《清真先生文集序》
  - 王国维《清真先生遗事》
