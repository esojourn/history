name: 约哈斯
aliases: []
role: 北国以色列王
summary: 耶户的儿子，在撒玛利亚作王十七年，国势被亚兰压制到极弱。
body: |-
  耶户的儿子，与后来的犹大王约哈斯同名。据《列王纪下》13:1–2，犹大王约阿施二十三年，他在撒玛利亚登基作以色列王，共十七年；经文说他行耶和华眼中看为恶的事，随从耶罗波安使以色列人陷在罪里的那罪。

  据 13:3–7，耶和华向以色列人发怒，屡次把他们交在亚兰王哈薛和哈薛的儿子便哈达手里。约哈斯恳求耶和华，耶和华就应允，赐给以色列人一位拯救者，使他们脱离亚兰人的手，这位拯救者是谁经文没有点名。经文又说亚兰王灭绝约哈斯的军兵，践踏他们如禾场上的尘沙，只给他留下马兵五十、战车十辆、步兵一万（13:7）。

  约哈斯死后葬在撒玛利亚，儿子约阿施接续作王（13:9）。
sources: []
recalled:
  - 《列王纪下》13:1–9、13:22
