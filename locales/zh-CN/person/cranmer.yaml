name: "克兰麦"
aliases: ["托马斯·克兰麦", "克蓝麦", "克兰默"]
role: "坎特伯雷大主教"
summary: "坎特伯雷大主教，英文《公祷书》和《四十二信条》的主要作者，1556 年被烧死。"
body: |-
  克兰麦 1489 年 7 月生于诺丁汉郡的阿斯洛克顿，十四岁进剑桥，后来做了耶稣学院的研究员，得神学博士学位。《历史的轨迹》第二十八章说他原是剑桥的一位讲道师。1529 年他向国王的近臣提议，离婚案不必等罗马，可以征询欧洲各大学神学家的意见，亨利八世因此用他。1532 年他出使皇帝的宫廷，在纽伦堡结识路德派的人，秘密娶了当地改教家奥西安德的侄女。

  同年坎特伯雷大主教出缺，国王指定由他继任，1533 年 3 月祝圣。5 月他宣判国王与凯瑟琳的婚姻无效。亨利在世时他小心行事，主要做了两件事：推动英文圣经进入各教堂，1544 年写成英文的连祷文。

  1547 年爱德华六世即位，改革才放手进行。该书说，在他指导下信徒可以兼领饼和杯，教堂里取消了图像；他从大陆请来布塞和殉道者彼得到剑桥、牛津执教，派宫廷牧师到各地讲道。他主持编成 1549 年的《公祷书》，全国礼拜一律改用英文；1552 年修订本更远离旧礼，圣餐的讲法已不承认基督的身体临在饼酒之中。1553 年他拟定的《四十二信条》公布。他的英文祷文句式庄重，后世沿用了几百年。

  同年爱德华去世，他签字支持简·格雷继位。玛丽登基后他以叛国罪下狱，随后转到牛津，受异端审判。该书说他 1555 年被罗马开除教籍。他眼看着拉蒂默和里德利被烧死，后来在劝诱之下先后签了几份悔过书，承认教皇的权柄和化质说。女王仍要处死他。1556 年 3 月 21 日他被带到牛津的大学教堂当众宣读悔过书，读到末了却声明以前所写的都违背内心，签字的右手要先受刑。在火刑柱上，他把右手伸进火里。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十七章“苏格兰教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter30.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第二十八章“英国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter31.html"
recalled:
