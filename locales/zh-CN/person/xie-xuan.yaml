name: 谢玄
aliases: [谢幼度, 康乐县公]
role: 兖州刺史、前锋都督
summary: 谢安之侄，组建北府兵，淝水之战中任前锋都督击败前秦，随后北伐收复徐兖等地。
body: |-
  谢玄字幼度，是谢安长兄谢奕的儿子。据《世说新语·言语》，谢安问子侄们，为什么人人都希望子弟出众，他回答说，就像芝兰玉树，总想让它们长在自家的庭阶前。他成年后在桓温幕府任职。

  前秦统一北方后，东晋朝廷要选一位能镇守北面的将领。太元二年（公元 377 年）谢安举荐了他，他出任兖州刺史，镇守广陵，在北来的流民中招募刘牢之等勇士组成一军，因驻地在建康以北而被称为“北府兵”。太元四年前秦进攻淮南，包围三阿，他率军接连取胜，把秦军逐回淮北。

  太元八年（383 年）苻坚南征，他任前锋都督。十一月他派刘牢之率五千人夜袭洛涧，斩秦将梁成；随后他要求隔淝水列阵的秦军稍向后退，让晋军渡河决战，秦军一退而溃，晋军大胜。次年他乘势北伐，先后收复彭城和兖州、青州等地，前锋到达黄河北岸的黎阳。后来北方局势反复，朝廷命他退守，他因病多次请求解职，改任会稽内史。太元十三年（388 年）正月去世，时年四十六。诗人谢灵运是他的孙子。
sources: []
recalled:
  - 《晋书·谢玄传》
  - 《世说新语·言语》
  - 《资治通鉴》卷一百零四至一百零七
