name: 李鸿章
aliases: [少荃, 文忠]
role: 淮军创建者、直隶总督兼北洋大臣
summary: 创建淮军，主持洋务与北洋海军，签订《马关条约》《辛丑条约》。
body: |-
  李鸿章是安徽合肥人，道光二十七年（1847 年）考中进士，曾跟随曾国藩学习。太平军进入安徽后，他回乡办团练，后来进入曾国藩的幕府。同治元年（1862 年）他奉曾国藩之命，以湘军为榜样在安徽招募淮军，乘坐外国轮船到达上海，与英国人戈登指挥的“常胜军”一起与太平军作战，收复了苏州、常州等地。此后淮军又镇压了捻军，成为清朝最重要的军事力量。

  李鸿章是洋务运动的主要推动者。他在上海创办江南制造总局，在南京设立金陵机器局，在天津扩建机器局，又创办轮船招商局、开平矿务局、天津电报总局、上海机器织布局等企业（另见“洋务运动”条）。同治九年（1870 年）起他任直隶总督兼北洋大臣，坐镇天津长达二十五年，掌握清朝的外交和北方的军事。他筹建北洋海军，光绪十四年（1888 年）北洋海军正式成军（另见“北洋海军成军”条）。

  光绪二十年（1894 年）中日甲午战争爆发，北洋海军和淮军接连战败，北洋海军全军覆没（另见“甲午战争”条）。次年李鸿章作为全权大臣到日本马关与伊藤博文谈判，谈判期间遭日本人枪击受伤，最后签订了《马关条约》（另见“《马关条约》”条）。战后他被解除直隶总督的职务，一度失势。光绪二十二年（1896 年）他出使俄国，参加沙皇的加冕典礼，与俄国签订了《中俄密约》，此后又访问了欧美各国。

  光绪二十六年（1900 年）义和团运动期间，李鸿章任两广总督，与刘坤一、张之洞等人一起实行“东南互保”，拒绝执行朝廷对各国宣战的命令。八国联军攻入北京后，他被任命为全权大臣，与各国谈判，光绪二十七年（1901 年）九月签订《辛丑条约》（另见“《辛丑条约》”条）。两个月后他在北京病逝，年七十九岁，谥“文忠”。他一生经手签订了许多不平等条约，后世对他的评价分歧很大，梁启超说“吾敬李鸿章之才，吾惜李鸿章之识，吾悲李鸿章之遇”。
sources: []
recalled:
