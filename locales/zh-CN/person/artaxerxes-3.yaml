name: 阿尔塔薛西斯三世
aliases: [奥科斯, 亚达薛西三世]
role: 波斯国王
summary: 波斯国王，公元前 343 年前后重新征服脱离波斯六十年的埃及。
body: |-
  阿尔塔薛西斯二世之子，本名奥科斯，公元前 358 年即位，生年不详。希腊作家说他为取得和巩固王位除掉了几位兄长和大批王室亲属。即位后他命令小亚细亚沿海各总督解散手下的希腊雇佣军，总督阿尔塔巴佐斯因此反叛，失败后逃到马其顿腓力二世的宫廷。

  他在位期间的大事是收复埃及。埃及自前 404 年前后脱离波斯，约前 351 年他第一次出兵失败，腓尼基和塞浦路斯随之叛乱。他先攻下西顿，据狄奥多罗斯，城中居民举火自焚；然后集结大军和大批希腊雇佣兵，前 343 年至前 342 年间攻入埃及。法老涅克塔涅博二世逃往南方，埃及重归波斯。希腊作家记载他拆毁城墙、掠夺神庙，这些记载的可靠程度有争议。此役中出力的罗得岛人门托耳后来替他整顿了小亚细亚沿海，宦官巴戈阿斯则成为朝中权臣。

  前 340 年马其顿的腓力二世围攻佩林托斯，他命沿海总督出兵援救该城。前 338 年他去世。狄奥多罗斯说他被巴戈阿斯毒死；有一份巴比伦泥板的措辞被一些学者解读为自然死亡。巴戈阿斯立其幼子阿尔塞斯为王，两年后又将阿尔塞斯杀死，改立旁支的大流士三世。
sources: []
recalled:
  - 狄奥多罗斯《历史丛书》卷十六第 40—52 章、卷十七第 5 章
