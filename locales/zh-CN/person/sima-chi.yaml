name: 晋怀帝
aliases: [司马炽, 孝怀皇帝]
role: 皇帝
summary: 西晋第三位皇帝，年号永嘉，洛阳陷落时被匈奴汉国俘虏，后在平阳遇害。
body: |-
  司马炽是晋武帝的第二十五子，封豫章王。《晋书·怀帝纪》说他在诸王相争的年月里闭门读史，不交结宾客。永兴元年（公元 304 年）被立为皇太弟。惠帝去世后，他在光熙元年十一月（已入公元 307 年）即位，次年改元永嘉。

  他在位时，朝政掌握在东海王司马越手中。他想亲自处理政务，司马越在永嘉三年（309 年）带兵入京，杀了他亲近的大臣。这几年匈奴人刘渊在平阳称帝，石勒、王弥的军队横行于黄河南北，洛阳一带饥荒严重。永嘉五年司马越死后，晋军主力在宁平城覆没。

  同年六月，汉国的刘曜、王弥、呼延晏攻陷洛阳。他想逃往长安，在途中被俘，送到平阳，刘聪封他为会稽郡公。永嘉七年（313 年）正月，刘聪在宴会上让他穿着青衣给众人斟酒，在座的晋朝旧臣忍不住哭出声来，刘聪因此厌恶，不久把他杀害，时年三十。
sources: []
recalled:
  - 《晋书·怀帝纪》
  - 《资治通鉴》卷八十六至八十八
