name: 李璟
aliases: [徐景通, 南唐中主, 南唐元宗]
role: 南唐皇帝（后称国主）
summary: 南唐第二位君主，943 年即位，先后出兵灭闽、灭楚，后败于后周，失去江北之地。
body: |-
  李璟是李昪的长子，原名徐景通，贞明二年（公元 916 年）生。昇元七年（943 年）李昪去世，他即位，史称南唐中主。他爱好文学，身边聚集了冯延巳、冯延鲁、陈觉、魏岑、查文徽等人，其中几人好大喜功，当时被人称为“五鬼”。

  即位后，他改变了父亲保境安民的方针，乘闽国内乱出兵，保大三年（945 年）灭了闽国，但福州被吴越夺去；保大九年（951 年）又乘楚国内乱灭了楚国，次年楚地就被楚将刘言夺回。两次用兵消耗很大，所得有限（另见“南唐灭闽楚”条）。

  显德二年（955 年）起，周世宗三次亲征淮南，南唐军屡战屡败。显德五年（958 年），李璟被迫把长江以北的十四州全部割让给后周，去掉帝号，改称“国主”，奉后周正朔（另见“周世宗征淮南”条）。此后南唐以长江为界，国力大衰。建隆二年（961 年），他因金陵与江北的宋军隔江相望，迁都洪州，称南都，不久在洪州去世，儿子李煜在金陵继位。

  李璟擅长作词，传世作品不多，以《摊破浣溪沙》最为有名，其中“细雨梦回鸡塞远，小楼吹彻玉笙寒”等句历来被人称道。他与冯延巳、李煜的词一同代表了南唐词的成就。
