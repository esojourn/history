name: 史弥远
aliases: [史同叔]
role: 南宋权臣
summary: 南宋权臣，设计诛杀韩侂胄，任相二十余年，宁宗死后矫诏拥立宋理宗。
body: |-
  史弥远字同叔，明州鄞县（今浙江宁波）人，生于隆兴二年（公元 1164 年），父亲史浩是宋孝宗时的宰相。他以父荫入仕，后又考中进士。

  开禧北伐失败后，时任礼部侍郎的史弥远联合杨皇后，于开禧三年（1207 年）设计杀死韩侂胄，随即与金议和，次年订立嘉定和议。嘉定元年（1208 年）起他任宰相，此后专权二十余年。他在位期间对金、对蒙古都以守为主，政事多由亲信把持，后世评价不高。嘉定十七年（1224 年）宋宁宗去世，他废掉与自己不和的皇子赵竑，假传遗诏立赵昀为帝（宋理宗），又在次年逼死赵竑，理宗在位的前九年朝政仍由他主持。绍定六年（1233 年）史弥远去世。《宋史》把他列入《奸臣传》。
sources: []
recalled:
  - 《宋史·奸臣传·史弥远》
