name: 章惇
aliases: [章子厚]
role: 北宋宰相
summary: 北宋新党宰相，哲宗亲政后恢复新法，大批贬逐元祐大臣。
body: |-
  章惇是建州浦城人，生于景祐二年（公元 1035 年）。他考中进士后，因为名次在侄子章衡之下，不肯接受，后来重新应考再次及第。年轻时他与苏轼交好，两人后来因政见不同而成为对手。熙宁年间他支持王安石变法，奉命经营湖南梅山一带，设置州县，后来升任参知政事。

  元祐元年（1086 年）高太后听政，他因反对废除免役法与司马光等人争执，被贬出朝廷。绍圣元年（1094 年）宋哲宗亲政，任命他为宰相。他恢复免役、保甲等新法，在西北步步进逼西夏，同时大规模贬逐元祐大臣，苏轼被贬到惠州、儋州，苏辙、范祖禹、刘挚等人也远贬岭南，他甚至主张追夺司马光等人的官爵。

  元符三年（1100 年）哲宗去世，他反对立端王赵佶，说端王“轻佻不可以君天下”。宋徽宗即位后，他被罢相，一再贬谪，崇宁四年（1105 年）去世。《宋史》把他列入《奸臣传》。
sources: []
recalled:
  - 《宋史·奸臣传·章惇》
  - 《续资治通鉴长编》卷四百六十至五百二十
