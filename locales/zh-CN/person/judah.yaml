name: 犹大（雅各之子）
aliases: []
role: 犹大支派的祖先
summary: 雅各第四子，犹大支派的祖先，大卫出自他的后裔。
body: |-
  雅各的第四个儿子，利亚所生，生在巴旦亚兰（《创世记》29:35、35:23—26）。圣经没有记他的生年和卒年。哥哥们要杀约瑟时，他提议不要害弟弟的性命，把他卖给以实玛利人，众弟兄听从了他（37:26—27）。

  第 38 章记他离开弟兄，娶了迦南人书亚的女儿，生珥、俄南、示拉。珥和俄南相继死去，他没有照所说的把儿妇她玛给示拉。她玛蒙着脸坐在路旁，他以为是妓女，与她同寝，留下印、带子和杖作当头；后来听说她玛怀孕，他认出这些东西，说她比自己更有义。她玛生了双生子法勒斯和谢拉。

  饥荒中他向父亲担保便雅悯的安全，带他下埃及（43:8—10）。约瑟的银杯在便雅悯的口袋里搜出来后，他上前陈说父亲的情形，请求自己留下作奴仆，替便雅悯（44:14—34），约瑟随即与弟兄们相认。全家下埃及时，雅各打发他先去见约瑟（46:28）。雅各临终的祝福里说，圭必不离犹大（49:8—12）。犹大支派出于他，大卫是他的后裔；《马太福音》1:3 和《路加福音》3:33 的耶稣家谱都列有他的名字。
sources: []
recalled:
  - 《创世记》29:35、第 37—38 章、第 43—44 章、46:28、49:8—12
  - 《路得记》4:18—22
  - 《马太福音》1:3
  - 《路加福音》3:33
