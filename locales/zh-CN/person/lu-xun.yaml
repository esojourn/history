name: 陆逊
aliases: [陆伯言, 陆议]
role: 上大将军、丞相
summary: 孙吴统帅，夷陵之战中以火攻大败刘备，后任丞相，因卷入太子之争忧愤而死。
body: |-
  据《三国志·吴书·陆逊传》，陆逊字伯言，本名议，吴郡吴县人，出身江东大族。他幼年丧父，跟随堂祖父庐江太守陆康生活。二十一岁进入孙权的幕府，后来出任屯田都尉并管理县务，又领兵征讨山区的武装，从中选出精兵数万。孙权把孙策的女儿嫁给了他。

  建安二十四年（公元 219 年）吕蒙称病离开陆口，推荐陆逊接替。陆逊到任后写信给关羽，言辞十分谦卑，关羽因此不加防备。吕蒙袭取江陵时，陆逊分兵攻占宜都等地，截断了关羽西退的道路。

  黄武元年（222 年）刘备率大军东下，孙权任陆逊为大都督，统兵五万迎战。陆逊退到夷陵一带据守，几个月不肯出战，部下的老将多有不服。等到蜀军在山林间连营数百里、士气懈怠，他下令士兵各持一把茅草，顺风放火，同时全线进攻，连破蜀军四十多座营寨，刘备连夜逃回白帝城。黄武七年他又在石亭击败魏大司马曹休。

  孙权称帝后，任陆逊为上大将军，让他辅佐太子，镇守武昌，主管荆州和豫章等郡的事务。赤乌七年（244 年）他接任丞相，仍驻武昌。当时太子孙和与鲁王孙霸相争，陆逊几次上书，认为嫡庶应有分别，请求进京面陈。孙权不许，他的几个外甥和亲近的官员因与太子有来往而被流放或下狱，孙权还多次派使者去责问他。赤乌八年（245 年）陆逊忧愤而死，终年六十三，本传说他家中没有多余的财物。
sources: []
recalled:
  - 《三国志·吴书·陆逊传》
