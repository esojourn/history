name: 汉灵帝
aliases: [刘宏]
role: 皇帝
summary: 东汉皇帝，在位时宦官专权、党锢再起、公开卖官，黄巾起义爆发。
body: |-
  据《后汉书·灵帝纪》，灵帝名宏，是章帝的玄孙，原为解渎亭侯。桓帝死后无子，窦太后与父亲窦武把他从河间迎到雒阳即位，当时他十二岁。本纪记他死时三十四岁，据此推算约生于公元 156 年。

  建宁元年（168 年）九月，大将军窦武与太傅陈蕃谋划诛除宦官，事情泄露，反被宦官曹节、王甫等所杀。次年宦官兴起第二次党锢，李膺、杜密、范滂等百余人死于狱中，各地受牵连而被处死、流放、禁锢的有六七百人。灵帝宠信张让、赵忠等中常侍。光和元年（178 年）他在西园开设机构公开卖官，按官职高低定价；同年设立鸿都门学，招收擅长辞赋、书画的人。在此之前的熹平四年（175 年），他批准蔡邕等人校定经书文字，刻石立于太学，即熹平石经。

  中平元年（184 年）黄巾起义爆发，灵帝被迫解除党禁，派皇甫嵩等出兵镇压。中平五年，他采纳刘焉的建议改刺史为州牧，选派重臣出任，地方长官的权力因此加重；又在西园设置八校尉。中平六年（189 年）四月灵帝去世，少帝刘辩即位，外戚何进与宦官的冲突随即爆发。
sources: []
recalled:
  - 《后汉书·孝灵帝纪》
  - 《后汉书·党锢列传》
