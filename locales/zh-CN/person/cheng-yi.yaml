name: 程颐
aliases: [程伊川, 伊川先生, 程正叔]
role: 北宋理学家
summary: 北宋理学家，程颢之弟，主张“格物穷理”，其学说为朱熹所继承，合称“程朱理学”。
body: |-
  程颐是程颢的弟弟，明道二年（公元 1033 年）生于黄陂。他少年时与哥哥一起跟随周敦颐学习。皇祐年间他到太学读书，主持太学的胡瑗出题《颜子所好何学论》，读了他的文章大为惊异，立即请他担任学职。此后他屡次应考不中，便不再参加科举，长期在洛阳讲学，因为居住在伊川附近，人称伊川先生。

  元祐元年（1086 年）经司马光、吕公著推荐，他任崇政殿说书，为年少的哲宗讲解经书。他讲课时神色庄重，要求皇帝谨守礼法，又与苏轼一派意见不合，两派的门生互相攻击，形成以程颐为首的“洛党”和以苏轼为首的“蜀党”的对立。次年他被罢免，回到洛阳。绍圣年间他被列为元祐党人，贬到涪州；崇宁年间又被禁止讲学，著作被毁。大观元年（1107 年）他在洛阳去世。

  程颐认为天下万物都有其理，“性即理也”，主张通过“格物致知”去穷究事物之理，修养上强调“涵养须用敬，进学则在致知”。他的著作有《程氏易传》等，语录与程颢的合编为《二程遗书》。他的学说后来被南宋的朱熹继承和发展，形成“程朱理学”，成为元明清三代的官方学说。《宋史·杨时传》记载，杨时、游酢初次拜见他时，他正闭目静坐，两人侍立不去，等他醒来，门外的雪已经积了一尺深，这就是“程门立雪”的故事。他也有“饿死事极小，失节事极大”的说法，本是针对士大夫的守节而言，后世被用来要求妇女不得再嫁，受到很多批评。
sources: []
recalled:
  - 《宋史·道学传·程颐》
  - 《二程遗书》
  - 《宋史·道学传·杨时》
  - 朱熹《伊洛渊源录》
