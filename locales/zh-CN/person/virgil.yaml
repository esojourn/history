name: 维吉尔
aliases: [普布利乌斯·维吉利乌斯·马罗, 味吉尔, 威吉尔]
role: 诗人
summary: 罗马诗人，著《牧歌》《农事诗》和史诗《埃涅阿斯纪》。
body: |-
  维吉尔于公元前 70 年 10 月 15 日生在意大利北部曼图亚附近的安德斯村。古代的传记说他先后在克雷莫纳、米兰和罗马读书，后来到那不勒斯跟伊壁鸠鲁派的哲学家西罗学习。他身体不好，不善言辞，没有走从政的路。

  前 42 年腓立比之战以后，后三头在意大利没收土地安置老兵，曼图亚一带也在其中。他的《牧歌》十首大约写于这几年，第一首和第九首就以失地的牧人为题；古代注家说他家的田产被没收后又发还，这是从诗里推出来的，无从证实。《牧歌》使他成名，他进了梅塞纳斯的圈子，并把贺拉斯引荐给梅塞纳斯。

  此后他用了大约七年写成《农事诗》四卷，讲耕种、果树、畜牧和养蜂，前 29 年完成；据古代传记，屋大维从东方回来时，他和梅塞纳斯轮流把全诗读给屋大维听。生命的最后十一年他都在写《埃涅阿斯纪》。这部十二卷的史诗讲特洛伊人埃涅阿斯在城破后漂泊到意大利、为罗马人的先祖奠基的故事，前六卷仿《奥德赛》，后六卷仿《伊利亚特》，并把奥古斯都一族的世系接到埃涅阿斯身上。

  前 19 年他去希腊，打算再用三年修改全诗，途中染病，回到布伦迪西乌姆后于 9 月 21 日去世，葬在那不勒斯。据多纳图斯所传的传记，他临终要求把未定稿烧掉，奥古斯都没有照办，命瓦里乌斯和图卡整理出版。

  他的诗很快成了罗马学校的课本。《牧歌》第四首预言一个婴孩降生、黄金时代重临，后来的基督徒把它读作基督降生的预言；但丁在《神曲》里让他做游历地狱和炼狱的向导。
sources: []
recalled:
