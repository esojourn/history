name: 约哈斯
aliases: [沙龙]
role: 南国犹大王
summary: 约西亚的儿子，父亲战死后被国民立为王，三个月后被法老尼哥废黜，死于埃及。
body: |-
  犹大王约西亚的儿子，母亲哈慕他是立拿人耶利米的女儿（不是先知耶利米），与此前的以色列王约哈斯同名。《耶利米书》22:11 和《历代志上》3:15 称他为沙龙。约西亚在米吉多与埃及王法老尼哥交战阵亡以后，国民膏约哈斯接续作王（《列王纪下》23:29–30）。据 23:31–32，他登基时二十三岁，在耶路撒冷作王三个月，经文说他行恶。他的兄长以利亚敬年长两岁，国民却立了他，原因经文没有说。

  据 23:33–34，法老尼哥把约哈斯锁禁在哈马地的利比拉，不许他在耶路撒冷作王，又罚犹大国银子一百他连得、金子一他连得；尼哥立约西亚的另一个儿子以利亚敬作王，给他改名为约雅敬，把约哈斯带到埃及，约哈斯就死在那里。

  《耶利米书》22:10–12 说，不要为死人哭号，要为离家出外的人大大哭号，因为他不得再回来，必死在被掳去的地方，不得再见本地。这段话就是指沙龙（约哈斯）说的。
sources: []
recalled:
  - 《列王纪下》23:29–34
  - 《历代志下》36:1–4
  - 《耶利米书》22:10–12
  - 《历代志上》3:15
