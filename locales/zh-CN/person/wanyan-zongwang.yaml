name: 完颜宗望
aliases: [斡离不, 斡鲁补]
role: 金朝大将
summary: 完颜阿骨打之子，伐宋时统率东路军，两次围攻开封。
body: |-
  完颜宗望本名斡离不（又译斡鲁补），是完颜阿骨打的次子，生年不详。他随父亲参加灭辽战争，曾率军追击天祚帝。宋朝收容平州叛将张觉一事，就是由他出兵平定的。天会三年（1125 年）金军伐宋，他统率东路军从平州出发，燕京的宋将郭药师投降，他随即以郭药师为向导长驱南下。

  靖康元年（1126 年）正月，他率军渡过黄河，包围开封，因城防坚固、各地援军陆续赶到，宋朝又答应割让三镇、交纳巨额金银，他在二月撤军（另见“开封保卫战”条）。同年秋天他再次率东路军南下，与完颜宗翰会师开封，攻破开封（另见“靖康之变”条）。次年他押着宋徽宗等人北返，不久病死。
sources: []
recalled:
  - 《金史·宗望传》
  - 《三朝北盟会编》
