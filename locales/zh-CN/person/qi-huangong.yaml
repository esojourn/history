name: 齐桓公
aliases: [姜小白, 公子小白]
role: 齐国国君，春秋霸主
summary: 春秋第一位霸主，任用管仲改革，以“尊王攘夷”为号召，九合诸侯，晚年死于内乱。
body: |-
  齐桓公名小白，是齐僖公之子、齐襄公之弟，生年不详。齐襄公无道，小白在鲍叔牙的辅佐下出奔莒国，他的哥哥公子纠则由管仲、召忽辅佐出奔鲁国。公元前 686 年襄公被杀，次年两位公子争相回国即位。据《左传》和《史记·齐太公世家》，管仲在途中截击小白，射中他的衣带钩，小白装死，抢先赶回齐国即位，就是齐桓公。

  桓公即位后，听从鲍叔牙的推荐，不计前仇，任用管仲为相。管仲在齐国推行改革，整顿行政和军事组织，发展盐业、渔业和商业，齐国很快富强起来。桓公以“尊王攘夷”为号召：北伐山戎以救燕，帮助被狄人攻破的邢、卫两国迁都复国；公元前 656 年率诸侯之师伐楚，与楚订立召陵之盟；前 651 年在葵丘大会诸侯，周襄王派人赐给他祭肉，承认他的霸主地位。《论语·宪问》说桓公“九合诸侯，不以兵车，管仲之力也”。

  管仲死后，桓公宠信易牙、竖刁、开方等人。公元前 643 年冬桓公病重，五位公子各树党羽争立。据《史记》，桓公死后，诸子相攻，尸体在床上停放六十七天无人收殓，“尸虫出于户”。齐国从此失去了霸主地位，霸业转到晋国。

  后世多把他列为“春秋五霸”之首。
sources: []
