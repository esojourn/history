name: 石虎
aliases: [石季龙, 后赵武帝]
role: 后赵君主
summary: 石勒之侄，夺位后迁都邺城，以征发无度和残暴著称，死后后赵迅速瓦解。
body: |-
  石虎字季龙，是石勒的侄子，自幼由石勒的母亲抚养。《晋书·载记》说他性情残忍，而勇猛善战，石勒攻取各地多由他领兵，前赵的残余势力也是他消灭的。

  咸和八年（公元 333 年）石勒去世，他控制了朝政，第二年废杀石勒的儿子石弘，自称居摄赵天王。咸康元年（335 年）他把都城从襄国迁到邺城，后来改称大赵天王，临死那年才称皇帝。他在位时后赵的疆域与石勒时相当，曾出兵灭辽西的鲜卑段部，进攻慕容皝则失利而还。

  载记用很多篇幅记述他的暴政：在邺城、长安、洛阳同时大造宫殿，征发几十万人服役；为了南征和东征，命各州百姓交出马匹、制造铠甲船只；又大量搜罗民间女子充入后宫。他的几个儿子同样凶暴，太子石邃因图谋不轨被杀，后来太子石宣杀了弟弟石韬，他又用酷刑处死石宣。他尊奉西域僧人佛图澄，允许百姓出家。

  太宁元年（349 年）他去世，几个儿子争夺帝位，互相残杀，不到一年，政权落入他的养孙冉闵手中。
sources: []
recalled:
  - 《晋书·石季龙载记》
  - 《资治通鉴》卷九十五至九十八
