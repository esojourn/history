name: 刘䶮
aliases: [刘岩, 刘陟, 南汉高祖]
role: 南汉皇帝
summary: 继兄刘隐据有岭南，917 年在广州称帝，次年改国号为汉，史称南汉。
body: |-
  刘䶮原名刘岩，又名刘陟，是清海军节度使刘隐的弟弟。他的祖上原籍北方，一说是上蔡人，后来迁居岭南经商；也有学者认为他的家族出自南来的阿拉伯商人，这一说法证据不足。刘隐唐末据有广州一带，后梁封他为南海王。乾化元年（公元 911 年）刘隐去世，刘䶮继承了他的地位。

  贞明三年（917 年），刘䶮在番禺（广州）称帝，国号大越，次年改称汉，史称南汉。据史书，他晚年根据《周易》“飞龙在天”的意思，自造了一个“䶮”字作为自己的名字。他在位期间任用中原南下的士人，也重视海外贸易，但用刑极为残酷，据史书设有汤镬、铁床等酷刑。大有十五年（942 年）他去世，此后南汉君主多残暴荒淫，971 年被北宋所灭。
sources: []
recalled:
  - 《旧五代史·僭伪列传·刘陟》
  - 《新五代史·南汉世家》
  - 《资治通鉴》卷二百六十八至二百八十三
