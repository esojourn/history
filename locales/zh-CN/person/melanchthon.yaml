name: "梅兰希顿"
aliases: ["腓力·梅兰希顿", "墨兰顿", "菲利普·施瓦策德"]
role: "维滕贝格大学希腊文教授、改教家"
summary: "路德最得力的同工，著《教义要点》，执笔《奥格斯堡信条》，人称“德意志的教师”。"
body: |-
  梅兰希顿本姓施瓦策德，意思是“黑土”，1497 年 2 月生于普法尔茨的布雷滕，舅公是希伯来文学者罗伊希林，替他把姓氏译成希腊文“梅兰希顿”。他十二岁进海德堡大学，后来在蒂宾根得硕士学位。1518 年 8 月他到维滕贝格任希腊文教授，时年二十一岁，这与《历史的轨迹》第二十三章所记相合。

  他很快站到路德一边，1519 年陪路德去莱比锡辩论。该书第二十二章记路德动身去沃尔姆斯之前对他说：如果我回不来，你要继续努力，在真理上坚定不移。路德藏在瓦特堡期间，他在 1521 年出版《教义要点》，按罪、律法、恩典等题目讲解罗马书的要义，是第一部把改教的神学整理成系统的书。路德译圣经，希腊文、希伯来文上常靠他相助。

  1530 年皇帝在奥格斯堡召开帝国议会，路德因身负帝国禁令只能留在科堡，路德派的信条由梅兰希顿执笔，就是《奥格斯堡信条》。该书说这份信条是路德撰写的，这一点不确：路德只是在科堡看过稿子表示赞同。信条措辞温和，尽量说明路德派没有离开大公教会的信仰。次年他又写了《辩护文》。

  他为萨克森等地拟定学校章程，编写希腊文、拉丁文文法和各科课本，许多大学照他的办法改组，因此得了“德意志的教师”的称号。该书称他为“沉默的改教者”。他与加尔文通信交好，与布塞一样盼望新教各派合一，在圣餐和人的意志等问题上后来的讲法与路德有些不同。

  路德死后，施马尔卡尔登战争失败，他同意在礼仪等“无关紧要之事”上向皇帝让步，被严守路德原意的一派指为背叛，晚年在争吵中度过。1560 年 4 月 19 日他在维滕贝格去世，葬在城堡教堂路德的墓旁。
