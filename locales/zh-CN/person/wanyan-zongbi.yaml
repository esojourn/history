name: 完颜宗弼
aliases: [兀术, 斡啜, 金兀术]
role: 金朝都元帅
summary: 金太祖第四子，多次率军南侵，渡江追击宋高宗；后主持对宋战事，订立绍兴和议。
body: |-
  完颜宗弼女真名兀术（又译斡啜），是金太祖完颜阿骨打的第四个儿子，生年不详。他早年随军攻辽，参与了灭北宋的战争。宋人习惯称他为“金兀术”，后世小说、戏曲中的“金兀术”就是以他为原型。

  建炎三年（1129 年）冬，宗弼率金军渡过长江，攻下建康，又一路追击宋高宗，攻入临安、明州，派船入海追赶，没有追上。次年春他率军北撤，在镇江一带被韩世忠的水军截击，被困黄天荡，最后开凿河道才得脱身；在建康附近又遭岳飞截击（另见“黄天荡之战”条）。此后金军不再大举渡江。绍兴元年（1131 年）他转攻川陕，在和尚原被吴玠击败，据记载本人中箭，仅以身免。

  绍兴七年（1137 年）金朝废掉伪齐刘豫，宗弼参与其事。金朝内部在是否把河南、陕西归还宋朝的问题上有争论，宗弼反对归还。绍兴九年（1139 年）主和的完颜昌（挞懒）等人被诛，宗弼掌握兵权，次年撕毁和约，再次南侵，夺回河南、陕西，但在顺昌被刘锜击败，在郾城、颍昌被岳飞击败（另见“顺昌之战”“郾城之战”条）。

  此后宋金重开和议。据《宋史·岳飞传》，宗弼曾致书秦桧，说宋朝早晚请和，而岳飞正图谋河北，一定要杀了岳飞才可以议和。绍兴十一年（1141 年）宋金订立绍兴和议，以淮河至大散关为界（另见“绍兴和议”条）。宗弼此后任都元帅、太师，领三省事，总揽金朝军政，皇统八年（1148 年）去世。
sources: []
recalled:
  - 《金史·宗弼传》
  - 《宋史·岳飞传》
  - 《三朝北盟会编》
