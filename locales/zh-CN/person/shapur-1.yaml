name: 沙普尔一世
aliases: [沙普尔, 沙布尔一世, 萨波尔一世]
role: 萨珊波斯国王
summary: 萨珊波斯第二代国王，三次击败罗马，公元 260 年俘虏皇帝瓦勒良。
body: |-
  沙普尔一世是阿尔达希尔一世的儿子，约生于公元 215 年。240 年前后父亲立他同为国王，两年后他独自在位。他的事迹主要见于他自己留下的一篇长铭文，用中古波斯文、帕提亚文和希腊文三种文字刻在纳克什·鲁斯塔姆一座石塔的墙上。铭文里他自称“伊朗和非伊朗的众王之王”，列举了治下的各省和对罗马的三次胜利。

  第一次，罗马皇帝戈尔迪安三世来攻，244 年在幼发拉底河边的米西克战败身死；继位的菲利普求和，据铭文付了五十万第纳里。罗马方面的史书说戈尔迪安是被部下害死的。第二次在 252 年以后，他说在巴巴利索斯歼灭六万罗马军，攻下安条克等三十七座城。第三次是 260 年，他在卡莱和埃德萨一带打败号称七万人的罗马军，“亲手”擒获皇帝瓦勒良。罗马皇帝被敌国生俘，这是第一次。

  他撤军途中遭到帕尔米拉的奥登纳图斯袭击，损失不小，此后没有再大举西进。被俘的罗马军民被迁到波西斯和胡齐斯坦，后世相传舒什塔尔的拦河坝就是这些俘虏修的，新城比沙普尔和贡德沙普尔也安置了他们。瓦勒良死在囚禁中。基督教作家拉克坦提乌斯说，沙普尔上马时拿他当脚凳，死后把他的皮剥下来染红挂在神庙里；这是几十年后带着护教用意的说法。波斯崖壁上的浮雕只刻着罗马皇帝在他马前下跪或被他握住手腕。

  摩尼教的创立者摩尼在他的宫廷里受到接待，并把一部著作题献给他；同时琐罗亚斯德教的祭司卡提尔也在他手下开始得势。他约在 270 年去世，一说 272 年。
sources: []
