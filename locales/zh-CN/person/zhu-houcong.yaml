name: 嘉靖帝
aliases: [朱厚熜, 明世宗]
role: 明朝第十一代皇帝
summary: 以藩王入继大统，引发“大礼议”；在位四十五年，崇信道教，长期不上朝，倚重严嵩。
body: |-
  朱厚熜是兴献王朱祐杬的儿子，弘治帝的侄子，生于安陆州（今湖北钟祥）。正德十六年（1521 年）正德帝死后无子，朱厚熜被迎入北京即位，次年改元嘉靖。

  即位不久，他就与内阁首辅杨廷和等大臣发生争执：大臣们要求他以伯父弘治帝为“皇考”，称生父为“皇叔父”，他坚持尊生父为皇帝，这场争论持续了三年多，史称“大礼议”（另见“大礼议”条）。嘉靖三年（1524 年）两百多名官员在左顺门跪哭请愿，他下令廷杖，十多人被打死，最终尊生父为“皇考恭穆献皇帝”。经过这次事件，他牢牢掌握了权力，张璁、桂萼等支持他的人得到重用。

  嘉靖初年他整顿吏治，清理庄田，裁革冗员，颇有一番作为。中年以后他崇信道教，追求长生，在宫中频繁举行斋醮，重用撰写青词的大臣，二十多年不上朝。嘉靖二十一年（1542 年）宫女杨金英等人企图趁他熟睡时将他勒死，未遂，史称“壬寅宫变”，此后他移居西苑，更少见大臣。严嵩以擅写青词得宠，专权近二十年。

  嘉靖年间北方有蒙古俺答汗屡次入侵，嘉靖二十九年（1550 年）蒙古军一度兵临北京城下（另见“庚戌之变”条）；东南沿海倭寇猖獗，朝廷起用胡宗宪、戚继光、俞大猷等人才逐渐平定（另见“嘉靖抗倭”条）。嘉靖四十五年（1566 年）户部主事海瑞上疏批评他，他大怒，将海瑞下狱。同年十二月（公历已是 1567 年 1 月）他因服食丹药中毒去世，年六十岁，儿子朱载坖即位，即隆庆帝。
sources: []
recalled:
