name: 曾国藩
aliases: [涤生, 文正]
role: 湘军统帅、两江总督
summary: 创建湘军镇压太平天国，开办安庆内军械所等洋务事业，被誉为“中兴名臣”之首。
body: |-
  曾国藩是湖南湘乡人，出身耕读之家，道光十八年（1838 年）考中进士，进入翰林院，师从唐鉴学习理学，十年之间升到礼部右侍郎。他为人严谨，注重修身，每天写日记反省自己。

  咸丰二年（1852 年）太平军进入湖南，曾国藩正在家乡为母亲守丧，奉命帮办团练。他认为八旗、绿营已经腐败无用，于是招募湘中的农民，以同乡、师生、亲友的关系组织起来，由读书人担任将领，编成湘军，又建立水师。咸丰四年（1854 年）他发布《讨粤匪檄》，以维护儒家名教为号召，率湘军出湘作战。此后他屡遭挫折，几次兵败想要自杀，但始终坚持。

  咸丰十年（1860 年）他任两江总督、钦差大臣，统一指挥长江下游的军务。咸丰十一年（1861 年）湘军攻克安庆，同治三年（1864 年）他的弟弟曾国荃攻破天京，太平天国失败（另见“太平天国”条）。湘军在作战中也有大量屠杀，曾国荃攻下天京后纵兵劫掠。战后曾国藩为了避免朝廷猜忌，主动裁撤了大部分湘军。

  曾国藩是洋务运动的开创者之一。他在安庆设立内军械所，试制轮船；同治四年（1865 年）支持李鸿章在上海创办江南制造总局；同治十一年（1872 年）与李鸿章一起奏请派遣幼童赴美留学（另见“洋务运动”“留美幼童”条）。他还推荐和提拔了李鸿章、左宗棠等大批人才。同治九年（1870 年）他奉命处理天津教案，为了避免与法国开战，处死了一批涉案的中国人，受到舆论的猛烈抨击，他自称“外惭清议，内疚神明”。

  同治十一年（1872 年）曾国藩在两江总督任上去世，谥“文正”。他的家书、日记流传很广。后世对他的评价分歧很大，有人推崇他的修身治家之道，也有人批评他镇压太平天国。
sources: []
recalled:
