name: 刘徽
aliases: []
role: 数学家
summary: 魏晋之际的数学家，为《九章算术》作注，创“割圆术”求圆周率。
body: |-
  刘徽的生平几乎没有记载，籍贯和生卒年都不清楚。《晋书·律历志》和《隋书·律历志》提到，魏陈留王景元四年（公元 263 年）刘徽注《九章算术》，这是关于他活动年代唯一明确的记录。

  《九章算术》是成书于汉代的数学问题集，原书只有题目、答案和算法。刘徽的注逐条说明算法的道理并加以证明。在注解圆面积的算法时，他提出“割圆术”：从圆内接正六边形开始，每次把边数加倍，用多边形的面积逼近圆的面积。他说：“割之弥细，所失弥少；割之又割，以至于不可割，则与圆周合体而无所失矣。”他算到正一百九十二边形，得出圆周率的近似值一百五十七比五十，即 3.14。

  他还用图形的分割拼补来证明面积、体积的算法，后人称为“出入相补”；在讨论球的体积时指出了原书公式的错误，并提出了正确的思路，但没有最终算出结果，这个问题后来由南朝的祖冲之父子解决。他附在注后的《重差》一卷，讲用两次测望来推算远处物体的高度和距离，唐代起单独成书，称为《海岛算经》。
sources: []
recalled:
  - 《晋书·律历志》
  - 刘徽《九章算术注》（序及“圆田术”注）
