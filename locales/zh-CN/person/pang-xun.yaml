name: 庞勋
aliases: []
role: 徐州戍卒首领
summary: 戍守桂州的徐州兵首领，868 年率戍卒哗变北归，攻占徐州，次年兵败身死。
body: |-
  庞勋原是徐泗军中管理粮料的小吏。咸通年间，南诏多次进犯安南，据《资治通鉴》，朝廷从徐泗一带调兵八百人戍守桂州，原定三年轮换一次，到了期限却一再拖延，到咸通九年（公元 868 年）已经戍守了六年。同年七月，戍卒们杀死都将，推举庞勋为首领，擅自北归。他们一路经过湖南、浙西、淮南，沿途有不少百姓和逃兵加入，十月攻占宿州，随后攻下徐州，杀了观察使崔彦曾，人数迅速扩大，控制了淮北一带，切断了江淮通往长安的漕运。庞勋向朝廷请求授予节度使的官职，被拒绝（另见“庞勋起义”条）。

  朝廷任命康承训为统帅，征调各地兵马，并调来沙陀首领朱邪赤心率领的骑兵。咸通十年（869 年）九月，庞勋在蕲县被唐军击败，战死。朱邪赤心因功被赐姓名为李国昌，他的儿子就是后来的李克用。这次兵变虽然只持续了一年多，但暴露了唐朝军事和财政的困境，后世史家常把它看作唐亡的先兆。
sources: []
recalled:
  - 《旧唐书·懿宗纪》
  - 《新唐书·康承训传》
  - 《资治通鉴》卷二百五十一
