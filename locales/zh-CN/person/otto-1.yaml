name: 奥托一世
aliases:
  - 奥托大帝
  - 奥图一世
role: 德意志国王、皇帝
summary: 德意志国王，955 年击败马扎尔人，962 年在罗马由教皇约翰十二世加冕为皇帝。
body: |-
  奥托生于公元 912 年，是萨克森公爵、德意志国王亨利一世的儿子。936 年他在亚琛查理曼的教堂里加冕为王。

  即位之初，几位公爵和他自己的兄弟、儿子先后起兵反对他。《历史的轨迹》第十一章说，他靠着拥有大片土地的主教和修道院院长压服了公侯贵族，因为任何贵族都敌不过国王与教会的联合。主教和院长由他指派，授给戒指和权杖，这就是“平信徒授衣礼”（俗人授职）；他们没有后嗣可以继承封地，比世俗诸侯可靠。该书说，从这时直到拿破仑时代，德意志的主教和院长同时也是世俗的统治者。

  951 年他第一次进兵意大利，在帕维亚称伦巴第王。955 年 8 月他在奥格斯堡附近的莱希费尔德击败马扎尔人，此后马扎尔人不再侵扰西欧。

  教皇约翰十二世受意大利王贝伦加尔威胁，向他求援。奥托再次南下，962 年 2 月 2 日在罗马由约翰加冕为皇帝。《历史的轨迹》说，这使查理曼之后分崩离析的帝国重新恢复，并从此与德意志结合在一起，直到 1806 年。奥托随即颁布特许状，确认丕平和查理曼献给教皇的土地，同时规定新教皇就任前要向皇帝宣誓效忠。次年约翰转而联络奥托的敌人，奥托回到罗马，召开会议废掉约翰，另立利奥八世，又要罗马人发誓，不经皇帝同意不选教皇。

  968 年他在马格德堡设立大主教区，向易北河以东的斯拉夫人传教。973 年 5 月他在梅姆莱本去世，葬在马格德堡。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十一章“教会被政府控制” https://wellsofgrace.com/books/spiritual/2000years/html/chapter13.html"
recalled:
  - 维杜金德《萨克森人史》
  - 克雷莫纳的利乌特普兰德《奥托史》
  - 962 年《奥托特许状》
