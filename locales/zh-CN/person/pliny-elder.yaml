name: 老普林尼
aliases: [盖乌斯·普林尼乌斯·塞孔都斯, 大普林尼, 普林尼]
role: 博物学家、舰队司令
summary: 《博物志》的作者，公元 79 年维苏威火山爆发时前往救援，死在斯塔比亚。
body: |-
  老普林尼于公元 23 或 24 年生在意大利北部的科穆姆，出身骑士之家。他年轻时在莱茵河一带的军中做了十来年骑兵军官，与后来的皇帝提图斯同过营帐。韦斯巴芗即位后，他接连出任几个行省的财务代理官，是皇帝信任的人，每天天不亮就去见韦斯巴芗。

  外甥小普林尼在一封信里开列了他的著作，有论骑兵投枪的小册子、二十卷的日耳曼战争史、三十一卷接续前人的当代史，以及语法和修辞方面的书，都没有流传下来。留下的只有三十七卷的《博物志》，公元 77 年题献给提图斯。他在序里说，全书从一百位主要作者的约两千卷书里采集了两万条值得知道的事实。书的内容依次是宇宙、地理、人、动物、植物、药物，最后是矿物以及用矿物做成的颜料和雕塑，古代许多画家、雕塑家的事迹只见于这一部分。书里真伪杂陈，他见书就抄，很少亲自验证。

  小普林尼说舅舅睡得极少，吃饭、洗澡后擦身时都叫人念书给他听，出门坐轿子，为的是路上还能读写；他留下一百六十卷两面写满小字的摘抄。

  他最后的职务是驻米塞努姆的舰队司令。79 年维苏威火山爆发那天，他先是想就近察看这片奇怪的云，接到山脚下友人的求救后改派大船前往救人。船靠不了岸，他转往斯塔比亚的朋友家过夜。第二天清晨浮石越落越厚，众人头顶枕头逃到海边，风浪仍大，无法上船；他躺在一块帆布上，起身时倒下死去，终年五十五岁。小普林尼认为他是被浓烟呛住了气管。这段经过出自小普林尼多年后应塔西佗之请写的信。
sources: []
recalled:
  - 小普林尼《书信集》卷 3 第 5 封、卷 6 第 16 封
  - 老普林尼《博物志》序言
  - 苏维托尼乌斯《名人传》所存老普林尼小传
