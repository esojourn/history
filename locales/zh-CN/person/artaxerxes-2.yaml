name: 阿尔塔薛西斯二世
aliases: [亚达薛西二世, 阿尔塔薛西斯·姆涅蒙]
role: 波斯国王
summary: 波斯国王，在位四十六年，击败其弟小居鲁士，以“大王和约”收回小亚细亚的希腊城邦。
body: |-
  大流士二世与王后帕吕萨提斯的长子，即位前名阿尔萨凯斯，希腊人称他“姆涅蒙”（记性好的人）。公元前 404 年继位，在位到前 358 年，是阿契美尼德王朝在位最久的国王。他的生年不详，普鲁塔克说他活了九十四岁，学者一般认为偏高。

  据普鲁塔克，他在帕萨尔加德行即位礼时，弟弟小居鲁士被告发图谋行刺，经母亲求情获赦，返回小亚细亚任所。前 401 年小居鲁士率军东进争位，其中有一万多名希腊雇佣兵。两军在巴比伦以北的库纳克萨交战，小居鲁士冲向国王并将其刺伤，自己被杀。为国王治伤的是希腊医生克特西亚斯，他后来写了一部《波斯志》，现存只有摘要。

  小亚细亚的希腊城邦曾支持小居鲁士，战后求助于斯巴达，波斯与斯巴达由此开战。国王采纳总督法那巴佐斯的办法，起用雅典人科农统领舰队，前 394 年在克尼多斯击败斯巴达海军，又出钱支持底比斯、雅典等邦在希腊本土牵制斯巴达。前 387 年至前 386 年，他以敕令的形式规定了希腊各邦的和约条件，亚洲的希腊城邦和塞浦路斯归他所有，史称“大王和约”。

  他在位期间的失利主要在埃及。埃及在他即位前后脱离波斯，前 373 年法那巴佐斯与雅典将军伊菲克拉特斯率军讨伐，没有成功。他还亲征过里海西南的卡杜西亚人。前 360 年代小亚细亚多位总督相继反叛，史称“总督大叛乱”，最后因内部互相出卖而平息。

  他在苏萨重建了被焚的大殿，在埃克巴坦那也有营建。他的铭文在阿胡拉·马兹达之外还提到阿娜希塔和密特拉两位神，这在波斯王室铭文中是首次。他的宫廷纷争，如母亲帕吕萨提斯毒死王后斯塔泰拉，主要见于普鲁塔克依据克特西亚斯等人所写的传记。前 358 年他去世，其子奥科斯继位，即阿尔塔薛西斯三世。
sources: []
recalled:
  - 普鲁塔克《阿尔塔薛西斯传》
  - 色诺芬《长征记》卷一；《希腊史》卷五第 1 章
  - 狄奥多罗斯《历史丛书》卷十四、卷十五
