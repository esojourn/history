name: 陈寿
aliases: [陈承祚]
role: 史学家
summary: 西晋史学家，原为蜀汉官员，入晋后撰成《三国志》。
body: |-
  据《晋书·陈寿传》和《华阳国志》，陈寿字承祚，巴西安汉人，年轻时跟随同郡的学者谯周学习。他在蜀汉任观阁令史等职。本传说当时宦官黄皓专权，大臣多曲意附和，陈寿不肯屈从，因此屡次被贬。

  蜀汉灭亡后，他有几年没有出仕，后来得到晋朝大臣张华的赏识，被举为孝廉，任佐著作郎、著作郎。泰始十年（公元 274 年），他把编定的《诸葛亮集》二十四篇上奏朝廷。

  晋灭吴以后，陈寿汇集魏、蜀、吴三国的史料，撰成《三国志》六十五卷，其中魏书三十卷、蜀书十五卷、吴书二十卷。全书以魏为正统，只有魏的君主立“纪”，蜀、吴的君主都入“传”。本传说当时人称赞他“善叙事，有良史之才”；夏侯湛正在写《魏书》，看到陈寿的书后便毁掉了自己的稿子。《晋书》也记下了两则对他不利的传闻，说他向丁仪的儿子索要米粮不成而不为丁仪兄弟立传，又说他因父亲受过诸葛亮的处罚而贬低诸葛亮的将才；后世学者多认为这两种说法靠不住。

  陈寿晚年仕途不顺，因母亲的丧葬不合乡里的礼俗而受到非议。元康七年（297 年）病死，终年六十五。他死后，朝廷派人到他家中抄录《三国志》。南朝宋时裴松之奉命为此书作注，引用了大量陈寿未采或后出的史料，注文与原书一并流传至今。
sources: []
recalled:
  - 《晋书·陈寿传》
  - 常璩《华阳国志·后贤志》
  - 裴松之《上三国志注表》
