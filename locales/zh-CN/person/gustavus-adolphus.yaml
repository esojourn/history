name: "古斯塔夫二世·阿道夫"
aliases: ["古斯塔夫·阿道弗斯", "亚道夫", "北方雄狮"]
role: "瑞典国王"
summary: "瑞典国王，1630 年率军进入德意志援救新教一方，两年间扭转战局，战死于吕岑。"
body: |-
  古斯塔夫 1594 年 12 月 9 日生于斯德哥尔摩，是瓦萨王朝查理九世的儿子，受路德宗的教育，通几种语言。1611 年父亲去世，他十六岁即位，接手的是同丹麦、俄国、波兰三面的战争。他用奥克森谢纳为首相，先后与丹麦、俄国议和，同信天主教并且自称有瑞典王位继承权的波兰国王打了多年。他改革军队：按地区征兵，缩小步兵的方阵，增加火枪和轻便的野战炮，骑兵持剑冲锋，军中每天早晚祈祷。

  德意志的战争从 1618 年打起。到 1629 年，皇帝的军队已推进到波罗的海沿岸，皇帝下令新教诸侯交还 1552 年以来占有的全部教会产业。《历史的轨迹》第三十章说，在这危急关头兴起了另一位伟大的改教英雄，瑞典国王亚道夫，他起来为拯救新教而战。他出兵既为同信仰的人，也为瑞典在波罗的海的安全；他的军费有一大部分出自天主教法国的首相黎塞留，因为法国要削弱哈布斯堡家。

  1630 年 7 月他带一万多人在波美拉尼亚登陆。德意志的新教诸侯起初不敢同他结盟。1631 年 5 月皇帝的军队攻破马格德堡，全城被烧，居民死了约两万，他没有来得及救援，萨克森等邦这才倒向他。9 月 17 日他在莱比锡附近的布赖滕费尔德大败蒂利率领的天主教联军，这是新教一方开战以来的第一场大胜。随后他挥师南下，一路打到莱茵河和巴伐利亚，1632 年春进了慕尼黑。

  皇帝重新起用华伦斯坦。1632 年 11 月 16 日两军在莱比锡西南的吕岑交战，那天有雾，古斯塔夫带骑兵冲锋时与部下失散，中弹落马而死。瑞典军仍然赢了这一仗。他的女儿克里斯蒂娜六岁继位，奥克森谢纳主持国政，把战争打到 1648 年。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
recalled:
  - "1631 年《贝尔瓦尔德条约》"
  - "《瑞典军事条令》（1621 年）"
  - "开姆尼茨《瑞典王国在德意志的战争》"
  - "奥克森谢纳书信与文书"
