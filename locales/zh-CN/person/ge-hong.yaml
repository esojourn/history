name: 葛洪
aliases: [葛稚川, 抱朴子]
role: 道教学者、医学家
summary: 东晋道教学者、医学家，著有《抱朴子》和《肘后备急方》，晚年在罗浮山炼丹。
body: |-
  葛洪字稚川，自号抱朴子，丹阳句容人。他的祖父在吴国做过高官，叔祖葛玄是吴时有名的方士。他十三岁丧父，家境贫困，据《晋书》本传，他靠砍柴换来纸笔，夜里抄书诵读，后来跟随葛玄的弟子郑隐学习炼丹之术。

  太安二年（公元 303 年）张昌的部将石冰攻入扬州，他应募领兵参战有功。此后他想到洛阳搜求异书，因战乱不成，辗转到了广州，在南方住了多年，拜南海太守鲍靓为师，并娶了他的女儿。回到家乡后，司马睿和王导先后召他任职，他因旧功受封关内侯。后来他听说交趾出产丹砂，请求出任那里的句漏县令，带着子侄南行，到广州被刺史邓岳留住，便在罗浮山炼丹著述，直到去世。本传说他卒年八十一，另有六十一岁之说，按后一说约在建元元年（343 年）。

  他的《抱朴子》分内外两篇：内篇讲神仙、炼丹、养生，是早期道教最重要的著作之一，其中记载的炼丹方法保存了古代化学的资料；外篇讨论世事和人物的得失。他还编有《肘后备急方》，收录简便易得的急救药方，书中对一些传染病的症状有较早的记述。《神仙传》也题为他所撰。
sources: []
recalled:
  - 《晋书·葛洪传》
  - 《抱朴子·外篇·自叙》
