name: 马可·奥勒留
aliases:
  - 马可奥热流
  - 马可·奥勒留·安东尼
role: 罗马皇帝
summary: 罗马皇帝，斯多亚派哲学家，著《沉思录》；在位时里昂等地的基督徒受到逼迫。
body: |-
  马可·奥勒留于公元 121 年生在罗马，出身于来自西班牙的元老家族。哈德良皇帝晚年安排继承人时，让安东尼·庇护收他为养子。他自幼喜好哲学，尤其是斯多亚派。公元 161 年安东尼·庇护去世，他继位，并让义弟路奇乌斯·维鲁斯与他同为皇帝，直到维鲁斯 169 年去世。

  他在位的十九年里战事和灾祸不断。东方有与帕提亚的战争（161—166 年），军队回师时带回一场大瘟疫，蔓延全国多年。从 166 年前后起，马科曼尼人、夸迪人等越过多瑙河，一度打到意大利北部，他后半生大部分时间都在多瑙河前线。他用希腊文写下的《沉思录》，有几卷就标明写于军中。

  他处理政务和诉讼很勤，设了专管孤儿监护事务的裁判官。175 年叙利亚总督阿维狄乌斯·卡西乌斯听信皇帝已死的传言而称帝，三个月后被部下所杀，马可下令不追究他的家属和同党；皇后福斯蒂娜在随他东行途中去世。《沉思录》共十二卷，是写给自己看的札记：第一卷逐一列举从亲人和师长身上学到的东西，其余各卷反复劝自己顺应自然、尽本分，不为毁誉和死亡所动。书名是后人加的。

  他在位时，各地多次发生对基督徒的杀害。护教士游斯丁约在 165 年于罗马被斩首；177 年高卢的里昂和维也纳教会遭到大逼迫。据优西比乌所收的里昂教会的信，当地总督曾就如何处置有罗马公民身份的基督徒请示皇帝，皇帝答复说，坚持的处死，否认的释放。《历史的轨迹》第二章说他下诏把基督徒的产业归给告发的人，逼迫因此成为全国性的行动；现存史料里没有这样一道通令，当时的逼迫大多出于地方上的民众和官员，这一点如实注明。他在《沉思录》卷 11 里提到基督徒一次，认为他们的赴死出于固执。

  公元 180 年 3 月，他在多瑙河前线病逝，地点有文多博纳和西尔米乌姆两说。他让亲生儿子康茂德继位，结束了此前几代皇帝收养贤能者为继承人的做法。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二章“教会在风暴中” https://wellsofgrace.com/books/spiritual/2000years/html/chapter03.html"
recalled:
  - 《沉思录》卷 1、卷 11 第 3 章
  - 优西比乌《教会史》卷 5 第 1 章
  - 《罗马帝王纪·马可传》
  - 卡西乌斯·狄奥《罗马史》卷 72
  - 《罗马帝王纪·阿维狄乌斯·卡西乌斯传》
