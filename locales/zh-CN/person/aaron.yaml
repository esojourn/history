name: 亚伦
aliases: []
role: 以色列第一任大祭司
summary: 摩西的哥哥，替摩西向法老说话，后来受膏为第一任大祭司。
body: |-
  亚伦属利未支派，是暗兰和约基别的儿子、摩西的哥哥（《出埃及记》6:20），比摩西年长三岁（7:7）。他娶亚米拿达的女儿以利沙巴为妻，生了拿答、亚比户、以利亚撒、以他玛四个儿子（6:23）。

  摩西在何烈山蒙召时推辞说自己拙口笨舌，神就指定亚伦替他说话（4:10–16）。亚伦到神的山迎接摩西，二人同去见以色列的长老，又去见法老（4:27–5:1）。在法老面前，亚伦的杖变作蛇；头几样灾也是他伸杖引发的（第 7—8 章）。出埃及以后，以色列人在利非订与亚玛力人争战，亚伦和户珥一左一右扶着摩西的手，直到日落（17:8–13）。

  摩西在西奈山上四十昼夜未归，百姓聚集到亚伦那里，要他造神像。亚伦收了他们的金耳环，铸成一只牛犊，又在牛犊面前筑坛（32:1–6）。摩西下山责问，亚伦说是百姓专于作恶。此后按照神在山上的吩咐，亚伦和他的儿子受膏承接圣职，由他作大祭司（《利未记》第 8—9 章）；他的两个儿子拿答、亚比户因献上凡火，死在耶和华面前（10:1–2）。

  在旷野的年间，亚伦曾与米利暗一同毁谤摩西（《民数记》第 12 章）。可拉一党攻击摩西、亚伦以后，十二支派各交一根杖放在会幕里，只有亚伦的杖发芽开花，结了熟杏（第 16—17 章）。在米利巴击打磐石一事上，他与摩西同被宣告不得进入应许之地（20:12）。

  据《民数记》20:22–29，会众到了何珥山，摩西带亚伦和他的儿子以利亚撒上山，把亚伦的圣衣脱下来给以利亚撒穿上，亚伦就死在山顶，以色列全家为他哀哭了三十天。又据 33:38–39，那是以色列人出埃及后第四十年五月初一日，亚伦死时一百二十三岁。此后大祭司的职分由他的子孙承袭。
