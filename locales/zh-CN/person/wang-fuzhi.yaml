name: 王夫之
aliases: [而农, 船山先生]
role: 思想家、哲学家
summary: 曾仕南明永历朝，后隐居衡阳石船山著书四十年。
body: |-
  王夫之是湖广衡州（今湖南衡阳）人，崇祯十五年（1642 年）考中举人。明亡后，顺治五年（1648 年）他在衡山举兵抗清，失败后投奔永历政权，在肇庆任行人司行人。他因为弹劾权臣王化澄，几乎被害，在大将高必正的营救下才得以脱身，后来投奔桂林的瞿式耜。顺治七年（1650 年）桂林失陷，瞿式耜殉难，他回到湖南，从此隐居不出。

  此后四十多年，王夫之隐居在湘西的山中，晚年住在衡阳石船山下的“湘西草堂”，学者称他为船山先生。他坚持明朝遗民的身份，据说出门时即使天晴也要打伞、穿木屐，表示不戴清朝的天、不踩清朝的地，这一说法见于后人的记载。他在极其贫困的条件下著书立说，一生著作有一百多种、四百多卷。

  王夫之的学问涉及经学、史学、哲学、文学等许多方面。在哲学上，他继承和发展了张载的气学，主张“气”是宇宙的本体，“理”在“气”中；在知行关系上主张“行可兼知”。他的史论著作《读通鉴论》《宋论》评论历代的治乱得失，有许多独到的见解。他强调“夷夏之防”，对清朝的统治怀有强烈的抵触。

  王夫之的著作在他生前和清代长期没有刊印，只在少数人中传抄。道光年间他的后人和同乡开始刊刻他的遗书，同治初年曾国藩、曾国荃兄弟在南京主持刊印《船山遗书》，他的思想才广为人知，对谭嗣同等晚清人物影响很大。康熙三十一年（1692 年）他在湘西草堂去世。
sources: []
recalled:
  - 王敔《大行府君行述》
  - 王夫之《读通鉴论》
  - 《清史稿·儒林传》
