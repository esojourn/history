name: 杨凝式
aliases: [杨景度, 杨风子, 杨少师]
role: 书法家
summary: 历仕五代各朝的书法家，佯狂避祸，人称杨风子，有《韭花帖》等传世。
body: |-
  杨凝式是华阴人，字景度，咸通十四年（公元 873 年）生，唐昭宗时考中进士。他的父亲杨涉是唐朝的宰相，唐亡时奉命把传国玺交给朱温。据史书，杨凝式曾劝阻父亲，事后担心此话泄露招祸，便假装疯癫，人称“杨风子”。

  此后他历仕后梁、后唐、后晋、后汉、后周，多任闲散官职，晚年官至太子太保，世称“杨少师”。他长期住在洛阳，据宋人记载，他喜欢游览洛阳的寺院道观，遇到墙壁粉白光洁，便随兴题写诗文，洛阳寺观的墙壁上布满了他的书迹。显德元年（954 年）他在洛阳去世，年八十二。

  杨凝式的书法初学欧阳询、颜真卿，后来自成一家。传世的作品有《韭花帖》《卢鸿草堂十志图跋》《夏热帖》《神仙起居法》等，风格变化很大，《韭花帖》疏朗清秀，《夏热帖》《神仙起居法》则纵逸奔放。宋代的苏轼、黄庭坚、米芾都推崇他，认为他在唐代以后承前启后，是五代最重要的书法家。
sources: []
recalled:
  - 《旧五代史·周书·杨凝式传》
  - 《新五代史·杂传·杨凝式》
  - 黄庭坚《山谷题跋》
