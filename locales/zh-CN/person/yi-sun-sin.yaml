name: 李舜臣
aliases: [忠武公]
role: 朝鲜王朝的水军将领
summary: 壬辰战争中统领朝鲜水军，以龟船等战船屡败日本水军，1598 年在露梁海战中阵亡。
body: |-
  李舜臣是朝鲜汉城人，1576 年考中武科，先后在北方边境和南方任职。1591 年他被任命为全罗左道水军节度使，驻守丽水。他到任后整修战船，建造并改进了“龟船”，这种船的船顶覆盖铁刺，可以冲入敌阵作战。

  1592 年日本大举进攻朝鲜，朝鲜陆军节节败退，国王宣祖逃到义州。李舜臣率领水军在玉浦、泗川、闲山岛等地接连击败日本水军，其中闲山岛海战摧毁了大量日本船只，切断了日军经海路向北方运送补给的通道。1593 年他被任命为三道水军统制使。后来他因为受到诬陷，加上朝鲜朝廷党争，被逮捕下狱，以白衣从军。他离开后，朝鲜水军在漆川梁海战中几乎全军覆没。

  1597 年李舜臣重新出任统制使，仅以收集到的十余艘战船在鸣梁海峡击退了数量多得多的日本船队。1598 年丰臣秀吉死后，日军准备撤退，李舜臣与明朝水军将领陈璘、邓子龙一起在露梁海域截击撤退的日军，激战中他中弹身亡，据记载他临终前嘱咐不要宣布他的死讯。明将邓子龙也在这次战斗中战死。李舜臣死后谥“忠武”，他留下的《乱中日记》是研究这场战争的重要史料。

  李舜臣在朝鲜和韩国被尊为民族英雄，他的事迹在朝鲜王朝后期就已被广泛传颂。关于龟船的具体构造，由于没有实物留存，现代的复原各不相同。
sources: []
recalled:
  - 李舜臣《乱中日记》
  - 柳成龙《惩毖录》
  - 《明史·陈璘传》
