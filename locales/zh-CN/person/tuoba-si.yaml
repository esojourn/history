name: 魏明元帝
aliases: [拓跋嗣, 魏太宗]
role: 皇帝
summary: 北魏第二位皇帝，平定拓跋绍之乱即位，晚年乘刘裕去世夺取河南之地。
body: |-
  拓跋嗣是北魏道武帝拓跋珪的长子，母亲刘贵人。北魏有“子贵母死”的制度，立太子之前先赐死其生母。天赐六年（公元 409 年），拓跋珪要立他为太子，先赐死了刘贵人，他悲泣不止，拓跋珪发怒，他只得出逃。同年，拓跋珪被次子拓跋绍杀死，拓跋嗣回到平城，杀拓跋绍及其母贺夫人，即位，年号永兴。

  他在位时重用崔浩等汉族士人。泰常元年至二年（416—417 年）刘裕北伐后秦，魏军在黄河北岸尾随刘裕的船队，被刘裕以“却月阵”击败，此后魏军没有再阻拦。泰常七年（422 年）刘裕去世，他不听崔浩的劝阻，出兵南下攻宋，次年攻取洛阳、虎牢、滑台等地，黄河以南大片土地归魏。同年，他下令在北边修筑长城，以防柔然。泰常八年（423 年）他在平城去世，年三十二，长子拓跋焘继位。
sources: []
recalled:
  - 《魏书·太宗纪》
  - 《资治通鉴》卷一百一十五至一百一十九
