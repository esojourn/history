name: 杜甫
aliases: [杜子美, 杜少陵, 杜工部, 诗圣]
role: 诗人
summary: 唐代诗人，诗作反映安史之乱前后的社会动荡，被称为“诗史”，后世尊为“诗圣”。
body: |-
  杜甫字子美，自号少陵野老，河南巩县人，祖父是武则天时的诗人杜审言。他青年时代漫游吴越、齐赵一带，开元二十三年（公元 735 年）前后在洛阳应进士试落第。天宝三载（744 年）他在洛阳与李白相识，两人同游梁宋、齐鲁，结下深厚的友谊。

  天宝五载（746 年）前后他来到长安求官，在长安困居将近十年。天宝六载（747 年）玄宗诏天下有一技之长者到京应试，李林甫让考官一个不录，他也在落选之列。天宝十载（751 年）他向玄宗献上《三大礼赋》，得到赏识，命他待制集贤院，但仍没有得到实职。天宝十四载（755 年）他才被授予右卫率府胄曹参军这一小官。同年十一月他到奉先县探望家人，写下《自京赴奉先县咏怀五百字》，其中有“朱门酒肉臭，路有冻死骨”之句，这时安禄山刚刚在范阳起兵。

  安史之乱中，他在投奔肃宗的途中被叛军俘获，困在长安，写下了《春望》等诗。至德二载（757 年）他逃到凤翔，肃宗任他为左拾遗，不久因上书营救房琯触怒肃宗，后被贬为华州司功参军。乾元二年（759 年）他写下了“三吏”“三别”等反映战乱中百姓疾苦的诗篇，同年弃官西行，经秦州、同谷，年底到达成都。

  在成都，他得到友人严武等人的接济，在浣花溪畔建了草堂。严武推荐他任节度参谋、检校工部员外郎，所以后世称他“杜工部”。永泰元年（765 年）严武去世，他离开成都，后在夔州住了近两年。大历三年（768 年）他出三峡，漂泊于湖北、湖南一带，大历五年（770 年）冬在由潭州往岳阳的湘江船上去世，年五十九。

  他的诗现存一千四百多首，真实记录了唐朝由盛转衰的过程，被称为“诗史”。他擅长律诗，格律严谨，后世尊他为“诗圣”，与李白并称“李杜”。
