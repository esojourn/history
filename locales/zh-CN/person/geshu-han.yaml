name: 哥舒翰
aliases: [西平郡王]
role: 陇右、河西节度使
summary: 突骑施族名将，攻取吐蕃石堡城，安史之乱中奉命守潼关，出关大败被俘。
body: |-
  哥舒翰是突骑施哥舒部人，世居安西。他早年在河西节度使王忠嗣部下，与吐蕃作战屡立战功，后来接任陇右节度使。天宝八载（公元 749 年），他奉命攻打吐蕃的石堡城，攻下城池，据《资治通鉴》，唐军死者数万。此后他兼任河西节度使，封西平郡王，与安禄山同为当时最有权势的边将，两人素来不和。

  天宝十四载（755 年）他中风在家休养。安禄山起兵后，唐玄宗任命他为兵马副元帅，带病统兵镇守潼关，据《资治通鉴》兵力八万、号称二十万。他主张坚守不出，等待叛军内部生变。宰相杨国忠怀疑他会对自己不利，劝玄宗催他出战。天宝十五载（756 年）六月，他被迫出关，在灵宝西原中了叛将崔乾祐的埋伏，全军溃败，潼关随即失守，玄宗出逃（另见“潼关之战”条）。

  他逃回关西驿时，被部将火拔归仁劫持，送到洛阳投降安禄山。至德二载（757 年）唐军收复洛阳前，他被安庆绪杀死。他的生年史书没有明确记载。
sources: []
recalled:
  - 《旧唐书·哥舒翰传》
  - 《新唐书·哥舒翰传》
  - 《资治通鉴》卷二百一十六至二百一十八
