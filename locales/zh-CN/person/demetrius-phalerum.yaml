name: 法勒隆的德米特里
aliases: [法勒鲁姆的德米特里]
role: 雅典执政、漫步派学者
summary: 漫步派学者，替卡山德治理雅典十年，后流亡埃及，相传是亚历山大图书馆的倡议者。
body: |-
  雅典法勒隆村社人，约生于公元前 350 年，出身不高，是提奥弗拉斯托斯的学生，以演说和著述知名。前 317 年雅典与卡山德议和，接受马其顿驻军和以财产限定公民资格的政体，卡山德指定他主管城邦，此后十年雅典实际由他一人治理。

  他立法限制丧葬和宴会的铺张，设“妇女监察官”查察奢侈，设“法律监护官”监督官员和公民大会；富人出资承办合唱队的旧制改由城邦出钱办理。据阿特奈奥斯转述，他主持过一次人口清查，得公民二万一千人、外侨一万人、奴隶四十万人，其中奴隶的数目学者多不相信。这十年雅典没有战事，收入增加。据第欧根尼·拉尔修，雅典人为他立了三百六十座铜像。

  前 307 年围城者德米特里的舰队驶入比雷埃夫斯，宣布恢复雅典的民主政体。他被准许离境，去了底比斯，他的铜像几乎全被推倒熔毁。卡山德死后，他到埃及投奔托勒密一世。后世相传，是他建议托勒密搜集天下图书、创办博学园和图书馆。《阿里斯提亚书信》把他说成托勒密二世的图书馆长，由他提议翻译犹太人的律法书，这在年代上与下面的记载不合。

  据第欧根尼·拉尔修，他曾劝托勒密一世立前妻所生之子为继承人，结果即位的是另一位王子托勒密二世，他被拘禁在乡间，不久在睡梦中被毒蛇咬死，事在约前 280 年。他的著作很多，涉及政治、历史、修辞和文学，还编过一部伊索寓言集，都已失传。
sources: []
recalled:
  - 第欧根尼·拉尔修《名哲言行录》卷五第 75—85 节
  - 阿特奈奥斯《智者之宴》卷六 272c
  - 狄奥多罗斯《历史丛书》卷十八第 74 章、卷二十第 45 章
