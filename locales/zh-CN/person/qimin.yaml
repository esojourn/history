name: 启民可汗
aliases: [阿史那染干, 突利可汗]
role: 东突厥可汗
summary: 依附隋朝的东突厥可汗，娶隋朝的安义、义成两位公主，隋炀帝曾北巡到他的牙帐。
body: |-
  启民可汗名阿史那染干，原号突利可汗，在突厥分裂后统领东突厥北部。他向隋朝求婚，开皇十七年（公元 597 年）隋文帝把宗室女安义公主嫁给他。突厥的都蓝可汗因此攻打他，他在开皇十九年（599 年）兵败投奔隋朝，隋文帝册封他为意利珍豆启民可汗，把他安置在漠南，又在安义公主死后把义成公主嫁给他。此后在隋朝的支持下，他逐渐收拢了东突厥各部。

  他始终对隋朝恭顺。大业三年（607 年）隋炀帝北巡到他的牙帐，据《隋书·突厥传》，他亲自拔草清理御道，炀帝十分高兴。炀帝用宇文恺设计的可坐数千人的大帐宴请他和部众。大业五年（609 年）他去世，他的儿子始毕可汗继位。始毕可汗在隋末势力大增，大业十一年（615 年）把隋炀帝围困在雁门。
sources: []
recalled:
  - 《隋书·突厥传》
  - 《北史·突厥传》
