name: 西底家
aliases:
  - 玛探雅
role: 南国犹大末代王
summary: 约西亚之子，由尼布甲尼撒所立，后背叛巴比伦，城破被剜眼掳去。
body: |-
  犹大王约西亚的儿子，原名玛探雅，母亲名叫哈慕他。公元前 597 年，巴比伦王尼布甲尼撒把他的侄儿约雅斤王掳到巴比伦，立玛探雅代替作王，给他改名叫西底家（《列王纪下》24:17）。据 24:18，他登基时二十一岁，在耶路撒冷作王十一年。

  西底家后来背叛巴比伦王（24:20）；《以西结书》17:15 说他打发使者往埃及去，要埃及给他马匹和军兵。先知耶利米一再劝他服事巴比伦王（《耶利米书》第 27 章、38:17–18）。据《耶利米书》第 37—38 章，围城期间西底家几次私下求问耶利米，却又任凭首领们把耶利米下在淤泥的牢狱里，后来准许古实人以伯米勒把他救上来。

  据《列王纪下》25:1–7，西底家九年十月初十日，尼布甲尼撒率全军来围困耶路撒冷；十一年四月初九日，城里饥荒甚重，城被攻破。西底家和兵丁夜间从靠近王园的两城中间的门逃出，往亚拉巴去，在耶利哥的平原被迦勒底的军队追上，带到利比拉的巴比伦王那里。在那里，他的众子在他眼前被杀，他的眼睛被剜去，他被铜链锁着带到巴比伦。《耶利米书》52:11 说他被囚在监里，直到死的日子；卒年圣经没有记载。

  同年五月，巴比伦的护卫长尼布撒拉旦来到耶路撒冷，焚烧圣殿和王宫，拆毁城墙（《列王纪下》25:8–10）。耶路撒冷陷落的年份，学界有公元前 587 年与前 586 年两说，本站取后一说。
sources: []
recalled:
  - 《列王纪下》24:17—25:12
  - 《历代志下》36:10–20
  - 《耶利米书》第 27、37—39、52 章
  - 《以西结书》第 17 章
