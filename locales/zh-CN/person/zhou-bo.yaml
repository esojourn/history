name: 周勃
aliases:
  - 绛侯
  - 武侯
role: 太尉、丞相
summary: 随高祖起兵的将领，封绛侯；吕后死后夺取北军，诛灭诸吕。
body: |-
  沛县人，生年不详。据《史记·绛侯周勃世家》，他的先人是卷县人，后迁到沛；他以编织养蚕用的苇箔为生，常在丧事上吹箫，又是能拉强弓的材官。刘邦起兵后他一路跟随，转战各地，高祖时封绛侯，后来参与平定韩王信、陈豨和燕王卢绾的叛乱。《史记》说他“不好文学”，为人质朴刚直，高祖认为可以托付大事。

  惠帝六年设太尉官，由他担任。吕后死后，吕禄统领北军，他身为太尉却进不了军门。公元前 180 年，他与丞相陈平合谋，让郦寄劝吕禄交出将印，随即进入北军，下令“为吕氏右袒，为刘氏左袒”，军中都袒露左臂。他由此掌握北军，派朱虚侯刘章杀死吕产，诸吕被诛，代王刘恒被迎立为帝。

  文帝即位后他任右丞相，月余后因自危而请辞；陈平死后再度为相，十个多月后被免，回到封国。后来有人上书告他谋反，他被逮捕下狱，靠薄太后说情才获释，恢复爵位和封邑。出狱后他说：“吾尝将百万军，然安知狱吏之贵乎！”文帝十一年（前 169 年）去世，谥武侯。
sources:
  - 《史记·绛侯周勃世家》 https://ctext.org/shiji/jiang-hou-zhou-bo-shi-jia/zhs
  - 《史记·吕太后本纪》 https://ctext.org/shiji/lv-tai-hou-ben-ji/zhs
  - 《汉书·张陈王周传》
