name: 钟嵘
aliases: [钟仲伟]
role: 文学批评家
summary: 《诗品》的作者，把汉至梁的五言诗人分为上中下三品加以评论。
body: |-
  钟嵘字仲伟，颍川长社人，生卒年都不确切。齐永明年间他是国子生，通晓《周易》，受到卫将军王俭的赏识。此后历任齐、梁两朝的参军、记室等职，梁天监初年曾上书论官职冗滥。晚年任晋安王萧纲的记室，死在任上。

  他的《诗品》评论汉代至梁代的五言诗人一百二十余人，分为上、中、下三品，并为许多诗人追溯渊源，指出出于《国风》、《小雅》或《楚辞》。他反对诗中堆砌典故，也反对拘泥于四声八病，主张诗歌应当直接描写所见所感，以“滋味”论诗。他把曹植列为上品之首，称陶渊明为“古今隐逸诗人之宗”而列入中品，把曹操列入下品，后两点后世多有争议。

  《南史》说他曾向沈约求取赏识被拒，所以在《诗品》中借评沈约来报复。这一说法后人多不相信，因为他对沈约的评价并不算低。
sources: []
recalled:
