name: 头曼单于
aliases: [头曼]
role: 匈奴单于
summary: 史书所载最早的匈奴单于，被其子冒顿射杀。
body: |-
  头曼是史书中第一位留下名号的匈奴单于，生年不详；《史记·匈奴列传》说，在他之前匈奴的世系“不可得而次”。秦始皇派蒙恬北击匈奴，夺取河南地（今河套以南），头曼不敌，向北迁徙。十余年后蒙恬死，诸侯叛秦，戍边的人纷纷离去，匈奴才又渡河南下，回到旧塞一线。

  头曼后来有了宠爱的阏氏，生下少子，想废掉太子冒顿改立少子，于是把冒顿送到月氏为质，又发兵急攻月氏。冒顿逃回后，头曼让他统领万骑。后来冒顿随头曼出猎，以鸣镝射向头曼，部下随之放箭，头曼被杀。《史记集解》引徐广说，事在秦二世元年，即公元前 209 年。
sources:
  - 《史记·匈奴列传》 https://zh.wikisource.org/wiki/史記/卷110
  - 《史记集解》引徐广说 https://zh.wikisource.org/wiki/史記三家註/卷110
