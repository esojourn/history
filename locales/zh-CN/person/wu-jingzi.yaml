name: 吴敬梓
aliases: [敏轩, 文木老人]
role: 小说家
summary: 出身科举世家而家道中落，写成讽刺小说《儒林外史》。
body: |-
  吴敬梓是安徽全椒人，出身于“科第仕宦多显者”的世家，曾祖、祖父辈中有多人考中进士。他二十多岁考中秀才，此后乡试不第。父亲去世后，他不善理财，又慷慨好客，家产很快散尽，被族人看作败家子。雍正十一年（1733 年）他移居南京秦淮河畔。乾隆元年（1736 年）安徽巡抚推荐他参加博学鸿词科的考试，他以生病为由没有参加，从此不再应考。

  他在南京的生活日益贫困，靠卖文和朋友的接济度日，据说冬天没有柴烧，就约朋友绕城墙走几十里，称为“暖足”。大约在乾隆十四年（1749 年）以前，他写成了长篇小说《儒林外史》。

  《儒林外史》以明代为背景，描写了一群读书人在科举制度下的种种丑态，如范进中举后发疯、严监生临死前因灯盏里点着两茎灯草而不肯断气等，也塑造了王冕、杜少卿等不慕名利的人物。书中的不少人物有现实的原型，杜少卿被认为有作者自己的影子。鲁迅在《中国小说史略》中称它“秉持公心，指擿时弊”，是中国讽刺小说的代表作。乾隆十九年（1754 年）吴敬梓在扬州访友时去世。
sources: []
recalled:
  - 程晋芳《文木先生传》
  - 鲁迅《中国小说史略》
