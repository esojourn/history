name: 赵昺
aliases: [宋末帝, 卫王, 帝昺]
role: 南宋最后一位皇帝
summary: 宋度宗之子，八岁被陆秀夫等人立为帝；崖山海战兵败，陆秀夫背负他投海而死。
body: |-
  赵昺是宋度宗的儿子、宋恭帝的弟弟，生于咸淳八年（公元 1272 年），封卫王。德祐二年（1276 年）临安投降前，他与哥哥益王赵昰被送出城，经温州逃到福州。同年五月，陈宜中、张世杰、陆秀夫等人在福州拥立赵昰为帝，即宋端宗。元军追击，南宋行朝从海上辗转于泉州、潮州、广州沿海。

  景炎三年（1278 年）赵昰在碙洲病死，陆秀夫、张世杰又立赵昺为帝，改元祥兴，随后把行朝迁到新会的崖山。祥兴二年（1279 年）二月，元将张弘范、李恒率军进攻崖山，宋军大败，陆秀夫见无法突围，背着赵昺投海而死，时年八岁（按传统计岁法）。南宋至此灭亡（另见“崖山海战”条）。张世杰突围后不久在海上遇风溺死。
sources: []
recalled:
  - 《宋史·瀛国公本纪》附二王纪
  - 《宋史·陆秀夫传》
