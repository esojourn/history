name: 宋孝宗
aliases: [赵昚, 赵伯琮, 赵瑗]
role: 南宋皇帝
summary: 宋太祖七世孙，被高宗立为皇子；即位后为岳飞平反，发动隆兴北伐，在位二十七年。
body: |-
  赵昚是宋太祖次子赵德芳的六世孙，生于建炎元年（公元 1127 年），出生地是秀州（今浙江嘉兴），原名赵伯琮。宋高宗的独子夭折后，绍兴二年（1132 年）他被选入宫中抚养，后赐名赵瑗、立为皇子，改名赵昚。绍兴三十二年（1162 年）高宗禅位，他即皇帝位，次年改元隆兴，是为宋孝宗。北宋的帝位从太宗以后一直在太宗一系传承，到孝宗又回到太祖一系，当时人对此颇有议论。

  孝宗即位后便为岳飞平反，追复原官，以礼改葬，又起用主战的老臣张浚。隆兴元年（1163 年）张浚派李显忠、邵宏渊北伐，起初收复灵璧、虹县，不久在符离溃败（另见“隆兴北伐”条）。此后宋金重新议和，隆兴二年（1164 年）订约，宋帝对金帝改称侄，不再称臣，岁币减为银绢各二十万，史称隆兴和议。

  此后二十多年宋金之间大体相安，孝宗在乾道、淳熙年间整顿吏治，注重农桑、节省开支，任用虞允文等人，南宋经济文化进入较为安定的时期，史家多称他是南宋最有作为的皇帝。他晚年仍想恢复中原，但没有再发动大战。

  淳熙十四年（1187 年）高宗去世，孝宗坚持服丧，次年让太子参决政事。淳熙十六年（1189 年）他禅位给儿子赵惇（宋光宗），自居重华宫。光宗受李皇后影响，与父亲关系疏远，很少去朝见。绍熙五年（1194 年）孝宗去世，光宗不肯主持丧礼，引出朝臣拥立宋宁宗的“绍熙内禅”。
sources: []
recalled:
  - 《宋史·孝宗本纪》
  - 《宋史全文》
