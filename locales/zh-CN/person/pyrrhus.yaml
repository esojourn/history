name: 皮洛士
aliases: [皮拉斯, 皮洛斯]
role: 伊庇鲁斯国王
summary: 伊庇鲁斯国王，渡海与罗马作战，两度取胜而损失惨重，后死于阿尔戈斯巷战。
body: |-
  伊庇鲁斯莫洛西亚王室成员，埃阿基德斯之子，生于公元前 319 年，是亚历山大大帝母亲奥林匹亚斯的族侄孙。他两岁时父亲被逐，侍从抱着他逃到伊利里亚国王格劳基亚斯那里。十二岁时格劳基亚斯送他回国为王，五年后又被推翻。他投奔姐夫德米特里，前 301 年在伊普苏斯为安提柯一方作战；后来作为人质去了埃及，得到托勒密一世赏识，娶了王后的女儿。前 297 年他在托勒密资助下回国复位，定都安布拉基亚。

  前 288 年他与利西马科斯夹攻马其顿，赶走德米特里，占了一半国土，几年后又被利西马科斯挤走。前 281 年意大利南部的希腊城市塔兰托与罗马开战，向他求援。前 280 年他渡海而来，据普鲁塔克，带了步兵二万、骑兵三千、弓手二千、投石手五百和二十头战象。同年在赫拉克利亚，罗马军团第一次遇到战象和马其顿式的方阵，战败。他派谋士基涅阿斯到罗马议和，据普鲁塔克，年老失明的阿庇乌斯·克劳狄乌斯让人把自己抬进元老院，力主拒绝。前 279 年他在阿斯库伦再次取胜，自己的精锐和将领也折损很多。普鲁塔克记载，有人向他道贺，他说：“再这样胜一次，我们就完了。”

  前 278 年他应叙拉古等城之请转赴西西里，与迦太基人作战，几乎占领全岛，只有西端的利吕拜翁攻不下来。他对希腊城邦征敛严厉，渐失人心，前 276 年返回意大利。据普鲁塔克，他离开时说，这是留给罗马人和迦太基人的一块多好的角斗场。前 275 年他在贝内文图姆与罗马执政官库里乌斯·登塔图斯交战失利，带着剩下的军队回了伊庇鲁斯；三年后塔兰托向罗马投降。

  前 274 年他击败安提柯二世，再度占据马其顿大部。前 272 年他应斯巴达流亡王族之请进攻伯罗奔尼撒，攻斯巴达城不克，转向阿尔戈斯。夜间他的军队进了城，在街巷里陷入混战，一个阿尔戈斯老妇人从屋顶扔下一块瓦，击中他的后颈，他从马上跌下，被敌兵认出后杀死。他写过回忆录和论战术的书，都已失传。
sources: []
recalled:
  - 普鲁塔克《皮洛士传》
  - 狄奥多罗斯《历史丛书》卷二十二残篇
  - 尤斯丁《腓力史纲要》卷十六至卷十八、卷二十五
