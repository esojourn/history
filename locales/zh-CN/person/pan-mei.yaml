name: 潘美
aliases: [潘仲询]
role: 北宋大将
summary: 北宋初年大将，统兵灭南汉；雍熙北伐时任西路主帅，杨业战死。
body: |-
  潘美是大名人，生于后唐同光三年（公元 925 年），早年在后周任职，与赵匡胤交好。宋朝建立后，开宝三年至四年（970—971 年）他作为主帅率军攻打南汉，攻下广州，俘虏南汉后主刘鋹（另见“宋灭南汉”条）；开宝七年（974 年）又作为曹彬的副手参与攻灭南唐。太平兴国四年（979 年）宋太宗亲征北汉，他任北路都招讨，攻下太原后长期镇守河东，与杨业一起抵御辽军。

  雍熙三年（986 年）宋军北伐，潘美任西路军主帅，杨业为副将，先后攻下云、应、寰、朔四州。东路军失败后，西路军奉命掩护四州百姓内迁。监军王侁逼迫杨业出战，潘美没有制止，事先约定在陈家谷口接应，后来却离开了，杨业战败被俘而死（另见“雍熙北伐”条）。潘美因此被削秩三等。淳化二年（991 年）他去世。后世小说《杨家将演义》中陷害杨业的“潘仁美”是以他为原型虚构的人物，与史实有很大出入。
sources: []
recalled:
  - 《宋史·潘美传》
  - 《宋史·杨业传》
