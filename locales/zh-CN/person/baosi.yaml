name: 褒姒
aliases: []
role: 周幽王的王后
summary: 周幽王的王后，古书把西周灭亡归咎于她；“烽火戏诸侯”真伪有争议。
body: |-
  褒姒是褒国（在今陕西汉中一带）进献给周幽王的女子，姒姓，生卒年不详。《史记·周本纪》和《国语·郑语》记载了一个神话般的出身故事：夏朝末年有两条龙降临王庭，夏王收藏了龙的唾沫，到周厉王时打开，唾沫化为黑蜥蜴，宫中一个童女遇到后怀孕，生下的女婴被丢弃，后来流落到褒国，长大后被献给幽王。这显然是传说。

  据《史记》，幽王宠爱褒姒，褒姒生子伯服，幽王于是废黜申后和太子宜臼，改立褒姒为后。《史记》说褒姒不好笑，幽王点燃烽火戏弄诸侯，她才大笑。这个故事不见于战国以前的文献，很多学者认为是后起的传说。

  公元前 771 年，申侯联合犬戎攻杀幽王，褒姒被掳走，此后下落不明。《诗经·小雅·正月》有“赫赫宗周，褒姒灭之”的句子，可见西周末年已有把亡国归咎于她的说法。今天的研究者多认为，西周灭亡有王室内部的继承之争、与申国等诸侯的矛盾以及戎狄的威胁等多方面原因。
sources: []
recalled:
  - 《史记·周本纪》
  - 《国语·郑语》
  - 《诗经·小雅·正月》
