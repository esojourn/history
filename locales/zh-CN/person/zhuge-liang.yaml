name: 诸葛亮
aliases: [诸葛孔明, 武乡侯, 忠武侯, 卧龙]
role: 丞相
summary: 蜀汉丞相，为刘备定下三分天下的方略，刘备死后主持国政，五次北伐曹魏，死于军中。
body: |-
  据《三国志·蜀书·诸葛亮传》，诸葛亮字孔明，琅邪阳都人。他早年丧父，随叔父诸葛玄南下，后到荆州依附刘表。叔父死后，他在乡间耕种读书，常把自己比作管仲、乐毅。建安十二年（公元 207 年），驻在新野的刘备三次登门才见到他。本传记他向刘备分析形势：曹操不可与之争锋，孙权可以结为外援而不可图谋，应当先取荆州、益州，对外联合孙权，等天下有变再分两路北伐。这段话后世称为“隆中对”。

  次年曹操南下，诸葛亮奉命去见孙权，促成孙刘联盟。赤壁之战后他负责调集荆州南部三郡的赋税以供军需。刘备入蜀时他留守荆州，建安十九年（214 年）率张飞、赵云等溯江西上，与刘备会师成都。刘备称帝，以他为丞相。章武三年（223 年）刘备临终托孤，后主刘禅即位，本传说“政事无巨细，咸决于亮”。他首先派邓芝出使吴国，恢复两国的同盟。

  建兴三年（225 年），他率军南征，平定南中各郡的反叛。建兴五年他上《出师表》，进驻汉中。次年春出兵祁山，魏的天水、南安、安定三郡响应，但前锋马谡在街亭违背部署被张郃击败，蜀军退回汉中；诸葛亮处死马谡，自请降职三等。此后数年他又几次出兵，都因粮运不继等原因退回。建兴十二年（234 年）春他率大军出斜谷，进驻渭水南岸的五丈原，分兵屯田，与司马懿相持一百多天。同年八月他病死军中，终年五十四，按遗命葬在汉中定军山。

  本传说他治蜀赏罚严明，又曾改进连弩，制作“木牛”“流马”用来运粮。陈寿评价他是“识治之良才，管、萧之亚匹”，同时说他连年出兵而未能成功，“盖应变将略，非其所长欤”。流传的《后出师表》不见于本传，出自裴松之注所引吴人张俨的《默记》，真伪历来有争议。
sources: []
recalled:
  - 《三国志·蜀书·诸葛亮传》及裴松之注
  - 诸葛亮《出师表》
