name: 李秀成
aliases: [忠王]
role: 太平天国后期的主要将领
summary: 太平天国后期的主要统帅，天京陷落后被俘，写下自述后被杀。
body: |-
  李秀成是广西藤县人，出身贫苦农家，咸丰元年（1851 年）参加太平军，从普通士兵逐步升为将领。天京事变后，太平天国的老将大多死去或出走，李秀成与陈玉成等青年将领成为支柱。咸丰八年（1858 年）他与陈玉成配合，在浦口再次攻破清军的江北大营，又在三河之战中歼灭了湘军的精锐李续宾部。

  咸丰十年（1860 年）李秀成率军攻破清军的江南大营，随后东征，攻占苏州、常州等地，建立了苏福省，被封为忠王。此后他两次进攻上海，受到英法军队和李鸿章淮军的阻击，没有成功。咸丰十一年（1861 年）安庆失守，陈玉成次年被俘遇害，太平天国的形势急转直下。

  同治元年（1862 年）曾国荃率湘军进逼天京，李秀成奉命回救，率大军围攻曾国荃的营垒四十多天，没有攻破。他建议洪秀全放弃天京、“让城别走”，被洪秀全拒绝。同治三年（1864 年）七月天京被湘军攻破，他护送幼天王洪天贵福突围，途中被俘。在囚禁中，他写了数万字的供词，即《李秀成自述》，记述了太平天国的历史，其中也有乞求曾国藩宽恕和招降太平军余部的内容，后人对此评价不一。不久他被曾国藩下令处死。《李秀成自述》的原稿被曾国藩删改后刊印，原稿到二十世纪才影印公布。
sources: []
recalled:
  - 《李秀成自述》
  - 罗尔纲《李秀成自述原稿注》
