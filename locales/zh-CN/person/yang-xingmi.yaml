name: 杨行密
aliases: [杨化源, 吴太祖, 吴王]
role: 淮南节度使、吴王
summary: 唐末据有淮南，897 年清口之战大败朱温，902 年受封吴王，为吴国奠基。
body: |-
  杨行密是庐州合肥人，大中六年（公元 852 年）生，字化源，自幼孤贫。据史书，他年轻时力气很大，曾因作乱被捕，庐州刺史见他相貌不凡，放了他，让他到州里当兵。中和三年（883 年）前后，他在庐州发动兵变，杀了与他不和的军官，随后被任命为庐州刺史。

  光启三年（887 年），淮南节度使高骈被部将毕师铎囚禁杀害，扬州大乱，杨行密率兵进入扬州。此后秦宗权的部将孙儒也来争夺淮南，双方反复争战数年，扬州城几乎被毁。景福元年（892 年），杨行密击败孙儒，唐朝任命他为淮南节度使。他招抚流亡，减轻赋税，淮南逐渐恢复。

  乾宁四年（897 年），朱温派大军分两路南下进攻淮南。杨行密与部将朱瑾在清口迎击，据史书，他们掘开淮河堤坝，以水灌敌，大败汴军，汴军主将庞师古战死。这一战使朱温此后再也没能大举渡淮，南北分立的局面由此形成。天复二年（902 年），唐朝封他为吴王。

  杨行密占有江淮之间二十多州，与浙西的钱镠长期争战。天祐二年（905 年）他在扬州去世，年五十四，长子杨渥继位。杨渥不久被部将徐温、张颢杀死，此后吴国的实权落入徐温手中。他的子孙后来相继称吴国王和皇帝，直到 937 年吴国被徐温的养子李昪取代。
sources: []
