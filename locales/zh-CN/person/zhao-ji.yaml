name: 宋徽宗
aliases: [赵佶, 教主道君皇帝]
role: 北宋皇帝、书画家
summary: 宋神宗之子，擅长书画，重用蔡京，联金攻辽，靖康之变中被金人俘虏北去。
body: |-
  宋徽宗赵佶是宋神宗的第十一子，元丰五年（公元 1082 年）生于开封，封端王。元符三年（1100 年）哲宗去世无子，向太后力主立他为帝，宰相章惇反对，说他“轻佻不可以君天下”，没有被采纳。即位之初，向太后同听政事，徽宗起用部分元祐旧臣，试图调和新旧两派；向太后去世后，他转而推崇新法，崇宁元年（1102 年）起用蔡京为相，把司马光、苏轼等三百多人列为“元祐奸党”，刻石立碑，禁止他们的子孙做官（另见“元祐党籍碑”条）。

  徽宗在艺术上造诣很高。他的书法自成一体，笔画瘦硬，后世称为“瘦金体”；他的花鸟画工细传神，《芙蓉锦鸡图》《瑞鹤图》等传世作品题有他的款识，其中哪些是他亲笔、哪些是画院画家代笔，学者看法不一。他扩充翰林图画院，以考试选拔画家，命人编成《宣和书谱》《宣和画谱》。他又崇信道教，政和七年（1117 年）让道士册封自己为“教主道君皇帝”。为了修建宫苑艮岳，朝廷在东南大规模搜罗奇花异石，称为“花石纲”，百姓深受其苦，宣和二年（1120 年）方腊在睦州起义（另见“方腊起义”条）。

  对外，徽宗听从童贯、蔡京等人的主张，与新兴的金朝订立“海上之盟”，约定夹攻辽朝（另见该条）。宣和四年（1122 年）宋军两次进攻燕京都失败，最后靠向金朝输钱才换回燕京等几座空城。宣和七年（1125 年）金军分两路南下，徽宗惊慌失措，在这年十二月（已是公历 1126 年初）传位给太子赵桓，自称太上皇，随即南逃到镇江一带，金军退后才回到开封。

  靖康二年（1127 年）开封被金军攻破，徽宗与钦宗等宗室、后妃三千多人被押往北方（另见“靖康之变”条）。他先被关押在金朝的上京一带，后来被迁到五国城。金朝封他为“昏德公”。绍兴五年（1135 年）他死在五国城，终年五十四岁，遗骸后来在宋金议和时被送回南宋安葬。
sources: []
