name: 渊盖苏文
aliases: [泉盖苏文, 盖金]
role: 高句丽莫离支
summary: 高句丽权臣，642 年发动政变杀死国王，专权二十余年，抵挡了唐太宗的亲征。
body: |-
  渊盖苏文是高句丽的贵族，父亲是东部大人。唐朝史书避唐高祖李渊的名讳，写作“泉盖苏文”或“盖苏文”。他的生年不详。

  贞观十六年（公元 642 年），高句丽的荣留王和大臣们谋划要除掉他。他先发制人，借检阅军队的名义召集大臣，杀死一百多人，又入宫杀死荣留王，改立荣留王的侄子为王，即宝藏王，自任莫离支，独揽军政大权。据《三国史记》，次年他劝宝藏王引进道教，宝藏王遣使向唐朝求取，唐太宗派道士叔达等人带着《道德经》前往高句丽。据唐朝史书，他身佩五把刀，左右的人都不敢仰视。

  这时高句丽与百济联手进攻新罗，新罗向唐朝求救。唐太宗派使者要求高句丽停止进攻，他不肯听从，还扣留了唐朝使者。太宗以他弑君为由，贞观十九年（645 年）亲率大军出征，攻下辽东城等十座城，但在安市城下久攻不克，天寒粮少，只得撤军。此后唐朝又多次派兵骚扰，都没有动摇高句丽的根本。

  他的卒年各书记载不一，一般作 665 年前后。他死后，长子渊男生继任莫离支，与弟弟渊男建、渊男产不和，渊男生投降唐朝，唐军借机进攻，总章元年（668 年）攻克平壤，高句丽灭亡（另见“唐灭高句丽”条）。
sources: []
recalled:
  - 《旧唐书·高丽传》
  - 《新唐书·高丽传》
  - 金富轼《三国史记·盖苏文传》
