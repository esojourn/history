name: 赤松德赞
aliases: [娑悉笼腊赞]
role: 吐蕃赞普
summary: 吐蕃赞普，在位时一度攻入长安，占据河西、陇右，并兴建桑耶寺，扶植佛教。
body: |-
  赤松德赞是吐蕃赞普赤德祖赞的儿子，一般认为生于公元 742 年。他的生母，藏文史籍多说是唐朝的金城公主，现代学者多根据敦煌古藏文文献认为是那囊氏，存在争议。755 年赤德祖赞被大臣杀害，他年少即位，此后逐步清除了反对佛教的权臣。

  他即位的同一年，唐朝爆发安史之乱，河西、陇右的唐军大批东调。吐蕃乘机进攻，广德元年（763 年）一度攻入长安，立唐朝宗室李承宏为帝，十几天后撤走（另见“吐蕃攻入长安”条）。此后吐蕃逐年攻占河西、陇右各州，到贞元二年（786 年）前后，最后坚守的沙州也投降吐蕃（另见“吐蕃攻占河西陇右”条）。建中四年（783 年）唐蕃在清水会盟，划定边界；贞元三年（787 年）吐蕃大相尚结赞在平凉劫盟，双方再次交恶（另见“清水会盟”“平凉劫盟”条）。

  在国内，他从印度迎请寂护、莲花生等僧人，大约在 779 年建成桑耶寺，让第一批吐蕃贵族子弟出家，下令崇奉佛教。据藏文史籍和敦煌文献，他在位后期，以汉地禅僧摩诃衍为代表的顿悟派与以印度僧人莲花戒为代表的渐修派在吐蕃展开辩论，结果渐修派得到支持，这场辩论的过程和结果学界还有不同看法。

  他的卒年，汉文和藏文史料记载不一，一般作 797 年前后，也有学者认为他在 797 年让位，804 年才去世。后世藏文史籍把他与松赞干布、赤祖德赞并称为吐蕃的“祖孙三法王”。
sources: []
recalled:
  - 《旧唐书·吐蕃传》
  - 《新唐书·吐蕃传》
  - 敦煌古藏文《吐蕃大事纪年》
  - 《巴协》
