name: 希律·安提帕
aliases:
  - 分封的王希律
  - 希律安提帕
role: 加利利和比利亚的分封王
summary: 大希律之子，加利利的分封王，处死施洗约翰，曾在耶路撒冷审问耶稣。
body: |-
  安提帕是大希律的儿子，母亲是撒玛利亚人玛尔他基，与亚基老同母，约生于公元前 20 年。公元前 4 年大希律去世，罗马皇帝奥古斯都把他的国土分给三个儿子，安提帕得了加利利和约旦河东的比利亚，称为分封的王（路 3:1）。耶稣传道期间，福音书里说的“希律”多半指他。

  他原先娶的是拿巴提王亚哩达的女儿，后来休了她，娶了自己兄弟的妻子希罗底。施洗约翰责备这件事，被他拿住下在监里，后来在他生日的筵席上被斩（可 6:17–29）。他听见耶稣的名声，说这是他所斩的约翰从死里复活了（可 6:14–16）。

  《路加福音》23:6–12 记耶稣受审时，彼拉多知道耶稣是加利利人，属希律所管，就把他送到当时也在耶路撒冷的希律那里。希律问了许多话，耶稣一言不答；希律和他的兵丁戏弄耶稣，又送回彼拉多那里。路加说，希律和彼拉多从前有仇，在那一天成了朋友。这段经过只见于《路加福音》。

  据约瑟夫斯《犹太古史》卷 18，公元 39 年，安提帕在希罗底的怂恿下到罗马求王的称号，被侄子亚基帕控告，皇帝卡利古拉把他流放到高卢（约瑟夫斯《犹太战记》则说是西班牙），他死在流放地，卒年不详。
sources: []
recalled:
  - 《马可福音》6:14–29
  - 《马太福音》14:1–12
  - 《路加福音》3:1、3:19–20、23:6–12
  - 约瑟夫斯《犹太古史》卷 17、卷 18
  - 约瑟夫斯《犹太战记》卷 2
