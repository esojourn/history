name: 干宝
aliases: [干令升]
role: 史学家
summary: 东晋史学家，撰《晋纪》，又搜集神怪故事编成《搜神记》。
body: |-
  干宝字令升，祖籍新蔡，生年不详。《晋书》本传说他年少勤学，博览群书，以才识被召为佐著作郎，因参与平定杜弢有功，赐爵关内侯。

  东晋初建，史官尚未设置，王导上疏说应当及时撰集本朝的史事，举荐他主持。他由此领修国史，写成《晋纪》二十卷，记述从司马懿到晋愍帝共五十三年的历史。本传说这部书“直而能婉”，当时都称他为良史。原书已经失传，其中的《总论》因收入《文选》而保存下来，是讨论西晋兴亡的名篇。他后来因家贫请求外任，做过山阴县令、始安太守，又回朝任司徒右长史、散骑常侍。咸康二年（公元 336 年）去世。

  据本传，他因为听闻并相信家中发生过死而复生的事，便搜集古往今来的神灵怪异、人物变化，编成《搜神记》三十卷，用意是证明鬼神之事并非虚妄。书成之后他拿给名士刘惔看，刘惔说他称得上是“鬼之董狐”。原书后来散佚，今天通行的二十卷本是后人辑录的，干将莫邪、韩凭夫妇、李寄斩蛇、董永等故事都见于其中。
sources: []
recalled:
  - 《晋书·干宝传》
  - 《文选》卷四十九《晋纪总论》
