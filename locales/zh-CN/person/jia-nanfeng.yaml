name: 贾南风
aliases: [贾后, 惠贾皇后]
role: 皇后
summary: 晋惠帝的皇后，诛杨骏后专制朝政近十年，因杀害太子被赵王伦废杀。
body: |-
  贾南风是平阳襄陵人，西晋开国功臣贾充的女儿，母亲郭槐。泰始八年（公元 272 年）被册为太子妃。《晋书·后妃传》说她性情妒忌而多权术，太子司马衷很怕她。武帝曾想废掉她，因杨皇后、荀勖等人劝说而作罢。

  太熙元年（290 年）惠帝即位，她立为皇后，朝政归于太傅杨骏。元康元年（291 年）三月，她联络楚王司马玮等人入京，以谋反的罪名杀杨骏，夷其三族，又废杨太后，后来把她幽禁在金墉城饿死。同年六月，她使楚王玮杀辅政的汝南王司马亮和老臣卫瓘，随即以擅杀大臣的罪名处死楚王玮。朝政从此落到她手里。

  她专政期间，任用张华、裴頠和族兄贾模主持政务。《晋书》说这几年“虽暗主在上，而朝野安静”。她的外甥贾谧权倾一时，石崇、潘岳、陆机、左思等文士都出入其门，号称“二十四友”。

  她没有儿子，太子司马遹是谢才人所生。元康九年十二月，她设计把太子灌醉，让他抄下一篇语涉悖逆的文字，以此为据把他废为庶人，次年三月又派人在许昌把他杀死。永康元年（300 年）四月，赵王司马伦与孙秀以为太子报仇为名，带兵入宫，把她废为庶人，几天后送金屑酒到金墉城令她自尽。张华、裴頠同时被杀，诸王相攻的局面由此开始。
sources: []
recalled:
  - 《晋书·后妃传上·惠贾皇后》
  - 《晋书·惠帝纪》
  - 《资治通鉴》卷八十二、八十三
