name: 元仁宗
aliases: [爱育黎拔力八达]
role: 元朝皇帝
summary: 元武宗之弟，在位期间恢复科举，以朱熹注释的《四书》为考试标准。
body: |-
  爱育黎拔力八达是忽必烈的曾孙、元武宗海山的弟弟，生于至元二十二年（公元 1285 年）。他少年时跟随儒士李孟学习，熟悉儒家经典和中原历史。大德十一年（1307 年）元成宗去世，他与母亲先发制人，控制大都，迎立哥哥海山即位，即元武宗，自己被立为皇太子，约定兄终弟及。

  至大四年（1311 年）武宗去世，他即位，改元皇庆，是为元仁宗。他废除了武宗时滥设的机构，整顿财政。皇庆二年（1313 年）他下诏恢复停废已久的科举，规定以朱熹的《四书章句集注》为考试的标准，延祐二年（1315 年）举行了元朝第一次科举考试（另见“元朝恢复科举”条）。他还命人编纂法典，为后来颁行的《大元通制》打下基础。不过他违背了与武宗的约定，立自己的儿子硕德八剌为太子，为日后的皇位之争埋下了隐患。延祐七年（1320 年）仁宗去世。
sources: []
recalled:
  - 《元史·仁宗本纪》
