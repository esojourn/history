name: 张角
aliases: [大贤良师, 天公将军]
role: 太平道首领
summary: 太平道的创立者，中平元年发动黄巾起义，当年病死。
body: |-
  张角是巨鹿人，史书没有为他立传，他的事迹主要见于《后汉书·皇甫嵩传》，生年和早年经历都不清楚。据该传，他信奉黄老道，自称“大贤良师”，收养弟子，让病人跪拜自陈过错，再用符水咒语治病，病人多有痊愈的，百姓于是信从。他派弟子八人到四方传教，十余年间，徒众达数十万，遍及青、徐、幽、冀、荆、扬、兖、豫八州。他所传的教后世称为太平道。

  张角把徒众编为三十六“方”，大方万余人，小方六七千人，各立首领，并传布“苍天已死，黄天当立，岁在甲子，天下大吉”的口号，约定在甲子年（中平元年，公元 184 年）三月五日各地同时起事。事前弟子唐周向朝廷告密，在雒阳联络的大方首领马元义被捕车裂，朝廷下令追捕张角。张角于是通知各方提前在二月起事，自称“天公将军”，弟弟张宝称“地公将军”，张梁称“人公将军”。起事者头裹黄巾作为标志，所以被称为“黄巾”。

  朝廷先派卢植进攻冀州，把张角围困在广宗，后来改派董卓，没有战果。这一年秋天张角病死。十月，皇甫嵩在广宗击破张梁的部众，张梁战死；朝廷下令剖开张角的棺木戮尸，把首级送到京师。十一月张宝也在下曲阳兵败被杀。
sources: []
recalled:
  - 《后汉书·皇甫嵩朱儁列传》
  - 《后汉书·孝灵帝纪》
