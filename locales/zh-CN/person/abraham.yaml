name: 亚伯拉罕
aliases: [亚伯兰]
role: 族长
summary: 以色列人的先祖，蒙召离开本地往迦南，耶和华与他立约。
body: |-
  原名亚伯兰，他拉的儿子，生于迦勒底的吾珥，妻子是撒莱，后来改名撒拉（《创世记》11:26—31）。他拉带着全家离开吾珥，要往迦南去，到了哈兰就住下。本条的年份是按圣经自己的数字倒推的约数：以出埃及约在公元前 1446 年（《列王纪上》6:1）为起点，加上以色列人在埃及的四百三十年（《出埃及记》12:40）、雅各下埃及时一百三十岁（创 47:9）、以撒六十岁生雅各（25:26）、亚伯拉罕一百岁生以撒（21:5）。学界对族长时期的年代看法不一，这只是其中一种算法。

  据创 12:1—5，耶和华吩咐他离开本地、本族、父家，往所要指示他的地去，并应许使他成为大国。他七十五岁离开哈兰，带着撒莱和侄儿罗得进入迦南，在示剑和伯特利附近筑坛。因饥荒他曾下到埃及（12:10—20）。回来后与罗得分开，住在希伯仑幔利的橡树那里（第 13 章）。四王掳走罗得，他率家里的壮丁追上去把人救回，回来时撒冷王麦基洗德为他祝福（第 14 章）。

  第 15 章记耶和华应许他的后裔多如天上的星，并与他立约。撒莱不生育，把使女夏甲给他为妾，他八十六岁时夏甲生以实玛利（16:16）。九十九岁时，耶和华给他改名亚伯拉罕，定割礼为立约的记号，应许撒拉要生一个儿子（第 17 章）。所多玛被毁之前，他曾为那城求情（第 18 章）。他一百岁时以撒出生（21:5）。

  第 22 章记神试验亚伯拉罕，叫他往摩利亚地去，把以撒献为燔祭；他照着去行，正要下手，耶和华的使者拦住他，他取了一只公羊代替儿子献上。圣经没有记这件事的年份。撒拉死后，他向赫人以弗仑买下麦比拉田间的洞作坟地（第 23 章），又差老仆人回本族为以撒娶妻（第 24 章）。据创 25:7—10，他享寿一百七十五岁，以撒和以实玛利把他葬在麦比拉洞；圣经没有说他死在何处。
sources: []
