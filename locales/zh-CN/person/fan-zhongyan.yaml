name: 范仲淹
aliases: [范文正公, 朱说]
role: 北宋参知政事
summary: 北宋名臣，主持庆历新政，曾守西北抵御西夏，写有《岳阳楼记》。
body: |-
  范仲淹，祖籍苏州吴县，端拱二年（公元 989 年）生于徐州。他两岁时父亲去世，母亲改嫁长山朱氏，他随继父改名朱说。长大后得知身世，他离家到应天府（今河南商丘）的书院读书，生活清苦。宋人笔记说他每天煮一锅粥，冷后划成几块，早晚各吃两块，这便是“划粥断齑”的故事。大中祥符八年（1015 年）他考中进士，后来恢复范姓。

  他在仁宗朝屡次上书言事，几度因直言被贬。宝元元年（1038 年）李元昊称帝，宋夏开战，康定元年（1040 年）他与韩琦一同出任陕西经略安抚副使，知延州。他整顿军队，修筑城寨，招抚当地的羌人部落，采取以守为主的方略，西北边防渐渐稳固。据宋人记载，西夏人互相告诫，说“小范老子胸中自有数万甲兵”，不要轻易进犯。

  庆历三年（1043 年）宋仁宗任命他为参知政事，他上呈《答手诏条陈十事》，提出整顿官吏、改革科举、厚农桑、修武备等主张，与富弼、韩琦等人一起推行，史称“庆历新政”（另见该条）。新政限制了官员子弟凭恩荫做官，严格考核地方官，引起许多人的反对，反对者指他们结为朋党。庆历五年（1045 年）初范仲淹等人相继罢职，新政中止。

  此后他先后在邠州、邓州、杭州、青州任地方官。庆历六年（1046 年）在邓州时，他应好友滕宗谅之请写了《岳阳楼记》，其中“先天下之忧而忧，后天下之乐而乐”一句流传很广。他在苏州购置田地，设立义庄赡养族人，开创了宋代以后宗族义庄的先例。皇祐四年（1052 年）他在调任颍州途中，死于徐州，谥“文正”。
