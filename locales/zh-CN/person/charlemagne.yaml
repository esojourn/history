name: 查理曼
aliases:
  - 查理大帝
  - 查理一世
  - 卡尔大帝
role: 法兰克国王、皇帝
summary: 法兰克国王，征服伦巴第与萨克森，800 年圣诞节在罗马由教皇加冕为皇帝。
body: |-
  查理是丕平的长子，生年有 742、747、748 年几种说法。公元 768 年丕平去世，他与弟弟卡洛曼同时即位；771 年卡洛曼去世，查理独自统治法兰克王国。“查理曼”即“大查理”。

  他在位四十多年，几乎年年用兵。伦巴第王再次威胁教皇，他应教皇哈德良一世之请出兵，774 年攻下帕维亚，废伦巴第王，自己戴上伦巴第的王冠，并重申丕平献给教皇的土地。《历史的轨迹》第九章说他在 777 年灭伦巴第国，通行的年份是 774 年。对萨克森人的战争从 772 年断断续续打了三十多年，他强迫被征服的萨克森人受洗，《历史的轨迹》称之为“用剑强迫撒克逊人接受基督教”。778 年他进兵西班牙，退兵时后卫在比利牛斯山中被歼，后来在山南设立边区，势力达到埃布罗河一带。他还吞并了巴伐利亚，击溃了阿瓦尔人。

  799 年教皇利奥三世在罗马遇袭，逃到查理那里求助。800 年圣诞节，查理在罗马圣彼得教堂望弥撒时，教皇把皇冠戴在他头上，会众欢呼他为皇帝。为他作传的艾因哈德说，他事后表示，早知教皇的打算，那天就不进教堂。《历史的轨迹》说他被立为“神圣罗马帝国皇帝”；这个国号是几百年后才有的，当时只称他为治理罗马帝国的皇帝。西方从 476 年以后第一次又有了皇帝，日后教皇与皇帝之争也由此埋下根由。

  《历史的轨迹》说他为西欧取得法律、文化和基督教三样东西。他颁布许多法令，下令各主教区和修道院办学，把英格兰学者阿尔昆等人请到宫中。艾因哈德记载，他最爱听人读奥古斯丁的《上帝之城》，晚年把写字板放在枕下练习写字，因为学得太晚，成效不大。

  814 年 1 月他在亚琛去世，葬在自己所建的宫廷教堂里，由儿子路易继位。843 年他的三个孙子把帝国分成三份。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第九章“教会组成联盟” https://wellsofgrace.com/books/spiritual/2000years/html/chapter11.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第十章“教皇权势的发展” https://wellsofgrace.com/books/spiritual/2000years/html/chapter12.html"
recalled:
