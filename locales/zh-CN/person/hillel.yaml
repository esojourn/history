name: 希列
aliases: [希勒尔, 长老希列]
role: 律法教师
summary: 第二圣殿后期的犹太律法教师，相传生于巴比伦，希列学派的创立者。
body: |-
  第二圣殿后期最有影响的犹太律法教师之一，活动于希律王在位前后。关于他的记载都出自《密西拿》《塔木德》等拉比文献，成书比他晚两百年以上，其中不少是带教训意味的故事，难以一一核实；约瑟夫斯没有提到他。生卒年没有可靠记载，拉比传统说他活了一百二十岁，是比照摩西的说法，不能当作实数。

  相传他生于巴比伦，成年后到耶路撒冷，师从示玛雅和亚布达利安，早年贫穷，后来成为公会的领袖。他与同时代的沙买并称，两人的门生形成希列学派和沙买学派；《密西拿》记录了两派在许多律法问题上的分歧，后世裁决多从希列一派。归在他名下的有若干条解经规则，以及称为“普罗兹布”的办法：债主向法庭声明之后，债务在安息年不致豁免，免得人在安息年临近时不肯借贷。

  《密西拿·先贤篇》收有他的格言。《巴比伦塔木德·安息日篇》记，一个外邦人要他在单脚站立的工夫里教完全部律法，他回答说：你所厌恶的，不要加给别人，这就是全部律法，其余都是注解。据拉比传统，他的后裔世代担任犹太人的族长；《使徒行传》5:34、22:3 提到的迦玛列，相传是他的孙子。
sources: []
recalled:
  - 《密西拿·先贤篇》第 1—2 章
  - 《巴比伦塔木德·安息日篇》
  - 《使徒行传》5:34、22:3
