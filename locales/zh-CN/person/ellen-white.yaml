name: "怀爱伦"
aliases: ["怀特夫人", "爱伦·怀特"]
role: "基督复临安息日会的早期领袖"
summary: "米勒运动出身，自称得异象，是复临安息日会的创立者之一和精神领袖。"
body: |-
  《历史的轨迹》第四十五章说，米勒预言基督复临的日期一再落空后，1845 年他的追随者成立了一个很弱的组织；1846 年，基督复临安息日会因守犹太安息日和对《但以理书》第八章的解释问题而脱离出来，怀特夫人是早期领袖。书中说，这个教会在教义上非常保守，在慷慨捐献、禁酒、禁烟方面都是很好的榜样，医疗和福音工作遍及九百种语言；据 1963 年的报道，他们有一万三千三百六十九间教会和一百三十万成年受洗者。

  据一般记载，怀爱伦本姓哈蒙，1827 年生于缅因州戈勒姆，少年时受伤，未能完成学业；她参加米勒运动，1844 年“大失望”之后宣称开始得到异象，1846 年与传道人詹姆斯·怀特结婚，并接受守第七日安息日的主张。复临安息日会 1863 年才在巴特尔克里克正式成立，书中说 1846 年分出，是指守安息日的这一群开始形成。她著述甚多，推动健康改革、办医院和学校，晚年在澳大利亚住过近十年，1915 年在加利福尼亚圣海伦娜去世。她的著作在该会被看作有启示的权威，这一点也是其他宗派批评该会的主要原因之一。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
recalled:
  - "怀爱伦《善恶之争》"
