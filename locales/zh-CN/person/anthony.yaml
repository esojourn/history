name: 安东尼
aliases:
  - 大安东尼
  - 埃及的安东尼
  - 隐士安东尼
role: 埃及隐修士
summary: 埃及的隐修士，在旷野独居数十年，后世称为修道主义之父。
body: |-
  安东尼约在公元 251 年生于中埃及的科马村，父母是富裕的基督徒农户。他的生平主要见于亚他那修写的《安东尼传》，这本书写于他去世后不久。《历史的轨迹》称他为“底比斯城的安东尼”，说修道主义最先起于埃及，创立者就是他。

  据《安东尼传》，他十八岁到二十岁之间父母双亡。有一天他在教堂听到诵读《马太福音》19:21：“你若愿意作完全人，可去变卖你所有的，分给穷人。”他就把田产分给村里人，把妹妹托给一班守贞的妇女，自己到村外跟一位年老的苦修者学习。《历史的轨迹》把这件事定在公元 270 年。

  约十五年后，他渡过尼罗河，住进旷野里一座废弃的堡垒，独居约二十年，靠人隔着墙送来的饼度日。《安东尼传》用很多篇幅写他在独居中与魔鬼的搏斗。约 305 年他走出堡垒，这时周围已经聚集了许多效法他的人。他把这些人组织起来，各人仍住自己的小屋，这是隐修士聚居的开端。

  公元 311 年马克西米努逼迫教会时，他到亚历山大探望坐监的信徒。后来他退到尼罗河与红海之间的山里，住处就在今天圣安东尼修道院一带。亚流派之争中，他支持亚他那修，晚年又到过一次亚历山大，公开反对亚流派。

  他在公元 356 年去世，据《安东尼传》享年一百零五岁，遗嘱不让人知道葬处。《安东尼传》很快被译成拉丁文，在西方流传很广；奥古斯丁在《忏悔录》卷 8 里说，他归信之前就是听人讲了安东尼的事迹而深受震动。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第六章“教会渐趋腐化” https://wellsofgrace.com/books/spiritual/2000years/html/chapter07.html"
recalled:
  - 亚他那修《安东尼传》第 1—14、46、69、89—92 章
  - 奥古斯丁《忏悔录》卷 8 第 6 章
  - 耶柔米《名人传》第 88 章
