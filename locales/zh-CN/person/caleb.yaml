name: 迦勒
aliases: []
role: 犹大支派的探子
summary: 耶孚尼的儿子，与约书亚同为力主进迦南的探子，后来得希伯仑为业。
body: |-
  迦勒是耶孚尼的儿子，在十二个探子里代表犹大支派（《民数记》13:6）；《民数记》32:12 和《约书亚记》14:6 又称他父亲为基尼洗族人。据《约书亚记》14:7，摩西从加低斯巴尼亚打发他去窥探迦南的时候，他正四十岁。

  探子回来以后，多数人说那地的居民强壮、城邑坚固。迦勒在摩西面前安抚百姓，主张立刻上去得那地，说以色列人足能得胜（《民数记》13:30）。会众不肯听，还要拿石头打死他和约书亚（14:6–10）。耶和华说，迦勒另有一个心志，专一跟从他，要领他进入他所去过的那地（14:24）；那一代被数点的人里，只有他和约书亚没有倒毙在旷野。

  进迦南以后，迦勒在吉甲对约书亚说，从摩西打发他那时到如今已经四十五年，他现今八十五岁，还是像当年一样强壮，求约书亚把耶和华当日应许的山地给他。约书亚就把希伯仑给他为业（《约书亚记》14:6–15）。他从那里赶出亚衲族的三个族长示筛、亚希幔、挞买（15:14），又许诺谁攻取基列西弗就把女儿押撒嫁给谁；他兄弟基纳斯的儿子俄陀聂夺了那城，娶了押撒（15:15–19；《士师记》1:12–15）。俄陀聂后来作了以色列的士师。迦勒何时去世、死在何处，圣经没有记载。
sources: []
recalled:
  - 《民数记》第 13—14 章、32:12
  - 《约书亚记》14:6–15、15:13–19
  - 《士师记》1:12–15
