name: 耶罗波安一世
aliases:
  - 尼八的儿子耶罗波安
role: 北国以色列第一位王
summary: 所罗门的臣仆，王国分裂后被十个支派立为王，在伯特利和但设金牛犊。
body: |-
  以法莲支派的洗利达人，尼八的儿子，母亲洗鲁阿是寡妇（《列王纪上》11:26）；圣经没有记载他的生年。他在所罗门手下做事，所罗门见他殷勤，派他监管约瑟家的一切工程（11:28）。据 11:29–39，示罗人先知亚希雅在路上遇见他，把身上的新衣撕成十二片，叫他拿十片，说耶和华要把十个支派赐给他。所罗门因此要杀他，他逃到埃及王示撒那里，住到所罗门去世（11:40）。

  所罗门死后，罗波安到示剑即位，耶罗波安和以色列会众请求减轻劳役，遭到拒绝，北方各支派便立耶罗波安作以色列王（12:1–20）。他修筑示剑，住在那里，又修筑毗努伊勒（12:25）。据 12:26–33，他担心百姓上耶路撒冷的圣殿献祭后人心归向罗波安，就铸了两个金牛犊，一个安在伯特利，一个安在但，又立不属利未支派的人作祭司，自定八月十五日为节期。

  《列王纪上》第 13 章记载，有一个神人从犹大来到伯特利，向坛宣告日后大卫家要生一个名叫约西亚的儿子，废掉这坛；耶罗波安伸手叫人拿住他，手就枯干，经神人祈求才复原。第 14 章记载，他的儿子亚比雅病了，他叫妻子改装去示罗问亚希雅；亚希雅说这孩子必死，耶罗波安的家也要被除灭。14:17 提到他的妻子回到得撒，可知那时王家已住在得撒。

  他与罗波安时常争战（14:30）。《历代志下》第 13 章另记他与犹大王亚比雅在洗玛脸山交战失利，丢了伯特利等城。他作王二十二年（《列王纪上》14:20），卒地圣经没有记载，儿子拿答接续作王。拿答在位第二年被巴沙所杀，巴沙杀尽了耶罗波安全家（15:25–30）。此后《列王纪》评述北国诸王，常说他们行耶罗波安所行的道。
sources: []
recalled:
  - 《列王纪上》第 11—15 章
  - 《历代志下》第 10—13 章
