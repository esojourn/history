name: 韦瑟尔的约翰
aliases:
  - 约翰·鲁赫拉特
  - 上韦瑟尔的约翰
role: 爱尔福特大学教师、讲道者
summary: 爱尔福特大学神学教师，反对赎罪券，受审后死于美因茨狱中。
body: |-
  约翰姓鲁赫拉特，约在 1400 至 1420 年间生于莱茵河畔的上韦瑟尔。他在爱尔福特大学读书，后来成为那里的神学教师，作过一任校长。《历史的轨迹》第二十章说他从 1445 到 1456 年执教于爱尔福特大学，四十九年以后马丁·路德在这所大学得到硕士学位。

  约在 1450 年禧年前后，他写了一篇反对赎罪券的文章，说教皇没有权柄免除神所定的刑罚，圣经是信仰的准则。离开爱尔福特后，他在巴塞尔教过书，1463 年起在沃尔姆斯的主教座堂讲道，因为言论激烈，1477 年被免职。

  1479 年他在美因茨大主教面前受宗教裁判所审讯，这时他已年老多病，被迫撤回自己的主张，著作被烧，本人被判终身关在美因茨的修道院里，1481 年死在那里。

  《历史的轨迹》把他的这些经历与另一位学者韦塞尔·甘斯福特合在“韦索的约翰”一个人身上，所记的卒年 1489 年 10 月是甘斯福特的。该书所引“一个人若以为自己可以靠善行得救，他就根本不明白什么叫得救”等话，究竟出自两人中的哪一位，这里没有查到。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十章“教会内部的困扰” https://wellsofgrace.com/books/spiritual/2000years/html/chapter22.html"
recalled:
  - 韦瑟尔的约翰《驳赎罪券》
  - 1479 年美因茨审讯记录
