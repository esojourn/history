name: "方济各·沙勿略"
aliases: ["沙勿略", "圣方济各·沙勿略", "方济沙勿略"]
role: "耶稣会传教士"
summary: "耶稣会最初的成员，在印度、马六甲、日本传教，1552 年死于广东外海的上川岛。"
body: |-
  沙勿略 1506 年 4 月 7 日生于纳瓦拉王国的沙勿略城堡，出身贵族。他幼年时纳瓦拉被卡斯蒂利亚吞并，家道中落。1525 年他到巴黎大学读书，得了硕士学位，在学院里教亚里士多德哲学，打算在教会里谋个好职位。

  他在圣巴尔贝学院与法伯尔同住，1529 年罗耀拉搬了进来。《历史的轨迹》第三十章说，罗耀拉在巴黎大学认识了沙勿略，两人在 1534 年组织了耶稣会。相传他起初看不起这个年纪大、靠乞讨读书的同乡，过了几年才被说服。1534 年 8 月 15 日他是在蒙马特一同发愿的七人之一，1537 年在威尼斯受立为司铎。

  1540 年葡萄牙国王向教皇要人去东方，原定的人病了，罗耀拉临时派他顶替。1541 年 4 月他从里斯本上船，次年 5 月到果阿。此后他在印度南端的采珠渔民中间住了两年多，靠人翻译教他们念经文、给他们施洗，又到马六甲和香料群岛。他在信里催促欧洲的学生放下书本到东方来。

  在马六甲他遇到一个逃亡的日本人弥次郎。1549 年 8 月他由弥次郎带路到了鹿儿岛，在日本住了两年多，到过平户、山口和京都，离开时留下约两千名信徒。他发现日本人敬重中国的学问，认为要使日本归信得先到中国去。

  那时明朝不准外国人入境。1552 年 8 月他到了葡萄牙商人停船的上川岛，等人偷渡他进广州，船没有来。11 月他发了热病，12 月 3 日清晨死在岛上的草棚里。遗体后来运回果阿。三十年后，耶稣会士利玛窦等人才进入中国内地。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第三十章“复原派教会为生存奋斗” https://wellsofgrace.com/books/spiritual/2000years/html/chapter33.html"
recalled:
  - "沙勿略《书信集》"
  - "罗耀拉口述《自传》"
  - "弗洛伊斯《日本史》"
