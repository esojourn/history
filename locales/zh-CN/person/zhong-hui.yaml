name: 钟会
aliases: [钟士季]
role: 镇西将军、司徒
summary: 曹魏将领、谋臣，伐蜀的主帅，蜀亡后图谋据蜀自立，被部下所杀。
body: |-
  据《三国志·魏书·钟会传》，钟会字士季，颍川长社人，是太傅钟繇的幼子，自幼以聪慧知名，精通名理之学。他在朝中任秘书郎、中书侍郎。司马师讨伐毌丘俭、司马昭围攻诸葛诞时，他都随军出谋划策，当时人把他比作张良。本传还说，名士嵇康被杀，也是出于他的进言。

  景元三年（公元 262 年），司马昭打算伐蜀，朝臣多不赞成，只有钟会支持，于是被任为镇西将军。次年他率十多万人从斜谷、骆谷进入汉中，但被姜维阻挡在剑阁之外。邓艾从阴平绕道攻下成都后，姜维奉刘禅的命令向钟会投降。

  钟会随即上书告邓艾谋反，把他逮捕，自己独掌在蜀的全部军队。他与姜维商议，打算占据蜀地起兵。景元五年（264 年）正月，他把魏军各将领扣押在成都的官署里，准备加以处置。消息传到城外，各营士兵冲入城中，钟会与姜维都被乱兵杀死，钟会时年四十。
sources: []
recalled:
  - 《三国志·魏书·王毌丘诸葛邓钟传》
