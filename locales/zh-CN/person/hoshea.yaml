name: 何细亚
aliases:
  - 以拉的儿子何细亚
role: 北国以色列末代王
summary: 杀比加篡位，先向亚述纳贡，后转投埃及而被囚，北国随之灭亡。
body: |-
  以拉的儿子，生年圣经没有记载。据《列王纪下》15:30，他背叛利玛利的儿子比加，杀了比加，篡了王位。亚述王提革拉毗列色三世的铭文则说，以色列人推翻了他们的王比加，是他立何细亚作王的。

  据《列王纪下》17:1–2，何细亚在犹大王亚哈斯十二年登基，在撒玛利亚作王九年；他行耶和华眼中看为恶的事，只是不像在他以前的以色列诸王。亚述王撒缦以色上来攻击他，他就服事亚述王，向他进贡（17:3）。后来他差人去见埃及王梭，不再照往年向亚述进贡；亚述王知道了，就把他锁禁，囚在监里（17:4）。

  亚述王随后上来围困撒玛利亚三年，在何细亚第九年攻取该城，把以色列人掳到亚述（17:5–6；18:9–12）。何细亚被囚以后的下落和卒年，圣经没有记载。
sources: []
recalled:
  - 《列王纪下》15:30、17:1–6、18:9–12
  - 亚述王提革拉毗列色三世铭文
