name: 玛土撒拉
aliases: []
role: 以诺之子
summary: 以诺的儿子、挪亚的祖父，是圣经所记寿数最长的人。
body: |-
  玛土撒拉是以诺的儿子，属塞特一支。据《创世记》5:21，以诺六十五岁生了玛土撒拉。又据 5:25–27，玛土撒拉一百八十七岁生拉麦，此后又活了七百八十二年，并且生儿养女，共活了九百六十九岁。这是圣经里记载的最长的寿数。他的儿子拉麦生了挪亚（5:28–29），所以他是挪亚的祖父；这个拉麦与该隐后代中的拉麦（4:18–24）不是同一个人。

  圣经所载仅此：除了家谱里的这几节，没有记下他的任何言行，也没有说他住在哪里。《历代志上》第 1 章开头和《路加福音》第 3 章的家谱（3:37）里列有他的名字。

  《创世记》第 5 章的数字在几种古代文本里并不一致，希伯来文马所拉文本、撒马利亚五经和希腊文七十士译本所记玛土撒拉生子时的岁数互有出入；这里依照和合本所据的马所拉文本。
sources: []
recalled:
  - 《创世记》5:21–29
  - 《历代志上》第 1 章
  - 《路加福音》3:37
