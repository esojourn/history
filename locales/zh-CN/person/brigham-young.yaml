name: "杨百翰"
aliases: ["布里格姆·杨"]
role: "摩门教第二任领袖，盐湖城的建立者"
summary: "斯密死后领导摩门教，率众西迁大盐湖，建立盐湖城。"
body: |-
  《历史的轨迹》第四十五章说，杨百翰加入摩门教运动后，很快成为“十二使徒”之一；约瑟·斯密被杀两年后，摩门教徒在他的领导下集体迁往大盐湖。书中说，这个教会影响信徒生活的每一个层面，为贫困者和病人提供救济，为信徒提供教育、娱乐和职业，年轻的信徒两个两个地出去，用一年或更长的时间义务为教会工作；他们把《摩门经》看作与圣经同等，有“为死人施洗”和“属天婚姻”两项特别的教义。

  据一般记载，杨百翰 1801 年生于佛蒙特惠廷厄姆，做过木匠和油漆工，1832 年受洗加入摩门教，1835 年成为十二使徒之一。1844 年斯密死后，他以十二使徒会会长的身份接掌大部分信徒，1846 年率众离开纳府西行，1847 年 7 月先遣队到达大盐湖谷，建立盐湖城。他任犹他领地首任总督，多妻制和与联邦政府的冲突是他任内的主要问题。他 1877 年在盐湖城去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
