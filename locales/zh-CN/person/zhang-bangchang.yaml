name: 张邦昌
aliases: [伪楚皇帝]
role: 北宋宰相，被金朝立为“楚帝”
summary: 北宋末年宰相，靖康之变后被金朝立为“大楚”皇帝，三十多天后退位，不久被南宋赐死。
body: |-
  张邦昌是永静军东光人，考中进士后在宋徽宗朝逐步升迁。靖康元年（1126 年）正月金军第一次包围开封，他以少宰的身份随康王赵构到金营做人质，后来升任太宰，因主张议和，被主战的人指为奸臣。

  靖康二年（1127 年）二月金朝废黜徽宗、钦宗，三月立张邦昌为皇帝，国号大楚。据宋人记载，他起初坚决不肯，金朝以屠城相威胁，他才勉强接受，在位期间不称“朕”，不在正殿处理政事。四月金军北撤后，他请元祐皇后孟氏垂帘听政，派人迎接赵构，自己退位，前后只有三十多天。赵构即位后，起初封他为太保，同年九月以他曾经僭位为由，在潭州将他赐死。
sources: []
recalled:
  - 《宋史·叛臣传·张邦昌》
  - 《三朝北盟会编》
