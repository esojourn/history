name: "菲兰德·蔡斯"
aliases: ["蔡斯主教", "查斯主教"]
role: "圣公会主教，西部开拓区的宣教者"
summary: "战后圣公会少数积极的领袖，在西部建立教区，创办凯尼恩学院。"
body: |-
  《历史的轨迹》第四十五章说，受独立战争影响，圣公宗教会战后几乎有一代人之久非常没落，也不太会应付西进运动带来的问题；到 1850 年只有九万信徒，还分成七派，其中只有少数几位领袖不消极，最有名的是蔡斯主教。书中说，他的第一个教区在纽约边界，后来在新奥尔良成立第一间圣公宗教会，又到俄亥俄工作，使圣公宗新开了一个教区，创办了凯尼恩学院，然后又在密歇根和伊利诺伊宣教。

  书中还说，这段时期圣公宗的高派与低派越离越远：低派注重传福音和简单的崇拜仪式，高派因英国牛津运动而坚强起来，低派担心圣公宗回到罗马天主教；1853 年的大会给低派更多发言自由，才防止了分裂，但此后低派也失去了影响力。

  据一般记载，蔡斯 1775 年生于新罕布什尔科尼什，原是公理会家庭，在达特茅斯读书时转入圣公会。1819 年他任俄亥俄主教，到英国募款，1824 年创办凯尼恩学院；1835 年任伊利诺伊主教，在皮奥里亚县创办朱比利学院，1843 年起任美国圣公会首席主教。他 1852 年在伊利诺伊去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第四十五章“教会处于混乱时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter50.html"
