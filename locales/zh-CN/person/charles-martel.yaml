name: 查理·马特
aliases:
  - 铁锤查理
  - 查理马特尔
role: 法兰克王国宫相
summary: 法兰克王国的宫相，732 年在图尔与普瓦捷之间击退阿拉伯军队，丕平之父。
body: |-
  查理约生于公元 688 年，是法兰克王国东部宫相赫斯塔尔的丕平的儿子，母亲不是正妻。714 年父亲去世，他被继母囚禁，逃出后在 716 至 718 年间接连打败对手，成为整个法兰克王国的宫相。当时墨洛温家族的国王只有名义，实权在宫相手里。《历史的轨迹》第八章称他为“法兰克王查理”，第九章又说明他虽然不是法兰克王，却是真正掌握王权的人；后一种说法合乎史实。

  阿拉伯人在 711 年以后征服了西班牙，随后越过比利牛斯山进入高卢。732 年（一说 733 年）10 月，安达卢斯总督阿卜杜勒·拉赫曼率军北上，查理在图尔与普瓦捷之间迎战。《历史的轨迹》说两军对峙七天，法兰克步兵列队成墙，阿拉伯骑兵整日冲击不能攻破，次日清晨法兰克人发现对方已经弃营退走；又说莱茵河以东的弗里斯兰人也响应了他的召集。同时代的西班牙编年史也记载法兰克人像墙一样站立不动，阿拉伯统帅阵亡。双方兵力没有可靠的数字。

  “马特”意为“铁锤”，这个称号见于九世纪以后的记载。这一仗后来被看作阻止伊斯兰势力进入西欧的关键；今天的史家对它的规模和意义看法不一，有人认为那只是一次大规模的劫掠。此后查理又在普罗旺斯等地与阿拉伯人作战。

  他还征讨弗里斯兰人、萨克森人和巴伐利亚人，保护波尼法修在日耳曼地区传教，同时为了养兵而占用了不少教会的地产。737 年国王死后他不再立王。739 年教皇贵格利三世请他出兵对付伦巴第人，他没有答应。741 年 10 月他在基耶尔济去世，葬在圣但尼，生前把国土分给两个儿子卡洛曼和丕平。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第八章“教会丧失领域” https://wellsofgrace.com/books/spiritual/2000years/html/chapter10.html"
  - "祁伯尔《历史的轨迹——二千年教会史》第九章“教会组成联盟” https://wellsofgrace.com/books/spiritual/2000years/html/chapter11.html"
