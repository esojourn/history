name: 王守仁
aliases: [王阳明, 阳明先生, 文成]
role: 思想家、军事家，心学的集大成者
summary: 明代哲学家，提出“知行合一”“致良知”，又平定宁王之乱。
body: |-
  王守仁是浙江余姚人，曾在家乡附近的阳明洞筑室读书，自号阳明子，学者称为阳明先生。他的父亲王华是成化年间的状元。据他的《年谱》记载，他少年时就立志做圣贤，曾按照朱熹“格物致知”的说法对着竹子“格”了七天，结果病倒，开始怀疑这条路。弘治十二年（1499 年）他考中进士，在工部、刑部、兵部任职。

  正德元年（1506 年）宦官刘瑾逮捕上疏言事的官员，王守仁上疏营救，被廷杖四十，贬为贵州龙场驿驿丞。龙场地处偏远，生活艰苦，他在困境中反复思索，一天夜里忽然领悟“圣人之道，吾性自足，向之求理于事物者误也”，史称“龙场悟道”（另见“龙场悟道”条）。此后他提出“心即理”“知行合一”，晚年又以“致良知”概括自己的学说。他的弟子把他的语录和书信编为《传习录》。

  刘瑾被诛后他重新起用，正德十一年（1516 年）以都察院左佥都御史巡抚南赣，平定了江西、福建、广东交界山区的民变。正德十四年（1519 年）宁王朱宸濠在南昌起兵，王守仁在吉安调集兵力，趁宁王率军东下进攻安庆时攻占南昌，又在鄱阳湖击败回救的宁王军，前后只用了三十多天就俘虏了宁王（另见“宁王之乱”条）。但他因此遭到正德帝身边宠臣的嫉妒和诬陷，功劳一度被埋没。

  嘉靖初年他回乡讲学，门人很多。嘉靖六年（1527 年）他奉命总督两广军务，平定广西思恩、田州的土官叛乱，又平定断藤峡、八寨等地的民变。次年他病重，在回乡途中于江西南安府大庾县青龙铺的船上去世，时间是嘉靖七年十一月，公历已是 1529 年 1 月。临终时弟子问他有什么遗言，他说“此心光明，亦复何言”。隆庆初年追谥“文成”，万历年间从祀孔庙。阳明学在明代后期影响很大，后来也传到日本、朝鲜。
sources: []
recalled:
  - 《王文成公全书》所收钱德洪等编《年谱》
  - 《传习录》
  - 《明史·王守仁传》
