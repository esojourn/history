name: 亚伯拉德
aliases:
  - 彼得·阿伯拉尔
  - 阿贝拉尔
role: 巴黎的教师、神学家
summary: 十二世纪巴黎最有名的教师，用辩证法讨论神学，著《是与否》，两次被教会会议谴责。
body: |-
  亚伯拉德 1079 年生于布列塔尼南特附近的勒帕莱，是骑士的长子。他放弃继承权去求学，先后跟过几位名师，又都与他们辩论而分手，随后在巴黎一带自己开讲，学生很多。

  约在 1115 年以后，他在巴黎圣母院的学校任教，住在教士富尔贝尔家里，教他的侄女爱洛伊丝读书，两人相爱，生了一个儿子，秘密结了婚。富尔贝尔认为受了欺骗，派人夜里闯进他的住处把他阉割了。此后他在圣但尼修道院作修士，爱洛伊丝进了女修道院。这些事他自己写在《劫余录》里，两人后来的通信也流传下来。

  他主张用辩证法也就是逻辑来讨论信仰的内容。《是与否》一书列出一百五十多个问题，每个问题下面并排抄录教父们彼此不同的说法，不下结论；序言里说，怀疑引人探究，探究使人得到真理。他讲基督的死，着重它显明神的爱、唤起人心里的爱。在伦理上他看重行为背后的意图。

  1121 年苏瓦松的会议谴责他论三位一体的书，要他亲手投进火里。晚年他回巴黎讲学，克莱尔沃的伯尔纳认为他把信仰当成可以争辩的意见，1141 年在桑斯的会议上列举他的论点，使之受到谴责，教皇随后确认。他动身去罗马申诉，路过克吕尼，院长可敬者彼得收留了他，并使他与伯尔纳和解。1142 年 4 月他在克吕尼所属的圣马塞尔隐修院去世。

  《历史的轨迹》第十八章把他与安瑟伦、彼得·伦巴德、多马·阿奎那等人同列为经院哲学的教师。《是与否》那种并列权威、提出疑难的办法，后来成为大学里讲授神学的通行方法。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第十八章“教会权势顶峰时期” https://wellsofgrace.com/books/spiritual/2000years/html/chapter20.html"
recalled:
  - 亚伯拉德《劫余录》《是与否》《认识你自己》
  - 亚伯拉德与爱洛伊丝的书信
  - 伯尔纳《书信集》第 190 封
  - 可敬者彼得致爱洛伊丝的信
