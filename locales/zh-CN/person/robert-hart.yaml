name: 赫德
aliases: [罗伯特·赫德]
role: 清朝海关总税务司
summary: 英国人，任清朝海关总税务司近半个世纪，建立了近代海关制度。
body: |-
  赫德出生于爱尔兰北部的波塔当，在贝尔法斯特女王学院毕业后，1854 年被英国外交部派到中国，先在宁波、广州的英国领事馆任翻译。1859 年他辞去领事馆的职务，进入广州的海关任职。当时清朝的海关在太平天国战争和第二次鸦片战争的影响下，已经由外国人参与管理。

  同治二年（1863 年）赫德被任命为海关总税务司，此后他担任这一职务长达四十多年。他把海关建成一个以外籍人员为高层、管理严格的机构，统一了各口岸的征税制度，海关税收成为清朝财政的重要来源，也是许多外债的担保。他还主持了海关附属的灯塔、气象、港务等事业，光绪二十二年（1896 年）创办了大清邮政。他通过总理衙门对清朝的外交事务有很大的影响，在中法战争的议和中起了作用，奕訢、李鸿章等人都很倚重他。

  赫德的身份是清朝的官员，他在一些问题上维护清朝的利益，但也代表英国的利益。光绪三十四年（1908 年）他回到英国，宣统三年（1911 年）在英国去世，仍保留着总税务司的名义。他留下的大量日记和书信，是研究晚清历史的重要资料。
sources: []
recalled:
  - 赫德《赫德日记》
  - 魏尔特《赫德与中国海关》
  - 《中国海关与中英关系》
