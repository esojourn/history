name: 尉迟恭
aliases: [尉迟敬德, 鄂国公]
role: 大将
summary: 唐初猛将，原为刘武周部将，降唐后屡救李世民，在玄武门之变中射杀李元吉。
body: |-
  尉迟恭字敬德，朔州善阳人。隋末他投奔据守马邑的刘武周，任偏将，与宋金刚一同南下攻唐。武德三年（公元 620 年）刘武周、宋金刚败亡，他在介休率部投降李世民。

  次年李世民围攻洛阳，据《旧唐书》本传，一次李世民率少数骑兵出巡，被王世充的部将单雄信追击，尉迟恭跃马赶到，把单雄信刺落马下，护送李世民突围。此后他在虎牢之战等战役中屡立战功。太子李建成曾送他一车金银器，想拉拢他，他拒绝了；齐王李元吉又派刺客去刺杀他，也没有成功。

  武德九年（626 年）玄武门之变时，他射杀了齐王李元吉，随后披甲持矛进宫，向高祖报告事变。太宗即位后，他与长孙无忌并列为功劳第一，封鄂国公，名列凌烟阁二十四功臣。他性情刚直，常在朝中与人争执，太宗曾告诫他功臣不应自恃。晚年他闭门不出，不与外人往来。显庆三年（658 年）去世，年七十四。明清以后，民间把他和秦琼画在门上作为门神。
sources: []
recalled:
  - 《旧唐书·尉迟敬德传》
  - 《新唐书·尉迟敬德传》
