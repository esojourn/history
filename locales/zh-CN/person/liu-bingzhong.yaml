name: 刘秉忠
aliases: [刘仲晦, 子聪, 藏春散人]
role: 元初谋臣
summary: 忽必烈的谋臣，出身僧人，主持规划上都和大都，建议定国号为“大元”。
body: |-
  刘秉忠原名刘侃，字仲晦，邢州（今河北邢台）人，生于金贞祐四年（公元 1216 年）。他早年做过小吏，后来出家为僧，法名子聪，又学习天文、地理、律历、术数，学问广博，尤其精通《易经》和邵雍的《皇极经世书》。1242 年他随禅宗高僧海云到漠北，见到忽必烈，被留在身边，成为金莲川幕府的核心人物。

  刘秉忠多次向忽必烈建言，主张采用中原的制度治理汉地，选用贤能、减轻赋役。1256 年他奉命在桓州以东、滦水以北选址修建开平城，即后来的上都。忽必烈即位后，中统、至元年间的朝仪、官制、年号很多出自他的设计。至元元年（1264 年）他奉诏还俗，赐名秉忠，拜太保，参领中书省事。至元四年（1267 年）起他主持规划修建大都，大都的城市布局、宫殿位置都出自他的规划。至元八年（1271 年）他建议取《易经》“大哉乾元”之意，定国号为“大元”。

  刘秉忠举荐了张文谦、郭守敬等许多人才，郭守敬曾在邢台西南的紫金山跟随他学习。至元十一年（1274 年）他在上都南屏山的住所去世，年五十九岁。他还俗以后仍然斋居素食，生活简朴。他的诗文后人编为《藏春集》。
sources: []
recalled:
  - 《元史·刘秉忠传》
  - 王磐《刘秉忠神道碑》
