name: 但以理
aliases:
  - 伯提沙撒
role: 先知、巴比伦宫廷大臣
summary: 被带到巴比伦的犹大少年，历事巴比伦和玛代、波斯诸王。
body: |-
  据《但以理书》1:1–7，犹大王约雅敬在位第三年，巴比伦王尼布甲尼撒来围困耶路撒冷，吩咐从以色列人的宗室和贵胄中选一些少年带到巴比伦，学习迦勒底的文字言语。但以理是其中之一，属犹大族，太监长给他起名叫伯提沙撒；同伴有哈拿尼雅、米沙利、亚撒利雅。他立志不以王的膳和王所饮的酒玷污自己，只吃素菜、喝白水。他的父母和生年圣经没有记载。

  尼布甲尼撒第二年作了梦，哲士都说不出来。但以理讲出梦中的大像：金头、银的胸膛和膀臂、铜的肚腹和腰、铁腿、半铁半泥的脚，被一块非人手凿出来的石头砸碎；他解释为相继兴起的几个国。王立他管理巴比伦全省（第 2 章）。第 4 章记他为王讲解大树被砍伐的梦。伯沙撒王设宴时，有指头在墙上写字，但以理读出并讲解；当夜伯沙撒被杀，玛代人大利乌取了迦勒底国（第 5 章）。大利乌年间，他是三位总长之一，因在禁令之下仍一日三次向耶路撒冷祷告，被扔在狮子坑中，次日安然无恙（第 6 章）。

  第 7—12 章是他所见的异象：四个大兽、公绵羊与公山羊、七十个七，以及南方王与北方王的争战。据 9:2，他从书上得知耶和华藉先知耶利米所说耶路撒冷荒凉七十年的话。1:21 说他到古列王元年还在；书中最晚的日期是波斯王古列第三年（10:1）。他的去世圣经没有记载。

  关于成书年代，传统看法认为出于公元前六世纪的但以理本人；学界多数意见认为今本成于公元前二世纪安条克四世逼迫犹太人的时期。书中的伯沙撒，巴比伦文献显示是末代王拿波尼度的儿子，曾在父亲离开都城期间代理国政；玛代人大利乌在圣经以外的史料中还没有找到可以确指的人。希伯来圣经把这卷书列在圣卷部分，基督教圣经把它列在先知书中。
sources: []
recalled:
  - 《但以理书》第 1—12 章
  - 《以西结书》14:14、28:3（提到但以理之名）
