name: 大贵格利
aliases:
  - 贵格利一世
  - 额我略一世
  - 格列高利一世
role: 罗马主教（教皇）
summary: 第一位修士出身的教皇，在伦巴第人威胁下治理罗马，派宣教团到英格兰。
body: |-
  贵格利约在公元 540 年生于罗马一个富有的元老家族，祖上出过罗马主教。那时意大利先经东罗马与东哥特人二十年的战争，568 年起又有伦巴第人南下，罗马城人口锐减。他约在 573 年任罗马城的行政长官。父亲死后，他把家产捐出，在西西里的田庄上建了六所修道院，又把罗马凯里乌斯山上的自家宅子改成圣安德烈修道院，自己在里面作修士。

  罗马主教把他召出来立为执事，579 年前后派他作驻君士坦丁堡宫廷的代表，他在那里住了约六年。回罗马后他作了圣安德烈修道院的院长。公元 590 年罗马大疫，主教病死，他被推举继任。《历史的轨迹》第七章说他是第一位由修道士成为教皇的人，在位十四年。

  当时意大利名义上属于东罗马皇帝，皇帝派驻拉文纳的总督却无力顾及罗马。他自己出钱发军饷，派人守城，592 年和 593 年两次与伦巴第人议和。罗马教会在意大利、西西里等地有大片田产，他亲自过问经营，用收成供应罗马城的粮食，赈济穷人，赎回俘虏。《历史的轨迹》说，他行使了衰落的帝国所放下的权力，是第一个握有政治实权的教皇。

  公元 596 年，他派圣安德烈修道院的院长带着约四十名修士去英格兰传道。比德记载了一个传说：他还没有作主教时，在罗马市场上看见几个金发的少年奴隶，听说他们是盎格鲁人，就说他们不是盎格鲁，倒像天使。《历史的轨迹》把这件事放在他作教皇以后。

  他自称“神的众仆之仆”，后来的教皇沿用了这个称呼；他反对君士坦丁堡主教用“普世主教长”的头衔。他写了讲主教职责的《牧范》、讲解《约伯记》的《伦理丛谈》，以及记述意大利圣徒事迹的《对话录》，其中有本笃的生平。他讲炼狱、为死者献弥撒、圣徒代求，这些后来成为中世纪教会的通行教导。以他命名的“贵格利圣咏”是否由他编定，现代学者多有怀疑。他在 604 年 3 月 12 日去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第七章“教会历劫而存，继续增长” https://wellsofgrace.com/books/spiritual/2000years/html/chapter08.html"
recalled:
  - 大贵格利《书信集》卷 1 第 5 封、卷 5 第 37、44 封
  - 大贵格利《牧范》《对话录》卷 2、卷 4
  - 比德《英吉利教会史》卷 1 第 23—33 章、卷 2 第 1 章
  - 图尔的格列高利《法兰克人史》卷 10 第 1 章
