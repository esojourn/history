name: "亨利八世"
aliases: ["亨利第八"]
role: "英格兰国王"
summary: "英格兰国王，因离婚案与教皇决裂，1534 年自立为英格兰教会的元首，解散修道院。"
body: |-
  亨利 1491 年 6 月 28 日生于格林尼治，是都铎王朝亨利七世的次子，哥哥早死，1509 年即位，娶了寡嫂、西班牙公主阿拉贡的凯瑟琳。他受过很好的教育，懂神学。路德的《教会被掳于巴比伦》出版后，他写了《七圣礼辩》反驳，1521 年 10 月教皇利奥十世封他为“信仰的护卫者”。《历史的轨迹》第二十八章把这本书记在 1518 年，那时路德的书还没有写。

  凯瑟琳只养活了一个女儿玛丽。亨利想要儿子，又爱上了安妮·博林，从 1527 年起请求教皇宣布他的婚姻无效，理由是娶兄弟的妻子违背利未记。凯瑟琳是皇帝查理五世的姨母，教皇克莱门特七世正受皇帝挟制，一拖数年。1533 年初亨利秘密与安妮结婚，新任坎特伯雷大主教克兰麦宣判前一桩婚姻无效。9 月安妮生下女儿伊丽莎白。

  1534 年议会通过《至尊法案》，宣布国王是英格兰教会在地上唯一的最高元首；又立法规定否认这一点即是叛国。该书说，这只是国王取代了教皇的地位，教义和礼仪没有改变，不能算是改教。1535 年费舍尔主教和托马斯·莫尔因不肯宣誓被斩首。1536 至 1540 年，大臣克伦威尔主持解散全国的修道院，地产归了国王，大半转卖给乡绅。北方为此起事，被镇压下去。

  他准许英文圣经放进各教堂，却在 1539 年用《六条信纲法》重申化质说和教士独身，否认的人可处火刑。在他治下，不认国王为元首的天主教徒和否认弥撒的新教徒都有被处死的。该书说，直到他在位末年英格兰还不是新教国家。

  他前后娶过六个妻子，其中安妮·博林等两人被他处死。第三个妻子生了儿子爱德华。1547 年 1 月 28 日他在伦敦的白厅宫去世。
sources:
  - "祁伯尔《历史的轨迹——二千年教会史》第二十八章“英国教会的改革” https://wellsofgrace.com/books/spiritual/2000years/html/chapter31.html"
recalled:
  - "亨利八世《七圣礼辩》（1521 年）"
  - "1534 年《至尊法案》、1539 年《六条信纲法》"
