name: 阿那瓌
aliases: [郁久闾阿那瓌, 敕连头兵豆伐可汗]
role: 柔然可汗
summary: 柔然可汗，曾流亡北魏，后复兴柔然，与东西魏和亲，552 年被突厥击败自杀。
body: |-
  阿那瓌姓郁久闾，是柔然的可汗。北魏称柔然为“蠕蠕”。正光元年（公元 520 年），他继兄长为可汗才十天，族兄示发起兵攻打他，他战败后南逃投奔北魏。北魏在洛阳隆重接待了他，封他为朔方郡公、蠕蠕王。次年，北魏派兵护送他回到北边。

  正光四年（523 年），柔然遭遇饥荒，他率众入塞抢掠，北魏派李崇追击未及。同年北边的六镇爆发起事，史家常把这次南侵看作六镇之乱的诱因之一。后来北魏无力镇压六镇，他曾应北魏之请出兵，协助击败破六韩拔陵。此后柔然逐渐复兴，他自号敕连头兵豆伐可汗。

  北魏分裂后，东西魏都想拉拢柔然，争相与他和亲。西魏文帝废了皇后乙弗氏，改娶他的长女为皇后；东魏的高欢晚年也娶了他的女儿，称为蠕蠕公主。

  此时原本臣属柔然、为柔然锻铁的突厥逐渐强大。据《周书·突厥传》，突厥首领土门向他求婚，他大怒，骂土门是“我锻奴”，土门转而与西魏通婚。552 年，土门起兵大败柔然，阿那瓌自杀，柔然随后衰亡（另见“突厥灭柔然”条）。他的生年史书没有记载。
sources: []
recalled:
  - 《魏书·蠕蠕传》
  - 《北史·蠕蠕传》
  - 《周书·突厥传》
